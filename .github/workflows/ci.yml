name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows-2025,     rid: win-x64 }
          - { os: macos-15,         rid: osx-arm64 }
          - { os: macos-15-intel,   rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/python-dev-requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/content-packages/node/*/package-lock.json
      # GoMLX exercises need Go >= 1.26.5; Spring Boot exercises need a JDK 17+.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # The PHP course is written for and checked on PHP 8.5 (it uses mb_trim and array_find, 8.4+); the runner images carry no PHP on macOS and
      # an older one on Ubuntu (8.3, whose messages and missing mb_trim fail the lessons). Windows is left as it was.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: runner.os != 'Windows'
        with:
          php-version: "8.5"
          coverage: none
          extensions: mbstring
      - run: dotnet restore DevAcademy.slnx
      - run: dotnet build DevAcademy.slnx -c Release --no-restore
      - run: dotnet format whitespace DevAcademy.slnx --verify-no-changes
      - name: Third-party notices are up to date
        if: matrix.rid == 'linux-x64'
        run: python3 tools/generate-third-party-notices.py --check
      # Every test project runs even when an earlier one fails (so a platform problem shows all its failures at once); the step fails at the end.
      # Real toolchains present on the runner image; missing ones are skipped by the tests themselves.
      - name: Unit, integration, headless UI and code execution engine tests
        shell: bash
        run: |
          failed=""
          for p in tests/*/*.csproj; do
            dotnet test "$p" -c Release --no-build || failed="$failed $(basename "$p" .csproj)"
          done
          if [ -n "$failed" ]; then echo "::error::Failed test projects:$failed"; exit 1; fi
      # Course content may declare `requires: { packages }`; they live in a throwaway venv, never in the runner's global Python.
      - name: Python content environment (Linux/macOS)
        if: runner.os != 'Windows'
        run: make python-env
      - name: Python content environment (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m venv .venv-content
          .venv-content/Scripts/python.exe -m pip install --disable-pip-version-check -r tools/python-dev-requirements.txt
      # React/TypeScript/Express exercises: every package set in a throwaway directory (install scripts disabled), never global.
      - name: Node content environment
        shell: bash
        run: |
          for d in tools/content-packages/node/*/; do
            id=$(basename "$d")
            mkdir -p ".node-content/$id"
            cp "$d/package.json" "$d/package-lock.json" ".node-content/$id/"
            (cd ".node-content/$id" && npm ci --ignore-scripts --no-audit --no-fund)
          done
      # Go/NuGet/Maven course package sets, each in its own throwaway directory below the repo (gitignored), never global.
      - name: Go content environment
        shell: bash
        run: |
          for d in tools/content-packages/go/*/; do
            id=$(basename "$d")
            mkdir -p ".go-content/$id"
            cp "$d/go.mod" "$d/go.sum" ".go-content/$id/"
            (cd ".go-content/$id" && here=$(cygpath -m "$PWD" 2>/dev/null || pwd) && GOMODCACHE="$here/pkg/mod" GOPATH="$here/gopath" GOFLAGS=-mod=mod GOPROXY=https://proxy.golang.org GOTOOLCHAIN=local go mod download) || exit 1
          done
      - name: NuGet content environment
        shell: bash
        run: |
          for d in tools/content-packages/nuget/*/; do
            id=$(basename "$d")
            mkdir -p ".nuget-content/$id"
            cp "$d/restore.csproj" ".nuget-content/$id/"
            (cd ".nuget-content/$id" && here=$(cygpath -m "$PWD" 2>/dev/null || pwd) && DOTNET_CLI_HOME="$here/cli" NUGET_HTTP_CACHE_PATH="$here/http-cache" \
              dotnet restore restore.csproj --packages "$here/packages" --source https://api.nuget.org/v3/index.json) || exit 1
          done
      - name: Maven content environment (jars verified against the committed sha256 locks)
        run: dotnet run --project src/DevAcademy.Cli -c Release --no-build -- maven-env --maven-env .maven-content
      - name: Check Python environment against content
        run: dotnet run --project src/DevAcademy.Cli -c Release --no-build -- python-env-check --python-env .venv-content --content content
      - name: Validate content (runs reference solutions where toolchains exist)
        run: dotnet run --project src/DevAcademy.Cli -c Release --no-build -- validate-content --content content --run-solutions --python-env .venv-content --node-env .node-content --go-env .go-content --nuget-env .nuget-content --maven-env .maven-content

  publish:
    needs: test
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, rid: linux-x64 }
          - { os: ubuntu-24.04, rid: linux-arm64 }
          - { os: windows-2025, rid: win-x64 }
          - { os: windows-2025, rid: win-arm64 }
          - { os: macos-15,     rid: osx-arm64 }
          - { os: macos-15,     rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained build (same script the release workflow uses)
        shell: bash
        run: packaging/publish.sh ${{ matrix.rid }} artifacts/${{ matrix.rid }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devacademy-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
