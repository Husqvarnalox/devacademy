<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
  <title>DevAcademy installer background</title>
  <!-- Finder draws the icons on top: app centred at (165,135), Applications at (495,135), 128 px (see dmg-settings.py). -->
  <rect width="660" height="400" fill="#F7F8FB"/>
  <rect width="660" height="6" fill="#243B6B"/>
  <rect y="6" width="660" height="2" fill="#F2B33D"/>
  <path d="M268 135 H382" fill="none" stroke="#243B6B" stroke-width="10" stroke-linecap="round"/>
  <path d="M368 109 L400 135 L368 161" fill="none" stroke="#243B6B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="262" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#243B6B">Drag DevAcademy to Applications to install</text>
  <text x="330" y="284" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#6B7385">Then open it from Launchpad or the Applications folder</text>
