tracks:
  # ---------- Языки программирования ----------
  - id: python
    kind: language
    title: Python
    description: >-
      Основы Python 3: как CPython исполняет программу, имена и объекты, числа, условия, циклы,
      функции, строки, списки, словари и множества, исключения и файлы. Каждый урок объясняет,
      что происходит внутри интерпретатора, и проверяется запуском вашего кода.
    languageId: python
    status: available
    courses: [python-fundamentals, python-advanced, python-stdlib, python-numpy, python-pandas, python-concurrency, python-automation]
  - id: javascript
    kind: language
    title: JavaScript
    description: >-
      Язык JavaScript (ECMAScript) как таковой, независимо от среды запуска: типы и приведение типов,
      объекты и прототипы, замыкания, цикл событий, промисы и async/await, модули. Библиотеки и
      фреймворки (React, Vue, Angular) и серверная среда Node.js вынесены в отдельные треки.
      Сейчас в треке два курса: вводный из двух уроков (запуск кода и ввод-вывод, значения и равенство) и «JavaScript: основы языка»
      из восьми уроков (типы, замыкания, this, прототипы, массивы и итерация, ошибки, промисы и async/await, модули и тесты).
      Запланированы итераторы и генераторы в глубину, Proxy и Reflect, регулярные выражения, Intl и Temporal, браузерная среда.
    languageId: javascript
    status: available
    courses: [javascript-first-steps, javascript-fundamentals]
  - id: typescript
    kind: language
    title: TypeScript
    description: >-
      TypeScript как статически типизированная надстройка над JavaScript: структурная система типов,
      вывод типов, union и generic-типы, сужение типов, конфигурация tsconfig. Типы стираются при
      компиляции, поэтому трек отдельно объясняет границу между проверкой типов и поведением во время выполнения.
      Два курса: «TypeScript: первые шаги» (запуск кода, структурная типизация, сужение, unknown против any) и «TypeScript: система типов на практике»
      (вывод и аннотации, объединения и сужение, проверка данных на границах, interface и type, satisfies, обобщения, утилитарные и отображаемые типы,
      строгие настройки tsconfig, стирание типов и файлы объявлений). Упражнения проверяют и поведение, и сами типы: tsc --strict запускается над кодом ученика.
      Декораторы, продвинутая типовая арифметика, работа с фреймворками и сборка проектов пока не входят в трек.
    languageId: typescript
    status: available
    courses: [typescript-first-steps, typescript-fundamentals]
  - id: php
    kind: language
    title: PHP
    description: >-
      Современный PHP 8: модель запроса и жизненный цикл скрипта, типы и строгая типизация, массивы,
      классы, интерфейсы и трейты, пространства имён, Composer и автозагрузка. Фреймворки Laravel и Symfony
      изучаются в отдельных треках.
      В треке два курса: вводный «PHP: первые шаги» и углублённый «PHP: язык и экосистема».
    languageId: php
    status: available
    courses: [php-first-steps, php-fundamentals]
  - id: csharp
    kind: language
    title: C#
    description: >-
      Язык C# и платформа .NET: система типов, значимые и ссылочные типы, LINQ, обобщения, async/await,
      управление памятью и сборка мусора, обработка исключений. ASP.NET Core вынесен в отдельный трек фреймворков.
      В треке два курса: вводный «C#: первые шаги» и «C#: язык и платформа .NET» (система типов и память, классы, записи и структуры, интерфейсы, обобщения и коллекции, LINQ, исключения и ресурсы, делегаты и события, async/await); ASP.NET Core и работа с базами данных пока не входят.
    languageId: csharp
    status: available
    courses: [csharp-first-steps, csharp-fundamentals]
  - id: java
    kind: language
    title: Java
    description: >-
      Язык Java и JVM: компиляция в байткод и выполнение на виртуальной машине, классы и интерфейсы,
      обобщения, коллекции, потоки и модель памяти, исключения. Spring Boot вынесен в отдельный трек фреймворков.
      В треке два курса: вводный «Java: первые шаги» и «Java: язык и платформа JVM» (типы и память, классы, записи и перечисления, интерфейсы и sealed-типы, обобщения и коллекции, Stream API, исключения, потоки и виртуальные потоки, текст и ввод-вывод); Spring Boot пока не входит.
    languageId: java
    status: available
    courses: [java-first-steps, java-fundamentals]
  - id: kotlin
    kind: language
    title: Kotlin
    description: >-
      Язык Kotlin: null-безопасность, data-классы, функции высшего порядка и лямбды, расширения,
      корутины и структурная конкурентность, взаимодействие с Java-кодом на JVM.
      В треке два курса: вводный «Kotlin: первые шаги» и «Kotlin: язык и идиомы» (типы и null-безопасность, функции, sealed и when, коллекции, обобщения, ошибки, потоки, Java-интероп); Android и kotlinx.coroutines пока не входят.
    languageId: kotlin
    status: available
    courses: [kotlin-first-steps, kotlin-fundamentals]
  - id: go
    kind: language
    title: Go
    description: >-
      Язык Go: статическая типизация и компиляция в один бинарник, срезы и отображения, интерфейсы,
      обработка ошибок как значений, горутины и каналы, пакет context, тестирование средствами стандартной библиотеки.
      В треке два курса: вводный «Go: первые шаги» и «Go: язык и идиомы» (типы, ошибки, интерфейсы, срезы и карты, горутины и context, модули и тестирование); веб-серверы и обобщения пока не входят.
    languageId: go
    status: available
    courses: [go-first-steps, go-fundamentals]
  - id: cpp
    kind: language
    title: C++
    description: >-
      Современный C++: модель памяти и время жизни объектов, RAII и умные указатели, ссылки и семантика перемещения,
      шаблоны, контейнеры и алгоритмы стандартной библиотеки, сборка с CMake. Неопределённое поведение разбирается явно.
      В треке два курса: вводный «C++: первые шаги» и «C++: язык и стандартная библиотека» (модель компиляции, указатели и перемещение, умные указатели, классы, шаблоны и концепты, STL, обработка ошибок, неопределённое поведение и санитайзеры); CMake, корутины и многопоточность в деталях пока не входят.
    languageId: cpp
    status: available
    courses: [cpp-first-steps, cpp-fundamentals]
  - id: rust
    kind: language
    title: Rust
    description: >-
      Язык Rust: владение, заимствование и времена жизни как механизм безопасности памяти без сборщика мусора,
      типы Option и Result, трейты и обобщения, итераторы, потокобезопасность на уровне типов, управление зависимостями через Cargo.
      В треке два курса: вводный «Rust: первые шаги» и «Rust: владение, типы и надёжный код» (владение и заимствование в деталях, перечисления и ошибки, трейты, коллекции и итераторы, умные указатели, потоки и каналы); Cargo, внешние крейты, async и unsafe пока не входят.
    languageId: rust
    status: available
    courses: [rust-first-steps, rust-fundamentals]

  # ---------- Среда выполнения ----------
  - id: nodejs
    kind: framework
    title: Node.js
    description: >-
      Node.js — это среда выполнения (runtime) JavaScript вне браузера, а не язык и не веб-фреймворк: движок V8,
      цикл событий и libuv, модульная система CommonJS и ESM, потоки, файловая система, процессы, сетевые API и npm.
      Предполагает знание языка JavaScript; веб-фреймворки Express, Fastify и NestJS строятся поверх Node.js и вынесены отдельно.
      В треке два курса: вводный «Node.js: первые шаги» и углублённый «Node.js: платформа и встроенные модули» (цикл событий, модули, потоки, Buffer, файловая система, события, основы HTTP).
    languageId: javascript
    status: available
    courses: [nodejs-first-steps, nodejs-fundamentals]

  # ---------- Алгоритмы ----------
  - id: algorithms
    kind: algorithms
    title: Алгоритмы и структуры данных
    description: >-
      Оценка сложности (O-нотация), бинарный поиск, сортировка, два указателя и скользящее окно, префиксные суммы и хеш-таблицы, обход графа в ширину.
      Теория языконезависима, упражнения решаются на Python, JavaScript, Go, Java, C++ или Rust; большие скрытые тесты проверяют именно эффективность.
      Сейчас доступен один курс из шести уроков; запланированы связные списки, стеки и очереди, деревья и кучи, жадные алгоритмы, динамическое программирование и рекурсия с перебором.
    status: available
    courses: [algorithms-foundations]

  # ---------- Computer Science ----------
  - id: operating-systems
    kind: computer-science
    title: Операционные системы
    description: >-
      Процессы и системные вызовы, планирование процессора, потоки и гонки данных, взаимные блокировки, страничная
      адресация и TLB, виртуальная память и замещение страниц, файловые системы с inode и ссылками, каналы, сигналы
      и блокирующий ввод-вывод. Практика на симуляторах на Python (планировщик, менеджер памяти, файловая система
      в памяти), а не на программировании ядра.
    status: available
    courses: [os-fundamentals]
  - id: networking
    kind: computer-science
    title: Компьютерные сети
    description: >-
      Модели OSI и TCP/IP, инкапсуляция и MTU, IPv4/IPv6-адресация и подсети, Ethernet, ARP и маршрутизация, заголовок IPv4
      и контрольная сумма, TCP (рукопожатие, состояния, управление потоком и перегрузкой), UDP и DNS, HTTP/1.1, HTTP/2 и HTTP/3,
      TLS и сетевая диагностика. Практика - разбор двоичных дампов и симуляции на Python без сети; живые сокеты и перехват пакетов пока не входят.
    status: available
    courses: [networking-fundamentals]
  - id: databases
    kind: computer-science
    title: Базы данных
    description: >-
      Реляционная модель и SQL, соединения, агрегация и оконные функции, нормализация и проектирование схемы,
      индексы и планы запросов, транзакции и уровни изоляции, защита от SQL-инъекций. Примеры на SQLite из Python
      с отдельными пометками о PostgreSQL и MySQL. Нереляционные подходы, MVCC и администрирование СУБД пока не входят.
    status: available
    courses: [databases-sql]
  - id: system-design
    kind: computer-science
    title: Проектирование систем
    description: >-
      Требования и оценка нагрузки, масштабирование, кэширование, очереди сообщений, репликация и шардирование,
      теорема CAP и согласованность, идемпотентность, отказоустойчивость, наблюдаемость. Разбор архитектурных компромиссов на конкретных задачах.
    status: planned
  - id: security
    kind: computer-science
    title: Безопасность приложений
    description: >-
      Модель угроз, аутентификация и авторизация, хранение паролей, основы криптографии (хеши, симметричное и асимметричное шифрование, TLS),
      уязвимости веб-приложений (injection, XSS, CSRF, SSRF), безопасная работа с секретами и зависимостями.
    status: planned
  - id: devops
    kind: computer-science
    title: DevOps и инфраструктура
    description: >-
      Git и рабочие процессы, непрерывная интеграция и доставка, контейнеры Docker и их изоляция, оркестрация,
      инфраструктура как код, мониторинг, логи и трассировка, управление конфигурацией и секретами.
    status: planned

  # ---------- Машинное обучение ----------
  - id: ml-math
    kind: machine-learning
    title: Математика для машинного обучения
    description: >-
      Линейная алгебра (векторы, матрицы, разложения), математический анализ и градиенты, вероятность и статистика,
      оценка максимального правдоподобия, основы оптимизации. Каждое понятие связывается с тем, где оно используется в моделях.
    status: planned
  - id: ml-classical
    kind: machine-learning
    title: Классическое машинное обучение
    description: >-
      Доступен курс «Основы машинного обучения» (четыре урока на чистом Python): постановка задачи, train/validation/test, переобучение и утечки данных,
      линейная регрессия с градиентным спуском, метрики классификации, метод k ближайших соседей. Затем курс «Классическое ML с нуля на NumPy» (четыре урока):
      векторизованная линейная регрессия (lstsq, нормальные уравнения, градиентный спуск), логистическая регрессия, k-means с k-means++ и PCA через SVD;
      этап с библиотекой scikit-learn пока запланирован и описан только текстом. Запланированы деревья и ансамбли, метод опорных векторов,
      кросс-валидация, регуляризация и подготовка признаков.
    status: available
    courses: [ml-foundations, ml-classical-numpy]
  - id: deep-learning
    kind: machine-learning
    title: Глубокое обучение
    description: >-
      Нейронные сети и обратное распространение ошибки, оптимизаторы, свёрточные и рекуррентные сети, механизм внимания и архитектура Transformer,
      регуляризация и нормализация, практика обучения и отладки моделей.
    status: planned
  - id: llm-genai
    kind: machine-learning
    title: LLM и генеративный ИИ
    description: >-
      Устройство больших языковых моделей: токенизация, предобучение и дообучение, генерация текста и параметры сэмплирования,
      промптинг, RAG, вызов инструментов, оценка качества и ограничения (галлюцинации, безопасность).
    status: planned
  - id: mlops
    kind: machine-learning
    title: MLOps
    description: >-
      Жизненный цикл модели в продакшене: воспроизводимость экспериментов, версионирование данных и моделей, пайплайны обучения,
      развёртывание и обслуживание моделей, мониторинг дрейфа данных и качества.
    status: planned

  # ---------- Фреймворки и библиотеки ----------
  - id: django
    kind: framework
    title: Django
    description: >-
      Полнофункциональный веб-фреймворк на Python: ORM и миграции, маршрутизация, представления и шаблоны, формы, административная панель,
      аутентификация, middleware. Предполагает знание Python и основ HTTP.
    languageId: python
    status: planned
  - id: fastapi
    kind: framework
    title: FastAPI
    description: >-
      Фреймворк для HTTP API на Python: описание запросов и ответов через аннотации типов и Pydantic, внедрение зависимостей,
      автоматическая OpenAPI-документация, асинхронные обработчики поверх ASGI. Сейчас доступен один курс «FastAPI: основы» из семи уроков
      (ASGI, параметры и тело запроса, Pydantic v2, зависимости, ошибки, основы аутентификации, структура и тесты); примеры проверяются
      в процессе через TestClient без сети и сервера. База данных и ORM, WebSocket, фоновые задачи, развёртывание и полноценный JWT
      пока запланированы и в курс не входят.
    languageId: python
    status: available
    courses: [fastapi-fundamentals]
  - id: react
    kind: framework
    title: React
    description: >-
      React — библиотека для построения пользовательских интерфейсов, а не полноценный фреймворк: компоненты, JSX, состояние и эффекты,
      хуки, композиция и рендеринг. Маршрутизация, загрузка данных и сборка подбираются отдельно или предоставляются метафреймворками вроде Next.js.
      Доступен курс «React: основы» (функциональные компоненты и хуки, тестирование через Testing Library). Классовые компоненты, роутинг,
      Redux, Next.js и серверные компоненты пока не входят. Проверки упражнений используют npm-пакеты курсов (устанавливаются один раз по запросу).
    languageId: javascript
    status: available
    courses: [react-fundamentals]
  - id: vue
    kind: framework
    title: Vue
    description: >-
      Vue — прогрессивный фреймворк для интерфейсов: система реактивности, шаблоны и однофайловые компоненты, Composition API,
      официальные библиотеки для маршрутизации и состояния. Отличается от React моделью реактивности и шаблонным синтаксисом.
    languageId: javascript
    status: planned
  - id: angular
    kind: framework
    title: Angular
    description: >-
      Angular — полноценный application framework на TypeScript: компоненты, внедрение зависимостей, маршрутизатор, формы, HTTP-клиент,
      RxJS и командная строка Angular CLI. В отличие от библиотек, задаёт единую архитектуру приложения целиком.
    languageId: typescript
    status: planned
  - id: nextjs
    kind: framework
    title: Next.js
    description: >-
      Next.js — фуллстек-фреймворк поверх React: файловая маршрутизация, серверный рендеринг и статическая генерация, серверные компоненты,
      API-обработчики, оптимизация загрузки. Требует знания React и различает код, выполняемый на сервере и в браузере.
    languageId: typescript
    status: planned
  - id: nuxt
    kind: framework
    title: Nuxt
    description: >-
      Nuxt — фуллстек-фреймворк поверх Vue: файловая маршрутизация, серверный и гибридный рендеринг, автоимпорты, серверные маршруты, модули.
      Является для Vue тем, чем Next.js является для React, но со своей архитектурой.
    languageId: typescript
    status: planned
  - id: express
    kind: framework
    title: Express
    description: >-
      Минималистичный веб-фреймворк для Node.js: маршрутизация, цепочки middleware, обработка запросов и ошибок, отдача статических файлов.
      Структура приложения остаётся на усмотрение разработчика.
    languageId: javascript
    status: planned
  - id: fastify
    kind: framework
    title: Fastify
    description: >-
      Веб-фреймворк для Node.js с упором на производительность: схемы JSON для валидации и сериализации, система плагинов и инкапсуляция,
      хуки жизненного цикла запроса, логирование.
    languageId: javascript
    status: planned
  - id: nestjs
    kind: framework
    title: NestJS
    description: >-
      Фреймворк для серверных приложений на Node.js и TypeScript: модули, контроллеры, провайдеры и внедрение зависимостей, декораторы,
      pipes, guards и interceptors. Работает поверх Express или Fastify и навязывает структуру приложения.
    languageId: typescript
    status: planned
  - id: laravel
    kind: framework
    title: Laravel
    description: >-
      Полнофункциональный веб-фреймворк на PHP: маршрутизация, Eloquent ORM и миграции, шаблоны Blade, очереди, события, аутентификация,
