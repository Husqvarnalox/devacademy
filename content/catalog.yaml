tracks:
  # ---------- Языки программирования ----------
  - id: python
    kind: language
    title: Python
    description: >-
      Основы Python 3: как CPython исполняет программу, имена и объекты, числа, условия, циклы,
      функции, строки, списки, словари и множества, исключения и файлы. Каждый урок объясняет,
      что происходит внутри интерпретатора, и проверяется запуском вашего кода.
      Курс «Основы Python» начинается с нуля; «Python для программистов» - быстрый путь для знающих другой язык (уроки
      зачитывают базовый курс); «Проверка знаний Python» - короткие проверки по компетенциям.
    languageId: python
    status: available
    courses: [python-fundamentals, python-for-programmers, python-skill-check, python-advanced, python-stdlib, python-numpy, python-pandas, python-concurrency, python-automation]
  - id: javascript
    kind: language
    title: JavaScript
    description: >-
      Язык JavaScript (ECMAScript) как таковой, независимо от среды запуска: типы и приведение типов,
      объекты и прототипы, замыкания, цикл событий, промисы и async/await, модули. Библиотеки и
      фреймворки (React, Vue, Angular) и серверная среда Node.js вынесены в отдельные треки.
      Три входа: «JavaScript с нуля» для тех, кто никогда не программировал (программы выполняются в Node.js); «JavaScript для
      программистов» - быстрый путь для знающих другой язык (уроки зачитывают базовый курс); «Проверка знаний JavaScript» - короткие
      проверки по компетенциям. Дальше «JavaScript: первые шаги» (как выполняется код, значения и равенство) и «JavaScript: основы
      языка» (типы, замыкания, this, прототипы, итерация, ошибки, промисы и async/await, модули и тесты).
      Запланированы итераторы и генераторы в глубину, Proxy и Reflect, регулярные выражения, Intl и Temporal, браузерная среда.
    languageId: javascript
    status: available
    courses: [javascript-from-zero, javascript-for-programmers, javascript-first-steps, javascript-skill-check, javascript-fundamentals]
  - id: typescript
    kind: language
    title: TypeScript
    description: >-
      TypeScript как статически типизированная надстройка над JavaScript: структурная система типов,
      вывод типов, union и generic-типы, сужение типов, конфигурация tsconfig. Типы стираются при
      компиляции, поэтому трек отдельно объясняет границу между проверкой типов и поведением во время выполнения.
      Три входа: «TypeScript с нуля» для тех, кто никогда не программировал (знание JavaScript не требуется); «TypeScript для программистов» - быстрый путь для знающих другой язык (уроки зачитывают базовый курс); «Проверка знаний TypeScript» - короткие проверки по компетенциям. Дальше «TypeScript: первые шаги» (запуск кода, структурная типизация, сужение, unknown против any) и «TypeScript: система типов на практике»
      (вывод и аннотации, объединения и сужение, проверка данных на границах, interface и type, satisfies, обобщения, утилитарные и отображаемые типы,
      строгие настройки tsconfig, стирание типов и файлы объявлений). Упражнения проверяют и поведение, и сами типы: tsc --strict запускается над кодом ученика.
      Декораторы, продвинутая типовая арифметика, работа с фреймворками и сборка проектов пока не входят в трек.
    languageId: typescript
    status: available
    courses: [typescript-from-zero, typescript-for-programmers, typescript-first-steps, typescript-skill-check, typescript-fundamentals]
  - id: php
    kind: language
    title: PHP
    description: >-
      Современный PHP 8: модель запроса и жизненный цикл скрипта, типы и строгая типизация, массивы,
      классы, интерфейсы и трейты, пространства имён, Composer и автозагрузка. Фреймворки Laravel и Symfony
      изучаются в отдельных треках.
      Три входа: «PHP с нуля» для тех, кто никогда не программировал; «PHP для программистов» - быстрый путь для знающих другой язык (уроки зачитывают базовый курс); «Проверка знаний PHP» - короткие проверки по компетенциям. Дальше вводный «PHP: первые шаги» и углублённый «PHP: язык и экосистема». PHP изучается как язык командной строки, без веб-сервера.
    languageId: php
    status: available
    courses: [php-from-zero, php-for-programmers, php-first-steps, php-skill-check, php-fundamentals]
  - id: csharp
    kind: language
    title: C#
    description: >-
      Язык C# и платформа .NET: система типов, значимые и ссылочные типы, LINQ, обобщения, async/await,
      управление памятью и сборка мусора, обработка исключений. ASP.NET Core вынесен в отдельный трек фреймворков.
      Три входа: «C# с нуля» для тех, кто никогда не программировал; «C# для программистов» - быстрый путь для знающих другой язык (уроки зачитывают базовый курс); «Проверка знаний C#» - короткие проверки по компетенциям. Дальше вводный «C#: первые шаги» и «C#: язык и платформа .NET» (система типов и память, классы, записи и структуры, интерфейсы, обобщения и коллекции, LINQ, исключения и ресурсы, делегаты и события, async/await); ASP.NET Core и работа с базами данных пока не входят.
    languageId: csharp
    status: available
    courses: [csharp-from-zero, csharp-for-programmers, csharp-first-steps, csharp-skill-check, csharp-fundamentals]
  - id: java
    kind: language
    title: Java
    description: >-
      Язык Java и JVM: компиляция в байткод и выполнение на виртуальной машине, классы и интерфейсы,
      обобщения, коллекции, потоки и модель памяти, исключения. Spring Boot вынесен в отдельный трек фреймворков.
      Три входа: «Java с нуля» для тех, кто никогда не программировал; «Java для программистов» - быстрый путь для знающих другой язык (уроки зачитывают базовый курс); «Проверка знаний Java» - короткие проверки по компетенциям. Дальше вводный «Java: первые шаги» и «Java: язык и платформа JVM» (типы и память, классы, записи и перечисления, интерфейсы и sealed-типы, обобщения и коллекции, Stream API, исключения, потоки и виртуальные потоки, текст и ввод-вывод); Spring Boot пока не входит.
    languageId: java
    status: available
    courses: [java-from-zero, java-for-programmers, java-first-steps, java-skill-check, java-fundamentals]
  - id: kotlin
    kind: language
    title: Kotlin
    description: >-
      Язык Kotlin: null-безопасность, data-классы, функции высшего порядка и лямбды, расширения,
      корутины и структурная конкурентность, взаимодействие с Java-кодом на JVM.
      Три входа: «Kotlin с нуля» для тех, кто никогда не программировал; «Kotlin для программистов» - быстрый путь для знающих другой язык (уроки зачитывают базовый курс); «Проверка знаний Kotlin» - короткие проверки по компетенциям. Дальше вводный «Kotlin: первые шаги» и «Kotlin: язык и идиомы» (типы и null-безопасность, функции, sealed и when, коллекции, обобщения, ошибки, потоки, Java-интероп, корутины kotlinx.coroutines); Android пока не входит.
    languageId: kotlin
    status: available
    courses: [kotlin-from-zero, kotlin-for-programmers, kotlin-first-steps, kotlin-skill-check, kotlin-fundamentals]
  - id: go
    kind: language
    title: Go
    description: >-
      Язык Go: статическая типизация и компиляция в один бинарник, срезы и отображения, интерфейсы,
      обработка ошибок как значений, горутины и каналы, пакет context, тестирование средствами стандартной библиотеки.
      Три входа: «Go с нуля» для тех, кто никогда не программировал; «Go для программистов» - быстрый путь для тех, кто знает
      другой язык (уроки зачитывают базовый курс); «Проверка знаний Go» - короткие проверки по компетенциям, чтобы пропустить
      известное и найти пробелы. Дальше «Go: язык и идиомы» и «Go: профессиональный уровень» (устройство срезов, аллокации,
      гонки и модель памяти, отмена через context, ресурсы, тесты). Веб-серверы и обобщения пока не входят.
    languageId: go
    status: available
    courses: [go-first-steps, go-for-programmers, go-skill-check, go-fundamentals, go-professional]
  - id: cpp
    kind: language
    title: C++
    description: >-
      Современный C++: модель памяти и время жизни объектов, RAII и умные указатели, ссылки и семантика перемещения,
      шаблоны, контейнеры и алгоритмы стандартной библиотеки, сборка с CMake. Неопределённое поведение разбирается явно.
      Три входа: «C++ с нуля» для тех, кто никогда не программировал; «C++ для программистов» - быстрый путь для знающих другой язык (уроки зачитывают базовый курс); «Проверка знаний C++» - короткие проверки по компетенциям. Дальше вводный «C++: первые шаги» и «C++: язык и стандартная библиотека» (модель компиляции, указатели и перемещение, умные указатели, классы, шаблоны и концепты, STL, обработка ошибок, неопределённое поведение и санитайзеры); многопоточность показана на примерах гонок данных, std::thread, std::atomic и std::mutex; CMake и корутины пока не входят.
    languageId: cpp
    status: available
    courses: [cpp-from-zero, cpp-for-programmers, cpp-first-steps, cpp-skill-check, cpp-fundamentals]
  - id: rust
    kind: language
    title: Rust
    description: >-
      Язык Rust: владение, заимствование и времена жизни как механизм безопасности памяти без сборщика мусора,
      типы Option и Result, трейты и обобщения, итераторы, потокобезопасность на уровне типов, управление зависимостями через Cargo.
      Три входа: «Rust с нуля» для тех, кто никогда не программировал; «Rust для программистов» - быстрый путь для знающих другой язык (уроки зачитывают базовый курс); «Проверка знаний Rust» - короткие проверки по компетенциям. Дальше вводный «Rust: первые шаги» и «Rust: владение, типы и надёжный код» (владение и заимствование в деталях, перечисления и ошибки, трейты, коллекции и итераторы, умные указатели, потоки и каналы); Cargo, внешние крейты, async и unsafe пока не входят.
    languageId: rust
    status: available
    courses: [rust-from-zero, rust-for-programmers, rust-first-steps, rust-skill-check, rust-fundamentals]

  # ---------- Среда выполнения ----------
  - id: nodejs
    kind: framework
    title: Node.js
    description: >-
      Node.js — это среда выполнения (runtime) JavaScript вне браузера, а не язык и не веб-фреймворк: движок V8,
      цикл событий и libuv, модульная система CommonJS и ESM, потоки, файловая система, процессы, сетевые API и npm.
      Предполагает знание языка JavaScript; веб-фреймворки Express, Fastify и NestJS строятся поверх Node.js и вынесены отдельно.
      В треке два курса: вводный «Node.js: первые шаги» и углублённый «Node.js: платформа и встроенные модули» (цикл событий, модули, потоки, Buffer, файловая система, события, основы HTTP).
    languageId: javascript
    status: available
    courses: [nodejs-first-steps, nodejs-fundamentals]

  # ---------- Алгоритмы ----------
  - id: algorithms
    kind: algorithms
    title: Алгоритмы и структуры данных
    description: >-
      Оценка сложности (O-нотация), бинарный поиск, сортировка, два указателя и скользящее окно, префиксные суммы и хеш-таблицы, обход графа в ширину.
      Теория языконезависима, упражнения решаются на Python, JavaScript, Go, Java, C++ или Rust; большие скрытые тесты проверяют именно эффективность.
      Сейчас доступен один курс из шести уроков; запланированы связные списки, стеки и очереди, деревья и кучи, жадные алгоритмы, динамическое программирование и рекурсия с перебором.
    status: available
    courses: [algorithms-foundations]

  # ---------- Computer Science ----------
  - id: operating-systems
    kind: computer-science
    title: Операционные системы
    description: >-
      Процессы и системные вызовы, планирование процессора, потоки и гонки данных, взаимные блокировки, страничная
      адресация и TLB, виртуальная память и замещение страниц, файловые системы с inode и ссылками, каналы, сигналы
      и блокирующий ввод-вывод. Практика на симуляторах на Python (планировщик, менеджер памяти, файловая система
      в памяти), а не на программировании ядра.
    status: available
    courses: [os-fundamentals]
  - id: networking
    kind: computer-science
    title: Компьютерные сети
    description: >-
      Модели OSI и TCP/IP, инкапсуляция и MTU, IPv4/IPv6-адресация и подсети, Ethernet, ARP и маршрутизация, заголовок IPv4
      и контрольная сумма, TCP (рукопожатие, состояния, управление потоком и перегрузкой), UDP и DNS, HTTP/1.1, HTTP/2 и HTTP/3,
      TLS и сетевая диагностика. Практика - разбор двоичных дампов и симуляции на Python без сети; живые сокеты и перехват пакетов пока не входят.
    status: available
    courses: [networking-fundamentals]
  - id: databases
    kind: computer-science
    title: Базы данных
    description: >-
      Реляционная модель и SQL, соединения, агрегация и оконные функции, нормализация и проектирование схемы,
      индексы и планы запросов, транзакции и уровни изоляции, защита от SQL-инъекций. Примеры на SQLite из Python
      с отдельными пометками о PostgreSQL и MySQL. Нереляционные подходы, MVCC и администрирование СУБД пока не входят.
    status: available
    courses: [databases-sql]
  - id: system-design
    kind: computer-science
    title: Проектирование систем
    description: >-
      Требования и оценка нагрузки, кеширование, балансировка и согласованное хеширование, ограничение частоты запросов,
      партиционирование и репликация, согласованность, CAP/PACELC и идемпотентность, очереди сообщений, разбор задачи про сервис коротких ссылок.
    status: available
    courses: [system-design-fundamentals]
  - id: security
    kind: computer-science
    title: Безопасность приложений
    description: >-
      Модель угроз и STRIDE, хранение паролей, HMAC и JWT, защита от injection, кодирование вывода и XSS, сессии, cookie и CSRF,
      контроль доступа (RBAC, ABAC, IDOR), безопасная работа с секретами, случайностью и зависимостями.
    status: available
    courses: [security-fundamentals]
  - id: devops
    kind: computer-science
    title: DevOps и инфраструктура
    description: >-
      Поставка и эксплуатация ПО на моделях: CI/CD и метрики DORA, версионирование, конвейеры как графы, слои контейнеров,
      конфигурация и секреты, стратегии выпуска, SLO и бюджет ошибок, повторы и размыкатель цепи. Оркестрация,
      инфраструктура как код и трассировка пока не входят.
    status: available
    courses: [devops-fundamentals]

  # ---------- Машинное обучение ----------
  - id: ml-math
    kind: machine-learning
    title: Математика для машинного обучения
    description: >-
      Линейная алгебра (векторы, матрицы, разложения), математический анализ и градиенты, вероятность и статистика,
      оценка максимального правдоподобия, основы оптимизации. Каждое понятие связывается с тем, где оно используется в моделях.
    status: planned
  - id: ml-classical
    kind: machine-learning
    title: Классическое машинное обучение
    description: >-
      Доступен курс «Основы машинного обучения» (четыре урока на чистом Python): постановка задачи, train/validation/test, переобучение и утечки данных,
      линейная регрессия с градиентным спуском, метрики классификации, метод k ближайших соседей. Затем курс «Классическое ML с нуля на NumPy» (четыре урока):
      векторизованная линейная регрессия (lstsq, нормальные уравнения, градиентный спуск), логистическая регрессия, k-means с k-means++ и PCA через SVD;
      этап с библиотекой scikit-learn пока запланирован и описан только текстом. Запланированы деревья и ансамбли, метод опорных векторов,
      кросс-валидация, регуляризация и подготовка признаков.
    status: available
    courses: [ml-foundations, ml-classical-numpy]
  - id: ml-go
    kind: machine-learning
    title: Машинное обучение на Go (GoMLX)
    description: >-
      Курс «Машинное обучение на Go (GoMLX)» (шесть уроков): тензоры и бэкенд, графы вычислений, автоматическое дифференцирование, линейная и логистическая регрессия
      с градиентным спуском и маленькая нейронная сеть с переобучением и L2-регуляризацией. Работает на чистом Go-бэкенде GoMLX v0.28.8 без cgo и GPU, поэтому медленнее XLA;
      библиотека до версии 1.0, её API может меняться. Модули скачиваются один раз по явному согласию. Слои и оптимизаторы библиотеки, XLA, GPU и импорт моделей пока не входят.
    languageId: go
    status: available
    courses: [go-ml-gomlx]
  - id: deep-learning
    kind: machine-learning
    title: Глубокое обучение
    description: >-
      Доступен курс «PyTorch: основы» (семь уроков): тензоры, автоматическое дифференцирование, nn.Module, цикл обучения (SGD и Adam), классификация небольшой сетью,
      Dataset и DataLoader с ранней остановкой, сохранение моделей, режимы train и eval, Dropout, BatchNorm и затухание весов. Работает на процессоре; PyTorch устанавливается один раз по явному согласию.
      Запланированы свёрточные и рекуррентные сети, механизм внимания и архитектура Transformer, практика обучения и отладки моделей.
    languageId: python
    status: available
    courses: [pytorch-fundamentals]
  - id: llm-genai
    kind: machine-learning
    title: LLM и генеративный ИИ
    description: >-
      Устройство больших языковых моделей: токенизация, предобучение и дообучение, генерация текста и параметры сэмплирования,
      промптинг, RAG, вызов инструментов, оценка качества и ограничения (галлюцинации, безопасность).
    status: planned
  - id: mlops
    kind: machine-learning
    title: MLOps
    description: >-
      Жизненный цикл модели в продакшене: воспроизводимость экспериментов, версионирование данных и моделей, пайплайны обучения,
      развёртывание и обслуживание моделей, мониторинг дрейфа данных и качества.
    status: planned

  # ---------- Фреймворки и библиотеки ----------
  - id: django
    kind: framework
    title: Django
    description: >-
      Полнофункциональный веб-фреймворк на Python. Курс «Django: основы» (Django 6.1): архитектура и маршрутизация, модели и ORM (QuerySet, N+1), представления и шаблоны,
      формы и валидация, аутентификация и права, middleware, JSON API без DRF и тестирование. Упражнения проверяются в процессе через django.test.Client, без сервера.
      Административная панель, миграции как файлы, Django REST Framework и развёртывание пока не входят.
    languageId: python
    status: available
    courses: [django-fundamentals]
  - id: fastapi
    kind: framework
    title: FastAPI
    description: >-
      Фреймворк для HTTP API на Python: описание запросов и ответов через аннотации типов и Pydantic, внедрение зависимостей,
      автоматическая OpenAPI-документация, асинхронные обработчики поверх ASGI. Сейчас доступен один курс «FastAPI: основы» из семи уроков
      (ASGI, параметры и тело запроса, Pydantic v2, зависимости, ошибки, основы аутентификации, структура и тесты); примеры проверяются
      в процессе через TestClient без сети и сервера. База данных и ORM, WebSocket, фоновые задачи, развёртывание и полноценный JWT
      пока запланированы и в курс не входят.
    languageId: python
    status: available
    courses: [fastapi-fundamentals]
  - id: react
    kind: framework
    title: React
    description: >-
      React — библиотека для построения пользовательских интерфейсов, а не полноценный фреймворк: компоненты, JSX, состояние и эффекты,
      хуки, композиция и рендеринг. Маршрутизация, загрузка данных и сборка подбираются отдельно или предоставляются метафреймворками вроде Next.js.
      Доступен курс «React: основы» (функциональные компоненты и хуки, тестирование через Testing Library). Классовые компоненты, роутинг,
      Redux, Next.js и серверные компоненты пока не входят. Проверки упражнений используют npm-пакеты курсов (устанавливаются один раз по запросу).
    languageId: javascript
    status: available
    courses: [react-fundamentals]
  - id: vue
