      Структура приложения остаётся на усмотрение разработчика. Доступен курс «Express: основы» (Express 5: маршрутизация, middleware, роутеры,
      обработка ошибок, проверка данных и защитные настройки, проектирование REST API, тесты через light-my-request). Шаблонизаторы, базы данных,
      аутентификация и развёртывание пока не входят. Проверки упражнений используют npm-пакеты курсов (устанавливаются один раз по запросу).
