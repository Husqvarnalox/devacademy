    title: Vue
    description: >-
      Vue — прогрессивный фреймворк для интерфейсов: система реактивности, шаблоны и однофайловые компоненты, Composition API,
      официальные библиотеки для маршрутизации и состояния. Отличается от React моделью реактивности и шаблонным синтаксисом.
    languageId: javascript
    status: planned
  - id: angular
    kind: framework
    title: Angular
    description: >-
      Angular — полноценный application framework на TypeScript: компоненты, внедрение зависимостей, маршрутизатор, формы, HTTP-клиент,
      RxJS и командная строка Angular CLI. В отличие от библиотек, задаёт единую архитектуру приложения целиком.
    languageId: typescript
    status: planned
  - id: nextjs
    kind: framework
    title: Next.js
    description: >-
      Next.js - фуллстек-фреймворк поверх React: файловая маршрутизация, серверный рендеринг и статическая генерация, серверные компоненты,
      API-обработчики, оптимизация загрузки. Требует знания React и различает код, выполняемый на сервере и в браузере. Доступен курс
      «Next.js: основы App Router» (Next.js 16: маршрутизация и макеты, серверные и клиентские компоненты, Route Handlers, серверные действия
      и формы, кэширование с "use cache" и тегами, proxy). Проверки упражнений используют настоящий Next.js с Vitest в песочнице без сети
      (npm-пакеты курсов устанавливаются один раз по запросу); next dev, next build и развёртывание разобраны только в теории.
      Pages Router, базы данных, аутентификация через библиотеки, изображения и шрифты пока не входят.
    languageId: typescript
    status: available
    courses: [nextjs-fundamentals]
  - id: nuxt
    kind: framework
    title: Nuxt
    description: >-
      Nuxt — фуллстек-фреймворк поверх Vue: файловая маршрутизация, серверный и гибридный рендеринг, автоимпорты, серверные маршруты, модули.
      Является для Vue тем, чем Next.js является для React, но со своей архитектурой.
    languageId: typescript
    status: planned
  - id: express
