id: "kotlin-first-steps"
version: "1.0.0"
title: "Kotlin: первые шаги"
description: "Курс рассчитан на тех, кто уже программирует на другом языке: переменные, условия, циклы и функции здесь не объясняются с нуля. Если вы никогда не программировали, начните с «Go с нуля», «Основы Python» или «JavaScript с нуля». Вводный курс из двух уроков: как Kotlin компилируется в байткод JVM и читает ввод, затем null-безопасность и val/var. Остальные темы трека Kotlin запланированы."
languageId: "kotlin"
level: 1
track: "kotlin"
lessons:
  - "01-how-kotlin-runs"
  - "02-null-safety-and-val-var"
