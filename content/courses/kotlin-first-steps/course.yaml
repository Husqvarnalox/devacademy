id: "kotlin-first-steps"
version: "1.0.0"
title: "Kotlin: первые шаги"
description: "Курс рассчитан на тех, кто уже программирует на другом языке: переменные, условия, циклы и функции здесь не объясняются с нуля. Если вы никогда не программировали, начните с курса «Kotlin с нуля»: он ведёт от первой программы до небольшого проекта и открывает этот курс. Вводный курс из двух уроков: как Kotlin компилируется в байткод JVM, Int и Long, затем null-безопасность: безопасные вызовы, !! и smart cast. Остальные темы трека Kotlin запланированы."
languageId: "kotlin"
level: 1
requires:
  - "kotlin-from-zero"
track: "kotlin"
lessons:
  - "01-how-kotlin-runs"
  - "02-null-safety-and-val-var"
