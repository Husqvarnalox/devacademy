id: "kotlin.first-steps.how-kotlin-runs"
title: "Как выполняется Kotlin: kotlinc, JVM и ввод-вывод"
goal: "Понять, как Kotlin превращается в байткод JVM, и написать программу, читающую числа из stdin."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "kotlin.from-zero.first-class"
objectives:
  - "Описать, что делает kotlinc и как jar запускается на JVM."
  - "Объяснять переполнение Int, разницу между Int и Long и явные числовые преобразования."
  - "Читать stdin через readln и bufferedReader().readText()."
  - "Форматировать дробные числа через Locale.ROOT."
masteryCriteria:
  - "Вы объясняете, почему Kotlin-программе нужна стандартная библиотека в jar."
  - "Вы используете Long для суммы и toDouble() до деления."
  - "Вы фильтруете пустые слова после split."
related:
  - "python.fundamentals.how-python-runs"
next:
  - "kotlin.first-steps.null-safety-and-val-var"
tags:
  - "kotlin"
  - "jvm"
  - "kotlinc"
  - "stdin"
facts:
  - kind: "internals"
    text: "Компилятор Kotlin для JVM генерирует байткод JVM; в командной строке kotlinc с опцией -include-runtime собирает самодостаточный jar, который запускают командой java -jar."
    sources:
      - "https://kotlinlang.org/docs/command-line.html"
  - kind: "historical"
    text: "Kotlin был представлен компанией JetBrains в 2011 году, а версия 1.0 вышла в феврале 2016 года."
    sources:
      - "https://blog.jetbrains.com/kotlin/2016/02/kotlin-1-0-released-pragmatic-language-for-jvm-and-android/"
  - kind: "misconception"
    text: "«val делает объект неизменяемым» - неверно: val запрещает переприсвоить переменную, но содержимое изменяемой коллекции менять можно."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Во что kotlinc компилирует код для JVM?"
      options:
        - "В машинный код процессора."
        - "В байткод JVM."
        - "В JavaScript."
        - "В исходный код Java."
      answer: 1
      explanation: "Результат - байткод JVM в файлах .class (в нашем случае упакованный в jar), который выполняет JVM."
    - id: "q2"
      type: "single"
      prompt: "Что выведет println(7 / 2)?"
      options:
        - "3"
        - "3.5"
        - "4"
        - "Ошибка компиляции."
      answer: 0
      explanation: "Оба операнда - Int, деление целочисленное и усекает дробную часть: 3."
    - id: "q3"
      type: "multiple"
      prompt: "Что верно про val и var?"
      options:
        - "val нельзя переприсвоить."
        - "val делает любую коллекцию неизменяемой."
        - "var допускает переприсваивание."
        - "Тип всегда нужно писать явно."
      answer:
        - 0
        - 2
      explanation: "val не переприсваивается, var можно. Но val не делает содержимое объекта неизменяемым."
    - id: "q4"
      type: "short"
      prompt: "Какое выражение превращает Int n в Double?"
      answer:
        - "n.toDouble()"
        - "toDouble"
      explanation: "В Kotlin числовые преобразования явные: n.toDouble()."
exercise:
  id: "kotlin.first-steps.how-kotlin-runs.exercise"
  title: "Статистика по числам из stdin"
  prompt: |

    Программа получает на вход число `n` (1 <= n <= 1000), а затем `n` целых чисел, каждое из которых по модулю не больше 2 000 000 000.
    Числа могут быть разбросаны по строкам как угодно и разделены любым количеством пробелов и переводов строк.

    Выведите ровно четыре строки:

    ```
    sum=<сумма>
    min=<наименьшее>
    max=<наибольшее>
    avg=<среднее арифметическое с двумя знаками после точки>
    ```

    **Пример.** Ввод `4` и затем `1 2 3 4` даёт

    ```
    sum=10
    min=1
    max=4
    avg=2.50
    ```

    Среднее печатайте с точкой как десятичным разделителем, независимо от региональных настроек системы.
    Сумма может не поместиться в 32 бита, учитывайте это.
  entryFile: "Main.kt"
  evaluation: "io"
  hints:
    - "Прочитайте весь stdin: System.`in`.bufferedReader().readText(), затем split(Regex(\"\\\\s+\")) и filter { it.isNotEmpty() }."
    - "Первое слово - n, следующие n слов превратите в Long через toLong(). Сумма Int не подойдёт: 4000000000 в него не влезает."
    - "min и max можно получить из списка Long: nums.min(), nums.max(); сумму - nums.sum()."
    - "Среднее: sum.toDouble() / n, формат \"%.2f\".format(Locale.ROOT, x). Locale.ROOT даёт точку."
  tests:
    - id: "basic"
      title: "Числа в одной строке"
      stdin: "4\n1 2 3 4\n"
      expected: "sum=10\nmin=1\nmax=4\navg=2.50\n"
      hint: "Нужны четыре строки sum=, min=, max=, avg=."
    - id: "lines"
      title: "Числа на разных строках"
      stdin: "3\n10\n20\n30\n"
      expected: "sum=60\nmin=10\nmax=30\navg=20.00\n"
      hint: "Числа на разных строках: читайте весь ввод и разбивайте по пробелам и переводам строк."
    - id: "single"
      title: "Одно число"
      stdin: "1\n7\n"
      expected: "sum=7\nmin=7\nmax=7\navg=7.00\n"
      hint: "При n = 1 все величины равны, среднее 7.00."
    - id: "negatives"
      title: "Отрицательные числа (скрытый)"
      stdin: "5\n-3 -1 -4 -1 -5\n"
      expected: "sum=-14\nmin=-5\nmax=-1\navg=-2.80\n"
      hidden: true
      hint: "min и max не должны начинаться с 0."
    - id: "whitespace"
      title: "Лишние пробелы и пустые строки (скрытый)"
      stdin: "3\n  5   2\n\n 2\n"
      expected: "sum=9\nmin=2\nmax=5\navg=3.00\n"
      hidden: true
      hint: "Фильтруйте пустые слова после split: ведущие пробелы дают пустой элемент."
    - id: "rounding"
      title: "Округление среднего (скрытый)"
      stdin: "3\n1 2 2\n"
      expected: "sum=5\nmin=1\nmax=2\navg=1.67\n"
      hidden: true
      hint: "5/3 надо делить как Double: sum.toDouble() / n."
    - id: "big-sum"
      title: "Сумма больше 32-битного диапазона (скрытый)"
      stdin: "2\n2000000000 2000000000\n"
      expected: "sum=4000000000\nmin=2000000000\nmax=2000000000\navg=2000000000.00\n"
      hidden: true
      hint: "Сумма 4000000000 не помещается в Int. Используйте Long."
