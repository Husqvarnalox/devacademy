id: "go.fundamentals.types-values-zero-values"
title: "Типы, нулевые значения и строки"
goal: "Понимать, какое значение получает переменная без инициализации, как работают нетипизированные константы и явные преобразования, и чем строка из байтов отличается от последовательности символов."
difficulty: "easy"
estimatedMinutes: 55
prerequisites:
  - "go.first-steps.packages-and-go-test"
objectives:
  - "Назвать нулевое значение любого базового, ссылочного и составного типа Go."
  - "Объяснить, чем нетипизированная константа отличается от типизированной, и почему const limit = 1000 подходит и для float64, и для time.Duration."
  - "Выполнять явные числовые преобразования и предсказывать усечение и переполнение."
  - "Отличать байты от рун: len, индексирование, range и []rune(s) для строки в UTF-8."
  - "Развернуть и посчитать строку по символам, а не по байтам."
masteryCriteria:
  - "Вы предсказываете вывод программы с len(s), s[i] и range для строки с кириллицей, не запуская её."
  - "Вы разворачиваете и считаете строку по рунам, и программа корректно обрабатывает не-ASCII текст."
  - "Вы не пишете в nil-карту и объясняете, почему чтение из неё безопасно."
  - "Вы объясняете, почему string(65) даёт символ, а не число, и используете strconv.Itoa."
related:
  - "go.fundamentals.functions-and-errors"
next:
  - "go.fundamentals.functions-and-errors"
tags:
  - "go"
  - "types"
  - "strings"
  - "constants"
  - "unicode"
facts:
  - kind: "internals"
    text: "Спецификация языка определяет нулевое значение для каждого типа: 0 для чисел, false для bool, пустая строка для string и nil для указателей, функций, интерфейсов, срезов, каналов и карт. Составные типы получают нулевое значение поэлементно."
    sources:
      - "https://go.dev/ref/spec#The_zero_value"
  - kind: "internals"
    text: "Нетипизированные константы вычисляются с произвольной точностью, а тип получают только при использовании; спецификация требует от компиляторов представлять целые константы минимум 256 битами. Ошибка переполнения возникает при попытке положить значение в тип, который его не вмещает."
    sources:
      - "https://go.dev/ref/spec#Constants"
      - "https://go.dev/blog/constants"
  - kind: "internals"
    text: "Строка в Go - неизменяемая последовательность байтов, обычно в UTF-8. len возвращает число байтов, а range по строке декодирует UTF-8 и выдаёт руны; недопустимая последовательность превращается в руну U+FFFD шириной в один байт."
    sources:
      - "https://go.dev/blog/strings"
      - "https://go.dev/ref/spec#For_range"
  - kind: "misconception"
    text: "«len(s) возвращает число символов» - верно только для ASCII. Для кириллицы, иероглифов и эмодзи len считает байты: len(\"Привет\") равно 12, а число рун - 6."
  - kind: "real-world"
    text: "Идея «полезного нулевого значения» заложена в стандартную библиотеку: var mu sync.Mutex и var buf bytes.Buffer готовы к работе без конструктора."
    sources:
      - "https://go.dev/doc/effective_go#allocation_new"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Чему равно len(s) для s := \"héllo\"?"
      options:
        - "5"
        - "6"
        - "7"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Буква é в UTF-8 занимает два байта, поэтому всего 6 байтов. Число рун равно 5."
    - id: "q2"
      type: "single"
      prompt: "Что напечатает fmt.Println(7/2, 7/2.0)?"
      options:
        - "3 3"
        - "3.5 3.5"
        - "3 3.5"
        - "3.5 3"
      answer: 2
      explanation: "7/2 - деление целых констант, результат 3. В 7/2.0 константа вещественная, результат 3.5."
    - id: "q3"
      type: "multiple"
      prompt: "Какие утверждения верны?"
      options:
        - "Цикл for i, r := range s по строке выдаёт индексы в байтах и руны."
        - "Выражение s[0] имеет тип byte."
        - "Присваивание s[0] = 'x' допустимо для строки s."
        - "Чтение значения из nil-карты безопасно и возвращает нулевое значение."
      answer:
        - 0
        - 1
        - 3
      explanation: "Строки неизменяемы, поэтому s[0] = 'x' не компилируется. Остальные утверждения верны."
    - id: "q4"
      type: "short"
      prompt: "var x uint8 = 255; x++. Чему равно x?"
      answer:
        - "0"
      explanation: "Целые числа Go заворачиваются по модулю 2^8 без ошибки, поэтому 255 + 1 даёт 0."
    - id: "q5"
      type: "single"
      prompt: "Что делает m[\"a\"] = 1, если объявлено var m map[string]int и карта не создавалась через make?"
      options:
        - "Создаёт карту автоматически"
        - "Вызывает панику: assignment to entry in nil map"
        - "Ничего не делает"
        - "Не компилируется"
      answer: 1
      explanation: "Нулевое значение карты - nil. Читать из такой карты можно, а запись вызывает панику во время выполнения."
exercise:
  id: "go.fundamentals.types-values-zero-values.exercise"
  title: "Строка по байтам и по рунам"
  prompt: |
    Программа читает **одну строку** со стандартного ввода (она может быть пустой и содержать любой текст Unicode) и печатает четыре строки:

    ```
    bytes: <число байтов>
    runes: <число рун>
    reversed: <строка, развёрнутая по рунам>
    first: U+XXXX
    ```

    `first` - код первой руны в формате `U+` и четыре или больше шестнадцатеричных цифр заглавными (`%04X`). Для пустой строки напечатайте `first: none`.

    **Пример.** Для `Привет`:

    ```
    bytes: 12
    runes: 6
    reversed: тевирП
    first: U+041F
    ```

    В заготовке всё считается по байтам, поэтому на ASCII она работает, а на кириллице - нет. Исправьте `reverse`, подсчёт рун и вывод первой руны.
  entryFile: "main.go"
  evaluation: "io"
  hints:
    - "Запустите заготовку на строке Привет: runes совпадает с bytes, а reversed превращается в мусор. Байт и руна - разные вещи."
    - "Работайте с []rune(s): оно разбирает UTF-8 на символы. Число рун также даёт utf8.RuneCountInString(s) из пакета unicode/utf8."
    - "Для разворота: r := []rune(s) и обмен r[i], r[j] = r[j], r[i] по двум индексам с концов; результат - string(r)."
    - "Первую руну даёт r, _ := utf8.DecodeRuneInString(line) (или for _, r := range line с break). Печатайте её через %04X. Пустую строку обработайте до этого."
  tests:
    - id: "ascii"
      title: "ASCII-строка"
      stdin: "Go\n"
      expected: "bytes: 2\nrunes: 2\nreversed: oG\nfirst: U+0047\n"
      hint: "Для ASCII байты и руны совпадают; первая руна G имеет код U+0047."
    - id: "cyrillic"
      title: "Кириллица"
      stdin: "Привет\n"
      expected: "bytes: 12\nrunes: 6\nreversed: тевирП\nfirst: U+041F\n"
      hint: "Каждая русская буква - 2 байта: 6 рун дают 12 байтов. Разворот делайте по рунам."
    - id: "empty"
      title: "Пустая строка"
      stdin: "\n"
      expected: "bytes: 0\nrunes: 0\nreversed: \nfirst: none\n"
      hint: "Для пустой строки напечатайте нули, пустой reversed и first: none."
    - id: "accents"
      title: "Латиница с диакритикой (скрытый)"
      stdin: "héllo wörld\n"
      expected: "bytes: 13\nrunes: 11\nreversed: dlröw olléh\nfirst: U+0068\n"
      hidden: true
      hint: "é и ö занимают по 2 байта; число рун на два меньше числа байтов."
    - id: "cjk"
      title: "Иероглифы (скрытый)"
      stdin: "日本語\n"
      expected: "bytes: 9\nrunes: 3\nreversed: 語本日\nfirst: U+65E5\n"
      hidden: true
      hint: "Иероглиф занимает 3 байта в UTF-8; разворот по рунам даёт 語本日."
    - id: "emoji"
      title: "Эмодзи и пробел (скрытый)"
      stdin: "👋 hi\n"
      expected: "bytes: 7\nrunes: 4\nreversed: ih 👋\nfirst: U+1F44B\n"
      hidden: true
      hint: "Эмодзи занимает 4 байта, но это одна руна с кодом U+1F44B."
challenge:
  id: "go.fundamentals.types-values-zero-values.challenge"
  title: "Частоты рун"
  prompt: |
    Прочитайте **весь** стандартный ввод и посчитайте, сколько раз встречается каждая руна, **кроме пробельных** (`unicode.IsSpace`). Регистр различается.

    Выведите по строке `<руна> <количество>` для каждой различной руны: сначала по убыванию количества, при равенстве - по возрастанию кода руны.

    **Пример.** Для `hello`:

    ```
    l 2
    e 1
    h 1
    o 1
    ```

    Заготовка считает байты, не сортирует и учитывает пробелы. Порядок обхода карты в Go намеренно случаен, поэтому результат нужно отсортировать явно.
  entryFile: "main.go"
  evaluation: "io"
  starter: "challenge/starter"
  solution: "challenge/solution"
  hints:
    - "Ключ карты должен быть типа rune, а не string, и цикл должен быть for _, r := range text, чтобы получать руны, а не байты."
    - "Пробельные символы пропускайте проверкой unicode.IsSpace(r) до увеличения счётчика."
    - "Карта не упорядочена: перенесите пары в срез структур {r rune; n int} и отсортируйте его."
    - "Сортировка: slices.SortFunc(list, func(a, b entry) int { ... }) - сначала сравните количества по убыванию (b.n - a.n), при равенстве - руны по возрастанию (int(a.r - b.r)). Печатайте руну через %c."
  tests:
    - id: "hello"
      title: "Латиница"
      stdin: "hello\n"
      expected: "l 2\ne 1\nh 1\no 1\n"
      hint: "Ничья по количеству решается по коду руны: e раньше h, h раньше o."
    - id: "cyrillic"
      title: "Кириллица"
      stdin: "мама\n"
      expected: "а 2\nм 2\n"
      hint: "Руна а (U+0430) меньше руны м (U+043C), поэтому идёт первой."
    - id: "spaces"
      title: "Пробелы и переводы строк"
      stdin: "a b\nb  a\n"
      expected: "a 2\nb 2\n"
      hint: "Пробелы, табуляции и переводы строк считать не нужно."
    - id: "cjk"
      title: "Иероглифы (скрытый)"
      stdin: "日本日\n"
      expected: "日 2\n本 1\n"
      hidden: true
      hint: "Иероглиф - одна руна из трёх байтов; считайте руны, а не байты."
    - id: "emoji"
      title: "Эмодзи (скрытый)"
      stdin: "👋👋 ok\n"
      expected: "👋 2\nk 1\no 1\n"
      hidden: true
      hint: "Эмодзи - одна руна из четырёх байтов; при равенстве k (U+006B) идёт раньше o (U+006F)."
    - id: "single"
      title: "Один символ (скрытый)"
      stdin: "x"
      expected: "x 1\n"
      hidden: true
      hint: "Ввод может не заканчиваться переводом строки; читайте весь ввод через io.ReadAll."
