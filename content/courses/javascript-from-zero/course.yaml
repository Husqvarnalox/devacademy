id: "javascript-from-zero"
version: "1.0.0"
title: "JavaScript с нуля"
description: "Курс для тех, кто никогда не программировал. Программы выполняются в Node.js. Каждый урок вводит одно понятие: первая программа и сообщения об ошибках, значения, переменные, строки и сравнения, функции, условия и циклы, массивы, стрелочные функции и методы массивов, объекты, исключения, чтение ввода и мини-проект. Тем, кто уже программирует на другом языке, подойдёт быстрый курс «JavaScript для программистов»: он зачитывает уроки этого курса."
