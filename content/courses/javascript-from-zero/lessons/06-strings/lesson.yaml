id: "javascript.from-zero.strings"
title: "Строки"
goal: "Собирать текст из частей с помощью + и шаблонных строк и узнавать длину строки."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "javascript.from-zero.arithmetic"
objectives:
  - "Склеить несколько строк оператором + и объяснить, что + делает с числами и строками."
  - "Подставить значения переменных в текст через шаблонную строку с ${}."
  - "Узнать длину строки свойством length."
masteryCriteria:
  - "Программа печатает фразу, собранную из переменных, с правильными пробелами."
  - "Вы отличаете сложение чисел от склейки строк по типам операндов."
concepts:
  introduces:
    - "js.concatenation"
    - "js.template-literal"
    - "js.string-length"
  uses:
    - "js.string"
    - "js.string-literal"
    - "js.variable"
    - "js.const"
    - "js.arithmetic"
next:
  - "javascript.from-zero.comparison-and-logic"
tags:
  - "javascript"
  - "strings"
  - "template-literal"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        console.log("Ча" + "й");
        ```
      options:
        - "Ча й"
        - "Чай"
        - "Ча+й"
        - "Ошибка"
      answer: 1
      explanation: "Оператор + между строками склеивает их без пробела. Пробел нужно добавить самому, если он требуется."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        console.log("2" + "3");
        console.log(2 + 3);
        ```
      options:
        - "5, затем 5"
        - "23, затем 5"
        - "23, затем 23"
        - "5, затем 23"
      answer: 1
      explanation: "Если оба операнда - строки, + склеивает: получается текст \"23\". Если оба числа, + складывает: 5."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        const user = "Олег";
        console.log(`Привет, ${user}!`);
        ```
      options:
        - "Привет, ${user}!"
        - "Привет, Олег!"
        - "Привет, user!"
        - "Ошибка: нет закрывающей кавычки"
      answer: 1
      explanation: "В шаблонной строке (в обратных кавычках) выражение внутри ${} вычисляется, и его значение подставляется в текст."
    - id: "q4"
      type: "numeric"
      prompt: |
        Какое число напечатает программа?

        ```javascript
        console.log("мир и труд".length);
        ```
      answer: 10
      tolerance: 0
      explanation: "Пробелы входят в длину. «мир» - 3, пробел - 1, «и» - 1, пробел - 1, «труд» - 4: всего 10."
    - id: "q5"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        const a = 3;
        const b = 4;
        console.log(`${a} + ${b} = ${a + b}`);
        ```
      options:
        - "7 = 7"
        - "3 + 4 = 7"
        - "3 + 4 = 34"
        - "${a} + ${b} = ${a + b}"
      answer: 1
      explanation: "Каждое ${...} заменяется значением своего выражения. Внутри ${} выражение a + b вычисляется как сумма чисел: 7."
exercise:
  id: "javascript.from-zero.strings.exercise"
  title: "Фраза из частей"
  prompt: |
    В редакторе две переменные: имя `name` и покупка `item`. Допишите программу так, чтобы она напечатала две строки:

    ```
    Анна купила чай
    Букв в имени: 4
    ```

    * Первую фразу соберите из `name`, слова «купила» и `item` с помощью оператора `+`. Пробелы между словами нужно добавить самому.
    * Вторую строку соберите шаблонной строкой: число букв получите через `name.length`, не записывая 4 вручную.
  entryFile: "main.js"
  evaluation: "io"
  hints:
    - "В первой строке нужны три части: имя, слово «купила» и покупка. Между ними - пробелы, которые тоже часть текста в кавычках."
    - "Склейка: name + \" купила \" + item. Во второй строке вместо 0 внутри обратных кавычек поставьте ${name.length}."
    - "const sentence = name + \" купила \" + item; const info = `Букв в имени: ${name.length}`;"
  tests:
    - id: "basic"
      title: "Обе строки напечатаны"
      stdin: ""
      expected: |
        Анна купила чай
        Букв в имени: 4
      hint: "Должно быть две строки: «Анна купила чай» (с пробелами между словами) и «Букв в имени: 4»."
    - id: "exact"
      title: "Пробелы и длина имени (скрытый)"
      stdin: ""
      expected: |
        Анна купила чай
        Букв в имени: 4
      hidden: true
      hint: "Проверяется точное совпадение: ровно по одному пробелу между словами, без пробелов в конце строки; длина имени - число 4, полученное через name.length."
