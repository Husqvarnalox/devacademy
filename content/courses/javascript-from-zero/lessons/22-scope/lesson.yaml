id: "javascript.from-zero.scope"
title: "Область видимости"
goal: "Понимать, где видна переменная, и находить ошибки, вызванные блоками и одноимёнными переменными."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "javascript.from-zero.reading-input"
objectives:
  - "Объяснить, что переменная let или const видна только в блоке { } , где она объявлена, и в блоках внутри него."
  - "Распознать затенение: внутренняя переменная с тем же именем скрывает внешнюю и не меняет её."
  - "Исправить функцию, в которой значение «теряется» из-за объявления внутри блока."
  - "Читать сообщение ReferenceError: x is not defined и находить, где переменная вышла из области видимости."
masteryCriteria:
  - "Все четыре функции возвращают верный результат на обычных и граничных данных."
  - "Результат накапливается в переменной, объявленной снаружи цикла или условия, а внутри блока она только изменяется без нового let или const."
  - "Ни одна функция не использует имя вне блока, в котором оно объявлено."
concepts:
  introduces:
    - "js.scope"
  uses:
    - "js.let"
    - "js.const"
    - "js.variable"
    - "js.assignment"
    - "js.function"
    - "js.parameter"
    - "js.return"
    - "js.if"
    - "js.for"
    - "js.for-of"
    - "js.break-continue"
    - "js.array"
    - "js.arithmetic"
    - "js.comparison"
    - "js.console-log"
next:
  - "javascript.from-zero.mini-project"
tags:
  - "javascript"
  - "scope"
  - "debugging"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        const x = 1;
        {
          const x = 2;
          console.log(x);
        }
        console.log(x);
        ```
      options:
        - "2, затем 1"
        - "2, затем 2"
        - "1, затем 1"
        - "Ошибка: x уже объявлена"
      answer: 0
      explanation: "Внутри блока объявлена новая переменная x, она скрывает (затеняет) внешнюю. После закрывающей скобки блока внутренняя x исчезает, и снова видна внешняя, равная 1."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        let total = 10;
        if (total > 5) {
          let total = 100;
        }
        console.log(total);
        ```
      options:
        - "10"
        - "100"
        - "undefined"
        - "Ошибка"
      answer: 0
      explanation: "let внутри блока if создаёт другую переменную, которая живёт только до закрывающей скобки. Внешняя total не изменилась. Чтобы изменить внешнюю, нужно убрать слово let: total = 100;"
    - id: "q3"
      type: "single"
      prompt: |
        Что произойдёт?

        ```javascript
        function show() {
          if (true) {
            const message = "привет";
          }
          console.log(message);
        }
        show();
        ```
      options:
        - "ReferenceError: message is not defined"
        - "Напечатается привет"
        - "Напечатается undefined"
        - "SyntaxError при разборе файла"
      answer: 0
      explanation: "message объявлена внутри блока if и вне его не видна. Обращение к неизвестному имени даёт ReferenceError во время выполнения."
    - id: "q4"
      type: "single"
      prompt: |
        Где виден счётчик i?

        ```javascript
        for (let i = 0; i < 3; i++) {
          console.log(i);
        }
        console.log(i);
        ```
      options:
        - "Только внутри цикла; последняя строка даёт ReferenceError"
        - "Везде в файле; последняя строка напечатает 3"
        - "Везде в файле; последняя строка напечатает 2"
        - "Только в первой строке цикла"
      answer: 0
      explanation: "Переменная из заголовка for принадлежит циклу. После цикла имени i нет, обращение к ней приводит к ReferenceError: i is not defined."
    - id: "q5"
      type: "single"
      prompt: "Функция должна считать сумму чисел в цикле. Где правильно объявить переменную sum?"
      options:
        - "Перед циклом: let sum = 0; а внутри цикла менять: sum = sum + n;"
        - "Внутри цикла: let sum = 0; sum = sum + n;"
        - "Внутри цикла каждый раз: const sum = sum + n;"
        - "После цикла: let sum = 0;"
      answer: 0
      explanation: "Накапливаемое значение должно жить дольше одного круга цикла и быть видимо после него, поэтому объявляется перед циклом. Внутри цикла его только меняют, без let и const."
exercise:
  id: "javascript.from-zero.scope.exercise"
  title: "Найдите ошибки областей видимости"
  prompt: |
    В файле `scope.mjs` четыре функции. Они выглядят правдоподобно, но каждая работает неверно из-за ошибки с областью видимости. Исправьте их так, чтобы они делали то, что написано в комментарии над ними.

    * `countEven(numbers)` - сколько чётных чисел в массиве.
    * `maxOf(numbers)` - наибольшее число непустого массива.
    * `grade(score)` - оценка: от 90 - `"отлично"`, от 70 - `"хорошо"`, от 50 - `"зачёт"`, иначе `"незачёт"`.
    * `indexOfValue(items, target)` - номер первого элемента, равного `target`, или `-1`.

    Заново писать функции не нужно: достаточно найти в каждой строку, где переменная объявляется не там или объявляется заново, и поправить её. Запустите проверку и прочитайте сообщения: для `grade` и `indexOfValue` они подскажут, где искать.
  entryFile: "scope.mjs"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.mjs"
  hints:
    - "Во всех четырёх функциях ошибка одного рода: переменная объявлена словом let или const не в том месте. Спросите себя для каждой: где она создаётся, где используется и где заканчивается её блок."
    - "countEven и maxOf: внутри цикла стоит второе let с тем же именем. Оно создаёт новую переменную, которая исчезает в конце блока, а внешняя остаётся прежней. Уберите слово let: тогда команда меняет внешнюю переменную."
    - "grade: каждая const label живёт только внутри своих фигурных скобок, а return label стоит снаружи. Объявите let label = \"\"; перед if, а в ветках только присваивайте: label = \"хорошо\";"
    - "indexOfValue: переменная i принадлежит циклу for и после него не существует. Заведите let found = -1; перед циклом, в ветке с совпадением напишите found = i; и верните found."
  tests:
    - id: "count-max-basic"
      title: "countEven и maxOf на обычных массивах"
      hint: "Если countEven даёт 0, а maxOf возвращает первый элемент, ищите лишнее let внутри цикла или условия: оно скрывает внешнюю переменную."
    - id: "grade-index-basic"
      title: "grade и indexOfValue на обычных значениях"
      hint: "ReferenceError: label is not defined значит, что return label стоит за пределами блока, где она объявлена. Объявите переменную перед if."
    - id: "count-max-edge"
      title: "Пустой массив, отрицательные числа, один элемент (скрытый)"
      hidden: true
      hint: "Для пустого массива countEven возвращает 0. maxOf работает с отрицательными числами: нельзя начинать с 0, берите первый элемент массива."
    - id: "grade-index-edge"
      title: "Границы оценок и поиск без совпадений (скрытый)"
      hidden: true
      hint: "Ровно 90, 70 и 50 попадают в верхние оценки, 89, 69, 49 - в нижние. indexOfValue для пустого массива и для отсутствующего значения возвращает -1, для повторов - первый номер."
