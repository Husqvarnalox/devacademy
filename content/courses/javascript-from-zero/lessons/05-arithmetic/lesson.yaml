id: "javascript.from-zero.arithmetic"
title: "Арифметика"
goal: "Выполнять вычисления с числами и получать целую часть и остаток от деления."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "javascript.from-zero.variables"
objectives:
  - "Использовать операторы + - * / % ** и скобки в выражениях."
  - "Получить целую часть деления через Math.floor и остаток через %."
  - "Объяснить, почему 0.1 + 0.2 не равно ровно 0.3."
masteryCriteria:
  - "Программа считает целую часть, остаток и степень и печатает их в заданном формате."
  - "Вы предсказываете результат выражения с учётом порядка действий."
concepts:
  introduces:
    - "js.arithmetic"
    - "js.math"
  uses:
    - "js.number"
    - "js.variable"
    - "js.const"
    - "js.console-log"
next:
  - "javascript.from-zero.strings"
tags:
  - "javascript"
  - "arithmetic"
  - "math"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        console.log(7 / 2);
        ```
      options:
        - "3"
        - "3.5"
        - "4"
        - "1"
      answer: 1
      explanation: "Деление / в JavaScript даёт дробный результат, если число не делится нацело. Целая часть получается отдельно: Math.floor(7 / 2) равно 3."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        console.log(17 % 5);
        ```
      options:
        - "3"
        - "2"
        - "3.4"
        - "85"
      answer: 1
      explanation: "% возвращает остаток от деления. 17 = 5 * 3 + 2, остаток 2. Число 3 - это целая часть деления, а не остаток."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        console.log(2 + 3 * 4);
        ```
      options:
        - "20"
        - "14"
        - "24"
        - "9"
      answer: 1
      explanation: "Умножение выполняется раньше сложения, как в математике: 3 * 4 = 12, затем 2 + 12 = 14. Чтобы сложить первым, нужны скобки: (2 + 3) * 4 даёт 20."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        const a = 10;
        const b = 4;
        console.log(Math.floor(a / b), a % b);
        ```
      options:
        - "2 2"
        - "2.5 2"
        - "3 2"
        - "2 4"
      answer: 0
      explanation: "10 / 4 равно 2.5, Math.floor отбрасывает дробную часть и даёт 2. Остаток от деления 10 на 4 равен 2. Проверка: 4 * 2 + 2 = 10."
    - id: "q5"
      type: "single"
      prompt: "Что верно для выражения 0.1 + 0.2?"
      options:
        - "Результат точно 0.3."
        - "Результат 0.30000000000000004: дробные числа хранятся приближённо."
        - "Будет ошибка."
        - "Результат 0.12."
      answer: 1
      explanation: "Компьютер хранит дробные числа в двоичном виде, и 0.1 и 0.2 в нём записываются приближённо. Поэтому сумма отличается от 0.3 в последнем знаке. Это свойство хранения, а не ошибка программы."
exercise:
  id: "javascript.from-zero.arithmetic.exercise"
  title: "Делим тысячу"
  prompt: |
    Тысяча рублей делится поровну между тремя людьми. Нужно узнать, сколько получит каждый (целое число рублей), сколько рублей останется и какова площадь квадрата со стороной 7.

    В редакторе вместо вычислений стоят нули. Замените их выражениями:

    * `each` - целая часть деления `total` на `people`;
    * `rest` - остаток от деления `total` на `people`;
    * `area` - 7 во второй степени.

    Ожидаемый вывод:

    ```
    Каждому: 333
    Остаток: 1
    Площадь: 49
    ```
  entryFile: "main.js"
  evaluation: "io"
  hints:
    - "Три значения вычисляются тремя разными операторами: деление с округлением вниз, остаток и степень."
    - "Целая часть деления: Math.floor(total / people). Остаток - оператор %. Степень - оператор **."
    - "const each = Math.floor(total / people); const rest = total % people; const area = 7 ** 2;"
  tests:
    - id: "basic"
      title: "Целая часть, остаток и степень"
      stdin: ""
      expected: |
        Каждому: 333
        Остаток: 1
        Площадь: 49
      hint: "Должно быть три строки: Каждому: 333, Остаток: 1, Площадь: 49. Каждому - результат Math.floor(1000 / 3), без дробной части."
    - id: "exact"
      title: "Результаты целые, без дробной части (скрытый)"
      stdin: ""
      expected: |
        Каждому: 333
        Остаток: 1
        Площадь: 49
      hidden: true
      hint: "Деление 1000 / 3 даёт 333.333..., а нужно 333: используйте Math.floor. Остаток должен быть 1, а не дробью; площадь - 49."
