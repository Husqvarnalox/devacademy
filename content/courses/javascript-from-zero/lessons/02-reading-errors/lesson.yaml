id: "javascript.from-zero.reading-errors"
title: "Как читать сообщения об ошибках"
goal: "Найти и исправить ошибку в программе по тексту сообщения Node.js."
difficulty: "intro"
estimatedMinutes: 20
prerequisites:
  - "javascript.from-zero.first-program"
objectives:
  - "Назвать в сообщении об ошибке файл, номер строки, вид ошибки и причину."
  - "Отличить SyntaxError, ReferenceError и TypeError по смыслу."
  - "Исправить программу с несколькими ошибками, читая сообщение после каждого запуска."
masteryCriteria:
  - "Исправленная программа печатает три строки чека без ошибок."
  - "Вы исправляете ошибки по одной: сначала ту, которую называет Node.js, затем следующую."
concepts:
  introduces:
    - "js.error-message"
  uses:
    - "js.console-log"
    - "js.string-literal"
next:
  - "javascript.from-zero.values-and-types"
tags:
  - "javascript"
  - "errors"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Node.js сообщает: `main.js:3`, а последняя строка сообщения - `ReferenceError: total is not defined`. Что это значит?
      options:
        - "В третьей строке файла использовано имя total, которого Node.js не знает."
        - "В файле всего три строки."
        - "Число total равно нулю."
        - "Ошибка в строке 1, а 3 - это код ошибки."
      answer: 0
      explanation: "Число после двоеточия - номер строки файла. ReferenceError означает, что имя не определено: оно не написано в кавычках как текст и не создано ранее."
    - id: "q2"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```javascript
        console.log("Начало");
        consol.log("Середина");
        console.log("Конец");
        ```
      options:
        - "Напечатаются три строки."
        - "Напечатается «Начало», затем программа остановится с ReferenceError."
        - "Не напечатается ничего: ошибка найдена до запуска."
        - "Напечатаются «Начало» и «Конец», а ошибка будет пропущена."
      answer: 1
      explanation: "Это ошибка имени, а не синтаксиса: программа разобрана целиком, команды выполняются по порядку, и первая строка успевает напечатать «Начало». На строке с consol выполнение останавливается."
    - id: "q3"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```javascript
        console.log("Начало");
        console.log("Конец);
        ```
      options:
        - "Напечатается «Начало», затем сообщение об ошибке."
        - "Напечатаются «Начало» и «Конец»."
        - "Ничего не напечатается, только SyntaxError."
        - "Напечатается «Конец» без закрывающей кавычки."
      answer: 2
      explanation: "SyntaxError находят при разборе текста, до выполнения первой команды. Поэтому «Начало» тоже не появляется."
    - id: "q4"
      type: "single"
      prompt: "Какое сообщение даёт вызов console.Log(\"привет\")?"
      options:
        - "ReferenceError: console is not defined"
        - "SyntaxError: Unexpected token"
        - "TypeError: console.Log is not a function"
        - "Программа напечатает привет."
      answer: 2
      explanation: "Имя console существует, поэтому ReferenceError не возникает. А у console нет команды с именем Log (регистр важен), и вызвать её нельзя: это TypeError."
exercise:
  id: "javascript.from-zero.reading-errors.exercise"
  title: "Исправьте две ошибки"
  prompt: |
    В редакторе программа, которая должна напечатать три строки чека:

    ```
    Чек №1
    Молоко - 90
    Итого: 90
    ```

    В ней две ошибки. Запустите программу, прочитайте сообщение Node.js, исправьте ту ошибку, о которой оно говорит, и запустите снова. Первая ошибка может скрыть вторую, поэтому исправлять придётся по очереди.
  entryFile: "main.js"
  evaluation: "io"
  hints:
    - "Запустите программу и прочитайте последнюю строку сообщения: там название ошибки и причина. Номер строки указан в начале."
    - "Начните с SyntaxError: он находится при разборе, до выполнения, и мешает увидеть остальное. Проверьте кавычки в последней команде."
    - "После исправления кавычки появится ReferenceError про имя consol. В названии команды опечатка."
    - "Должно получиться: console.log(\"Молоко - 90\"); и console.log(\"Итого: 90\"); - у каждой строки есть и открывающая, и закрывающая кавычка."
  tests:
    - id: "basic"
      title: "Программа печатает чек"
      stdin: ""
      expected: |
        Чек №1
        Молоко - 90
        Итого: 90
      hint: "Программа должна завершиться без ошибок и напечатать три строки: Чек №1, Молоко - 90, Итого: 90."
    - id: "exact"
      title: "Точный текст чека (скрытый)"
      stdin: ""
      expected: |
        Чек №1
        Молоко - 90
        Итого: 90
      hidden: true
      hint: "Проверяется точный текст трёх строк: знак №, дефис с пробелами, двоеточие. Строки не нужно удалять или переписывать, достаточно исправить ошибки."
