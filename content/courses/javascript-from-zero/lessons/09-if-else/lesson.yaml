id: "javascript.from-zero.if-else"
title: "Условия if и else"
goal: "Написать функцию, которая выбирает результат по условию с помощью if, else if и else."
difficulty: "easy"
estimatedMinutes: 30
prerequisites:
  - "javascript.from-zero.functions"
objectives:
  - "Записать условный оператор if с веткой else и цепочкой else if."
  - "Расположить ветки в правильном порядке и проверить границы условий."
  - "Составить условие из сравнений и логических операторов."
masteryCriteria:
  - "Функции возвращают правильный результат на границах диапазонов (49/50, 69/70, 89/90, 6/7, 17/18, 64/65)."
  - "Для нуля и малых отрицательных чисел результат тоже верный."
concepts:
  introduces:
    - "js.if"
  uses:
    - "js.comparison"
    - "js.logical-operators"
    - "js.function"
    - "js.parameter"
    - "js.return"
    - "js.console-log"
    - "js.variable"
    - "js.const"
next:
  - "javascript.from-zero.while-loop"
tags:
  - "javascript"
  - "if"
  - "conditions"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        const t = 5;
        if (t < 0) {
          console.log("Мороз");
        } else {
          console.log("Не мороз");
        }
        console.log("Конец");
        ```
      options:
        - "Мороз, затем Конец"
        - "Не мороз, затем Конец"
        - "Только Конец"
        - "Не мороз"
      answer: 1
      explanation: "Условие 5 < 0 ложно, поэтому выполняется ветка else. Команда после блока if/else выполняется в любом случае."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        const n = 75;
        if (n >= 50) {
          console.log("A");
        } else if (n >= 70) {
          console.log("B");
        } else {
          console.log("C");
        }
        ```
      options:
        - "A"
        - "B"
        - "C"
        - "A, затем B"
      answer: 0
      explanation: "Ветки проверяются сверху вниз, выполняется первая с истинным условием. 75 >= 50 истинно, поэтому печатается A, а остальные ветки пропускаются. Проверки нужно ставить от более узкого условия к более широкому."
    - id: "q3"
      type: "single"
      prompt: |
        Что вернёт вызов?

        ```javascript
        function check(x) {
          if (x > 10) {
            return "много";
          }
          return "мало";
        }
        console.log(check(10));
        ```
      options:
        - "много"
        - "мало"
        - "undefined"
        - "Ошибка"
      answer: 1
      explanation: "10 > 10 ложно: на границе строгое сравнение не срабатывает. Ветка if пропускается, выполняется return \"мало\"."
    - id: "q4"
      type: "single"
      prompt: "Какое условие проверяет, что возраст от 18 до 64 включительно?"
      options:
        - "age >= 18 || age <= 64"
        - "age >= 18 && age <= 64"
        - "18 <= age <= 64"
        - "age > 18 && age < 64"
      answer: 1
      explanation: "Нужны обе границы одновременно, поэтому &&. Вариант с || истинен для любого числа; цепочка 18 <= age <= 64 вычисляется неверно; строгие знаки исключают 18 и 64."
    - id: "q5"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        const x = 4;
        if (x > 3) {
          console.log("а");
        }
        if (x > 1) {
          console.log("б");
        }
        ```
      options:
        - "а"
        - "б"
        - "а, затем б"
        - "Ничего"
      answer: 2
      explanation: "Это два отдельных if, а не цепочка else if. Каждое условие проверяется независимо, и обе истинны, поэтому печатаются обе строки."
exercise:
  id: "javascript.from-zero.if-else.exercise"
  title: "Знак, оценка и цена билета"
  prompt: |
    В файле `branches.mjs` три функции без тела. Напишите их:

    * `sign(n)` - возвращает `"положительное"`, `"отрицательное"` или `"ноль"` в зависимости от числа `n`.
    * `grade(score)` - возвращает оценку по баллам: от 90 - `"отлично"`, от 70 до 89 - `"хорошо"`, от 50 до 69 - `"удовлетворительно"`, меньше 50 - `"неудовлетворительно"`.
    * `entryPrice(age)` - возвращает цену билета в рублях: до 7 лет - `0`, от 7 до 17 лет - `150`, от 65 лет и старше - `200`, остальным - `400`.

    Функции должны возвращать значение, а не печатать. Часть тестов скрыта: они проверяют границы диапазонов (49 и 50, 17 и 18, 64 и 65), ноль и очень малые числа.
  entryFile: "branches.mjs"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.mjs"
  hints:
    - "В каждой функции нужна цепочка if / else if / else с return в каждой ветке."
    - "Проверяйте условия сверху вниз от самого узкого или самого раннего. Например, в grade сначала score >= 90, потом score >= 70, потом score >= 50."
    - "В entryPrice порядок такой: age < 7, затем age < 18, затем age >= 65, иначе 400. Для sign сравнивайте n с нулём: n > 0, n < 0, иначе ноль."
    - "Каркас: if (score >= 90) { return \"отлично\"; } else if (score >= 70) { return \"хорошо\"; } ... else { return \"неудовлетворительно\"; }"
  tests:
    - id: "sign-basic"
      title: "sign: три случая"
      hint: "Для 5 нужно «положительное», для -3 - «отрицательное», для 0 - «ноль»; слова пишутся именно так."
    - id: "grade-basic"
      title: "grade: четыре оценки"
      hint: "Баллы 95, 75, 55 и 20 попадают в разные ветки: отлично, хорошо, удовлетворительно, неудовлетворительно."
    - id: "price-basic"
      title: "entryPrice: четыре возраста"
      hint: "Возрасты 3, 12, 30 и 70 дают цены 0, 150, 400 и 200; цена - число, а не строка."
    - id: "sign-edge"
      title: "sign: очень малые числа (скрытый)"
      hidden: true
      hint: "Число 0.001 положительное, -0.001 отрицательное, ноль - только точный 0. Не округляйте число перед проверкой."
    - id: "grade-edge"
      title: "grade: границы диапазонов (скрытый)"
      hidden: true
      hint: "Границы входят в верхнюю оценку: 90 - отлично, 70 - хорошо, 50 - удовлетворительно; 89, 69 и 49 - на ступень ниже. Проверьте знак >= и порядок веток."
    - id: "price-edge"
      title: "entryPrice: границы возрастов (скрытый)"
      hidden: true
      hint: "6 лет бесплатно, 7 - уже 150; 17 - 150, 18 - 400; 64 - 400, 65 - 200. Проверьте, где нужны < и где >=."
