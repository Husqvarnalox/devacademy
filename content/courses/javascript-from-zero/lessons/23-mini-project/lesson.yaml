id: "javascript.from-zero.mini-project"
title: "Мини-проект: бюджет"
goal: "Собрать из изученного готовую программу: прочитать строки бюджета, посчитать итоги по категориям и учесть неверные строки."
difficulty: "easy"
estimatedMinutes: 60
prerequisites:
  - "javascript.from-zero.scope"
objectives:
  - "Разбить задачу на этапы: прочитать, разобрать строку, накопить итоги, вывести отчёт."
  - "Накапливать суммы по категориям в объекте и общий итог в отдельной переменной."
  - "Отличать неверные строки от пустых и считать их, не прерывая программу."
  - "Вывести категории в порядке сортировки и найти категорию с наибольшей суммой."
masteryCriteria:
  - "Отчёт точно совпадает с форматом из условия, включая два знака после запятой."
  - "Пустой ввод и ввод только из неверных строк обработаны без ошибок."
  - "Порядок категорий и выбор самой большой при равенстве соответствуют условию."
concepts:
  introduces: []
  uses:
    - "js.read-input"
    - "js.number-parsing"
    - "js.string-methods"
    - "js.for-of"
    - "js.break-continue"
    - "js.if"
    - "js.object"
    - "js.property"
    - "js.object-iteration"
    - "js.array-methods"
    - "js.comparison"
    - "js.logical-operators"
    - "js.let"
    - "js.const"
    - "js.scope"
next:
  - "javascript.first-steps.how-javascript-runs"
tags:
  - "javascript"
  - "project"
  - "input"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что выведет программа для строки `Еда 12 5`, если строка должна состоять ровно из двух частей?

        ```javascript
        const parts = "Еда 12 5".split(" ");
        console.log(parts.length);
        ```
      options:
        - "3, поэтому строка считается неверной"
        - "2, поэтому строка верная"
        - "1, потому что пробелы не разделяют"
        - "Ошибку"
      answer: 0
      explanation: "split(\" \") делит строку по каждому пробелу: получилось три части. Проверка parts.length !== 2 отправляет такую строку в неверные."
    - id: "q2"
      type: "single"
      prompt: "Как правильно добавить сумму к категории, которой в объекте totals ещё нет?"
      options:
        - "Сначала создать ключ с нулём: if (!(category in totals)) { totals[category] = 0; }, затем прибавить"
        - "Сразу totals[category] = totals[category] + amount;"
        - "Использовать totals.category = amount;"
        - "Объявить let category внутри цикла"
      answer: 0
      explanation: "У отсутствующего ключа значение undefined, а undefined + число даёт NaN. Поэтому ключ сначала создают с нулевой суммой. Запись totals.category ищет поле с буквальным именем category."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        console.log(["Рынок", "авто", "Еда"].toSorted());
        ```
      options:
        - "[ 'Еда', 'Рынок', 'авто' ]"
        - "[ 'авто', 'Еда', 'Рынок' ]"
        - "[ 'Рынок', 'Еда', 'авто' ]"
        - "[ 'Еда', 'авто', 'Рынок' ]"
      answer: 0
      explanation: "toSorted без компаратора сравнивает строки по кодам символов. Заглавные кириллические буквы имеют меньшие коды, чем строчные, поэтому «авто» оказывается в конце."
    - id: "q4"
      type: "single"
      prompt: "Почему в цикле перебора строк пустую строку нужно пропускать до вызова Number?"
      options:
        - "Number(\"\") равно 0, и пустая строка превратится в правильное на вид число"
        - "Number(\"\") выбрасывает ошибку"
        - "Number(\"\") равно NaN, и строка попадёт в неверные"
        - "Пустых строк в вводе не бывает"
      answer: 0
      explanation: "Пустая строка превращается в 0, поэтому Number.isNaN её не заметит. Проверка line === \"\" выполняется заранее, чтобы такие строки не считались ни данными, ни ошибками."
    - id: "q5"
      type: "single"
      prompt: |
        Нужно найти категорию с наибольшей суммой. Какое условие внутри цикла по отсортированным именам оставит при равенстве первую по алфавиту?

        ```javascript
        if (largest === "" || totals[name] > largestTotal) {
          largest = name;
          largestTotal = totals[name];
        }
        ```
      options:
        - "Строгое сравнение >: равная сумма не заменяет уже найденную категорию"
        - "Условие >= заменяет её на последнюю"
        - "Любое условие: порядок не важен"
        - "Условие нельзя написать без sort"
      answer: 0
      explanation: "Со строгим > категория, найденная раньше (по алфавиту), остаётся при равенстве сумм. С >= победила бы последняя из равных."
exercise:
  id: "javascript.from-zero.mini-project.exercise"
  title: "Бюджет по категориям"
  prompt: |
    Напишите программу `main.js`, которая читает со стандартного ввода записи расходов и печатает отчёт.

    **Формат ввода.** Каждая запись - строка вида `категория сумма`: название категории (одно слово без пробелов) и сумма, разделённые **ровно одним пробелом**. Сумма - число, возможно дробное (с точкой) или отрицательное (возврат).

    **Правила.**

    * Пробелы и символ возврата каретки по краям строки убираются (`trim`). Пустая строка после этого игнорируется совсем.
    * Строка **неверная**, если после `split(" ")` частей не две или вторая часть не превращается в число (`Number` даёт `NaN`). Неверные строки не участвуют в итогах, но считаются.
    * Названия категорий различаются по буквам и регистру: `Еда` и `еда` - разные категории.

    **Вывод.**

    1. По строке на каждую категорию: `название: сумма`, сумма с двумя знаками после запятой. Категории идут по возрастанию названия в порядке `toSorted()` без аргументов (по кодам символов: заглавные буквы раньше строчных).
    2. `Итого: сумма` - сумма всех верных записей, два знака.
    3. `Больше всего: название` - категория с наибольшей суммой. При равенстве - та, что раньше в отсортированном списке. Если верных записей нет - слово `нет`.
    4. `Неверных строк: число`.

    **Пример.** Ввод:

    ```
    Еда 250.50
    Транспорт 80
    Еда 99.50
    кино abc
    Дом 1200
    Транспорт 40.25
    ```

    Вывод:

    ```
    Дом: 1200.00
    Еда: 350.00
    Транспорт: 120.25
    Итого: 1670.25
    Больше всего: Дом
    Неверных строк: 1
    ```

    Строка `кино abc` неверная: сумма не число. Если верных записей нет, категорий в отчёте нет, и выводятся только три последние строки: `Итого: 0.00`, `Больше всего: нет`, `Неверных строк: N`.

    Чтение ввода в заготовке уже записано.
  entryFile: "main.js"
  evaluation: "io"
  hints:
    - "Разбейте работу на этапы и пишите по одному: 1) цикл по строкам с trim и пропуском пустых; 2) разбор строки: split(\" \"), проверка двух частей и Number.isNaN; 3) накопление в объекте totals и в переменной overall; 4) вывод. После каждого этапа печатайте промежуточный результат и сравнивайте с примером."
    - "Переменные для итогов (объект totals, общая сумма overall, счётчик malformed) объявите перед циклом, а внутри цикла только меняйте их, без нового let. Неверную строку учтите и перейдите к следующей командой continue."
    - "Суммы по категориям: if (!(category in totals)) { totals[category] = 0; } totals[category] = totals[category] + amount; Имена для вывода: Object.keys(totals).toSorted()."
    - "Самая большая категория: заведите let largest = \"\"; и let largestTotal = 0; В цикле по отсортированным именам: if (largest === \"\" || totals[name] > largestTotal) { largest = name; largestTotal = totals[name]; } Если после цикла largest пуста, выведите нет. Сумму печатайте как totals[name].toFixed(2)."
  tests:
    - id: "example"
      title: "Пример из условия"
      stdin: "Еда 250.50\nТранспорт 80\nЕда 99.50\nкино abc\nДом 1200\nТранспорт 40.25\n"
      expected: "Дом: 1200.00\nЕда: 350.00\nТранспорт: 120.25\nИтого: 1670.25\nБольше всего: Дом\nНеверных строк: 1\n"
      hint: "Категории идут по алфавиту: Дом, Еда, Транспорт. Строка «кино abc» неверная (сумма не число): она только увеличивает счётчик."
    - id: "clean"
      title: "Одна категория без неверных строк"
      stdin: "Еда 100\nЕда 50.5\n"
      expected: "Еда: 150.50\nИтого: 150.50\nБольше всего: Еда\nНеверных строк: 0\n"
      hint: "Две записи одной категории складываются: 100 + 50.5 = 150.5, печатается с двумя знаками - «150.50»."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      hidden: true
      stdin: ""
      expected: "Итого: 0.00\nБольше всего: нет\nНеверных строк: 0\n"
      hint: "Если записей нет, список категорий пуст. Выведите три итоговые строки: Итого 0.00, Больше всего «нет», Неверных строк 0. Пустая строка не считается неверной."
    - id: "all-bad"
      title: "Только неверные строки (скрытый)"
      hidden: true
      stdin: "а\nб в г\nx y\n"
      expected: "Итого: 0.00\nБольше всего: нет\nНеверных строк: 3\n"
      hint: "«а» - одна часть, «б в г» - три части, «x y» - сумма не число. Все три неверные."
    - id: "spaces-and-commas"
      title: "Лишние пробелы, десятичная запятая (скрытый)"
      hidden: true
      stdin: "  Еда 12  \nЕда  7\nХлеб 3,5\nХлеб 3.5\n"
      expected: "Еда: 12.00\nХлеб: 3.50\nИтого: 15.50\nБольше всего: Еда\nНеверных строк: 2\n"
      hint: "Пробелы по краям строки убирайте (trim). Два пробела внутри «Еда  7» дают три части - строка неверная. «3,5» с запятой не число."
    - id: "windows-and-case"
      title: "Окончания Windows, регистр в сортировке (скрытый)"
      hidden: true
      stdin: "Еда 10\r\n\r\nавто 5\r\nКино 10\r\n"
      expected: "Еда: 10.00\nКино: 10.00\nавто: 5.00\nИтого: 25.00\nБольше всего: Еда\nНеверных строк: 0\n"
      hint: "Строчная «авто» идёт после заглавных (сортировка по кодам). Символ возврата каретки убирает trim. У Еды и Кино суммы равны: побеждает та, что раньше в списке."
    - id: "tie-and-refunds"
      title: "Возвраты и равные суммы (скрытый)"
      hidden: true
      stdin: "Рынок 50\nКафе 50\nРынок -20\nКафе -20\n"
      expected: "Кафе: 30.00\nРынок: 30.00\nИтого: 60.00\nБольше всего: Кафе\nНеверных строк: 0\n"
      hint: "Отрицательное число - верная сумма (возврат): 50 - 20 = 30 у обеих категорий. При равенстве выбирается первая по алфавиту, значит условие сравнения строгое: >."
    - id: "negative-only"
      title: "Все суммы отрицательные (скрытый)"
      hidden: true
      stdin: "Дом -5\nЕда -10\n"
      expected: "Дом: -5.00\nЕда: -10.00\nИтого: -15.00\nБольше всего: Дом\nНеверных строк: 0\n"
      hint: "Самая большая сумма здесь -5. Нельзя начинать поиск максимума с 0: тогда ни одна категория не победит. Берите первую категорию как начальную."
