id: "javascript.from-zero.first-program"
title: "Первая программа"
goal: "Запустить программу на JavaScript и изменить текст, который она выводит."
difficulty: "intro"
estimatedMinutes: 20
prerequisites: []
objectives:
  - "Объяснить, что такое программа, исходный код, JavaScript и Node.js."
  - "Вывести текст на экран командой console.log и записать строку в кавычках."
  - "Написать несколько команд подряд и предсказать порядок вывода."
masteryCriteria:
  - "Ваша программа печатает ровно заданную строку, включая регистр и знаки препинания."
  - "Вы отличаете текст в кавычках (его печатают как есть) от имени команды (её вызывают)."
concepts:
  introduces:
    - "js.program"
    - "js.console-log"
    - "js.string-literal"
next:
  - "javascript.from-zero.reading-errors"
tags:
  - "javascript"
  - "node"
  - "console-log"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что такое Node.js в этом курсе?"
      options:
        - "Программа, которая читает текст на JavaScript и выполняет его на вашем компьютере."
        - "Редактор, в котором пишут код."
        - "Другое название языка JavaScript."
        - "Сайт, на котором хранятся программы."
      answer: 0
      explanation: "JavaScript - это язык, на котором вы пишете команды. Node.js - программа, которая эти команды выполняет. Приложение запускает её за вас командой node main.js."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        console.log("раз");
        console.log("два");
        ```
      options:
        - "раздва"
        - "раз два (в одной строке)"
        - "раз, а на следующей строке два"
        - "два, а на следующей строке раз"
      answer: 2
      explanation: "Команды выполняются сверху вниз, а console.log после текста переходит на новую строку. Поэтому «раз» и «два» оказываются на разных строках в том порядке, в каком написаны команды."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает команда?

        ```javascript
        console.log("Привет");
        ```
      options:
        - "\"Привет\" вместе с кавычками"
        - "Привет без кавычек"
        - "Ничего: нужна ещё одна команда"
        - "console.log"
      answer: 1
      explanation: "Кавычки только показывают, где начинается и где заканчивается текст. На экран попадает содержимое между ними."
    - id: "q4"
      type: "single"
      prompt: |
        В чём ошибка в этой команде?

        ```javascript
        console.log("Привет)
        ```
      options:
        - "Не закрыта кавычка: текст не заканчивается."
        - "Нельзя писать по-русски."
        - "Слово log нужно писать с заглавной буквы."
        - "Ошибки нет."
      answer: 0
      explanation: "У открывающей кавычки нет закрывающей, поэтому Node.js не может понять, где кончается текст, и сообщает SyntaxError. Регистр букв в console.log важен, но здесь записано верно."
exercise:
  id: "javascript.from-zero.first-program.exercise"
  title: "Измените выводимую строку"
  prompt: |
    В редакторе уже есть рабочая программа: она печатает приветствие. Измените её так, чтобы она печатала ровно одну строку:

    ```
    Я учусь программировать на JavaScript!
    ```

    Менять нужно только текст в кавычках. Регистр букв, пробелы и восклицательный знак важны.
  entryFile: "main.js"
  evaluation: "io"
  hints:
    - "Найдите в программе команду console.log: нужный текст находится между кавычками."
    - "Замените всё, что стоит между кавычками, на нужную фразу. Сами кавычки, скобки и точку с запятой оставьте."
    - "Должно получиться console.log(\"Я учусь программировать на JavaScript!\");"
  tests:
    - id: "basic"
      title: "Печатается нужная фраза"
      stdin: ""
      expected: |
        Я учусь программировать на JavaScript!
      hint: "Программа должна напечатать одну строку: Я учусь программировать на JavaScript!"
    - id: "exact"
      title: "Точный текст и одна строка (скрытый)"
      stdin: ""
      expected: |
        Я учусь программировать на JavaScript!
      hidden: true
      hint: "Проверяется точное совпадение: заглавная Я, пробелы между словами, восклицательный знак в конце и никаких лишних строк."
