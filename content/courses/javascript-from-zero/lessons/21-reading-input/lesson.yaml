id: "javascript.from-zero.reading-input"
title: "Чтение ввода"
goal: "Прочитать вход программы, разбить его на строки, превратить строки в числа и отличить настоящие числа от текста."
difficulty: "easy"
estimatedMinutes: 45
prerequisites:
  - "javascript.from-zero.errors-and-exceptions"
objectives:
  - "Прочитать весь стандартный ввод командой readFileSync(0, \"utf8\") и объяснить каждую часть записи."
  - "Разбить ввод на строки через trim и split и обойти строки циклом."
  - "Превратить строку в число функцией Number и распознать неудачу через Number.isNaN."
  - "Вывести число с двумя знаками после запятой методом toFixed(2)."
masteryCriteria:
  - "Программа верно считает количество, сумму и среднее на обычных входных данных."
  - "Пустой ввод и ввод без чисел не приводят к ошибке и к делению на ноль."
  - "Пустые строки пропускаются без счёта, нечисловые строки считаются как пропущенные, окончания строк Windows не мешают."
concepts:
  introduces:
    - "js.read-input"
    - "js.number-parsing"
  uses:
    - "js.string-methods"
    - "js.array"
    - "js.for-of"
    - "js.break-continue"
    - "js.if"
    - "js.const"
    - "js.let"
    - "js.number"
    - "js.string"
    - "js.console-log"
    - "js.concatenation"
    - "js.arithmetic"
    - "js.comparison"
    - "js.logical-operators"
next:
  - "javascript.from-zero.scope"
tags:
  - "javascript"
  - "input"
  - "stdin"
  - "number"
  - "nan"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что делает запись readFileSync(0, \"utf8\") в начале программы?"
      options:
        - "Читает весь стандартный ввод и возвращает его как одну строку."
        - "Читает файл с именем 0."
        - "Читает только первую строку ввода."
        - "Печатает 0 в кодировке utf8."
      answer: 0
      explanation: "Число 0 - номер стандартного ввода (stdin), а не имя файла. Кодировка \"utf8\" нужна, чтобы получить текст (с кириллицей), а не набор байтов. Результат - одна строка со всем вводом."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        console.log(Number("42") + 1);
        console.log("42" + 1);
        ```
      options:
        - "43 и 421"
        - "43 и 43"
        - "421 и 421"
        - "421 и 43"
      answer: 0
      explanation: "Number(\"42\") превращает строку в число 42, и сложение даёт 43. Без Number оператор + склеивает строку «42» с единицей, получается строка «421»."
    - id: "q3"
      type: "single"
      prompt: |
        Как правильно проверить, что Number("abc") не удалось?

        ```javascript
        const value = Number("abc");
        ```
      options:
        - "Number.isNaN(value)"
        - "value === NaN"
        - "value === undefined"
        - "value === \"abc\""
      answer: 0
      explanation: "Number(\"abc\") возвращает специальное значение NaN («не число»). NaN не равно ничему, даже самому себе, поэтому value === NaN всегда ложно. Для проверки есть Number.isNaN."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        console.log(Number(""));
        ```
      options:
        - "0"
        - "NaN"
        - "undefined"
        - "Ошибка"
      answer: 0
      explanation: "Пустая строка (и строка из одних пробелов) превращается в 0, а не в NaN. Поэтому пустые строки из ввода нужно отсеивать до вызова Number, иначе они будут считаться нулями."
    - id: "q5"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```javascript
        console.log((14.75 / 3).toFixed(2));
        ```
      options:
        - "4.92"
        - "4.9166"
        - "5"
        - "4.91"
      answer: 0
      explanation: "toFixed(2) округляет число до двух знаков после запятой и возвращает строку: 4.91666... превращается в «4.92»."
exercise:
  id: "javascript.from-zero.reading-input.exercise"
  title: "Числа из ввода: количество, сумма, среднее"
  prompt: |
    Напишите программу `main.js`, которая читает строки со стандартного ввода. Каждая строка - число или произвольный текст.

    Правила:

    * Строки, которые после удаления пробелов по краям пусты, **игнорируются** совсем (не числа и не пропущенные).
    * Если строка (без пробелов по краям) превращается в число функцией `Number`, она считается числом.
    * Остальные строки (например, `abc`, `12px`, `3,5`) считаются пропущенными.

    Выведите ровно четыре строки: количество чисел, их сумму и среднее с двумя знаками после запятой, затем число пропущенных строк. Если чисел нет, сумма и среднее равны `0.00`.

    Пример. Ввод:

    ```
    4.5
    abc
    3

    7.25
    ```

    Вывод:

    ```
    Чисел: 3
    Сумма: 14.75
    Среднее: 4.92
    Пропущено: 1
    ```

    Чтение ввода в заготовке уже записано. Скрытые тесты проверяют пустой ввод, ввод без чисел, отрицательные числа и окончания строк Windows.
  entryFile: "main.js"
  evaluation: "io"
  hints:
    - "Заготовка уже читает ввод в text. Разбейте его на строки, обойдите строки циклом, а в цикле для каждой строки решите: пустая, число или не число. Понадобятся три счётчика: количество чисел, сумма и пропущенные."
    - "Каждую строку сначала очистите от пробелов по краям: line.trim() (это же убирает лишний символ возврата каретки в окончаниях Windows). Пустую строку пропускайте через continue. Для остальных: const value = Number(line); и проверка Number.isNaN(value)."
    - "Среднее считайте только если count больше нуля, иначе в результате будет деление 0 на 0. Вывод: console.log(\"Сумма: \" + sum.toFixed(2)); для среднего аналогично."
    - "Скелет: const lines = text.trim().split(\"\\n\"); let count = 0; let sum = 0; let skipped = 0; for (const rawLine of lines) { const line = rawLine.trim(); if (line === \"\") { continue; } const value = Number(line); if (Number.isNaN(value)) { skipped++; } else { count++; sum = sum + value; } } затем среднее и четыре console.log."
  tests:
    - id: "basic"
      title: "Целые числа без пропусков"
      stdin: "10\n20\n30\n"
      expected: "Чисел: 3\nСумма: 60.00\nСреднее: 20.00\nПропущено: 0\n"
      hint: "Три числа, сумма 60, среднее 20; все значения печатаются с двумя знаками после запятой, включая «60.00»."
    - id: "mixed"
      title: "Дробные числа, текст и пустая строка (пример из условия)"
      stdin: "4.5\nabc\n3\n\n7.25\n"
      expected: "Чисел: 3\nСумма: 14.75\nСреднее: 4.92\nПропущено: 1\n"
      hint: "«abc» - пропущенная строка, пустая строка не считается ни числом, ни пропущенной. Среднее 14.75 / 3 округляется до 4.92."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      hidden: true
      stdin: ""
      expected: "Чисел: 0\nСумма: 0.00\nСреднее: 0.00\nПропущено: 0\n"
      hint: "Когда ввода нет, программа не должна падать и делить на ноль: чисел 0, сумма и среднее 0.00. Пустая строка не считается пропущенной."
    - id: "no-numbers"
      title: "Одни слова (скрытый)"
      hidden: true
      stdin: "привет\nмир\n12px\n"
      expected: "Чисел: 0\nСумма: 0.00\nСреднее: 0.00\nПропущено: 3\n"
      hint: "Строки «привет», «мир» и «12px» не числа, поэтому все три пропущены. Среднее при отсутствии чисел - 0.00."
    - id: "negative-and-windows"
      title: "Отрицательные числа, пробелы, десятичная запятая, окончания Windows (скрытый)"
      hidden: true
      stdin: "  -5 \r\n10\r\n3,5\r\n\r\n"
      expected: "Чисел: 2\nСумма: 5.00\nСреднее: 2.50\nПропущено: 1\n"
      hint: "Пробелы и символ возврата каретки по краям строки нужно убрать (trim). «3,5» с запятой Number не превращает в число, это пропущенная строка. Отрицательные числа складываются как обычно."
    - id: "blank-lines"
      title: "Пустые строки и нули (скрытый)"
      hidden: true
      stdin: "\n\n0\n\n0\n   \n"
      expected: "Чисел: 2\nСумма: 0.00\nСреднее: 0.00\nПропущено: 0\n"
      hint: "Пустые строки и строки из пробелов игнорируются: Number(\"\") равно 0, и если их не отсеять, количество чисел будет неверным. Настоящие нули учитываются."
