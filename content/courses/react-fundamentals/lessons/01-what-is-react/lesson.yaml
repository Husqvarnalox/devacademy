id: "react.fundamentals.what-is-react"
title: "Что такое React: компоненты и JSX"
goal: "Объяснить декларативный подход React, написать функциональные компоненты на JSX и понимать, во что превращается JSX и чем рендер отличается от коммита."
difficulty: "intro"
estimatedMinutes: 50
prerequisites: []
objectives:
  - "Объяснить, что значит «декларативный интерфейс» и чем он отличается от ручной правки DOM."
  - "Написать функциональный компонент, принимающий props и возвращающий JSX."
  - "Назвать, во что преобразуется JSX (jsx/createElement) и что такое React-элемент."
  - "Различать фазы рендера и коммита и объяснить, почему рендер должен быть чистым."
  - "Описать утверждение про виртуальный DOM точно, без упрощений."
masteryCriteria:
  - "Вы выражаете условия и повторение в JSX выражениями (? :, &&, map), а не инструкциями."
  - "Вы не меняете props и не делаете побочных действий в теле компонента."
  - "Вы можете по JSX сказать, какой объект-элемент получится."
related: []
next:
  - "react.fundamentals.props-composition-keys"
tags:
  - "react"
  - "jsx"
  - "components"
facts:
  - kind: "internals"
    text: "Начиная с автоматического JSX runtime (React 17) компилятор превращает JSX в вызовы jsx из react/jsx-runtime, и импортировать React в каждом файле ради JSX больше не нужно. Результат вызова - тот же React-элемент, что даёт createElement."
    sources:
      - "https://react.dev/blog/2020/09/22/introducing-the-new-jsx-transform"
  - kind: "misconception"
    text: "«React быстр благодаря виртуальному DOM» - упрощение. Дерево описаний нужно, чтобы вычислять различия и не писать правки вручную; ручное точечное изменение DOM не медленнее. В актуальной документации React вместо термина «виртуальный DOM» говорят о рендере и коммите."
  - kind: "historical"
    text: "ReactDOM.render, ReactDOM.hydrate и ReactDOM.unmountComponentAtNode удалены в React 19: приложение запускается через createRoot и hydrateRoot из react-dom/client."
    sources:
      - "https://react.dev/blog/2024/04/25/react-19-upgrade-guide"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что возвращает вызов React.createElement(\"h1\", null, \"Привет\")?"
      options:
        - "Узел DOM h1, уже вставленный на страницу."
        - "Строку \"<h1>Привет</h1>\"."
        - "Обычный объект-описание (React-элемент) с полями type и props."
        - "Функцию-компонент."
      answer: 2
      explanation: "createElement ничего не вставляет в DOM: он возвращает объект-описание. Вставкой в DOM занимается React на фазе коммита."
    - id: "q2"
      type: "multiple"
      prompt: "Какие записи в JSX допустимы внутри фигурных скобок {...}?"
      options:
        - "{items.map((x) => <li key={x}>{x}</li>)}"
        - "{ok ? <b>да</b> : <i>нет</i>}"
        - "{if (ok) { return <b>да</b>; }}"
        - "{ok && <b>да</b>}"
      answer:
        - 0
        - 1
        - 3
      explanation: "В скобках пишется выражение. if - инструкция, поэтому вместо неё используют тернарный оператор, && или map."
    - id: "q3"
      type: "single"
      prompt: "Почему <productCard /> не вызовет ваш компонент ProductCard?"
      options:
        - "Имя с маленькой буквы считается обычным HTML-тегом, а не компонентом."
        - "JSX не позволяет использовать camelCase."
        - "Компоненты нужно вызывать только как функции."
        - "ProductCard должен быть классом."
      answer: 0
      explanation: "Компилятор отличает компонент от тега по заглавной букве в имени."
    - id: "q4"
      type: "single"
      prompt: "Что происходит на фазе рендера?"
      options:
        - "React вносит изменения в DOM."
        - "React вызывает функции-компоненты и получает описание интерфейса; DOM на этом шаге не меняется."
        - "Браузер перерисовывает пиксели."
        - "React отправляет данные на сервер."
      answer: 1
      explanation: "Рендер - вычисление описания. Изменение DOM происходит позже, на коммите."
    - id: "q5"
      type: "short"
      prompt: "Как называется второй этап обновления (после рендера), на котором React вносит различия в DOM? Одно слово."
      answer:
        - "коммит"
        - "commit"
      explanation: "Рендер вычисляет описание, коммит применяет различия к DOM."
exercise:
  id: "react.fundamentals.what-is-react.exercise"
  title: "Карточки товаров"
  prompt: |
    Нужно написать три маленьких модуля интерфейса магазина. Они проверяются настоящим Testing Library в окружении jsdom.

    **`src/format.js`** - `formatPrice(cents)` переводит копейки в строку: `1250` -> `"12.50 ₽"`, `5` -> `"0.05 ₽"`. Копеек всегда две цифры.

    **`src/ProductCard.jsx`** - компонент `ProductCard({ name, cents, inStock })`. Он возвращает `<article>` с заголовком `<h3>` с названием, абзацем `<p>` с ценой (через `formatPrice`) и:

    * если товар в наличии (`inStock`) - кнопкой `<button type="button">Купить</button>`;
    * иначе - абзацем `Нет в наличии` и без кнопки.

    **`src/ProductList.jsx`** - компонент `ProductList({ products })`. Каждый товар `{ id, name, cents, inStock }` отображается карточкой внутри `<li>` общего `<ul>`. У каждого `<li>` должен быть `key={product.id}`. Для пустого массива вернуть только абзац `Список пуст` (без `<ul>`).

    Компоненты должны быть чистыми: ничего не менять в props и ничего не хранить вне функции. Тесты лежат в скрытой папке `tests/`, кнопка «Проверить» запускает Vitest.
  evaluation: "command"
  languageId: "javascript"
  entryFile: "src/format.js"
  starter: "exercise/starter"
  solution: "exercise/solution"
  tests_dir: "exercise/tests"
  requires:
    node: ">=22"
    npmPackages: ["vitest", "jsdom", "react", "react-dom", "@testing-library/react"]
  command:
    tool: "vitest"
    args: ["--reporter=default", "--reporter=junit", "--outputFile=report.xml"]
    testsTarget: "."
    report: "junit"
    reportFile: "report.xml"
    timeoutSeconds: 60
  hints:
    - "Начните с formatPrice: рубли это Math.floor(cents / 100), копейки - cents % 100, дополненные слева нулём до двух цифр (padStart(2, \"0\"))."
    - "ProductCard возвращает <article>. Внутри: <h3>{name}</h3>, <p>{formatPrice(cents)}</p> и выражение inStock ? <button type=\"button\">Купить</button> : <p>Нет в наличии</p>."
    - "ProductList: для пустого массива сразу верните <p>Список пуст</p>. Иначе <ul>, а внутри products.map(...) возвращает <li key={product.id}> с <ProductCard ... />."
    - "Передавайте в ProductCard отдельные поля (name, cents, inStock), а не меняйте объект товара. Не используйте индекс массива как key: у товара есть id."
  tests:
    - id: "format-basic"
      title: "formatPrice: рубли и копейки"
      match: "formatPrice > рубли и копейки"
      hint: "1250 копеек - это 12 рублей 50 копеек: \"12.50 ₽\"."
    - id: "card-heading"
      title: "ProductCard: название заголовком"
      match: "ProductCard > показывает название заголовком"
      hint: "Название должно быть в элементе <h3> (роль heading)."
    - id: "card-price"
      title: "ProductCard: цена"
      match: "ProductCard > показывает цену"
      hint: "Отформатируйте цену через formatPrice и поместите в абзац."
    - id: "card-buy"
      title: "ProductCard: кнопка при наличии"
      match: "ProductCard > в наличии*"
      hint: "Если inStock истинно, нужна кнопка «Купить», а надписи «Нет в наличии» быть не должно."
    - id: "format-pad"
      title: "formatPrice: двузначные копейки (скрытый)"
      match: "formatPrice > копейки всегда двузначные"
      hidden: true
      hint: "5 копеек это \"0.05\", а не \"0.5\": используйте padStart."
    - id: "card-out"
      title: "ProductCard: нет в наличии (скрытый)"
      match: "ProductCard > нет в наличии*"
      hidden: true
      hint: "Когда товара нет, вместо кнопки выводится только надпись."
    - id: "card-pure"
      title: "ProductCard: чистота (скрытый)"
      match: "ProductCard > результат зависит*"
      hidden: true
      hint: "Не храните результат вне функции: вывод целиком определяется текущими props."
    - id: "card-frozen"
      title: "ProductCard: не меняет props (скрытый)"
      match: "ProductCard > не изменяет*"
      hidden: true
      hint: "Не присваивайте ничего в props и не вызывайте у них мутирующих методов."
    - id: "list"
      title: "ProductList: список и пустой случай (скрытый)"
      match: "ProductList*"
      hidden: true
      hint: "Пустой массив даёт абзац «Список пуст», непустой - <ul> с <li> на каждый товар, внутри каждого карточка."
