      stdin: "PUT /products/1 | h:If-Match=\"stale\" | b:{\"name\":\"Tea\",\"price\":260}\nGET /products/1\nPUT /products/1 | h:If-Match=\"1f960670d1dc8fe7\" | b:{\"name\":\"Tea\",\"price\":260}\nGET /products/1\n"
      expected: "412 -\n200 application/json {\"id\":1,\"name\":\"Tea\",\"price\":250}\n  ETag: \"1f960670d1dc8fe7\"\n200 application/json {\"id\":1,\"name\":\"Tea\",\"price\":260}\n  ETag: \"ecd4f15431c7e0f7\"\n200 application/json {\"id\":1,\"name\":\"Tea\",\"price\":260}\n  ETag: \"ecd4f15431c7e0f7\"\n"
      hint: "Устаревшая метка - 412 и товар не меняется; верная - 200 с новым ETag."
