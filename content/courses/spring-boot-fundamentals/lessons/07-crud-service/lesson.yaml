    - id: "precedence"
      title: "Порядок проверок (скрытый)"
      stdin: "PUT /products/99 | h:If-Match=\"x\" | b:{\"name\":\"X\",\"price\":1}\nPUT /products/1 | h:If-Match=\"x\" | b:{\"name\":\"\",\"price\":1}\nGET /products/99 | h:If-None-Match=\"x\"\nPUT /products/1 | h:If-Match=\"x\" | b:{\"name\":\"Tea\",\"price\":251}\nGET /products/1\nGET /products/3\n"
      expected: "404 application/problem+json {\"detail\":\"Product 99 does not exist\",\"instance\":\"/products/99\",\"status\":404,\"title\":\"Product not found\",\"type\":\"https://example.com/problems/product-not-found\"}\n400 application/problem+json {\"detail\":\"Invalid request content.\",\"instance\":\"/products/1\",\"status\":400,\"title\":\"Bad Request\"}\n404 application/problem+json {\"detail\":\"Product 99 does not exist\",\"instance\":\"/products/99\",\"status\":404,\"title\":\"Product not found\",\"type\":\"https://example.com/problems/product-not-found\"}\n412 -\n200 application/json {\"id\":1,\"name\":\"Tea\",\"price\":250}\n  ETag: \"1f960670d1dc8fe7\"\n200 application/json {\"id\":3,\"name\":\"Cocoa\",\"price\":300}\n  ETag: \"5623e78e448e08bc\"\n"
      hidden: true
