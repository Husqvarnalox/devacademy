      stdin: "GET /products/2 | h:If-None-Match=\"aaa\", W/\"01885fc8868fd4af\"\nGET /products/2 | h:If-None-Match=\"aaa\", \"bbb\"\nGET /products/2 | h:If-None-Match=W/\"zzz\"\n"
      expected: "304 -\n  ETag: \"01885fc8868fd4af\"\n200 application/json {\"id\":2,\"name\":\"Coffee\",\"price\":400}\n  ETag: \"01885fc8868fd4af\"\n200 application/json {\"id\":2,\"name\":\"Coffee\",\"price\":400}\n  ETag: \"01885fc8868fd4af\"\n"
