      stdin: "PUT /products/2 | b:{\"name\":\"Coffee\",\"price\":410}\nPUT /products/2 | h:If-Match=* | b:{\"name\":\"Coffee\",\"price\":420}\nPUT /products/2 | h:If-Match=\"01885fc8868fd4af\" | b:{\"name\":\"Coffee\",\"price\":430}\nGET /products/2\n"
      expected: "200 application/json {\"id\":2,\"name\":\"Coffee\",\"price\":410}\n  ETag: \"0e4da7498eac3780\"\n200 application/json {\"id\":2,\"name\":\"Coffee\",\"price\":420}\n  ETag: \"cf5ba08630bb40f0\"\n412 -\n200 application/json {\"id\":2,\"name\":\"Coffee\",\"price\":420}\n  ETag: \"cf5ba08630bb40f0\"\n"
