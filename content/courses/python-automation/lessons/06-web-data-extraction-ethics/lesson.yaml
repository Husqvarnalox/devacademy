id: python.automation.web-data-extraction-ethics
title: "Извлечение данных из веба: HTML, robots.txt и этика"
goal: Разбирать HTML средствами стандартной библиотеки в устойчивые структурированные данные и делать это только допустимыми способами - с учётом robots.txt, условий использования, лимитов и границ доступа.
difficulty: hard
estimatedMinutes: 100
prerequisites: [python.fundamentals.strings, python.advanced.inheritance-composition-protocols, python.automation.robust-http-clients, python.automation.logging-config-and-secrets]
related: [python.automation.robust-http-clients, python.automation.batch-processing-csv-reports]
next: []
seeAlso:
  - "Сторонние парсеры (BeautifulSoup, lxml) и фреймворки (Scrapy) - планируются после поддержки окружений Python"
  - "Браузерная автоматизация (Playwright) для тестирования собственных страниц - планируется отдельно"
objectives:
  - "Разобрать HTML модулем html.parser: извлечь ссылки и таблицы из локальных фикстур, устойчиво к незакрытым тегам, сущностям и нестандартной разметке."
  - Превратить таблицу в структурированные записи с явными ошибками вместо тихо пустых данных.
  - Проверять разрешения robots.txt кодом (urllib.robotparser) и соблюдать Crawl-delay и собственный минимум паузы.
  - "Перечислить, что допустимо и что недопустимо при сборе данных: условия использования, лимиты, аутентификация, персональные данные, обход защит."
  - Предпочитать официальные API и выгрузки данных парсингу страниц, когда они существуют.
masteryCriteria:
  - Вы пишете парсер, который на изменённой или сломанной разметке выдаёт явную ошибку или пустой результат с диагностикой, а не неверные данные.
  - Вы объясняете, почему robots.txt - это соглашение о вежливости для краулеров, а не средство защиты, и почему отсутствие запрета не равно разрешению.
  - "Вы называете случаи, когда автоматизацию следует прекратить: требование входа, CAPTCHA, платный доступ, явный запрет в условиях, персональные данные."
tags: [python, automation, html, html-parser, robots-txt, scraping, ethics, compliance, privacy]
facts:
  - kind: internals
    text: >-
      Класс html.parser.HTMLParser - событийный разборщик: вы наследуете его и переопределяете handle_starttag, handle_endtag, handle_data; он терпим к нестрогой разметке, но не строит дерево
      и не исправляет её по правилам HTML5. Параметр convert_charrefs=True (по умолчанию) преобразует сущности вроде &amp; в символы. Имена тегов и атрибутов приходят в нижнем регистре.
    sources:
      - https://docs.python.org/3/library/html.parser.html
  - kind: internals
    text: >-
      urllib.robotparser.RobotFileParser разбирает robots.txt: parse(lines) принимает уже полученные строки, can_fetch(useragent, url) отвечает, разрешён ли адрес, а crawl_delay(useragent) возвращает
      значение Crawl-delay или None, если оно не задано. Если robots.txt пуст, разбор разрешает всё.
    sources:
      - https://docs.python.org/3/library/urllib.robotparser.html
  - kind: security
    text: >-
      Стандарт Robots Exclusion Protocol (RFC 9309) прямо указывает, что его правила не являются формой авторизации доступа и не заменяют настоящих мер защиты контента: он выражает пожелания владельца сайта
      к автоматическим клиентам. Закрытые данные защищают аутентификацией, а не robots.txt, и наоборот: отсутствие запрета в robots.txt не даёт права обходить условия использования или авторизацию.
    sources:
      - https://www.rfc-editor.org/rfc/rfc9309.html
  - kind: security
    text: >-
      Статус 401 (Unauthorized) означает, что запрос требует аутентификации, а 403 (Forbidden) - что сервер понял запрос, но отказывается его выполнять. Ответы 401 и 403 при автоматическом сборе - сигнал остановиться
      и выяснить права доступа, а не повод подбирать обходные пути.
    sources:
      - https://www.rfc-editor.org/rfc/rfc9110.html#name-401-unauthorized
      - https://www.rfc-editor.org/rfc/rfc9110.html#name-403-forbidden
  - kind: real-world
    text: >-
      Общий регламент ЕС по защите данных (GDPR) применяется к персональным данным и тогда, когда они опубликованы в открытом доступе: для их обработки нужно законное основание (статья 6).
      Поэтому сбор и хранение персональных данных с веб-страниц требует отдельной оценки и, как правило, не входит в задачи учебной автоматизации.
    sources:
      - https://eur-lex.europa.eu/eli/reg/2016/679/oj
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: В robots.txt нет правила Disallow для нужного раздела, но условия использования сайта запрещают автоматический сбор. Что делать?
      options:
        - "Собирать: robots.txt разрешает"
        - "Не собирать без разрешения: условия использования и права владельца важнее отсутствия запрета в robots.txt; поискать официальный API или запросить разрешение"
        - "Собирать, но в 10 потоков"
        - "Подменить User-Agent на браузерный"
      answer: 1
      explanation: >-
        robots.txt - только один из сигналов. Условия использования и право на данные остаются в силе; вежливый путь - API, выгрузка или разрешение владельца.
    - id: q2
      type: single
      prompt: Парсер вернул пустой список, потому что вёрстка страницы изменилась. Как это должно проявиться в хорошем скрипте?
      options:
        - "Скрипт молча записывает пустой результат"
        - "Скрипт сообщает об ошибке или предупреждении (ожидаемая таблица не найдена) и не перезаписывает прежние данные пустыми"
        - "Скрипт перебирает селекторы, пока что-нибудь не найдёт"
        - "Скрипт перезапускается бесконечно"
      answer: 1
      explanation: >-
        Тихо пустые данные хуже явной ошибки: они выглядят как «на сайте ничего нет». Проверяйте инварианты (нужные столбцы, минимум строк) и падайте с диагностикой.
    - id: q3
      type: multiple
      prompt: Что недопустимо в рамках этичной автоматизации? Выберите все.
      options:
        - "Обход CAPTCHA или платного доступа (paywall)"
        - "Игнорирование robots.txt при массовом обходе сайта"
        - "Сбор персональных данных людей без законного основания"
        - "Разбор сохранённой локально страницы, к которой у вас есть доступ"
      answer: [0, 1, 2]
      explanation: >-
        Обход защит, игнорирование правил для краулеров и массовый сбор персональных данных недопустимы. Разбор собственной локальной копии - обычная работа с данными.
    - id: q4
      type: single
      prompt: Сервер ответил 403 Forbidden на запрос страницы. Что разумно?
      options:
        - "Менять заголовки и IP, пока не пустит"
        - "Остановиться: доступ запрещён; выяснить права, использовать официальный API или запросить разрешение"
        - "Повторять запрос раз в секунду"
        - "Считать 403 временной ошибкой и применить экспоненциальную задержку"
      answer: 1
      explanation: >-
        403 означает отказ в доступе, а не временную неполадку. Обход ограничения - это попытка несанкционированного доступа; повторы тоже бессмысленны.
    - id: q5
      type: single
      prompt: Зачем в HTMLParser накапливать текст между handle_starttag и handle_endtag, а не присваивать последнее значение handle_data?
      options:
        - "Текст внутри элемента может приходить несколькими вызовами (вперемешку с вложенными тегами)"
        - "handle_data вызывается только один раз за документ"
        - "Это быстрее"
        - "handle_data не получает текст внутри ячеек"
      answer: 0
      explanation: >-
        Разборщик событийный: вложенные теги и сущности разбивают текст на несколько событий, поэтому фрагменты накапливают и склеивают при закрытии элемента.
exercise:
  id: python.automation.web-data-extraction-ethics.exercise
  title: Разбор локальных HTML-фикстур и robots.txt
  prompt: |
    Работайте только с **локальными строками**: никаких запросов в сеть. В файле `extract.py` реализуйте:

    1. `extract_links(html, base_url)` - абсолютные `http`/`https`-ссылки из `<a href>` в порядке появления, без повторов. Относительные разрешайте через `urljoin(base_url, href)`; фрагмент `#...` отбрасывайте; ссылки только из фрагмента и пустые пропускайте; схемы `mailto:`, `javascript:`, `tel:`, `ftp:` пропускайте. Разметка может быть кривой: незакрытые теги, атрибуты без кавычек, теги в верхнем регистре.
    2. `extract_tables(html)` - список таблиц верхнего уровня; таблица - список строк; строка - список текстов ячеек (`th` и `td` одинаково). В тексте ячейки теги убраны, пробельные символы (в том числе неразрывные) схлопнуты в один пробел, сущности декодированы, `<br>` даёт пробел, `script`/`style` игнорируются. Устойчивость: незакрытые `<td>`, `<tr>`, `<table>` (конец входа закрывает всё), ячейка вне `<tr>`, строки без ячеек пропускаются, вложенные таблицы внутри ячейки игнорируются целиком.
    3. `table_to_records(table)` - строки таблицы -> словари по заголовку (первая строка). Пустая таблица, пустые или повторяющиеся заголовки - `ValueError`; строка с большим числом ячеек, чем в заголовке, - `ValueError` с номером строки (заголовок - строка 1); с меньшим - недостающие значения `""`.
    4. `allowed_urls(robots_text, user_agent, urls)` - через `urllib.robotparser.RobotFileParser.parse` вернуть `(разрешённые адреса в исходном порядке, crawl_delay или None)`.
    5. `politeness_interval(crawl_delay, minimum=1.0)` - пауза между запросами как `float`: ваш минимум, но не меньше `Crawl-delay` сайта.

    ```python
    extract_tables("<table><tr><th>A<th>B<tr><td>1<td>2</table>")   # [[["A", "B"], ["1", "2"]]]
    ```
  entryFile: extract.py
  evaluation: harness
  harness: exercise/harness
  harnessEntry: check.py
  hints:
    - "Для ссылок и таблиц нужны два небольших подкласса HTMLParser. Для ссылок достаточно handle_starttag (tag == 'a'); для таблиц - состояние: глубина вложенности таблиц, текущая строка, текущая ячейка (список фрагментов текста)."
    - "Таблицы: на <tr> закройте текущую ячейку и строку, откройте новую строку; на <td>/<th> закройте текущую ячейку и откройте новую; handle_data добавляет фрагмент, только если открыта ячейка и глубина равна 1; на </table> при глубине 1 закройте строку и сохраните таблицу. После feed вызовите close и закройте всё, что осталось открытым."
    - "Текст: ' '.join(text.split()) схлопывает любые пробельные символы, включая \\xa0. Ссылки: url, _ = urldefrag(urljoin(base, href)); urlsplit(url).scheme in ('http', 'https'); множество seen для повторов; href.startswith('#') пропускайте до urljoin."
    - "robots: parser = urllib.robotparser.RobotFileParser(); parser.parse(text.splitlines()); [u for u in urls if parser.can_fetch(ua, u)]; parser.crawl_delay(ua). politeness_interval: float(minimum) при None, иначе float(max(delay, minimum))."
  tests:
    - id: links-basic
      title: extract_links - относительные ссылки, фрагменты, служебные схемы
      hint: Склейте с base_url через urljoin, уберите фрагмент, оставьте только http и https и не повторяйтесь.
    - id: tables-basic
      title: extract_tables - две таблицы, сущности, пробелы
      hint: Текст ячейки склеивайте из фрагментов handle_data и нормализуйте пробелы; caption в таблицу не входит.
    - id: robots-basic
      title: allowed_urls - простой robots.txt
      hint: Используйте RobotFileParser.parse(text.splitlines()) и can_fetch(user_agent, url).
    - id: links-filter
      title: Кривая разметка и фильтры ссылок (скрытый)
      hidden: true
      hint: HTMLParser приводит имена тегов и атрибутов к нижнему регистру; значения href обрежьте strip(); протокол-относительная ссылка '//host/x' наследует схему базы.
    - id: tables-malformed
      title: Незакрытые теги, script, вложенные таблицы (скрытый)
      hidden: true
      hint: Следующие <tr>/<td>/<th> неявно закрывают предыдущие; на конце входа закройте всё; текст script игнорируйте, вложенную таблицу пропустите по глубине.
    - id: records
      title: table_to_records - заголовок и ошибки (скрытый)
      hidden: true
      hint: Проверяйте заголовок (непустой, уникальный); лишние ячейки - ValueError с номером строки, недостающие - пустая строка; только заголовок даёт [].
    - id: robots-edge
      title: Группы User-agent, Crawl-delay, пустой файл, politeness_interval (скрытый)
      hidden: true
      hint: RobotFileParser сам выбирает группу для агента и запасную '*'; пустой текст разрешает всё; crawl_delay возвращает None, если не задан.
