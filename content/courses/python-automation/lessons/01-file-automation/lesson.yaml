id: python.automation.file-automation
title: "Автоматизация файлов: безопасный организатор"
goal: Написать скрипт, который раскладывает файлы по папкам с сухим прогоном, идемпотентно, без затирания существующих файлов и без выхода за пределы корневого каталога.
difficulty: medium
estimatedMinutes: 90
prerequisites: [python.stdlib.pathlib-os-shutil-tempfile, python.fundamentals.errors-and-files, python.stdlib.datetime-and-time]
related: [python.automation.batch-processing-csv-reports]
next: [python.automation.batch-processing-csv-reports]
objectives:
  - Разделить скрипт на планирование (чистая функция, ничего не меняет) и применение (меняет диск) и на этом построить сухой прогон.
  - Сделать операцию идемпотентной - повторный запуск ничего не меняет - и объяснить, какое свойство плана это обеспечивает.
  - Разрешать коллизии имён без потери данных и перемещать файлы без перезаписи.
  - Не следовать симлинкам за пределы корня и проверять, что путь остаётся внутри разрешённого каталога.
  - Объяснить, почему os.replace атомарна только в пределах одной файловой системы, и когда нужен copy + удаление.
masteryCriteria:
  - Вы показываете план перемещений в режиме dry-run, не изменив ни одного файла, и план совпадает с тем, что выполнит боевой запуск.
  - Вы доказываете идемпотентность тестом - второй запуск возвращает пустой план и оставляет дерево прежним.
  - Вы объясняете, чем безопасное перемещение отличается от «проверить exists, затем переименовать» и почему оставшееся окно гонки допустимо или нет.
tags: [python, automation, pathlib, os, files, idempotency, dry-run, symlinks]
facts:
  - kind: internals
    text: >-
      os.replace(src, dst) молча заменяет существующий файл dst, а при успехе переименование атомарно (требование POSIX); на некоторых Unix-системах операция
      может завершиться ошибкой, если src и dst находятся на разных файловых системах. Поэтому «не затирать существующее» нужно проверять отдельно.
    sources:
      - https://docs.python.org/3/library/os.html#os.replace
      - https://docs.python.org/3/library/os.html#os.rename
  - kind: security
    text: >-
      Path.resolve() следует симлинкам, поэтому проверка «путь внутри корня» должна выполняться после resolve(): нормализация строки без обращения к файловой системе
      симлинк не обнаружит. os.scandir() и DirEntry.is_symlink() позволяют определить симлинк без перехода по нему.
    sources:
      - https://docs.python.org/3/library/pathlib.html#pathlib.Path.resolve
      - https://docs.python.org/3/library/os.html#os.DirEntry.is_symlink
  - kind: real-world
    text: >-
      Шаблон «план -> применение» с режимом dry-run есть у привычных инструментов: например, у rsync флаг --dry-run (-n) показывает, что было бы передано, не меняя файлов.
    sources:
      - https://download.samba.org/pub/rsync/rsync.1
  - kind: misconception
    text: >-
      «Если перед os.rename проверить os.path.exists, то перезаписи не будет». Между проверкой и переименованием другой процесс может создать файл (гонка TOCTOU);
      для создания нового файла атомарно используют флаг os.O_EXCL, а для перемещения без перезаписи - os.link с последующим удалением источника.
    sources:
      - https://docs.python.org/3/library/os.html#os.open
      - https://docs.python.org/3/library/os.html#os.link
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: Что означает идемпотентность скрипта-организатора?
      options:
        - "Скрипт работает быстро при любом числе файлов"
        - "Повторный запуск на уже обработанном каталоге ничего не меняет"
        - "Скрипт можно запускать только один раз"
        - "Скрипт никогда не пишет на диск"
      answer: 1
      explanation: >-
        Идемпотентная операция при повторном применении даёт тот же результат, что и после первого. Для организатора это значит, что файлы в целевых папках план больше не затрагивает.
    - id: q2
      type: single
      prompt: Почему сухой прогон должен использовать ту же функцию планирования, что и боевой запуск?
      options:
        - "Так короче код"
        - "Иначе показанный план может отличаться от того, что реально выполнится"
        - "Потому что dry-run быстрее"
        - "Это требование os.replace"
      answer: 1
      explanation: >-
        Если планирование продублировано, два варианта логики расходятся, и пользователь одобряет не то, что будет выполнено. Один планировщик плюс отдельный «применитель» устраняют проблему.
    - id: q3
      type: single
      prompt: Файл a.txt уже есть в папке назначения. Какое поведение безопасно?
      options:
        - "Перезаписать: новый файл актуальнее"
        - "Поместить новый файл под другим именем (a (1).txt) или пропустить его и сообщить"
        - "Удалить старый файл"
        - "Завершить скрипт с исключением, оставив половину файлов перемещёнными"
      answer: 1
      explanation: >-
        Автоматизация не должна терять данные. Переименование с суффиксом или явный пропуск сохраняют оба файла; незавершённый прогон с исключением оставляет каталог в промежуточном состоянии.
    - id: q4
      type: multiple
      prompt: Какие меры защищают от выхода за пределы корневого каталога через симлинки? Выберите все.
      options:
        - "Пропускать записи, для которых is_symlink() истинно"
        - "Сравнивать строки путей без обращения к файловой системе"
        - "Проверять Path.resolve() целевого пути относительно resolve() корня"
        - "Не создавать файлы в подпапках, которые сами являются симлинками"
      answer: [0, 2, 3]
      explanation: >-
        Строковое сравнение не видит симлинков: путь root/link/x выглядит внутренним, но ведёт наружу. Нужны проверка типа записи и resolve().
    - id: q5
      type: single
      prompt: В каком случае os.replace(src, dst) может не сработать атомарно?
      options:
        - "Если src - длинное имя"
        - "Если src и dst находятся на разных файловых системах"
        - "Если dst не существует"
        - "Если файл пустой"
      answer: 1
      explanation: >-
        Атомарное переименование возможно только внутри одной файловой системы; между системами нужен copy + удаление (shutil.move делает это сам, но неатомарно).
exercise:
  id: python.automation.file-automation.exercise
  title: Организатор файлов
  prompt: |
    В файле `organizer.py` реализуйте пять функций. Тесты генерируют дерево файлов во временном каталоге внутри рабочей папки.

    1. `target_dir(name, mtime, by="ext")` - имя подпапки. При `by="ext"`: расширение имени в нижнем регистре без точки (только последнее: `archive.tar.gz` -> `gz`), а без расширения - `"other"`. При `by="date"`: `"YYYY-MM"` по `mtime` (секунды Unix) в UTC. Другой режим - `ValueError`.
    2. `unique_name(name, taken)` - если `name` нет в множестве `taken`, вернуть его, иначе `stem (1).ext`, `stem (2).ext` и так далее (первое свободное). Расширение - только последнее (`os.path.splitext`).
    3. `safe_move(src, dst)` - переместить файл через `os.replace`, но если `dst` уже существует (в том числе как битый симлинк), поднять `FileExistsError`, ничего не меняя.
    4. `plan_moves(root, by="ext")` - список `(src, dst)` относительных posix-путей, например `("a.TXT", "txt/a.TXT")`. Рассматриваются только **обычные файлы прямо в root** в порядке сортировки по имени. Пропускаются: скрытые (имя начинается с `.`), симлинки (на файлы и каталоги), подпапки. Если целевая папка уже существует и содержит файл с тем же именем, используйте `unique_name` (учитывайте и уже спланированные файлы). Если целевая «папка» - симлинк или обычный файл, файл пропускается. Диск не меняется.
    5. `organize(root, by="ext", dry_run=False)` - строит план через `plan_moves`; при `dry_run=True` возвращает его, ничего не трогая; иначе создаёт подпапки (`mkdir(exist_ok=True)`), перемещает файлы через `safe_move` и возвращает план. Повторный запуск возвращает `[]`.

    ```python
    plan_moves(root)        # [("a.TXT", "txt/a.TXT"), ("b.csv", "csv/b.csv"), ("noext", "other/noext")]
    organize(root, dry_run=True)   # тот же список, файлы на месте
    ```
  entryFile: organizer.py
  evaluation: harness
  harness: exercise/harness
  harnessEntry: check.py
  hints:
    - "Разделите работу: plan_moves только читает файловую систему и возвращает список, organize - выполняет. Тогда dry_run - это просто «вернуть план, не применяя»."
    - "Обход: sorted(os.scandir(root), key=lambda e: e.name). Для записи entry используйте entry.is_symlink() и entry.is_file(follow_symlinks=False); скрытые - entry.name.startswith('.'). Имена уже занятых файлов подпапки получайте через os.listdir один раз и пополняйте множество по ходу."
    - "unique_name: stem, ext = os.path.splitext(name); цикл n = 1, 2, ... пока f'{stem} ({n}){ext}' in taken. target_dir по дате: datetime.fromtimestamp(mtime, timezone.utc).strftime('%Y-%m')."
    - "safe_move: if os.path.lexists(dst): raise FileExistsError(dst); затем os.replace(src, dst). Повторный запуск пустой сам собой: файлы, уже лежащие в подпапках, plan_moves не рассматривает (обходит только корень)."
  tests:
    - id: target-dir
      title: target_dir - расширение и дата
      hint: Расширение - os.path.splitext(name)[1] без точки и в нижнем регистре; пустое означает 'other'. Дата - UTC, формат %Y-%m.
    - id: unique-name
      title: unique_name - суффиксы
      hint: Первое свободное имя вида 'a (1).txt'; расширение отделяется только последнее.
    - id: plan-basic
      title: plan_moves - порядок, регистр, скрытые файлы и подпапки
      hint: Сортируйте по имени, пропускайте имена с точкой в начале и всё, что не обычный файл; в плане путь dst - 'папка/имя'.
    - id: dry-run
      title: dry_run не меняет диск
      hint: При dry_run=True не вызывайте mkdir и safe_move; верните тот же список, что вернул бы боевой запуск.
    - id: idempotent
      title: Идемпотентность и режим by='date' (скрытый)
      hidden: true
      hint: Второй запуск должен вернуть [] и не менять дерево; файлы в подпапках plan_moves не рассматривает. Месяц считается в UTC.
    - id: collision
      title: Коллизии имён (скрытый)
      hidden: true
      hint: Прочитайте содержимое целевой папки и выберите первое свободное имя через unique_name; старые файлы не трогайте.
    - id: symlinks
      title: Симлинки не обрабатываются и не используются как цель (скрытый)
      hidden: true
      hint: Проверяйте entry.is_symlink() до is_file; для целевой папки - Path.is_symlink() и является ли она каталогом.
    - id: safe-move
      title: safe_move не затирает файл (скрытый)
      hidden: true
      hint: os.replace молча перезаписывает, поэтому сначала проверьте os.path.lexists(dst) и поднимите FileExistsError, не трогая src.
