id: "nodejs.fundamentals.streams-backpressure"
title: "Потоки и обратное давление: Readable, Writable, Transform, pipeline"
goal: "Строить обработку данных из потоков Readable, Writable и Transform, соединять их через pipeline, читать ввод построчно и понимать, как обратное давление защищает память."
difficulty: "hard"
estimatedMinutes: 75
prerequisites:
  - "nodejs.fundamentals.async-patterns"
related:
  - "nodejs.first-steps.runtime-process-and-stdin"
  - "python.advanced.iterators-and-generators"
  - "java.fundamentals.text-and-io"
  - "rust.fundamentals.collections-and-iterators"
next:
  - "nodejs.fundamentals.buffers-encodings"
objectives:
  - "Назвать четыре вида потоков (Readable, Writable, Duplex, Transform) и режимы чтения: поток данных и асинхронная итерация."
  - "Объяснить обратное давление: highWaterMark, возвращаемое значение write() и событие drain."
  - "Написать Transform с _transform и _flush, корректно собирающий строки из кусков произвольного размера."
  - "Соединять потоки через stream.pipeline (stream/promises) и понимать, чем он лучше pipe()."
  - "Читать stdin построчно через readline и for await и отличать это от чтения всего ввода сразу."
masteryCriteria:
  - "Вы объясняете, что происходит с памятью, если игнорировать результат write() у медленного приёмника."
  - "Вы пишете Transform, не теряющий последнюю строку без перевода строки и строки, разрезанные границей куска."
  - "Вы выбираете между pipeline, pipe и ручным циклом и обосновываете это обработкой ошибок и закрытием потоков."
  - "Вы отличаете режим объектов (objectMode) от байтового режима и знаете, где он нужен."
tags:
  - "nodejs"
  - "streams"
  - "backpressure"
  - "transform"
  - "pipeline"
  - "readline"
  - "highwatermark"
facts:
  - kind: "internals"
    text: "В Node.js четыре вида потоков: Readable, Writable, Duplex (читаемый и записываемый независимо) и Transform (Duplex, где выход вычисляется из входа). Потоки наследуют EventEmitter. Данные идут кусками (chunk): Buffer или строка, а в режиме объектов - любое значение, кроме null."
    sources:
      - "https://nodejs.org/api/stream.html#types-of-streams"
      - "https://nodejs.org/api/stream.html#object-mode"
  - kind: "internals"
    text: "Метод writable.write(chunk) возвращает false, когда внутренний буфер достиг highWaterMark. Тогда запись нужно приостановить до события 'drain'. Значение по умолчанию: 64 КиБ для байтовых потоков начиная с Node.js 22.0.0 (до этого байтовый порог был 16 КиБ) и 16 объектов для режима объектов. Упражнения урока задают highWaterMark явно, поэтому от версии не зависят."
    sources:
      - "https://nodejs.org/api/stream.html#writablewritechunk-encoding-callback"
      - "https://nodejs.org/api/stream.html#new-streamwritableoptions"
      - "https://nodejs.org/en/learn/modules/backpressuring-in-streams"
  - kind: "internals"
    text: "stream.pipeline (и версия из node:stream/promises) соединяет потоки в цепочку, передаёт ошибки и уничтожает все потоки при сбое любого, в отличие от pipe(), который этого не делает. Метод _flush у Transform вызывается, когда входные данные закончились, и позволяет отдать накопленный остаток."
    sources:
      - "https://nodejs.org/api/stream.html#streampipelinesource-transforms-destination-callback"
      - "https://nodejs.org/api/stream.html#transform_flushcallback"
  - kind: "internals"
    text: "Модуль node:readline разбивает читаемый поток на строки: readline.createInterface({ input }) поддерживает асинхронную итерацию (for await (const line of rl)); параметр crlfDelay: Infinity считает пару \\r\\n одним переводом строки."
    sources:
      - "https://nodejs.org/api/readline.html#rlsymbolasynciterator"
      - "https://nodejs.org/api/readline.html#readlinecreateinterfaceoptions"
  - kind: "real-world"
    text: "Потоки дают обработку файлов и ответов сервера с постоянным расходом памяти независимо от размера данных: fs.createReadStream, zlib, http-запросы и ответы - все потоки. Для небольших данных проще прочитать всё сразу (fs.readFile, stream/consumers)."
    sources:
      - "https://nodejs.org/en/learn/modules/how-to-use-streams"
  - kind: "misconception"
    text: "«Асинхронная запись сама не даст переполнить память» - нет. write() буферизует данные без ограничения; highWaterMark - лишь сигнал. Если продолжать писать после false, память растёт."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что означает результат false от writable.write(chunk)?
      options:
        - "Запись не удалась, данные потеряны"
        - "Буфер заполнен, стоит подождать событие 'drain'"
        - "Поток закрыт"
        - "Данные записаны в обход буфера"
      answer: 1
      explanation: "Данные приняты и буферизованы, но буфер достиг highWaterMark: источнику пора приостановиться."
    - id: "q2"
      type: "single"
      prompt: |
        Какой метод Transform вызывается после последнего куска входных данных и позволяет отдать остаток?
      options:
        - "_final"
        - "_flush"
        - "_destroy"
        - "_read"
      answer: 1
      explanation: "_flush(callback) вызывается, когда запись во вход завершена, до закрытия выходной стороны."
    - id: "q3"
      type: "multiple"
      prompt: |
        Чем stream.pipeline лучше цепочки pipe()?
      options:
        - "Передаёт ошибку любой стадии в одно место"
        - "Уничтожает все потоки при сбое"
        - "Ускоряет передачу вдвое"
        - "Версия из stream/promises возвращает промис"
      answer:
        - 0
        - 1
        - 3
      explanation: "pipeline не ускоряет передачу, а обеспечивает обработку ошибок и очистку."
    - id: "q4"
      type: "short"
      prompt: |
        Как называется параметр потока, задающий размер внутреннего буфера, после которого write() возвращает false? Введите имя параметра.
      answer:
        - "highWaterMark"
      explanation: "highWaterMark задаётся в байтах (или в объектах для objectMode)."
    - id: "q5"
      type: "single"
      prompt: |
        Transform получает строку 'ab\ncd' в двух кусках: 'ab\nc' и 'd'. Что нужно сделать, чтобы не потерять 'cd'?
      options:
        - "Ничего: строка выйдет сама"
        - "Хранить остаток после последнего \\n и отдать его в _flush"
        - "Отбросить неполную строку"
        - "Читать по одному байту"
      answer: 1
      explanation: "Остаток без перевода строки нужно накапливать и отдать, когда придут следующие данные или закончится вход (_flush)."
exercise:
  id: "nodejs.fundamentals.streams-backpressure.exercise"
  title: "Построчный Transform: нумерация с произвольными кусками"
  prompt: |
    Первая строка ввода - число `K`, размер куска в символах. Остальной ввод - текст. Заготовка режет текст на куски по `K` символов, превращает их в `Readable` и пропускает через `pipeline`. Границы кусков не совпадают с границами строк, поэтому строки приходится **собирать**.

    Реализуйте два `Transform`:

    1. `LineSplitter` принимает куски и отдаёт по одной строке (в режиме объектов на выходе). Перевод строки - `\n`; один `\r` перед ним отбрасывается. Последняя строка без перевода строки тоже должна выйти (в `_flush`); пустой остаток - нет.
    2. `Numberer` принимает строки (режим объектов на входе). Пустые строки и строки из одних пробелов пропускает, остальные печатает как `<номер>: <строка>` (нумерация с 1, строка без изменений) и в конце, в `_flush`, печатает `total: <число>`.

    Каждая выходная строка заканчивается `\n`.

    **Пример.** Ввод

    ```
    3
    hello
    world

    last
    ```

    даёт

    ```
    1: hello
    2: world
    3: last
    total: 3
    ```

    **Что дано.** Заготовка с классами-пустышками и готовым `pipeline(source, new LineSplitter(), new Numberer(), process.stdout)`. Размер куска `K` в тестах меняется от 1 символа до больше всего текста.
  entryFile: "main.js"
  evaluation: "io"
  hints:
    - "В LineSplitter держите строку this.rest. В _transform: const parts = (this.rest + chunk.toString()).split(\"\\n\"); последний элемент parts - ещё не законченная строка, его сохраните в this.rest через parts.pop()."
    - "Остальные элементы parts - законченные строки: отдайте каждую через this.push(строка), предварительно удалив \\r в конце (replace(/\\r$/, \"\")). Не забудьте вызвать callback()."
    - "В _flush, если this.rest не пустая строка, отдайте и её (тоже без \\r). Для Numberer в конструкторе нужен super({ writableObjectMode: true }): вход - строки-объекты, а выход - обычный текст."
    - "В Numberer._transform: если line.trim() !== \"\", увеличьте this.count и вызовите this.push(`${this.count}: ${line}\\n`). В _flush вызовите this.push(`total: ${this.count}\\n`)."
  tests:
    - id: "example"
      title: "Пример из условия"
      stdin: "3\nhello\nworld\n\nlast\n"
      expected: "1: hello\n2: world\n3: last\ntotal: 3\n"
      hint: "Строки разрезаны границами кусков по 3 символа; пустая строка пропускается."
    - id: "crlf"
      title: "Переводы строк Windows"
      stdin: "4\none\r\ntwo\r\n  \r\nthree\r\n"
      expected: "1: one\n2: two\n3: three\ntotal: 3\n"
      hint: "Один \\r перед \\n удаляется, строка из пробелов пропускается."
    - id: "no-trailing-newline"
      title: "Нет перевода строки в конце"
      stdin: "2\nab\ncd"
      expected: "1: ab\n2: cd\ntotal: 2\n"
      hint: "Последняя строка без \\n остаётся в this.rest и выходит в _flush."
    - id: "chunk-1"
      title: "Куски по одному символу (скрытый)"
      stdin: "1\nalpha beta\n\ngamma\r\nЯна\n"
      expected: "1: alpha beta\n2: gamma\n3: Яна\ntotal: 3\n"
      hidden: true
      hint: "Строка собирается из многих кусков; кириллица тоже работает, потому что куски нарезаны по символам."
    - id: "big-chunk"
      title: "Один кусок на весь текст (скрытый)"
      stdin: "1000\nx\ny\nz\n"
      expected: "1: x\n2: y\n3: z\ntotal: 3\n"
      hidden: true
      hint: "Весь текст приходит одним куском; результат тот же."
    - id: "empty-body"
      title: "Пустой текст (скрытый)"
      stdin: "5\n"
      expected: "total: 0\n"
      hidden: true
      hint: "Без строк выводится только total: 0."
    - id: "only-blank"
      title: "Только пустые строки (скрытый)"
      stdin: "2\n\n \n\t\n"
      expected: "total: 0\n"
      hidden: true
      hint: "Пустые и пробельные строки не нумеруются и не считаются."
    - id: "spaces-kept"
      title: "Пробелы внутри строки сохраняются (скрытый)"
      stdin: "3\n  a  b  \n"
      expected: "1:   a  b  \ntotal: 1\n"
      hidden: true
      hint: "Строка выводится как есть, пробелы по краям не обрезаются."
challenge:
  id: "nodejs.fundamentals.streams-backpressure.challenge"
  title: "Производитель с обратным давлением"
  prompt: |
    Программа получает три строки: `highWaterMark` приёмника (в байтах), размеры буферов через пробел и, необязательно, номер буфера, на котором приёмник должен упасть с ошибкой (нумерация с 1). Приёмник `Writable` готов: он принимает каждый кусок **асинхронно** (на следующей итерации цикла) и считает принятые куски и байты.

    Реализуйте `produce(writable, sizes)`: для каждого размера запишите `Buffer.alloc(size, 97)`. Правила:

    * после каждого `write()` запомните `writable.writableLength`, наибольшее значение вернётся как `peak`;
    * если `write()` вернул `false`, увеличьте счётчик `waits` и дождитесь события `'drain'` (`events.once`), прежде чем писать дальше;
    * после всех записей вызовите `end()` и дождитесь `'finish'`;
    * верните `{ waits, peak }`. Ошибка приёмника должна выйти из `produce` исключением.

    Вывод при успехе: строки `waits=`, `peak=`, `bytes=` (принятые байты), `written=` (принятые куски). Если приёмник упал, выводятся `error: sink failed` и `written=<число успешно принятых кусков>`.

    **Пример.** Ввод

    ```
    16
    10 10 10 10 10 10
    ```

    даёт

    ```
    waits=3
    peak=20
    bytes=60
    written=6
    ```

    (после второго буфера в очереди 20 байт при пороге 16: `write()` вернул `false`, производитель ждёт `'drain'`).

    **Что дано.** Заготовка пишет всё подряд, не проверяя результат `write()` и не дожидаясь конца: память растёт, а ошибка приёмника не обрабатывается.
  entryFile: "main.js"
  evaluation: "io"
  starter: "challenge/starter"
  solution: "challenge/solution"
  hints:
    - "Цикл for по размерам: const ok = writable.write(Buffer.alloc(size, 97)); сразу после него обновите peak = Math.max(peak, writable.writableLength)."
    - "Если ok === false, увеличьте waits и выполните await once(writable, \"drain\"). once из node:events отклоняется, если у потока возникла ошибка, поэтому ошибка приёмника выйдет из produce сама."
    - "После цикла вызовите writable.end() и await once(writable, \"finish\"). Тогда ошибки, случившиеся при записи последних кусков, тоже станут исключением."
    - "При обратном давлении очередь не растёт: peak не превышает highWaterMark плюс размер одного буфера. Без ожидания drain peak равен сумме всех размеров."
  tests:
    - id: "pressure"
      title: "Обратное давление срабатывает"
      stdin: "16\n10 10 10 10 10 10\n"
      expected: "waits=3\npeak=20\nbytes=60\nwritten=6\n"
      hint: "write вернул false - ждите drain; peak ограничен."
    - id: "no-pressure"
      title: "Порог не достигнут"
      stdin: "100\n10 20 30\n"
      expected: "waits=0\npeak=60\nbytes=60\nwritten=3\n"
      hint: "Пока буфер меньше highWaterMark, write возвращает true, ждать не нужно."
    - id: "single-big"
      title: "Один буфер больше порога"
      stdin: "4\n9\n"
      expected: "waits=1\npeak=9\nbytes=9\nwritten=1\n"
      hint: "Буфер больше порога тоже принимается; write вернёт false, и нужно дождаться drain."
    - id: "many-small"
      title: "Много мелких буферов (скрытый)"
      stdin: "8\n3 3 3 3 3 3 3 3 3 3\n"
      expected: "waits=3\npeak=9\nbytes=30\nwritten=10\n"
      hidden: true
      hint: "Ждать нужно после каждого write, вернувшего false, а не раз в несколько записей."
    - id: "mixed"
      title: "Разные размеры (скрытый)"
      stdin: "20\n5 25 1 1 30 2 2 2 2\n"
      expected: "waits=2\npeak=32\nbytes=70\nwritten=9\n"
      hidden: true
      hint: "peak измеряется сразу после каждого write, до ожидания drain."
    - id: "fail-early"
      title: "Ошибка приёмника на втором буфере (скрытый)"
      stdin: "16\n10 10 10 10 10 10\n2\n"
      expected: "error: sink failed\nwritten=1\n"
      hidden: true
      hint: "Ошибка во время ожидания drain отклоняет once; поймайте её в main, оставив produce без try/catch."
    - id: "fail-last"
      title: "Ошибка на последнем буфере (скрытый)"
      stdin: "100\n10 10 10\n3\n"
      expected: "error: sink failed\nwritten=2\n"
      hidden: true
      hint: "Ожидание finish тоже отклоняется ошибкой потока."
    - id: "zero"
      title: "Нет буферов (скрытый)"
      stdin: "8\n\n"
      expected: "waits=0\npeak=0\nbytes=0\nwritten=0\n"
      hidden: true
      hint: "Пустой список: end() и ожидание finish, результат waits=0 peak=0."
