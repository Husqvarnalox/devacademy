id: "java.fundamentals.exceptions-try-with-resources"
title: "Исключения: проверяемые и непроверяемые, try-with-resources"
goal: "Различать проверяемые и непроверяемые исключения, проектировать собственные, предсказывать порядок finally и close и надёжно освобождать ресурсы."
difficulty: "medium"
estimatedMinutes: 60
prerequisites:
  - "java.fundamentals.streams-lambdas-optional"
related:
  - "csharp.fundamentals.exceptions-and-resources"
  - "go.fundamentals.functions-and-errors"
  - "rust.fundamentals.error-handling"
  - "python.advanced.context-managers"
  - "python.fundamentals.errors-and-files"
next:
  - "java.fundamentals.threads-executors-virtual"
objectives:
  - "Описать иерархию Throwable, Error, Exception, RuntimeException и отличать проверяемые исключения от непроверяемых."
  - "Правильно упорядочивать catch, применять multi-catch и сохранять причину через cause."
  - "Предсказывать результат return и throw внутри finally."
  - "Использовать try-with-resources: порядок закрытия, подавленные исключения, ресурсы-переменные."
  - "Проектировать собственные исключения и оборачивать проверяемые исключения в непроверяемые для лямбд."
masteryCriteria:
  - "Вы называете, какие из NullPointerException, IOException, IllegalStateException, OutOfMemoryError проверяемые, и объясняете почему."
  - "Вы предсказываете последовательность open, close, catch и finally для нескольких ресурсов в одном try."
  - "Вы объясняете, чем подавленное исключение отличается от потерянного, и знаете метод getSuppressed."
  - "Вы сохраняете причину при оборачивании исключения и не пишете пустых catch."
tags:
  - "java"
  - "exceptions"
  - "checked"
  - "try-with-resources"
  - "finally"
  - "autocloseable"
facts:
  - kind: "internals"
    text: "Проверяемыми называются Throwable и его наследники, кроме RuntimeException, Error и их подклассов. Компилятор требует, чтобы метод либо перехватывал проверяемое исключение, либо объявлял его в throws."
    sources:
      - "https://docs.oracle.com/javase/specs/jls/se21/html/jls-11.html#jls-11.1.1"
  - kind: "internals"
    text: "В try-with-resources ресурсы закрываются в порядке, обратном объявлению, до выполнения блоков catch и finally. Если тело и close() выбросили исключения, исключение тела остаётся главным, а исключения close() присоединяются как подавленные (getSuppressed)."
    sources:
      - "https://docs.oracle.com/javase/specs/jls/se21/html/jls-14.html#jls-14.20.3"
  - kind: "historical"
    text: "Конструкция try-with-resources появилась в Java 7 (Project Coin); с Java 9 в скобках можно указывать существующую эффективно финальную переменную (JEP 213)."
    sources:
      - "https://openjdk.org/jeps/213"
  - kind: "historical"
    text: "Информативные сообщения NullPointerException (JEP 358) появились в Java 14 и включены по умолчанию начиная с Java 15. Имена локальных переменных попадают в сообщение, только если класс скомпилирован с отладочной информацией (-g), иначе выводится <local1>."
    sources:
      - "https://openjdk.org/jeps/358"
  - kind: "real-world"
    text: "Руководство Oracle советует перехватывать исключение, только если вы можете что-то с ним сделать, и сохранять исходное исключение как причину при повторном выбрасывании."
    sources:
      - "https://docs.oracle.com/javase/tutorial/essential/exceptions/index.html"
  - kind: "misconception"
    text: "«finally не может изменить результат метода» - может: return или throw внутри finally подменяют результат и поглощают исходное исключение. А вот присваивание переменной после return значение возврата уже не меняет."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Какое из исключений проверяемое?"
      options:
        - "NullPointerException"
        - "IOException"
        - "IllegalStateException"
        - "OutOfMemoryError"
      answer: 1
      explanation: "IOException наследуется от Exception, но не от RuntimeException, поэтому компилятор требует его обработки."
    - id: "q2"
      type: "single"
      prompt: "Ресурсы A и B объявлены в этом порядке в одном try-with-resources. В каком порядке они закроются?"
      options:
        - "A, затем B"
        - "B, затем A"
        - "В произвольном порядке"
        - "Только тот, что объявлен последним"
      answer: 1
      explanation: "Порядок закрытия обратный порядку объявления."
    - id: "q3"
      type: "multiple"
      prompt: "Какие утверждения верны?"
      options:
        - "Блок finally выполняется и тогда, когда в try был return."
        - "return внутри finally может скрыть исключение, брошенное в try."
        - "catch (Exception e) допустимо ставить перед catch (IOException e)."
        - "Исключения из close() попадают в getSuppressed(), если тело try тоже бросило исключение."
      answer:
        - 0
        - 1
        - 3
      explanation: "Широкий catch перед узким делает узкий недостижимым - ошибка компиляции."
    - id: "q4"
      type: "short"
      prompt: "Какой метод Throwable возвращает исключения, подавленные при закрытии ресурсов?"
      options:
        - "getSuppressed"
        - "getSuppressed()"
      answer: "getSuppressed"
      explanation: "Метод getSuppressed() возвращает массив Throwable."
    - id: "q5"
      type: "numeric"
      prompt: "static int f() { int x = 1; try { return x; } finally { x = 2; } } Что вернёт f()?"
      answer: 1
      explanation: "Значение для return вычисляется до finally; присваивание x = 2 уже не влияет на результат."
exercise:
  id: "java.fundamentals.exceptions-try-with-resources.exercise"
  title: "Банковские операции: исключения и транзакции"
  prompt: |
    Первая строка ввода - число `n`, затем `n` команд (по одной в строке). Программа хранит счета (имя и баланс, целое неотрицательное число).

    * `open <счёт> <сумма>` - открыть счёт; сумма может быть `0`;
    * `deposit <счёт> <сумма>` и `withdraw <счёт> <сумма>` - пополнить или снять; сумма больше `0`;
    * `transfer <откуда> <куда> <сумма>` - перевод; сумма больше `0`.

    Сумма - от 1 до 12 цифр. После успешной команды выводится `ok`. Ошибки выводятся как `error: <сообщение>`:

    * `unknown account <имя>` - счёта нет (проверяемое исключение);
    * `insufficient funds: <имя> has <баланс>, need <сумма>` - недостаточно средств (проверяемое);
    * `account exists: <имя>` - счёт уже открыт (проверяемое);
    * `invalid amount: <текст>` - сумма не соответствует правилам (непроверяемое `IllegalArgumentException`);
    * `bad command` - неверное число слов; `unknown command: <слово>` - неизвестная команда.

    **Транзакции.** `deposit`, `withdraw` и `transfer` выполняются внутри ресурса `Tx` (try-with-resources): если команда не завершилась успешно, `Tx.close()` возвращает прежние балансы и печатает `rollback` - **до** строки с ошибкой. Для `transfer` дополнительно открывается ресурс `Audit` **перед** `Tx`: его `close()` печатает `audit: <команда>` (команда без лишних пробелов по краям) при любом исходе, **после** закрытия `Tx`. Итого успешный перевод печатает `audit: ...` и затем `ok`, неудачный - `rollback`, `audit: ...`, `error: ...`. Сумма проверяется до открытия ресурсов, поэтому при недопустимой сумме ни `rollback`, ни `audit` не печатаются.

    В конце выведите `balances:` и все счета по имени (`String.compareTo`) в формате `<имя>=<баланс>`.

    **Пример.**

    ```
    4
    open a 10
    open b 5
    transfer a b 7
    transfer a z 1
    ```

    ```
    ok
    ok
    audit: transfer a b 7
    ok
    rollback
    audit: transfer a z 1
    error: unknown account z
    balances:
    a=3
    b=12
    ```

    **Что дано.** Заготовка читает команды и принимает только `open` без проверок. Добавьте исключения, ресурсы `Tx` и `Audit` и их вызов.
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Три проверяемых исключения: AccountException extends Exception, а UnknownAccountException и InsufficientFundsException расширяют его. Ловите их вместе с IllegalArgumentException в main и печатайте error: + getMessage()."
    - "Tx хранит Map прежних балансов (putIfAbsent при первом изменении счёта) и флаг committed. close() без committed: вернуть прежние значения и напечатать rollback. close() объявите без throws, чтобы try не требовал catch Exception."
    - "В transfer: try (Audit audit = new Audit(...); Tx tx = new Tx()) { списать с первого счёта; зачислить на второй; tx.commit(); }. Закрытие идёт в обратном порядке: сначала Tx, затем Audit; catch в main выполнится позже обоих."
    - "Нехватку средств проверяйте при списании: если баланс меньше суммы, бросайте InsufficientFundsException с балансом до операции. Сумму разбирайте до try-with-resources: регулярное выражение [0-9]{1,12} и значение больше 0, иначе IllegalArgumentException."
  tests:
    - id: "example"
      title: "Пример из условия"
      stdin: "4\nopen a 10\nopen b 5\ntransfer a b 7\ntransfer a z 1\n"
      expected: "ok\nok\naudit: transfer a b 7\nok\nrollback\naudit: transfer a z 1\nerror: unknown account z\nbalances:\na=3\nb=12\n"
      hint: "Откат при неизвестном получателе: сумма уже списана с a, поэтому Tx возвращает баланс."
    - id: "simple"
      title: "Пополнение и снятие"
      stdin: "6\nopen x 0\ndeposit x 50\nwithdraw x 20\nwithdraw x 31\ndeposit y 5\nwithdraw x 30\n"
      expected: "ok\nok\nok\nrollback\nerror: insufficient funds: x has 30, need 31\nrollback\nerror: unknown account y\nok\nbalances:\nx=0\n"
      hint: "Недостаточно средств при снятии 31: has 30. Снятие 30 затем даёт 0."
    - id: "amounts"
      title: "Некорректные суммы"
      stdin: "6\nopen a 5\ndeposit a 0\ndeposit a -3\ndeposit a 1x\nwithdraw a 1234567890123\nopen b 007\n"
      expected: "ok\nerror: invalid amount: 0\nerror: invalid amount: -3\nerror: invalid amount: 1x\nerror: invalid amount: 1234567890123\nok\nbalances:\na=5\nb=7\n"
      hint: "Нулевая, отрицательная, нечисловая и слишком длинная суммы - invalid amount, и без rollback. Для open допустимо и 0, и ведущие нули."
    - id: "insufficient"
      title: "Недостаточно средств при переводе (скрытый)"
      stdin: "4\nopen a 10\nopen b 0\ntransfer a b 11\ntransfer b a 1\n"
      expected: "ok\nok\nrollback\naudit: transfer a b 11\nerror: insufficient funds: a has 10, need 11\nrollback\naudit: transfer b a 1\nerror: insufficient funds: b has 0, need 1\nbalances:\na=10\nb=0\n"
      hidden: true
      hint: "Ошибка при списании: rollback, audit, error. Баланс не меняется."
    - id: "commands"
      title: "Неизвестные команды и число слов (скрытый)"
      stdin: "6\nopen a\nopen a 1 2\nclose a\ndeposit\nopen a 1\nopen a 2\n"
      expected: "error: bad command\nerror: bad command\nerror: unknown command: close\nerror: bad command\nok\nerror: account exists: a\nbalances:\na=1\n"
      hidden: true
      hint: "bad command для неверного числа слов, unknown command для незнакомой команды, account exists для повторного open."
    - id: "self"
      title: "Перевод самому себе (скрытый)"
      stdin: "4\nopen a 10\ntransfer a a 4\ntransfer a a 11\n  transfer   a  a   1  \n"
      expected: "ok\naudit: transfer a a 4\nok\nrollback\naudit: transfer a a 11\nerror: insufficient funds: a has 10, need 11\naudit: transfer   a  a   1\nok\nbalances:\na=10\n"
      hidden: true
      hint: "Перевод самому себе не меняет баланс; при нехватке средств - rollback. Audit печатает команду без пробелов по краям: пробелы внутри сохраняются."
    - id: "unknown-first"
      title: "Неизвестный отправитель (скрытый)"
      stdin: "3\nopen b 3\ntransfer q b 1\ntransfer b q 1\n"
      expected: "ok\nrollback\naudit: transfer q b 1\nerror: unknown account q\nrollback\naudit: transfer b q 1\nerror: unknown account q\nbalances:\nb=3\n"
      hidden: true
      hint: "Если неизвестен отправитель, откат печатается без изменений балансов; если получатель - баланс b возвращается."
