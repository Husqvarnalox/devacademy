id: "cpp-first-steps"
version: "1.0.0"
title: "C++: первые шаги"
description: "Курс идёт после «C++ с нуля»: переменные, условия, циклы, функции, vector и map здесь не объясняются заново. Если вы никогда не программировали, начните с «C++ с нуля»; если уже программируете на другом языке, подойдёт «C++ для программистов». Вводный курс из двух уроков: как C++ компилируется и компонуется в машинный код, как работают ключи компилятора и неопределённое поведение, затем семантика значений, ссылки и RAII. Остальные темы трека C++ запланированы."
languageId: "cpp"
level: 1
requires: [cpp-from-zero]
track: "cpp"
lessons:
  - "01-how-cpp-runs"
  - "02-value-semantics-references-and-raii"
