id: "cpp-first-steps"
version: "1.0.0"
title: "C++: первые шаги"
description: "Курс рассчитан на тех, кто уже программирует на другом языке: переменные, условия, циклы и функции здесь не объясняются с нуля. Если вы никогда не программировали, начните с «Go с нуля», «Основы Python» или «JavaScript с нуля». Вводный курс из двух уроков: как C++ компилируется и компонуется в машинный код и читает ввод, затем семантика значений, ссылки и RAII. Остальные темы трека C++ запланированы."
languageId: "cpp"
level: 1
track: "cpp"
lessons:
  - "01-how-cpp-runs"
  - "02-value-semantics-references-and-raii"
