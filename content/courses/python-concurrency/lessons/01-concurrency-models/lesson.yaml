id: python.concurrency.concurrency-models
title: "Модели конкурентности: процессы, потоки, корутины и GIL"
goal: Различать конкурентность и параллелизм, CPU-bound и I/O-bound нагрузку и обоснованно выбирать процессы, потоки или корутины с учётом GIL.
difficulty: medium
estimatedMinutes: 60
prerequisites: [python.advanced.iterators-and-generators, python.advanced.functions-as-objects]
related: [python.advanced.context-managers]
next: [python.concurrency.threading-and-synchronization, python.concurrency.asyncio-basics]
objectives:
  - Объяснить разницу между конкурентностью (несколько дел в процессе выполнения) и параллелизмом (несколько дел буквально одновременно).
  - Классифицировать нагрузку как CPU-bound или I/O-bound и назвать, что ограничивает её скорость.
  - Описать, чем процесс, поток и корутина отличаются по изоляции памяти, стоимости и тому, кто переключает выполнение.
  - Объяснить, что защищает GIL в CPython, когда он отпускается и почему он не делает составные операции атомарными.
  - Назвать статус free-threaded сборок в Python 3.13 и 3.14 и их ограничения.
  - Реализовать кооперативный планировщик на генераторах и показать, как работает переключение в точках ожидания.
masteryCriteria:
  - Вы выбираете модель для заданной нагрузки (вычисления, много сетевых вызовов, блокирующая библиотека) и объясняете выбор.
  - Вы можете сказать, почему потоки не ускоряют чистые вычисления в обычной сборке CPython, но ускоряют ожидание I/O.
  - Вы пишете round-robin планировщик на генераторах, возвращающий детерминированную трассу выполнения.
tags: [python, concurrency, parallelism, gil, threads, processes, asyncio, free-threading]
facts:
  - kind: internals
    text: >-
      GIL (global interpreter lock) в CPython - мьютекс, который позволяет выполнять байткод только одному потоку интерпретатора одновременно.
      Он защищает внутренние структуры интерпретатора (в первую очередь счётчики ссылок), а не ваши данные. Блокирующие операции ввода-вывода
      и многие расширения на C освобождают GIL на время работы, поэтому потоки реально перекрывают ожидание I/O. Интервал, после которого поток
      просят уступить GIL, задаётся sys.setswitchinterval (по умолчанию 0.005 с).
    sources:
      - https://docs.python.org/3/glossary.html#term-global-interpreter-lock
      - https://docs.python.org/3/library/sys.html#sys.setswitchinterval
  - kind: misconception
    text: >-
      «GIL делает код на потоках безопасным». Нет: GIL гарантирует целостность интерпретатора, но поток может быть вытеснен между любыми двумя
      байткод-инструкциями. Операция counter += 1 состоит из чтения, сложения и записи, и два потока способны потерять обновление. Корректность
      своих данных обеспечивают блокировки и очереди, а не GIL.
    sources:
      - https://docs.python.org/3/faq/library.html#what-kinds-of-global-value-mutation-are-thread-safe
  - kind: historical
    text: >-
      PEP 703 предложил сделать GIL необязательным; экспериментальная free-threaded сборка появилась в Python 3.13. В Python 3.14 по PEP 779
      free-threaded сборка официально поддерживается, но остаётся необязательной (фаза II); решение о том, чтобы сделать её сборкой по умолчанию,
      пока не принято. Обычные сборки по умолчанию по-прежнему содержат GIL.
    sources:
      - https://peps.python.org/pep-0703/
      - https://peps.python.org/pep-0779/
      - https://docs.python.org/3/whatsnew/3.14.html
  - kind: historical
    text: >-
      Модуль asyncio вошёл в стандартную библиотеку по PEP 3156 (Python 3.4), а синтаксис async/await добавлен PEP 492 (Python 3.5).
    sources:
      - https://peps.python.org/pep-3156/
      - https://peps.python.org/pep-0492/
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: Какая нагрузка выиграет от потоков в обычной (с GIL) сборке CPython?
      options:
        - "Перемножение больших матриц на чистом Python"
        - "Одновременное ожидание ответов от нескольких серверов через блокирующие сокеты"
        - "Подсчёт простых чисел в цикле"
        - "Любая нагрузка, главное запустить больше потоков"
      answer: 1
      explanation: >-
        Во время блокирующего ввода-вывода поток отпускает GIL, и другие потоки продолжают работу. Чистые вычисления на Python держат GIL,
        поэтому потоки их не ускоряют (для них нужны процессы или free-threaded сборка).
    - id: q2
      type: single
      prompt: Что из перечисленного верно про GIL?
      options:
        - "Он делает операцию counter += 1 атомарной"
        - "Он защищает внутренние структуры интерпретатора, но не гарантирует корректность составных операций над вашими данными"
        - "Он запрещает создавать более одного потока"
        - "Он есть только в Windows"
      answer: 1
      explanation: >-
        Между чтением, сложением и записью в counter += 1 поток может быть вытеснен, поэтому обновление теряется. Для общих данных нужны Lock или очереди.
    - id: q3
      type: multiple
      prompt: Какие утверждения о моделях конкурентности верны? Выберите все верные.
      options:
        - "Процессы имеют раздельную память, обмен данными требует сериализации или общей памяти"
        - "Потоки одного процесса делят память, поэтому нужна синхронизация"
        - "Корутины переключаются кооперативно в точках await, и один поток может обслуживать тысячи соединений"
        - "Корутины всегда выполняются параллельно на всех ядрах"
      answer: [0, 1, 2]
      explanation: >-
        Корутины в asyncio работают в одном потоке event loop: это конкурентность без параллелизма. Параллельное выполнение Python-кода в обычной сборке дают только процессы.
    - id: q4
      type: single
      prompt: Каков статус free-threaded сборки CPython в версии 3.14?
      options:
        - "Её нет, GIL нельзя отключить"
        - "Она экспериментальная, как в 3.13"
        - "Она официально поддерживается по PEP 779, но остаётся необязательной; по умолчанию устанавливается сборка с GIL"
        - "Она стала единственной сборкой"
      answer: 2
      explanation: >-
        Whats New in Python 3.14 описывает PEP 779: фаза II, free-threading поддерживается, но не обязателен. Решение о фазе III (сделать его умолчанием) пока не принято.
    - id: q5
      type: short
      prompt: Как называется функция из модуля sys, меняющая интервал, после которого поток просят уступить GIL? (имя функции)
      answer: ["setswitchinterval", "sys.setswitchinterval"]
      explanation: >-
        sys.setswitchinterval(seconds) задаёт интервал переключения (по умолчанию 0.005 с), а sys.getswitchinterval() его возвращает.
exercise:
  id: python.concurrency.concurrency-models.exercise
  title: Кооперативный планировщик
  prompt: |
    Корутины в asyncio переключаются **кооперативно**: управление переходит к другой задаче только там, где задача сама уступила его
    (`await`). Смоделируйте это на генераторах (см. [«Итераторы и генераторы»](lesson:python.advanced.iterators-and-generators)):
    каждый `yield` - точка, где задача уступает управление.

    В файле `scheduler.py` реализуйте:

    1. `run(tasks)` - `tasks` это `dict[str, generator]`. Планировщик ходит по задачам по кругу (round-robin) в порядке словаря:
       на каждом шаге делает `next` у очередной ещё живой задачи. Значение, выданное через `yield`, добавляется в **трассу** в виде пары
       `(имя, значение)`. Когда генератор завершается (`StopIteration`), его значение `return` сохраняется в `results[имя]`, и задача
       выбывает из круга. Если генератор поднял исключение, оно сохраняется в `results[имя]` как объект исключения, остальные задачи
       продолжают работать. Функция возвращает пару `(trace, results)`.
    2. `recommend(cpu_bound, has_async_library)` - возвращает `"processes"`, если нагрузка CPU-bound (в обычной сборке с GIL
       только процессы дают параллельное выполнение Python-кода); иначе `"asyncio"`, если есть асинхронная библиотека для нужного
       ввода-вывода; иначе `"threads"`.

    Пример.

    ```python
    def a():
        yield 1
        yield 2
        return "A"

    def b():
        yield 10
        return "B"

    run({"a": a(), "b": b()})
    # ([('a', 1), ('b', 10), ('a', 2)], {'b': 'B', 'a': 'A'})
    ```

    Обратите внимание на порядок в `results`: `b` завершился раньше, чем `a`. На шаге, когда генератор завершается, в трассу ничего не добавляется.
  entryFile: scheduler.py
  evaluation: harness
  harness: exercise/harness
  harnessEntry: check.py
  hints:
    - "Держите очередь живых задач (collections.deque из пар имя-генератор). Берите задачу из начала, делайте шаг, живую возвращайте в конец."
    - "Шаг: try: value = next(gen) except StopIteration as stop: results[name] = stop.value (задача не возвращается в очередь) except Exception as exc: results[name] = exc."
    - "После успешного next добавьте (name, value) в trace и верните пару (name, gen) в конец очереди: queue.append((name, gen))."
    - "recommend: if cpu_bound: return 'processes'; if has_async_library: return 'asyncio'; return 'threads'. Порядок проверок важен."
  tests:
    - id: round-robin
      title: Чередование задач
      hint: Задачи по очереди делают по одному шагу; в трассе значения чередуются в порядке словаря.
    - id: results-order
      title: Возвращаемые значения
      hint: results заполняется в момент завершения генератора (StopIteration.value), поэтому порядок ключей - порядок завершения.
    - id: recommend-basic
      title: recommend - основные случаи
      hint: CPU-bound всегда processes; без async-библиотеки для I/O остаются threads.
    - id: error-isolated
      title: Исключение в одной задаче (скрытый)
      hidden: true
      hint: Исключение сохраняется в results[имя], остальные задачи продолжают; не пробрасывайте его наружу.
    - id: empty-and-immediate
      title: Пустой набор и мгновенное завершение (скрытый)
      hidden: true
      hint: Генератор, завершившийся на первом next, не даёт записей в трассе, но попадает в results.
    - id: uneven-lengths
      title: Задачи разной длины (скрытый)
      hidden: true
      hint: Когда короткие задачи выбыли, оставшиеся продолжают идти по кругу без пропусков.
    - id: recommend-priority
      title: recommend - приоритет условий (скрытый)
      hidden: true
      hint: Если нагрузка CPU-bound, наличие async-библиотеки ничего не меняет.
