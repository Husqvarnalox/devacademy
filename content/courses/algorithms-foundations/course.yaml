id: algorithms-foundations
version: 1.0.0
title: Основы алгоритмов
description: >-
  Шесть уроков о том, как писать программы, которые успевают на больших данных: оценка сложности, бинарный поиск (в том числе по ответу), сортировка слиянием и подсчёт инверсий,
  два указателя и скользящее окно, префиксные суммы с хеш-таблицей, поиск в ширину на сетке. Теория общая и излагается один раз; упражнения можно решать на Python, JavaScript, Go, Java, C++ или Rust.
  В каждой задаче большие скрытые тесты отсеивают решения с лишней сложностью.
languageId: python
level: 1
track: algorithms
lessons:
  - 01-complexity
  - 02-binary-search
  - 03-sorting-inversions
  - 04-two-pointers
  - 05-prefix-sums-hashing
  - 06-grid-bfs
