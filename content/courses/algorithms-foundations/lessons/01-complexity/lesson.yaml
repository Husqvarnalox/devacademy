id: algorithms.foundations.complexity
title: Сложность алгоритма и O-нотация
goal: Оценивать время работы и память алгоритма через O, Ω и Θ, отличать «работает на примере» от «успеет на больших данных» и проверять оценку счётчиком операций.
difficulty: easy
estimatedMinutes: 60
prerequisites: []
related: [python.fundamentals.loops, python.fundamentals.lists]
next: [algorithms.foundations.binary-search]
objectives:
  - Объяснить, что оценка сложности описывает рост числа элементарных операций от размера входа, а не секунды на конкретной машине.
  - Определить O, Ω и Θ и привести пример функции для каждого из случаев.
  - Определять сложность по коду - циклы, вложенные циклы, деление пополам - и сравнивать классы O(1), O(log n), O(n), O(n log n), O(n^2).
  - По ограничениям задачи (n до 2·10^5, лимит несколько секунд) выбирать допустимый класс сложности.
  - Заменить перебор всех отрезков за O(n^2) однопроходным алгоритмом за O(n) и доказать его корректность инвариантом.
masteryCriteria:
  - Вы называете сложность по времени и по памяти для цикла, вложенного цикла и цикла с удвоением переменной.
  - Вы объясняете, почему 3n + 7 принадлежит O(n), но не O(1), и почему n^2 не принадлежит O(n log n).
  - Вы проверяете оценку экспериментом удвоения - отношение числа операций при n и 2n равно примерно 2, 2.2 или 4.
  - Ваше решение задачи о лучшем отрезке проходит тест на 10^5 элементов за доли секунды.
tags: [algorithms, complexity, big-o, theta, omega, kadane, measurement]
facts:
  - kind: real-world
    text: >-
      На олимпиадах и в собеседованиях ориентируются на правило: простой современный процессор выполняет порядка 10^8 - 10^9 элементарных операций в секунду на компилируемом языке
      и заметно меньше в интерпретируемом. Поэтому при n = 2·10^5 решение за O(n^2) (4·10^10 операций) не уложится в секунды, а O(n log n) (около 3.5·10^6) - уложится с огромным запасом.
  - kind: internals
    text: >-
      Асимптотическая запись скрывает константы. Алгоритм за O(n) с большой константой может на малых n проигрывать алгоритму за O(n log n) с маленькой; в стандартных библиотеках
      поэтому сортировка переключается на сортировку вставками для коротких фрагментов. Для документированных стоимостей операций встроенных типов Python смотрите таблицу на wiki.python.org.
    sources:
      - https://wiki.python.org/moin/TimeComplexity
      - https://en.wikipedia.org/wiki/Big_O_notation
  - kind: historical
    text: >-
      Задача о максимальной сумме подмассива возникла при анализе изображений; алгоритм за линейное время для неё получен в 1984 году (его называют алгоритмом Кадане).
      История и оценки для разных вариантов задачи собраны в обзорной статье.
    sources:
      - https://en.wikipedia.org/wiki/Maximum_subarray_problem
  - kind: misconception
    text: >-
      «O(n) всегда быстрее, чем O(n^2)». Оценка описывает рост при увеличении n, а не абсолютное время: при n = 10 квадратичный алгоритм с маленькой константой может оказаться быстрее
      линейного с большой. Выбор алгоритма определяют ограничения задачи.
  - kind: performance
    text: >-
      Для измерения времени кода в Python используйте модуль timeit: он отключает сборщик мусора на время замера и повторяет запуск. Одиночный замер через time.time() сильно зависит от фоновой нагрузки,
      поэтому в этом уроке рост проверяется счётчиком операций - он детерминирован.
    sources:
      - https://docs.python.org/3/library/timeit.html
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: |
        Какова сложность по времени этого кода (n - длина списка a)?
        total = 0
        for x in a:
            for y in a:
                total += x * y
      options:
        - "O(n)"
        - "O(n log n)"
        - "O(n^2)"
        - "O(2^n)"
      answer: 2
      explanation: >-
        Внешний цикл делает n итераций, на каждой внутренний делает ещё n, всего n·n = n^2 операций. Константа (одно умножение и одно сложение) на класс не влияет.
    - id: q2
      type: single
      prompt: |
        Что делает такой цикл и сколько итераций он выполняет?
        i = 1
        while i < n:
            i *= 2
      options:
        - "n итераций: O(n)"
        - "примерно log2(n) итераций: O(log n)"
        - "n/2 итераций: O(n)"
        - "корень из n итераций: O(sqrt n)"
      answer: 1
      explanation: >-
        После k шагов i равно 2^k. Цикл остановится, когда 2^k >= n, то есть при k ≈ log2(n). Всё, что на каждом шаге сокращает задачу в константу раз (делит пополам, удваивает счётчик), даёт логарифм.
    - id: q3
      type: multiple
      prompt: Какие утверждения о функции f(n) = 3n + 7 верны?
      options:
        - "f(n) принадлежит O(n)"
        - "f(n) принадлежит Θ(n)"
        - "f(n) принадлежит O(1)"
        - "f(n) принадлежит Ω(n)"
        - "f(n) принадлежит O(n^2)"
      answer: [0, 1, 3, 4]
      explanation: >-
        O задаёт верхнюю границу, поэтому f ∈ O(n) и (менее точно) f ∈ O(n^2). Ω - нижняя граница: f ∈ Ω(n). Θ - обе сразу: f ∈ Θ(n). В O(1) функция не входит: она неограниченно растёт.
    - id: q4
      type: numeric
      prompt: >-
        Компилируемый язык выполняет около 10^8 простых операций в секунду (лимит задачи - 2 секунды). Решение при n = 10^5 делает n·(n-1)/2 сравнений.
        За сколько секунд оно примерно отработает? Укажите целое число секунд.
      answer: 50
      tolerance: 5
      explanation: >-
        n(n-1)/2 ≈ 5·10^9 операций. При 10^8 операций в секунду это около 50 секунд против лимита в 2 секунды - превышение в 25 раз. Поэтому нужен алгоритм за O(n) или O(n log n).
    - id: q5
      type: short
      prompt: Как называют метод оценки роста, при котором размер входа удваивают и смотрят на отношение числа операций (или времени)? Закончите фразу одним словом - «эксперимент ...».
      answer: ["удвоения", "удвоение", "doubling"]
      explanation: >-
        Эксперимент удвоения: если при увеличении n вдвое операций становится вдвое больше - O(n); примерно в 2.2 раза - O(n log n); в 4 раза - O(n^2).
complexity:
  time: "O(n)"
  space: "O(1)"
  explanation: "Один проход по массиву с двумя переменными (текущая и лучшая сумма). Перебор всех отрезков стоил бы O(n^2) или O(n^3)."
editorial: editorial.md
exercise:
  id: algorithms.foundations.complexity.exercise
  title: Лучшая полоса
  prompt: |
    Предприятие записывало ежедневное изменение баланса: положительное число - прибыль, отрицательное - убыток. **Полоса** - это непустой непрерывный отрезок дней; её сумма - сумма изменений за эти дни.
    Найдите наибольшую возможную сумму полосы.

    **Формат ввода.** Первая строка - число `n` дней (1 <= n <= 200 000). Вторая строка - `n` целых чисел `a_i` (|a_i| <= 10^9).

    **Формат вывода.** Одно целое число - максимальная сумма непустого отрезка.

    **Замечание.** Сумма может не поместиться в 32-битное целое. Простой перебор всех пар границ за O(n^2) на больших тестах не уложится в лимит (5 секунд).

    **Пример 1.**

    ```
    5
    2 -5 3 4 -1
    ```
    Вывод: `7` (отрезок `3 4`).

    **Пример 2.**

    ```
    3
    -4 -2 -9
    ```
    Вывод: `-2` (отрезок должен быть непустым).
  evaluation: io
  variants:
    python: { entryFile: main.py }
    javascript: { entryFile: main.js }
    go: { entryFile: main.go }
    java: { entryFile: Main.java }
    cpp: { entryFile: main.cpp }
    rust: { entryFile: main.rs }
  hints:
    - "Попробуйте для каждой позиции i ответить на вопрос: какова лучшая сумма отрезка, который оканчивается ровно в i? Как она связана с таким же значением для i-1?"
    - "Пусть cur - лучшая сумма отрезка, оканчивающегося в текущей позиции. Тогда для следующего элемента x возможны два варианта: продолжить прежний отрезок (cur + x) или начать заново с x. Ответ - максимум cur по всем позициям."
    - "cur = max(x, cur + x); best = max(best, cur). Инициализируйте cur и best первым элементом, а не нулём: иначе при всех отрицательных числах вы вернёте 0 вместо правильного ответа."
    - "Полный план: best = cur = a[0]; для каждого следующего x выполните cur = max(x, cur + x), best = max(best, cur); выведите best. Используйте 64-битный тип (long, long long, i64)."
  tests:
    - id: sample
      title: "Пример 1"
      stdin: "5\n2 -5 3 4 -1\n"
      expected: "7\n"
      compare: trim
      hint: "Лучший отрезок - 3 4, сумма 7."
    - id: all-negative
      title: "Все числа отрицательные"
      stdin: "3\n-4 -2 -9\n"
      expected: "-2\n"
      compare: trim
      hint: "Отрезок должен быть непустым: ответ - наибольший (наименее отрицательный) элемент, а не 0."
    - id: single
      title: "Один элемент"
      stdin: "1\n-7\n"
      expected: "-7\n"
      compare: trim
      hint: "n может быть равно 1. Не обращайтесь к a[1]."
    - id: whole-array
      title: "Выгодно взять весь массив"
      stdin: "7\n5 -1 5 -1 5 -1 5\n"
      expected: "17\n"
      compare: trim
      hidden: true
      hint: "Иногда лучший отрезок - весь массив; не обрывайте отрезок при первом отрицательном числе."
    - id: overflow
      title: "Суммы выходят за 32 бита"
      stdinFile: tests/overflow.in
      expected: "3000000000000\n"
      compare: trim
      hidden: true
      hint: "Сумма до 3·10^12 не помещается в int: используйте long / long long / i64."
    - id: mixed-medium
      title: "Случайный средний тест"
      stdinFile: tests/mixed-medium.in
      expected: "4080\n"
      compare: trim
      hidden: true
      hint: "Сравните с перебором на малых данных: инициализация cur и best первым элементом, переход cur = max(x, cur + x)."
    - id: zeros-and-negatives
      title: "Нули и отрицательные"
      stdin: "5\n0 -3 0 -1 0\n"
      expected: "0\n"
      compare: trim
      hidden: true
      hint: "Максимум здесь равен 0: ноль - допустимая сумма непустого отрезка."
    - id: large-random
      title: "Большой тест n = 100 000 (O(n^2) не успеет)"
      stdinFile: tests/large-random.in
      expected: "175830754807\n"
      compare: trim
      hidden: true
      hint: "n = 100 000: перебор всех отрезков (~5·10^9 пар) не уложится в 5 секунд. Нужен один проход."
