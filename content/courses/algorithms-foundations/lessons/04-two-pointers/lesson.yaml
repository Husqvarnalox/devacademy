id: algorithms.foundations.two-pointers
title: Два указателя и скользящее окно
goal: Заменять вложенные циклы по границам отрезка одним проходом с двумя указателями и доказывать линейность амортизированным подсчётом.
difficulty: easy
estimatedMinutes: 60
prerequisites: [algorithms.foundations.complexity]
related: [algorithms.foundations.binary-search, algorithms.foundations.prefix-sums-hashing]
next: [algorithms.foundations.prefix-sums-hashing]
objectives:
  - Применить два указателя на отсортированном массиве (поиск пары с заданной суммой) и обосновать, почему отброшенные варианты не нужны.
  - Реализовать скользящее окно переменной длины и окно фиксированной длины.
  - Сформулировать условие применимости - монотонность (при положительных числах сумма окна растёт при расширении и убывает при сжатии).
  - "Объяснить амортизированный анализ: оба указателя только двигаются вперёд, значит сумма их ходов не больше 2n."
  - Подсчитывать отрезки по правой границе, не перебирая левую.
masteryCriteria:
  - Вы объясняете, почему вложенный while в скользящем окне не делает алгоритм квадратичным.
  - Вы называете, при каком свойстве данных скользящее окно перестаёт работать (отрицательные числа) и что делать вместо него.
  - Ваше решение задачи о тихих отрезках проходит тест n = 100 000, на котором перебор по парам границ не успевает.
tags: [algorithms, two-pointers, sliding-window, amortized, monotonic]
facts:
  - kind: internals
    text: >-
      Амортизированный анализ оценивает среднюю стоимость операции по всей последовательности операций, а не по одной. Во внутреннем while скользящего окна одна итерация внешнего цикла может сдвинуть левый указатель
      много раз, но суммарно левый указатель сдвинется не более n раз за весь проход, поэтому общая стоимость - O(n), а в среднем O(1) на элемент.
    sources:
      - https://en.wikipedia.org/wiki/Amortized_analysis
  - kind: real-world
    text: >-
      Скользящее окно лежит в основе ограничителей частоты запросов (rate limiter), «скользящих средних» в мониторинге и протокола TCP, где окно отправки сдвигается по мере подтверждений.
      Алгоритмически это тот же приём: добавить новый элемент справа, убрать устаревший слева.
    sources:
      - https://en.wikipedia.org/wiki/Sliding_window_protocol
  - kind: misconception
    text: >-
      «Два указателя - это всегда за O(n)». Приём даёт линейное время только тогда, когда оба указателя движутся в одном направлении и не возвращаются. Если после сдвига левого указателя правый приходится
      возвращать назад, оценка ломается. Применимость определяется монотонностью условия, а не формой цикла.
  - kind: performance
    text: >-
      Скользящее окно по строке или списку нужно писать без создания срезов: a[l:r] копирует элементы, и суммарная стоимость превращается из O(n) в O(n·длина окна). Храните только индексы и сумму.
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: |
        Во внутреннем цикле скользящего окна:
        for right in range(n):
            cur += a[right]
            while cur > limit:
                cur -= a[left]
                left += 1
        Какова общая сложность всего прохода?
      options:
        - "O(n^2), потому что цикл в цикле"
        - "O(n): левый указатель в сумме сдвинется не более n раз"
        - "O(n log n)"
        - "O(limit)"
      answer: 1
      explanation: >-
        Правый указатель делает n шагов. Левый только растёт и не превосходит n, значит все итерации while за весь проход в сумме не больше n. Вместе не более 2n операций.
    - id: q2
      type: single
      prompt: >-
        Скользящее окно с условием «сумма окна <= S» корректно работает, если числа в массиве...
      options:
        - "могут быть любыми, включая отрицательные"
        - "положительные (или неотрицательные): расширение не уменьшает сумму, сжатие не увеличивает"
        - "строго отрицательные"
        - "обязательно упорядочены по возрастанию"
      answer: 1
      explanation: >-
        При отрицательных числах сумма окна не монотонна: после расширения она может уменьшиться, и выбрасывать левый элемент, когда сумма превысила S, уже нельзя. Для таких задач нужны префиксные суммы и хеш-таблица (следующий урок).
    - id: q3
      type: numeric
      prompt: >-
        Сколько непустых непрерывных отрезков в массиве из 10 элементов, если все они подходят (сумма любого отрезка не превышает лимит)?
      answer: 55
      tolerance: 0
      explanation: >-
        Отрезков с правым концом r ровно r + 1 (левый конец от 0 до r). Сумма 1 + 2 + ... + 10 = 55 = n(n+1)/2.
    - id: q4
      type: multiple
      prompt: Какие задачи естественно решаются двумя указателями или скользящим окном за O(n)?
      options:
        - "Есть ли в отсортированном массиве пара с суммой T"
        - "Длина самого длинного отрезка положительных чисел с суммой не более S"
        - "Число инверсий в произвольном массиве"
        - "Максимальная сумма k подряд идущих элементов"
      answer: [0, 1, 3]
      explanation: >-
        Инверсии между далёкими элементами не сводятся к монотонному движению двух указателей; для них нужна сортировка слиянием или дерево Фенвика.
    - id: q5
      type: single
      prompt: >-
        В поиске пары с суммой target в отсортированном массиве мы получили a[i] + a[j] < target. Что делаем?
      options:
        - "j -= 1, потому что a[j] слишком большой"
        - "i += 1, потому что a[i] слишком мал даже в паре с самым большим из оставшихся"
        - "Останавливаемся: пары нет"
        - "Сдвигаем оба указателя"
      answer: 1
      explanation: >-
        Если a[i] + a[j] < target, то a[i] с любым элементом левее j даёт сумму ещё меньше. Значит a[i] ни с кем из оставшихся пару не образует, его можно безопасно отбросить.
complexity:
  time: "O(n)"
  space: "O(1)"
  explanation: "Каждый из двух указателей только движется вправо, суммарно не более 2n сдвигов (амортизированный анализ)."
editorial: editorial.md
exercise:
  id: algorithms.foundations.two-pointers.exercise
  title: Тихие отрезки
  prompt: |
    Датчик шума записывает уровень шума за каждую минуту - положительное целое число `a_i`. Непустой непрерывный отрезок минут назовём **тихим**, если суммарный уровень шума на нём **не превышает** `S`.
    Посчитайте количество тихих отрезков. Отрезки с разными границами считаются разными, даже если сумма одинакова.

    **Формат ввода.** Первая строка - `n` и `S` (1 <= n <= 200 000, 1 <= S <= 10^15). Вторая строка - `n` целых чисел `a_i` (1 <= a_i <= 10^9).

    **Формат вывода.** Одно целое число - количество тихих отрезков.

    **Пример 1.**

    ```
    5 4
    2 1 3 1 1
    ```
    Вывод: `9`.

    **Пример 2.**

    ```
    3 4
    5 5 5
    ```
    Вывод: `0` (каждая минута уже громче лимита).

    **Замечание.** Ответ может достигать `n(n+1)/2` - используйте 64-битный тип. Перебор всех пар границ за O(n^2) на больших тестах не укладывается в лимит.
  evaluation: io
  variants:
    python: { entryFile: main.py }
    javascript: { entryFile: main.js }
    go: { entryFile: main.go }
    java: { entryFile: Main.java }
    cpp: { entryFile: main.cpp }
    rust: { entryFile: main.rs }
  hints:
    - "Зафиксируйте правую границу r. Как ведёт себя сумма отрезка [l, r] при росте l? И как меняется самая левая подходящая граница l(r) при переходе от r к r+1?"
    - "Числа положительные, поэтому сумма окна [l, r] растёт при уменьшении l и убывает при увеличении. Самая левая подходящая граница l(r) не уменьшается, когда r растёт - значит, левый указатель можно только двигать вправо."
    - "Для каждого r добавьте a[r] к текущей сумме; пока сумма больше S, вычитайте a[l] и увеличивайте l. После этого подходящие отрезки с правым концом r - это начала l, l+1, ..., r, их r - l + 1 штук. Если a[r] > S, окно становится пустым (l = r + 1) и прибавится 0."
    - "Код: cur = 0; l = 0; ans = 0; for r in range(n): cur += a[r]; while cur > S: cur -= a[l]; l += 1; ans += r - l + 1. Все суммы и ans - 64-битные."
  tests:
    - id: sample-1
      title: "Пример 1"
      stdin: "5 4\n2 1 3 1 1\n"
      expected: "9\n"
      compare: trim
      hint: "Подходящие отрезки считаются по правой границе: для каждого r - все начала от l до r."
    - id: all-loud
      title: "Каждая минута громче лимита"
      stdin: "3 4\n5 5 5\n"
      expected: "0\n"
      compare: trim
      hint: "Если a[r] > S, окно опустошается: l = r + 1, и прибавляется 0. Не обращайтесь к a[l] за пределами массива."
    - id: all-fit
      title: "Подходит любой отрезок"
      stdin: "4 100\n1 1 1 1\n"
      expected: "10\n"
      compare: trim
      hint: "Любой отрезок подходит: ответ n(n+1)/2 = 10."
    - id: exact-limit
      title: "Сумма ровно равна лимиту"
      stdin: "4 4\n2 2 2 2\n"
      expected: "7\n"
      compare: trim
      hidden: true
      hint: "Условие «не превышает» - нестрогое: отрезок с суммой S подходит."
    - id: single
      title: "Один элемент"
      stdin: "1 3\n3\n"
      expected: "1\n"
      compare: trim
      hidden: true
      hint: "n = 1."
    - id: mixed
      title: "Случайный средний тест"
      stdin: "500 60\n8 10 4 13 16 5 3 3 1 13 18 10 2 8 17 18 12 9 6 4 9 7 1 9 9 7 6 10 10 12 3 20 11 13 17 8 6 8 16 9 3 18 10 1 10 19 10 17 7 14 14 20 10 14 15 6 8 10 9 2 3 2 15 9 17 18 16 11 5 7 3 14 7 15 9 6 12 14 19 11 18 7 11 4 2 8 9 19 20 8 4 11 6 10 15 1 2 12 3 10 11 1 11 10 11 5 14 20 3 10 20 7 15 10 5 9 13 20 6 11 19 1 12 2 15 6 12 12 10 19 4 15 7 14 7 4 2 2 2 6 20 5 20 2 18 16 19 8 11 2 4 17 10 14 7 16 7 8 15 14 16 2 8 14 15 8 14 7 16 7 2 2 9 9 8 17 7 8 14 9 5 11 2 11 19 4 19 13 2 16 13 3 14 7 19 6 11 10 16 11 14 17 7 9 11 13 16 3 9 7 2 13 20 5 9 2 6 15 19 16 13 13 7 1 7 6 1 20 9 4 13 13 8 18 2 7 6 20 11 18 16 17 15 1 3 2 20 4 16 18 9 20 5 2 12 3 17 1 10 12 3 3 18 15 13 7 10 13 8 16 13 4 3 4 20 12 17 14 14 15 3 7 10 16 14 4 18 6 12 6 6 5 11 16 11 9 18 1 6 1 10 4 18 4 16 20 16 17 3 17 8 14 10 12 8 6 1 2 20 11 18 15 19 10 17 15 20 20 15 13 5 9 20 12 11 5 14 3 20 5 20 6 10 12 7 19 12 20 3 3 13 6 11 12 11 6 10 1 20 1 17 3 12 4 6 6 19 16 19 3 4 6 16 8 20 10 13 20 8 16 8 10 12 8 11 18 17 15 13 17 13 11 10 15 14 19 1 9 6 18 15 18 20 12 13 13 20 1 5 17 3 15 12 20 10 3 9 16 8 16 20 3 5 8 3 10 5 2 6 13 19 20 18 18 9 1 17 8 6 4 7 2 11 3 4 9 2 10 20 6 5 14 5 3 18 12 1 18 5 17 14 5 7 10 16 17 3 13 6 6 9 17 13 18 10 13 11 6 13 2 14 1 9 1 10 5 3 6 4 20 1 8 8 18 1 16 18 6 15 13\n"
      expected: "2743\n"
      compare: trim
      hidden: true
      hint: "Сравните с перебором на малых данных."
    - id: big-values
      title: "Крупные значения и крупный лимит"
      stdinFile: tests/big-values.in
      expected: "17065\n"
      compare: trim
      hidden: true
      hint: "Суммы до 10^12 выходят за 32 бита."
    - id: large-all-fit
      title: "Большой тест n = 100 000: подходит любой отрезок (O(n^2) не успеет)"
      stdinFile: tests/large-all-fit.in
      expected: "5000050000\n"
      compare: trim
      hidden: true
      hint: "n = 100 000: ответ около 5·10^9, перебор отрезков по парам границ не уложится в 5 секунд. Два указателя - один проход."
    - id: large-random
      title: "Большой случайный тест"
      stdinFile: tests/large-random.in
      expected: "5967397\n"
      compare: trim
      hidden: true
      hint: "Окно сдвигается только вправо: оба указателя делают не более n шагов."
    - id: large-overflow
      title: "Большой тест: суммы за 32 бита"
      stdinFile: tests/large-overflow.in
      expected: "5000050000\n"
      compare: trim
      hidden: true
      hint: "Сумма окна до 10^14 и ответ до 5·10^9: нужны long / long long / i64."
