    - id: large-1
      title: "Большой тест, ответ порядка тысяч (перебор не успеет)"
      stdinFile: tests/large-1.in
      expected: "4995\n"
      compare: trim
      hidden: true
      hint: "n = 100 000, ответ около 5000: перебор L подряд (каждый шаг O(n)) работает минуты. Ищите L бинарным поиском, 64-битные суммы."
    - id: large-2
      title: "Большой тест, ответ порядка 10^8"
      stdinFile: tests/large-2.in
      expected: "100276573\n"
      compare: trim
      hidden: true
      hint: "Ответ огромный - перебор сверху вниз от max(a) тоже не успеет. Бинарный поиск по ответу: около 30 проверок по O(n)."
    - id: large-overflow
      title: "Большое k, суммы за 32 бита"
      stdinFile: tests/large-overflow.in
      expected: "49\n"
      compare: trim
      hidden: true
      hint: "k до 10^12 и суммы кусков до 10^14: int переполнится, используйте long / long long / i64."
