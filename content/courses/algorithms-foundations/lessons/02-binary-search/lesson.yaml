id: algorithms.foundations.binary-search
title: Бинарный поиск - по массиву и по ответу
goal: Писать бинарный поиск без ошибок на единицу с помощью инварианта и применять его не только к отсортированному массиву, но и к задачам «найти наибольшее подходящее значение».
difficulty: medium
estimatedMinutes: 75
prerequisites: [algorithms.foundations.complexity]
related: [python.fundamentals.loops, python.fundamentals.lists]
next: [algorithms.foundations.sorting-inversions]
objectives:
  - Сформулировать инвариант полуинтервального бинарного поиска [lo, hi) и вывести из него условия цикла и обновления границ.
  - Реализовать lower_bound и upper_bound и выразить через них количество элементов, равных x.
  - Распознать, что в задаче ответ можно искать бинарным поиском - когда проверка «подходит ли значение v» монотонна.
  - Выбрать начальные границы и тип данных так, чтобы не получить переполнение и бесконечный цикл.
  - Оценить время как O(log n) или O(f · log C), где f - стоимость проверки, а C - размер диапазона ответа.
masteryCriteria:
  - Вы формулируете инвариант «lo всегда подходит, hi никогда не подходит» и по нему определяете, какую границу двигать.
  - Вы объясняете, почему (lo + hi) / 2 при lo = mid без добавления 1 может зациклиться в варианте с замкнутым отрезком.
  - Ваше решение задачи о распиле досок проходит большие тесты быстро, а перебор всех длин по очереди - нет.
tags: [algorithms, binary-search, invariant, lower-bound, search-on-answer, monotonic]
facts:
  - kind: historical
    text: >-
      Идея бинарного поиска известна с 1946 года, но корректная реализация без ошибок появилась лишь спустя годы: по свидетельству Дональда Кнута, первая версия без ошибок для произвольного размера массива
      опубликована в 1962 году. Известна и история ошибки переполнения в (lo + hi) / 2, о которой в 2006 году сообщили применительно к бинарному поиску из стандартной библиотеки Java.
    sources:
      - https://en.wikipedia.org/wiki/Binary_search_algorithm
      - https://ai.googleblog.com/2006/06/extra-extra-read-all-about-it-nearly.html
  - kind: internals
    text: >-
      В Python за бинарный поиск по отсортированному списку отвечает модуль bisect: bisect_left возвращает позицию первой вставки (первый индекс, где элемент >= x), bisect_right - позицию после всех равных x.
      Это ровно lower_bound и upper_bound из C++.
    sources:
      - https://docs.python.org/3/library/bisect.html
  - kind: real-world
    text: >-
      Бинарный поиск по ответу встречается там, где «чем больше значение, тем сложнее выполнить условие»: минимальная скорость, максимальная нагрузка, наименьший размер блока, при котором расписание укладывается в срок.
      Тот же приём используется для поиска версии, сломавшей сборку (git bisect).
    sources:
      - https://git-scm.com/docs/git-bisect
  - kind: misconception
    text: >-
      «Бинарный поиск работает только на массивах». Нужна не массив, а монотонная проверка: функция, которая для значений ниже порога даёт «нет», а выше - «да» (или наоборот). Массив - лишь частный случай, в котором проверка - сравнение a[mid] с x.
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: |
        Дан фрагмент поиска первого индекса, где a[i] >= x, в полуинтервале [lo, hi):
        lo, hi = 0, len(a)
        while lo < hi:
            mid = (lo + hi) // 2
            if a[mid] < x:
                lo = ???
            else:
                hi = ???
        Что нужно поставить вместо ??? (по порядку)?
      options:
        - "lo = mid; hi = mid"
        - "lo = mid + 1; hi = mid"
        - "lo = mid + 1; hi = mid - 1"
        - "lo = mid; hi = mid - 1"
      answer: 1
      explanation: >-
        Если a[mid] < x, то mid и всё левее заведомо не подходят, поэтому lo = mid + 1. Если a[mid] >= x, то mid может быть ответом, поэтому его нельзя исключать: hi = mid. Инвариант: ответ лежит в [lo, hi].
    - id: q2
      type: numeric
      prompt: >-
        Сколько итераций (в худшем случае, округлите вверх до целого) сделает бинарный поиск ответа в диапазоне от 0 до 10^9, если каждую итерацию диапазон сокращается вдвое?
      answer: 30
      tolerance: 1
      explanation: >-
        2^30 = 1 073 741 824 > 10^9, поэтому достаточно 30 делений пополам. Если проверка стоит O(n), общий итог - O(30 · n).
    - id: q3
      type: multiple
      prompt: >-
        В каких задачах ответ можно искать бинарным поиском по значению (проверка «подходит ли v» монотонна)?
      options:
        - "Наибольшая длина куска, при которой из досок выходит не менее k кусков"
        - "Наименьшая скорость чтения, при которой все книги будут прочитаны за H часов"
        - "Число v в диапазоне 1..100, для которого v mod 7 равно 3"
        - "Наименьшее целое v, для которого v · v >= n"
      answer: [0, 1, 3]
      explanation: >-
        Первые две и последняя монотонны: если значение подходит, подходят все «лучшие» значения; в «mod 7» подходящие значения чередуются с неподходящими, граница не определена.
    - id: q4
      type: single
      prompt: >-
        Что случится, если в поиске по отрезку [lo, hi] (оба конца включены) написать mid = (lo + hi) // 2 и при успехе присваивать lo = mid?
      options:
        - "Всё будет работать, это стандартный вариант"
        - "При hi = lo + 1 mid совпадёт с lo, границы не сдвинутся - цикл станет бесконечным"
        - "Программа вернёт значение на единицу меньше правильного"
        - "Возникнет IndexError в первой же итерации"
      answer: 1
      explanation: >-
        При hi = lo + 1 получается mid = lo; присвоение lo = mid ничего не меняет. Для такого варианта используют верхнее среднее mid = (lo + hi + 1) // 2 или полуинтервал с инвариантом «lo подходит, hi нет» и условием hi - lo > 1.
    - id: q5
      type: short
      prompt: >-
        Как называется вариант поиска, который возвращает индекс первого элемента, не меньшего x (в C++ - std::lower_bound)? Укажите имя функции из модуля bisect в Python.
      answer: ["bisect_left", "bisect.bisect_left"]
      explanation: >-
        bisect_left возвращает первую позицию, в которую можно вставить x, не нарушив порядок, - то есть индекс первого элемента >= x. Парная функция bisect_right вернёт индекс первого элемента > x.
complexity:
  time: "O(n log V)"
  space: "O(1)"
  explanation: "Двоичный поиск по ответу: log V итераций (V - диапазон длины), на каждой проверка за O(n)."
editorial: editorial.md
exercise:
  id: algorithms.foundations.binary-search.exercise
  title: Распил досок
  prompt: |
    Мастерская получила `n` досок длиной `a_1, ..., a_n` (целые числа). Нужно нарезать из них как можно более длинные **одинаковые** куски целой длины `L >= 1` так, чтобы получилось **не менее `k` кусков**.
    Из доски длины `a` получается `floor(a / L)` кусков длины `L`, остаток выбрасывается. Доски склеивать нельзя.

    Выведите наибольшее возможное `L`. Если даже при `L = 1` кусков меньше `k`, выведите `0`.

    **Формат ввода.** Первая строка - `n` и `k` (1 <= n <= 200 000, 1 <= k <= 10^12). Вторая строка - `n` целых чисел `a_i` (1 <= a_i <= 10^9).

    **Формат вывода.** Одно целое число.

    **Пример 1.**

    ```
    3 6
    8 5 13
    ```
    Вывод: `4` (при `L = 4` получим 2 + 1 + 3 = 6 кусков; при `L = 5` лишь 1 + 1 + 2 = 4).

    **Пример 2.**

    ```
    2 100
    3 4
    ```
    Вывод: `0` (всего 7 единичных кусков, а нужно 100).

    **Замечание.** Перебирать `L` подряд долго: ответ может быть порядка 10^9. Число кусков может достигать 2·10^14 - выбирайте 64-битный тип.
  evaluation: io
  variants:
    python: { entryFile: main.py }
    javascript: { entryFile: main.js }
    go: { entryFile: main.go }
    java: { entryFile: Main.java }
    cpp: { entryFile: main.cpp }
    rust: { entryFile: main.rs }
  hints:
    - "Если длина L подходит (кусков не меньше k), то подходит и любая меньшая длина. Если L не подходит, то не подходит и любая большая. Что это значит для поиска ответа?"
    - "Напишите функцию pieces(L) = сумма floor(a_i / L) и бинарным поиском найдите наибольшее L, для которого pieces(L) >= k. Диапазон ответа - от 0 до max(a)."
    - "Держите инвариант: lo подходит (для L = 0 считаем подходящим условно), hi не подходит (hi = max(a) + 1 заведомо не подходит, потому что кусков будет 0 < k). Пока hi - lo > 1, берите mid = (lo + hi) / 2: если подходит - lo = mid, иначе hi = mid."
    - "Готовый скелет: lo = 0; hi = max(a) + 1; while hi - lo > 1: mid = (lo + hi) // 2; if pieces(mid) >= k: lo = mid; else: hi = mid. Ответ - lo. Для pieces используйте 64-битную сумму."
  tests:
    - id: sample-1
      title: "Пример 1"
      stdin: "3 6\n8 5 13\n"
      expected: "4\n"
      compare: trim
      hint: "При L = 4 выходит ровно 6 кусков, при L = 5 - только 4."
    - id: impossible
      title: "Кусков не хватает даже при L = 1"
      stdin: "2 100\n3 4\n"
      expected: "0\n"
      compare: trim
      hint: "Если сумма всех досок меньше k, ответ 0. Ваш hi должен быть max(a) + 1, а lo - 0."
    - id: one-piece
      title: "k = 1: ответ - самая длинная доска"
      stdin: "3 1\n5 9 2\n"
      expected: "9\n"
      compare: trim
      hint: "При k = 1 подходит L = max(a): проверьте верхнюю границу поиска (hi = max(a) + 1)."
    - id: exact-boundary
      title: "Ровно k кусков"
      stdin: "3 6\n10 10 10\n"
      expected: "5\n"
      compare: trim
      hidden: true
      hint: "Условие подходящего L - не менее k кусков (>=), а не строго больше."
    - id: single-board
      title: "Одна доска"
      stdin: "1 1000000000\n1000000000\n"
      expected: "1\n"
      compare: trim
      hidden: true
      hint: "n = 1, ответ 1: нужна проверка границы L = 1."
    - id: equal-boards
      title: "Равные доски"
      stdin: "50 100\n7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7 7\n"
      expected: "3\n"
      compare: trim
      hidden: true
      hint: "Для 50 досок по 7 и k = 100 ответ 3 (2 куска из доски)."
    - id: random-small
      title: "Случайный средний тест"
      stdin: "300 5000\n979 884 971 870 58 94 87 370 856 174 754 829 686 875 316 258 621 218 622 37 596 698 163 442 654 403 823 741 881 522 973 381 558 959 456 515 275 923 37 892 29 373 477 955 327 930 390 434 914 906 539 169 574 182 242 237 25 181 333 178 140 523 523 369 527 691 574 187 916 457 816 425 753 538 929 931 782 373 809 608 363 371 880 985 457 166 978 773 410 733 757 473 671 544 256 502 286 948 511 513 528 852 816 363 678 905 466 922 925 473 360 582 744 943 571 742 468 499 675 228 964 333 835 717 856 171 898 930 632 275 792 934 492 317 311 981 819 724 852 517 576 531 520 668 631 603 417 320 749 213 501 525 376 957 701 639 904 78 804 841 350 744 9 930 835 196 763 109 61 589 669 51 280 606 233 699 897 938 109 773 535 140 875 273 251 845 216 967 902 62 434 920 735 778 33 59 372 369 177 256 689 25 85 118 978 70 26 42 747 941 22 383 262 131 833 959 161 753 189 536 709 2 395 604 45 814 254 156 995 38 5 353 961 631 643 761 766 116 293 346 501 32 316 460 565 785 620 758 47 924 271 774 412 884 637 723 158 485 982 231 96 677 704 324 859 105 25 459 808 896 971 131 531 599 800 403 499 528 336 148 896 983 350 266 269 621 994 430 669 19 717 572 983 144 687 59 260 35 135 166\n"
      expected: "30\n"
      compare: trim
      hidden: true
