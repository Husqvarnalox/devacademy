id: algorithms.foundations.grid-bfs
title: Поиск в ширину на сетке
goal: Находить кратчайший путь в невзвешенном графе-сетке обходом в ширину, обосновывать его корректность и расширять состояние вершины, когда одних координат недостаточно.
difficulty: hard
estimatedMinutes: 90
prerequisites: [algorithms.foundations.complexity]
related: [algorithms.foundations.two-pointers, algorithms.foundations.prefix-sums-hashing, python.fundamentals.lists]
next: []
objectives:
  - Представить сетку как граф (клетки - вершины, соседние проходимые клетки - рёбра) и написать BFS с очередью и массивом расстояний.
  - Доказать, что BFS находит кратчайший путь по числу рёбер, опираясь на инвариант очереди (расстояния в очереди не убывают и различаются не более чем на 1).
  - Оценить время O(V + E) = O(n · m) и объяснить, почему очередь, а не список с pop(0) и не стек.
  - Расширить состояние вершины дополнительным параметром (сколько стен уже пробито) и показать, почему одной отметки «посещено» на клетку недостаточно.
  - Различать BFS (невзвешенный граф) и DFS, и знать, почему для рёбер с разной длиной нужен другой алгоритм.
masteryCriteria:
  - Вы пишете BFS без повторного добавления вершин в очередь и объясняете, где ставится отметка «посещено».
  - Вы объясняете, почему для задачи с пробиванием одной стены состоянием является пара (клетка, использована ли пробивка), и приводите пример, где один массив visited[клетка] даёт неверный ответ.
  - Ваше решение проходит сетку 400x400, на которой перебор «пробить каждую стену и запустить BFS» не успевает.
tags: [algorithms, bfs, graph, grid, shortest-path, queue, state-space]
facts:
  - kind: historical
    text: >-
      Поиск в ширину в виде алгоритма поиска пути в лабиринте опубликован Эдвардом Муром в 1959 году; независимо тот же приём предложил Ч. Ю. Ли в 1961 году для разводки печатных плат (алгоритм Ли), где область «волной» расходится от источника.
    sources:
      - https://en.wikipedia.org/wiki/Breadth-first_search
      - https://en.wikipedia.org/wiki/Lee_algorithm
  - kind: internals
    text: >-
      Очередь в Python нельзя реализовать как list.pop(0): удаление из начала списка сдвигает все элементы и стоит O(n). Для BFS используют collections.deque (O(1) на обоих концах) или список с индексом головы,
      как в решении этого урока.
    sources:
      - https://docs.python.org/3/library/collections.html#collections.deque
  - kind: real-world
    text: >-
      BFS по неявному графу состояний - основа решений головоломок (кубик Рубика, «15» в смысле числа ходов), сетевого поиска (минимальное число переходов) и поиска в социальных графах («шесть рукопожатий»).
      Вершина графа - не обязательно точка плоскости, а любое состояние задачи.
    sources:
      - https://en.wikipedia.org/wiki/Breadth-first_search
  - kind: misconception
    text: >-
      «Поиск в глубину тоже найдёт кратчайший путь, если перебрать всё». DFS находит какой-то путь, а не кратчайший; чтобы найти кратчайший, его пришлось бы запускать с перебором всех путей, а их число растёт экспоненциально.
      BFS расширяется слоями по расстоянию, поэтому первый найденный путь - кратчайший.
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: >-
        Какую структуру данных используют для хранения «фронта» в поиске в ширину?
      options:
        - "Стек"
        - "Очередь (FIFO)"
        - "Кучу по расстоянию до цели"
        - "Множество без порядка"
      answer: 1
      explanation: >-
        FIFO гарантирует, что вершины обрабатываются в порядке неубывания расстояния от источника. Стек превратил бы алгоритм в поиск в глубину.
    - id: q2
      type: numeric
      prompt: >-
        Сетка 400 на 400, BFS без доп. состояния. Сколько вершин (клеток) в худшем случае будет добавлено в очередь? Укажите число.
      answer: 160000
      tolerance: 0
      explanation: >-
        Каждая клетка добавляется в очередь не более одного раза (отметка «посещено» ставится при добавлении), всего 400·400 = 160000.
    - id: q3
      type: single
      prompt: >-
        Где правильно ставить отметку «посещено» в BFS по сетке?
      options:
        - "Когда вершина извлекается из очереди"
        - "Когда вершина добавляется в очередь"
        - "После того, как все её соседи обработаны"
        - "Отметка не нужна для сетки"
      answer: 1
      explanation: >-
        Отметка при добавлении (или запись расстояния) не даёт одной клетке попасть в очередь несколько раз. Если отмечать при извлечении, одна клетка может оказаться в очереди многократно, и время вырастет.
    - id: q4
      type: single
      prompt: >-
        В задаче разрешено пробить не более одной стены. Почему массива visited[клетка] недостаточно?
      options:
        - "Не хватит памяти"
        - "В одну и ту же клетку можно прийти с пробитой и с непробитой стеной; у второго варианта больше возможностей дальше, и его нельзя отбрасывать"
        - "Стены нельзя отмечать"
        - "BFS нельзя применять, если есть стены"
      answer: 1
      explanation: >-
        Состояние - пара (клетка, использована ли пробивка). Пришли в клетку без пробивки - можем потом пробить; пришли с пробивкой - уже нет. Это два разных состояния, и каждое посещается отдельно.
    - id: q5
      type: multiple
      prompt: Какие утверждения о BFS на невзвешенном графе верны?
      options:
        - "Время работы O(V + E)"
        - "Первый найденный путь до вершины - кратчайший по числу рёбер"
        - "Работает корректно, если у рёбер разная длина (веса)"
        - "Память O(V)"
      answer: [0, 1, 3]
      explanation: >-
        Для рёбер с разными весами нужен алгоритм Дейкстры (или 0-1 BFS для весов 0 и 1).
complexity:
  time: "O(n·m)"
  space: "O(n·m)"
  explanation: "BFS по 2·n·m состояниям (клетка, использован ли таран); каждое состояние добавляется в очередь один раз и просматривает 4 соседей."
editorial: editorial.md
exercise:
  id: algorithms.foundations.grid-bfs.exercise
  title: Лабиринт с одним тараном
  prompt: |
    Дана прямоугольная карта подземелья `n x m`. Символы: `.` - свободная клетка, `#` - стена, `S` - старт, `E` - выход (`S` и `E` встречаются ровно по одному разу).
    За один шаг можно перейти в соседнюю по стороне клетку (вверх, вниз, влево, вправо). Стены непроходимы, **кроме одной**: у вас есть таран, и вы можете **пройти сквозь стену один раз за всё путешествие**
    (то есть войти в одну клетку `#` не более одного раза). Шаг в клетку со стеной считается как обычный шаг.

    Найдите наименьшее число шагов от `S` до `E` или выведите `-1`, если добраться невозможно.

    **Формат ввода.** Первая строка - `n` и `m` (1 <= n, m <= 500, n·m >= 2). Далее `n` строк по `m` символов из набора `.#SE` (без пробелов).

    **Формат вывода.** Одно целое число.

    **Пример 1.**

    ```
    3 5
    S.#.E
    .##..
    .....
    ```
    Вывод: `4` (путь по верхней строке с одним пробитием стены; обход снизу занял бы 8 шагов).

    **Пример 2.**

    ```
    1 5
    S#.#E
    ```
    Вывод: `-1` (нужно пройти две стены).

    **Замечание.** Перебор «пробить каждую стену по очереди и запустить BFS» работает за O((n·m)^2) и на больших картах не укладывается в лимит.
  evaluation: io
  variants:
    python: { entryFile: main.py }
    javascript: { entryFile: main.js }
    go: { entryFile: main.go }
    java: { entryFile: Main.java }
    cpp: { entryFile: main.cpp }
    rust: { entryFile: main.rs }
  hints:
    - "Сначала решите задачу без тарана: BFS от S по клеткам, расстояние до E. Затем подумайте, что именно нужно помнить о пути, кроме текущей клетки, чтобы знать, можно ли ещё пробивать стену."
    - "Состояние - пара (клетка, used), где used = 0 или 1 (таран уже использован). Расстояния храните отдельно для каждого состояния: dist[клетка][used]. Из состояния можно шагнуть в свободную клетку, не меняя used, или в стену при used = 0, получив used = 1."
    - "Нельзя отмечать «посещено» только по клетке: в одну клетку можно прийти с used = 0 и с used = 1, и состояние с used = 0 лучше. Ответ - наименьшее из dist[E][0] и dist[E][1], которые достигнуты (не -1)."
    - "Очередь на массиве или deque, закодируйте состояние числом cell * 2 + used. Для каждого извлечённого состояния просмотрите 4 соседей; nused = used + (сосед == '#'); если nused > 1 - пропустите; если dist[сосед][nused] ещё не задан - запишите dist + 1 и добавьте в очередь."
  tests:
    - id: sample-1
      title: "Пример 1: таран сокращает путь"
      stdin: "3 5\nS.#.E\n.##..\n.....\n"
      expected: "4\n"
      compare: trim
      hint: "Путь по верхней строке с одним пробитием: 4 шага. Не забудьте разрешить шаг в стену при used = 0."
    - id: two-walls
      title: "Нужно пройти две стены"
      stdin: "1 5\nS#.#E\n"
      expected: "-1\n"
      compare: trim
      hint: "Пробить можно только одну стену: при nused > 1 шаг запрещён. Ответ -1."
    - id: open
      title: "Без стен"
      stdin: "2 3\nS..\n..E\n"
      expected: "3\n"
      compare: trim
      hint: "Если стены не мешают, ответ - обычный BFS: 3."
    - id: adjacent
      title: "Выход рядом со стартом"
      stdin: "1 2\nSE\n"
      expected: "1\n"
      compare: trim
      hidden: true
      hint: "n = 1: выход на соседней клетке, ответ 1."
    - id: wall-needed
      title: "Выход достижим только через стену"
      stdin: "3 5\nS..#E\n...#.\n...#.\n"
      expected: "4\n"
      compare: trim
      hidden: true
      hint: "Единственный путь идёт через стену: разрешите шаг в # при used = 0."
    - id: ring-one-wall
      title: "Выход внутри кольца толщиной в одну стену"
      stdin: "9 9\nS........\n.........\n..#####..\n..#...#..\n..#.E.#..\n..#...#..\n..#####..\n.........\n.........\n"
      expected: "8\n"
      compare: trim
      hidden: true
      hint: "Кольцо в одну клетку пробивается: ответ - расстояние до кольца плюс шаги внутри."
    - id: ring-two-walls
      title: "Выход внутри кольца толщиной в две стены"
      stdin: "9 9\nS........\n.........\n..#####..\n..#####..\n..##E##..\n..#####..\n..#####..\n.........\n.........\n"
      expected: "-1\n"
      compare: trim
      hidden: true
      hint: "Два слоя стен пройти нельзя - ответ -1."
    - id: state-matters-1
      title: "Нужны два состояния на клетку (1)"
      stdin: "7 7\nS.#.#..\n#...#.#\n##.##.#\n#..##.#\n##....#\n##..##.\n.###..E\n"
      expected: "12\n"
      compare: trim
      hidden: true
      hint: "Отметки visited[клетка] недостаточно: в одну клетку можно прийти с used = 0 и с used = 1; храните расстояние для каждой пары (клетка, used)."
    - id: state-matters-2
      title: "Нужны два состояния на клетку (2)"
      stdin: "6 5\nS.##.\n....#\n.##.#\n##.#.\n.###.\n.#.#E\n"
      expected: "9\n"
      compare: trim
      hidden: true
      hint: "Если пометить клетку при первом посещении, вы можете потерять более выгодный путь с неиспользованным тараном."
    - id: random-small
      title: "Случайная карта 30x30"
      stdin: "30 30\nS.......#...........#.#####..#\n.##.#.#...#.#.###..#..##.##.##\n#..##....#.###.......#.####.#.\n#....#.#.##...#.#..######..#..\n........##......#...#...##.#.#\n#..#.#...##.#.......##....#.#.\n....#.###.#....#........#.##..\n.#...#..#.##...#.#..........#.\n....##.#.........##.##..#..#.#\n....#.#......#.#......#.......\n##.#..#...#..#..#.#.##..#.....\n###..#..#......#.#...#..#.#.#.\n.#..#...##.##........##.#.....\n..###.####..#..#..##..##..#..#\n..##.##.##...##..##..###......\n###...##.#...#.##..#..##.#.#..\n##..#.#.###.....##.###..##...#\n.#..###.#.#......#.#..#...####\n##.#..##.#..##...##.#.........\n#.#.....#..#..#....##.#.#.....\n.....##...##.#...#..#.#.#.....\n#.#.##..........##..#.........\n#..##.##....#..##......#..##..\n#.##....#.###..#..##.#.#.#.##.\n#..#...###.#.....#..#..##.##..\n#.....#..##.####..#.....#.###.\n#.#.##..###.........#.##.###.#\n.......#.##.##.###..##....#..#\n###.......#..#####.#....#..#..\n###.##....#.#......#....##..#E\n"
      expected: "78\n"
      compare: trim
      hidden: true
      hint: "Сравните с перебором: пробить каждую стену, запустить BFS."
    - id: large-open
      title: "Большая карта 400x400 без стен"
      stdinFile: tests/large-open.in
      expected: "798\n"
      compare: trim
      hidden: true
      hint: "160 000 клеток: BFS должен посещать каждую клетку не более двух раз (по состояниям)."
    - id: large-snake
      title: "Большой змеевидный коридор 399x399"
      stdinFile: tests/large-snake.in
      expected: "78804\n"
      compare: trim
      hidden: true
      hint: "Очень длинный путь (десятки тысяч шагов): не используйте рекурсию (DFS) и list.pop(0)."
    - id: large-random
      title: "Большая случайная карта 400x400 (перебор стен не успеет)"
      stdinFile: tests/large-random.in
      expected: "884\n"
      compare: trim
      hidden: true
      hint: "Перебор вида «пробить каждую стену и запустить BFS» - десятки тысяч BFS по 160 000 клеток. Нужно состояние (клетка, used) и один BFS."
    - id: large-unreachable
      title: "Большая карта, выход за двойной стеной"
      stdinFile: tests/large-unreachable.in
      expected: "-1\n"
      compare: trim
      hidden: true
      hint: "Ответ -1: за двумя слоями стен выход недостижим."
