id: algorithms.foundations.sorting-inversions
title: Сортировка вставками и слиянием, подсчёт инверсий
goal: Понять, чем O(n^2) сортировка отличается от O(n log n), доказать корректность через инвариант и применить «разделяй и властвуй», чтобы посчитать инверсии за O(n log n).
difficulty: medium
estimatedMinutes: 90
prerequisites: [algorithms.foundations.complexity]
related: [algorithms.foundations.binary-search, python.fundamentals.lists]
next: [algorithms.foundations.two-pointers]
objectives:
  - Описать сортировку вставками, её инвариант и худший, лучший случаи; связать число сдвигов с числом инверсий.
  - Описать сортировку слиянием, вывести рекуррентность T(n) = 2T(n/2) + n и её решение Θ(n log n).
  - Объяснить устойчивость сортировки и почему слияние с условием «<=» устойчиво.
  - Модифицировать слияние так, чтобы оно считало инверсии, и обосновать, что ни одна пара не посчитана дважды и не пропущена.
  - Выбирать между встроенной сортировкой и собственной по ограничениям задачи.
masteryCriteria:
  - Вы формулируете инвариант сортировки вставками («префикс отсортирован») и инвариант слияния («выведено наименьшее из всех уже выбранных»).
  - Вы объясняете, почему в слиянии при взятии элемента из правой половины прибавляется len(left) - i.
  - Ваше решение подсчёта инверсий проходит тест из 100 000 элементов, где перебор пар не укладывается в лимит.
tags: [algorithms, sorting, insertion-sort, merge-sort, divide-and-conquer, inversions, stability]
facts:
  - kind: internals
    text: >-
      Встроенная сортировка Python (list.sort, sorted) - это Timsort, гибрид сортировки слиянием и вставками, разработанный Тимом Питерсом для Python в 2002 году. Он ищет в данных уже упорядоченные участки (runs)
      и сливает их, поэтому на почти отсортированных данных работает близко к O(n). Сортировка устойчива.
    sources:
      - https://docs.python.org/3/howto/sorting.html
      - https://github.com/python/cpython/blob/main/Objects/listsort.txt
  - kind: real-world
    text: >-
      Число инверсий - мера «насколько массив далёк от отсортированного». Оно используется при сравнении ранжирований (расстояние Кендалла, лежащее в основе коэффициента корреляции Кендалла τ) и
      показывает, сколько обменов соседних элементов нужно для сортировки.
    sources:
      - https://en.wikipedia.org/wiki/Inversion_(discrete_mathematics)
      - https://en.wikipedia.org/wiki/Kendall_tau_distance
  - kind: misconception
    text: >-
      «Сортировка вставками никогда не нужна, она слишком медленная». На коротких массивах (десятки элементов) и почти отсортированных данных она быстрее сложных алгоритмов из-за малой константы,
      поэтому гибридные сортировки в стандартных библиотеках используют её для коротких кусков.
  - kind: performance
    text: >-
      Любая сортировка, основанная только на сравнении элементов, в худшем случае делает Ω(n log n) сравнений: у дерева решений с n! листьями высота не меньше log2(n!) = Θ(n log n). Поэтому сортировка слиянием
      асимптотически оптимальна среди таких сортировок. Обойти границу можно, используя структуру ключей (сортировка подсчётом, поразрядная).
    sources:
      - https://en.wikipedia.org/wiki/Comparison_sort
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: |
        Сколько сдвигов элементов вправо выполнит сортировка вставками для массива [3, 1, 2]?
      options:
        - "1"
        - "2"
        - "3"
        - "0"
      answer: 1
      explanation: >-
        Инверсии массива: (3,1) и (3,2) - две. Сортировка вставками выполняет ровно по одному сдвигу на каждую инверсию: 1 встаёт перед 3 (один сдвиг), 2 встаёт перед 3 (один сдвиг).
    - id: q2
      type: numeric
      prompt: >-
        Сколько инверсий (пар i < j с a[i] > a[j]) в массиве, отсортированном по убыванию из 10 элементов?
      answer: 45
      tolerance: 0
      explanation: >-
        В массиве по убыванию инверсией является каждая пара, их n(n-1)/2 = 10·9/2 = 45.
    - id: q3
      type: single
      prompt: >-
        Рекуррентность сортировки слиянием: T(n) = 2·T(n/2) + c·n. Какова асимптотика?
      options:
        - "Θ(n)"
        - "Θ(n log n)"
        - "Θ(n^2)"
        - "Θ(log n)"
      answer: 1
      explanation: >-
        Дерево рекурсии имеет log2(n) уровней, на каждом суммарная работа слияний равна c·n. Итого c·n·log2(n).
    - id: q4
      type: multiple
      prompt: Какие утверждения верны для сортировки слиянием с условием «если left[i] <= right[j], взять left[i]»?
      options:
        - "Сортировка устойчива: равные элементы сохраняют исходный порядок"
        - "Нужна дополнительная память порядка O(n)"
        - "Время в худшем случае Θ(n log n)"
        - "Сортировка сортирует на месте за O(1) дополнительной памяти"
      answer: [0, 1, 2]
      explanation: >-
        Взятие левого элемента при равенстве сохраняет порядок равных; временный массив нужен для слияния; время не зависит от данных. Простое слияние не работает за O(1) памяти.
    - id: q5
      type: single
      prompt: >-
        При подсчёте инверсий в слиянии двух отсортированных половин мы берём элемент right[j] строго меньше left[i]. Сколько инверсий добавляется?
      options:
        - "1"
        - "len(left) - i"
        - "i"
        - "len(right) - j"
      answer: 1
      explanation: >-
        Левая половина отсортирована, поэтому right[j] меньше left[i] и меньше всех последующих элементов left (их len(left) - i штук), и все они стоят левее right[j] в исходном массиве.
complexity:
  time: "O(n log n)"
  space: "O(n)"
  explanation: "Сортировка слиянием: log n уровней по O(n) слияний; инверсии считаются при слиянии без дополнительной стоимости. Вспомогательный массив - O(n)."
editorial: editorial.md
exercise:
  id: algorithms.foundations.sorting-inversions.exercise
  title: Хаос в очереди
  prompt: |
    В очереди стоят `n` человек, рост `i`-го человека - `a_i`. Пару людей `(i, j)` с `i < j` назовём **неудобной**, если стоящий впереди выше стоящего позади, то есть `a_i > a_j`
    (при равном росте пара не считается неудобной).

    Посчитайте число неудобных пар.

    **Формат ввода.** Первая строка - `n` (1 <= n <= 200 000). Вторая строка - `n` целых чисел `a_i` (|a_i| <= 10^9).

    **Формат вывода.** Одно целое число - количество пар.

    **Пример 1.**

    ```
    5
    2 4 1 3 5
    ```
    Вывод: `3` (пары `2,1`, `4,1`, `4,3`).

    **Пример 2.**

    ```
    4
    7 7 7 7
    ```
    Вывод: `0`.

    **Замечание.** Ответ может достигать `n(n-1)/2` и не поместится в 32-битное целое. Перебор всех пар за O(n^2) не укладывается в лимит на больших тестах.
  evaluation: io
  variants:
    python: { entryFile: main.py }
    javascript: { entryFile: main.js }
    go: { entryFile: main.go }
    java: { entryFile: Main.java }
    cpp: { entryFile: main.cpp }
    rust: { entryFile: main.rs }
  hints:
    - "Подумайте о сортировке слиянием. Что известно про две уже отсортированные половины массива, когда вы собираетесь их слить? Где в слиянии «видно» пару, нарушающую порядок?"
    - "Каждая инверсия (i, j) относится ровно к одному уровню рекурсии: либо обе позиции в левой половине, либо обе в правой, либо i слева, а j справа. Первые два случая посчитают рекурсивные вызовы, третий - само слияние."
    - "В слиянии, когда вы берёте right[j] раньше, чем left[i] (то есть right[j] < left[i]), этот элемент образует инверсию со всеми ещё не взятыми элементами left: их len(left) - i. При равенстве берите left[i] (оно <=), чтобы равные не считались."
    - "Скелет: count(a) -> (sorted, inv); если len <= 1 вернуть (a, 0); mid = n // 2; (L, x) = count(левая), (R, y) = count(правая); слейте L и R, прибавляя len(L) - i при взятии из R; вернуть (merged, x + y + merged_inv). Счётчик - 64-битный."
  tests:
    - id: sample-1
      title: "Пример 1"
      stdin: "5\n2 4 1 3 5\n"
      expected: "3\n"
      compare: trim
      hint: "Неудобные пары: (2,1), (4,1), (4,3)."
    - id: equal
      title: "Равные элементы"
      stdin: "4\n7 7 7 7\n"
      expected: "0\n"
      compare: trim
      hint: "При равном росте пара не считается: сравнивайте строго (a_i > a_j), а при слиянии берите левый элемент при равенстве."
    - id: sorted
      title: "Уже отсортированный массив"
      stdin: "6\n1 2 3 4 5 6\n"
      expected: "0\n"
      compare: trim
      hint: "Отсортированный массив даёт 0."
    - id: single
      title: "Один человек"
      stdin: "1\n5\n"
      expected: "0\n"
      compare: trim
      hidden: true
      hint: "n = 1: пар нет."
    - id: negatives
      title: "Отрицательные числа и повторы"
      stdin: "7\n3 -1 3 -1 0 -5 3\n"
      expected: "10\n"
      compare: trim
      hidden: true
      hint: "Проверьте слияние на повторяющихся значениях."
    - id: reversed-small
      title: "Массив по убыванию, n = 1000"
      stdin: "1000\n1000 999 998 997 996 995 994 993 992 991 990 989 988 987 986 985 984 983 982 981 980 979 978 977 976 975 974 973 972 971 970 969 968 967 966 965 964 963 962 961 960 959 958 957 956 955 954 953 952 951 950 949 948 947 946 945 944 943 942 941 940 939 938 937 936 935 934 933 932 931 930 929 928 927 926 925 924 923 922 921 920 919 918 917 916 915 914 913 912 911 910 909 908 907 906 905 904 903 902 901 900 899 898 897 896 895 894 893 892 891 890 889 888 887 886 885 884 883 882 881 880 879 878 877 876 875 874 873 872 871 870 869 868 867 866 865 864 863 862 861 860 859 858 857 856 855 854 853 852 851 850 849 848 847 846 845 844 843 842 841 840 839 838 837 836 835 834 833 832 831 830 829 828 827 826 825 824 823 822 821 820 819 818 817 816 815 814 813 812 811 810 809 808 807 806 805 804 803 802 801 800 799 798 797 796 795 794 793 792 791 790 789 788 787 786 785 784 783 782 781 780 779 778 777 776 775 774 773 772 771 770 769 768 767 766 765 764 763 762 761 760 759 758 757 756 755 754 753 752 751 750 749 748 747 746 745 744 743 742 741 740 739 738 737 736 735 734 733 732 731 730 729 728 727 726 725 724 723 722 721 720 719 718 717 716 715 714 713 712 711 710 709 708 707 706 705 704 703 702 701 700 699 698 697 696 695 694 693 692 691 690 689 688 687 686 685 684 683 682 681 680 679 678 677 676 675 674 673 672 671 670 669 668 667 666 665 664 663 662 661 660 659 658 657 656 655 654 653 652 651 650 649 648 647 646 645 644 643 642 641 640 639 638 637 636 635 634 633 632 631 630 629 628 627 626 625 624 623 622 621 620 619 618 617 616 615 614 613 612 611 610 609 608 607 606 605 604 603 602 601 600 599 598 597 596 595 594 593 592 591 590 589 588 587 586 585 584 583 582 581 580 579 578 577 576 575 574 573 572 571 570 569 568 567 566 565 564 563 562 561 560 559 558 557 556 555 554 553 552 551 550 549 548 547 546 545 544 543 542 541 540 539 538 537 536 535 534 533 532 531 530 529 528 527 526 525 524 523 522 521 520 519 518 517 516 515 514 513 512 511 510 509 508 507 506