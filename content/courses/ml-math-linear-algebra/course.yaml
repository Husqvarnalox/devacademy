id: ml-math-linear-algebra
version: 1.0.0
title: "Линейная алгебра для машинного обучения"
description: >-
  Восемь уроков линейной алгебры, нужной для машинного обучения: векторы и линейные комбинации, скалярное произведение, нормы и косинусное сходство,
  матрицы как линейные отображения, умножение матриц и композиция слоёв, системы уравнений, определитель и обратная матрица, метод наименьших квадратов
  и нормальные уравнения, собственные значения и степенной метод, SVD и метод главных компонент. Каждое понятие связано с местом, где оно работает в моделях:
  линейный слой, поиск по эмбеддингам, линейная регрессия, PageRank, PCA. В каждом уроке основное упражнение решается вручную на чистом Python (списки и циклы),
  а задача повышенной сложности - на NumPy 2.x; тесты сравнивают числа с явными допусками, данные детерминированы, GPU не нужен.
languageId: python
level: 2
track: ml-math
requires: [python-fundamentals]
lessons:
  - 01-vectors
  - 02-dot-product
  - 03-matrices
  - 04-matrix-multiplication
  - 05-linear-systems
  - 06-least-squares
  - 07-eigenvalues
  - 08-svd-pca
