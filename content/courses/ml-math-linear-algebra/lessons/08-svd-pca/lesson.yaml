id: "ml.math.svd-pca"
title: "SVD и PCA: низкоранговое приближение"
goal: "Найти главную сингулярную тройку и первую главную компоненту на чистом Python, а на NumPy построить приближение ранга k, оценить его ошибку, выбрать ранг по доле энергии и посчитать экономию памяти."
difficulty: "hard"
estimatedMinutes: 90
prerequisites:
  - "ml.math.eigenvalues"
related:
  - "ml.numpy.pca"
  - "ml.foundations.linear-regression"
  - "python.numpy.linear-algebra"
next: []
objectives:
  - "Записать A = UΣVᵀ для прямоугольной матрицы, назвать свойства U, Σ, V и связать сингулярные числа с собственными значениями AᵀA."
  - "Объяснить, что ранг матрицы - число ненулевых сингулярных чисел, а A раскладывается в сумму слоёв ранга 1."
  - "Сформулировать теорему Эккарта - Янга и вычислять ошибку приближения ранга k через отброшенные сингулярные числа."
  - "Найти главную сингулярную тройку степенным методом для AᵀA и получить из неё приближение ранга 1."
  - "Выполнить PCA как SVD центрированных данных: найти среднее, первую компоненту и координаты объектов вдоль неё."
  - "Выбрать ранг по доле сохранённой энергии и оценить выигрыш по памяти k(m + n + 1) / (mn) (задача повышенной сложности)."
masteryCriteria:
  - "top_singular_triplet возвращает sigma, u, v с A v = sigma u, единичными u и v и зафиксированным знаком и выбрасывает ValueError для нулевой матрицы."
  - "rank_one_approximation, first_principal_component и project дают точное приближение ранга 1, главную компоненту центрированных данных и координаты с нулевым средним."
  - "low_rank_approx и approximation_error совпадают с формулой Эккарта - Янга, choose_rank учитывает допуск при energy = 1, а storage_ratio равна k(m + n + 1) / (mn)."
tags:
  - "linear-algebra"
  - "svd"
  - "pca"
  - "low-rank"
  - "ml-math"
facts:
  - kind: "internals"
    text: "np.linalg.svd возвращает разложение A = U diag(s) Vh, где третий результат - уже транспонированная матрица Vh, а не V; при full_matrices=False матрицы U и Vh имеют только min(m, n) векторов."
    sources:
      - "https://numpy.org/doc/stable/reference/generated/numpy.linalg.svd.html"
  - kind: "internals"
    text: "Сингулярные числа в np.linalg.svd возвращаются в порядке убывания; знаки сингулярных векторов функцией не фиксируются, поэтому сравнивать их нужно с точностью до знака."
    sources:
      - "https://numpy.org/doc/stable/reference/generated/numpy.linalg.svd.html"
  - kind: "internals"
    text: "Норма Фробениуса np.linalg.norm(A, 'fro') равна корню из суммы квадратов всех элементов матрицы и совпадает с корнем из суммы квадратов её сингулярных чисел."
    sources:
      - "https://numpy.org/doc/stable/reference/generated/numpy.linalg.norm.html"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Матрица A имеет размер 6 × 4. Какие размеры имеют U, Σ и V в полном разложении A = UΣVᵀ?"
      options:
        - "U: 6 × 6, Σ: 6 × 4, V: 4 × 4"
        - "U: 4 × 4, Σ: 4 × 6, V: 6 × 6"
        - "U: 6 × 4, Σ: 6 × 6, V: 4 × 4"
        - "Все три матрицы 6 × 4"
      answer: 0
      explanation: "U действует в пространстве столбцов длины m = 6, V - в пространстве длины n = 4, а Σ связывает их и имеет размер m × n. Вариант с U 4 × 4 перепутал роли m и n."
    - id: "q2"
      type: "multiple"
      prompt: "Что верно для сингулярных чисел матрицы A?"
      options:
        - "Число ненулевых сингулярных чисел равно рангу A"
        - "Их всегда ровно столько же, сколько строк в A"
        - "Они неотрицательны"
        - "Их квадраты - собственные значения AᵀA"
      answer:
        - 0
        - 2
        - 3
      explanation: "Первые три утверждения - определение и базовые свойства. Количество ненулевых чисел не больше min(m, n), а не обязательно равно числу строк: у матрицы 6 × 4 их не больше четырёх."
    - id: "q3"
      type: "numeric"
      prompt: "Сингулярные числа матрицы равны 5, 3, 1 и 0. Чему равна норма Фробениуса ошибки наилучшего приближения ранга 2?"
      answer: 1
      tolerance: 0.001
      explanation: "По теореме Эккарта - Янга ошибка равна корню из суммы квадратов отброшенных чисел: sqrt(1² + 0²) = 1."
    - id: "q4"
      type: "numeric"
      prompt: "Матрица 100 × 50 заменена тремя главными тройками (U[:, :3], s[:3], V[:, :3]). Сколько чисел нужно хранить?"
      answer: 453
      tolerance: 0.001
      explanation: "k(m + n + 1) = 3 · (100 + 50 + 1) = 453 числа вместо 5000 в исходной матрице."
    - id: "q5"
      type: "single"
      prompt: "Что произойдёт, если выполнить PCA через SVD, не вычтя среднее по столбцам?"
      options:
        - "Сингулярные числа станут отрицательными"
        - "Ничего: результат совпадёт с PCA центрированных данных"
        - "Первая компонента будет указывать примерно на среднее значение данных, а не на направление наибольшего разброса"
        - "SVD перестанет существовать"
      answer: 2
      explanation: "SVD существует для любой матрицы, но без центрирования самый сильный слой описывает смещение облака от нуля, а не его разброс вокруг среднего. Сингулярные числа неотрицательны всегда."
exercise:
  id: "ml.math.svd-pca.exercise"
  title: "Главная сингулярная тройка и первая компонента на чистом Python"
  prompt: |
    В файле `svd_task.py` реализуйте четыре функции. Только стандартная библиотека Python (`math` можно); ничего не печатайте и не изменяйте входные данные. Матрица - список строк, вектор - список чисел.

    1. `top_singular_triplet(A, num_iters=1000, tol=1e-12)` - возвращает `(sigma, u, v)` для матрицы `A` с `m` строками и `n` столбцами. Степенной метод для `AᵀA`: старт `v` - строка `A` с наибольшей длиной (первая при равенстве), нормированная на длину 1: тогда `A v ≠ 0` для любой ненулевой `A` (её `i`-я компонента равна `‖a_i‖`), и метод не застрянет, даже если вектор `[1, 1, ..., 1]` лежит в ядре. На каждом шаге `w = Aᵀ(A v)`; если `‖w‖ == 0`, `ValueError`; `v_new = w / ‖w‖`, затем **фиксация знака**: компонента с наибольшим модулем (при равенстве - с меньшим индексом) должна быть положительной. Остановка, когда `‖v_new - v‖ < tol` или выполнено `num_iters` шагов. Затем `sigma = ‖A v‖` и `u = A v / sigma` (длина `m`). Для нулевой матрицы `ValueError`.
    2. `rank_one_approximation(A)` - матрица `sigma · u vᵀ` той же формы, что `A`, списком строк.
    3. `first_principal_component(X)` - для списка объектов-строк возвращает `(mean, component)`: `mean` - среднее по каждому столбцу, `component` - главный правый сингулярный вектор **центрированных** данных. Если строк меньше двух, `ValueError`.
    4. `project(X, mean, component)` - список чисел: для каждой строки `x` значение `(x - mean) · component`.

    **Пример.**

    ```python
    top_singular_triplet([[3, 0], [0, 1]])                # (3.0, [1.0, 0.0], [1.0, 0.0])
    rank_one_approximation([[3, 0], [0, 1]])              # [[3.0, 0.0], [0.0, 0.0]]
    first_principal_component([[0, 0], [1, 1], [2, 2]])   # ([1.0, 1.0], [0.7071..., 0.7071...])
    project([[0, 0], [1, 1], [2, 2]], [1, 1], [0.7071067811865476, 0.7071067811865476])
    # [-1.4142..., 0.0, 1.4142...]
    ```

    Тесты сравнивают результат с независимым расчётом для матриц с двумя столбцами, проверяют `A v = sigma u`, точное восстановление матрицы ранга 1, ошибки на вырожденных данных и неизменность входов.
  entryFile: "svd_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Заведите matvec(A, v), transpose(A) и norm(v). Стартовый вектор - max(A, key=norm), делённый на свою длину. Тогда шаг метода - w = matvec(At, matvec(A, v)), где At = transpose(A); вычислять AᵀA целиком не нужно."
    - "Знак фиксируйте тем же приёмом, что в степенном методе: k = max(range(n), key=lambda i: abs(v[i])); если v[k] < 0, умножьте все компоненты на -1. После цикла sigma = norm(Av), u = [x / sigma for x in Av]."
    - "rank_one_approximation: элемент (i, j) равен sigma * u[i] * v[j]. Ошибка нулевой матрицы приходит из top_singular_triplet, отдельно проверять её не нужно."
    - "first_principal_component: вычислите mean по столбцам, постройте centered = [[x - m for x, m in zip(row, mean)] for row in X], возьмите v из top_singular_triplet(centered). project - скалярное произведение центрированной строки с component."
  tests:
    - id: "singular-diag"
      title: "Диагональные и простые матрицы"
      hint: "Для diag(3, 1) sigma = 3, u = v = (1, 0); у u длина m, у v длина n."
    - id: "sigma-reference"
      title: "Сравнение с независимым расчётом"
      hint: "A v = sigma u, AᵀA v = sigma² v, а sigma не меньше нормы любого столбца."
    - id: "rank-one"
      title: "Приближение ранга 1"
      hint: "Матрица u0 v0ᵀ восстанавливается точно; для diag(3, 1) остаётся diag(3, 0)."
    - id: "principal-component"
      title: "Главная компонента облака точек (скрытый)"
      hidden: true
      hint: "Центрируйте данные перед поиском вектора; точки около прямой y = 2x дают компоненту около (1, 2)/sqrt(5), а точки на прямой y = -x - компоненту (1, -1)/sqrt(2) с точностью до знака."
    - id: "project-scores"
      title: "Координаты вдоль компоненты (скрытый)"
      hidden: true
      hint: "Координаты центрированных данных имеют нулевое среднее, а сумма их квадратов равна sigma² центрированной матрицы."
    - id: "errors"
      title: "Нулевая матрица и один объект (скрытый)"
      hidden: true
      hint: "Нулевая матрица, одинаковые объекты после центрирования и единственная строка дают ValueError."
    - id: "no-mutation-ints"
      title: "Целые числа и неизменность входов (скрытый)"
      hidden: true
      hint: "Целочисленные списки допустимы, входные матрицы не меняются, rank_one_approximation возвращает новую матрицу."
challenge:
  id: "ml.math.svd-pca.challenge"
  title: "Низкоранговое приближение на NumPy"
  prompt: |
    Задача повышенной сложности: SVD на NumPy. Нужен NumPy 2.x. В файле `lowrank_task.py` реализуйте четыре функции, ничего не печатайте и не изменяйте входные массивы.

    1. `low_rank_approx(A, k)` - лучшее приближение `A` матрицей ранга не выше `k`, массив `(m, n)` типа float. Используйте `np.linalg.svd(A, full_matrices=False)` и оставьте `k` главных троек. При `k = 0` результат нулевой; при `k < 0` или `k > min(m, n)` - `ValueError`.
    2. `approximation_error(A, k)` - норма Фробениуса разности `A - A_k`.
    3. `choose_rank(A, energy)` - наименьшее `k`, для которого `sum(s[:k]**2) / sum(s**2) >= energy` (`s` - сингулярные числа). `energy` должна быть в `(0, 1]`, иначе `ValueError`. Сравнивайте с допуском `ratio >= energy - 1e-12`. Для нулевой матрицы верните `0`.
    4. `storage_ratio(m, n, k)` - доля памяти, которую занимают `k` главных троек, по формуле `k (m + n + 1) / (m n)`.

    **Пример.**

    ```python
    A = np.diag([5.0, 3.0, 1.0])
    approximation_error(A, 2)    # 1.0
    choose_rank(A, 0.9)          # 2: (25 + 9) / 35 = 0.971
    storage_ratio(100, 50, 3)    # 0.0906
    ```

    Тесты сравнивают ошибку с корнем из суммы отброшенных `s²`, проверяют точное восстановление матрицы низкого ранга, монотонность ошибки по `k`, граничные значения `k` и `energy` и форму результата.
  entryFile: "lowrank_task.py"
  starter: "challenge/starter"
  solution: "challenge/solution"
  evaluation: "harness"
  harness: "challenge/harness"
  harnessEntry: "check.py"
  requires:
    packages:
      - "numpy>=2"
  hints:
    - "U, s, Vt = np.linalg.svd(A, full_matrices=False). Приближение ранга k: (U[:, :k] * s[:k]) @ Vt[:k]. Приведите вход к float: np.asarray(A, dtype=float)."
    - "Ошибку можно вычислить двумя способами: norm(A - A_k, 'fro') или np.sqrt(np.sum(s[k:] ** 2)). Оба должны совпасть."
    - "choose_rank: ratios = np.cumsum(s ** 2) / np.sum(s ** 2); ищите первый индекс, где ratios >= energy - 1e-12, и прибавьте 1. Нулевую матрицу обработайте до деления."
    - "storage_ratio - одна формула; не вызывайте SVD. Проверьте её на примере 100 × 50 и k = 3: 453 / 5000."
  tests:
    - id: "error-formula"
      title: "Ошибка равна корню из суммы отброшенных s²"
      hint: "Теорема Эккарта - Янга: sqrt(sum(s[k:]**2)); полное приближение при k = min(m, n) даёт ошибку 0."
    - id: "exact-low-rank"
      title: "Точное восстановление матрицы низкого ранга"
      hint: "Если rank(A) = r, то приближение ранга r совпадает с A."
    - id: "choose-rank"
      title: "Выбор ранга по энергии"
      hint: "Накопленная доля sum(s[:k]**2) / sum(s**2) сравнивается с energy; берётся наименьшее подходящее k."
    - id: "monotone-optimal"
      title: "Монотонность и оптимальность (скрытый)"
      hidden: true
      hint: "Ошибка не растёт с k и не больше ошибки произвольной матрицы того же ранга."
    - id: "edges-shapes"
      title: "Граничные k, формы и неизменность входа (скрытый)"
      hidden: true
      hint: "k = 0 даёт нули, k вне [0, min(m, n)] - ValueError, прямоугольные и целочисленные входы допустимы, A не меняется."
    - id: "choose-rank-edges"
      title: "Граничные значения energy (скрытый)"
      hidden: true
      hint: "energy = 1.0 даёт ранг матрицы, а не min(m, n) из-за округления; energy вне (0, 1] и нулевая матрица обрабатываются отдельно."
    - id: "storage-ratio"
      title: "Доля памяти (скрытый)"
      hidden: true
      hint: "k (m + n + 1) / (m n); для малого k выигрыш велик, при больших k доля может превысить 1."
