id: "ml.math.linear-systems"
title: "Системы линейных уравнений, обратная матрица и определитель"
goal: "Решать систему A x = b методом Гаусса с выбором ведущего элемента, находить определитель и обратную матрицу и оценивать чувствительность решения к ошибкам."
difficulty: "medium"
estimatedMinutes: 70
prerequisites:
  - "ml.math.matrix-multiplication"
related:
  - "python.fundamentals.lists"
next:
  - "ml.math.least-squares"
seeAlso:
  - "Массивы NumPy, срезы и broadcasting подробно: курс «NumPy: массивы и векторизация»"
objectives:
  - "Записать задачу в виде системы A x = b и объяснить, что найти x значит найти вектор, который A переводит в b."
  - "Выполнить прямой ход метода Гаусса с частичным выбором ведущего элемента и обратную подстановку, объяснить, зачем нужна перестановка строк."
  - "Распознать вырожденную матрицу (зависимые строки или признаки) и объяснить, почему решения нет или оно не единственно."
  - "Вычислить определитель через ведущие элементы и знак перестановок и объяснить его геометрический смысл (масштаб площади или объёма)."
  - "Найти обратную матрицу методом Гаусса - Жордана, объяснить, почему на практике решают систему, а не обращают матрицу, и оценить обусловленность через число обусловленности."
masteryCriteria:
  - "solve возвращает решения систем 1 × 1, 2 × 2, 3 × 3 и систем с нулём на месте первого ведущего элемента, принимает целые числа и не меняет входные списки."
  - "solve и inverse выбрасывают ValueError для неквадратной и вырожденной матрицы, solve - ещё и при несовпадении длины b."
  - "determinant возвращает float, меняет знак при каждой перестановке строк и возвращает 0.0 (а не ошибку) для вырожденной матрицы; inverse(A), умноженная на A, даёт единичную матрицу."
  - "solve_many решает систему для нескольких правых частей, relative_residual считает ||A x - b|| / ||b||, perturbation_ratio лежит между 1/cond(A) и cond(A) и велико для почти вырожденной матрицы."
tags:
  - "linear-algebra"
  - "gaussian-elimination"
  - "determinant"
  - "inverse-matrix"
  - "condition-number"
  - "ml-math"
facts:
  - kind: "internals"
    text: "numpy.linalg.solve решает A x = b разложением матрицы (LU с выбором ведущего элемента из библиотеки LAPACK), а не вычислением обратной матрицы; для вырожденной матрицы выбрасывает LinAlgError."
    sources:
      - "https://numpy.org/doc/stable/reference/generated/numpy.linalg.solve.html"
  - kind: "internals"
    text: "numpy.linalg.cond возвращает число обусловленности матрицы; при норме по умолчанию оно равно отношению наибольшего сингулярного числа к наименьшему."
    sources:
      - "https://numpy.org/doc/stable/reference/generated/numpy.linalg.cond.html"
  - kind: "internals"
    text: "numpy.linalg.det возвращает определитель, вычисленный через LU-разложение; для почти вырожденных матриц результат из-за округления может быть очень малым числом, а не точным нулём."
    sources:
      - "https://numpy.org/doc/stable/reference/generated/numpy.linalg.det.html"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Система x + 2y = 3, 2x + 4y = 7. Что можно сказать о её решениях?"
      options:
        - "Бесконечно много решений"
        - "Единственное решение, его находит метод Гаусса"
        - "Решений нет: левая часть второго уравнения вдвое больше первой, а правая - нет"
        - "Решение есть всегда, потому что число уравнений равно числу неизвестных"
      answer: 2
      explanation: "Строки матрицы пропорциональны, значит A вырождена. Вычитая из второго уравнения удвоенное первое, получаем 0 = 1: противоречие, решений нет. Бесконечно много решений было бы при согласованных правых частях (например, 3 и 6); равенство числа уравнений и неизвестных само по себе единственности не гарантирует."
    - id: "q2"
      type: "numeric"
      prompt: "Чему равен определитель матрицы [[2, 5], [1, 3]]?"
      answer: 1
      tolerance: 0.001
      explanation: "Для 2 × 2 определитель равен a·d - b·c = 2·3 - 5·1 = 1. Если взять 2·3 + 5·1, получится 11: знак между произведениями диагоналей должен быть минусом."
    - id: "q3"
      type: "multiple"
      prompt: "Какие утверждения о квадратной матрице A верны?"
      options:
        - "Если A обратима, то система A x = b имеет единственное решение x = A⁻¹ b"
        - "Если det A = 0, система A x = b не имеет единственного решения"
        - "Перестановка двух строк меняет знак определителя"
        - "Если det A = 0, то A можно обратить, просто округлив результат"
      answer:
        - 0
        - 1
        - 2
      explanation: "Нулевой определитель означает вырожденность: строки линейно зависимы, и решение либо отсутствует, либо не единственно. Перестановка строк меняет знак det. Обратимость и единственность решения эквивалентны. Для вырожденной матрицы обратной не существует, округление этого не исправит."
    - id: "q4"
      type: "single"
      prompt: "Почему в коде для ML решают систему через np.linalg.solve(A, b), а не вычисляют np.linalg.inv(A) @ b?"
      options:
        - "Потому что результаты solve и inv всегда различаются на порядок"
        - "Потому что inv работает только для матриц 2 × 2"
        - "Потому что обратная матрица не существует ни у одной матрицы"
        - "solve быстрее и обычно точнее: не нужно строить всю обратную матрицу"
      answer: 3
      explanation: "Вычисление обратной матрицы - это n систем с единичными правыми частями, то есть примерно втрое больше работы, и накапливает больше ошибки округления. Для обратимой матрицы результаты математически равны, на практике различаются на ошибку округления, а не на порядок."
    - id: "q5"
      type: "single"
      prompt: "Число обусловленности матрицы A около 10⁸. Что это означает для системы A x = b?"
      options:
        - "Система имеет 10⁸ решений"
        - "Решение x в 10⁸ раз больше правой части b"
        - "Малая относительная ошибка в b может превратиться в ошибку в x, большую до 10⁸ раз"
        - "Определитель матрицы равен 10⁸"
      answer: 2
      explanation: "cond(A) ограничивает сверху, во сколько раз относительная ошибка решения может превысить относительную ошибку правой части. Число решений определяется рангом, а не обусловленностью, и по определителю обусловленность не читается: у матрицы 0.001·I определитель крошечный, а cond равно 1."
exercise:
  id: "ml.math.linear-systems.exercise"
  title: "Метод Гаусса, определитель и обратная матрица на чистом Python"
  prompt: |
    В файле `gauss_task.py` реализуйте три функции. Только стандартная библиотека Python; ничего не печатайте и **не изменяйте** аргументы (работайте с копиями). Матрица - список строк (списков чисел), допустимы целые числа.

    1. `solve(A, b)` - решение системы `A x = b` методом Гаусса с частичным выбором ведущего элемента (на каждом шаге берите строку с наибольшим по модулю элементом в текущем столбце) и обратной подстановкой. Верните список `float`. `ValueError`, если `A` не квадратная, `len(b)` не равна её размеру или матрица вырождена (наибольший по модулю кандидат в ведущие элементы меньше `1e-12`).
    2. `determinant(A)` - определитель как произведение ведущих элементов со знаком `(-1)^s`, где `s` - число перестановок строк. Для вырожденной матрицы верните `0.0` (это не ошибка). `ValueError` для неквадратной матрицы.
    3. `inverse(A)` - обратная матрица методом Гаусса - Жордана над расширенной матрицей `[A | I]`. `ValueError` для неквадратной и вырожденной матриц.

    **Пример.**

    ```python
    solve([[2, 1], [1, -1]], [5, 1])      # [2.0, 1.0]
    determinant([[0, 1], [1, 0]])         # -1.0
    inverse([[4, 7], [2, 6]])             # [[0.6, -0.7], [-0.2, 0.4]]
    ```

    Тесты сравнивают числа с допуском `1e-9`, проверяют системы с нулём на месте первого ведущего элемента, вырожденные матрицы, знак определителя и то, что входные данные не меняются.
  entryFile: "gauss_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Начните с проверок: матрица квадратная, len(b) совпадает с её размером. Затем сделайте копию: M = [list(map(float, row)) for row in A], чтобы не менять входной список."
    - "Прямой ход: для каждого столбца col найдите строку p >= col с наибольшим abs(M[p][col]). Если это число меньше 1e-12, матрица вырождена. Иначе поменяйте строки col и p местами и обнулите элементы столбца под диагональю, вычитая из строки r строку col, умноженную на M[r][col] / M[col][col]."
    - "Обратная подстановка идёт снизу вверх: x[i] = (b[i] - сумма M[i][j] * x[j] по j > i) / M[i][i]. Правую часть удобно хранить как последний столбец расширенной матрицы."
    - "determinant - тот же прямой ход: умножайте результат на ведущие элементы и меняйте знак при каждой перестановке строк; при вырожденности возвращайте 0.0. inverse: расширьте M единичной матрицей справа, после прямого хода нормируйте строки на ведущий элемент и обнуляйте элементы и над диагональю; правая половина станет A⁻¹."
  tests:
    - id: "solve-basic"
      title: "Решение систем 2 × 2, 3 × 3 и 4 × 4"
      hint: "Подстановка найденного x в A x должна давать b; решения известны заранее."
    - id: "solve-swap"
      title: "Системы, которым нужна перестановка строк"
      hint: "Нулевой или очень малый элемент на месте ведущего требует выбрать строку с наибольшим по модулю элементом."
    - id: "det-inverse"
      title: "Определитель и обратная матрица"
      hint: "Определитель 2 × 2 равен ad - bc, перестановка строк меняет знак, A на inverse(A) даёт единичную матрицу."
    - id: "errors"
      title: "Ошибки: неквадратные и вырожденные матрицы (скрытый)"
      hidden: true
      hint: "Неквадратная матрица, неверная длина b и вырожденная матрица (пропорциональные, нулевые, зависимые строки) - ValueError."
    - id: "determinant-edge"
      title: "Определитель: вырожденные, треугольные, 1 × 1 (скрытый)"
      hidden: true
      hint: "У вырожденной матрицы определитель равен 0.0, у треугольной - произведению диагонали, у 1 × 1 - самому элементу."
    - id: "inverse-edge"
      title: "Обратная матрица: 1 × 1, перестановки, обратная к обратной (скрытый)"
      hidden: true
      hint: "Обратная матрица ищется и при нуле на диагонали, а обращение дважды возвращает исходную матрицу."
    - id: "no-mutation"
      title: "Входные данные не меняются, целые числа принимаются (скрытый)"
      hidden: true
      hint: "Работайте с копиями; результаты - новые списки с числами типа float."
challenge:
  id: "ml.math.linear-systems.challenge"
  title: "Несколько правых частей, невязка и обусловленность на NumPy"
  prompt: |
    Задача повышенной сложности: те же системы на массивах NumPy и измерение чувствительности решения. Нужен NumPy 2.x; основы массивов - в курсе «NumPy: массивы и векторизация». В файле `conditioning_task.py` реализуйте три функции, ничего не печатайте и не изменяйте входные массивы.

    1. `solve_many(A, B)` - решение `A X = B`, где `A` формы `(n, n)`, а `B` формы `(n, k)`: каждый столбец `B` - отдельная правая часть. Верните массив `X` формы `(n, k)` типа `float`, используйте `np.linalg.solve`. Для вырожденной `A` допустим `numpy.linalg.LinAlgError`; несовпадение числа строк `B` и размера `A` - `ValueError`.
    2. `relative_residual(A, x, b)` - относительная невязка `||A x - b|| / ||b||` (норма L2). Если `||b|| == 0`, верните `||A x||`. Результат - число `float`.
    3. `perturbation_ratio(A, b, db)` - во сколько раз относительная ошибка решения больше относительной ошибки правой части: пусть `x = solve(A, b)` и `x + dx = solve(A, b + db)`, верните `(||dx|| / ||x||) / (||db|| / ||b||)`. Считайте `b` и `db` ненулевыми.

    **Пример.**

    ```python
    H = np.array([[1.0, 1.0], [1.0, 1.0001]])
    perturbation_ratio(H, np.array([2.0, 2.0001]), np.array([0.0, 0.00005]))   # около 2.8e4
    ```

    Тесты сравнивают результат с `np.linalg.solve` на случайных данных (`np.random.default_rng`), проверяют, что отношение лежит между `1/cond(A)` и `cond(A)`, и что у почти вырожденной матрицы оно велико.
  entryFile: "conditioning_task.py"
  starter: "challenge/starter"
  solution: "challenge/solution"
  evaluation: "harness"
  harness: "challenge/harness"
  harnessEntry: "check.py"
  requires:
    packages:
      - "numpy>=2"
  hints:
    - "solve_many: np.linalg.solve(A, B) уже умеет решать сразу для матрицы B, где столбцы - разные правые части. Приведите вход к float: np.asarray(A, dtype=float)."
    - "relative_residual: невязка r = A @ x - b, норма np.linalg.norm(r). Разделите на np.linalg.norm(b); случай нулевого b обработайте отдельной веткой до деления."
    - "perturbation_ratio: найдите x = np.linalg.solve(A, b) и x2 = np.linalg.solve(A, b + db), затем dx = x2 - x. Относительная ошибка - отношение норм: np.linalg.norm(dx) / np.linalg.norm(x)."
    - "Итог: (norm(dx) / norm(x)) / (norm(db) / norm(b)). Приведите результат к float(...), чтобы вернуть число, а не 0-мерный массив."
  tests:
    - id: "solve-many-basic"
      title: "Несколько правых частей сразу"
      hint: "Каждый столбец X решает систему с соответствующим столбцом B; A @ X равно B."
    - id: "residual-basic"
      title: "Относительная невязка"
      hint: "Норма A x - b, делённая на норму b; у точного решения невязка близка к нулю."
    - id: "ratio-basic"
      title: "Отношение относительных ошибок"
      hint: "Для единичной матрицы ошибка не усиливается, для diag(1, 10) считается по определению."
    - id: "solve-many-random"
      title: "Случайные системы против np.linalg.solve (скрытый)"
      hidden: true
      hint: "Результат совпадает со столбцовым решением системы, форма (n, k), в том числе при k = 1."
    - id: "residual-edges"
      title: "Невязка: нулевая правая часть, нулевое решение (скрытый)"
      hidden: true
      hint: "При ||b|| = 0 возвращается ||A x||; результат - float, целочисленный вход принимается."
    - id: "ratio-bounds"
      title: "Отношение между 1/cond и cond (скрытый)"
      hidden: true
      hint: "Усиление ошибки не может быть больше числа обусловленности и меньше обратной к нему величины."
    - id: "ratio-ill-conditioned"
      title: "Почти вырожденная матрица (скрытый)"
      hidden: true
      hint: "Малое возмущение правой части даёт большое относительное изменение решения, когда cond(A) велико."
    - id: "errors-no-mutation"
      title: "Ошибки, целые числа, входы не меняются (скрытый)"
      hidden: true
      hint: "Вырожденная матрица даёт LinAlgError, несовпадающие формы - ValueError; результат float, входы нетронуты."
