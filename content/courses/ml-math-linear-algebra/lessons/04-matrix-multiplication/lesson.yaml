id: "ml.math.matrix-multiplication"
title: "Умножение матриц: композиция отображений и слоёв"
goal: "Реализовать умножение матриц, степень матрицы и свёртку цепочки линейных слоёв в одну матрицу на чистом Python."
difficulty: "medium"
estimatedMinutes: 65
prerequisites:
  - "ml.math.matrices"
related:
  - "python.fundamentals.lists"
next:
  - "ml.math.linear-systems"
seeAlso:
  - "Массивы NumPy, оператор @ и формы подробно: курс «NumPy: массивы и векторизация»"
objectives:
  - "Вычислить (A B)_ij как скалярное произведение строки на столбец и определить форму произведения (m × n)(n × p)."
  - "Объяснить, что A B - композиция отображений («сначала B, потом A»), и показать на примере, что A B ≠ B A."
  - "Применять ассоциативность, дистрибутивность, единичную матрицу и правило (A B)ᵀ = Bᵀ Aᵀ."
  - "Оценить стоимость произведения m·n·p и выбрать порядок скобок, при котором вычисления дешевле."
  - "Свернуть два линейных слоя в один и объяснить, зачем в сети нужна нелинейность; считать многошаговые процессы степенями матрицы (задача повышенной сложности)."
masteryCriteria:
  - "matmul совпадает с определением c_ij = Σ a_ik·b_kj для матриц разной формы, не перестановочен и выбрасывает ValueError при несовпадении внутренних размерностей."
  - "identity и matrix_power возвращают float-матрицы; нулевая степень - единичная матрица; для неквадратной матрицы и отрицательной степени выбрасывается ValueError."
  - "compose_linear_layers возвращает Ws[-1] ... Ws[0] и даёт тот же результат, что слои, применённые по очереди; результат - новые списки."
  - "collapse_affine_layers возвращает (W, b), эквивалентные цепочке слоёв x -> W_i x + b_i; markov_distribution считает p0 @ P^steps и проверяет стохастичность."
tags:
  - "linear-algebra"
  - "matrix-multiplication"
  - "composition"
  - "markov-chain"
  - "ml-math"
facts:
  - kind: "internals"
    text: "Оператор @ и numpy.matmul вычисляют матричное произведение, а оператор * перемножает массивы поэлементно; при несовпадении внутренних размерностей возникает ValueError."
    sources:
      - "https://numpy.org/doc/stable/reference/generated/numpy.matmul.html"
  - kind: "internals"
    text: "numpy.linalg.matrix_power возводит квадратную матрицу в целую степень (степень 0 даёт единичную матрицу) и использует быстрое возведение в степень повторным возведением в квадрат."
    sources:
      - "https://numpy.org/doc/stable/reference/generated/numpy.linalg.matrix_power.html"
  - kind: "internals"
    text: "Для списков Python выражение zip(*B) распаковывает строки B как аргументы zip и поэтому возвращает столбцы B; это удобно для скалярного произведения строки A на столбец B."
    sources:
      - "https://docs.python.org/3/library/functions.html#zip"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Матрица A имеет форму 2 × 3, матрица B - форму 3 × 5. Какую форму имеет A B?"
      options:
        - "Произведение не определено"
        - "3 × 3"
        - "5 × 2"
        - "2 × 5"
      answer: 3
      explanation: "Внутренние размеры (3 и 3) совпадают и исчезают, остаются внешние: 2 × 5. Произведение B A не определено (5 столбцов B не равны 2 строкам A), поэтому порядок множителей важен."
    - id: "q2"
      type: "numeric"
      prompt: "Пусть A = [[1, 2], [3, 4]] и B = [[5, 6], [7, 8]]. Найдите элемент A B во второй строке и первом столбце."
      answer: 43
      tolerance: 0.001
      explanation: "Это скалярное произведение второй строки A, [3, 4], на первый столбец B, [5, 7]: 3·5 + 4·7 = 43. Если перепутать порядок и взять строку B на столбец A, получится другое число (6·1 + 8·3 = 30 для B A)."
    - id: "q3"
      type: "multiple"
      prompt: "Какие равенства верны для матриц подходящих форм?"
      options:
        - "(A B) C = A (B C)"
        - "A B = B A"
        - "(A B)ᵀ = Bᵀ Aᵀ"
        - "A I = A, где I - единичная матрица"
      answer:
        - 0
        - 2
        - 3
      explanation: "Умножение матриц ассоциативно, транспонирование меняет порядок множителей, а единичная матрица - нейтральный элемент. Равенство A B = B A в общем случае неверно: для сдвигов [[1, 1], [0, 1]] и [[1, 0], [1, 1]] произведения различаются."
    - id: "q4"
      type: "single"
      prompt: "Сеть y = W2 (W1 x) состоит из двух линейных слоёв без функции активации между ними. Что верно?"
      options:
        - "Она эквивалентна одному слою с матрицей W1 W2"
        - "Она эквивалентна одному линейному слою с матрицей W2 W1"
        - "Она способна выразить больше функций, чем один линейный слой"
        - "Она эквивалентна слою с матрицей W1 + W2"
      answer: 1
      explanation: "Из ассоциативности W2 (W1 x) = (W2 W1) x: первым действует W1, поэтому он стоит справа. Матрица W1 W2 чаще даже не определена по формам. Именно из-за такого сворачивания между слоями вставляют нелинейность вроде ReLU."
    - id: "q5"
      type: "numeric"
      prompt: "A и B - матрицы 10 × 10, x - вектор длины 10. Сколько умножений чисел требуется, чтобы вычислить A (B x), если матрицу на вектор умножать стандартным способом?"
      answer: 200
      tolerance: 0.001
      explanation: "Произведение матрицы 10 × 10 на вектор стоит 10·10 = 100 умножений, их два: 200. Порядок (A B) x потребовал бы 10·10·10 = 1000 умножений на матрицы и ещё 100 на вектор - итого 1100 при том же результате."
exercise:
  id: "ml.math.matrix-multiplication.exercise"
  title: "Умножение матриц и степень матрицы на чистом Python"
  prompt: |
    В файле `matmul_task.py` реализуйте четыре функции. Только стандартная библиотека Python; ничего не печатайте и не изменяйте аргументы. Матрица - список строк (списков чисел). Все результаты - **новые** списки.

    1. `matmul(A, B)` - произведение `A (m × n)` на `B (n × p)` тремя вложенными циклами. `ValueError`, если число столбцов `A` не равно числу строк `B`, а также для пустых и «рваных» матриц.
    2. `identity(n)` - единичная матрица `n × n` из `float`. `ValueError` при `n < 1`.
    3. `matrix_power(A, k)` - `A` в степени `k` для целого `k >= 0`; `k = 0` даёт единичную матрицу. `ValueError`, если `A` не квадратная или `k < 0`.
    4. `compose_linear_layers(Ws)` - одна матрица, эквивалентная применению слоёв `Ws[0]`, затем `Ws[1]` и так далее, то есть `Ws[-1] ... Ws[1] Ws[0]`. `ValueError` для пустого списка и несовместимых форм.

    **Пример.**

    ```python
    matmul([[1, 2, 0], [0, 1, 3]], [[1, 0], [2, 1], [0, 4]])   # [[5.0, 2.0], [2.0, 13.0]]
    matrix_power([[1, 1], [1, 0]], 10)                        # [[89.0, 55.0], [55.0, 34.0]]
    compose_linear_layers([[[1, 1]], [[2], [3]]])             # [[2.0, 2.0], [3.0, 3.0]]
    ```

    Тесты сравнивают числа с допуском `1e-9`, проверяют порядок множителей, ошибки форм, матрицы 1 × 1, строки и столбцы как матрицы и то, что входные матрицы не меняются.
  entryFile: "matmul_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "matmul начните с проверки форм: число столбцов A должно равняться числу строк B. Результат - матрица m × p, которую удобно сначала заполнить нулями: C = [[0.0] * p for _ in range(m)]."
    - "Три цикла: i - строки A, j - столбцы B, k - общий индекс. В C[i][j] накапливайте A[i][k] * B[k][j]. Порядок индексов k важен: перепутав их, получите произведение с транспонированной матрицей."
    - "matrix_power: начните с result = identity(n) и умножайте на A, k раз (или используйте быстрое возведение: если k нечётно, умножьте результат на основание; затем возведите основание в квадрат и поделите k на 2)."
    - "compose_linear_layers: начните с первого слоя и для каждого следующего слоя W делайте result = matmul(W, result) - новый слой стоит слева. Проверку форм выполнит matmul."
  tests:
    - id: "matmul-basic"
      title: "Произведение матриц"
      hint: "Клетка результата - скалярное произведение строки A на столбец B; формы (m × n)(n × p) дают m × p."
    - id: "identity-power"
      title: "Единичная матрица и степени"
      hint: "Нулевая степень - единичная матрица; степень - повторное умножение матрицы на себя."
    - id: "compose"
      title: "Свёртка линейных слоёв"
      hint: "Слой, применяемый позже, стоит левее в произведении."
    - id: "matmul-errors"
      title: "Ошибки форм (скрытый)"
      hidden: true
      hint: "Несовпадение внутренних размерностей, пустые и рваные матрицы, несовместимая цепочка слоёв - ValueError."
    - id: "power-errors"
      title: "Некорректная степень и размер (скрытый)"
      hidden: true
      hint: "Степень определена только для квадратной матрицы и неотрицательного показателя; единичная матрица - для n >= 1."
    - id: "no-mutation"
      title: "Входные матрицы не меняются, результаты новые (скрытый)"
      hidden: true
      hint: "Даже при k = 1 и одном слое результат не должен быть той же матрицей, что и вход."
    - id: "edge-cases"
      title: "1 × 1, строка и столбец, целые числа, марковская цепь (скрытый)"
      hidden: true
      hint: "Строка на столбец даёт 1 × 1, столбец на строку - матрицу; строки степени стохастической матрицы суммируются в 1."
challenge:
  id: "ml.math.matrix-multiplication.challenge"
  title: "Свёртка слоёв и марковская цепь на NumPy"
  prompt: |
    Задача повышенной сложности: те же идеи на массивах NumPy. Нужен NumPy 2.x; основы массивов - в курсе «NumPy: массивы и векторизация». В файле `network_task.py` реализуйте две функции, ничего не печатайте и не изменяйте входные массивы.

    1. `collapse_affine_layers(Ws, bs)` - цепочка слоёв `x -> W_i x + b_i`, применяемых по порядку списка (`W_i` формы `(d_i, d_{i-1})`, `b_i` формы `(d_i,)`). Верните `(W, b)` - новые массивы `float`, для которых `W x + b` равно результату всей цепочки. `ValueError`, если списки пусты, разной длины или формы слоёв не согласуются.
    2. `markov_distribution(P, p0, steps)` - распределение вероятностей через `steps` шагов цепи: `p0 @ P^steps` (используйте `np.linalg.matrix_power`). `P` - матрица переходов `(n, n)`, строки суммируются в 1; `p0` - вектор `(n,)` с суммой 1; `steps >= 0`. `ValueError`, если `P` не квадратная, суммы строк `P` или сумма `p0` отличаются от 1 больше чем на `1e-9`, форма `p0` не совпадает с `P` или `steps < 0`. Верните новый массив `float`; при `steps = 0` - копию `p0`.

    **Пример.**

    ```python
    P = np.array([[0.9, 0.1], [0.5, 0.5]])
    markov_distribution(P, np.array([0.0, 1.0]), 3)   # [0.78, 0.22]
    ```

    Тесты сравнивают результат с прямым прохождением по слоям на случайных данных (`np.random.default_rng`), проверяют сумму вероятностей, стационарное распределение, `steps = 0`, ошибки и неизменность входов.
  entryFile: "network_task.py"
  starter: "challenge/starter"
  solution: "challenge/solution"
  evaluation: "harness"
  harness: "challenge/harness"
  harnessEntry: "check.py"
  requires:
    packages:
      - "numpy>=2"
  hints:
    - "Свёртка слоёв: храните текущие (W, b), начав с копии первого слоя. Для следующего слоя (Wi, bi) новые значения - W_new = Wi @ W и b_new = Wi @ b + bi."
    - "Не забудьте, что сдвиг тоже преобразуется следующим слоем: Wi @ b + bi, а не b + bi. Перед умножением сравните Wi.shape[1] с W.shape[0]."
    - "markov_distribution: проверьте формы и суммы (np.allclose(P.sum(axis=1), 1.0, rtol=0, atol=1e-9)), затем верните p0 @ np.linalg.matrix_power(P, steps). Для steps = 0 matrix_power даёт единичную матрицу."
    - "Копии вместо ссылок: np.array(x, dtype=float) создаёт новый массив, а np.asarray может вернуть сам вход."
  tests:
    - id: "collapse-basic"
      title: "Два слоя в один"
      hint: "W = W2 W1, b = W2 b1 + b2; первый слой стоит правее."
    - id: "collapse-random"
      title: "Совпадение с прохождением по слоям"
      hint: "Свёрнутый слой на случайных входах даёт те же выходы, что исходная цепочка."
    - id: "markov-basic"
      title: "Погода через несколько дней"
      hint: "Распределение умножается справа на P на каждом шаге: p0 @ P^steps."
    - id: "markov-properties"
      title: "Сумма вероятностей, steps = 0, стационарность (скрытый)"
      hidden: true
      hint: "Вероятности неотрицательны и суммируются в 1; при большом числе шагов результат не зависит от старта."
    - id: "validation"
      title: "Проверка входных данных (скрытый)"
      hidden: true
      hint: "Суммы строк и p0, формы, число шагов и согласованность слоёв проверяются явно."
    - id: "int-no-mutation"
      title: "Целочисленный вход, копии вместо ссылок (скрытый)"
      hidden: true
      hint: "Результат типа float; входные массивы не меняются, в том числе для одного слоя и steps = 0."
