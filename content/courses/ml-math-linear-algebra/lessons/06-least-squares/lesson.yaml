id: "ml.math.least-squares"
title: "Метод наименьших квадратов: линейная регрессия через нормальные уравнения"
goal: "Найти веса линейной регрессии из нормальных уравнений XᵀXw = Xᵀy на чистом Python, добавить гребневую регуляризацию и повторить решение через np.linalg.lstsq."
difficulty: "medium"
estimatedMinutes: 80
prerequisites:
  - "ml.math.linear-systems"
related:
  - "ml.foundations.linear-regression"
  - "ml.numpy.linear-regression"
  - "python.numpy.linear-algebra"
next:
  - "ml.math.eigenvalues"
seeAlso:
  - "Линейная регрессия градиентным спуском: урок «Линейная регрессия» курса основ ML"
objectives:
  - "Объяснить, почему система Xw = y при n > d не имеет точного решения, и записать задачу как минимизацию ‖Xw - y‖²."
  - "Добавить свободный член столбцом единиц и использовать его в предсказании."
  - "Вывести нормальные уравнения из ортогональности остатка столбцам матрицы признаков и решить их методом Гаусса."
  - "Распознать вырожденную XᵀX (дубликаты признаков, d > n) и исправить её гребневой добавкой λI' без штрафа на свободный член."
  - "Объяснить, почему lstsq устойчивее нормальных уравнений, и посчитать R² (задача повышенной сложности)."
masteryCriteria:
  - "fit_normal_equation возвращает веса с w[0] - свободным членом, остаток которых ортогонален столбцам Xb с точностью 1e-8, и совпадает с эталоном в точной арифметике."
  - "Без l2 дубликат признака даёт ValueError из solve, с l2 > 0 - конечное решение; свободный член не штрафуется, а норма весов убывает с ростом l2."
  - "fit_lstsq на вырожденных данных совпадает с pinv(Xb) @ y, fit_ridge при alpha -> 0 совпадает с fit_lstsq, r2_score обрабатывает постоянный y."
tags:
  - "linear-algebra"
  - "least-squares"
  - "regression"
  - "ml-math"
facts:
  - kind: "internals"
    text: "np.linalg.lstsq возвращает кортеж из четырёх элементов: решение, суммы квадратов остатков, ранг матрицы и её сингулярные числа."
    sources:
      - "https://numpy.org/doc/stable/reference/generated/numpy.linalg.lstsq.html"
  - kind: "internals"
    text: "np.linalg.cond по умолчанию считает число обусловленности в 2-норме как отношение наибольшего сингулярного числа к наименьшему."
    sources:
      - "https://numpy.org/doc/stable/reference/generated/numpy.linalg.cond.html"
  - kind: "internals"
    text: "np.linalg.solve решает систему ax = b для квадратной матрицы полного ранга; для вырожденной матрицы выбрасывается LinAlgError."
    sources:
      - "https://numpy.org/doc/stable/reference/generated/numpy.linalg.solve.html"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "В датасете 200 объектов и 3 признака. Почему система Xw = y, как правило, не имеет точного решения?"
      options:
        - "Матрица X не квадратная, поэтому к ней нельзя применить умножение"
        - "Уравнений (200) больше, чем неизвестных (3), а данные с шумом не лежат в одной плоскости"
        - "Неизвестных меньше трёх, поэтому система недоопределена"
        - "Метод Гаусса не работает для матриц с вещественными числами"
      answer: 1
      explanation: "Переопределённая система требует, чтобы y лежал в линейной оболочке трёх столбцов, а шум этому мешает; поэтому ищут w с минимальной ‖Xw - y‖². Умножение Xw для прямоугольной X определено, так что причина не в форме матрицы."
    - id: "q2"
      type: "multiple"
      prompt: "Что верно для оптимальных весов метода наименьших квадратов, если в Xb есть столбец единиц?"
      options:
        - "Выполнено Xbᵀ(y - Xb·w) = 0"
        - "Остаток r = y - Xb·w ортогонален каждому столбцу Xb"
        - "Сумма остатков равна нулю"
        - "Все остатки равны нулю"
      answer:
        - 0
        - 1
        - 2
      explanation: "Ортогональность остатка столбцам - это и есть Xbᵀr = 0; для столбца единиц она означает нулевую сумму остатков. Нулевые остатки возможны только при точной подгонке, на шумных данных их нет."
    - id: "q3"
      type: "numeric"
      prompt: "Для точек (1, 2), (2, 3), (3, 7) найдите наклон w1 прямой y = w0 + w1·x по методу наименьших квадратов."
      answer: 2.5
      tolerance: 0.001
      explanation: "Средние: x̄ = 2, ȳ = 4. Наклон = Σ(x - x̄)(y - ȳ) / Σ(x - x̄)² = ((-1)(-2) + 0 + (1)(3)) / 2 = 2.5; свободный член 4 - 2.5·2 = -1."
    - id: "q4"
      type: "single"
      prompt: "cond(X) ≈ 10⁴. Чему примерно равно cond(XᵀX) и что из этого следует?"
      options:
        - "10⁴: формирование XᵀX не влияет на точность"
        - "10⁸: нормальные уравнения теряют около половины верных знаков, поэтому библиотеки используют QR или SVD"
        - "10²: матрица XᵀX всегда лучше обусловлена, чем X"
        - "Бесконечности: XᵀX всегда вырождена"
      answer: 1
      explanation: "cond(XᵀX) = cond(X)², то есть 10⁸. При 16 десятичных знаках float64 остаётся около 8 верных знаков. Вариант про 10² неверен: возведение в квадрат ухудшает обусловленность, а не улучшает."
    - id: "q5"
      type: "single"
      prompt: "Ridge-регрессия со штрафом только на веса признаков (не на свободный член). Что происходит с предсказаниями при λ → ∞?"
      options:
        - "Они становятся бесконечными"
        - "Они стремятся к нулю"
        - "Они совпадают с предсказаниями обычных наименьших квадратов"
        - "Они стремятся к среднему значению y"
      answer: 3
      explanation: "Веса признаков сжимаются к нулю, а свободный член не штрафуется и остаётся равным среднему y. Предсказание нулём получилось бы, только если бы штрафовали и свободный член - это типичная ошибка."
exercise:
  id: "ml.math.least-squares.exercise"
  title: "Нормальные уравнения и ridge на чистом Python"
  prompt: |
    В файле `normal_eq_task.py` уже есть готовые функции `transpose(A)`, `matmul(A, B)` и `solve(A, b)` (метод Гаусса с выбором главного элемента; на вырожденной матрице выбрасывает `ValueError`). **Писать их заново не нужно** - используйте. Реализуйте четыре функции; только стандартная библиотека, ничего не печатайте, входные данные не меняйте. `X` - список строк-объектов, `y` - список ответов.

    1. `add_bias_column(X)` - новый список строк `[1.0] + row`.
    2. `fit_normal_equation(X, y, l2=0.0)` - веса `w` длины `d + 1` (`w[0]` - свободный член): решите `(XbᵀXb + l2·I') w = Xbᵀy`, где `Xb = add_bias_column(X)`, а `I'` - единичная матрица с нулём в позиции `(0, 0)` (свободный член не штрафуется). Если система вырождена, `ValueError` из `solve` должен дойти до вызывающего кода.
    3. `predict(X, w)` - список предсказаний `w[0] + w[1]·x[0] + ...`.
    4. `mse(y_true, y_pred)` - средний квадрат ошибки.

    **Пример.**

    ```python
    X = [[0.0], [1.0], [2.0], [3.0]]
    y = [1.0, 3.0, 5.0, 7.0]
    w = fit_normal_equation(X, y)         # [1.0, 2.0] - прямая y = 1 + 2x
    predict([[10.0]], w)                  # [21.0]
    mse(y, predict(X, w))                 # 0.0 (с точностью до округления)
    fit_normal_equation([[1.0, 1.0], [2.0, 2.0], [3.0, 3.0]], [1.0, 2.0, 3.0])             # ValueError
    fit_normal_equation([[1.0, 1.0], [2.0, 2.0], [3.0, 3.0]], [1.0, 2.0, 3.0], l2=0.1)     # решение существует
    ```

    Тесты сравнивают веса с эталоном, посчитанным в точной арифметике (допуск `1e-8`), проверяют ортогональность остатка столбцам, ошибку на дубликатах признаков, нештрафуемый свободный член и неизменность входных данных.
  entryFile: "normal_eq_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Начните с add_bias_column и predict - это генераторы списков. Основная работа в fit_normal_equation: она собирается из уже готовых transpose, matmul и solve."
    - "Постройте Xb = add_bias_column(X), Xt = transpose(Xb), A = matmul(Xt, Xb). Правая часть Xbᵀy - это скалярные произведения каждой строки Xt с y."
    - "Штраф добавляется к диагонали A, начиная с индекса 1: for i in range(1, len(A)): A[i][i] += l2. Позицию 0 (свободный член) не трогайте. Затем верните solve(A, rhs)."
    - "rhs = [sum(a * b for a, b in zip(row, y)) for row in Xt]. mse - сумма (a - b) ** 2 по парам, делённая на len(y_true)."
  tests:
    - id: "exact-line"
      title: "Точки на прямой и столбец единиц"
      hint: "Если все точки лежат на прямой, веса равны её коэффициентам; add_bias_column дописывает 1.0 в начало строк."
    - id: "two-features"
      title: "Два признака с шумом"
      hint: "Веса совпадают с решением нормальных уравнений; predict считает w[0] плюс скалярное произведение весов и признаков."
    - id: "residual-orthogonal"
      title: "Остаток ортогонален столбцам"
      hint: "Для найденных весов скалярное произведение остатка с каждым столбцом Xb близко к нулю; mse - средний квадрат остатков."
    - id: "collinear-features"
      title: "Дубликаты признаков и ridge (скрытый)"
      hidden: true
      hint: "Вырожденная система без штрафа даёт ValueError; со штрафом решение конечно и симметрично для одинаковых столбцов."
    - id: "intercept-not-penalized"
      title: "Свободный член не штрафуется (скрытый)"
      hidden: true
      hint: "Для постоянного ответа свободный член равен этой константе при любом l2, остальные веса равны нулю."
    - id: "ridge-shrinks"
      title: "Рост l2 сжимает веса (скрытый)"
      hidden: true
      hint: "Норма весов без свободного члена убывает при увеличении l2."
    - id: "no-mutation-edges"
      title: "Целые числа, неизменность входов, постоянный признак (скрытый)"
      hidden: true
      hint: "Целочисленный вход допустим, X и y не меняются; признак-константа совпадает со столбцом единиц."
challenge:
  id: "ml.math.least-squares.challenge"
  title: "lstsq, ridge и R² на NumPy"
  prompt: |
    Задача повышенной сложности: те же методы на NumPy. Нужен NumPy 2.x. В файле `lstsq_task.py` реализуйте три функции, ничего не печатайте и не изменяйте входные массивы. `X` - массив `(n, d)`, `y` - массив `(n,)`.

    1. `fit_lstsq(X, y)` - веса формы `(d + 1,)`, `w[0]` - свободный член. Добавьте слева столбец единиц и вызовите `np.linalg.lstsq(Xb, y, rcond=None)`.
    2. `fit_ridge(X, y, alpha)` - решите `(XbᵀXb + alpha·I') w = Xbᵀy` через `np.linalg.solve`; `I'` - единичная матрица с нулём в позиции `(0, 0)`.
    3. `r2_score(y, y_pred)` - `1 - SS_res / SS_tot`, где `SS_res = Σ(y - y_pred)²`, `SS_tot = Σ(y - mean(y))²`. Если `SS_tot == 0`, верните `1.0` при `SS_res == 0` и `0.0` иначе.

    **Пример.**

    ```python
    X = np.array([[0.0], [1.0], [2.0], [3.0]])
    y = np.array([1.0, 3.0, 5.0, 7.0])
    w = fit_lstsq(X, y)                  # [1., 2.]
    r2_score(y, w[0] + w[1] * X[:, 0])   # 1.0
    ```

    Тесты сравнивают результат с нормальными уравнениями, с `np.linalg.pinv` на матрице с дублирующимся столбцом (решение минимальной нормы), проверяют предел `alpha -> 0`, особые случаи `R²` и целочисленный вход.
  entryFile: "lstsq_task.py"
  starter: "challenge/starter"
  solution: "challenge/solution"
  evaluation: "harness"
  harness: "challenge/harness"
  harnessEntry: "check.py"
  requires:
    packages:
      - "numpy>=2"
  hints:
    - "Общая часть всех функций - матрица Xb = np.column_stack([np.ones(len(X)), X]). Вынесите её в отдельную функцию."
    - "np.linalg.lstsq возвращает кортеж из четырёх элементов; веса - первый: w, *_ = np.linalg.lstsq(Xb, y, rcond=None)."
    - "Для ridge создайте penalty = alpha * np.eye(d + 1), обнулите penalty[0, 0] и решите np.linalg.solve(Xb.T @ Xb + penalty, Xb.T @ y)."
    - "Для r2_score вычислите ss_res и ss_tot как суммы квадратов; случай ss_tot == 0 обработайте до деления."
  tests:
    - id: "lstsq-vs-normal"
      title: "lstsq совпадает с нормальными уравнениями"
      hint: "На хорошо обусловленных данных оба способа дают одинаковые веса формы (d + 1,)."
    - id: "ridge-basic"
      title: "Ridge и нештрафуемый свободный член"
      hint: "Результат равен решению системы с нулём в позиции (0, 0) штрафной матрицы; для постоянного y свободный член равен этой константе."
    - id: "r2-score"
      title: "R² для идеальных и средних предсказаний"
      hint: "Идеальный прогноз даёт 1, прогноз средним даёт 0, обратный порядок - отрицательное значение."
    - id: "rank-deficient"
      title: "Дублирующийся признак (скрытый)"
      hidden: true
      hint: "lstsq возвращает решение минимальной нормы, веса одинаковых столбцов равны; ridge с alpha > 0 тоже разрешима."
    - id: "ridge-to-lstsq"
      title: "Предел alpha -> 0 и огромный alpha (скрытый)"
      hidden: true
      hint: "Малый штраф почти не меняет решение, огромный сжимает веса признаков к нулю."
    - id: "r2-constant-target"
      title: "R² при постоянном ответе (скрытый)"
      hidden: true
      hint: "Если SS_tot равна нулю, деление недопустимо: результат зависит от SS_res."
    - id: "int-input-no-mutation"
      title: "Целочисленный вход и неизменность аргументов (скрытый)"
      hidden: true
      hint: "Веса - float-массивы формы (d + 1,); X и y после вызова не изменились."
