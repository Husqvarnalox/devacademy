id: "ml.math.eigenvalues"
title: "Собственные значения и векторы: степенной метод"
goal: "Реализовать степенной метод и стационарное распределение цепи Маркова на чистом Python, а на NumPy найти главные направления ковариационной матрицы через eigh."
difficulty: "hard"
estimatedMinutes: 85
prerequisites:
  - "ml.math.least-squares"
related:
  - "ml.foundations.linear-regression"
  - "ml.numpy.pca"
  - "python.numpy.linear-algebra"
next:
  - "ml.math.svd-pca"
objectives:
  - "Объяснить, что собственный вектор матрицы только растягивается, и проверить пару (λ, v) через ‖Av - λv‖."
  - "Найти собственные значения матрицы 2 × 2 из характеристического уравнения и сопоставить их со следом и определителем."
  - "Назвать свойства симметричных матриц (действительные значения, ортогональные векторы, A = VΛVᵀ) и связать их с ковариацией."
  - "Реализовать степенной метод с нормировкой, отношением Рэлея и фиксацией знака; оценить скорость по |λ₂/λ₁|."
  - "Найти стационарное распределение цепи Маркова итерацией p ← pP и объяснить связь с PageRank."
  - "Применить np.linalg.eigh к ковариационной матрице и отсортировать результат по убыванию (задача повышенной сложности)."
masteryCriteria:
  - "power_iteration возвращает доминирующее по модулю значение и вектор длины 1 с зафиксированным знаком, в том числе для отрицательного λ, и выбрасывает ValueError, если Av = 0."
  - "rayleigh_quotient и is_eigenpair совпадают с определениями, а stationary_distribution даёт p = pP с суммой 1."
  - "covariance_matrix совпадает с np.cov, sorted_eigh возвращает значения по убыванию и ортонормированные векторы-столбцы, reconstruct восстанавливает матрицу."
tags:
  - "linear-algebra"
  - "eigenvalues"
  - "power-iteration"
  - "ml-math"
facts:
  - kind: "internals"
    text: "np.linalg.eigh предназначена для симметричных (эрмитовых) матриц и возвращает собственные значения в порядке возрастания."
    sources:
      - "https://numpy.org/doc/stable/reference/generated/numpy.linalg.eigh.html"
  - kind: "internals"
    text: "np.linalg.eig принимает любую квадратную матрицу; её собственные значения не обязательно упорядочены и для действительной матрицы не обязательно действительны."
    sources:
      - "https://numpy.org/doc/stable/reference/generated/numpy.linalg.eig.html"
  - kind: "internals"
    text: "Функция np.cov по умолчанию делит на N - 1 (параметр ddof равен None, что соответствует ddof = 1) и считает признаками строки, поэтому для таблицы объектов её вызывают как np.cov(X.T)."
    sources:
      - "https://numpy.org/doc/stable/reference/generated/numpy.cov.html"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Какая пара (λ, v) - собственная для матрицы A = [[2, 1], [1, 2]]?"
      options:
        - "λ = 3, v = (1, 1)"
        - "λ = 3, v = (1, 0)"
        - "λ = 2, v = (1, 1)"
        - "λ = 1, v = (1, 1)"
      answer: 0
      explanation: "A·(1, 1) = (3, 3) = 3·(1, 1). Для v = (1, 0) получается (2, 1), то есть направление меняется; для (1, 1) значения 2 и 1 не дают равенства Av = λv."
    - id: "q2"
      type: "multiple"
      prompt: "Что верно для симметричной матрицы, например ковариационной?"
      options:
        - "Все собственные значения обязательно положительны"
        - "Все собственные значения действительны"
        - "Собственные векторы для разных значений ортогональны"
        - "Её можно записать как A = V Λ Vᵀ"
      answer:
        - 1
        - 2
        - 3
      explanation: "Это три свойства спектральной теоремы. Положительность не гарантирована: у ковариационной матрицы значения неотрицательны, а у произвольной симметричной, например [[0, 1], [1, 0]], есть значение -1."
    - id: "q3"
      type: "numeric"
      prompt: "Найдите наибольшее собственное значение матрицы [[4, 1], [2, 3]]."
      answer: 5
      tolerance: 0.001
      explanation: "След равен 7, определитель 10, поэтому λ² - 7λ + 10 = 0, откуда λ = 5 и λ = 2. Проверка: A·(1, 1) = (5, 5)."
    - id: "q4"
      type: "numeric"
      prompt: "У матрицы собственные значения 10, 9 и 1. Во сколько раз примерно за один шаг степенного метода уменьшается ошибка направления (отношение |λ₂/λ₁|)?"
      answer: 0.9
      tolerance: 0.001
      explanation: "Скорость определяется отношением второго значения к первому: 9/10 = 0.9, то есть метод сходится медленно. Для значений 10 и 1 отношение было бы 0.1. Третье значение скорость не определяет."
    - id: "q5"
      type: "single"
      prompt: "Цепь Маркова с матрицей переходов P = [[0.9, 0.1], [0.5, 0.5]] (строки - откуда, столбцы - куда). Каково стационарное распределение p = pP?"
      options:
        - "[0.9, 0.1]"
        - "[0.5, 0.5]"
        - "[5/6, 1/6]"
        - "[1/6, 5/6]"
      answer: 2
      explanation: "Для [5/6, 1/6]: первая компонента pP равна 5/6·0.9 + 1/6·0.5 = 5/6, вторая - 1/6, то есть p = pP. Равномерное [0.5, 0.5] даёт 0.7 в первой компоненте, а [0.9, 0.1] - это первая строка P, а не неподвижная точка."
exercise:
  id: "ml.math.eigenvalues.exercise"
  title: "Степенной метод и стационарное распределение на чистом Python"
  prompt: |
    В файле `power_task.py` реализуйте четыре функции. Только стандартная библиотека Python (`math` можно); ничего не печатайте и не изменяйте входные данные. Матрица - список строк, вектор - список чисел.

    1. `rayleigh_quotient(A, v)` - `vᵀAv / vᵀv`. Для нулевого вектора `ValueError`.
    2. `power_iteration(A, num_iters=1000, tol=1e-10)` - возвращает `(lam, v)`. Старт `v = [1.0] * n`, нормированный на длину 1. На каждом шаге: `w = A v`; если `‖w‖ == 0`, `ValueError`; `v_new = w / ‖w‖`; затем **фиксация знака**: компонента с наибольшим модулем (при равенстве - с меньшим индексом) должна быть положительной, иначе умножьте `v_new` на `-1`. Остановка, когда `‖v_new - v‖ < tol` или выполнено `num_iters` шагов. В конце `lam = rayleigh_quotient(A, v)`.
    3. `is_eigenpair(A, lam, v, tol=1e-8)` - `True`, если `v` не нулевой и `‖A v - lam v‖ <= tol · max(1, |lam|) · ‖v‖`.
    4. `stationary_distribution(P, num_iters=1000, tol=1e-12)` - для матрицы `P` со строками-вероятностями (каждая строка суммируется в 1): начните с равномерного `p`, повторяйте `p ← p P` (сумма остаётся 1, нормировать по длине не нужно) до тех пор, пока наибольшее изменение компоненты не станет меньше `tol` (или не исчерпаны `num_iters` шагов).

    **Пример.**

    ```python
    power_iteration([[2, 1], [1, 2]])                 # (3.0, [0.7071..., 0.7071...])
    power_iteration([[-3, 0], [0, 1]])                # (-3.0, [1.0, 0.0]) - знак зафиксирован
    rayleigh_quotient([[2, 1], [1, 2]], [1, -1])      # 1.0
    is_eigenpair([[2, 1], [1, 2]], 3, [2, 2])         # True
    stationary_distribution([[0.9, 0.1], [0.5, 0.5]]) # [0.8333..., 0.1666...]
    ```

    Тесты сравнивают числа с допуском `1e-8`-`1e-9`, проверяют отрицательное доминирующее значение, ошибки на нулевых матрицах и неизменность входных данных.
  entryFile: "power_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Заведите вспомогательные функции matvec(A, v) (скалярное произведение каждой строки с v) и norm(v) (корень из суммы квадратов). Из них собираются все четыре задачи."
    - "В power_iteration цикл повторяется не более num_iters раз: вычислить w = matvec(A, v), проверить длину, нормировать, зафиксировать знак, сравнить с предыдущим v через norm разности."
    - "Знак: k = max(range(n), key=lambda i: abs(v[i])) возвращает первый индекс наибольшего по модулю элемента; если v[k] < 0, умножьте все компоненты на -1."
    - "stationary_distribution: новый p[j] = sum(p[i] * P[i][j] for i in range(n)) - это умножение вектора-строки на матрицу. Остановка по max(abs(a - b) for a, b in zip(p_new, p)) < tol."
  tests:
    - id: "rayleigh"
      title: "Отношение Рэлея"
      hint: "vᵀAv делится на vᵀv; результат не зависит от длины вектора и определён и для несимметричной матрицы."
    - id: "power-symmetric"
      title: "Степенной метод на симметричных матрицах"
      hint: "Значение - наибольшее по модулю, вектор имеет длину 1 и положительную наибольшую по модулю компоненту."
    - id: "power-negative"
      title: "Отрицательное доминирующее значение"
      hint: "Доминирует значение с наибольшим модулем, даже если оно отрицательное; знак вектора фиксируется после каждого шага."
    - id: "is-eigenpair"
      title: "Проверка собственной пары (скрытый)"
      hidden: true
      hint: "Сравнивается невязка A v - lam v с допуском, масштабируемым на max(1, |lam|) и длину v; нулевой вектор не подходит."
    - id: "stationary"
      title: "Стационарное распределение цепи (скрытый)"
      hidden: true
      hint: "Результат неподвижен при умножении на P, сумма равна 1; медленно перемешивающиеся цепи требуют многих шагов."
    - id: "errors"
      title: "Нулевая матрица и нулевой вектор (скрытый)"
      hidden: true
      hint: "Если A v равно нулевому вектору, нормировать нечего - нужен ValueError; то же для отношения Рэлея нулевого вектора."
    - id: "no-mutation-ints"
      title: "Целые числа, неизменность входов, число шагов (скрытый)"
      hidden: true
      hint: "Матрицы не меняются, целочисленный вход допустим, num_iters ограничивает число шагов."
challenge:
  id: "ml.math.eigenvalues.challenge"
  title: "Ковариация и спектральное разложение на NumPy"
  prompt: |
    Задача повышенной сложности: ковариационная матрица и её собственные направления на NumPy. Нужен NumPy 2.x. В файле `eigh_task.py` реализуйте три функции, ничего не печатайте и не изменяйте входные массивы.

    1. `covariance_matrix(X)` - выборочная ковариация признаков, массив `(d, d)`. `X` - массив `(n, d)`, `n >= 2`. Вычтите среднее по каждому столбцу и вычислите `Xcᵀ Xc / (n - 1)`.
    2. `sorted_eigh(S)` - для симметричной `S` верните `(vals, vecs)`: собственные значения **по убыванию** и соответствующие собственные векторы в **столбцах** `vecs`. Используйте `np.linalg.eigh` и переставьте результат.
    3. `reconstruct(vals, vecs)` - матрица `V diag(vals) Vᵀ`.

    **Пример.**

    ```python
    S = np.array([[2.0, 1.0], [1.0, 2.0]])
    vals, vecs = sorted_eigh(S)          # vals = [3., 1.]; vecs[:, 0] = ±(1, 1)/√2
    reconstruct(vals, vecs)              # [[2., 1.], [1., 2.]]
    ```

    Тесты сравнивают ковариацию с `np.cov`, проверяют `S V = V Λ`, ортонормированность `V`, порядок по убыванию, главное направление (с точностью до знака) и работу с целочисленным входом.
  entryFile: "eigh_task.py"
  starter: "challenge/starter"
  solution: "challenge/solution"
  evaluation: "harness"
  harness: "challenge/harness"
  harnessEntry: "check.py"
  requires:
    packages:
      - "numpy>=2"
  hints:
    - "Центрирование: Xc = X - X.mean(axis=0). Ковариация - Xc.T @ Xc / (len(X) - 1). Не забудьте превратить вход в float: np.asarray(X, dtype=float)."
    - "np.linalg.eigh возвращает значения по возрастанию. Индексы для убывающего порядка: order = np.argsort(vals)[::-1]."
    - "Переставьте значения vals[order] и столбцы vecs[:, order] - столбцы переставляются вторым индексом."
    - "reconstruct: vecs * vals умножает каждый столбец на своё значение (V Λ); осталось умножить на vecs.T."
  tests:
    - id: "covariance"
      title: "Ковариационная матрица"
      hint: "Результат совпадает с np.cov(X.T): центрирование по столбцам и деление на n - 1."
    - id: "eigh-properties"
      title: "Свойства собственных пар"
      hint: "Значения по убыванию, S V = V Λ, столбцы V ортонормированы."
    - id: "reconstruct"
      title: "Восстановление матрицы"
      hint: "V diag(vals) Vᵀ возвращает исходную матрицу; для V = I получается diag(vals)."
    - id: "known-matrix"
      title: "Известная матрица [[2, 1], [1, 2]] (скрытый)"
      hidden: true
      hint: "Значения 3 и 1; векторы пропорциональны (1, 1) и (1, -1) с точностью до знака."
    - id: "power-direction"
      title: "Главный вектор и степенной метод (скрытый)"
      hint: "Первый столбец совпадает с направлением степенного метода с точностью до знака."
      hidden: true
    - id: "int-input-no-mutation"
      title: "Целочисленный вход и неизменность аргументов (скрытый)"
      hidden: true
      hint: "Ковариация - float-массив; X и S после вызова не изменились."
    - id: "repeated-values"
      title: "Кратные значения и диагональная матрица (скрытый)"
      hidden: true
      hint: "У 2·I все значения равны, а векторы всё равно ортонормированы; у диагональной матрицы порядок определяется значениями."
