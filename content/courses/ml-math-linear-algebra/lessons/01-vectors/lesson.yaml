id: "ml.math.vectors"
title: "Векторы: признаки, сложение и линейные комбинации"
goal: "Реализовать сложение векторов, умножение на число, линейную комбинацию и покомпонентное среднее на чистом Python с проверкой размерностей."
difficulty: "easy"
estimatedMinutes: 50
prerequisites: []
related:
  - "python.fundamentals.lists"
next:
  - "ml.math.dot-product"
seeAlso:
  - "Массивы NumPy и покомпонентные операции подробно: курс «NumPy: массивы и векторизация»"
objectives:
  - "Записать объект, веса модели и градиент как векторы и назвать их размерность."
  - "Складывать векторы и умножать их на число покомпонентно, проверяя совпадение длин."
  - "Вычислять линейную комбинацию векторов и узнавать в ней шаг градиентного спуска и среднее."
  - "Отличать склейку списков Python (+, *) от векторных операций."
  - "Повторить те же операции на массивах NumPy (задача повышенной сложности)."
masteryCriteria:
  - "add, scale, linear_combination и mean_vector возвращают новые списки с верными компонентами и не меняют входные данные."
  - "Для векторов разной длины, пустого набора и несовпадающего числа коэффициентов выбрасывается ValueError."
  - "update_centroids на NumPy совпадает с покомпонентным средним, посчитанным циклом, и сохраняет старый центр пустого кластера."
tags:
  - "linear-algebra"
  - "vectors"
  - "ml-math"
facts:
  - kind: "internals"
    text: "Для списков Python оператор + создаёт новый список-склейку, а умножение списка на целое число повторяет его; покомпонентной арифметики у списков нет."
    sources:
      - "https://docs.python.org/3/library/stdtypes.html#common-sequence-operations"
  - kind: "internals"
    text: "Встроенная функция zip по умолчанию останавливается на самой короткой последовательности; с аргументом strict=True (Python 3.10+) она выбрасывает ValueError при разной длине."
    sources:
      - "https://docs.python.org/3/library/functions.html#zip"
  - kind: "internals"
    text: "Арифметические операторы над массивами NumPy работают поэлементно, а массивы несовместимых форм дают ValueError."
    sources:
      - "https://numpy.org/doc/stable/user/basics.broadcasting.html"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что напечатает print([1, 2] + [3, 4]) для обычных списков Python?"
      options:
        - "10"
        - "[4, 6]"
        - "[1, 2, 3, 4]"
        - "TypeError"
      answer: 2
      explanation: "Для списков + означает склейку. Векторная сумма [4, 6] получится через [a + b for a, b in zip(u, v)] или для массивов NumPy."
    - id: "q2"
      type: "single"
      prompt: "Веса w = [1.0, 2.0], градиент g = [10.0, -10.0], lr = 0.1. Чему равен шаг w - lr * g?"
      options:
        - "[2.0, 1.0]"
        - "[0.0, 3.0]"
        - "[-9.0, 12.0]"
        - "[0.9, 2.1]"
      answer: 1
      explanation: "lr * g = [1.0, -1.0]; w - [1.0, -1.0] = [0.0, 3.0]. Частая ошибка - прибавить градиент вместо вычитания: тогда получится [2.0, 1.0]."
    - id: "q3"
      type: "multiple"
      prompt: "Какие вычисления являются линейными комбинациями векторов v_1, ..., v_k?"
      options:
        - "Шаг градиентного спуска w - lr * g"
        - "Покомпонентный квадрат вектора [v_1 ** 2 для каждой компоненты]"
        - "Взвешенная сумма 0.2 * v_1 + 0.8 * v_2"
        - "Среднее (v_1 + ... + v_k) / k"
      answer:
        - 0
        - 2
        - 3
      explanation: "Линейная комбинация - сумма векторов, умноженных на числа. Возведение компонент в квадрат не сводится к сложению и умножению векторов на числа."
    - id: "q4"
      type: "numeric"
      prompt: "Найдите первую компоненту среднего векторов [2, 0], [4, 1], [9, 5]."
      answer: 5
      tolerance: 0.001
      explanation: "Среднее считается по каждой координате отдельно: (2 + 4 + 9) / 3 = 5."
    - id: "q5"
      type: "single"
      prompt: "Чем опасен код [a + b for a, b in zip(u, v)], если len(u) = 3, а len(v) = 2?"
      options:
        - "zip молча остановится на коротком списке, результат будет длины 2"
        - "Python выбросит IndexError"
        - "Недостающая компонента будет считаться нулём"
        - "Результат будет длины 5"
      answer: 0
      explanation: "zip по умолчанию останавливается на самой короткой последовательности, поэтому длины нужно проверять явно или использовать zip(..., strict=True)."
exercise:
  id: "ml.math.vectors.exercise"
  title: "Операции над векторами на чистом Python"
  prompt: |
    В файле `vectors_task.py` реализуйте четыре функции. Только стандартная библиотека Python; ничего не печатайте. Вектор - список чисел. Каждая функция возвращает **новый** список и не меняет аргументы.

    1. `add(u, v)` - покомпонентная сумма. Если `len(u) != len(v)`, выбросьте `ValueError`.
    2. `scale(c, v)` - произведение числа на вектор.
    3. `linear_combination(coeffs, vectors)` - `c_1 * v_1 + ... + c_k * v_k`. `ValueError`, если число коэффициентов не равно числу векторов, если векторов нет или если у них разная длина.
    4. `mean_vector(vectors)` - покомпонентное среднее (центр группы точек). `ValueError` для пустого списка и векторов разной длины.

    **Пример.**

    ```python
    add([1, 2, 3], [10, 20, 30])                          # [11, 22, 33]
    scale(2.5, [1, -2, 0])                                # [2.5, -5.0, 0.0]
    linear_combination([1, -0.1], [[0.5, -1], [2, -4]])   # [0.3, -0.6] - шаг w - 0.1 * g
    mean_vector([[1, 2], [3, 2], [2, 5]])                 # [2.0, 3.0]
    ```

    Тесты сравнивают числа с допуском `1e-9`, проверяют ошибки размерности, пустые векторы и то, что входные списки не меняются.
  entryFile: "vectors_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Начните с add и scale: каждая - одна строка с генератором списка. Остальные две функции можно собрать из них."
    - "В add сравните длины до zip: zip сам ошибку не выбросит. Для linear_combination сначала проверьте число коэффициентов и пустой список, затем накапливайте результат."
    - "linear_combination: заведите result = [0.0] * len(vectors[0]) и в цикле for c, v in zip(coeffs, vectors) делайте result = add(result, scale(c, v)) - add сама проверит длины."
    - "mean_vector - это linear_combination с коэффициентами 1/k: linear_combination([1.0 / k] * k, vectors), где k = len(vectors) > 0."
  tests:
    - id: "add-scale"
      title: "Сложение и умножение на число"
      hint: "Каждая компонента обрабатывается отдельно; результат - список той же длины."
    - id: "linear-combination"
      title: "Линейная комбинация и шаг градиентного спуска"
      hint: "Сумма c_i * v_i по всем векторам, покомпонентно."
    - id: "mean-vector"
      title: "Центр группы точек"
      hint: "Среднее по каждой координате отдельно."
    - id: "length-mismatch"
      title: "Ошибки размерности (скрытый)"
      hidden: true
      hint: "Разные длины векторов, несовпадающее число коэффициентов и пустой набор должны давать ValueError."
    - id: "no-mutation"
      title: "Входные списки не меняются (скрытый)"
      hidden: true
      hint: "Возвращайте новый список; не изменяйте аргументы на месте."
    - id: "edge-cases"
      title: "Пустые векторы, нулевые коэффициенты, целые числа (скрытый)"
      hidden: true
      hint: "Пустой вектор допустим в add; среднее целых чисел - дробное."
challenge:
  id: "ml.math.vectors.challenge"
  title: "Центры кластеров и шаг с моментом на NumPy"
  prompt: |
    Задача повышенной сложности: те же операции над векторами на массивах NumPy. Нужен NumPy 2.x; основы массивов - в курсе «NumPy: массивы и векторизация». В файле `centroids_task.py` реализуйте две функции, ничего не печатайте и не изменяйте входные массивы.

    1. `update_centroids(X, labels, old_centroids)` - шаг алгоритма k-means. `X` - массив `(n, d)`, `labels` - номера кластеров от `0` до `k - 1`, `old_centroids` - массив `(k, d)`. Верните новый массив `(k, d)` типа `float`: строка `j` - среднее строк `X`, у которых `labels == j`. Если в кластер не попало ни одной точки, оставьте `old_centroids[j]`.
    2. `momentum_step(w, velocity, grad, lr, beta)` - шаг градиентного спуска с моментом: `new_velocity = beta * velocity + grad`, `new_w = w - lr * new_velocity`. Верните `(new_w, new_velocity)`.

    **Пример.**

    ```python
    X = np.array([[1.0, 2.0], [3.0, 2.0], [2.0, 5.0], [10.0, 10.0], [12.0, 8.0]])
    update_centroids(X, np.array([0, 0, 0, 1, 1]), np.zeros((2, 2)))   # [[2, 3], [11, 9]]
    ```

    Тесты сравнивают результат с циклом на чистом Python, проверяют пустой кластер, целочисленный вход и отсутствие изменений входных массивов.
  entryFile: "centroids_task.py"
  starter: "challenge/starter"
  solution: "challenge/solution"
  evaluation: "harness"
  harness: "challenge/harness"
  harnessEntry: "check.py"
  requires:
    packages:
      - "numpy>=2"
  hints:
    - "Начните с копии старых центров: result = np.array(old_centroids, dtype=float). Так вы сразу получите float и не испортите вход."
    - "Для кластера j булева маска labels == j выбирает его строки: members = X[labels == j]. Среднее по точкам - members.mean(axis=0)."
    - "Пустой кластер: если len(members) == 0, строку не трогайте - в ней уже лежит старый центр. Для momentum_step используйте выражения new_v = beta * velocity + grad и w - lr * new_v, а не операторы -= и +=."
  tests:
    - id: "centroids-basic"
      title: "Центры двух кластеров"
      hint: "Строка j - среднее точек с labels == j, по axis=0."
    - id: "momentum-basic"
      title: "Шаг с моментом"
      hint: "Сначала new_velocity, затем new_w по новой скорости."
    - id: "centroids-random-vs-loop"
      title: "Совпадение с циклом на случайных данных (скрытый)"
      hidden: true
      hint: "Среднее считается по точкам кластера для каждой координаты."
    - id: "empty-cluster"
      title: "Пустой кластер (скрытый)"
      hidden: true
      hint: "Без точек среднее не определено - сохраните старый центр, не допускайте nan."
    - id: "int-input-no-mutation"
      title: "Целочисленный вход и неизменность аргументов (скрытый)"
      hidden: true
      hint: "Результат типа float; old_centroids, w и velocity не меняются."
    - id: "momentum-zero-beta"
      title: "Момент при beta = 0 (скрытый)"
      hidden: true
      hint: "Без момента шаг совпадает с w - lr * grad."
