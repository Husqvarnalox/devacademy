id: databases.sql.sql-injection-and-safe-access
title: "SQL-инъекции и безопасная работа с базой из кода"
goal: Понять, как возникает SQL-инъекция, надёжно предотвращать её параметризованными запросами и белыми списками, и замечать типичную проблему N+1 при доступе к базе из приложения.
difficulty: medium
estimatedMinutes: 80
prerequisites: [databases.sql.joins, databases.sql.transactions-and-isolation]
related: [databases.sql.indexes-and-query-plans, python.fundamentals.errors-and-files]
next: []
objectives:
  - "Объяснить, как подстановка пользовательских данных в текст запроса позволяет изменить его смысл, и воспроизвести инъекцию на учебной базе."
  - "Писать параметризованные запросы sqlite3 с плейсхолдерами `?` и именованными `:name` и знать, что параметры заменяют только значения."
  - "Безопасно обрабатывать то, что параметрами не передаётся: имена столбцов и таблиц (белый список), список для IN (генерация плейсхолдеров), шаблоны LIKE (экранирование)."
  - "Описать принцип наименьших привилегий для учётной записи приложения и роль ORM, которая тоже отправляет SQL."
  - "Обнаружить проблему N+1 по числу выполненных запросов (set_trace_callback) и устранить её соединением."
masteryCriteria:
  - "Вы никогда не собираете SQL из пользовательских значений через f-строки, `%` или `+`."
  - "Вы знаете три места, где параметры не помогают, и безопасный приём для каждого."
  - "Вы считаете запросы, которые делает функция, и замечаете цикл с запросом внутри."
tags: [sql, security, sql-injection, parameterized-queries, owasp, n-plus-one, sqlite, python]
facts:
  - kind: security
    text: >-
      SQL-инъекция входит в категорию Injection рейтинга OWASP Top 10. Основная защита, которую рекомендует OWASP, - подготовленные (параметризованные) запросы: код запроса и данные передаются отдельно,
      и база никогда не принимает данные за SQL. Для частей запроса, которые нельзя параметризовать (имена таблиц и столбцов, направление сортировки), OWASP рекомендует белый список допустимых значений.
    sources:
      - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
  - kind: internals
    text: >-
      Модуль sqlite3 поддерживает два стиля плейсхолдеров: qmark (`?`, параметры - последовательность) и named (`:имя`, параметры - словарь). Метод execute принимает один SQL-оператор и вызывает
      ProgrammingError для нескольких; выполнить скрипт из нескольких операторов можно только методом executescript, который параметров не принимает. Документация sqlite3 прямо предупреждает не использовать
      форматирование строк для подстановки значений.
    sources:
      - https://docs.python.org/3/library/sqlite3.html#sqlite3-placeholders
      - https://docs.python.org/3/library/sqlite3.html#sqlite3.Cursor.executescript
  - kind: misconception
    text: >-
      Экранирование кавычек вручную и «очистка» ввода считаются ненадёжными: набор опасных символов зависит от СУБД, кодировки и места подстановки, а один пропущенный случай даёт уязвимость.
      Параметризация надёжнее, потому что значение вообще не попадает в разбор текста запроса.
    sources:
      - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
  - kind: real-world
    text: >-
      ORM (SQLAlchemy, Django ORM и другие) генерируют SQL и по умолчанию передают значения параметрами, но уязвимость возвращается, как только в ORM подставляют сырую строку (сырые фрагменты, text(), raw())
      без параметров. Ленивая загрузка связанных объектов в цикле - частый источник N+1: один запрос за списком и по одному запросу на каждый элемент.
    sources:
      - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
  - kind: performance
    text: >-
      Проблема N+1 дорога из-за числа обращений, а не объёма данных: каждое обращение к серверной СУБД стоит сетевой задержки. В SQLite без сети обращения дешевле, но принцип тот же,
      а лучшие инструменты - соединение (JOIN) или один запрос с IN на пачку идентификаторов.
    sources:
      - https://docs.python.org/3/library/sqlite3.html#sqlite3.Connection.set_trace_callback
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: "Что делает запрос параметризованным?"
      options:
        - "В имя пользователя перед подстановкой добавляются обратные косые черты"
        - "Текст запроса с плейсхолдерами и значения передаются отдельно, значение не становится частью SQL"
        - "Запрос выполняется в транзакции"
        - "Значения проверяются регулярным выражением"
      answer: 1
      explanation: >-
        Значения передаются базе отдельно от текста, поэтому её разбор запроса не зависит от данных.
    - id: q2
      type: single
      prompt: "Можно ли передать имя столбца для ORDER BY параметром `?`"
      options:
        - "Да, как любое значение"
        - "Нет: параметр - значение, а не имя; нужно выбрать имя из белого списка и вставить его в текст"
        - "Да, если взять его в кавычки"
        - "Нет, ORDER BY нельзя параметризовать вообще, поэтому сортировать нужно в Python"
      answer: 1
      explanation: >-
        Параметр всегда значение. Имя столбца проверяют по белому списку и только потом подставляют.
    - id: q3
      type: single
      prompt: "Что покажет вызов cursor.execute('SELECT 1; DROP TABLE t')?"
      options:
        - "Выполнятся оба оператора"
        - "ProgrammingError: execute принимает только один оператор"
        - "Выполнится только SELECT, а второй оператор молча пропустится"
        - "Таблица t будет удалена после COMMIT"
      answer: 1
      explanation: >-
        В sqlite3 execute отвергает несколько операторов; это не защита от инъекции (запрос можно изменить и в одном операторе), но ограничивает ущерб.
    - id: q4
      type: multiple
      prompt: "Какие приёмы действительно снижают риск при работе с базой из приложения? Выберите все."
      options:
        - "Параметризованные запросы"
        - "Учётная запись приложения только с нужными правами (наименьшие привилегии)"
        - "Ручное удаление апострофов из ввода"
        - "Белый список для имён столбцов"
      answer: [0, 1, 3]
      explanation: >-
        Ручная очистка ненадёжна. Остальные приёмы либо исключают инъекцию, либо ограничивают ущерб от неё.
    - id: q5
      type: single
      prompt: "Функция получает 100 авторов и в цикле делает по одному SELECT книг для каждого. Сколько запросов выполнится и как называется проблема?"
      options:
        - "1 запрос, проблемы нет"
        - "101 запрос, N+1"
        - "100 запросов, дедлок"
        - "2 запроса, фантом"
      answer: 1
      explanation: >-
        Один запрос за списком плюс N запросов по одному на элемент. Решение: JOIN или один запрос с IN.
exercise:
  id: databases.sql.sql-injection-and-safe-access.exercise
  title: "Безопасный слой доступа к данным"
  prompt: |
    Файл `safe_db.py` содержит уязвимые функции. Исправьте все пять (сигнатуры и порядок результатов менять нельзя).
    Таблицы: `users(id, name, secret)`, `products(id, name, price, category)`, `authors(id, name)`, `books(id, author_id, title)`.

    1. `find_user(conn, name)` - вернуть `(id, name)` пользователя с точным именем или `None`. Параметризованный запрос; `O'Brien` и `' OR '1'='1` - обычные строки.
    2. `search_products(conn, term)` - названия товаров, **содержащих** `term` как подстроку (по возрастанию). Символы `%`, `_` и `\` в `term` - обычные символы: экранируйте их и используйте `LIKE ... ESCAPE`.
    3. `sorted_products(conn, column)` - названия товаров, отсортированные по `column` (`name`, `price` или `category`), затем по `id`. Любое другое значение - `ValueError`. Белый список обязателен: имя столбца параметром не передать.
    4. `products_by_ids(conn, ids)` - названия товаров по списку id (по возрастанию id). Сгенерируйте нужное число плейсхолдеров; пустой список даёт `[]`.
    5. `titles_by_author(conn)` - словарь `{имя автора: [названия книг по возрастанию]}` для авторов, у которых есть книги. Не более **двух** запросов `SELECT` независимо от числа авторов (устраните N+1).
  entryFile: safe_db.py
  evaluation: harness
  harness: exercise/harness
  harnessEntry: check.py
  hints:
    - "Главное правило: никаких f-строк и конкатенации с пользовательскими значениями в тексте запроса. Значение пишется в запросе как плейсхолдер ?, а передаётся вторым аргументом execute в кортеже: execute('... WHERE name = ?', (name,))."
    - "Для LIKE сначала экранируйте служебные символы в term (сам символ экранирования \\ тоже), потом передайте f'%{escaped}%' параметром и укажите в запросе ESCAPE '\\'. Имя столбца для ORDER BY параметром передать нельзя: проверьте его по множеству ORDER_COLUMNS и только после этого вставьте в текст запроса."
    - "Для IN: marks = ', '.join('?' * len(ids)) даёт нужное число плейсхолдеров, значения передайте списком; пустой список обработайте до запроса, потому что IN () невалиден. Устранить N+1 помогает один запрос JOIN авторов и книг, сгруппированный в словарь в Python."
    - "titles_by_author: SELECT a.name, b.title FROM authors a JOIN books b ON b.author_id = a.id ORDER BY a.name, b.title; затем цикл по строкам с result.setdefault(author, []).append(title). Авторы без книг в результат не попадают (JOIN их отбрасывает)."
  tests:
    - id: find-user
      title: "Поиск пользователя по имени"
      hint: "Запрос с плейсхолдером ? и кортежем параметров (name,); верните fetchone()."
    - id: quote-safe
      title: "Имя с апострофом"
      hint: "Апостроф ломает запрос, собранный из строки; параметр передаётся как значение и ничего не ломает."
    - id: n-plus-one
      title: "Не более двух SELECT (N+1)"
      hint: "Один запрос с JOIN вместо запроса в цикле по авторам."
    - id: injection-returns-nothing
      title: "Инъекции не работают (скрытый)"
      hidden: true
      hint: "Строка \"' OR '1'='1\" должна искаться как имя пользователя и ничего не находить."
    - id: like-escape
      title: "Спецсимволы LIKE (скрытый)"
      hidden: true
      hint: "% и _ внутри term нужно экранировать и добавить ESCAPE; обратную косую черту экранируют первой."
    - id: order-allowlist
      title: "Белый список столбцов сортировки (скрытый)"
      hidden: true
      hint: "Столбец не из ORDER_COLUMNS (и регистр, и пустая строка) - ValueError до выполнения запроса."
    - id: in-clause
      title: "Список для IN (скрытый)"
      hidden: true
      hint: "Плейсхолдеры генерируйте по длине списка, а значения всегда передавайте параметрами; пустой список возвращает []."
