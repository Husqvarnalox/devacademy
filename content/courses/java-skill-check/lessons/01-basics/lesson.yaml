id: "java.check.basics"
title: "Проверка: основы - значения, ввод, условия, циклы"
goal: "Читать числа из ввода, применять условия и циклы и не ошибаться в целочисленной арифметике."
difficulty: "easy"
estimatedMinutes: 15
prerequisites: []
objectives:
  - "Показать на практике умение: читать числа до конца ввода, накапливать сумму и счётчики в цикле и предсказывать результат простых выражений."
masteryCriteria:
  - "Решение упражнения проходит все тесты, включая скрытые."
  - "Квиз пройден с результатом не ниже 75%."
tags:
  - "java"
  - "check"
  - "basics"
  - "values"
  - "loops"
assessmentFor:
  - "java.from-zero.first-program"
  - "java.from-zero.compiler-errors"
  - "java.from-zero.output"
  - "java.from-zero.variables"
  - "java.from-zero.basic-types"
  - "java.from-zero.arithmetic"
  - "java.from-zero.strings"
  - "java.from-zero.reading-input"
  - "java.from-zero.type-conversion"
  - "java.from-zero.formatted-output"
  - "java.from-zero.comparison-and-logic"
  - "java.from-zero.if-else"
  - "java.from-zero.switch"
  - "java.from-zero.while-loop"
  - "java.from-zero.for-loop"
  - "java.from-zero.loop-control"
quiz:
  passThreshold: 0.75
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```java
        int s = 0;
        for (int i = 1; i <= 10; i++) {
            if (i % 3 == 0) {
                continue;
            }
            if (i > 7) {
                break;
            }
            s += i;
        }
        System.out.println(s);
        ```
      options:
        - "19"
        - "22"
        - "27"
        - "12"
      answer: 0
      explanation: "Цикл складывает i = 1, 2, 4, 5, 7 (кратные 3 пропускаются через continue). При i = 8 срабатывает break, поэтому сумма остаётся 1 + 2 + 4 + 5 + 7 = 19."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```java
        System.out.println(7 / 2 * 2.0 + " " + 7 / 2.0 * 2);
        ```
      options:
        - "7.0 7.0"
        - "6.0 7.0"
        - "6.0 6.0"
        - "7.0 6.0"
      answer: 1
      explanation: "Вычисления идут слева направо. В первом выражении 7 / 2 - деление целых и равно 3, затем 3 * 2.0 = 6.0. Во втором 7 / 2.0 - дробное деление, 3.5, а 3.5 * 2 = 7.0."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```java
        int x = 5;
        x += 3.9;
        System.out.println(x + " " + (char) ('a' + 2));
        ```
      options:
        - "8 c"
        - "8.9 c"
        - "8 99"
        - "9 c"
      answer: 0
      explanation: "Составное присваивание вставляет приведение к int: 5 + 3.9 = 8.9 превращается в 8. Выражение 'a' + 2 имеет тип int (99), приведение (char) превращает его в символ c."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```java
        long total = 1_000_000 * 3000;
        System.out.println(total);
        ```
      options:
        - "3000000000"
        - "-1294967296"
        - "0"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Оба множителя - int, поэтому произведение 3 000 000 000 вычисляется как int и переполняется до -1294967296; только потом результат расширяется до long. Исправление: 1_000_000L * 3000."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```java
        int i = 0;
        if (i != 0 && 10 / i > 1) {
            System.out.println("A");
        } else {
            System.out.println("B");
        }
        ```
      options:
        - "A"
        - "B"
        - "ArithmeticException"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Оператор && вычисляет правую часть, только если левая истинна. Левая часть i != 0 ложна, деление 10 / i не выполняется, и выбирается ветка else."
exercise:
  id: "java.check.basics.exercise"
  title: "Статистика чисел"
  prompt: |-
    Программа читает целые числа до конца ввода (они могут стоять на нескольких строках) и печатает пять строк:

    ```
    Чисел: <количество>
    Сумма: <сумма>
    Чётных: <сколько чётных>
    Среднее: <сумма / количество, целое деление>
    Максимум: <наибольшее>
    ```

    Если чисел нет, во всех строках печатается `0`. Среднее - результат целочисленного деления (дробная часть отбрасывается).

    **Пример.** Ввод:

    ```
    4 7 10 3 9
    ```

    Вывод:

    ```
    Чисел: 5
    Сумма: 33
    Чётных: 2
    Среднее: 6
    Максимум: 10
    ```
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Читайте числа циклом while (in.hasNextInt()) и обновляйте счётчики внутри него."
    - "Чётность проверяйте как x % 2 == 0: это верно и для отрицательных чисел. Максимум начинайте с первого числа (или условия count == 0), а не с нуля."
    - "Среднее считайте только если count > 0, иначе деление на ноль. Сумма и количество - целые числа, деление целое."
  tests:
    - id: "basic"
      title: "Обычные числа"
      stdin: |
        4 7 10 3 9
      expected: |
        Чисел: 5
        Сумма: 33
        Чётных: 2
        Среднее: 6
        Максимум: 10
      hint: "Пять строк: 5 чисел, сумма 33, чётных 2 (4 и 10), среднее 33 / 5 = 6 с отбрасыванием дроби, максимум 10."
    - id: "lines"
      title: "Числа на нескольких строках"
      stdin: |
        10
        20
        30
      expected: |
        Чисел: 3
        Сумма: 60
        Чётных: 3
        Среднее: 20
        Максимум: 30
      hint: "Числа читаются до конца ввода, а не только из первой строки."
    - id: "negative"
      title: "Отрицательные числа (скрытый)"
      stdin: |
        -4 -3 -8 -7
      expected: |
        Чисел: 4
        Сумма: -22
        Чётных: 2
        Среднее: -5
        Максимум: -3
      hidden: true
      hint: "Чётность отрицательных чисел проверяйте через % 2 == 0; максимум из отрицательных равен -3, а не 0; среднее -22 / 4 даёт -5 (дробная часть отбрасывается к нулю)."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: |
        Чисел: 0
        Сумма: 0
        Чётных: 0
        Среднее: 0
        Максимум: 0
      hidden: true
      hint: "Когда чисел нет, все пять значений равны 0, а деление на ноль нужно обойти."
    - id: "single"
      title: "Одно число (скрытый)"
      stdin: |
        7
      expected: |
        Чисел: 1
        Сумма: 7
        Чётных: 0
        Среднее: 7
        Максимум: 7
      hidden: true
      hint: "Одно нечётное число: количество 1, сумма 7, чётных 0, среднее 7, максимум 7."
