id: "java.check.streams"
title: "Проверка: лямбды, Streams API и Optional"
goal: "Преобразовывать коллекции конвейерами Stream, собирать результат коллекторами и безопасно работать с отсутствующим значением через Optional."
difficulty: "medium"
estimatedMinutes: 25
prerequisites: []
objectives:
  - "Показать на практике умение: фильтровать, преобразовывать и группировать данные через Stream и возвращать Optional вместо null."
masteryCriteria:
  - "Решение упражнения проходит все тесты, включая скрытые."
  - "Квиз пройден с результатом не ниже 75%."
tags:
  - "java"
  - "check"
  - "streams"
  - "streams"
  - "lambdas"
  - "optional"
assessmentFor:
  - "java.fundamentals.streams-lambdas-optional"
quiz:
  passThreshold: 0.75
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```java
        System.out.println(Stream.of(1, 2, 3, 4, 5)
                .filter(x -> x % 2 == 1)
                .map(x -> x * x)
                .toList());
        ```
      options:
        - "[1, 3, 5]"
        - "[1, 9, 25]"
        - "[4, 16]"
        - "[1, 4, 9, 16, 25]"
      answer: 1
      explanation: "filter оставляет нечётные 1, 3 и 5, map возводит их в квадрат: 1, 9, 25."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```java
        Stream.of("a", "b", "c")
                .peek(s -> System.out.print(s.toUpperCase()))
                .filter(s -> s.equals("a"))
                .findFirst();
        ```
      options:
        - "ABC"
        - "A"
        - "ничего не выведет"
        - "AB"
      answer: 1
      explanation: "Потоки ленивы: элементы идут по конвейеру по одному, и findFirst завершает работу, как только находит первый подходящий. Элемент a проходит peek и filter, остальные не обрабатываются."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```java
        Optional<String> o = Optional.empty();
        System.out.println(o.map(String::length).orElse(-1));
        ```
      options:
        - "0"
        - "-1"
        - "NoSuchElementException"
        - "null"
      answer: 1
      explanation: "map пропускается для пустого Optional и возвращает пустое значение, а orElse подставляет запасное -1."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```java
        System.out.println(Stream.of("b", "c", "a")
                .sorted(Comparator.reverseOrder())
                .collect(Collectors.joining(",")));
        ```
      options:
        - "a,b,c"
        - "c,b,a"
        - "b,c,a"
        - "a,c,b"
      answer: 1
      explanation: "Компаратор reverseOrder сортирует по убыванию, поэтому порядок c, b, a. joining соединяет элементы запятыми."
    - id: "q5"
      type: "single"
      prompt: |-
        Что произойдёт?

        ```java
        Stream<Integer> s = Stream.of(1, 2, 3);
        System.out.println(s.count());
        System.out.println(s.count());
        ```
      options:
        - "3 и 3"
        - "3 и затем IllegalStateException"
        - "0 и 0"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Терминальная операция count использует поток. Повторное обращение к нему бросает IllegalStateException: stream has already been operated upon or closed."
exercise:
  id: "java.check.streams.exercise"
  title: "Сотрудники и отделы"
  prompt: |-
    Класс `Employee` и `main` уже написаны. Реализуйте три метода на потоках.

    * `namesAbove(List<Employee>, int min)` - имена сотрудников с зарплатой не ниже `min`, отсортированные по алфавиту.
    * `totalByDept(List<Employee>)` - `Map<String, Integer>` с суммой зарплат по отделам; ключи по возрастанию (`TreeMap`).
    * `topEarner(List<Employee>)` - `Optional<Employee>` с наибольшей зарплатой; при равенстве - первый по порядку.

    Ввод: первая строка - порог `min`, дальше строки `имя отдел зарплата`.

    **Пример.** Ввод:

    ```
    100
    ann dev 150
    bob ops 90
    cid dev 200
    ```

    Вывод:

    ```
    Не ниже 100: [ann, cid]
    По отделам: {dev=350, ops=90}
    Лучший: cid (200)
    ```
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Заготовки возвращают пустые значения. Начните с namesAbove: stream().filter(...).map(Employee::name).sorted().toList()."
    - "totalByDept: Collectors.groupingBy(Employee::dept, TreeMap::new, Collectors.summingInt(Employee::salary))."
    - "topEarner: stream().max(Comparator.comparingInt(Employee::salary)). Для пустого списка вернётся пустой Optional, а при равенстве max оставляет первый элемент."
  tests:
    - id: "basic"
      title: "Три сотрудника"
      stdin: |
        100
        ann dev 150
        bob ops 90
        cid dev 200
      expected: |
        Не ниже 100: [ann, cid]
        По отделам: {dev=350, ops=90}
        Лучший: cid (200)
      hint: "Порог 100: подходят ann и cid; сумма отдела dev равна 350; лучший - cid с 200."
    - id: "threshold"
      title: "Порог включительно"
      stdin: |
        150
        zed ops 150
        amy ops 150
        bob dev 149
      expected: |
        Не ниже 150: [amy, zed]
        По отделам: {dev=149, ops=300}
        Лучший: zed (150)
      hint: "Зарплата, равная порогу, подходит (>=). Имена сортируются: amy раньше zed; при равных зарплатах лучшим остаётся первый - zed."
    - id: "empty"
      title: "Нет сотрудников (скрытый)"
      stdin: |
        100
      expected: |
        Не ниже 100: []
        По отделам: {}
        Лучший: нет
      hidden: true
      hint: "Для пустого списка Optional пуст, и main печатает Лучший: нет; отделов нет, список имён пуст."
    - id: "none"
      title: "Никто не прошёл порог (скрытый)"
      stdin: |
        1000
        ann dev 150
        bob ops 90
      expected: |
        Не ниже 1000: []
        По отделам: {dev=150, ops=90}
        Лучший: ann (150)
      hidden: true
      hint: "Список имён пуст, но суммы по отделам и лучший сотрудник считаются по всем."
