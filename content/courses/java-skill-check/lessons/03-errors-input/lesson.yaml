id: "java.check.errors-input"
title: "Проверка: ошибки и разбор ввода"
goal: "Читать строки ввода, разбирать числа безопасно, пропускать и считать неверные строки и форматировать результат."
difficulty: "easy"
estimatedMinutes: 20
prerequisites: []
objectives:
  - "Показать на практике умение: разбирать строки формата «имя;число», перехватывать NumberFormatException, считать ошибки и печатать дроби независимо от локали."
masteryCriteria:
  - "Решение упражнения проходит все тесты, включая скрытые."
  - "Квиз пройден с результатом не ниже 75%."
tags:
  - "java"
  - "check"
  - "errors-input"
  - "errors"
  - "input"
assessmentFor:
  - "java.from-zero.reading-input"
  - "java.from-zero.type-conversion"
  - "java.from-zero.exceptions"
quiz:
  passThreshold: 0.75
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что произойдёт?

        ```java
        int n = Integer.parseInt("12 ");
        ```
      options:
        - "n получит значение 12"
        - "n получит значение 0"
        - "бросится NumberFormatException"
        - "ошибка компиляции"
      answer: 2
      explanation: "parseInt не допускает пробелов вокруг числа: любой посторонний символ приводит к NumberFormatException. Перед разбором ввод нужно очистить вызовом trim()."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```java
        try {
            System.out.println("A");
            int x = Integer.parseInt("x");
            System.out.println("B");
        } catch (NumberFormatException e) {
            System.out.println("C");
        }
        System.out.println("D");
        ```
      options:
        - "A B D"
        - "A C D"
        - "A C"
        - "C D"
      answer: 1
      explanation: "Строка A печатается до ошибки. parseInt бросает исключение, остаток блока try (печать B) пропускается, выполняется catch (C), а затем программа продолжает работу после try/catch и печатает D."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```java
        Scanner in = new Scanner("3 4\nабв\n");
        int a = in.nextInt();
        int b = in.nextInt();
        String s = in.nextLine();
        String t = in.nextLine();
        System.out.println("[" + s + "][" + t + "]");
        ```
      options:
        - "[абв][]"
        - "[][абв]"
        - "[ абв][]"
        - "[][]"
      answer: 1
      explanation: "После nextInt в первой строке остаётся только перевод строки. Первый nextLine возвращает этот пустой остаток, второй - строку \"абв\". Результат: [][абв]."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```java
        System.out.println(String.format(Locale.ROOT, "%05.1f|%-4d|", 3.14159, 7));
        ```
      options:
        - "3.1|7|"
        - "003.1|7   |"
        - "003.1|   7|"
        - "03.14|7   |"
      answer: 1
      explanation: "Формат %05.1f - дробное число с одним знаком после точки, ширина 5, дополнение нулями слева: 003.1. Формат %-4d выравнивает целое по левому краю в поле шириной 4: \"7   \". Locale.ROOT гарантирует точку."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```java
        static int safeDiv(int a, int b) {
            try {
                return a / b;
            } catch (ArithmeticException e) {
                return -1;
            } finally {
                System.out.print("F");
            }
        }

        public static void main(String[] args) {
            System.out.println(safeDiv(6, 0) + " " + safeDiv(6, 3));
        }
        ```
      options:
        - "-1 2"
        - "F-1 F2"
        - "FF-1 2"
        - "-1 2FF"
      answer: 2
      explanation: "Оба вызова выполняются до печати результата, и каждый печатает F из блока finally, который срабатывает при любом выходе. Затем println печатает строку \"-1 2\", поэтому на экране FF-1 2."
exercise:
  id: "java.check.errors-input.exercise"
  title: "Ведомость с ошибками"
  prompt: |-
    Программа читает строки формата `имя;балл`. Строка **принимается**, если после разбора по `;` в ней ровно две части (методом `split(";", -1)`), имя после `trim()` не пустое, а балл после `trim()` - целое число от 0 до 100. Любая другая непустая строка **пропускается** и считается. Пустые строки не считаются вовсе.

    Выведите:

    ```
    Принято: <сколько принято>
    Пропущено: <сколько пропущено>
    Средний балл: <среднее с двумя знаками>
    Лучший: <имя> (<балл>)
    ```

    Средний балл печатается с двумя знаками после точки (`Locale.ROOT`); если принятых строк нет, он равен `0.00`. Строка `Лучший` печатается только если есть принятые; при равных баллах побеждает тот, кто идёт раньше.

    **Пример.** Ввод:

    ```
    Анна;90
    плохо
    Борис;abc
    ;50
    Вика;101
    Глеб; 75 
    ```

    Вывод:

    ```
    Принято: 2
    Пропущено: 4
    Средний балл: 82.50
    Лучший: Анна (90)
    ```
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Читайте строки в цикле while (in.hasNextLine()), обрезайте их trim() и пропускайте пустые."
    - "line.split(\";\", -1) вернёт ровно две части только при одной точке с запятой. Разбор числа оберните в try/catch NumberFormatException, затем проверьте диапазон 0..100."
    - "Среднее: (double) total / ok, но только если ok > 0. Печатайте через System.out.printf(Locale.ROOT, \"Средний балл: %.2f%n\", ...). Лучший обновляйте при строго большем балле."
  tests:
    - id: "basic"
      title: "Корректные строки"
      stdin: |
        Анна;90
        Борис;70
        Вика;80
      expected: |
        Принято: 3
        Пропущено: 0
        Средний балл: 80.00
        Лучший: Анна (90)
      hint: "Три принятые строки, среднее 80.00, лучшая - Анна с баллом 90."
    - id: "mixed"
      title: "Неверные строки среди верных"
      stdin: |
        Анна;90
        плохо
        Борис;abc
        ;50
        Вика;101

        Глеб; 75 
      expected: |
        Принято: 2
        Пропущено: 4
        Средний балл: 82.50
        Лучший: Анна (90)
      hint: "Пропускаются строки без ;, с нечисловым баллом, с пустым именем и баллом вне 0..100; пробелы вокруг балла допустимы, пустая строка не считается."
    - id: "none"
      title: "Нет принятых строк (скрытый)"
      stdin: |
        x
        y;z
      expected: |
        Принято: 0
        Пропущено: 2
        Средний балл: 0.00
      hidden: true
      hint: "Если ничего не принято, среднее равно 0.00, а строка Лучший не печатается."
    - id: "ties"
      title: "Равные баллы и лишние точки с запятой (скрытый)"
      stdin: |
        A;100
        B;100
        C;0
        D;-1
        E;5;
      expected: |
        Принято: 3
        Пропущено: 2
        Средний балл: 66.67
        Лучший: A (100)
      hidden: true
      hint: "Строка E;5; содержит две точки с запятой, поэтому пропускается; отрицательный балл неверен; из равных 100 лучшим остаётся A; среднее (100 + 100 + 0) / 3 = 66.67."
    - id: "rounding"
      title: "Округление среднего (скрытый)"
      stdin: |
        a;1
        b;2
        c;2
      expected: |
        Принято: 3
        Пропущено: 0
        Средний балл: 1.67
        Лучший: b (2)
      hidden: true
      hint: "Среднее 5 / 3 печатается как 1.67: нужно дробное деление и формат %.2f с точкой."
