id: "llm.fundamentals.rag-retrieval"
title: "RAG: чанкинг, поиск TF-IDF и recall@k"
goal: "Реализовать часть RAG-конвейера до генерации - нарезку с перекрытием, TF-IDF-индекс, поиск с порогом отказа и метрику recall@k - и объяснить, чем разреженный поиск отличается от плотного."
difficulty: "medium"
estimatedMinutes: 90
prerequisites:
  - "llm.fundamentals.embeddings"
related:
  - "llm.fundamentals.chat-and-tools"
  - "llm.fundamentals.evaluation"
next:
  - "llm.fundamentals.chat-and-tools"
seeAlso:
  - "BM25, гибридный поиск, векторные базы с приближённым поиском и переранжирование - только текстом в разделе «Как это устроено в реальных системах»"
objectives:
  - "Объяснить, зачем RAG и из каких шагов он состоит, и почему качество поиска измеряют отдельно от качества генерации."
  - "Нарезать список слов на чанки с перекрытием и объяснить компромисс размера чанка."
  - "Построить TF-IDF-индекс со сглаженным idf и L2-нормировкой строк и найти top-k чанков для запроса с порогом отказа."
  - "Посчитать recall@k на размеченных вопросах и объяснить, как k влияет на recall и на стоимость запроса."
  - "Сравнить разреженный и плотный поиск и назвать, где TF-IDF не находит перефразировки."
masteryCriteria:
  - "tokenize заменяет «ё» на «е», приводит регистр к нижнему и выделяет слова регулярным выражением \\w+."
  - "chunk_words даёт шаг size - overlap, останавливается после первого чанка, дошедшего до конца, и бросает ValueError при size <= 0, overlap < 0 и overlap >= size."
  - "build_index: idf равен ln((1 + N) / (1 + df)) + 1, строки matrix имеют единичную L2-норму, пустой чанк даёт нулевую строку без nan."
  - "search возвращает пары (индекс, оценка) со score > min_score по убыванию оценки, при равенстве - по возрастанию индекса, игнорирует неизвестные слова и возвращает [] при отсутствии совпадений."
  - "recall_at_k усредняет доли найденных релевантных чанков, пропускает запросы без релевантных и бросает ValueError, если запросов не осталось."
tags:
  - "llm"
  - "rag"
  - "retrieval"
  - "tf-idf"
  - "recall"
requires:
  packages:
    - "numpy>=2"
accelerator: "none"
facts:
  - kind: "historical"
    text: "Название RAG закрепилось после статьи Lewis и соавторов 2020 года, где генератор текста соединили с поиском по внешнему корпусу документов, чтобы знания можно было обновлять без переобучения всей модели."
    sources:
      - "https://arxiv.org/abs/2005.11401"
  - kind: "internals"
    text: "В scikit-learn сглаженный idf по умолчанию считается как ln((1 + N) / (1 + df)) + 1, а строки матрицы TF-IDF нормируются по L2 - именно эти соглашения реализует упражнение."
    sources:
      - "https://scikit-learn.org/stable/modules/feature_extraction.html#tfidf-term-weighting"
  - kind: "internals"
    text: "Эксперименты показали, что многие языковые модели хуже используют релевантную информацию, если она расположена в середине длинного контекста, чем в его начале или конце; поэтому добавление лишних найденных фрагментов может ухудшить ответ."
    sources:
      - "https://arxiv.org/abs/2307.03172"
  - kind: "misconception"
    text: "«RAG устраняет выдумки модели». RAG уменьшает долю ответов не по делу, когда нужный фрагмент найден, но модель всё равно может проигнорировать источник, смешать его с собственными знаниями или сослаться на несуществующий номер, а если поиск ничего полезного не нашёл, ответ строится без опоры."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "numeric"
      prompt: "Корпус из N = 9 чанков, слово встречается в df = 4 из них. Чему равен сглаженный idf = ln((1 + N) / (1 + df)) + 1 (округлите до тысячных)?"
      answer: 1.693
      tolerance: 0.001
      explanation: "(1 + 9) / (1 + 4) = 2, ln 2 = 0.693, плюс 1 даёт 1.693. Если взять ln(N / df) без сглаживания, получится 0.811: для слова из всех чанков такая формула давала бы 0, а слагаемое +1 как раз не позволяет слову пропасть из вектора."
    - id: "q2"
      type: "numeric"
      prompt: "Сколько чанков даст chunk_words для 100 слов при size = 30 и overlap = 10?"
      answer: 5
      tolerance: 0
      explanation: "Шаг 30 - 10 = 20, чанки начинаются с 0, 20, 40, 60, 80. Чанк с позиции 60 заканчивается на 90 и до конца (100) не дошёл, чанк с позиции 80 дошёл, на нём остановка. Ответ 4 получится, если забыть последний неполный чанк: он нужен, иначе последние слова текста потеряются."
    - id: "q3"
      type: "single"
      prompt: "Для вопроса релевантны чанки {1, 2}. Поиск вернул [7, 1, 5, 2]. Чему равен recall@3 для этого вопроса?"
      options:
        - "0.5"
        - "1.0"
        - "0.25"
        - "0.75"
      answer: 0
      explanation: "В первых трёх результатах [7, 1, 5] есть только чанк 1 из двух релевантных: 1/2 = 0.5. Значение 1.0 получилось бы при k = 4, а 0.25 - если делить на длину списка результатов, а не на число релевантных чанков."
    - id: "q4"
      type: "multiple"
      prompt: "Что верно о разреженном (TF-IDF) и плотном (эмбеддинги) поиске?"
      options:
        - "TF-IDF хорошо находит точные редкие слова, например номер статьи или артикул"
        - "TF-IDF считает словоформы «потерял» и «потерянную» разными словами, если их не приводить к начальной форме"
        - "Плотный поиск может найти перефразированный вопрос без общих слов"
        - "Плотный поиск всегда лучше TF-IDF, поэтому TF-IDF не нужен"
      answer:
        - 0
        - 1
        - 2
      explanation: "Первые три утверждения верны: разреженный поиск опирается на совпадающие слова и слеп к смыслу, плотный сравнивает смысл, но может терять редкие точные термины. Четвёртое неверно: именно поэтому часто используют гибридный поиск, а не заменяют один способ другим."
    - id: "q5"
      type: "single"
      prompt: "Лучшая оценка поиска для вопроса ниже порога min_score. Что должна сделать RAG-система?"
      options:
        - "Отказаться отвечать по документам или сказать, что подходящих источников нет"
        - "Всё равно отправить модели лучшие найденные чанки: вдруг пригодятся"
        - "Снизить порог до нуля, чтобы хоть что-то нашлось"
        - "Отправить модели вопрос без источников и считать ответ проверенным"
      answer: 0
      explanation: "Слабые чанки не содержат ответа, но модель склонна использовать то, что ей дали, и построит правдоподобный ответ на постороннем тексте. Отказ честнее. Снижение порога до нуля делает отказ невозможным, а ответ без источников нельзя считать проверенным."
exercise:
  id: "llm.fundamentals.rag-retrieval.exercise"
  title: "Чанкинг, TF-IDF-поиск и recall@k"
  prompt: |
    В файле `rag_task.py` реализуйте пять функций на стандартной библиотеке и NumPy; ничего не печатайте.

    1. `tokenize(text)` - `re.findall(r"\w+", text.lower().replace("ё", "е"))`.
    2. `chunk_words(words, size, overlap)` - список чанков (списков слов). Шаг `step = size - overlap`, чанки начинаются с позиций `0, step, 2 * step, ...`; остановитесь после первого чанка, который доходит до конца списка (чанк, целиком лежащий внутри предыдущего, не нужен). `ValueError`, если `size <= 0`, `overlap < 0` или `overlap >= size` (проверка идёт до проверки пустого списка); пустой список слов даёт `[]`.
    3. `build_index(chunks)` (чанки - списки токенов) - словарь `{"vocab": {терм: столбец}, "idf": массив (V,), "matrix": массив (N, V)}` типа `float64`. Термы отсортированы по алфавиту (`sorted`), `tf` - число вхождений терма в чанк, `idf = ln((1 + N) / (1 + df)) + 1`, `matrix = tf * idf`, затем каждая строка делится на свою L2-норму; у пустого чанка строка нулевая.
    4. `search(query_tokens, index, k, min_score=0.0)` - список пар `(номер чанка, оценка)`. Вектор запроса: число вхождений каждого известного терма, умноженное на `idf`, нормированное по L2; неизвестные термы игнорируются. Оценка - скалярное произведение с строкой `matrix`. Берутся оценки строго больше `min_score`, порядок: оценка по убыванию, при равенстве меньший номер чанка; не более `k` пар; если известных термов нет или `k <= 0` - `[]`.
    5. `recall_at_k(retrieved, relevant, k)` - среднее по запросам `|set(retrieved[q][:k]) & set(relevant[q])| / |set(relevant[q])|`; запросы с пустым множеством релевантных пропускаются; если не осталось ни одного запроса - `ValueError`; списки разной длины - `ValueError`.

    Пример: `chunk_words(list("abcdefghij"), 4, 1)` возвращает чанки `abcd`, `defg`, `ghij`; `build_index([["a", "b"], ["a", "c"], ["a"]])["idf"]` равен `[1, 1.693147, 1.693147]`; `search(["кот"], build_index([["кот"], ["пес"], ["кот"]]), 5)` возвращает `[(0, 1.0), (2, 1.0)]`; `recall_at_k([[1, 2, 3]], [{1, 2, 3, 4}], 2)` равен `0.5`.
  entryFile: "rag_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Начните с tokenize и chunk_words (они независимы от остальных), затем build_index, затем search на его результате и recall_at_k. Проверяйте результат каждой функции на маленьком примере из условия."
    - "chunk_words: цикл while True с индексом start; добавьте words[start:start + size], остановитесь, если start + size >= len(words), иначе start += size - overlap. build_index: матрица счётчиков tf формы (N, V), df = (tf > 0).sum(axis=0), затем деление строк на np.linalg.norm(..., axis=1, keepdims=True) только там, где норма больше нуля."
    - "search: q = np.zeros(V); для известных термов q[vocab[t]] += 1; q *= idf; поделите q на его норму (если норма 0 - верните []); scores = matrix @ q; отберите (i, float(s)) для s > min_score и отсортируйте по ключу (-score, i)."
    - "recall_at_k: для каждой пары (найденные, релевантные) приведите релевантные к set; если множество пусто - continue; иначе добавьте len(set(найденные[:k]) & rel) / len(rel) в список; если список пуст - raise ValueError; ответ - сумма / длина."
  tests:
    - id: "tokenize-basic"
      title: "tokenize: регистр и знаки препинания"
      hint: "Проверяются нижний регистр, отбрасывание знаков препинания и пустая строка."
    - id: "chunk-basic"
      title: "chunk_words: шаг и последний чанк"
      hint: "Проверяются границы чанков при перекрытии, короткий последний чанк и то, что входной список не изменён."
    - id: "search-ranking"
      title: "build_index и search: порядок и оценки"
      hint: "Проверяются порядок и значения оценок на небольшом корпусе по сравнению с эталонной реализацией."
    - id: "tokenize-yo"
      title: "tokenize: «ё», цифры, Юникод (скрытый)"
      hidden: true
      hint: "Проверяются замена ё и Ё, цифры, подчёркивание и буквы вне русского алфавита."
    - id: "chunk-edges"
      title: "chunk_words: края и ошибки (скрытый)"
      hidden: true
      hint: "Проверяются перекрытие на единицу меньше размера, один чанк, дошедший до конца, пустой список и некорректные параметры."
    - id: "index-idf"
      title: "build_index: vocab, idf и строки (скрытый)"
      hidden: true
      hint: "Проверяются порядок термов, значения idf по формуле, форма и тип матрицы и счётчики tf."
    - id: "index-norm"
      title: "build_index: нормы и пустые чанки (скрытый)"
      hidden: true
      hint: "Проверяются единичная норма непустых строк, нулевая строка пустого чанка без nan и пустой корпус."
    - id: "search-ties"
      title: "search: равные оценки и k (скрытый)"
      hidden: true
      hint: "Проверяются порядок при равных оценках, ограничение k и k = 0."
    - id: "search-min-score"
      title: "search: порог отказа (скрытый)"
      hidden: true
      hint: "Проверяются строгий порог, пустой результат при высоком пороге и отсутствие нулевых оценок."
    - id: "search-unknown"
      title: "search: неизвестные слова (скрытый)"
      hidden: true
      hint: "Проверяются запрос без известных слов, пустой запрос, смесь известных и неизвестных слов и повторы."
    - id: "recall-values"
      title: "recall_at_k: значения (скрытый)"
      hidden: true
      hint: "Проверяются средние доли, k меньше числа релевантных, повторы в результатах и k = 0."
    - id: "recall-edges"
      title: "recall_at_k: пропуски и ошибки (скрытый)"
      hidden: true
      hint: "Проверяются пропуск запросов без релевантных, ошибка при их отсутствии и разная длина списков."
