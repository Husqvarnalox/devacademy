id: "llm.fundamentals.sampling"
title: "Генерация текста: greedy, temperature, top-k, top-p"
goal: "Реализовать устойчивый softmax с температурой, фильтры top-k и top-p и цикл генерации с фиксированным протоколом выбора токена и объяснить, как эти параметры влияют на текст."
difficulty: "medium"
estimatedMinutes: 80
prerequisites:
  - "llm.fundamentals.bigram-model"
related:
  - "llm.fundamentals.tokenization"
  - "llm.fundamentals.attention"
next:
  - "llm.fundamentals.attention"
seeAlso:
  - "Beam search, штрафы за повторы и другие обработчики логитов - только текстом в разделе «Как это устроено в библиотеках»"
objectives:
  - "Описать цикл генерации: логиты, распределение, выбор токена, добавление в текст, остановка."
  - "Реализовать устойчивый softmax с температурой, который корректно обрабатывает -inf и большие логиты."
  - "Реализовать top-k и top-p с детерминированным правилом ничьих и обязательным минимумом в один токен."
  - "Собрать sample_next с фиксированным порядком преобразований и воспроизводимой выборкой по seed."
  - "Объяснить, чем отличаются greedy, температура, top-k и top-p и как они связаны с параметрами API."
masteryCriteria:
  - "softmax([1000, 0]) возвращает [1, 0] без предупреждений, значения -inf получают вероятность ровно 0, а temperature <= 0 приводит к ValueError."
  - "top_k_filter оставляет k наибольших значений (при ничьей - меньший индекс), top_p_filter оставляет наименьший префикс с суммой >= p, перенормирует и всегда оставляет хотя бы один токен."
  - "sample_next при temperature=0 равен argmax и не обращается к rng, иначе повторяет протокол logits / T, top_k, softmax, top_p, rng.choice, а при фиксированном seed последовательности совпадают с эталоном."
  - "generate не добавляет токен конца, останавливается на нём или после max_new_tokens, а частоты 20000 выборок совпадают с softmax в пределах 0.02."
tags:
  - "llm"
  - "sampling"
  - "temperature"
  - "top-k"
  - "top-p"
  - "numpy"
requires:
  packages:
    - "numpy>=2"
accelerator: "none"
facts:
  - kind: "historical"
    text: "Nucleus sampling (top-p) предложили Холтцман и соавторы в работе о вырождении нейросетевого текста: они показали, что выбор самых вероятных токенов даёт повторяющийся текст, не похожий на человеческий, а отбрасывание только маловероятного «хвоста» сохраняет разнообразие."
    sources:
      - "https://arxiv.org/abs/1904.09751"
  - kind: "internals"
    text: "В библиотеке Hugging Face Transformers метод generate принимает параметры do_sample, temperature, top_k и top_p; при do_sample=False применяется greedy-декодирование, а стратегии генерации описаны в документации."
    sources:
      - "https://huggingface.co/docs/transformers/main/en/generation_strategies"
  - kind: "real-world"
    text: "Параметры temperature и top_p в API провайдеров языковых моделей управляют тем же преобразованием распределения следующего токена, что и функции этого урока: низкая температура даёт более предсказуемые ответы, высокая - более разнообразные."
  - kind: "misconception"
    text: "«При temperature=0 ответ всегда одинаковый». В нашем коде это так: argmax детерминирован. Но размещённые сервисы могут давать разные ответы и при нулевой температуре из-за порядка вычислений на ускорителе и обновлений модели, поэтому воспроизводимость нужно проверять отдельно."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "numeric"
      prompt: "Распределение [0.5, 0.25, 0.125, 0.125]. Сколько токенов остаётся после top-p с p = 0.8?"
      answer: 3
      tolerance: 0
      explanation: "Накопленные суммы по убыванию: 0.5, 0.75, 0.875. Первая сумма, не меньшая 0.8, достигается на третьем токене, и он сохраняется. Ответ 2 получится, если остановиться до того, как сумма достигла p; ответ 4 - если считать все токены."
    - id: "q2"
      type: "numeric"
      prompt: "Логиты [2, 0], температура 2. Чему равна вероятность первого токена после softmax (округлите до двух знаков)?"
      answer: 0.73
      tolerance: 0.005
      explanation: "Логиты делятся на температуру: [1, 0]. Тогда p = e / (e + 1) = 0.731. Без температуры было бы e^2 / (e^2 + 1) = 0.881: более высокая температура сделала распределение плоским."
    - id: "q3"
      type: "single"
      prompt: "В каком порядке sample_next преобразует логиты при temperature > 0?"
      options:
        - "top_p, softmax, top_k, деление на температуру, rng.choice"
        - "деление на температуру, top_k, softmax, top_p, rng.choice"
        - "softmax, деление вероятностей на температуру, top_k, top_p"
        - "top_k, top_p, деление на температуру, softmax"
      answer: 1
      explanation: "Температура меняет логиты до всего остального, top-k отсекает по логитам, а top-p работает с вероятностями после softmax и нормировки. Если поменять порядок, накопленные суммы для top-p считаются на другом распределении и результат отличается."
    - id: "q4"
      type: "multiple"
      prompt: "Что верно о выборе следующего токена?"
      options:
        - "Без вычитания максимума softmax([1000, 0]) переполняется и даёт nan"
        - "Очень малое p в top-p оставляет один самый вероятный токен"
        - "Top-p подстраивает число сохранённых токенов под форму распределения, а top-k оставляет всегда k"
        - "Температуру 0 можно реализовать как деление логитов на 0"
      answer:
        - 0
        - 1
        - 2
      explanation: "Верны первые три утверждения: exp(1000) равен inf, минимум один токен остаётся всегда, а число токенов в top-p зависит от накопленных вероятностей. Деление на 0 даёт inf и nan, поэтому температура 0 - отдельная ветка с argmax."
    - id: "q5"
      type: "single"
      prompt: "Генерация с seed = 5 и теми же параметрами дала на втором запуске другой текст. Какая причина вероятнее всего?"
      options:
        - "Нулевая температура недетерминирована"
        - "Генератор rng использовался в другом порядке или в другом месте программы, и его состояние на момент генерации отличалось"
        - "Softmax даёт разные значения при каждом вызове"
        - "seed влияет только на top-k, но не на top-p"
      answer: 1
      explanation: "Результат определяется seed и числом уже сделанных обращений к генератору: любой лишний или пропущенный вызов rng сдвигает последовательность. Именно поэтому при temperature=0 в sample_next к rng обращаться нельзя. Softmax и фильтры детерминированы."
exercise:
  id: "llm.fundamentals.sampling.exercise"
  title: "Выборка следующего токена и цикл генерации"
  prompt: |
    В файле `sampling_task.py` реализуйте пять функций на NumPy. Ничего не печатайте. Порядок вызовов генератора случайных чисел важен: тесты сравнивают последовательности при фиксированном `seed`.

    1. `softmax(logits, temperature=1.0)` - устойчивый softmax от `logits / temperature` для 1-D массива (вычитайте максимум). `temperature <= 0` - `ValueError`. Значения `-inf` получают вероятность 0; для логитов вроде `[1000, 0]` предупреждений быть не должно.
    2. `top_k_filter(logits, k)` - копия `float64`, где все значения, кроме `k` наибольших, равны `-inf`. Ничьи на границе решает `np.argsort(-logits, kind="stable")[:k]` (меньший индекс выигрывает). `k is None` или `k >= len(logits)` - копия без изменений; `k <= 0` - `ValueError`.
    3. `top_p_filter(probs, p)` - перенормированная копия, в которой оставлен наименьший префикс токенов (по убыванию вероятности, при ничьей - меньший индекс), чья накопленная сумма `>= p`; остальные вероятности равны 0. Минимум один токен остаётся всегда. `p` вне `(0, 1]` - `ValueError`; `p = 1` оставляет все токены с ненулевой вероятностью.
    4. `sample_next(logits, rng, temperature=1.0, top_k=None, top_p=None)` - `int`. Если `temperature == 0`: вернуть `int(np.argmax(logits))`; `top_k` и `top_p` игнорируются, `rng` не используется. `temperature < 0` - `ValueError`. Иначе строго по шагам: `z = logits / temperature`, затем `top_k_filter(z, top_k)`, затем `softmax(z)`, затем `top_p_filter(probs, top_p)`, если `top_p` не `None`, затем `int(rng.choice(len(probs), p=probs))`.
    5. `generate(logit_table, start_id, end_id, rng, max_new_tokens, temperature=1.0, top_k=None, top_p=None)` - список выбранных id без `start_id` и без `end_id`. Логиты следующего токена - `logit_table[последний токен]` (сначала `start_id`). Генерация останавливается, когда выбран `end_id` (он не добавляется), или после `max_new_tokens` токенов.

    Пример: `top_k_filter(np.array([1.0, 5.0, 3.0, 4.0]), 2)` возвращает `[-inf, 5, -inf, 4]`; `top_p_filter(np.array([0.5, 0.25, 0.125, 0.125]), 0.7)` возвращает `[2/3, 1/3, 0, 0]`; при `temperature=0` `sample_next(np.array([0.1, 2.0, 1.0]), rng)` возвращает `1`.
  entryFile: "sampling_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Три фильтра и softmax - независимые функции на 3-6 строк; sample_next и generate только соединяют их в фиксированном порядке. Начните с softmax и фильтров и проверяйте каждый отдельно."
    - "softmax: e = np.exp(z - np.max(z)), где z = logits / temperature; -inf даёт exp(-inf) = 0. Оба фильтра начинаются с order = np.argsort(-x, kind=\"stable\"): top-k берёт order[:k], top-p считает np.cumsum(probs[order])."
    - "top_k_filter: out = np.full_like(z, -np.inf); out[order[:k]] = z[order[:k]]. top_p_filter: число сохраняемых токенов n_keep = int(np.searchsorted(cum, p, side=\"left\")) + 1, но не больше len(probs); остальные нулевые, результат делится на сумму."
    - "sample_next: сначала ветка temperature == 0 (до любых обращений к rng), затем z = top_k_filter(logits / temperature, top_k); probs = softmax(z); при top_p is not None - probs = top_p_filter(probs, top_p); ответ int(rng.choice(len(probs), p=probs)). generate: цикл for _ in range(max_new_tokens): token = sample_next(logit_table[last], ...); if token == end_id: break; out.append(token); last = token."
  tests:
    - id: "softmax-basic"
      title: "softmax и температура"
      hint: "Проверяются значения softmax на небольшом векторе, влияние температуры в обе стороны и сумма вероятностей."
    - id: "filters-basic"
      title: "top_k_filter и top_p_filter"
      hint: "Проверяются результат обоих фильтров на небольших примерах и то, что входные массивы не изменяются."
    - id: "generate-greedy"
      title: "Greedy-генерация и остановка"
      hint: "Проверяются остановка на токене конца, лимит max_new_tokens на цикле и тип элементов результата."
    - id: "softmax-stable"
      title: "Устойчивость softmax (скрытый)"
      hidden: true
      hint: "Проверяются большие логиты, значения -inf, малая температура без предупреждений и ValueError для температуры <= 0."
    - id: "top-k-edge"
      title: "top_k_filter: ничьи и границы (скрытый)"
      hidden: true
      hint: "Проверяются ничьи на границе, k = None, k >= длины, копия результата, ValueError для k <= 0 и целочисленные логиты."
    - id: "top-p-edge"
      title: "top_p_filter: границы (скрытый)"
      hidden: true
      hint: "Проверяются крошечное p, p = 1, точное попадание суммы на p, равные вероятности, нулевые вероятности и недопустимые p."
    - id: "sample-reference"
      title: "sample_next: порядок преобразований (скрытый)"
      hidden: true
      hint: "Сравниваются выборы с эталоном для нескольких seed и сочетаний параметров, в том числе последовательности с общим генератором."
    - id: "temperature-zero"
      title: "temperature=0 и недопустимые параметры (скрытый)"
      hidden: true
      hint: "Проверяются argmax без обращений к rng, совпадение top_k=1 с greedy, ValueError для недопустимых параметров и токены с -inf."
    - id: "sample-distribution"
      title: "Частоты выборки совпадают с распределением (скрытый)"
      hidden: true
      hint: "Проверяется, что частоты 20000 выборок близки к ожидаемым вероятностям при нескольких настройках."
    - id: "generate-stops"
      title: "generate: эталон, остановка, воспроизводимость (скрытый)"
      hidden: true
      hint: "Сравниваются последовательности с эталоном для нескольких seed и настроек, остановка на end_id, лимит длины и повторяемость при одинаковом seed."
