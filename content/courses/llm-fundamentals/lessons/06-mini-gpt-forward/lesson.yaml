id: "llm.fundamentals.mini-gpt"
title: "Мини-GPT: прямой проход декодера"
goal: "Собрать прямой проход decoder-only трансформера (эмбеддинги, pre-LN блоки с вниманием и MLP, финальная нормализация, логиты с привязкой весов) и объяснить, откуда берётся число параметров и зачем нужен KV-кэш."
difficulty: "hard"
estimatedMinutes: 100
prerequisites:
  - "llm.fundamentals.attention"
related:
  - "llm.fundamentals.embeddings"
  - "llm.fundamentals.sampling"
  - "llm.fundamentals.bigram-model"
next:
  - "llm.fundamentals.rag-retrieval"
seeAlso:
  - "Обучение весов (обратное распространение, оптимизатор AdamW) - в курс не входит; здесь веса случайные и фиксированные"
  - "Современные варианты (RMSNorm, позиционные кодирования RoPE, группированное внимание) - только текстом, без кода"
objectives:
  - "Описать путь данных GPT от списка id токенов до матрицы логитов и назвать форму массива на каждом шаге."
  - "Реализовать LayerNorm по последней оси со смещённой дисперсией и GELU в tanh-приближении."
  - "Собрать pre-LN блок с остаточными связями и прямой проход модели с привязкой весов."
  - "Объяснить, почему логиты позиции t не зависят от токенов правее и почему при обучении используются все позиции сразу."
  - "Посчитать число параметров по формуле и объяснить, что хранит и почему растёт KV-кэш."
masteryCriteria:
  - "layer_norm даёт среднее около 0 и дисперсию около 1 по каждой строке, а на строке из одинаковых чисел возвращает смещение b без nan и предупреждений."
  - "gelu(0) равна нулю, gelu(-1) около -0.158808, gelu(60) около 60 без предупреждений."
  - "block_forward возвращает вход без изменений, когда w_o, b_o, w_proj и b_proj равны нулю."
  - "forward(ids[:k]) совпадает с forward(ids)[:k] с точностью 1e-10, а результат совпадает с независимым эталоном с точностью 1e-9."
  - "forward бросает ValueError для пустого списка, длины больше max_len и id вне словаря."
tags:
  - "llm"
  - "transformer"
  - "gpt"
  - "layernorm"
  - "kv-cache"
requires:
  packages:
    - "numpy>=2"
accelerator: "none"
facts:
  - kind: "historical"
    text: "Архитектура Transformer была предложена в 2017 году в статье «Attention Is All You Need»; в ней вместо рекуррентных сетей для работы с последовательностями использовалось только внимание. Модели семейства GPT используют только декодерную часть этой архитектуры."
    sources:
      - "https://arxiv.org/abs/1706.03762"
  - kind: "internals"
    text: "В GPT-2 нормализация LayerNorm стоит перед подслоями внимания и MLP, после последнего блока добавлена ещё одна LayerNorm, а матрица выходных логитов использует те же веса, что и таблица входных эмбеддингов."
    sources:
      - "https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf"
  - kind: "internals"
    text: "LayerNorm нормализует признаки каждого токена независимо от остальных токенов и примеров батча, поэтому одинаково работает при обучении и при пошаговой генерации."
    sources:
      - "https://arxiv.org/abs/1607.06450"
  - kind: "internals"
    text: "GELU - гладкая функция активации, взвешивающая вход по значению стандартной нормальной функции распределения; GPT-2 использует её tanh-приближение, формулу которого вы реализуете."
    sources:
      - "https://arxiv.org/abs/1606.08415"
  - kind: "misconception"
    text: "«Модель хранит прошлые ответы, поэтому помнит диалог». Модель без внешней памяти ничего не помнит между запросами: каждый раз ей заново подают весь контекст, а KV-кэш - это временный ускоритель внутри одной генерации, а не память."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "numeric"
      prompt: "Сколько параметров у GPT-подобной модели с V = 100, d = 16, L = 2 блока и max_len = 32 (с привязкой весов, с учётом всех смещений и LayerNorm, формула из урока)?"
      answer: 8704
      tolerance: 0
      explanation: "V*d = 1600, max_len*d = 512, два блока по 12*16^2 + 13*16 = 3280 дают 6560, финальная LayerNorm - 2*16 = 32; сумма 8704. Если посчитать выходную матрицу отдельно (без привязки весов), получится ещё на V*d = 1600 больше - но GPT-2 использует wte повторно."
    - id: "q2"
      type: "single"
      prompt: "Какая запись соответствует блоку GPT-2 (pre-LN)?"
      options:
        - "x = x + attn(ln1(x)); x = x + mlp(ln2(x))"
        - "x = ln1(x + attn(x)); x = ln2(x + mlp(x))"
        - "x = attn(ln1(x)); x = mlp(ln2(x))"
        - "h = ln1(x); x = h + attn(h)"
      answer: 0
      explanation: "В pre-LN нормализуется только вход подслоя, а остаток x идёт дальше без изменений, к нему добавляется поправка. Вторая запись - post-LN оригинального Transformer; третья теряет остаточные связи, а в четвёртой прибавляется нормализованное значение вместо исходного потока."
    - id: "q3"
      type: "single"
      prompt: "Для ids из 6 токенов сравнили forward(ids[:3]) и первые три строки forward(ids). Что получится у корректной реализации?"
      options:
        - "Совпадут: причинная маска не пускает позицию в будущее, а LayerNorm работает отдельно по каждому токену"
        - "Отличатся: полная последовательность даёт больше контекста и меняет ранние позиции"
        - "Совпадут только первые две строки"
        - "Отличатся, потому что позиционные эмбеддинги зависят от длины входа"
      answer: 0
      explanation: "Строка t зависит только от токенов 0..t: внимание смотрит назад, а все остальные операции (эмбеддинги, LayerNorm, MLP) поточечные. Позиция берётся из таблицы по индексу и не зависит от длины входа. Различие означало бы утечку информации из будущего."
    - id: "q4"
      type: "multiple"
      prompt: "Что верно о логитах и выходе модели?"
      options:
        - "Строка t логитов оценивает токен на позиции t + 1"
        - "logits = x @ wte.T использует ту же таблицу, что и входные эмбеддинги"
        - "При обучении полезны все строки логитов, а при генерации обычно нужна только последняя"
        - "LayerNorm усредняет значения по всем токенам последовательности"
      answer:
        - 0
        - 1
        - 2
      explanation: "Первые три утверждения верны: сдвиг на один токен задаёт задачу «предскажи следующий», привязка весов экономит параметры, а причинная маска делает все позиции независимыми обучающими примерами. Четвёртое неверно: LayerNorm усредняет по признакам одного токена (последняя ось), а не по токенам - иначе позиции начали бы влиять друг на друга."
    - id: "q5"
      type: "single"
      prompt: "Что хранится в KV-кэше при генерации?"
      options:
        - "Ключи K и значения V прошлых токенов для каждого слоя и головы"
        - "Запросы Q прошлых токенов"
        - "Готовые ответы на прошлые вопросы"
        - "Только логиты прошлых позиций"
      answer: 0
      explanation: "Новому токену нужны ключи и значения всех прошлых позиций, а они не меняются, поэтому их хранят. Запросы прошлых токенов не нужны: прошлые позиции уже получили свои выходы и пересчитываться не будут. Кэш не хранит ответы или логиты и не является памятью между запросами."
exercise:
  id: "llm.fundamentals.mini-gpt.exercise"
  title: "Прямой проход мини-GPT"
  prompt: |
    В файле `gpt_task.py` уже написаны `init_params` (случайные веса в словаре) и `causal_self_attention` (многоголовое внимание с причинной маской из предыдущего урока). Реализуйте остальное на NumPy; ничего не печатайте.

    Веса: `params["wte"]` формы `(V, d)`, `params["wpe"]` формы `(max_len, d)`, `params["blocks"]` - список словарей с ключами `ln1_g, ln1_b, w_qkv, b_qkv, w_o, b_o, ln2_g, ln2_b, w_fc, b_fc, w_proj, b_proj`, а также `params["lnf_g"]`, `params["lnf_b"]`, `params["n_heads"]`.

    1. `layer_norm(x, g, b, eps=1e-5)` - по последней оси, для каждой строки отдельно: `(x - mean) / sqrt(var + eps) * g + b`, `var` смещённая (деление на `d`).
    2. `gelu(x)` - поэлементно `0.5 * x * (1 + tanh(sqrt(2 / pi) * (x + 0.044715 * x ** 3)))`.
    3. `mlp(x, block)` - `gelu(x @ w_fc + b_fc) @ w_proj + b_proj`.
    4. `block_forward(x, block, n_heads)` - `x = x + attn(ln1(x))`, затем `x = x + mlp(ln2(x))`.
    5. `forward(ids, params)` - логиты формы `(T, V)`: `x = wte[ids] + wpe[:T]`, все блоки, `layer_norm` с `lnf_g`, `lnf_b`, затем `x @ wte.T`. `ValueError`, если `ids` пуст, `T > max_len` или есть id вне `0..V-1`.

    Пример: `forward([1, 5, 2, 7], init_params(13, 8, 2, 2, 10))` возвращает массив формы `(4, 13)`; `forward([1, 5], p)` совпадает с первыми двумя строками этого результата.
  entryFile: "gpt_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Двигайтесь снизу вверх: сначала layer_norm и gelu (их проверяют отдельные тесты), затем mlp, затем блок, и только потом forward. Нормализация и GELU не должны менять форму массива."
    - "layer_norm: среднее и дисперсию считайте по axis=-1 с keepdims=True, чтобы вычитание шло построчно; eps добавляется к дисперсии под корнем. Блок: два присваивания x = x + (...), в каждом подслой получает нормализованный x, а прибавляется к ненормализованному."
    - "forward: сначала проверки (ids.size == 0, длина больше wpe.shape[0], min < 0 или max >= V - ValueError), затем x = wte[ids] + wpe[:T], цикл for block in params[\"blocks\"], финальная layer_norm и x @ wte.T."
    - "Каркас: ids = np.asarray(ids); проверки; x = params[\"wte\"][ids] + params[\"wpe\"][:len(ids)]; for block in params[\"blocks\"]: x = block_forward(x, block, params[\"n_heads\"]); x = layer_norm(x, params[\"lnf_g\"], params[\"lnf_b\"]); return x @ params[\"wte\"].T."
  tests:
    - id: "layer-norm"
      title: "layer_norm: среднее 0 и дисперсия 1 по строке"
      hint: "Проверяется нормализация каждой строки по последней оси, а также применение гейна g и смещения b."
    - id: "gelu-values"
      title: "gelu: значения в нескольких точках"
      hint: "Проверяются значения tanh-приближения GELU в точках от -3 до 2 и gelu(0) == 0."
    - id: "forward-shape"
      title: "forward: форма и тип логитов"
      hint: "Проверяются форма (T, V), тип float64 и конечность значений, в том числе для одного токена."
    - id: "layer-norm-edge"
      title: "layer_norm: края (скрытый)"
      hidden: true
      hint: "Проверяются строка из одинаковых чисел без nan и предупреждений, смещённая дисперсия и массивы с лишними осями."
    - id: "gelu-edge"
      title: "gelu: большие значения (скрытый)"
      hidden: true
      hint: "Проверяются значения около -60 и 60 без предупреждений и поэлементная работа на матрице."
    - id: "mlp-and-block"
      title: "mlp и pre-LN блок (скрытый)"
      hidden: true
      hint: "Проверяются формулы mlp и block_forward на случайных весах побольше, чем у init_params."
    - id: "block-residual"
      title: "Остаточная связь (скрытый)"
      hidden: true
      hint: "Проверяется, что при нулевых выходных матрицах и смещениях блок возвращает вход без изменений."
    - id: "forward-reference"
      title: "forward совпадает с независимым эталоном (скрытый)"
      hidden: true
      hint: "Проверяется равенство логитов эталонной реализации для разных последовательностей и конфигураций."
    - id: "forward-causality"
      title: "Причинность (скрытый)"
      hidden: true
      hint: "Проверяется, что forward(ids[:k]) равна первым k строкам forward(ids) и что замена последнего токена не меняет предыдущие строки."
    - id: "forward-deterministic"
      title: "Детерминированность и неизменность весов (скрытый)"
      hidden: true
      hint: "Проверяется, что повторный вызов даёт тот же результат, а веса модели не изменились."
    - id: "forward-errors"
      title: "Ошибки входа (скрытый)"
      hidden: true
      hint: "Проверяются пустой ввод, длина больше max_len, id вне словаря и допустимые граничные значения."
challenge:
  id: "llm.fundamentals.mini-gpt.challenge"
  title: "KV-кэш: генерация без пересчёта прошлого"
  prompt: |
    В файле `kv_task.py` уже есть все функции упражнения (`layer_norm`, `gelu`, `mlp`, `block_forward`, `forward`) и `init_params`. Реализуйте генерацию с KV-кэшем.

    1. `forward_step(token_id, pos, params, cache=None)` - обработать ОДИН токен на позиции `pos`. `cache` - список по слоям, `cache[l] = {"k": массив (n_heads, t, dh), "v": массив (n_heads, t, dh)}`, где `t` - число уже обработанных токенов (равно `pos`); `None` - пустой кэш. В каждом слое пересчитайте `q, k, v` только для нового токена, допишите `k` и `v` в кэш, посчитайте внимание нового токена ко всем закэшированным позициям (маска не нужна: в кэше только прошлое и сам токен), затем остальное как в блоке. Верните `(logits, cache)`, где `logits` формы `(V,)`, а `cache` обновлён (после шага `t = pos + 1`). `ValueError`, если `pos` вне `0..max_len-1` или `token_id` вне словаря.
    2. `generate_greedy(prompt_ids, params, n_new)` - прогнать промпт через `forward_step` по одному токену, затем `n_new` раз выбрать `argmax` логитов последней позиции и подать новый токен следующим шагом. Вернуть список из `n_new` новых id (`int`). `ValueError`: пустой промпт, `n_new < 0`, `len(prompt_ids) + n_new > max_len`.

    Тесты сравнивают логиты каждого шага с полным `forward` (допуск 1e-9) и результат `generate_greedy` с жадной генерацией, которая каждый раз пересчитывает весь `forward`.
  entryFile: "kv_task.py"
  starter: "challenge/starter"
  solution: "challenge/solution"
  evaluation: "harness"
  harness: "challenge/harness"
  harnessEntry: "check.py"
  hints:
    - "Для одного токена x имеет форму (d,): LayerNorm, MLP и умножение на матрицы работают и для одномерного массива. Для внимания разберите qkv на q, k, v (np.split по последней оси) и приведите к виду (n_heads, dh)."
    - "Кэш слоя обновляется конкатенацией по оси времени: layer[\"k\"] = np.concatenate([layer[\"k\"], k.reshape(n_heads, 1, dh)], axis=1). При cache=None создайте для каждого слоя массивы формы (n_heads, 0, dh)."
    - "Внимание нового токена: scores = np.einsum(\"hd,htd->ht\", q, layer[\"k\"]) / np.sqrt(dh); softmax по последней оси; out = np.einsum(\"ht,htd->hd\", weights, layer[\"v\"]).reshape(d); затем x = x + out @ w_o + b_o и MLP-часть блока."
    - "generate_greedy: цикл по токенам промпта с forward_step(token, pos, params, cache), затем n_new раз: nxt = int(np.argmax(logits)); добавьте в ответ; если шаги ещё нужны, logits, cache = forward_step(nxt, позиция, params, cache). Последний сгенерированный токен подавать в модель не нужно."
  tests:
    - id: "step-logits"
      title: "Логиты шагов совпадают с полным forward"
      hint: "Проверяются логиты каждого шага по сравнению с эталонным полным проходом."
    - id: "cache-shapes"
      title: "Формы кэша растут"
      hint: "Проверяются число слоёв кэша и формы k и v после каждого шага."
    - id: "generate-basic"
      title: "Жадная генерация с кэшем"
      hint: "Проверяется, что результат совпадает с генерацией, которая пересчитывает полный проход на каждом шаге."
    - id: "cache-prefix-stable"
      title: "Прошлое в кэше не меняется (скрытый)"
      hidden: true
      hint: "Проверяется, что новый шаг только дописывает в кэш, а ранее записанные k и v остаются прежними."
    - id: "step-errors"
      title: "Ошибки forward_step (скрытый)"
      hidden: true
      hint: "Проверяются pos вне диапазона, id вне словаря и допустимые граничные значения."
    - id: "fresh-cache"
      title: "Пустой кэш по умолчанию (скрытый)"
      hidden: true
      hint: "Проверяется, что cache=None начинает с пустого кэша и состояние не хранится между вызовами."
    - id: "generate-edges"
      title: "Края generate_greedy (скрытый)"
      hidden: true
      hint: "Проверяются n_new = 0, промпт из одного токена, предельная длина и ошибки входа."
    - id: "generate-long"
      title: "Длинная генерация на трёх слоях (скрытый)"
      hidden: true
      hint: "Проверяется совпадение генерации с кэшем и без него на более глубокой модели."
