id: "llm.fundamentals.tokenization"
title: "Токенизация: байтовый BPE с нуля"
goal: "Реализовать байтовый BPE-токенизатор (обучение слияний, кодирование и декодирование без потерь) и объяснить, почему число токенов зависит от языка и данных обучения."
difficulty: "medium"
estimatedMinutes: 80
prerequisites:
  - "python.fundamentals.dicts-and-sets"
  - "python.fundamentals.strings"
related:
  - "llm.fundamentals.embeddings"
next:
  - "llm.fundamentals.embeddings"
seeAlso:
  - "Предварительное разбиение регулярным выражением, WordPiece и Unigram (SentencePiece) - только текстом в разделе «Как это устроено в библиотеках»"
objectives:
  - "Объяснить, почему LLM работают с подсловами, а не с буквами или словами, и почему базовый словарь байтового BPE - 256 байтов UTF-8."
  - "Посчитать частоты соседних пар и выполнить слияние слева направо без перекрытий."
  - "Обучить словарь слияний с зафиксированным правилом ничьих и порогом частоты."
  - "Закодировать новый текст, применяя слияния в порядке обучения, и декодировать id обратно с errors=\"replace\"."
  - "Объяснить, почему один и тот же текст на русском и английском занимает разное число токенов."
masteryCriteria:
  - "merge заменяет пару слева направо без перекрытий и не меняет входной список."
  - "train на 'aaabdaaabac' с vocab_size 259 даёт ровно слияния {(97, 97): 256, (256, 97): 257, (257, 98): 258}, останавливается на парах с частотой меньше 2 и бросает ValueError при vocab_size < 256."
  - "encode применяет слияния по возрастанию id, а decode(encode(text)) == text для кириллицы, эмодзи, пустой строки и переводов строки."
  - "decode неполного символа UTF-8 возвращает U+FFFD, а не бросает исключение."
tags:
  - "llm"
  - "tokenization"
  - "bpe"
  - "utf-8"
facts:
  - kind: "historical"
    text: "BPE пришёл в нейросетевую обработку языка из сжатия данных: Sennrich, Haddow и Birch в 2015-2016 годах применили слияние частых пар к словам для машинного перевода, чтобы модель могла переводить редкие и новые слова по кусочкам."
    sources:
      - "https://arxiv.org/abs/1508.07909"
  - kind: "internals"
    text: "В GPT-2 BPE применяется к байтам UTF-8, а не к символам Unicode: так базовый словарь состоит из 256 элементов и любой текст кодируется без неизвестного токена."
    sources:
      - "https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf"
  - kind: "real-world"
    text: "Библиотека tiktoken - быстрый BPE-токенизатор, который используется с моделями OpenAI; цены и лимиты контекста API считаются в токенах этого токенизатора."
    sources:
      - "https://github.com/openai/tiktoken"
  - kind: "misconception"
    text: "«Один токен - это одно слово». Частое английское слово часто действительно один токен, но редкие слова, числа и текст на других языках делятся на несколько токенов; русская буква - уже два байта."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "numeric"
      prompt: "Сколько токенов будет у строки «кот» в байтовом BPE до первого слияния (только базовый словарь из 256 байтов)?"
      answer: 6
      tolerance: 0
      explanation: "Каждая буква кириллицы занимает в UTF-8 два байта, а до слияний каждый байт - отдельный токен: 3 * 2 = 6. Ответ 3 - это число символов, а модель видит байты."
    - id: "q2"
      type: "single"
      prompt: "Во что превращается [5, 5, 5] после merge с парой (5, 5) и new_id = 9?"
      options:
        - "[9, 5]"
        - "[9, 9]"
        - "[5, 9]"
        - "[9]"
      answer: 0
      explanation: "Замена идёт слева направо без перекрытий: первые два элемента становятся 9, оставшийся 5 пары не образует. [9, 9] получилось бы, если бы один элемент участвовал в двух слияниях."
    - id: "q3"
      type: "single"
      prompt: "Выучены слияния {(98, 99): 256, (97, 98): 257}. Что вернёт encode(\"abc\") (байты 97, 98, 99)?"
      options:
        - "[97, 256]"
        - "[257, 99]"
        - "[97, 98, 99]"
        - "[256, 257]"
      answer: 0
      explanation: "Сначала применяется слияние с наименьшим id (выученное раньше) - (98, 99) -> 256. После него пары (97, 98) больше нет. [257, 99] получится, если сливать первую подходящую пару слева, игнорируя порядок обучения."
    - id: "q4"
      type: "multiple"
      prompt: "Что верно о байтовом BPE?"
      options:
        - "Любую строку можно закодировать без неизвестного токена"
        - "decode(encode(text)) возвращает исходный текст"
        - "Отдельный токен всегда соответствует целому символу Unicode"
        - "Число токенов одного текста зависит от данных, на которых обучали токенизатор"
      answer:
        - 0
        - 1
        - 3
      explanation: "Токен может быть половиной буквы (например, байт 0xD0), поэтому декодирование произвольных id делают с errors=\"replace\". Остальные утверждения верны: базовый словарь покрывает все байты, BPE без потерь, а слияния выучиваются на конкретных данных."
    - id: "q5"
      type: "single"
      prompt: "Почему русский текст у многих моделей занимает больше токенов, чем английский того же смысла?"
      options:
        - "Буква кириллицы - два байта, а слияний для русского в словаре меньше, потому что в данных токенизатора русского текста было меньше"
        - "Модели добавляют служебные токены перед каждым русским словом"
        - "Кириллица не поддерживается и кодируется как неизвестный токен"
        - "Русские слова в среднем длиннее, и это единственная причина"
      answer: 0
      explanation: "Неизвестных токенов в байтовом BPE нет. Главное - словарь: частые английские слова стали одним токеном, а русские собираются из нескольких кусков, начиная с двух байтов на букву."
exercise:
  id: "llm.fundamentals.tokenization.exercise"
  title: "Байтовый BPE-токенизатор"
  prompt: |
    В файле `bpe_task.py` функция `get_stats` уже написана. Реализуйте остальное, используя только стандартную библиотеку; ничего не печатайте.

    1. `merge(ids, pair, new_id)` - новый список, где каждое вхождение пары `pair` заменено на `new_id`, слева направо без перекрытий. Входной список не менять.
    2. `train(text, vocab_size)` - словарь слияний `{(a, b): new_id}` в порядке обучения, `new_id = 256, 257, ...`. Начните с `list(text.encode("utf-8"))`; на каждом шаге выбирайте `max(stats, key=stats.get)` (при ничьей - пара, встретившаяся раньше). Остановитесь, когда словарь достиг `vocab_size`, пар не осталось или самая частая пара встречается меньше 2 раз. При `vocab_size < 256` бросьте `ValueError`.
    3. `encode(text, merges)` - байты UTF-8, затем повторять слияние той присутствующей пары, у которой `merges[pair]` наименьший, пока ни одна пара не входит в `merges`.
    4. `decode(ids, merges)` - развернуть id в байты (`0..255` - один байт, слияние - склейка байтов двух частей) и декодировать UTF-8 с `errors="replace"`.

    Пример: `train("aaabdaaabac", 259)` возвращает `{(97, 97): 256, (256, 97): 257, (257, 98): 258}`, а `encode("aaabdaaabac", ...)` - `[258, 100, 258, 97, 99]`.
  entryFile: "bpe_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "merge - цикл while по индексу i: если ids[i], ids[i + 1] образуют пару, добавьте new_id и сдвиньтесь на 2, иначе добавьте ids[i] и сдвиньтесь на 1."
    - "train: в цикле for new_id in range(256, vocab_size) посчитайте stats = get_stats(ids); если stats пуст или максимум меньше 2 - break; иначе pair = max(stats, key=stats.get), ids = merge(...), merges[pair] = new_id."
    - "encode: пока len(ids) >= 2, найдите pair = min(stats, key=lambda p: merges.get(p, float(\"inf\"))); если pair нет в merges - выходите, иначе сливайте её."
    - "decode: vocab = {i: bytes([i]) for i in range(256)}, затем по merges.items() в порядке обучения vocab[idx] = vocab[a] + vocab[b]; ответ - b\"\".join(vocab[i] for i in ids).decode(\"utf-8\", errors=\"replace\")."
  tests:
    - id: "merge-basic"
      title: "merge: замена пары"
      hint: "Проверяется замена каждого вхождения пары и то, что входной список не изменился."
    - id: "train-classic"
      title: "train и encode на 'aaabdaaabac'"
      hint: "Проверяются слияния и правило ничьих: при равной частоте выигрывает пара, встретившаяся раньше."
    - id: "roundtrip-basic"
      title: "Кодирование без потерь и сжатие"
      hint: "Проверяется decode(encode(text)) == text на обучающем тексте и то, что токенов заметно меньше, чем байтов."
    - id: "merge-overlap"
      title: "Перекрывающиеся пары (скрытый)"
      hidden: true
      hint: "Проверяются последовательности вроде [5, 5, 5], пустой список и список из одного элемента."
    - id: "train-stops"
      title: "Остановка обучения и ошибки (скрытый)"
      hidden: true
      hint: "Проверяются vocab_size < 256, тексты без повторяющихся пар, пустой текст и порог частоты 2."
    - id: "train-cyrillic"
      title: "Обучение на русском тексте (скрытый)"
      hidden: true
      hint: "Проверяется, что первое слияние склеивает байты одной буквы и decode нового токена возвращает её."
    - id: "encode-priority"
      title: "Порядок применения слияний (скрытый)"
      hidden: true
      hint: "Проверяется, что encode применяет слияния по возрастанию id, а не первую пару слева."
    - id: "roundtrip-unicode"
      title: "Кириллица, эмодзи, пустая строка (скрытый)"
      hidden: true
      hint: "Проверяется decode(encode(text)) == text для текстов, которых не было в обучении."
    - id: "decode-partial"
      title: "Неполный символ и вложенные слияния (скрытый)"
      hidden: true
      hint: "Проверяется декодирование отдельного байта 0xD0 и токена, собранного из другого слияния."
