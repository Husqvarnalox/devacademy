id: "llm.fundamentals.embeddings"
title: "Эмбеддинги и косинусное сходство"
goal: "Реализовать выборку эмбеддингов по номерам токенов, L2-нормировку, матрицу косинусных сходств, поиск ближайших соседей и усреднение векторов по маске паддинга и объяснить, почему векторный поиск использует нормированные векторы."
difficulty: "medium"
estimatedMinutes: 80
prerequisites:
  - "llm.fundamentals.tokenization"
  - "python.numpy.linear-algebra"
related:
  - "llm.fundamentals.tokenization"
  - "llm.fundamentals.attention"
next:
  - "llm.fundamentals.bigram-model"
seeAlso:
  - "Приближённый поиск ближайших соседей (ANN-индексы) - запланирован в уроке про поиск для RAG, пока описан текстом"
objectives:
  - "Объяснить, что эмбеддинг токена - строка выучиваемой матрицы E формы (V, d), и показать, что E[ids] совпадает с one_hot @ E."
  - "Различать скалярное произведение и косинусное сходство и объяснить, почему после L2-нормировки они совпадают."
  - "Реализовать L2-нормировку и матрицу косинусов без nan и предупреждений на нулевых векторах."
  - "Найти k ближайших строк матрицы с детерминированным правилом ничьих."
  - "Получить вектор предложения усреднением по маске и объяснить, почему паддинг нельзя включать в среднее."
masteryCriteria:
  - "lookup возвращает float64-копию строк E по списку id и бросает ValueError для id < 0 и id >= V."
  - "l2_normalize оставляет строки с нормой меньше eps нулевыми без RuntimeWarning, а cosine_matrix даёт значения в [-1, 1], не зависит от масштаба и равна 0 для нулевого вектора."
  - "top_k возвращает int64-индексы по убыванию косинуса, при ничьей - меньший индекс, при k > n все строки, при k <= 0 пустой массив."
  - "mean_pool усредняет только позиции с маской 1, не зависит от значений в паддинге (в том числе nan) и даёт нули при полностью нулевой маске."
tags:
  - "llm"
  - "embeddings"
  - "cosine-similarity"
  - "numpy"
requires:
  packages:
    - "numpy>=2"
accelerator: "none"
facts:
  - kind: "historical"
    text: "В 2013 году Миколов и соавторы показали, что векторы слов, обученные предсказывать соседние слова в тексте, кодируют отношения между словами: разность векторов king и man, добавленная к вектору woman, оказывается близка к вектору queen."
    sources:
      - "https://arxiv.org/abs/1301.3781"
  - kind: "internals"
    text: "Sentence-BERT получает вектор предложения из выходных векторов токенов предобученной модели; по умолчанию используется усреднение по токенам, а предложения затем сравниваются косинусным сходством."
    sources:
      - "https://arxiv.org/abs/1908.10084"
  - kind: "real-world"
    text: "Векторные базы данных и библиотеки поиска обычно хранят нормированные векторы или считают косинус: после нормировки сходство сводится к скалярному произведению, то есть к одному матричному умножению для всего запроса."
  - kind: "misconception"
    text: "«Эмбеддинг слова - это его значение». Вектор токена - выученное числовое представление, которое отражает, в каких контекстах токен встречался в данных; у слова с несколькими смыслами один вектор токена смешивает их, а различать смыслы начинают следующие слои модели."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "numeric"
      prompt: "Сколько чисел содержит матрица эмбеддингов при размере словаря V = 50000 и размерности d = 768?"
      answer: 38400000
      tolerance: 0
      explanation: "Матрица имеет форму (V, d), то есть V * d = 50000 * 768 = 38 400 000 чисел. Ответ 50768 получится, если складывать размеры вместо перемножения: в таблице у каждого токена свой вектор из d чисел."
    - id: "q2"
      type: "single"
      prompt: "Для a = [1, 1], b = [10, 0] и c = [1, 2]: какой вектор ближе к a по косинусу и по скалярному произведению?"
      options:
        - "b и по косинусу, и по скалярному произведению"
        - "По косинусу c (0.95 против 0.71), по скалярному произведению b (10 против 3)"
        - "c и по косинусу, и по скалярному произведению"
        - "По косинусу b, по скалярному произведению c"
      answer: 1
      explanation: "Косинус сравнивает только направление: у c угол с a меньше, чем у b. Скалярное произведение растёт ещё и с длиной, а вектор b длиннее в десять раз, поэтому он выигрывает 10 против 3. Поэтому для сходства по смыслу сравнивают нормированные векторы."
    - id: "q3"
      type: "single"
      prompt: "Матрица E имеет 4 строки. Что вернёт E[[-1]] в NumPy без проверки границ?"
      options:
        - "Ошибку IndexError"
        - "Последнюю строку E"
        - "Нулевой вектор"
        - "Первую строку E"
      answer: 1
      explanation: "Отрицательные индексы NumPy отсчитывает с конца, поэтому -1 - это последняя строка, и ошибки нет. Именно поэтому lookup проверяет 0 <= id < V явно: неверный номер токена иначе молча получил бы чужой вектор."
    - id: "q4"
      type: "multiple"
      prompt: "Что верно об эмбеддингах и сходстве?"
      options:
        - "После L2-нормировки скалярное произведение двух векторов равно их косинусу"
        - "Среднее по всем позициям, включая паддинг, равно среднему по маске"
        - "Косинус не меняется, если один из векторов умножить на 5"
        - "Нулевой вектор при нормировке нужно обрабатывать отдельно, иначе получится nan"
      answer:
        - 0
        - 2
        - 3
      explanation: "Верны первое, третье и четвёртое: нормировка убирает длину, умножение на положительное число длину и меняет, а деление нулевого вектора на его норму 0 / 0 даёт nan. Второе неверно: паддинг входит в сумму и в знаменатель, и вектор предложения зависит от того, до какой длины его дополнили."
    - id: "q5"
      type: "single"
      prompt: "Почему выборку эмбеддинга делают как E[id], а не как one_hot @ E, хотя результат одинаков?"
      options:
        - "Результат на самом деле разный, one-hot даёт округления"
        - "Выборка стоит O(d) на токен, умножение на one-hot - O(V * d), хотя почти все слагаемые нулевые"
        - "Умножение на one-hot нельзя обучать градиентным спуском"
        - "one_hot @ E работает только для V меньше d"
      answer: 1
      explanation: "Математически это одна и та же операция, и именно поэтому слой эмбеддинга обучается как обычный линейный слой. Но умножение тратит V * d операций, перемножая нули. Утверждение про невозможность обучения неверно: градиент через выборку считается так же, как через умножение."
exercise:
  id: "llm.fundamentals.embeddings.exercise"
  title: "Эмбеддинги, косинус и усреднение по маске"
  prompt: |
    В файле `embed_task.py` реализуйте пять функций на NumPy. Ничего не печатайте.

    1. `lookup(E, ids)` - строки матрицы `E` формы `(V, d)` по списку номеров `ids`: массив `float64` формы `(len(ids), d)`, который является копией. Если какой-либо id `< 0` или `>= V`, бросьте `ValueError` (отрицательные индексы NumPy молча считали бы с конца).
    2. `l2_normalize(X, eps=1e-12)` - поделить каждую строку на её евклидову норму; работает и для 1-D вектора. Строки с нормой меньше `eps` остаются нулевыми, без `nan` и предупреждений.
    3. `cosine_matrix(A, B)` - матрица `(n, m)` косинусных сходств между строками `A` `(n, d)` и `B` `(m, d)`, значения обрезаны до `[-1, 1]`. Сходство с нулевым вектором равно 0.
    4. `top_k(query, M, k)` - `int64`-индексы `k` строк `M`, самых похожих на 1-D `query` по косинусу, по убыванию сходства. При равных сходствах раньше идёт меньший индекс (`np.argsort(-sims, kind="stable")`). Если `k > n`, вернуть все `n` строк; если `k <= 0` - пустой массив.
    5. `mean_pool(H, mask)` - `H` формы `(B, T, d)`, `mask` формы `(B, T)` из 0 и 1: массив `(B, d)` со средним по позициям, где `mask == 1`. Строка с нулевой маской даёт нули без предупреждений; значения `H` на позициях с маской 0 не должны влиять на результат.

    Пример: `l2_normalize(np.array([[3.0, 4.0], [0.0, 0.0]]))` возвращает `[[0.6, 0.8], [0.0, 0.0]]`; `top_k(np.array([1.0, 0.2]), np.array([[1, 0], [0, 1], [1, 1], [-1, 0]]), 2)` возвращает `[0, 2]`; для `H` из двух позиций `[[1, 2], [5, 6]]` и `mask = [[1, 0]]` результат `mean_pool` равен `[[1, 2]]`.
  entryFile: "embed_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Все пять функций сводятся к нескольким операциям NumPy: выборка строк по индексам, норма вдоль последней оси, одно матричное умножение и сумма по оси позиций. Циклы по строкам не нужны."
    - "l2_normalize: np.linalg.norm(X, axis=-1, keepdims=True) даёт нормы формы (n, 1); чтобы не делить на ноль, подставьте 1.0 вместо маленьких норм (np.where) и обнулите такие строки в результате. cosine_matrix строится на l2_normalize и матричном произведении, затем np.clip."
    - "top_k: посчитайте сходства через cosine_matrix(query[None, :], M)[0], отсортируйте np.argsort(-sims, kind=\"stable\") и возьмите первые k; k <= 0 обработайте отдельно. mean_pool: np.where(mask[:, :, None] != 0, H, 0.0).sum(axis=1) делится на число единиц в строке маски, но не меньше 1."
    - "lookup: ids = np.asarray(ids, dtype=np.int64); если ids.size и (ids.min() < 0 or ids.max() >= E.shape[0]) - ValueError; ответ E[ids].copy() с приведением к float64. mean_pool: counts = (mask != 0).sum(axis=1, keepdims=True); summed / np.maximum(counts, 1)."
  tests:
    - id: "lookup-basic"
      title: "lookup: выборка строк и копия"
      hint: "Проверяются форма и dtype результата, строки по списку id с повторами, то, что результат - копия, и пустой список id."
    - id: "cosine-basic"
      title: "l2_normalize и cosine_matrix"
      hint: "Проверяются нормировка строк и 1-D вектора и значения матрицы косинусов на маленьких векторах."
    - id: "top-k-basic"
      title: "top_k: ближайшие соседи"
      hint: "Проверяются порядок индексов по убыванию косинуса, тип int64 и случай k = n."
    - id: "lookup-errors"
      title: "lookup: id вне диапазона (скрытый)"
      hidden: true
      hint: "Проверяется ValueError для id, равного V, отрицательных id и для списка, где неверен только один элемент."
    - id: "normalize-zero"
      title: "Нулевые векторы и порог eps (скрытый)"
      hidden: true
      hint: "Проверяются нулевые строки и 1-D вектор без nan и RuntimeWarning, параметр eps и неизменность входного массива."
    - id: "cosine-edge"
      title: "Косинус: масштаб, знак, нули (скрытый)"
      hidden: true
      hint: "Проверяются сравнение с эталоном на случайных матрицах, инвариантность к масштабу, смена знака, нулевые строки в A и в B и значение вектора с самим собой."
    - id: "top-k-ties"
      title: "top_k: ничьи (скрытый)"
      hidden: true
      hint: "Проверяются равные косинусы у сонаправленных векторов разной длины и нулевой запрос."
    - id: "top-k-bounds"
      title: "top_k: k больше n и k <= 0 (скрытый)"
      hidden: true
      hint: "Проверяются k больше числа строк, k = 0, отрицательное k, dtype int64 и матрица без строк."
    - id: "mean-pool"
      title: "mean_pool: маска (скрытый)"
      hidden: true
      hint: "Проверяются среднее по позициям с маской 1, маска типа bool и маска с единицами не только в начале."
    - id: "mean-pool-padding"
      title: "mean_pool: паддинг и пустая маска (скрытый)"
      hidden: true
      hint: "Проверяются нулевая маска без nan и предупреждений и независимость результата от значений в паддинге, включая nan."
