id: "llm.fundamentals.bigram-model"
title: "Языковая модель: биграммы, кросс-энтропия и перплексия"
goal: "Построить символьную биграммную языковую модель по счётчикам со сглаживанием и оценить её средней кросс-энтропией и перплексией, объяснив, что та же цель обучает настоящие LLM."
difficulty: "medium"
estimatedMinutes: 80
prerequisites:
  - "llm.fundamentals.tokenization"
  - "ml.numpy.logistic-regression"
related:
  - "llm.fundamentals.embeddings"
  - "llm.fundamentals.sampling"
next:
  - "llm.fundamentals.sampling"
seeAlso:
  - "Более тонкие методы сглаживания (Кнесера-Нея) и n-граммы длиннее двух - только текстом в разделе «Как это устроено в библиотеках»"
objectives:
  - "Сформулировать языковую модель как распределение следующего токена при заданном контексте и объяснить роль токена-границы."
  - "Посчитать матрицу счётчиков биграмм и превратить её в матрицу вероятностей со сглаживанием."
  - "Вычислить среднюю кросс-энтропию (NLL) и перплексию, обработав нулевые вероятности без предупреждений."
  - "Объяснить, почему перплексия равномерной модели равна размеру словаря и почему сглаживание улучшает оценку на новых данных."
  - "Объяснить, почему таблица счётчиков не масштабируется на длинные контексты и чем её заменяет нейросеть."
masteryCriteria:
  - "build_vocab возвращает ['<s>'] и отсортированные символы, encode_text добавляет границу 0 с двух сторон и называет неизвестный символ в ValueError."
  - "count_bigrams возвращает int64-матрицу (V, V) с границами; сумма счётчиков равна числу переходов, то есть сумме len(текст) + 1."
  - "probs_from_counts даёт строки с суммой 1, при alpha=0 нулевая строка становится равномерной 1/V без предупреждений."
  - "avg_nll возвращает inf без RuntimeWarning, если есть нулевая вероятность, и бросает ValueError на пустом списке текстов; perplexity равномерной модели равна V."
tags:
  - "llm"
  - "language-model"
  - "bigram"
  - "cross-entropy"
  - "perplexity"
  - "numpy"
requires:
  packages:
    - "numpy>=2"
accelerator: "none"
facts:
  - kind: "historical"
    text: "В 2003 году Бенджио и соавторы предложили нейросетевую языковую модель: векторы предыдущих слов обучаются вместе с сетью, а на выходе стоит распределение по словарю. Модель обошла счётчиковые n-граммы, потому что похожие слова и контексты получают общие параметры."
    sources:
      - "https://www.jmlr.org/papers/volume3/bengio03a/bengio03a.pdf"
  - kind: "real-world"
    text: "Потери при обучении языковой модели - это средняя кросс-энтропия следующего токена; перплексия на отложенном тексте остаётся стандартной метрикой для сравнения моделей с одним и тем же токенизатором."
  - kind: "misconception"
    text: "«Низкая перплексия означает хорошую модель». Перплексия показывает, насколько модель предсказывает данный текст; значения нельзя сравнивать между разными токенизаторами и данными, а на обучающем тексте она оптимистична и ничего не говорит об ответах на вопросы."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "numeric"
      prompt: "Какова перплексия равномерной модели над словарём из 27 токенов (26 букв и граница)?"
      answer: 27
      tolerance: 0.000001
      explanation: "Равномерная модель ставит каждому токену вероятность 1/27, поэтому NLL = ln 27 на любом тексте, а перплексия exp(ln 27) = 27. Ответ 26 был бы верен только если бы граница не входила в словарь."
    - id: "q2"
      type: "numeric"
      prompt: "Модель присвоила правильным токенам вероятности 1/2, 1/2, 1/8 и 1/8. Чему равна перплексия на этих четырёх позициях?"
      answer: 4
      tolerance: 0.001
      explanation: "NLL = (ln 2 + ln 2 + 3 ln 2 + 3 ln 2) / 4 = 2 ln 2, перплексия exp(2 ln 2) = 4. Ответ 1/2 * 1/2 * 1/8 * 1/8 не подходит: перплексия - это обратная величина к среднему геометрическому вероятностей, а не их произведение."
    - id: "q3"
      type: "single"
      prompt: "При alpha = 0 в тестовом тексте есть пара символов, которой не было в обучении. Что вернёт avg_nll?"
      options:
        - "Большое, но конечное число"
        - "inf, потому что -ln 0 бесконечно"
        - "0, потому что пара не встречалась"
        - "nan, потому что строка не нормируется"
      answer: 1
      explanation: "Вероятность такой пары в обученной таблице равна 0, а -ln 0 уходит в плюс бесконечность. Модель утверждает, что событие невозможно, а оно случилось. nan возникает только если делить нулевую строку на её сумму; именно поэтому такой строке задают равномерное распределение."
    - id: "q4"
      type: "multiple"
      prompt: "Что верно о биграммной модели и её оценке?"
      options:
        - "Сумма вероятностей в каждой строке P равна 1"
        - "Для текста длины L в NLL входит L переходов"
        - "Сглаживание с alpha > 0 отдаёт часть вероятности парам, которых не было в обучении"
        - "NLL на обучающих данных хорошо оценивает качество на новых текстах"
      answer:
        - 0
        - 2
      explanation: "Строки P - распределения, и сглаживание действительно перераспределяет массу на невидимые пары. Переходов L + 1, потому что считаются и начало, и конец (<s> -> первый символ и последний символ -> <s>). Оценка на обучающих данных оптимистична: модель подогнана под те же счётчики."
    - id: "q5"
      type: "single"
      prompt: "Как связана биграммная модель с обучением настоящих LLM?"
      options:
        - "Никак: LLM обучаются на классификации предложений"
        - "LLM минимизируют ту же кросс-энтропию следующего токена, но вероятности выдаёт нейросеть, которая учитывает весь предыдущий контекст"
        - "LLM хранят таблицу счётчиков V x V для каждого слоя"
        - "LLM минимизируют перплексию, но не кросс-энтропию"
      answer: 1
      explanation: "Цель та же: средний -ln P(следующий токен | контекст); таблицу счётчиков заменяет сеть, потому что таблица на длинный контекст имела бы V^n строк. Перплексия - экспонента от этой кросс-энтропии, поэтому минимизировать одно - значит минимизировать другое."
exercise:
  id: "llm.fundamentals.bigram-model.exercise"
  title: "Биграммная модель, NLL и перплексия"
  prompt: |
    В файле `bigram_task.py` реализуйте шесть функций (NumPy и стандартная библиотека; ничего не печатайте). Токен-граница `"<s>"` имеет индекс 0 и служит и началом, и концом текста.

    1. `build_vocab(texts)` - список `["<s>"] + sorted(set всех символов всех текстов)`.
    2. `encode_text(text, stoi)` - `[0] + [stoi[c] for c in text] + [0]`. Символ, которого нет в `stoi`, - `ValueError`, в сообщении которого назван этот символ.
    3. `count_bigrams(texts, stoi)` - матрица `int64` формы `(V, V)`, `C[a, b]` = сколько раз `b` идёт сразу после `a` (переходы с границами включены).
    4. `probs_from_counts(C, alpha=1.0)` - матрица `float64`, строки `(C + alpha) / сумма строки`. Строка с суммой 0 (возможна при `alpha=0`) становится равномерной `1/V`; предупреждений быть не должно.
    5. `avg_nll(P, texts, stoi)` - среднее значение `-ln P[a, b]` по всем переходам всех текстов, включая последний переход в `<s>`; тип - `float`. Если какая-то вероятность равна 0, вернуть `float("inf")` без `RuntimeWarning`. Пустой список `texts` - `ValueError`.
    6. `perplexity(P, texts, stoi)` - `exp(avg_nll(...))`; бесконечность остаётся бесконечностью.

    Пример: `build_vocab(["аба", "аа"])` даёт `["<s>", "а", "б"]`. Для `stoi = {"<s>": 0, "а": 1, "б": 2}` функция `count_bigrams(["аба", "аа"], stoi)` возвращает `[[0, 2, 0], [2, 1, 1], [0, 1, 0]]`. Для текста `"аа"` над словарём `{"<s>": 0, "а": 1}` без сглаживания `P = [[0, 1], [0.5, 0.5]]`, `avg_nll = 2 * ln 2 / 3`, перплексия равна `2 ** (2 / 3)`.
  entryFile: "bigram_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Все функции строятся на одном шаге: превратить текст в последовательность id с границами и пройти по соседним парам. Поэтому encode_text удобно использовать внутри count_bigrams и avg_nll."
    - "Пары соседних id даёт zip(ids, ids[1:]). count_bigrams увеличивает C[a, b] на каждой паре. probs_from_counts: S = C + alpha, затем деление на S.sum(axis=1, keepdims=True); для строк с нулевой суммой подставьте 1 / V."
    - "Чтобы не делить на 0, заранее посчитайте empty = sums == 0 и делите на np.where(empty, 1.0, sums), а затем верните np.where(empty, 1.0 / V, результат). В avg_nll соберите вероятности P[a, b] по всем переходам в массив; если np.any(probs <= 0), верните float(\"inf\"), иначе -np.log(probs).mean()."
    - "perplexity = math.exp(avg_nll(P, texts, stoi)); math.exp(float(\"inf\")) возвращает inf без ошибки. Для пустого texts проверьте len(texts) == 0 до вычислений и бросьте ValueError."
  tests:
    - id: "vocab-encode"
      title: "build_vocab и encode_text"
      hint: "Проверяются порядок словаря, границы в закодированной строке и пустая строка."
    - id: "count-bigrams"
      title: "Счётчики биграмм"
      hint: "Проверяется матрица счётчиков на маленьком примере с повторяющимися символами и границами."
    - id: "probs-perplexity"
      title: "Вероятности, NLL и перплексия"
      hint: "Проверяются нормировка со сглаживанием и без него и значения avg_nll и perplexity на тексте из двух символов."
    - id: "encode-errors"
      title: "Неизвестный символ (скрытый)"
      hidden: true
      hint: "Проверяется ValueError с названием символа в encode_text и в count_bigrams."
    - id: "counts-dtype"
      title: "Тип и суммы счётчиков (скрытый)"
      hidden: true
      hint: "Проверяются dtype int64, форма, сравнение с эталоном на списке имён и суммы по строке и столбцу границы."
    - id: "probs-rows"
      title: "Строки P суммируются в 1 (скрытый)"
      hidden: true
      hint: "Проверяются суммы строк, dtype, формула со сглаживанием и положительность вероятностей при alpha > 0."
    - id: "probs-zero-row"
      title: "Нулевая строка при alpha=0 (скрытый)"
      hidden: true
      hint: "Проверяется равномерная строка вместо nan без предупреждений и то, что входная матрица не изменяется."
    - id: "nll-inf"
      title: "Нулевая вероятность даёт inf (скрытый)"
      hidden: true
      hint: "Проверяются inf у avg_nll и perplexity без RuntimeWarning и конечное значение, когда нулей нет."
    - id: "nll-empty"
      title: "Пустой список текстов (скрытый)"
      hidden: true
      hint: "Проверяется ValueError для пустого списка текстов и значение для списка из одной пустой строки."
    - id: "perplexity-uniform"
      title: "Равномерная модель (скрытый)"
      hidden: true
      hint: "Проверяется, что перплексия равномерной модели равна размеру словаря."
    - id: "smoothing"
      title: "Сглаживание на новых данных (скрытый)"
      hidden: true
      hint: "Проверяются inf без сглаживания, значения со сглаживанием при нескольких alpha и сравнение с эталоном."
