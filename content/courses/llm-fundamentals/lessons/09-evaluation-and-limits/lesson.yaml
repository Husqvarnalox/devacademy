id: "llm.fundamentals.evaluation"
title: "Оценка ответов и ограничения LLM"
goal: "Реализовать набор для оценки ответов - нормализацию, Exact Match, token F1, проверку ссылок на источники и бутстрэп-интервал - и объяснить, чего эти метрики не видят: перефразировок, галлюцинаций, смещений судьи-модели и утечки тестовых данных."
difficulty: "medium"
estimatedMinutes: 80
prerequisites:
  - "llm.fundamentals.rag-retrieval"
  - "llm.fundamentals.chat-and-tools"
related:
  - "llm.fundamentals.sampling"
  - "llm.fundamentals.embeddings"
seeAlso:
  - "Работа с API провайдеров на фейковом сервере, агенты и дообучение - запланированы в треке, но ещё не вышли"
objectives:
  - "Объяснить, чем оценка отличается от впечатления: фиксированный набор, метрика, порог, воспроизводимость."
  - "Нормализовать ответы и посчитать Exact Match и token F1 с мультимножественным пересечением и несколькими эталонами."
  - "Проверить ссылки вида [N] на корректность и объяснить, почему это необходимое, но недостаточное условие опоры на источники."
  - "Построить бутстрэп-доверительный интервал для среднего и объяснить, как размер набора влияет на его ширину."
  - "Назвать причины и способы смягчения галлюцинаций и смещения судьи-модели (позиционное, многословное, самопредпочтение)."
  - "Объяснить утечку тестовых данных, недетерминизм генерации и стоимость токенов как ограничения реальных систем."
masteryCriteria:
  - "normalize_answer приводит строку к нижнему регистру, заменяет «ё» на «е», превращает каждый символ с категорией Unicode P* в пробел, схлопывает пробелы и обрезает края; символы категории S остаются."
  - "exact_match и token_f1 берут максимум по нескольким эталонам и бросают ValueError при пустом списке эталонов; token_f1 использует Counter-пересечение и возвращает 1.0 для двух пустых наборов токенов и 0.0 для одного пустого."
  - "check_citations возвращает отсортированные по значению уникальные номера, список выходящих за 1..n_sources номеров и ok = True только при наличии ссылок и отсутствии некорректных."
  - "bootstrap_ci создаёт np.random.default_rng(seed), делает один вызов rng.choice(scores, size=(n_boot, n)), берёт квантили [(1 - level) / 2, 1 - (1 - level) / 2] в виде float и бросает ValueError при пустом списке."
  - "evaluate возвращает средние em и f1, долю citations_ok и число n и бросает ValueError при разной длине списков и при пустом наборе."
tags:
  - "llm"
  - "evaluation"
  - "metrics"
  - "bootstrap"
  - "hallucination"
requires:
  packages:
    - "numpy>=2"
accelerator: "none"
facts:
  - kind: "historical"
    text: "Набор SQuAD, описанный в статье Rajpurkar и соавторов 2016 года, закрепил пару метрик Exact Match и F1 по словам для оценки ответов на вопросы; перед сравнением ответы приводят к общему виду: нижний регистр, удаление пунктуации и артиклей."
    sources:
      - "https://arxiv.org/abs/1606.05250"
  - kind: "internals"
    text: "В обзоре Ji и соавторов 2022 года галлюцинацией в генерации текста называют результат, который кажется связным, но неверен или не опирается на исходные данные; авторы разбирают причины, среди которых качество обучающих данных и особенности самого процесса генерации."
    sources:
      - "https://arxiv.org/abs/2202.03629"
  - kind: "internals"
    text: "Исследование Zheng и соавторов 2023 года показало, что модели в роли судьи в среднем согласуются с оценками людей, но подвержены смещениям: предпочитают ответ в определённой позиции, более длинные ответы и тексты своего стиля. Смещение по позиции частично снимается перестановкой ответов."
    sources:
      - "https://arxiv.org/abs/2306.05685"
  - kind: "internals"
    text: "Выводы о том, что многие модели хуже используют информацию в середине длинного контекста, показывают: оценка RAG-системы должна учитывать порядок и количество подаваемых фрагментов, а не только факт их наличия в промпте."
    sources:
      - "https://arxiv.org/abs/2307.03172"
  - kind: "misconception"
    text: "«Если метрика выросла на пару пунктов, система стала лучше». Без размера набора и доверительного интервала такой рост может оказаться шумом: на малом наборе средняя оценка заметно зависит от конкретных вопросов, и разность двух систем с интервалом, содержащим 0, ничего не доказывает."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "numeric"
      prompt: "Эталон «красный большой дом», ответ «большой дом» (после нормализации). Чему равен token F1 (округлите до тысячных)?"
      answer: 0.8
      tolerance: 0.001
      explanation: "Общих слов 2 из 2 в ответе (precision = 1.0) и 2 из 3 в эталоне (recall = 0.667): F1 = 2 * 1.0 * 0.667 / 1.667 = 0.8. Если считать долю найденных слов только по эталону, получится 0.667, но F1 учитывает обе стороны и штрафует и пропуски, и лишние слова."
    - id: "q2"
      type: "single"
      prompt: "Эталон «21 день», ответ «три недели» - верный, но перефразированный. Что покажут Exact Match и F1?"
      options:
        - "Оба дадут 0, потому что метрики сравнивают слова, а не смысл"
        - "EM даст 0, а F1 даст частичный балл за близкий смысл"
        - "Оба дадут 1, потому что смысл совпадает"
        - "Метрики выдадут ошибку, так как слов нет в эталоне"
      answer: 0
      explanation: "Общих слов нет, поэтому пересечение пусто, и EM, и F1 равны 0. F1 даёт частичный балл за общие слова, а не за общий смысл, поэтому для перефразировок нужны человек или судья-модель."
    - id: "q3"
      type: "multiple"
      prompt: "Какие утверждения о check_citations и опоре на источники верны?"
      options:
        - "Ссылка [5] при трёх источниках некорректна"
        - "Ответ без ссылок не проходит проверку"
        - "Корректная ссылка гарантирует, что цитируемый источник подтверждает утверждение"
        - "Повторяющиеся ссылки [1] [1] считаются одним номером в cited"
      answer:
        - 0
        - 1
        - 3
      explanation: "Первое, второе и четвёртое следуют из определения функции: номер вне 1..n_sources недопустим, отсутствие ссылок означает отсутствие проверяемой опоры, номера собираются в множество. Третье неверно: проверка формальная, а подмена числа под существующей ссылкой её пройдёт."
    - id: "q4"
      type: "single"
      prompt: "Бутстрэп-интервал разности двух систем равен [-0.03, +0.11]. Какой вывод корректен?"
      options:
        - "Превосходство второй системы не доказано: интервал содержит 0"
        - "Вторая система лучше на 0.11"
        - "Системы одинаково хороши: разность равна 0"
        - "Бутстрэп не работает на таком наборе"
      answer: 0
      explanation: "Интервал включает и небольшие отрицательные, и положительные значения, то есть данные совместимы с отсутствием разницы. Вывод «лучше на 0.11» берёт верхнюю границу как факт, а «одинаково хороши» читает отсутствие доказательства как доказательство отсутствия: нужны больше данных."
    - id: "q5"
      type: "single"
      prompt: "Судья-модель в сравнении двух почти равных ответов чаще выбирает тот, что показан первым. Что поможет?"
      options:
        - "Оценить каждую пару в обоих порядках и усреднить результаты"
        - "Увеличить число вопросов в десять раз при том же порядке показа"
        - "Попросить судью быть объективным в тексте инструкции и больше ничего не менять"
        - "Всегда показывать лучшую по мнению разработчика систему первой"
      answer: 0
      explanation: "Смещение по позиции систематическое: оно одинаково действует на каждом вопросе, поэтому больший набор лишь точнее измеряет искажённое значение. Просьба быть объективным снижает эффект, но не гарантирует; показ своей системы первой усиливает искажение. Перестановка порядка компенсирует его."
exercise:
  id: "llm.fundamentals.evaluation.exercise"
  title: "EM, F1, ссылки, бутстрэп и evaluate"
  prompt: |
    В файле `eval_task.py` реализуйте шесть функций на стандартной библиотеке и NumPy; ничего не печатайте.

    1. `normalize_answer(s)` - нижний регистр, `ё` на `е`, каждый символ, у которого `unicodedata.category(ch)` начинается с `"P"`, заменяется пробелом, пробелы схлопываются, края обрезаются.
    2. `exact_match(pred, refs)` - `1.0`, если нормализованный `pred` равен любому нормализованному эталону, иначе `0.0`; пустой `refs` - `ValueError`.
    3. `token_f1(pred, refs)` - максимум по эталонам F1 на словах нормализованных строк; пересечение - мультимножество (`collections.Counter`); оба набора слов пусты - `1.0`, пуст один - `0.0`; пустой `refs` - `ValueError`.
    4. `check_citations(answer, n_sources)` - словарь `{"cited": ..., "invalid": ..., "ok": ...}`: `cited` - отсортированные уникальные номера из ссылок `[N]` (регулярное выражение `\[(\d+)\]`), `invalid` - те из них, что не лежат в `1..n_sources`, `ok` - есть хотя бы одна ссылка и нет некорректных.
    5. `bootstrap_ci(scores, n_boot=1000, seed=0, level=0.95)` - `rng = np.random.default_rng(seed)`; `means = rng.choice(scores, size=(n_boot, n)).mean(axis=1)` одним вызовом; результат `(low, high)` из `np.quantile(means, [(1 - level) / 2, 1 - (1 - level) / 2])`, оба значения `float`; пустой `scores` - `ValueError`.
    6. `evaluate(examples, predictions)` - `examples` - список `{"refs": [...], "n_sources": int}`, `predictions` - список строк; результат `{"em": среднее EM, "f1": среднее F1, "citations_ok": доля ответов с ok, "n": число примеров}`; списки разной длины или пустые - `ValueError`.

    Пример: `normalize_answer("  Москва, столица!  ")` возвращает `"москва столица"`; `token_f1("кошка сидит на окне", ["кошка на окне"])` равен `6/7` (precision 3/4, recall 1); `check_citations("Срок 21 день [1], [4].", 3)` возвращает `{"cited": [1, 4], "invalid": [4], "ok": False}`; `bootstrap_ci([0.7, 0.7, 0.7])` возвращает `(0.7, 0.7)`.
  entryFile: "eval_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Начните с normalize_answer: от неё зависят exact_match и token_f1. Затем check_citations и bootstrap_ci (они независимы), и в конце evaluate, который собирает остальные функции."
    - "normalize_answer: после lower() и replace('ё', 'е') соберите строку из символов, заменяя те, у которых unicodedata.category(ch).startswith('P'), на пробел; завершите ' '.join(s.split()). token_f1: вспомогательная функция для одной пары наборов слов, а в token_f1 - max(...) по эталонам."
    - "F1 для пары наборов слов: оба пусты -> 1.0, один пуст -> 0.0; иначе common = sum((Counter(a) & Counter(b)).values()); если common == 0 -> 0.0; precision = common / len(a), recall = common / len(b), F1 = 2 * precision * recall / (precision + recall). check_citations: sorted({int(x) for x in re.findall(r'\\[(\\d+)\\]', answer)})."
    - "bootstrap_ci: scores = np.asarray(scores, dtype=float); если scores.size == 0 - raise ValueError; rng = np.random.default_rng(seed); means = rng.choice(scores, size=(n_boot, scores.size)).mean(axis=1); low, high = np.quantile(means, [(1 - level) / 2, 1 - (1 - level) / 2]); верните float(low), float(high). evaluate: проверьте длины и пустоту, затем усредните exact_match, token_f1 и check_citations(...)['ok'] по парам (пример, ответ)."
  tests:
    - id: "normalize-basic"
      title: "normalize_answer: регистр, ё и пунктуация"
      hint: "Проверяются нижний регистр, замена ё, удаление знаков препинания и пробелов по краям."
    - id: "em-f1-basic"
      title: "exact_match и token_f1: простые случаи"
      hint: "Проверяются совпадение с игнорированием регистра и пунктуации, несовпадение и частичное пересечение слов."
    - id: "citations-basic"
      title: "check_citations: корректные, отсутствующие, несуществующие ссылки"
      hint: "Проверяются ответ с корректными ссылками, ответ без ссылок и ссылка на номер вне диапазона."
    - id: "normalize-edge"
      title: "normalize_answer: граничные случаи (скрытый)"
      hidden: true
      hint: "Проверяются разные виды пунктуации, пробельные символы, символы вне категории P, строка только из знаков и неизменность аргумента."
    - id: "em-edge"
      title: "exact_match: эталоны и пустые строки (скрытый)"
      hidden: true
      hint: "Проверяются несколько эталонов, полное совпадение, пустые строки, ё и е, пустой список эталонов и тип результата."
    - id: "f1-values"
      title: "token_f1: числовые значения (скрытый)"
      hidden: true
      hint: "Проверяются значения на небольших примерах, максимум по эталонам и мультимножественное пересечение."
    - id: "f1-edge"
      title: "token_f1: пустые наборы и ошибки (скрытый)"
      hidden: true
      hint: "Проверяются пустые ответы и эталоны, пустой список эталонов и нормализация обеих сторон."
    - id: "citations-edge"
      title: "check_citations: граничные случаи (скрытый)"
      hidden: true
      hint: "Проверяются дубликаты, сортировка чисел, номера с нулями, номер 0, нулевое число источников и недопустимые формы записи ссылки."
    - id: "bootstrap-basic"
      title: "bootstrap_ci: воспроизводимость и среднее (скрытый)"
      hidden: true
      hint: "Проверяются значения при seed 0, тип границ, наличие среднего в интервале и зависимость от seed."
    - id: "bootstrap-edge"
      title: "bootstrap_ci: параметры и граничные случаи (скрытый)"
      hidden: true
      hint: "Проверяются одинаковые оценки, одна оценка, параметры n_boot и level, вложенность интервалов, неизменность входа и пустой список."
    - id: "evaluate-aggregate"
      title: "evaluate: средние показатели (скрытый)"
      hidden: true
      hint: "Проверяются средние EM и F1, доля корректных ссылок и счётчик n на нескольких наборах."
    - id: "evaluate-errors"
      title: "evaluate: ошибки входных данных (скрытый)"
      hidden: true
      hint: "Проверяются разная длина списков, пустой набор и пример с пустым списком эталонов."
