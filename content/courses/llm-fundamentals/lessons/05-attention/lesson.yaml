id: "llm.fundamentals.attention"
title: "Внимание: scaled dot-product, причинная маска, несколько голов"
goal: "Реализовать scaled dot-product attention с причинной маской и многоголовое внимание на NumPy и объяснить, зачем нужны деление на sqrt(d_k), маска и несколько голов."
difficulty: "hard"
estimatedMinutes: 100
prerequisites:
  - "llm.fundamentals.embeddings"
  - "llm.fundamentals.sampling"
related:
  - "llm.fundamentals.bigram-model"
  - "llm.fundamentals.mini-gpt"
next:
  - "llm.fundamentals.mini-gpt"
seeAlso:
  - "KV-кэш разбирается в следующем уроке; FlashAttention и другие оптимизированные реализации - только названием в разделе «Как это устроено в библиотеках»"
objectives:
  - "Объяснить роль запроса, ключа и значения и вычислить веса внимания как softmax от q · k / sqrt(d_k)."
  - "Обосновать деление на sqrt(d_k) тем, что дисперсия скалярного произведения растёт с размерностью."
  - "Построить причинную маску и применить её до softmax; проверить, что ранние выходы не зависят от будущих токенов."
  - "Реализовать split_heads, merge_heads и многоголовое внимание с проекцией Wo."
  - "Объяснить, почему внимание без маски эквивариантно к перестановкам и почему стоимость растёт как O(T^2)."
masteryCriteria:
  - "scaled_dot_product_attention возвращает out и weights с ведущими осями; строки weights суммируются в 1, а при причинной маске веса выше диагонали равны ровно 0."
  - "softmax не выдаёт nan и предупреждений на значениях порядка 1e3 и при -inf в строке с хотя бы одним конечным значением."
  - "split_heads берёт голову h из столбцов h * dh : (h + 1) * dh, merge_heads её обращает, а d % n_heads != 0 приводит к ValueError."
  - "multi_head_attention совпадает с эталонной реализацией на случайных весах с точностью 1e-10, при causal=True выходы ранних позиций не зависят от поздних строк X, а при causal=False выходы переставляются вместе со строками входа."
tags:
  - "llm"
  - "attention"
  - "transformer"
  - "causal-mask"
  - "multi-head"
  - "numpy"
requires:
  packages:
    - "numpy>=2"
accelerator: "none"
facts:
  - kind: "historical"
    text: "Архитектуру Transformer, целиком построенную на внимании без рекуррентных слоёв, представили Васвани и соавторы в 2017 году в статье «Attention Is All You Need»; с тех пор она лежит в основе большинства больших языковых моделей."
    sources:
      - "https://arxiv.org/abs/1706.03762"
  - kind: "internals"
    text: "Деление скалярных произведений на sqrt(d_k) в оригинальной статье объясняется так: при больших d_k произведения растут по величине и толкают softmax в области с очень малыми градиентами."
    sources:
      - "https://arxiv.org/abs/1706.03762"
  - kind: "real-world"
    text: "Размер контекстного окна модели ограничен отчасти потому, что матрица весов внимания растёт как квадрат длины последовательности; для длинных контекстов применяют оптимизированные реализации внимания и кэширование ключей и значений."
  - kind: "misconception"
    text: "«Веса внимания показывают, почему модель дала такой ответ». Веса одной головы описывают, откуда берутся значения в одном слое, но не объясняют решение модели целиком: выход слоя ещё проходит через другие головы и слои."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "numeric"
      prompt: "В модели размерность d = 768 и 12 голов. Чему равен размер одной головы dh?"
      answer: 64
      tolerance: 0
      explanation: "Размерность делится на число голов поровну: 768 / 12 = 64. Склейка 12 голов по 64 возвращает исходные 768. Ответ 768 - это размерность всего вектора, а не одной головы."
    - id: "q2"
      type: "numeric"
      prompt: "Длину последовательности T увеличили вдвое. Во сколько раз вырос размер матрицы весов внимания T x T?"
      answer: 4
      tolerance: 0
      explanation: "Матрица квадратная: (2T) * (2T) = 4 * T * T. Ответ 2 был бы верен для памяти, линейной по T (например, для самих векторов токенов). Поэтому длинный контекст дорог, а размер контекстного окна ограничен."
    - id: "q3"
      type: "single"
      prompt: "Зачем скалярные произведения q · k делят на sqrt(d_k)?"
      options:
        - "Чтобы веса внимания суммировались в 1"
        - "Чтобы при большом d_k оценки не росли и softmax не превращался в argmax с исчезающими градиентами"
        - "Чтобы маска работала быстрее"
        - "Чтобы значения V стали нормированными"
      answer: 1
      explanation: "Дисперсия q · k равна d_k, поэтому стандартное отклонение оценок растёт как sqrt(d_k), и без масштаба softmax насыщается. В 1 веса суммирует сам softmax, а не деление; на маску и V масштаб не влияет."
    - id: "q4"
      type: "multiple"
      prompt: "Что верно о причинной маске и свойствах внимания?"
      options:
        - "Запрещённые позиции заменяют на -inf в оценках до softmax"
        - "С причинной маской выход позиции i не зависит от токенов j > i"
        - "Внимание без маски и без позиционной информации эквивариантно к перестановкам токенов"
        - "Маску можно применить после softmax, обнулив веса, - результат тот же"
      answer:
        - 0
        - 1
        - 2
      explanation: "Верны первые три утверждения: замена на -inf даёт ровно нулевые веса и перенормировку, из чего следует независимость от будущего, а без маски и позиций порядок токенов внимание не различает. Обнуление после softmax оставляет строки с суммой меньше 1 и не перенормирует остальные веса."
    - id: "q5"
      type: "single"
      prompt: "Зачем после склейки голов умножают на Wo?"
      options:
        - "Чтобы нормировать веса внимания по строкам"
        - "Чтобы смешать информацию из разных голов: после склейки каждая голова занимает свой блок признаков"
        - "Чтобы применить причинную маску"
        - "Чтобы уменьшить число токенов"
      answer: 1
      explanation: "Головы работают независимо и после склейки лежат в разных блоках столбцов; Wo позволяет следующему слою использовать их совместно. Нормировку весов делает softmax внутри каждой головы, а маска применяется до него."
exercise:
  id: "llm.fundamentals.attention.exercise"
  title: "Многоголовое внимание с причинной маской"
  prompt: |
    В файле `attention_task.py` реализуйте пять функций на NumPy. Ничего не печатайте.

    1. `softmax(x, axis=-1)` - устойчивый softmax вдоль оси `axis` (вычитайте максимум). Значения `-inf` получают вероятность ровно 0; считайте, что в каждой строке есть хотя бы одно конечное значение. Предупреждений быть не должно.
    2. `causal_mask(T)` - булева матрица `(T, T)`: `True`, где вниманию разрешено смотреть (`j <= i`).
    3. `scaled_dot_product_attention(Q, K, V, mask=None)` - возвращает `(out, weights)`. `Q` имеет форму `(..., Tq, d_k)`, `K` - `(..., Tk, d_k)`, `V` - `(..., Tk, d_v)`. `scores = Q @ K.swapaxes(-1, -2) / sqrt(d_k)`; там, где `mask` равна `False`, `scores = -inf` (маска транслируется на ведущие оси); `weights = softmax(scores)` по последней оси; `out = weights @ V`. Должно работать с ведущими осями (батч, головы) и с `Tq != Tk`.
    4. `split_heads(X, n_heads)` - `(T, d)` в `(n_heads, T, d // n_heads)`, голова `h` - столбцы `h * dh : (h + 1) * dh`. Если `d % n_heads != 0` или `n_heads < 1` - `ValueError`. `merge_heads(H)` - обратная операция `(n_heads, T, dh)` в `(T, n_heads * dh)`.
    5. `multi_head_attention(X, Wq, Wk, Wv, Wo, n_heads, causal=True)` - `X` формы `(T, d)`, веса `(d, d)`: `Q = X @ Wq`, `K = X @ Wk`, `V = X @ Wv`, разбить на головы, внимание (с `causal_mask(T)`, если `causal`), склеить головы, умножить на `Wo`. Результат `(T, d)`.

    Пример: для `Q = K = [[1, 0], [0, 1]]`, `V = [[1, 2], [3, 4]]` без маски `weights = [[0.670, 0.330], [0.330, 0.670]]`; с маской `[[True, False], [True, True]]` первая строка весов равна `[1, 0]`, а `out[0] = [1, 2]`. `split_heads` для `X` формы `(3, 4)` и `n_heads=2` даёт голову 0 из столбцов 0-1 и голову 1 из столбцов 2-3.
  entryFile: "attention_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "multi_head_attention собирается из остальных функций почти без новых формул: проекции, split_heads, scaled_dot_product_attention с маской, merge_heads, проекция Wo. Сначала добейтесь корректности softmax и scaled_dot_product_attention."
    - "softmax: e = np.exp(x - x.max(axis=axis, keepdims=True)); результат e / e.sum(axis=axis, keepdims=True). causal_mask - нижний треугольник из True (np.tril). В attention: scores = Q @ K.swapaxes(-1, -2) / np.sqrt(Q.shape[-1]); np.where(mask, scores, -np.inf)."
    - "split_heads: X.reshape(T, n_heads, dh) даёт оси (токен, голова, признак); нужны оси (голова, токен, признак), поэтому добавьте .transpose(1, 0, 2). merge_heads - то же в обратную сторону: H.transpose(1, 0, 2).reshape(T, n_heads * dh). Не используйте reshape(n_heads, T, dh) напрямую."
    - "multi_head_attention: Q = split_heads(X @ Wq, n_heads); K и V аналогично; mask = causal_mask(len(X)) if causal else None; out, _ = scaled_dot_product_attention(Q, K, V, mask); return merge_heads(out) @ Wo. Маска (T, T) сама транслируется на ось голов."
  tests:
    - id: "sdpa-basic"
      title: "Внимание на двух токенах"
      hint: "Проверяются веса и выход на маленьком примере с известным ответом, без маски и с маской."
    - id: "causal-mask"
      title: "Причинная маска"
      hint: "Проверяются форма, тип bool и нижнетреугольный вид маски."
    - id: "split-merge"
      title: "split_heads и merge_heads"
      hint: "Проверяются форма результата, содержимое голов (столбцы подряд) и обратимость разбиения."
    - id: "softmax-stable"
      title: "Устойчивый softmax (скрытый)"
      hidden: true
      hint: "Проверяются большие по модулю значения, значения -inf, параметр axis и массивы больших размерностей без предупреждений."
    - id: "sdpa-props"
      title: "Свойства весов и ведущие оси (скрытый)"
      hidden: true
      hint: "Проверяются суммы строк весов, нули выше диагонали при маске, ведущие оси (батч, головы) и случай Tq != Tk."
    - id: "sdpa-large"
      title: "Большие значения оценок (скрытый)"
      hidden: true
      hint: "Проверяется, что при значениях порядка 1e3 результат конечен, без предупреждений и совпадает с эталоном."
    - id: "mha-future"
      title: "Выходы не зависят от будущего (скрытый)"
      hidden: true
      hint: "Проверяется, что при causal=True изменение поздних строк X не меняет ранние выходы, а при causal=False меняет."
    - id: "mha-reference"
      title: "Сравнение с эталоном (скрытый)"
      hidden: true
      hint: "Сравнивается multi_head_attention с независимой реализацией на случайных весах для разных чисел голов и обоих значений causal."
    - id: "mha-single-head"
      title: "Одна голова (скрытый)"
      hidden: true
      hint: "Проверяется, что при n_heads=1 результат совпадает с обычным вниманием с маской и проекцией Wo."
    - id: "mha-permutation"
      title: "Перестановка токенов (скрытый)"
      hidden: true
      hint: "Проверяется эквивариантность к перестановкам при causal=False и её отсутствие при причинной маске."
    - id: "split-errors"
      title: "Ошибки разбиения на головы (скрытый)"
      hidden: true
      hint: "Проверяются ValueError для размерности, не делящейся на число голов, обратимость split_heads после merge_heads и ошибка в multi_head_attention."
