id: llm-fundamentals
version: 1.0.0
title: "Основы LLM: от токенов до RAG"
description: >-
  Девять уроков о том, как устроены большие языковые модели, на NumPy и стандартной библиотеке Python: байтовый BPE-токенизатор, эмбеддинги и косинусное сходство,
  биграммная языковая модель с кросс-энтропией и перплексией, генерация (greedy, temperature, top-k, top-p), механизм внимания с причинной маской и несколькими головами,
  прямой проход мини-GPT с KV-кэшем, поиск для RAG (чанкинг, TF-IDF, recall@k), шаблоны чата и разбор вызовов инструментов с проверкой аргументов и защитой от prompt injection,
  оценка ответов (exact match, F1, проверка ссылок на источники) и ограничения моделей. Все упражнения детерминированы, работают на процессоре и без сети:
  ни API-ключей, ни загрузки весов. Веса моделей в упражнениях маленькие и генерируются с фиксированным seed, поэтому модели не «умные»: курс учит механизмам, а не качеству ответов.
  Нужен NumPy 2.x. Обучение настоящей модели, дообучение (LoRA), локальный инференс готовых моделей, работа с API провайдеров и агенты в курс не входят.
languageId: python
level: 4
track: llm-genai
requires: [ml-foundations, ml-classical-numpy]
lessons:
  - 01-tokenization-bpe
  - 02-embeddings
  - 03-bigram-language-model
  - 04-sampling
  - 05-attention
  - 06-mini-gpt-forward
  - 07-rag-retrieval
  - 08-chat-templates-and-tools
  - 09-evaluation-and-limits
