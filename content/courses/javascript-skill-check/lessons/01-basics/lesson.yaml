id: "javascript.check.basics"
title: "Проверка: основы - значения, условия, циклы, функции"
goal: "Читать и писать небольшие функции с условиями и циклами, не путая типы значений и строгое сравнение."
difficulty: "easy"
estimatedMinutes: 15
prerequisites: []
objectives:
  - "Показать на практике умение: писать функции с условиями и циклами и предсказывать результат простых выражений."
masteryCriteria:
  - "Решение упражнения проходит все тесты, включая скрытые."
  - "Квиз пройден с результатом не ниже 75%."
tags:
  - "javascript"
  - "check"
  - "basics"
assessmentFor:
  - "javascript.from-zero.first-program"
  - "javascript.from-zero.reading-errors"
  - "javascript.from-zero.values-and-types"
  - "javascript.from-zero.variables"
  - "javascript.from-zero.arithmetic"
  - "javascript.from-zero.strings"
  - "javascript.from-zero.comparison-and-logic"
  - "javascript.from-zero.functions"
  - "javascript.from-zero.if-else"
  - "javascript.from-zero.while-loop"
  - "javascript.from-zero.for-loop"
  - "javascript.from-zero.loop-control"
quiz:
  passThreshold: 0.75
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```javascript
        let s = 0;
        for (let i = 1; i <= 5; i++) {
          if (i % 2 === 0) continue;
          s += i;
        }
        console.log(s);
        ```
      options:
        - "6"
        - "9"
        - "15"
        - "5"
      answer: 1
      explanation: "Цикл пропускает чётные i, поэтому складываются 1, 3 и 5, итого 9. Оператор continue завершает только текущий шаг, а не весь цикл."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```javascript
        console.log("5" + 3, "5" - 3, 5 + +"3");
        ```
      options:
        - "8 2 8"
        - "53 2 8"
        - "53 53 53"
        - "53 2 53"
      answer: 1
      explanation: "Если один из операндов + строка, происходит склейка: \"53\". Минус всегда работает с числами и даёт 2. Унарный плюс превращает \"3\" в число, поэтому 5 + 3 даёт 8."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```javascript
        function f(a, b) {
          return a + b;
        }
        console.log(f(1), f(1, 2, 3));
        ```
      options:
        - "1 6"
        - "NaN 3"
        - "undefined 3"
        - "NaN 6"
      answer: 1
      explanation: "Лишние аргументы игнорируются, поэтому f(1, 2, 3) складывает 1 и 2. Пропущенный параметр b равен undefined, а 1 + undefined даёт NaN."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```javascript
        let n = 10, c = 0;
        while (n > 1) {
          n = Math.floor(n / 2);
          c++;
        }
        console.log(c, n);
        ```
      options:
        - "3 1"
        - "4 0"
        - "3 2"
        - "5 1"
      answer: 0
      explanation: "Значения n по шагам: 10, 5, 2, 1. Три итерации, после третьей n равно 1 и условие n > 1 ложно. Поэтому выводится 3 1."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```javascript
        const x = 5;
        try {
          x = 6;
        } catch (e) {
          console.log(e.name);
        }
        console.log(x);
        ```
      options:
        - "TypeError, затем 5"
        - "ничего, затем 6"
        - "TypeError, затем 6"
        - "SyntaxError, затем 5"
      answer: 0
      explanation: "Переменную, объявленную через const, нельзя переприсвоить: попытка бросает TypeError, и значение остаётся прежним. SyntaxError возникает только на этапе разбора, а здесь код корректен по синтаксису."
exercise:
  id: "javascript.check.basics.exercise"
  title: "Небольшие функции с условиями и циклами"
  prompt: |
    В файле `basics_check.mjs` реализуйте четыре экспортируемые функции.

    1. `fizzBuzz(n)` - строка: `"FizzBuzz"`, если `n` делится на 3 и на 5; `"Fizz"`, если только на 3; `"Buzz"`, если только на 5; иначе число `n`, записанное строкой.
    2. `sumOfMultiples(limit)` - сумма всех натуральных чисел меньше `limit`, которые делятся на 3 или на 5. Для `limit` меньше 1 результат `0`.
    3. `isLeapYear(year)` - `true` для високосного года: делится на 4, но не на 100, кроме годов, которые делятся на 400.
    4. `firstPrimeAbove(n)` - наименьшее простое число, строго большее `n` (`n` целое, может быть отрицательным).

    Часть тестов скрыта: в них граничные значения.
  entryFile: "basics_check.mjs"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.mjs"
  hints:
    - "Начните с `fizzBuzz`: проверка деления на 15 должна идти раньше проверок на 3 и на 5."
    - "`sumOfMultiples`: цикл `for (let i = 1; i < limit; i++)` с условием `i % 3 === 0 || i % 5 === 0`."
    - "`isLeapYear`: `(year % 4 === 0 && year % 100 !== 0) || year % 400 === 0`."
    - "`firstPrimeAbove`: заведите вспомогательную функцию `isPrime` (числа меньше 2 не простые, делители ищите до корня) и увеличивайте кандидата в цикле `while`, пока он не станет простым."
  tests:
    - id: "fizz-basic"
      title: "fizzBuzz - обычные числа"
      hint: "Для 15 нужен \"FizzBuzz\", для 9 - \"Fizz\", для 10 - \"Buzz\", для 7 - строка \"7\"."
    - id: "sum-basic"
      title: "sumOfMultiples - небольшой предел"
      hint: "Для предела 10 подходят 3, 5, 6 и 9; сам предел не входит."
    - id: "leap-basic"
      title: "isLeapYear - обычные годы"
      hint: "2024 високосный, 2023 нет."
    - id: "prime-basic"
      title: "firstPrimeAbove - небольшие числа"
      hint: "После 10 идёт 11; само число n не считается."
    - id: "fizz-edge"
      title: "fizzBuzz - 0 и большие числа (скрытый)"
      hidden: true
      hint: "0 делится и на 3, и на 5, поэтому результат \"FizzBuzz\"."
    - id: "sum-edge"
      title: "sumOfMultiples - 0, 1 и большой предел (скрытый)"
      hidden: true
      hint: "Для предела 0, 1 и отрицательного пределов сумма равна 0. Для 1000 ответ 233168."
    - id: "leap-edge"
      title: "isLeapYear - 1900, 2000, 2100 (скрытый)"
      hidden: true
      hint: "1900 и 2100 не високосные (делятся на 100), 2000 високосный (делится на 400)."
    - id: "prime-edge"
      title: "firstPrimeAbove - отрицательные, 0, 1 и пары простых (скрытый)"
      hidden: true
      hint: "Для любого n меньше 2 ответ 2. После 2 идёт 3, после 7 - 11, после 89 - 97."
