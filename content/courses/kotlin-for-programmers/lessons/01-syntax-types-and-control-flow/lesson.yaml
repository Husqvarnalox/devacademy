id: "kotlin.programmers.syntax-types-and-control-flow"
title: "Типы, числа и управление потоком: ловушки Kotlin"
goal: "Писать числовые вычисления, работу с Char и ввод так, чтобы переполнение Int, целочисленное деление, отсутствие неявных преобразований и вывод дробных чисел, зависящий от локали, не искажали результат."
difficulty: "medium"
estimatedMinutes: 45
prerequisites: []
next:
  - "kotlin.programmers.functions-collections-and-strings"
objectives:
  - "Предсказывать результат арифметики с Int и Long: переполнение, целочисленное деление, знак остатка и mod."
  - "Явно преобразовывать числа (toLong, toDouble, roundToInt) и понимать, почему Int, Long и Double нельзя сравнивать и присваивать друг другу."
  - "Использовать if и when как выражения, диапазоны until, .., downTo и step, и различать == и ===."
  - "Читать ввод через readln и readlnOrNull и печатать дроби независимо от локали через Locale.ROOT."
masteryCriteria:
  - "totalCents, percent, caesar и dayType дают верные результаты на больших суммах, отрицательном сдвиге и неизвестных значениях."
  - "Квиз пройден с результатом не ниже 70%."
