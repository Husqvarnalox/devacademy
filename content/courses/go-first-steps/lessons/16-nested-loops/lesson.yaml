id: "go.first-steps.nested-loops"
title: "Вложенные циклы"
goal: "Строить таблицы и фигуры с помощью цикла внутри цикла и считать число повторений."
difficulty: "easy"
estimatedMinutes: 30
prerequisites:
  - "go.first-steps.loop-control"
objectives:
  - "Записывать цикл внутри цикла и предсказывать порядок значений счётчиков."
  - "Оценивать общее число повторений как произведение повторений вложенных циклов."
  - "Печатать строки таблицы: внутренний цикл печатает ячейки, внешний - переводит строку."
masteryCriteria:
  - "Программа печатает таблицу умножения n на n с пробелами между числами и без пробелов в конце строк."
  - "Вы объясняете, что break во вложенном цикле завершает только внутренний цикл."
concepts:
  introduces:
    - "go.nested-loops"
  uses:
    - "go.for-loop"
    - "go.for-condition"
    - "go.break-continue"
    - "go.if"
    - "go.comparison"
    - "go.int"
    - "go.variable"
    - "go.short-declaration"
    - "go.arithmetic"
    - "go.scan"
    - "go.print-values"
    - "go.newline"
    - "go.println"
next:
  - "go.first-steps.functions"
tags:
  - "go"
  - "for"
  - "nested"
  - "table"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Сколько раз выполнится Println?

        ```go
        for i := 0; i < 3; i++ {
            for j := 0; j < 4; j++ {
                fmt.Println(i, j)
            }
        }
        ```
      options:
        - "7"
        - "12"
        - "3"
        - "4"
      answer: 1
      explanation: "На каждое из 3 значений внешнего счётчика внутренний цикл делает 4 повторения: 3 · 4 = 12."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```go
        for i := 1; i <= 2; i++ {
            for j := 1; j <= 2; j++ {
                fmt.Print(i, j, " ")
            }
        }
        ```
      options:
        - "11 12 21 22 "
        - "1 1 1 2 2 1 2 2 "
        - "11 21 12 22 "
        - "12 21 "
      answer: 1
      explanation: "Внешний счётчик меняется медленно, внутренний быстро: пары (1,1), (1,2), (2,1), (2,2). Print ставит пробел между двумя операндами, если ни один из них не строка, поэтому i и j печатаются как «1 1», а за ними идёт строка \" \"."
    - id: "q3"
      type: "single"
      prompt: "Что делает break во вложенном цикле?"
      options:
        - "Завершает все циклы."
        - "Завершает только внутренний цикл, в котором выполнен."
        - "Пропускает итерацию внешнего цикла."
        - "Ничего не делает."
      answer: 1
      explanation: "break действует на ближайший цикл. Чтобы выйти из обоих, нужны дополнительные средства: флаг или метки."
    - id: "q4"
      type: "single"
      prompt: "Как напечатать каждую строку таблицы с новой строки?"
      options:
        - "Println внутри внутреннего цикла."
        - "Println() после внутреннего цикла, внутри внешнего."
        - "Print(\"\\n\") перед внешним циклом."
        - "Это произойдёт само."
      answer: 1
      explanation: "Внутренний цикл печатает ячейки одной строки через Print, после него Println() заканчивает строку, и внешний цикл переходит к следующей."
exercise:
  id: "go.first-steps.nested-loops.exercise"
  title: "Таблица умножения"
  prompt: |
    Программа получает число `n` (1 <= n <= 9). Напечатайте таблицу умножения размера `n` на `n`: в строке `i` стоят произведения `i * 1`, `i * 2`, ..., `i * n`, разделённые одним пробелом. Пробелов в конце строк быть не должно.

    **Пример.** Ввод `3` даёт

    ```
    1 2 3
    2 4 6
    3 6 9
    ```
  entryFile: "main.go"
  evaluation: "io"
  hints:
    - "Для таблицы нужны два счётчика: номер строки и номер столбца."
    - "Внешний цикл по i от 1 до n, внутри него цикл по j от 1 до n. Произведение - i * j."
    - "После внутреннего цикла вызовите fmt.Println(), чтобы перейти на новую строку. Пробел печатайте перед каждым числом, кроме первого в строке (j > 1)."
    - "for i := 1; i <= n; i++ { for j := 1; j <= n; j++ { if j > 1 { fmt.Print(\" \") }; fmt.Print(i * j) }; fmt.Println() }."
  tests:
    - id: "basic"
      title: "Таблица 3 на 3"
      stdin: |
        3
      expected: |
        1 2 3
        2 4 6
        3 6 9
      hint: "Три строки по три числа, каждое равно i * j."
    - id: "one"
      title: "Таблица 1 на 1 (скрытый)"
      stdin: |
        1
      expected: |
        1
      hidden: true
      hint: "При n = 1 одна строка с одним числом."
    - id: "five"
      title: "Таблица 5 на 5 (скрытый)"
      stdin: |
        5
      expected: |
        1 2 3 4 5
        2 4 6 8 10
        3 6 9 12 15
        4 8 12 16 20
        5 10 15 20 25
      hidden: true
      hint: "Двузначные числа печатаются без выравнивания, разделитель - один пробел."
    - id: "nine"
      title: "Таблица 9 на 9 (скрытый)"
      stdin: |
        9
      expected: |
        1 2 3 4 5 6 7 8 9
        2 4 6 8 10 12 14 16 18
        3 6 9 12 15 18 21 24 27
        4 8 12 16 20 24 28 32 36
        5 10 15 20 25 30 35 40 45
        6 12 18 24 30 36 42 48 54
        7 14 21 28 35 42 49 56 63
        8 16 24 32 40 48 56 64 72
        9 18 27 36 45 54 63 72 81
      hidden: true
      hint: "Последняя строка и последний столбец - таблица умножения на 9."
