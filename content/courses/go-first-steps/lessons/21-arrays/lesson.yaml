id: "go.first-steps.arrays"
title: "Массивы"
goal: "Хранить несколько значений одного типа в массиве фиксированной длины и обращаться к ним по номеру."
difficulty: "easy"
estimatedMinutes: 35
prerequisites:
  - "go.first-steps.errors-first-look"
objectives:
  - "Объявлять массив фиксированной длины и задавать его значения литералом."
  - "Обращаться к элементу по индексу, помня, что нумерация начинается с нуля."
  - "Определять длину массива через len и обходить массив циклом."
  - "Объяснять, что происходит при выходе индекса за границы."
masteryCriteria:
  - "Программа читает семь чисел в массив и находит наибольшее вместе с номером дня (нумерация дней с 1)."
  - "При нескольких одинаковых наибольших значениях программа выводит первый из дней."
  - "Вы объясняете, почему последний элемент массива из n элементов имеет индекс n-1."
concepts:
  introduces:
    - "go.array"
    - "go.index"
    - "go.len"
  uses:
    - "go.for-loop"
    - "go.if"
    - "go.comparison"
    - "go.int"
    - "go.string"
    - "go.variable"
    - "go.short-declaration"
    - "go.assignment"
    - "go.scan"
    - "go.println"
    - "go.print-values"
    - "go.zero-value"
    - "go.arithmetic"
    - "go.printf"
next:
  - "go.first-steps.slices"
tags:
  - "go"
  - "array"
  - "index"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```go
        a := [4]int{10, 20, 30, 40}
        fmt.Println(a[1], a[3], len(a))
        ```
      options:
        - "10 30 4"
        - "20 40 4"
        - "20 40 3"
        - "10 40 4"
      answer: 1
      explanation: "Индексы начинаются с нуля: a[0] = 10, a[1] = 20, a[3] = 40. len(a) возвращает число элементов, 4."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```go
        var a [3]int
        a[1] = 7
        fmt.Println(a)
        ```
      options:
        - "[7]"
        - "[0 7 0]"
        - "[7 0 0]"
        - "Ошибка компиляции: массив не инициализирован"
      answer: 1
      explanation: "Элементы массива получают нулевое значение своего типа (для int - 0). Присваивание a[1] = 7 меняет только второй элемент."
    - id: "q3"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```go
        var a [3]int
        i := 3
        fmt.Println(a[i])
        ```
      options:
        - "Напечатается 0."
        - "Программа завершится с паникой index out of range [3] with length 3."
        - "Ошибка компиляции."
        - "Напечатается последний элемент."
      answer: 1
      explanation: "Допустимые индексы массива из трёх элементов - 0, 1, 2. Индекс 3 вычислен во время работы, поэтому ошибка возникает при запуске как паника."
    - id: "q4"
      type: "single"
      prompt: "Какой цикл корректно обходит все элементы массива a?"
      options:
        - "for i := 0; i <= len(a); i++"
        - "for i := 1; i < len(a); i++"
        - "for i := 0; i < len(a); i++"
        - "for i := len(a); i > 0; i--"
      answer: 2
      explanation: "Индексы 0, 1, ..., len(a)-1: условие i < len(a). Вариант с <= выйдет за границы, вариант с 1 пропускает первый элемент, а последний вариант начинается с недопустимого индекса len(a)."
exercise:
  id: "go.first-steps.arrays.exercise"
  title: "Самый тёплый день недели"
  prompt: |
    Программа получает семь целых чисел: температуры за дни недели с 1-го по 7-й. Найдите наибольшую температуру и номер дня, в который она была.

    Выведите две строки:

    ```
    max=<наибольшая температура>
    day=<номер дня от 1 до 7>
    ```

    Если наибольшее значение встречается несколько раз, выведите первый из таких дней.

    **Пример.** Ввод `18 21 24 19 22 20 17` даёт

    ```
    max=24
    day=3
    ```

    Храните температуры в массиве `[7]int`.
  entryFile: "main.go"
  evaluation: "io"
  hints:
    - "Заведите массив var temps [7]int и прочитайте в него семь чисел циклом: fmt.Scan(&temps[i])."
    - "Запоминайте не только наибольшее значение, но и его индекс. Начните с индекса 0 и сравнивайте каждый следующий элемент."
    - "Чтобы при равных значениях остался первый день, меняйте индекс только при строгом сравнении temps[i] > temps[maxIndex]."
    - "Номер дня на единицу больше индекса: day = maxIndex + 1."
  tests:
    - id: "basic"
      title: "Максимум в середине недели"
      stdin: "18 21 24 19 22 20 17\n"
      expected: "max=24\nday=3\n"
      hint: "Температура 24 - третья по счёту, значит, день 3."
    - id: "first-day"
      title: "Максимум в первый день (скрытый)"
      stdin: "30 10 10 10 10 10 10\n"
      expected: "max=30\nday=1\n"
      hidden: true
      hint: "Номер первого дня равен 1, а не 0: индекс на единицу меньше номера."
    - id: "last-day"
      title: "Максимум в последний день (скрытый)"
      stdin: "1 2 3 4 5 6 7\n"
      expected: "max=7\nday=7\n"
      hidden: true
      hint: "Цикл должен дойти до последнего элемента, индекс 6."
    - id: "ties"
      title: "Несколько одинаковых максимумов (скрытый)"
      stdin: "5 9 3 9 9 1 2\n"
      expected: "max=9\nday=2\n"
      hidden: true
      hint: "При равенстве нужно оставить первый день: сравнение строгое."
    - id: "negatives"
      title: "Все температуры отрицательные (скрытый)"
      stdin: "-10 -3 -7 -20 -3 -15 -9\n"
      expected: "max=-3\nday=2\n"
      hidden: true
      hint: "Нельзя начинать поиск максимума с нуля: он будет больше всех значений."
    - id: "lines"
      title: "Числа на отдельных строках (скрытый)"
      stdin: "4\n4\n4\n4\n4\n4\n4\n"
      expected: "max=4\nday=1\n"
      hidden: true
      hint: "Scan читает числа независимо от того, разделены они пробелами или переводами строк."
