id: "go.first-steps.first-program"
title: "Первая программа"
goal: "Запустить программу на Go и изменить строку, которую она печатает."
difficulty: "intro"
estimatedMinutes: 20
prerequisites: []
objectives:
  - "Объяснить, что такое программа, исходный код и компилятор."
  - "Назвать роль каждой строки в минимальной программе на Go: package main, import, func main."
  - "Вывести текст на экран с помощью fmt.Println и записать строку в кавычках."
masteryCriteria:
  - "Ваша программа печатает ровно заданную строку, включая регистр и знаки препинания."
  - "Вы отличаете текст внутри кавычек (его печатают как есть) от имён функций (их вызывают)."
concepts:
  introduces:
    - "go.program"
    - "go.package-main"
    - "go.func-main"
    - "go.import"
    - "go.println"
    - "go.string-literal"
next:
  - "go.first-steps.compiler-errors"
tags:
  - "go"
  - "program"
  - "fmt"
  - "println"
facts:
  - kind: "misconception"
    text: "«Чтобы запустить Go-программу, нужно сначала установить что-то ещё рядом с ней» - для готового исполняемого файла это не так: компилятор превращает текст программы в файл, который компьютер выполняет сам."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что делает компилятор?"
      options:
        - "Запускает программу строка за строкой, не создавая файлов."
        - "Переводит текст программы в файл, который может выполнить компьютер."
        - "Исправляет ошибки в тексте программы."
        - "Печатает текст программы на экран."
      answer: 1
      explanation: "Компилятор читает исходный код и создаёт исполняемый файл. Ошибки он только сообщает, исправляет их человек."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```go
        package main

        import "fmt"

        func main() {
            fmt.Println("раз")
            fmt.Println("два")
        }
        ```
      options:
        - "раздва"
        - "раз два (в одной строке)"
        - "раз и на следующей строке два"
        - "два и на следующей строке раз"
      answer: 2
      explanation: "Строки внутри main выполняются сверху вниз, а Println после текста переводит строку. Поэтому «раз» и «два» оказываются на разных строках в этом порядке."
    - id: "q3"
      type: "single"
      prompt: "В программе есть вызов fmt.Println(\"привет\"), но нет строки import \"fmt\". Что сообщит компилятор?"
      options:
        - "undefined: fmt"
        - "Программа напечатает пустую строку."
        - "Программа напечатает fmt."
        - "Компилятор сам добавит import."
      answer: 0
      explanation: "Без import имя fmt неизвестно, поэтому сборка останавливается с сообщением undefined: fmt. Компилятор ничего не добавляет за вас."
    - id: "q4"
      type: "multiple"
      prompt: "Что верно для строки \"Привет\" в кавычках?"
      options:
        - "Println напечатает её содержимое без кавычек."
        - "Кавычки тоже попадут на экран."
        - "Это строковый литерал: текст, записанный прямо в программе."
        - "Без кавычек Привет был бы тоже строкой."
      answer:
        - 0
        - 2
      explanation: "Кавычки только показывают, где начинается и заканчивается текст. Без них Привет компилятор счёл бы именем, которого не существует."
exercise:
  id: "go.first-steps.first-program.exercise"
  title: "Измените выводимую строку"
  prompt: |
    В редакторе уже есть рабочая программа: она печатает приветствие. Измените её так, чтобы она печатала ровно одну строку:

    ```
    Я учусь программировать на Go!
    ```

    Менять нужно только текст в кавычках. Регистр букв, пробелы и восклицательный знак важны.
  entryFile: "main.go"
  evaluation: "io"
  hints:
    - "Найдите в программе строку с fmt.Println: нужный текст находится между кавычками."
    - "Замените всё, что стоит между кавычками, на нужную фразу. Сами кавычки и скобки оставьте."
    - "Должно получиться fmt.Println(\"Я учусь программировать на Go!\")."
  tests:
    - id: "basic"
      title: "Печатается нужная фраза"
      stdin: ""
      expected: |
        Я учусь программировать на Go!
      hint: "Программа должна напечатать одну строку: Я учусь программировать на Go!"
    - id: "exact"
      title: "Точный текст и одна строка (скрытый)"
      stdin: ""
      expected: |
        Я учусь программировать на Go!
      hidden: true
      hint: "Проверяется точное совпадение: заглавная Я, пробелы между словами, восклицательный знак в конце и никаких лишних строк."
