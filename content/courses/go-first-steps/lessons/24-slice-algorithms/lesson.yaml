id: "go.first-steps.slice-algorithms"
title: "Поиск, фильтрация и сортировка"
goal: "Отбирать элементы среза в новый срез и сортировать срез функцией slices.Sort."
difficulty: "easy"
estimatedMinutes: 35
prerequisites:
  - "go.first-steps.range"
objectives:
  - "Отбирать элементы по условию в новый срез (фильтрация)."
  - "Искать элемент и его индекс обходом и выходом из цикла."
  - "Сортировать срез по возрастанию через slices.Sort и объяснять, что он меняет срез на месте."
  - "Обрабатывать случай, когда отобрано ноль элементов."
masteryCriteria:
  - "Программа отбирает баллы не ниже 60 и печатает их по возрастанию через пробел."
  - "Если подходящих баллов нет, программа печатает слово «нет»."
  - "Повторяющиеся значения печатаются столько раз, сколько они встретились."
concepts:
  introduces:
    - "go.filter"
    - "go.slices-sort"
  uses:
    - "go.slice"
    - "go.append"
    - "go.range"
    - "go.len"
    - "go.index"
    - "go.for-loop"
    - "go.break-continue"
    - "go.if"
    - "go.comparison"
    - "go.int"
    - "go.import"
    - "go.scan"
    - "go.println"
    - "go.print-values"
    - "go.variable"
    - "go.short-declaration"
next:
  - "go.first-steps.maps"
tags:
  - "go"
  - "slice"
  - "sort"
  - "filter"
facts:
  - kind: "internals"
    text: "Пакет slices появился в стандартной библиотеке в Go 1.21; slices.Sort сортирует срез упорядочиваемых элементов по возрастанию на месте."
    sources:
      - "https://pkg.go.dev/slices#Sort"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```go
        xs := []int{5, 1, 4, 1}
        slices.Sort(xs)
        fmt.Println(xs)
        ```
      options:
        - "[1 1 4 5]"
        - "[1 4 5]"
        - "[5 4 1 1]"
        - "[5 1 4 1]"
      answer: 0
      explanation: "slices.Sort упорядочивает срез по возрастанию на месте; повторы сохраняются."
    - id: "q2"
      type: "single"
      prompt: |
        Что содержит result?

        ```go
        var result []int
        for _, v := range []int{3, 8, 5, 10} {
            if v > 4 {
                result = append(result, v)
            }
        }
        ```
      options:
        - "[8 5 10]"
        - "[3]"
        - "[3 8 5 10]"
        - "[8 10]"
      answer: 0
      explanation: "В result попадают значения, для которых условие v > 4 истинно: 8, 5 и 10, в исходном порядке."
    - id: "q3"
      type: "single"
      prompt: "Почему запись sorted := slices.Sort(xs) не компилируется?"
      options:
        - "Сортировка возвращает срез, но тип указан неверно."
        - "slices.Sort ничего не возвращает: она меняет xs на месте."
        - "Для сортировки нужно писать sort.Sort."
        - "Срез должен быть массивом."
      answer: 1
      explanation: "Компилятор сообщает: slices.Sort(xs) (no value) used as value. Достаточно вызвать slices.Sort(xs), после чего xs отсортирован."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```go
        xs := []int{4, 9, 2, 9}
        pos := -1
        for i, v := range xs {
            if v == 9 {
                pos = i
                break
            }
        }
        fmt.Println(pos)
        ```
      options:
        - "1"
        - "3"
        - "-1"
        - "9"
      answer: 0
      explanation: "break завершает цикл на первом найденном значении, поэтому pos хранит индекс первой девятки. Начальное -1 - признак «не найдено»."
exercise:
  id: "go.first-steps.slice-algorithms.exercise"
  title: "Сдавшие экзамен по возрастанию"
  prompt: |
    Программа получает число `n` (1 <= n <= 100) и затем `n` целых баллов за экзамен. Экзамен сдан при балле **не ниже 60**.

    Выведите баллы сдавших **по возрастанию** в одной строке через пробел (без пробела в конце). Повторяющиеся баллы выводятся столько раз, сколько они встретились. Если никто не сдал, выведите слово `нет`.

    **Пример.** Ввод

    ```
    6
    75 40 60 92 59 75
    ```

    даёт

    ```
    60 75 75 92
    ```

    Отберите подходящие баллы в новый срез и отсортируйте его функцией `slices.Sort`: пакет нужно добавить в `import`.
  entryFile: "main.go"
  evaluation: "io"
  hints:
    - "Прочитайте все баллы в срез, затем отберите подходящие во второй срез циклом range с условием."
    - "Отбор: if s >= 60 { passed = append(passed, s) }. Граничный балл 60 проходит."
    - "Сортировка: import \"slices\", затем slices.Sort(passed). Функция ничего не возвращает и меняет срез на месте."
    - "Если len(passed) == 0, напечатайте слово «нет» и завершите программу. Иначе выведите числа через пробел, ставя разделитель перед всеми, кроме первого."
  tests:
    - id: "basic"
      title: "Баллы с повторами"
      stdin: "6\n75 40 60 92 59 75\n"
      expected: "60 75 75 92\n"
      hint: "Отобраны 75, 60, 92, 75; после сортировки 60 75 75 92."
    - id: "none"
      title: "Никто не сдал (скрытый)"
      stdin: "3\n10 20 59\n"
      expected: "нет\n"
      hidden: true
      hint: "Если отбор пуст, выводится слово «нет»; 59 ниже порога."
    - id: "all"
      title: "Сдали все (скрытый)"
      stdin: "4\n100 60 80 70\n"
      expected: "60 70 80 100\n"
      hidden: true
      hint: "Отсортированы должны быть все четыре числа; 100 больше 80 как число."
    - id: "single"
      title: "Один результат (скрытый)"
      stdin: "1\n60\n"
      expected: "60\n"
      hidden: true
      hint: "Граница включительна: балл 60 считается сданным."
    - id: "negatives"
      title: "Отрицательные и нулевые баллы (скрытый)"
      stdin: "5\n-5 0 61 60 100\n"
      expected: "60 61 100\n"
      hidden: true
      hint: "Отрицательные баллы и ноль ниже порога и отбрасываются."
