id: "go.first-steps.how-go-runs"
title: "Как выполняется Go: go build, рантайм и ввод-вывод"
goal: "Понять, что делает go build, и написать программу, читающую числа через bufio и fmt.Fscan."
difficulty: "intro"
estimatedMinutes: 30
prerequisites: []
objectives:
  - "Объяснить, что Go компилируется в машинный код с встроенным рантаймом."
  - "Читать stdin через bufio.NewReader и fmt.Fscan."
  - "Различать int, int32, int64 и понимать молчаливое переполнение."
  - "Форматировать вывод через fmt.Printf."
masteryCriteria:
  - "Вы называете, что находится внутри исполняемого файла Go."
  - "Вы используете int64 для суммы и приводите к float64 до деления."
  - "Вы читаете ввод без привязки к разбиению на строки."
related:
  - "python.fundamentals.how-python-runs"
next:
  - "go.first-steps.slices-len-cap-and-append"
tags:
  - "go"
  - "compiler"
  - "stdin"
  - "fmt"
facts:
  - kind: "historical"
    text: "Go был разработан в Google (Роберт Гризмер, Роб Пайк, Кен Томпсон) и опубликован как проект с открытым исходным кодом в ноябре 2009 года."
    sources:
      - "https://go.dev/doc/faq#history"
  - kind: "internals"
    text: "Команда go build компилирует пакеты и зависимости и создаёт исполняемый файл; go run собирает и запускает программу во временном каталоге."
    sources:
      - "https://pkg.go.dev/cmd/go#hdr-Compile_packages_and_dependencies"
  - kind: "misconception"
    text: "«Go нужна виртуальная машина» - неверно: программа компилируется в машинный код, а планировщик и сборщик мусора входят в рантайм, встроенный в исполняемый файл."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что создаёт go build для пакета main?"
      options:
        - "Файл байткода для виртуальной машины."
        - "Только проверку типов, без файла."
        - "Исполняемый файл."
        - "Архив .jar."
      answer: 2
      explanation: "Для пакета main go build создаёт исполняемый файл с машинным кодом и рантаймом Go."
    - id: "q2"
      type: "single"
      prompt: "Что произойдёт, если импортировать пакет и не использовать его?"
      options:
        - "Предупреждение."
        - "Ошибка компиляции."
        - "Ничего."
        - "Паника при запуске."
      answer: 1
      explanation: "Неиспользуемый импорт в Go - ошибка компиляции."
    - id: "q3"
      type: "multiple"
      prompt: "Что верно?"
      options:
        - "Переполнение int32 не вызывает ошибки."
        - "7 / 2 равно 3.5 для int."
        - "int и int64 можно складывать без приведения."
        - "fmt.Printf(\"%.2f\") всегда использует точку."
      answer:
        - 0
        - 3
      explanation: "Для int32 переполнение молчаливое; fmt.Printf не зависит от локали. Деление int на int целочисленное, а смешивать int и int64 без приведения нельзя."
    - id: "q4"
      type: "short"
      prompt: "Какую функцию использовать с bufio.Reader для чтения значения из ввода?"
      answer:
        - "fmt.Fscan"
        - "Fscan"
      explanation: "fmt.Fscan(reader, &x) читает значение, разделённое пробельными символами, из reader."
exercise:
  id: "go.first-steps.how-go-runs.exercise"
  title: "Статистика по числам из stdin"
  prompt: |

    Программа получает на вход число `n` (1 <= n <= 1000), а затем `n` целых чисел, каждое из которых по модулю не больше 2 000 000 000.
    Числа могут быть разбросаны по строкам как угодно и разделены любым количеством пробелов и переводов строк.

    Выведите ровно четыре строки:

    ```
    sum=<сумма>
    min=<наименьшее>
    max=<наибольшее>
    avg=<среднее арифметическое с двумя знаками после точки>
    ```

    **Пример.** Ввод `4` и затем `1 2 3 4` даёт

    ```
    sum=10
    min=1
    max=4
    avg=2.50
    ```

    Среднее печатайте с точкой как десятичным разделителем, независимо от региональных настроек системы.
    Сумма может не поместиться в 32 бита, учитывайте это.
  entryFile: "main.go"
  evaluation: "io"
  hints:
    - "Оберните stdin: in := bufio.NewReader(os.Stdin). fmt.Fscan(in, &n) читает n, а fmt.Fscan(in, &x) - очередное число; переводы строк и пробелы пропускаются."
    - "Сумму и сами числа храните в int64: 4000000000 не поместится в int32."
    - "Для первого числа сразу задайте min и max (проверка i == 0), чтобы отрицательные числа работали."
    - "Среднее: float64(sum)/float64(n), формат %.2f. fmt всегда печатает точку."
  tests:
    - id: "basic"
      title: "Числа в одной строке"
      stdin: "4\n1 2 3 4\n"
      expected: "sum=10\nmin=1\nmax=4\navg=2.50\n"
      hint: "Нужны четыре строки sum=, min=, max=, avg=."
    - id: "lines"
      title: "Числа на разных строках"
      stdin: "3\n10\n20\n30\n"
      expected: "sum=60\nmin=10\nmax=30\navg=20.00\n"
      hint: "fmt.Fscan пропускает переводы строк между числами."
    - id: "single"
      title: "Одно число"
      stdin: "1\n7\n"
      expected: "sum=7\nmin=7\nmax=7\navg=7.00\n"
      hint: "При n = 1 min, max и sum совпадают, avg = 7.00."
    - id: "negatives"
      title: "Отрицательные числа (скрытый)"
      stdin: "5\n-3 -1 -4 -1 -5\n"
      expected: "sum=-14\nmin=-5\nmax=-1\navg=-2.80\n"
      hidden: true
      hint: "min и max нельзя начинать с 0."
    - id: "whitespace"
      title: "Лишние пробелы и пустые строки (скрытый)"
      stdin: "3\n  5   2\n\n 2\n"
      expected: "sum=9\nmin=2\nmax=5\navg=3.00\n"
      hidden: true
      hint: "fmt.Fscan пропускает лишние пробелы и пустые строки."
    - id: "rounding"
      title: "Округление среднего (скрытый)"
      stdin: "3\n1 2 2\n"
      expected: "sum=5\nmin=1\nmax=2\navg=1.67\n"
      hidden: true
      hint: "Приведите к float64 до деления: 5/3 даёт 1.67."
    - id: "big-sum"
      title: "Сумма больше 32-битного диапазона (скрытый)"
      stdin: "2\n2000000000 2000000000\n"
      expected: "sum=4000000000\nmin=2000000000\nmax=2000000000\navg=2000000000.00\n"
      hidden: true
      hint: "Сумма 4000000000 не помещается в int32. Используйте int64."
