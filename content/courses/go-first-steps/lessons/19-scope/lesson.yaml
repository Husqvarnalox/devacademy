id: "go.first-steps.scope"
title: "Область видимости"
goal: "Определять, где видна переменная, и находить ошибки, возникающие из-за затенения переменных."
difficulty: "easy"
estimatedMinutes: 35
prerequisites:
  - "go.first-steps.return-values"
objectives:
  - "Находить границы блока { ... } и определять, где переменная существует."
  - "Объяснять, что внутренний блок видит переменные внешнего, а внешний внутренние - нет."
  - "Отличать := (новая переменная) от = (присваивание существующей) в блоке, где есть переменная с тем же именем."
  - "Находить и исправлять ошибку затенения."
masteryCriteria:
  - "Функция sumMultiples накапливает сумму во внешней переменной и возвращает верный результат."
  - "Функция sign объявляет word во внешнем блоке и присваивает значение в ветках."
  - "Вы предсказываете вывод программы, в которой внутренняя переменная скрывает внешнюю."
concepts:
  introduces:
    - "go.scope"
    - "go.shadowing"
  uses:
    - "go.func"
    - "go.parameter"
    - "go.return"
    - "go.variable"
    - "go.short-declaration"
    - "go.assignment"
    - "go.if"
    - "go.for-loop"
    - "go.int"
    - "go.string"
    - "go.remainder"
    - "go.println"
    - "go.compile-error"
next:
  - "go.first-steps.errors-first-look"
tags:
  - "go"
  - "scope"
  - "shadowing"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```go
        x := 1
        if true {
            x := 2
            fmt.Println(x)
        }
        fmt.Println(x)
        ```
      options:
        - "2 и затем 2"
        - "2 и затем 1"
        - "1 и затем 1"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Внутри if := создаёт новую переменную x, которая скрывает внешнюю. Внутри блока печатается 2, после блока - внешняя x, которая не менялась: 1."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```go
        x := 1
        if true {
            x = 2
        }
        fmt.Println(x)
        ```
      options:
        - "1"
        - "2"
        - "Ошибка компиляции"
        - "0"
      answer: 1
      explanation: "Знак = не создаёт переменную, а меняет существующую. Внутренний блок видит внешнюю x и записывает в неё 2."
    - id: "q3"
      type: "single"
      prompt: |
        Почему эта программа не компилируется?

        ```go
        for i := 0; i < 3; i++ {
        }
        fmt.Println(i)
        ```
      options:
        - "Нельзя печатать после цикла."
        - "Переменная i существует только внутри цикла for."
        - "i должна быть объявлена через var."
        - "Цикл ничего не делает."
      answer: 1
      explanation: "Переменная, объявленная в заголовке for, видна только в цикле. После него имя i неизвестно: undefined: i."
    - id: "q4"
      type: "single"
      prompt: "Какая переменная видна в функции f, если она объявлена в main?"
      options:
        - "Любая: все функции видят переменные друг друга."
        - "Никакая: у каждой функции свои переменные, значения передают через параметры и return."
        - "Только числовые."
        - "Только объявленные через var."
      answer: 1
      explanation: "Локальные переменные существуют внутри своей функции. Чтобы передать значение, используют параметры, а чтобы получить результат - return."
exercise:
  id: "go.first-steps.scope.exercise"
  title: "Найти и исправить затенение"
  prompt: |
    В `main.go` две функции с ошибками, связанными с областью видимости. Исправьте обе.

    **`sumMultiples(n, k int) int`** должна вернуть сумму чисел от 1 до `n`, которые делятся на `k` без остатка. Например, `sumMultiples(10, 3)` равно `3 + 6 + 9 = 18`. Сейчас программа собирается, но функция возвращает `0`: внутри `if` создаётся новая переменная `sum`, и внешняя не меняется. Запустите программу кнопкой «Запустить»: отладочные строки покажут рост «внутренней» суммы.

    **`sign(n int) string`** должна вернуть `"отрицательное"`, `"ноль"` или `"положительное"`. Сейчас она не компилируется: переменная `word` объявлена внутри веток и не видна в `return`. Прочитайте сообщение компилятора.

    Оставьте имена и типы параметров как есть. Отладочный вывод в `sumMultiples` можно удалить.

    **Как проверяется.** Кнопка «Проверить» запускает готовые проверки: каждая вызывает ваши функции с разными значениями (в том числе без подходящих чисел и с нулём) и сравнивает результат с ожидаемым.
  entryFile: "main.go"
  evaluation: "command"
  languageId: "go"
  starter: "exercise/starter"
  solution: "exercise/solution"
  tests_dir: "exercise/tests"
  command:
    run: ["go", "test", "-json", "-count=1", "./..."]
    report: "go-test-json"
    testsTarget: "."
    timeoutSeconds: 45
  hints:
    - "Обе ошибки одного рода: переменная объявлена не в том блоке. Для sumMultiples смотрите на знак := внутри if, для sign - на то, где объявлена word."
    - "В sumMultiples переменная sum уже есть во внешнем блоке. Внутри if нужно не объявлять новую, а изменить существующую."
    - "В sign объявите word до if: var word string. Тогда в ветках остаётся только присваивание word = \"...\"."
    - "sum = sum + i (без двоеточия) меняет внешнюю переменную. В sign: var word string, а в каждой ветке word = \"отрицательное\" и так далее."
  tests:
    - id: "sum-basic"
      title: "sumMultiples: сумма кратных"
      match: "TestSumMultiples/ten_by_three"
      hint: "Для 10 и 3 нужно получить 3 + 6 + 9. Если результат 0, значит, внешняя sum не меняется."
    - id: "sign-basic"
      title: "sign: отрицательное число"
      match: "TestSign/negative"
      hint: "Функция должна собраться и вернуть строку для отрицательного числа."
    - id: "sum-edges"
      title: "sumMultiples: нет кратных, ноль и единица (скрытый)"
      match: "TestSumMultiples/*"
      hidden: true
      hint: "Проверяются случаи без подходящих чисел, n = 0, k = 1 и n, кратное k."
    - id: "sign-all"
      title: "sign: ноль и положительные (скрытый)"
      match: "TestSign/*"
      hidden: true
      hint: "Все три ветки должны записывать значение в одну и ту же переменную, видимую в return."
