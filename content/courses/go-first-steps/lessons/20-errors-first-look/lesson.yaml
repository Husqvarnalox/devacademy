id: "go.first-steps.errors-first-look"
title: "Ошибка как значение"
goal: "Перевести строку в число с помощью strconv.Atoi, обработать возможную ошибку и вернуть собственную ошибку через errors.New."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "go.first-steps.scope"
objectives:
  - "Объяснить, что в Go ошибка - обычное значение типа error, а nil означает отсутствие ошибки."
  - "Переводить строку в число через strconv.Atoi и проверять err != nil."
  - "Создавать собственную ошибку через errors.New и возвращать её из функции."
  - "Завершать функцию раньше при ошибке и не использовать значение, полученное вместе с ошибкой."
masteryCriteria:
  - "parseAge возвращает возраст и nil для корректной строки от 0 до 150."
  - "parseAge возвращает 0 и ошибку для нечисла, пустой строки, дробного числа и значений вне диапазона."
  - "Вы объясняете, почему значение рядом с ненулевой ошибкой нельзя считать правильным."
concepts:
  introduces:
    - "go.error-value"
    - "go.strconv-atoi"
    - "go.errors-new"
  uses:
    - "go.func"
    - "go.parameter"
    - "go.return"
    - "go.multiple-returns"
    - "go.if"
    - "go.comparison"
    - "go.logical-operators"
    - "go.int"
    - "go.string"
    - "go.import"
    - "go.scan"
    - "go.println"
    - "go.short-declaration"
    - "go.scope"
next:
  - "go.first-steps.arrays"
tags:
  - "go"
  - "error"
  - "strconv"
facts:
  - kind: "internals"
    text: "error в Go - встроенный интерфейс с единственным методом Error() string; значение nil этого типа означает «ошибки нет»."
    sources:
      - "https://go.dev/ref/spec#Errors"
  - kind: "internals"
    text: "strconv.Atoi эквивалентна ParseInt(s, 10, 0), приведённому к типу int; при неверном синтаксисе или выходе за диапазон она возвращает ошибку."
    sources:
      - "https://pkg.go.dev/strconv#Atoi"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```go
        n, err := strconv.Atoi("12a")
        if err != nil {
            fmt.Println("ошибка")
        } else {
            fmt.Println(n + 1)
        }
        ```
      options:
        - "13"
        - "ошибка"
        - "1"
        - "Паника"
      answer: 1
      explanation: "Строка «12a» не число, Atoi возвращает ненулевую ошибку, и выполняется ветка с сообщением. Программа не падает: ошибка - обычное значение, которое нужно проверить."
    - id: "q2"
      type: "single"
      prompt: "Что означает err == nil после вызова функции?"
      options:
        - "Произошла ошибка."
        - "Ошибки нет, результат можно использовать."
        - "Функция ничего не вернула."
        - "Функция завершилась досрочно."
      answer: 1
      explanation: "nil в позиции ошибки означает «всё хорошо». Только в этом случае значение, возвращённое вместе с ошибкой, имеет смысл."
    - id: "q3"
      type: "single"
      prompt: |
        Что произойдёт при вызове parse("abc")?

        ```go
        func parse(s string) int {
            n, _ := strconv.Atoi(s)
            return n
        }
        ```
      options:
        - "Программа завершится с ошибкой."
        - "Функция вернёт 0, и вызывающий код не узнает, что строка была неверной."
        - "Функция вернёт -1."
        - "Ошибка компиляции."
      answer: 1
      explanation: "Символ _ отбрасывает ошибку. Atoi при ошибке возвращает 0, и программа молча продолжает работать с неверными данными. Лучше вернуть ошибку вызывающему коду."
    - id: "q4"
      type: "single"
      prompt: "Как создать ошибку с собственным текстом?"
      options:
        - "errors.New(\"текст\")"
        - "error(\"текст\")"
        - "fmt.Error(\"текст\")"
        - "new error \"текст\""
      answer: 0
      explanation: "Функция errors.New из пакета errors возвращает значение типа error с заданным текстом. Не забудьте добавить \"errors\" в import."
    - id: "q5"
      type: "single"
      prompt: "Почему в Go принято проверять ошибку сразу после вызова?"
      options:
        - "Иначе программа не скомпилируется."
        - "Значение рядом с ошибкой может быть бессмысленным, и ошибка не пропадёт сама."
        - "Ошибка исчезает после следующей строки."
        - "Так быстрее работает программа."
      answer: 1
      explanation: "Go не прерывает программу сам при ошибке: нужно вручную проверить err и решить, что делать. Пропущенная проверка приводит к работе с неверными данными."
exercise:
  id: "go.first-steps.errors-first-look.exercise"
  title: "parseAge: возраст из строки"
  prompt: |
    Напишите функцию **`parseAge(s string) (int, error)`**, которая переводит строку в возраст человека.

    * Если строка не является целым числом (буквы, пустая строка, дробное число, пробелы вокруг числа), верните `0` и ошибку.
    * Если число меньше `0` или больше `150`, верните `0` и ошибку с собственным текстом (создайте её через `errors.New`).
    * Иначе верните возраст и `nil`.

    Примеры: `parseAge("25")` возвращает `25, nil`; `parseAge("abc")` возвращает `0` и ошибку; `parseAge("151")` возвращает `0` и ошибку.

    В заготовке уже есть `main`, которая читает слово из ввода и печатает результат или ошибку. Для перевода строки в число добавьте пакет `strconv` в `import`.

    **Как проверяется.** Кнопка «Проверить» запускает готовые проверки: они вызывают `parseAge` с разными строками (корректными и нет, на границах диапазона 0 и 150) и проверяют, есть ли ошибка и какое число вернулось. Текст вашей ошибки не сравнивается, но он не должен быть пустым.
  entryFile: "main.go"
  evaluation: "command"
  languageId: "go"
  starter: "exercise/starter"
  solution: "exercise/solution"
  tests_dir: "exercise/tests"
  command:
    run: ["go", "test", "-json", "-count=1", "./..."]
    report: "go-test-json"
    testsTarget: "."
    timeoutSeconds: 45
  hints:
    - "Работа делится на два шага: сначала перевести строку в число и проверить ошибку перевода, потом проверить диапазон."
    - "Перевод: age, err := strconv.Atoi(s). Если err != nil, сразу return 0, err. Не забудьте добавить \"strconv\" в import."
    - "Диапазон: if age < 0 || age > 150 { return 0, errors.New(\"...\") }. Граничные значения 0 и 150 допустимы."
    - "После обеих проверок верните return age, nil. Порядок: Atoi, проверка err, проверка диапазона, возврат результата."
  tests:
    - id: "valid-basic"
      title: "Корректный возраст"
      match: "TestParseAgeValid/typical"
      hint: "Для строки «25» результат 25 и ошибка nil."
    - id: "invalid-letters"
      title: "Строка не число"
      match: "TestParseAgeInvalid/letters"
      hint: "Ошибку перевода от Atoi нужно проверить и вернуть вместе с нулём."
    - id: "valid-bounds"
      title: "Границы диапазона 0 и 150 (скрытый)"
      match: "TestParseAgeValid/*"
      hidden: true
      hint: "0 и 150 - допустимые значения: сравнения должны быть строгими (< 0 и > 150)."
    - id: "invalid-all"
      title: "Некорректные строки и значения вне диапазона (скрытый)"
      match: "TestParseAgeInvalid/*"
      hidden: true
      hint: "Проверяются пустая строка, дробное число, пробелы, переполнение и числа за границами 0 и 150; при ошибке возвращается 0."
