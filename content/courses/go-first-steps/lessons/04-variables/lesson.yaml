id: "go.first-steps.variables"
title: "Переменные"
goal: "Объявить переменные двумя способами, изменить их значения и использовать в выводе."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "go.first-steps.output"
objectives:
  - "Объявлять переменную через var и через короткую форму :=."
  - "Менять значение существующей переменной присваиванием =."
  - "Объяснять, чем объявление отличается от присваивания и почему переменная копирует значение."
masteryCriteria:
  - "Программа объявляет переменные name и purchases и печатает их значения до и после изменения."
  - "Вы отличаете := (создать) от = (изменить) и предсказываете значения после копирования переменной."
concepts:
  introduces:
    - "go.variable"
    - "go.short-declaration"
    - "go.assignment"
  uses:
    - "go.println"
    - "go.string-literal"
    - "go.print-values"
    - "go.newline"
next:
  - "go.first-steps.basic-types"
tags:
  - "go"
  - "variable"
  - "assignment"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```go
        a := 5
        b := a
        a = 9
        fmt.Println(a, b)
        ```
      options:
        - "9 9"
        - "5 5"
        - "9 5"
        - "5 9"
      answer: 2
      explanation: "b получила копию значения 5 в момент объявления. Последующее изменение a не затрагивает b."
    - id: "q2"
      type: "single"
      prompt: |
        Что не так в коде?

        ```go
        x := 1
        x := 2
        fmt.Println(x)
        ```
      options:
        - "Ничего, x станет 2."
        - "Вторая строка пытается создать x заново: no new variables on left side of :=."
        - "Нельзя использовать имя x."
        - "Println нельзя вызывать с переменной."
      answer: 1
      explanation: ":= создаёт новую переменную. Чтобы изменить существующую, нужен знак = без двоеточия: x = 2."
    - id: "q3"
      type: "single"
      prompt: "Что сообщит компилятор о программе, где переменная объявлена как count := 3, но нигде не используется?"
      options:
        - "Ничего, программа соберётся."
        - "declared and not used: count"
        - "undefined: count"
        - "Предупреждение, но программа запустится."
      answer: 1
      explanation: "В Go неиспользуемая локальная переменная - ошибка компиляции. Это помогает найти опечатки и забытый код."
    - id: "q4"
      type: "multiple"
      prompt: "Какие записи объявляют переменную?"
      options:
        - "var city = \"Омск\""
        - "city := \"Омск\""
        - "city = \"Омск\" (до того, как city объявлена)"
        - "var := city"
      answer:
        - 0
        - 1
      explanation: "var и := создают переменную. Присваивание = без объявления ссылается на несуществующее имя: undefined: city."
    - id: "q5"
      type: "short"
      prompt: "Какой оператор нужно использовать, чтобы изменить значение уже объявленной переменной score? Запишите знак."
      answer:
        - "="
      explanation: "Одиночный = - присваивание. := создаёт новую переменную, а повторное объявление приведёт к ошибке."
exercise:
  id: "go.first-steps.variables.exercise"
  title: "Приветствие с переменными"
  prompt: |
    В программе заготовлен каркас. Допишите её так, чтобы она:

    1. объявила переменную `name` со значением `"Мария"` и переменную `purchases` со значением `3`;
    2. напечатала приветствие;
    3. напечатала число покупок;
    4. изменила `purchases` на `4` и напечатала число покупок ещё раз.

    Вывод:

    ```
    Здравствуйте, Мария!
    Покупок: 3
    Покупок: 4
    ```
  entryFile: "main.go"
  evaluation: "io"
  hints:
    - "Для первой строки подойдёт fmt.Print: он не ставит пробелов между текстами и не переводит строку, а перевод строки можно дописать в конец последнего текста."
    - "Приветствие: fmt.Print(\"Здравствуйте, \", name, \"!\\n\"). Все три значения - текст, поэтому лишних пробелов не будет."
    - "Число покупок: fmt.Println(\"Покупок:\", purchases). Значение меняется присваиванием purchases = 4, без двоеточия."
    - "Последовательность: приветствие, Println покупок, присваивание purchases = 4, ещё один Println."
  tests:
    - id: "basic"
      title: "Приветствие и изменение"
      stdin: ""
      expected: |
        Здравствуйте, Мария!
        Покупок: 3
        Покупок: 4
      hint: "Три строки: приветствие, 3 покупки, затем 4 покупки после присваивания."
    - id: "exact"
      title: "Знаки препинания и значения (скрытый)"
      stdin: ""
      expected: |
        Здравствуйте, Мария!
        Покупок: 3
        Покупок: 4
      hidden: true
      hint: "Проверяется восклицательный знак после имени без пробела перед ним и то, что значение изменилось на 4 после присваивания."
