id: "go.first-steps.mini-project-expenses"
title: "Мини-проект: учёт расходов"
goal: "Собрать вместе построчное чтение, разбор строк, карты и сортировку и написать законченную программу, которая не падает на плохих данных."
difficulty: "easy"
estimatedMinutes: 60
prerequisites:
  - "go.first-steps.text-lines"
objectives:
  - "Разбирать строки формата «категория сумма» и суммировать по категориям в карте."
  - "Считать и пропускать некорректные строки вместо падения программы."
  - "Выводить результат в детерминированном порядке через отсортированные ключи."
  - "Самостоятельно спланировать программу из знакомых частей."
masteryCriteria:
  - "Программа верно обрабатывает корректные, пустые и некорректные строки."
  - "Категории выводятся по алфавиту, затем итог и число пропущенных строк."
