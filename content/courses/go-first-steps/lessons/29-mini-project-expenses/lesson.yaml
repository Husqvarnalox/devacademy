    - "go.range"
    - "go.slices-sort"
    - "go.for-loop"
    - "go.break-continue"
    - "go.if"
    - "go.comparison"
    - "go.logical-operators"
    - "go.int"
    - "go.string"
    - "go.import"
    - "go.printf"
    - "go.println"
    - "go.multiple-returns"
    - "go.short-declaration"
    - "go.assignment"
    - "go.arithmetic"
next: []
tags:
  - "go"
  - "mini-project"
  - "map"
  - "scanner"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```go
        sums := map[string]int{}
        sums["чай"] += 100
        sums["чай"] += 50
        fmt.Println(sums["чай"], sums["кофе"])
        ```
      options:
        - "150 0"
        - "100 0"
        - "150 и ошибка: ключа нет"
        - "50 0"
      answer: 0
      explanation: "Для отсутствующего ключа карта даёт нулевое значение, поэтому += работает сразу. Чтение несуществующего ключа даёт 0, а не ошибку."
    - id: "q2"
      type: "single"
      prompt: "Почему в этой программе нельзя печатать категории прямо в цикле for k, v := range sums?"
      options:
        - "Порядок обхода карты не определён и может меняться, а вывод должен быть всегда одинаковым."
        - "range не работает с картами."
        - "Карта хранит только числа."
        - "Печать внутри range запрещена."
      answer: 0
      explanation: "Чтобы вывод был одинаковым при каждом запуске, ключи собирают в срез, сортируют через slices.Sort и печатают по порядку."
    - id: "q3"
      type: "single"
      prompt: "Строка «еда 12x». Как программа должна на неё отреагировать?"
      options:
        - "Atoi вернёт ошибку: строку считают некорректной, увеличивают счётчик пропусков и переходят к следующей."
        - "Atoi вернёт 12, остальное игнорируется."
        - "Программа должна завершиться с паникой."
        - "Строку нужно прибавить к сумме как 0."
      answer: 0
      explanation: "strconv.Atoi принимает только строку, целиком состоящую из числа. При ошибке запись считают плохой и пропускают."
exercise:
  id: "go.first-steps.mini-project-expenses.exercise"
  title: "Учёт расходов"
  prompt: |
    Напишите программу, которая читает список расходов и печатает сводку по категориям. Ввод идёт построчно до конца. Корректная строка состоит ровно из двух слов: категории (одно слово) и суммы в рублях (целое положительное число), например `еда 350`.

    Правила:

    * пустые строки (и строки из одних пробелов) просто игнорируются и не считаются ошибкой;
    * строка некорректна, если в ней не два слова, или сумма не является целым числом, или сумма не больше нуля. Такие строки пропускаются, но считаются;
    * суммы одной категории складываются.

    Вывод:

    1. по строке на категорию в алфавитном порядке (сравнение по кодам символов): `<категория>: <сумма>`;
    2. строка `Итого: <общая сумма>`;
    3. строка `Пропущено: <число некорректных строк>`.

    Если корректных записей нет, список категорий пуст, но две последние строки печатаются всё равно.

    **Пример.** Ввод

    ```
    еда 350
    транспорт 120
    еда 90

    кофе много
    книги -5
    кино 200 вечер
    ```

    даёт

    ```
    еда: 440
    транспорт: 120
    Итого: 560
    Пропущено: 3
    ```

    Подсказка по плану: заведите карту `map[string]int` для сумм, счётчики итога и пропусков; разберите строку; затем соберите ключи в срез, отсортируйте и выведите.
  entryFile: "main.go"
  evaluation: "io"
  hints:
    - "Структура: цикл for sc.Scan(); внутри strings.Fields; пустой срез - continue; len(fields) != 2 - пропуск; strconv.Atoi; ошибка или значение <= 0 - пропуск."
    - "Суммы: sums[fields[0]] += amount. Для отсутствующего ключа карта даёт 0, отдельная инициализация не нужна."
    - "После цикла: categories := []string{}, for c := range sums { categories = append(categories, c) }, slices.Sort(categories)."
    - "Не забудьте импорты: bufio, fmt, os, slices, strconv, strings. Итог и пропуски печатаются всегда, даже если категорий нет."
  tests:
    - id: "example"
      title: "Пример из условия"
      stdin: "еда 350\nтранспорт 120\nеда 90\n\nкофе много\nкниги -5\nкино 200 вечер\n"
      expected: "еда: 440\nтранспорт: 120\nИтого: 560\nПропущено: 3\n"
      hint: "Три плохие строки: сумма не число, сумма отрицательна, три слова вместо двух. Пустая строка не считается."
    - id: "sorted"
      title: "Алфавитный порядок (скрытый)"
      stdin: "яблоки 10\nарбуз 20\nхлеб 5\nарбуз 1\n"
      expected: "арбуз: 21\nхлеб: 5\nяблоки: 10\nИтого: 36\nПропущено: 0\n"
      hidden: true
      hint: "Выведите ключи в отсортированном порядке, а не в порядке обхода карты."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: "Итого: 0\nПропущено: 0\n"
      hidden: true
      hint: "Даже без записей печатаются строки итога и пропусков."
    - id: "all-bad"
      title: "Только плохие строки (скрытый)"
      stdin: "еда\nеда 0\nеда 1.5\nеда абв\n   \nеда 10 20\n"
      expected: "Итого: 0\nПропущено: 5\n"
      hidden: true
      hint: "Ноль, дробное число, слово и лишние слова - плохие строки; строка из пробелов игнорируется и не считается."
    - id: "spaces"
      title: "Лишние пробелы (скрытый)"
      stdin: "  еда    100  \nеда\t50\n"
      expected: "еда: 150\nИтого: 150\nПропущено: 0\n"
      hidden: true
      hint: "strings.Fields игнорирует лишние пробелы и табуляции."
