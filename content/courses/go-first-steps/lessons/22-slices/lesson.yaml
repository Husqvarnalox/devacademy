id: "go.first-steps.slices"
title: "Срезы"
goal: "Хранить последовательность значений, длина которой заранее неизвестна, и добавлять в неё элементы с помощью append."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "go.first-steps.arrays"
objectives:
  - "Объявлять срез, задавать его литералом и получать длину через len."
  - "Добавлять элементы функцией append и сохранять результат в переменную."
  - "Читать заранее неизвестное число значений в срез и обходить его по индексам."
  - "Объяснять разницу между срезом и массивом: длина среза меняется."
masteryCriteria:
  - "Программа читает n чисел в срез и печатает их в обратном порядке через пробел без пробела в конце."
  - "Программа корректно обрабатывает n = 1 и отрицательные числа."
  - "Вы объясняете, почему результат append нужно присвоить переменной."
concepts:
  introduces:
    - "go.slice"
    - "go.append"
  uses:
    - "go.array"
    - "go.index"
    - "go.len"
    - "go.for-loop"
    - "go.if"
    - "go.comparison"
    - "go.int"
    - "go.string"
    - "go.variable"
    - "go.short-declaration"
    - "go.assignment"
    - "go.scan"
    - "go.print-values"
    - "go.println"
    - "go.zero-value"
    - "go.arithmetic"
next:
  - "go.first-steps.range"
tags:
  - "go"
  - "slice"
  - "append"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```go
        s := []int{1, 2}
        s = append(s, 3)
        s = append(s, 4, 5)
        fmt.Println(s, len(s))
        ```
      options:
        - "[1 2 3 4 5] 5"
        - "[1 2] 2"
        - "[3 4 5] 3"
        - "[1 2 3 4 5] 3"
      answer: 0
      explanation: "append возвращает срез с добавленными элементами, и результат сохраняется в s. После двух вызовов в срезе пять элементов."
    - id: "q2"
      type: "single"
      prompt: |
        Что не так с этим кодом?

        ```go
        var s []int
        append(s, 7)
        fmt.Println(len(s))
        ```
      options:
        - "Ничего: напечатается 1."
        - "Результат append не используется: компилятор сообщает об ошибке."
        - "Нужно сначала создать срез через new."
        - "len нельзя применять к срезу."
      answer: 1
      explanation: "append не меняет переданный срез на месте, а возвращает новый. Компилятор сообщает: append(s, 7) (value of type []int) is not used. Правильно: s = append(s, 7)."
    - id: "q3"
      type: "single"
      prompt: |
        Чему равны len(s) и s после var s []int?

        ```go
        var s []int
        fmt.Println(len(s), s)
        ```
      options:
        - "0 []"
        - "1 [0]"
        - "Ошибка: срез нужно создать до использования"
        - "nil nil"
      answer: 0
      explanation: "Нулевое значение среза - пустой срез: длина 0, печатается как []. К нему сразу можно применять append."
    - id: "q4"
      type: "single"
      prompt: |
        Что произойдёт?

        ```go
        s := []int{4, 5, 6}
        fmt.Println(s[3])
        ```
      options:
        - "Напечатается 0."
        - "Паника: index out of range [3] with length 3."
        - "Напечатается 6."
        - "Ошибка компиляции."
      answer: 1
      explanation: "Допустимы индексы 0..2. Длина среза известна только при запуске, поэтому выход за границы даёт панику, а не ошибку компиляции."
    - id: "q5"
      type: "single"
      prompt: "Чем срез удобнее массива для чтения n чисел из ввода?"
      options:
        - "У среза не бывает индексов."
        - "Длину массива нельзя задать числом, прочитанным во время работы, а срез растёт через append."
        - "Срез хранит значения разных типов."
        - "Массив не позволяет читать числа."
      answer: 1
      explanation: "Длина массива известна при компиляции. Срез же можно наращивать по мере появления данных."
exercise:
  id: "go.first-steps.slices.exercise"
  title: "Числа в обратном порядке"
  prompt: |
    Программа получает число `n` (1 <= n <= 100), а затем `n` целых чисел. Выведите эти числа в обратном порядке в одной строке, разделив пробелами. Пробела в конце строки быть не должно.

    **Пример.** Ввод

    ```
    5
    1 2 3 4 5
    ```

    даёт

    ```
    5 4 3 2 1
    ```

    Числа могут быть записаны на одной строке или на разных. Храните их в срезе: размер массива заранее неизвестен.
  entryFile: "main.go"
  evaluation: "io"
  hints:
    - "Заведите пустой срез var nums []int и в цикле от 0 до n-1 читайте очередное число через fmt.Scan(&x), добавляя его: nums = append(nums, x)."
    - "Чтобы напечатать в обратном порядке, пройдите по индексам от последнего к первому: for i := len(nums) - 1; i >= 0; i--."
    - "Пробел ставьте перед каждым числом, кроме первого напечатанного (то есть кроме индекса len(nums)-1): тогда в конце его не будет."
    - "После цикла вызовите fmt.Println() без аргументов, чтобы завершить строку."
  tests:
    - id: "basic"
      title: "Пять чисел"
      stdin: "5\n1 2 3 4 5\n"
      expected: "5 4 3 2 1\n"
      hint: "Первое число ввода должно оказаться последним в выводе."
    - id: "single"
      title: "Одно число (скрытый)"
      stdin: "1\n42\n"
      expected: "42\n"
      hidden: true
      hint: "При n = 1 выводится одно число без пробелов."
    - id: "negatives"
      title: "Отрицательные числа и повторы (скрытый)"
      stdin: "4\n-1 0 -1 7\n"
      expected: "7 -1 0 -1\n"
      hidden: true
      hint: "Знак минус относится к числу, повторяющиеся значения выводятся все."
    - id: "lines"
      title: "Числа на разных строках (скрытый)"
      stdin: "3\n10\n20\n30\n"
      expected: "30 20 10\n"
      hidden: true
      hint: "Scan не различает пробелы и переводы строк между числами."
    - id: "two"
      title: "Два числа (скрытый)"
      stdin: "2\n100 200\n"
      expected: "200 100\n"
      hidden: true
      hint: "Между числами ровно один пробел, после последнего - только перевод строки."
