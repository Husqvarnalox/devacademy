id: "go.first-steps.basic-types"
title: "Базовые типы"
goal: "Выбрать для значения подходящий тип (int, float64, string, bool) и предсказать нулевое значение переменной."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "go.first-steps.variables"
objectives:
  - "Назвать четыре базовых типа и значения, которые в них хранятся."
  - "Объявить переменную с явным типом через var и с типом по значению через :=."
  - "Объяснить, почему нельзя положить значение одного типа в переменную другого и что такое нулевое значение."
masteryCriteria:
  - "Программа объявляет пять переменных нужных типов и печатает их, включая переменную без начального значения."
  - "Вы называете нулевое значение каждого из четырёх типов."
concepts:
  introduces:
    - "go.type"
    - "go.int"
    - "go.float64"
    - "go.string"
    - "go.bool"
    - "go.zero-value"
  uses:
    - "go.variable"
    - "go.short-declaration"
    - "go.assignment"
    - "go.println"
    - "go.print-values"
    - "go.string-literal"
next:
  - "go.first-steps.arithmetic"
tags:
  - "go"
  - "types"
  - "zero-value"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Какой тип подходит для цены 49.9?"
      options:
        - "int"
        - "float64"
        - "string"
        - "bool"
      answer: 1
      explanation: "Число с дробной частью хранят в float64. int хранит только целые числа."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```go
        var ok bool
        var n int
        fmt.Println(ok, n)
        ```
      options:
        - "false 0"
        - "true 0"
        - "0 0"
        - "Программа не соберётся: переменные без значения запрещены."
      answer: 0
      explanation: "Переменная, объявленная без значения, получает нулевое значение своего типа: для bool это false, для int - 0."
    - id: "q3"
      type: "single"
      prompt: "Почему не компилируется var count int = \"5\"?"
      options:
        - "Потому что 5 - слишком большое число."
        - "Потому что \"5\" - текст, а count имеет тип int."
        - "Потому что имя count занято."
        - "Потому что нужно писать :=."
      answer: 1
      explanation: "В кавычках записан текст (тип string). Go не превращает текст в число автоматически: cannot use \"5\" (untyped string constant) as int value."
    - id: "q4"
      type: "multiple"
      prompt: "Что верно о нулевых значениях?"
      options:
        - "У string нулевое значение - пустая строка."
        - "У float64 нулевое значение - 0."
        - "У bool нулевое значение - true."
        - "Они появляются, когда переменную объявили без значения."
      answer:
        - 0
        - 1
        - 3
      explanation: "Нулевое значение bool - false, а не true. Остальные утверждения верны."
    - id: "q5"
      type: "single"
      prompt: "Что станет с переменной в записи price := 12.5, если позже написать price = 10?"
      options:
        - "Ошибки нет: 10 подходит для float64, значение станет 10."
        - "Ошибка: 10 - целое число."
        - "Переменная сменит тип на int."
        - "Ошибка: нельзя менять значение."
      answer: 0
      explanation: "Число 10 без дробной части подходит и для float64, поэтому присваивание допустимо. Тип переменной остаётся float64."
exercise:
  id: "go.first-steps.basic-types.exercise"
  title: "Карточка товара"
  prompt: |
    Допишите объявления переменных и получите такой вывод:

    ```
    Товар: Чай
    Цена: 12.5
    Количество: 4
    В наличии: true
    Скидка: 0
    ```

    Переменные и их типы:

    * `productName` - `string`, значение `"Чай"`;
    * `price` - `float64`, значение `12.5`;
    * `quantity` - `int`, значение `4`;
    * `inStock` - `bool`, значение `true`;
    * `discount` - `float64`, **начальное значение не задавайте**: нужное `0` даст нулевое значение типа.

    Команды вывода уже написаны.
  entryFile: "main.go"
  evaluation: "io"
  hints:
    - "Все пять переменных нужно объявить выше команд Println."
    - "Для переменной с типом пишите var имя тип = значение, например var quantity int = 4."
    - "Для discount значение не нужно: var discount float64."
    - "Пять объявлений: var productName string = \"Чай\", var price float64 = 12.5, var quantity int = 4, var inStock bool = true, var discount float64."
  tests:
    - id: "basic"
      title: "Карточка товара"
      stdin: ""
      expected: |
        Товар: Чай
        Цена: 12.5
        Количество: 4
        В наличии: true
        Скидка: 0
      hint: "Должно быть пять строк с значениями всех переменных."
    - id: "zero"
      title: "Нулевое значение (скрытый)"
      stdin: ""
      expected: |
        Товар: Чай
        Цена: 12.5
        Количество: 4
        В наличии: true
        Скидка: 0
      hidden: true
      hint: "Проверяется, что значение discount равно нулю; переменная float64 без начального значения печатается как 0."
