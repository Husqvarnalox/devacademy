id: "go.first-steps.text-lines"
title: "Построчное чтение и разбор текста"
goal: "Читать ввод построчно через bufio.Scanner, разбивать строку на слова функцией strings.Fields и переводить части в числа."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "go.first-steps.number-stream"
objectives:
  - "Читать строки до конца ввода циклом for sc.Scan() и получать текст через sc.Text()."
  - "Разбивать строку на слова через strings.Fields и пропускать пустые строки."
  - "Переводить слова в числа через strconv.Atoi и считать по ним результат строки."
  - "Объяснять, чем построчное чтение отличается от чтения по словам через Scan и Fscan."
masteryCriteria:
  - "Программа печатает для каждого ученика строку «имя: средний балл» с двумя знаками после точки."
  - "Пустые строки во вводе пропускаются, лишние пробелы не мешают."
  - "После всех строк печатается лучший ученик; при равных средних выбирается первый из них."
concepts:
  introduces:
    - "go.bufio-scanner"
  uses:
    - "go.bufio-reader"
    - "go.strings-package"
    - "go.strconv-atoi"
    - "go.error-value"
    - "go.slice"
    - "go.range"
    - "go.for-loop"
    - "go.break-continue"
    - "go.if"
    - "go.comparison"
    - "go.int"
    - "go.float64"
    - "go.type-conversion"
    - "go.printf"
    - "go.multiple-returns"
    - "go.import"
    - "go.string"
    - "go.variable"
    - "go.short-declaration"
    - "go.assignment"
    - "go.arithmetic"
next:
  - "go.first-steps.mini-project-expenses"
tags:
  - "go"
  - "bufio"
  - "scanner"
  - "strings"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа при вводе из двух строк «a b» и «c»?

        ```go
        sc := bufio.NewScanner(os.Stdin)
        for sc.Scan() {
            fmt.Println(len(sc.Text()))
        }
        ```
      options:
        - "3 и 1"
        - "2 и 1"
        - "1 и 1"
        - "5"
      answer: 0
      explanation: "Scanner отдаёт по одной строке без перевода строки. В «a b» три символа вместе с пробелом, в «c» один."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```go
        parts := strings.Fields("  go   is   fun ")
        fmt.Println(len(parts), parts[0])
        ```
      options:
        - "3 go"
        - "6 go"
        - "3 пробел"
        - "4 go"
      answer: 0
      explanation: "strings.Fields делит по любым пробельным символам и отбрасывает пустые части. Получается срез из трёх слов: go, is, fun."
    - id: "q3"
      type: "single"
      prompt: "Что произойдёт, если в строке нет слов (пустая строка), а код обращается к fields[0]?"
      options:
        - "Вернётся пустая строка."
        - "Паника: index out of range [0] with length 0."
        - "Ошибка компиляции."
        - "Вернётся 0."
      answer: 1
      explanation: "strings.Fields для пустой строки возвращает пустой срез. Обращение по индексу 0 даёт панику, поэтому длину проверяют заранее (len(fields) == 0 и continue)."
    - id: "q4"
      type: "single"
      prompt: "Чем bufio.Scanner удобнее fmt.Fscan, когда важны границы строк?"
      options:
        - "Scanner отдаёт строку целиком, и вы сами решаете, как её разобрать."
        - "Scanner быстрее переводит строки в числа."
        - "Fscan не умеет читать числа."
        - "Scanner автоматически считает среднее."
      answer: 0
      explanation: "Fscan читает слова и не сообщает, где кончилась строка. Scanner даёт строку как есть, а разбирают её через strings.Fields и strconv."
exercise:
  id: "go.first-steps.text-lines.exercise"
  title: "Ведомость оценок"
  prompt: |
    Каждая строка ввода описывает одного ученика: имя (одно слово) и затем одна или несколько целых оценок, разделённые пробелами. Число строк заранее неизвестно, ввод идёт до конца. Пустые строки (и строки из одних пробелов) нужно пропускать.

    Для каждого ученика выведите строку `<имя>: <средний балл с двумя знаками после точки>`. После всех учеников выведите `best: <имя>`: ученика с наибольшим средним баллом. Если таких несколько, выведите того, кто встретился первым. Если учеников нет, ничего не выводите.

    **Пример.** Ввод

    ```
    Анна 5 4 5
    Борис 3 4

    Вера 5 5 4 4
    ```

    даёт

    ```
    Анна: 4.67
    Борис: 3.50
    Вера: 4.50
    best: Анна
    ```

    Оценки гарантированно корректные целые числа, обрабатывать неверные данные не нужно. Читайте строки через `bufio.Scanner`.
  entryFile: "main.go"
  evaluation: "io"
  hints:
    - "Цикл for sc.Scan() { ... } выполняется для каждой строки; текст строки возвращает sc.Text(). Разбейте её: fields := strings.Fields(sc.Text())."
    - "Если len(fields) == 0, строка пустая: пропустите её командой continue. Иначе fields[0] - имя, остальные слова - оценки."
    - "Оценки: для i, f := range fields пропустите i == 0 и переведите f через strconv.Atoi, складывая сумму. Число оценок - len(fields)-1."
    - "Среднее: float64(sum)/float64(len(fields)-1), формат %.2f. Лучшего запоминайте строгим сравнением avg > bestAvg, чтобы при равенстве остался первый."
  tests:
    - id: "basic"
      title: "Три ученика и пустая строка"
      stdin: "Анна 5 4 5\nБорис 3 4\n\nВера 5 5 4 4\n"
      expected: "Анна: 4.67\nБорис: 3.50\nВера: 4.50\nbest: Анна\n"
      hint: "Среднее Анны 14/3 = 4.67; пустая строка пропущена."
    - id: "single"
      title: "Один ученик, одна оценка (скрытый)"
      stdin: "Иван 5\n"
      expected: "Иван: 5.00\nbest: Иван\n"
      hidden: true
      hint: "Среднее одной оценки равно ей самой; печатается два знака после точки."
    - id: "tie"
      title: "Равные средние: первый лучший (скрытый)"
      stdin: "Лев 4 4\nМаша 5 3\nНика 4\n"
      expected: "Лев: 4.00\nМаша: 4.00\nНика: 4.00\nbest: Лев\n"
      hidden: true
      hint: "При равенстве лучшим остаётся тот, кто встретился раньше: сравнение должно быть строгим."
    - id: "spaces"
      title: "Лишние пробелы и строки из пробелов (скрытый)"
      stdin: "  Олег   2   3  \n   \nПётр 5\n"
      expected: "Олег: 2.50\nПётр: 5.00\nbest: Пётр\n"
      hidden: true
      hint: "strings.Fields игнорирует лишние пробелы; строка из одних пробелов даёт пустой срез слов."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: ""
      hidden: true
      hint: "Если учеников нет, программа ничего не печатает, в том числе строку best."
    - id: "no-trailing-newline"
      title: "Последняя строка без перевода строки (скрытый)"
      stdin: "Ася 3 5"
      expected: "Ася: 4.00\nbest: Ася\n"
      hidden: true
      hint: "Scanner отдаёт последнюю строку, даже если после неё нет перевода строки."
