id: "go.first-steps.compiler-errors"
title: "Как читать сообщения об ошибках"
goal: "Найти и исправить синтаксические ошибки и ошибки подключения пакетов по сообщению компилятора."
difficulty: "intro"
estimatedMinutes: 20
prerequisites:
  - "go.first-steps.first-program"
objectives:
  - "Разобрать сообщение компилятора: файл, строка, столбец, описание."
  - "Отличать синтаксическую ошибку от ошибки неизвестного или неиспользуемого имени."
  - "Исправлять ошибки по одной, начиная с первого сообщения, и собирать программу заново."
masteryCriteria:
  - "Программа после исправлений собирается и печатает три заданные строки без изменений текста."
  - "Вы объясняете, почему вторая ошибка может появиться только после исправления первой."
concepts:
  introduces:
    - "go.compile-error"
    - "go.build-and-run"
  uses:
    - "go.program"
    - "go.package-main"
    - "go.func-main"
    - "go.import"
    - "go.println"
    - "go.string-literal"
next:
  - "go.first-steps.output"
tags:
  - "go"
  - "compiler"
  - "errors"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Сообщение компилятора: ./main.go:6:2: undefined: fmt. Где искать проблему?"
      options:
        - "В файле main.go, строка 6, столбец 2."
        - "В файле fmt.go."
        - "В функции с номером 6."
        - "В шестом символе программы."
      answer: 0
      explanation: "Формат такой: файл, строка, столбец, описание. Строка 6 и столбец 2 указывают на место, где компилятор споткнулся."
    - id: "q2"
      type: "single"
      prompt: "Что значит сообщение \"os\" imported and not used?"
      options:
        - "Пакет os не найден."
        - "Пакет os подключён, но ни разу не использован в программе."
        - "Пакет os нельзя подключать."
        - "Пакет os используется неправильно."
      answer: 1
      explanation: "Go запрещает лишние импорты: подключили - используйте или удалите строку. Это ошибка, программа не соберётся."
    - id: "q3"
      type: "single"
      prompt: "В программе есть незакрытая скобка в Println (синтаксическая ошибка) и неиспользуемый импорт. Что покажет go build?"
      options:
        - "Обе ошибки сразу."
        - "Сначала только синтаксическую; про импорт - после её исправления."
        - "Только про импорт."
        - "Ничего, программа запустится."
      answer: 1
      explanation: "Пока текст нельзя разобрать по правилам языка, проверка имён и импортов не начинается. Поэтому ошибки приходят по очереди."
    - id: "q4"
      type: "multiple"
      prompt: "Что стоит делать, когда компилятор выдал несколько сообщений?"
      options:
        - "Начать с первого сообщения."
        - "Исправить одну ошибку и собрать программу заново."
        - "Переписать программу с нуля."
        - "Читать только последнее сообщение, оно главное."
      answer:
        - 0
        - 1
      explanation: "Первое сообщение чаще всего настоящая причина, а следующие могут быть её следствием. Пересборка после каждого исправления показывает, что стало лучше."
exercise:
  id: "go.first-steps.compiler-errors.exercise"
  title: "Исправьте три ошибки"
  prompt: |
    В редакторе лежит программа, которая не собирается. В ней три ошибки. Исправьте их, **не меняя текст, который программа должна напечатать**. После исправления программа должна вывести:

    ```
    Добро пожаловать в «Книжный угол»
    Сегодня скидка 10 процентов
    Приходите ещё!
    ```

    Подсказка по порядку работы: нажмите «Запустить», прочитайте первое сообщение, исправьте его, запустите снова.
  entryFile: "main.go"
  evaluation: "io"
  hints:
    - "Читайте первое сообщение: в нём указаны строка и столбец. Откройте эту строку и предыдущую."
    - "Первая ошибка - синтаксис в вызове Println: проверьте, закрыта ли круглая скобка. Остальные две ошибки появятся после её исправления."
    - "Две оставшиеся ошибки: имя функции написано с маленькой буквы, и подключён пакет, который не нужен."
    - "Нужно: добавить закрывающую скобку после текста про скидку, заменить fmt.println на fmt.Println, удалить строку с \"os\" из import."
  tests:
    - id: "basic"
      title: "Программа собирается и печатает три строки"
      stdin: ""
      expected: |
        Добро пожаловать в «Книжный угол»
        Сегодня скидка 10 процентов
        Приходите ещё!
      hint: "После исправления программа должна напечатать три строки в указанном порядке."
    - id: "exact"
      title: "Текст не изменён (скрытый)"
      stdin: ""
      expected: |
        Добро пожаловать в «Книжный угол»
        Сегодня скидка 10 процентов
        Приходите ещё!
      hidden: true
      hint: "Проверяется точное совпадение текста: кавычки «», пробелы и восклицательный знак. Исправляйте код, а не слова на экране."
