id: "go.first-steps.output"
title: "Вывод: Println, Print и перевод строки"
goal: "Вывести несколько значений в одной строке и управлять переводами строк с помощью Println, Print и \\n."
difficulty: "intro"
estimatedMinutes: 20
prerequisites:
  - "go.first-steps.compiler-errors"
objectives:
  - "Передавать в Println несколько значений через запятую и предсказывать результат."
  - "Различать Println и Print по тому, переводят ли они строку и добавляют ли пробелы."
  - "Записывать перевод строки внутри текста символами \\n."
masteryCriteria:
  - "Чек из строк и чисел печатается точно по образцу: пробелы и переводы строк на нужных местах."
  - "Вы объясняете, откуда берутся пробелы между значениями в Println."
concepts:
  introduces:
    - "go.print-values"
    - "go.newline"
  uses:
    - "go.println"
    - "go.string-literal"
    - "go.program"
    - "go.func-main"
next:
  - "go.first-steps.variables"
tags:
  - "go"
  - "fmt"
  - "println"
  - "print"
  - "newline"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что напечатает fmt.Println(\"Цена:\", 50, \"руб.\")?"
      options:
        - "Цена:50руб."
        - "Цена: 50 руб."
        - "Цена: 50руб."
        - "\"Цена:\" 50 \"руб.\""
      answer: 1
      explanation: "Println ставит один пробел между значениями и перевод строки в конце. Кавычки показывают границы текста и на экран не попадают."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```go
        fmt.Print("a")
        fmt.Print("b")
        fmt.Println("c")
        fmt.Println("d")
        ```
      options:
        - "abcd"
        - "a b c d - каждая буква на своей строке"
        - "abc и на следующей строке d"
        - "a, b, c, d через запятую"
      answer: 2
      explanation: "Print не переводит строку и не добавляет пробелов между строками: получается abc. Println(\"c\") завершает строку, а Println(\"d\") печатает d уже на следующей."
    - id: "q3"
      type: "single"
      prompt: "Что напечатает fmt.Println(\"раз\\nдва\")?"
      options:
        - "раз\\nдва дословно, в одной строке"
        - "раз и на следующей строке два"
        - "раздва"
        - "раз два"
      answer: 1
      explanation: "Последовательность \\n внутри текста - перевод строки: «раз» и «два» окажутся на разных строках. Println после «два» добавит ещё один перевод строки."
    - id: "q4"
      type: "single"
      prompt: "Что не так с fmt.Println(\"Всего\" 5)?"
      options:
        - "Число нельзя печатать."
        - "Между значениями пропущена запятая."
        - "Нужно использовать Print."
        - "Всё правильно."
      answer: 1
      explanation: "Значения в скобках разделяют запятой: fmt.Println(\"Всего\", 5). Без неё компилятор сообщает syntax error."
    - id: "q5"
      type: "short"
      prompt: "Какая последовательность символов внутри текста означает перевод строки?"
      answer:
        - "\\n"
      explanation: "Обратная косая черта и буква n: \\n. Это одна «невидимая» команда, а не две буквы."
exercise:
  id: "go.first-steps.output.exercise"
  title: "Чек из магазина"
  prompt: |
    Допишите программу, которая печатает чек. Значения (товары, количества, цены) задайте прямо в программе, как в образце. Вывод должен быть таким:

    ```
    === Чек ===
    Хлеб 2 шт. 90 руб.
    Молоко 1 шт. 85 руб.
    Итого: 175 руб.
    ```

    Первая строка уже напечатана. Каждая строка товара состоит из текста и чисел, разделённых пробелами.
  entryFile: "main.go"
  evaluation: "io"
  hints:
    - "Для каждой строки чека подойдёт fmt.Println: он сам ставит пробелы между значениями."
    - "Первая строка товара: название, число, слово «шт.», число, слово «руб.» - пять значений через запятую."
    - "fmt.Println(\"Хлеб\", 2, \"шт.\", 90, \"руб.\") напечатает Хлеб 2 шт. 90 руб."
    - "Итоговая строка: fmt.Println(\"Итого:\", 175, \"руб.\"). Строки с точками внутри кавычек (шт., руб.) печатаются как есть."
  tests:
    - id: "basic"
      title: "Чек напечатан целиком"
      stdin: ""
      expected: |
        === Чек ===
        Хлеб 2 шт. 90 руб.
        Молоко 1 шт. 85 руб.
        Итого: 175 руб.
      hint: "Должно быть четыре строки: заголовок, два товара и итого."
    - id: "exact"
      title: "Пробелы и точки (скрытый)"
      stdin: ""
      expected: |
        === Чек ===
        Хлеб 2 шт. 90 руб.
        Молоко 1 шт. 85 руб.
        Итого: 175 руб.
      hidden: true
      hint: "Проверяется точное совпадение: по одному пробелу между словами и числами, точки после шт. и руб., каждая строка товара отдельно."
