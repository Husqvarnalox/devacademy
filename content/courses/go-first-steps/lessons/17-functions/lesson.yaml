id: "go.first-steps.functions"
title: "Функции"
goal: "Объявлять функции с параметрами и вызывать их с разными значениями, чтобы не повторять один и тот же код."
difficulty: "easy"
estimatedMinutes: 35
prerequisites:
  - "go.first-steps.nested-loops"
objectives:
  - "Объяснить, зачем нужна функция, и записать объявление func имя(параметры) { ... }."
  - "Различать параметр (имя внутри функции) и аргумент (значение при вызове)."
  - "Вызывать функцию несколько раз с разными аргументами и предсказывать вывод."
  - "Читать сообщения компилятора о неверном числе и типе аргументов."
masteryCriteria:
  - "Функция greet печатает приветствие для любого переданного имени."
  - "Функция repeatLine печатает текст заданное число раз и ничего не печатает при нуле и отрицательном числе."
  - "Вы объясняете, почему параметр name виден только внутри своей функции."
concepts:
  introduces:
    - "go.func"
    - "go.parameter"
  uses:
    - "go.func-main"
    - "go.println"
    - "go.print-values"
    - "go.string"
    - "go.int"
    - "go.for-loop"
    - "go.variable"
    - "go.arithmetic"
    - "go.string-literal"
    - "go.compile-error"
next:
  - "go.first-steps.return-values"
tags:
  - "go"
  - "function"
  - "parameter"
facts:
  - kind: "misconception"
    text: "«Функцию нужно объявить выше места вызова» - в Go это не так: порядок объявлений на уровне пакета не важен, main может стоять первой."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```go
        func show(n int) {
            fmt.Println("n =", n)
        }

        func main() {
            show(2)
            show(5)
        }
        ```
      options:
        - "n = 2 и затем n = 5, каждое на своей строке"
        - "n = 5"
        - "n = n"
        - "Ничего: функцию show нужно вызвать в Println"
      answer: 0
      explanation: "Каждый вызов выполняет тело функции заново с новым значением параметра n: сначала n равно 2, потом 5. Вызов функции - отдельная команда, оборачивать её в Println не нужно."
    - id: "q2"
      type: "single"
      prompt: "В вызове greet(\"Анна\") строка \"Анна\" - это:"
      options:
        - "параметр"
        - "аргумент"
        - "имя функции"
        - "тип"
      answer: 1
      explanation: "Аргумент - значение, которое передают при вызове. Параметр - имя в объявлении функции (name в func greet(name string)), в котором это значение оказывается внутри тела."
    - id: "q3"
      type: "single"
      prompt: |
        Почему эта программа не компилируется?

        ```go
        func show(n int) {
            fmt.Println(n)
        }

        func main() {
            show("5")
        }
        ```
      options:
        - "Функция show должна стоять после main."
        - "Передана строка, а параметр n имеет тип int."
        - "У функции show нет return."
        - "В Println нельзя передавать n."
      answer: 1
      explanation: "Тип аргумента должен совпадать с типом параметра. Компилятор сообщает: cannot use \"5\" (untyped string constant) as int value in argument to show. Порядок функций не важен, а return для функции без результата не нужен."
    - id: "q4"
      type: "single"
      prompt: "Что означает запись func rect(w, h int)?"
      options:
        - "Два параметра типа int: w и h"
        - "Один параметр w неизвестного типа и один параметр h типа int"
        - "Функция возвращает два числа"
        - "Функция с одним параметром типа int"
      answer: 0
      explanation: "Если у нескольких подряд идущих параметров один тип, его пишут один раз в конце группы: w, h int - это w int, h int."
exercise:
  id: "go.first-steps.functions.exercise"
  title: "Приветствие и повтор строки"
  prompt: |
    В файле `main.go` две функции-заготовки. Допишите их тела.

    **`greet(name string)`** печатает приветствие `Здравствуйте, <имя>!` и переводит строку. Например, `greet("Анна")` печатает

    ```
    Здравствуйте, Анна!
    ```

    **`repeatLine(text string, times int)`** печатает `text` на отдельной строке ровно `times` раз. Если `times` равно нулю или меньше нуля, функция ничего не печатает. Например, `repeatLine("Go", 3)` печатает

    ```
    Go
    Go
    Go
    ```

    **Как проверяется.** Кнопка «Проверить» запускает не `main`, а набор готовых проверок. Каждая проверка вызывает ваши функции с разными значениями (разные имена, пустое имя, ноль повторов) и сравнивает напечатанное с ожидаемым. Имена и типы параметров менять нельзя. Кнопка «Запустить» по-прежнему запускает `main`, где вызовы уже написаны.
  entryFile: "main.go"
  evaluation: "command"
  languageId: "go"
  starter: "exercise/starter"
  solution: "exercise/solution"
  tests_dir: "exercise/tests"
  command:
    run: ["go", "test", "-json", "-count=1", "./..."]
    report: "go-test-json"
    testsTarget: "."
    timeoutSeconds: 45
  hints:
    - "Тело функции - обычные команды, которые вы уже умеете писать. Параметры внутри функции - обычные переменные с переданными значениями."
    - "В greet достаточно одного вызова fmt.Println с двумя значениями: текстом приветствия и переменной name. Восклицательный знак должен идти сразу после имени, без пробела."
    - "В repeatLine нужен цикл: for i := 0; i < times; i++ { ... }. При times <= 0 условие i < times сразу ложно, и тело не выполнится ни разу."
    - "fmt.Println(\"Здравствуйте,\", name+\"!\") печатает имя и знак вместе. Для repeatLine внутри цикла вызовите fmt.Println(text)."
  tests:
    - id: "greet-basic"
      title: "greet: приветствие по имени"
      match: "TestGreet/cyrillic_name"
      hint: "Результат должен быть ровно «Здравствуйте, Анна!» и перевод строки."
    - id: "repeat-basic"
      title: "repeatLine: три повтора"
      match: "TestRepeatLine/three_times"
      hint: "Каждый повтор - отдельная строка, всего три."
    - id: "greet-other-names"
      title: "greet: другие имена и пустая строка (скрытый)"
      match: "TestGreet/*"
      hidden: true
      hint: "Функция не должна зависеть от конкретного имени: проверяются латиница, имя с пробелом и пустая строка."
    - id: "repeat-edges"
      title: "repeatLine: ноль, один и отрицательное число повторов (скрытый)"
      match: "TestRepeatLine/*"
      hidden: true
      hint: "При times равном 0 или отрицательном не печатается ничего, при 1 печатается одна строка."
