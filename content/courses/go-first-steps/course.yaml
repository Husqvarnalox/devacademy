id: "go-first-steps"
version: "2.0.0"
title: "Go с нуля"
description: "Курс для тех, кто никогда не программировал. Каждый урок вводит одно понятие: первая программа и сообщения об ошибках, вывод, переменные и типы, арифметика и ввод, условия и циклы, функции и первые ошибки-значения, массивы, срезы, карты и строки, затем практика с потоковым вводом и мини-проект. Для тех, кто уже программирует на другом языке, есть быстрый курс «Go для программистов»: он зачитывает уроки этого курса."
