      expected: |
        requests=40 malformed=0
        latency_ms p50=5 p95=5 p99=100
        availability=97.500%
        slo=99.5% budget_requests=0.20 bad=1 consumed=500.00% remaining=-0.80
        status=BUDGET_EXHAUSTED
      compare: "trim"
      hint: "n = 40, допустимо 40 x 0.5% = 0.2 плохих запроса; плохой один, значит бюджет исчерпан: consumed=500.00%, remaining=-0.80."
    - id: "nearest-rank-edges"
      title: "Края nearest-rank: ceil и малая выборка"
      stdin: |
        SLO 99
