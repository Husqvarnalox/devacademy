      compare: "trim"
      hidden: true
      hint: "SLO 100% означает нулевой бюджет: при ошибках consumed=inf; доступность 7/8 = 87.5%."
challenge:
  id: "devops.fundamentals.observability-and-slos.challenge"
  title: "Вычислитель правила оповещения с for (pending -> firing)"
  prompt: |
    Реализуйте в `main.py` вычислитель правила оповещения в духе Prometheus и покажите, как задержка `for` отделяет шум от инцидента. Используйте только стандартную библиотеку.

    **Ввод.** Первая строка правила: `RULE <имя> <оператор> <порог> FOR <секунды>`; оператор из `>`, `>=`, `<`, `<=`; порог и секунды - целые. Далее образцы `<t> <ряд> <значение>` (целые `t` и значение, `ряд` - имя, например `web-1`). Образцы с одним `t` образуют одну **проверку** (evaluation); если один ряд встречается в проверке несколько раз, побеждает последний. Проверки обрабатываются по возрастанию `t`.

    **Состояния** каждого ряда: `inactive` (начальное), `pending`, `firing`. На каждой проверке для **каждого ряда, известного к этому моменту** (в порядке по алфавиту): условие истинно, если у ряда в этой проверке есть значение и оно удовлетворяет `значение <оператор> порог`; отсутствие значения - ложно.

    * Условие истинно, ряд `inactive`: переход `inactive->pending`, запоминается `since = t`.
    * Затем (в той же проверке), если ряд `pending` и `t - since >= FOR`: переход `pending->firing`. Так при `FOR 0` в один момент происходят оба перехода.
    * Условие ложно, ряд не `inactive`: переход `pending->inactive` или `firing->inactive`.
    * Иначе перехода нет.

    **Вывод.** На каждый переход строка `<t> <ряд> <из>-><в>` в порядке проверок и рядов. В конце две строки: `firing: <ряды по алфавиту через запятую или ->` и `pending: <то же>` (состояние после последней проверки).

    **Пример.** `RULE HighLatency > 500 FOR 120` и образцы `0 web-1 100`, `60 web-1 600`, `120 web-1 700`, `180 web-1 650`, `240 web-1 400` дают переходы `60 web-1 inactive->pending`, `180 web-1 pending->firing`, `240 web-1 firing->inactive`, а затем `firing: -` и `pending: -`.
  entryFile: "main.py"
  evaluation: "io"
  starter: "challenge/starter"
  solution: "challenge/solution"
  hints:
    - "Сгруппируйте образцы по t: ticks[t][ряд] = значение (последнее значение побеждает). Состояние ряда храните в словаре state, момент входа в pending - в since. Известные ряды - все, что хоть раз встречались (ключи state)."
    - "Для каждого t по возрастанию обходите sorted(set(state) | set(ticks[t])). Условие: s in ticks[t] and cmp(ticks[t][s], threshold) (используйте operator.gt/ge/lt/le)."
    - "Если условие истинно: при inactive печатайте inactive->pending и запомните since = t; затем (без elif!) при pending и t - since >= hold печатайте pending->firing. Это даёт две строки в один момент при FOR 0."
    - "Если условие ложно и состояние не inactive - печатайте '<из>->inactive' и сбросьте состояние. В конце соберите отсортированные списки рядов в состояниях firing и pending; пустой список печатайте как '-'."
  tests:
    - id: "sample"
      title: "Pending -> firing -> resolved"
      stdin: |
        RULE HighLatency > 500 FOR 120
        0 web-1 100
        60 web-1 600
        120 web-1 700
        180 web-1 650
        240 web-1 400
        300 web-1 100
      expected: |
        60 web-1 inactive->pending
        180 web-1 pending->firing
        240 web-1 firing->inactive
        firing: -
        pending: -
      compare: "trim"
      hint: "Условие впервые истинно в 60; в 180 прошло ровно 120 секунд - переход в firing (нестрого). В 240 условие ложно, firing сбрасывается в inactive."
    - id: "flapping"
      title: "Условие пропало до истечения for"
      stdin: |
        RULE Errors >= 5 FOR 100
        0 api 5
        50 api 6
        90 api 1
        120 api 7
        200 api 7
      expected: |
        0 api inactive->pending
        90 api pending->inactive
        120 api inactive->pending
        firing: -
        pending: api
      compare: "trim"
      hint: "Первый pending сброшен в 90 без firing; новый pending начался в 120, поэтому firing только в 220 (в данных его нет)."
    - id: "two-series"
      title: "Независимые ряды и пропавший ряд"
      stdin: |
        RULE Down < 1 FOR 60
        0 a 0
        0 b 1
        60 a 0
        60 b 0
        120 a 0
      expected: |
        0 a inactive->pending
        60 a pending->firing
        60 b inactive->pending
        120 b pending->inactive
        firing: a
        pending: -
      compare: "trim"
      hint: "a pending с 0 и firing в 60; b pending с 60. В 120 ряда b нет в данных: условие ложно, b сбрасывается."
    - id: "for-zero"
      title: "FOR 0: сразу firing"
      stdin: |
        RULE Hot > 90 FOR 0
        10 x 95
        20 x 50
        30 x 99
      expected: |
        10 x inactive->pending
        10 x pending->firing
        20 x firing->inactive
        30 x inactive->pending
        30 x pending->firing
        firing: x
        pending: -
      compare: "trim"
      hidden: true
      hint: "При FOR 0 после inactive->pending в тот же момент следует pending->firing (две строки с одним временем)."
    - id: "late-series"
      title: "Ряд появляется позже, сброс firing при отсутствии"
      stdin: |
        RULE Cold <= 0 FOR 30
        0 a 5
        30 a 0
        60 a 0
        60 b 0
        90 b 0
        120 b 0
        150 a 0
      expected: |
        30 a inactive->pending
        60 a pending->firing
        60 b inactive->pending
        90 a firing->inactive
        90 b pending->firing
        150 a inactive->pending
        150 b firing->inactive
        firing: -
        pending: a
      compare: "trim"
      hidden: true
      hint: "b появляется в 60 и становится firing в 90; a пропал в 90 и 120 (inactive), снова появился в 150 (новый pending)."
    - id: "fractional-ticks"
      title: "Несколько значений одного ряда в один момент: побеждает последнее"
      stdin: |
        RULE X > 10 FOR 10
        0 s 5
        0 s 50
        10 s 50
        10 s 1
        20 s 50
        30 s 60
      expected: |
        0 s inactive->pending
        10 s pending->inactive
        20 s inactive->pending
        30 s pending->firing
        firing: s
        pending: -
      compare: "trim"
      hidden: true
      hint: "Для (10, s) используется последнее значение 1: условие ложно, pending сбрасывается; дальше новый pending с 20 и firing в 30."
