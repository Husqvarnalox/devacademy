id: "devops.fundamentals.what-is-devops-and-dora"
title: "Что такое DevOps: конвейер CI/CD, обратная связь и метрики DORA"
goal: "Описывать путь изменения от коммита до пользователей, понимать роль обратной связи и считать четыре ключевые метрики DORA по журналу событий."
difficulty: "easy"
estimatedMinutes: 75
prerequisites: []
related:
  - "system-design.fundamentals.requirements-and-estimation"
  - "security.fundamentals.threat-modelling"
next:
  - "devops.fundamentals.version-control-and-semver"
seeAlso:
  - "Ранжирование команд по уровням (elite/high/medium/low) и опросные метрики DORA: методология меняется от года к году, в курсе не рассматриваются"
  - "Метрика надёжности (reliability) как пятая метрика DORA, SPACE и другие модели оценки продуктивности"
objectives:
  - "Объяснить, что DevOps - это практики и культура сокращения пути от изменения до работающей в продакшене функции, а не должность и не набор инструментов."
  - "Назвать стадии конвейера CI/CD (сборка, тесты, артефакт, развёртывание) и различать непрерывную интеграцию, непрерывную доставку и непрерывное развёртывание."
  - "Объяснить роль петель обратной связи: чем быстрее сигнал об ошибке, тем дешевле исправление."
  - "Определить четыре метрики DORA и посчитать их по журналу событий."
  - "Объяснить, почему метрики измеряют команду и систему, а не отдельных людей, и как их можно исказить."
masteryCriteria:
  - "Вы считаете частоту развёртываний, время выполнения изменения (lead time), долю неудачных изменений и время восстановления из сырых событий."
  - "Вы используете медиану для времени выполнения и объясняете, почему среднее вводит в заблуждение при редких долгих изменениях."
  - "Вы отличаете непрерывную доставку (готово к выпуску в любой момент) от непрерывного развёртывания (выпуск автоматически)."
  - "Вы знаете, что метрики из упражнения - упрощённая модель: настоящие данные берутся из системы контроля версий, конвейера и системы инцидентов."
tags:
  - "devops"
  - "ci-cd"
  - "dora"
  - "metrics"
  - "lead-time"
  - "mttr"
  - "feedback"
facts:
  - kind: "real-world"
    text: "DORA (DevOps Research and Assessment) выделяет четыре ключевые метрики доставки ПО: частоту развёртываний, время выполнения изменения (lead time for changes), долю неудачных изменений (change failure rate) и время восстановления после сбоя. Первые две описывают скорость, вторые две - стабильность."
    sources:
      - "https://dora.dev/guides/dora-metrics-four-keys/"
  - kind: "real-world"
    text: "Мартин Фаулер определяет непрерывную интеграцию как практику, при которой члены команды интегрируют работу часто, как минимум ежедневно, а каждая интеграция проверяется автоматической сборкой и тестами. Цель - обнаруживать ошибки интеграции как можно раньше."
    sources:
      - "https://martinfowler.com/articles/continuousIntegration.html"
  - kind: "misconception"
    text: "«DevOps - это инструмент или отдельная команда»: ни то, ни другое. Это набор практик и культурных установок, объединяющих разработку и эксплуатацию; инструменты (Git, CI-серверы, контейнеры) лишь реализуют практики, а название должности «DevOps-инженер» описывает специализацию, но не заменяет общей ответственности за продукт."
  - kind: "misconception"
    text: "Метрики DORA не должны становиться личными планами: когда измеряемая величина становится целью, её начинают «улучшать» в обход смысла (дробить изменения ради частоты, не считать сбои). Метрики служат для обсуждения узких мест команды и системы."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Какая из метрик DORA описывает стабильность, а не скорость доставки?"
      options:
        - "Частота развёртываний"
        - "Время выполнения изменения"
        - "Доля неудачных изменений"
        - "Размер команды"
      answer: 2
      explanation: "Скорость - частота развёртываний и lead time. Стабильность - доля неудачных изменений и время восстановления."
    - id: "q2"
      type: "single"
      prompt: "Чем непрерывное развёртывание (continuous deployment) отличается от непрерывной доставки (continuous delivery)?"
      options:
        - "Ничем, это синонимы"
        - "При развёртывании каждое прошедшее проверки изменение уходит в продакшен автоматически, при доставке выпуск остаётся решением человека"
        - "Доставка не использует автоматические тесты"
        - "Развёртывание не использует систему контроля версий"
      answer: 1
      explanation: "Непрерывная доставка гарантирует, что любая версия готова к выпуску; непрерывное развёртывание выпускает автоматически."
    - id: "q3"
      type: "numeric"
      prompt: "За 14 дней команда сделала 21 развёртывание. Сколько развёртываний в день в среднем (одно число)?"
      answer: 1.5
      tolerance: 0
      explanation: "21 / 14 = 1.5 развёртывания в день."
    - id: "q4"
      type: "numeric"
      prompt: "Из 40 развёртываний 3 привели к сбою. Какова доля неудачных изменений в процентах?"
      answer: 7.5
      tolerance: 0
      explanation: "3 / 40 = 0.075, то есть 7.5%."
    - id: "q5"
      type: "multiple"
      prompt: "Что из перечисленного является петлёй обратной связи в конвейере? Выберите все верные утверждения."
      options:
        - "Падение юнит-теста сообщает об ошибке автору через минуты после коммита"
        - "Мониторинг продакшена показывает рост ошибок после выпуска"
        - "Отчёт о результатах, который читают раз в квартал"
        - "Ревью изменения коллегой до слияния"
      answer:
        - 0
        - 1
        - 3
      explanation: "Чем короче петля, тем дешевле исправление. Квартальный отчёт - слишком медленная обратная связь, чтобы повлиять на конкретное изменение."
exercise:
  id: "devops.fundamentals.what-is-devops-and-dora.exercise"
  title: "Метрики DORA по журналу развёртываний"
  prompt: |
    Напишите в `main.py` программу, которая считает четыре метрики DORA по журналу развёртываний. Используйте только стандартную библиотеку; `float` не нужен (в условии даны целочисленные формулы).

    **Формат ввода.** Первая значимая строка: `DAYS <n>` - длина окна наблюдения в днях (целое > 0). Далее строки развёртываний (порядок произвольный, пустые строки пропускайте):

    * `D <deploy_ts> <commit_ts> OK` - успешное развёртывание;
    * `D <deploy_ts> <commit_ts> FAIL <restored_ts>` - неудачное: сервис восстановлен в момент `restored_ts`.

    Все моменты - целые секунды, `commit_ts <= deploy_ts <= restored_ts`.

    **Вывод** (ровно пять строк):

    ```
    deployments=<N>
    frequency_per_day=<N / DAYS, два знака>
    lead_time_median_s=<медиана deploy_ts - commit_ts, один знак>
    change_failure_rate_pct=<FAIL * 100 / N, один знак>
    mttr_s=<среднее restored_ts - deploy_ts по FAIL, один знак>
    ```

    **Соглашения:**

    * Медиана чётного числа значений - среднее двух средних после сортировки.
    * Округление **half-up** на точных рациональных числах. В заготовке уже есть функция `fixed(num, den, places)`, которая возвращает строку нужной точности без `float`.
    * Если `N = 0`: `frequency_per_day=0.00`, а `lead_time_median_s`, `change_failure_rate_pct` и `mttr_s` равны `n/a`. Если нет ни одного `FAIL`, то `mttr_s=n/a`.

    **Пример.** `DAYS 7`, четыре развёртывания со временами выполнения 3600, 10000, 3000, 3600 и одним сбоем, восстановленным за 1800 секунд, дают `frequency_per_day=0.57`, `lead_time_median_s=3600.0`, `change_failure_rate_pct=25.0`, `mttr_s=1800.0`.
  entryFile: "main.py"
  evaluation: "io"
  starter: "exercise/starter"
  solution: "exercise/solution"
  hints:
    - "Разберите вход построчно: первое слово DAYS задаёт окно, D - развёртывание. Для FAIL пятое поле - restored_ts. Храните кортежи (deploy_ts, commit_ts, failed, restored_ts)."
    - "Время выполнения - список deploy_ts - commit_ts, отсортированный. Для нечётного n берите lst[n // 2], для чётного - среднее lst[n // 2 - 1] и lst[n // 2]; в fixed это числитель a + b при знаменателе 2."
    - "Доля сбоев: fixed(100 * число_FAIL, n, 1). MTTR: fixed(сумма (restored - deploy), число_FAIL, 1). Не используйте / и round: fixed уже даёт точное half-up."
    - "Граничные случаи: n = 0 печатает frequency_per_day=0.00 и три n/a; если нет FAIL, то change_failure_rate_pct=0.0, а mttr_s=n/a. Выходите из программы после n/a, чтобы не делить на ноль."
  tests:
    - id: "sample"
      title: "Неделя из четырёх развёртываний"
      stdin: |
        DAYS 7
        D 1000000 996400 OK
        D 1100000 1090000 FAIL 1101800
        D 1200000 1197000 OK
        D 1300000 1296400 OK
      expected: |
        deployments=4
        frequency_per_day=0.57
        lead_time_median_s=3600.0
        change_failure_rate_pct=25.0
        mttr_s=1800.0
      compare: "trim"
      hint: "Времена выполнения: 3600, 10000, 3000, 3600 -> медиана 3600.0; один сбой из четырёх даёт 25.0%."
    - id: "odd-all-ok"
      title: "Нечётное число развёртываний без сбоев"
      stdin: |
        DAYS 30
        D 5000 4000 OK
        D 9000 8900 OK
        D 20000 19000 OK
      expected: |
        deployments=3
        frequency_per_day=0.10
        lead_time_median_s=1000.0
        change_failure_rate_pct=0.0
        mttr_s=n/a
      compare: "trim"
      hint: "Без сбоев change_failure_rate_pct=0.0, а mttr_s=n/a. Медиана трёх значений 1000, 100, 1000 равна 1000.0."
    - id: "even-median"
      title: "Чётное число: среднее двух средних значений"
      stdin: |
        DAYS 4
        D 100 90 OK
        D 200 150 OK
        D 300 200 OK
        D 400 395 OK
      expected: |
        deployments=4
        frequency_per_day=1.00
        lead_time_median_s=30.0
        change_failure_rate_pct=0.0
        mttr_s=n/a
      compare: "trim"
      hint: "Времена: 10, 50, 100, 5 -> отсортированные 5 10 50 100, медиана (10 + 50) / 2 = 30.0."
    - id: "unsorted-and-blank"
      title: "События не по порядку, пустые строки"
      stdin: |
        DAYS 2

        D 2000 1000 FAIL 2600

        D 500 100 OK
        D 1500 1400 OK
      expected: |
        deployments=3
        frequency_per_day=1.50
        lead_time_median_s=400.0
        change_failure_rate_pct=33.3
        mttr_s=600.0
      compare: "trim"
      hidden: true
      hint: "Порядок строк не важен для метрик; пустые строки пропускаются. MTTR = 2600 - 2000 = 600.0."
    - id: "empty"
      title: "Нет ни одного развёртывания"
      stdin: |
        DAYS 14
      expected: |
        deployments=0
        frequency_per_day=0.00
        lead_time_median_s=n/a
        change_failure_rate_pct=n/a
        mttr_s=n/a
      compare: "trim"
      hidden: true
      hint: "При n = 0 частота равна 0.00, остальные три метрики n/a."
    - id: "rounding"
      title: "Округление half-up на точных долях"
      stdin: |
        DAYS 32
        D 100 90 FAIL 102
        D 200 190 FAIL 202
        D 300 290 FAIL 302
        D 400 390 FAIL 403
      expected: |
        deployments=4
        frequency_per_day=0.13
        lead_time_median_s=10.0
        change_failure_rate_pct=100.0
        mttr_s=2.3
      compare: "trim"
      hidden: true
      hint: "4 / 32 = 0.125 -> 0.13; MTTR = (2 + 2 + 2 + 3) / 4 = 2.25 -> 2.3 (half-up, а не банковское округление round())."
