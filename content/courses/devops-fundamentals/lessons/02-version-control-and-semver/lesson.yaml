id: "devops.fundamentals.version-control-and-semver"
title: "Контроль версий и семантическое версионирование (SemVer)"
goal: "Объяснять рабочие процессы с ветками (trunk-based, feature branches), выбирать номер версии по характеру изменений и сравнивать версии по правилам SemVer 2.0.0."
difficulty: "medium"
estimatedMinutes: 90
prerequisites:
  - "devops.fundamentals.what-is-devops-and-dora"
related:
  - "security.fundamentals.secrets-and-dependencies"
next:
  - "devops.fundamentals.build-pipelines-as-dags"
seeAlso:
  - "Calendar versioning (CalVer) и версионирование по датам"
  - "Диапазоны версий в менеджерах пакетов (npm ^ и ~, pip ~=): их семантика зависит от экосистемы и в курсе только упоминается"
  - "Conventional Commits и автоматическое вычисление версии по истории"
objectives:
  - "Описать рабочие процессы trunk-based development и ветки функций и назвать их компромиссы (частая интеграция против изоляции)."
  - "Объяснить, что коммит в Git - неизменяемый снимок с хешем, а ветка и тег - подвижные и неподвижные указатели."
  - "Выбрать часть номера MAJOR.MINOR.PATCH по характеру изменения публичного API."
  - "Реализовать разбор версии по грамматике SemVer 2.0.0 и отвергнуть недопустимые строки (ведущие нули, пустые идентификаторы, префикс v)."
  - "Сравнить две версии по разделу 11 спецификации, включая пре-релизы, и объяснить, что build-метаданные приоритет не меняют."
masteryCriteria:
  - "Вы сравниваете числовые поля как числа: 1.10.0 старше 1.9.0."
  - "Вы знаете, что версия с пре-релизом старше своей предыдущей и младше релиза: 1.0.0-rc.1 < 1.0.0."
  - "Вы сравниваете идентификаторы пре-релиза по правилам: числовые как числа и младше буквенных, буквенные по ASCII, более короткий набор младше при равных префиксах."
  - "Вы понимаете, что SemVer - соглашение о публичном API: правила не проверяются компилятором, а нарушения возможны."
  - "Вы отвергаете версию 01.2.3 и 1.2.3-01 как недопустимые, а 1.2.3+build.5 принимаете."
tags:
  - "devops"
  - "git"
  - "branching"
  - "trunk-based"
  - "semver"
  - "versioning"
  - "release"
facts:
  - kind: "real-world"
    text: "Спецификация Semantic Versioning 2.0.0 задаёт формат MAJOR.MINOR.PATCH: MAJOR повышают при несовместимых изменениях публичного API, MINOR - при добавлении совместимой функциональности, PATCH - при совместимых исправлениях. Раздел 11 определяет приоритет версий, включая пре-релизы."
    sources:
      - "https://semver.org/spec/v2.0.0.html"
  - kind: "misconception"
    text: "Build-метаданные (часть после +) в приоритете версий не участвуют: 1.0.0+a и 1.0.0+b имеют одинаковый приоритет. Спецификация прямо говорит, что при определении приоритета их следует игнорировать."
    sources:
      - "https://semver.org/spec/v2.0.0.html"
  - kind: "internals"
    text: "В Git коммит - снимок дерева файлов с указателями на родителей, идентифицируемый хешем содержимого. Ветка - лёгкий подвижный указатель на коммит, который автоматически перемещается при новом коммите, а лёгкий тег - неподвижное имя коммита."
    sources:
      - "https://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell"
  - kind: "real-world"
    text: "Trunk-based development - модель, в которой разработчики интегрируют небольшие изменения в единственную основную ветку (trunk) часто, не реже раза в день; долгоживущие ветки функций избегаются, а незавершённые изменения прячут за флагами функций."
    sources:
      - "https://trunkbaseddevelopment.com/"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Вы удалили публичную функцию из библиотеки версии 2.4.1. Какой должна быть следующая версия по SemVer?"
      options:
        - "2.4.2"
        - "2.5.0"
        - "3.0.0"
        - "2.4.1+removed"
      answer: 2
      explanation: "Удаление публичного API - несовместимое изменение, повышается MAJOR, а MINOR и PATCH сбрасываются: 3.0.0."
    - id: "q2"
      type: "single"
      prompt: "Какая из версий самая старшая?"
      options:
        - "1.0.0-rc.1"
        - "1.0.0-beta.11"
        - "1.0.0"
        - "0.99.99"
      answer: 2
      explanation: "Версия без пре-релиза старше любой своей пре-релизной версии; 1.0.0 > 1.0.0-rc.1 > 1.0.0-beta.11 > 0.99.99."
    - id: "q3"
      type: "single"
      prompt: "Что верно про 1.0.0+20240101 и 1.0.0+20250101?"
      options:
        - "Вторая старше"
        - "Первая старше"
        - "Приоритет одинаковый"
        - "Обе недопустимы"
      answer: 2
      explanation: "Build-метаданные при определении приоритета игнорируются."
    - id: "q4"
      type: "multiple"
      prompt: "Какие строки недопустимы как версия SemVer 2.0.0? Выберите все верные."
      options:
        - "1.02.3"
        - "v1.2.3"
        - "1.2.3-rc.1"
        - "1.2"
      answer:
        - 0
        - 1
        - 3
      explanation: "Ведущий ноль в 02, префикс v и недостающее поле делают строку недопустимой; 1.2.3-rc.1 допустима."
    - id: "q5"
      type: "numeric"
      prompt: "Сколько версий среди 1.0.0, 1.0.0-alpha, 1.0.0-alpha.1, 1.0.0-beta младше 1.0.0-alpha.1?"
      answer: 1
      tolerance: 0
      explanation: "Порядок: 1.0.0-alpha < 1.0.0-alpha.1 < 1.0.0-beta < 1.0.0; младше только 1.0.0-alpha."
exercise:
  id: "devops.fundamentals.version-control-and-semver.exercise"
  title: "Разбор, сравнение и повышение версий SemVer"
  prompt: |
    Реализуйте в `main.py` обработчик команд над версиями по правилам [SemVer 2.0.0](https://semver.org/spec/v2.0.0.html). Используйте только стандартную библиотеку. В заготовке уже есть регулярное выражение с semver.org для проверки грамматики.

    **Ввод.** Строки (пустые пропускайте), первое слово - команда:

    * `PARSE <v>` - если версия недопустима, напечатайте `INVALID`, иначе `major=<n> minor=<n> patch=<n> pre=<идентификаторы через точку или -> build=<метаданные или ->`.
    * `CMP <a> <b>` - напечатайте `-1`, `0` или `1` (a младше, равна, старше b) по разделу 11 спецификации; если любая версия недопустима, `INVALID`.
    * `BUMP <kind> <v>` - новая версия; `kind` из `major`, `minor`, `patch`, `prerelease`. Недопустимая версия или неизвестный `kind` дают `INVALID`.
    * `SORT <v1> <v2> ...` - допустимые версии по возрастанию приоритета, через пробел, в исходной записи; версии с равным приоритетом сохраняют входной порядок. Если были недопустимые, второй строкой `INVALID <они через пробел>`.

    **Соглашения BUMP** (так принято в этом упражнении, спецификация их не задаёт):

    * `major` -> `M+1.0.0`, `minor` -> `M.m+1.0`, `patch` -> `M.m.p+1`; пре-релиз и build отбрасываются.
    * `prerelease`: если пре-релиза нет, увеличьте patch и добавьте `-rc.1`; если последний идентификатор пре-релиза числовой, увеличьте его на 1; иначе добавьте идентификатор `1`. Build отбрасывается.

    **Приоритет.** MAJOR, MINOR, PATCH - числа. Версия с пре-релизом младше версии без него. Идентификаторы пре-релиза сравниваются слева направо: числовые как числа, буквенные по ASCII, числовой младше буквенного, а при равенстве всех общих идентификаторов младше тот набор, в котором идентификаторов меньше. Build-метаданные игнорируются.

    **Пример.** `PARSE 1.2.3-alpha.1+build.5` печатает `major=1 minor=2 patch=3 pre=alpha.1 build=build.5`; `CMP 1.0.0-alpha 1.0.0` печатает `-1`; `BUMP minor 1.4.9` печатает `1.5.0`.
  entryFile: "main.py"
  evaluation: "io"
  starter: "exercise/starter"
  solution: "exercise/solution"
  hints:
    - "Разберите версию так: m = SEMVER.match(text); если m is None - недопустима. Группы 1-3 - числа (int), группа 4 - пре-релиз (split по точке, если есть), группа 5 - build."
    - "Сравнение: сначала кортеж (major, minor, patch). При равенстве: нет пре-релиза у обеих - 0; нет только у одной - она старше; иначе идентификаторы по парам (zip). Числовой идентификатор определяет isdigit()."
    - "Пара идентификаторов: оба числовые - сравните int; один числовой - он младше; оба буквенные - обычное сравнение строк Python (это ASCII-порядок для допустимых символов). Если все пары равны, младше более короткий список."
    - "SORT: functools.cmp_to_key с вашим compare даёт устойчивую сортировку. Для BUMP prerelease различайте три случая: пре-релиза нет, последний идентификатор isdigit(), иначе. Не забудьте отбрасывать build."
  tests:
    - id: "sample"
      title: "Разбор, сравнение, повышение"
      stdin: |
        PARSE 1.2.3-alpha.1+build.5
        PARSE 1.2.3
        CMP 1.0.0 2.0.0
        CMP 1.0.0-alpha 1.0.0
        BUMP minor 1.4.9
        BUMP patch 2.0.0-rc.1
      expected: |
        major=1 minor=2 patch=3 pre=alpha.1 build=build.5
        major=1 minor=2 patch=3 pre=- build=-
        -1
        -1
        1.5.0
        2.0.1
      compare: "trim"
      hint: "Версия с пре-релизом младше той же версии без него; minor сбрасывает patch в 0."
    - id: "invalid"
      title: "Недопустимые версии"
      stdin: |
        PARSE 01.2.3
        PARSE 1.2
        PARSE v1.2.3
        PARSE 1.2.3-
        PARSE 1.2.3-01
        PARSE 1.2.3-alpha..1
        PARSE 1.2.3+
        CMP 1.0.0 nonsense
        BUMP major x.y.z
        BUMP huge 1.2.3
      expected: |
        INVALID
        INVALID
        INVALID
        INVALID
        INVALID
        INVALID
        INVALID
        INVALID
        INVALID
        INVALID
      compare: "trim"
      hint: "Ведущие нули в числовых полях запрещены, префикс v не часть semver, пустой идентификатор недопустим."
    - id: "section-11"
      title: "Цепочка приоритета из раздела 11"
      stdin: |
        CMP 1.0.0-alpha 1.0.0-alpha.1
        CMP 1.0.0-alpha.1 1.0.0-alpha.beta
        CMP 1.0.0-alpha.beta 1.0.0-beta
        CMP 1.0.0-beta 1.0.0-beta.2
        CMP 1.0.0-beta.2 1.0.0-beta.11
        CMP 1.0.0-beta.11 1.0.0-rc.1
        CMP 1.0.0-rc.1 1.0.0
      expected: |
        -1
        -1
        -1
        -1
        -1
        -1
        -1
      compare: "trim"
      hint: "Это пары из примера спецификации: каждая меньше следующей, то есть ответ -1 везде."
    - id: "numeric-compare"
      title: "Числа сравниваются как числа, а не как строки"
      stdin: |
        CMP 1.10.0 1.9.0
        CMP 1.0.10 1.0.9
        CMP 1.0.0-beta.11 1.0.0-beta.2
        CMP 1.0.0-1 1.0.0-alpha
        CMP 1.0.0-alpha 1.0.0-Alpha
        CMP 2.0.0 2.0.0
      expected: |
        1
        1
        1
        -1
        1
        0
      compare: "trim"
      hidden: true
      hint: "Числовые идентификаторы сравниваются как числа, но всегда младше буквенных; буквенные - по ASCII, заглавные раньше строчных."
    - id: "build-ignored"
      title: "Build-метаданные не влияют на приоритет"
      stdin: |
        CMP 1.0.0+a 1.0.0+b
        CMP 1.0.0+20130313144700 1.0.0
        CMP 1.0.0-rc.1+x 1.0.0-rc.1+y
        PARSE 1.0.0+exp.sha.5114f85
        BUMP minor 1.2.3+build.9
      expected: |
        0
        0
        0
        major=1 minor=0 patch=0 pre=- build=exp.sha.5114f85
        1.3.0
      compare: "trim"
      hidden: true
      hint: "Два числа, различающиеся только build, равны по приоритету (0); bump сбрасывает и пре-релиз, и build."
    - id: "prerelease-bump"
      title: "Повышение пре-релиза и сортировка"
      stdin: |
        BUMP prerelease 1.2.3
        BUMP prerelease 1.2.3-rc.1
        BUMP prerelease 1.2.3-rc.9
        BUMP prerelease 1.2.3-beta
        BUMP prerelease 1.2.3-alpha.beta
        BUMP major 1.2.3-rc.1
        SORT 1.0.0 1.0.0-rc.1 0.9.9 1.0.0-alpha 1.0.0-beta.11 1.0.0-beta.2 bad 1.0.0+x
      expected: |
        1.2.4-rc.1
        1.2.3-rc.2
        1.2.3-rc.10
        1.2.3-beta.1
        1.2.3-alpha.beta.1
        2.0.0
        0.9.9 1.0.0-alpha 1.0.0-beta.2 1.0.0-beta.11 1.0.0-rc.1 1.0.0 1.0.0+x
        INVALID bad
      compare: "trim"
      hidden: true
      hint: "Простое соглашение: нет пре-релиза -> patch+1 и -rc.1; последний числовой идентификатор увеличивается, иначе добавляется .1. SORT устойчив для равных."
