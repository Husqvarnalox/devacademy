id: "typescript.from-zero.type-checking"
title: "Проверка типов: аннотация и вывод"
goal: "Понять, как проверка типов находит ошибку до запуска, и прочитать сообщение TS2322."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "typescript.from-zero.variables"
objectives:
  - "Объяснить, что проверка типов сверяет значение с типом переменной до запуска."
  - "Прочитать сообщение TS2322 и исправить значение или тип."
  - "Объяснить вывод типа: тип переменной определяется по начальному значению."
  - "Назвать случай, когда аннотацию нужно писать."
masteryCriteria:
  - "Вы исправляете четыре ошибки несоответствия типов, не меняя аннотации."
  - "Вы предсказываете, отвергнет ли проверка присваивание в программе с выведенным типом."
concepts:
  introduces:
    - "ts.type-inference"
    - "ts.type-error"
  uses:
    - "ts.variable"
    - "ts.let"
    - "ts.const"
    - "ts.assignment"
    - "ts.type-annotation"
    - "ts.number"
    - "ts.string"
    - "ts.boolean"
    - "ts.error-message"
next:
  - "typescript.from-zero.arithmetic"
tags:
  - "typescript"
  - "type-checking"
  - "inference"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что сообщит проверка?

        ```typescript
        let age: number = "30";
        ```
      options:
        - "Ничего: строка \"30\" похожа на число."
        - "TS2322: Type 'string' is not assignable to type 'number'."
        - "TS2304: Cannot find name 'age'."
        - "TS2588: Cannot assign to 'age' because it is a constant."
      answer: 1
      explanation: "Значение \"30\" в кавычках - строка, а переменная объявлена для чисел. «Похожесть» не учитывается: проверяется только тип."
    - id: "q2"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```typescript
        let city = "Омск";
        city = 5;
        ```
      options:
        - "Всё в порядке: city теперь число."
        - "Проверка отвергнет вторую строку: city получила тип string по начальному значению."
        - "Проверка отвергнет первую строку: нет аннотации."
        - "Программа напечатает 5."
      answer: 1
      explanation: "Аннотации нет, но тип выведен из начального значения \"Омск\": это string. Присвоить туда число нельзя, и проверка сообщит TS2322."
    - id: "q3"
      type: "single"
      prompt: "Когда проверяются типы?"
      options:
        - "Каждый раз, когда выполняется строка с переменной, во время работы."
        - "Один раз до запуска; во время работы аннотаций уже нет."
        - "Только когда вы нажимаете «Сохранить»."
        - "Никогда: типы нужны только для красоты."
      answer: 1
      explanation: "tsc читает программу целиком до запуска. Node.js выполняет код без аннотаций и типов не проверяет. Поэтому ошибка типа обнаруживается без запуска."
    - id: "q4"
      type: "single"
      prompt: |
        Какой тип выведен для переменной?

        ```typescript
        const isOpen = true;
        ```
      options:
        - "number"
        - "string"
        - "boolean"
        - "тип не определён"
      answer: 2
      explanation: "Начальное значение true относится к логическому типу, и проверка выводит boolean без всякой аннотации."
    - id: "q5"
      type: "single"
      prompt: "В каком случае аннотацию типа переменной стоит записать?"
      options:
        - "const price = 450;"
        - "let total: number; (значение будет присвоено позже)"
        - "const shop = \"Пекарня\";"
        - "Никогда: аннотации не нужны."
      answer: 1
      explanation: "Без начального значения вывести тип не из чего, поэтому его записывают явно. Когда значение очевидно из записи, аннотацию можно опустить: тип выведется сам."
exercise:
  id: "typescript.from-zero.type-checking.exercise"
  title: "Исправьте несоответствия типов"
  prompt: |
    В заготовке четыре значения не подходят к типу своих переменных. Запустите программу, прочитайте сообщения `TS2322` и исправьте **значения**, не трогая типы после двоеточия, так чтобы программа напечатала:

    ```
    Чай 3 true 15
    ```

    Последняя переменная, `discount`, объявлена без аннотации: её тип выведен из первого значения (`10`). Поэтому в неё тоже можно положить только число.
  entryFile: "main.ts"
  evaluation: "io"
  hints:
    - "Каждое сообщение TS2322 называет строку и два типа: «Type 'A' is not assignable to type 'B'» значит «значение вида A нельзя положить туда, где ждут B»."
    - "itemName ждёт текст, значит значение в кавычках. quantity ждёт число, paid - логическое значение, discount - число: у них кавычек быть не должно."
    - "const itemName: string = \"Чай\"; const quantity: number = 3; const paid: boolean = true; discount = 15;"
  tests:
    - id: "basic"
      title: "Программа проходит проверку и печатает строку"
      stdin: ""
      expected: |
        Чай 3 true 15
      hint: "Все четыре значения должны подходить к типам: текст «Чай», числа 3 и 15 и логическое true; печатается одна строка через пробелы."
    - id: "exact"
      title: "Точный вывод (скрытый)"
      stdin: ""
      expected: |
        Чай 3 true 15
      hidden: true
      hint: "Проверяется точная строка «Чай 3 true 15»: без кавычек вокруг значений и с теми же значениями, что в условии."
