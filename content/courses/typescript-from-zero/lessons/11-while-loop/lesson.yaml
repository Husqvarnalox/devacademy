id: "typescript.from-zero.while-loop"
title: "Цикл while"
goal: "Повторять блок команд, пока условие истинно, и накапливать результат в переменных."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "typescript.from-zero.if-else"
objectives:
  - "Записать цикл while с условием и телом и объяснить порядок: проверка, тело, снова проверка."
  - "Организовать счётчик и накопитель: объявить до цикла и изменить внутри."
  - "Предсказать число повторений и избежать бесконечного цикла."
  - "Найти и исправить ошибку на единицу (< вместо <=)."
masteryCriteria:
  - "Функции с циклом верны для обычных значений и для пограничных: 0, отрицательные числа, одна цифра, цель, равная накоплению."
  - "Счётчик меняется в теле цикла так, что условие в конце концов становится ложным."
concepts:
  introduces:
    - "ts.while"
  uses:
    - "ts.let"
    - "ts.assignment"
    - "ts.arithmetic"
    - "ts.math"
    - "ts.comparison"
    - "ts.if"
    - "ts.function"
    - "ts.return"
    - "ts.console-log"
    - "ts.type-error"
next:
  - "typescript.from-zero.for-loop"
tags:
  - "typescript"
  - "while"
  - "loops"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```typescript
        let i: number = 1;
        while (i <= 3) {
          console.log(i);
          i = i + 1;
        }
        ```
      options:
        - "1 2 3, каждое с новой строки"
        - "1 2 3 4, каждое с новой строки"
        - "0 1 2, каждое с новой строки"
        - "Только 3"
      answer: 0
      explanation: "Условие i <= 3 проверяется перед каждым повторением: при i равном 1, 2 и 3 оно истинно и число печатается; при i равном 4 условие ложно и цикл завершается."
    - id: "q2"
      type: "single"
      prompt: |
        Чему равны total и n после цикла?

        ```typescript
        let total: number = 0;
        let n: number = 1;
        while (n <= 4) {
          total = total + n;
          n = n + 1;
        }
        ```
      options:
        - "total = 10, n = 5"
        - "total = 10, n = 4"
        - "total = 6, n = 4"
        - "total = 15, n = 5"
      answer: 0
      explanation: "В цикле складываются 1, 2, 3 и 4, итого 10. Счётчик n после последнего повторения увеличивается ещё раз до 5, и только тогда условие n <= 4 становится ложным."
    - id: "q3"
      type: "single"
      prompt: |
        Сколько раз выполнится тело цикла?

        ```typescript
        let k: number = 10;
        while (k > 100) {
          console.log(k);
          k = k + 1;
        }
        ```
      options:
        - "Ни разу"
        - "Один раз"
        - "90 раз"
        - "Бесконечно"
      answer: 0
      explanation: "Условие проверяется до первого повторения. 10 > 100 ложно сразу, поэтому тело не выполняется ни разу. Цикл while может не выполниться вовсе."
    - id: "q4"
      type: "single"
      prompt: |
        Что не так с этим кодом?

        ```typescript
        let count: number = 5;
        while (count > 0) {
          console.log(count);
        }
        ```
      options:
        - "Проверка сообщит TS2322."
        - "Цикл бесконечный: count в теле не меняется, условие всегда истинно."
        - "Цикл не выполнится ни разу."
        - "Ошибок нет, напечатается 5 4 3 2 1."
      answer: 1
      explanation: "Значение count не уменьшается, поэтому 5 > 0 истинно при каждой проверке, и программа печатает пятёрку без конца. Проверка типов этого не замечает: код допустим. Нужно добавить count = count - 1; в тело цикла."
    - id: "q5"
      type: "single"
      prompt: |
        Нужно просуммировать числа от 1 до 5 включительно. Какое условие цикла верное, если счётчик i начинается с 1 и увеличивается на 1?
      options:
        - "i < 5"
        - "i <= 5"
        - "i <= 6"
        - "i > 5"
      answer: 1
      explanation: "Пятёрка должна войти в сумму, поэтому условие истинно и при i равном 5: i <= 5. С i < 5 суммировались бы только 1-4, а условие i > 5 ложно с самого начала."
exercise:
  id: "typescript.from-zero.while-loop.exercise"
  title: "Сумма, цифры, накопления"
  prompt: |
    В файле `loops_task.ts` три функции. Реализуйте их циклом `while`:

    * `sumTo(n)` - сумма целых чисел от 1 до `n` включительно; для `n` меньше 1 результат `0`. Например, `sumTo(4)` равно `10`.
    * `countDigits(n)` - количество цифр в неотрицательном целом числе; для `0` результат `1`. Подсказка: `Math.floor(n / 10)` отбрасывает последнюю цифру.
    * `daysToSave(goal, perDay)` - сколько дней нужно откладывать по `perDay` рублей, чтобы накопить не меньше `goal`; если `goal` не больше нуля, результат `0`. Считайте, что `perDay` больше нуля.

    Функции должны **возвращать** значение. Скрытые тесты проверяют ноль, отрицательные числа, числа с одной цифрой и случай, когда накопление точно равно цели.
  entryFile: "loops_task.ts"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.mjs"
  hints:
    - "В sumTo нужны две переменные: счётчик i (начинается с 1) и накопитель total (начинается с 0). Пока i <= n, прибавляйте i к total и увеличивайте i на 1."
    - "В countDigits заведите rest = n и digits = 0. Пока rest > 0, делите rest на 10 с отбрасыванием остатка и увеличивайте digits. Число 0 обработайте отдельным if до цикла."
    - "В daysToSave пока накоплено меньше цели, прибавляйте perDay к накоплению и увеличивайте число дней. Если цель уже не больше нуля, цикл не выполнится ни разу и вернётся 0."
    - "while (saved < goal) { saved = saved + perDay; days = days + 1; } return days; Не забудьте объявить saved и days через let до цикла."
  tests:
    - id: "sum-basic"
      title: "sumTo: обычные значения"
      hint: "1 + 2 + 3 + 4 = 10; sumTo(10) = 55; sumTo(1) = 1."
    - id: "digits-basic"
      title: "countDigits: обычные числа"
      hint: "7 - одна цифра, 2025 - четыре, 100 - три."
    - id: "days-basic"
      title: "daysToSave: обычные значения"
      hint: "1000 при 300 в день - 4 дня (3 дня дают только 900); 900 при 300 - 3 дня."
    - id: "sum-edge"
      title: "sumTo: ноль и отрицательные (скрытый)"
      hidden: true
      hint: "Для 0 и отрицательных n цикл не выполняется, результат 0; sumTo(100) = 5050."
    - id: "digits-edge"
      title: "countDigits: 0 и границы разрядов (скрытый)"
      hidden: true
      hint: "У 0 одна цифра (особый случай, цикл для него не сработает); 9 - одна, 10 - две, 1000000 - семь."
    - id: "days-edge"
      title: "daysToSave: нулевая цель и точное совпадение (скрытый)"
      hidden: true
      hint: "Цель 0 или меньше - 0 дней; когда накоплено ровно goal (300 при 300), хватает 1 дня: условие должно быть saved < goal, а не <=."
