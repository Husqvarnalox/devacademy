id: "typescript.from-zero.first-program"
title: "Первая программа"
goal: "Запустить программу на TypeScript и изменить текст, который она выводит."
difficulty: "intro"
estimatedMinutes: 20
prerequisites: []
objectives:
  - "Объяснить, что такое программа, исходный код, TypeScript и Node.js."
  - "Различить два шага запуска: проверку кода и его выполнение."
  - "Вывести текст на экран командой console.log и записать строку в кавычках."
  - "Написать несколько команд подряд и предсказать порядок вывода."
masteryCriteria:
  - "Ваша программа печатает ровно заданную строку, включая регистр и знаки препинания."
  - "Вы отличаете текст в кавычках (его печатают как есть) от имени команды (её вызывают)."
concepts:
  introduces:
    - "ts.program"
    - "ts.console-log"
    - "ts.string-literal"
next:
  - "typescript.from-zero.reading-errors"
tags:
  - "typescript"
  - "node"
  - "console-log"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что делает проверка кода (tsc) перед запуском программы?"
      options:
        - "Выполняет команды программы и показывает результат."
        - "Читает текст программы и ищет в нём ошибки, не выполняя его."
        - "Переводит русский текст на английский."
        - "Сохраняет программу в файл main.ts."
      answer: 1
      explanation: "Проверяющая программа tsc только читает исходный код и сообщает о противоречиях и опечатках. Команды выполняет другая программа, Node.js, и только если проверка ничего не нашла."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```typescript
        console.log("раз");
        console.log("два");
        ```
      options:
        - "раздва"
        - "раз два (в одной строке)"
        - "раз, а на следующей строке два"
        - "два, а на следующей строке раз"
      answer: 2
      explanation: "Команды выполняются сверху вниз, а console.log после текста переходит на новую строку. Поэтому «раз» и «два» оказываются на разных строках в том порядке, в каком написаны команды."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает команда?

        ```typescript
        console.log("Привет");
        ```
      options:
        - "\"Привет\" вместе с кавычками"
        - "Привет без кавычек"
        - "Ничего: нужна ещё одна команда"
        - "console.log"
      answer: 1
      explanation: "Кавычки только показывают, где начинается и где заканчивается текст. На экран попадает содержимое между ними."
    - id: "q4"
      type: "single"
      prompt: |
        В чём ошибка в этой команде?

        ```typescript
        console.log("Привет)
        ```
      options:
        - "Не закрыта кавычка: текст не заканчивается."
        - "Нельзя писать по-русски."
        - "Слово log нужно писать с заглавной буквы."
        - "Ошибки нет."
      answer: 0
      explanation: "У открывающей кавычки нет закрывающей, поэтому проверка не может понять, где кончается текст, и сообщает TS1002: Unterminated string literal. Регистр букв в console.log важен, но здесь записано верно."
exercise:
  id: "typescript.from-zero.first-program.exercise"
  title: "Измените выводимую строку"
  prompt: |
    В редакторе уже есть рабочая программа: она печатает приветствие. Измените её так, чтобы она печатала ровно одну строку:

    ```
    Я учусь программировать на TypeScript!
    ```

    Менять нужно только текст в кавычках. Регистр букв, пробелы и восклицательный знак важны.
  entryFile: "main.ts"
  evaluation: "io"
  hints:
    - "Найдите в программе команду console.log: нужный текст находится между кавычками."
    - "Замените всё, что стоит между кавычками, на нужную фразу. Сами кавычки, скобки и точку с запятой оставьте."
    - "Должно получиться console.log(\"Я учусь программировать на TypeScript!\");"
  tests:
    - id: "basic"
      title: "Печатается нужная фраза"
      stdin: ""
      expected: |
        Я учусь программировать на TypeScript!
      hint: "Программа должна напечатать одну строку: Я учусь программировать на TypeScript!"
    - id: "exact"
      title: "Точный текст и одна строка (скрытый)"
      stdin: ""
      expected: |
        Я учусь программировать на TypeScript!
      hidden: true
      hint: "Проверяется точное совпадение: заглавная Я, пробелы между словами, восклицательный знак в конце и никаких лишних строк."
