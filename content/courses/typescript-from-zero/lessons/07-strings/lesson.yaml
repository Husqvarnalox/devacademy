id: "typescript.from-zero.strings"
title: "Строки: склейка, длина и шаблоны"
goal: "Собирать строки из частей с помощью + и шаблонных строк, узнавать длину строки."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "typescript.from-zero.arithmetic"
objectives:
  - "Склеить строки оператором + и объяснить разницу между 2 + 3 и \"2\" + \"3\"."
  - "Собрать строку шаблоном с подстановками ${...}."
  - "Узнать длину строки свойством length."
masteryCriteria:
  - "Строки собираются из переменных и вычисленных значений, а не записываются готовыми."
  - "Вы отличаете шаблонную строку в обратных кавычках от обычной в двойных."
concepts:
  introduces:
    - "ts.concatenation"
    - "ts.template-literal"
    - "ts.string-length"
  uses:
    - "ts.string"
    - "ts.number"
    - "ts.const"
    - "ts.variable"
    - "ts.arithmetic"
    - "ts.console-log"
    - "ts.error-message"
next:
  - "typescript.from-zero.comparison-and-logic"
tags:
  - "typescript"
  - "strings"
  - "template-literal"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```typescript
        console.log("2" + 3);
        console.log(2 + 3);
        ```
      options:
        - "5 и 5"
        - "23 и 5"
        - "5 и 23"
        - "23 и 23"
      answer: 1
      explanation: "Если одна из сторон + - текст, оператор склеивает: \"2\" и 3 превращаются в \"23\". Два числа складываются: 2 + 3 = 5."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```typescript
        console.log("Привет".length);
        ```
      options:
        - "5"
        - "6"
        - "\"Привет\""
        - "7"
      answer: 1
      explanation: "length возвращает число символов. В слове «Привет» шесть букв. Кавычки в длину не входят."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```typescript
        const n = 2;
        console.log(`Всего: ${n * 5}`);
        ```
      options:
        - "Всего: 10"
        - "Всего: ${n * 5}"
        - "Всего: n * 5"
        - "Ошибка"
      answer: 0
      explanation: "В шаблонной строке выражение в ${...} вычисляется, и результат подставляется в текст: 2 * 5 = 10."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```typescript
        const total = 50;
        console.log('Итого: ${total}');
        ```
      options:
        - "Итого: 50"
        - "Итого: ${total}"
        - "Итого: total"
        - "Ошибка проверки"
      answer: 1
      explanation: "Подстановка работает только в обратных кавычках. В обычных (одинарных или двойных) это просто символы: проверка не сообщает об ошибке, поэтому такую опечатку легко не заметить."
    - id: "q5"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```typescript
        console.log(2 + 3 + "4");
        ```
      options:
        - "54"
        - "234"
        - "9"
        - "Ошибка"
      answer: 0
      explanation: "Выражение вычисляется слева направо: сначала 2 + 3 = 5 (числа), затем 5 + \"4\" - склейка, получается \"54\"."
exercise:
  id: "typescript.from-zero.strings.exercise"
  title: "Строки чека"
  prompt: |
    В заготовке заданы покупатель, товар, количество и цена. Заполните три строки (`line1`, `line2`, `line3`) так, чтобы программа напечатала:

    ```
    Покупатель: Анна Петрова
    Чай x 3 = 360
    Букв в имени: 12
    ```

    Собирайте строки из переменных, а не пишите готовый текст: сумму `360` вычислите как `quantity * price`, а число букв возьмите свойством `length`. Можно использовать и `+`, и шаблонную строку в обратных кавычках. Пробел в имени считается символом.
  entryFile: "main.ts"
  evaluation: "io"
  hints:
    - "Первая строка: текст «Покупатель: » плюс customer. Шаблонная строка: `Покупатель: ${customer}`."
    - "Во второй строке нужны название, \" x \", количество, \" = \" и произведение. В шаблоне выражение вставляется как ${quantity * price}."
    - "Длина строки - customer.length. `${item} x ${quantity} = ${quantity * price}` и \"Букв в имени: \" + customer.length."
  tests:
    - id: "basic"
      title: "Три строки чека"
      stdin: ""
      expected: |
        Покупатель: Анна Петрова
        Чай x 3 = 360
        Букв в имени: 12
      hint: "Три строки: «Покупатель: Анна Петрова», «Чай x 3 = 360» (3 * 120 = 360) и «Букв в имени: 12» (пробел в имени тоже символ)."
    - id: "exact"
      title: "Точные пробелы и знаки (скрытый)"
      stdin: ""
      expected: |
        Покупатель: Анна Петрова
        Чай x 3 = 360
        Букв в имени: 12
      hidden: true
      hint: "Проверяется каждый пробел: после двоеточия один пробел, в строке «Чай x 3 = 360» пробелы вокруг x и =; латинская x."
