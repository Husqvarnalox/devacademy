id: "typescript.from-zero.mini-project"
title: "Мини-проект: бюджет"
goal: "Собрать из изученного готовую программу: прочитать строки бюджета, посчитать итоги по категориям и учесть неверные строки."
difficulty: "easy"
estimatedMinutes: 60
prerequisites:
  - "typescript.from-zero.reading-input"
objectives:
  - "Разбить задачу на этапы: прочитать, разобрать строку, накопить итоги, вывести отчёт."
  - "Оформить разбор строки функцией, которая выбрасывает ошибку на неверных данных, и перехватить её в цикле."
  - "Накапливать суммы по категориям в массиве объектов и общий итог в отдельной переменной."
  - "Вывести категории по убыванию суммы и итоговые строки точно по формату."
masteryCriteria:
  - "Отчёт точно совпадает с форматом из условия, включая два знака после запятой."
  - "Пустой ввод и ввод только из неверных строк обработаны без ошибок."
  - "Неверные строки считаются, но не влияют на суммы и количество записей; пустые строки игнорируются."
concepts:
  introduces: []
  uses:
    - "ts.read-input"
    - "ts.number-parsing"
    - "ts.string-methods"
    - "ts.for-of"
    - "ts.break-continue"
    - "ts.if"
    - "ts.comparison"
    - "ts.logical-operators"
    - "ts.const"
    - "ts.let"
    - "ts.array"
    - "ts.array-methods"
    - "ts.object"
    - "ts.interface"
    - "ts.optional-property"
    - "ts.object-iteration"
    - "ts.throw"
    - "ts.try-catch"
    - "ts.function"
    - "ts.return-type"
    - "ts.narrowing"
    - "ts.concatenation"
next:
  - "typescript.first-steps.how-typescript-runs"
tags:
  - "typescript"
  - "project"
  - "input"
  - "objects"
  - "exceptions"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа для строки `еда;12;5`, если строка должна состоять ровно из двух частей через точку с запятой?

        ```typescript
        const parts: string[] = "еда;12;5".split(";");
        console.log(parts.length);
        ```
      options:
        - "3, строка неверна: частей должно быть две"
        - "2, строка верна"
        - "1, строка верна"
        - "Ошибку проверки типов"
      answer: 0
      explanation: "split(\";\") даёт три части: \"еда\", \"12\" и \"5\". Проверка parts.length !== 2 помечает такую строку как неверную. Если брать только parts[0] и parts[1], часть данных молча потеряется."
    - id: "q2"
      type: "single"
      prompt: |
        Что будет, если в цикле увеличить счётчик валидных записей до вызова parseEntry, а parseEntry выбросит ошибку?

        ```typescript
        valid = valid + 1;
        const entry: Entry = parseEntry(line);
        ```
      options:
        - "Счётчик увеличится и для неверной строки, отчёт покажет лишнюю запись"
        - "Счётчик не увеличится, ошибка отменит присваивание"
        - "Проверка типов сообщит об ошибке"
        - "Программа остановится на этой строке"
      answer: 0
      explanation: "Присваивание выполнится раньше вызова parseEntry. Если вызов затем выбросит ошибку, увеличение уже произошло. Счётчики нужно менять после успешного разбора."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```typescript
        interface Total { category: string; sum: number; }
        const totals: Total[] = [{ category: "еда", sum: 100 }];
        const found = totals.find((t) => t.category === "еда");
        if (found !== undefined) {
          found.sum = found.sum + 50;
        }
        console.log(totals[0].sum);
        ```
      options:
        - "150"
        - "100"
        - "undefined"
        - "Ошибка проверки типов"
      answer: 0
      explanation: "find возвращает сам объект из массива, а не копию. Изменение found.sum меняет объект внутри totals."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```typescript
        const items = [
          { name: "a", sum: 5 },
          { name: "b", sum: 9 },
          { name: "c", sum: 5 },
        ];
        const sorted = [...items].sort((x, y) => y.sum - x.sum);
        console.log(sorted.map((i) => i.name).join(""));
        ```
      options:
        - "bac"
        - "bca"
        - "abc"
        - "cab"
      answer: 0
      explanation: "Компаратор y.sum - x.sum сортирует по убыванию суммы: b (9) первая. Для равных сумм a и c порядок остаётся исходным, потому что сортировка стабильная: a, затем c."
    - id: "q5"
      type: "single"
      prompt: "Почему пустую строку нужно пропускать до вызова parseEntry, а не считать её неверной?"
      options:
        - "Пустая строка (например, в конце ввода) - обычное дело, а не ошибка данных; отчёт не должен её учитывать"
        - "Потому что Number(\"\") равно NaN"
        - "Потому что split не работает на пустой строке"
        - "Потому что пустая строка вызывает ошибку проверки типов"
      answer: 0
      explanation: "Ввод почти всегда заканчивается переносом, и после разбиения остаётся пустая строка. По условию она игнорируется и не считается неверной. Если отдать её parseEntry, счётчик неверных строк будет завышен."
exercise:
  id: "typescript.from-zero.mini-project.exercise"
  title: "Бюджет по категориям"
  prompt: |
    Напишите программу `main.ts`: она читает расходы со стандартного ввода и печатает отчёт. Каждая строка должна иметь вид `категория;сумма`, например `еда;250.5`.

    Правила разбора:

    * Пробелы по краям строки и вокруг частей игнорируются. Строки, которые после удаления пробелов пусты, **игнорируются** совсем (не записи и не неверные).
    * Строка **неверна**, если после разбиения по `;` частей не две, или категория пуста, или сумма (через `Number`) не является числом больше нуля.
    * Неверные строки не влияют на суммы, но считаются.
    * Категории различаются точно: `Еда` и `еда` - разные.

    Отчёт, ровно в таком порядке:

    * по строке `категория: сумма` для каждой категории, по убыванию суммы (при равных суммах - в порядке первого появления категории); сумма с двумя знаками после запятой;
    * `Итого: <общая сумма>` с двумя знаками;
    * `Записей: <количество верных строк>`;
    * `Неверных строк: <количество>`.

    Если верных строк нет, строк с категориями нет, а итоговые три строки печатаются со значениями `0.00`, `0` и количеством неверных.

    Пример. Ввод:

    ```
    еда;250
    кино
    транспорт;60
    еда;100.5
    ```

    Вывод:

    ```
    еда: 350.50
    транспорт: 60.00
    Итого: 410.50
    Записей: 3
    Неверных строк: 1
    ```

    Чтение ввода в заготовке уже записано, а также типы `Entry` и `Total` и два пустых шаблона функций. Скрытые тесты проверяют пустой ввод, ввод из одних неверных строк, окончания строк Windows и равные суммы.
  entryFile: "main.ts"
  evaluation: "io"
  hints:
    - "Работайте этапами. Сначала допишите parseEntry: split(\";\"), проверка parts.length !== 2, trim категории и суммы, Number(...) и проверка Number.isNaN(amount) || amount <= 0. На неверной строке выбрасывайте throw new Error(...)."
    - "addToTotals: найдите итог категории через totals.find(...). Если результат undefined, добавьте totals.push({ category: category, sum: amount }); иначе увеличьте found.sum."
    - "Главный цикл: для каждой строки сделайте trim, пустую пропустите через continue, остальное оберните в try { ... } catch (error) { bad = bad + 1; }. Счётчики и итог увеличивайте только после успешного parseEntry."
    - "Отчёт: const sorted: Total[] = [...totals].sort((a, b) => b.sum - a.sum); затем цикл for...of с console.log(t.category + \": \" + t.sum.toFixed(2)); после него три итоговые строки."
  tests:
    - id: "basic"
      title: "Несколько категорий без неверных строк"
      stdin: |
        еда;250.5
        транспорт;60
        еда;119.5
        транспорт;400
      expected: |
        транспорт: 460.00
        еда: 370.00
        Итого: 830.00
        Записей: 4
        Неверных строк: 0
      hint: "Суммы категорий: транспорт 60 + 400 = 460, еда 250.5 + 119.5 = 370; порядок по убыванию суммы, два знака после запятой."
    - id: "example"
      title: "Пример из условия: одна неверная строка"
      stdin: |
        еда;250
        кино
        транспорт;60
        еда;100.5
      expected: |
        еда: 350.50
        транспорт: 60.00
        Итого: 410.50
        Записей: 3
        Неверных строк: 1
      hint: "Строка «кино» без суммы неверна. Остальные три учитываются: еда 250 + 100.5 = 350.5."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      hidden: true
      stdin: ""
      expected: |
        Итого: 0.00
        Записей: 0
        Неверных строк: 0
      hint: "Когда ввода нет, категорий нет: печатаются только три итоговые строки. Пустая строка не считается неверной."
    - id: "all-bad"
      title: "Только неверные строки (скрытый)"
      hidden: true
      stdin: |
        плохо
        ;100
        еда;0
        еда;-5
        еда;abc
      expected: |
        Итого: 0.00
        Записей: 0
        Неверных строк: 5
      hint: "Все пять строк неверны: нет суммы, пустая категория, сумма 0, отрицательная сумма и слово вместо числа."
    - id: "windows"
      title: "Пробелы и окончания Windows (скрытый)"
      hidden: true
      stdin: " еда ; 10 \r\n еда;20.25\r\nкино; 30\r\n\r\n"
      expected: |
        еда: 30.25
        кино: 30.00
        Итого: 60.25
        Записей: 3
        Неверных строк: 0
      hint: "Пробелы вокруг частей и символ \\r нужно убрать (trim). Одна пустая строка игнорируется."
    - id: "ties"
      title: "Равные суммы (скрытый)"
      hidden: true
      stdin: |
        а;100
        б;100
        в;150
      expected: |
        в: 150.00
        а: 100.00
        б: 100.00
        Итого: 350.00
        Записей: 3
        Неверных строк: 0
      hint: "У категорий «а» и «б» одинаковые суммы: они идут в порядке первого появления, после категории «в»."
    - id: "case-and-parts"
      title: "Регистр и лишние части (скрытый)"
      hidden: true
      stdin: |
        Еда;10
        еда;5
        еда;1;2
      expected: |
        Еда: 10.00
        еда: 5.00
        Итого: 15.00
        Записей: 2
        Неверных строк: 1
      hint: "«Еда» и «еда» - разные категории; строка «еда;1;2» имеет три части и неверна, она не должна добавить 1."
    - id: "rounding"
      title: "Дробные суммы (скрытый)"
      hidden: true
      stdin: |
        x;0.1
        x;0.2
        y;2.5
      expected: |
        y: 2.50
        x: 0.30
        Итого: 2.80
        Записей: 3
        Неверных строк: 0
      hint: "Суммы печатаются с двумя знаками методом toFixed(2): 0.1 + 0.2 даёт 0.30. Порядок: y (2.5) раньше x (0.3)."
