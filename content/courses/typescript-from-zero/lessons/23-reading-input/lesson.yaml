id: "typescript.from-zero.reading-input"
title: "Чтение ввода"
goal: "Прочитать вход программы, разбить его на строки, превратить строки в числа и отличить настоящие числа от текста."
difficulty: "easy"
estimatedMinutes: 50
prerequisites:
  - "typescript.from-zero.errors-and-exceptions"
objectives:
  - "Прочитать весь стандартный ввод записью readFileSync(0, \"utf8\") и объяснить каждую часть импорта и вызова."
  - "Разбить ввод на строки через trim и split и очистить каждую строку от пробелов и символа возврата каретки."
  - "Превратить строку в число функцией Number и распознать неудачу через Number.isNaN."
  - "Вывести число с двумя знаками после запятой методом toFixed(2) и не делить на ноль при пустом вводе."
masteryCriteria:
  - "Программа верно считает количество, сумму или среднее на обычных входных данных."
  - "Пустой ввод и ввод без допустимых значений не приводят к ошибке и к делению на ноль."
  - "Пустые строки игнорируются, нечисловые считаются пропущенными, окончания строк Windows не мешают."
concepts:
  introduces:
    - "ts.read-input"
    - "ts.number-parsing"
  uses:
    - "ts.string"
    - "ts.number"
    - "ts.const"
    - "ts.let"
    - "ts.array"
    - "ts.for-of"
    - "ts.break-continue"
    - "ts.if"
    - "ts.comparison"
    - "ts.logical-operators"
    - "ts.string-methods"
    - "ts.math"
    - "ts.concatenation"
    - "ts.console-log"
    - "ts.throw"
    - "ts.try-catch"
    - "ts.type-annotation"
next:
  - "typescript.from-zero.mini-project"
tags:
  - "typescript"
  - "input"
  - "stdin"
  - "number"
  - "nan"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что делает запись readFileSync(0, \"utf8\")?"
      options:
        - "Читает весь стандартный ввод и возвращает его как одну строку."
        - "Читает файл с именем 0."
        - "Читает только первую строку ввода."
        - "Печатает 0 в кодировке utf8."
      answer: 0
      explanation: "Число 0 - номер стандартного ввода (stdin), а не имя файла. Кодировка \"utf8\" нужна, чтобы получить текст (с кириллицей), а не набор байтов. Результат - одна строка со всем вводом."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```typescript
        console.log(Number("42") + 1);
        console.log("42" + 1);
        ```
      options:
        - "43 и 421"
        - "43 и 43"
        - "421 и 421"
        - "421 и 43"
      answer: 0
      explanation: "Number(\"42\") превращает строку в число 42, и сложение даёт 43. Без Number оператор + склеивает строку «42» с единицей, получается строка «421»."
    - id: "q3"
      type: "single"
      prompt: |
        Как правильно проверить, что Number("abc") не удалось превратить в число?

        ```typescript
        const value: number = Number("abc");
        ```
      options:
        - "Number.isNaN(value)"
        - "value === NaN"
        - "value === undefined"
        - "value === \"abc\""
      answer: 0
      explanation: "Number(\"abc\") возвращает NaN («не число»). NaN не равно ничему, даже самому себе, поэтому value === NaN всегда ложно, и проверка типов сообщает об этом ошибкой TS2845. Для проверки есть Number.isNaN."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```typescript
        console.log(Number(""));
        ```
      options:
        - "0"
        - "NaN"
        - "undefined"
        - "Ошибка во время работы"
      answer: 0
      explanation: "Пустая строка (и строка из одних пробелов) превращается в 0, а не в NaN. Поэтому пустые строки из ввода отсеивают до вызова Number, иначе они будут считаться нулями."
    - id: "q5"
      type: "single"
      prompt: |
        Что сообщит проверка типов?

        ```typescript
        import { readFileSync } from "node:fs";
        const n: number = readFileSync(0, "utf8");
        ```
      options:
        - "TS2322: тип string нельзя присвоить типу number"
        - "TS2304: имя readFileSync не найдено"
        - "TS2845: условие всегда ложно"
        - "Ничего, ввод сам станет числом"
      answer: 0
      explanation: "Ввод всегда приходит строкой. Чтобы получить число, строку нужно явно преобразовать: Number(text.trim())."
exercise:
  id: "typescript.from-zero.reading-input.exercise"
  title: "Оценки из ввода: количество, среднее, лучшая"
  prompt: |
    Напишите программу `main.ts`, которая читает строки со стандартного ввода. Каждая строка - оценка или произвольный текст.

    Правила:

    * Строки, которые после удаления пробелов по краям пусты, **игнорируются** совсем (не оценки и не пропущенные).
    * Оценка допустима, если строка (без пробелов по краям) превращается функцией `Number` в **целое число от 1 до 5** включительно.
    * Все остальные строки (например, `abc`, `3,5`, `4.5`, `0`, `6`) считаются пропущенными.

    Выведите ровно четыре строки: количество допустимых оценок, их среднее с двумя знаками после запятой, лучшую (наибольшую) оценку и количество пропущенных строк. Если допустимых оценок нет, среднее равно `0.00`, а лучшая выводится как `-`.

    Пример. Ввод:

    ```
    5
    abc
    4

    7
    2
    ```

    Вывод:

    ```
    Оценок: 3
    Среднее: 3.67
    Лучшая: 5
    Пропущено: 2
    ```

    Чтение ввода в заготовке уже записано. Скрытые тесты проверяют пустой ввод, ввод без допустимых оценок, пробелы и окончания строк Windows.
  entryFile: "main.ts"
  evaluation: "io"
  hints:
    - "Заготовка уже читает ввод в text. Разбейте его на строки, обойдите строки циклом, а в цикле для каждой строки решите: пустая, допустимая оценка или пропущенная. Понадобятся четыре переменные: количество, сумма, лучшая оценка и пропущенные."
    - "Каждую строку очистите: const line: string = rawLine.trim(); (это же убирает лишний \\r в окончаниях Windows). Пустую строку пропустите через continue. Затем const grade: number = Number(line)."
    - "Строка недопустима, если Number.isNaN(grade) || Math.floor(grade) !== grade || grade < 1 || grade > 5. Такие строки увеличивают счётчик пропущенных, а остальные - количество, сумму и, при необходимости, лучшую оценку."
    - "Среднее считайте только при count > 0, иначе остаётся 0. Выводите среднее как average.toFixed(2). Для «Лучшая» при нуле оценок напечатайте дефис вместо числа."
  tests:
    - id: "basic"
      title: "Обычные оценки без пропусков"
      stdin: |
        5
        4
        4
        3
      expected: |
        Оценок: 4
        Среднее: 4.00
        Лучшая: 5
        Пропущено: 0
      hint: "Четыре оценки, сумма 16, среднее 4, лучшая 5; среднее печатается с двумя знаками, включая «4.00»."
    - id: "mixed"
      title: "Слова, пустая строка, 7 и 3.5 (пример из условия)"
      stdin: |
        5
        abc
        4

        7
        2
      expected: |
        Оценок: 3
        Среднее: 3.67
        Лучшая: 5
        Пропущено: 2
      hint: "«abc» и «7» пропущены, пустая строка не считается ни оценкой, ни пропущенной. Среднее 11 / 3 округляется до 3.67."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      hidden: true
      stdin: ""
      expected: |
        Оценок: 0
        Среднее: 0.00
        Лучшая: -
        Пропущено: 0
      hint: "Когда ввода нет, программа не должна падать и делить на ноль: оценок 0, среднее 0.00, лучшая - дефис. Пустая строка не считается пропущенной."
    - id: "all-bad"
      title: "Ни одной допустимой оценки (скрытый)"
      hidden: true
      stdin: |
        ноль
        0
        6
        -1
        2.5
      expected: |
        Оценок: 0
        Среднее: 0.00
        Лучшая: -
        Пропущено: 5
      hint: "Все пять строк недопустимы: слово, 0, 6, отрицательное и дробное число. Допустимы только целые от 1 до 5."
    - id: "windows"
      title: "Пробелы и окончания Windows (скрытый)"
      hidden: true
      stdin: " 4 \r\n5\r\n\r\n3\r\n"
      expected: |
        Оценок: 3
        Среднее: 4.00
        Лучшая: 5
        Пропущено: 0
      hint: "Пробелы и символ \\r по краям строки нужно убрать (trim). Пустая строка между оценками игнорируется."
    - id: "comma-and-blank"
      title: "Десятичная запятая и пустые строки (скрытый)"
      hidden: true
      stdin: "3,5\n\n   \n5\n4,0\n"
      expected: |
        Оценок: 1
        Среднее: 5.00
        Лучшая: 5
        Пропущено: 2
      hint: "«3,5» и «4,0» с запятой Number не превращает в число, это пропущенные строки. Строки из пробелов игнорируются."
    - id: "rounding"
      title: "Округление и лучшая оценка (скрытый)"
      hidden: true
      stdin: |
        1
        1
        2
      expected: |
        Оценок: 3
        Среднее: 1.33
        Лучшая: 2
        Пропущено: 0
      hint: "Среднее 4 / 3 округляется до двух знаков: 1.33; лучшая - наибольшая из оценок, а не последняя."
