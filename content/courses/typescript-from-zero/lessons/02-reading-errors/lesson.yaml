id: "typescript.from-zero.reading-errors"
title: "Как читать сообщения об ошибках"
goal: "Прочитать сообщение проверки TypeScript, найти строку с ошибкой и исправить программу."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "typescript.from-zero.first-program"
objectives:
  - "Найти в сообщении файл, строку, столбец, код ошибки и причину."
  - "Исправлять ошибки по одной, начиная с первой."
  - "Отличить ошибку, найденную проверкой до запуска, от ошибки во время работы программы."
masteryCriteria:
  - "Вы по сообщению называете строку с ошибкой и объясняете её причину своими словами."
  - "Три разные ошибки в программе исправлены, и она печатает ожидаемые три строки."
concepts:
  introduces:
    - "ts.error-message"
  uses:
    - "ts.program"
    - "ts.console-log"
    - "ts.string-literal"
next:
  - "typescript.from-zero.values-and-types"
tags:
  - "typescript"
  - "errors"
  - "tsc"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что означает начало этого сообщения?

        ```text
        main.ts(7,5): error TS2304: Cannot find name 'total'.
        ```
      options:
        - "Ошибка в файле main.ts, в строке 7, начиная с 5-го столбца."
        - "Ошибка в файле main.ts, в строке 5, в 7-м столбце."
        - "В программе 7 ошибок, из них 5 серьёзные."
        - "Ошибка в строке TS2304 файла main.ts."
      answer: 0
      explanation: "В скобках сначала стоит строка, затем столбец: (7,5) - строка 7, столбец 5. Число после TS - номер ошибки, а не позиция в файле."
    - id: "q2"
      type: "single"
      prompt: "Проверка сообщила о трёх ошибках. С какой начать?"
      options:
        - "С последней: она ближе всего к концу программы."
        - "С любой: порядок не важен."
        - "С первой: остальные могут быть её следствием."
        - "Лучше удалить все три строки."
      answer: 2
      explanation: "Одна ошибка часто тянет за собой другие: например, незакрытая кавычка делает ошибочной и следующую скобку. Исправьте первую, запустите снова и прочитайте новый список."
    - id: "q3"
      type: "single"
      prompt: |
        Что вы увидите, если запустить программу?

        ```typescript
        consol.log("Привет");
        ```
      options:
        - "Напечатается Привет."
        - "Проверка сообщит TS2552 с подсказкой Did you mean 'console'?, и программа не запустится."
        - "Программа напечатает consol.log."
        - "Ничего: программа без ошибок и без вывода."
      answer: 1
      explanation: "Имя consol неизвестно, поэтому проверка останавливает запуск и сама предлагает исправление: console. Выполнение начинается только после чистой проверки."
    - id: "q4"
      type: "single"
      prompt: |
        Программа напечатала «Начало», затем упала с RangeError. Это ошибка какого вида?

        ```typescript
        console.log("Начало");
        console.log("ab".repeat(-1));
        ```
      options:
        - "Ошибка проверки: её нашли до запуска."
        - "Ошибка времени выполнения: проверка пропустила её, она случилась на строке 2 уже при работе."
        - "Ошибка редактора."
        - "Предупреждение, программа продолжит работу."
      answer: 1
      explanation: "Проверка видит, что repeat принимает число, и число -1 подходит по виду. Что повтор -1 раз невозможен, выясняется только во время работы. Такие ошибки называют ошибками времени выполнения; строка, напечатанная до сбоя, остаётся на экране."
exercise:
  id: "typescript.from-zero.reading-errors.exercise"
  title: "Исправьте три ошибки"
  prompt: |
    В `main.ts` программа, которая должна напечатать три строки:

    ```
    Добро пожаловать в магазин
    Сегодня скидка на хлеб
    Касса работает до 21:00
    ```

    Но в ней три ошибки. Запустите её, прочитайте сообщение, исправьте то, что в нём названо, и запустите снова. Не переписывайте программу целиком: каждую ошибку можно исправить, изменив одно-два символа. Обратите внимание, что проверка сначала сообщает об ошибках записи, и только после их исправления показывает ошибки смысла.
  entryFile: "main.ts"
  evaluation: "io"
  hints:
    - "Запустите программу и прочитайте первое сообщение: в скобках указана строка. Исправьте именно её и запустите снова."
    - "В строке 3 опечатка в слове console; в строке 4 название команды log написано с заглавной буквы; в строке 5 нет закрывающей скобки. Сообщения TS2552 и TS2551 подскажут правильный вариант сами."
    - "Должно быть три одинаковые по устройству команды: console.log(\"...\"); с закрывающей скобкой перед точкой с запятой."
  tests:
    - id: "basic"
      title: "Три строки напечатаны"
      stdin: ""
      expected: |
        Добро пожаловать в магазин
        Сегодня скидка на хлеб
        Касса работает до 21:00
      hint: "Программа должна пройти проверку без ошибок и напечатать три строки: приветствие, про скидку и время работы кассы."
    - id: "exact"
      title: "Точные тексты строк (скрытый)"
      stdin: ""
      expected: |
        Добро пожаловать в магазин
        Сегодня скидка на хлеб
        Касса работает до 21:00
      hidden: true
      hint: "Тексты в кавычках менять не нужно: проверяется точное совпадение всех трёх строк, включая «21:00» без точки."
