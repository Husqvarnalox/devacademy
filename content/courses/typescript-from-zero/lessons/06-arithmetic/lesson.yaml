id: "typescript.from-zero.arithmetic"
title: "Арифметика: числа и действия над ними"
goal: "Вычислять выражения с + - * / % **, округлять результат функциями Math и объяснять неточность дробей."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "typescript.from-zero.type-checking"
objectives:
  - "Записать выражение с арифметическими операторами и предсказать результат с учётом приоритета."
  - "Получить остаток от деления и целую часть частного."
  - "Округлить число функциями Math.floor, Math.ceil и Math.round."
  - "Объяснить, почему 0.1 + 0.2 не равно ровно 0.3, и красиво вывести дробь методом toFixed."
masteryCriteria:
  - "Итог, целая доля и остаток вычислены по формулам, а не записаны числами."
  - "Вы читаете TS2362 и понимаете, что арифметика с текстом отвергается."
concepts:
  introduces:
    - "ts.arithmetic"
    - "ts.math"
  uses:
    - "ts.number"
    - "ts.string"
    - "ts.variable"
    - "ts.const"
    - "ts.let"
    - "ts.assignment"
    - "ts.type-inference"
    - "ts.console-log"
    - "ts.error-message"
next:
  - "typescript.from-zero.strings"
tags:
  - "typescript"
  - "arithmetic"
  - "math"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```typescript
        console.log(17 % 5);
        ```
      options:
        - "3"
        - "2"
        - "3.4"
        - "12"
      answer: 1
      explanation: "Оператор % возвращает остаток от деления. 17 = 3 * 5 + 2, поэтому остаток равен 2."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```typescript
        console.log(2 + 3 * 4);
        ```
      options:
        - "20"
        - "14"
        - "24"
        - "9"
      answer: 1
      explanation: "Умножение выполняется раньше сложения: 3 * 4 = 12, затем 2 + 12 = 14. Чтобы сложить первым, нужны скобки: (2 + 3) * 4 = 20."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```typescript
        console.log(Math.floor(9 / 2), 9 / 2);
        ```
      options:
        - "4 4.5"
        - "4.5 4"
        - "5 4.5"
        - "4 4"
      answer: 0
      explanation: "9 / 2 в TypeScript - обычное деление, результат 4.5. Math.floor отбрасывает дробную часть вниз, получается 4."
    - id: "q4"
      type: "single"
      prompt: |
        Что сообщит проверка?

        ```typescript
        const price = "100";
        console.log(price * 2);
        ```
      options:
        - "Ничего: напечатается 200."
        - "TS2362: арифметическое действие допустимо только над числами; price - текст."
        - "TS2322: Type 'number' is not assignable to type 'string'."
        - "Напечатается NaN."
      answer: 1
      explanation: "Умножать текст нельзя: слева стоит значение типа string. Проверка останавливает запуск и сообщает TS2362. Исправьте значение: const price = 100;"
    - id: "q5"
      type: "single"
      prompt: "Почему программа печатает 0.30000000000000004 для 0.1 + 0.2?"
      options:
        - "Это ошибка TypeScript, которую скоро исправят."
        - "Компьютер хранит дроби в двоичном виде, и 0.1 и 0.2 в нём записываются приближённо."
        - "Оператор + для дробей работает неверно."
        - "Результат зависит от региона компьютера."
      answer: 1
      explanation: "Многие десятичные дроби в двоичной записи бесконечны, как 1/3 в десятичной. Хранится близкое число, и при печати видна крошечная погрешность. Для вывода дроби округляют: (0.1 + 0.2).toFixed(2) даёт \"0.30\"."
exercise:
  id: "typescript.from-zero.arithmetic.exercise"
  title: "Счёт на четверых"
  prompt: |
    Четыре человека купили 3 ручки по 40 рублей и 2 тетради по 85 рублей и делят счёт поровну. В заготовке заданы цены и число людей. Вычислите по формулам (не записывая готовые числа) три значения и напечатайте:

    ```
    Итого: 290
    На каждого: 72
    Остаток: 2
    ```

    * `total` - общая сумма: 3 ручки и 2 тетради;
    * `share` - сколько целых рублей приходится на каждого (деление с отбрасыванием дробной части);
    * `rest` - сколько рублей остаётся после того, как каждый заплатит свою целую долю.

    Подсказка о формулах: `Math.floor` отбрасывает дробную часть вниз, а `%` даёт остаток от деления.
  entryFile: "main.ts"
  evaluation: "io"
  hints:
    - "В заготовке три переменные со значением 0 и комментарием TODO. Замените 0 на выражение, использующее penPrice, notebookPrice и people."
    - "Итог: 3 * penPrice + 2 * notebookPrice. Доля: Math.floor(total / people). Остаток: total % people."
    - "const total = 3 * penPrice + 2 * notebookPrice; const share = Math.floor(total / people); const rest = total % people;"
  tests:
    - id: "basic"
      title: "Итог, доля и остаток"
      stdin: ""
      expected: |
        Итого: 290
        На каждого: 72
        Остаток: 2
      hint: "3 * 40 + 2 * 85 = 290; 290 делится на 4 как 72 с остатком 2. Три строки в указанном формате."
    - id: "exact"
      title: "Точный вывод (скрытый)"
      stdin: ""
      expected: |
        Итого: 290
        На каждого: 72
        Остаток: 2
      hidden: true
      hint: "Проверяется точное совпадение: доля 72 (а не 72.5), остаток 2; значения - числа без лишних знаков."
