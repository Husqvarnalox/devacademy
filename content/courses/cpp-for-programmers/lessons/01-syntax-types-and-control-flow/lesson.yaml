id: "cpp.programmers.syntax-types-and-control-flow"
title: "Числа, строки и управление потоком: ловушки C++"
goal: "Писать вычисления с целыми и дробными числами, остатком и выбором по значению так, чтобы переполнение, неинициализированные переменные и беззнаковые размеры не приводили к неопределённому поведению."
difficulty: "medium"
estimatedMinutes: 45
prerequisites: []
next:
  - "cpp.programmers.functions-collections-and-strings"
objectives:
  - "Предсказывать результат целочисленного деления и остатка для отрицательных чисел и избегать переполнения знакового int."
  - "Инициализировать каждую переменную и объяснять, почему чтение неинициализированной переменной - неопределённое поведение."
  - "Объяснять, что size() беззнаковый и считает байты, и писать условия без выражения size() - 1."
  - "Считать суммы в long long и хранить деньги в целых копейках."
  - "Различать залипающие манипуляторы вывода (fixed, setprecision, boolalpha) и сбрасывать их."
masteryCriteria:
  - "average, floorMod, discounted и grade дают верные результаты на обычных и граничных значениях: переполнение int, отрицательные числа, середина между копейками, оценки вне диапазона."
  - "Квиз пройден с результатом не ниже 70%."
