quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```cpp
        #include <iostream>

        int main() {
            std::cout << -7 / 2 << " " << -7 % 3 << "\n";
        }
        ```
      options:
        - "-4 2"
        - "-3 -1"
        - "-3 2"
        - "-4 -1"
      answer: 1
      explanation: "Деление целых отбрасывает дробную часть к нулю, поэтому -7 / 2 равно -3. Остаток получает знак делимого: -7 = (-2) * 3 + (-1), то есть -7 % 3 равно -1. Результаты -4 и 2 типичны для Python, но не для C++."
    - id: "q2"
      type: "single"
      prompt: |-
        Что можно утверждать о программе?

        ```cpp
        #include <iostream>
        #include <limits>

        int main() {
            int x = std::numeric_limits<int>::max();
            x = x + 1;
            std::cout << x << "\n";
        }
        ```
      options:
        - "Выведет -2147483648: значение оборачивается, как в Java"
        - "Бросит исключение std::overflow_error"
        - "Поведение не определено: стандарт не задаёт результат переполнения знакового int"
        - "Не скомпилируется"
      answer: 2
      explanation: "Переполнение знакового целого в C++ - неопределённое поведение. На практике часто получается -2147483648, но это не гарантия: оптимизатор вправе считать, что переполнения не бывает. Исключение не бросается, оборачивание гарантировано только для беззнаковых типов."
    - id: "q3"
      type: "single"
      prompt: |-
        Что верно про программу?

        ```cpp
        #include <iostream>

        int main() {
            int total;
            for (int i = 1; i <= 3; i++) {
                total += i;
            }
            std::cout << total << "\n";
        }
        ```
      options:
        - "Выведет 6: int по умолчанию равен нулю"
        - "Выведет случайное число или что-то непредсказуемое: чтение неинициализированной переменной - UB"
        - "Не скомпилируется: переменная не инициализирована"
        - "Выведет 0, потому что total объявлена вне цикла"
      answer: 1
      explanation: "Локальная переменная встроенного типа без инициализатора содержит неопределённое значение, а первое total += i его читает. Компилятор может предупредить (-Wuninitialized), но не обязан. Исправление: int total = 0;"
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```cpp
        #include <iostream>
        #include <string>

        int main() {
            std::string s;
            std::cout << (0 < s.size() - 1) << "\n";
        }
        ```
      options:
        - "0: размер пустой строки равен нулю, а 0 < -1 ложно"
        - "1: s.size() - 1 беззнаковое и оборачивается в огромное число"
        - "Не скомпилируется: нельзя вычитать из size()"
        - "Бросит исключение std::out_of_range"
      answer: 1
      explanation: "size() возвращает std::size_t, беззнаковое число. Вычитание единицы из нуля оборачивается в 18446744073709551615, поэтому сравнение истинно. Для знакового результата преобразуйте размер заранее: static_cast<long long>(s.size()) - 1."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```cpp
        #include <iostream>

        int main() {
            char c = 'a';
            std::cout << c << " " << c + 1 << "\n";
        }
        ```
      options:
        - "a b"
        - "a 98"
        - "a 1"
        - "97 98"
      answer: 1
      explanation: "Сам c печатается как символ a. Выражение c + 1 имеет тип int (арифметика повышает char до int) и равно 98, а cout печатает int числом. Чтобы получить символ b, нужно static_cast<char>(c + 1)."
exercise:
  id: "cpp.programmers.syntax-types-and-control-flow.exercise"
  title: "Среднее, остаток, цена со скидкой и оценка"
  prompt: |
    Готовая функция `main` читает команды (по одной на строку) и печатает результат вызова ваших функций. Допишите четыре функции над `main` в `main.cpp`. Функцию `main` не меняйте.

    1. `int average(int a, int b)` - среднее двух чисел как `int`, дробная часть отбрасывается к нулю. Результат должен быть верным и для больших значений (`2147483647` и `2147483647`): переполнения быть не должно.
    2. `int floorMod(int a, int b)` - остаток от деления `a` на `b` (`b` больше нуля), всегда от `0` до `b - 1`: `floorMod(-7, 3)` равно `2`.
    3. `long long discounted(long long cents, int percent)` - цена в копейках после скидки в процентах: `cents * (100 - percent) / 100`, округлённая до целых копеек. Половина копейки округляется вверх: `2.5` копейки дают `3`. Все значения неотрицательны.
    4. `char grade(int score)` - `'A'` от 90, `'B'` от 75, `'C'` от 60, иначе `'D'`; для значений вне диапазона от 0 до 100 - `'?'`.

    Команда `total` печатает цену в рублях и копейках: `total 5997 15` даёт `50.97`.

    **Пример.** Для ввода

    ```
    avg 10 20
    mod -7 3
    total 5997 15
    grade 75
    ```

    программа печатает

    ```
    15
    2
    50.97
    B
    ```

    Часть тестов скрыта: в них переполнение, ничья при округлении и граничные оценки.
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "В заготовке функции возвращают приближённый результат. Каждую можно проверять отдельно: команда avg вызывает average, mod - floorMod, total - discounted, grade - grade."
    - "average: сложите числа в long long (static_cast<long long>(a) + b), поделите на 2 и приведите результат к int. floorMod: ((a % b) + b) % b."
    - "discounted: умножьте cents на (100 - percent), прибавьте 50 и поделите на 100 - так половина копейки округляется вверх. Считайте в long long."
    - "grade: сначала проверьте диапазон (score < 0 || score > 100 - вернуть '?'), затем границы от большей к меньшей: 90, 75, 60."
  tests:
    - id: "average-and-mod"
      title: "Среднее и остаток для обычных чисел"
      stdin: "avg 10 20\navg 7 8\nmod 7 3\nmod -7 3\n"
      expected: |
        15
        7
        1
        2
      hint: "avg 7 8 даёт 15 / 2 = 7 (дробная часть отбрасывается); mod -7 3 даёт 2, а не -1."
    - id: "total-and-grade"
      title: "Цена со скидкой и оценки"
      stdin: "total 5997 15\ngrade 95\ngrade 75\ngrade 59\n"
      expected: |
        50.97
        A
        B
        D
      hint: "5997 копеек со скидкой 15% - это 85% от суммы: 5097.45 копейки, округляется до 5097, то есть 50.97. Оценка 75 - это B, а 59 - D."
    - id: "overflow"
      title: "Среднее больших и отрицательных чисел (скрытый)"
      stdin: "avg 2147483647 2147483647\navg -7 -8\navg -2147483648 -2147483648\navg 2000000000 2000000000\n"
      expected: |
        2147483647
        -7
        -2147483648
        2000000000
      hidden: true
      hint: "Сумма двух больших int не помещается в int: вычисляйте в long long. Деление усекает к нулю, поэтому среднее -7 и -8 равно -7."
    - id: "rounding-ties"
      title: "Округление половины копейки (скрытый)"
      stdin: "total 5 50\ntotal 533 50\ntotal 1000 0\ntotal 0 30\ntotal 99 100\n"
      expected: |
        0.03
        2.67
        10.00
        0.00
        0.00
      hidden: true
      hint: "Половина копейки округляется вверх: 5 копеек со скидкой 50% - это 2.5 копейки, то есть 3 (0.03); 533 со скидкой 50% - 266.5, то есть 267 (2.67). Прибавьте 50 перед делением на 100."
    - id: "mod-and-grade-edges"
      title: "Граничные остатки и оценки (скрытый)"
      stdin: "mod -3 3\nmod -1 5\nmod 0 4\ngrade 90\ngrade 89\ngrade 60\ngrade 0\ngrade 101\ngrade -1\n"
      expected: |
        0
        4
        0
        A
        B
        C
        D
        ?
        ?
      hidden: true
      hint: "mod -3 3 даёт 0, а mod -1 5 даёт 4. Оценки 90, 60 и 0 лежат на границах: 90 - A, 60 - C, 0 - D; значения 101 и -1 вне диапазона и дают ?."
