id: "go-for-programmers"
version: "1.0.0"
title: "Go для программистов"
description: "Быстрый путь для тех, кто уже пишет на другом языке (Python, Java, JavaScript, C#): четыре плотных урока о том, что в Go устроено иначе и где чаще всего ошибаются. Синтаксис и управление потоком, функции и ошибки-значения, массивы, срезы, карты и строки, потоковый ввод. Каждый урок завершается упражнением с запуском тестов и квизом на типичные ловушки; успешное прохождение засчитывает соответствующие уроки курса «Go с нуля». Это не замена курсу для начинающих: основы программирования здесь считаются известными."
languageId: "go"
level: 1
track: "go"
lessons:
  - "01-syntax-and-control-flow"
  - "02-functions-and-errors"
  - "03-collections-and-strings"
  - "04-streams-and-text"
