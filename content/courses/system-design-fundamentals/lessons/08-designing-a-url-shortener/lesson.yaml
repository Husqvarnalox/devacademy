id: "system-design.fundamentals.designing-a-url-shortener"
title: "Проектирование сервиса коротких ссылок"
goal: "Пройти полный цикл проектирования на примере сокращателя ссылок: требования, оценка, API, кодирование base62, генерация идентификаторов и обработка коллизий, хранилище, кеш и путь масштабирования."
difficulty: "hard"
estimatedMinutes: 110
prerequisites:
  - "system-design.fundamentals.messaging-and-async-processing"
related:
  - "databases.sql.indexes-and-query-plans"
  - "networking.fundamentals.http-evolution"
  - "networking.fundamentals.udp-and-dns"
next: []
seeAlso:
  - "Распределённые генераторы идентификаторов (Snowflake-подобные схемы)"
  - "Защита от злоупотреблений: проверка ссылок и ограничение создания"
objectives:
  - "Собрать функциональные и нефункциональные требования сервиса и оценить нагрузку и объём хранилища по правилам из первого урока."
  - "Спроектировать API: создание, редирект (301 или 302), удаление и срок жизни."
  - "Реализовать кодирование и декодирование base62 и объяснить, сколько ссылок покрывает код длины L."
  - "Сравнить генерацию кода счётчиком и хешем: уникальность, предсказуемость, коллизии и их обработка."
  - "Показать, как кеш, чтение с реплик, партиционирование и асинхронная аналитика встраиваются в дизайн."
masteryCriteria:
  - "Вы называете соотношение чтений и записей и выводите из него, где нужен кеш."
  - "Вы считаете, какой длины код нужен для заданного числа ссылок, и проверяете это арифметикой."
  - "Вы объясняете, почему хеш требует обработки коллизий, а счётчик требует координации."
  - "Вы выбираете между 301 и 302 с учётом кеширования браузером и аналитики."
tags:
  - "system-design"
  - "url-shortener"
  - "base62"
  - "hashing"
  - "collisions"
  - "caching"
  - "api-design"
  - "case-study"
facts:
  - kind: "internals"
    text: "Код 301 Moved Permanently означает постоянное перенаправление и по умолчанию может кешироваться клиентами; 302 Found - временное. Для сокращателя с аналитикой переходов чаще выбирают 302, чтобы каждый запрос доходил до сервиса."
    sources:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/301"
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/302"
  - kind: "internals"
    text: "RFC 3986 определяет «незарезервированные» символы URI: буквы ASCII, цифры и - . _ ~. Алфавит base62 из цифр и латинских букв целиком состоит из таких символов и безопасен в пути URL без процентного кодирования."
    sources:
      - "https://www.rfc-editor.org/rfc/rfc3986#section-2.3"
  - kind: "real-world"
    text: "Семантика методов и кодов перенаправления (301, 302, 307, 308) определяется RFC 9110: 307 и 308 сохраняют метод запроса, 301 и 302 исторически допускают его замену на GET."
    sources:
      - "https://www.rfc-editor.org/rfc/rfc9110#section-15.4"
  - kind: "performance"
    text: "Число кодов длины L над алфавитом из 62 символов равно 62^L: 62^6 около 5,7 * 10^10, 62^7 около 3,5 * 10^12. Поэтому семи символов хватает для триллионов ссылок."
    sources:
      - "https://en.wikipedia.org/wiki/Base62"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "numeric"
      prompt: "Сколько различных кодов длины 4 можно составить из алфавита base62? Ответ округлите до целого числа миллионов."
      answer: 15
      tolerance: 0.5
      explanation: "62^4 = 14 776 336, то есть около 15 миллионов."
    - id: "q2"
      type: "single"
      prompt: "Какое главное свойство нагрузки сокращателя ссылок определяет архитектуру?"
      options:
        - "Чтений (переходов) на порядки больше, чем записей"
        - "Записей больше, чем чтений"
        - "Все ссылки читаются равномерно"
        - "Нагрузка не зависит от времени"
      answer: 0
      explanation: "Соотношение чтения и записи сильно смещено в чтение, поэтому оправдан кеш, а запись можно держать простой."
    - id: "q3"
      type: "single"
      prompt: "Почему при генерации кода по хешу нужна обработка коллизий?"
      options:
        - "Разные URL могут получить один и тот же сокращённый код"
        - "MD5 нельзя вычислить для URL"
        - "Хеш всегда длиннее 7 символов"
        - "Коллизий не бывает при любой длине"
      answer: 0
      explanation: "Код получается урезанием хеша до L символов, пространство конечно (62^L), поэтому совпадения неизбежны и растут с заполнением."
    - id: "q4"
      type: "single"
      prompt: "Чем неудобен один глобальный счётчик как источник идентификаторов?"
      options:
        - "Это точка координации и единая точка отказа, а коды предсказуемы"
        - "Он создаёт коллизии"
        - "Он не работает с base62"
        - "Он не позволяет хранить ссылки"
      answer: 0
      explanation: "Счётчик гарантирует уникальность без коллизий, но требует координации между узлами (например, выдачи диапазонов), а последовательные коды легко перебрать."
    - id: "q5"
      type: "multiple"
      prompt: "Что разумно вынести из синхронного пути редиректа? Выберите все верные."
      options:
        - "Запись события клика в очередь для аналитики"
        - "Чтение кода из кеша перед обращением к базе"
        - "Подсчёт статистики прямо в запросе с блокировкой"
        - "Обновление счётчика переходов с блокировкой строки"
      answer:
        - 0
        - 1
      explanation: "Редирект должен быть быстрым: чтение идёт через кеш, а аналитика - асинхронно через очередь. Блокирующие обновления на горячем пути создают узкое место."
exercise:
  id: "system-design.fundamentals.designing-a-url-shortener.exercise"
  title: "Base62 и сокращатель с обработкой коллизий"
  prompt: |
    Реализуйте ядро сокращателя ссылок: кодирование base62 и генерацию кодов в одном из двух режимов.

    **Формат ввода.** Первая строка задаёт режим: `counter <START>` или `hash <LEN>`. Далее команды (аргумент один, без пробелов):

    * `ENCODE <n>` - вывести `ENCODE <n> <код>`;
    * `DECODE <код>` - вывести `DECODE <код> <n>`;
    * `SHORTEN <url>` - создать короткий код;
    * `RESOLVE <код>` - вывести `RESOLVE <код> <url>` или `RESOLVE <код> NOT_FOUND`.

    **Вывод `SHORTEN`.** Если URL уже сокращался, `SHORTEN <url> <код> existing`; иначе `SHORTEN <url> <код> attempts=<k>`, где `k` - число проверенных кандидатов. В конце: `urls=<число URL> collisions=<число отвергнутых кандидатов>`.

    **Соглашения симулятора:**

    * Алфавит base62 по порядку: `0-9`, затем `A-Z`, затем `a-z` (значение `0` - символ `0`, `10` - `A`, `36` - `a`, `61` - `z`). `ENCODE 0` даёт `0`, прочие числа кодируются без ведущих нулей: `ENCODE 62` - `10`.
    * **Режим `counter START`:** счётчик начинается со `START` и растёт на 1 при каждом новом URL; код - `ENCODE(счётчик)`. Коллизий нет, `attempts=1`. Для уже известного URL счётчик не расходуется.
    * **Режим `hash LEN`:** кандидат для попытки `a` (с `0`): берём строку `s = url` при `a = 0` и `s = url + "#" + a` при `a > 0`; `d = int(md5(s в UTF-8).hexdigest(), 16)`; код - `ENCODE(d mod 62^LEN)`, дополненный слева символами `0` до длины `LEN`. Если код уже занят другим URL, это коллизия: `collisions` увеличивается на 1, пробуется следующая попытка.
    * Одинаковые URL получают тот же код (`existing`), хранилище только растёт, удалений нет.
    * Случайные числа и время не используются.

    **Пример.** Режим `counter 125`: `SHORTEN http://a.com` даёт код `21` (`125 = 2*62 + 1`) и `attempts=1`; `ENCODE 3843` - `zz`; `DECODE zz` - `3843`.
  entryFile: "main.py"
  evaluation: "io"
  starter: "exercise/starter"
  solution: "exercise/solution"
  hints:
    - "ENCODE: пока n > 0, берите divmod(n, 62) и добавляйте ALPHABET[остаток]; в конце переверните строку. Отдельно обработайте n = 0."
    - "DECODE - свёртка: n = n * 62 + ALPHABET.index(ch) по символам слева направо. Проверьте обратимость: decode(encode(n)) == n."
    - "hash_code: s = url если attempt == 0, иначе f\"{url}#{attempt}\"; digest = int(hashlib.md5(s.encode()).hexdigest(), 16); код = encode(digest % 62**length).rjust(length, \"0\")."
    - "Храните два словаря: by_code и by_url. В режиме hash пробуйте попытки 0, 1, 2, ... пока код не окажется свободным; каждую занятую считайте в collisions. Проверка вручную: counter 125 -> \"21\", ENCODE 3843 -> \"zz\"."
  tests:
    - id: "sample"
      title: "Пример из условия: режим counter"
      stdin: |
        counter 125
        SHORTEN http://a.com
        ENCODE 3843
        DECODE zz
      expected: |
        SHORTEN http://a.com 21 attempts=1
        ENCODE 3843 zz
        DECODE zz 3843
        urls=1 collisions=0
      compare: "trim"
      hint: "125 = 2*62 + 1, значит код \"21\"; 3843 = 61*62 + 61, значит \"zz\"."
    - id: "counter-resolve"
      title: "counter: повторный URL не расходует счётчик, RESOLVE"
      stdin: |
        counter 61
        SHORTEN http://x.org/a
        SHORTEN http://x.org/b
        SHORTEN http://x.org/a
        SHORTEN http://x.org/c
        RESOLVE z
        RESOLVE 10
        RESOLVE 11
        RESOLVE nope
      expected: |
        SHORTEN http://x.org/a z attempts=1
        SHORTEN http://x.org/b 10 attempts=1
        SHORTEN http://x.org/a z existing
        SHORTEN http://x.org/c 11 attempts=1
        RESOLVE z http://x.org/a
        RESOLVE 10 http://x.org/b
        RESOLVE 11 http://x.org/c
        RESOLVE nope NOT_FOUND
        urls=3 collisions=0
      compare: "trim"
      hint: "Для повторного URL выведите existing и не увеличивайте счётчик; RESOLVE неизвестного кода даёт NOT_FOUND."
    - id: "encode-decode"
      title: "ENCODE и DECODE: границы разрядов"
      stdin: |
        counter 0
        ENCODE 0
        ENCODE 9
        ENCODE 10
        ENCODE 35
        ENCODE 36
        ENCODE 61
        ENCODE 62
        ENCODE 3844
        ENCODE 1000000
        DECODE 100
        DECODE zzz
        DECODE 4c92
      expected: |
        ENCODE 0 0
        ENCODE 9 9
        ENCODE 10 A
        ENCODE 35 Z
        ENCODE 36 a
        ENCODE 61 z
        ENCODE 62 10
        ENCODE 3844 100
        ENCODE 1000000 4C92
        DECODE 100 3844
        DECODE zzz 238327
        DECODE 4c92 1099944
        urls=0 collisions=0
      compare: "trim"
      hidden: true
      hint: "Границы: 0 -> 0, 9 -> 9, 10 -> A, 61 -> z, 62 -> 10, 3844 -> 100."
    - id: "hash-basic"
      title: "hash LEN=6: коды фиксированной длины, existing, RESOLVE"
      stdin: |
        hash 6
        SHORTEN http://e.com/1
        SHORTEN http://e.com/2
        SHORTEN http://e.com/1
        RESOLVE nothere
        SHORTEN https://example.org/a/b?c=d
      expected: |
        SHORTEN http://e.com/1 I1ec0S attempts=1
        SHORTEN http://e.com/2 iqXNIi attempts=1
        SHORTEN http://e.com/1 I1ec0S existing
        RESOLVE nothere NOT_FOUND
        SHORTEN https://example.org/a/b?c=d JtDmtU attempts=1
        urls=3 collisions=0
      compare: "trim"
      hidden: true
      hint: "Код дополняется нулями слева до LEN. Одинаковые URL повторно дают existing."
