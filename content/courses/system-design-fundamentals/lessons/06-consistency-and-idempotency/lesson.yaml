id: "system-design.fundamentals.consistency-and-idempotency"
title: "Согласованность, CAP/PACELC и идемпотентность"
goal: "Различать модели согласованности, объяснять CAP и PACELC без мифов и проектировать идемпотентные операции, чтобы повторы запросов не приводили к двойному эффекту."
difficulty: "hard"
estimatedMinutes: 100
prerequisites:
  - "system-design.fundamentals.partitioning-and-replication"
related:
  - "databases.sql.transactions-and-isolation"
  - "networking.fundamentals.tcp-connections-and-congestion"
  - "python.concurrency.cancellation-and-timeouts"
next:
  - "system-design.fundamentals.messaging-and-async-processing"
seeAlso:
  - "Линеаризуемость и сериализуемость: формальные определения"
  - "Саги и компенсирующие транзакции вместо распределённых транзакций"
  - "Outbox-паттерн (упоминается в уроке про сообщения)"
objectives:
  - "Отличить сильную, причинную и итоговую (eventual) согласованность и привести примеры систем."
  - "Правильно сформулировать CAP: при сетевом разделении выбор между согласованностью и доступностью; описать PACELC."
  - "Объяснить, почему сеть ненадёжна и почему повтор запроса без защиты опасен."
  - "Спроектировать идемпотентный API с ключом идемпотентности: повтор, дубликат, конфликт полезных нагрузок."
  - "Объяснить, почему «ровно один раз» на практике достигается как «минимум один раз плюс дедупликация»."
masteryCriteria:
  - "Вы называете, что выбирает система при разделении сети (CP или AP) и чем это отличается от нормальной работы (задержка против согласованности в PACELC)."
  - "Вы объясняете, чем идемпотентная операция отличается от безопасной и почему POST по умолчанию неидемпотентен."
  - "Вы описываете поведение сервера при повторе запроса с тем же ключом и тем же телом, и с тем же ключом и другим телом."
  - "Вы не обещаете «exactly-once доставку» в сети, а описываете эффективно однократную обработку."
tags:
  - "system-design"
  - "consistency"
  - "cap"
  - "pacelc"
  - "idempotency"
  - "exactly-once"
  - "retries"
  - "eventual-consistency"
facts:
  - kind: "historical"
    text: "Теорема CAP (гипотеза Брюера, формализованная Гилбертом и Линчем) утверждает, что распределённая система при разделении сети не может одновременно обеспечить и линеаризуемую согласованность, и доступность каждого запроса. Брюер позже пояснял, что формулировка «выберите два из трёх» вводит в заблуждение: разделение сети нельзя «не выбрать», и выбор делается только на время разделения."
    sources:
      - "https://groups.csail.mit.edu/tds/papers/Gilbert/Brewer2.pdf"
      - "https://www.infoq.com/articles/cap-twelve-years-later-how-the-rules-have-changed/"
  - kind: "internals"
    text: "PACELC (Дэниэл Абади) расширяет CAP: если есть разделение (P), выбираем между доступностью и согласованностью (A/C); иначе (E, else) выбираем между задержкой и согласованностью (L/C). Даже без отказов репликация с синхронным подтверждением стоит задержки."
    sources:
      - "https://www.cs.umd.edu/~abadi/papers/abadi-pacelc.pdf"
  - kind: "real-world"
    text: "Вернер Фогелс описывает итоговую (eventual) согласованность: если новых обновлений нет, то со временем все чтения возвращают последнее значение. Он выделяет варианты (чтение своих записей, монотонное чтение, сессионная согласованность), которые усиливают гарантию для конкретного клиента."
    sources:
      - "https://www.allthingsdistributed.com/2008/12/eventually_consistent.html"
  - kind: "real-world"
    text: "API платёжных систем принимают заголовок Idempotency-Key: сервер запоминает результат первого запроса с данным ключом и возвращает тот же результат при повторах; если ключ повторно использован с другими параметрами, возвращается ошибка. Ключи живут ограниченное время."
    sources:
      - "https://docs.stripe.com/api/idempotent_requests"
  - kind: "real-world"
    text: "Amazon рекомендует проектировать API так, чтобы повтор был безопасен: клиент передаёт уникальный идентификатор запроса, а сервис атомарно записывает результат вместе с идентификатором. Тогда ретраи, нужные из-за таймаутов, не создают дубликатов."
    sources:
      - "https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/"
  - kind: "misconception"
    text: "Доставка «ровно один раз» в ненадёжной сети невозможна: отправитель не отличит потерю запроса от потери ответа. Системы, заявляющие exactly-once, на самом деле комбинируют повтор (at-least-once) с дедупликацией или атомарной записью результата."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что верно про CAP в системе во время сетевого разделения?"
      options:
        - "Можно получить и линеаризуемую согласованность, и доступность каждого запроса"
        - "Приходится выбирать между согласованностью и доступностью"
        - "Разделение сети можно исключить, выбрав надёжное оборудование"
        - "CAP говорит о том, что три свойства несовместимы всегда"
      answer: 1
      explanation: "Разделения происходят, и на время разделения узлы по разные стороны либо отвечают (доступность), рискуя расхождением, либо отказывают (согласованность)."
    - id: "q2"
      type: "single"
      prompt: "Что добавляет PACELC к CAP?"
      options:
        - "Выбор между задержкой и согласованностью даже без разделений"
        - "Выбор шифрования"
        - "Выбор формата сообщений"
        - "Правила шардирования"
      answer: 0
      explanation: "Если разделения нет (Else), приходится выбирать между задержкой (Latency) и согласованностью (Consistency): синхронная репликация дороже."
    - id: "q3"
      type: "single"
      prompt: "Клиент отправил платёж и не получил ответа из-за таймаута. Как безопасно повторить запрос?"
      options:
        - "Отправить тот же запрос с тем же ключом идемпотентности"
        - "Отправить тот же запрос с новым ключом идемпотентности"
        - "Не повторять и считать платёж проваленным"
        - "Повторять с растущим размером суммы"
      answer: 0
      explanation: "Тот же ключ позволяет серверу распознать повтор и вернуть результат первого выполнения без второго списания."
    - id: "q4"
      type: "single"
      prompt: "Сервер получил запрос с ключом идемпотентности, уже использованным ранее, но с другой суммой платежа. Что правильно?"
      options:
        - "Выполнить новый платёж"
        - "Вернуть ошибку конфликта и ничего не менять"
        - "Вернуть результат первого платежа, как будто сумма та же"
        - "Удалить ключ и выполнить заново"
      answer: 1
      explanation: "Ключ относится к конкретной операции; повторное использование с другими параметрами - ошибка клиента, которую нужно показать, а не молча проигнорировать."
    - id: "q5"
      type: "multiple"
      prompt: "Какие операции идемпотентны по природе? Выберите все."
      options:
        - "PUT /users/42 с полным телом профиля"
        - "DELETE /orders/7"
        - "POST /payments (создать платёж)"
        - "Установка флага active = true"
      answer:
        - 0
        - 1
        - 3
      explanation: "Повтор PUT, DELETE и установки значения оставляет систему в том же состоянии. POST создаёт новый платёж при каждом вызове, поэтому ему нужен ключ идемпотентности."
exercise:
  id: "system-design.fundamentals.consistency-and-idempotency.exercise"
  title: "Процессор запросов с ключами идемпотентности"
  prompt: |
    Реализуйте обработчик платёжных запросов с ключами идемпотентности и распечатайте исход для каждой строки журнала.

    **Формат ввода.** Первая строка: `L` - предел суммы списаний на один счёт. Далее запросы по одному в строке: `<key> <account> <amount>`; ключ `-` означает «ключа нет». Номер запроса `n` - порядковый номер строки журнала, начиная с 1 (первая строка после предела).

    **Вывод.** Для каждого запроса: `<n> <key> <исход>`, где исход - одно из:

    * `OK charge=c<k> charged=<сумма списаний по счёту после запроса>` - платёж проведён (номера платежей `c1, c2...` сквозные по успешным платежам);
    * `DECLINED` - отклонён: сумма списаний по счёту превысила бы `L`;
    * `INVALID` - сумма не положительна;
    * `REPLAY <исход первого запроса>` - повтор: тот же ключ и те же счёт и сумма;
    * `CONFLICT` - тот же ключ, но другие счёт или сумма.

    После запросов: по строке `ACCOUNT <счёт> charged=<сумма>` для каждого счёта, на котором были успешные платежи (по алфавиту), и последняя строка `charges=<число платежей>`.

    **Соглашения симулятора:**

    * Первый запрос с ключом (не `-`) выполняется и **запоминается вместе с исходом** (включая `DECLINED` и `INVALID`): все последующие запросы с тем же ключом и той же нагрузкой `(счёт, сумма)` возвращают `REPLAY` с точной копией исхода первого запроса, состояние не меняется (повтор `OK` не списывает деньги второй раз, строка `charged=...` в повторе - значение из первого ответа).
    * Запрос с ключом, уже виденным, но с другой нагрузкой, даёт `CONFLICT` и **не меняет состояние**; запомненный исход ключа тоже не меняется.
    * Запрос без ключа (`-`) всегда выполняется как новый и не запоминается: повтор такого запроса спишет деньги ещё раз.
    * Проверки по порядку: `amount <= 0` - `INVALID`; затем `charged[account] + amount > L` - `DECLINED`; иначе `OK` (сумма ровно `L` допустима).
    * Сумма - целое число (может быть отрицательной или нулём во входе). Время жизни ключей не моделируется: ключ действует до конца журнала.

    **Пример.** `L = 100`; запросы: `k1 acc 40` (`OK charge=c1 charged=40`), `k2 acc 30` (`OK charge=c2 charged=70`), `k1 acc 40` (`REPLAY OK charge=c1 charged=40`, повтор не списывает), `k1 acc 50` (`CONFLICT`), `- acc 20` (`OK charge=c3 charged=90`), `- acc 20` (`DECLINED`, было бы 110). Итог: `ACCOUNT acc charged=90`, `charges=3`.
  entryFile: "main.py"
  evaluation: "io"
  starter: "exercise/starter"
  solution: "exercise/solution"
  hints:
    - "Храните два словаря: charged (счёт -> сумма) и seen (ключ -> (счёт, сумма, текст исхода)). Обрабатывайте строки по порядку, номер n начинайте с 1."
    - "Ветвление: если ключ не \"-\" и он уже в seen - сравните (счёт, сумма): совпало -> \"REPLAY \" + сохранённый исход, иначе CONFLICT; в обоих случаях состояние не меняется и дальше идти не нужно (continue)."
    - "Новый запрос: amount <= 0 -> INVALID; charged[acc] + amount > L -> DECLINED; иначе увеличьте счётчик платежей, charged[acc] и сформируйте \"OK charge=c<k> charged=<сумма>\". Сохраните в seen исход (в том числе DECLINED/INVALID), если ключ не \"-\"."
    - "Проверка вручную по примеру из условия: после k1 и k2 charged = 70; повтор k1 не меняет его, CONFLICT не меняет его, затем - 20 даёт 90, второй - 20 даст 110 > 100 и DECLINED."
  tests:
    - id: "sample"
      title: "Пример из условия"
      stdin: |
        100
        k1 acc 40
        k2 acc 30
        k1 acc 40
        k1 acc 50
        - acc 20
        - acc 20
      expected: |
        1 k1 OK charge=c1 charged=40
        2 k2 OK charge=c2 charged=70
        3 k1 REPLAY OK charge=c1 charged=40
        4 k1 CONFLICT
        5 - OK charge=c3 charged=90
        6 - DECLINED
        ACCOUNT acc charged=90
        charges=3
      compare: "trim"
      hint: "Повтор k1 возвращает исход первого запроса, k1 с другой суммой даёт CONFLICT, запросы без ключа списываются повторно."
    - id: "retry-storm"
      title: "Шторм повторов: пять попыток одного платежа"
      stdin: |
        200
        pay-7 alice 50
        pay-7 alice 50
        pay-7 alice 50
        pay-7 alice 50
        pay-7 alice 50
      expected: |
        1 pay-7 OK charge=c1 charged=50
        2 pay-7 REPLAY OK charge=c1 charged=50
        3 pay-7 REPLAY OK charge=c1 charged=50
        4 pay-7 REPLAY OK charge=c1 charged=50
        5 pay-7 REPLAY OK charge=c1 charged=50
        ACCOUNT alice charged=50
        charges=1
      compare: "trim"
      hint: "Платёж проводится один раз: charges=1, остальные четыре - REPLAY OK charge=c1 charged=50."
    - id: "declined-is-replayed"
      title: "Отказ тоже запоминается"
      stdin: |
        100
        a1 x 80
        a2 x 50
        a2 x 50
        a3 x 20
        a2 x 50
        a2 x 10
      expected: |
        1 a1 OK charge=c1 charged=80
        2 a2 DECLINED
        3 a2 REPLAY DECLINED
        4 a3 OK charge=c2 charged=100
        5 a2 REPLAY DECLINED
        6 a2 CONFLICT
        ACCOUNT x charged=100
        charges=2
      compare: "trim"
      hidden: true
      hint: "Повтор отклонённого запроса возвращает сохранённый исход REPLAY DECLINED (ключ a2 с суммой 10 уже другая нагрузка - CONFLICT)."
    - id: "conflict-different-account"
      title: "Тот же ключ, другой счёт, и неизменность состояния"
      stdin: |
        100
        k1 a 30
        k1 b 30
        k1 a 30
        k2 b 30
        k1 b 30
      expected: |
        1 k1 OK charge=c1 charged=30
        2 k1 CONFLICT
        3 k1 REPLAY OK charge=c1 charged=30
        4 k2 OK charge=c2 charged=30
        5 k1 CONFLICT
        ACCOUNT a charged=30
        ACCOUNT b charged=30
        charges=2
      compare: "trim"
      hidden: true
      hint: "Смена счёта при том же ключе - CONFLICT, платёж не проводится; запомненный исход остаётся прежним."
    - id: "invalid-and-boundary"
      title: "INVALID, сумма ровно на пределе и повтор INVALID"
      stdin: |
        100
        i1 acc 0
        i2 acc -5
        i1 acc 0
        b1 acc 100
        b2 acc 1
        - acc -1
        b1 acc 100
      expected: |
        1 i1 INVALID
        2 i2 INVALID
        3 i1 REPLAY INVALID
        4 b1 OK charge=c1 charged=100
        5 b2 DECLINED
        6 - INVALID
        7 b1 REPLAY OK charge=c1 charged=100
        ACCOUNT acc charged=100
        charges=1
      compare: "trim"
      hidden: true
      hint: "Сумма ровно L допустима (OK). Нулевая и отрицательная суммы дают INVALID, и повтор снова возвращает REPLAY INVALID. Запрос без ключа с плохой суммой тоже INVALID."
    - id: "many-accounts"
      title: "Несколько счетов и ключей, итог по счетам"
      stdin: |
        60
        t1 zed 10
        t2 amy 25
        t3 zed 45
        t4 zed 10
        t2 amy 25
        t5 bob 60
        - amy 35
        - amy 1
        t1 zed 11
        t6 cat 61
      expected: |
        1 t1 OK charge=c1 charged=10
        2 t2 OK charge=c2 charged=25
        3 t3 OK charge=c3 charged=55
        4 t4 DECLINED
        5 t2 REPLAY OK charge=c2 charged=25
        6 t5 OK charge=c4 charged=60
        7 - OK charge=c5 charged=60
        8 - DECLINED
        9 t1 CONFLICT
        10 t6 DECLINED
        ACCOUNT amy charged=60
        ACCOUNT bob charged=60
        ACCOUNT zed charged=55
        charges=5
      compare: "trim"
      hidden: true
      hint: "Итог по счетам печатается по алфавиту только для счетов с успешными платежами; номера платежей сквозные."
