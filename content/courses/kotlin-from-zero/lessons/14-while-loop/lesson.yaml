id: "kotlin.from-zero.while-loop"
title: "Цикл while"
goal: "Повторять команды, пока выполняется условие, и читать данные до значения-ограничителя."
difficulty: "easy"
estimatedMinutes: 35
prerequisites:
  - "kotlin.from-zero.when"
objectives:
  - "Записывать цикл while с условием типа Boolean и телом в фигурных скобках."
  - "Использовать var-счётчик и накопитель суммы, менять их в теле цикла."
  - "Читать числа до значения-ограничителя."
  - "Узнавать бесконечный цикл и ошибку на единицу в границе."
masteryCriteria:
  - "Ваша программа суммирует введённые числа до 0 и печатает их количество и сумму."
  - "Вы предсказываете, сколько раз выполнится тело цикла при условиях < и <=."
  - "Вы объясняете, почему цикл без изменения счётчика не завершается."
concepts:
  introduces:
    - "kotlin.while"
    - "kotlin.loop-condition"
  uses:
    - "kotlin.var"
    - "kotlin.boolean"
    - "kotlin.int"
    - "kotlin.comparison"
    - "kotlin.compound-assignment"
    - "kotlin.remainder"
    - "kotlin.integer-division"
    - "kotlin.readln"
    - "kotlin.to-int"
    - "kotlin.string-template"
    - "kotlin.if"
next:
  - "kotlin.from-zero.for-loop"
tags:
  - "kotlin"
  - "while"
  - "loop"
  - "input"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```kotlin
        fun main() {
            var n = 3
            while (n > 0) {
                print(n)
                n -= 1
            }
        }
        ```
      options:
        - "321"
        - "123"
        - "3"
        - "210"
      answer: 0
      explanation: "Условие n > 0 проверяется перед каждой итерацией. Значения n равны 3, 2, 1, после чего n становится 0 и цикл заканчивается."
    - id: "q2"
      type: "single"
      prompt: |
        Сколько раз выполнится тело цикла?

        ```kotlin
        fun main() {
            var x = 10
            while (x < 5) {
                println("повтор")
                x += 1
            }
        }
        ```
      options:
        - "5 раз"
        - "10 раз"
        - "Бесконечно."
        - "Ни разу."
      answer: 3
      explanation: "Условие x < 5 ложно с самого начала (10 не меньше 5), поэтому тело пропускается."
    - id: "q3"
      type: "single"
      prompt: |
        Какой из фрагментов (тело каждого находится внутри `fun main()`) никогда не завершится?

        ```kotlin
        // А
        var i = 1
        while (i <= 3) {
            println(i)
            i += 1
        }

        // Б
        var j = 1
        while (j <= 3) {
            println(j)
        }

        // В
        var k = 3
        while (k > 0) {
            k -= 1
        }

        // Г
        var m = 0
        while (m < 1) {
            m += 1
        }
        ```
      options:
        - "А"
        - "В"
        - "Г"
        - "Б"
      answer: 3
      explanation: "В фрагменте Б значение j в теле не меняется, условие j <= 3 остаётся истинным всегда. В остальных фрагментах счётчик приближает цикл к завершению."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```kotlin
        fun main() {
            var n = 123
            var s = 0
            while (n > 0) {
                s += n % 10
                n /= 10
            }
            println(s)
        }
        ```
      options:
        - "123"
        - "3"
        - "321"
        - "6"
      answer: 3
      explanation: "На итерациях к сумме прибавляются цифры 3, 2 и 1, а n сокращается: 123, 12, 1, 0. Сумма цифр равна 6."
    - id: "q5"
      type: "single"
      prompt: |
        Программа суммирует числа до ограничителя 0:

        ```kotlin
        fun main() {
            var sum = 0
            var x = readln().toInt()
            while (x != 0) {
                sum += x
                x = readln().toInt()
            }
            println(sum)
        }
        ```

        Ввод: 4, 7, 0, 9 (по одному числу в строке). Что напечатает программа?
      options:
        - "20"
        - "11"
        - "4"
        - "Ошибку: ввод закончился."
      answer: 1
      explanation: "Числа 4 и 7 прибавляются к сумме. Получив 0, цикл заканчивается, и значение 9 не читается. Сумма равна 11."
exercise:
  id: "kotlin.from-zero.while-loop.exercise"
  title: "Чек из магазина"
  prompt: |
    На вход подаются цены покупок - целые положительные числа, по одному в строке. Последняя строка содержит число `0`: оно означает конец чека и не является покупкой.

    Напечатайте две строки: количество покупок и их общую сумму.

    **Пример.** Для ввода

    ```
    120
    80
    250
    0
    ```

    вывод:

    ```
    Покупок: 3
    Сумма: 450
    ```
  entryFile: "Main.kt"
  evaluation: "io"
  hints:
    - "Читайте число до цикла и повторяйте цикл, пока оно не равно 0: while (price != 0)."
    - "В теле цикла увеличьте счётчик count на 1, прибавьте price к sum и в конце прочитайте следующую цену."
    - "Не забудьте прочитать следующее число в конце тела: price = readln().toInt(). Без этого цикл бесконечен."
  tests:
    - id: "basic"
      title: "Три покупки"
      stdin: |
        120
        80
        250
        0
      expected: |
        Покупок: 3
        Сумма: 450
      hint: "Три цены до нуля: 120 + 80 + 250 = 450."
    - id: "empty"
      title: "Пустой чек"
      stdin: |
        0
      expected: |
        Покупок: 0
        Сумма: 0
      hint: "Если первым прочитан 0, цикл не выполняется: покупок нет и сумма равна 0."
    - id: "one"
      title: "Одна покупка (скрытый)"
      stdin: |
        5000
        0
      expected: |
        Покупок: 1
        Сумма: 5000
      hidden: true
      hint: "Единственная покупка: счётчик равен 1, сумма равна цене."
    - id: "stop"
      title: "После нуля ввод игнорируется (скрытый)"
      stdin: |
        10
        20
        0
        999
      expected: |
        Покупок: 2
        Сумма: 30
      hidden: true
      hint: "Числа после 0 в чек не входят: цикл должен остановиться на первом нуле."
    - id: "many"
      title: "Много покупок (скрытый)"
      stdin: |
        1
        2
        3
        4
        5
        6
        7
        0
      expected: |
        Покупок: 7
        Сумма: 28
      hidden: true
      hint: "Семь цен от 1 до 7: сумма 28."
