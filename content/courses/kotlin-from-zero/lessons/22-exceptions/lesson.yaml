id: "kotlin.from-zero.exceptions"
title: "Исключения"
goal: "Перехватывать исключения через try и catch и выбрасывать свои через throw."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "kotlin.from-zero.string-methods"
objectives:
  - "Объяснять, что такое исключение и что происходит с не перехваченным исключением."
  - "Писать try и catch для NumberFormatException и других видов исключений."
  - "Выбрасывать IllegalArgumentException через throw и читать e.message."
  - "Читать стек вызовов снизу вверх и находить строку, где возникла ошибка."
masteryCriteria:
  - "Ваша функция проверяет возраст и выбрасывает исключение, а основной код печатает понятные сообщения и продолжает работу."
  - "Вы предсказываете, какие строки напечатаются, если исключение случилось в середине блока try."
  - "Вы выбираете вид исключения для catch по сообщению об ошибке."
