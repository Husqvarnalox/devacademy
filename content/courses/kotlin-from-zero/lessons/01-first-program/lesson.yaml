id: "kotlin.from-zero.first-program"
title: "Первая программа"
goal: "Запустить программу на Kotlin и изменить строку, которую она печатает."
difficulty: "intro"
estimatedMinutes: 25
prerequisites: []
objectives:
  - "Объяснить, что такое программа, исходный код и компилятор."
  - "Назвать, что делает каждая часть минимальной программы fun main() { ... }."
  - "Вывести текст на экран командой println и записать строку в кавычках."
masteryCriteria:
  - "Ваша программа печатает ровно заданную строку, включая регистр и знаки препинания."
  - "Вы отличаете текст внутри кавычек (его печатают как есть) от имён команд (их вызывают)."
  - "Вы пишете свои команды внутри фигурных скобок функции main."
concepts:
  introduces:
    - "kotlin.program"
    - "kotlin.compiler"
    - "kotlin.main-function"
    - "kotlin.println"
    - "kotlin.string-literal"
related:
  - "kotlin.first-steps.how-kotlin-runs"
next:
  - "kotlin.from-zero.compiler-errors"
tags:
  - "kotlin"
  - "program"
  - "println"
  - "compiler"
facts:
  - kind: "misconception"
    text: "«Чтобы программа заработала, нужно понимать каждое слово в ней» - нет. В Kotlin минимальная программа состоит из одной функции main, а смысл слова fun раскрывается в уроке о функциях; для первых программ достаточно знать, где писать свои команды."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что делает компилятор?"
      options:
        - "Переводит текст программы в форму, которую можно выполнить, и сообщает об ошибках в тексте."
        - "Исправляет ошибки в тексте программы."
        - "Печатает текст программы на экран."
        - "Выполняет программу строка за строкой, ничего не создавая."
      answer: 0
      explanation: "Компилятор читает исходный код и создаёт из него то, что можно выполнить. Ошибки он только сообщает: исправляет их человек."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```kotlin
        fun main() {
            println("раз")
            println("два")
        }
        ```
      options:
        - "раздва"
        - "раз два (в одной строке)"
        - "раз и на следующей строке два"
        - "два и на следующей строке раз"
      answer: 2
      explanation: "Команды внутри main выполняются сверху вниз, а println после текста переводит строку. Поэтому «раз» и «два» оказываются на разных строках в этом порядке."
    - id: "q3"
      type: "single"
      prompt: "Что произойдёт, если вместо println(\"Привет\") написать Println(\"Привет\")?"
      options:
        - "Компилятор сообщит unresolved reference 'Println': такого имени он не знает."
        - "Программа напечатает ПРИВЕТ."
        - "Программа напечатает Привет, потому что регистр не важен."
        - "Компилятор сам исправит букву на строчную."
      answer: 0
      explanation: "В Kotlin регистр букв в именах важен: Println и println - разные имена. Компилятор знает только println и сообщает, что Println ему неизвестно."
    - id: "q4"
      type: "single"
      prompt: "Где в программе выполняются ваши команды?"
      options:
        - "Внутри фигурных скобок функции main: выполнение начинается с неё."
        - "В любом месте файла, порядок не важен."
        - "Только после слова println."
        - "Перед словом fun."
      answer: 0
      explanation: "Программа начинает работу с функции main и выполняет команды из её фигурных скобок сверху вниз."
exercise:
  id: "kotlin.from-zero.first-program.exercise"
  title: "Измените выводимую строку"
  prompt: |
    В редакторе уже есть рабочая программа: она печатает приветствие. Измените её так, чтобы она печатала ровно одну строку:

    ```
    Я учусь программировать на Kotlin!
    ```

    Менять нужно только текст в кавычках. Регистр букв, пробелы и восклицательный знак важны.
  entryFile: "Main.kt"
  evaluation: "io"
  hints:
    - "Найдите в программе строку с println: нужный текст находится между кавычками."
    - "Замените всё, что стоит между кавычками, на нужную фразу. Сами кавычки и скобки оставьте."
    - "Должно получиться println(\"Я учусь программировать на Kotlin!\")"
  tests:
    - id: "basic"
      title: "Печатается нужная фраза"
      stdin: ""
      expected: |
        Я учусь программировать на Kotlin!
      hint: "Программа должна напечатать одну строку: Я учусь программировать на Kotlin!"
    - id: "exact"
      title: "Точный текст и одна строка (скрытый)"
      stdin: ""
      expected: |
        Я учусь программировать на Kotlin!
      hidden: true
      hint: "Проверяется точное совпадение: заглавная Я, пробелы между словами, заглавная K в слове Kotlin, восклицательный знак в конце и никаких лишних строк."
