id: "kotlin.from-zero.variables"
title: "Переменные: val и var"
goal: "Сохранять значения в переменных, менять изменяемые и вставлять значения в текст через шаблон."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "kotlin.from-zero.output"
objectives:
  - "Объявлять переменные через val и var и объяснять разницу."
  - "Присваивать новое значение переменной var и понимать, почему val присвоить нельзя."
  - "Вставлять значения переменных в текст шаблоном $имя и ${имя}."
  - "Объяснить, как Kotlin определяет тип переменной по значению."
masteryCriteria:
  - "Ваша программа объявляет val для неизменяемого значения и var для меняющегося."
  - "Вы предсказываете вывод программы с несколькими присваиваниями."
  - "Вы узнаёте по сообщению 'val' cannot be reassigned, что значение пытались изменить."
concepts:
  introduces:
    - "kotlin.variable"
    - "kotlin.val"
    - "kotlin.var"
    - "kotlin.assignment"
    - "kotlin.type-inference"
    - "kotlin.int"
    - "kotlin.string"
    - "kotlin.string-template"
  uses:
    - "kotlin.println"
    - "kotlin.string-literal"
    - "kotlin.compile-error"
next:
  - "kotlin.from-zero.basic-types"
tags:
  - "kotlin"
  - "variable"
  - "val"
  - "var"
  - "string-template"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```kotlin
        fun main() {
            var level = 1
            level = 3
            level = 2
            println(level)
        }
        ```
      options:
        - "2"
        - "1"
        - "3"
        - "123"
      answer: 0
      explanation: "var хранит одно значение; каждое присваивание заменяет предыдущее. Последнее присвоено 2, оно и печатается."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```kotlin
        fun main() {
            val name = "Анна"
            println("Привет, $name!")
        }
        ```
      options:
        - "Привет, Анна!"
        - "Привет, $name!"
        - "Привет, name!"
        - "Ошибка компиляции."
      answer: 0
      explanation: "В шаблоне $name вместо имени подставляется значение переменной, поэтому выводится Привет, Анна!."
    - id: "q3"
      type: "single"
      prompt: |
        Что сообщит компилятор?

        ```kotlin
        fun main() {
            val count = 5
            count = 6
            println(count)
        }
        ```
      options:
        - "'val' cannot be reassigned: значение val менять нельзя."
        - "Ничего, программа напечатает 6."
        - "unresolved reference 'count'."
        - "Ничего, программа напечатает 5."
      answer: 0
      explanation: "val фиксирует значение после первого присваивания. Для значения, которое должно меняться, объявляют var."
    - id: "q4"
      type: "single"
      prompt: |
        Что сообщит компилятор?

        ```kotlin
        fun main() {
            var city = "Минск"
            city = 100
        }
        ```
      options:
        - "Ошибку: в переменную типа String нельзя записать число."
        - "Ничего: var допускает любой тип."
        - "Предупреждение, но программа запустится."
        - "Ошибку: имя city уже занято."
      answer: 0
      explanation: "Kotlin определил тип по первому значению: city - String. Тип переменной не меняется, поэтому присвоить число нельзя."
    - id: "q5"
      type: "single"
      prompt: |
        Что произойдёт?

        ```kotlin
        fun main() {
            val price = 80
            println("Цена: $priceруб.")
        }
        ```
      options:
        - "Ошибка unresolved reference 'priceруб': имя переменной считается до точки, вместе с русскими буквами."
        - "Выведется Цена: 80руб."
        - "Выведется Цена: $priceруб."
        - "Выведется Цена: 80 руб."
      answer: 0
      explanation: "Имя после $ продолжается, пока идут буквы и цифры, в том числе русские. Чтобы отделить имя, пишут ${price}руб.: фигурные скобки задают границы имени."
exercise:
  id: "kotlin.from-zero.variables.exercise"
  title: "Товар и новая цена"
  prompt: |
    Исправьте программу так, чтобы она печатала две строки:

    ```
    Товар: Яблоки, цена: 80 руб.
    Цена изменилась: 95 руб.
    ```

    1. Измените значения переменных `product` и `price` в начале программы.
    2. Присвойте `price` новое значение 95.
    3. Напечатайте вторую строку, вставив цену шаблоном `$price`.

    Первая команда `println` уже есть и должна остаться как есть.
  entryFile: "Main.kt"
  evaluation: "io"
  hints:
    - "Значения переменных стоят справа от знака равенства: замените \"Груши\" на \"Яблоки\" и 120 на 80."
    - "Новое значение присваивают без слова var: price = 95. Слово var пишут только при объявлении."
    - "Последняя команда: println(\"Цена изменилась: $price руб.\")."
  tests:
    - id: "basic"
      title: "Две строки с товаром и ценами"
      stdin: ""
      expected: |
        Товар: Яблоки, цена: 80 руб.
        Цена изменилась: 95 руб.
      hint: "Первая строка печатается до изменения цены, вторая - после присваивания price = 95."
    - id: "exact"
      title: "Точный текст двух строк (скрытый)"
      stdin: ""
      expected: |
        Товар: Яблоки, цена: 80 руб.
        Цена изменилась: 95 руб.
      hidden: true
      hint: "Проверяется точное совпадение: слово Яблоки с большой буквы, запятая после «Яблоки», точка после «руб» в обеих строках и ровно две строки."
