id: "kotlin.from-zero.mini-project"
title: "Мини-проект: учёт покупок"
goal: "Собрать из изученных частей законченную программу, которая читает неидеальный ввод, считает и пропускает неверные строки."
difficulty: "easy"
estimatedMinutes: 60
prerequisites:
  - "kotlin.from-zero.first-class"
objectives:
  - "Выносить разбор одной строки в функцию, возвращающую значение или null."
  - "Читать ввод до конца, считать принятые и пропущенные строки."
  - "Накапливать результаты в списке и словаре и печатать итоги в заданном формате."
  - "Проверять программу на обычном, неверном и пустом вводе."
masteryCriteria:
  - "Ваша программа принимает корректные покупки, пропускает неверные строки со счётчиком и печатает итоги в заданном формате."
  - "Вы разделяете задачу на данные, проверку строки, цикл чтения и вывод."
  - "Вы находите причину, по которой корректная строка попала в пропущенные (например, забытый trim)."
