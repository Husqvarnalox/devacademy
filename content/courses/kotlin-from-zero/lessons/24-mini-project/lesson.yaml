quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что вернёт функция для строки «сыр»?

        ```kotlin
        fun parse(line: String): Int? {
            val parts = line.split(";")
            if (parts.size != 2) {
                return null
            }
            return parts[1].trim().toIntOrNull()
        }
        ```
      options:
        - "0"
        - "Ошибка выполнения."
        - "null"
        - "\"сыр\""
      answer: 2
      explanation: "В строке «сыр» нет разделителя, split даёт одну часть. Условие parts.size != 2 выполнено, функция возвращает null."
    - id: "q2"
      type: "single"
      prompt: "Что вернёт та же функция parse для строки «чай; 50»?"
      options:
        - "null"
        - "50"
        - "0"
        - "Ошибку: пробел мешает."
      answer: 1
      explanation: "trim() убирает пробел перед числом, и toIntOrNull() получает «50»."
    - id: "q3"
      type: "single"
      prompt: |
        Почему этот код не скомпилируется?

        ```kotlin
        fun parse(line: String): Int {
            return line.toIntOrNull()
        }
        ```
      options:
        - "toIntOrNull нельзя вызывать у строки."
        - "Функция объявлена с типом Int, а возвращает Int?, который может быть null."
        - "Слово return здесь не нужно."
        - "У функции должен быть параметр типа Int."
      answer: 1
      explanation: "toIntOrNull() возвращает Int?, а функция обещает Int. Нужно изменить тип результата на Int? или подставить значение по умолчанию через ?:."
    - id: "q4"
      type: "single"
      prompt: |
        Что произойдёт при запуске с пустым вводом?

        ```kotlin
        fun main() {
            while (true) {
                val line = readlnOrNull() ?: break
                println(line)
            }
            println("конец")
        }
        ```
      options:
        - "Программа напечатает «конец»."
        - "Программа упадёт с исключением."
        - "Программа будет работать бесконечно."
        - "Программа напечатает пустую строку и «конец»."
      answer: 0
      explanation: "readlnOrNull() сразу возвращает null, оператор ?: выполняет break, цикл заканчивается, и печатается «конец»."
    - id: "q5"
      type: "single"
      prompt: "Строка «ябл; 12» не принимается программой, хотя должна. Что нужно проверить в первую очередь?"
      options:
        - "Использован ли trim() перед toIntOrNull()."
        - "Объявлен ли класс как data class."
        - "Использован ли mutableMapOf."
        - "Есть ли в main оператор return."
      answer: 0
      explanation: "toIntOrNull() не принимает пробелы по краям, поэтому часть « 12» даёт null. Перед разбором число очищают через trim()."
exercise:
  id: "kotlin.from-zero.mini-project.exercise"
  title: "Учёт покупок"
  prompt: |
    На вход подаются строки вида `товар;цена`, сколько угодно (ввод заканчивается сам). Строка корректна, если выполнены все условия:

    * в ней ровно два поля, разделённые `;`;
    * название (после удаления пробелов по краям) не пусто;
    * цена (после удаления пробелов по краям) - целое неотрицательное число.

    Остальные строки пропускаются, но считаются. Готовая часть `main` уже читает строки и считает принятые и пропущенные. Вам нужно:

    1. реализовать `parseLine(line: String): Purchase?` - вернуть `Purchase` или `null` для неверной строки;
    2. напечатать итоги.

    Формат вывода:

    ```
    Принято: <число принятых>
    Пропущено: <число пропущенных>
    Сумма: <сумма цен>
    Самая дорогая: <товар> (<цена>)
    По товарам:
    <товар>: <сумма цен по этому товару>
    ...
    ```

    Товары в последнем списке - в порядке первого появления, цены одного и того же товара складываются. Если принятых строк нет, вместо самой дорогой печатается `Самая дорогая: нет`, а список «По товарам:» остаётся пустым. Если несколько товаров имеют одинаковую наибольшую цену, выбирается первый из них.

    **Пример.** Для ввода

    ```
    хлеб;45
    молоко;80
    сыр
    чай;abc
     ;10
    яблоки; 120
    соль;-5
    ```

    вывод:

    ```
    Принято: 3
    Пропущено: 4
    Сумма: 245
    Самая дорогая: яблоки (120)
    По товарам:
    хлеб: 45
    молоко: 80
    яблоки: 120
    ```
  entryFile: "Main.kt"
  evaluation: "io"
  hints:
    - "Сначала реализуйте parseLine: разрежьте строку через split(\";\") и верните null, если частей не две."
    - "Уберите пробелы: parts[0].trim() и parts[1].trim().toIntOrNull(). Верните null, если название пустое, цена null или отрицательная. Проверку price == null ставьте раньше price < 0."
    - "Для итогов: сумму накапливайте в var, цены по товарам - в mutableMapOf<String, Int>() (totals[p] = (totals[p] ?: 0) + price), самую дорогую - парой переменных bestName и bestPrice, начиная с bestPrice = -1."
    - "Самую дорогую обновляйте только при строгом p.price > bestPrice, чтобы при равенстве осталась первая."
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: |
        хлеб;45
        молоко;80
        сыр
        чай;abc
         ;10
        яблоки; 120 
        соль;-5
      expected: |
        Принято: 3
        Пропущено: 4
        Сумма: 245
        Самая дорогая: яблоки (120)
        По товарам:
        хлеб: 45
        молоко: 80
        яблоки: 120
      hint: "Верные строки: хлеб, молоко, яблоки. Остальные четыре пропущены."
    - id: "repeat"
      title: "Повторяющийся товар"
      stdin: |
        чай;50
        чай;70
        сахар;30
      expected: |
        Принято: 3
        Пропущено: 0
        Сумма: 150
        Самая дорогая: чай (70)
        По товарам:
        чай: 120
        сахар: 30
      hint: "Цены одного товара складываются: чай = 50 + 70."
    - id: "bad"
      title: "Все строки неверны (скрытый)"
      stdin: |
        abc
        ;5
        x;y
        1;2;3
      expected: |
        Принято: 0
        Пропущено: 4
        Сумма: 0
        Самая дорогая: нет
        По товарам:
      hidden: true
      hint: "Если принятых строк нет, выводится «Самая дорогая: нет» и пустой список."
    - id: "tie"
      title: "Нулевые цены и равенство (скрытый)"
      stdin: |
        а;0
        б;0
      expected: |
        Принято: 2
        Пропущено: 0
        Сумма: 0
        Самая дорогая: а (0)
        По товарам:
        а: 0
        б: 0
      hidden: true
      hint: "Нулевая цена допустима; при равных ценах выбирается первый товар."
    - id: "spaces"
      title: "Пробелы вокруг полей (скрытый)"
      stdin: |
        x;1
          кофе ; 100
        пиво ;  
      expected: |
        Принято: 2
        Пропущено: 1
        Сумма: 101
        Самая дорогая: кофе (100)
        По товарам:
        x: 1
        кофе: 100
      hidden: true
      hint: "Пробелы вокруг названия и цены убираются через trim; пустая цена - ошибка."
