id: "kotlin.from-zero.for-loop"
title: "Цикл for и диапазоны"
goal: "Повторять действия известное число раз с помощью for и диапазонов."
difficulty: "easy"
estimatedMinutes: 35
prerequisites:
  - "kotlin.from-zero.while-loop"
objectives:
  - "Записывать цикл for (i in a..b) и понимать, какие значения принимает переменная цикла."
  - "Различать диапазоны .., until и downTo и использовать step."
  - "Перебирать символы строки и повторять действие через repeat."
  - "Выбирать между for и while."
masteryCriteria:
  - "Ваша программа печатает таблицу значений для i от 1 до n."
  - "Вы объясняете разницу между 1..n и 0 until n и предсказываете результат пустого диапазона."
  - "Вы объясняете, почему переменную цикла for нельзя изменить."
concepts:
  introduces:
    - "kotlin.for"
    - "kotlin.range"
    - "kotlin.loop-variable"
  uses:
    - "kotlin.while"
    - "kotlin.var"
    - "kotlin.val"
    - "kotlin.int"
    - "kotlin.char"
    - "kotlin.string"
    - "kotlin.if"
    - "kotlin.when"
    - "kotlin.range-check"
    - "kotlin.comparison"
    - "kotlin.compound-assignment"
    - "kotlin.readln"
    - "kotlin.to-int"
    - "kotlin.string-template"
    - "kotlin.print"
    - "kotlin.println"
next:
  - "kotlin.from-zero.loop-control"
tags:
  - "kotlin"
  - "for"
  - "loop"
  - "range"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```kotlin
        fun main() {
            for (i in 1..3) {
                print(i)
            }
        }
        ```
      options:
        - "012"
        - "1 2 3"
        - "123"
        - "3"
      answer: 2
      explanation: "Диапазон 1..3 включает оба конца, а print не добавляет перевод строки: получается 123."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```kotlin
        fun main() {
            for (i in 0 until 3) {
                print(i)
            }
        }
        ```
      options:
        - "0123"
        - "012"
        - "123"
        - "321"
      answer: 1
      explanation: "until не включает правый конец, поэтому значения 0, 1, 2."
    - id: "q3"
      type: "single"
      prompt: |
        Какие числа напечатает цикл?

        ```kotlin
        fun main() {
            for (i in 10 downTo 0 step 4) {
                print("$i ")
            }
        }
        ```
      options:
        - "10 6 2"
        - "10 4 0"
        - "10 8 6 4 2 0"
        - "Ничего."
      answer: 0
      explanation: "Цикл идёт вниз с шагом 4: 10, 6, 2. Следующее значение -2 меньше нуля, поэтому цикл останавливается."
    - id: "q4"
      type: "single"
      prompt: |
        Сколько раз выполнится тело цикла?

        ```kotlin
        fun main() {
            for (i in 5..1) {
                println(i)
            }
        }
        ```
      options:
        - "5 раз"
        - "Ни разу."
        - "Один раз."
        - "Будет ошибка компиляции."
      answer: 1
      explanation: "Диапазон 5..1 пуст, потому что начало больше конца. Ошибки нет, тело просто не выполняется. Для обратного счёта нужно 5 downTo 1."
    - id: "q5"
      type: "single"
      prompt: |
        Что произойдёт при компиляции?

        ```kotlin
        fun main() {
            for (i in 1..3) {
                i = i + 1
            }
        }
        ```
      options:
        - "Цикл выполнится три раза."
        - "Цикл выполнится два раза."
        - "Бесконечный цикл."
        - "Ошибка: 'val' cannot be reassigned."
      answer: 3
      explanation: "Переменная цикла for неизменяема (val) и получает новое значение из диапазона на каждом шаге."
exercise:
  id: "kotlin.from-zero.for-loop.exercise"
  title: "Копилка по дням"
  prompt: |
    Вы откладываете одну и ту же сумму каждый день. На вход подаются две строки: размер ежедневного взноса и число дней (целые числа).

    Для каждого дня от 1 до заданного числа напечатайте строку `День N: накоплено X`, где `X` - сумма, накопленная к концу дня. В последней строке напечатайте `Итого: ` и накопленную за все дни сумму.

    **Пример.** Для ввода

    ```
    150
    3
    ```

    вывод:

    ```
    День 1: накоплено 150
    День 2: накоплено 300
    День 3: накоплено 450
    Итого: 450
    ```
  entryFile: "Main.kt"
  evaluation: "io"
  hints:
    - "Количество повторений известно (days), поэтому подходит цикл for (day in 1..days)."
    - "Накопленная к дню номер day сумма равна amount * day. Печатайте её в шаблоне строки: \"День $day: накоплено ${amount * day}\"."
    - "После цикла напечатайте итог: amount * days. Если дней 0, цикл не выполняется, и остаётся только строка «Итого: 0»."
  tests:
    - id: "basic"
      title: "Три дня"
      stdin: |
        150
        3
      expected: |
        День 1: накоплено 150
        День 2: накоплено 300
        День 3: накоплено 450
        Итого: 450
      hint: "Каждый день к сумме прибавляется 150: 150, 300, 450."
    - id: "one"
      title: "Один день"
      stdin: |
        500
        1
      expected: |
        День 1: накоплено 500
        Итого: 500
      hint: "За один день нужна ровно одна строка дня и итоговая строка."
    - id: "five"
      title: "Пять дней (скрытый)"
      stdin: |
        100
        5
      expected: |
        День 1: накоплено 100
        День 2: накоплено 200
        День 3: накоплено 300
        День 4: накоплено 400
        День 5: накоплено 500
        Итого: 500
      hidden: true
      hint: "Цикл должен дойти до последнего дня включительно (диапазон 1..days)."
    - id: "zero"
      title: "Ноль дней (скрытый)"
      stdin: |
        200
        0
      expected: |
        Итого: 0
      hidden: true
      hint: "Если дней 0, диапазон 1..0 пуст: строк дней нет, печатается только итог 0."
