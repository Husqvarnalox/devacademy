id: "kotlin.from-zero.reading-input"
title: "Ввод данных: readln"
goal: "Прочитать из стандартного ввода несколько строк и использовать их в выводе."
difficulty: "easy"
estimatedMinutes: 30
prerequisites:
  - "kotlin.from-zero.strings"
objectives:
  - "Объяснить, что такое ввод и стандартный ввод (stdin)."
  - "Читать строку командой readln() и сохранять её в переменную."
  - "Понимать, что один вызов readln() читает ровно одну строку и что порядок вызовов задаёт порядок чтения."
  - "Не печатать приглашений к вводу в программах, которые проверяются по выводу."
masteryCriteria:
  - "Ваша программа читает три строки подряд и печатает их в заданном формате."
  - "Строки с пробелами (например «Мастер и Маргарита») читаются целиком."
  - "Вы узнаёте ReadAfterEOFException как «ввод закончился раньше, чем вызвано чтение»."
concepts:
  introduces:
    - "kotlin.readln"
    - "kotlin.stdin"
  uses:
    - "kotlin.val"
    - "kotlin.string"
    - "kotlin.string-template"
    - "kotlin.println"
    - "kotlin.string-length"
next:
  - "kotlin.from-zero.type-conversion"
tags:
  - "kotlin"
  - "input"
  - "readln"
  - "stdin"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        На вход подан текст из двух строк:

        ```text
        Анна
        Минск
        ```

        Что напечатает программа?

        ```kotlin
        fun main() {
            val a = readln()
            val b = readln()
            println(b + " " + a)
        }
        ```
      options:
        - "Минск Анна"
        - "Анна Минск"
        - "Анна\nМинск"
        - "Ошибку выполнения: слишком много чтений."
      answer: 0
      explanation: "Первый readln() читает первую строку (Анна), второй - вторую (Минск). В println они склеены в обратном порядке: Минск Анна."
    - id: "q2"
      type: "single"
      prompt: |
        На вход подана строка `12345`. Что напечатает программа?

        ```kotlin
        fun main() {
            val line = readln()
            println(line.length)
        }
        ```
      options:
        - "5"
        - "12345"
        - "15"
        - "Ошибку: readln читает только слова."
      answer: 0
      explanation: "readln() возвращает текст, пусть даже из цифр. У текста есть длина - число символов, их 5. Арифметика с числом 12345 пока недоступна: сначала текст нужно преобразовать (следующий урок)."
    - id: "q3"
      type: "single"
      prompt: |
        Ввод пуст (в нём нет ни одной строки). Что произойдёт?

        ```kotlin
        fun main() {
            val name = readln()
            println(name)
        }
        ```
      options:
        - "Программа остановится с ReadAfterEOFException: читать нечего."
        - "Напечатается пустая строка."
        - "Ошибка компиляции."
        - "Программа будет ждать ввода вечно."
      answer: 0
      explanation: "readln() требует строку. Если ввод закончился, бросается ReadAfterEOFException. Ошибка возникает при запуске, а не при компиляции."
    - id: "q4"
      type: "single"
      prompt: "Почему в упражнениях не стоит печатать подсказки вроде println(\"Введите имя:\") перед чтением?"
      options:
        - "Проверка сравнивает весь вывод с ожидаемым, а лишняя строка сделает его неверным."
        - "Команда println нельзя использовать перед readln."
        - "Компилятор сообщит об ошибке."
        - "Ввод после подсказки не читается."
      answer: 0
      explanation: "Пользователя в тестах нет: ввод подаётся заранее, а проверяется то, что программа напечатала. Всё, что вы напечатали сверх условия, считается ошибкой."
exercise:
  id: "kotlin.from-zero.reading-input.exercise"
  title: "Карточка читателя"
  prompt: |
    На вход подаются три строки: фамилия, имя и название книги.

    Программа должна прочитать их и напечатать две строки:

    ```
    Читатель: <фамилия> <имя>
    Книга: <название>
    ```

    **Пример.** Для ввода

    ```
    Иванова
    Анна
    Мастер и Маргарита
    ```

    вывод:

    ```
    Читатель: Иванова Анна
    Книга: Мастер и Маргарита
    ```

    Приглашений к вводу не печатайте: проверяется только вывод из условия.
  entryFile: "Main.kt"
  evaluation: "io"
  hints:
    - "Одна команда readln() читает одну строку. Три строки на вход - три вызова подряд, каждый сохраняется в свою переменную."
    - "Пример для первой строки: val surname = readln()."
    - "Вывод собирайте шаблонами: println(\"Читатель: $surname $name\")."
  tests:
    - id: "basic"
      title: "Иванова Анна и «Мастер и Маргарита»"
      stdin: |
        Иванова
        Анна
        Мастер и Маргарита
      expected: |
        Читатель: Иванова Анна
        Книга: Мастер и Маргарита
      hint: "Фамилия и имя печатаются через пробел в первой строке, название книги - целиком во второй."
    - id: "latin"
      title: "Латиница и название из одного слова"
      stdin: |
        Smith
        John
        Dune
      expected: |
        Читатель: Smith John
        Книга: Dune
      hint: "Программа должна работать с любыми строками, не только с русскими."
    - id: "spaces"
      title: "Название с пробелами и знаками (скрытый)"
      stdin: |
        Петров-Водкин
        Иван
        Война и мир. Том 1
      expected: |
        Читатель: Петров-Водкин Иван
        Книга: Война и мир. Том 1
      hidden: true
      hint: "Строка читается целиком вместе с пробелами, дефисами и точкой; readln() не должен разбивать её на слова."
