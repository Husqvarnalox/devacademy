id: "kotlin.from-zero.loop-control"
title: "Управление циклом: break и continue"
goal: "Досрочно прерывать цикл, пропускать итерации и пользоваться вложенными циклами."
difficulty: "easy"
estimatedMinutes: 35
prerequisites:
  - "kotlin.from-zero.for-loop"
objectives:
  - "Прерывать цикл командой break и пропускать итерацию командой continue."
  - "Записывать вложенные циклы и подсчитывать, сколько раз выполнится внутреннее тело."
  - "Понимать, что break действует на ближайший цикл, и использовать флаг для выхода из двух."
  - "Узнавать бесконечный цикл из-за continue до изменения счётчика."
masteryCriteria:
  - "Ваша программа пропускает неверные значения через continue и останавливается на признаке конца через break."
  - "Вы печатаете «лесенку» или таблицу вложенными циклами."
  - "Вы объясняете, какой цикл прерывает break во вложенных циклах."
concepts:
  introduces:
    - "kotlin.break"
    - "kotlin.continue"
    - "kotlin.nested-loops"
  uses:
    - "kotlin.for"
    - "kotlin.while"
    - "kotlin.range"
    - "kotlin.if"
    - "kotlin.var"
    - "kotlin.boolean"
    - "kotlin.logical-operators"
    - "kotlin.comparison"
    - "kotlin.remainder"
    - "kotlin.readln"
    - "kotlin.to-int"
    - "kotlin.print"
    - "kotlin.println"
    - "kotlin.string-template"
    - "kotlin.compound-assignment"
next:
  - "kotlin.from-zero.functions"
tags:
  - "kotlin"
  - "break"
  - "continue"
  - "nested-loops"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```kotlin
        fun main() {
            for (i in 1..5) {
                if (i == 3) break
                print(i)
            }
        }
        ```
      options:
        - "12345"
        - "1245"
        - "12"
        - "123"
      answer: 2
      explanation: "Когда i становится равным 3, break прерывает цикл. Значения 1 и 2 успевают напечататься, 3 - нет."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```kotlin
        fun main() {
            for (i in 1..6) {
                if (i % 2 == 0) continue
                print(i)
            }
        }
        ```
      options:
        - "246"
        - "135"
        - "123456"
        - "12"
      answer: 1
      explanation: "На чётных числах continue пропускает печать и переходит к следующему значению, поэтому печатаются 1, 3 и 5."
    - id: "q3"
      type: "single"
      prompt: |
        Сколько раз выполнится команда println("*")?

        ```kotlin
        fun main() {
            for (i in 1..2) {
                for (j in 1..3) {
                    println("*")
                }
            }
        }
        ```
      options:
        - "5"
        - "6"
        - "3"
        - "2"
      answer: 1
      explanation: "Внутренний цикл выполняется 3 раза на каждой из 2 итераций внешнего: 2 * 3 = 6."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```kotlin
        fun main() {
            for (i in 1..2) {
                for (j in 1..3) {
                    if (j == 2) break
                    print("$i$j ")
                }
            }
        }
        ```
      options:
        - "11 21 "
        - "11 12 21 22 "
        - "11 "
        - "11 12 13 21 22 23 "
      answer: 0
      explanation: "break прерывает только внутренний цикл. Для каждого i печатается только j = 1, затем внутренний цикл завершается, а внешний продолжает работу."
    - id: "q5"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```kotlin
        fun main() {
            var i = 0
            while (i < 3) {
                if (i == 1) continue
                i += 1
            }
            println("готово")
        }
        ```
      options:
        - "Напечатается готово."
        - "Ошибка компиляции."
        - "Цикл не завершится."
        - "Напечатается 3."
      answer: 2
      explanation: "При i == 1 continue возвращает управление к проверке условия, а i += 1 не выполняется. Значение i больше не меняется, цикл бесконечен."
exercise:
  id: "kotlin.from-zero.loop-control.exercise"
  title: "Оценки с пропусками"
  prompt: |
    В первой строке ввода дано число `n` - сколько оценок нужно прочитать. Затем идут `n` строк с целыми числами.

    Правила обработки каждого числа по порядку:

    * `0` означает «ввод закончен»: прекратите чтение, остальные числа не обрабатываются и не считаются пропущенными;
    * число меньше 1 или больше 5 - ошибка ввода: не учитывайте его в сумме, но посчитайте как пропущенное;
    * остальные числа (от 1 до 5) прибавьте к сумме.

    Напечатайте две строки: `Сумма: ` и сумма оценок, затем `Пропущено: ` и количество пропущенных значений.

    **Пример.** Для ввода

    ```
    5
    4
    5
    7
    3
    -1
    ```

    вывод:

    ```
    Сумма: 12
    Пропущено: 2
    ```
  entryFile: "Main.kt"
  evaluation: "io"
  hints:
    - "Читайте оценки циклом for (i in 1..n) и обрабатывайте каждую по порядку."
    - "Сначала проверьте признак конца: if (mark == 0) { break }. Затем проверьте диапазон: if (mark < 1 || mark > 5) { skipped += 1; continue }."
    - "Если ни одна проверка не сработала, оценка допустима: sum += mark. Не увеличивайте skipped для нуля."
  tests:
    - id: "basic"
      title: "Две ошибки"
      stdin: |
        5
        4
        5
        7
        3
        -1
      expected: |
        Сумма: 12
        Пропущено: 2
      hint: "Допустимы 4, 5 и 3 (сумма 12); значения 7 и -1 вне диапазона 1..5."
    - id: "clean"
      title: "Без ошибок"
      stdin: |
        3
        5
        5
        5
      expected: |
        Сумма: 15
        Пропущено: 0
      hint: "Все три оценки допустимы: сумма 15, пропущенных нет."
    - id: "stop"
      title: "Конец по нулю (скрытый)"
      stdin: |
        6
        4
        0
        5
        5
        5
        5
      expected: |
        Сумма: 4
        Пропущено: 0
      hidden: true
      hint: "На 0 нужно остановить цикл (break): последующие числа не читаются и ноль не считается пропущенным."
    - id: "allbad"
      title: "Все значения неверны (скрытый)"
      stdin: |
        2
        9
        9
      expected: |
        Сумма: 0
        Пропущено: 2
      hidden: true
      hint: "Оба значения вне диапазона 1..5: сумма остаётся 0, пропущено 2."
    - id: "bounds"
      title: "Границы 1 и 5 (скрытый)"
      stdin: |
        4
        1
        5
        6
        0
      expected: |
        Сумма: 6
        Пропущено: 1
      hidden: true
      hint: "Значения 1 и 5 допустимы (границы входят), 6 - пропуск, а 0 на четвёртом шаге заканчивает ввод."
