id: "kotlin.from-zero.compiler-errors"
title: "Как читать сообщения об ошибках"
goal: "Прочитать сообщение компилятора, найти по нему строку и вид ошибки и исправить программу, где ошибок несколько."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "kotlin.from-zero.first-program"
objectives:
  - "Найти в сообщении kotlinc файл, строку, столбец и текст ошибки."
  - "Отличить ошибку в синтаксисе (syntax error) от неизвестного имени (unresolved reference)."
  - "Исправлять ошибки по одной, перезапуская программу после каждой правки."
masteryCriteria:
  - "Вы называете строку и столбец ошибки по сообщению вида Main.kt:3:5."
  - "Вы знаете, что причина может находиться в строке выше той, что указана в сообщении."
  - "Ваша исправленная программа собирается и печатает заданные три строки."
concepts:
  introduces:
    - "kotlin.compile-error"
    - "kotlin.error-location"
  uses:
    - "kotlin.main-function"
    - "kotlin.println"
    - "kotlin.string-literal"
next:
  - "kotlin.from-zero.output"
tags:
  - "kotlin"
  - "compiler"
  - "errors"
facts:
  - kind: "misconception"
    text: "«Много сообщений - много ошибок». Одна пропущенная скобка или кавычка нередко порождает сразу несколько сообщений, поэтому правят по одной ошибке и запускают программу заново."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что означает начало сообщения Main.kt:3:5: error: ... ?"
      options:
        - "Файл Main.kt, третья строка, пятый столбец."
        - "Файл Main.kt, пять ошибок в трёх строках."
        - "Третья ошибка в пятом файле."
        - "Файл Main.kt, ошибка в третьем символе пятой строки."
      answer: 0
      explanation: "После имени файла идут номер строки и номер столбца (позиции символа в строке). Нумерация начинается с единицы."
    - id: "q2"
      type: "single"
      prompt: |
        Какое сообщение даст компилятор для этой программы?

        ```kotlin
        fun main() {
            printn("Привет")
        }
        ```
      options:
        - "unresolved reference 'printn': имя не найдено."
        - "syntax error: Expecting ')'."
        - "Программа напечатает printn."
        - "Компилятор сам исправит опечатку на println."
      answer: 0
      explanation: "Скобки и кавычки на месте, синтаксис верен. Но имя printn не существует, и компилятор сообщает unresolved reference. Исправлять опечатку должен человек."
    - id: "q3"
      type: "single"
      prompt: "Компилятор выдал три сообщения. Что разумнее сделать?"
      options:
        - "Исправить первое, запустить программу заново и прочитать сообщения снова."
        - "Начать с последнего: оно самое свежее."
        - "Стереть программу и написать заново."
        - "Игнорировать сообщения: программа запустится и так."
      answer: 0
      explanation: "Сообщения часто вызваны одной причиной. После исправления первой ошибки лишние сообщения пропадают, а новые видны чётко."
    - id: "q4"
      type: "single"
      prompt: "Компилятор указывает на строку 4, но там всё написано верно. Где искать причину?"
      options:
        - "Выше: в строке 3 или раньше, например пропущена скобка или кавычка."
        - "Ниже: в строке 5."
        - "Причина всегда в строке 4, нужно просто перепечатать её."
        - "В имени файла."
      answer: 0
      explanation: "Компилятор замечает проблему там, где перестаёт понимать текст. Незакрытая скобка или кавычка выше часто проявляется только в следующей строке."
exercise:
  id: "kotlin.from-zero.compiler-errors.exercise"
  title: "Исправьте три ошибки"
  prompt: |
    Программа должна напечатать три строки, но не собирается: в ней три ошибки разных видов. Исправьте их, **не меняя текст**, который нужно напечатать:

    ```
    Заказ принят
    Сумма: 450 руб.
    Спасибо за покупку!
    ```

    Исправляйте по одной ошибке: запустите программу, прочитайте первое сообщение, исправьте, запустите снова. Новое сообщение может появиться уже после исправления предыдущего.
  entryFile: "Main.kt"
  evaluation: "io"
  hints:
    - "Сначала запустите программу и прочитайте первое сообщение: оно называет строку, столбец и вид ошибки."
    - "В третьей строке команда названа Println с заглавной буквы. Подумайте, как на самом деле называется команда печати. В четвёртой строке у текста нет закрывающей кавычки."
    - "Когда кавычка исправлена, компилятор сообщит, что не хватает закрывающей фигурной скобки в конце программы."
    - "Верны три строки println(\"...\") и закрывающая скобка } на последней строке."
  tests:
    - id: "basic"
      title: "Программа собирается и печатает три строки"
      stdin: ""
      expected: |
        Заказ принят
        Сумма: 450 руб.
        Спасибо за покупку!
      hint: "Исправьте имя Println, кавычку и недостающую фигурную скобку, чтобы программа собралась и напечатала три строки."
    - id: "exact"
      title: "Текст не изменён (скрытый)"
      stdin: ""
      expected: |
        Заказ принят
        Сумма: 450 руб.
        Спасибо за покупку!
      hidden: true
      hint: "Проверяется точное совпадение текста: слова, пробелы, точка после «руб» и восклицательный знак в конце. Менять нужно только синтаксис, а не сами фразы."
