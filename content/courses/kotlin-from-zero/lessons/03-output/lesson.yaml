id: "kotlin.from-zero.output"
title: "Вывод текста"
goal: "Напечатать несколько строк с кавычками, переносами и склейкой частей, пользуясь print, println и комментариями."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "kotlin.from-zero.compiler-errors"
objectives:
  - "Различать print и println и предсказывать, где окажется курсор после вывода."
  - "Использовать \\n, \\\" и \\\\ внутри строки."
  - "Склеивать части текста знаком + и понимать, что склейка идёт слева направо."
  - "Писать комментарии // и /* */."
masteryCriteria:
  - "Ваша программа печатает кавычки и несколько строк так, как требует условие."
  - "Вы предсказываете вывод print и println без запуска."
  - "Вы отличаете комментарий от команды."
concepts:
  introduces:
    - "kotlin.print"
    - "kotlin.escape-sequence"
    - "kotlin.concatenation"
    - "kotlin.comment"
  uses:
    - "kotlin.println"
    - "kotlin.string-literal"
    - "kotlin.main-function"
    - "kotlin.compile-error"
next:
  - "kotlin.from-zero.variables"
tags:
  - "kotlin"
  - "print"
  - "println"
  - "escape"
  - "comment"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```kotlin
        fun main() {
            print("a")
            print("b")
            println("c")
            println("d")
        }
        ```
      options:
        - "abc и на следующей строке d"
        - "a, b, c, d - каждая буква на своей строке"
        - "abcd в одной строке"
        - "a и b в одной строке, c и d в другой"
      answer: 0
      explanation: "print оставляет курсор в той же строке, println переводит его на следующую. Поэтому a, b и c окажутся рядом, а d - на новой строке."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает команда?

        ```kotlin
        println("Он сказал: \"да\"")
        ```
      options:
        - "Он сказал: \"да\""
        - "Он сказал: да"
        - "Он сказал: \\\"да\\\""
        - "Ничего: будет ошибка компиляции."
      answer: 0
      explanation: "Последовательность \\\" вставляет в текст одну двойную кавычку, и обратная косая черта на экран не попадает. Вывод: Он сказал: \"да\" - с кавычками вокруг слова."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает команда?

        ```kotlin
        println("Итого: " + 2 + 3)
        ```
      options:
        - "Итого: 23"
        - "Итого: 5"
        - "Итого: 2 3"
        - "Ошибка компиляции."
      answer: 0
      explanation: "Склейка идёт слева направо: сначала к тексту «Итого: » приклеивается 2, получается текст, и к нему приклеивается 3. Числа не складываются, а превращаются в части строки."
    - id: "q4"
      type: "single"
      prompt: "Какая строка является комментарием и не выполняется?"
      options:
        - "// println(\"Привет\")"
        - "println(\"// Привет\")"
        - "print(\"Привет\") //"
        - "println(Привет)"
      answer: 0
      explanation: "Всё от // до конца строки компилятор пропускает. В варианте с println(\"// Привет\") двойной слэш находится внутри кавычек и является частью текста. В варианте print(\"Привет\") // команда стоит до двух слэшей и выполняется: комментарием является только пустой остаток строки."
exercise:
  id: "kotlin.from-zero.output.exercise"
  title: "Напечатайте чек"
  prompt: |
    Допишите программу так, чтобы она напечатала чек из четырёх строк:

    ```
    Чек №7
    Товар: "Кофе"
    Цена: 150 руб.
    Итого: 150 руб.
    ```

    Первая строка уже есть. В комментариях `TODO` подсказано, какая команда нужна для каждой следующей строки. Кавычки вокруг слова Кофе должны быть напечатаны.
  entryFile: "Main.kt"
  evaluation: "io"
  hints:
    - "Строка с кавычками пишется через \\\": println(\"Товар: \\\"Кофе\\\"\")."
    - "Чтобы «Цена: » и «150 руб.» оказались в одной строке, первую часть печатайте командой print, а вторую - println."
    - "Последняя строка: println(\"Итого: \" + \"150 руб.\")."
  tests:
    - id: "basic"
      title: "Чек из четырёх строк"
      stdin: ""
      expected: |
        Чек №7
        Товар: "Кофе"
        Цена: 150 руб.
        Итого: 150 руб.
      hint: "Программа должна напечатать четыре строки чека; кавычки вокруг Кофе печатаются."
    - id: "exact"
      title: "Точный текст чека (скрытый)"
      stdin: ""
      expected: |
        Чек №7
        Товар: "Кофе"
        Цена: 150 руб.
        Итого: 150 руб.
      hidden: true
      hint: "Проверяется точное совпадение: знак № в первой строке, кавычки вокруг Кофе, «Цена: » и «150 руб.» в одной строке, точка после «руб» и ровно четыре строки без лишних."
