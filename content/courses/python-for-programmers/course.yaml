id: python-for-programmers
version: 1.0.0
title: Python для программистов
description: >-
  Быстрый путь для тех, кто уже пишет на другом языке (Java, JavaScript, C#, Go): четыре плотных урока о том, что в Python
  устроено иначе и где чаще всего ошибаются. Имена и объекты, истинность, is и ==, целые произвольной длины, // и % с отрицательными
  числами, итерация вместо индексов; функции, изменяемые значения по умолчанию и строки; списки, словари, множества и общие
  ссылки; исключения, файлы, модули и if __name__ == "__main__". Каждый урок завершается упражнением с запуском тестов и квизом
  на типичные ловушки; успешное прохождение засчитывает соответствующие уроки курса «Основы Python». Это не замена курсу для
  начинающих: основы программирования здесь считаются известными, а классы, декораторы и итераторы остаются в курсе «Python: продвинутый уровень».
languageId: python
level: 1
track: python
lessons:
  - 01-syntax-and-control-flow
  - 02-functions-and-strings
  - 03-collections
  - 04-errors-files-modules
