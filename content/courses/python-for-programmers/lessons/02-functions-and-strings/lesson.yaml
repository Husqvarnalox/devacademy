id: "python.programmers.functions-and-strings"
title: "Функции и строки: значения по умолчанию, область видимости, Unicode"
goal: "Писать функции с разными видами параметров без ловушки изменяемого значения по умолчанию и обрабатывать текст срезами, методами и f-строками с форматом."
difficulty: "medium"
estimatedMinutes: 45
prerequisites:
  - "python.programmers.syntax-and-control-flow"
next:
  - "python.programmers.collections"
objectives:
  - "Объяснить, когда вычисляется значение по умолчанию, и безопасно подставлять изменяемые значения."
  - "Использовать позиционные, именованные, *args, только именованные параметры и возврат нескольких значений."
  - "Предсказывать область видимости имён (LEGB, nonlocal) и находить UnboundLocalError."
  - "Работать со срезами и методами неизменяемых строк и форматировать f-строками со спецификацией."
masteryCriteria:
  - "collect не делит состояние между вызовами, а slugify, money, initials и join_nonempty проходят все проверки, включая пустой ввод и отрицательные суммы."
  - "Вы без запуска определяете результат вызова функции с *args, **kwargs и значениями по умолчанию."
tags:
  - "python"
  - "programmers"
  - "functions"
  - "strings"
assessmentFor:
  - "python.fundamentals.functions"
  - "python.fundamentals.strings"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        def f(x, acc=[]):
            acc.append(x)
            return len(acc)

        print(f(1), f(2), f(3))
        ```
      options:
        - "1 1 1"
        - "1 2 3"
        - "1 2 2"
        - "Ошибка при определении функции"
      answer: 1
      explanation: "Список acc создаётся один раз при выполнении def, и все вызовы без второго аргумента дополняют его. Поэтому длина растёт: 1, 2, 3. Исправление - acc=None и создание списка внутри функции."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        s = "python"
        print(s[1:4], s[-2:], s[::2])
        ```
      options:
        - "yth on pto"
        - "pyt on pto"
        - "yth no pto"
        - "yth on yhn"
      answer: 0
      explanation: "s[1:4] - символы с индексами 1, 2, 3 (yth), s[-2:] - последние два (on), s[::2] - каждый второй, начиная с нуля (p, t, o). Правая граница среза не включается."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        x = 5

        def g():
            x = x + 1
            return x

        try:
            print(g())
        except UnboundLocalError:
            print("unbound")
        ```
      options:
        - "6"
        - "5"
        - "unbound"
        - "NameError: name 'x' is not defined"
      answer: 2
      explanation: "Присваивание x = ... внутри функции делает x локальным во всей функции. Правая часть x + 1 читает локальный x до присваивания, поэтому возникает UnboundLocalError. Глобальный x = 5 здесь не используется."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        def f(a, b=2, *args, **kw):
            return (a, b, args, sorted(kw))

        print(f(1, 3, 4, 5, z=1))
        ```
      options:
        - "(1, 3, (4, 5), ['z'])"
        - "(1, 2, (3, 4, 5), ['z'])"
        - "(1, 3, [4, 5], ['z'])"
        - "Ошибка: z не объявлен"
      answer: 0
      explanation: "Первые два позиционных аргумента попадают в a и b, остальные позиционные (4, 5) собираются в кортеж args, а именованный z - в словарь kw, и sorted даёт список его ключей."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        s = "abc"
        try:
            s[0] = "X"
        except TypeError:
            print("TypeError")
        print(s.upper(), s)
        ```
      options:
        - "Две строки: TypeError и ABC abc"
        - "Две строки: TypeError и ABC ABC"
        - "Одна строка: XBC abc"
        - "Ошибка, программа завершится"
      answer: 0
      explanation: "Строки неизменяемы: присваивание элементу даёт TypeError, который перехвачен. Метод upper возвращает новую строку и не меняет исходную, поэтому s по-прежнему равна abc."
exercise:
  id: "python.programmers.functions-and-strings.exercise"
  title: "Пять функций для сервиса публикаций"
  prompt: |
    В файле `text_task.py` реализуйте пять функций для небольшого сервиса публикаций. Тесты импортируют модуль и вызывают функции напрямую; ничего не печатайте.

    1. `collect(item, bucket=None)` - добавить `item` в конец `bucket` и вернуть `bucket`. Если `bucket` не передан, создайте **новый** пустой список при каждом вызове.
    2. `slugify(title)` - превратить заголовок в адрес: привести к нижнему регистру, все последовательности символов, не являющихся буквами и цифрами, заменить одним `-`, убрать `-` по краям. Кириллица допустима: `slugify("Привет, мир!")` равно `"привет-мир"`.
    3. `money(cents, currency="USD")` - показать сумму в минимальных единицах как текст с разделителем тысяч и двумя знаками: `money(123456)` равно `"1,234.56 USD"`. Отрицательные суммы получают знак перед числом: `money(-5)` равно `"-0.05 USD"`.
    4. `initials(full_name)` - вернуть заглавные первые буквы слов с точкой после каждой: `initials("анна петровна иванова")` равно `"А.П.И."`. Лишние пробелы игнорируются; для пустой строки вернуть `""`.
    5. `join_nonempty(*parts, sep=" ")` - склеить через `sep` те части, которые не пусты после `strip()`; части нужно очищать от пробелов по краям. Параметр `sep` - только именованный. Если подходящих частей нет, вернуть `""`.

    **Примеры.**

    ```python
    collect("a")                        # ['a']
    slugify("  Hello,   World! 2024 ")  # 'hello-world-2024'
    money(123456)                       # '1,234.56 USD'
    initials("ivan petrov")             # 'I.P.'
    join_nonempty("Москва", "", " ул. Ленина ", sep=", ")  # 'Москва, ул. Ленина'
    ```
  entryFile: "text_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Все функции возвращают значение через return; заглушка pass возвращает None."
    - "collect: проверьте bucket через is None и создайте список внутри функции. slugify: замените неалфавитные символы пробелами, затем разбейте по пробелам методом split() и склейте дефисом. Для проверки букв и цифр подходит метод строки isalnum."
    - "money: разделите abs(cents) через divmod на 100, знак вынесите отдельно; формат целой части f\"{units:,}\", копеек f\"{rest:02d}\". initials: переберите слова из split() и возьмите word[0].upper(). join_nonempty: фильтруйте части по p.strip()."
    - "Каркас join_nonempty: return sep.join(p.strip() for p in parts if p.strip()). Каркас money: sign = '-' if cents < 0 else ''; units, rest = divmod(abs(cents), 100); return f\"{sign}{units:,}.{rest:02d} {currency}\"."
  tests:
    - id: "collect-basic"
      title: "collect - добавление"
      hint: "Элемент добавляется в конец списка, переданный список дополняется."
    - id: "slugify-basic"
      title: "slugify - обычные заголовки"
      hint: "Нижний регистр и дефис вместо пробелов и знаков препинания; кириллица допустима."
    - id: "money-basic"
      title: "money - обычные суммы"
      hint: "Целая часть с запятой как разделителем тысяч, затем точка и две цифры копеек, затем код валюты."
    - id: "initials-basic"
      title: "initials - обычные имена"
      hint: "Первая буква каждого слова в верхнем регистре и точка после неё."
    - id: "join-basic"
      title: "join_nonempty - пропуск пустых частей"
      hint: "Пустые и состоящие из пробелов части пропускаются, у остальных убираются пробелы по краям."
    - id: "collect-fresh"
      title: "collect - независимые вызовы (скрытый)"
      hidden: true
      hint: "Список по умолчанию не должен переживать вызов: используйте None и создавайте список внутри функции."
    - id: "slugify-edges"
      title: "slugify - края (скрытый)"
      hidden: true
      hint: "Подряд идущие разделители дают один дефис, дефисов по краям нет; подчёркивание и точка тоже разделители; пустой результат - пустая строка."
    - id: "money-edges"
      title: "money - ноль, малые, отрицательные и большие суммы (скрытый)"
      hidden: true
      hint: "Копейки всегда двузначные, знак минус ставится один раз перед всем числом, тысячи разделяются запятыми."
    - id: "initials-edges"
      title: "initials - пустая строка и лишние пробелы (скрытый)"
      hidden: true
      hint: "split() без аргументов сам игнорирует лишние пробелы и пустые части."
    - id: "join-keyword-only"
      title: "join_nonempty - без частей и sep только по имени (скрытый)"
      hidden: true
      hint: "Параметр после *parts может быть передан только по имени; без частей результат пустая строка."
