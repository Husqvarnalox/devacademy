id: "python.programmers.collections"
title: "Коллекции: ссылки, копии, хеширование"
goal: "Работать со списками, словарями и множествами, не попадая в ловушки общих ссылок, поверхностных копий, нехешируемых ключей и изменения коллекции во время обхода."
difficulty: "medium"
estimatedMinutes: 45
prerequisites:
  - "python.programmers.functions-and-strings"
next:
  - "python.programmers.errors-files-modules"
objectives:
  - "Объяснять, что присваивание не копирует, и выбирать между поверхностной и глубокой копией."
  - "Создавать вложенные списки и словари так, чтобы строки были независимыми."
  - "Определять, можно ли использовать объект как ключ или элемент множества."
  - "Применять get, setdefault, defaultdict, Counter, множества и sorted с key."
masteryCriteria:
  - "group_by_first, dedupe, merge_counts, top_n и make_grid проходят все проверки, включая пустой ввод, ничьи и неизменность входных данных."
  - "Вы без запуска предсказываете результат кода с общими ссылками и удалением из списка при обходе."
tags:
  - "python"
  - "programmers"
  - "collections"
  - "list"
  - "dict"
  - "set"
assessmentFor:
  - "python.fundamentals.lists"
  - "python.fundamentals.dicts-and-sets"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        a = [[0] * 2] * 2
        a[0][0] = 5
        print(a)
        ```
      options:
        - "[[5, 0], [0, 0]]"
        - "[[5, 0], [5, 0]]"
        - "[[5, 5], [0, 0]]"
        - "Ошибка TypeError"
      answer: 1
      explanation: "Выражение [[0] * 2] * 2 создаёт список из двух ссылок на один и тот же внутренний список. Изменение через a[0] видно и в a[1]. Для независимых строк нужен генератор [[0] * 2 for _ in range(2)]."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        d = {"a": 1}
        x = d.get("b", 0) + 1
        d.setdefault("c", []).append(x)
        print(d, x)
        ```
      options:
        - "{'a': 1} 1"
        - "{'a': 1, 'c': [1]} 1"
        - "{'a': 1, 'b': 0, 'c': [1]} 1"
        - "Ошибка KeyError: 'b'"
      answer: 1
      explanation: "get не добавляет ключ в словарь и возвращает 0, поэтому x равно 1. setdefault создаёт ключ c со значением [] и возвращает этот список, в который добавляется x."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        t = (1, [2, 3])
        t[1].append(4)
        print(t)
        ```
      options:
        - "(1, [2, 3, 4])"
        - "(1, [2, 3])"
        - "(1, [2, 3], 4)"
        - "Ошибка TypeError: кортеж неизменяем"
      answer: 0
      explanation: "Кортеж неизменяем в том смысле, что нельзя заменить его элементы другими объектами. Но второй элемент - список, и его содержимое можно изменять. Ошибка возникла бы при присваивании t[1] = ... "
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        print({1, 1.0, True, "1"} == {1, "1"}, len({1, 1.0, True}))
        ```
      options:
        - "False 3"
        - "True 1"
        - "True 3"
        - "False 1"
      answer: 1
      explanation: "Числа 1, 1.0 и True равны, а равные объекты должны иметь одинаковый хеш, поэтому множество оставляет один из них. Множества {1, 1.0, True, '1'} и {1, '1'} совпадают, и длина {1, 1.0, True} равна 1."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        nums = [2, 4, 6, 1]
        for n in nums:
            if n % 2 == 0:
                nums.remove(n)
        print(nums)
        ```
      options:
        - "[1]"
        - "[4, 1]"
        - "[2, 4, 6, 1]"
        - "RuntimeError: list changed size"
      answer: 1
      explanation: "После удаления элемента остальные сдвигаются влево, а итератор продолжает с следующего индекса, поэтому часть элементов пропускается: удаляются 2 и 6, но 4 остаётся. Для словарей и множеств в такой ситуации выдаётся RuntimeError, а для списка - нет."
exercise:
  id: "python.programmers.collections.exercise"
  title: "Пять функций для обработки данных магазина"
  prompt: |
    В файле `collections_task.py` реализуйте пять функций для обработки данных магазина. Тесты импортируют модуль и вызывают функции напрямую; ничего не печатайте. Входные данные изменять нельзя.

    1. `group_by_first(words)` - вернуть словарь «первая буква слова в нижнем регистре -> список слов в исходном порядке». Пустые строки пропускать. Ключи идут в порядке первого появления.
    2. `dedupe(items)` - вернуть новый список без повторов, сохраняя порядок первого появления. Элементы хешируемые.
    3. `merge_counts(a, b)` - вернуть **новый** словарь, где значения для общих ключей сложены; исходные словари остаются прежними.
    4. `top_n(counts, n)` - вернуть список из не более чем `n` пар `(ключ, число)`, отсортированных по числу по убыванию, а при равенстве - по ключу по возрастанию.
    5. `make_grid(rows, cols, fill=0)` - вернуть список из `rows` независимых строк по `cols` элементов, заполненных `fill`.

    **Примеры.**

    ```python
    group_by_first(["Яблоко", "банан", "ананас", "Банан"])  # {'я': ['Яблоко'], 'б': ['банан', 'Банан'], 'а': ['ананас']}
    dedupe([3, 1, 3, 2, 1])                                   # [3, 1, 2]
    merge_counts({"a": 1, "b": 2}, {"b": 3, "c": 1})          # {'a': 1, 'b': 5, 'c': 1}
    top_n({"x": 2, "y": 5, "z": 2}, 2)                        # [('y', 5), ('x', 2)]
    make_grid(2, 3)                                           # [[0, 0, 0], [0, 0, 0]]
    ```
  entryFile: "collections_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Каждая функция должна вернуть значение через return; не изменяйте входные коллекции."
    - "group_by_first: словарь и метод setdefault (или проверка in). dedupe: множество встреченных элементов. merge_counts: начните с копии первого словаря. make_grid: список внутри генератора списка."
    - "top_n: sorted(counts.items(), key=...) с ключом-кортежем (-число, ключ), затем срез [:n]. make_grid: [[fill] * cols for _ in range(rows)] - внутренний список создаётся заново на каждой итерации."
    - "Каркас merge_counts: merged = dict(a); for key, value in b.items(): merged[key] = merged.get(key, 0) + value; return merged."
  tests:
    - id: "group-basic"
      title: "group_by_first - обычный случай"
      hint: "Ключ - первая буква в нижнем регистре; слова в группе идут в исходном порядке."
    - id: "dedupe-basic"
      title: "dedupe - порядок первого появления"
      hint: "Используйте множество уже встреченных элементов и отдельный список результата."
    - id: "merge-basic"
      title: "merge_counts - сложение общих ключей"
      hint: "Для ключей из обоих словарей значения складываются, остальные переносятся."
    - id: "top-basic"
      title: "top_n - лидеры"
      hint: "Сортировка по числу по убыванию, затем срез первых n пар."
    - id: "grid-basic"
      title: "make_grid - размеры"
      hint: "Строк rows, в каждой cols элементов fill."
    - id: "group-edges"
      title: "group_by_first - пустой ввод и пустые строки (скрытый)"
      hidden: true
      hint: "Пустые слова пропускаются, пустой список даёт пустой словарь, входной список не меняется."
    - id: "dedupe-edges"
      title: "dedupe - разные типы и неизменность (скрытый)"
      hidden: true
      hint: "1 и '1' - разные элементы; результат - новый список, исходный не меняется."
    - id: "merge-pure"
      title: "merge_counts - входные словари не изменяются (скрытый)"
      hidden: true
      hint: "Сначала сделайте копию первого словаря, а не изменяйте его; не возвращайте один из аргументов."
    - id: "top-edges"
      title: "top_n - ничьи, большое n и ноль (скрытый)"
      hidden: true
      hint: "При равных числах порядок задаёт ключ; n больше размера или равный нулю не должно вызывать ошибку."
    - id: "grid-independent"
      title: "make_grid - строки независимы (скрытый)"
      hidden: true
      hint: "Изменение одной ячейки не должно влиять на другие строки: создавайте отдельный список для каждой строки."
