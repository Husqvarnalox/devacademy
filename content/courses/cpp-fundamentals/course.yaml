id: "cpp-fundamentals"
version: "1.0.0"
title: "C++: язык и стандартная библиотека"
description: "Курс из восьми уроков: модель компиляции и время жизни объектов, ссылки, указатели и семантика перемещения, RAII и умные указатели, классы и виртуальная диспетчеризация, шаблоны, концепты и constexpr, контейнеры и алгоритмы STL, обработка ошибок и неопределённое поведение с санитайзерами. Примеры проверены запуском с -std=c++20 -pthread на Apple clang 21 (утверждения о версиях стандарта проверены ключами -std). Многопоточность показана на примерах гонок данных, std::thread, std::atomic и std::mutex (запускаются в приложении); CMake, корутины и подробный разбор многопоточности пока не входят."
languageId: "cpp"
level: 1
track: "cpp"
requires: [cpp-first-steps]
lessons:
  - "01-compilation-lifetime-storage"
  - "02-references-pointers-move"
  - "03-raii-smart-pointers"
  - "04-classes-inheritance-virtual"
  - "05-templates-concepts-constexpr"
  - "06-stl-containers-algorithms"
  - "07-error-handling"
  - "08-undefined-behaviour"
