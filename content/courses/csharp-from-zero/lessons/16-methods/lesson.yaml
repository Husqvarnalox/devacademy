id: "csharp.from-zero.methods"
title: "Методы"
goal: "Выделять повторяющиеся действия в static-методы с параметрами и вызывать их с разными аргументами."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "csharp.from-zero.loop-control"
objectives:
  - "Записывать static void метод с одним и несколькими параметрами."
  - "Вызывать метод, передавая аргументы в нужном порядке и нужных типов."
  - "Объяснять область видимости: переменные метода существуют только в нём."
  - "Читать сообщения компилятора о неверном числе и типе аргументов."
masteryCriteria:
  - "Вы выносите повторяющийся фрагмент программы в метод с параметрами."
  - "Вы объясняете разницу между параметром и аргументом."
  - "Вы передаёте данные в метод параметрами, а не через внешние переменные."
concepts:
  introduces:
    - "csharp.method"
    - "csharp.parameter"
    - "csharp.scope"
  uses:
    - "csharp.for"
    - "csharp.int"
    - "csharp.string"
    - "csharp.interpolation"
    - "csharp.console-write"
    - "csharp.console-writeline"
    - "csharp.parse"
    - "csharp.read-line"
    - "csharp.variable"
next:
  - "csharp.from-zero.return-values"
tags:
  - "csharp"
  - "methods"
  - "parameters"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        Show(3);
        Show(5);

        static void Show(int n)
        {
            Console.WriteLine(n * 2);
        }
        ```
      options:
        - "3 и 5"
        - "6 и 10"
        - "8"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Метод вызывается дважды. В первый раз n равно 3 и печатается 6, во второй n равно 5 и печатается 10."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        Info("Кофе", 120);

        static void Info(string name, int price)
        {
            Console.WriteLine($"{name}: {price}");
        }
        ```
      options:
        - "Кофе: 120"
        - "120: Кофе"
        - "name: price"
        - "Ошибка компиляции"
      answer: 0
      explanation: "Первый аргумент попадает в первый параметр name, второй - в price."
    - id: "q3"
      type: "single"
      prompt: |
        Что произойдёт при компиляции?

        ```csharp
        Info(120, "Кофе");

        static void Info(string name, int price)
        {
            Console.WriteLine($"{name}: {price}");
        }
        ```
      options:
        - "Выведется 120: Кофе."
        - "Ошибка CS1503: невозможно преобразовать int в string."
        - "Выведется Кофе: 120."
        - "Предупреждение, но программа соберётся."
      answer: 1
      explanation: "Аргументы сопоставляются параметрам по порядку и типу. Число 120 нельзя передать параметру string, компилятор сообщает об этом ошибкой."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        int x = 1;
        Change(10);
        Console.WriteLine(x);

        static void Change(int x)
        {
            x = x + 5;
            Console.WriteLine(x);
        }
        ```
      options:
        - "15 и 1"
        - "15 и 15"
        - "11 и 1"
        - "6 и 6"
      answer: 0
      explanation: "Параметр x метода - отдельная переменная. Внутри метода она равна 10, затем 15. Внешняя x не изменилась и осталась равной 1."
    - id: "q5"
      type: "single"
      prompt: |
        Почему этот код не компилируется?

        ```csharp
        int rate = 20;
        Show(100);

        static void Show(int sum)
        {
            Console.WriteLine(sum * rate / 100);
        }
        ```
      options:
        - "Метод вызывается раньше, чем объявлен."
        - "Static-метод не видит переменную rate: её нужно передать параметром."
        - "Нельзя умножать и делить в одном выражении."
        - "Метод должен называться show с маленькой буквы."
      answer: 1
      explanation: "Переменная rate принадлежит основной части программы, а static-метод получает данные только через параметры. Компилятор сообщает об ошибке CS8421."
exercise:
  id: "csharp.from-zero.methods.exercise"
  title: "Две строки чека"
  prompt: |
    Основная часть программы уже написана: она читает название магазина, название товара, количество и цену, а затем вызывает два метода. Допишите **тела** методов:

    * `PrintHeader(string shop)` - печатает строку `=== <shop> ===` (с пробелами между `===` и названием);
    * `PrintItem(string item, int quantity, int price)` - печатает строку `<item> x <quantity> = <quantity * price>`.

    **Пример.** Для ввода

    ```
    Кофейня
    Латте
    2
    180
    ```

    программа печатает

    ```
    === Кофейня ===
    Латте x 2 = 360
    Пакет x 1 = 5
    ```

    Последняя строка выводится вторым вызовом `PrintItem` в основной части. Основную часть не меняйте: тесты подают разные входные данные.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "Тела методов пустые, в них только комментарии TODO. Основная часть выше менять не нужно."
    - "В PrintHeader достаточно одной команды Console.WriteLine с интерполяцией: $\"=== {shop} ===\"."
    - "В PrintItem сначала можно вычислить int total = quantity * price;, затем напечатать три значения через интерполяцию."
    - "Console.WriteLine($\"{item} x {quantity} = {quantity * price}\");"
  tests:
    - id: "basic"
      title: "Латте на двоих"
      stdin: "Кофейня\nЛатте\n2\n180\n"
      expected: |
        === Кофейня ===
        Латте x 2 = 360
        Пакет x 1 = 5
      hint: "Первая строка: три знака равенства, пробел, название, пробел, три знака равенства. Вторая строка: товар, x, количество, знак равенства и произведение."
    - id: "zero"
      title: "Нулевое количество (скрытый)"
      stdin: "Пекарня\nБулка\n0\n40\n"
      expected: |
        === Пекарня ===
        Булка x 0 = 0
        Пакет x 1 = 5
      hidden: true
      hint: "При нулевом количестве итог равен 0: метод не должен ничего проверять, только умножить."
    - id: "big"
      title: "Большие числа (скрытый)"
      stdin: "Склад №3\nМешок цемента\n120\n350\n"
      expected: |
        === Склад №3 ===
        Мешок цемента x 120 = 42000
        Пакет x 1 = 5
      hidden: true
      hint: "Название может состоять из нескольких слов и содержать цифры; печатайте его как есть."
    - id: "empty-shop"
      title: "Пустое название (скрытый)"
      stdin: "\nЧай\n1\n60\n"
      expected: |
        ===  ===
        Чай x 1 = 60
        Пакет x 1 = 5
      hidden: true
      hint: "Если название пустое, между знаками равенства остаётся два пробела: шаблон всегда один и тот же."
