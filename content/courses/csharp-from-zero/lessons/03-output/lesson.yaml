id: "csharp.from-zero.output"
title: "Вывод: Write, WriteLine и специальные символы"
goal: "Управлять тем, где заканчивается строка вывода, и печатать кавычки, обратную косую черту и переводы строк."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "csharp.from-zero.compiler-errors"
objectives:
  - "Различать Console.Write и Console.WriteLine и собирать одну строку вывода из нескольких команд."
  - "Использовать \\n, \\t, \\\" и \\\\ внутри строкового литерала."
  - "Писать комментарии //, чтобы пояснить код, и понимать, что компилятор их пропускает."
masteryCriteria:
  - "Вы объясняете, почему после Console.Write следующий вывод продолжает ту же строку."
  - "Вы печатаете кавычки и обратную косую черту внутри текста, не получая ошибки компиляции."
  - "Вы предсказываете, сколько строк напечатает программа с \\n в тексте."
concepts:
  introduces:
    - "csharp.console-write"
    - "csharp.escape-sequence"
    - "csharp.comment"
  uses:
    - "csharp.console-writeline"
    - "csharp.string-literal"
    - "csharp.statement"
    - "csharp.compiler-error"
next:
  - "csharp.from-zero.variables-and-types"
tags:
  - "csharp"
  - "console-write"
  - "escape-sequence"
  - "comment"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        Console.Write("Сумма: ");
        Console.Write("120");
        Console.WriteLine(" руб.");
        Console.WriteLine("Спасибо");
        ```
      options:
        - "Сумма: 120 руб. и на следующей строке Спасибо"
        - "Сумма: на одной строке, 120 на второй, руб. на третьей и Спасибо на четвёртой"
        - "Сумма: 120 руб.Спасибо в одной строке"
        - "Только Спасибо"
      answer: 0
      explanation: "Write не переходит на новую строку, поэтому три первые команды собирают одну строку «Сумма: 120 руб.». Только WriteLine завершает её, и «Спасибо» оказывается на следующей."
    - id: "q2"
      type: "single"
      prompt: |
        Сколько строк напечатает команда?

        ```csharp
        Console.WriteLine("а\nб\nв");
        ```
      options:
        - "Одну: а\\nб\\nв"
        - "Три: а, б и в"
        - "Четыре"
        - "Ошибка компиляции"
      answer: 1
      explanation: "\\n внутри строки - перевод строки, на экране он превращается в начало новой строки. Получается три строки: а, б, в."
    - id: "q3"
      type: "single"
      prompt: |
        Как напечатать текст Он сказал: "Да"?

        ```csharp
        Console.WriteLine(???);
        ```
      options:
        - "\"Он сказал: \"Да\"\""
        - "\"Он сказал: \\\"Да\\\"\""
        - "'Он сказал: \"Да\"'"
        - "\"Он сказал: ``Да``\""
      answer: 1
      explanation: "Кавычка внутри строкового литерала записывается как \\\" (обратная косая черта и кавычка). Первый вариант заканчивает литерал на второй кавычке и даёт ошибку компиляции, одинарные кавычки в C# не подходят для текста."
    - id: "q4"
      type: "single"
      prompt: |
        Программист хотел напечатать C:\new\file, но видит странный вывод.

        ```csharp
        Console.WriteLine("C:\new\file");
        ```

        В чём причина?
      options:
        - "Нельзя печатать двоеточие."
        - "\\n в тексте превращается в перевод строки; обратную косую черту нужно удвоить: \"C:\\\\new\\\\file\"."
        - "Нужно использовать Write вместо WriteLine."
        - "Слово new зарезервировано."
      answer: 1
      explanation: "Сочетание \\n - перевод строки, поэтому на экране C: и вместе с ним начало следующей строки. Чтобы получить саму обратную косую черту, её пишут дважды. (Другое сочетание, \\f в \\file, тоже управляющее: форма перевода страницы. Любая неизвестная комбинация вообще не компилируется.)"
exercise:
  id: "csharp.from-zero.output.exercise"
  title: "Чек из нескольких команд"
  prompt: |
    Допишите программу так, чтобы она напечатала ровно пять строк:

    ```
    Чек №1
    Хлеб: 40
    Молоко: 75
    Путь: C:\shop\cheki
    Он сказал: "Спасибо!"
    ```

    Названия товаров уже печатаются командой `Console.Write`: числа нужно дописать так, чтобы строка закончилась. В последних двух строках используйте специальные символы `\\` и `\"`. Комментарии `// TODO` в заготовке можно удалить.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "Строка «Хлеб: » ещё не завершена, потому что использован Write. Чем закончить строку и вывести число?"
    - "Число печатается так же, как строка, только без кавычек: Console.WriteLine(40);"
    - "Для пути в строке нужны удвоенные обратные косые черты: \"Путь: C:\\\\shop\\\\cheki\". Для кавычек - \\\" перед и после слова Спасибо!"
  tests:
    - id: "basic"
      title: "Пять строк чека"
      stdin: ""
      expected: |
        Чек №1
        Хлеб: 40
        Молоко: 75
        Путь: C:\shop\cheki
        Он сказал: "Спасибо!"
      hint: "Должно быть пять строк. Позиция и цена товара - на одной строке (Хлеб: 40), путь содержит одиночные обратные косые черты, фраза - настоящие двойные кавычки."
    - id: "exact"
      title: "Ни лишних, ни потерянных символов (скрытый)"
      stdin: ""
      expected: |
        Чек №1
        Хлеб: 40
        Молоко: 75
        Путь: C:\shop\cheki
        Он сказал: "Спасибо!"
      hidden: true
      hint: "Проверяется точное совпадение с примером: пробел после двоеточия в «Хлеб: » и «Молоко: » и отсутствие лишних пустых строк между строками."
