id: "csharp.from-zero.if-else"
title: "Условия: if / else"
goal: "Выполнять разные действия в зависимости от условия с помощью if, else if и else и блоков в фигурных скобках."
difficulty: "easy"
estimatedMinutes: 35
prerequisites:
  - "csharp.from-zero.comparison-and-logic"
objectives:
  - "Записывать условную инструкцию if с блоком в фигурных скобках."
  - "Добавлять ветку else и цепочку else if, объяснять порядок проверки."
  - "Выбирать порядок условий так, чтобы не было пересечений."
  - "Замечать типичные ошибки: точку с запятой после условия, пропущенные скобки."
masteryCriteria:
  - "Вы разбиваете числовую шкалу на несколько диапазонов цепочкой if / else if / else."
  - "Вы объясняете, почему в цепочке выполняется только одна ветка."
  - "Вы проверяете граничные значения вашей программы."
concepts:
  introduces:
    - "csharp.if"
  uses:
    - "csharp.comparison"
    - "csharp.logical-operators"
    - "csharp.bool"
    - "csharp.parse"
    - "csharp.read-line"
    - "csharp.console-writeline"
    - "csharp.variable"
next:
  - "csharp.from-zero.switch"
tags:
  - "csharp"
  - "if"
  - "else"
  - "condition"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        int x = 5;
        if (x > 3)
        {
            Console.WriteLine("A");
        }
        else
        {
            Console.WriteLine("B");
        }
        ```
      options:
        - "A"
        - "B"
        - "AB"
        - "Ничего"
      answer: 0
      explanation: "Условие x > 3 истинно, выполняется блок после if. Блок else пропускается."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        int score = 85;
        if (score >= 60)
        {
            Console.WriteLine("C");
        }
        else if (score >= 80)
        {
            Console.WriteLine("B");
        }
        ```
      options:
        - "B"
        - "C"
        - "CB"
        - "Ничего"
      answer: 1
      explanation: "Условия проверяются сверху вниз, и выполняется первая подходящая ветка. score >= 60 истинно, поэтому печатается C, а до проверки score >= 80 дело не доходит. Чтобы получить B, более узкое условие нужно поставить выше."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        int p = 85;
        if (p >= 50)
        {
            Console.WriteLine("1");
        }
        if (p >= 80)
        {
            Console.WriteLine("2");
        }
        ```
      options:
        - "1"
        - "2"
        - "1 и 2 (на разных строках)"
        - "Ничего"
      answer: 2
      explanation: "Это два отдельных if, а не цепочка. Каждое условие проверяется независимо, и оба истинны."
    - id: "q4"
      type: "single"
      prompt: |
        Что делает компилятор с этим кодом?

        ```csharp
        int x = 5;
        if (x > 3);
        {
            Console.WriteLine("big");
        }
        ```
      options:
        - "Выдаёт ошибку: после условия нельзя ставить ;."
        - "Выдаёт предупреждение CS0642, а блок с сообщением выполняется всегда."
        - "Печатает big только если x больше 3."
        - "Не печатает ничего ни при каком x."
      answer: 1
      explanation: "Точка с запятой сразу после условия - пустая инструкция, тело if. Блок в фигурных скобках после неё - обычный блок, он выполняется всегда. Компилятор предупреждает: warning CS0642: Possible mistaken empty statement."
    - id: "q5"
      type: "single"
      prompt: "Условие для диапазона «возраст от 7 до 17 включительно» в цепочке, где предыдущая ветка уже проверила age < 7, можно записать как:"
      options:
        - "else if (age < 18)"
        - "else if (age > 18)"
        - "else if (age = 17)"
        - "else (age < 18)"
      answer: 0
      explanation: "Ветка else if (age < 18) достигается только если age < 7 ложно, то есть age >= 7. Вместе это диапазон от 7 до 17. Запись else (...) с условием недопустима, а age = 17 - присваивание."
exercise:
  id: "csharp.from-zero.if-else.exercise"
  title: "Цена билета"
  prompt: |
    Программа читает возраст посетителя и печатает вид билета:

    | Возраст | Вывод |
    |---|---|
    | меньше 7 | `Бесплатно` |
    | от 7 до 17 | `Детский билет: 100` |
    | от 18 до 64 | `Взрослый билет: 300` |
    | 65 и больше | `Льготный билет: 150` |

    **Пример.** Для ввода `30` программа печатает `Взрослый билет: 300`.

    В заготовке только чтение возраста и план в комментариях. Условия напишите сами цепочкой `if` / `else if` / `else`. Обратите внимание на границы: возрасты 7, 17, 18, 64 и 65.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "Нужна одна цепочка if / else if / else: сработает только одна ветка."
    - "Начните с самого маленького диапазона: if (age < 7). Следующая ветка else if (age < 18) уже гарантирует, что age >= 7."
    - "Продолжите: else if (age < 65) для взрослых, а else - для остальных (65 и больше)."
    - "if (age < 7) { Console.WriteLine(\"Бесплатно\"); } else if (age < 18) { Console.WriteLine(\"Детский билет: 100\"); } else if (age < 65) { Console.WriteLine(\"Взрослый билет: 300\"); } else { Console.WriteLine(\"Льготный билет: 150\"); }"
  tests:
    - id: "adult"
      title: "Взрослый (30)"
      stdin: "30\n"
      expected: |
        Взрослый билет: 300
      hint: "30 лет - это ветка от 18 до 64: Взрослый билет: 300."
    - id: "free"
      title: "Малыш (5, скрытый)"
      stdin: "5\n"
      expected: |
        Бесплатно
      hidden: true
      hint: "Меньше 7 лет - бесплатно."
    - id: "child-low"
      title: "Граница 7 (скрытый)"
      stdin: "7\n"
      expected: |
        Детский билет: 100
      hidden: true
      hint: "7 лет - уже детский билет: условие первой ветки age < 7 для 7 ложно."
    - id: "child-high"
      title: "Граница 17 (скрытый)"
      stdin: "17\n"
      expected: |
        Детский билет: 100
      hidden: true
      hint: "17 лет - ещё детский билет; взрослый начинается с 18."
    - id: "adult-low"
      title: "Граница 18 (скрытый)"
      stdin: "18\n"
      expected: |
        Взрослый билет: 300
      hidden: true
      hint: "18 лет - взрослый билет. Проверьте, что условие детской ветки age < 18, а не age <= 18."
    - id: "adult-high"
      title: "Граница 64 (скрытый)"
      stdin: "64\n"
      expected: |
        Взрослый билет: 300
      hidden: true
      hint: "64 года - ещё взрослый билет: льготный начинается с 65."
    - id: "senior"
      title: "Граница 65 (скрытый)"
      stdin: "65\n"
      expected: |
        Льготный билет: 150
      hidden: true
      hint: "65 лет - льготный билет. Последняя ветка else принимает все возрасты от 65."
