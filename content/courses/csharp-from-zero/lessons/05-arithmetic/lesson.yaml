id: "csharp.from-zero.arithmetic"
title: "Арифметика с целыми числами"
goal: "Вычислять выражения с целыми числами, включая деление с остатком, и сохранять результат в переменную."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "csharp.from-zero.variables-and-types"
objectives:
  - "Использовать операторы + - * / % с переменными типа int."
  - "Объяснить, что 7 / 2 равно 3, а 7 % 2 равно 1, и применить это к «пачкам и остаткам»."
  - "Расставлять скобки и учитывать приоритет операций."
  - "Пользоваться сокращёнными записями += и ++."
masteryCriteria:
  - "Вы вычисляете частное и остаток от деления целых и объясняете разницу."
  - "Вы предсказываете значение выражения без скобок и со скобками."
  - "Вы знаете, что деление int на ноль останавливает программу ошибкой выполнения."
concepts:
  introduces:
    - "csharp.arithmetic"
    - "csharp.integer-division"
    - "csharp.remainder"
    - "csharp.precedence"
    - "csharp.compound-assignment"
  uses:
    - "csharp.variable"
    - "csharp.int"
    - "csharp.assignment"
    - "csharp.console-write"
    - "csharp.console-writeline"
    - "csharp.comment"
next:
  - "csharp.from-zero.double-and-decimal"
tags:
  - "csharp"
  - "arithmetic"
  - "int"
  - "integer-division"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        Console.WriteLine(17 / 5);
        Console.WriteLine(17 % 5);
        ```
      options:
        - "3 и 2"
        - "3.4 и 2"
        - "2 и 3"
        - "4 и 2"
      answer: 0
      explanation: "Оба операнда int, поэтому / - целочисленное деление, результат 3 (дробная часть отбрасывается). % даёт остаток: 17 - 3 * 5 = 2."
    - id: "q2"
      type: "single"
      prompt: |
        Чему равно значение?

        ```csharp
        int x = 2 + 3 * 4;
        ```
      options:
        - "20"
        - "14"
        - "24"
        - "12"
      answer: 1
      explanation: "Умножение выполняется раньше сложения: 3 * 4 = 12, затем 2 + 12 = 14. Чтобы сложение было первым, нужны скобки: (2 + 3) * 4 = 20."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        int n = 10;
        n += 5;
        n -= 3;
        n++;
        Console.WriteLine(n);
        ```
      options:
        - "12"
        - "13"
        - "15"
        - "10"
      answer: 1
      explanation: "10 + 5 = 15, затем 15 - 3 = 12, затем n++ добавляет единицу: 13."
    - id: "q4"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```csharp
        int total = 100;
        int people = 0;
        Console.WriteLine(total / people);
        ```
      options:
        - "Напечатается 0."
        - "Напечатается бесконечность."
        - "Программа остановится с ошибкой DivideByZeroException."
        - "Ошибка компиляции: деление на ноль."
      answer: 2
      explanation: "Значение people компилятор не знает наперёд, поэтому программа собирается. При выполнении деление целых на ноль вызывает исключение DivideByZeroException. Деление на литерал 0 (10 / 0) компилятор отвергает сам с ошибкой CS0020."
    - id: "q5"
      type: "single"
      prompt: "Сколько полных пачек по 12 штук получится из 30 тетрадей и сколько штук останется?"
      options:
        - "2 пачки и 6 штук"
        - "3 пачки и 0 штук"
        - "2 пачки и 3 штуки"
        - "2.5 пачки"
      answer: 0
      explanation: "30 / 12 = 2 (целое частное), 30 % 12 = 6 (остаток). Целочисленное деление и остаток как раз отвечают на вопросы «сколько целых» и «сколько осталось»."
exercise:
  id: "csharp.from-zero.arithmetic.exercise"
  title: "Чек и пачки"
  prompt: |
    Магазин продаёт тетради. Нужно вывести четыре значения:

    ```
    Сумма: 340
    Сдача: 160
    Полных пачек: 2
    Отдельных тетрадей: 6
    ```

    Исходные числа уже записаны в переменные. Допишите программу: объявите переменные `total`, `change`, `packs` и `extra` и вычислите их с помощью арифметики.

    * `total` - стоимость покупки (цена умножить на количество);
    * `change` - сдача (сколько дал покупатель минус стоимость);
    * `packs` - сколько **полных** пачек получится из `notebooks` тетрадей по `packSize` штук;
    * `extra` - сколько тетрадей останется вне пачек.

    Числа вписывать в формулы не нужно: используйте имена переменных.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "Каждая новая переменная объявляется как int имя = выражение; Выражение составляется из уже существующих переменных."
    - "Стоимость - произведение (*), сдача - разность (-). Для пачек и остатка нужны два разных оператора деления."
    - "Полные пачки - целочисленное деление (/), остаток тетрадей - оператор % (остаток от деления)."
    - "int total = price * quantity; int change = paid - total; int packs = notebooks / packSize; int extra = notebooks % packSize;"
  tests:
    - id: "basic"
      title: "Сумма, сдача, пачки и остаток"
      stdin: ""
      expected: |
        Сумма: 340
        Сдача: 160
        Полных пачек: 2
        Отдельных тетрадей: 6
      hint: "85 * 4 = 340; 500 - 340 = 160; 30 / 12 = 2 полных пачки; остаток 30 % 12 = 6."
    - id: "exact"
      title: "Формат строк (скрытый)"
      stdin: ""
      expected: |
        Сумма: 340
        Сдача: 160
        Полных пачек: 2
        Отдельных тетрадей: 6
      hidden: true
      hint: "Проверяется точный формат: четыре строки с подписями Сумма:, Сдача:, Полных пачек:, Отдельных тетрадей: и числами через один пробел. Значения должны получаться вычислением (/ и %), а не вписываться числом."
