id: "csharp.from-zero.reading-input"
title: "Ввод с клавиатуры: Console.ReadLine"
goal: "Прочитать строки из ввода, сохранить их в переменные и использовать в выводе, не получая предупреждений компилятора о null."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "csharp.from-zero.strings"
objectives:
  - "Читать очередную строку ввода командой Console.ReadLine()."
  - "Объяснить, что ReadLine возвращает string? (null, когда ввод закончился), и записывать чтение как Console.ReadLine() ?? \"\"."
  - "Читать несколько строк подряд и использовать их в интерполированной строке."
masteryCriteria:
  - "Ваша программа читает две строки и печатает их в заданном формате."
  - "Вы объясняете, что произойдёт, если ввод пуст, и почему программа при этом не падает."
  - "Вы знаете, что прочитанное из ввода - текст, даже если он похож на число."
concepts:
  introduces:
    - "csharp.read-line"
    - "csharp.null"
    - "csharp.null-coalescing"
  uses:
    - "csharp.string"
    - "csharp.variable"
    - "csharp.interpolation"
    - "csharp.string-length"
    - "csharp.console-writeline"
next:
  - "csharp.from-zero.parsing-numbers"
tags:
  - "csharp"
  - "input"
  - "console-readline"
  - "null"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что возвращает Console.ReadLine(), когда строки во вводе закончились?"
      options:
        - "Пустую строку \"\"."
        - "Значение null."
        - "Число 0."
        - "Программа сама останавливается с ошибкой."
      answer: 1
      explanation: "ReadLine возвращает null, когда читать больше нечего. Пустая строка \"\" - другое: это прочитанная строка без символов (во вводе была пустая строка)."
    - id: "q2"
      type: "single"
      prompt: |
        Что делает эта запись?

        ```csharp
        string name = Console.ReadLine() ?? "";
        ```
      options:
        - "Читает строку; если ввод закончился (null), кладёт в name пустую строку."
        - "Всегда кладёт в name пустую строку."
        - "Сравнивает ввод с пустой строкой."
        - "Вызывает ошибку, потому что ?? не существует."
      answer: 0
      explanation: "Оператор a ?? b даёт a, если a не null, иначе b. Поэтому name всегда строка (не null), и компилятор не предупреждает о возможном null."
    - id: "q3"
      type: "single"
      prompt: |
        Ввод: две строки, 3 и 4. Что напечатает программа?

        ```csharp
        string a = Console.ReadLine() ?? "";
        string b = Console.ReadLine() ?? "";
        Console.WriteLine(a + b);
        ```
      options:
        - "7"
        - "34"
        - "3 4"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Прочитанное из ввода - строки. Для строк + склеивает, поэтому получается 34. Чтобы сложить числа 3 и 4, строки нужно сначала превратить в числа (следующий урок)."
    - id: "q4"
      type: "single"
      prompt: |
        Компилятор выдаёт warning CS8600 на этой строке. Как исправить, чтобы предупреждение исчезло и программа читала строку?

        ```csharp
        string name = Console.ReadLine();
        ```
      options:
        - "Дописать ?? \"\" после Console.ReadLine()."
        - "Заменить string на int."
        - "Удалить точку с запятой."
        - "Ничего: предупреждения можно игнорировать."
      answer: 0
      explanation: "ReadLine возвращает string? (с возможным null), а переменная string обещает «не null». Запись ?? \"\" заменяет null пустой строкой и снимает противоречие. Предупреждения в этом курсе считаются дефектом."
    - id: "q5"
      type: "single"
      prompt: |
        Ввод пуст (во вводе нет ни одной строки). Что напечатает программа?

        ```csharp
        string name = Console.ReadLine() ?? "";
        Console.WriteLine($"[{name}] {name.Length}");
        ```
      options:
        - "[] 0"
        - "Программа остановится с NullReferenceException."
        - "[null] 4"
        - "Ошибка компиляции."
      answer: 0
      explanation: "ReadLine вернёт null, ?? заменит его на \"\", поэтому name - пустая строка длиной 0. Без ?? переменная была бы null, и name.Length остановил бы программу."
exercise:
  id: "csharp.from-zero.reading-input.exercise"
  title: "Приветствие по вводу"
  prompt: |
    Программа получает две строки: имя и город. Нужно вывести три строки.

    **Пример.** Ввод:

    ```
    Анна
    Казань
    ```

    Вывод:

    ```
    Здравствуйте, Анна!
    Ваш город: Казань
    Длина имени: 4
    ```

    Имя читается в заготовке. Допишите чтение города (вторая строка ввода) и последнюю строку вывода: длина - это число символов в имени. Подсказка для названия переменной: оно уже используется в выводе.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "Нажмите «Запустить»: компилятор покажет, какого имени не хватает."
    - "Каждый вызов Console.ReadLine() берёт следующую строку ввода. Для города нужен второй вызов."
    - "Чтение города записывается так же, как имени: string city = Console.ReadLine() ?? \"\";"
    - "Последняя строка: Console.WriteLine($\"Длина имени: {name.Length}\");"
  tests:
    - id: "basic"
      title: "Имя и город"
      stdin: "Анна\nКазань\n"
      expected: |
        Здравствуйте, Анна!
        Ваш город: Казань
        Длина имени: 4
      hint: "Три строки: приветствие с именем, город из второй строки ввода и длина имени (4 символа у «Анна»)."
    - id: "spaces"
      title: "Пробелы в имени и городе (скрытый)"
      stdin: "Иван Петров\nНижний Новгород\n"
      expected: |
        Здравствуйте, Иван Петров!
        Ваш город: Нижний Новгород
        Длина имени: 11
      hidden: true
      hint: "ReadLine читает всю строку целиком, вместе с пробелами. В «Иван Петров» 11 символов, включая пробел."
    - id: "short"
      title: "Короткое имя (скрытый)"
      stdin: "Ян\nОм\n"
      expected: |
        Здравствуйте, Ян!
        Ваш город: Ом
        Длина имени: 2
      hidden: true
      hint: "Длина берётся от прочитанного имени, а не вписывается числом: у «Ян» это 2."
