id: "csharp.from-zero.first-program"
title: "Первая программа"
goal: "Запустить программу на C# и изменить текст, который она выводит."
difficulty: "intro"
estimatedMinutes: 20
prerequisites: []
objectives:
  - "Объяснить, что такое программа, исходный код, язык программирования, компилятор и .NET."
  - "Вывести текст на экран командой Console.WriteLine и записать строку в кавычках."
  - "Написать несколько команд подряд и предсказать порядок вывода."
masteryCriteria:
  - "Ваша программа печатает ровно заданную строку, включая регистр и знаки препинания."
  - "Вы отличаете текст в кавычках (его печатают как есть) от имени команды (её вызывают)."
concepts:
  introduces:
    - "csharp.program"
    - "csharp.console-writeline"
    - "csharp.string-literal"
    - "csharp.statement"
next:
  - "csharp.from-zero.compiler-errors"
tags:
  - "csharp"
  - "dotnet"
  - "console-writeline"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что делает компилятор?"
      options:
        - "Переводит исходный код на C# в форму, которую может выполнить компьютер, и сообщает об ошибках в тексте программы."
        - "Придумывает программу за вас."
        - "Печатает текст на экран."
        - "Хранит ваши файлы."
      answer: 0
      explanation: "Компилятор - программа-переводчик: он читает ваш исходный код, проверяет его по правилам языка и создаёт результат, который запускается. Печатает текст не он, а ваша программа командой Console.WriteLine."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        Console.WriteLine("раз");
        Console.WriteLine("два");
        ```
      options:
        - "раздва"
        - "раз два (в одной строке)"
        - "раз, а на следующей строке два"
        - "два, а на следующей строке раз"
      answer: 2
      explanation: "Команды выполняются сверху вниз, а Console.WriteLine после текста переходит на новую строку. Поэтому «раз» и «два» оказываются на разных строках в том порядке, в каком написаны команды."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает команда?

        ```csharp
        Console.WriteLine("Привет");
        ```
      options:
        - "\"Привет\" вместе с кавычками"
        - "Привет без кавычек"
        - "Ничего: нужна ещё одна команда"
        - "Console.WriteLine"
      answer: 1
      explanation: "Кавычки только показывают, где начинается и где заканчивается текст. На экран попадает содержимое между ними."
    - id: "q4"
      type: "single"
      prompt: |
        В чём ошибка в этой команде?

        ```csharp
        Console.WriteLine("Привет")
        ```
      options:
        - "В конце команды нет точки с запятой."
        - "Нельзя писать по-русски."
        - "Слово WriteLine нужно писать с маленькой буквы."
        - "Ошибки нет."
      answer: 0
      explanation: "Каждая команда в C# заканчивается точкой с запятой. Без неё компилятор сообщает, что ожидал ';'. Регистр букв в WriteLine записан верно: W и L заглавные."
exercise:
  id: "csharp.from-zero.first-program.exercise"
  title: "Измените выводимую строку"
  prompt: |
    В редакторе уже есть рабочая программа: она печатает приветствие. Измените её так, чтобы она печатала ровно одну строку:

    ```
    Я учусь программировать на C#!
    ```

    Менять нужно только текст в кавычках. Регистр букв, пробелы и восклицательный знак важны.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "Найдите в программе команду Console.WriteLine: нужный текст находится между кавычками."
    - "Замените всё, что стоит между кавычками, на нужную фразу. Сами кавычки, скобки и точку с запятой оставьте."
    - "Должно получиться Console.WriteLine(\"Я учусь программировать на C#!\");"
  tests:
    - id: "basic"
      title: "Печатается нужная фраза"
      stdin: ""
      expected: |
        Я учусь программировать на C#!
      hint: "Программа должна напечатать одну строку: Я учусь программировать на C#!"
    - id: "exact"
      title: "Точный текст и одна строка (скрытый)"
      stdin: ""
      expected: |
        Я учусь программировать на C#!
      hidden: true
      hint: "Проверяется точное совпадение: заглавная Я, пробелы между словами, решётка и восклицательный знак в конце и никаких лишних строк."
