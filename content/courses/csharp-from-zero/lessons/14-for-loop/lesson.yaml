id: "csharp.from-zero.for-loop"
title: "Цикл for"
goal: "Выполнять действие заданное число раз циклом for со счётчиком, в том числе читать n значений."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "csharp.from-zero.while-loop"
objectives:
  - "Записывать заголовок for из трёх частей и объяснять порядок их выполнения."
  - "Выбирать границы цикла так, чтобы получить нужное число проходов."
  - "Считать с другим шагом и в обратном порядке."
  - "Читать n значений ввода циклом for."
masteryCriteria:
  - "Вы предсказываете значения счётчика и количество проходов по заголовку for."
  - "Вы переписываете for на while и обратно."
  - "Вы находите минимум и максимум среди n прочитанных значений."
concepts:
  introduces:
    - "csharp.for"
  uses:
    - "csharp.while"
    - "csharp.if"
    - "csharp.comparison"
    - "csharp.compound-assignment"
    - "csharp.int"
    - "csharp.parse"
    - "csharp.read-line"
    - "csharp.null-coalescing"
    - "csharp.interpolation"
    - "csharp.console-write"
next:
  - "csharp.from-zero.loop-control"
tags:
  - "csharp"
  - "for"
  - "loops"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        for (int i = 0; i < 3; i++)
        {
            Console.Write(i);
        }
        ```
      options:
        - "012"
        - "123"
        - "0123"
        - "01"
      answer: 0
      explanation: "Счётчик принимает значения 0, 1, 2. Когда i становится 3, условие i < 3 ложно, и цикл заканчивается."
    - id: "q2"
      type: "single"
      prompt: |
        Сколько раз выполнится тело цикла?

        ```csharp
        for (int i = 1; i <= 10; i += 3)
        {
            Console.WriteLine(i);
        }
        ```
      options:
        - "3 раза"
        - "4 раза"
        - "10 раз"
        - "Бесконечно"
      answer: 1
      explanation: "Счётчик принимает значения 1, 4, 7, 10. Последнее значение 10 удовлетворяет условию i <= 10, после чего i становится 13."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        int total = 0;
        for (int i = 1; i <= 4; i++)
        {
            total += i;
        }
        Console.WriteLine(total);
        ```
      options:
        - "4"
        - "6"
        - "10"
        - "24"
      answer: 2
      explanation: "Складываются 1, 2, 3 и 4: 1 + 2 + 3 + 4 = 10."
    - id: "q4"
      type: "single"
      prompt: |
        Что произойдёт при компиляции?

        ```csharp
        for (int i = 0; i < 3; i++)
        {
            Console.WriteLine(i);
        }
        Console.WriteLine(i);
        ```
      options:
        - "Выведется 0 1 2 3."
        - "Выведется 0 1 2 и затем 3."
        - "Ошибка CS0103: имя i не существует в текущем контексте."
        - "Ошибка CS1002: ожидалась точка с запятой."
      answer: 2
      explanation: "Счётчик, объявленный в заголовке for, существует только внутри цикла. После закрывающей скобки имя i недоступно."
    - id: "q5"
      type: "single"
      prompt: |
        Во вводе число n = 4. Какой заголовок выполняет тело ровно 4 раза?
      options:
        - "for (int i = 0; i <= n; i++)"
        - "for (int i = 1; i < n; i++)"
        - "for (int i = 0; i < n; i++)"
        - "for (int i = 0; i < n; i += 2)"
      answer: 2
      explanation: "Счётчик 0, 1, 2, 3 даёт четыре прохода. Вариант с i <= n даёт пять, вариант i = 1 и i < n - три, а шаг 2 - два прохода."
exercise:
  id: "csharp.from-zero.for-loop.exercise"
  title: "Температуры недели"
  prompt: |
    В первой строке ввода записано количество измерений `n` (от 1 до 31). Затем идут `n` строк, в каждой температура воздуха (целое число, может быть отрицательным).

    Напечатайте две строки:

    ```
    Максимум: <наибольшая температура>
    Минимум: <наименьшая температура>
    ```

    **Пример.** Для ввода

    ```
    4
    3
    -5
    12
    0
    ```

    программа печатает

    ```
    Максимум: 12
    Минимум: -5
    ```

    Читайте значения циклом `for`. Подсказка по идее: начните с первого измеренного значения как с наибольшего и наименьшего, затем сравнивайте с ним остальные.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "Прочитайте n, затем первую температуру. Запишите её и в max, и в min."
    - "Цикл for (int i = 1; i < n; i++) прочитает остальные n - 1 значений: счётчик с 1, потому что первое уже прочитано."
    - "Внутри цикла: если температура больше max, обновите max; если меньше min, обновите min. Два отдельных if."
    - "int max = first; int min = first; for (int i = 1; i < n; i++) { int t = int.Parse(Console.ReadLine() ?? \"\"); if (t > max) { max = t; } if (t < min) { min = t; } }"
  tests:
    - id: "basic"
      title: "Обычные значения"
      stdin: "4\n3\n-5\n12\n0\n"
      expected: |
        Максимум: 12
        Минимум: -5
      hint: "Наибольшее из 3, -5, 12, 0 равно 12, наименьшее -5."
    - id: "single"
      title: "Одно измерение (скрытый)"
      stdin: "1\n7\n"
      expected: |
        Максимум: 7
        Минимум: 7
      hidden: true
      hint: "При n = 1 цикл по остальным значениям не выполняется, и максимум с минимумом равны первому значению."
    - id: "negatives"
      title: "Все отрицательные (скрытый)"
      stdin: "3\n-8\n-3\n-20\n"
      expected: |
        Максимум: -3
        Минимум: -20
      hidden: true
      hint: "Если начать с max = 0, максимум отрицательных значений окажется неверным: начальным значением должно быть первое измерение."
    - id: "first-max"
      title: "Максимум стоит первым (скрытый)"
      stdin: "5\n30\n10\n20\n5\n15\n"
      expected: |
        Максимум: 30
        Минимум: 5
      hidden: true
      hint: "Первое прочитанное значение тоже участвует в сравнении, оно может быть наибольшим."
    - id: "equal"
      title: "Одинаковые значения (скрытый)"
      stdin: "3\n10\n10\n10\n"
      expected: |
        Максимум: 10
        Минимум: 10
      hidden: true
      hint: "Если все значения одинаковы, максимум и минимум совпадают."
