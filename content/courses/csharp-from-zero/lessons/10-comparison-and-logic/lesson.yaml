id: "csharp.from-zero.comparison-and-logic"
title: "Сравнения и логика"
goal: "Сравнивать значения операторами сравнения, получать результат типа bool и объединять условия операторами &&, || и !."
difficulty: "easy"
estimatedMinutes: 30
prerequisites:
  - "csharp.from-zero.parsing-numbers"
objectives:
  - "Записывать сравнения == != < > <= >= и объяснять, что результат - значение типа bool."
  - "Отличать сравнение == от присваивания =."
  - "Объединять условия операторами && (и), || (или) и ! (не)."
  - "Сравнивать строки на равенство и помнить, что регистр различается."
masteryCriteria:
  - "Вы записываете условие «число от 10 до 99 включительно» одним выражением."
  - "Вы предсказываете True или False для составного условия до запуска."
  - "Вы замечаете и исправляете = вместо ==."
concepts:
  introduces:
    - "csharp.comparison"
    - "csharp.logical-operators"
  uses:
    - "csharp.bool"
    - "csharp.int"
    - "csharp.string"
    - "csharp.remainder"
    - "csharp.parse"
    - "csharp.interpolation"
    - "csharp.precedence"
next:
  - "csharp.from-zero.if-else"
tags:
  - "csharp"
  - "bool"
  - "comparison"
  - "logical-operators"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        int a = 7;
        Console.WriteLine(a != 7);
        ```
      options:
        - "True"
        - "False"
        - "7"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Оператор != означает «не равно». Значение a равно 7, поэтому утверждение «a не равно 7» ложно: False."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        int age = 20;
        bool hasTicket = false;
        Console.WriteLine(age >= 18 && hasTicket);
        ```
      options:
        - "True"
        - "False"
        - "20"
        - "Ошибка компиляции"
      answer: 1
      explanation: "&& даёт True только если истинны обе части. age >= 18 истинно, hasTicket ложно, поэтому результат False."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        int x = 5;
        Console.WriteLine(x < 3 || x > 4);
        ```
      options:
        - "True"
        - "False"
        - "5"
        - "Ошибка компиляции"
      answer: 0
      explanation: "|| даёт True, если истинна хотя бы одна часть. x < 3 ложно, но x > 4 истинно."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        string a = "Да";
        string b = "да";
        Console.WriteLine(a == b);
        ```
      options:
        - "True"
        - "False"
        - "Да"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Строки сравниваются посимвольно и с учётом регистра: заглавная Д и строчная д - разные символы."
    - id: "q5"
      type: "single"
      prompt: |
        Как записать условие «x от 1 до 10 включительно»?
      options:
        - "1 <= x <= 10"
        - "x >= 1 && x <= 10"
        - "x >= 1 || x <= 10"
        - "x = 1 && x = 10"
      answer: 1
      explanation: "Цепочку 1 <= x <= 10 C# не поддерживает (ошибка CS0019). Нужны два сравнения, объединённые &&. С || условие выполнялось бы для любого числа."
exercise:
  id: "csharp.from-zero.comparison-and-logic.exercise"
  title: "Свойства числа"
  prompt: |
    Программа читает одно целое число `n` и печатает четыре строки со значениями `True` или `False`.

    **Пример.** Для ввода `48`:

    ```
    Чётное: True
    Двузначное: True
    Не равно нулю: True
    Вне диапазона от 1 до 100: False
    ```

    Первая строка уже написана. Допишите остальные три:

    * `Двузначное` - число от 10 до 99 включительно;
    * `Не равно нулю` - число не равно 0;
    * `Вне диапазона от 1 до 100` - число меньше 1 или больше 100.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "Образец уже есть: в интерполяции после текста в фигурных скобках стоит выражение сравнения."
    - "Двузначное: две проверки через &&: n >= 10 и n <= 99."
    - "Не равно нулю: n != 0. Вне диапазона: n < 1 || n > 100."
    - "Console.WriteLine($\"Двузначное: {n >= 10 && n <= 99}\"); Console.WriteLine($\"Не равно нулю: {n != 0}\"); Console.WriteLine($\"Вне диапазона от 1 до 100: {n < 1 || n > 100}\");"
  tests:
    - id: "basic"
      title: "Число 48"
      stdin: "48\n"
      expected: |
        Чётное: True
        Двузначное: True
        Не равно нулю: True
        Вне диапазона от 1 до 100: False
      hint: "48 чётное, двузначное, не ноль и лежит в диапазоне от 1 до 100, поэтому внизу False."
    - id: "odd"
      title: "Нечётное однозначное (скрытый)"
      stdin: "7\n"
      expected: |
        Чётное: False
        Двузначное: False
        Не равно нулю: True
        Вне диапазона от 1 до 100: False
      hidden: true
      hint: "7 нечётное и однозначное. Проверьте границы: двузначное - от 10 до 99 включительно."
    - id: "hundred"
      title: "Граница 100 (скрытый)"
      stdin: "100\n"
      expected: |
        Чётное: True
        Двузначное: False
        Не равно нулю: True
        Вне диапазона от 1 до 100: False
      hidden: true
      hint: "100 ещё входит в диапазон от 1 до 100, поэтому для «вне диапазона» нужен строгий знак: n > 100. Но трёхзначное число не двузначное."
    - id: "zero"
      title: "Ноль (скрытый)"
      stdin: "0\n"
      expected: |
        Чётное: True
        Двузначное: False
        Не равно нулю: False
        Вне диапазона от 1 до 100: True
      hidden: true
      hint: "0 чётное (остаток от деления на 2 равен 0), равно нулю и меньше 1, поэтому вне диапазона."
    - id: "negative"
      title: "Отрицательное (скрытый)"
      stdin: "-12\n"
      expected: |
        Чётное: True
        Двузначное: False
        Не равно нулю: True
        Вне диапазона от 1 до 100: True
      hidden: true
      hint: "-12 двузначным не считается: оно не лежит между 10 и 99. Но оно чётное и меньше 1."
