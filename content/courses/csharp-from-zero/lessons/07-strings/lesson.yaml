id: "csharp.from-zero.strings"
title: "Строки: склейка и интерполяция"
goal: "Собирать строки из текста и значений переменных, узнавать длину строки и печатать числа с заданным числом знаков."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "csharp.from-zero.double-and-decimal"
objectives:
  - "Склеивать строки оператором + и объяснять, чем \"5\" + \"3\" отличается от 5 + 3."
  - "Вставлять значения в текст через интерполяцию $\"...{имя}...\"."
  - "Получать длину строки свойством Length."
  - "Печатать число с двумя знаками после точки форматом :F2."
masteryCriteria:
  - "Вы печатаете строку вида «Товар: Тетрадь x 3» одной командой WriteLine."
  - "Вы замечаете, что строка без знака $ не подставляет значения."
  - "Вы печатаете цену как 45.50, а не 45.5."
concepts:
  introduces:
    - "csharp.concatenation"
    - "csharp.interpolation"
    - "csharp.string-length"
    - "csharp.format-specifier"
  uses:
    - "csharp.string"
    - "csharp.variable"
    - "csharp.int"
    - "csharp.decimal"
    - "csharp.double"
    - "csharp.culture"
    - "csharp.console-writeline"
    - "csharp.escape-sequence"
next:
  - "csharp.from-zero.reading-input"
tags:
  - "csharp"
  - "string"
  - "interpolation"
  - "format"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатают две команды?

        ```csharp
        Console.WriteLine("5" + "3");
        Console.WriteLine(5 + 3);
        ```
      options:
        - "8 и 8"
        - "53 и 8"
        - "53 и 53"
        - "8 и 53"
      answer: 1
      explanation: "Для строк + склеивает: \"5\" + \"3\" даёт \"53\". Для чисел + складывает: 5 + 3 равно 8. Тип операндов определяет действие."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        string name = "Анна";
        Console.WriteLine("Привет, {name}!");
        ```
      options:
        - "Привет, Анна!"
        - "Привет, {name}!"
        - "Привет, name!"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Без знака $ перед кавычкой фигурные скобки - обычные символы. Интерполяция работает только в строке, которая начинается с $\"."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        int n = 4;
        string word = "привет";
        Console.WriteLine($"Через год: {n + 1}, длина слова: {word.Length}");
        ```
      options:
        - "Через год: 5, длина слова: 6"
        - "Через год: n + 1, длина слова: 6"
        - "Через год: 5, длина слова: 5"
        - "Ошибка компиляции"
      answer: 0
      explanation: "Внутри фигурных скобок можно писать выражение: n + 1 даёт 5. Длина слова «привет» - 6 символов."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа (строка с InvariantCulture уже стоит в начале файла)?

        ```csharp
        decimal price = 45.5m;
        Console.WriteLine($"Цена: {price:F2}");
        ```
      options:
        - "Цена: 45.5"
        - "Цена: 45.50"
        - "Цена: 45,50"
        - "Цена: F2"
      answer: 1
      explanation: "Формат :F2 (fixed-point) печатает ровно два знака после точки. Запятая появилась бы только при русской культуре без InvariantCulture."
    - id: "q5"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        string word = "ёж";
        Console.WriteLine(word.Length);
        ```
      options:
        - "1"
        - "2"
        - "3"
        - "Ошибка: Length нужно вызывать со скобками"
      answer: 1
      explanation: "В слове «ёж» две буквы, Length - количество символов. Length - свойство, скобок после него не пишут (s.Length(), в отличие от методов, это ошибка CS1955)."
exercise:
  id: "csharp.from-zero.strings.exercise"
  title: "Чек в одну строку на пункт"
  prompt: |
    Допишите программу так, чтобы она напечатала:

    ```
    Магазин: Книжный
    Товар: Тетрадь x 3
    Цена: 45.50
    Итого: 136.50
    В названии символов: 7
    ```

    Первая строка уже есть. Остальные напечатайте через интерполяцию `$"..."`, подставляя значения переменных, а не вписывая их цифрами. Цену и итог печатайте с двумя знаками после точки (формат `:F2`), длину названия берите из `product.Length`.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "Образец уже в программе: Console.WriteLine($\"Магазин: {shop}\"); - перед кавычкой стоит $, а имя переменной в фигурных скобках."
    - "Для строки «Товар: Тетрадь x 3» подставьте в фигурных скобках product и quantity, остальное - обычный текст."
    - "Для цены и итога после имени добавьте :F2 внутри скобок, например {price:F2}. Длина названия - {product.Length}."
    - "Console.WriteLine($\"Товар: {product} x {quantity}\"); Console.WriteLine($\"Цена: {price:F2}\"); Console.WriteLine($\"Итого: {total:F2}\"); Console.WriteLine($\"В названии символов: {product.Length}\");"
  tests:
    - id: "basic"
      title: "Пять строк чека"
      stdin: ""
      expected: |
        Магазин: Книжный
        Товар: Тетрадь x 3
        Цена: 45.50
        Итого: 136.50
        В названии символов: 7
      hint: "Пять строк. Цена и итог - с двумя знаками (45.50 и 136.50), товар - в виде «Тетрадь x 3», длина названия - 7."
    - id: "exact"
      title: "Значения из переменных (скрытый)"
      stdin: ""
      expected: |
        Магазин: Книжный
        Товар: Тетрадь x 3
        Цена: 45.50
        Итого: 136.50
        В названии символов: 7
      hidden: true
      hint: "Проверяется точное совпадение. Итого должно быть значением переменной total (136.50), а не числом, вписанным вручную, и формат :F2 даёт именно два знака."
