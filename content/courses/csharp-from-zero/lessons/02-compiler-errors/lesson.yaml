id: "csharp.from-zero.compiler-errors"
title: "Как читать сообщения компилятора"
goal: "Прочитать сообщение об ошибке, найти строку с проблемой и исправить программу, которая не собирается."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "csharp.from-zero.first-program"
objectives:
  - "Назвать два этапа: сборка (проверка компилятором) и запуск, и сказать, какие ошибки возникают на каждом."
  - "Разобрать сообщение вида Program.cs(2,48): error CS1002: ; expected на части: файл, строка, символ, код, описание."
  - "Исправлять ошибки по одной, перезапуская сборку, и отличать причину от следствий."
masteryCriteria:
  - "Вы находите в сообщении номер строки и открываете именно её и предыдущую."
  - "Вы объясняете, почему после исправления одной ошибки могут появиться новые."
  - "Вы отличаете ошибку сборки (программа не запускается) от ошибки выполнения (часть вывода уже есть)."
concepts:
  introduces:
    - "csharp.compiler-error"
    - "csharp.build-and-run"
  uses:
    - "csharp.program"
    - "csharp.console-writeline"
    - "csharp.string-literal"
    - "csharp.statement"
next:
  - "csharp.from-zero.output"
tags:
  - "csharp"
  - "compiler"
  - "errors"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        В третьей строке программы из четырёх команд пропущена закрывающая кавычка. Что произойдёт при нажатии «Запустить»?

        ```csharp
        Console.WriteLine("Один");
        Console.WriteLine("Два");
        Console.WriteLine("Три);
        Console.WriteLine("Четыре");
        ```
      options:
        - "Напечатаются «Один» и «Два», затем появится сообщение об ошибке."
        - "Напечатаются все четыре строки."
        - "Программа не запустится: компилятор сообщит об ошибке, и ни одна строка не будет напечатана."
        - "Напечатается только «Один»."
      answer: 2
      explanation: "Сначала компилятор проверяет весь файл. Если нашёл ошибку, сборка не завершается, и запускать нечего: ни одна команда не выполняется. Часть вывода перед ошибкой появляется только при ошибках выполнения, а это ошибка сборки."
    - id: "q2"
      type: "single"
      prompt: "Что означает сообщение Program.cs(7,12): error CS1002: ; expected?"
      options:
        - "Ошибка в файле Program.cs около строки 7, символ 12: компилятор ожидал точку с запятой."
        - "В программе 7 ошибок на 12 строках."
        - "Ошибка в строке 12, символе 7."
        - "Предупреждение: программу можно запускать."
      answer: 0
      explanation: "В скобках сначала номер строки, потом номер символа в строке. Слово error означает, что программа не соберётся. Код CS1002 - идентификатор ошибки, по нему можно искать описание. Из-за пропущенной точки с запятой компилятор иногда указывает на конец предыдущей строки, поэтому смотрите и её."
    - id: "q3"
      type: "single"
      prompt: |
        Программа собралась и запустилась. Что увидите?

        ```csharp
        Console.WriteLine("Шаг 1");
        Console.WriteLine(int.Parse("abc"));
        Console.WriteLine("Шаг 3");
        ```
      options:
        - "Ошибку компиляции, и ничего не напечатается."
        - "Шаг 1, затем сообщение об исключении FormatException; строка «Шаг 3» не напечатается."
        - "Все три строки: Шаг 1, abc, Шаг 3."
        - "Шаг 1 и Шаг 3, а вторая команда будет пропущена."
      answer: 1
      explanation: "С точки зрения компилятора программа верна: int.Parse существует. Ошибка обнаруживается только при выполнении второй команды: текст abc нельзя превратить в число. Первая команда уже выполнилась, поэтому «Шаг 1» напечатан; после неисправленной ошибки программа останавливается."
    - id: "q4"
      type: "single"
      prompt: "Вы исправили единственную ошибку в программе, и компилятор показал две новые. Что это значит?"
      options:
        - "Вы сделали ещё хуже, нужно вернуть прежнюю версию."
        - "Возможно, компилятор сначала нашёл только ошибки записи (синтаксис), а после их исправления смог проверить следующие правила. Это обычно."
        - "Компилятор неисправен."
        - "Нужно перезагрузить компьютер."
      answer: 1
      explanation: "Компилятор проверяет программу этапами. Пока в тексте есть ошибки записи, часть проверок (например, существует ли такое имя) он не выполняет. Исправили одно - увидели следующее. Поэтому после каждой правки сборку запускают заново."
exercise:
  id: "csharp.from-zero.compiler-errors.exercise"
  title: "Исправьте три ошибки"
  prompt: |
    В программе три ошибки: в двух командах нарушена запись, в одной неверно написано название. Из-за них программа не собирается. Исправьте их так, чтобы она напечатала три строки:

    ```
    Добро пожаловать в магазин
    Сегодня скидка 10%
    Приходите ещё!
    ```

    Нажимайте «Запустить» после каждой правки и читайте сообщение компилятора: после исправления одних ошибок могут показаться другие. Текст в кавычках менять не нужно.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "Нажмите «Запустить» и найдите в сообщениях номер строки. Начните с самой первой ошибки в списке."
    - "Одна строка не заканчивается точкой с запятой, в другой не закрыта кавычка. Название третьей команды написано с ошибкой в регистре."
    - "Первая строка: добавьте ; в конец. Третья строка: добавьте закрывающую \" перед скобкой. Во второй строке слово Console должно начинаться с заглавной буквы."
  tests:
    - id: "basic"
      title: "Программа собирается и печатает три строки"
      stdin: ""
      expected: |
        Добро пожаловать в магазин
        Сегодня скидка 10%
        Приходите ещё!
      hint: "Программа должна напечатать три строки: приветствие, скидка 10% и приглашение. Проверьте точку с запятой, кавычки и регистр слова Console."
    - id: "exact"
      title: "Тексты не изменены (скрытый)"
      stdin: ""
      expected: |
        Добро пожаловать в магазин
        Сегодня скидка 10%
        Приходите ещё!
      hidden: true
      hint: "Проверяется точное совпадение текстов. Не меняйте слова, знаки препинания и порядок строк - только исправьте ошибки записи."
