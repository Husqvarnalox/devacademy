id: "csharp.from-zero.lists"
title: "Списки List"
goal: "Хранить растущий набор значений в List<T>: добавлять, удалять, искать, сортировать и передавать список в методы."
difficulty: "easy"
estimatedMinutes: 45
prerequisites:
  - "csharp.from-zero.arrays"
objectives:
  - "Создавать List<T>, добавлять элементы методом Add и узнавать их число через Count."
  - "Использовать Remove, RemoveAt, Contains и Sort."
  - "Собирать подходящие значения в новый список и возвращать его из метода."
  - "Читать значения до конца ввода в список."
masteryCriteria:
  - "Вы отличаете Count списка от Length массива и Remove от RemoveAt."
  - "Вы фильтруете список методом, который возвращает новый список."
  - "Вы объясняете, почему нельзя изменять список внутри foreach."
concepts:
  introduces:
    - "csharp.list"
    - "csharp.list-methods"
  uses:
    - "csharp.array"
    - "csharp.index"
    - "csharp.foreach"
    - "csharp.for"
    - "csharp.while"
    - "csharp.end-of-input"
    - "csharp.if"
    - "csharp.method"
    - "csharp.parameter"
    - "csharp.return"
    - "csharp.parse"
    - "csharp.read-line"
next:
  - "csharp.from-zero.dictionaries"
tags:
  - "csharp"
  - "list"
  - "collections"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        List<int> xs = new List<int>();
        xs.Add(4);
        xs.Add(7);
        xs.Add(4);
        Console.WriteLine(xs.Count);
        ```
      options:
        - "2"
        - "3"
        - "4"
        - "15"
      answer: 1
      explanation: "Add добавляет элемент всегда, даже если такое значение уже есть. Count равно 3."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        List<int> xs = new List<int> { 10, 20, 30 };
        xs.RemoveAt(1);
        Console.WriteLine(string.Join(" ", xs));
        ```
      options:
        - "10 30"
        - "20 30"
        - "10 20"
        - "10 20 30"
      answer: 0
      explanation: "RemoveAt(1) удаляет элемент с индексом 1, то есть 20. Остальные остаются."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        List<int> xs = new List<int> { 10, 20, 30 };
        xs.Remove(1);
        Console.WriteLine(xs.Count);
        ```
      options:
        - "2"
        - "3"
        - "Ошибка при запуске"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Remove(1) ищет значение 1, а не индекс 1. Такого значения в списке нет, поэтому ничего не удаляется, Count остаётся 3."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        List<int> xs = new List<int> { 3, 9, 1 };
        xs.Sort();
        Console.WriteLine(xs[0] + " " + xs[2]);
        ```
      options:
        - "3 1"
        - "1 9"
        - "9 1"
        - "1 3"
      answer: 1
      explanation: "После сортировки список выглядит как 1, 3, 9. Нулевой элемент - 1, второй - 9."
    - id: "q5"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```csharp
        List<int> xs = new List<int> { 1, 2, 3 };
        foreach (int x in xs)
        {
            if (x == 2)
            {
                xs.Remove(x);
            }
        }
        ```
      options:
        - "Элемент 2 удалится, программа завершится нормально."
        - "Будет выброшено InvalidOperationException: коллекция изменена во время обхода."
        - "Ошибка компиляции."
        - "Удалятся все элементы."
      answer: 1
      explanation: "Менять список во время foreach нельзя: обход обнаруживает изменение и бросает InvalidOperationException."
exercise:
  id: "csharp.from-zero.lists.exercise"
  title: "Положительные числа"
  prompt: |
    Основная часть программы читает числа до конца ввода в список `numbers`, вызывает ваши методы и печатает результат. Допишите методы:

    * `Positive(List<int> numbers)` - возвращает **новый** список из тех чисел `numbers`, которые строго больше 0, в том же порядке;
    * `Total(List<int> numbers)` - возвращает сумму чисел списка (для пустого списка - 0).

    Основная часть сортирует полученный список и печатает три строки.

    **Пример.** Для ввода

    ```
    5
    -2
    8
    0
    3
    ```

    программа печатает

    ```
    Положительных: 3
    Сумма: 16
    Список: [3 5 8]
    ```

    Основную часть не меняйте.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "В заготовке методы возвращают пустой список и 0. Заменяйте только то, что идёт после return."
    - "Positive: создайте List<int> result = new List<int>(); пройдите по numbers циклом foreach и добавляйте в result числа больше 0 методом Add."
    - "Ноль не положительное число, условие строгое: n > 0. Исходный список numbers менять не нужно."
    - "Total: int sum = 0; foreach (int n in numbers) { sum += n; } return sum;"
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "5\n-2\n8\n0\n3\n"
      expected: |
        Положительных: 3
        Сумма: 16
        Список: [3 5 8]
      hint: "Положительные числа 5, 8 и 3; ноль и -2 отбрасываются. После сортировки 3 5 8."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: |
        Положительных: 0
        Сумма: 0
        Список: []
      hidden: true
      hint: "Для пустого ввода список пуст, сумма равна 0."
    - id: "negative"
      title: "Только неположительные (скрытый)"
      stdin: "-5\n0\n-1\n"
      expected: |
        Положительных: 0
        Сумма: 0
        Список: []
      hidden: true
      hint: "Ни 0, ни отрицательные числа не попадают в результат."
    - id: "duplicates"
      title: "Повторы (скрытый)"
      stdin: "4\n4\n4\n"
      expected: |
        Положительных: 3
        Сумма: 12
        Список: [4 4 4]
      hidden: true
      hint: "Повторяющиеся значения сохраняются: метод не должен убирать дубликаты."
    - id: "order"
      title: "Обратный порядок (скрытый)"
      stdin: "9\n7\n5\n3\n1\n"
      expected: |
        Положительных: 5
        Сумма: 25
        Список: [1 3 5 7 9]
      hidden: true
      hint: "Метод сохраняет порядок исходных данных, а упорядочивает уже основная часть программы."
