id: "csharp.from-zero.mini-project"
title: "Мини-проект: бюджет"
goal: "Собрать из изученного готовую программу: прочитать строки бюджета, посчитать итоги по категориям и учесть неверные строки."
difficulty: "easy"
estimatedMinutes: 60
prerequisites:
  - "csharp.from-zero.classes-basics"
objectives:
  - "Разбить задачу на этапы: прочитать, разобрать строку, накопить итоги, вывести отчёт."
  - "Накапливать суммы по категориям в словаре и общий итог в отдельной переменной."
  - "Отличать неверные строки от пустых и считать их, не прерывая программу."
  - "Вывести категории в порядке сортировки и найти категорию с наибольшей суммой."
masteryCriteria:
  - "Отчёт точно совпадает с форматом из условия, включая два знака после запятой."
  - "Пустой ввод и ввод только из неверных строк обработаны без ошибок."
  - "Порядок категорий и выбор самой большой при равенстве соответствуют условию."
concepts:
  introduces: []
  uses:
    - "csharp.read-line"
    - "csharp.end-of-input"
    - "csharp.while"
    - "csharp.foreach"
