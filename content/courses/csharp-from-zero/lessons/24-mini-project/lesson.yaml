quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Сколько элементов в массиве parts и считается ли строка верной (по правилу «ровно две части»)?

        ```csharp
        string[] parts = "Еда 12 5".Split(' ');
        ```
      options:
        - "3 части, строка неверная"
        - "2 части, строка верная"
        - "1 часть, пробелы не разделяют"
        - "Ошибка компиляции"
      answer: 0
      explanation: "Split(' ') делит строку по каждому пробелу: получилось три части. Проверка parts.Length != 2 отправляет такую строку в неверные."
    - id: "q2"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```csharp
        Dictionary<string, decimal> totals = new Dictionary<string, decimal>();
        totals["Еда"] = totals["Еда"] + 100;
        ```
      options:
        - "В словаре появится «Еда» со значением 100."
        - "Программа остановится: KeyNotFoundException."
        - "Ошибка компиляции."
        - "Значение будет равно 0."
      answer: 1
      explanation: "Чтение totals[\"Еда\"] требует, чтобы ключ уже существовал. Для новой категории сначала проверяют ContainsKey и создают запись."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        List<string> names = new List<string> { "Рынок", "Кафе", "Дом" };
        names.Sort();
        Console.WriteLine(names[0]);
        ```
      options:
        - "Рынок"
        - "Кафе"
        - "Дом"
        - "Порядок не определён"
      answer: 2
      explanation: "Sort упорядочивает названия по алфавиту: Дом, Кафе, Рынок. Первым оказывается «Дом»."
    - id: "q4"
      type: "single"
      prompt: "Почему пустую строку нужно пропускать до проверки «две части»?"
      options:
        - "Иначе она будет посчитана неверной, хотя по условию её нужно игнорировать."
        - "Иначе программа остановится с ошибкой."
        - "Пустая строка всегда содержит два пробела."
        - "Пустых строк в вводе не бывает."
      answer: 0
      explanation: "Пустая строка не содержит двух частей, и проверка отнесла бы её к неверным. По условию она не верная и не неверная, поэтому её отсеивают сразу после Trim."
    - id: "q5"
      type: "single"
      prompt: |
        Нужно найти категорию с наибольшей суммой. Какое условие оставит при равенстве первую по алфавиту?

        ```csharp
        if (best == "" || sum > bestSum)
        {
            best = name;
            bestSum = sum;
        }
        ```
      options:
        - "Строгое сравнение >: равная сумма не заменяет уже найденную категорию"
        - "Условие >= заменяет её на последнюю"
        - "Любое условие: порядок не важен"
        - "Условие нельзя написать без Sort"
      answer: 0
      explanation: "Со строгим > категория, найденная раньше, остаётся при равенстве сумм. С >= побеждала бы последняя из равных."
exercise:
  id: "csharp.from-zero.mini-project.exercise"
  title: "Бюджет по категориям"
  prompt: |
    Напишите программу, которая читает со стандартного ввода записи расходов и печатает отчёт.

    **Формат ввода.** Каждая запись - строка вида `категория сумма`: название категории (одно слово без пробелов) и сумма, разделённые **ровно одним пробелом**. Сумма - число (`decimal`), возможно дробное (с точкой) или отрицательное (возврат).

    **Правила.**

    * Пробелы по краям строки убираются (`Trim`). Пустая строка после этого игнорируется совсем.
    * Строка **неверная**, если после `Split(' ')` частей не две или вторая часть не разбирается как `decimal` (`decimal.TryParse` вернул `false`). Неверные строки не участвуют в итогах, но считаются.

    **Вывод.**

    1. По строке на каждую категорию: `название: сумма`, сумма с двумя знаками после запятой (`:F2`). Категории идут по возрастанию названия (`Sort(StringComparer.Ordinal)` списка названий).
    2. `Итого: сумма` - сумма всех верных записей, два знака.
    3. `Больше всего: название` - категория с наибольшей суммой. При равенстве - та, что раньше в отсортированном списке. Если верных записей нет - слово `нет`.
    4. `Неверных строк: число`.

    **Пример.** Ввод:

    ```
    Еда 250.50
    Транспорт 80
    Еда 99.50
    кино abc
    Дом 1200
    Транспорт 40.25
    ```

    Вывод:

    ```
    Дом: 1200.00
    Еда: 350.00
    Транспорт: 120.25
    Итого: 1670.25
    Больше всего: Дом
    Неверных строк: 1
    ```

    Строка `кино abc` неверная: сумма не число. Если верных записей нет, категорий в отчёте нет, и выводятся только три последние строки: `Итого: 0.00`, `Больше всего: нет`, `Неверных строк: N`.

    Первые строки заготовки (подключение `CultureInfo` и чтение ввода) уже записаны.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "Разбейте работу на этапы и пишите по одному: 1) цикл по строкам с Trim и пропуском пустых; 2) разбор: Split(' '), проверка двух частей и decimal.TryParse; 3) накопление в словаре totals и в переменной overall; 4) вывод. После каждого этапа печатайте промежуточный результат и сравнивайте с примером."
    - "Переменные для итогов (словарь totals, общая сумма overall, счётчик malformed) объявите перед циклом, а внутри цикла только меняйте их. Неверную строку учтите и перейдите к следующей командой continue."
    - "Суммы по категориям: if (totals.ContainsKey(category)) { totals[category] = totals[category] + amount; } else { totals[category] = amount; } Имена для вывода: List<string> names = new List<string>(totals.Keys); names.Sort(StringComparer.Ordinal);"
    - "Самая большая категория: string best = \"\"; decimal bestTotal = 0; В цикле по отсортированным именам: if (best == \"\" || totals[name] > bestTotal) { best = name; bestTotal = totals[name]; } Если после цикла best пуста, выведите нет. Сумму печатайте как {totals[name]:F2}."
  tests:
    - id: "example"
      title: "Пример из условия"
      stdin: "Еда 250.50\nТранспорт 80\nЕда 99.50\nкино abc\nДом 1200\nТранспорт 40.25\n"
      expected: |
        Дом: 1200.00
        Еда: 350.00
        Транспорт: 120.25
        Итого: 1670.25
        Больше всего: Дом
        Неверных строк: 1
      hint: "Категории идут по алфавиту: Дом, Еда, Транспорт. Строка «кино abc» неверная (сумма не число): она только увеличивает счётчик."
    - id: "clean"
      title: "Одна категория без неверных строк"
      stdin: "Еда 100\nЕда 50.5\n"
      expected: |
        Еда: 150.50
        Итого: 150.50
        Больше всего: Еда
        Неверных строк: 0
      hint: "Две записи одной категории складываются: 100 + 50.5 = 150.5, печатается с двумя знаками - «150.50»."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: |
        Итого: 0.00
        Больше всего: нет
        Неверных строк: 0
      hidden: true
      hint: "Если записей нет, список категорий пуст. Выведите три итоговые строки: Итого 0.00, Больше всего «нет», Неверных строк 0."
    - id: "all-bad"
      title: "Только неверные строки (скрытый)"
      stdin: "а\nб в г\nx y\n"
      expected: |
        Итого: 0.00
        Больше всего: нет
        Неверных строк: 3
      hidden: true
      hint: "«а» - одна часть, «б в г» - три части, «x y» - сумма не число. Все три неверные."
    - id: "spaces"
      title: "Пробелы по краям, пустые строки (скрытый)"
      stdin: "  Еда 12  \n\nЕда  7\nХлеб 3.5\n   \n"
      expected: |
        Еда: 12.00
        Хлеб: 3.50
        Итого: 15.50
        Больше всего: Еда
        Неверных строк: 1
      hidden: true
      hint: "Пробелы по краям убирает Trim. Два пробела внутри «Еда  7» дают три части - строка неверная. Строки из одних пробелов после Trim пусты и игнорируются."
    - id: "tie-and-refunds"
      title: "Возвраты и равные суммы (скрытый)"
      stdin: "Рынок 50\nКафе 50\nРынок -20\nКафе -20\n"
      expected: |
        Кафе: 30.00
        Рынок: 30.00
        Итого: 60.00
        Больше всего: Кафе
        Неверных строк: 0
      hidden: true
      hint: "Отрицательное число - верная сумма (возврат): 50 - 20 = 30 у обеих категорий. При равенстве выбирается первая по алфавиту, значит сравнение строгое: >."
    - id: "negative-only"
      title: "Все суммы отрицательные (скрытый)"
      stdin: "Дом -5\nЕда -10\n"
      expected: |
        Дом: -5.00
        Еда: -10.00
        Итого: -15.00
        Больше всего: Дом
        Неверных строк: 0
      hidden: true
      hint: "Самая большая сумма здесь -5. Нельзя начинать поиск максимума с 0: тогда ни одна категория не победит. Первую категорию берите без сравнения (best == \"\")."
