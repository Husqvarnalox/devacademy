id: "csharp.from-zero.while-loop"
title: "Цикл while"
goal: "Повторять действие циклом while, считать и накапливать значения и читать ввод до его конца."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "csharp.from-zero.switch"
objectives:
  - "Записывать цикл while и объяснять порядок проверки условия и выполнения тела."
  - "Использовать счётчик и накопитель, объявленные до цикла."
  - "Читать строки ввода до его конца: string?, сравнение с null, чтение в конце тела."
  - "Находить бесконечный цикл и причину, по которой условие не становится ложным."
masteryCriteria:
  - "Вы предсказываете количество проходов цикла для начальных значений и условия."
  - "Вы читаете все строки ввода циклом и суммируете числа из них."
  - "Вы объясняете, почему запись Console.ReadLine() ?? \"\" не годится для условия окончания ввода."
concepts:
  introduces:
    - "csharp.while"
    - "csharp.end-of-input"
  uses:
    - "csharp.if"
    - "csharp.comparison"
    - "csharp.compound-assignment"
    - "csharp.int"
    - "csharp.parse"
    - "csharp.read-line"
    - "csharp.null"
    - "csharp.null-coalescing"
    - "csharp.interpolation"
next:
  - "csharp.from-zero.for-loop"
tags:
  - "csharp"
  - "while"
  - "loops"
  - "input"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        int i = 1;
        while (i < 4)
        {
            Console.Write(i + " ");
            i++;
        }
        ```
      options:
        - "1 2 3"
        - "1 2 3 4"
        - "2 3 4"
        - "Ничего не напечатает"
      answer: 0
      explanation: "Условие i < 4 истинно для 1, 2 и 3. Когда i становится 4, условие ложно, и тело для 4 не выполняется."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```csharp
        int n = 10;
        while (n < 5)
        {
            n++;
        }
        Console.WriteLine(n);
        ```
      options:
        - "5"
        - "10"
        - "11"
        - "Программа зависнет"
      answer: 1
      explanation: "Условие n < 5 ложно с самого начала, поэтому тело не выполняется ни разу и n остаётся равным 10."
    - id: "q3"
      type: "single"
      prompt: |
        Почему программа не завершится?

        ```csharp
        int i = 0;
        while (i < 3)
        {
            Console.WriteLine(i);
        }
        ```
      options:
        - "Нельзя печатать внутри цикла."
        - "В теле не меняется i, и условие остаётся истинным."
        - "Условие i < 3 записано с ошибкой."
        - "Нужно объявить i внутри цикла."
      answer: 1
      explanation: "Цикл заканчивается, когда условие становится ложным. Без i++ значение i не меняется, поэтому цикл бесконечный."
    - id: "q4"
      type: "single"
      prompt: |
        Во вводе три строки. Сколько раз выполнится тело цикла?

        ```csharp
        string? line = Console.ReadLine();
        while (line != null)
        {
            line = Console.ReadLine();
        }
        ```
      options:
        - "Два раза."
        - "Три раза."
        - "Четыре раза."
        - "Бесконечно."
      answer: 1
      explanation: "Три прочитанные строки - три прохода. Четвёртый вызов ReadLine возвращает null, условие становится ложным, и цикл заканчивается."
    - id: "q5"
      type: "single"
      prompt: |
        Что не так с чтением до конца ввода?

        ```csharp
        string line = Console.ReadLine() ?? "";
        while (line != null)
        {
            line = Console.ReadLine() ?? "";
        }
        ```
      options:
        - "Ничего, цикл завершится в конце ввода."
        - "Оператор ?? превращает null в пустую строку, поэтому условие line != null всегда истинно и цикл бесконечный."
        - "Переменная должна называться input."
        - "Нельзя вызывать ReadLine внутри цикла."
      answer: 1
      explanation: "Признак конца ввода - null. Запись ?? \"\" заменяет его пустой строкой, которая не равна null, и конец ввода больше не обнаруживается."
exercise:
  id: "csharp.from-zero.while-loop.exercise"
  title: "Кассовый чек"
  prompt: |
    Во вводе записан чек: в каждой строке цена одной покупки (целое число). Количество строк заранее неизвестно, ввод может быть и пустым.

    Прочитайте все строки до конца ввода и напечатайте три строки:

    ```
    Позиций: <сколько строк>
    Итого: <сумма цен>
    Дорогих (больше 500): <сколько цен больше 500>
    ```

    **Пример.** Для ввода

    ```
    120
    800
    300
    ```

    программа печатает

    ```
    Позиций: 3
    Итого: 1220
    Дорогих (больше 500): 1
    ```

    Заготовка содержит только план. Пустой ввод должен дать нули.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "Заведите три переменные до цикла: count, total, expensive. Прочитайте первую строку в string? line."
    - "Цикл while (line != null): внутри превратите line в число через int.Parse, обновите переменные, затем в конце тела прочитайте следующую строку."
    - "Дорогая покупка - цена больше 500: проверяйте это условием if внутри цикла, а count и total увеличивайте всегда."
    - "while (line != null) { int price = int.Parse(line); count++; total += price; if (price > 500) { expensive++; } line = Console.ReadLine(); }"
  tests:
    - id: "basic"
      title: "Одна дорогая покупка"
      stdin: "120\n800\n300\n"
      expected: |
        Позиций: 3
        Итого: 1220
        Дорогих (больше 500): 1
      hint: "Три строки дают 3 позиции, сумма 1220, дороже 500 только 800."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: |
        Позиций: 0
        Итого: 0
        Дорогих (больше 500): 0
      hidden: true
      hint: "Если во вводе нет строк, цикл не выполняется, и все три значения равны 0."
    - id: "border"
      title: "Граница 500 (скрытый)"
      stdin: "500\n501\n499\n600\n"
      expected: |
        Позиций: 4
        Итого: 2100
        Дорогих (больше 500): 2
      hidden: true
      hint: "Цена ровно 500 не считается дорогой: условие строгое, price > 500."
    - id: "single"
      title: "Одна строка без перевода строки (скрытый)"
      stdin: "700"
      expected: |
        Позиций: 1
        Итого: 700
        Дорогих (больше 500): 1
      hidden: true
      hint: "Последняя строка ввода может быть без символа перевода строки: она всё равно считается."
    - id: "many"
      title: "Много строк (скрытый)"
      stdin: "10\n20\n30\n40\n50\n60\n70\n80\n"
      expected: |
        Позиций: 8
        Итого: 360
        Дорогих (больше 500): 0
      hidden: true
      hint: "Цикл должен прочитать все строки до конца ввода, а не фиксированное число."
