id: os.fundamentals.paging-and-address-translation
title: "Память: адресные пространства, страницы, таблицы страниц, TLB"
goal: "Переводить виртуальный адрес в физический по таблице страниц, объяснять роль TLB и многоуровневых таблиц и считать размеры таблиц."
difficulty: medium
estimatedMinutes: 90
prerequisites: [os.fundamentals.processes-and-system-calls]
related: [cpp.fundamentals.compilation-lifetime-storage, cpp.fundamentals.undefined-behaviour]
next: [os.fundamentals.virtual-memory-page-replacement]
seeAlso:
  - "Сегментация и обратные таблицы страниц (упоминаются кратко)"
  - "Большие страницы (huge pages), NUMA и защита от атак по сторонним каналам"
objectives:
  - Объяснить, зачем нужно виртуальное адресное пространство и что оно даёт для изоляции и удобства.
  - Разделять виртуальный адрес на номер страницы (VPN) и смещение и вычислять физический адрес по номеру кадра.
  - Описать запись таблицы страниц (бит присутствия, права, номер кадра) и ошибку страницы.
  - Объяснить, как TLB ускоряет трансляцию и что происходит при промахе.
  - Посчитать размер линейной таблицы страниц и сравнить с двухуровневой.
masteryCriteria:
  - Вы по размеру страницы и адресу в шестнадцатеричной записи определяете VPN и смещение без калькулятора для степеней двойки.
  - Вы считаете, сколько бит в VPN и в смещении при заданной ширине адреса и размере страницы.
  - Вы объясняете, почему линейная таблица страниц для 32-битного адресного пространства дорога и как её сокращают.
  - Ваш симулятор различает попадание и промах TLB, не кладёт в TLB ошибки страниц и вытесняет по LRU.
tags: [os, memory, paging, page-table, tlb, address-translation]
facts:
  - kind: internals
    text: >-
      При страничной организации виртуальный адрес делится на номер виртуальной страницы (VPN) и смещение. Аппаратура (MMU) заменяет VPN на номер физического кадра (PFN) по таблице страниц,
      а смещение копируется без изменений. В учебном примере OSTEP при страницах по 16 байт виртуальный адрес 21 (страница 1, смещение 5) при отображении страницы 1 на кадр 7 превращается в физический 117.
    sources:
      - https://pages.cs.wisc.edu/~remzi/OSTEP/vm-paging.pdf
  - kind: internals
    text: >-
      TLB - небольшой аппаратный кэш недавних трансляций «VPN -> PFN». При попадании обращение к таблице страниц в памяти не нужно; при промахе процессор (или ОС) проходит таблицу
      и заносит запись в TLB. Эффективность определяется локальностью обращений.
    sources:
      - https://pages.cs.wisc.edu/~remzi/OSTEP/vm-tlbs.pdf
  - kind: internals
    text: >-
      Линейная таблица страниц на 32-битном адресе с страницами по 4 КиБ содержит 2^20 записей, то есть при 4 байтах на запись занимает 4 МиБ на каждый процесс. Многоуровневая таблица
      создаёт только те узлы, которые покрывают используемые области адресного пространства, поэтому для разреженных пространств экономит память, но на промахе TLB требует нескольких обращений.
    sources:
      - https://pages.cs.wisc.edu/~remzi/OSTEP/vm-smalltables.pdf
  - kind: real-world
    text: >-
      Размер страницы зависит от системы и процессора; программа может узнать его во время работы (в POSIX - sysconf(_SC_PAGESIZE), в Python - mmap.PAGESIZE). Поэтому код не должен
      предполагать константу 4096.
    sources:
      - https://pubs.opengroup.org/onlinepubs/9699919799/functions/sysconf.html
      - https://docs.python.org/3/library/mmap.html
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: numeric
      prompt: "Адреса 32-битные, размер страницы 4 КиБ (4096 байт). Сколько бит занимает номер виртуальной страницы (VPN)?"
      answer: 20
      tolerance: 0
      explanation: >-
        4096 = 2^12, поэтому смещение занимает 12 бит, а на VPN остаётся 32 - 12 = 20 бит.
    - id: q2
      type: numeric
      prompt: "Размер страницы 1024 байта. Виртуальный адрес 3000 принадлежит странице 2, которая отображена на кадр 5. Чему равен физический адрес (десятичный)?"
      answer: 6072
      tolerance: 0
      explanation: >-
        3000 = 2*1024 + 952, смещение 952. Физический адрес = 5*1024 + 952 = 5120 + 952 = 6072.
    - id: q3
      type: single
      prompt: "Зачем нужен TLB?"
      options:
        - "Чтобы хранить код программы"
        - "Чтобы кэшировать недавние трансляции адресов и не обращаться к таблице страниц в памяти при каждом доступе"
        - "Чтобы шифровать память процесса"
        - "Чтобы увеличить размер физической памяти"
      answer: 1
      explanation: >-
        Без TLB каждое обращение к памяти требовало бы дополнительного обращения к таблице страниц. TLB превращает большинство трансляций в быстрое аппаратное сравнение.
    - id: q4
      type: multiple
      prompt: "Какие утверждения о многоуровневых таблицах страниц верны? Выберите все."
      options:
        - "Для разреженного адресного пространства они занимают меньше памяти, чем линейная таблица"
        - "Узлы нижних уровней создаются только для используемых областей"
        - "При промахе TLB нужно больше обращений к памяти, чем с линейной таблицей"
        - "Они устраняют необходимость в TLB"
      answer: [0, 1, 2]
      explanation: >-
        Экономия памяти оплачивается более долгим проходом при промахе, поэтому TLB остаётся необходимым.
    - id: q5
      type: single
      prompt: "Что такое внутренняя фрагментация при страничной организации?"
      options:
        - "Свободные кадры разбросаны по физической памяти"
        - "Последняя страница процесса выделена целиком, но используется лишь частично"
        - "Таблица страниц не помещается в память"
        - "Программа использует слишком много потоков"
      answer: 1
      explanation: >-
        Память выделяется целыми страницами, поэтому в среднем теряется около половины страницы на выделенную область. Внешней фрагментации в чистом страничном режиме нет.
exercise:
  id: os.fundamentals.paging-and-address-translation.exercise
  title: "Трансляция виртуальных адресов с TLB"
  prompt: |
    Реализуйте в `main.py` трансляцию виртуальных адресов по одноуровневой таблице страниц с маленьким TLB.

    **Формат ввода** (токены разделены любыми пробельными символами):

    ```
    <размер страницы в байтах, десятичное, степень двойки> <размер TLB, десятичное>
    <N - число записей таблицы страниц>
    N строк: <vpn> <pfn>       (вместо pfn может стоять "-")
    <Q - число запросов>
    Q адресов в шестнадцатеричной записи (с префиксом 0x или без, регистр букв любой)
    ```

    Номера `vpn` и `pfn` в таблице тоже шестнадцатеричные; запись `-` вместо `pfn` означает недействительную страницу. Страница, которой нет в таблице, тоже недействительна.

    **Правила.**

    * `vpn = адрес // размер_страницы`, `смещение = адрес % размер_страницы`, физический адрес = `pfn * размер_страницы + смещение`.
    * Если `vpn` есть в TLB - **попадание** (запись становится самой свежей). Иначе **промах**: смотрим таблицу страниц. Для действительной страницы запись добавляется в TLB; если TLB полон, вытесняется **самая давно использованная** (LRU). Размер 0 означает, что TLB нет.
    * Недействительная страница - ошибка страницы. Она считается промахом, но в TLB ничего не добавляется и не вытесняется.

    **Вывод.** По строке на запрос: `<адрес> -> <физический адрес> [TLB hit]` или `[TLB miss]`; при ошибке страницы - `<адрес> -> PAGE FAULT [TLB miss]`. Адреса печатаются через `hex()` (строчные буквы, префикс `0x`, без ведущих нулей). В конце: `TLB hits: H, misses: M`.

    **Пример.** Страницы по 16 байт, таблица `0->3, 1->7, 2->5, 3->2`, адрес `0x15` (21): страница 1, смещение 5, кадр 7, физический адрес `7*16 + 5 = 117 = 0x75`.
  entryFile: main.py
  evaluation: io
  starter: exercise/starter
  solution: exercise/solution
  hints:
    - "Для каждого адреса: addr = int(text, 16); vpn, offset = divmod(addr, page_size). Физический адрес собирается как pfn * page_size + offset. Таблицу храните словарём vpn -> pfn или None."
    - "TLB удобно хранить в collections.OrderedDict: порядок ключей - от самого старого использования к самому новому. Попадание: tlb.move_to_end(vpn). Вытеснение самой старой записи: tlb.popitem(last=False)."
    - "Порядок действий: если vpn in tlb - hit; иначе miss, смотрим table.get(vpn); если None - ошибка страницы, продолжаем цикл, не трогая TLB; иначе при tlb_size > 0 вытесняем при переполнении и вставляем запись."
    - "Парсинг: int('0X15', 16) работает, как и int('0xab', 16), так что отдельно префикс убирать не нужно. Токен '-' означает None. Вывод адреса запроса - hex(addr), а не исходная строка."
  tests:
    - id: sample
      title: "Пример из условия"
      stdin: "16 0\n4\n0 3\n1 7\n2 5\n3 2\n1\n0x15\n"
      expected: "0x15 -> 0x75 [TLB miss]\nTLB hits: 0, misses: 1\n"
      compare: trim
      hint: "0x15 = 21 = 1*16 + 5; кадр 7 даёт 112 + 5 = 117 = 0x75."
    - id: ostep-64-byte
      title: "OSTEP: адресное пространство 64 байта, страницы по 16"
      stdin: "16 0\n4\n0 3\n1 7\n2 5\n3 2\n4\n0x15\n0x00\n0x2f\n0x3a\n"
      expected: "0x15 -> 0x75 [TLB miss]\n0x0 -> 0x30 [TLB miss]\n0x2f -> 0x5f [TLB miss]\n0x3a -> 0x2a [TLB miss]\nTLB hits: 0, misses: 4\n"
      compare: trim
      hint: "Адрес 0x15 = 21: страница 1, смещение 5; кадр 7 даёт 7*16 + 5 = 117 = 0x75. Результат пишется без ведущих нулей."
    - id: page-faults
      title: "Недействительные и отсутствующие страницы"
      stdin: "16 0\n2\n0 3\n1 -\n3\n0x1a\n0x91\n0x0f\n"
      expected: "0x1a -> PAGE FAULT [TLB miss]\n0x91 -> PAGE FAULT [TLB miss]\n0xf -> 0x3f [TLB miss]\nTLB hits: 0, misses: 3\n"
      compare: trim
      hint: "Страница 1 помечена '-', страницы 9 в таблице нет вовсе: в обоих случаях PAGE FAULT. Каждое обращение к странице без TLB - промах."
    - id: four-kib
      title: "Страницы по 4096 байт и большие номера кадров"
      stdin: "4096 0\n3\n0 5\n1 2a\n2 -\n3\n0x1fff\n0x2000\n0xabc\n"
      expected: "0x1fff -> 0x2afff [TLB miss]\n0x2000 -> PAGE FAULT [TLB miss]\n0xabc -> 0x5abc [TLB miss]\nTLB hits: 0, misses: 3\n"
      compare: trim
      hint: "Для 4096 смещение - младшие 12 бит. 0x1fff: страница 1, смещение 0xfff, кадр 0x2a -> 0x2afff."
    - id: tlb-lru
      title: "TLB на два элемента с вытеснением LRU (скрытый)"
      stdin: "16 2\n3\n0 1\n1 2\n2 3\n6\n0x00\n0x10\n0x01\n0x20\n0x11\n0x02\n"
      expected: "0x0 -> 0x10 [TLB miss]\n0x10 -> 0x20 [TLB miss]\n0x1 -> 0x11 [TLB hit]\n0x20 -> 0x30 [TLB miss]\n0x11 -> 0x21 [TLB miss]\n0x2 -> 0x12 [TLB miss]\nTLB hits: 1, misses: 5\n"
      compare: trim
      hidden: true
      hint: "Страницы 0 1 0 2 1 0: попадание только на третьем обращении. Страница 2 вытесняет страницу 1 (давнее использование), потому что 0 только что использована; поэтому 1 затем снова промах."
    - id: fault-not-cached
      title: "Ошибка страницы не попадает в TLB (скрытый)"
      stdin: "16 1\n2\n0 4\n1 -\n3\n0x03\n0x13\n0x04\n"
      expected: "0x3 -> 0x43 [TLB miss]\n0x13 -> PAGE FAULT [TLB miss]\n0x4 -> 0x44 [TLB hit]\nTLB hits: 1, misses: 2\n"
      compare: trim
      hidden: true
      hint: "PAGE FAULT не вытесняет ничего из TLB: третье обращение (страница 0) - попадание."
    - id: hex-case
      title: "Регистр букв и префикс 0X во вводе (скрытый)"
      stdin: "256 4\n2\nA B\n0xc 0x1\n3\n0XA10\n0xA99\n0xC00\n"
      expected: "0xa10 -> 0xb10 [TLB miss]\n0xa99 -> 0xb99 [TLB hit]\n0xc00 -> 0x100 [TLB miss]\nTLB hits: 1, misses: 2\n"
      compare: trim
      hidden: true
      hint: "int(text, 16) принимает и 0X, и заглавные буквы; выводите строчными. 0XA10: страница 0xa, смещение 0x10, кадр 0xb -> 0xb10."
    - id: no-tlb
      title: "TLB размера 0: повторные обращения тоже промахи (скрытый)"
      stdin: "8 0\n1\n0 1\n3\n0x0\n0x1\n0x2\n"
      expected: "0x0 -> 0x8 [TLB miss]\n0x1 -> 0x9 [TLB miss]\n0x2 -> 0xa [TLB miss]\nTLB hits: 0, misses: 3\n"
      compare: trim
      hidden: true
      hint: "При размере 0 ничего не кэшируется, hits = 0."
