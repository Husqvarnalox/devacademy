id: os.fundamentals.threads-and-synchronization
title: "Потоки и синхронизация: гонки, мьютексы, семафоры, условные переменные"
goal: "Понимать, почему общие данные без синхронизации ломаются, и выбирать между мьютексом, семафором и условной переменной; знать, что и чего GIL в Python не гарантирует."
difficulty: medium
estimatedMinutes: 90
prerequisites: [os.fundamentals.processes-and-system-calls]
related: [python.concurrency.threading-and-synchronization, python.concurrency.concurrency-models, rust.fundamentals.concurrency-fearless, go.fundamentals.goroutines-and-channels, java.fundamentals.threads-executors-virtual]
next: [os.fundamentals.deadlocks]
seeAlso:
  - "Атомарные операции, барьеры памяти и модели памяти языков (в курсе не разбираются)"
  - "Блокировки чтения-записи и lock-free структуры данных"
objectives:
  - Объяснить, чем поток отличается от процесса, и что потоки одного процесса делят.
  - Разобрать «x += 1» на LOAD, ADD, STORE и показать на расписании потерянное обновление.
  - Определить критическую секцию и требования к решению (взаимное исключение, прогресс, ограниченное ожидание).
  - "Выбрать примитив: мьютекс для взаимного исключения, семафор для счёта ресурсов, условную переменную для ожидания условия."
  - Объяснить, что GIL защищает внутренности интерпретатора, но не делает составные операции программиста атомарными.
masteryCriteria:
  - Вы по расписанию вручную вычисляете итоговое значение общей переменной при гонке.
  - Вы пишете ожидание на условной переменной через while, а не if, и объясняете почему.
  - Вы знаете, что Lock не рекурсивный и поток, повторно захвативший его, зависнет.
  - Ваш симулятор верно обрабатывает занятый мьютекс, завершённые потоки и неполное расписание.
tags: [os, threads, race-condition, mutex, semaphore, condition-variable, gil]
facts:
  - kind: internals
    text: >-
      Инкремент «counter = counter + 1» состоит из загрузки значения в регистр, прибавления и записи обратно. Если планировщик переключит поток между загрузкой и записью, одно обновление потеряется.
      Это классический пример гонки данных в учебнике OSTEP.
    sources:
      - https://pages.cs.wisc.edu/~remzi/OSTEP/threads-intro.pdf
  - kind: internals
    text: >-
      Ожидание на условной переменной POSIX нужно оборачивать в цикл: pthread_cond_wait может вернуться «ложно» (spurious wakeup), а к моменту, когда поток получил мьютекс обратно, условие
      могло снова стать ложным. Поэтому проверка условия - while, а не if.
    sources:
      - https://pubs.opengroup.org/onlinepubs/9699919799/functions/pthread_cond_wait.html
      - https://pages.cs.wisc.edu/~remzi/OSTEP/threads-cv.pdf
  - kind: internals
    text: >-
      Глобальная блокировка интерпретатора (GIL) в CPython позволяет выполнять байт-код Python одновременно только одному потоку. Она защищает внутренние структуры интерпретатора,
      но операции вроде x += 1 состоят из нескольких инструкций байт-кода, поэтому гонка возможна и с GIL. Начиная с Python 3.13 доступна отдельная сборка без GIL (free-threaded); её статус зависит от версии Python, см. документацию.
    sources:
      - https://docs.python.org/3/glossary.html#term-global-interpreter-lock
      - https://docs.python.org/3/howto/free-threading-python.html
  - kind: real-world
    text: >-
      Модуль threading даёт Lock, RLock, Condition, Semaphore, Event и Barrier. Lock не рекурсивен: повторный acquire из того же потока блокирует его навсегда, если не передан timeout;
      для повторного захвата одним потоком есть RLock. Рекомендуемая форма использования - оператор with.
    sources:
      - https://docs.python.org/3/library/threading.html
  - kind: misconception
    text: >-
      Утверждение «если потоки только читают общие данные, синхронизация не нужна» верно. Но схема «один поток пишет, остальные читают, значит обойдёмся без блокировок» неверна:
      без синхронизации читатель может увидеть устаревшее или частично записанное значение, а компилятор и процессор вправе переставлять операции. Корректность задаётся моделью памяти и примитивами синхронизации.
    sources:
      - https://pages.cs.wisc.edu/~remzi/OSTEP/threads-intro.pdf
      - https://pubs.opengroup.org/onlinepubs/9699919799/functions/pthread_mutex_lock.html
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: numeric
      prompt: "x = 0. Два потока выполняют LOAD, ADD 1, STORE без блокировок. Расписание: T0 LOAD, T1 LOAD, T0 ADD, T0 STORE, T1 ADD, T1 STORE. Чему равно x в конце?"
      answer: 1
      tolerance: 0
      explanation: >-
        Оба потока загрузили 0. T0 записал 1, T1 вычислил 0 + 1 = 1 и записал 1 поверх. Последовательное исполнение дало бы 2.
    - id: q2
      type: single
      prompt: "Что из перечисленного НЕ входит в требования к решению задачи критической секции?"
      options:
        - "Взаимное исключение"
        - "Прогресс (решение не откладывается бесконечно, если секция свободна)"
        - "Ограниченное ожидание"
        - "Строгая очерёдность потоков по номеру во всех случаях"
      answer: 3
      explanation: >-
        Нужны взаимное исключение, прогресс и ограниченное ожидание. Жёсткая очерёдность по номеру нарушает прогресс, если поток «по очереди» не хочет входить.
    - id: q3
      type: single
      prompt: "Какой примитив подходит, чтобы пустить одновременно не более трёх потоков к пулу из трёх соединений?"
      options:
        - "Мьютекс"
        - "Семафор со счётчиком 3"
        - "Условная переменная без мьютекса"
        - "Барьер"
      answer: 1
      explanation: >-
        Семафор хранит счётчик свободных ресурсов: acquire уменьшает, release увеличивает; при нуле поток ждёт. Мьютекс пустил бы одного.
    - id: q4
      type: multiple
      prompt: "Что верно про GIL в CPython? Выберите все верные утверждения."
      options:
        - "Он не позволяет одновременно исполнять байт-код Python в нескольких потоках одного процесса"
        - "Он делает атомарной любую строку кода пользователя, в том числе counter += 1"
        - "Он не мешает потокам ожидать ввод-вывод параллельно"
        - "Для задач, нагружающих CPU, потоки в стандартной сборке обычно не ускоряют код, а процессы - ускоряют"
      answer: [0, 2, 3]
      explanation: >-
        GIL защищает интерпретатор, а не логику программы: counter += 1 - несколько инструкций байт-кода, между ними поток может смениться. Во время системных вызовов ввода-вывода GIL освобождается.
    - id: q5
      type: single
      prompt: "Почему проверку условия при ожидании на условной переменной пишут в цикле while?"
      options:
        - "Чтобы нагрузить процессор"
        - "Из-за ложных пробуждений и того, что условие могло измениться до повторного захвата мьютекса"
        - "Так требует синтаксис Python"
        - "Чтобы избежать использования мьютекса"
      answer: 1
      explanation: >-
        После пробуждения поток обязан перепроверить условие под мьютексом. Иначе возможно чтение пустой очереди или обработка устаревшего состояния.
exercise:
  id: os.fundamentals.threads-and-synchronization.exercise
  title: "Детерминированное перемежение: потерянное обновление"
  prompt: |
    Настоящие потоки недетерминированы, поэтому гонку удобно изучать на симуляторе: «потоки» - списки инструкций, а порядок шагов задаёт заданное расписание.

    **Модель.** Есть общая переменная `x` (начальное значение дано), у каждого потока свой регистр `r = 0` и счётчик команд `pc`, и один общий мьютекс. Инструкции:

    * `LOAD` - `r = x`;
    * `ADD k` - `r += k` (`k` - целое, возможно отрицательное);
    * `STORE` - `x = r`;
    * `LOCK` - если мьютекс свободен, поток его захватывает; если занят (любым потоком, в том числе этим), шаг **ничего не делает** и `pc` не меняется;
    * `UNLOCK` - освобождает мьютекс.

    **Формат ввода.**

    ```
    <начальное x>
    <число потоков n>
    <программа потока 0: инструкции через ';'>
    ...
    <программа потока n-1>
    <расписание: индексы потоков через пробел>
    ```

    **Выполнение.** Каждый элемент расписания - один шаг указанного потока. Шаг завершённого потока пропускается. После конца расписания исполнение останавливается, остальные инструкции не выполняются.

    **Вывод.**

    ```
    x = <итоговое x>
    serial = <x после последовательного исполнения: поток 0 целиком, затем поток 1 и т.д.>
    T0: <pc>/<длина программы>
    ...
    lost update: yes|no|n/a
    ```

    `lost update` равно `n/a`, если не все потоки завершились; иначе `yes`, когда `x != serial`, и `no` в противном случае. Для вычисления `serial` используйте тот же интерпретатор с подходящим расписанием.

    **Пример.**

    ```
    0
    2
    LOAD; ADD 1; STORE
    LOAD; ADD 1; STORE
    0 1 0 0 1 1
    ```

    Оба потока прочитали 0, поэтому ответ `x = 1`, `serial = 2`, `T0: 3/3`, `T1: 3/3`, `lost update: yes`.
  entryFile: main.py
  evaluation: io
  starter: exercise/starter
  solution: exercise/solution
  hints:
    - "Состояние симулятора: x, список регистров, список pc и owner (индекс потока, держащего мьютекс, или None). Каждый шаг расписания выполняет одну инструкцию одного потока."
    - "Сначала пропустите шаг, если pc потока уже равен длине его программы. Потом разберите инструкцию; для LOCK при owner is not None выполните continue, не увеличивая pc, иначе owner = tid. После обычной инструкции делайте pcs[tid] += 1."
    - "serial: расписание, в котором индекс i повторён len(threads[i]) раз подряд для i = 0..n-1, то есть [i for i in range(n) for _ in threads[i]]. Прогоните через ту же функцию run."
    - "Вердикт: если для какого-нибудь потока pc меньше длины - n/a; иначе сравните x с serial. Формат строк: f'T{i}: {pc}/{len}'. Разбор инструкции: part.split(), второй элемент - int."
  tests:
    - id: sample
      title: "Пример из условия"
      stdin: "0\n2\nLOAD; ADD 1; STORE\nLOAD; ADD 1; STORE\n0 1 0 0 1 1\n"
      expected: "x = 1\nserial = 2\nT0: 3/3\nT1: 3/3\nlost update: yes\n"
      compare: trim
      hint: "Расписание 0 1 0 0 1 1: оба LOAD выполнены до первого STORE."
    - id: serial-order
      title: "Последовательное исполнение"
      stdin: "0\n2\nLOAD; ADD 1; STORE\nLOAD; ADD 1; STORE\n0 0 0 1 1 1\n"
      expected: "x = 2\nserial = 2\nT0: 3/3\nT1: 3/3\nlost update: no\n"
      compare: trim
      hint: "Нет перемежения: итог совпадает с serial, потерянного обновления нет."
    - id: mutex
      title: "Мьютекс исключает гонку"
      stdin: "0\n2\nLOCK; LOAD; ADD 1; STORE; UNLOCK\nLOCK; LOAD; ADD 1; STORE; UNLOCK\n0 1 0 0 0 0 1 1 1 1 1\n"
      expected: "x = 2\nserial = 2\nT0: 5/5\nT1: 5/5\nlost update: no\n"
      compare: trim
      hint: "Шаг T1 на занятом LOCK ничего не делает и pc не меняется. После UNLOCK потока 0 поток 1 захватит мьютекс."
    - id: three-threads
      title: "Три потока, общая потеря (скрытый)"
      stdin: "10\n3\nLOAD; ADD 5; STORE\nLOAD; ADD 5; STORE\nLOAD; ADD 5; STORE\n0 1 2 0 1 2 0 1 2\n"
      expected: "x = 15\nserial = 25\nT0: 3/3\nT1: 3/3\nT2: 3/3\nlost update: yes\n"
      compare: trim
      hidden: true
      hint: "Все три загрузили 10, каждый прибавил 5 и записал 15; последовательно было бы 25."
    - id: partial-overlap
      title: "Поток с двумя обновлениями и один внутри них (скрытый)"
      stdin: "0\n2\nLOAD; ADD 1; STORE; LOAD; ADD 1; STORE\nLOAD; ADD 10; STORE\n0 0 0 0 1 1 1 0 0\n"
      expected: "x = 2\nserial = 12\nT0: 6/6\nT1: 3/3\nlost update: yes\n"
      compare: trim
      hidden: true
      hint: "Регистры у потоков свои: второй LOAD потока 0 прочитал 1, а поток 1 затем записал 11; последняя запись потока 0 даёт 2."
    - id: incomplete
      title: "Расписание закончилось раньше потоков (скрытый)"
      stdin: "5\n2\nLOAD; ADD 1; STORE\nLOAD; ADD 1; STORE\n0 0 1\n"
      expected: "x = 5\nserial = 7\nT0: 2/3\nT1: 1/3\nlost update: n/a\n"
      compare: trim
      hidden: true
      hint: "Выполняются только перечисленные шаги; незавершённые потоки показываются как pc/длина, а вердикт n/a."
    - id: finished-and-negative
      title: "Шаги завершённого потока пропускаются, отрицательные константы (скрытый)"
      stdin: "0\n1\nLOAD; ADD -3; STORE\n0 0 0 0 0 0\n"
      expected: "x = -3\nserial = -3\nT0: 3/3\nlost update: no\n"
      compare: trim
      hidden: true
      hint: "После завершения потока лишние шаги ничего не делают. ADD принимает отрицательное число."
    - id: lock-never-released
      title: "Мьютекс не освобождён: второй поток зависает (скрытый)"
      stdin: "0\n2\nLOCK; LOAD; ADD 1; STORE\nLOCK; LOAD; ADD 1; STORE; UNLOCK\n0 1 1 1 0 0 0 1 1\n"
      expected: "x = 1\nserial = 1\nT0: 4/4\nT1: 0/5\nlost update: n/a\n"
      compare: trim
      hidden: true
      hint: "У T0 нет UNLOCK, поэтому T1 всё время остаётся на LOCK (0/5); serial считается тем же интерпретатором, вердикт n/a."
