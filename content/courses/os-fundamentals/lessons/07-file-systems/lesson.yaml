id: os.fundamentals.file-systems
title: "Файловые системы: inode, каталоги, жёсткие и символические ссылки"
goal: "Объяснять, как файловая система хранит файлы (inode, каталоги, блоки), и предсказывать поведение жёстких и символических ссылок при создании и удалении."
difficulty: medium
estimatedMinutes: 90
prerequisites: [os.fundamentals.processes-and-system-calls]
related: [python.fundamentals.errors-and-files, python.fundamentals.dicts-and-sets]
next: [os.fundamentals.ipc-and-io]
seeAlso:
  - "Журналирование и восстановление после сбоя (кратко в теории)"
  - "Права доступа, ACL и расширенные атрибуты"
objectives:
  - Объяснить, что имя файла хранится в каталоге, а метаданные и ссылки на блоки данных - в inode.
  - Различать жёсткую и символическую ссылки и называть, чем отличается их поведение при удалении цели.
  - Предсказывать счётчик ссылок (link count) файла и каталога после последовательности команд.
  - Объяснить, что значит «удалить файл» (unlink) и когда освобождаются inode и блоки.
  - Описать, зачем нужно журналирование и какую проблему согласованности оно решает.
masteryCriteria:
  - Вы по последовательности mkdir, touch, ln, ln -s и rm определяете номера inode и счётчики ссылок в выводе ls.
  - Вы объясняете, почему жёсткая ссылка на каталог запрещена, а символическая нет.
  - Вы знаете, что символическая ссылка может быть висячей и содержит путь, а не ссылку на inode.
  - Ваш интерпретатор раскрывает символические ссылки в середине пути и обрывает циклы после ограниченного числа раскрытий.
tags: [os, file-systems, inode, hard-link, symlink, directories]
facts:
  - kind: internals
    text: >-
      В Unix-подобных системах метаданные файла (тип, владелец, права, размер, время, число жёстких ссылок, ссылки на блоки данных) хранятся в inode, а имя файла - в записи каталога,
      которая сопоставляет имя номеру inode. Поэтому у одного файла может быть несколько имён, а переименование не копирует данные.
    sources:
      - https://man7.org/linux/man-pages/man7/inode.7.html
      - https://pages.cs.wisc.edu/~remzi/OSTEP/file-implementation.pdf
  - kind: internals
    text: >-
      Системный вызов link создаёт новое имя (жёсткую ссылку) для существующего файла и увеличивает его счётчик ссылок; unlink удаляет имя и уменьшает счётчик. Содержимое файла
      освобождается, когда счётчик достиг нуля и файл больше не открыт ни одним процессом.
    sources:
      - https://man7.org/linux/man-pages/man2/link.2.html
      - https://man7.org/linux/man-pages/man2/unlink.2.html
  - kind: internals
    text: >-
      Символическая ссылка - отдельный файл, содержимое которого - путь, подставляемый при разборе имени. Цель может не существовать (висячая ссылка), находиться на другой файловой системе,
      а ядро ограничивает число раскрытий за один разбор, чтобы цикл ссылок завершался ошибкой ELOOP.
    sources:
      - https://man7.org/linux/man-pages/man7/symlink.7.html
  - kind: internals
    text: >-
      Журналирование (journaling) перед изменением структур на диске записывает намерение в журнал. После сбоя система повторяет или отбрасывает незавершённые операции, и файловая система
      остаётся согласованной без полного обхода диска.
    sources:
      - https://pages.cs.wisc.edu/~remzi/OSTEP/file-journaling.pdf
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: "Где в классической Unix-файловой системе хранится имя файла?"
      options:
        - "В inode этого файла"
        - "В записи каталога, которая сопоставляет имя номеру inode"
        - "В первом блоке данных файла"
        - "В суперблоке"
      answer: 1
      explanation: >-
        Каталог - это файл особого вида со списком пар «имя - номер inode». В inode имени нет, поэтому у файла может быть несколько имён.
    - id: q2
      type: numeric
      prompt: "Создан файл /f, затем выполнены `ln /f /g` и `ln /g /h`, после чего выполнено `rm /f`. Каков счётчик ссылок файла?"
      answer: 2
      tolerance: 0
      explanation: >-
        Было три имени (f, g, h), счётчик 3. После rm /f остались имена g и h, счётчик 2. Файл по-прежнему доступен.
    - id: q3
      type: single
      prompt: "Что произойдёт с символической ссылкой /s -> /d/x после удаления файла /d/x?"
      options:
        - "Ссылка удалится автоматически"
        - "Ссылка останется, но станет висячей: обращение по ней даст ошибку «нет такого файла»"
        - "Ссылка станет жёсткой ссылкой на другой файл"
        - "Файл /d/x нельзя удалить, пока на него указывает ссылка"
      answer: 1
      explanation: >-
        Символическая ссылка хранит путь и не участвует в счётчике ссылок цели. Цель удаляется свободно, а ссылка остаётся и указывает в пустоту.
    - id: q4
      type: numeric
      prompt: "Корневой каталог содержит два подкаталога. Каков его счётчик ссылок в классической схеме (2 плюс число подкаталогов)?"
      answer: 4
      tolerance: 0
      explanation: >-
        Две ссылки есть у каждого каталога: его имя в родителе и запись «.» внутри. Каждый подкаталог добавляет ещё одну через запись «..». Итого 2 + 2 = 4.
    - id: q5
      type: multiple
      prompt: "Какие утверждения о жёстких ссылках верны? Выберите все."
      options:
        - "Все имена файла указывают на один и тот же inode"
        - "Жёсткая ссылка может указывать на несуществующий файл"
        - "Обычно запрещены жёсткие ссылки на каталоги, чтобы не создавать циклы в дереве"
        - "Обычно жёсткая ссылка не может пересекать границу файловой системы"
      answer: [0, 2, 3]
      explanation: >-
        Жёсткая ссылка - это ещё одно имя того же inode, поэтому цель обязана существовать и находиться в той же файловой системе. Висячими бывают только символические ссылки.
exercise:
  id: os.fundamentals.file-systems.exercise
  title: "Интерпретатор файловой системы в памяти"
  prompt: |
    Реализуйте в `main.py` интерпретатор команд над файловой системой в памяти. Команды читаются со стандартного ввода до конца файла, пустые строки пропускаются, слова разделены любым числом пробелов.

    **Модель.** Корень `/` - каталог с inode `1`. Новый inode получает **наименьший свободный номер, начиная с 2**; номер освобождается, когда счётчик ссылок файла падает до нуля. Счётчик ссылок: обычный файл или символическая ссылка - число имён; каталог - `2` плюс число подкаталогов (корень тоже начинается с `2`).

    **Команды** (пути только абсолютные):

    * `mkdir P` - создать каталог. `touch P` - создать пустой файл; если имя уже существует, ничего не делать.
    * `ln T L` - жёсткая ссылка `L` на существующий файл `T` (без раскрытия последней символической ссылки). `ln -s T L` - символическая ссылка `L`, хранящая строку `T`; цель может не существовать.
    * `rm P` - удалить имя файла или символической ссылки (не каталога). `rmdir P` - удалить пустой каталог.
    * `ls P` - если `P` каталог (после раскрытия ссылки), вывести его записи по именам по возрастанию; если файл - одну строку про него. Формат строки: `<inode> <счётчик> <имя>`, для каталога имя с `/` на конце, для символической ссылки `<имя> -> <цель>`. Для одиночного файла имя - это сам заданный путь.
    * `df` - вывести `inodes used: N` (включая корень).
    * Неизвестная команда: `error: unknown command: <имя>`.

    **Разбор путей.** Символические ссылки раскрываются во всех компонентах пути, кроме последнего; в последнем - только для `ls`. Цель ссылки - абсолютный путь. За один разбор допускается не более **8** раскрытий, иначе ошибка `too many levels of symbolic links`.

    **Ошибки** печатаются в виде `<команда>: <причина>: <путь>` и не меняют состояние. Причины: `no such file or directory`, `file exists`, `not a directory`, `is a directory`, `directory not empty`, `hard link not allowed for directory`.

    **Пример.** `mkdir /a`, `touch /a/f`, `ln /a/f /g`, `ls /`: каталог `a` получил inode 2 и счётчик 2, файл `f` - inode 3, а у имён `/a/f` и `/g` общий inode и счётчик 2.
  entryFile: main.py
  evaluation: io
  starter: exercise/starter
  solution: exercise/solution
  hints:
    - "Храните inode в словаре номер -> {type, nlink, entries или target}. Каталог хранит entries: имя -> номер inode. Корень - inode 1 с типом dir и nlink 2."
    - "Напишите функцию lookup(path, follow_last), которая идёт по компонентам и в каждом промежуточном компоненте раскрывает символическую ссылку (подставляет её цель и начинает разбор заново, увеличивая счётчик раскрытий). Для команд, меняющих каталог, нужно найти родителя и последнее имя отдельно."
    - "Новый номер: next(i for i in count(2) if i not in inodes). При rm уменьшайте nlink и удаляйте inode из словаря, когда он станет 0. mkdir увеличивает nlink родителя, rmdir уменьшает."
    - "Порядок проверок в mkdir и touch: сначала разобрать родителя (no such file or directory / not a directory), затем проверить, что имя свободно (file exists). Ошибки печатайте через исключение, которое ловит цикл команд, чтобы состояние не менялось."
  tests:
    - id: hard-links
      title: "Жёсткие ссылки: номер inode и счётчик ссылок"
      stdin: "mkdir /a\ntouch /a/f\nln /a/f /g\nls /\nls /a\n"
      expected: "2 2 a/\n3 2 g\n3 2 f\n"
      compare: trim
      hint: "Имена /a/f и /g указывают на один inode (3) со счётчиком 2. Каталог /a получил inode 2 и счётчик 2 (. и запись в корне)."
    - id: symlinks
      title: "Символические ссылки и «висячая» ссылка"
      stdin: "mkdir /d\ntouch /d/x\nln -s /d /l\nls /l\nln -s /d/x /s\nls /\nrm /d/x\nls /s\nls /\n"
      expected: "3 1 x\n2 2 d/\n4 1 l -> /d\n5 1 s -> /d/x\nls: no such file or directory: /s\n2 2 d/\n4 1 l -> /d\n5 1 s -> /d/x\n"
      compare: trim
      hint: "ls следует за символической ссылкой на каталог и показывает его содержимое. После rm цель пропала: ls /s сообщает об отсутствии файла, а сама ссылка остаётся."
    - id: errors
      title: "Сообщения об ошибках"
      stdin: "mkdir /a/b\nmkdir /a\nmkdir /a\ntouch /a/f\ntouch /a/f/g\nrm /a\nln /a /b\nrmdir /a\nls /zzz\nrm /a/nothing\n"
      expected: "mkdir: no such file or directory: /a/b\nmkdir: file exists: /a\ntouch: not a directory: /a/f/g\nrm: is a directory: /a\nln: hard link not allowed for directory: /a\nrmdir: directory not empty: /a\nls: no such file or directory: /zzz\nrm: no such file or directory: /a/nothing\n"
      compare: trim
      hint: "Формат строки: <команда>: <причина>: <путь>. Путь через обычный файл (/a/f/g) даёт 'not a directory', отсутствующий родитель - 'no such file or directory'."
    - id: dir-link-counts
      title: "Счётчик ссылок каталога растёт с числом подкаталогов (скрытый)"
      stdin: "mkdir /a\nmkdir /a/b\nmkdir /a/c\nls /\nrmdir /a/b\nls /\nrmdir /a\nrm /a/c\nrmdir /a/c\nrmdir /a\nls /\ndf\n"
      expected: "2 4 a/\n2 3 a/\nrmdir: directory not empty: /a\nrm: is a directory: /a/c\ninodes used: 1\n"
      compare: trim
      hidden: true
      hint: "У каталога счётчик равен 2 плюс число подкаталогов. rmdir /a сначала падает (каталог не пуст), rm для каталога тоже запрещён."
    - id: inode-reuse
      title: "Освободившийся номер inode выдаётся повторно (скрытый)"
      stdin: "touch /a\ntouch /b\nrm /a\ntouch /c\nls /\ndf\n"
      expected: "3 1 b\n2 1 c\ninodes used: 3\n"
      compare: trim
      hidden: true
      hint: "Выдаётся наименьший свободный номер, начиная с 2: после rm /a номер 2 свободен, и /c получит его."
    - id: last-link
      title: "Файл живёт, пока есть хотя бы одна жёсткая ссылка (скрытый)"
      stdin: "touch /f\nln /f /g\nln /g /h\nls /\nrm /f\nrm /g\nls /\ndf\nrm /h\ndf\nls /\n"
      expected: "2 3 f\n2 3 g\n2 3 h\n2 1 h\ninodes used: 2\ninodes used: 1\n"
      compare: trim
      hidden: true
      hint: "Счётчик 3 -> 2 -> 1 -> 0; на нуле inode освобождается, и df уменьшается."
    - id: symlink-loop
      title: "Цикл символических ссылок (скрытый)"
      stdin: "ln -s /b /a\nln -s /a /b\nls /a\ntouch /a/x\nls /\n"
      expected: "ls: too many levels of symbolic links: /a\ntouch: too many levels of symbolic links: /a/x\n2 1 a -> /b\n3 1 b -> /a\n"
      compare: trim
      hidden: true
      hint: "После 8 раскрытий ссылок остановитесь с 'too many levels of symbolic links'. ls / ссылки не раскрывает и работает."
    - id: symlink-in-path
      title: "Символическая ссылка в середине пути и жёсткая ссылка на саму ссылку (скрытый)"
      stdin: "mkdir /d\nln -s /d /l\ntouch /l/f\nls /d\nln /l /m\nls /\nln /nothing /z\nln /d /z\n"
      expected: "4 1 f\n2 2 d/\n3 2 l -> /d\n3 2 m -> /d\nln: no such file or directory: /nothing\nln: hard link not allowed for directory: /d\n"
      compare: trim
      hidden: true
      hint: "/l/f раскрывается в /d/f. ln /l /m связывает саму символическую ссылку (inode общий, счётчик 2); жёсткая ссылка на каталог запрещена."
    - id: blank-and-unknown
      title: "Пустые строки, лишние пробелы, неизвестная команда (скрытый)"
      stdin: "\n  mkdir   /x  \n\nchmod 777 /x\nls   /\n\n"
      expected: "error: unknown command: chmod\n2 2 x/\n"
      compare: trim
      hidden: true
      hint: "Пустые строки пропускаются; неизвестная команда выводит 'error: unknown command: <имя>'."
