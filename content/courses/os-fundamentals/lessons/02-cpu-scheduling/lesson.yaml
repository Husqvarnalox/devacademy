id: os.fundamentals.cpu-scheduling
title: "Планирование процессора: FCFS, SJF/SRTF, Round Robin, приоритеты"
goal: "Сравнивать алгоритмы планирования по метрикам ожидания, оборота и отклика и вручную и программно строить диаграмму Ганта."
difficulty: medium
estimatedMinutes: 90
prerequisites: [os.fundamentals.processes-and-system-calls]
related: [python.concurrency.concurrency-models, algorithms.foundations.complexity]
next: [os.fundamentals.threads-and-synchronization]
seeAlso:
  - "Многоуровневые очереди с обратной связью (MLFQ), справедливое планирование и планировщики реального времени (в курсе только упоминаются)"
objectives:
  - Вычислять время ожидания, оборота и отклика по диаграмме Ганта.
  - Объяснить, почему FCFS страдает от эффекта конвоя, а SJF минимизирует среднее время оборота, и почему SJF на практике невозможен без прогноза длительности.
  - Описать SRTF как вытесняющий вариант SJF и применять правило разрешения ничьих.
  - Выбрать квант Round Robin, объяснив компромисс между откликом и накладными расходами на переключения.
  - Реализовать симулятор Round Robin с очередью готовых процессов и учётом простоя процессора.
masteryCriteria:
  - Вы рассчитываете три метрики для набора процессов с разными моментами прихода без ошибки на единицу.
  - Вы знаете, что при приходе процесса в момент конца кванта он встаёт в очередь раньше вытесненного, и учитываете это в коде.
  - Вы объясняете, почему приоритетное планирование может привести к голоданию, и называете способ борьбы (старение).
  - Ваш симулятор верно обрабатывает простой, склейку соседних сегментов и несортированный ввод.
tags: [os, scheduling, round-robin, sjf, srtf, gantt]
facts:
  - kind: internals
    text: >-
      Если все задания приходят одновременно и длительности известны, SJF даёт минимальное среднее время оборота. В примере из OSTEP заданий A (100), B (10), C (10) FIFO даёт среднее время оборота 110,
      а SJF - 50: короткие задания не стоят позади длинного («эффект конвоя»).
    sources:
      - https://pages.cs.wisc.edu/~remzi/OSTEP/cpu-sched.pdf
  - kind: internals
    text: >-
      Round Robin запускает каждое задание на один квант и переходит к следующему в очереди. Квант должен быть кратен периоду прерываний таймера. Чем короче квант, тем лучше время отклика,
      но тем больше доля времени уходит на переключение контекста; RR хорош для отклика, но плох для времени оборота.
    sources:
      - https://pages.cs.wisc.edu/~remzi/OSTEP/cpu-sched.pdf
  - kind: misconception
    text: >-
      «SJF можно просто реализовать» - нельзя: ОС не знает заранее, сколько CPU потребуется процессу. Реальные системы оценивают будущее по прошлому (например, экспоненциальное сглаживание
      предыдущих пачек) или вообще не используют длину задания, как MLFQ.
    sources:
      - https://pages.cs.wisc.edu/~remzi/OSTEP/cpu-sched.pdf
      - https://pages.cs.wisc.edu/~remzi/OSTEP/cpu-sched-mlfq.pdf
  - kind: real-world
    text: >-
      В POSIX политики планирования реального времени SCHED_FIFO и SCHED_RR (фиксированные приоритеты, FIFO или RR внутри приоритета) задаются через sched_setscheduler;
      обычные процессы Linux используют политику SCHED_OTHER и планировщик общего назначения. Справочная страница описывает их подробно.
    sources:
      - https://man7.org/linux/man-pages/man7/sched.7.html
      - https://pubs.opengroup.org/onlinepubs/9699919799/functions/sched_setscheduler.html
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: "В чём состоит эффект конвоя при FCFS?"
      options:
        - "Короткие задания ждут за длинным, и среднее время ожидания растёт"
        - "Длинные задания никогда не получают процессор"
        - "Процессор простаивает, пока есть готовые задания"
        - "Задания выполняются в случайном порядке"
      answer: 0
      explanation: >-
        Если длинное задание пришло первым, все короткие ждут его завершения, потому что FCFS не вытесняет. SJF или RR уменьшают этот эффект.
    - id: q2
      type: numeric
      prompt: "Четыре задания приходят в момент 0 с длительностями 6, 8, 7 и 3. Чему равно среднее время ожидания при SJF (невытесняющем)?"
      answer: 7
      tolerance: 0.001
      explanation: >-
        Порядок 3, 6, 7, 8: ожидания 0, 3, 9, 16; сумма 28, среднее 28/4 = 7.
    - id: q3
      type: single
      prompt: "Что произойдёт при уменьшении кванта Round Robin (при фиксированной стоимости переключения)?"
      options:
        - "Время отклика улучшится, но вырастет доля накладных расходов на переключения"
        - "Среднее время оборота обязательно уменьшится"
        - "Алгоритм превратится в SJF"
        - "Ничего: квант не влияет на метрики"
      answer: 0
      explanation: >-
        Короткий квант быстрее даёт первый шанс каждому заданию (отклик), но чаще переключает контекст. Среднее время оборота у RR обычно хуже, чем у SJF.
    - id: q4
      type: multiple
      prompt: "Какие утверждения верны? Выберите все."
      options:
        - "SRTF - вытесняющий вариант SJF"
        - "Для SJF нужно знать (или оценить) длительность следующей пачки CPU"
        - "Приоритетное планирование может вызвать голодание низкоприоритетных процессов"
        - "Round Robin приводит к голоданию процессов"
      answer: [0, 1, 2]
      explanation: >-
        В RR каждый процесс получает квант не позднее чем через (n-1) квантов, поэтому голодания нет. Голодание возможно при приоритетах, лекарство - старение (постепенное повышение приоритета ожидающих).
    - id: q5
      type: numeric
      prompt: "Процесс пришёл в момент 3, впервые получил процессор в момент 7 и завершился в момент 15. Чему равно его время отклика?"
      answer: 4
      tolerance: 0
      explanation: >-
        Время отклика = первый запуск - приход = 7 - 3 = 4. Время оборота было бы 15 - 3 = 12.
exercise:
  id: os.fundamentals.cpu-scheduling.exercise
  title: "Симулятор Round Robin с диаграммой Ганта"
  prompt: |
    Реализуйте в `main.py` планировщик Round Robin с заданным квантом.

    **Формат ввода.** Первая строка: `q n` - квант и число процессов. Далее `n` строк `<имя> <приход> <длительность>` (целые числа, длительность >= 1, имена без пробелов, не `idle`).

    **Правила.**

    * Очередь готовых - FIFO. Процесс берётся из начала очереди и работает `min(q, осталось)` единиц времени.
    * Процессы, пришедшие к моменту `t` (приход <= `t`), попадают в очередь по порядку (сначала по приходу, при равенстве - по порядку во вводе). Если процесс пришёл **в течение кванта или ровно в его конце**, он встаёт в очередь **раньше**, чем вытесненный процесс возвращается в хвост.
    * Если очередь пуста, а не все процессы пришли, процессор простаивает до ближайшего прихода (сегмент `idle`).
    * Метрики: оборот = завершение - приход; ожидание = оборот - длительность; отклик = первый запуск - приход.

    **Формат вывода.**

    ```
    gantt:
    <начало>-<конец> <имя>      (по строке на сегмент; соседние сегменты одного имени склеиваются)
    table:
    <имя> <ожидание> <оборот> <отклик>      (в порядке ввода)
    average waiting: X.XX
    average turnaround: X.XX
    average response: X.XX
    ```

    Средние значения - с двумя знаками после запятой (`f"{x:.2f}"`).

    **Пример.** Квант 4, процессы `P1 0 24`, `P2 0 3`, `P3 0 3` (классический пример из учебника): P1 работает 0-4, P2 - 4-7, P3 - 7-10, затем P1 доделывает 10-30. Ожидание P1 = 6, P2 = 4, P3 = 7, среднее 5.67.
  entryFile: main.py
  evaluation: io
  starter: exercise/starter
  solution: exercise/solution
  hints:
    - "Нужны: список индексов процессов по приходу, указатель на следующего не пришедшего, очередь deque и текущее время t. Отдельная функция admit(t) переносит из списка в очередь всех, у кого приход <= t."
    - "Цикл: пока не все завершились - если очередь пуста, запишите сегмент idle до прихода следующего и вызовите admit; иначе возьмите процесс, запомните первый запуск, прокрутите t на min(q, остаток), вызовите admit(t) и только потом верните процесс в хвост (если остаток > 0)."
    - "Порядок «сначала admit, потом возврат в очередь» - главная тонкость: он определяет, кто идёт раньше при приходе в момент конца кванта. Склейку сегментов делайте при выводе: если предыдущий сегмент заканчивается там, где начинается новый, и имена равны, продлите предыдущий."
    - "Метрики: finish[name] = t в момент остатка 0; start.setdefault(name, t) при первом запуске. Для каждого процесса в порядке ввода: оборот = finish - приход; ожидание = оборот - длительность; отклик = start - приход. Средние считайте как сумма / n и форматируйте f'{x:.2f}'."
  tests:
    - id: sample
      title: "Пример из условия"
      stdin: "4 3\nP1 0 24\nP2 0 3\nP3 0 3\n"
      expected: "gantt:\n0-4 P1\n4-7 P2\n7-10 P3\n10-30 P1\ntable:\nP1 6 30 0\nP2 4 7 4\nP3 7 10 7\naverage waiting: 5.67\naverage turnaround: 15.67\naverage response: 3.67\n"
      compare: trim
      hint: "Ожидание считается как оборот минус длительность: P1 завершился в 30, ждал 30 - 24 = 6."
    - id: textbook-q4
      title: "Учебник: три процесса, квант 4"
      stdin: "4 3\nP1 0 24\nP2 0 3\nP3 0 3\n"
      expected: "gantt:\n0-4 P1\n4-7 P2\n7-10 P3\n10-30 P1\ntable:\nP1 6 30 0\nP2 4 7 4\nP3 7 10 7\naverage waiting: 5.67\naverage turnaround: 15.67\naverage response: 3.67\n"
      compare: trim
      hint: "P1 вытесняется после 4 единиц и возвращается в хвост очереди. Ожидание P1 = 6, P2 = 4, P3 = 7."
    - id: ostep-q1
      title: "OSTEP: три задачи по 5, квант 1 (время отклика 1)"
      stdin: "1 3\nA 0 5\nB 0 5\nC 0 5\n"
      expected: "gantt:\n0-1 A\n1-2 B\n2-3 C\n3-4 A\n4-5 B\n5-6 C\n6-7 A\n7-8 B\n8-9 C\n9-10 A\n10-11 B\n11-12 C\n12-13 A\n13-14 B\n14-15 C\ntable:\nA 8 13 0\nB 9 14 1\nC 10 15 2\naverage waiting: 9.00\naverage turnaround: 14.00\naverage response: 1.00\n"
      compare: trim
      hint: "Процессы чередуются A, B, C, A, ...; время отклика 0, 1 и 2, в среднем 1.00."
    - id: single-merge
      title: "Один процесс: сегменты склеиваются"
      stdin: "2 1\nX 0 5\n"
      expected: "gantt:\n0-5 X\ntable:\nX 0 5 0\naverage waiting: 0.00\naverage turnaround: 5.00\naverage response: 0.00\n"
      compare: trim
      hint: "Процесс один, поэтому он занимает CPU непрерывно: в диаграмме должна быть одна строка 0-5 X."
    - id: idle-gap
      title: "Простой процессора между процессами (скрытый)"
      stdin: "3 2\nA 0 2\nB 5 4\n"
      expected: "gantt:\n0-2 A\n2-5 idle\n5-9 B\ntable:\nA 0 2 0\nB 0 4 0\naverage waiting: 0.00\naverage turnaround: 3.00\naverage response: 0.00\n"
      compare: trim
      hidden: true
      hint: "Когда очередь пуста, а процессы ещё не пришли, выводится сегмент idle до ближайшего прихода (здесь 2-5 idle)."
    - id: arrival-vs-requeue
      title: "Приход в момент окончания кванта (скрытый)"
      stdin: "2 3\nA 0 4\nB 1 3\nC 4 1\n"
      expected: "gantt:\n0-2 A\n2-4 B\n4-6 A\n6-7 C\n7-8 B\ntable:\nA 2 6 0\nB 4 7 1\nC 2 3 2\naverage waiting: 2.67\naverage turnaround: 5.33\naverage response: 1.00\n"
      compare: trim
      hidden: true
      hint: "Новичок, пришедший ровно в момент конца кванта, встаёт в очередь раньше вытесненного процесса. Проверьте порядок на t = 2 и t = 4."
    - id: unsorted-input
      title: "Процессы перечислены не по порядку прихода (скрытый)"
      stdin: "3 4\nD 6 2\nC 2 5\nB 2 2\nA 0 3\n"
      expected: "gantt:\n0-3 A\n3-6 C\n6-8 B\n8-10 D\n10-12 C\ntable:\nD 2 4 2\nC 5 10 1\nB 4 6 4\nA 0 3 0\naverage waiting: 2.75\naverage turnaround: 5.75\naverage response: 1.75\n"
      compare: trim
      hidden: true
      hint: "Сначала сортируйте по времени прихода, при равенстве - по порядку во вводе. Таблица в выводе остаётся в порядке ввода."
    - id: quantum-large
      title: "Квант больше всех бурстов: получается FCFS (скрытый)"
      stdin: "100 3\nA 0 10\nB 1 4\nC 2 6\n"
      expected: "gantt:\n0-10 A\n10-14 B\n14-20 C\ntable:\nA 0 10 0\nB 9 13 9\nC 12 18 12\naverage waiting: 7.00\naverage turnaround: 13.67\naverage response: 7.00\n"
      compare: trim
      hidden: true
      hint: "При большом кванте RR вырождается в FCFS: A, затем B, затем C."
challenge:
  id: os.fundamentals.cpu-scheduling.challenge
  title: "SRTF с правилом разрешения ничьих"
  prompt: |
    Реализуйте в `main.py` вытесняющий SJF - **SRTF** (shortest remaining time first).

    **Формат ввода.** Первая строка - число процессов `n`. Далее `n` строк `<имя> <приход> <длительность>`. Время дискретно: решение принимается в каждый целый момент.

    **Правила.**

    * В каждый момент `t` из пришедших и незавершённых процессов выбирается тот, у которого **осталось меньше** времени. Новый процесс вытесняет текущий только если у него осталось строго меньше.
    * Ничья по остатку разрешается в пользу **более раннего прихода**, а при равенстве прихода - того, кто записан во вводе **раньше**.
    * Если готовых процессов нет, процессор простаивает (`idle`); соседние одноимённые сегменты склеиваются.
    * Метрики и формат вывода - те же, что в упражнении (`gantt:`, `table:`, три средних с двумя знаками).

    **Пример.** `P1 0 8`, `P2 1 4`, `P3 2 9`, `P4 3 5` (пример из учебника): P1 0-1, P2 1-5, P4 5-10, P1 10-17, P3 17-26; среднее ожидание 6.50.
  entryFile: main.py
  evaluation: io
  starter: challenge/starter
  solution: challenge/solution
  hints:
    - "Проще всего шагать по одной единице времени: на каждом шаге найдите список готовых (приход <= t и остаток > 0) и выберите одного."
    - "Выбор - минимум по ключу из кортежа: (остаток, приход, индекс во вводе). Тогда правило ничьей заложено в сам ключ."
    - "После выбора запишите сегмент (t, t+1, имя), уменьшите остаток, увеличьте t; если остаток стал 0, запомните время завершения. Если готовых нет - сегмент idle на одну единицу."
    - "Вывод можно взять из упражнения: склейка сегментов, таблица в порядке ввода, средние. Не пересчитывайте ожидание вручную: ожидание = завершение - приход - длительность."
  tests:
    - id: sample
      title: "Пример из условия"
      stdin: "4\nP1 0 8\nP2 1 4\nP3 2 9\nP4 3 5\n"
      expected: "gantt:\n0-1 P1\n1-5 P2\n5-10 P4\n10-17 P1\n17-26 P3\ntable:\nP1 9 17 0\nP2 0 4 0\nP3 15 24 15\nP4 2 7 2\naverage waiting: 6.50\naverage turnaround: 13.00\naverage response: 4.25\n"
      compare: trim
      hint: "P1 вытесняется в момент 1: у него осталось 7, у P2 - 4. Ожидание P1 = 17 - 0 - 8 = 9."
    - id: tie-keeps-running
      title: "Равенство остатка: текущий не вытесняется"
      stdin: "2\nA 0 5\nB 2 3\n"
      expected: "gantt:\n0-5 A\n5-8 B\ntable:\nA 0 5 0\nB 3 6 3\naverage waiting: 1.50\naverage turnaround: 5.50\naverage response: 1.50\n"
      compare: trim
      hint: "В момент 2 у A осталось 3, у B тоже 3. Ничья решается в пользу более раннего прихода, то есть A продолжает работать."
    - id: idle
      title: "Простой между процессами"
      stdin: "2\nA 0 2\nB 4 1\n"
      expected: "gantt:\n0-2 A\n2-4 idle\n4-5 B\ntable:\nA 0 2 0\nB 0 1 0\naverage waiting: 0.00\naverage turnaround: 1.50\naverage response: 0.00\n"
      compare: trim
      hint: "В интервале 2-4 нет готовых процессов: выведите сегмент idle."
    - id: tie-arrival-before-order
      title: "Ничья между ожидающими: ранний приход, а не порядок ввода (скрытый)"
      stdin: "3\nC 2 3\nA 1 3\nL 0 3\n"
      expected: "gantt:\n0-3 L\n3-6 A\n6-9 C\ntable:\nC 4 7 4\nA 2 5 2\nL 0 3 0\naverage waiting: 2.00\naverage turnaround: 5.00\naverage response: 2.00\n"
      compare: trim
      hidden: true
      hint: "Когда L завершился, у A и C остаток 3. Раньше пришёл A, хотя C записан во вводе первым."
    - id: tie-input-order
      title: "Полная ничья: порядок ввода (скрытый)"
      stdin: "3\nB 0 2\nA 0 2\nC 0 2\n"
      expected: "gantt:\n0-2 B\n2-4 A\n4-6 C\ntable:\nB 0 2 0\nA 2 4 2\nC 4 6 4\naverage waiting: 2.00\naverage turnaround: 4.00\naverage response: 2.00\n"
      compare: trim
      hidden: true
      hint: "Одинаковые приход и остаток: побеждает тот, кто раньше записан во вводе (B, потом A, потом C)."
    - id: many-preemptions
      title: "Каскад вытеснений (скрытый)"
      stdin: "5\nP1 0 9\nP2 1 6\nP3 2 4\nP4 3 2\nP5 4 1\n"
      expected: "gantt:\n0-1 P1\n1-2 P2\n2-3 P3\n3-5 P4\n5-6 P5\n6-9 P3\n9-14 P2\n14-22 P1\ntable:\nP1 13 22 0\nP2 7 13 0\nP3 3 7 0\nP4 0 2 0\nP5 1 2 1\naverage waiting: 4.80\naverage turnaround: 9.20\naverage response: 0.20\n"
      compare: trim
      hidden: true
