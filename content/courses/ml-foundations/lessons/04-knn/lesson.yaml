id: "ml.foundations.knn"
title: "Метод k ближайших соседей с нуля"
goal: "Реализовать классификатор k-NN с детерминированным разрешением ничьих и выбрать k по leave-one-out."
difficulty: "medium"
estimatedMinutes: 75
prerequisites: ["ml.foundations.what-is-ml"]
related: ["ml.foundations.classification-metrics", "python.fundamentals.dicts-and-sets"]
next: []
objectives:
  - "Объяснить принцип k-NN и почему у метода нет отдельного этапа обучения."
  - "Реализовать квадрат евклидова расстояния и отбор k ближайших соседей с порядком (расстояние, индекс)."
  - "Разрешать ничьи по расстоянию и по голосам по заданным правилам, чтобы результат был воспроизводимым."
  - "Оценить качество при разных k методом leave-one-out без утечки (точка не участвует в собственном предсказании)."
  - "Оценить время запроса O(m*d + m log m) и объяснить, зачем масштабируют признаки."
masteryCriteria:
  - "Ваш knn_predict совпадает с эталоном на всех тестах, включая ничьи по расстоянию и по голосам."
  - "leave_one_out_accuracy возвращает ожидаемые значения 0.8, 0.9 и 0.9 для k = 1, 3, 5 на тестовых данных."
  - "Вы объясняете, почему при k = 1 метод чувствителен к выбросам, а при очень большом k теряет редкие классы."
tags: ["ml", "knn", "classification", "distance", "tie-breaking", "leave-one-out"]
facts:
  - kind: "historical"
    text: "Правило ближайшего соседа в статистической форме исследовали Томас Ковер и Питер Харт в 1967 году: они показали, что при росте выборки ошибка метода одного ближайшего соседа не более чем вдвое превышает байесовскую ошибку (оптимальную для данной задачи)."
    sources: ["https://en.wikipedia.org/wiki/K-nearest_neighbors_algorithm"]
  - kind: "internals"
    text: "В scikit-learn для поиска соседей применяются разные структуры: полный перебор, k-d деревья и ball-деревья; выбор зависит от размерности и объёма данных. При большой размерности выигрыш деревьев падает (\"проклятие размерности\"), и перебор может быть быстрее."
    sources: ["https://scikit-learn.org/stable/modules/neighbors.html"]
  - kind: "misconception"
    text: "«У k-NN нет параметров, значит его нельзя переобучить». Параметров нет, но есть гиперпараметр k: при k = 1 каждая обучающая точка предсказывается сама собой, ошибка на train нулевая, а на новых данных шум и выбросы напрямую влияют на ответ."
    sources: ["https://scikit-learn.org/stable/modules/neighbors.html"]
  - kind: "real-world"
    text: "k-NN применяют как сильный простой базовый вариант и в системах рекомендаций («похожие товары»), а также для поиска ближайших векторов-эмбеддингов, где масштабирование достигается приближёнными индексами. Методы масштабирования и подготовки признаков перед k-NN описаны в руководстве по предобработке."
    sources: ["https://scikit-learn.org/stable/modules/preprocessing.html"]
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что происходит на этапе «обучения» k-NN?"
      options:
        - "Вычисляются веса модели градиентным спуском"
        - "Выборка просто сохраняется; вычисления выполняются в момент предсказания"
        - "Строится дерево решений"
        - "Подбираются коэффициенты регрессии"
      answer: 1
      explanation: "k-NN - ленивый метод: модель - это сама обучающая выборка, а работа с расстояниями выполняется при запросе."
    - id: "q2"
      type: "numeric"
      prompt: "Расстояние между точками (1, 2) и (4, 6): чему равен квадрат евклидова расстояния?"
      answer: 25
      tolerance: 0
      explanation: "(4-1)^2 + (6-2)^2 = 9 + 16 = 25 (само расстояние равно 5)."
    - id: "q3"
      type: "single"
      prompt: "Соседи (по порядку близости) имеют метки b, a, a, b, и k = 4. Какую метку вернёт наш алгоритм?"
      options: ["a", "b", "Ошибку", "Случайную из a и b"]
      answer: 1
      explanation: "Голоса 2:2. Побеждает метка, чей ближайший сосед первый в порядке: это b (стоит на позиции 0)."
    - id: "q4"
      type: "multiple"
      prompt: "Какие утверждения о выборе k верны?"
      options:
        - "k = 1 чувствителен к выбросам и ошибкам в метках"
        - "Слишком большое k сглаживает границу и может потерять редкие классы"
        - "В бинарной задаче нечётное k исключает ничью по голосам"
        - "k нужно подбирать по тестовой выборке"
      answer: [0, 1, 2]
      explanation: "Три первых утверждения верны. Подбор по тесту делает оценку на тесте завышенной - для выбора используйте validation или leave-one-out."
    - id: "q5"
      type: "single"
      prompt: "Почему в leave-one-out точка не должна участвовать в собственном предсказании?"
      options:
        - "Это ускоряет вычисления"
        - "Иначе при k = 1 она найдёт сама себя, и точность будет завышена (утечка)"
        - "Так требует формула расстояния"
        - "Это нужно только для регрессии"
      answer: 1
      explanation: "Расстояние от точки до самой себя равно нулю, поэтому она всегда окажется ближайшим соседом и выдаст свою настоящую метку."
    - id: "q6"
      type: "single"
      prompt: "Чему равна сложность одного запроса при m обучающих точках размерности d (с полной сортировкой)?"
      options: ["O(d)", "O(m*d + m log m)", "O(m^2 * d)", "O(log m)"]
      answer: 1
      explanation: "Расстояния до m точек стоят O(m*d), сортировка - O(m log m)."
complexity:
  time: "O(m*d + m log m) на запрос"
  space: "O(m)"
  explanation: "Для каждого запроса вычисляются расстояния до m точек размерности d и сортируются индексы. Хранение выборки - O(m*d), дополнительная память на запрос - O(m)."
editorial: "editorial.md"
exercise:
  id: "ml.foundations.knn.exercise"
  title: "Классификатор k-NN и выбор k"
  prompt: |
    В файле `knn_task.py` реализуйте четыре функции. Точки - кортежи чисел одинаковой длины; метки - произвольные сравнимые значения (строки или числа). Только стандартная библиотека; ничего не печатайте и не изменяйте переданные списки.

    1. `squared_distance(a, b)` - сумма квадратов разностей координат.
    2. `knn_predict(train_x, train_y, query, k)` - метка для `query`:
       * упорядочите индексы обучающих точек по паре `(squared_distance(train_x[i], query), i)` по возрастанию и возьмите первые `k` (если `k` больше размера выборки, берутся все);
       * побеждает метка с наибольшим числом голосов среди этих `k`;
       * при равенстве голосов побеждает метка, чей ближайший сосед стоит раньше в упорядоченном списке.
    3. `knn_predict_all(train_x, train_y, queries, k)` - список меток для каждой точки из `queries`.
    4. `leave_one_out_accuracy(xs, ys, k)` - для каждой точки `i` предскажите метку по **остальным** точкам (без точки `i`, порядок остальных сохраняется) и верните долю верных предсказаний.

    **Пример.**

    ```python
    train_x = [(0, 0), (0, 1), (1, 0), (5, 5), (5, 6), (6, 5)]
    train_y = ["a", "a", "a", "b", "b", "b"]
    knn_predict(train_x, train_y, (1, 1), 3)    # 'a'
    knn_predict(train_x, train_y, (6, 6), 3)    # 'b'
    ```
  entryFile: "knn_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "squared_distance - одна строка: sum((x - y) ** 2 for x, y in zip(a, b)). Затем knn_predict: отсортируйте range(len(train_x)) по ключу (расстояние, i)."
    - "Для голосов заведите словарь votes (метка -> число) и first_rank (метка -> позиция первого появления среди k ближайших). Победитель - минимум по ключу (-votes[метка], first_rank[метка])."
    - "leave_one_out_accuracy: для каждого i соберите rest_x = xs[:i] + xs[i+1:] и rest_y аналогично, вызовите knn_predict(rest_x, rest_y, xs[i], k) и сравните с ys[i]. Не сортируйте и не изменяйте исходные списки."
    - "Скелет: order = sorted(range(len(train_x)), key=lambda i: (squared_distance(train_x[i], query), i))[:k]; затем for rank, i in enumerate(order): считаем голоса и запоминаем первую позицию метки."
  tests:
    - id: "distance"
      title: "squared_distance"
      hint: "Сумма квадратов разностей по координатам; для (0,0) и (3,4) получится 25."
    - id: "basic-classes"
      title: "Две хорошо разделённые группы"
      hint: "Для точки около группы a ближайшие три соседа должны быть из a."
    - id: "k-one-vs-three"
      title: "k = 1 против k = 3 на выбросе"
      hint: "При k = 1 побеждает ближайшая точка, при k = 3 голосуют три соседа."
    - id: "predict-all"
      title: "knn_predict_all"
      hint: "Это knn_predict для каждого запроса."
    - id: "distance-tie-index"
      title: "Ничья по расстоянию: меньший индекс первый (скрытый)"
      hidden: true
      hint: "Ключ сортировки - пара (квадрат расстояния, индекс)."
    - id: "vote-tie-nearest"
      title: "Ничья по голосам: побеждает ближайший сосед (скрытый)"
      hidden: true
      hint: "При 2:2 выбирается метка, чей ближайший сосед стоит раньше в порядке близости."
    - id: "vote-tie-three-way"
      title: "Ничья трёх меток (скрытый)"
      hidden: true
      hint: "Ключ выбора: (-голоса, позиция первого появления метки)."
    - id: "k-larger-than-train"
      title: "k больше размера выборки (скрытый)"
      hidden: true
      hint: "Срез order[:k] безопасен: берутся все точки."
    - id: "leave-one-out"
      title: "leave-one-out для k = 1, 3, 5 (скрытый)"
      hidden: true
      hint: "Точка не должна участвовать в собственном предсказании; ожидаемые доли 0.8, 0.9, 0.9."
    - id: "inputs-not-mutated"
      title: "Входные списки не изменяются (скрытый)"
      hidden: true
      hint: "Не вызывайте train_x.sort(); сортируйте список индексов."
