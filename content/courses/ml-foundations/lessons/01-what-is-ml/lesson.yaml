id: "ml.foundations.what-is-ml"
title: "Что такое машинное обучение: выборки, переобучение, утечки"
goal: "Понимать постановку обучения с учителем, честно делить данные на train/validation/test и распознавать переобучение и утечку данных."
difficulty: "easy"
estimatedMinutes: 60
prerequisites: []
related: ["python.fundamentals.functions", "python.fundamentals.lists"]
next: ["ml.foundations.linear-regression"]
objectives:
  - "Различать обучение с учителем (регрессия, классификация) и без учителя и приводить примеры задач."
  - "Объяснить роль выборок train, validation и test и почему тест используют один раз."
  - "Распознавать недообучение и переобучение по ошибкам на train и validation."
  - "Назвать основные виды утечки данных и способ их избежать (статистики только по train, разбиение до предобработки)."
  - "Написать воспроизводимое разбиение индексов с собственным random.Random(seed) и проверить отсутствие пересечений."
masteryCriteria:
  - "Вы объясняете, почему нулевая ошибка на обучающей выборке не доказывает качество модели."
  - "Ваша функция разбиения воспроизводима, не трогает глобальный генератор случайных чисел и разбивает индексы без пересечений."
  - "Функция find_leaks находит индексы, попавшие больше чем в одну часть."
tags: ["ml", "supervised-learning", "train-test-split", "overfitting", "data-leakage"]
facts:
  - kind: "misconception"
    text: "«Если качество на тесте не устроило, поправим модель и проверим на тесте снова - это нормально». Каждая такая проверка «подглядывание»: решения о модели начинают зависеть от тестовых данных, и оценка на тесте становится завышенной. Для выбора модели нужна отдельная валидационная часть или кросс-валидация, а тест остаётся для финальной проверки."
    sources: ["https://scikit-learn.org/stable/modules/cross_validation.html"]
  - kind: "real-world"
    text: "Утечку данных часто создаёт неправильный порядок операций: масштабирование или отбор признаков выполняют на всём наборе, а лишь потом делят его. В документации scikit-learn этот случай разобран как типичная ошибка; рекомендуют объединять предобработку и модель в один конвейер (Pipeline), чтобы статистики вычислялись только по обучающей части на каждом шаге."
    sources: ["https://scikit-learn.org/stable/common_pitfalls.html"]
  - kind: "internals"
    text: "Модуль random в Python использует генератор Mersenne Twister. Экземпляр random.Random(seed) хранит собственное состояние, независимое от глобального random.seed, поэтому разбиение с собственным экземпляром воспроизводимо, даже если другой код вызывает random."
    sources: ["https://docs.python.org/3/library/random.html"]
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Задача: по фотографии определить, кошка на ней или собака. К какому виду относится задача?"
      options:
        - "Регрессия"
        - "Классификация (обучение с учителем)"
        - "Кластеризация (обучение без учителя)"
        - "Не относится к машинному обучению"
      answer: 1
      explanation: "У каждой картинки есть метка из конечного набора классов, поэтому это классификация. Регрессия предсказывает число, кластеризация работает без меток."
    - id: "q2"
      type: "single"
      prompt: "Ошибка на train равна 0.01, на validation - 0.40. Что это, скорее всего?"
      options: ["Недообучение", "Переобучение", "Утечка из теста в train", "Модель идеальна"]
      answer: 1
      explanation: "Модель подстроилась под обучающие данные, а на новых работает намного хуже: это классический признак переобучения. Недообучение дало бы большую ошибку на обеих частях."
    - id: "q3"
      type: "multiple"
      prompt: "Какие из действий создают утечку данных?"
      options:
        - "Среднее для стандартизации посчитано по всем данным до разбиения"
        - "Один и тот же объект попал и в train, и в test"
        - "Разбиение с фиксированным seed"
        - "Среднее посчитано по train и применено к test"
      answer: [0, 1]
      explanation: "Статистики по всем данным используют информацию из теста; пересечение выборок - прямая утечка. Фиксированный seed лишь делает разбиение воспроизводимым, а статистики по train - это правильная практика."
    - id: "q4"
      type: "numeric"
      prompt: "Выборка из 200 объектов делится в пропорции val_frac = 0.15, test_frac = 0.25 по правилу int(n * frac). Сколько объектов попадёт в train?"
      answer: 120
      tolerance: 0
      explanation: "n_test = int(200*0.25) = 50, n_val = int(200*0.15) = 30, train = 200 - 50 - 30 = 120."
    - id: "q5"
      type: "short"
      prompt: "Как называется часть данных, которой пользуются один раз в самом конце для итоговой оценки модели? (одно слово по-английски)"
      answer: ["test", "тест", "test set"]
      explanation: "Тестовая часть (test) нужна для окончательной честной оценки; выбор модели делают на validation."
complexity:
  time: "O(n)"
  space: "O(n)"
  explanation: "Перемешивание списка индексов и срезы работают за O(n); find_leaks строит словарь счётчиков по всем индексам, тоже O(n)."
exercise:
  id: "ml.foundations.what-is-ml.exercise"
  title: "Честное разбиение и поиск утечек"
  prompt: |
    В файле `split_task.py` реализуйте две функции. Тесты импортируют модуль и вызывают их напрямую; ничего не читайте с клавиатуры и ничего не печатайте.

    1. `train_val_test_split(n, val_frac, test_frac, seed)` возвращает кортеж из трёх списков индексов `(train, val, test)` для выборки из `n` объектов.
       Алгоритм фиксирован, чтобы результат был одинаковым у всех:
       * создайте собственный генератор `rng = random.Random(seed)` (глобальный `random` трогать нельзя);
       * `idx = list(range(n))`, затем `rng.shuffle(idx)`;
       * `n_test = int(n * test_frac)`, `n_val = int(n * val_frac)`;
       * `test = idx[:n_test]`, `val = idx[n_test:n_test + n_val]`, `train = idx[n_test + n_val:]`.
    2. `find_leaks(train, val, test)` возвращает **отсортированный список** индексов, которые встречаются больше чем в одной из трёх частей. Повтор индекса внутри одной части утечкой не считается.

    **Пример.**

    ```python
    train, val, test = train_val_test_split(10, 0.2, 0.2, 1)
    len(train), len(val), len(test)     # (6, 2, 2)
    find_leaks([0, 1, 2], [3, 4], [5, 2])   # [2]
    ```
  entryFile: "split_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Начните с find_leaks: заведите словарь «индекс - в скольких частях встретился» и учитывайте каждую часть как множество (set), чтобы повтор внутри части не считался."
    - "В train_val_test_split порядок действий важен: сначала rng.shuffle(idx), потом три среза. Генератор создайте внутри функции из переданного seed."
    - "Не вызывайте random.seed и random.shuffle напрямую: это меняет состояние общего генератора. Нужен экземпляр random.Random(seed)."
    - "Скелет: idx = list(range(n)); random.Random(seed).shuffle(idx); n_test = int(n * test_frac); n_val = int(n * val_frac); return idx[n_test + n_val:], idx[n_test:n_test + n_val], idx[:n_test]."
  tests:
    - id: "sizes-and-partition"
      title: "Размеры частей и полное разбиение"
      hint: "Сумма размеров равна n, а объединение частей - все индексы 0..n-1 по одному разу."
    - id: "matches-reference"
      title: "Совпадение с эталонным порядком"
      hint: "Используйте shuffle от Random(seed) и срезы в порядке test, val, train."
    - id: "find-leaks-clean"
      title: "find_leaks на честном разбиении"
    - id: "find-leaks-detects"
      title: "find_leaks находит пересечения"
      hint: "Возвращайте отсортированный список индексов, которые есть минимум в двух частях."
    - id: "deterministic"
      title: "Воспроизводимость и зависимость от seed (скрытый)"
      hidden: true
      hint: "Один seed - один результат, разные seed - разные разбиения."
    - id: "global-random-untouched"
      title: "Глобальный генератор не затронут (скрытый)"
      hidden: true
      hint: "Создавайте random.Random(seed) внутри функции и не вызывайте random.seed."
    - id: "edge-cases"
      title: "Граничные случаи: нулевые доли, n = 0, округление (скрытый)"
      hidden: true
      hint: "int(9 * 0.2) = 1: доли округляются вниз; при нулевых долях всё идёт в train."
