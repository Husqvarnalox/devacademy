id: "ml.foundations.linear-regression"
title: "Линейная регрессия с нуля: MSE и градиентный спуск"
goal: "Вывести градиент MSE для линейной модели, реализовать пакетный градиентный спуск, понимать влияние скорости обучения и масштаба признаков."
difficulty: "medium"
estimatedMinutes: 90
prerequisites: ["ml.foundations.what-is-ml"]
related: ["python.fundamentals.functions", "python.fundamentals.loops"]
next: ["ml.foundations.classification-metrics"]
objectives:
  - "Записать модель y = w*x + b и функцию потерь MSE и объяснить, почему берут квадрат ошибки."
  - "Вывести частные производные MSE по w и b и сделать по ним шаг градиентного спуска."
  - "Сравнить результат спуска с аналитическим решением метода наименьших квадратов."
  - "Объяснить, как скорость обучения влияет на сходимость и почему при слишком большом шаге спуск расходится."
  - "Стандартизовать признак по обучающей выборке и пересчитать параметры обратно в исходный масштаб."
masteryCriteria:
  - "Ваша функция fit совпадает с эталонным МНК на малых данных в пределах 1e-3 и расходится при заведомо большом lr, то есть это именно градиентный спуск."
  - "fit_scaled восстанавливает параметры в исходном масштабе на признаках порядка 1000."
  - "Вы можете объяснить, почему на «сырых» признаках порядка 1000 шаг lr = 0.1 расходится, а после стандартизации - нет."
tags: ["ml", "linear-regression", "mse", "gradient-descent", "feature-scaling"]
facts:
  - kind: "historical"
    text: "Метод наименьших квадратов впервые опубликовал Адриен-Мари Лежандр в 1805 году; Карл Фридрих Гаусс заявлял, что применял его ещё с 1795 года, и в 1809 году связал метод с нормальным распределением ошибок. Спор о приоритете известен как один из классических в истории математики."
    sources: ["https://en.wikipedia.org/wiki/Least_squares"]
  - kind: "historical"
    text: "Градиентный спуск как метод минимизации предложил Огюстен Луи Коши в 1847 году. Сегодня его вариации (стохастический спуск, Adam) обучают нейросети с миллиардами параметров."
    sources: ["https://en.wikipedia.org/wiki/Gradient_descent"]
  - kind: "internals"
    text: "Сходимость спуска на квадратичной функции определяется собственными числами матрицы Гессе: шаг должен быть меньше 2, делённых на наибольшее собственное число, а скорость задаётся числом обусловленности. Стандартизация признаков приближает обусловленность к 1; поэтому в руководстве scikit-learn по предобработке масштабирование признаков описано как важный шаг для многих моделей, особенно основанных на градиентах и расстояниях."
    sources:
      - "https://scikit-learn.org/stable/modules/preprocessing.html"
      - "https://cs229.stanford.edu/"
  - kind: "misconception"
    text: "«Градиентный спуск нужен, потому что формулы для регрессии не существует». Для линейной регрессии аналитическое решение есть (нормальное уравнение), и на небольших данных оно точнее и проще. Спуск необходим там, где формулы нет (нейросети) или матрица XᵀX слишком велика."
    sources: ["https://scikit-learn.org/stable/modules/linear_model.html"]
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Почему в MSE ошибку возводят в квадрат, а не просто суммируют?"
      options:
        - "Чтобы положительные и отрицательные ошибки не гасили друг друга и большие промахи штрафовались сильнее"
        - "Чтобы значения были всегда меньше 1"
        - "Чтобы не делить на n"
        - "Это нужно только для классификации"
      answer: 0
      explanation: "Без квадрата ошибки разных знаков компенсировали бы друг друга; квадрат делает потери неотрицательными, гладкими и выпуклыми."
    - id: "q2"
      type: "single"
      prompt: "Чему равна производная MSE по параметру b для модели y = w*x + b?"
      options: ["(2/n) * сумма(e_i)", "(2/n) * сумма(e_i * x_i)", "сумма(e_i^2)", "(1/n) * сумма(x_i)"]
      answer: 0
      explanation: "e_i = w*x_i + b - y_i, поэтому de_i/db = 1, и по правилу цепочки ∂L/∂b = (2/n) * сумма(e_i)."
    - id: "q3"
      type: "numeric"
      prompt: "Данные: x = [0, 2], y = [1, 5]. Начальные w = 0, b = 0. Чему равен градиент dL/db (MSE, формула (2/n)*сумма(e_i))? Ответ - число."
      answer: -6
      tolerance: 1e-06
      explanation: "e_1 = 0 - 1 = -1, e_2 = 0 - 5 = -5. dL/db = (2/2) * (-1 - 5) = -6."
    - id: "q4"
      type: "multiple"
      prompt: "Какие утверждения о скорости обучения lr верны?"
      options:
        - "При слишком большом lr потери могут расти от шага к шагу"
        - "При слишком малом lr спуск сходится, но медленно"
        - "Чем больше lr, тем быстрее и надёжнее сходимость"
        - "Допустимый lr зависит от масштаба признаков"
      answer: [0, 1, 3]
      explanation: "Слишком большой шаг перепрыгивает минимум и расходится; слишком малый делает сходимость очень медленной. Допустимый шаг ограничен кривизной функции, а она растёт с масштабом признаков."
    - id: "q5"
      type: "short"
      prompt: "Как называется преобразование признака z = (x - среднее) / стандартное отклонение? (одно слово)"
      answer: ["стандартизация", "стандартизацию", "standardization"]
      explanation: "Это стандартизация: после неё среднее признака равно 0, а стандартное отклонение равно 1."
    - id: "q6"
      type: "single"
      prompt: "По каким данным нужно считать среднее и стандартное отклонение для стандартизации?"
      options:
        - "По всем данным до разбиения"
        - "Только по обучающей выборке, затем применять к validation и test"
        - "Отдельно по каждой части"
        - "По тестовой выборке"
      answer: 1
      explanation: "Статистики по train - честный способ; статистики по всем данным или по тесту дают утечку информации."
complexity:
  time: "O(n * epochs)"
  space: "O(1)"
  explanation: "Каждая эпоха один раз обходит n точек и обновляет два параметра; дополнительная память не зависит от n. Аналитическое решение для одного признака - один проход O(n)."
editorial: "editorial.md"
exercise:
  id: "ml.foundations.linear-regression.exercise"
  title: "Градиентный спуск для y = w*x + b"
  prompt: |
    В файле `regression_task.py` реализуйте три функции. Только стандартная библиотека; ничего не печатайте.

    1. `mse(w, b, xs, ys)` - среднеквадратичная ошибка `(1/n) * sum((w*x + b - y)^2)`.
    2. `fit(xs, ys, lr, epochs)` - **пакетный градиентный спуск**: начните с `w = b = 0.0`; на каждой эпохе по всем точкам вычислите `dw = (2/n)*sum(e*x)` и `db = (2/n)*sum(e)`, где `e = w*x + b - y`, затем сделайте шаг `w -= lr*dw`, `b -= lr*db` (оба градиента считаются по **старым** `w, b`). Верните кортеж `(w, b)`. При `epochs = 0` верните `(0.0, 0.0)`.
    3. `fit_scaled(xs, ys, lr, epochs)` - стандартизуйте `x` по `mean` и `std` (деление на `n`, не `n - 1`), обучите `fit` на стандартизованных признаках и верните `(w, b)` для **исходных** `x`: `w = w_s/std`, `b = b_s - w_s*mean/std`. Если `std == 0`, верните `(0.0, mean(y))`.

    Тесты сравнивают результат с аналитическим решением методом наименьших квадратов с явным допуском. Они также проверяют, что `fit` - именно спуск: при слишком большом `lr` он должен расходиться, а на признаках порядка 1000 при `lr = 0.1` - тоже.

    **Пример.**

    ```python
    xs, ys = [0, 1, 2, 3, 4], [1, 3, 5, 7, 9]      # y = 2x + 1
    w, b = fit(xs, ys, 0.05, 2000)                  # w ~ 2.0, b ~ 1.0
    mse(2.0, 1.0, xs, ys)                           # 0.0
    ```
  entryFile: "regression_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Начните с mse: это одна строка с sum и zip. Затем fit: заведите w и b, и в цикле по эпохам накопите dw и db."
    - "Внутри эпохи считайте ошибку e = w*x + b - y для каждой точки по текущим (старым) w и b; обновлять w и b можно только после цикла по точкам."
    - "fit_scaled: сначала mean и std (std = sqrt(sum((x - mean)^2)/n)), потом zs = [(x - mean)/std], затем вызов fit(zs, ys, lr, epochs) и пересчёт параметров обратно. Не забудьте случай std == 0."
    - "Скелет fit: for _ in range(epochs): dw = db = 0.0; for x, y in zip(xs, ys): e = w*x + b - y; dw += 2*e*x/n; db += 2*e/n; затем w -= lr*dw; b -= lr*db."
  tests:
    - id: "mse-basic"
      title: "mse на простых данных"
      hint: "(1/n) * sum((w*x + b - y)**2); для точной прямой результат 0."
    - id: "fit-exact-line"
      title: "fit находит точную прямую"
      hint: "Проверьте знаки: шаг делается против градиента, w -= lr*dw."
    - id: "fit-noisy-closed-form"
      title: "fit совпадает с МНК на шумных данных"
      hint: "Проверьте множитель 2/n в градиентах и что для обоих параметров используется одна и та же ошибка."
    - id: "fit-first-step"
      title: "Первый шаг и нулевые эпохи"
      hint: "При epochs=0 возвращается (0.0, 0.0); после одной эпохи w = -lr*dw, b = -lr*db при нулевом начале."
    - id: "loss-decreases"
      title: "При малом lr потери не растут (скрытый)"
      hidden: true
      hint: "Если MSE растёт при маленьком lr, ищите ошибку в знаке или в обновлении w и b по разным данным."
    - id: "large-lr-diverges"
      title: "При большом lr спуск расходится (скрытый)"
      hidden: true
      hint: "Нужен именно градиентный спуск, а не готовая формула: ответ формулы не зависит от lr."
    - id: "fit-scaled-big-features"
      title: "fit_scaled на признаках порядка 1000 (скрытый)"
      hidden: true
      hint: "После обучения на z верните параметры для исходного x: w = w_s/std, b = b_s - w_s*mean/std."
    - id: "unscaled-diverges"
      title: "Без масштабирования fit расходится, с масштабированием сходится (скрытый)"
      hidden: true
      hint: "fit не должен масштабировать данные сам; масштабирует только fit_scaled."
    - id: "fit-scaled-constant-x"
      title: "Постоянный признак: std = 0 (скрытый)"
      hidden: true
      hint: "При std == 0 деление невозможно: верните (0.0, среднее y)."
