id: ml-foundations
version: 1.0.0
title: Основы машинного обучения
description: >-
  Четыре урока по классическому машинному обучению на чистом Python (только стандартная библиотека, без numpy): постановка задачи, разбиение на train/validation/test,
  переобучение и утечки данных, линейная регрессия с градиентным спуском, метрики классификации и метод k ближайших соседей. В каждом уроке есть теория с запускаемыми примерами,
  тест и упражнение с автоматической проверкой по численным критериям. Уроки детерминированы: фиксированные seed и допуски, GPU не нужен.
languageId: python
level: 2
track: ml-classical
requires: [python-fundamentals]
lessons:
  - 01-what-is-ml
  - 02-linear-regression
  - 03-classification-metrics
  - 04-knn
