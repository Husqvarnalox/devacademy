id: "php.check.array-functions"
title: "Проверка: массивы и функции высшего порядка"
goal: "Обрабатывать списки записей через array_map, array_filter, usort, array_column и замыкания и группировать данные."
difficulty: "easy"
estimatedMinutes: 15
prerequisites: []
objectives:
  - "Показать на практике умение: обрабатывать записи через функции высшего порядка, сортировку и группировку."
masteryCriteria:
  - "Решение упражнения проходит все тесты, включая скрытые."
  - "Квиз пройден с результатом не ниже 75%."
tags:
  - "php"
  - "check"
  - "array-functions"
assessmentFor:
  - "php.fundamentals.arrays-and-functions"
quiz:
  passThreshold: 0.75
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        $a = [1, 2, 3, 4, 5, 6];
        $b = array_filter($a, fn($n) => $n % 3 === 0);
        echo json_encode($b);
        ```
      options:
        - "[3,6]"
        - "{\"2\":3,\"5\":6}"
        - "{\"3\":3,\"6\":6}"
        - "[null,null,3,null,null,6]"
      answer: 1
      explanation: "array_filter сохраняет исходные ключи значений 3 и 6 (2 и 5), поэтому массив больше не является списком и json_encode печатает объект. Для списка нужен array_values."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        $words = ["b", "a", "c"];
        $ok = usort($words, fn($x, $y) => $y <=> $x);
        var_dump($ok);
        echo implode($words);
        ```
      options:
        - "bool(true)\nabc"
        - "array(3) {}\ncba"
        - "bool(true)\ncba"
        - "bool(false)\ncba"
      answer: 2
      explanation: "usort сортирует переданный массив на месте, а возвращает только true. Компаратор $y <=> $x меняет порядок на убывающий, поэтому получается cba."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        $n = 2;
        $f = fn($x) => $x * $n;
        $n = 10;
        echo $f(3);
        ```
      options:
        - "6"
        - "30"
        - "20"
        - "Ошибка: $n не определена"
      answer: 0
      explanation: "Стрелочная функция захватывает значение $n в момент создания. Позднее изменение внешней переменной на неё не влияет, поэтому результат 3 * 2 = 6."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        $data = ["x" => 1, "y" => 2];
        ["y" => $b, "x" => $a] = $data;
        function total(int ...$n): int
        {
            return array_sum($n);
        }
        echo $a, $b, total(...[4, 5, 6]);
        ```
      options:
        - "1215"
        - "2115"
        - "12"
        - "126"
      answer: 0
      explanation: "Деструктуризация по ключам кладёт 1 в $a и 2 в $b независимо от порядка. Оператор ... передаёт элементы массива как отдельные аргументы, поэтому функция получает 4, 5 и 6 и возвращает 15."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        $a = ["a" => 1, 5 => "x"];
        $b = ["a" => 2, 5 => "y"];
        echo json_encode(array_merge($a, $b)), json_encode($a + $b);
        ```
      options:
        - "{\"a\":2,\"5\":\"y\"}{\"a\":1,\"5\":\"x\"}"
        - "{\"a\":1,\"0\":\"x\"}{\"a\":2,\"5\":\"y\"}"
        - "{\"a\":2,\"0\":\"x\",\"1\":\"y\"}{\"a\":1,\"5\":\"x\"}"
        - "{\"a\":2,\"0\":\"y\"}{\"a\":2,\"5\":\"y\"}"
      answer: 2
      explanation: "array_merge заменяет значения по строковым ключам, а числовые ключи отбрасывает и нумерует заново: оба значения (\"x\" и \"y\") сохраняются под ключами 0 и 1. Оператор + оставляет значения из левого массива для общих ключей."
exercise:
  id: "php.check.array-functions.exercise"
  title: "Таблица баллов: фильтры, суммы и группы"
  prompt: |-
    Основная часть программы готова: первая строка ввода - минимальный балл, остальные - записи `имя,город,балл` (некорректные строки пропускаются). Допишите четыре функции в `main.php`, основную часть не меняйте.

    1. `topScorers(array $rows, int $min): array` - список имён тех, у кого балл не меньше `$min`: по убыванию балла, при равенстве - по имени по возрастанию (ключи результата 0, 1, 2, ...).
    2. `totalsByCity(array $rows): array` - `город => сумма баллов`, города по алфавиту.
    3. `averageScore(array $rows): float` - средний балл, для пустого списка `0.0`.
    4. `namesByCity(array $rows): array` - `город => список имён` в порядке ввода, города по алфавиту.

    Каждая запись - массив `["name" => ..., "city" => ..., "score" => ...]`.

    **Пример.** Для ввода

    ```
    80
    Анна,Москва,90
    Иван,Казань,75
    Ольга,Москва,85
    ```

    программа печатает

    ```
    top: Анна, Ольга
    Казань: 75
    Москва: 175
    avg: 83.33
    Казань - Иван
    Москва - Анна, Ольга
    ```

    Часть тестов скрыта: в них равные баллы, пустой список и города на кириллице.
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "topScorers: array_filter оставляет исходные ключи, но usort всё равно переиндексирует массив. Компаратор: fn($a, $b) => [$b[\"score\"], $a[\"name\"]] <=> [$a[\"score\"], $b[\"name\"]]. Имена достаньте через array_column($good, \"name\")."
    - "totalsByCity: накапливайте в массиве $totals[$row[\"city\"]] = ($totals[$row[\"city\"]] ?? 0) + $row[\"score\"]; потом ksort($totals)."
    - "averageScore: для пустого массива верните 0.0 заранее, иначе деление на ноль; иначе array_sum(array_column($rows, \"score\")) / count($rows)."
    - "namesByCity: $groups[$row[\"city\"]][] = $row[\"name\"] создаёт список для нового города сам; потом ksort."
  tests:
    - id: "basic"
      title: "Лучшие, суммы и группы"
      stdin: "80\nАнна,Москва,90\nИван,Казань,75\nОльга,Москва,85\n"
      expected: "top: Анна, Ольга\nКазань: 75\nМосква: 175\navg: 83.33\nКазань - Иван\nМосква - Анна, Ольга\n"
      hint: "Лучшие с баллом не ниже 80: Анна (90) и Ольга (85); сумма по Москве 175, по Казани 75; среднее (90+75+85)/3 = 83.33."
    - id: "ties"
      title: "Равные баллы и порядок имён"
      stdin: "70\nБорис,Тула,70\nАнна,Тула,70\nВера,Омск,95\nГлеб,Омск,60\n"
      expected: "top: Вера, Анна, Борис\nОмск: 155\nТула: 140\navg: 73.75\nОмск - Вера, Глеб\nТула - Борис, Анна\n"
      hint: "Из равных баллов имя идёт по возрастанию: Анна перед Борисом; Вера с 95 первая."
    - id: "single"
      title: "Одна запись (скрытый)"
      stdin: "50\nЛев,Тверь,50\n"
      expected: "top: Лев\nТверь: 50\navg: 50.00\nТверь - Лев\n"
      hidden: true
      hint: "Порог включительно (50 >= 50): Лев в списке; один город, сумма 50, среднее 50.00."
    - id: "nobody"
      title: "Никто не прошёл порог (скрытый)"
      stdin: "100\nАнна,Москва,90\nИван,Казань,75\n"
      expected: "top: -\nКазань: 75\nМосква: 90\navg: 82.50\nКазань - Иван\nМосква - Анна\n"
      hidden: true
      hint: "Порог выше всех баллов: top: - (пустой список); суммы и группы всё равно считаются."
    - id: "malformed"
      title: "Плохие строки пропускаются (скрытый)"
      stdin: "10\nАнна,Москва,abc\nИван,Казань\nОльга,Москва,20,5\nПётр,Казань,15\n\nЛев,Тверь,12\n"
      expected: "top: Пётр, Лев\nКазань: 15\nТверь: 12\navg: 13.50\nКазань - Пётр\nТверь - Лев\n"
      hidden: true
      hint: "Строки с нечисловым баллом, с двумя или четырьмя полями и пустые пропускаются основной частью; остаются Пётр и Лев."
    - id: "numeric-city"
      title: "Города-числа и порядок групп (скрытый)"
      stdin: "0\nа,10,5\nб,2,7\nв,10,3\n"
      expected: "top: б, а, в\n2: 7\n10: 8\navg: 5.00\n2 - б\n10 - а, в\n"
      hidden: true
      hint: "Названия городов \"10\" и \"2\" - числовые строки: PHP превращает их в целые ключи; ksort упорядочивает такие ключи как числа (2 перед 10). Проверьте, что код не ломается."
