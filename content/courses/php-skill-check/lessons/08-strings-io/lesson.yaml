id: "php.check.strings-io"
title: "Проверка: строки в UTF-8, форматирование и ввод"
goal: "Работать с текстом в UTF-8, выравнивать и форматировать вывод и читать записи из стандартного ввода."
difficulty: "easy"
estimatedMinutes: 20
prerequisites: []
objectives:
  - "Показать на практике умение: работать с UTF-8, форматировать таблицы и читать записи из ввода."
masteryCriteria:
  - "Решение упражнения проходит все тесты, включая скрытые."
  - "Квиз пройден с результатом не ниже 75%."
tags:
  - "php"
  - "check"
  - "strings-io"
assessmentFor:
  - "php.fundamentals.strings-and-io"
  - "php.first-steps.how-php-runs"
quiz:
  passThreshold: 0.75
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        $s = "Привет";
        echo strlen($s), " ", mb_strlen($s), " ", strtoupper($s);
        ```
      options:
        - "6 6 ПРИВЕТ"
        - "12 6 ПРИВЕТ"
        - "12 6 Привет"
        - "6 12 Привет"
      answer: 2
      explanation: "Каждая кириллическая буква занимает два байта: strlen возвращает 12, а mb_strlen - 6. Функция strtoupper преобразует только ASCII-буквы, поэтому кириллица остаётся прежней."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        printf("[%5s][%-5s][%05.1f][%x]", "ab", "ab", 3.14159, 255);
        ```
      options:
        - "[   ab][ab   ][003.1][ff]"
        - "[ab   ][   ab][003.1][ff]"
        - "[   ab][ab   ][3.14159][ff]"
        - "[   ab][ab   ][003.1][255]"
      answer: 0
      explanation: "Число после % задаёт ширину; знак минус выравнивает по левому краю; 0 дополняет нулями; %05.1f даёт ширину пять с одним знаком после точки, а %x печатает шестнадцатеричную запись."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        $parts = explode(" ", "a  b");
        echo count($parts), count(preg_split('/\s+/', "a  b")), count(preg_split('/\s+/', " a b "));
        ```
      options:
        - "324"
        - "222"
        - "233"
        - "323"
      answer: 0
      explanation: "explode по одному пробелу делит a, пустую строку и b на три части. Шаблон \\\\s+ считает серию пробелов одним разделителем (два элемента), но пробел в начале и в конце даёт пустые элементы: их четыре (пустой, a, b, пустой). Поэтому нужен trim."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        Привет <?php echo "мир"; ?>!
        <?php echo number_format(1234.5, 1, ".", ","), mb_str_pad("я", 3, "-"), "\n";
        ```
      options:
        - "мир!\n1,234.5я--"
        - "Привет мир!\n1,234.5я--"
        - "Привет мир!\n1234.5я--"
        - "Привет мир!\n1,234.5--я"
      answer: 1
      explanation: "Текст вне тегов PHP печатается как есть, а закрывающий тег с переводом строки после него поглощает этот перевод строки. Поэтому блоки склеиваются так: «Привет мир!» и сразу следующая строка 1,234.5, затем символ я, дополненный справа до трёх символов."
exercise:
  id: "php.check.strings-io.exercise"
  title: "Таблица счетов: UTF-8 и форматирование"
  prompt: |-
    Основная часть программы готова: она читает записи `полное имя;сумма в копейках`, пропускает некорректные строки и печатает таблицу с итогом. Допишите четыре функции в `main.php`, основную часть не меняйте.

    1. `initials(string $fullName): string` - первые буквы слов в верхнем регистре без точек (`иван петров` -> `ИП`); слов может разделять любое число пробелов.
    2. `truncate(string $text, int $max): string` - обрезает строку до `$max` **символов**; если строка длиннее, она заканчивается символом `…`, и общая длина равна `$max`.
    3. `pad(string $text, int $width, bool $alignRight = false): string` - выравнивает пробелами до ширины в символах: по левому краю или (при `true`) по правому; длинную строку не обрезает.
    4. `money(int $cents): string` - `123456` -> `1 234,56` (пробел между тысячами, запятая перед копейками).

    **Пример.** Для ввода

    ```
    иван петров;123456
    Анна;5
    ```

    программа печатает строки таблицы (в тестах пробелы считаются, пробелы выравнивания справа не обрезаются) и итог:

    ```
    ИП  иван петров      1 234,56
    А   Анна                 0,05
    всего: 1 234,61 (2)
    ```

    Часть тестов скрыта: в них длинные имена на кириллице, нули, несколько пробелов между словами и плохие строки.
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "initials: разбейте имя через preg_split('/\\s+/', trim($fullName), -1, PREG_SPLIT_NO_EMPTY), для каждого слова возьмите mb_strtoupper(mb_substr($word, 0, 1)). Функции без mb_ ломают кириллицу."
    - "truncate: если mb_strlen($text) <= $max, верните строку как есть; иначе mb_substr($text, 0, $max - 1) . \"…\"."
    - "pad: mb_str_pad($text, $width, \" \", STR_PAD_LEFT) выравнивает по правому краю, STR_PAD_RIGHT - по левому. Обычный str_pad считает байты и не подходит."
    - "money: number_format($cents / 100, 2, \",\", \" \") - разделители заданы явно, поэтому результат не зависит от локали."
  tests:
    - id: "basic"
      title: "Строки таблицы и итог"
      stdin: "иван петров;123456\nАнна;5\n"
      expected: "ИП  иван петров      1 234,56\nА   Анна                 0,05\nвсего: 1 234,61 (2)\n"
      hint: "Инициалы ИП и А; сумма 1 234,56 и 0,05; итог 123461 копейка = 1 234,61."
    - id: "truncate"
      title: "Длинное имя обрезается до 12 символов"
      stdin: "Константин Константинопольский;100000\nМария Ивановна Сидорова;250\n"
      expected: "КК  Константин …     1 000,00\nМИС Мария Ивано…         2,50\nвсего: 1 002,50 (2)\n"
      hint: "Длинное имя обрезается до 11 символов плюс «…» (всего 12); считать нужно символы, а не байты."
    - id: "spaces"
      title: "Несколько пробелов и регистр (скрытый)"
      stdin: "  мария   иванова  ;99\nanna lee;100\n"
      expected: "МИ  мария   ива…         0,99\nAL  anna lee             1,00\nвсего: 1,99 (2)\n"
      hidden: true
      hint: "Лишние пробелы в начале, конце и между словами не дают пустых инициалов; латиница тоже работает."
    - id: "zero-big"
      title: "Нули и большие суммы (скрытый)"
      stdin: "Ноль;0\nМиллионер;123456789012\nКопейка;1\n"
      expected: "Н   Ноль                 0,00\nМ   Миллионер    1 234 567 890,12\nК   Копейка              0,01\nвсего: 1 234 567 890,13 (3)\n"
      hidden: true
      hint: "0 -> 0,00; 123456789012 копеек -> 1 234 567 890,12; 1 -> 0,01."
    - id: "malformed"
      title: "Плохие строки пропускаются (скрытый)"
      stdin: "Анна;abc\nИван;12;3\nПётр\n\nЛев;-5\nОльга;7\n"
      expected: "пропущено\nпропущено\nпропущено\nпропущено\nО   Ольга                0,07\nвсего: 0,07 (1)\n"
      hidden: true
      hint: "Нечисловая, лишнее поле, без суммы, отрицательная суммы пропускаются; учитывается только Ольга; пустая строка игнорируется."
    - id: "exact-width"
      title: "Имя длиной ровно в предел (скрытый)"
      stdin: "Ровно двенадцать;1\nДвенадцать12;2\n"
      expected: "РД  Ровно двена…         0,01\nД   Двенадцать12         0,02\nвсего: 0,03 (2)\n"
      hidden: true
      hint: "«Двенадцать12» - ровно 12 символов, не обрезается и без многоточия; более длинное обрезается до 11 символов и «…»."
