id: "php.check.errors-input"
title: "Проверка: чтение ввода и исключения"
goal: "Читать ввод до конца, строго разбирать значения, бросать и ловить исключения и считать итоги."
difficulty: "easy"
estimatedMinutes: 15
prerequisites: []
objectives:
  - "Показать на практике умение: читать ввод до конца, разбирать его строго и обрабатывать ошибки исключениями."
masteryCriteria:
  - "Решение упражнения проходит все тесты, включая скрытые."
  - "Квиз пройден с результатом не ниже 75%."
tags:
  - "php"
  - "check"
  - "errors-input"
assessmentFor:
  - "php.from-zero.reading-all-input"
  - "php.from-zero.exceptions"
quiz:
  passThreshold: 0.75
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        function f(int $n): string
        {
            try {
                if ($n < 0) {
                    throw new InvalidArgumentException("neg");
                }
                return "ok";
            } catch (InvalidArgumentException $e) {
                return $e->getMessage();
            } finally {
                echo "F";
            }
        }
        echo f(1), f(-1);
        ```
      options:
        - "FokFneg"
        - "okneg"
        - "FFokneg"
        - "okFnegF"
      answer: 0
      explanation: "Каждый вызов f печатает F в блоке finally до того, как результат попадёт в echo. Первый вызов печатает F и затем ok, второй - F и затем neg."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        $line = "  42\n";
        var_dump(trim($line) === "42", $line === "42");
        ```
      options:
        - "bool(true)\nbool(false)"
        - "bool(false)\nbool(false)"
        - "bool(true)\nbool(true)"
        - "bool(false)\nbool(true)"
      answer: 0
      explanation: "trim убирает пробелы и перевод строки с обоих краёв, поэтому сравнение обрезанной строки истинно, а необрезанной - ложно."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        echo json_encode([filter_var("0", FILTER_VALIDATE_INT), filter_var("x", FILTER_VALIDATE_INT)]);
        ```
      options:
        - "[0,false]"
        - "[false,false]"
        - "[0,null]"
        - "[null,null]"
      answer: 0
      explanation: "filter_var возвращает целое число 0 для корректной строки \"0\" и false для строки, которая не является целым числом. Поэтому результат нужно сравнивать с false строго."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        echo json_encode([(int) "12abc", is_numeric("12abc"), is_numeric("1.5"), (int) 1.9]);
        ```
      options:
        - "[12,false,true,1]"
        - "[0,false,true,2]"
        - "[12,true,true,1]"
        - "[0,false,false,1]"
      answer: 0
      explanation: "Приведение (int) читает ведущие цифры и отбрасывает остальное: 12. Строка \"12abc\" не является числом, а \"1.5\" - является. Приведение (int) 1.9 отбрасывает дробную часть и даёт 1."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        try {
            throw new RuntimeException("a");
        } catch (InvalidArgumentException $e) {
            echo "1";
        } catch (Exception $e) {
            echo "2";
        } finally {
            echo "3";
        }
        ```
      options:
        - "23"
        - "13"
        - "2"
        - "123"
      answer: 0
      explanation: "RuntimeException не является InvalidArgumentException, поэтому первый catch пропускается и срабатывает второй, печатая 2. Блок finally выполняется в любом случае и печатает 3."
exercise:
  id: "php.check.errors-input.exercise"
  title: "Разбор строк с оценками: исключения и итоги"
  prompt: |-
    Основная часть программы готова: она читает строки до конца ввода, вызывает ваши функции, печатает результат или сообщение об ошибке с номером строки и в конце печатает итог. Допишите в `main.php` функции `parseRecord` и `summary`, основную часть не меняйте.

    Формат строки: `имя оценка`, поля разделены одним пробелом. Пустые строки пропускаются основной частью.

    1. `parseRecord(string $line): array` возвращает `[имя, оценка]`. При ошибке бросается `InvalidArgumentException`; проверки идут в таком порядке:
       - полей не два - `ожидалось 2 поля, получено N`;
       - оценка не целое число - `неверная оценка: <текст>`;
       - число меньше 0 или больше 100 - `оценка вне диапазона 0-100: <число>`. Оценка `0` допустима.
    2. `summary(array $scores): string` - строка `n=<число> avg=<среднее> max=<максимум>` (среднее с двумя знаками после точки) или `нет данных` для пустого списка.

    **Пример.** Для ввода

    ```
    Анна 85
    Иван
    Ольга 95
    ```

    программа печатает

    ```
    Анна: 85
    Строка 2: ожидалось 2 поля, получено 1
    Ольга: 95
    n=2 avg=90.00 max=95
    ```

    Часть тестов скрыта: в них пустой ввод, оценка `0`, дробные и отрицательные числа, пустые строки и `\r\n`.
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "parseRecord: $fields = explode(\" \", $line); если count($fields) !== 2, бросьте InvalidArgumentException(\"ожидалось 2 поля, получено \" . count($fields))."
    - "Оценку проверяйте через filter_var($text, FILTER_VALIDATE_INT) и сравнение с false строго: оценка 0 корректна, а !$score принял бы её за ошибку. Диапазон проверяйте отдельным условием после этого."
    - "summary: для пустого списка верните \"нет данных\"; иначе среднее array_sum($scores) / count($scores) форматируйте через number_format($average, 2, '.', ''), максимум - max($scores)."
    - "Сообщения должны совпасть дословно: \"неверная оценка: {$text}\" печатает исходный текст, а \"оценка вне диапазона 0-100: {$score}\" - число."
  tests:
    - id: "valid"
      title: "Корректные строки"
      stdin: "Анна 85\nИван 92\nОльга 77\n"
      expected: "Анна: 85\nИван: 92\nОльга: 77\nn=3 avg=84.67 max=92\n"
      hint: "Каждая строка печатает «имя: оценка»; итог: n=3, среднее (85+92+77)/3 = 84.67, максимум 92."
    - id: "errors"
      title: "Разные ошибки в строках"
      stdin: "Анна 85\nИван\nОльга abc\nПётр 101\nЛев 70\n"
      expected: "Анна: 85\nСтрока 2: ожидалось 2 поля, получено 1\nСтрока 3: неверная оценка: abc\nСтрока 4: оценка вне диапазона 0-100: 101\nЛев: 70\nn=2 avg=77.50 max=85\n"
      hint: "Строка 2: одно поле; строка 3: «abc» не число; строка 4: 101 вне диапазона. Номера строк считаются от начала ввода."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: "нет данных\n"
      hidden: true
      hint: "Без строк итог «нет данных»: основной код печатает summary для пустого списка."
    - id: "zero-and-borders"
      title: "Оценки 0 и 100 (скрытый)"
      stdin: "Лев 0\nМария 100\nНина 50\n"
      expected: "Лев: 0\nМария: 100\nНина: 50\nn=3 avg=50.00 max=100\n"
      hidden: true
      hint: "0 и 100 допустимы (filter_var вернул 0, а не false); среднее 50.00, максимум 100."
    - id: "bad-numbers"
      title: "Дробные, отрицательные и числа с записью (скрытый)"
      stdin: "а -5\nб 7.5\nв 1e1\nг 007\nд 99\n"
      expected: "Строка 1: оценка вне диапазона 0-100: -5\nСтрока 2: неверная оценка: 7.5\nСтрока 3: неверная оценка: 1e1\nСтрока 4: неверная оценка: 007\nд: 99\nn=1 avg=99.00 max=99\n"
      hidden: true
      hint: "Отрицательное число — «вне диапазона 0-100: -5»; 7.5, 1e1 и 007 не являются целыми в десятичной записи: «неверная оценка»."
    - id: "blank-crlf"
      title: "Пустые строки, лишние поля и перевод строки Windows (скрытый)"
      stdin: "\r\nа 10 20\r\n\nб 30\r\nв 40"
      expected: "Строка 2: ожидалось 2 поля, получено 3\nб: 30\nв: 40\nn=2 avg=35.00 max=40\n"
      hidden: true
      hint: "Пустые строки пропускаются, но номера идут вместе с ними; «а 10 20» - три поля; последняя строка может быть без перевода строки."
