id: "rust.from-zero.basic-types"
title: "Основные типы: i64, f64, bool, char"
goal: "Выбирать тип значения (целое, дробное, логическое, символ) и указывать его явно в объявлении переменной."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "rust.from-zero.variables"
objectives:
  - "Назвать основные типы Rust: i32, i64, f64, bool, char и значения каждого."
  - "Записывать тип явно в виде let имя: Тип = значение;."
  - "Отличать символ 'а' в одинарных кавычках от текста \"а\" в двойных."
  - "Понимать, почему 5 и 5.0 - значения разных типов и почему большое число не помещается в i32."
masteryCriteria:
  - "Вы выбираете f64 для цены с копейками и i64 для числа, большего двух миллиардов."
  - "Вы записываете дробные литералы с точкой (5.0), а не 5, когда нужен f64."
  - "Вы читаете сообщение mismatched types и объясняете, какие типы не совпали."
concepts:
  introduces:
    - "rust.type"
    - "rust.i64"
    - "rust.f64"
    - "rust.bool"
    - "rust.char"
    - "rust.explicit-type"
  uses:
    - "rust.variable"
    - "rust.let"
    - "rust.i32"
    - "rust.type-inference"
    - "rust.inline-format"
    - "rust.string-literal"
next:
  - "rust.from-zero.arithmetic"
tags:
  - "rust"
  - "types"
  - "f64"
  - "bool"
  - "char"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Какой тип подойдёт для цены 49.9 руб.?"
      options:
        - "i32"
        - "f64"
        - "bool"
        - "char"
      answer: 1
      explanation: "Число с дробной частью хранит f64. Целые типы (i32, i64) дробной части не имеют."
    - id: "q2"
      type: "single"
      prompt: |
        Что сообщит компилятор?

        ```rust
        fn main() {
            let weight: f64 = 5;
            println!("{weight}");
        }
        ```
      options:
        - "Выведется 5."
        - "Ошибка mismatched types: ожидалось f64, найдено целое число. Нужно 5.0."
        - "Предупреждение, программа запустится."
        - "Выведется 5.0."
      answer: 1
      explanation: "Литерал 5 - целое число, а f64 ожидает дробное. Rust не превращает одно в другое молча. Компилятор подсказывает: «use a float literal», то есть 5.0."
    - id: "q3"
      type: "single"
      prompt: |
        Чем отличаются 'я' и "я" в Rust?

      options:
        - "Ничем: кавычки взаимозаменяемы."
        - "'я' - один символ типа char, \"я\" - текст."
        - "'я' - текст, \"я\" - символ."
        - "'я' - число."
      answer: 1
      explanation: "Одинарные кавычки задают один символ (char), двойные - текст (строковый литерал). Их нельзя подменять друг другом."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let big: i64 = 3_000_000_000;
            println!("{big}");
        }
        ```
      options:
        - "3_000_000_000"
        - "3000000000"
        - "Ошибка: число не помещается"
        - "3"
      answer: 1
      explanation: "Символ _ в числовом литерале нужен только для удобства чтения и в значение не входит. Число 3000000000 помещается в i64."
    - id: "q5"
      type: "multiple"
      prompt: "Какие из этих значений имеют тип bool?"
      options:
        - "true"
        - "false"
        - "\"true\""
        - "1"
      answer:
        - 0
        - 1
      explanation: "Тип bool имеет ровно два значения: true и false без кавычек. \"true\" в кавычках - текст, а 1 - число."
exercise:
  id: "rust.from-zero.basic-types.exercise"
  title: "Карточка товара"
  prompt: |
    Заготовка печатает карточку товара, но значения в ней не те. Измените переменные так, чтобы программа печатала:

    ```
    Товар: Чай
    Вес, кг: 0.25
    В наличии: true
    Категория: B
    Продано пакетиков: 8100000000
    ```

    Команды `println!` менять не нужно. Число 8100000000 не помещается в `i32`, поэтому у переменной `sold` нужно заменить и тип, и значение.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Дробное число записывают с точкой: 0.25. Логические значения - true и false без кавычек. Символ берут в одинарные кавычки: 'B'."
    - "Переменная sold объявлена с типом i32, а 8100000000 для него велико. Замените i32 на i64."
    - "Если оставить i32 и вписать 8100000000, компилятор сообщит: literal out of range for `i32` и покажет допустимый диапазон."
    - "Должно получиться: let weight: f64 = 0.25; let in_stock: bool = true; let category: char = 'B'; let sold: i64 = 8100000000;"
  tests:
    - id: "basic"
      title: "Печатается карточка товара"
      stdin: ""
      expected: |
        Товар: Чай
        Вес, кг: 0.25
        В наличии: true
        Категория: B
        Продано пакетиков: 8100000000
      hint: "Проверьте пять строк: вес 0.25, наличие true, категория B, продано 8100000000."
    - id: "types"
      title: "Большое число не потеряно (скрытый)"
      stdin: ""
      expected: |
        Товар: Чай
        Вес, кг: 0.25
        В наличии: true
        Категория: B
        Продано пакетиков: 8100000000
      hidden: true
      hint: "Число 8100000000 должно быть напечатано целиком: для этого переменная sold должна иметь тип i64."
