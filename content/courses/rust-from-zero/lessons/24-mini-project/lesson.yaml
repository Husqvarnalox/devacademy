quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn parse(line: &str) -> Result<i32, String> {
            match line.split_once(';') {
                Some((_, n)) => match n.trim().parse::<i32>() {
                    Ok(v) => Ok(v),
                    Err(_) => Err(String::from("плохое число")),
                },
                None => Err(String::from("нет разделителя")),
            }
        }

        fn main() {
            for l in vec!["a;5", "b", "c;x", "d; 7 "] {
                match parse(l) {
                    Ok(v) => println!("{v}"),
                    Err(m) => println!("{m}"),
                }
            }
        }
        ```
      options:
        - "5, нет разделителя, плохое число, 7 (четыре строки)"
        - "5, 5, 5, 5"
        - "5 и затем паника на второй строке"
        - "Ошибка компиляции"
      answer: 0
      explanation: "Первая строка даёт Ok(5). Вторая не содержит «;», третья содержит нечисло, четвёртая после trim превращается в 7. Паники нет: все случаи разобраны."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let sum = 171;
            let count = 2;
            println!("{} {:.2}", sum / count, sum as f64 / count as f64);
        }
        ```
      options:
        - "85 85.50"
        - "85.5 85.50"
        - "86 85.50"
        - "85 85"
      answer: 0
      explanation: "Деление целых отбрасывает дробную часть: 171 / 2 = 85. Если обе части привести к f64, получится 85.5, а {:.2} печатает его с двумя знаками."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        use std::collections::HashMap;

        fn main() {
            let mut m: HashMap<String, i32> = HashMap::new();
            for (k, v) in vec![("а", 2), ("б", 1), ("а", 3)] {
                *m.entry(String::from(k)).or_insert(0) += v;
            }
            println!("{} {}", m["а"], m["б"]);
        }
        ```
      options:
        - "5 1"
        - "3 1"
        - "2 1"
        - "5 5"
      answer: 0
      explanation: "Для ключа «а» значения 2 и 3 складываются в 5; для «б» одно значение 1. entry создаёт запись с нулём, если ключа не было."
    - id: "q4"
      type: "single"
      prompt: "Почему для поиска лучшего по отсортированному списку используют строгое сравнение `>`, а не `>=`?"
      options:
        - "Потому что >= не работает с f64."
        - "Потому что при равенстве остаётся первый по алфавиту: более позднее равное значение не заменяет найденное."
        - "Потому что > быстрее."
        - "Потому что >= нельзя применять к строкам."
      answer: 1
      explanation: "Список отсортирован, поэтому при строгом > побеждает первое из равных, то есть раньше идущее по алфавиту. С >= победил бы последний."
    - id: "q5"
      type: "single"
      prompt: "Пустую строку во вводе нужно..."
      options:
        - "Посчитать неверной строкой."
        - "Пропустить: она не верная и не неверная."
        - "Разобрать как запись с пустым именем."
        - "Остановить программу паникой."
      answer: 1
      explanation: "Пустая строка после trim не содержит данных. Она пропускается до разбора и не попадает в счётчики верных и неверных записей."
exercise:
  id: "rust.from-zero.mini-project.exercise"
  title: "Ведомость оценок"
  prompt: |
    Напишите программу `main.rs`, которая читает со стандартного ввода оценки студентов и печатает отчёт.

    **Формат ввода.** Каждая запись - строка вида `имя;балл`: имя студента (может содержать пробелы) и целый балл, разделённые знаком `;`. Один студент может встречаться несколько раз.

    **Правила.**

    * Пробелы по краям строки убираются (`trim`). Если после этого строка пуста, она пропускается совсем: это не запись и не ошибка.
    * Деление строки идёт по **первому** `;` (`split_once`). Пробелы по краям имени и балла убираются.
    * Строка **неверная**, если: нет `;`; имя пусто; балл не целое число; балл меньше 0 или больше 100. Неверные строки не участвуют в итогах, но считаются.
    * Имена различаются по регистру: `Анна` и `анна` - разные студенты.

    **Вывод.**

    1. По строке на каждого студента: `имя: средний балл`, среднее арифметическое всех его верных баллов с двумя знаками после запятой (`{:.2}`). Студенты идут по возрастанию имени (`sort()` без аргументов для `Vec<&String>`).
    2. `Записей: число` - число верных записей.
    3. `Лучший: имя` - студент с наибольшим средним баллом. При равенстве - тот, кто раньше в отсортированном списке. Если верных записей нет - слово `нет`.
    4. `Неверных строк: число`.

    **Пример.** Ввод:

    ```
    Анна;90
    Борис;70
    Анна;80
    Вера;abc
    Борис;71
    Глеб;105
    ```

    Вывод:

    ```
    Анна: 85.00
    Борис: 70.50
    Записей: 4
    Лучший: Анна
    Неверных строк: 2
    ```

    Строки `Вера;abc` и `Глеб;105` неверные. Если верных записей нет, список студентов пуст, и выводятся только три последние строки: `Записей: 0`, `Лучший: нет`, `Неверных строк: N`.

    Чтение ввода в заготовке уже записано.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Пишите по этапам и сверяйте с примером после каждого. 1) цикл по строкам с trim и continue для пустых; 2) функция parse_record(line) -> Result<Record, String> со структурой Record { name, score }; 3) накопление в HashMap<String, Stats>; 4) вывод."
    - "Для накопления заведите struct Stats { sum: i32, count: i32 } и в цикле: let stats = table.entry(rec.name).or_insert(Stats { sum: 0, count: 0 }); stats.sum += rec.score; stats.count += 1; Счётчики valid и bad объявите до цикла."
    - "parse_record: match line.split_once(';'). В ветке None - Err. В ветке Some((name_text, score_text)): name = name_text.trim(); если name == \"\" - Err; затем match score_text.trim().parse::<i32>(); проверьте диапазон 0..=100 (score >= 0 && score <= 100)."
    - "Вывод: соберите ключи table.keys() в Vec<&String> и вызовите sort(). Среднее - stats.sum as f64 / stats.count as f64, печать {:.2}. Лучший: заведите best_name и best_avg = -1.0 и обновляйте их строгим avg > best_avg. Если valid == 0, выведите нет."
  tests:
    - id: "example"
      title: "Пример из условия"
      stdin: "Анна;90\nБорис;70\nАнна;80\nВера;abc\nБорис;71\nГлеб;105\n"
      expected: "Анна: 85.00\nБорис: 70.50\nЗаписей: 4\nЛучший: Анна\nНеверных строк: 2\n"
      hint: "Анна: (90+80)/2 = 85.00, Борис: (70+71)/2 = 70.50; Вера и Глеб неверные (балл не число и вне диапазона)."
    - id: "single"
      title: "Один студент"
      stdin: "Ира;100\nИра;99\n"
      expected: "Ира: 99.50\nЗаписей: 2\nЛучший: Ира\nНеверных строк: 0\n"
      hint: "Среднее (100+99)/2 = 99.50; записей 2, лучший - Ира."
    - id: "tie"
      title: "Равные средние (скрытый)"
      stdin: "Борис;80\nАнна;70\nАнна;90\nБорис;80\n"
      expected: "Анна: 80.00\nБорис: 80.00\nЗаписей: 4\nЛучший: Анна\nНеверных строк: 0\n"
      hidden: true
      hint: "У Анны (70+90)/2 = 80.00 и у Бориса 80.00. Лучший - Анна: раньше по алфавиту, поэтому нужно строгое сравнение."
    - id: "borders"
      title: "Границы 0 и 100 (скрытый)"
      stdin: "а;0\nб;100\nв;-1\nг;101\n"
      expected: "а: 0.00\nб: 100.00\nЗаписей: 2\nЛучший: б\nНеверных строк: 2\n"
      hidden: true
      hint: "Баллы 0 и 100 допустимы; -1 и 101 вне диапазона - неверные строки."
    - id: "bad-formats"
      title: "Разные неверные строки (скрытый)"
      stdin: "Анна 90\n;50\nБорис;5;6\nВера;\nГлеб;9.5\nДима;40\n"
      expected: "Дима: 40.00\nЗаписей: 1\nЛучший: Дима\nНеверных строк: 5\n"
      hidden: true
      hint: "Неверные: нет «;», пустое имя, «5;6» (split_once режет по первому «;», балл «5;6» не число), пустой балл, дробный балл. Верная только Дима."
    - id: "spaces-and-blank"
      title: "Пробелы и пустые строки (скрытый)"
      stdin: "  Анна Мария ; 50 \n\n   \nАнна Мария;51\n"
      expected: "Анна Мария: 50.50\nЗаписей: 2\nЛучший: Анна Мария\nНеверных строк: 0\n"
      hidden: true
      hint: "Имя может содержать пробелы внутри; пробелы по краям убираются; пустые строки пропускаются и не считаются неверными. Среднее (50+51)/2 = 50.50."
    - id: "case"
      title: "Регистр имён (скрытый)"
      stdin: "анна;50\nАнна;60\n"
      expected: "Анна: 60.00\nанна: 50.00\nЗаписей: 2\nЛучший: Анна\nНеверных строк: 0\n"
      hidden: true
      hint: "Имена различаются по регистру: два студента. Порядок: заглавная «А» раньше строчной «а»."
    - id: "all-bad"
      title: "Только неверные строки (скрытый)"
      stdin: "x\ny;z\n"
      expected: "Записей: 0\nЛучший: нет\nНеверных строк: 2\n"
      hidden: true
      hint: "Студентов нет: Записей: 0, Лучший: нет, Неверных строк: 2."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: "Записей: 0\nЛучший: нет\nНеверных строк: 0\n"
      hidden: true
      hint: "Нет строк: Записей: 0, Лучший: нет, Неверных строк: 0."
