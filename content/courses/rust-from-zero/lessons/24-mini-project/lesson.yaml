id: "rust.from-zero.mini-project"
title: "Мини-проект: ведомость оценок"
goal: "Собрать из изученного готовую программу: прочитать строки «имя;балл», посчитать средние баллы по студентам, определить лучшего и учесть неверные строки."
difficulty: "easy"
estimatedMinutes: 70
prerequisites:
  - "rust.from-zero.first-struct"
objectives:
  - "Разбить задачу на этапы: прочитать, разобрать строку в структуру, накопить итоги в HashMap, вывести отчёт."
  - "Накапливать сумму и количество в структуре внутри HashMap через entry().or_insert() и считать среднее как f64."
  - "Отличать неверные строки от пустых, считать их и не прерывать программу."
  - "Вывести студентов в порядке сортировки имён и найти лучшего с правилом при равенстве."
masteryCriteria:
  - "Отчёт точно совпадает с форматом из условия, включая два знака после запятой."
  - "Пустой ввод и ввод только из неверных строк обработаны без паники."
  - "Порядок студентов и выбор лучшего при равенстве соответствуют условию."
