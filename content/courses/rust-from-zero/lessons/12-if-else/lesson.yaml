id: "rust.from-zero.if-else"
title: "Условный оператор: if, else if, else"
goal: "Заставить программу выбирать действие по условию: записывать if, else if и else, использовать if как выражение и помнить, что условие должно быть bool."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "rust.from-zero.comparison-and-logic"
objectives:
  - "Записать if / else if / else с фигурными скобками и условием типа bool."
  - "Выстроить цепочку else if так, чтобы выполнилась ровно одна ветка, и объяснить, почему порядок проверок важен."
  - "Использовать if как выражение: let label = if ... { ... } else { ... };"
  - "Объяснять ошибки: условие не bool, нет else у if-выражения, разные типы в ветках."
masteryCriteria:
  - "Ваша программа печатает правильный результат на границах диапазонов, а не только в середине."
  - "Вы не путаете = и == в условии и не ставите круглые скобки там, где они не нужны."
  - "Вы объясняете, почему обе ветки if-выражения должны давать значения одного типа."
concepts:
  introduces:
    - "rust.if"
    - "rust.else"
    - "rust.if-expression"
  uses:
    - "rust.bool"
    - "rust.comparison"
    - "rust.logical-operators"
    - "rust.i32"
    - "rust.str"
    - "rust.string"
    - "rust.stdin"
    - "rust.read-to-string"
    - "rust.lines"
    - "rust.unwrap"
    - "rust.trim"
    - "rust.parse"
    - "rust.inline-format"
    - "rust.let"
    - "rust.mut"
    - "rust.remainder"
    - "rust.assignment"
next:
  - "rust.from-zero.match"
tags:
  - "rust"
  - "if"
  - "else"
  - "condition"
  - "branching"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let n = 15;
            if n % 3 == 0 {
                println!("три");
            } else if n % 5 == 0 {
                println!("пять");
            } else {
                println!("ничего");
            }
        }
        ```
      options:
        - "три"
        - "пять"
        - "три и пять"
        - "ничего"
      answer: 0
      explanation: "Цепочка выполняет только первую подходящую ветку. 15 % 3 равно 0, поэтому печатается «три», а условие второй ветки не проверяется."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let temp = -3;
            let word = if temp < 0 {
                "мороз"
            } else if temp < 15 {
                "прохладно"
            } else {
                "тепло"
            };
            println!("{word}");
        }
        ```
      options:
        - "мороз"
        - "прохладно"
        - "тепло"
        - "Ошибка компиляции"
      answer: 0
      explanation: "if - выражение: переменная word получает значение выбранной ветки. temp < 0 истинно, значит word равно «мороз». Все ветки дают текст, поэтому типы совпадают."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let score = 95;
            if score >= 60 {
                println!("зачёт");
            } else if score >= 90 {
                println!("отлично");
            }
        }
        ```
      options:
        - "отлично"
        - "зачёт"
        - "зачёт и отлично"
        - "Ничего"
      answer: 1
      explanation: "Проверки идут сверху вниз, и срабатывает первая истинная: 95 >= 60. Ветка с «отлично» недостижима. Строгое условие нужно ставить раньше мягкого."
    - id: "q4"
      type: "single"
      prompt: |
        Почему этот код не компилируется?

        ```rust
        fn main() {
            let count = 3;
            if count {
                println!("есть");
            }
        }
        ```
      options:
        - "Потому что у if нет ветки else."
        - "Потому что условие должно быть bool, а count - целое число."
        - "Потому что переменная count не объявлена с mut."
        - "Потому что println! нельзя писать внутри if."
      answer: 1
      explanation: "Rust не считает число «истинным» или «ложным». Нужно сравнение, которое даёт bool: if count != 0. Ветка else необязательна, mut здесь не нужен."
    - id: "q5"
      type: "single"
      prompt: |
        Что нужно изменить, чтобы код компилировался?

        ```rust
        fn main() {
            let n = 5;
            let label = if n > 3 { "много" };
            println!("{label}");
        }
        ```
      options:
        - "Убрать точку с запятой."
        - "Добавить ветку else, которая тоже даёт текст."
        - "Заменить if на match."
        - "Заменить let на let mut."
      answer: 1
      explanation: "Когда if даёт значение, нужны все ветки: при ложном условии переменной тоже нужно что-то присвоить, причём значение того же типа, например else с текстом «мало»."
exercise:
  id: "rust.from-zero.if-else.exercise"
  title: "Цена билета"
  prompt: |
    В кинотеатре действуют такие правила. На вход подаются две строки: возраст зрителя (целое число) и слово `да` или `нет` - студент ли он.

    * младше 6 лет - категория `бесплатный`, цена 0;
    * от 6 до 17 лет включительно - категория `детский`, цена 200;
    * 65 лет и старше - категория `пенсионный`, цена 250;
    * остальные (18-64 года): если студент - категория `студенческий`, цена 300, иначе категория `взрослый`, цена 400.

    Программа печатает две строки:

    ```
    Категория: <категория>
    Цена: <цена>
    ```

    Пример. Ввод:

    ```
    20
    да
    ```

    Вывод:

    ```
    Категория: студенческий
    Цена: 300
    ```

    В заготовке ввод уже прочитан, а переменные `category` и `price` содержат значения для взрослого не студента. Измените их в нужных ветках цепочки `if` / `else if`. Команды `println!` менять не нужно.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Разберите условия сверху вниз: сначала возраст младше 6, потом возраст не больше 17, потом 65 и старше. Всё, что осталось, - от 18 до 64 лет, там вы выбираете между студентом и остальными."
    - "Каждая ветка присваивает оба значения: category = \"детский\"; price = 200; Переменные уже объявлены с mut."
    - "Для студента внутри последней ветки нужен вложенный if: if is_student { ... } else { ... }. Слово из ввода сравнивают так: student_word == \"да\"."
    - "Проверьте границы: 5 и 6 лет, 17 и 18 лет, 64 и 65 лет. Условие «до 17 включительно» - это age <= 17, «65 и старше» - age >= 65."
  tests:
    - id: "child"
      title: "10 лет, не студент"
      stdin: "10\nнет\n"
      expected: "Категория: детский\nЦена: 200\n"
      hint: "От 6 до 17 лет: категория детский, цена 200, студенческий статус не важен."
    - id: "student"
      title: "20 лет, студент"
      stdin: "20\nда\n"
      expected: "Категория: студенческий\nЦена: 300\n"
      hint: "От 18 до 64 лет студент платит 300 и получает категорию студенческий."
    - id: "adult"
      title: "30 лет, не студент (скрытый)"
      stdin: "30\nнет\n"
      expected: "Категория: взрослый\nЦена: 400\n"
      hidden: true
      hint: "От 18 до 64 лет без студенческого статуса: категория взрослый, цена 400."
    - id: "free"
      title: "3 года (скрытый)"
      stdin: "3\nнет\n"
      expected: "Категория: бесплатный\nЦена: 0\n"
      hidden: true
      hint: "Младше 6 лет: бесплатный, цена 0."
    - id: "border-5-6"
      title: "Границы 5 и 6 лет (скрытый)"
      stdin: "6\nнет\n"
      expected: "Категория: детский\nЦена: 200\n"
      hidden: true
      hint: "6 лет уже детский билет (age >= 6), а 5 - ещё бесплатный."
    - id: "border-17"
      title: "17 лет, студент (скрытый)"
      stdin: "17\nда\n"
      expected: "Категория: детский\nЦена: 200\n"
      hidden: true
      hint: "Студенческий статус действует только с 18 лет: в 17 лет остаётся детский билет."
    - id: "border-18"
      title: "18 лет (скрытый)"
      stdin: "18\nда\n"
      expected: "Категория: студенческий\nЦена: 300\n"
      hidden: true
      hint: "18 лет входит во взрослую группу: студент платит 300."
    - id: "border-64-65"
      title: "65 лет, студент (скрытый)"
      stdin: "65\nда\n"
      expected: "Категория: пенсионный\nЦена: 250\n"
      hidden: true
      hint: "С 65 лет категория пенсионный, цена 250, даже если человек студент. Проверяйте возраст 65 раньше студенческого статуса."
    - id: "border-64"
      title: "64 года, студент (скрытый)"
      stdin: "64\nда\n"
      expected: "Категория: студенческий\nЦена: 300\n"
      hidden: true
      hint: "64 года - ещё взрослая группа: студент платит 300."
