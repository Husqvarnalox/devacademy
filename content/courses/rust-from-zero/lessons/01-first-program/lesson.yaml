id: "rust.from-zero.first-program"
title: "Первая программа"
goal: "Собрать и запустить программу на Rust и изменить текст, который она выводит."
difficulty: "intro"
estimatedMinutes: 25
prerequisites: []
objectives:
  - "Объяснить, что такое программа, исходный код, язык программирования и компилятор."
  - "Узнавать в программе на Rust точку входа fn main() и команду печати println!."
  - "Вывести текст на экран и записать строку в двойных кавычках."
  - "Написать несколько команд подряд и предсказать порядок вывода."
masteryCriteria:
  - "Ваша программа печатает ровно заданную строку, включая регистр и знаки препинания."
  - "Вы отличаете текст в кавычках (его печатают как есть) от имени команды."
  - "Вы объясняете, что программа сначала переводится компилятором в исполняемый файл и только потом запускается."
concepts:
  introduces:
    - "rust.program"
    - "rust.compiler"
    - "rust.main-function"
    - "rust.println"
    - "rust.macro"
    - "rust.string-literal"
next:
  - "rust.from-zero.compiler-errors"
tags:
  - "rust"
  - "rustc"
  - "println"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что делает компилятор?"
      options:
        - "Переводит исходный код в исполняемый файл и по пути проверяет программу на ошибки."
        - "Печатает текст на экран."
        - "Хранит программы на сайте."
        - "Исправляет ошибки в программе самостоятельно."
      answer: 0
      explanation: "Компилятор читает исходный код, проверяет его и создаёт исполняемый файл, который компьютер умеет запускать. Он сообщает об ошибках, но сам их не исправляет: решение принимает человек."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            println!("раз");
            println!("два");
        }
        ```
      options:
        - "раздва"
        - "раз два (в одной строке)"
        - "раз, а на следующей строке два"
        - "два, а на следующей строке раз"
      answer: 2
      explanation: "Команды выполняются сверху вниз, а println! после текста переходит на новую строку. Поэтому «раз» и «два» оказываются на разных строках в том порядке, в каком написаны команды."
    - id: "q3"
      type: "single"
      prompt: |
        Что появится на экране после команды?

        ```rust
        println!("Привет");
        ```
      options:
        - "\"Привет\" вместе с кавычками"
        - "Привет без кавычек"
        - "Ничего: нужна ещё одна команда"
        - "println"
      answer: 1
      explanation: "Кавычки только показывают, где начинается и где заканчивается текст. На экран попадает содержимое между ними."
    - id: "q4"
      type: "single"
      prompt: |
        Компилятор сообщает об ошибке в этой команде. В чём она?

        ```rust
        println("Привет");
        ```
      options:
        - "Нет восклицательного знака: нужно println!(...)."
        - "Нельзя писать по-русски."
        - "Нужны одинарные кавычки."
        - "Ошибки нет."
      answer: 0
      explanation: "println! - макрос, и восклицательный знак входит в его имя. Без него Rust ищет обычную функцию println и не находит. Компилятор сам подсказывает: «use `!` to invoke the macro»."
exercise:
  id: "rust.from-zero.first-program.exercise"
  title: "Измените выводимую строку"
  prompt: |
    В редакторе уже есть рабочая программа: она печатает приветствие. Измените её так, чтобы она печатала ровно одну строку:

    ```
    Я учусь программировать на Rust!
    ```

    Менять нужно только текст в кавычках. Регистр букв, пробелы и восклицательный знак важны.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Найдите в программе команду println!: нужный текст находится между кавычками."
    - "Замените всё, что стоит между кавычками, на нужную фразу. Сами кавычки, скобки, восклицательный знак после println и точку с запятой оставьте."
    - "Должно получиться println!(\"Я учусь программировать на Rust!\");"
  tests:
    - id: "basic"
      title: "Печатается нужная фраза"
      stdin: ""
      expected: |
        Я учусь программировать на Rust!
      hint: "Программа должна напечатать одну строку: Я учусь программировать на Rust!"
    - id: "exact"
      title: "Точный текст и одна строка (скрытый)"
      stdin: ""
      expected: |
        Я учусь программировать на Rust!
      hidden: true
      hint: "Проверяется точное совпадение: заглавная Я, пробелы между словами, восклицательный знак в конце и никаких лишних строк."
