id: "rust.from-zero.type-conversion"
title: "Преобразование типов: parse и as"
goal: "Превращать введённый текст в числа через parse(), приводить числа друг к другу через as, получать текст из числа через to_string() и переиспользовать имя через затенение."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "rust.from-zero.reading-input"
objectives:
  - "Преобразовать строку в число записью let n: i32 = text.trim().parse().unwrap(); и объяснить, почему тип нужно указать."
  - "Привести число к другому числовому типу через as и знать, что as отбрасывает дробную часть и может обрезать большое значение."
  - "Получить текст из числа через to_string()."
  - "Применить затенение (let x = x.trim(); let x: i32 = x.parse().unwrap();) и объяснить, чем оно отличается от присваивания в let mut."
masteryCriteria:
  - "Ваша программа читает числа из ввода, преобразует их и считает с ними, не смешивая типы без as."
  - "Вы пишете as f64 перед делением, когда нужен дробный результат из целых чисел."
  - "Вы объясняете, почему i32 + i64 и f64 * i32 не компилируются."
concepts:
  introduces:
    - "rust.parse"
    - "rust.as-cast"
    - "rust.to-string"
    - "rust.shadowing"
  uses:
    - "rust.stdin"
    - "rust.read-to-string"
    - "rust.lines"
    - "rust.unwrap"
    - "rust.trim"
    - "rust.i32"
    - "rust.i64"
    - "rust.f64"
    - "rust.explicit-type"
    - "rust.integer-division"
    - "rust.mut"
    - "rust.string"
next:
  - "rust.from-zero.formatted-output"
tags:
  - "rust"
  - "parse"
  - "as"
  - "to_string"
  - "shadowing"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let text = "42";
            let n: i32 = text.parse().unwrap();
            println!("{}", n + 1);
        }
        ```
      options:
        - "421"
        - "43"
        - "Ошибка компиляции: нельзя сложить текст и число"
        - "42 + 1"
      answer: 1
      explanation: "parse() превращает текст «42» в число 42, а тип i32 указан в let. После этого n - обычное число, и n + 1 даёт 43. Если бы мы сложили саму строку с числом, компилятор отказал бы."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let total = 7;
            println!("{} {}", total / 2, total as f64 / 2.0);
        }
        ```
      options:
        - "3.5 3.5"
        - "3 3.5"
        - "3 3"
        - "4 3.5"
      answer: 1
      explanation: "Деление двух целых отбрасывает остаток: 7 / 2 = 3. После as f64 деление дробное: 7.0 / 2.0 = 3.5."
    - id: "q3"
      type: "single"
      prompt: |
        Чему равна переменная n?

        ```rust
        let f = 3.99;
        let n = f as i32;
        ```
      options:
        - "4 (округляется до ближайшего)"
        - "3 (дробная часть отбрасывается)"
        - "3.99"
        - "Ошибка: as нельзя применять к дробным числам"
      answer: 1
      explanation: "as при переходе от дробного числа к целому отбрасывает дробную часть без округления: 3.99 превращается в 3, а -3.99 - в -3."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let n = "5";
            let n: i32 = n.parse().unwrap();
            let n = n * 2;
            println!("{n}");
        }
        ```
      options:
        - "5"
        - "10"
        - "55"
        - "Ошибка компиляции: имя n уже занято"
      answer: 1
      explanation: "Каждый let создаёт новую переменную n, которая затеняет предыдущую (затенение). Сначала n - текст, затем число 5, затем число 10. Тип при этом может меняться."
    - id: "q5"
      type: "single"
      prompt: |
        Почему не компилируется следующий код?

        ```rust
        let a: i32 = 5;
        let b: i64 = 10;
        println!("{}", a + b);
        ```
      options:
        - "Нельзя складывать числа."
        - "Rust не смешивает разные числовые типы: нужно привести одно из них, например a as i64 + b."
        - "Нужно объявить a и b с mut."
        - "i64 нельзя печатать через println!."
      answer: 1
      explanation: "Rust не преобразует числа между типами неявно. Нужно явно привести одно из чисел так, чтобы типы совпали: a as i64 + b."
exercise:
  id: "rust.from-zero.type-conversion.exercise"
  title: "Стоимость по весу"
  prompt: |
    На вход подаются две строки: цена килограмма в рублях (может быть дробной, например `80.5`) и вес в граммах (целое число). Прочитайте их и напечатайте пять строк:

    ```
    Цена за кг: <цена>
    Вес, г: <вес>
    Стоимость: <цена * вес / 1000>
    Целых рублей: <целая часть стоимости>
    Цифр в записи веса: <сколько цифр в числе граммов>
    ```

    Пример. Ввод:

    ```
    80.5
    500
    ```

    Вывод:

    ```
    Цена за кг: 80.5
    Вес, г: 500
    Стоимость: 40.25
    Целых рублей: 40
    Цифр в записи веса: 3
    ```

    Подсказка о выводе: дробное число, у которого дробная часть равна нулю, команда `println!` печатает без `.0` (например, `30`). Это нормально, об управлении таким выводом - в следующем уроке.

    В заготовке обе строки уже прочитаны как текст. Преобразуйте их в числа тем же именем (затенением), посчитайте стоимость и дополните две последние строки.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Преобразование с сохранением имени: let price: f64 = price.parse().unwrap(); и то же для grams с типом i32."
    - "Стоимость: price * grams as f64 / 1000.0. Граммы нужно привести к f64, потому что дробное число нельзя умножать на i32."
    - "Целая часть стоимости: cost as i32. Это отбрасывает дробную часть без округления."
    - "Цифры в записи веса: превратите число в текст и посчитайте его длину: grams.to_string().len()."
  tests:
    - id: "basic"
      title: "80,5 руб. за кг, 500 г"
      stdin: |
        80.5
        500
      expected: |
        Цена за кг: 80.5
        Вес, г: 500
        Стоимость: 40.25
        Целых рублей: 40
        Цифр в записи веса: 3
      hint: "40.25 получается как 80.5 * 500 / 1000; целая часть - 40; в числе 500 три цифры."
    - id: "integer-price"
      title: "Целая цена"
      stdin: |
        120
        250
      expected: |
        Цена за кг: 120
        Вес, г: 250
        Стоимость: 30
        Целых рублей: 30
        Цифр в записи веса: 3
      hint: "Цену 120 тоже нужно разобрать как f64: parse::<f64> принимает и целые записи. Результат 30 печатается без дробной части."
    - id: "spaces"
      title: "Пробелы по краям и четыре цифры (скрытый)"
      stdin: "  99.5 \n  1750  \n"
      expected: |
        Цена за кг: 99.5
        Вес, г: 1750
        Стоимость: 174.125
        Целых рублей: 174
        Цифр в записи веса: 4
      hidden: true
      hint: "Перед parse() нужно trim(): пробелы по краям делают разбор невозможным. 99.5 * 1750 / 1000 = 174.125."
    - id: "zero"
      title: "Нулевой вес (скрытый)"
      stdin: |
        50
        0
      expected: |
        Цена за кг: 50
        Вес, г: 0
        Стоимость: 0
        Целых рублей: 0
        Цифр в записи веса: 1
      hidden: true
      hint: "Число 0 записывается одной цифрой; стоимость нулевая."
