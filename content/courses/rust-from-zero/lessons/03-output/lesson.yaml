id: "rust.from-zero.output"
title: "Вывод: print!, println! и подстановки"
goal: "Напечатать несколько строк и частей строки, подставить значения в текст и оставить в программе комментарии."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "rust.from-zero.compiler-errors"
objectives:
  - "Различать print! и println! и объяснять, чем они отличаются."
  - "Использовать \\n, \\\" и \\\\ внутри текста."
  - "Подставлять значения в текст с помощью {} и аргументов после запятой."
  - "Писать комментарии // и /* */ и понимать, что программа их пропускает."
masteryCriteria:
  - "Ваша программа собирает одну строку из двух команд print! и println!."
  - "Число {} в строке совпадает с числом значений после запятой."
  - "Вы объясняете, почему \"а\" + \"б\" не работает в Rust и чем это заменить."
concepts:
  introduces:
    - "rust.print"
    - "rust.escape-sequence"
    - "rust.placeholder"
    - "rust.comment"
  uses:
    - "rust.main-function"
    - "rust.println"
    - "rust.macro"
    - "rust.string-literal"
    - "rust.compile-error"
next:
  - "rust.from-zero.variables"
tags:
  - "rust"
  - "output"
  - "print"
  - "format"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            print!("a");
            print!("b");
            println!("c");
        }
        ```
      options:
        - "abc в одной строке"
        - "a, b и c в трёх разных строках"
        - "c"
        - "Ничего: print! не печатает"
      answer: 0
      explanation: "print! не переходит на новую строку, поэтому «a» и «b» остаются в той же строке, что и «c». Переход на новую строку выполняет только println! после своего текста."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает команда?

        ```rust
        println!("Итого: {} руб.", 450);
        ```
      options:
        - "Итого: {} руб."
        - "Итого: 450 руб."
        - "Итого: руб. 450"
        - "Ошибка: число нельзя печатать"
      answer: 1
      explanation: "Пара фигурных скобок {} - место для значения. Rust подставляет туда значение, указанное после запятой. Число печатается как есть."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает команда?

        ```rust
        println!("Он сказал \"да\"");
        ```
      options:
        - "Он сказал \\\"да\\\""
        - "Он сказал да"
        - "Он сказал \"да\" (с кавычками вокруг да)"
        - "Ошибка компиляции"
      answer: 2
      explanation: "Обратная косая черта перед кавычкой говорит: «эта кавычка - часть текста, а не конец литерала». На экране остаются только кавычки, без косой черты."
    - id: "q4"
      type: "single"
      prompt: |
        Что не так в этой команде?

        ```rust
        println!("{} и {}", 5);
        ```
      options:
        - "Число {} в строке (две) не совпадает с числом значений после запятой (одно)."
        - "Число 5 нельзя печатать."
        - "Нужна точка с запятой после кавычек."
        - "Ничего: команда верна."
      answer: 0
      explanation: "Компилятор считает {} и значения и сообщает: «2 positional arguments in format string, but there is 1 argument». Сколько {} - столько и значений. Лишнее значение тоже ошибка: «argument never used»."
    - id: "q5"
      type: "single"
      prompt: |
        Сколько строк напечатает команда?

        ```rust
        println!("раз\nдва\nтри");
        ```
      options:
        - "Одну"
        - "Две"
        - "Три"
        - "Четыре"
      answer: 2
      explanation: "\\n внутри текста означает переход на новую строку, а println! добавляет ещё один переход в конце. Слова «раз», «два», «три» окажутся на трёх разных строках."
exercise:
  id: "rust.from-zero.output.exercise"
  title: "Напечатайте чек"
  prompt: |
    Программа должна напечатать такой чек:

    ```
    === Чек №17 ===
    Хлеб: 45 руб.
    Молоко: 89 руб.
    Итого: 134 руб.
    Скидка "Постоянный клиент": 5%
    Спасибо за покупку!
    ```

    В заготовке уже есть первая строка и три строки с ценами, но вместо настоящих цен в них стоит `0`. Подставьте цены: хлеб - 45, молоко - 89, итого - 134. Затем допишите две последние команды по комментариям: строку с кавычками и строку «Спасибо за покупку!», собранную из двух команд (`print!` и `println!`).
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Значение для {} стоит после запятой, перед закрывающей скобкой: println!(\"Хлеб: {} руб.\", 45);"
    - "Кавычки внутри текста записывают с обратной косой чертой: \\\"Постоянный клиент\\\"."
    - "print!(\"Спасибо \"); печатает слово без перехода на новую строку, а следующая команда println!(\"за покупку!\"); допечатывает остаток и переходит на новую строку."
    - "Не забудьте пробел после слова «Спасибо» внутри кавычек print!, иначе слова слипнутся."
  tests:
    - id: "basic"
      title: "Печатается весь чек"
      stdin: ""
      expected: |
        === Чек №17 ===
        Хлеб: 45 руб.
        Молоко: 89 руб.
        Итого: 134 руб.
        Скидка "Постоянный клиент": 5%
        Спасибо за покупку!
      hint: "Должно быть шесть строк: заголовок, три строки с ценами, строка со скидкой в кавычках и благодарность."
    - id: "exact"
      title: "Точный текст и пробелы (скрытый)"
      stdin: ""
      expected: |
        === Чек №17 ===
        Хлеб: 45 руб.
        Молоко: 89 руб.
        Итого: 134 руб.
        Скидка "Постоянный клиент": 5%
        Спасибо за покупку!
      hidden: true
      hint: "Проверяется точное совпадение: кавычки вокруг «Постоянный клиент» должны быть в выводе, а последняя строка - одна строка «Спасибо за покупку!» с одним пробелом между словами."
