id: "rust.from-zero.comparison-and-logic"
title: "Сравнения и логика: ==, &&, ||, !"
goal: "Сравнивать значения операторами == != < <= > >=, соединять условия через && || ! и читать результат как bool; понимать, что сравнивать можно только значения одного типа."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "rust.from-zero.formatted-output"
objectives:
  - "Сравнивать числа, символы и строки операторами ==, !=, <, <=, >, >= и получать bool."
  - "Соединять условия через && (и), || (или) и инвертировать через ! (не); расставлять скобки по приоритету."
  - "Записывать диапазон как a >= 1 && a <= 10 и объяснять, почему 1 <= a <= 10 не работает."
  - "Объяснять, почему 5 == 5.0 и i32 == i64 не компилируются, и сравнивать String со строкой в кавычках."
masteryCriteria:
  - "Ваша программа вычисляет несколько bool-значений по входным данным и печатает их."
  - "Вы не путаете = (присваивание) и == (сравнение)."
  - "Вы расставляете скобки так, чтобы условие читалось однозначно, и понимаете приоритет &&, || и !."
concepts:
  introduces:
    - "rust.comparison"
    - "rust.logical-operators"
  uses:
    - "rust.bool"
    - "rust.i32"
    - "rust.f64"
    - "rust.char"
    - "rust.string"
    - "rust.str"
    - "rust.inline-format"
    - "rust.parse"
    - "rust.trim"
    - "rust.remainder"
    - "rust.explicit-type"
next:
  - "rust.from-zero.if-else"
tags:
  - "rust"
  - "comparison"
  - "logic"
  - "bool"
  - "operators"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let a = 7;
            let b = 3;
            println!("{} {}", a % 2 == 1, a > b * 3);
        }
        ```
      options:
        - "true true"
        - "true false"
        - "false false"
        - "1 0"
      answer: 1
      explanation: "7 % 2 равно 1, поэтому первое сравнение истинно. Во втором b * 3 равно 9, и 7 > 9 ложно. Арифметика выполняется раньше сравнения."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let age = 20;
            println!("{}", age >= 18 && age <= 65);
            println!("{}", age < 18 || age > 65);
        }
        ```
      options:
        - "true и true"
        - "true и false"
        - "false и true"
        - "false и false"
      answer: 1
      explanation: "20 попадает в диапазон от 18 до 65, поэтому && даёт true. Во второй строке оба условия ложны (20 не меньше 18 и не больше 65), поэтому || даёт false."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            println!("{}", true || false && false);
            println!("{}", (true || false) && false);
        }
        ```
      options:
        - "true и true"
        - "true и false"
        - "false и false"
        - "false и true"
      answer: 1
      explanation: "&& связывает сильнее, чем ||. Первое выражение читается как true || (false && false), то есть true || false = true. Во втором скобки меняют порядок: true && false = false."
    - id: "q4"
      type: "single"
      prompt: |
        Почему не компилируется такой код?

        ```rust
        let a = 5;
        let b = 5.0;
        println!("{}", a == b);
        ```
      options:
        - "Потому что 5 и 5.0 - разные числа."
        - "Потому что Rust не сравнивает значения разных типов: целое и дробное нужно привести к одному типу."
        - "Потому что == нельзя применять к переменным."
        - "Потому что a и b нужно объявить с mut."
      answer: 1
      explanation: "Сравнивать можно только значения одного типа. Здесь i32 и f64. Приведите одно к другому (a as f64 == b) или запишите оба числа одинаково."
    - id: "q5"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let word = String::from("кот");
            println!("{} {}", word == "кот", word == "Кот");
        }
        ```
      options:
        - "true true"
        - "true false"
        - "false false"
        - "Ошибка компиляции: String нельзя сравнивать с текстом в кавычках."
      answer: 1
      explanation: "String можно сравнивать с текстом в кавычках оператором ==. Сравнение посимвольное и различает регистр: «кот» и «Кот» разные."
exercise:
  id: "rust.from-zero.comparison-and-logic.exercise"
  title: "Допуск на горку"
  prompt: |
    На вход подаются три строки: возраст ребёнка (целое число), его рост в сантиметрах (целое число) и слово `да` или `нет` - есть ли разрешение родителей. Не используя пока ничего, кроме сравнений и логических операторов, вычислите и напечатайте шесть значений типа `bool`.

    Правила:

    * **Взрослый** - возраст не меньше 18;
    * **Школьник** - возраст от 7 до 17 включительно;
    * **Рост подходит** - рост не меньше 120;
    * **Разрешение родителей** - введено слово `да` (с маленькой буквы);
    * **Допуск на горку** - рост подходит, **и при этом** либо возраст не меньше 12, либо есть разрешение родителей;
    * **Отказ** - допуска на горку нет.

    Пример. Ввод:

    ```
    10
    130
    да
    ```

    Вывод:

    ```
    Взрослый: false
    Школьник: true
    Рост подходит: true
    Разрешение родителей: true
    Допуск на горку: true
    Отказ: false
    ```

    В заготовке ввод уже прочитан и преобразован, а все шесть значений равны `false`. Замените их на выражения. Команды `println!` менять не нужно.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Первое условие записывается так: let adult = age >= 18;"
    - "Диапазон от 7 до 17 включительно - два сравнения через &&: age >= 7 && age <= 17. Запись 7 <= age <= 17 в Rust не работает."
    - "Слово сравнивают оператором ==: permission == \"да\". Результат тоже bool."
    - "Допуск: tall_enough && (age >= 12 || has_permission). Скобки нужны: && связывает сильнее ||. Отказ - это !allowed."
  tests:
    - id: "basic"
      title: "10 лет, 130 см, с разрешением"
      stdin: |
        10
        130
        да
      expected: |
        Взрослый: false
        Школьник: true
        Рост подходит: true
        Разрешение родителей: true
        Допуск на горку: true
        Отказ: false
      hint: "Ребёнок 10 лет не взрослый, но школьник; рост 130 подходит; разрешение есть, поэтому допуск есть."
    - id: "no-permission"
      title: "10 лет, 130 см, без разрешения"
      stdin: |
        10
        130
        нет
      expected: |
        Взрослый: false
        Школьник: true
        Рост подходит: true
        Разрешение родителей: false
        Допуск на горку: false
        Отказ: true
      hint: "Рост подходит, но возраст меньше 12 и разрешения нет: условие в скобках ложно, поэтому допуска нет."
    - id: "boundary"
      title: "Границы: 12 лет и ровно 120 см (скрытый)"
      stdin: |
        12
        120
        нет
      expected: |
        Взрослый: false
        Школьник: true
        Рост подходит: true
        Разрешение родителей: false
        Допуск на горку: true
        Отказ: false
      hidden: true
      hint: "Границы входят в диапазон: 120 >= 120 и 12 >= 12 истинны. Для этого нужны >=, а не >."
    - id: "adult-short"
      title: "Взрослый ниже нормы (скрытый)"
      stdin: |
        18
        110
        нет
      expected: |
        Взрослый: true
        Школьник: false
        Рост подходит: false
        Разрешение родителей: false
        Допуск на горку: false
        Отказ: true
      hidden: true
      hint: "18 лет - уже не школьник по правилу «до 17 включительно». Рост 110 меньше 120, поэтому допуска нет, как бы ни был велик возраст."
    - id: "young"
      title: "Младше школьного возраста (скрытый)"
      stdin: |
        6
        100
        да
      expected: |
        Взрослый: false
        Школьник: false
        Рост подходит: false
        Разрешение родителей: true
        Допуск на горку: false
        Отказ: true
      hidden: true
      hint: "Разрешение само по себе не даёт допуска: рост 100 меньше 120, и первое условие через && ложно."
    - id: "upper-bound"
      title: "17 лет без разрешения (скрытый)"
      stdin: |
        17
        121
        нет
      expected: |
        Взрослый: false
        Школьник: true
        Рост подходит: true
        Разрешение родителей: false
        Допуск на горку: true
        Отказ: false
      hidden: true
      hint: "17 входит в диапазон школьников (<= 17), а возраст не меньше 12 заменяет разрешение родителей."
