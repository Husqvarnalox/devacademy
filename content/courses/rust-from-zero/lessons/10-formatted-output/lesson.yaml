id: "rust.from-zero.formatted-output"
title: "Форматированный вывод: {:.2}, ширина, выравнивание"
goal: "Управлять видом чисел и текста в println! и format!: задавать число знаков после запятой, ширину поля, выравнивание, заполнитель и нули слева."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "rust.from-zero.type-conversion"
objectives:
  - "Напечатать дробное число с заданным числом знаков после запятой через {:.2}."
  - "Задать ширину поля и выравнивание: {:5}, {:<8}, {:>8}, {:^8}, а также заполнитель: {:*>8}, {:-^20}."
  - "Дополнить число нулями слева ({:05}) и показать знак ({:+}); сочетать ширину и точность ({:>10.2})."
  - "Собрать строку по формату через format! и объяснить, что формат не зависит от локали."
masteryCriteria:
  - "Ваша программа печатает таблицу или чек с ровными колонками без ручного подсчёта пробелов."
  - "Вы выбираете {:.2} для денег и понимаете, что оно округляет, а не обрезает."
  - "Вы отличаете выравнивание текста от выравнивания чисел и знаете, что по умолчанию текст прижимается влево, а число вправо."
concepts:
  introduces:
    - "rust.format-spec"
    - "rust.precision"
    - "rust.width-alignment"
    - "rust.format-macro"
  uses:
    - "rust.placeholder"
    - "rust.inline-format"
    - "rust.f64"
    - "rust.i32"
    - "rust.string"
    - "rust.str"
    - "rust.parse"
    - "rust.as-cast"
    - "rust.stdin"
    - "rust.trim"
next:
  - "rust.from-zero.comparison-and-logic"
tags:
  - "rust"
  - "format"
  - "println"
  - "precision"
  - "alignment"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let pi = 3.14159;
            println!("{:.2}", pi);
        }
        ```
      options:
        - "3.14159"
        - "3.14"
        - "3.1"
        - "3"
      answer: 1
      explanation: "Запись {:.2} означает «два знака после запятой». Число округляется до 3.14."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа (квадратные скобки показывают границы поля)?

        ```rust
        fn main() {
            println!("[{:>5}]", 45);
        }
        ```
      options:
        - "[45   ]"
        - "[   45]"
        - "[ 45  ]"
        - "[45]"
      answer: 1
      explanation: "{:>5} - поле шириной 5 с выравниванием вправо. Число из двух цифр дополняется тремя пробелами слева."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            println!("{:05}", 42);
        }
        ```
      options:
        - "42"
        - "00042"
        - "42000"
        - "Ошибка компиляции"
      answer: 1
      explanation: "{:05} - поле шириной 5, свободное место слева заполняется нулями: 00042."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            println!("[{:^6}]", "ab");
        }
        ```
      options:
        - "[ab    ]"
        - "[    ab]"
        - "[  ab  ]"
        - "[ ab   ]"
      answer: 2
      explanation: "{:^6} центрирует текст в поле шириной 6: два пробела слева и два справа. (Если пробелов нечётное число, лишний ставится справа.)"
    - id: "q5"
      type: "single"
      prompt: |
        Чем format! отличается от println!?
      options:
        - "Ничем: оба печатают текст на экран."
        - "format! не печатает, а возвращает собранную строку String; формат записывается так же."
        - "format! работает только с числами."
        - "format! добавляет в конец перевод строки."
      answer: 1
      explanation: "format! собирает текст по тем же правилам, но возвращает его как String, который можно сохранить в переменной и использовать позже."
exercise:
  id: "rust.from-zero.formatted-output.exercise"
  title: "Ровный чек"
  prompt: |
    На вход подаются три строки: название товара, цена за штуку (может быть дробной) и количество штук (целое). Напечатайте чек строго такого вида (для ввода `Чай`, `45.5`, `3`):

    ```
    ====== Чек =======
    Товар:         Чай
    Цена:        45.50
    Кол-во:          3
    Сумма:      136.50
    ==================
    ```

    Правила:

    * заголовок - слово ` Чек ` (с пробелами по краям), по центру поля шириной 18, свободное место заполнено знаками `=`;
    * подписи (`Товар:`, `Цена:`, `Кол-во:`, `Сумма:`) прижаты влево в поле шириной 8;
    * значения прижаты вправо в поле шириной 10; цена и сумма - с двумя знаками после запятой, количество - целое;
    * последняя строка - 18 знаков `=`.

    В заготовке ввод уже прочитан и преобразован, сумма посчитана. Вам нужно заменить команды `println!` так, чтобы вывод точно совпал с образцом.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Заголовок: println!(\"{:=^18}\", \" Чек \"); - символ после двоеточия задаёт заполнитель, ^ - центрирование, 18 - ширину."
    - "Строка с товаром: println!(\"{:<8}{:>10}\", \"Товар:\", name); - два поля подряд: подпись слева (8), значение справа (10)."
    - "Для цены и суммы к ширине добавьте точность: {:>10.2}. Для количества точность не нужна: {:>10}."
    - "Пробелы считаются так же, как буквы: подпись «Кол-во:» занимает 7 знаков, поэтому поле шириной 8 добавит к ней один пробел."
  tests:
    - id: "basic"
      title: "Чай, 45.5, 3 штуки"
      stdin: |
        Чай
        45.5
        3
      expected: |
        ====== Чек =======
        Товар:         Чай
        Цена:        45.50
        Кол-во:          3
        Сумма:      136.50
        ==================
      hint: "Каждая строка длиной 18 знаков: подпись в поле 8 и значение в поле 10; цена и сумма с двумя знаками после запятой."
    - id: "whole-price"
      title: "Целая цена и двузначное количество"
      stdin: |
        Соль
        19
        10
      expected: |
        ====== Чек =======
        Товар:        Соль
        Цена:        19.00
        Кол-во:         10
        Сумма:      190.00
        ==================
      hint: "Цена 19 должна печататься как 19.00: {:.2} добавляет нули."
    - id: "rounding"
      title: "Округление суммы (скрытый)"
      stdin: |
        Мёд
        0.1
        3
      expected: |
        ====== Чек =======
        Товар:         Мёд
        Цена:         0.10
        Кол-во:          3
        Сумма:        0.30
        ==================
      hidden: true
      hint: "0.1 * 3 в двоичной арифметике равно 0.30000000000000004; {:.2} округляет до 0.30. Ширина считается по буквам, а не по байтам."
    - id: "latin"
      title: "Латиница и дробная цена (скрытый)"
      stdin: |
        Sugar
        99.99
        2
      expected: |
        ====== Чек =======
        Товар:       Sugar
        Цена:        99.99
        Кол-во:          2
        Сумма:      199.98
        ==================
      hidden: true
      hint: "99.99 * 2 = 199.98. Название «Sugar» занимает 5 знаков из 10, остальное - пробелы слева."
