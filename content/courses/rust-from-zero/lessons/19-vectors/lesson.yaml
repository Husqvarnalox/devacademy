id: "rust.from-zero.vectors"
title: "Векторы: список значений"
goal: "Хранить несколько значений одного типа в Vec<i32>: создавать, добавлять, читать по индексу, перебирать, сортировать и передавать в функции по ссылке."
difficulty: "easy"
estimatedMinutes: 55
prerequisites:
  - "rust.from-zero.option-and-result"
objectives:
  - "Создать вектор через vec![...] и Vec::new(), добавлять элементы через push и узнавать размер через len()."
  - "Читать и менять элемент по индексу v[i] и объяснить, почему индекс - usize, а выход за границы останавливает программу."
  - "Перебирать вектор через for x in &v, разыменовывая элемент (*x) при сравнении, и вычислять сумму, подсчёт и максимум."
  - "Использовать sort, contains, iter().sum::<i32>() и печатать вектор через {:?}."
  - "Передавать вектор в функцию как &Vec<i32> и &mut Vec<i32>."
masteryCriteria:
  - "Вы собираете числа из ввода в Vec, пропуская неверные строки, и не путаете индекс с элементом."
  - "Вы пишете функции над &Vec<i32>, а не отдаёте вектор во владение без нужды."
  - "Вы читаете ошибки E0277, E0596, E0308 и E0382 для векторов и знаете причину паники «index out of bounds»."
concepts:
  introduces:
    - "rust.vec"
    - "rust.vec-index"
    - "rust.vec-iteration"
    - "rust.debug-format"
  uses:
    - "rust.option"
    - "rust.if-let"
    - "rust.result"
    - "rust.match"
    - "rust.match-arm"
    - "rust.function"
    - "rust.parameter"
    - "rust.return"
    - "rust.reference"
    - "rust.mut-reference"
    - "rust.move"
    - "rust.for"
    - "rust.range"
    - "rust.if"
    - "rust.lines"
    - "rust.trim"
    - "rust.parse"
    - "rust.unwrap"
    - "rust.stdin"
    - "rust.read-to-string"
    - "rust.i32"
    - "rust.usize"
    - "rust.mut"
    - "rust.compound-assignment"
    - "rust.inline-format"
    - "rust.format-macro"
    - "rust.comparison"
    - "rust.method-call"
    - "rust.string"
next:
  - "rust.from-zero.hash-maps"
tags:
  - "rust"
  - "vec"
  - "vector"
  - "collections"
  - "index"
  - "iteration"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let v = vec![10, 20, 30];
            println!("{} {}", v.len(), v[v.len() - 1]);
        }
        ```
      options:
        - "3 30"
        - "3 20"
        - "2 30"
        - "30 3"
      answer: 0
      explanation: "В векторе три элемента, поэтому len() равен 3. Последний элемент лежит по индексу len() - 1, то есть v[2] = 30."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let mut v = vec![5, 3, 9];
            v.push(1);
            v.sort();
            println!("{:?} {}", v, v[0]);
        }
        ```
      options:
        - "[1, 3, 5, 9] 1"
        - "[5, 3, 9, 1] 5"
        - "[1, 3, 5, 9] 9"
        - "[9, 5, 3, 1] 9"
      answer: 0
      explanation: "push добавляет 1 в конец: [5, 3, 9, 1]. sort упорядочивает по возрастанию: [1, 3, 5, 9]. Первый элемент v[0] теперь 1."
    - id: "q3"
      type: "single"
      prompt: |
        Почему этот код не компилируется?

        ```rust
        fn main() {
            let v = vec![1, 2];
            v.push(3);
            println!("{:?}", v);
        }
        ```
      options:
        - "Потому что push нельзя вызывать у vec!."
        - "Потому что v объявлен без mut, а push меняет вектор."
        - "Потому что вектор нельзя печатать через {:?}."
        - "Потому что в векторе должно быть минимум три элемента."
      answer: 1
      explanation: "push меняет вектор, поэтому переменная должна быть объявлена как let mut v. Это то же правило, что и для чисел и строк."
    - id: "q4"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```rust
        fn main() {
            let v = vec![1, 2, 3];
            println!("начало");
            println!("{}", v[3]);
        }
        ```
      options:
        - "Напечатается начало, затем 0."
        - "Напечатается начало, затем программа остановится с паникой «index out of bounds»."
        - "Программа не скомпилируется."
        - "Напечатается только 3."
      answer: 1
      explanation: "Допустимые индексы - 0, 1 и 2. Индекс 3 выходит за границы, v[3] вызывает панику во время работы. Строка «начало» успевает напечататься."
    - id: "q5"
      type: "single"
      prompt: "Что произойдёт с вектором v после цикла `for x in v { ... }` (без &)?"
      options:
        - "Ничего: v остаётся доступным."
        - "v перемещён в цикл и после него использовать его нельзя."
        - "v очищается, но остаётся доступным."
        - "Цикл не скомпилируется: перебирать вектор можно только по индексам."
      answer: 1
      explanation: "for x in v забирает вектор во владение цикла. Чтобы продолжить пользоваться v после цикла, нужно писать for x in &v."
exercise:
  id: "rust.from-zero.vectors.exercise"
  title: "Измерения температуры"
  prompt: |
    В упражнении `main` уже написан. Он читает ввод: первая строка - порог температуры (целое число), остальные строки - измерения. Верные измерения собираются в вектор, строки, которые не число, пропускаются. Затем `main` печатает размер вектора и вызывает две ваши функции. Напишите их.

    1. `count_above(values: &Vec<i32>, limit: i32) -> i32` - сколько измерений **строго больше** порога.
    2. `largest(values: &Vec<i32>) -> Option<i32>` - наибольшее измерение, или `None`, если вектор пуст.

    Пример. Ввод:

    ```
    20
    18
    25
    abc
    31
    20
    ```

    Вывод:

    ```
    Измерений: 4
    Выше 20: 2
    Максимум: 31
    ```

    В заготовке функции пока возвращают `0` и `None`. Замените их, `main` не меняйте.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "count_above: заведите счётчик let mut count = 0; и пройдите по вектору циклом for v in values. Параметр values уже ссылка, поэтому & не нужен."
    - "Внутри цикла сравнивайте *v > limit (v - ссылка на элемент, звёздочка берёт число) и увеличивайте счётчик. В конце верните count без точки с запятой."
    - "largest: если values.len() == 0, верните None. Иначе начните с первого элемента: let mut best = values[0]; и обновляйте best, когда встречаете большее число."
    - "Не начинайте best с 0: тогда для вектора из отрицательных чисел вы вернёте неверный максимум. Результат оберните в Some(best)."
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "20\n18\n25\nabc\n31\n20\n"
      expected: "Измерений: 4\nВыше 20: 2\nМаксимум: 31\n"
      hint: "Верных измерений четыре (abc пропускается); строго выше 20 два: 25 и 31; максимум 31."
    - id: "all-below"
      title: "Все ниже порога"
      stdin: "30\n10\n15\n29\n"
      expected: "Измерений: 3\nВыше 30: 0\nМаксимум: 29\n"
      hint: "Выше порога нет ни одного измерения, максимум 29."
    - id: "negatives"
      title: "Только отрицательные (скрытый)"
      stdin: "-10\n-5\n-3\n-9\n"
      expected: "Измерений: 3\nВыше -10: 3\nМаксимум: -3\n"
      hidden: true
      hint: "Максимум среди отрицательных - наибольшее по значению (-3), а не 0; выше порога -10 все три."
    - id: "equal"
      title: "Равные порогу (скрытый)"
      stdin: "5\n5\n5\n5\n"
      expected: "Измерений: 3\nВыше 5: 0\nМаксимум: 5\n"
      hidden: true
      hint: "Условие «строго больше»: значения, равные порогу, не считаются."
    - id: "no-measurements"
      title: "Только порог (скрытый)"
      stdin: "10\n"
      expected: "Измерений: 0\nВыше 10: 0\nМаксимум: нет данных\n"
      hidden: true
      hint: "Вектор пуст: largest возвращает None, main печатает «нет данных», count_above даёт 0."
    - id: "bad-lines"
      title: "Мусор и пробелы (скрытый)"
      stdin: " 15 \nxyz\n\n40\n3.5\n 7\n"
      expected: "Измерений: 2\nВыше 15: 1\nМаксимум: 40\n"
      hidden: true
      hint: "Пробелы по краям игнорируются, а нечисловые строки (xyz, пустая, 3.5) пропускаются; верные: 40 и 7 при пороге 15."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: "Измерений: 0\nВыше 0: 0\nМаксимум: нет данных\n"
      hidden: true
      hint: "Без ввода порог равен 0, измерений нет: Измерений: 0, Выше 0: 0, Максимум: нет данных."
