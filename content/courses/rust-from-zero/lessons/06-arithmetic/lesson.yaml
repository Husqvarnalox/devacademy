id: "rust.from-zero.arithmetic"
title: "Арифметика"
goal: "Выполнять сложение, вычитание, умножение, деление и остаток над числами одного типа и понимать, что делает целочисленное деление."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "rust.from-zero.basic-types"
objectives:
  - "Использовать операции + - * / % и скобки, учитывая приоритет."
  - "Объяснять, почему 7 / 2 даёт 3, и находить остаток от деления."
  - "Обновлять переменную через +=, -=, *=, /= и %=."
  - "Понимать, что числа разных типов (i32 и i64, целое и дробное) нельзя смешивать без явного приведения."
masteryCriteria:
  - "Ваша программа считает сдачу, часы и минуты и стоимость нескольких товаров."
  - "Вы предсказываете результат 17 / 5 и 17 % 5 до запуска."
  - "Вы читаете ошибку mismatched types и находите два числа разных типов в выражении."
concepts:
  introduces:
    - "rust.arithmetic"
    - "rust.integer-division"
    - "rust.remainder"
    - "rust.compound-assignment"
  uses:
    - "rust.variable"
    - "rust.let"
    - "rust.mut"
    - "rust.assignment"
    - "rust.i32"
    - "rust.f64"
    - "rust.i64"
    - "rust.type-inference"
    - "rust.inline-format"
next:
  - "rust.from-zero.strings"
tags:
  - "rust"
  - "arithmetic"
  - "integer-division"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            println!("{} {}", 17 / 5, 17 % 5);
        }
        ```
      options:
        - "3 2"
        - "3.4 2"
        - "2 3"
        - "4 2"
      answer: 0
      explanation: "Деление целых чисел отбрасывает дробную часть: 17 / 5 = 3, а остаток 17 - 3 * 5 = 2 даёт операция %."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            println!("{} {}", 7 / 2, 7.0 / 2.0);
        }
        ```
      options:
        - "3.5 3.5"
        - "3 3.5"
        - "3 3"
        - "4 3.5"
      answer: 1
      explanation: "Первое деление целое: результат 3. Второе - дробное, поэтому получается 3.5. Тип чисел определяет вид деления."
    - id: "q3"
      type: "single"
      prompt: |
        Чему равно значение выражения?

        ```rust
        2 + 3 * 4
        ```
      options:
        - "20"
        - "14"
        - "24"
        - "9"
      answer: 1
      explanation: "Умножение выполняется раньше сложения: сначала 3 * 4 = 12, затем 2 + 12 = 14. Чтобы изменить порядок, нужны скобки: (2 + 3) * 4 = 20."
    - id: "q4"
      type: "single"
      prompt: |
        Что сообщит компилятор?

        ```rust
        fn main() {
            let a: i32 = 5;
            let b: i64 = 10;
            println!("{}", a + b);
        }
        ```
      options:
        - "Выведется 15."
        - "Ошибка: нельзя сложить i32 и i64 (mismatched types)."
        - "Выведется 5 10."
        - "Предупреждение, но программа запустится."
      answer: 1
      explanation: "В Rust нет неявных преобразований между числовыми типами: i32 и i64 - разные типы. Приведение выполняют явно (урок про преобразование типов)."
    - id: "q5"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let mut x = 10;
            x += 3;
            x *= 2;
            println!("{x}");
        }
        ```
      options:
        - "13"
        - "26"
        - "16"
        - "23"
      answer: 1
      explanation: "x += 3 даёт 13, затем x *= 2 даёт 26. Составное присваивание x op= y работает как x = x op y."
exercise:
  id: "rust.from-zero.arithmetic.exercise"
  title: "Сдача, время и бонусы"
  prompt: |
    В заготовке заданы цена товара 235, оплата 500, продолжительность 135 минут и стартовый бонус 10. Допишите вычисления, чтобы программа напечатала:

    ```
    Сдача: 265
    Длительность: 2 ч 15 мин
    Три товара: 705 руб.
    Бонусных баллов: 30
    ```

    Нужно найти сдачу (оплата минус цена), часы и минуты (целая часть и остаток от деления на 60), стоимость трёх товаров и новое значение `bonus` (прибавить 5, затем умножить на 2). Команды `println!` менять не нужно.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Вместо 0 в каждом let впишите выражение: например, let change = paid - price;"
    - "Целая часть деления: total_minutes / 60. Остаток: total_minutes % 60. Три товара: price * 3."
    - "bonus уже объявлен с mut. Добавьте две команды: bonus += 5; и bonus *= 2; обе до println!."
    - "Должно получиться: change = paid - price; hours = total_minutes / 60; minutes = total_minutes % 60; three_items = price * 3; bonus += 5; bonus *= 2;"
  tests:
    - id: "basic"
      title: "Все четыре результата"
      stdin: ""
      expected: |
        Сдача: 265
        Длительность: 2 ч 15 мин
        Три товара: 705 руб.
        Бонусных баллов: 30
      hint: "Должно быть четыре строки: сдача 265, время 2 ч 15 мин, три товара 705 и бонус 30."
    - id: "order"
      title: "Порядок операций с бонусом (скрытый)"
      stdin: ""
      expected: |
        Сдача: 265
        Длительность: 2 ч 15 мин
        Три товара: 705 руб.
        Бонусных баллов: 30
      hidden: true
      hint: "Бонус: сначала += 5 (получится 15), потом *= 2 (получится 30). Если порядок обратный, результат будет 25."
