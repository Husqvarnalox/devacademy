id: "rust.from-zero.compiler-errors"
title: "Как читать сообщения об ошибках"
goal: "Прочитать сообщение rustc, найти по нему строку и вид ошибки и исправить программу, в которой ошибок несколько."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "rust.from-zero.first-program"
objectives:
  - "Найти в сообщении rustc файл, строку, столбец, код и текст ошибки."
  - "Использовать строку help и указатель ^^^ как подсказку к исправлению."
  - "Исправлять ошибки по одной, перезапуская программу после каждой правки."
  - "Отличать ошибку (error), которая останавливает сборку, от предупреждения (warning)."
masteryCriteria:
  - "Вы называете строку и столбец ошибки по адресу вида --> main.rs:3:5."
  - "Вы знаете, что сообщения идут не обязательно в порядке строк и что одна правка может убрать сразу несколько сообщений."
  - "Ваша исправленная программа собирается и печатает заданные четыре строки."
concepts:
  introduces:
    - "rust.compile-error"
    - "rust.error-location"
  uses:
    - "rust.main-function"
    - "rust.println"
    - "rust.macro"
    - "rust.string-literal"
next:
  - "rust.from-zero.output"
tags:
  - "rust"
  - "compiler"
  - "errors"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что означает адрес в сообщении компилятора?

        ```text
         --> main.rs:7:12
        ```
      options:
        - "Файл main.rs, строка 7, столбец 12."
        - "Ошибка встречается в main.rs 7 раз, на 12 строках."
        - "Версия компилятора 7.12."
        - "Нужно исправить 7 строк и 12 символов."
      answer: 0
      explanation: "Адрес состоит из имени файла, номера строки и номера столбца (позиции символа в строке). Нумерация начинается с единицы."
    - id: "q2"
      type: "single"
      prompt: "Компилятор показал три ошибки сразу. С чего лучше начать?"
      options:
        - "С самой нижней: она точно главная."
        - "С первой в списке: исправить, запустить снова и прочитать новый список."
        - "Переписать программу целиком."
        - "Игнорировать сообщения: программа всё равно запустится."
      answer: 1
      explanation: "Одна причина часто вызывает несколько сообщений, а исправление одной ошибки может открыть следующую (компилятор доходит до новых стадий проверки). Поэтому чинят по одной, начиная с первой, и каждый раз запускают заново."
    - id: "q3"
      type: "single"
      prompt: |
        В сообщении есть такие строки. Что нужно сделать?

        ```text
        help: use `!` to invoke the macro
          |
        3 |     println!("Сумма");
          |            +
        ```
      options:
        - "Добавить восклицательный знак после println."
        - "Убрать скобки."
        - "Удалить строку 3."
        - "Заменить println на print."
      answer: 0
      explanation: "Строка help показывает исправленный код, а знак + под ним отмечает, что именно добавляется: здесь это восклицательный знак. Прежде чем применять совет, прочитайте его: он подходит не всегда, но часто верен."
    - id: "q4"
      type: "single"
      prompt: "Чем предупреждение (warning) отличается от ошибки (error)?"
      options:
        - "Ничем: оба останавливают сборку."
        - "Предупреждение не останавливает сборку: программа соберётся, но компилятор советует что-то проверить."
        - "Предупреждения бывают только у опытных программистов."
        - "Предупреждение значит, что программа уже запущена."
      answer: 1
      explanation: "Ошибка (error) мешает собрать исполняемый файл. Предупреждение (warning) говорит, что код допустим, но, скорее всего, в нём что-то лишнее или подозрительное. Читать его стоит всё равно."
exercise:
  id: "rust.from-zero.compiler-errors.exercise"
  title: "Исправьте три ошибки"
  prompt: |
    Программа должна напечатать четыре строки, но не собирается: в ней три ошибки разных видов. Исправьте их, **не меняя текст**, который нужно напечатать:

    ```
    Заказ принят
    Сумма: 450 руб.
    Спасибо за покупку!
    Приходите ещё!
    ```

    Исправляйте по одной ошибке: запустите программу, прочитайте первое сообщение, исправьте, запустите снова. Новое сообщение может появиться уже после исправления предыдущего.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Сначала запустите программу и прочитайте первое сообщение: оно называет строку, столбец и вид ошибки."
    - "Одна из ошибок - в команде на третьей строке: у println не хватает важного знака. Другая - после команды на четвёртой строке."
    - "В пятой строке слово Println начинается с заглавной буквы; макрос называется иначе. Сообщение с help покажет верное имя."
    - "Верны четыре команды println!(\"...\"); и закрывающая скобка } на последней строке."
  tests:
    - id: "basic"
      title: "Программа собирается и печатает четыре строки"
      stdin: ""
      expected: |
        Заказ принят
        Сумма: 450 руб.
        Спасибо за покупку!
        Приходите ещё!
      hint: "Добавьте пропущенный восклицательный знак, пропущенную точку с запятой и исправьте регистр в названии макроса, чтобы программа собралась и напечатала четыре строки."
    - id: "exact"
      title: "Текст не изменён (скрытый)"
      stdin: ""
      expected: |
        Заказ принят
        Сумма: 450 руб.
        Спасибо за покупку!
        Приходите ещё!
      hidden: true
      hint: "Проверяется точное совпадение текста: слова, пробелы, точка после «руб», восклицательный знак и «ещё» с буквой ё. Менять нужно только синтаксис, а не сами фразы."
