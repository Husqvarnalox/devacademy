id: "rust.from-zero.variables"
title: "Переменные: let и let mut"
goal: "Сохранить значение в переменной, использовать его в выводе и изменить там, где это разрешено через mut."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "rust.from-zero.output"
objectives:
  - "Объявлять переменную командой let и давать ей понятное имя."
  - "Подставлять переменную в текст через {имя} и через {}."
  - "Объяснять, почему переменная по умолчанию не меняется, и разрешать изменение через let mut."
  - "Читать сообщения E0384 (повторное присваивание) и E0425 (имя не найдено)."
masteryCriteria:
  - "Ваша программа объявляет переменные и печатает их значения в заданном формате."
  - "Вы ставите mut только у тех переменных, которым присваивают новое значение."
  - "Вы отличаете объявление let count = 3; от присваивания count = 3;."
concepts:
  introduces:
    - "rust.variable"
    - "rust.let"
    - "rust.mut"
    - "rust.assignment"
    - "rust.type-inference"
    - "rust.i32"
    - "rust.inline-format"
  uses:
    - "rust.main-function"
    - "rust.println"
    - "rust.placeholder"
    - "rust.string-literal"
    - "rust.compile-error"
next:
  - "rust.from-zero.basic-types"
tags:
  - "rust"
  - "variables"
  - "let"
  - "mut"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let mut count = 2;
            count = 5;
            println!("{count}");
        }
        ```
      options:
        - "2"
        - "5"
        - "count"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Переменная объявлена с mut, поэтому ей можно присвоить новое значение. Последнее присвоенное значение - 5."
    - id: "q2"
      type: "single"
      prompt: |
        Что сообщит компилятор?

        ```rust
        fn main() {
            let total = 100;
            total = 120;
            println!("{total}");
        }
        ```
      options:
        - "Выведется 120."
        - "Выведется 100."
        - "Ошибка E0384: нельзя присвоить значение неизменяемой переменной второй раз."
        - "Предупреждение, но программа запустится."
      answer: 2
      explanation: "Без mut переменная неизменяема. Компилятор останавливает сборку и в подсказке советует: let mut total."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let a = 7;
            let mut b = a;
            b = 10;
            println!("{a} {b}");
        }
        ```
      options:
        - "7 7"
        - "10 10"
        - "7 10"
        - "10 7"
      answer: 2
      explanation: "let mut b = a; копирует число 7 в новую переменную. Присваивание b = 10 меняет только b, а a остаётся равной 7."
    - id: "q4"
      type: "single"
      prompt: |
        Что не так в этом коде?

        ```rust
        fn main() {
            price = 45;
            println!("{price}");
        }
        ```
      options:
        - "Нужно объявить переменную: let price = 45;"
        - "Нужно написать Price с заглавной буквы."
        - "Число 45 слишком велико."
        - "Ничего: код верен."
      answer: 0
      explanation: "Присваивать можно только уже объявленной переменной. Первый раз имя вводят командой let; компилятор так и подсказывает: «you might have meant to introduce a new binding»."
exercise:
  id: "rust.from-zero.variables.exercise"
  title: "Корзина в булочной"
  prompt: |
    В заготовке программа печатает данные о покупке, но значения неверные. Исправьте её, чтобы она печатала ровно:

    ```
    Магазин: Булочная
    Товар: Булка, 45 руб.
    В корзине: 2
    Добавили ещё одну булку
    В корзине: 3
    ```

    Нужно сделать три вещи: заменить название и цену товара, разрешить переменной `count` меняться и записать в неё число 3 после строки «Добавили ещё одну булку». Команды `println!` менять не нужно.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Название товара - текст в кавычках, цена - число без кавычек."
    - "Если переменная должна измениться, при объявлении после let ставят слово mut: let mut count = 2;"
    - "Новое значение записывают без let: count = 3; Команду ставят между последними двумя println!."
    - "Должно получиться: let item = \"Булка\"; let price = 45; let mut count = 2; ... count = 3;"
  tests:
    - id: "basic"
      title: "Корзина обновляется"
      stdin: ""
      expected: |
        Магазин: Булочная
        Товар: Булка, 45 руб.
        В корзине: 2
        Добавили ещё одну булку
        В корзине: 3
      hint: "Должно быть пять строк. Количество сначала 2, потом 3; товар - Булка по цене 45."
    - id: "exact"
      title: "Присваивание, а не новая переменная (скрытый)"
      stdin: ""
      expected: |
        Магазин: Булочная
        Товар: Булка, 45 руб.
        В корзине: 2
        Добавили ещё одну булку
        В корзине: 3
      hidden: true
      hint: "Последняя строка должна показать 3: значение меняется присваиванием count = 3; в той же переменной, объявленной с mut."
