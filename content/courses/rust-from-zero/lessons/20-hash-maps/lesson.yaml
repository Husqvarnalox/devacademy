id: "rust.from-zero.hash-maps"
title: "Словари HashMap: значения по ключу"
goal: "Хранить пары «ключ - значение» в HashMap<String, i32>: добавлять, искать, считать повторения через entry().or_insert() и выводить содержимое в предсказуемом порядке."
difficulty: "easy"
estimatedMinutes: 55
prerequisites:
  - "rust.from-zero.vectors"
objectives:
  - "Подключить HashMap через use и создать HashMap<String, i32> с insert, get, contains_key и len."
  - "Считать повторения через *map.entry(ключ).or_insert(0) += 1."
  - "Перебирать пары (ключ, значение) и объяснить, почему порядок HashMap не определён."
  - "Получить стабильный вывод: собрать ключи в Vec, отсортировать и обратиться к значениям по ключу."
  - "Передавать словарь в функции как &HashMap и &mut HashMap."
masteryCriteria:
  - "Вы выбираете HashMap, когда данные ищутся по имени, а не по номеру, и Vec - когда важен порядок."
  - "Вы никогда не полагаетесь на порядок обхода HashMap в выводе: вы сортируете ключи."
  - "Вы читаете get как Option и не используете map[ключ] для ключа, которого может не быть."
concepts:
  introduces:
    - "rust.hash-map"
    - "rust.key-value"
    - "rust.map-iteration"
  uses:
    - "rust.vec"
    - "rust.vec-index"
    - "rust.vec-iteration"
    - "rust.debug-format"
    - "rust.option"
    - "rust.if-let"
    - "rust.match"
    - "rust.match-arm"
    - "rust.function"
    - "rust.parameter"
    - "rust.return"
    - "rust.reference"
    - "rust.mut-reference"
    - "rust.clone"
    - "rust.for"
    - "rust.if"
    - "rust.lines"
    - "rust.trim"
    - "rust.stdin"
    - "rust.read-to-string"
    - "rust.unwrap"
    - "rust.i32"
    - "rust.mut"
    - "rust.compound-assignment"
    - "rust.inline-format"
    - "rust.comparison"
    - "rust.logical-operators"
    - "rust.method-call"
    - "rust.string"
    - "rust.str"
