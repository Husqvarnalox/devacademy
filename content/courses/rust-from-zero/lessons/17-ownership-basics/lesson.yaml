id: "rust.from-zero.ownership-basics"
title: "Владение: перемещение, ссылки & и &mut, clone"
goal: "Понять, почему String, переданная в функцию, перестаёт быть доступной, и выбирать способ передачи: по значению, по ссылке & (читать), по ссылке &mut (менять) или с копией через clone()."
difficulty: "easy"
estimatedMinutes: 50
prerequisites:
  - "rust.from-zero.functions"
objectives:
  - "Объяснить, чем копирование чисел отличается от перемещения String, и узнать ошибку «borrow of moved value»."
  - "Передавать текст в функцию как &str, а изменяемую строку - как &mut String, и вызывать такие функции с & и &mut."
  - "Менять число через &mut i32, записывая *x."
  - "Использовать .clone(), когда нужны две независимые копии, и понимать, что копия стоит времени и памяти."
masteryCriteria:
  - "Ваши функции принимают &str, если им нужно только прочитать текст, и &mut String, если нужно изменить."
  - "Вы читаете ошибку E0382 и сами выбираете исправление: ссылка или clone()."
  - "Вы не копируете строки без нужды."
concepts:
  introduces:
    - "rust.move"
    - "rust.reference"
    - "rust.mut-reference"
    - "rust.clone"
  uses:
    - "rust.function"
    - "rust.parameter"
    - "rust.return"
    - "rust.unit"
    - "rust.scope"
    - "rust.string"
    - "rust.str"
    - "rust.string-length"
    - "rust.push-str"
    - "rust.method-call"
    - "rust.i32"
    - "rust.mut"
    - "rust.usize"
    - "rust.inline-format"
    - "rust.stdin"
    - "rust.read-to-string"
    - "rust.lines"
    - "rust.unwrap"
    - "rust.trim"
    - "rust.parse"
    - "rust.compound-assignment"
