quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn add_one(mut x: i32) -> i32 {
            x += 1;
            x
        }

        fn main() {
            let n = 5;
            let m = add_one(n);
            println!("{n} {m}");
        }
        ```
      options:
        - "5 5"
        - "5 6"
        - "6 6"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Число копируется: функция меняет свою копию x, а n в main остаётся равным 5. Результат функции 6 попадает в m."
    - id: "q2"
      type: "single"
      prompt: |
        Почему этот код не компилируется?

        ```rust
        fn show(text: String) {
            println!("{text}");
        }

        fn main() {
            let s = String::from("привет");
            show(s);
            show(s);
        }
        ```
      options:
        - "Потому что println! нельзя вызывать в функции с параметром."
        - "Потому что первый вызов show забрал строку s (перемещение), и второй вызов использует уже недоступное значение."
        - "Потому что строку нужно было объявить с mut."
        - "Потому что у функции show нет типа результата."
      answer: 1
      explanation: "Параметр типа String получает владение. После show(s) переменная s недоступна. Исправления: принять &str и вызывать show(&s), либо передать копию show(s.clone())."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn add_exclaim(text: &mut String) {
            text.push_str("!");
        }

        fn main() {
            let mut s = String::from("Привет");
            add_exclaim(&mut s);
            add_exclaim(&mut s);
            println!("{s}");
        }
        ```
      options:
        - "Привет"
        - "Привет!"
        - "Привет!!"
        - "Ошибка компиляции"
      answer: 2
      explanation: "&mut одалживает строку на время вызова и разрешает её менять. После каждого вызова s снова доступна, поэтому два вызова добавляют два восклицательных знака."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let a = String::from("кот");
            let mut b = a.clone();
            b.push_str("ята");
            println!("{a} {b}");
        }
        ```
      options:
        - "котята котята"
        - "кот кот"
        - "кот котята"
        - "Ошибка компиляции: a перемещена"
      answer: 2
      explanation: "clone() создаёт независимую копию. Изменение b не затрагивает a, поэтому a остаётся равной «кот»."
    - id: "q5"
      type: "single"
      prompt: |
        Почему этот код не компилируется?

        ```rust
        fn bump(x: &mut i32) {
            x += 1;
        }

        fn main() {
            let mut n = 1;
            bump(&mut n);
            println!("{n}");
        }
        ```
      options:
        - "Потому что параметр должен быть &i32."
        - "Потому что x - ссылка, а не число: изменять значение нужно через разыменование, *x += 1."
        - "Потому что n нужно объявить без mut."
        - "Потому что число нельзя передавать по ссылке."
      answer: 1
      explanation: "x хранит ссылку на число. Прибавлять единицу нужно к значению, на которое она указывает: *x += 1."
exercise:
  id: "rust.from-zero.ownership-basics.exercise"
  title: "Книга в библиотеке"
  prompt: |
    В упражнении `main` уже написан: он читает название книги и тираж, вызывает ваши функции и печатает результат. Вам нужно написать три функции.

    1. `word_length(text: &str) -> usize` - сколько **символов** (букв, пробелов, знаков) в тексте. Не используйте `len()`: он считает байты, а русская буква занимает два байта.
    2. `add_signature(text: &mut String)` - дописывает в конец текста ` (проверено)` (пробел, затем слово в скобках).
    3. `double_in_place(value: &mut i32)` - удваивает число.

    Пример. Ввод:

    ```
    Война и мир
    1500
    ```

    Вывод:

    ```
    Было: Война и мир
    Стало: Война и мир (проверено)
    Символов в исходном названии: 11
    Тираж: 3000
    ```

    В заготовке тела функций пустые. Допишите их, `main` не меняйте.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "word_length читает текст по ссылке &str, поэтому для подсчёта подойдёт text.chars().count()."
    - "add_signature получает &mut String, значит, менять можно: text.push_str(\" (проверено)\");"
    - "double_in_place меняет число по ссылке. Нужна звёздочка: *value *= 2;"
    - "add_signature и double_in_place ничего не возвращают: результат виден в main потому, что они меняют значения по ссылке. Если компилятор ругается, проверьте звёздочку в double_in_place и слово mut в типе параметра."
  tests:
    - id: "basic"
      title: "Война и мир, тираж 1500"
      stdin: "Война и мир\n1500\n"
      expected: "Было: Война и мир\nСтало: Война и мир (проверено)\nСимволов в исходном названии: 11\nТираж: 3000\n"
      hint: "В названии 11 символов; к названию дописывается « (проверено)», тираж удваивается до 3000."
    - id: "latin"
      title: "Латинское название"
      stdin: "Rust\n7\n"
      expected: "Было: Rust\nСтало: Rust (проверено)\nСимволов в исходном названии: 4\nТираж: 14\n"
      hint: "Для латиницы chars().count() и len() совпадают, но для кириллицы нет."
    - id: "cyrillic"
      title: "Кириллица: символы, а не байты (скрытый)"
      stdin: "Мастер и Маргарита\n250\n"
      expected: "Было: Мастер и Маргарита\nСтало: Мастер и Маргарита (проверено)\nСимволов в исходном названии: 18\nТираж: 500\n"
      hidden: true
      hint: "В «Мастер и Маргарита» 18 символов, а байт 34: нужен chars().count(), а не len()."
    - id: "empty"
      title: "Пустое название (скрытый)"
      stdin: "\n10\n"
      expected: "Было: \nСтало:  (проверено)\nСимволов в исходном названии: 0\nТираж: 20\n"
      hidden: true
      hint: "Пустое название: 0 символов, к пустой строке тоже дописывается подпись."
    - id: "zero"
      title: "Тираж 0 (скрытый)"
      stdin: "Сказка\n0\n"
      expected: "Было: Сказка\nСтало: Сказка (проверено)\nСимволов в исходном названии: 6\nТираж: 0\n"
      hidden: true
      hint: "Удвоение нуля - снова ноль."
    - id: "spaces"
      title: "Пробелы по краям (скрытый)"
      stdin: "  Мойдодыр  \n12\n"
      expected: "Было: Мойдодыр\nСтало: Мойдодыр (проверено)\nСимволов в исходном названии: 8\nТираж: 24\n"
      hidden: true
      hint: "main уже убирает пробелы по краям через trim(); функции получают чистую строку."
