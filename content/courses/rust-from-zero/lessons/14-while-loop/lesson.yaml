id: "rust.from-zero.while-loop"
title: "Цикл while и loop: повторять, пока нужно"
goal: "Повторять действия циклами while и loop, управлять ими через break и continue, вести счётчик и накапливать итог в переменной."
difficulty: "easy"
estimatedMinutes: 45
prerequisites:
  - "rust.from-zero.match"
objectives:
  - "Записать цикл while с условием и изменяемым счётчиком (let mut) и объяснить, когда он остановится."
  - "Накапливать сумму или произведение в переменной вне цикла."
  - "Использовать loop с break для повторения «пока не наступит событие» и continue для пропуска шага."
  - "Узнавать бесконечные циклы и ошибку «на единицу»."
masteryCriteria:
  - "В каждом вашем цикле видно, что изменяет условие, чтобы цикл когда-нибудь закончился."
  - "Вы объявляете счётчик и итог перед циклом, а внутри цикла только меняете."
  - "Вы проверяете цикл на границах: при нуле, одном и нескольких повторениях."
concepts:
  introduces:
    - "rust.while"
    - "rust.loop"
    - "rust.break"
    - "rust.continue"
  uses:
    - "rust.let"
    - "rust.mut"
    - "rust.assignment"
    - "rust.compound-assignment"
    - "rust.comparison"
    - "rust.if"
    - "rust.i32"
    - "rust.integer-division"
    - "rust.remainder"
    - "rust.stdin"
    - "rust.read-to-string"
    - "rust.lines"
    - "rust.unwrap"
    - "rust.trim"
    - "rust.parse"
    - "rust.inline-format"
    - "rust.bool"
next:
  - "rust.from-zero.for-loop"
tags:
  - "rust"
  - "while"
  - "loop"
  - "break"
  - "continue"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let mut i = 1;
            let mut total = 0;
            while i <= 4 {
                total += i;
                i += 1;
            }
            println!("{total}");
        }
        ```
      options:
        - "4"
        - "10"
        - "6"
        - "15"
      answer: 1
      explanation: "Тело выполняется при i = 1, 2, 3, 4: total = 1 + 2 + 3 + 4 = 10. При i = 5 условие i <= 4 ложно."
    - id: "q2"
      type: "single"
      prompt: |
        Сколько раз выполнится тело цикла?

        ```rust
        fn main() {
            let mut n = 10;
            let mut steps = 0;
            while n > 1 {
                n /= 2;
                steps += 1;
            }
            println!("{steps}");
        }
        ```
      options:
        - "2"
        - "3"
        - "4"
        - "5"
      answer: 1
      explanation: "Деление целое: 10 -> 5 -> 2 -> 1. После трёх шагов n равно 1, условие n > 1 ложно, и цикл завершается: steps = 3."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let mut i = 0;
            while i < 6 {
                i += 1;
                if i % 3 == 0 {
                    continue;
                }
                print!("{i} ");
            }
        }
        ```
      options:
        - "1 2 4 5"
        - "1 2 3 4 5 6"
        - "3 6"
        - "1 2"
      answer: 0
      explanation: "continue пропускает печать, когда i делится на 3 (то есть при 3 и 6). Все остальные значения от 1 до 6 печатаются: 1 2 4 5."
    - id: "q4"
      type: "single"
      prompt: |
        Что не так с этой программой?

        ```rust
        fn main() {
            let mut i = 0;
            while i < 5 {
                println!("{i}");
            }
        }
        ```
      options:
        - "Не компилируется: i нужно объявить без mut."
        - "Компилируется, но цикл бесконечный: i никогда не меняется."
        - "Компилируется и печатает 0 1 2 3 4."
        - "Компилируется и ничего не печатает."
      answer: 1
      explanation: "Тело ничего не меняет в условии, поэтому i < 5 остаётся истинным вечно, и программа бесконечно печатает 0. Нужно добавить i += 1 в тело."
    - id: "q5"
      type: "single"
      prompt: |
        Чему равно n после цикла?

        ```rust
        fn main() {
            let mut n = 0;
            loop {
                n += 3;
                if n > 10 {
                    break;
                }
            }
            println!("{n}");
        }
        ```
      options:
        - "10"
        - "11"
        - "12"
        - "15"
      answer: 2
      explanation: "n принимает значения 3, 6, 9, 12. Условие n > 10 впервые становится истинным при 12, и break прерывает цикл. Значение n остаётся равным 12."
exercise:
  id: "rust.from-zero.while-loop.exercise"
  title: "Копилка"
  prompt: |
    Вы копите деньги на покупку. На вход подаются две строки: цель в рублях и ежемесячный взнос в рублях (целые числа, взнос больше нуля).

    Каждый месяц вы вносите взнос. Кроме того, каждый **шестой** месяц (6-й, 12-й, 18-й и так далее) банк сразу после взноса добавляет бонус 100 рублей. Копите, пока накопленная сумма не станет **не меньше цели**.

    Программа печатает две строки:

    ```
    Месяцев: <сколько месяцев понадобилось>
    Накоплено: <накопленная сумма>
    ```

    Если цель не больше нуля, копить не нужно: `Месяцев: 0` и `Накоплено: 0`.

    Пример. Ввод:

    ```
    1000
    300
    ```

    Вывод:

    ```
    Месяцев: 4
    Накоплено: 1200
    ```

    (300, 600, 900, 1200: на четвёртом месяце сумма достигла цели.)

    В заготовке ввод прочитан, а переменные `months` и `saved` заданы нулём. Допишите цикл. Команды `println!` менять не нужно.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Нужен цикл while: пока накопленная сумма меньше цели, делайте очередной месяц."
    - "Внутри цикла: увеличьте months на 1, прибавьте взнос к saved. Условие цикла: saved < goal. Если цель не больше нуля, условие сразу ложно, и цикл не выполнится."
    - "Бонус: после взноса проверьте if months % 6 == 0 { saved += 100; }. Остаток от деления на 6 равен нулю в 6-й, 12-й, 18-й месяцы."
    - "Бонус начисляется до проверки цели: если взнос в шестой месяц довёл сумму до цели, бонус всё равно добавляется, потому что условие цикла проверяется только после всего тела."
  tests:
    - id: "basic"
      title: "Цель 1000, взнос 300"
      stdin: "1000\n300\n"
      expected: "Месяцев: 4\nНакоплено: 1200\n"
      hint: "300, 600, 900, 1200: четыре месяца, бонус не успевает начислиться."
    - id: "bonus"
      title: "Цель 5000, взнос 500: с бонусом"
      stdin: "5000\n500\n"
      expected: "Месяцев: 10\nНакоплено: 5100\n"
      hint: "В 6-й месяц к 3000 добавляется бонус 100, поэтому дальше сумма на 100 больше."
    - id: "zero"
      title: "Нулевая цель (скрытый)"
      stdin: "0\n250\n"
      expected: "Месяцев: 0\nНакоплено: 0\n"
      hidden: true
      hint: "Цель не больше нуля: цикл не должен выполниться, ответ - 0 месяцев и 0 рублей."
    - id: "exact"
      title: "Цель достигнута ровно (скрытый)"
      stdin: "900\n300\n"
      expected: "Месяцев: 3\nНакоплено: 900\n"
      hidden: true
      hint: "Условие продолжения - saved < goal, поэтому при saved == goal копить пора заканчивать."
    - id: "one-month"
      title: "Цель меньше взноса (скрытый)"
      stdin: "50\n300\n"
      expected: "Месяцев: 1\nНакоплено: 300\n"
      hidden: true
      hint: "Одного взноса хватает; сумма может быть больше цели."
    - id: "bonus-edge"
      title: "Бонус в последнем месяце (скрытый)"
      stdin: "1800\n300\n"
      expected: "Месяцев: 6\nНакоплено: 1900\n"
      hidden: true
      hint: "В 6-й месяц взнос даёт ровно 1800, а бонус 100 всё равно добавляется после взноса: ответ Накоплено 1900."
    - id: "long"
      title: "Два бонуса (скрытый)"
      stdin: "100000\n1000\n"
      expected: "Месяцев: 99\nНакоплено: 100600\n"
      hidden: true
      hint: "Бонус начисляется в 6-й, 12-й, ... месяцы: проверяйте months % 6 == 0 на каждом шаге."
