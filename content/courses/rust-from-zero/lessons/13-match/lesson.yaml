id: "rust.from-zero.match"
title: "match: выбор по образцу"
goal: "Выбирать результат по значению оператором match: по числу, диапазону, нескольким вариантам и тексту, с веткой _ и условием if, и понимать, почему компилятор требует учесть все случаи."
difficulty: "easy"
estimatedMinutes: 45
prerequisites:
  - "rust.from-zero.if-else"
objectives:
  - "Записать match с ветками «образец => результат» и веткой _ для всех остальных значений."
  - "Использовать образцы-диапазоны (1..=5), несколько образцов через | и условие if в ветке."
  - "Применять match к тексту (&str) и символам (char) и использовать match как выражение."
  - "Объяснять ошибку «non-exhaustive patterns» и отличать образец-имя от сравнения с переменной."
masteryCriteria:
  - "Ваша match покрывает все возможные значения, а не только ожидаемые."
  - "Вы ставите более частные ветки выше общих и помните, что выбирается первая подошедшая."
  - "Вы не пишете имя переменной в образце, когда хотите сравнить с ней значение."
concepts:
  introduces:
    - "rust.match"
    - "rust.match-arm"
    - "rust.wildcard"
    - "rust.range-pattern"
  uses:
    - "rust.if"
    - "rust.else"
    - "rust.if-expression"
    - "rust.comparison"
    - "rust.i32"
    - "rust.char"
    - "rust.str"
    - "rust.string"
    - "rust.bool"
    - "rust.stdin"
    - "rust.read-to-string"
    - "rust.lines"
    - "rust.unwrap"
    - "rust.trim"
    - "rust.parse"
    - "rust.inline-format"
    - "rust.let"
next:
  - "rust.from-zero.while-loop"
tags:
  - "rust"
  - "match"
  - "pattern"
  - "branching"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let n = 5;
            let kind = match n {
                1 | 2 => "малое",
                3..=5 => "среднее",
                _ => "большое",
            };
            println!("{kind}");
        }
        ```
      options:
        - "малое"
        - "среднее"
        - "большое"
        - "Ошибка компиляции"
      answer: 1
      explanation: "5 попадает в диапазон 3..=5 (правая граница входит), поэтому выбирается ветка «среднее». Ветка _ нужна только для остальных значений."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let n = -4;
            match n {
                0 => println!("ноль"),
                x if x < 0 => println!("минус {}", -x),
                x => println!("плюс {x}"),
            }
        }
        ```
      options:
        - "ноль"
        - "минус 4"
        - "плюс -4"
        - "минус -4"
      answer: 1
      explanation: "-4 не равно 0, поэтому первая ветка не подходит. Вторая ветка подходит: x получает значение -4, охрана x < 0 истинна. В тексте печатается -x, то есть 4."
    - id: "q3"
      type: "single"
      prompt: |
        Почему этот код не компилируется?

        ```rust
        fn main() {
            let n = 2;
            let word = match n {
                1 => "один",
                2 => "два",
            };
            println!("{word}");
        }
        ```
      options:
        - "Потому что в ветках должны стоять запятые только после последней."
        - "Потому что match не покрывает остальные значения n: нужна ветка _."
        - "Потому что match нельзя присваивать переменной."
        - "Потому что число 2 нужно писать в кавычках."
      answer: 1
      explanation: "match должен учесть все возможные значения типа. Для i32 это не только 1 и 2, поэтому нужна ветка _ => ... (или имя без условия)."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            let limit = 10;
            let n = 3;
            let answer = match n {
                limit => "равно",
                _ => "не равно",
            };
            println!("{answer}");
        }
        ```
      options:
        - "равно"
        - "не равно"
        - "Ошибка компиляции"
        - "Ничего"
      answer: 0
      explanation: "Имя limit в образце - новая переменная, которая подходит к любому значению. Первая ветка срабатывает всегда, и сравнения с внешним limit не происходит. Компилятор предупреждает, что вторая ветка недостижима."
    - id: "q5"
      type: "single"
      prompt: |
        Как исправить этот код?

        ```rust
        fn main() {
            let command = String::from("стоп");
            match command {
                "старт" => println!("Запускаем"),
                "стоп" => println!("Останавливаем"),
                _ => println!("Неизвестно"),
            }
        }
        ```
      options:
        - "Заменить => на ->."
        - "Написать match command.as_str(): образцы в кавычках имеют тип &str."
        - "Убрать ветку _."
        - "Объявить command как let mut."
      answer: 1
      explanation: "Образцы-литералы в кавычках - это &str, а command имеет тип String. Метод as_str() даёт &str, и сопоставление работает."
exercise:
  id: "rust.from-zero.match.exercise"
  title: "Оценка и тип дня"
  prompt: |
    Школьный журнал записывает балл за контрольную и день недели, в который она прошла. На вход подаются две строки: балл (целое число) и сокращённое название дня недели: `пн`, `вт`, `ср`, `чт`, `пт`, `сб`, `вс`.

    Программа печатает две строки.

    1. `Оценка: <слово>` по баллу:
       * от 90 до 100 - `отлично`;
       * от 75 до 89 - `хорошо`;
       * от 60 до 74 - `удовлетворительно`;
       * от 0 до 59 - `неудовлетворительно`;
       * любое другое число - `ошибка: балл вне диапазона 0-100`.
    2. `День: <слово>` по сокращению: `сб` и `вс` - `выходной`; `пн`, `вт`, `ср`, `чт`, `пт` - `рабочий`; всё остальное - `неизвестный день`.

    Пример. Ввод:

    ```
    82
    сб
    ```

    Вывод:

    ```
    Оценка: хорошо
    День: выходной
    ```

    В заготовке ввод прочитан, а переменные `grade` и `day_type` пусты. Присвойте им результат `match`. Команды `println!` менять не нужно.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Для оценки запишите match score { ... } с ветками-диапазонами, например 90..=100 => \"отлично\"."
    - "Слово дня недели уже прочитано как &str (после trim()), поэтому его можно сопоставлять с литералами: \"сб\" | \"вс\" => \"выходной\"."
    - "Не забудьте ветку _ для баллов вне диапазона 0..=100 и для неизвестного дня. Результат match кладут в переменную: let grade = match score { ... };"
    - "Границы входят в диапазоны: 90 - уже «отлично», 59 - ещё «неудовлетворительно». Отрицательные баллы и числа больше 100 попадают в _."
  tests:
    - id: "basic"
      title: "82 балла, суббота"
      stdin: "82\nсб\n"
      expected: "Оценка: хорошо\nДень: выходной\n"
      hint: "82 попадает в диапазон 75..=89, суббота - выходной."
    - id: "workday"
      title: "55 баллов, вторник"
      stdin: "55\nвт\n"
      expected: "Оценка: неудовлетворительно\nДень: рабочий\n"
      hint: "55 - неудовлетворительно (0..=59), вторник - рабочий день."
    - id: "top"
      title: "Границы 90 и 100 (скрытый)"
      stdin: "100\nпн\n"
      expected: "Оценка: отлично\nДень: рабочий\n"
      hidden: true
      hint: "100 входит в диапазон 90..=100 (отлично), понедельник - рабочий."
    - id: "border-90"
      title: "Граница 90 (скрытый)"
      stdin: "90\nвс\n"
      expected: "Оценка: отлично\nДень: выходной\n"
      hidden: true
      hint: "90 уже «отлично», а не «хорошо»: правая граница диапазона 75..=89 - 89."
    - id: "border-60"
      title: "Граница 60 (скрытый)"
      stdin: "60\nпт\n"
      expected: "Оценка: удовлетворительно\nДень: рабочий\n"
      hidden: true
      hint: "60 - минимальный балл для «удовлетворительно»; 59 - уже нет."
    - id: "border-0"
      title: "Граница 0 и 59 (скрытый)"
      stdin: "0\nчт\n"
      expected: "Оценка: неудовлетворительно\nДень: рабочий\n"
      hidden: true
      hint: "0 допустим: диапазон 0..=59 включает обе границы."
    - id: "too-high"
      title: "Балл больше 100 (скрытый)"
      stdin: "101\nср\n"
      expected: "Оценка: ошибка: балл вне диапазона 0-100\nДень: рабочий\n"
      hidden: true
      hint: "101 выходит за диапазон, нужна ветка _: «ошибка: балл вне диапазона 0-100»."
    - id: "negative"
      title: "Отрицательный балл и неизвестный день (скрытый)"
      stdin: "-5\nxx\n"
      expected: "Оценка: ошибка: балл вне диапазона 0-100\nДень: неизвестный день\n"
      hidden: true
      hint: "Отрицательное число попадает в _, а слово «xx» - в _ для дней: «неизвестный день»."
