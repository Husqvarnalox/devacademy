id: "rust.from-zero.string-methods"
title: "Методы строк: разрезаем и ищем"
goal: "Разбирать текст на части методами строк: split_whitespace, split, split_once, contains, starts_with, replace, chars и join - и не путать байты с символами."
difficulty: "easy"
estimatedMinutes: 55
prerequisites:
  - "rust.from-zero.hash-maps"
objectives:
  - "Разбить строку на слова через split_whitespace и на части по разделителю через split, складывая части в Vec<&str>."
  - "Разделить строку «ключ;значение» один раз через split_once и разобрать Option<(&str, &str)>."
  - "Искать и менять текст через contains, starts_with, ends_with и replace, помня, что replace возвращает новую строку."
  - "Перебирать символы через chars(), считать их через chars().count() и объяснить, почему len() считает байты."
  - "Склеивать части через join."
masteryCriteria:
  - "Вы разбираете строки формата «имя;балл» и «слово слово слово» без индексации по байтам."
  - "Вы различаете len() (байты) и chars().count() (символы) для кириллицы."
  - "Вы обрабатываете отсутствие разделителя через Option, а не unwrap."
concepts:
  introduces:
    - "rust.string-methods"
    - "rust.split"
    - "rust.chars"
  uses:
    - "rust.string"
    - "rust.str"
    - "rust.trim"
    - "rust.string-case"
    - "rust.string-length"
    - "rust.char"
    - "rust.option"
    - "rust.if-let"
    - "rust.match"
    - "rust.match-arm"
    - "rust.vec"
    - "rust.vec-iteration"
    - "rust.debug-format"
    - "rust.function"
    - "rust.parameter"
    - "rust.return"
    - "rust.reference"
    - "rust.for"
    - "rust.if"
    - "rust.lines"
    - "rust.stdin"
    - "rust.read-to-string"
    - "rust.unwrap"
    - "rust.unwrap-or"
    - "rust.i32"
    - "rust.mut"
    - "rust.compound-assignment"
    - "rust.inline-format"
    - "rust.comparison"
    - "rust.method-call"
    - "rust.push-str"
    - "rust.hash-map"
    - "rust.map-iteration"
