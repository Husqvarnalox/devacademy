id: "rust.from-zero.reading-input"
title: "Ввод данных: read_to_string"
goal: "Прочитать ввод программы целиком, разбить его на строки через lines(), взять нужную строку через next().unwrap() и очистить её от лишних пробелов через trim()."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "rust.from-zero.strings"
objectives:
  - "Объяснить, что такое стандартный ввод и почему данные из него приходят как текст."
  - "Прочитать весь ввод в String командой std::io::read_to_string(std::io::stdin()).unwrap()."
  - "Брать строки по очереди через let mut lines = text.lines(); и lines.next().unwrap()."
  - "Убирать лишние пробелы по краям через trim() и объяснять, что делает unwrap и когда программа останавливается."
masteryCriteria:
  - "Ваша программа читает несколько строк ввода и печатает их в нужном порядке."
  - "Вы используете trim(), чтобы лишние пробелы по краям не попадали в результат."
  - "Вы объясняете, почему переменная с lines объявлена с mut и что произойдёт при нехватке строк."
concepts:
  introduces:
    - "rust.stdin"
    - "rust.read-to-string"
    - "rust.lines"
    - "rust.unwrap"
    - "rust.trim"
  uses:
    - "rust.variable"
    - "rust.let"
    - "rust.mut"
    - "rust.string"
    - "rust.str"
    - "rust.method-call"
    - "rust.string-length"
    - "rust.string-case"
    - "rust.inline-format"
next:
  - "rust.from-zero.type-conversion"
tags:
  - "rust"
  - "input"
  - "stdin"
  - "read_to_string"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        На вход подаются две строки:

        ```text
        Анна
        Минск
        ```

        Что напечатает программа?

        ```rust
        fn main() {
            let text = std::io::read_to_string(std::io::stdin()).unwrap();
            let mut lines = text.lines();
            let first = lines.next().unwrap();
            let second = lines.next().unwrap();
            println!("{second}, {first}");
        }
        ```
      options:
        - "Анна, Минск"
        - "Минск, Анна"
        - "Минск, Минск"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Первый вызов next() даёт первую строку («Анна»), второй - вторую («Минск»). Печатаются они в обратном порядке: сначала second, потом first."
    - id: "q2"
      type: "single"
      prompt: "Почему переменная lines объявлена как let mut lines = text.lines();?"
      options:
        - "Потому что text.lines() возвращает текст, а текст всегда нужно объявлять с mut."
        - "Потому что каждый вызов next() запоминает, на какой строке остановились, то есть меняет lines."
        - "Это необязательно: без mut программа соберётся так же."
        - "Потому что mut ускоряет чтение ввода."
      answer: 1
      explanation: "lines помнит текущую позицию. Каждый next() сдвигает её, то есть меняет саму переменную. Без mut компилятор сообщит: cannot borrow `lines` as mutable."
    - id: "q3"
      type: "single"
      prompt: |
        Ввод содержит строку `   Минск   ` (пробелы по краям). Что напечатает программа?

        ```rust
        fn main() {
            let text = std::io::read_to_string(std::io::stdin()).unwrap();
            let mut lines = text.lines();
            let city = lines.next().unwrap().trim();
            println!("[{city}]");
        }
        ```
      options:
        - "[   Минск   ]"
        - "[Минск]"
        - "[Минск   ]"
        - "[ Минск ]"
      answer: 1
      explanation: "trim() убирает пробелы (и другие пробельные символы) в начале и в конце строки. Пробелы внутри остаются."
    - id: "q4"
      type: "single"
      prompt: "Что произойдёт, если программа вызывает lines.next().unwrap() три раза, а на вход подано только две строки?"
      options:
        - "Третья переменная получит пустую строку."
        - "Программа остановится с ошибкой: called `Option::unwrap()` on a `None` value."
        - "Компилятор откажется собирать программу."
        - "Rust подождёт, пока пользователь введёт третью строку."
      answer: 1
      explanation: "next() возвращает значение «строка или ничего». Когда строки кончились, это «ничего» (None), и unwrap останавливает программу с сообщением. Компилятор не знает, сколько строк придёт на вход, поэтому ошибка возникает при работе."
    - id: "q5"
      type: "single"
      prompt: "Что делает unwrap() в записи lines.next().unwrap()?"
      options:
        - "Превращает строку в число."
        - "Достаёт строку из результата next(); если строки нет, останавливает программу с сообщением."
        - "Удаляет пробелы из строки."
        - "Читает следующую строку второй раз."
      answer: 1
      explanation: "next() возвращает не саму строку, а «строка или ничего». unwrap достаёт строку, а если её нет - останавливает программу. Более аккуратная работа с таким результатом - в уроке про Option."
exercise:
  id: "rust.from-zero.reading-input.exercise"
  title: "Карточка посылки"
  prompt: |
    На вход подаются три строки: имя получателя, город и описание посылки (описание может состоять из нескольких слов). Прочитайте их и напечатайте:

    ```
    Получатель: <имя>
    Город: <ГОРОД ЗАГЛАВНЫМИ>
    Посылка: <описание>
    Букв в описании: <число букв>
    ```

    Пример. Ввод:

    ```
    Ольга Ветрова
    Казань
    Набор акварельных красок
    ```

    Вывод:

    ```
    Получатель: Ольга Ветрова
    Город: КАЗАНЬ
    Посылка: Набор акварельных красок
    Букв в описании: 24
    ```

    В заготовке ввод уже читается в `text`, а три переменные заполнены пустыми строками. Замените их на значения из ввода. Лишние пробелы по краям строк (если они есть) в результат попадать не должны.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Первую строку ввода берут так: let name = lines.next().unwrap().trim(); Каждый следующий вызов next() даёт следующую строку."
    - "Три переменные - три вызова lines.next().unwrap().trim() подряд, в порядке: имя, город, описание."
    - "Команды println! менять не нужно: город переводится в заглавные методом to_uppercase(), буквы считает chars().count()."
    - "Если вывод приходит с лишними пробелами, проверьте, что после unwrap() стоит .trim()."
  tests:
    - id: "basic"
      title: "Ольга из Казани"
      stdin: |
        Ольга Ветрова
        Казань
        Набор акварельных красок
      expected: |
        Получатель: Ольга Ветрова
        Город: КАЗАНЬ
        Посылка: Набор акварельных красок
        Букв в описании: 24
      hint: "Каждая из трёх строк ввода попадает в свою переменную; город печатается заглавными, число букв в описании - 24."
    - id: "latin"
      title: "Латиница и короткое описание"
      stdin: |
        Tom
        Oslo
        Book
      expected: |
        Получатель: Tom
        Город: OSLO
        Посылка: Book
        Букв в описании: 4
      hint: "Латиница работает так же: Oslo превращается в OSLO, а в слове Book четыре буквы."
    - id: "spaces"
      title: "Лишние пробелы по краям (скрытый)"
      stdin: |
        Иван Седов   
          Омск  
           Две керамические кружки  
      expected: |
        Получатель: Иван Седов
        Город: ОМСК
        Посылка: Две керамические кружки
        Букв в описании: 23
      hidden: true
      hint: "Пробелы по краям строк нужно убрать методом trim() сразу после unwrap(); тогда они не попадут ни в вывод, ни в счётчик букв."
