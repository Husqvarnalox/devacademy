id: "rust.from-zero.for-loop"
title: "Цикл for: диапазоны и строки ввода"
goal: "Записывать счётные циклы через for и диапазоны (1..=n, 0..n, rev, step_by), вкладывать циклы и читать ввод любой длины конструкцией for line in text.lines()."
difficulty: "easy"
estimatedMinutes: 45
prerequisites:
  - "rust.from-zero.while-loop"
objectives:
  - "Записать for i in 1..=n и for i in 0..n и объяснить, входит ли правая граница."
  - "Перебрать диапазон в обратном порядке (rev) и с шагом (step_by)."
  - "Вложить один цикл в другой и предсказать число повторений."
  - "Прочитать весь ввод независимо от числа строк: for line in text.lines()."
masteryCriteria:
  - "Вы выбираете за и против: for, когда число повторений известно или есть коллекция строк, while, когда повторяют до события."
  - "Вы различаете 1..5 и 1..=5 и не получаете ошибки на единицу."
  - "Ваша программа корректно работает на пустом вводе и пропускает пустые строки."
concepts:
  introduces:
    - "rust.for"
    - "rust.range"
    - "rust.nested-loops"
    - "rust.read-until-end"
  uses:
    - "rust.while"
    - "rust.break"
    - "rust.continue"
    - "rust.mut"
    - "rust.compound-assignment"
    - "rust.if"
    - "rust.comparison"
    - "rust.i32"
    - "rust.stdin"
    - "rust.read-to-string"
    - "rust.lines"
    - "rust.unwrap"
    - "rust.trim"
    - "rust.parse"
    - "rust.inline-format"
    - "rust.string"
next:
  - "rust.from-zero.functions"
tags:
  - "rust"
  - "for"
  - "range"
  - "loop"
  - "nested-loops"
  - "input"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            for i in 1..4 {
                print!("{i} ");
            }
        }
        ```
      options:
        - "1 2 3"
        - "1 2 3 4"
        - "0 1 2 3"
        - "2 3 4"
      answer: 0
      explanation: "Правая граница диапазона 1..4 не входит, поэтому печатаются 1, 2 и 3. Для 1 2 3 4 нужно было написать 1..=4."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            for i in (1..=10).step_by(3) {
                print!("{i} ");
            }
        }
        ```
      options:
        - "1 4 7 10"
        - "3 6 9"
        - "1 4 7"
        - "1 3 6 9"
      answer: 0
      explanation: "step_by(3) начинается с первого числа диапазона и берёт каждое третье: 1, 4, 7, 10. Правая граница 10 включена записью ..=, и 10 в эту последовательность попадает."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn main() {
            for a in 1..=3 {
                for b in 1..=a {
                    print!("{a}{b} ");
                }
            }
        }
        ```
      options:
        - "11 22 33"
        - "11 21 22 31 32 33"
        - "11 12 13 21 22 23 31 32 33"
        - "11 21 31"
      answer: 1
      explanation: "Внутренний цикл зависит от внешнего: при a = 1 он делает один шаг, при a = 2 - два, при a = 3 - три. Всего шесть пар: 11, 21 22, 31 32 33."
    - id: "q4"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```rust
        fn main() {
            for i in 5..1 {
                println!("{i}");
            }
            println!("конец");
        }
        ```
      options:
        - "Напечатается 5 4 3 2 и конец."
        - "Напечатается только конец: диапазон 5..1 пуст."
        - "Программа не скомпилируется."
        - "Цикл будет бесконечным."
      answer: 1
      explanation: "Диапазоны всегда идут вперёд. Если начало больше конца, диапазон пуст и тело не выполняется. Для обратного счёта нужно (1..=5).rev()."
    - id: "q5"
      type: "single"
      prompt: |
        Почему этот код не компилируется?

        ```rust
        fn main() {
            for i in 1..=3 {
                i += 1;
                println!("{i}");
            }
        }
        ```
      options:
        - "Потому что у диапазона нет метода +=."
        - "Потому что переменная цикла неизменяема, а i += 1 пытается её изменить."
        - "Потому что цикл for не может содержать println!."
        - "Потому что число 3 нужно записать в кавычках."
      answer: 1
      explanation: "Переменная цикла получает новое значение на каждом шаге и сама изменяться не может. Если нужно считать по-другому, заведите отдельную переменную с let mut или поменяйте диапазон."
exercise:
  id: "rust.from-zero.for-loop.exercise"
  title: "Кассовый чек"
  prompt: |
    Кассир вводит цены товаров по одной на строке (целое число рублей). Строки могут быть пустыми: их нужно пропускать. Количество строк заранее неизвестно, ввод может быть и совсем пустым.

    Программа печатает чек: сначала по строке на каждый товар в формате `<номер>. <цена>` (нумерация с 1), а затем три итоговые строки:

    ```
    Позиций: <сколько товаров>
    Итого: <сумма цен>
    Самая дорогая: <наибольшая цена или слово нет, если товаров нет>
    ```

    Пример. Ввод:

    ```
    120
    45

    300
    ```

    Вывод:

    ```
    1. 120
    2. 45
    3. 300
    Позиций: 3
    Итого: 465
    Самая дорогая: 300
    ```

    В заготовке чтение ввода и итоговые строки уже написаны, переменные объявлены. Допишите цикл `for` по строкам. Команды `println!` после цикла менять не нужно.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Цикл по строкам: for line in text.lines() { ... }. Внутри каждую строку нужно обработать, кроме пустых."
    - "Пустую строку пропустите: if line.trim() == \"\" { continue; }. Остальные превратите в число: let price: i32 = line.trim().parse().unwrap();"
    - "В теле обновите count и total и напечатайте строку чека: println!(\"{count}. {price}\"); Счётчик увеличьте до печати, чтобы номера начинались с 1."
    - "Самую дорогую цену запоминайте в переменной biggest: если товар первый или дороже текущей, перезапишите. Для этого удобно сравнить с count == 1 (первый товар) или с biggest."
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "120\n45\n\n300\n"
      expected: "1. 120\n2. 45\n3. 300\nПозиций: 3\nИтого: 465\nСамая дорогая: 300\n"
      hint: "Пустая строка пропускается и не занимает номер; позиций три, сумма 465."
    - id: "one"
      title: "Один товар"
      stdin: "75\n"
      expected: "1. 75\nПозиций: 1\nИтого: 75\nСамая дорогая: 75\n"
      hint: "Единственный товар - он же самый дорогой."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: "Позиций: 0\nИтого: 0\nСамая дорогая: нет\n"
      hidden: true
      hint: "Цикл не выполнится ни разу: позиций 0, сумма 0, а вместо цены слово «нет»."
    - id: "only-blank"
      title: "Только пустые строки (скрытый)"
      stdin: "\n   \n\n"
      expected: "Позиций: 0\nИтого: 0\nСамая дорогая: нет\n"
      hidden: true
      hint: "Строки из пробелов тоже пустые: trim() превращает их в пустую строку."
    - id: "spaces"
      title: "Пробелы вокруг чисел (скрытый)"
      stdin: "  10  \n20\n"
      expected: "1. 10\n2. 20\nПозиций: 2\nИтого: 30\nСамая дорогая: 20\n"
      hidden: true
      hint: "Перед parse() вызывайте trim(): иначе пробелы приведут к ошибке разбора."
    - id: "first-biggest"
      title: "Самая дорогая - первая (скрытый)"
      stdin: "500\n100\n100\n"
      expected: "1. 500\n2. 100\n3. 100\nПозиций: 3\nИтого: 700\nСамая дорогая: 500\n"
      hidden: true
      hint: "Наибольшее значение может стоять в начале; не начинайте biggest с нуля без проверки первого товара."
    - id: "negative"
      title: "Возвраты: отрицательные цены (скрытый)"
      stdin: "-50\n-20\n"
      expected: "1. -50\n2. -20\nПозиций: 2\nИтого: -70\nСамая дорогая: -20\n"
      hidden: true
      hint: "Цены могут быть отрицательными (возврат). Если начать biggest с 0, ответ окажется неверным; берите первый товар как начальное значение."
