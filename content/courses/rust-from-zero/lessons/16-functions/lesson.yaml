id: "rust.from-zero.functions"
title: "Функции: fn, параметры и результат"
goal: "Давать имя куску кода и вызывать его с разными данными: объявлять функции с параметрами и типом результата, возвращать значение последним выражением или через return, понимать область видимости."
difficulty: "easy"
estimatedMinutes: 50
prerequisites:
  - "rust.from-zero.for-loop"
objectives:
  - "Объявить функцию fn имя(параметр: Тип) -> Тип { ... } и вызвать её с аргументами."
  - "Вернуть значение последним выражением без точки с запятой или командой return."
  - "Объяснить, что функция без -> возвращает () и что переменные внутри функции не видны снаружи."
  - "Читать упражнение с готовым main, в котором вы пишете только функции."
masteryCriteria:
  - "Вы указываете типы всех параметров и результата и не ставите лишнюю точку с запятой после результата."
  - "Вы разбиваете задачу на небольшие функции с понятными именами, а не пишете всё в main."
  - "Вы вызываете одну функцию из другой и понимаете, почему порядок функций в файле не важен."
concepts:
  introduces:
    - "rust.function"
    - "rust.parameter"
    - "rust.return"
    - "rust.unit"
    - "rust.scope"
  uses:
    - "rust.main-function"
    - "rust.if"
    - "rust.if-expression"
    - "rust.else"
    - "rust.for"
    - "rust.while"
    - "rust.comparison"
    - "rust.logical-operators"
    - "rust.i32"
    - "rust.f64"
    - "rust.bool"
    - "rust.string"
    - "rust.str"
    - "rust.stdin"
    - "rust.read-to-string"
    - "rust.unwrap"
    - "rust.trim"
    - "rust.parse"
    - "rust.inline-format"
    - "rust.integer-division"
    - "rust.remainder"
    - "rust.type-inference"
next:
  - "rust.from-zero.ownership-basics"
tags:
  - "rust"
  - "function"
  - "parameter"
  - "return"
  - "scope"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn double(x: i32) -> i32 {
            x * 2
        }

        fn main() {
            println!("{}", double(double(3)));
        }
        ```
      options:
        - "6"
        - "9"
        - "12"
        - "Ошибка компиляции"
      answer: 2
      explanation: "Сначала вычисляется внутренний вызов double(3) = 6, затем double(6) = 12."
    - id: "q2"
      type: "single"
      prompt: |
        Почему этот код не компилируется?

        ```rust
        fn add(a: i32, b: i32) -> i32 {
            a + b;
        }

        fn main() {
            println!("{}", add(1, 2));
        }
        ```
      options:
        - "Потому что функция add не может иметь два параметра."
        - "Потому что после a + b стоит точка с запятой: тело ничего не возвращает, а нужен i32."
        - "Потому что main должна стоять выше add."
        - "Потому что оператор + не работает с i32."
      answer: 1
      explanation: "Без точки с запятой a + b - последнее выражение и результат функции. С точкой с запятой это инструкция, и тело возвращает (), а не i32. Компилятор прямо советует убрать лишний символ."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn change(x: i32) -> i32 {
            let x = x + 10;
            x
        }

        fn main() {
            let x = 1;
            let y = change(x);
            println!("{x} {y}");
        }
        ```
      options:
        - "1 11"
        - "11 11"
        - "1 1"
        - "11 1"
      answer: 0
      explanation: "Параметр x внутри change - отдельная переменная; затенение let x = x + 10 меняет только её. В main переменная x по-прежнему равна 1, а y получил результат 11."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn describe(n: i32) -> String {
            if n < 0 {
                return String::from("минус");
            }
            String::from("не минус")
        }

        fn main() {
            println!("{} {}", describe(-1), describe(5));
        }
        ```
      options:
        - "минус минус"
        - "не минус не минус"
        - "минус не минус"
        - "не минус минус"
      answer: 2
      explanation: "При n = -1 срабатывает return и функция завершается. При n = 5 условие ложно, return пропускается, и результатом становится последнее выражение."
    - id: "q5"
      type: "single"
      prompt: |
        Почему этот код не компилируется?

        ```rust
        fn square(x: i32) -> i32 {
            x * x
        }

        fn main() {
            println!("{}", square(2.5));
        }
        ```
      options:
        - "Потому что square нельзя вызывать внутри println!."
        - "Потому что 2.5 - дробное число (f64), а параметр объявлен как i32; неявных преобразований нет."
        - "Потому что результат square нужно сначала сохранить в переменную."
        - "Потому что функция square должна принимать &str."
      answer: 1
      explanation: "Типы аргументов должны совпадать с типами параметров. Либо передайте целое число, либо измените сигнатуру на f64."
exercise:
  id: "rust.from-zero.functions.exercise"
  title: "Скидка в магазине"
  prompt: |
    В упражнениях по функциям `main` уже написан: он читает сумму покупки в рублях (целое число), вызывает ваши функции и печатает результат. Вам нужно написать три функции.

    1. `discount_percent(total: i32) -> i32` - размер скидки в процентах:
       * от 5000 рублей включительно - 15;
       * от 2000 до 4999 - 10;
       * от 1000 до 1999 - 5;
       * меньше 1000 - 0.
    2. `final_price(total: i32) -> i32` - сумма к оплате после скидки: `total` минус `total * процент / 100` (целочисленное деление). Процент возьмите из `discount_percent`.
    3. `free_delivery(price: i32) -> bool` - `true`, если сумма к оплате не меньше 3000 рублей.

    Пример. Ввод:

    ```
    2500
    ```

    Вывод:

    ```
    Скидка: 10%
    К оплате: 2250
    Доставка: платно
    ```

    Скидка 10 процентов от 2500 - это 250, к оплате 2250, что меньше 3000, поэтому доставка платная.

    В заготовке функции пока возвращают `0` и `false`. Замените тела функций, `main` не меняйте.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "discount_percent: цепочка if / else if: if total >= 5000 { 15 } else if total >= 2000 { 10 } ... Каждая ветка - число без точки с запятой, ветка else даёт 0."
    - "final_price вызывает первую функцию: let percent = discount_percent(total); потом total - total * percent / 100. Это последнее выражение функции, без точки с запятой."
    - "free_delivery: результат - само сравнение: price >= 3000. Писать if не нужно, сравнение уже даёт bool."
    - "Проверьте границы: 999, 1000, 1999, 2000, 4999, 5000. Для 1000 скидка 5%, для 5000 скидка 15%."
  tests:
    - id: "basic"
      title: "2500 рублей"
      stdin: "2500\n"
      expected: "Скидка: 10%\nК оплате: 2250\nДоставка: платно\n"
      hint: "2500 попадает в диапазон 2000-4999: скидка 10%, к оплате 2250, доставка платная."
    - id: "big"
      title: "8000 рублей"
      stdin: "8000\n"
      expected: "Скидка: 15%\nК оплате: 6800\nДоставка: бесплатно\n"
      hint: "Скидка 15%: к оплате 8000 - 1200 = 6800, доставка бесплатная."
    - id: "none"
      title: "500 рублей (скрытый)"
      stdin: "500\n"
      expected: "Скидка: 0%\nК оплате: 500\nДоставка: платно\n"
      hidden: true
      hint: "Меньше 1000 рублей скидки нет: к оплате столько же."
    - id: "border-1000"
      title: "Граница 1000 (скрытый)"
      stdin: "1000\n"
      expected: "Скидка: 5%\nК оплате: 950\nДоставка: платно\n"
      hidden: true
      hint: "От 1000 включительно скидка 5%: используйте >=."
    - id: "border-999"
      title: "Граница 999 (скрытый)"
      stdin: "999\n"
      expected: "Скидка: 0%\nК оплате: 999\nДоставка: платно\n"
      hidden: true
      hint: "999 меньше 1000, скидки нет."
    - id: "border-5000"
      title: "Граница 5000 (скрытый)"
      stdin: "5000\n"
      expected: "Скидка: 15%\nК оплате: 4250\nДоставка: бесплатно\n"
      hidden: true
      hint: "От 5000 включительно скидка 15%: 5000 - 750 = 4250."
    - id: "delivery-edge"
      title: "Бесплатная доставка ровно от 3000 (скрытый)"
      stdin: "3000\n"
      expected: "Скидка: 10%\nК оплате: 2700\nДоставка: платно\n"
      hidden: true
      hint: "3000 даёт скидку 10% и к оплате 2700, что меньше 3000: доставка платная. Бесплатной доставка станет при сумме к оплате не меньше 3000."
    - id: "rounding"
      title: "Целочисленное деление (скрытый)"
      stdin: "1999\n"
      expected: "Скидка: 5%\nК оплате: 1900\nДоставка: платно\n"
      hidden: true
      hint: "1999 * 5 / 100 при целочисленном делении равно 99: к оплате 1900."
