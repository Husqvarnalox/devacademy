    - "rust.string"
    - "rust.str"
    - "rust.function"
    - "rust.parameter"
    - "rust.return"
    - "rust.format-macro"
    - "rust.reference"
    - "rust.for"
    - "rust.if"
    - "rust.lines"
    - "rust.trim"
    - "rust.stdin"
    - "rust.read-to-string"
    - "rust.i32"
    - "rust.mut"
    - "rust.compound-assignment"
