quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn half(text: &str) -> Result<i32, String> {
            match text.parse::<i32>() {
                Ok(n) => Ok(n / 2),
                Err(_) => Err(String::from("не число")),
            }
        }

        fn main() {
            println!("{:?} {:?}", half("10"), half("x"));
        }
        ```
      options:
        - "Ok(5) Err(\"не число\")"
        - "5 не число"
        - "Ok(10) Err(0)"
        - "Паника на втором вызове"
      answer: 0
      explanation: "Функция возвращает Result. Для «10» получается Ok(5), для «x» - Err со строкой. Отладочный вывод {:?} показывает Ok(...) и Err(...) целиком, строки в кавычках."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```rust
        fn check(n: i32) -> Result<i32, String> {
            if n < 0 {
                return Err(String::from("минус"));
            }
            Ok(n)
        }

        fn twice(n: i32) -> Result<i32, String> {
            let v = check(n)?;
            println!("проверено");
            Ok(v * 2)
        }

        fn main() {
            println!("{:?}", twice(-1));
            println!("{:?}", twice(4));
        }
        ```
      options:
        - "Err(\"минус\"), затем проверено и Ok(8)"
        - "проверено, Err(\"минус\"), проверено, Ok(8)"
        - "Err(\"минус\") и паника"
        - "Ok(-2), затем проверено и Ok(8)"
      answer: 0
      explanation: "При n = -1 check возвращает Err, и ? сразу возвращает его из twice: строка «проверено» не печатается. При n = 4 проверка проходит, печатается «проверено» и возвращается Ok(8)."
    - id: "q3"
      type: "single"
      prompt: |
        Почему этот код не компилируется?

        ```rust
        fn main() {
            let n: i32 = "5".parse::<i32>()?;
            println!("{n}");
        }
        ```
      options:
        - "Потому что parse нельзя вызывать для числа 5."
        - "Потому что ? можно использовать только в функции, которая возвращает Result (или Option), а main ничего не возвращает."
        - "Потому что n нужно объявить с mut."
        - "Потому что вместо ? надо писать !."
      answer: 1
      explanation: "? при ошибке возвращает Err из текущей функции. У main нет типа Result, вернуть ошибку некуда. Разберите результат через match, if let или unwrap_or."
    - id: "q4"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```rust
        fn main() {
            println!("старт");
            let n: i32 = "abc".parse().expect("нужно число");
            println!("{n}");
        }
        ```
      options:
        - "Напечатается старт, затем 0."
        - "Напечатается старт, затем программа остановится с паникой и сообщением «нужно число»."
        - "Программа не скомпилируется."
        - "Напечатается только 0."
      answer: 1
      explanation: "Строка «abc» не число, поэтому parse возвращает Err, а expect останавливает программу с сообщением. Вывод «старт» успел напечататься до паники."
    - id: "q5"
      type: "single"
      prompt: "Для чего лучше подходит panic!, а для чего - Result?"
      options:
        - "panic! - для ошибок ввода пользователя, Result - для багов."
        - "panic! - для нарушенного предположения программиста (баг), Result - для ожидаемых ошибок данных."
        - "Они взаимозаменяемы."
        - "Result нельзя использовать с строками."
      answer: 1
      explanation: "Ожидаемые ошибки данных (неверный ввод) нужно обработать и сообщить о них. Паника нужна, когда программа обнаружила, что её предположения о себе нарушены."
exercise:
  id: "rust.from-zero.errors.exercise"
  title: "Проверка строк заказа"
  prompt: |
    В упражнении `main` уже написан. Он читает строки вида `количество;цена`, для каждой вызывает вашу функцию `line_total` и печатает либо сумму, либо сообщение об ошибке с номером строки (номера считаются для всех строк, включая пустые). Напишите две функции.

    1. `parse_positive(text: &str) -> Result<i32, String>` - разбирает целое число после `trim()`. Если это не число: `Err("не число: <текст>")`, где `<текст>` - строка после `trim()`. Если число не больше нуля: `Err("не положительное: <число>")`. Иначе `Ok(число)`.
    2. `line_total(line: &str) -> Result<i32, String>` - делит строку по первому `;` через `split_once`. Если `;` нет: `Err("нет разделителя: <строка>")` (строка как передана). Иначе разбирает обе части через `parse_positive` и возвращает `Ok(количество * цена)`; при первой ошибке возвращает её.

    Пример. Ввод:

    ```
    3;40
    2;abc
    5;10
    ```

    Вывод:

    ```
    Строка 1: сумма 120
    Строка 2: ошибка: не число: abc
    Строка 3: сумма 50
    Итого: 170, ошибок: 1
    ```

    В заготовке функции пока возвращают `Err(String::new())`. Замените их, `main` не меняйте.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "parse_positive: разберите text.trim().parse::<i32>() через match. В ветке Err(_) верните Err(format!(\"не число: {}\", text.trim()))."
    - "В ветке Ok(n): if n > 0 { Ok(n) } else { Err(format!(\"не положительное: {n}\")) }."
    - "line_total: match line.split_once(';') { Some((qty_text, price_text)) => { ... } None => Err(format!(\"нет разделителя: {line}\")) }."
    - "В ветке Some: let qty = parse_positive(qty_text)?; let price = parse_positive(price_text)?; Ok(qty * price). Оператор ? сам вернёт ошибку из line_total, типы ошибок у обеих функций одинаковы (String)."
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "3;40\n2;abc\n5;10\n"
      expected: "Строка 1: сумма 120\nСтрока 2: ошибка: не число: abc\nСтрока 3: сумма 50\nИтого: 170, ошибок: 1\n"
      hint: "Строки 1 и 3 верные (120 и 50), строка 2 - ошибка «не число: abc»; итого 170, ошибок 1."
    - id: "all-good"
      title: "Все строки верные"
      stdin: "1;1\n10;10\n"
      expected: "Строка 1: сумма 1\nСтрока 2: сумма 100\nИтого: 101, ошибок: 0\n"
      hint: "Суммы 1 и 100, ошибок нет."
    - id: "not-positive"
      title: "Нулевое и отрицательное (скрытый)"
      stdin: "0;5\n4;-2\n"
      expected: "Строка 1: ошибка: не положительное: 0\nСтрока 2: ошибка: не положительное: -2\nИтого: 0, ошибок: 2\n"
      hidden: true
      hint: "Сообщения «не положительное: 0» и «не положительное: -2»; проверка идёт слева направо."
    - id: "no-separator"
      title: "Нет разделителя и пустая строка (скрытый)"
      stdin: "abc\n\n2;3\n"
      expected: "Строка 1: ошибка: нет разделителя: abc\nСтрока 2: ошибка: нет разделителя: \nСтрока 3: сумма 6\nИтого: 6, ошибок: 2\n"
      hidden: true
      hint: "Для «abc» и для пустой строки: «нет разделителя: <строка>» (для пустой - с пустым хвостом); номера считаются для всех строк."
    - id: "spaces"
      title: "Пробелы вокруг чисел (скрытый)"
      stdin: " 2 ; 50 \n"
      expected: "Строка 1: сумма 100\nИтого: 100, ошибок: 0\n"
      hidden: true
      hint: "Пробелы вокруг чисел убираются перед разбором: 2 * 50 = 100."
    - id: "extra-sep"
      title: "Два разделителя (скрытый)"
      stdin: "2;3;4\n"
      expected: "Строка 1: ошибка: не число: 3;4\nИтого: 0, ошибок: 1\n"
      hidden: true
      hint: "split_once режет по первому «;»: цена - «3;4», это не число. Сообщение: «не число: 3;4»."
    - id: "first-error"
      title: "Первая ошибка побеждает (скрытый)"
      stdin: "x;y\n"
      expected: "Строка 1: ошибка: не число: x\nИтого: 0, ошибок: 1\n"
      hidden: true
      hint: "Количество проверяется раньше цены: сообщается ошибка количества («не число: x»)."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: "Итого: 0, ошибок: 0\n"
      hidden: true
      hint: "Строк нет: «Итого: 0, ошибок: 0»."
