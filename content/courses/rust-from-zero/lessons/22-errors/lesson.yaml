id: "rust.from-zero.errors"
title: "Ошибки: panic, expect и Result с оператором ?"
goal: "Различать ошибки программиста и ошибки данных: останавливать программу через panic! и expect, а ошибки ввода возвращать как Result<T, String> и передавать наружу оператором ?."
difficulty: "easy"
estimatedMinutes: 55
prerequisites:
  - "rust.from-zero.string-methods"
objectives:
  - "Объяснить, чем panic! (остановка при баге) отличается от Result (ожидаемая ошибка данных)."
  - "Использовать expect(\"сообщение\") вместо unwrap там, где ошибка невозможна, и читать сообщение паники."
  - "Написать функцию с типом результата Result<i32, String>, возвращающую Ok(значение) или Err(описание)."
  - "Использовать оператор ? в функции, возвращающей Result, как «вернуть Err наружу сразу»."
  - "Читать ошибки: ? в main, значение без Ok, &str вместо String в Err, несовпадающий тип ошибки."
masteryCriteria:
  - "Вы проверяете входные данные и сообщаете о проблеме через Err, а не паникуете на пользовательском вводе."
  - "Вы пишете цепочку проверок через ? и понимаете, что именно ? возвращает при ошибке."
  - "Вы вызываете expect только там, где ошибка означает баг программы."
concepts:
  introduces:
    - "rust.panic"
    - "rust.error-propagation"
    - "rust.question-mark"
  uses:
