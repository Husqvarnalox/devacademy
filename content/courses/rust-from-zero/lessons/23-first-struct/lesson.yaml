id: "rust.from-zero.first-struct"
title: "Первая структура: struct и impl"
goal: "Объединять связанные данные в собственный тип struct и добавлять ему функции и методы через impl: new, &self, &mut self и #[derive(Debug)]."
difficulty: "easy"
estimatedMinutes: 55
prerequisites:
  - "rust.from-zero.errors"
objectives:
  - "Объявить struct с полями, создать значение и читать и менять поля через точку."
  - "Написать impl с ассоциированной функцией new и методами с &self и &mut self."
  - "Вызвать функцию как Student::new(...) и метод как s.describe()."
  - "Добавить #[derive(Debug)] и печатать структуру через {:?} и {:#?}."
  - "Хранить структуры в Vec и разбирать их из строк ввода с пропуском неверных."
masteryCriteria:
  - "Вы заменяете набор связанных переменных одной структурой."
  - "Вы выбираете &self для чтения и &mut self для изменения и объясняете почему."
  - "Вы читаете ошибки E0063, E0599, E0425 и E0277 для структур."
concepts:
  introduces:
    - "rust.struct"
    - "rust.field"
    - "rust.impl"
    - "rust.method-definition"
    - "rust.derive-debug"
  uses:
    - "rust.string"
    - "rust.str"
    - "rust.i32"
    - "rust.mut"
    - "rust.function"
    - "rust.parameter"
    - "rust.return"
    - "rust.reference"
    - "rust.mut-reference"
    - "rust.vec"
    - "rust.vec-iteration"
    - "rust.debug-format"
    - "rust.format-macro"
    - "rust.result"
    - "rust.option"
    - "rust.match"
    - "rust.match-arm"
    - "rust.if"
    - "rust.if-expression"
    - "rust.for"
    - "rust.lines"
    - "rust.trim"
    - "rust.parse"
    - "rust.stdin"
    - "rust.read-to-string"
    - "rust.unwrap"
    - "rust.inline-format"
    - "rust.comparison"
    - "rust.compound-assignment"
    - "rust.method-call"
    - "rust.split"
    - "rust.string-methods"
    - "rust.question-mark"
