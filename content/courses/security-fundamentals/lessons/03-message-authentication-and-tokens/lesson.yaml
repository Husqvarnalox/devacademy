challenge:
  id: security.fundamentals.message-authentication-and-tokens.challenge
  title: "Ротация ключей: kid, активные, выведенные и отозванные ключи"
  prompt: |
    Расширьте верификатор из упражнения до **набора ключей** с идентификаторами `kid` и тремя статусами. Это типичная ротация: новые токены подписывает активный ключ, токены, выпущенные ранее, доживают на выведенном, скомпрометированный ключ отзывается.

    **Ввод.** Первая строка: `k`. Далее `k` строк `<kid> <ключ_base64url> <статус>`, где статус - `active`, `retired` или `revoked`. Далее строки `<now> <токен>` (как в упражнении).

    **Вывод** - по строке на токен: `VALID kid=<kid>` или `REJECT <причина>`.

    **Порядок проверок** тот же, что в упражнении, но между шагами 3 и 4 добавляется выбор ключа:

    * `missing-kid` - в заголовке нет `kid`, он не строка или пуст;
    * `unknown-kid` - такого `kid` нет в наборе;
    * `revoked-kid` - ключ имеет статус `revoked` (токен отвергается до проверки подписи).

    Затем подпись проверяется **ключом, выбранным по kid** (статусы `active` и `retired` проверяют одинаково). Ключ не угадывают перебором и не берут из токена: `kid` - лишь ключ поиска в доверенном наборе.

    **Соглашения:** остальные шаги и причины - `malformed`, `bad-header`, `unsupported-alg`, `bad-signature`, `bad-payload`, `missing-exp`, `bad-claim`, `expired`, `not-yet-valid` - работают как в упражнении. Допуска по времени нет.

    **Пример.** Токен с `kid=k2` (статус `retired`), подписанный ключом k2, при `exp` в будущем даёт `VALID kid=k2`; тот же токен, подписанный ключом k3, даёт `REJECT bad-signature`.
  entryFile: main.py
  evaluation: io
  starter: challenge/starter
  solution: challenge/solution
  hints:
    - "Ключи удобно хранить в словаре `kid -> (байты ключа, статус)`. Поиск по строке не требует ни SQL, ни путей: так kid остаётся данными."
    - "После шага `unsupported-alg` проверьте `kid`: тип str и не пусто, наличие в словаре, статус revoked. Всё это - до вычисления HMAC."
    - "Подпись считайте ключом выбранного kid. Токен, подписанный другим ключом, чем заявлено в kid, даёт bad-signature."
    - "Остальную часть (нагрузка, exp, nbf) переиспользуйте из упражнения без изменений; в успешном ответе добавьте `kid=...`."
  tests:
    - id: active-retired-revoked
      title: "Активный, выведенный и отозванный ключи"
      stdin: "3\nk3 a2V5LWFjdGl2ZS14eHh4eHh4eHh4eHh4eHh4eHh4eHh4 active\nk2 a2V5LXJldGlyZWQteXl5eXl5eXl5eXl5eXl5eXl5eXl5 retired\nk1 a2V5LXJldm9rZWQtenp6enp6enp6enp6enp6enp6eno revoked\n1000 eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImszIn0.eyJleHAiOjIwMDB9.uupzbAfACFJPei_4aGgCBXOSfiRKNPXMEQlFWc1cvXI\n1000 eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImsyIn0.eyJleHAiOjIwMDB9.RYCnfWv0EXOKyAMaz2vTU4N7XFbYqHDdUCNU5ubErcs\n1000 eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImsxIn0.eyJleHAiOjIwMDB9.50H5c9mt0fjiRC-babteKOcCG--GdnQ0nrEBPuD6a8Y\n"
      expected: "VALID kid=k3\nVALID kid=k2\nREJECT revoked-kid\n"
      compare: trim
      hint: "retired всё ещё проверяет подпись (льготный период после ротации), revoked отвергается сразу - до проверки подписи."
