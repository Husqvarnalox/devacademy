id: security.fundamentals.output-encoding-and-xss
title: "Кодирование вывода и XSS: контекст решает, CSP как второй слой"
goal: "Кодировать недоверенные данные под контекст вывода (тело HTML, атрибут, URL, строка JavaScript) и проверять URL по белому списку схем."
difficulty: medium
estimatedMinutes: 90
prerequisites: [security.fundamentals.injection-defences]
related: [networking.fundamentals.http-evolution, python.stdlib.json-csv-struct]
next: [security.fundamentals.sessions-csrf-and-cookies]
seeAlso:
  - "Trusted Types, санитизация HTML (библиотеки вроде DOMPurify) и шаблонизаторы с автоэкранированием (в курсе только упоминаются)"
objectives:
  - Объяснить, чем хранимый, отражённый и DOM-вариант XSS отличаются по месту, где данные становятся кодом.
  - Выбирать правило кодирования по контексту вывода и объяснить, почему одно универсальное экранирование не работает.
  - Реализовать экранирование для тела HTML и атрибута в двойных кавычках и сравнить его с html.escape.
  - Проверять URL перед вставкой в href по белому списку схем с учётом приёмов браузера (пробелы, табуляции, регистр).
  - Описать Content-Security-Policy как дополнительный уровень защиты, а не замену кодированию.
masteryCriteria:
  - Вы выводите данные в тело страницы и в атрибут по разным таблицам и объясняете, что именно ломается при использовании тела в атрибуте.
  - Вы проверяете URL по белому списку схем, а не по чёрному списку javascript:, и применяете кодирование атрибута после проверки.
  - Вы знаете, что html.escape не знает контекста, и называете случаи, когда его недостаточно (JavaScript, URL, неквотированные атрибуты).
  - Вы объясняете, что CSP ослабляет последствия ошибки, но не отменяет кодирование.
tags: [security, xss, output-encoding, html, csp, href, allowlist]
facts:
  - kind: security
    text: >-
      OWASP XSS Prevention Cheat Sheet строится на правиле «кодируйте под контекст»: для тела HTML, атрибутов, JavaScript, CSS и URL правила различаются.
      Недоверенные данные нельзя помещать в произвольные места документа, а для URL нужно проверять схему, а не только кодировать значение.
    sources:
      - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
  - kind: internals
    text: >-
      html.escape из стандартной библиотеки Python заменяет &, < и > и (при quote=True, по умолчанию) двойную и одинарную кавычки. Это контекстно-слепая функция: корректна для текста и для значения
      в кавычках, но не для JavaScript, URL или значений атрибутов без кавычек.
    sources:
      - https://docs.python.org/3/library/html.html
  - kind: real-world
    text: >-
      Content-Security-Policy - заголовок ответа, который ограничивает источники скриптов, стилей и других ресурсов и запрещает встроенные скрипты без nonce или хеша. CSP уменьшает ущерб от пропущенного XSS,
      но MDN прямо называет его вторым уровнем защиты, а не заменой корректной обработки данных.
    sources:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
      - https://cheatsheetseries.owasp.org/cheatsheets/Content_Security_Policy_Cheat_Sheet.html
  - kind: misconception
    text: >-
      «Достаточно удалить слова script и javascript из ввода». Чёрные списки обходятся регистром, пробельными и управляющими символами внутри схемы, кодированием сущностями и разными синтаксическими формами.
      Надёжнее: белый список допустимых схем и кодирование под контекст.
    sources:
      - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: "Что такое XSS в одном предложении?"
      options:
        - "Страница выводит недоверенные данные так, что браузер выполняет их как код или разметку страницы"
        - "Сервер выполняет SQL, пришедший от клиента"
        - "Браузер не проверяет TLS-сертификат"
        - "Пароль хранится в открытом виде"
      answer: 0
      explanation: >-
        Данные пользователя попадают в HTML, и браузер не отличает их от разметки и скриптов самой страницы. Лекарство - кодирование под контекст вывода.
    - id: q2
      type: single
      prompt: "Почему экранирования для тела HTML недостаточно для значения атрибута в двойных кавычках?"
      options:
        - "В теле нужно экранировать больше символов, чем в атрибуте"
        - "В атрибуте значение закрывается кавычкой, а тело кавычки не экранирует"
        - "Атрибуты не поддерживают символ &"
        - "Это неверно: достаточно"
      answer: 1
      explanation: >-
        Двойная кавычка в значении завершила бы атрибут, и остаток строки попал бы в разметку. В атрибуте нужно экранировать и кавычки.
    - id: q3
      type: single
      prompt: "Какой подход к URL в href надёжнее?"
      options:
        - "Удалять подстроку javascript: из значения"
        - "Разрешать только известные схемы (http, https, mailto) и относительные пути, остальное отвергать"
        - "Применять html.escape и не проверять схему"
        - "Преобразовывать значение в нижний регистр"
      answer: 1
      explanation: >-
        Белый список выигрывает у чёрного. html.escape защищает синтаксис атрибута, но не мешает значению javascript:... быть опасной ссылкой.
    - id: q4
      type: multiple
      prompt: "Что верно про Content-Security-Policy? Выберите все."
      options:
        - "Может запретить выполнение встроенных скриптов без nonce"
        - "Ограничивает источники, откуда страница загружает скрипты"
        - "Делает кодирование вывода ненужным"
        - "Это дополнительный слой, снижающий ущерб при ошибке"
      answer: [0, 1, 3]
      explanation: >-
        CSP не заменяет кодирование: ошибки в политике или неохваченные возможности оставят XSS возможным. Глубокая защита - оба уровня.
    - id: q5
      type: single
      prompt: "Как безопаснее всего передать строку со стороны сервера в JavaScript внутри HTML?"
      options:
        - "Вставить значение в кавычки прямо в тексте скрипта"
        - "Сериализовать через JSON и экранировать символы, опасные для HTML (<, >, &, U+2028/2029), либо вынести данные в data-атрибут и читать их из DOM"
        - "Применить html.escape и вставить в скрипт"
        - "Удалить кавычки"
      answer: 1
      explanation: >-
        Контекст JavaScript имеет свои правила. Самый простой надёжный путь - JSON (правильное экранирование строк) плюс защита от закрытия тега script; ещё лучше - data-атрибут и отдельный файл скрипта с CSP.
exercise:
  id: security.fundamentals.output-encoding-and-xss.exercise
  title: "Экранирование тела, атрибута и проверка href"
  prompt: |
    Реализуйте в `main.py` три операции, которыми шаблонизатор защищает вывод. Используйте только стандартную библиотеку; **не вызывайте** `html.escape` в решении (в теории мы его сравним с вашей реализацией).

    **Ввод.** Команды по одной на строку (пустые строки пропускаются). Команда - первое слово, текст - всё остальное после **первого** пробела, без `strip()`:

    * `body <текст>` - вывести текст, экранированный для **тела HTML**;
    * `attr <текст>` - вывести текст, экранированный для значения **атрибута в двойных кавычках**;
    * `href <url>` - проверить URL; вывести `DENY` или `ALLOW <url>`, где url - очищенное значение, экранированное как для атрибута.

    **Таблица тела:** `&` -> `&amp;`, `<` -> `&lt;`, `>` -> `&gt;`.

    **Таблица атрибута** (все символы тела и ещё): `"` -> `&quot;`, `'` -> `&#x27;`, `` ` `` -> `&#x60;`, перевод строки -> `&#xA;`, возврат каретки -> `&#xD;`, табуляция -> `&#x9;`.

    Экранирование делается **посимвольно за один проход**: уже существующая последовательность `&amp;` в вводе превращается в `&amp;amp;` (мы не пытаемся угадывать, закодировано ли значение).

    **Проверка href.**

    1. **Очистка** (как делает браузер): удалить все табуляции, `\r` и `\n` внутри строки; удалить в начале и конце все символы с кодом не больше U+0020 (пробел и управляющие).
    2. Пустой результат - `DENY`.
    3. Возьмите «голову»: часть до первого из символов `/`, `?`, `#` (или всю строку). Если в голове есть `:`, то схема - всё до первого двоеточия. Она должна соответствовать `[A-Za-z][A-Za-z0-9+.-]*` и, **без учёта регистра**, быть одной из `http`, `https`, `mailto`; иначе `DENY`.
    4. Если двоеточия в голове нет, это относительный URL: `DENY`, если он начинается с `//` или с обратного слэша (`\`, в том числе `/\`); иначе допустим.
    5. Допустимый URL выводится как `ALLOW ` + очищенный URL, экранированный по таблице атрибута (регистр сохраняется).

    **Соглашения:** проверка делается над строкой до экранирования, а экранирование - последним шагом; других схем (`ftp`, `tel`, `data`, `blob`) в белом списке нет.

    **Пример.** `body <b>&</b>` -> `&lt;b&gt;&amp;&lt;/b&gt;`; `href https://example.com/a?x=1&y=2` -> `ALLOW https://example.com/a?x=1&amp;y=2`; `href javascript:void(0)` -> `DENY`.
  entryFile: main.py
  evaluation: io
  hints:
    - "Таблицы - словари символ -> замена. Функция `escape` проходит по строке и для каждого символа берёт `table.get(ch, ch)`: так `&` заменяется ровно один раз."
    - "Очистка URL: три вызова `replace` для \\t, \\r, \\n, затем `strip` с набором символов с кодами 0..32: `''.join(chr(i) for i in range(0x21))`."
    - "Голова URL: найдите минимальный индекс среди `/`, `?`, `#` (если ни одного нет - вся длина). Двоеточие в голове означает схему; проверьте её регулярным выражением и белым списком без учёта регистра."
    - "Относительный URL отвергайте при `startswith('//')` и при начале с `\\`. Не забывайте: ALLOW выводит очищенный URL, прошедший через таблицу атрибута."
  tests:
    - id: body
      title: "Экранирование в теле HTML"
      stdin: "body <b>Tom & \"Jerry\"</b>\nbody 5 < 6 && 7 > 3\nbody &amp; уже закодировано\nbody O'Brien\n"
      expected: "&lt;b&gt;Tom &amp; \"Jerry\"&lt;/b&gt;\n5 &lt; 6 &amp;&amp; 7 &gt; 3\n&amp;amp; уже закодировано\nO'Brien\n"
      compare: trim
      hint: "В теле нужны только три замены: & -> &amp;, < -> &lt;, > -> &gt;. Кавычки в теле не трогаем. Важно, чтобы & заменялся один раз: делайте замену посимвольно, а не цепочкой replace в неверном порядке."
    - id: attr
      title: "Экранирование в атрибуте в двойных кавычках"
      stdin: "attr x\" class=\"y\nattr it's `tick` <b>&\nattr line1\tTabbed\n"
      expected: "x&quot; class=&quot;y\nit&#x27;s &#x60;tick&#x60; &lt;b&gt;&amp;\nline1&#x9;Tabbed\n"
      compare: trim
      hint: "Для атрибута к трём заменам добавляются: \" -> &quot;, ' -> &#x27;, ` -> &#x60;, а также перевод строки, возврат каретки и табуляция -> &#xA;, &#xD;, &#x9;."
    - id: href-basic
      title: "Разрешённые и запрещённые схемы href"
      stdin: "href https://example.com/a?x=1&y=2\nhref javascript:void(0)\nhref mailto:user@example.com\nhref /docs/index.html#top\nhref data:text/html,hello\n"
      expected: "ALLOW https://example.com/a?x=1&amp;y=2\nDENY\nALLOW mailto:user@example.com\nALLOW /docs/index.html#top\nDENY\n"
      compare: trim
      hint: "Разрешены схемы http, https, mailto и относительные ссылки. Результат ALLOW - уже готов к вставке в атрибут: символ & превращается в &amp;."
    - id: scheme-tricks
      title: "Регистр, пробелы и управляющие символы в схеме (скрытый)"
      stdin: "href  JaVaScRiPt:void(0)\nhref   javascript:void(0)\nhref java\tscript:void(0)\nhref \u0001javascript:void(0)\nhref HTTP://Example.com/Path\nhref vbscript:x\nhref file:///etc/hosts\n"
      expected: "DENY\nDENY\nDENY\nDENY\nALLOW HTTP://Example.com/Path\nDENY\nDENY\n"
      compare: trim
      hidden: true
      hint: "Сначала очистка как у браузера: убрать табуляции/переводы строк внутри и символы <= U+0020 по краям. Затем схема сравнивается без учёта регистра со списком http, https, mailto. Выведенный URL - очищенный, регистр сохраняется."
    - id: relative
      title: "Относительные URL и схемо-относительные (скрытый)"
      stdin: "href //evil.example/x\nhref /\\evil.example\nhref \\\\host\\share\nhref page.html\nhref ?q=1&r=2\nhref #section\nhref x/y:z\nhref /a:b\nhref a:b/c\nhref 1abc:x\n"
      expected: "DENY\nDENY\nDENY\nALLOW page.html\nALLOW ?q=1&amp;r=2\nALLOW #section\nALLOW x/y:z\nALLOW /a:b\nDENY\nDENY\n"
      compare: trim
      hidden: true
      hint: "'//host' и обратный слэш в начале - не относительный путь: DENY. Двоеточие в первом сегменте до '/', '?', '#' означает схему: она должна быть допустимой. Двоеточие позже (x/y:z, /a:b) - обычный путь."
    - id: entities-empty
      title: "Пустые значения и псевдо-сущности (скрытый)"
      stdin: "href \nhref    \nhref javascript&colon;void(0)\nhref &#106;avascript:x\nbody <>&\nattr \"'\n"
      expected: "DENY\nDENY\nALLOW javascript&amp;colon;void(0)\nALLOW &amp;#106;avascript:x\n&lt;&gt;&amp;\n&quot;&#x27;\n"
      compare: trim
      hidden: true
      hint: "Пустая строка и пробелы - DENY. 'javascript&colon;...' не содержит двоеточия, поэтому это относительный URL, а & в нём превращается в &amp; (браузер увидит буквально &colon;). В '&#106;avascript:x' символ '#' начинает фрагмент, поэтому «головы» с двоеточием нет: это относительный URL, и & в нём кодируется."
