id: security.fundamentals.threat-modelling
title: "Модель угроз и принципы защиты: CIA, поверхность атаки, STRIDE"
goal: "Описать систему потоками данных и границами доверия, найти типовые угрозы по STRIDE и выбрать принципы проектирования, которые их ослабляют."
difficulty: easy
estimatedMinutes: 75
prerequisites: [python.fundamentals.dicts-and-sets]
related: [networking.fundamentals.tls-and-diagnostics, os.fundamentals.processes-and-system-calls]
next: [security.fundamentals.password-storage]
seeAlso:
  - "Деревья атак, оценка риска (DREAD, CVSS) и формальные методы моделирования (в курсе только упоминаются)"
objectives:
  - Объяснить свойства CIA и привести пример нарушения каждого.
  - Нарисовать систему как набор компонентов, потоков данных и границ доверия и выделить поверхность атаки.
  - Сопоставить категории STRIDE с нарушаемыми свойствами и типовыми защитами.
  - Применять принципы наименьших привилегий, глубокой защиты, отказа по умолчанию и минимизации поверхности.
  - Реализовать детерминированную таблицу правил, которая по описанию потока выдаёт набор категорий STRIDE.
masteryCriteria:
  - Вы сопоставляете каждую из шести букв STRIDE со свойством безопасности и защитой без подсказки.
  - Вы определяете, пересекает ли поток границу доверия, и понимаете, почему это главный повод искать угрозы.
  - Ваш классификатор верно обрабатывает поток к внешней сущности, повышение уровня доверия и поток без угроз.
  - Вы отличаете угрозу (что может пойти не так) от защиты (что мы с этим делаем) и не подменяете одно другим.
tags: [security, threat-modelling, stride, cia, least-privilege, defence-in-depth]
facts:
  - kind: real-world
    text: >-
      OWASP Threat Modeling Cheat Sheet опирается на манифест моделирования угроз: процесс должен отвечать на четыре вопроса - над чем мы работаем, что может пойти не так,
      что мы с этим сделаем и достаточно ли хорошо это получилось. STRIDE там использован как мнемоника для шести групп угроз и описан как «зрелая и популярная техника», а не единственная возможная.
    sources:
      - https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html
  - kind: real-world
    text: >-
      Анализ поверхности атаки - это выявление частей системы, которые нужно проверять на уязвимости: точек входа, данных и привилегий. Внутренняя поверхность отличается от внешней,
      а уменьшение поверхности (отключённые функции, закрытые порты, меньше привилегий) уменьшает и число мест, где может возникнуть ошибка.
    sources:
      - https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html
  - kind: security
    text: >-
      OWASP Authorization Cheat Sheet в числе первых рекомендаций называет принцип наименьших привилегий и «запрет по умолчанию» (deny by default): всё, что явно не разрешено, запрещено.
      Нарушение наименьших привилегий ослабляет конфиденциальность ресурсов.
    sources:
      - https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
  - kind: misconception
    text: >-
      «Шифрование - это безопасность». Шифрование защищает конфиденциальность канала или хранилища, но не отвечает на вопросы аутентификации, авторизации, целостности и доступности.
      Модель угроз нужна как раз для того, чтобы не закрывать одну угрозу в ущерб остальным.
    sources:
      - https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: "Какое свойство CIA нарушено, если злоумышленник незаметно изменил сумму в переданном платеже?"
      options:
        - "Конфиденциальность"
        - "Целостность"
        - "Доступность"
        - "Неотказуемость"
      answer: 1
      explanation: >-
        Целостность - данные не изменены неавторизованно. Утечка суммы нарушила бы конфиденциальность, недоступность сервиса - доступность.
    - id: q2
      type: single
      prompt: "Какая категория STRIDE описывает ситуацию «пользователь утверждает, что не отправлял запрос, а журналов, которые это опровергли бы, нет»?"
      options:
        - "Spoofing"
        - "Tampering"
        - "Repudiation"
        - "Elevation of privilege"
      answer: 2
      explanation: >-
        Repudiation - отказ от совершённого действия. Защита - надёжный аудит (кто, что, когда), защищённый от правки, а также аутентификация действующего.
    - id: q3
      type: multiple
      prompt: "Что из перечисленного уменьшает поверхность атаки? Выберите все."
      options:
        - "Отключить неиспользуемые эндпоинты и отладочные интерфейсы"
        - "Запускать сервис от непривилегированного пользователя"
        - "Добавить ещё один публичный параметр для гибкости"
        - "Закрыть порты, которые снаружи не нужны"
      answer: [0, 1, 3]
      explanation: >-
        Каждая лишняя точка входа и каждая лишняя привилегия - потенциальная ошибка. Новый публичный параметр, наоборот, расширяет поверхность.
    - id: q4
      type: single
      prompt: "Что означает «глубокая защита» (defence in depth)?"
      options:
        - "Одна очень надёжная защита на входе"
        - "Несколько независимых уровней защиты, так что отказ одного не ведёт к компрометации"
        - "Хранение данных в самом глубоком каталоге"
        - "Шифрование данных несколько раз подряд"
      answer: 1
      explanation: >-
        Валидация на входе, параметризация запросов, минимальные права БД и мониторинг - это независимые уровни. Ошибка в одном не должна давать атакующему всё.
    - id: q5
      type: single
      prompt: "Почему поток данных, пересекающий границу доверия, - главный повод искать угрозы?"
      options:
        - "Потому что такие потоки всегда медленные"
        - "Потому что по ту сторону границы данным и источнику нельзя доверять, пока не проверено обратное"
        - "Потому что на границе нельзя использовать TLS"
        - "Потому что границы доверия бывают только в сети"
      answer: 1
      explanation: >-
        Данные из менее доверенной зоны могут быть подделаны, изменены или присланы не тем отправителем. Именно здесь нужны аутентификация, валидация и ограничение привилегий.
exercise:
  id: security.fundamentals.threat-modelling.exercise
  title: "Классификатор угроз STRIDE по таблице правил"
  prompt: |
    Реализуйте в `main.py` разбор описания системы и применение **детерминированной таблицы правил**: для каждого потока данных нужно вывести набор категорий STRIDE.
    Это учебная модель: она показывает, как формализуется ход мысли при моделировании угроз, но не заменяет работу с реальной системой.

    **Формат ввода.** Первая строка: `n m`. Далее `n` строк компонентов `<имя> <вид> <зона>` и `m` строк потоков `<источник> <получатель> <канал> <операция>`.

    * `вид` - `external` (внешняя сущность), `process` (процесс) или `store` (хранилище);
    * `зона` - `internet`, `dmz` или `internal`; уровень доверия растёт в этом порядке (0, 1, 2); поток, у которого зоны источника и получателя различны, **пересекает границу доверия**;
    * `канал` - `tls` (защищён) или `plain` (открытый);
    * `операция` - `read`, `write` или `call`.

    **Правила.** Для потока `s -> d` категория добавляется, если выполнено условие:

    | Буква | Категория | Условие |
    |---|---|---|
    | `S` | Spoofing | вид источника `external` **или** зоны источника и получателя различаются |
    | `T` | Tampering | канал `plain` **или** операция `write` |
    | `R` | Repudiation | операция `write` или `call` **и** вид получателя не `external` |
    | `I` | Information disclosure | канал `plain` **или** операция `read` |
    | `D` | Denial of service | вид получателя `process` **или** зона источника `internet` |
    | `E` | Elevation of privilege | вид получателя `process` **и** уровень зоны источника строго ниже уровня зоны получателя |

    **Соглашения модели:**

    * Буквы в строке всегда идут в порядке `S, T, R, I, D, E` и разделены запятой без пробелов; если ни одно условие не выполнено, выводится `none`.
    * Потоки обрабатываются в порядке ввода. Имена в потоках всегда описаны среди компонентов.
    * Типы канала и операции фиксированы выше; других значений в тестах нет.

    **Формат вывода.**

    ```
    <источник>-><получатель>: S,T,I        (по строке на поток)
    crossings: K                           (сколько потоков пересекают границу доверия)
    summary: S=a T=b R=c I=d D=e E=f       (сколько потоков получили каждую букву)
    ```

    **Пример.** Для потока `browser web tls call` (внешний браузер из `internet` обращается к процессу в `dmz`) получается `S,R,D,E`: источник внешний, это вызов процесса, получатель - процесс, зона источника ниже.
  entryFile: main.py
  evaluation: io
  hints:
    - "Для каждого потока нужны вид и зона обоих концов: достаньте их из словаря компонентов. Затем шесть независимых проверок, каждая добавляет свою букву."
    - "Результат собирайте во множество, а выводите буквы в фиксированном порядке «STRIDE»: `[c for c in 'STRIDE' if c in found]`. Так порядок не зависит от порядка проверок."
    - "Пересечение границы: `src_zone != dst_zone`. Уровень зоны берите из словаря LEVEL; E требует строго меньший уровень у источника."
    - "Итоги: заведите словарь счётчиков по буквам и счётчик пересечений, а в конце выведите их одной строкой в порядке S, T, R, I, D, E."
  tests:
    - id: sample
      title: "Пример из условия: браузер, веб, API, БД"
      stdin: "4 5\nbrowser external internet\nweb process dmz\napi process internal\ndb store internal\nbrowser web tls call\nweb api tls call\napi db plain write\napi db plain read\nweb browser tls read\n"
      expected: "browser->web: S,R,D,E\nweb->api: S,R,D,E\napi->db: T,R,I\napi->db: T,I\nweb->browser: S,I\ncrossings: 3\nsummary: S=3 T=2 R=3 I=3 D=2 E=2\n"
      compare: trim
      hint: "Поток api->db по plain с write даёт T, R, I, но не S и не D: оба конца в одной зоне, а получатель - хранилище, не процесс."
    - id: tls-internal
      title: "Всё внутри одной зоны по TLS"
      stdin: "3 2\njob process internal\nq store internal\ncache store internal\njob q tls read\njob cache tls call\n"
      expected: "job->q: I\njob->cache: R\ncrossings: 0\nsummary: S=0 T=0 R=1 I=1 D=0 E=0\n"
      compare: trim
      hint: "Одна зона, TLS: S не возникает. Для read остаётся только I, для call с получателем-хранилищем - только R."
    - id: plain-boundary
      title: "Открытый канал через границу доверия"
      stdin: "2 1\nuser external internet\nsite process dmz\nuser site plain write\n"
      expected: "user->site: S,T,R,I,D,E\ncrossings: 1\nsummary: S=1 T=1 R=1 I=1 D=1 E=1\n"
      compare: trim
      hint: "plain даёт T и I, write даёт T и R, внешний источник даёт S, получатель-процесс даёт D, переход из менее доверенной зоны даёт E."
    - id: to-external
      title: "Ответ наружу: получатель - внешняя сущность (скрытый)"
      stdin: "2 2\nuser external internet\napp process dmz\napp user tls call\napp user plain read\n"
      expected: "app->user: S\napp->user: S,T,I\ncrossings: 2\nsummary: S=2 T=1 R=0 I=1 D=0 E=0\n"
      compare: trim
      hidden: true
      hint: "Если получатель external, R не выставляется (аудит ведёт принимающая сторона), D тоже нет. S возникает из-за пересечения зон."
    - id: no-findings
      title: "Поток без угроз: none (скрытый)"
      stdin: "2 2\nops external internal\napp process internal\napp ops tls call\napp ops tls read\n"
      expected: "app->ops: none\napp->ops: I\ncrossings: 0\nsummary: S=0 T=0 R=0 I=1 D=0 E=0\n"
      compare: trim
      hidden: true
      hint: "app->ops по TLS с call: источник - процесс в той же зоне (S нет), получатель - external (R, D нет), канал защищён. Список пуст, значит 'none'. Второй поток с read даёт I."
    - id: privilege-levels
      title: "Повышение уровня: dmz -> internal и internal -> dmz (скрытый)"
      stdin: "3 3\ngw process dmz\ncore process internal\nrep store dmz\ngw core tls call\ncore gw tls call\ncore rep tls write\n"
      expected: "gw->core: S,R,D,E\ncore->gw: S,R,D\ncore->rep: S,T,R\ncrossings: 3\nsummary: S=3 T=1 R=3 I=0 D=2 E=1\n"
      compare: trim
      hidden: true
      hint: "E только когда уровень зоны источника строго ниже уровня получателя: gw->core даёт E, core->gw не даёт."
