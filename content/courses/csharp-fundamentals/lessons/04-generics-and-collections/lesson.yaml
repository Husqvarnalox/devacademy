id: "csharp.fundamentals.generics-and-collections"
title: "Обобщения и коллекции"
goal: "Писать обобщённые типы и методы с ограничениями, понимать вариантность и выбирать коллекцию по сложности операций."
difficulty: "medium"
estimatedMinutes: 60
prerequisites:
  - "csharp.fundamentals.interfaces-inheritance-polymorphism"
related:
  - "go.fundamentals.maps-and-slices-deep-dive"
  - "java.first-steps.primitives-objects-and-equality"
next:
  - "csharp.fundamentals.linq"
objectives:
  - "Писать обобщённые методы и классы и подбирать ограничения where для нужных операций."
  - "Объяснять ковариантность и контравариантность на примерах IEnumerable<out T> и Action<in T>."
  - "Выбирать между List, Dictionary, HashSet и SortedDictionary по сложности операций."
  - "Использовать выражения коллекций и распространение и различать IEnumerable<T> и IReadOnlyList<T>."
masteryCriteria:
  - "Вы реализуете обобщённый класс с ограничением notnull и словарём внутри и объясняете, почему операции выполняются за O(1)."
  - "Вы называете, какие присваивания обобщённых типов компилируются, а какие нет (CS0029) и почему."
  - "Вы заменяете List.Contains в цикле на HashSet и объясняете выигрыш."
  - "Вы объясняете, чем IReadOnlyList отличается от неизменяемой коллекции."
tags:
  - "csharp"
  - "generics"
  - "collections"
  - "variance"
  - "complexity"
facts:
  - kind: "internals"
    text: "Обобщения в .NET не стираются: информация о параметрах типа сохраняется во время выполнения, поэтому typeof(List<int>) и typeof(List<string>) - разные типы. Для значимых аргументов типа среда выполнения создаёт отдельный машинный код, благодаря чему значения хранятся без упаковки."
    sources:
      - "https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/types/generics"
      - "https://learn.microsoft.com/en-us/dotnet/standard/generics/"
  - kind: "internals"
    text: "Dictionary<TKey,TValue> реализован как хеш-таблица: поиск по ключу выполняется за время, близкое к O(1), и зависит от качества хеш-функции ключа. List<T>.Contains выполняет линейный поиск за O(n), а SortedDictionary - двоичное дерево с поиском за O(log n)."
    sources:
      - "https://learn.microsoft.com/en-us/dotnet/api/system.collections.generic.dictionary-2"
      - "https://learn.microsoft.com/en-us/dotnet/api/system.collections.generic.list-1.contains"
      - "https://learn.microsoft.com/en-us/dotnet/api/system.collections.generic.sorteddictionary-2"
  - kind: "internals"
    text: "Ковариантность (out) и контравариантность (in) допустимы только для интерфейсов и делегатов и только для ссылочных аргументов типа. IEnumerable<out T> ковариантен, Action<in T> контравариантен, а List<T> инвариантен."
    sources:
      - "https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/concepts/covariance-contravariance/"
      - "https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/keywords/out-generic-modifier"
  - kind: "historical"
    text: "Выражения коллекций ([1, 2, 3] и оператор распространения ..) появились в C# 12 вместе с .NET 8; ограничение where T : INumber<T> опирается на статические абстрактные члены интерфейсов (C# 11, .NET 7)."
    sources:
      - "https://learn.microsoft.com/en-us/dotnet/csharp/whats-new/csharp-12"
      - "https://learn.microsoft.com/en-us/dotnet/csharp/whats-new/csharp-11"
  - kind: "misconception"
    text: "«IReadOnlyList<T> - неизменяемая коллекция». Это только интерфейс чтения: если за ним стоит List<T>, то изменения исходного списка видны через интерфейс. Неизменяемость дают ImmutableArray<T>, ImmutableList<T> и коллекции из System.Collections.Frozen."
    sources:
      - "https://learn.microsoft.com/en-us/dotnet/api/system.collections.generic.ireadonlylist-1"
  - kind: "performance"
    text: "Проверка принадлежности через List<T>.Contains внутри цикла даёт квадратичное время. HashSet<T>.Contains выполняется за O(1), поэтому переход на множество - одна из самых частых оптимизаций."
    sources:
      - "https://learn.microsoft.com/en-us/dotnet/api/system.collections.generic.hashset-1.contains"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Какая из строк НЕ компилируется?"
      options:
        - "IEnumerable<object> a = new List<string>();"
        - "Action<string> b = (Action<object>)(o => { });"
        - "List<object> c = new List<string>();"
        - "object[] d = new string[1];"
      answer: 2
      explanation: "List<T> инвариантен (CS0029). IEnumerable<out T> ковариантен, Action<in T> контравариантен, массивы ковариантны (небезопасно)."
    - id: "q2"
      type: "single"
      prompt: "Нужно много раз проверять, встречалось ли значение среди миллиона элементов. Какая структура подходит лучше всего?"
      options:
        - "List<T> и Contains"
        - "HashSet<T> и Contains"
        - "LinkedList<T> и Find"
        - "T[] и Array.IndexOf"
      answer: 1
      explanation: "HashSet<T>.Contains работает за O(1) в среднем; остальные варианты выполняют линейный поиск O(n)."
    - id: "q3"
      type: "multiple"
      prompt: "Какие утверждения верны?"
      options:
        - "Обобщения .NET сохраняются во время выполнения: typeof(List<int>) != typeof(List<string>)."
        - "IReadOnlyList<T> делает коллекцию неизменяемой."
        - "Параметр out T допускает T только в выходных позициях."
        - "Dictionary гарантирует перебор в порядке добавления."
      answer:
        - 0
        - 2
      explanation: "IReadOnlyList<T> лишь запрещает изменение через интерфейс, а порядок перебора Dictionary не гарантируется контрактом."
    - id: "q4"
      type: "numeric"
      prompt: "Сколько элементов в b после List<int> a = [1, 2, 3]; List<int> b = [.. a, 4, .. a];?"
      answer: 7
      tolerance: 0
      explanation: "Распространение .. вставляет все элементы: 3 + 1 + 3 = 7."
exercise:
  id: "csharp.fundamentals.generics-and-collections.exercise"
  title: "Обобщённый LRU-кэш"
  prompt: |
    Реализуйте обобщённый кэш `LruCache<TKey, TValue>` с ограничением `where TKey : notnull`, вытесняющий **наименее недавно использованный** ключ. Все операции должны выполняться за `O(1)`.

    Первая строка ввода - ёмкость `c` (`c >= 1`), вторая - число команд `n`, затем `n` команд (ключ - слово, значение - целое):

    * `put <ключ> <значение>` - добавить или обновить пару; ключ становится самым свежим. Если кэш был полон и ключ новый, вытесняется самый старый ключ и печатается `evict <ключ>`;
    * `get <ключ>` - напечатать значение и сделать ключ самым свежим, либо `miss` (порядок при промахе не меняется);
    * `keys` - ключи от самого свежего к самому старому через пробел или `empty`;
    * `size` - напечатать `size=<число элементов>`.

    **Пример** (`c = 2`):

    ```
    put a 1
    put b 2
    put c 3
    get a
    keys
    ```

    выведет

    ```
    evict a
    miss
    c b
    ```

    **Что дано.** Заготовка компилируется, но «кэш» просто хранит все пары в `Dictionary`. Добавьте связный список (`LinkedList<(TKey, TValue)>`), чтобы вытеснение и порядок использования работали за `O(1)`.
  entryFile: "Program.cs"
  evaluation: "io"
  starter: "exercise/starter"
  solution: "exercise/solution"
  hints:
    - "Одного словаря мало: нужен порядок использования. Храните в Dictionary<TKey, LinkedListNode<...>> узлы связного списка, где первый узел - самый свежий."
    - "Put существующего ключа: обновите значение в узле, перенесите узел в начало (Remove, затем AddFirst). Put нового ключа в полный кэш: удалите order.Last из списка и его ключ из словаря."
    - "TryGet: найдите узел в словаре; при успехе перенесите его в начало списка и верните значение, при промахе ничего не меняйте."
    - "KeysByRecency перечисляет связный список с начала. Put должен возвращать вытесненный ключ (или default), а программа печатает `evict <ключ>`, если вернулось не null."
  tests:
    - id: "evict"
      title: "Вытеснение самого старого"
      stdin: "2\n5\nput a 1\nput b 2\nput c 3\nget a\nkeys\n"
      expected: "evict a\nmiss\nc b\n"
      hint: "При put c в полный кэш вытесняется a: он добавлен раньше всех."
    - id: "refresh"
      title: "get обновляет свежесть"
      stdin: "2\n6\nput a 1\nput b 2\nget a\nput c 3\nkeys\nget b\n"
      expected: "1\nevict b\nc a\nmiss\n"
      hint: "После get a самым старым становится b, поэтому вытесняется именно он."
    - id: "update"
      title: "put существующего ключа"
      stdin: "2\n5\nput a 1\nput a 5\nget a\nsize\nkeys\n"
      expected: "5\nsize=1\na\n"
      hint: "Обновление ключа не увеличивает размер и не вытесняет другие ключи."
    - id: "cap1"
      title: "Ёмкость 1 (скрытый)"
      stdin: "1\n7\nput a 1\nput b 2\nput b 3\nget a\nget b\nkeys\nsize\n"
      expected: "evict a\nmiss\n3\nb\nsize=1\n"
      hidden: true
      hint: "При ёмкости 1 каждое новое имя вытесняет предыдущее; обновление b вытеснения не вызывает."
    - id: "miss"
      title: "Промах не меняет порядок (скрытый)"
      stdin: "3\n7\nkeys\nput x 1\nput y 2\nget zzz\nkeys\nput z 3\nput w 4\n"
      expected: "empty\nmiss\ny x\nevict x\n"
      hidden: true
      hint: "get zzz не должен менять порядок. Пустой кэш печатает empty. Последний put вытесняет x."
    - id: "many"
      title: "Длинная серия операций (скрытый)"
      stdin: "3\n16\nput a 1\nput b 2\nput c 3\nget a\nput d 4\nput e 5\nget c\nget a\nkeys\nput f 6\nput a 7\nget a\nget e\nget f\nkeys\nsize\n"
      expected: "1\nevict b\nevict c\nmiss\n1\na e d\nevict d\n7\n5\n6\nf e a\nsize=3\n"
      hidden: true
      hint: "Проследите порядок вручную: вытесняются по очереди b, c и d."
