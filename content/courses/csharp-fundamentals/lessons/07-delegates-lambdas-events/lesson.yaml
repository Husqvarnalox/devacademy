id: "csharp.fundamentals.delegates-lambdas-events"
title: "Делегаты, лямбды и события"
goal: "Использовать делегаты и лямбды, понимать захват переменных замыканиями и безопасно работать с событиями, включая отписку."
difficulty: "medium"
estimatedMinutes: 55
prerequisites:
  - "csharp.fundamentals.linq"
  - "csharp.fundamentals.exceptions-and-resources"
related:
  - "javascript.fundamentals.scope-and-closures"
  - "go.fundamentals.functions-and-errors"
next:
  - "csharp.fundamentals.async-await"
objectives:
  - "Применять Action, Func и Predicate и объяснять многоадресные делегаты."
  - "Предсказывать результат замыканий над переменными циклов for и foreach."
  - "Объявлять события, подписываться и отписываться тем же делегатом и предотвращать утечки."
  - "Писать локальные функции и статические лямбды и знать, с какой версии C# доступны возможности лямбд."
masteryCriteria:
  - "Вы объясняете, почему три лямбды, захватившие переменную цикла for, печатают одно и то же значение."
  - "Вы объясняете, почему ev -= x => ... с новой лямбдой не отписывает обработчик."
  - "Вы называете, как событие удерживает подписчика в памяти, и когда отписываться."
  - "Вы называете C#-версии естественного типа лямбды, статических лямбд и параметров по умолчанию в лямбдах."
tags:
  - "csharp"
  - "delegates"
  - "lambdas"
  - "closures"
  - "events"
facts:
  - kind: "internals"
    text: "Делегаты в .NET неизменяемы и многоадресны: оператор += создаёт новый делегат с объединённым списком вызова, а -= удаляет последнее вхождение равного делегата. Многоадресный Func возвращает значение последнего обработчика."
    sources:
      - "https://learn.microsoft.com/en-us/dotnet/api/system.delegate"
      - "https://learn.microsoft.com/en-us/dotnet/api/system.multicastdelegate"
      - "https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/delegates/"
  - kind: "internals"
    text: "Лямбда захватывает переменные внешнего метода: компилятор создаёт скрытый класс, поля которого хранят захваченные переменные. В цикле for переменная одна на весь цикл, в foreach - новая на каждой итерации (с C# 5)."
    sources:
      - "https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/operators/lambda-expressions"
      - "https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/statements/iteration-statements"
  - kind: "historical"
    text: "Естественный тип лямбда-выражения (var f = (int x) => x;) появился в C# 10, статические анонимные функции - в C# 9, значения параметров по умолчанию в лямбдах - в C# 12."
    sources:
      - "https://learn.microsoft.com/en-us/dotnet/csharp/whats-new/csharp-10"
      - "https://learn.microsoft.com/en-us/dotnet/csharp/whats-new/csharp-9"
      - "https://learn.microsoft.com/en-us/dotnet/csharp/whats-new/csharp-12"
  - kind: "misconception"
    text: "«Достаточно написать -= с такой же лямбдой». Два лямбда-выражения с одинаковым текстом создают разные делегаты, поэтому отписка новой лямбдой ничего не удаляет; сохраните обработчик в переменную либо используйте метод."
    sources:
      - "https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/events/how-to-subscribe-to-and-unsubscribe-from-events"
      - "https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/operators/lambda-expressions"
  - kind: "performance"
    text: "Издатель события хранит ссылки на делегаты подписчиков, поэтому неотписанный подписчик не будет собран сборщиком мусора, пока жив издатель. Отписывайтесь в Dispose() или при закрытии, а в горячих местах предпочитайте static-лямбды, которые не захватывают состояние."
    sources:
      - "https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/events/"
      - "https://learn.microsoft.com/en-us/dotnet/standard/events/"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "var fs = new List<Func<int>>(); for (int i = 0; i < 3; i++) fs.Add(() => i); Что вернёт fs[0]() после цикла?"
      options:
        - "0"
        - "2"
        - "3"
        - "Ошибка компиляции"
      answer: 2
      explanation: "Лямбды захватили одну общую переменную i, а после цикла она равна 3."
    - id: "q2"
      type: "numeric"
      prompt: "Func<int> MakeCounter() { int c = 0; return () => ++c; } Вы создали a и b = MakeCounter(); вызвали a() дважды и b() один раз. Что вернёт третий вызов a()?"
      answer: 3
      tolerance: 0
      explanation: "У каждого вызова MakeCounter своя переменная c; у a после двух вызовов c = 2, третий даёт 3."
    - id: "q3"
      type: "multiple"
      prompt: "Какие утверждения верны?"
      options:
        - "В foreach переменная цикла создаётся заново на каждой итерации."
        - "Публичное event позволяет любому коду вызывать его."
        - "Многоадресный Func<int> возвращает значение последнего обработчика."
        - "Издатель события удерживает подписчиков в памяти."
      answer:
        - 0
        - 2
        - 3
      explanation: "Вызвать event снаружи нельзя, только += и -=; остальное верно."
    - id: "q4"
      type: "single"
      prompt: "Как надёжно отписаться от события, на которое подписались лямбдой?"
      options:
        - "ev -= тем же текстом лямбды"
        - "Сохранить лямбду в переменную Action<T> и использовать её в += и -="
        - "ev = null снаружи"
        - "Вызвать GC.Collect()"
      answer: 1
      explanation: "Отписка работает по равенству делегатов; нужен тот же экземпляр. Присвоить null событию снаружи нельзя."
exercise:
  id: "csharp.fundamentals.delegates-lambdas-events.exercise"
  title: "Шина событий"
  prompt: |
    Реализуйте шину событий с подписками. Первая строка ввода - число команд `n`, затем `n` команд:

    * `on <id> <тема>` - подписать обработчик `id` на тему. Каждая **подписка** имеет собственный счётчик получений. Если такая подписка уже есть, напечатайте `already subscribed` и ничего не добавляйте;
    * `off <id> <тема>` - отписать ровно тот обработчик, который был подписан; если подписки нет, напечатайте `not subscribed`;
    * `emit <тема> <данные>` - вызвать всех подписчиков темы в порядке подписки; каждый печатает `<id>#<k>: <данные>`, где `k` - сколько раз этот обработчик уже вызывался (с 1). Если подписчиков нет - напечатайте `no listeners`;
    * `count <тема>` - напечатать число подписчиков темы.

    **Пример**

    ```
    on a news
    on b news
    emit news hi
    off a news
    emit news yo
    count news
    ```

    выведет

    ```
    a#1: hi
    b#1: hi
    b#2: yo
    1
    ```

    **Что дано.** Заготовка компилируется, но использует один общий счётчик на всех и отписывается новой лямбдой, которая ничего не удаляет. Сделайте счётчик собственным у каждой подписки (замыкание в фабрике) и храните подписанный делегат, чтобы отписать именно его.
  entryFile: "Program.cs"
  evaluation: "io"
  starter: "exercise/starter"
  solution: "exercise/solution"
  hints:
    - "Счётчик должен жить в замыкании: напишите фабрику static Action<string> MakeHandler(string id) { int count = 0; return payload => Console.WriteLine($\"{id}#{++count}: {payload}\"); }."
    - "Храните созданные делегаты в Dictionary<(string Id, string Topic), Action<string>>: ключ - пара id и тема."
    - "Для off достаньте сохранённый делегат из словаря (Remove(key, out var handler)) и выполните topic.Published -= handler: отписка работает по равенству делегатов."
    - "Число подписчиков: Published?.GetInvocationList().Length ?? 0; для emit при нуле печатайте no listeners вместо вызова."
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "6\non a news\non b news\nemit news hi\noff a news\nemit news yo\ncount news\n"
      expected: "a#1: hi\nb#1: hi\nb#2: yo\n1\n"
      hint: "Счётчик у каждого обработчика свой: b получает #1, затем #2."
    - id: "empty"
      title: "Тема без подписчиков"
      stdin: "3\nemit news hello\non a news\ncount news\n"
      expected: "no listeners\n1\n"
      hint: "Пока подписчиков нет, emit печатает no listeners."
    - id: "dup"
      title: "Повторная подписка и лишний off"
      stdin: "5\non a t\non a t\nemit t x\noff b t\ncount t\n"
      expected: "already subscribed\na#1: x\nnot subscribed\n1\n"
      hint: "Повторная подписка того же id на ту же тему отклоняется; a получает сообщение один раз; off незнакомого id печатает not subscribed."
    - id: "resub"
      title: "Повторная подписка после off (скрытый)"
      stdin: "7\non a t\nemit t 1\nemit t 2\noff a t\non a t\nemit t 3\ncount t\n"
      expected: "a#1: 1\na#2: 2\na#1: 3\n1\n"
      hidden: true
      hint: "Новая подписка получает новый счётчик, поэтому снова a#1."
    - id: "topics"
      title: "Независимые темы (скрытый)"
      stdin: "8\non a x\non a y\nemit x 1\nemit y 2\nemit x 3\noff a x\nemit x 4\nemit y 5\n"
      expected: "a#1: 1\na#1: 2\na#2: 3\nno listeners\na#2: 5\n"
      hidden: true
      hint: "У подписки a на x и a на y разные счётчики, поэтому после emit x 3 выводится a#2, а y продолжает свой."
    - id: "order"
      title: "Порядок вызова обработчиков (скрытый)"
      stdin: "8\non c t\non a t\non b t\nemit t go\noff a t\ncount t\noff c t\noff b t\n"
      expected: "c#1: go\na#1: go\nb#1: go\n2\n"
      hidden: true
      hint: "Обработчики вызываются в порядке подписки (c, a, b), а не по алфавиту."
