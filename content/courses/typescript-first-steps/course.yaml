id: "typescript-first-steps"
version: "1.0.0"
title: "TypeScript: первые шаги"
description: "Курс рассчитан на тех, кто уже программирует на другом языке: переменные, условия, циклы и функции здесь не объясняются с нуля. Если вы никогда не программировали, начните с «TypeScript с нуля»: этот курс идёт сразу после него. Вводный курс из двух уроков: как tsc и среда выполнения делят работу и почему типы стираются, затем структурная типизация, сужение типов и разница между any, unknown и never. Остальные темы трека TypeScript запланированы."
languageId: "typescript"
level: 1
track: "typescript"
requires:
  - "typescript-from-zero"
lessons:
  - "01-how-typescript-runs"
  - "02-structural-typing-and-narrowing"
