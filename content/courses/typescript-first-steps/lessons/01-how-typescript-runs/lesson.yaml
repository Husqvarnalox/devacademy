id: "typescript.first-steps.how-typescript-runs"
title: "Как выполняется TypeScript: tsc, стирание типов, stdin"
goal: "Понять, что делает компилятор tsc и что остаётся во время работы, и написать типизированную программу, читающую stdin."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "javascript.first-steps.how-javascript-runs"
objectives:
  - "Разделить роли проверки типов (tsc) и выполнения (Node.js)."
  - "Объяснить стирание типов и ограничения срезания типов в Node.js."
  - "Использовать strict, вывод типов и явные аннотации на границах."
  - "Прочитать stdin и вычислить результат в типизированной функции."
masteryCriteria:
  - "Вы объясняете, почему interface не виден во время работы."
  - "Вы называете конструкции, которые нельзя просто стереть (enum, namespace, параметры-свойства)."
  - "Вы пишете функцию summarize(nums: number[]): Stats и вызываете её на данных из stdin."
related:
  - "javascript.first-steps.how-javascript-runs"
next:
  - "typescript.first-steps.structural-typing-and-narrowing"
tags:
  - "typescript"
  - "tsc"
  - "type-erasure"
  - "strict"
  - "stdin"
facts:
  - kind: "internals"
    text: "Типы TypeScript удаляются при компиляции: выпущенный JavaScript не содержит аннотаций и интерфейсов, и проверок типов во время работы нет."
    sources:
      - "https://www.typescriptlang.org/docs/handbook/2/basic-types.html#erased-types"
  - kind: "internals"
    text: "Node.js умеет запускать файлы TypeScript, удаляя аннотации типов без проверки. Такой режим поддерживает только стираемый синтаксис; конструкции вроде enum и namespace с кодом требуют отдельного преобразования, которое в режиме срезания не выполняется. Проверку типов при этом по-прежнему делает tsc."
    sources:
      - "https://nodejs.org/api/typescript.html"
  - kind: "misconception"
    text: "«TypeScript делает программу безопаснее во время работы» - неверно. Типы проверяются до запуска, а данные извне (stdin, JSON) приходят без проверки и остаются обещанием, которое нужно выполнить кодом."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что происходит с аннотациями типов при запуске программы?"
      options:
        - "Движок проверяет их при каждом вызове функции."
        - "Они удаляются; во время работы их нет."
        - "Они превращаются в комментарии, которые читает Node.js."
        - "Они ускоряют выполнение, потому что движок знает типы."
      answer: 1
      explanation: "Типы стираются: движку JavaScript аннотации не нужны, и проверок типов во время работы не добавляется."
    - id: "q2"
      type: "multiple"
      prompt: "Какие утверждения верны?"
      options:
        - "tsc --noEmit проверяет типы и ничего не создаёт."
        - "Node.js при запуске .ts проверяет типы так же строго, как tsc."
        - "Опция strict включает strictNullChecks и noImplicitAny."
        - "interface можно проверить через instanceof."
      answer:
        - 0
        - 2
      explanation: "tsc проверяет типы без запуска (с --noEmit). Node.js при срезании типов их не проверяет. strict в TypeScript включает проверки null/undefined и неявного any."
    - id: "q3"
      type: "single"
      prompt: "Что даёт as number для значения из JSON.parse?"
      options:
        - "Преобразует значение в число."
        - "Выбрасывает ошибку, если это не число."
        - "Добавляет проверку в выпущенный JavaScript."
        - "Меняет только мнение компилятора; значение остаётся прежним."
      answer: 3
      explanation: "as - утверждение для компилятора. Оно не проверяет и не преобразует значение, поэтому во время работы может оказаться строка или undefined."
    - id: "q4"
      type: "short"
      prompt: "Какой флаг tsc проверяет типы и не создаёт .js-файлов?"
      answer:
        - "--noEmit"
        - "noEmit"
      explanation: "--noEmit: проверить программу, ничего не записывая. Именно так приложение проверяет типы перед запуском."
exercise:
  id: "typescript.first-steps.how-typescript-runs.exercise"
  title: "Статистика по числам в типизированном коде"
  prompt: |

    Программа получает на вход число `n` (1 <= n <= 1000), а затем `n` целых чисел, каждое из которых по модулю не больше 2 000 000 000.
    Числа могут быть разбросаны по строкам как угодно и разделены любым количеством пробелов и переводов строк.

    Выведите ровно четыре строки:

    ```
    sum=<сумма>
    min=<наименьшее>
    max=<наибольшее>
    avg=<среднее арифметическое с двумя знаками после точки>
    ```

    **Пример.** Ввод `4` и затем `1 2 3 4` даёт

    ```
    sum=10
    min=1
    max=4
    avg=2.50
    ```

    Среднее печатайте с точкой как десятичным разделителем, независимо от региональных настроек системы.
    Сумма может не поместиться в 32 бита, учитывайте это.
  entryFile: "main.ts"
  evaluation: "io"
  hints:
    - "Прочитайте stdin: readFileSync(0, \"utf8\"). Результат уже имеет тип string; разбейте его через trim().split(/\\s+/)."
    - "Токены - строки. Превратите нужные n токенов в number[] через .map(Number); тип сам подскажет, где ещё осталась строка."
    - "В summarize пройдите по массиву один раз, обновляя sum, min, max. Начальные min и max берите из первого элемента, а не 0."
    - "Среднее - sum / nums.length, печатайте s.avg.toFixed(2). Значение toFixed - строка, а не number."
  tests:
    - id: "basic"
      title: "Числа в одной строке"
      stdin: "4\n1 2 3 4\n"
      expected: "sum=10\nmin=1\nmax=4\navg=2.50\n"
      hint: "Проверьте формат: четыре строки sum=..., min=..., max=..., avg=...."
    - id: "lines"
      title: "Числа на разных строках"
      stdin: "3\n10\n20\n30\n"
      expected: "sum=60\nmin=10\nmax=30\navg=20.00\n"
      hint: "Числа на разных строках: разбирайте весь текст по /\\s+/, а не одну строку."
    - id: "single"
      title: "Одно число"
      stdin: "1\n7\n"
      expected: "sum=7\nmin=7\nmax=7\navg=7.00\n"
      hint: "При n = 1 все три величины равны одному числу, среднее - 7.00."
    - id: "negatives"
      title: "Отрицательные числа (скрытый)"
      stdin: "5\n-3 -1 -4 -1 -5\n"
      expected: "sum=-14\nmin=-5\nmax=-1\navg=-2.80\n"
      hidden: true
      hint: "Начальное значение min не должно быть 0: для отрицательных чисел используйте первый элемент."
    - id: "whitespace"
      title: "Лишние пробелы и пустые строки (скрытый)"
      stdin: "3\n  5   2\n\n 2\n"
      expected: "sum=9\nmin=2\nmax=5\navg=3.00\n"
      hidden: true
      hint: "Пустые токены превращаются в 0 через Number(\"\"). Примените trim() до split и берите ровно n чисел."
    - id: "rounding"
      title: "Округление среднего (скрытый)"
      stdin: "3\n1 2 2\n"
      expected: "sum=5\nmin=1\nmax=2\navg=1.67\n"
      hidden: true
      hint: "Для 1 2 2 среднее равно 1.666..., а ожидается 1.67: используйте toFixed(2)."
    - id: "big-sum"
      title: "Сумма больше 32-битного диапазона (скрытый)"
      stdin: "2\n2000000000 2000000000\n"
      expected: "sum=4000000000\nmin=2000000000\nmax=2000000000\navg=2000000000.00\n"
      hidden: true
      hint: "Сумма 4000000000 - обычное число типа number (64-битный double); не применяйте побитовые операции."
