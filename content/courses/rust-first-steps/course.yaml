id: "rust-first-steps"
version: "1.0.0"
title: "Rust: первые шаги"
description: "Курс рассчитан на тех, кто уже программирует на другом языке: переменные, условия, циклы и функции здесь не объясняются с нуля. Если вы никогда не программировали, начните с «Go с нуля», «Основы Python» или «JavaScript с нуля». Вводный курс из двух уроков: как Rust компилируется в машинный код и читает ввод, затем владение, перемещение и заимствование. Остальные темы трека Rust запланированы."
languageId: "rust"
level: 1
track: "rust"
lessons:
  - "01-how-rust-runs"
  - "02-ownership-moves-and-borrowing"
