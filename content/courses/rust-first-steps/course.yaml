id: "rust-first-steps"
version: "1.0.0"
title: "Rust: первые шаги"
description: "Курс рассчитан на тех, кто уже программирует на другом языке: переменные, условия, циклы и функции здесь не объясняются с нуля. Если вы никогда не программировали, начните с курса «Rust с нуля»: он ведёт от первой программы до небольшого проекта и открывает этот курс. Вводный курс из двух уроков: что делает rustc и почему у Rust нет рантайма, выбор i32 или i64 и поведение переполнения, затем владение, перемещение и заимствование. Остальные темы трека Rust запланированы."
languageId: "rust"
level: 1
requires:
  - "rust-from-zero"
track: "rust"
lessons:
  - "01-how-rust-runs"
  - "02-ownership-moves-and-borrowing"
