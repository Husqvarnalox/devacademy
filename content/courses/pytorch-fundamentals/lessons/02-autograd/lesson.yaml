id: "ml.pytorch.autograd"
title: "Автоматическое дифференцирование: requires_grad, backward, накопление и no_grad"
goal: "Считать градиенты через autograd, проверять их против аналитических формул и конечных разностей и понимать, почему градиенты накапливаются."
difficulty: "medium"
estimatedMinutes: 75
prerequisites:
  - "ml.pytorch.tensors"
  - "ml.foundations.linear-regression"
related:
  - "go.ml.gomlx.automatic-differentiation"
  - "ml.numpy.linear-regression"
next:
  - "ml.pytorch.modules"
seeAlso:
  - "Документация PyTorch: заметки об autograd (autograd mechanics)"
objectives:
  - "Включить отслеживание через requires_grad, вызвать backward и прочитать .grad у листовых тензоров."
  - "Проверить градиент autograd против аналитической производной и против центральной разности."
  - "Объяснить, что backward накапливает градиенты в .grad, и показать, как это приводит к ошибке в цикле обучения."
  - "Использовать torch.no_grad и detach, чтобы вычислять без графа, и объяснить, зачем это нужно при оценке и обновлении весов."
  - "Получить градиент MSE по весам линейной модели и сопоставить его с формулой (2/n) Xᵀ (Xw - y)."
masteryCriteria:
  - "poly_grad совпадает с 9x² - 2 с допуском 1e-4 в точках 2, 0 и -1.5."
  - "mse_grad совпадает с (2/n) Xᵀ (Xw - y) с допуском 1e-9 и не меняет входной w."
  - "accumulated_grad даёт 2·k·x без обнуления и 2x с обнулением; max_grad_error меньше 1e-6."
tags:
  - "ml"
  - "pytorch"
  - "autograd"
  - "backward"
  - "gradient"
requires:
  python: ">=3.11"
  packages:
    - "torch>=2.5"
    - "numpy>=2"
  memoryMb: 512
accelerator: "none"
facts:
  - kind: "internals"
    text: "По документации PyTorch, при вызове .backward() градиенты накапливаются в полях .grad только у листовых тензоров с requires_grad=True. Поэтому перед новым шагом обучения градиенты нужно обнулять, иначе новые значения прибавятся к старым."
    sources:
      - "https://pytorch.org/docs/stable/notes/autograd.html"
  - kind: "internals"
    text: "Внутри torch.no_grad() результат любой операции получает requires_grad=False, даже если входы требовали градиента; это экономит память там, где градиенты не нужны (оценка модели, ручное обновление весов)."
    sources:
      - "https://pytorch.org/docs/stable/generated/torch.no_grad.html"
  - kind: "internals"
    text: "Граф вычислений в PyTorch строится динамически во время прямого прохода и по умолчанию освобождается после backward(); повторный backward() по тому же графу без retain_graph=True вызывает ошибку."
    sources:
      - "https://pytorch.org/docs/stable/notes/autograd.html"
      - "https://pytorch.org/docs/stable/generated/torch.Tensor.backward.html"
  - kind: "misconception"
    text: "«backward() возвращает градиент». Метод ничего не возвращает: градиент записывается (накапливается) в атрибут .grad листовых тензоров, а у нелистовых тензоров .grad по умолчанию не сохраняется."
    sources:
      - "https://pytorch.org/docs/stable/notes/autograd.html"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что произойдёт, если вызвать loss.backward() дважды подряд для новых прямых проходов и не обнулять x.grad?"
      options:
        - "Градиенты сложатся в x.grad"
        - "x.grad будет перезаписан последним значением"
        - "Будет ошибка при втором вызове"
        - "x.grad станет равным 0"
      answer: 0
      explanation: "backward накапливает: новый градиент прибавляется к содержимому .grad."
    - id: "q2"
      type: "numeric"
      prompt: "Чему равен x.grad для f(x) = x ** 3 в точке x = 2 после одного backward? Ответ - число."
      answer: 12
      tolerance: 0.001
      explanation: "Производная 3x² в точке 2 равна 12."
    - id: "q3"
      type: "multiple"
      prompt: "Когда нужно оборачивать вычисления в torch.no_grad()?"
      options:
        - "При оценке модели на валидации"
        - "При ручном обновлении весов w -= lr * w.grad"
        - "При вычислении потерь, по которым будет вызван backward"
        - "При предсказаниях в готовом сервисе"
      answer:
        - 0
        - 1
        - 3
      explanation: "Вне графа считают всё, по чему не будет backward. Потеря для обучения должна остаться внутри графа."
    - id: "q4"
      type: "single"
      prompt: "Что делает x.detach()?"
      options:
        - "Возвращает тензор с теми же данными, но вне графа вычислений"
        - "Копирует данные и включает requires_grad"
        - "Обнуляет x.grad"
        - "Удаляет тензор из памяти"
      answer: 0
      explanation: "detach делит память с x, но не участвует в графе; поэтому для независимости добавляют clone."
    - id: "q5"
      type: "single"
      prompt: "Почему для проверки градиента удобна центральная разность (f(x+h) - f(x-h)) / (2h)?"
      options:
        - "Её ошибка порядка h², и она не требует формулы производной"
        - "Она точна всегда, при любом h"
        - "Она быстрее autograd"
        - "Она не требует вычислять f"
      answer: 0
      explanation: "Это независимая от autograd проверка: ошибка метода убывает как h², но при слишком малом h вмешивается округление."
exercise:
  id: "ml.pytorch.autograd.exercise"
  title: "Градиенты через autograd и их проверка"
  prompt: |
    В файле `autograd_task.py` реализуйте пять функций. PyTorch доступен; ничего не печатайте.

    1. `poly_grad(x0)` - производная `f(x) = 3x³ - 2x + 1` в точке `x0`, посчитанная **через autograd** (`float`). Аналитически это `9x² - 2`.
    2. `mse_grad(X, y, w)` - градиент `mean((X @ w - y) ** 2)` по `w` через autograd. `X` формы `(n, d)`, `y` формы `(n,)`, `w` формы `(d,)` - обычный тензор без градиентов; **менять `w` нельзя** (работайте с копией). Верните тензор формы `(d,)` без истории.
    3. `accumulated_grad(x0, k, zero_each_time)` - создайте `x` как `float64`-тензор с `requires_grad=True`; `k` раз вычислите `loss = x ** 2` и вызовите `loss.backward()`. Если `zero_each_time`, обнуляйте `x.grad` перед каждым `backward`. Верните `x.grad.item()` (при `k = 0` - `0.0`).
    4. `eval_without_grad(w, X)` - `w` - параметр с `requires_grad=True`; верните `X @ w`, вычисленное без построения графа.
    5. `max_grad_error(f, x)` - `f` отображает `float64`-тензор в скаляр-тензор, `x` - `float64`-вектор. Верните `max |градиент autograd - центральная разность|` по координатам с шагом `eps = 1e-6` (`float`); `x` не менять.

    **Пример.**

    ```python
    poly_grad(2.0)                    # 34.0
    accumulated_grad(3.0, 4, False)   # 24.0: четыре раза по 2x = 6
    accumulated_grad(3.0, 4, True)    # 6.0
    ```
  entryFile: "autograd_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "poly_grad: x = torch.tensor(float(x0), requires_grad=True); f = 3 * x ** 3 - 2 * x + 1; f.backward(); затем x.grad.item()."
    - "mse_grad: p = w.detach().clone().requires_grad_(True); loss = ((X @ p - y) ** 2).mean(); loss.backward(); верните p.grad. Так w остаётся нетронутым."
    - "accumulated_grad: в цикле строите новый граф (x ** 2).backward(); для обнуления присвойте x.grad = None. eval_without_grad: with torch.no_grad(): return X @ w."
    - "max_grad_error: сначала backward на копии p с requires_grad; затем для каждой координаты i возьмите hi и lo (копии x с +-eps в i-й координате) и вычислите (f(hi) - f(lo)).item() / (2 * eps) под torch.no_grad()."
  tests:
    - id: "poly-grad"
      title: "poly_grad совпадает с 9x² - 2"
      hint: "Используйте x.grad после f.backward(); верните float через .item()."
    - id: "mse-grad"
      title: "mse_grad совпадает с (2/n) Xᵀ (Xw - y)"
      hint: "loss = ((X @ p - y) ** 2).mean(), p - копия w с requires_grad."
    - id: "accumulated-grad"
      title: "Накопление градиентов и обнуление"
      hint: "Без обнуления градиенты складываются: k * 2x. С обнулением остаётся 2x."
    - id: "no-grad"
      title: "eval_without_grad: результат вне графа (скрытый)"
      hidden: true
      hint: "with torch.no_grad(): return X @ w; у результата requires_grad=False и нет grad_fn."
    - id: "grad-check"
      title: "max_grad_error: autograd и конечные разности (скрытый)"
      hidden: true
      hint: "Центральная разность (f(x+eps e_i) - f(x-eps e_i)) / (2 eps) для каждой координаты i."
    - id: "mse-grad-clean"
      title: "mse_grad не меняет w и возвращает чистый тензор (скрытый)"
      hidden: true
      hint: "Работайте с w.detach().clone().requires_grad_(True) и возвращайте p.grad."
    - id: "accumulate-edge"
      title: "Граничные случаи accumulated_grad (скрытый)"
      hidden: true
      hint: "При k = 0 backward не вызывается и x.grad остаётся None: верните 0.0. Для x0 = -2 и k = 3 без обнуления получится 3 * (-4) = -12."
