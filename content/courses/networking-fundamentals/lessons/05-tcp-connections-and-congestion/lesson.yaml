      hidden: true
      hint: "Цепочка SYN_SENT -> SYN_RCVD -> ESTABLISHED -> FIN_WAIT_1 -> CLOSING -> TIME_WAIT -> CLOSED; в TIME_WAIT лишний rcv_fin игнорируется."
    - id: "close-in-syn-rcvd"
      title: "Закрытие в SYN_RCVD и повторное открытие (скрытый)"
      stdin: "passive_open\nrcv_syn\nclose\nrcv_fin\nrcv_ack\ntimeout\nclose\ntimeout\n"
      expected: "passive_open: CLOSED -> LISTEN send=-\nrcv_syn: LISTEN -> SYN_RCVD send=SYN+ACK\nclose: SYN_RCVD -> FIN_WAIT_1 send=FIN\nrcv_fin: FIN_WAIT_1 -> CLOSING send=ACK\nrcv_ack: CLOSING -> TIME_WAIT send=-\ntimeout: TIME_WAIT -> CLOSED send=-\nclose: CLOSED ignored\ntimeout: CLOSED ignored\nfinal=CLOSED\n"
