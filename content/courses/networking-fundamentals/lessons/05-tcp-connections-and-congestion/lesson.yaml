      stdin: ""
      expected: "final=CLOSED\n"
      hidden: true
      hint: "Без событий состояние остаётся CLOSED."
challenge:
  id: "networking.fundamentals.tcp-connections-and-congestion.challenge"
  title: "Трасса окна перегрузки Reno"
  prompt: |

    **Сеть не используется.** Смоделируйте поведение окна перегрузки TCP Reno **по RTT**. Это не посегментная реализация [RFC 5681](https://www.rfc-editor.org/rfc/rfc5681.html), а её абстракция «одно событие на круговой обход»: за один RTT окно целиком либо подтверждено, либо в нём обнаружена потеря. Размеры измеряются в сегментах (MSS), все значения целые.

    Первая строка ввода: `init=<cwnd> ssthresh=<порог> rwnd=<окно получателя>` (в любом порядке полей). Далее идёт по одному событию на каждый RTT (пустые строки пропускаются). Точные правила модели:

    * `ack` - все сегменты окна подтверждены. **Slow start** (RFC 5681, раздел 3.1; `cwnd < ssthresh`): окно растёт на MSS за каждый ACK, то есть за RTT удваивается: `cwnd = min(cwnd * 2, ssthresh)` (упрощение модели: рост не переходит порог, в RFC допускается любая из двух фаз при `cwnd == ssthresh`). **Congestion avoidance** (`cwnd >= ssthresh`): примерно на 1 MSS за RTT, `cwnd = cwnd + 1`;
    * `3dupack` - потеря обнаружена по трём дубликатам ACK: быстрая повторная передача и **fast recovery** (раздел 3.2). Уравнение (4) RFC даёт `ssthresh = max(FlightSize / 2, 2 * SMSS)`; в модели `FlightSize = cwnd`, то есть `ssthresh = max(cwnd // 2, 2)`. Затем `cwnd = ssthresh` (окно «вдвое меньше»; временное раздувание на `3 * SMSS` и сдвиг окна на дубликатах ACK внутри RTT не показываются);
    * `timeout` - сработал таймер повторной передачи: `ssthresh = max(cwnd // 2, 2)` по тому же правилу и `cwnd = 1` (loss window, один сегмент), после чего начинается slow start;
    * любое другое слово - неизвестное событие, состояние не меняется.

    Не моделируются: задержанные ACK, SACK, ограничение начального окна, раздувание окна при fast recovery, экспоненциальный рост RTO и отдельные дубликаты ACK. Окно получателя `rwnd` на `cwnd` и `ssthresh` не влияет, а только ограничивает отправку.

    Фаза после события: `slow-start`, если `cwnd < ssthresh`, иначе `congestion-avoidance`. Окно отправки `send_window = min(cwnd, rwnd)`.

    Вывод: сначала начальная строка, затем по строке на каждое событие (номер `rtt` равен номеру строки события, начиная с 1, даже у неизвестного события), в конце максимум cwnd:

    Пример. Ввод:

    ```
    init=1 ssthresh=16 rwnd=6
    ack
    ack
    ack
    3dupack
    wat
    ```

    Вывод:

    ```
    rtt 0: init cwnd=1 ssthresh=16 phase=slow-start send_window=1
    rtt 1: ack cwnd=2 ssthresh=16 phase=slow-start send_window=2
    rtt 2: ack cwnd=4 ssthresh=16 phase=slow-start send_window=4
    rtt 3: ack cwnd=8 ssthresh=16 phase=slow-start send_window=6
    rtt 4: 3dupack cwnd=4 ssthresh=4 phase=congestion-avoidance send_window=4
    rtt 5: wat unknown event
    max_cwnd=8
    ```

    Для неизвестного события печатается `rtt <n>: <слово> unknown event`. `max_cwnd` - наибольшее значение `cwnd` за всю трассу, включая начальное.

    **Что дано.** Заготовка читает настройки и печатает `not implemented`.
  entryFile: "reno_task.py"
  evaluation: "io"
  starter: "challenge/starter"
  solution: "challenge/solution"
  hints:
    - "Разберите первую строку в словарь целых: split() по пробелам, затем partition('='). Начальные cwnd и ssthresh возьмите из init и ssthresh."
    - "Опишите функцию phase(): 'slow-start' при cwnd < ssthresh, иначе 'congestion-avoidance'. Печатайте строку через общую функцию report(label, rtt), чтобы формат не расходился."
    - "Для ack различайте две ветки: в slow start cwnd = min(cwnd * 2, ssthresh), в предотвращении перегрузки cwnd += 1. Для потерь сначала пересчитайте ssthresh = max(cwnd // 2, 2), потом cwnd."
    - "Номер RTT берите из enumerate(events, start=1), в том числе для неизвестных событий (они только печатаются и пропускаются через continue). Максимум обновляйте после каждого изменения cwnd."
  tests:
    - id: "slow-start"
      title: "Slow start до ssthresh"
      stdin: "init=1 ssthresh=16 rwnd=64\nack\nack\nack\nack\nack\nack\n"
      expected: "rtt 0: init cwnd=1 ssthresh=16 phase=slow-start send_window=1\nrtt 1: ack cwnd=2 ssthresh=16 phase=slow-start send_window=2\nrtt 2: ack cwnd=4 ssthresh=16 phase=slow-start send_window=4\nrtt 3: ack cwnd=8 ssthresh=16 phase=slow-start send_window=8\nrtt 4: ack cwnd=16 ssthresh=16 phase=congestion-avoidance send_window=16\nrtt 5: ack cwnd=17 ssthresh=16 phase=congestion-avoidance send_window=17\nrtt 6: ack cwnd=18 ssthresh=16 phase=congestion-avoidance send_window=18\nmax_cwnd=18\n"
      hint: "Пока cwnd < ssthresh, каждый RTT cwnd удваивается, но не выше ssthresh; затем +1 за RTT."
    - id: "fast-retransmit"
      title: "Быстрая повторная передача"
      stdin: "init=1 ssthresh=16 rwnd=64\nack\nack\nack\nack\nack\nack\n3dupack\nack\nack\n"
      expected: "rtt 0: init cwnd=1 ssthresh=16 phase=slow-start send_window=1\nrtt 1: ack cwnd=2 ssthresh=16 phase=slow-start send_window=2\nrtt 2: ack cwnd=4 ssthresh=16 phase=slow-start send_window=4\nrtt 3: ack cwnd=8 ssthresh=16 phase=slow-start send_window=8\nrtt 4: ack cwnd=16 ssthresh=16 phase=congestion-avoidance send_window=16\nrtt 5: ack cwnd=17 ssthresh=16 phase=congestion-avoidance send_window=17\nrtt 6: ack cwnd=18 ssthresh=16 phase=congestion-avoidance send_window=18\nrtt 7: 3dupack cwnd=9 ssthresh=9 phase=congestion-avoidance send_window=9\nrtt 8: ack cwnd=10 ssthresh=9 phase=congestion-avoidance send_window=10\nrtt 9: ack cwnd=11 ssthresh=9 phase=congestion-avoidance send_window=11\nmax_cwnd=18\n"
      hint: "3dupack: ssthresh = max(cwnd // 2, 2), cwnd = ssthresh, остаёмся в congestion avoidance."
    - id: "timeout"
      title: "Таймаут возвращает в slow start"
      stdin: "init=10 ssthresh=8 rwnd=64\nack\ntimeout\nack\nack\nack\nack\n"
      expected: "rtt 0: init cwnd=10 ssthresh=8 phase=congestion-avoidance send_window=10\nrtt 1: ack cwnd=11 ssthresh=8 phase=congestion-avoidance send_window=11\nrtt 2: timeout cwnd=1 ssthresh=5 phase=slow-start send_window=1\nrtt 3: ack cwnd=2 ssthresh=5 phase=slow-start send_window=2\nrtt 4: ack cwnd=4 ssthresh=5 phase=slow-start send_window=4\nrtt 5: ack cwnd=5 ssthresh=5 phase=congestion-avoidance send_window=5\nrtt 6: ack cwnd=6 ssthresh=5 phase=congestion-avoidance send_window=6\nmax_cwnd=11\n"
      hint: "Timeout: ssthresh = max(cwnd // 2, 2), cwnd = 1."
    - id: "rwnd"
      title: "Окно получателя ограничивает отправку (скрытый)"
