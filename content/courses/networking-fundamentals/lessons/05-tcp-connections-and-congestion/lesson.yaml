      stdin: "init=1 ssthresh=8 rwnd=8\ntimeout\n3dupack\ntimeout\nack\nack\n"
      expected: "rtt 0: init cwnd=1 ssthresh=8 phase=slow-start send_window=1\nrtt 1: timeout cwnd=1 ssthresh=2 phase=slow-start send_window=1\nrtt 2: 3dupack cwnd=2 ssthresh=2 phase=congestion-avoidance send_window=2\nrtt 3: timeout cwnd=1 ssthresh=2 phase=slow-start send_window=1\nrtt 4: ack cwnd=2 ssthresh=2 phase=congestion-avoidance send_window=2\nrtt 5: ack cwnd=3 ssthresh=2 phase=congestion-avoidance send_window=3\nmax_cwnd=3\n"
