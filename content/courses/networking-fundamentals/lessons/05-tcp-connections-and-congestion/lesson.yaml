id: "networking.fundamentals.tcp-connections-and-congestion"
title: "TCP: соединение, состояния, поток и перегрузка"
goal: "Понимать, как TCP устанавливает и закрывает соединение, нумерует байты, управляет скоростью по окну получателя и по оценке перегрузки сети, и моделировать это автоматом состояний и сменой окна по алгоритму Reno."
difficulty: "hard"
estimatedMinutes: 120
prerequisites:
  - "networking.fundamentals.ipv4-header-and-checksum"
related:
  - "python.stdlib.json-csv-struct"
  - "go.fundamentals.goroutines-and-channels"
  - "rust.fundamentals.structs-enums-pattern-matching"
next:
  - "networking.fundamentals.udp-and-dns"
seeAlso:
  - "Современные алгоритмы перегрузки (CUBIC, BBR) и TCP Fast Open - в уроке упомянуты, но не разбираются"
objectives:
  - "Описать трёхстороннее рукопожатие и четырёхстороннее закрытие, роль флагов SYN, ACK, FIN, RST и начальных номеров последовательности."
  - "Объяснить номера последовательности и подтверждения: нумеруются байты, ack равен номеру следующего ожидаемого байта."
  - "Пройти по диаграмме состояний TCP (CLOSED, LISTEN, SYN_SENT, SYN_RCVD, ESTABLISHED, FIN_WAIT_1/2, CLOSE_WAIT, CLOSING, LAST_ACK, TIME_WAIT) и реализовать автомат, управляемый событиями."
  - "Различать управление потоком (окно получателя rwnd) и управление перегрузкой (окно перегрузки cwnd) и вычислять окно отправки min(cwnd, rwnd)."
  - "Описать slow start, congestion avoidance (AIMD), быструю повторную передачу и быстрое восстановление, реакцию на таймаут, и смоделировать эволюцию cwnd в Reno."
masteryCriteria:
  - "Вы реализуете автомат TCP с таблицей переходов (состояние, событие) -> (новое состояние, отправляемый сегмент)."
  - "Вы объясняете, почему сторона, закрывшая соединение первой, оказывается в TIME_WAIT, и что такое 2MSL."
  - "Вы вычисляете ack по ISN и длине данных (SYN и FIN занимают по одному номеру)."
  - "Вы моделируете Reno: удвоение cwnd в slow start до ssthresh, затем +1 за RTT; при 3 дубликатах ACK ssthresh = cwnd / 2 и cwnd = ssthresh; при таймауте cwnd = 1."
tags:
  - "networking"
  - "tcp"
  - "state-machine"
  - "congestion-control"
  - "flow-control"
  - "reno"
facts:
  - kind: "internals"
    text: "TCP нумерует каждый байт потока 32-битным номером последовательности. Номер в заголовке сегмента - номер первого байта его данных, а поле подтверждения (ack) содержит номер следующего ожидаемого байта. Флаги SYN и FIN занимают по одному номеру последовательности. Начальный номер (ISN) выбирается неочевидным образом, чтобы затруднить подделку сегментов."
    sources:
      - "https://www.rfc-editor.org/rfc/rfc9293.html#section-3.4"
      - "https://www.rfc-editor.org/rfc/rfc6528.html"
  - kind: "internals"
    text: "Диаграмма состояний TCP в RFC 9293 включает CLOSED, LISTEN, SYN-SENT, SYN-RECEIVED, ESTABLISHED, FIN-WAIT-1, FIN-WAIT-2, CLOSE-WAIT, CLOSING, LAST-ACK и TIME-WAIT. Сторона, первой отправившая FIN, после получения FIN от собеседника переходит в TIME-WAIT и ждёт 2*MSL, чтобы последний ACK не потерялся и старые сегменты исчезли из сети."
    sources:
      - "https://www.rfc-editor.org/rfc/rfc9293.html#section-3.3.2"
      - "https://www.rfc-editor.org/rfc/rfc9293.html#section-3.6.1"
  - kind: "internals"
    text: "Размер окна приёма в заголовке TCP - 16 бит (до 65535 байт). Масштабирование окна (RFC 7323) договаривается в SYN-сегментах и умножает значение на 2^shift, что позволяет окнам до 1 гигабайта. Окно, объявленное получателем (rwnd), реализует управление потоком; отправитель не имеет права держать в пути больше min(cwnd, rwnd)."
    sources:
      - "https://www.rfc-editor.org/rfc/rfc7323.html"
      - "https://www.rfc-editor.org/rfc/rfc9293.html#section-3.8.6"
  - kind: "internals"
    text: "RFC 5681 определяет четыре алгоритма: медленный старт (slow start), предотвращение перегрузки (congestion avoidance), быструю повторную передачу (fast retransmit) и быстрое восстановление (fast recovery). Начальное значение ssthresh может быть сколь угодно большим; после потери ssthresh = max(FlightSize / 2, 2 * SMSS). При медленном старте cwnd растёт примерно вдвое за RTT, при предотвращении перегрузки - примерно на один сегмент за RTT."
    sources:
      - "https://www.rfc-editor.org/rfc/rfc5681.html#section-3.1"
      - "https://www.rfc-editor.org/rfc/rfc5681.html#section-3.2"
  - kind: "real-world"
    text: "Reno в учебниках - лишь базовая модель. В Linux по умолчанию используется CUBIC (RFC 9438), у которого окно растёт кубической функцией времени, а не линейно; существует и BBR, строящий оценку по полосе и задержке. Принцип 'увеличивай осторожно, уменьшай резко' (AIMD) остаётся основой справедливого деления канала."
    sources:
      - "https://www.rfc-editor.org/rfc/rfc9438.html"
  - kind: "misconception"
    text: "«TCP гарантирует доставку». Он гарантирует доставку данных по порядку и без дубликатов, пока соединение живо, но если связь пропала насовсем, отправитель узнает об этом только по таймауту, и часть отправленных данных так и останется непринятой. Кроме того, ACK подтверждает, что данные приняты стеком получателя, а не что приложение их обработало."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Какие сегменты образуют трёхстороннее рукопожатие TCP?
      options:
        - "SYN, SYN+ACK, ACK"
        - "SYN, ACK, FIN"
        - "SYN, SYN, ACK"
        - "ACK, SYN+ACK, FIN"
      answer: 0
      explanation: "Клиент отправляет SYN, сервер отвечает SYN+ACK, клиент подтверждает ACK."
    - id: "q2"
      type: "numeric"
      prompt: |
        Клиент отправил SYN с начальным номером последовательности 1000. Каким будет поле подтверждения (ack) в ответном SYN+ACK?
      answer: 1001
      tolerance: 0
      explanation: "SYN занимает один номер последовательности, поэтому сервер ожидает следующим байтом номер 1001."
    - id: "q3"
      type: "single"
      prompt: |
        В каком состоянии остаётся сторона, первой закрывшая соединение, после получения FIN от собеседника и отправки последнего ACK?
      options:
        - "CLOSE_WAIT"
        - "LAST_ACK"
        - "TIME_WAIT"
        - "FIN_WAIT_1"
      answer: 2
      explanation: "Активно закрывающая сторона ждёт 2*MSL в TIME_WAIT, чтобы отправить повторный ACK при потере и дать устареть старым сегментам."
    - id: "q4"
      type: "numeric"
      prompt: |
        В Reno при cwnd = 20 сегментов приходят три дубликата ACK. Чему становится ssthresh (в сегментах)?
      answer: 10
      tolerance: 0
      explanation: "ssthresh = max(cwnd / 2, 2) = 10; затем cwnd = ssthresh после восстановления."
    - id: "q5"
      type: "multiple"
      prompt: |
        Какие утверждения верны?
      options:
        - "Управление потоком ограничивает отправителя окном получателя (rwnd)"
        - "Окно перегрузки cwnd оценивает отправитель по признакам потерь"
        - "Окно отправки равно min(cwnd, rwnd)"
        - "В slow start cwnd растёт линейно, на 1 сегмент за RTT"
      answer:
        - 0
        - 1
        - 2
      explanation: "Slow start растёт экспоненциально (примерно вдвое за RTT); линейный рост - фаза предотвращения перегрузки."
exercise:
  id: "networking.fundamentals.tcp-connections-and-congestion.exercise"
  title: "Автомат состояний TCP"
  prompt: |

    **Сеть не используется.** Программа моделирует один конец TCP-соединения. Начальное состояние - `CLOSED`. Из stdin читаются события, по одному на строку (пустые строки пропускаются). Для каждого события выведите одну строку и обновите состояние.

    Модель - диаграмма состояний RFC 9293, раздел 3.3.2, рисунок 5, вместе с примечаниями 1-3 к ней ([RFC 9293](https://www.rfc-editor.org/rfc/rfc9293.html#section-3.3.2)). Остальное в RFC (проверка номеров, окна, таймеры) не моделируется.

    **Словарь событий.** Вызовы приложения: `passive_open` (пассивный OPEN), `active_open` (активный OPEN), `send` (SEND: отправка данных в состоянии `LISTEN` превращает пассивное открытие в активное), `close` (CLOSE). Сегменты от собеседника: `rcv_syn` (только SYN), `rcv_synack` (SYN вместе с ACK нашего SYN), `rcv_ack` (ACK нашего SYN в `SYN_RCVD` либо ACK нашего FIN в `FIN_WAIT_1`, `CLOSING`, `LAST_ACK`), `rcv_fin` (FIN без ACK нашего FIN), `rcv_finack` (FIN вместе с ACK нашего FIN), `rcv_rst` (RST). Таймер: `timeout` (истёк 2MSL). Вызовы RECEIVE, ABORT и STATUS, повторные передачи и данные внутри соединения состояния не меняют и в модели не участвуют.

    Таблица переходов `(состояние, событие) -> (новое состояние, отправляемый сегмент)`; здесь все рёбра рисунка 5:

    | состояние | событие | новое состояние | send |
    |---|---|---|---|
    | CLOSED | passive_open | LISTEN | `-` |
    | CLOSED | active_open | SYN_SENT | `SYN` |
    | LISTEN | close | CLOSED | `-` |
    | LISTEN | rcv_syn | SYN_RCVD | `SYN+ACK` |
    | LISTEN | send | SYN_SENT | `SYN` |
    | SYN_SENT | close | CLOSED | `-` |
    | SYN_SENT | rcv_syn | SYN_RCVD | `SYN+ACK` (одновременное открытие) |
    | SYN_SENT | rcv_synack | ESTABLISHED | `ACK` |
    | SYN_RCVD | rcv_ack | ESTABLISHED | `-` |
    | SYN_RCVD | close | FIN_WAIT_1 | `FIN` |
    | ESTABLISHED | close | FIN_WAIT_1 | `FIN` |
    | ESTABLISHED | rcv_fin | CLOSE_WAIT | `ACK` |
    | FIN_WAIT_1 | rcv_ack | FIN_WAIT_2 | `-` |
    | FIN_WAIT_1 | rcv_fin | CLOSING | `ACK` (одновременное закрытие) |
    | FIN_WAIT_1 | rcv_finack | TIME_WAIT | `ACK` (примечание 2) |
    | FIN_WAIT_2 | rcv_fin | TIME_WAIT | `ACK` |
    | CLOSING | rcv_ack | TIME_WAIT | `-` |
    | CLOSE_WAIT | close | LAST_ACK | `FIN` |
    | LAST_ACK | rcv_ack | CLOSED | `-` |
    | TIME_WAIT | timeout | CLOSED | `-` |

    **RST** (примечания 1 и 3 к рисунку 5), с `send=-`: в `CLOSED` и `LISTEN` `rcv_rst` игнорируется; в `SYN_RCVD`, достигнутом пассивным открытием (из `LISTEN` по `rcv_syn`), ведёт обратно в `LISTEN`; во всех остальных состояниях, включая `SYN_RCVD`, достигнутое одновременным открытием из `SYN_SENT`, ведёт в `CLOSED`. Отправка RST самой моделью не показывается.

    Всё, чего нет в таблице и в правиле RST (например, `rcv_ack` в `ESTABLISHED`, `send` вне `LISTEN`, повторный `rcv_syn` в `SYN_RCVD`), по условию не меняет состояние.

    Формат строки: `<событие>: <СТАРОЕ> -> <НОВОЕ> send=<сегмент>`. Если для пары (состояние, событие) перехода нет (в том числе `rcv_rst` в `CLOSED` и `LISTEN`), выведите `<событие>: <СОСТОЯНИЕ> ignored` и не меняйте состояние. Если имя события не входит в словарь событий выше, выведите `<событие>: unknown event`. В конце всегда печатается `final=<СОСТОЯНИЕ>`.

    Пример: ввод `active_open`, `rcv_synack`, `close` даёт

    ```
    active_open: CLOSED -> SYN_SENT send=SYN
    rcv_synack: SYN_SENT -> ESTABLISHED send=ACK
    close: ESTABLISHED -> FIN_WAIT_1 send=FIN
    final=FIN_WAIT_1
    ```

    **Что дано.** Заготовка читает события и каждое объявляет игнорируемым; начальное состояние в ней нужно задать самим.
  entryFile: "tcp_fsm_task.py"
  evaluation: "io"
  hints:
    - "Храните переходы в словаре: ключ - кортеж (состояние, событие), значение - (новое состояние, сегмент). Вне словаря остаётся только rcv_rst: его результат зависит ещё и от того, как был достигнут SYN_RCVD (флаг «открыт пассивно»)."
    - "Три разных исхода для строки: имя события вообще не встречается в таблице (и это не rcv_rst) - unknown event; пара есть в таблице - переход; пары нет - ignored."
    - "Множество известных событий получите из ключей словаря и добавьте 'rcv_rst'. rcv_rst обрабатывайте до таблицы: в CLOSED и LISTEN - ignored; в SYN_RCVD после пассивного открытия - LISTEN; иначе - CLOSED, везде send=-."
    - "Не забывайте печатать final=<состояние> в самом конце, даже если событий не было. Состояние обновляется только при реальном переходе, а в ignored и unknown остаётся прежним."
  tests:
    - id: "client"
      title: "Клиент: открытие и закрытие"
      stdin: "active_open\nrcv_synack\nclose\nrcv_ack\nrcv_fin\ntimeout\n"
      expected: "active_open: CLOSED -> SYN_SENT send=SYN\nrcv_synack: SYN_SENT -> ESTABLISHED send=ACK\nclose: ESTABLISHED -> FIN_WAIT_1 send=FIN\nrcv_ack: FIN_WAIT_1 -> FIN_WAIT_2 send=-\nrcv_fin: FIN_WAIT_2 -> TIME_WAIT send=ACK\ntimeout: TIME_WAIT -> CLOSED send=-\nfinal=CLOSED\n"
      hint: "active_open: CLOSED -> SYN_SENT с отправкой SYN; при rcv_synack - ESTABLISHED и ACK. Активное закрытие идёт через FIN_WAIT_1, FIN_WAIT_2 и TIME_WAIT."
    - id: "server"
      title: "Сервер: пассивное открытие и закрытие"
      stdin: "passive_open\nrcv_syn\nrcv_ack\nrcv_fin\nclose\nrcv_ack\n"
      expected: "passive_open: CLOSED -> LISTEN send=-\nrcv_syn: LISTEN -> SYN_RCVD send=SYN+ACK\nrcv_ack: SYN_RCVD -> ESTABLISHED send=-\nrcv_fin: ESTABLISHED -> CLOSE_WAIT send=ACK\nclose: CLOSE_WAIT -> LAST_ACK send=FIN\nrcv_ack: LAST_ACK -> CLOSED send=-\nfinal=CLOSED\n"
      hint: "Пассивная сторона: LISTEN -> SYN_RCVD -> ESTABLISHED; получив FIN, переходит в CLOSE_WAIT, затем в LAST_ACK."
    - id: "invalid"
      title: "Недопустимые и неизвестные события"
      stdin: "rcv_ack\npassive_open\nfrobnicate\nrcv_synack\nclose\n"
      expected: "rcv_ack: CLOSED ignored\npassive_open: CLOSED -> LISTEN send=-\nfrobnicate: unknown event\nrcv_synack: LISTEN ignored\nclose: LISTEN -> CLOSED send=-\nfinal=CLOSED\n"
      hint: "Событие, которого нет в таблице для текущего состояния, печатается как 'ignored', неизвестное имя - как 'unknown event'."
    - id: "simultaneous-open"
      title: "Одновременное открытие: SYN_SENT -> SYN_RCVD"
      stdin: "active_open\nrcv_syn\nrcv_ack\nclose\nrcv_ack\nrcv_fin\ntimeout\n"
      expected: "active_open: CLOSED -> SYN_SENT send=SYN\nrcv_syn: SYN_SENT -> SYN_RCVD send=SYN+ACK\nrcv_ack: SYN_RCVD -> ESTABLISHED send=-\nclose: ESTABLISHED -> FIN_WAIT_1 send=FIN\nrcv_ack: FIN_WAIT_1 -> FIN_WAIT_2 send=-\nrcv_fin: FIN_WAIT_2 -> TIME_WAIT send=ACK\ntimeout: TIME_WAIT -> CLOSED send=-\nfinal=CLOSED\n"
      hint: "SYN_SENT + rcv_syn -> SYN_RCVD с отправкой SYN+ACK (а не ESTABLISHED); оттуда rcv_ack ведёт в ESTABLISHED."
    - id: "simultaneous-close"
      title: "Одновременное закрытие: FIN_WAIT_1 -> CLOSING"
      stdin: "active_open\nrcv_synack\nclose\nrcv_fin\nrcv_ack\ntimeout\n"
      expected: "active_open: CLOSED -> SYN_SENT send=SYN\nrcv_synack: SYN_SENT -> ESTABLISHED send=ACK\nclose: ESTABLISHED -> FIN_WAIT_1 send=FIN\nrcv_fin: FIN_WAIT_1 -> CLOSING send=ACK\nrcv_ack: CLOSING -> TIME_WAIT send=-\ntimeout: TIME_WAIT -> CLOSED send=-\nfinal=CLOSED\n"
      hint: "FIN_WAIT_1 + rcv_fin -> CLOSING (отправляется ACK), затем rcv_ack -> TIME_WAIT."
    - id: "fin-ack"
      title: "FIN и ACK одним сегментом (скрытый)"
      stdin: "active_open\nrcv_synack\nclose\nrcv_finack\ntimeout\n"
      expected: "active_open: CLOSED -> SYN_SENT send=SYN\nrcv_synack: SYN_SENT -> ESTABLISHED send=ACK\nclose: ESTABLISHED -> FIN_WAIT_1 send=FIN\nrcv_finack: FIN_WAIT_1 -> TIME_WAIT send=ACK\ntimeout: TIME_WAIT -> CLOSED send=-\nfinal=CLOSED\n"
      hidden: true
      hint: "FIN_WAIT_1 + rcv_finack -> TIME_WAIT с отправкой ACK, минуя FIN_WAIT_2."
    - id: "reset"
      title: "RST: LISTEN игнорирует, пассивный SYN_RCVD возвращается в LISTEN (скрытый)"
      stdin: "passive_open\nrcv_rst\nrcv_syn\nrcv_rst\nrcv_syn\nrcv_ack\nrcv_rst\nrcv_rst\nclose\n"
      expected: "passive_open: CLOSED -> LISTEN send=-\nrcv_rst: LISTEN ignored\nrcv_syn: LISTEN -> SYN_RCVD send=SYN+ACK\nrcv_rst: SYN_RCVD -> LISTEN send=-\nrcv_syn: LISTEN -> SYN_RCVD send=SYN+ACK\nrcv_ack: SYN_RCVD -> ESTABLISHED send=-\nrcv_rst: ESTABLISHED -> CLOSED send=-\nrcv_rst: CLOSED ignored\nclose: CLOSED ignored\nfinal=CLOSED\n"
      hidden: true
      hint: "В LISTEN RST игнорируется; в SYN_RCVD после пассивного открытия RST возвращает в LISTEN, в остальных состояниях (кроме CLOSED) - в CLOSED."
    - id: "reset-simultaneous-open"
      title: "RST после одновременного открытия ведёт в CLOSED (скрытый)"
      stdin: "active_open\nrcv_syn\nrcv_rst\nrcv_rst\npassive_open\nsend\nrcv_syn\nrcv_rst\n"
      expected: "active_open: CLOSED -> SYN_SENT send=SYN\nrcv_syn: SYN_SENT -> SYN_RCVD send=SYN+ACK\nrcv_rst: SYN_RCVD -> CLOSED send=-\nrcv_rst: CLOSED ignored\npassive_open: CLOSED -> LISTEN send=-\nsend: LISTEN -> SYN_SENT send=SYN\nrcv_syn: SYN_SENT -> SYN_RCVD send=SYN+ACK\nrcv_rst: SYN_RCVD -> CLOSED send=-\nfinal=CLOSED\n"
      hidden: true
      hint: "SYN_RCVD, достигнутый из SYN_SENT, - активное открытие: RST ведёт в CLOSED, а не в LISTEN."
    - id: "listen-send"
      title: "SEND в LISTEN: LISTEN -> SYN_SENT (скрытый)"
      stdin: "passive_open\nsend\nrcv_synack\nsend\nclose\n"
      expected: "passive_open: CLOSED -> LISTEN send=-\nsend: LISTEN -> SYN_SENT send=SYN\nrcv_synack: SYN_SENT -> ESTABLISHED send=ACK\nsend: ESTABLISHED ignored\nclose: ESTABLISHED -> FIN_WAIT_1 send=FIN\nfinal=FIN_WAIT_1\n"
      hidden: true
      hint: "LISTEN + send -> SYN_SENT с отправкой SYN; в остальных состояниях send состояние не меняет."
    - id: "open-and-close-both-simultaneous"
      title: "Одновременное открытие и закрытие подряд (скрытый)"
      stdin: "active_open\nrcv_syn\nrcv_ack\nclose\nrcv_fin\nrcv_ack\nrcv_fin\ntimeout\n"
