id: "networking.fundamentals.ethernet-arp-routing"
title: "Ethernet, ARP и маршрутизация"
goal: "Понимать, как кадр Ethernet доставляется в пределах канала, как ARP связывает IP-адрес с MAC-адресом, и как узел или маршрутизатор выбирает следующий хоп по таблице маршрутов по правилу самого длинного префикса."
difficulty: "medium"
estimatedMinutes: 90
prerequisites:
  - "networking.fundamentals.ip-addressing-and-subnetting"
related:
  - "python.stdlib.json-csv-struct"
next:
  - "networking.fundamentals.ipv4-header-and-checksum"
seeAlso:
  - "Протоколы динамической маршрутизации (OSPF, BGP) и NAT (отдельные темы, в курсе не разбираются)"
objectives:
  - "Описать кадр Ethernet II: MAC получателя и отправителя, EtherType, данные, FCS; различать unicast, broadcast и multicast MAC-адреса."
  - "Объяснить, зачем нужен ARP, из каких полей состоит ARP-запрос и ответ, и чей MAC-адрес запрашивается при отправке пакета в другую сеть."
  - "Прочитать таблицу маршрутов (префикс, шлюз, интерфейс, метрика) и объяснить маршрут по умолчанию и прямое подключение."
  - "Реализовать выбор маршрута по самому длинному совпавшему префиксу с разрешением равенства по metric."
  - "Назвать разницу между коммутатором (L2, таблица MAC) и маршрутизатором (L3, таблица префиксов) и объяснить, как IPv6 заменяет ARP (NDP)."
masteryCriteria:
  - "Вы пишете маршрутизатор, который для адреса назначения выбирает самый длинный подходящий префикс, а при равной длине - меньшую metric."
  - "Вы понимаете, что MAC-адрес в кадре меняется на каждом хопе, а IP-адреса отправителя и получателя остаются прежними (без NAT)."
  - "Вы знаете, что для адреса вне подсети ARP спрашивает MAC шлюза, а не конечного узла."
  - "Вы нормализуете префикс маршрута (192.168.1.77/24 означает сеть 192.168.1.0/24)."
tags:
  - "networking"
  - "ethernet"
  - "arp"
  - "routing"
  - "longest-prefix-match"
facts:
  - kind: "internals"
    text: "Кадр Ethernet II начинается с 6 байт MAC-адреса получателя, затем 6 байт MAC-адреса отправителя и 2 байт поля EtherType (0x0800 - IPv4, 0x0806 - ARP, 0x86DD - IPv6), потом идут данные (не больше 1500 байт) и 4 байта FCS. Широковещательный адрес - ff:ff:ff:ff:ff:ff."
    sources:
      - "https://www.rfc-editor.org/rfc/rfc894.html"
      - "https://www.rfc-editor.org/rfc/rfc7042.html"
  - kind: "internals"
    text: "Младший бит первого октета MAC-адреса (бит I/G) равен 1 у групповых адресов (multicast и broadcast), а следующий бит (U/L) показывает, что адрес назначен локально, а не производителем сетевой карты. Первые три октета глобального адреса - идентификатор производителя (OUI)."
    sources:
      - "https://www.rfc-editor.org/rfc/rfc7042.html"
  - kind: "historical"
    text: "ARP описан в RFC 826 (1982). Запрос 'у кого адрес X?' отправляется широковещанием на ff:ff:ff:ff:ff:ff, ответ приходит unicast-кадром от владельца адреса. Результаты хранятся в ARP-кэше с ограниченным временем жизни. ARP не аутентифицирует ответы, поэтому возможна подмена (ARP spoofing) в пределах одного канала."
    sources:
      - "https://www.rfc-editor.org/rfc/rfc826.html"
  - kind: "internals"
    text: "Маршрутизатор выбирает среди всех подходящих маршрутов тот, у которого самый длинный префикс (наиболее специфичный). Маршрут по умолчанию 0.0.0.0/0 подходит всегда и поэтому выбирается последним. Это правило закреплено в требованиях к IP-маршрутизаторам."
    sources:
      - "https://www.rfc-editor.org/rfc/rfc1812.html#section-5.2.4.3"
      - "https://www.rfc-editor.org/rfc/rfc4632.html"
  - kind: "internals"
    text: "В IPv6 вместо ARP работает протокол обнаружения соседей NDP (Neighbor Discovery): сообщения Neighbor Solicitation и Neighbor Advertisement передаются в ICMPv6 и используют multicast-адреса запрашиваемого узла, а не широковещание."
    sources:
      - "https://www.rfc-editor.org/rfc/rfc4861.html"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Какой протокол определяет MAC-адрес узла в локальной сети по его IPv4-адресу?
      options:
        - "DNS"
        - "ARP"
        - "DHCP"
        - "ICMP"
      answer: 1
      explanation: "ARP отправляет широковещательный запрос 'кто владеет IP X?', и владелец отвечает своим MAC-адресом."
    - id: "q2"
      type: "numeric"
      prompt: |
        Сколько байт занимает заголовок кадра Ethernet II (без FCS)?
      answer: 14
      tolerance: 0
      explanation: "MAC получателя (6) + MAC отправителя (6) + EtherType (2) = 14 байт."
    - id: "q3"
      type: "single"
      prompt: |
        В таблице маршрутов есть 10.0.0.0/8, 10.1.0.0/16 и 0.0.0.0/0. Какой маршрут будет выбран для адреса 10.1.5.5?
      options:
        - "10.0.0.0/8"
        - "10.1.0.0/16"
        - "0.0.0.0/0"
        - "Все три применяются по очереди"
      answer: 1
      explanation: "Подходят все три, но /16 самый специфичный (самый длинный префикс)."
    - id: "q4"
      type: "multiple"
      prompt: |
        Какие утверждения об ARP верны?
      options:
        - "Запрос отправляется широковещательно на ff:ff:ff:ff:ff:ff"
        - "Ответ отправляется только запросившему узлу (unicast)"
        - "Для адреса за пределами подсети запрашивается MAC шлюза"
        - "Результаты не кэшируются"
      answer:
        - 0
        - 1
        - 2
      explanation: "Ответы кэшируются на ограниченное время, иначе каждый пакет потребовал бы нового запроса."
    - id: "q5"
      type: "single"
      prompt: |
        Компьютер 192.168.1.10/24 отправляет пакет на 8.8.8.8. Чей MAC-адрес будет указан как получатель в кадре Ethernet?
      options:
        - "Узла 8.8.8.8"
        - "Шлюза по умолчанию (следующего хопа)"
        - "Широковещательный ff:ff:ff:ff:ff:ff"
        - "DNS-сервера"
      answer: 1
      explanation: "Кадр доставляется только в пределах канала. Адрес 8.8.8.8 вне подсети, поэтому кадр уходит на шлюз, а IP-адрес получателя в пакете остаётся 8.8.8.8."
exercise:
  id: "networking.fundamentals.ethernet-arp-routing.exercise"
  title: "Маршрутизатор по самому длинному префиксу"
  prompt: |

    **Сеть не используется.** Из stdin читается описание таблицы маршрутов и список адресов назначения.

    Первая строка - число маршрутов `N`. Следующие `N` строк - маршруты:

    ```
    <префикс>/<длина> [via <шлюз>] dev <интерфейс> [metric <число>]
    ```

    Пары слов `via`, `dev`, `metric` могут идти в любом порядке после префикса; `via` отсутствует у **прямого** подключения, `metric` по умолчанию 0. Префикс нужно **нормализовать**: `192.168.1.77/24` - это сеть `192.168.1.0/24`. Далее идут адреса назначения, по одному на строку (пустые строки пропускаются).

    Для каждого адреса выберите маршрут:

    1. Подходит маршрут, у которого `address & mask == network`.
    2. Среди подходящих выигрывает **самый длинный префикс**; при равной длине - меньшая `metric`; при равных `metric` - маршрут, указанный в таблице раньше.

    Вывод для адреса `D`:

    ```
    10.1.2.3 -> dev eth0 via 192.168.1.3 arp=192.168.1.3 route=10.1.0.0/16
    192.168.1.50 -> dev eth0 direct arp=192.168.1.50 route=192.168.1.0/24
    ```

    * маршрут со шлюзом: `-> dev <dev> via <шлюз> arp=<шлюз> route=<сеть>/<длина>` (MAC нужен у шлюза);
    * прямое подключение: `-> dev <dev> direct arp=<D> route=<сеть>/<длина>` (MAC нужен у самого адресата);
    * нет подходящего маршрута: `<D> -> unreachable`;
    * адрес не является корректным IPv4 (четыре октета 0-255, без ведущих нулей): `<D> -> invalid`.

    Префиксы в таблице всегда корректны. Адреса в таблице и во входе - только IPv4.

    **Что дано.** Заготовка читает таблицу в список строк и печатает `not implemented` для каждого адреса.
  entryFile: "router_task.py"
  evaluation: "io"
  hints:
    - "Превратите каждый маршрут в словарь: network (адрес префикса & mask), mask, length, via (число или None), dev, metric. Разбирайте оставшиеся слова парами: ключ, значение."
    - "Маска: (0xFFFFFFFF << (32 - length)) & 0xFFFFFFFF. Для /0 она равна 0, поэтому 0.0.0.0/0 подходит любому адресу. Сеть нормализуется как адрес & mask."
    - "Выбор: проходите маршруты по порядку и заменяйте лучший кандидат, только если у нового строго больше length или (length такая же и metric строго меньше). Тогда при полном равенстве победит маршрут, указанный раньше."
    - "Для вывода нужен обратный перевод числа в текст: '.'.join(str((n >> s) & 255) for s in (24, 16, 8, 0)). Для прямого маршрута arp равен самому адресу назначения, для маршрута со шлюзом - адресу шлюза."
  tests:
    - id: "longest-prefix"
      title: "Самый длинный префикс"
      stdin: "5\n0.0.0.0/0 via 192.168.1.1 dev eth0\n10.0.0.0/8 via 192.168.1.254 dev eth0\n10.1.0.0/16 via 192.168.1.2 dev eth0 metric 20\n10.1.0.0/16 via 192.168.1.3 dev eth0 metric 10\n192.168.1.77/24 dev eth0\n10.1.2.3\n10.2.2.2\n8.8.8.8\n"
      expected: "10.1.2.3 -> dev eth0 via 192.168.1.3 arp=192.168.1.3 route=10.1.0.0/16\n10.2.2.2 -> dev eth0 via 192.168.1.254 arp=192.168.1.254 route=10.0.0.0/8\n8.8.8.8 -> dev eth0 via 192.168.1.1 arp=192.168.1.1 route=0.0.0.0/0\n"
      hint: "Среди подходящих маршрутов (address & mask == network) выбирайте с наибольшей длиной префикса; при равенстве - с меньшей metric."
    - id: "direct"
      title: "Прямое подключение и ARP"
      stdin: "5\n0.0.0.0/0 via 192.168.1.1 dev eth0\n10.0.0.0/8 via 192.168.1.254 dev eth0\n10.1.0.0/16 via 192.168.1.2 dev eth0 metric 20\n10.1.0.0/16 via 192.168.1.3 dev eth0 metric 10\n192.168.1.77/24 dev eth0\n192.168.1.50\n"
      expected: "192.168.1.50 -> dev eth0 direct arp=192.168.1.50 route=192.168.1.0/24\n"
      hint: "Для маршрута без via MAC нужен у самого адреса назначения; в route= печатается нормализованная сеть 192.168.1.0/24."
    - id: "unreachable"
      title: "Нет подходящего маршрута"
      stdin: "2\n10.0.0.0/8 via 10.9.9.9 dev eth1\n192.168.0.0/16 dev eth0\n172.16.0.1\n10.0.0.1\n300.1.1.1\n"
      expected: "172.16.0.1 -> unreachable\n10.0.0.1 -> dev eth1 via 10.9.9.9 arp=10.9.9.9 route=10.0.0.0/8\n300.1.1.1 -> invalid\n"
      hint: "Без маршрута по умолчанию неизвестный адрес недостижим; некорректный адрес - invalid."
    - id: "host-route"
      title: "Хостовый маршрут /32 и default (скрытый)"
      stdin: "3\n0.0.0.0/0 via 10.0.0.1 dev wlan0\n10.0.0.0/24 dev wlan0\n10.0.0.5/32 via 10.0.0.9 dev wlan0\n10.0.0.5\n10.0.0.6\n11.0.0.1\n"
      expected: "10.0.0.5 -> dev wlan0 via 10.0.0.9 arp=10.0.0.9 route=10.0.0.5/32\n10.0.0.6 -> dev wlan0 direct arp=10.0.0.6 route=10.0.0.0/24\n11.0.0.1 -> dev wlan0 via 10.0.0.1 arp=10.0.0.1 route=0.0.0.0/0\n"
      hidden: true
      hint: "/32 побеждает /24, а /24 побеждает 0.0.0.0/0; префикс /0 имеет маску 0."
    - id: "metric-tie"
      title: "Равные префиксы: меньшая metric, затем первый (скрытый)"
      stdin: "4\n172.16.0.0/12 via 10.0.0.2 dev a metric 50\n172.16.0.0/12 via 10.0.0.3 dev b metric 5\n172.16.0.0/12 via 10.0.0.4 dev c metric 5\n172.16.5.0/24 via 10.0.0.7 dev d metric 100\n172.17.1.1\n172.16.5.9\n"
      expected: "172.17.1.1 -> dev b via 10.0.0.3 arp=10.0.0.3 route=172.16.0.0/12\n172.16.5.9 -> dev d via 10.0.0.7 arp=10.0.0.7 route=172.16.5.0/24\n"
      hidden: true
      hint: "При равной длине префикса выигрывает меньшая metric, а при равной metric - маршрут, указанный раньше."
    - id: "no-metric-default"
      title: "Нет metric у соседей (скрытый)"
      stdin: "2\n192.168.0.0/16 via 10.0.0.1 dev e0\n192.168.128.0/17 via 10.0.0.2 dev e1\n192.168.200.1\n192.168.100.1\n"
      expected: "192.168.200.1 -> dev e1 via 10.0.0.2 arp=10.0.0.2 route=192.168.128.0/17\n192.168.100.1 -> dev e0 via 10.0.0.1 arp=10.0.0.1 route=192.168.0.0/16\n"
      hidden: true
      hint: "/17 покрывает 192.168.128.0-192.168.255.255."
    - id: "empty-table"
      title: "Пустая таблица (скрытый)"
      stdin: "0\n1.1.1.1\n"
      expected: "1.1.1.1 -> unreachable\n"
      hidden: true
      hint: "Без маршрутов всё недостижимо."
