id: "networking.fundamentals.layers-and-encapsulation"
title: "Уровни сети, инкапсуляция и MTU"
goal: "Понимать, как данные приложения проходят вниз по стеку TCP/IP, какие заголовки добавляет каждый уровень, и вычислять размеры кадров и число IP-фрагментов для заданного MTU."
difficulty: "easy"
estimatedMinutes: 70
prerequisites:
  - "python.fundamentals.functions"
  - "python.fundamentals.strings"
related:
  - "python.stdlib.json-csv-struct"
  - "nodejs.fundamentals.buffers-encodings"
next:
  - "networking.fundamentals.ip-addressing-and-subnetting"
seeAlso:
  - "Сокеты и программирование сетевых серверов (в этом курсе сеть не открывается: все примеры работают с байтами и текстом)"
objectives:
  - "Сопоставить уровни модели OSI и модели TCP/IP и назвать PDU каждого уровня: сообщение, сегмент или датаграмма, пакет, кадр."
  - "Описать инкапсуляцию: какой заголовок и трейлер добавляет каждый уровень на пути вниз и как они снимаются на пути вверх."
  - "Объяснить MTU, MSS и разницу между размером кадра, IP-пакета и полезной нагрузки."
  - "Посчитать размер кадра на проводе и накладные расходы заголовков для заданных размеров заголовков."
  - "Вычислить число IP-фрагментов, размер данных и поле смещения (в блоках по 8 байт) для датаграммы, превышающей MTU, и учесть бит DF."
masteryCriteria:
  - "Вы пишете программу, которая для payload, заголовков и MTU выводит число фрагментов и размер каждого кадра."
  - "Вы помните, что данные во всех фрагментах, кроме последнего, кратны 8 байтам, а смещение записывается в единицах по 8 байт."
  - "Вы отличаете MTU (предел IP-пакета на канале) от размера кадра (MTU плюс заголовок и трейлер канального уровня)."
  - "Вы знаете, что при DF=1 вместо фрагментации узел получает ICMP-ошибку, а IPv6-маршрутизаторы не фрагментируют вообще."
tags:
  - "networking"
  - "osi"
  - "tcp-ip"
  - "encapsulation"
  - "mtu"
  - "fragmentation"
facts:
  - kind: "historical"
    text: "Модель OSI (семь уровней) разработана ISO как эталонная модель взаимодействия открытых систем. Стек TCP/IP, на котором построен Интернет, возник раньше и описывается в RFC иначе: RFC 1122 выделяет четыре уровня (канальный, межсетевой, транспортный, прикладной). Поэтому модель OSI используют как язык для разговора об уровнях, а не как описание реальных протоколов."
    sources:
      - "https://www.rfc-editor.org/rfc/rfc1122.html"
      - "https://www.rfc-editor.org/rfc/rfc1122.html#section-1.1.3"
  - kind: "internals"
    text: "Ethernet II несёт IP-пакет в поле данных кадра. Максимальный размер этого поля для Ethernet - 1500 байт (MTU 1500). Заголовок кадра (MAC получателя, MAC отправителя, EtherType) занимает 14 байт, контрольная последовательность кадра (FCS) - ещё 4 байта; преамбула и межкадровый интервал в размер кадра не входят."
    sources:
      - "https://www.rfc-editor.org/rfc/rfc894.html"
  - kind: "internals"
    text: "Фрагментация IPv4 описана в RFC 791: у каждого фрагмента свой IP-заголовок с тем же полем Identification, смещение фрагмента измеряется в блоках по 8 байт, флаг MF (more fragments) выставлен у всех фрагментов, кроме последнего. Собирает датаграмму только получатель. Если выставлен бит DF, а датаграмма не помещается, маршрутизатор её отбрасывает и отправляет ICMP-сообщение 'fragmentation needed' - на этом построено определение Path MTU."
    sources:
      - "https://www.rfc-editor.org/rfc/rfc791.html#section-2.3"
      - "https://www.rfc-editor.org/rfc/rfc1191.html"
  - kind: "internals"
    text: "В IPv6 маршрутизаторы пакеты не фрагментируют: фрагментировать может только отправитель, используя расширенный заголовок Fragment. Каждый канал IPv6 обязан поддерживать MTU не менее 1280 байт."
    sources:
      - "https://www.rfc-editor.org/rfc/rfc8200.html#section-5"
      - "https://www.rfc-editor.org/rfc/rfc8200.html#section-4.5"
  - kind: "misconception"
    text: "«MTU - это размер кадра Ethernet». На самом деле MTU 1500 ограничивает IP-пакет (заголовок IP плюс данные); кадр на 14 байт заголовка и 4 байта FCS больше. Из-за этого путают 1500 и 1518. А MSS у TCP - это размер данных в сегменте: при MTU 1500 и заголовках IP и TCP по 20 байт он равен 1460."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Какому уровню модели TCP/IP соответствует протокол IP?
      options:
        - "Канальному"
        - "Межсетевому (сетевому)"
        - "Транспортному"
        - "Прикладному"
      answer: 1
      explanation: "IP отвечает за адресацию и доставку пакетов между сетями: это межсетевой уровень (сетевой уровень OSI)."
    - id: "q2"
      type: "numeric"
      prompt: |
        Приложение отправляет по UDP 1000 байт данных. Заголовок UDP - 8 байт, заголовок IPv4 без опций - 20 байт. Какова общая длина IP-пакета (в байтах)?
      answer: 1028
      tolerance: 0
      explanation: "1000 + 8 + 20 = 1028 байт. Заголовок Ethernet и FCS в длину IP-пакета не входят."
    - id: "q3"
      type: "multiple"
      prompt: |
        Что добавляется к данным при инкапсуляции на пути от приложения к проводу?
      options:
        - "Заголовок транспортного уровня (порты)"
        - "Заголовок IP (адреса отправителя и получателя)"
        - "Заголовок и трейлер (FCS) канального уровня"
        - "DNS-имя получателя в каждый кадр"
      answer:
        - 0
        - 1
        - 2
      explanation: "Каждый уровень добавляет свой заголовок (канальный ещё и трейлер FCS). DNS-имя в кадры не попадает: имя разрешается в адрес заранее."
    - id: "q4"
      type: "numeric"
      prompt: |
        IPv4-датаграмма несёт 4000 байт данных (без IP-заголовка), MTU равен 1500, заголовок IP - 20 байт. На сколько фрагментов её разобьют?
      answer: 3
      tolerance: 0
      explanation: "В один фрагмент входит (1500 - 20) // 8 * 8 = 1480 байт данных. 4000 / 1480 = 2,7, значит нужно 3 фрагмента: 1480 + 1480 + 1040."
    - id: "q5"
      type: "single"
      prompt: |
        Кто фрагментирует слишком большие пакеты в IPv6?
      options:
        - "Любой маршрутизатор на пути"
        - "Только отправитель; маршрутизаторы IPv6 не фрагментируют"
        - "Только получатель"
        - "Коммутатор Ethernet"
      answer: 1
      explanation: "В IPv6 фрагментацию на пути убрали: отправитель узнаёт Path MTU и сам режет данные, маршрутизатор при превышении MTU отвечает ICMPv6 'Packet Too Big'."
exercise:
  id: "networking.fundamentals.layers-and-encapsulation.exercise"
  title: "Кадры и фрагментация при заданном MTU"
  prompt: |

    **Сеть не используется.** Программа читает из stdin одну строку вида

    ```
    payload=3000 transport=8 network=20 link=18 mtu=1500
    ```

    и необязательный параметр `df=1`. Поля (все целые, в байтах):

    * `payload` - данные приложения;
    * `transport` - заголовок транспортного уровня (8 для UDP), он добавляется **один раз** к датаграмме;
    * `network` - заголовок IP (его копия есть у каждого фрагмента);
    * `link` - накладные расходы канального уровня на **каждый кадр** (заголовок плюс FCS, для Ethernet 18);
    * `mtu` - максимальный размер IP-пакета (заголовок IP плюс данные);
    * `df` - бит Don't Fragment (по умолчанию 0).

    Правила:

    1. `ip_payload = payload + transport` - то, что IP должен перенести.
    2. Если `ip_payload <= mtu - network`, всё идёт одним пакетом без фрагментации.
    3. Иначе данные режутся на фрагменты. Данные в каждом фрагменте, кроме последнего, имеют размер `(mtu - network) // 8 * 8` (кратно 8). Если эта величина меньше 8, печатается `error: mtu too small` (после строки `ip_payload`). Если `df=1`, печатается `dropped: fragmentation needed but DF set` (также после строки `ip_payload`) и программа завершается.
    4. `offset` - смещение фрагмента в **блоках по 8 байт**; `mf` равен 1 у всех фрагментов, кроме последнего.

    Формат вывода:

    ```
    ip_payload=3008
    max_data_per_fragment=1480
    fragments=3
    fragment 1: offset=0 data=1480 ip_total=1500 frame=1518 mf=1
    fragment 2: offset=185 data=1480 ip_total=1500 frame=1518 mf=1
    fragment 3: offset=370 data=48 ip_total=68 frame=86 mf=0
    total_on_wire=3122
    efficiency=96.09%
    ```

    Здесь `ip_total = network + data`, `frame = ip_total + link`, `total_on_wire` - сумма размеров кадров, а `efficiency` - `100 * payload / total_on_wire` с двумя знаками после запятой. `max_data_per_fragment` всегда равен `(mtu - network) // 8 * 8`.

    **Что дано.** Заготовка читает поля в словарь `fields` и печатает `not implemented`.
  entryFile: "frames_task.py"
  evaluation: "io"
  hints:
    - "Сначала посчитайте ip_payload = payload + transport и room = mtu - network. Если ip_payload <= room, нужен ровно один кадр; иначе число фрагментов - потолочное деление ip_payload на (room // 8 * 8)."
    - "Потолочное деление без math: -(-a // b). Данные фрагмента: min(осталось, max_data). Смещение в блоках - накопленное число уже отправленных байтов, делённое на 8 (целочисленно)."
    - "Порядок проверок: напечатайте ip_payload, затем при ip_payload > room проверьте max_data < 8 (error: mtu too small) и df (dropped). Только после этого печатайте max_data_per_fragment, fragments и строки фрагментов."
    - "Цикл по фрагментам: data = min(remaining, max_data); remaining -= data; mf = 1 if remaining > 0 else 0; ip_total = network + data; frame = ip_total + link; суммируйте frame в wire_total. В конце efficiency = f'{100 * payload / wire_total:.2f}%'."
  tests:
    - id: "single-frame"
      title: "Датаграмма помещается в один кадр"
      stdin: "payload=1000 transport=8 network=20 link=18 mtu=1500\n"
      expected: "ip_payload=1008\nmax_data_per_fragment=1480\nfragments=1\nfragment 1: offset=0 data=1008 ip_total=1028 frame=1046 mf=0\ntotal_on_wire=1046\nefficiency=95.60%\n"
      hint: "ip_payload = payload + transport; если он не больше mtu - network, фрагмент один."
    - id: "three-fragments"
      title: "Фрагментация 3000 байт при MTU 1500"
      stdin: "payload=3000 transport=8 network=20 link=18 mtu=1500\n"
      expected: "ip_payload=3008\nmax_data_per_fragment=1480\nfragments=3\nfragment 1: offset=0 data=1480 ip_total=1500 frame=1518 mf=1\nfragment 2: offset=185 data=1480 ip_total=1500 frame=1518 mf=1\nfragment 3: offset=370 data=48 ip_total=68 frame=86 mf=0\ntotal_on_wire=3122\nefficiency=96.09%\n"
      hint: "Данные во фрагменте кратны 8: (1500 - 20) // 8 * 8 = 1480. Смещение печатается в единицах по 8 байт."
    - id: "exact-fit"
      title: "Ровно по границе MTU"
      stdin: "payload=1472 transport=8 network=20 link=18 mtu=1500\n"
      expected: "ip_payload=1480\nmax_data_per_fragment=1480\nfragments=1\nfragment 1: offset=0 data=1480 ip_total=1500 frame=1518 mf=0\ntotal_on_wire=1518\nefficiency=96.97%\n"
      hint: "1472 + 8 = 1480 = mtu - network: фрагментации нет, mf=0."
    - id: "one-extra-byte"
      title: "Лишний байт даёт второй фрагмент (скрытый)"
      stdin: "payload=1473 transport=8 network=20 link=18 mtu=1500\n"
      expected: "ip_payload=1481\nmax_data_per_fragment=1480\nfragments=2\nfragment 1: offset=0 data=1480 ip_total=1500 frame=1518 mf=1\nfragment 2: offset=185 data=1 ip_total=21 frame=39 mf=0\ntotal_on_wire=1557\nefficiency=94.61%\n"
      hidden: true
      hint: "1481 байт не влезают в 1480: второй фрагмент несёт 1 байт."
    - id: "small-mtu"
      title: "MTU 576, заголовки побольше (скрытый)"
      stdin: "payload=2000 transport=20 network=20 link=14 mtu=576\n"
      expected: "ip_payload=2020\nmax_data_per_fragment=552\nfragments=4\nfragment 1: offset=0 data=552 ip_total=572 frame=586 mf=1\nfragment 2: offset=69 data=552 ip_total=572 frame=586 mf=1\nfragment 3: offset=138 data=552 ip_total=572 frame=586 mf=1\nfragment 4: offset=207 data=364 ip_total=384 frame=398 mf=0\ntotal_on_wire=2156\nefficiency=92.76%\n"
      hidden: true
      hint: "Размер данных во фрагменте: (576 - 20) // 8 * 8 = 552."
    - id: "df-set"
      title: "Бит DF и нужна фрагментация (скрытый)"
      stdin: "payload=3000 transport=8 network=20 link=18 mtu=1500 df=1\n"
      expected: "ip_payload=3008\ndropped: fragmentation needed but DF set\n"
      hidden: true
      hint: "Если фрагментация нужна, а DF=1, печатается только ip_payload и строка dropped."
    - id: "df-fits"
      title: "DF не мешает, если всё помещается (скрытый)"
      stdin: "payload=100 transport=8 network=20 link=18 mtu=1500 df=1\n"
      expected: "ip_payload=108\nmax_data_per_fragment=1480\nfragments=1\nfragment 1: offset=0 data=108 ip_total=128 frame=146 mf=0\ntotal_on_wire=146\nefficiency=68.49%\n"
      hidden: true
      hint: "DF важен только когда датаграмма больше MTU."
    - id: "mtu-tiny"
      title: "MTU меньше минимума (скрытый)"
      stdin: "payload=100 transport=8 network=20 link=18 mtu=27\n"
      expected: "ip_payload=108\nerror: mtu too small\n"
      hidden: true
      hint: "Если на данные остаётся меньше 8 байт, это error: mtu too small."
    - id: "empty"
      title: "Пустая полезная нагрузка (скрытый)"
      stdin: "payload=0 transport=8 network=20 link=18 mtu=1500\n"
      expected: "ip_payload=8\nmax_data_per_fragment=1480\nfragments=1\nfragment 1: offset=0 data=8 ip_total=28 frame=46 mf=0\ntotal_on_wire=46\nefficiency=0.00%\n"
      hidden: true
      hint: "Даже при payload=0 есть заголовок транспорта: один кадр из 8 + 20 + 18 байтов."
