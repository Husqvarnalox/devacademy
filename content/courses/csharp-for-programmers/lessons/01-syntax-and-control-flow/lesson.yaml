id: "csharp.programmers.syntax-and-control-flow"
title: "Числа, строки и управление потоком: ловушки C#"
goal: "Писать вычисления с целыми и десятичными числами, остатком, округлением и выбором по значению так, чтобы переполнение, усечение и культура компьютера не искажали результат."
difficulty: "medium"
estimatedMinutes: 45
prerequisites: []
next:
  - "csharp.programmers.methods-and-collections"
objectives:
  - "Предсказывать результат целочисленного деления и остатка для отрицательных чисел и избегать переполнения int."
  - "Выбирать между double и decimal и явно задавать режим округления Math.Round."
  - "Объяснять, что строка в C# неизменяема, сравнивается по значению и что Length считает единицы UTF-16."
  - "Фиксировать культуру через CultureInfo.InvariantCulture при выводе и разборе чисел."
  - "Записывать выбор по значению через switch-выражение с образцами."
masteryCriteria:
  - "Average, FloorMod, OrderTotal и Grade дают верные результаты на обычных и граничных значениях: переполнение int, отрицательные числа, середина между копейками, оценки вне диапазона."
  - "Квиз пройден с результатом не ниже 70%."
