id: "csharp.programmers.methods-and-collections"
title: "Методы и коллекции: ссылки, ключи и безопасный обход"
goal: "Писать методы и работать с массивами, списками, словарями и множествами так, чтобы не путать ссылку с копией и не получать исключения от отсутствующих ключей и изменения коллекции при обходе."
difficulty: "medium"
estimatedMinutes: 45
prerequisites:
  - "csharp.programmers.syntax-and-control-flow"
next:
  - "csharp.programmers.errors-input-and-classes"
objectives:
  - "Объяснять, что массивы, списки и словари передаются как ссылки, и отличать изменение содержимого от подмены переменной."
  - "Использовать необязательные, именованные, params- и out-параметры и возвращать кортежи."
  - "Читать значения словаря через TryGetValue и GetValueOrDefault и считать частоты слов."
  - "Убирать дубликаты с помощью HashSet и не менять список внутри foreach."
  - "Сортировать строки через StringComparer.Ordinal для воспроизводимого порядка."
masteryCriteria:
  - "CountWords, GetOrDefault, Dedupe и Rotate дают верные результаты на обычных и граничных данных (пустой массив, большой или отрицательный сдвиг, регистр слов) и не меняют входные коллекции."
  - "Квиз пройден с результатом не ниже 70%."
tags:
  - "csharp"
  - "programmers"
  - "collections"
  - "methods"
assessmentFor:
  - "csharp.from-zero.methods"
  - "csharp.from-zero.return-values"
  - "csharp.from-zero.arrays"
  - "csharp.from-zero.lists"
  - "csharp.from-zero.dictionaries"
  - "csharp.from-zero.string-methods"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```csharp
        int[] a = { 1, 2, 3 };
        int[] b = a;
        b[0] = 9;
        Console.WriteLine(a[0]);
        ```
      options:
        - "1"
        - "9"
        - "0"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Массив - ссылочный тип: присваивание b = a копирует ссылку, и обе переменные указывают на один и тот же массив. Изменение через b видно через a. Независимая копия делается явно, например a.ToArray()."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```csharp
        int[] x = { 1, 2 };
        int[] y = { 1, 2 };
        Console.WriteLine(x == y);
        ```
      options:
        - "True"
        - "False"
        - "Ошибка компиляции"
        - "Зависит от значений"
      answer: 1
      explanation: "Для массивов оператор == сравнивает ссылки, а не содержимое. x и y - два разных объекта, поэтому результат False. Содержимое сравнивает x.SequenceEqual(y)."
    - id: "q3"
      type: "single"
      prompt: |-
        Что произойдёт?

        ```csharp
        var d = new Dictionary<string, int>();
        Console.WriteLine(d["x"]);
        ```
      options:
        - "Выведется 0"
        - "Выведется пустая строка"
        - "Бросится KeyNotFoundException"
        - "Выведется null"
      answer: 2
      explanation: "Чтение отсутствующего ключа через индексатор бросает KeyNotFoundException; словарь не подставляет значение по умолчанию. Для необязательных ключей используют TryGetValue или GetValueOrDefault."
    - id: "q4"
      type: "single"
      prompt: |-
        Что произойдёт при запуске?

        ```csharp
        var list = new List<int> { 1, 2, 3 };
        foreach (int n in list)
        {
            if (n == 2) list.Remove(n);
        }
        ```
      options:
        - "Элемент 2 удалится, ошибки нет"
        - "Бросится InvalidOperationException"
        - "Бросится IndexOutOfRangeException"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Менять список во время foreach нельзя: после удаления следующий шаг обхода замечает, что коллекция изменилась, и бросает InvalidOperationException. Безопасный вариант - RemoveAll или обход копии."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```csharp
        static void Reassign(int[] data)
        {
            data = new int[] { 99 };
        }

        int[] x = { 1 };
        Reassign(x);
        Console.WriteLine(x[0]);
        ```
      options:
        - "99"
        - "1"
        - "0"
        - "Бросится исключение"
      answer: 1
      explanation: "Метод получает копию ссылки. Присваивание параметру data заменяет только эту копию, а переменная x у вызывающего по-прежнему указывает на старый массив. Изменение элементов data[0] = 99 было бы видно снаружи."
exercise:
  id: "csharp.programmers.methods-and-collections.exercise"
  title: "Частоты слов, значения по умолчанию, дубликаты и сдвиг"
  prompt: |
    Основная часть программы написана: она читает команды (по одной на строку) и печатает результат вызова ваших методов. Напишите четыре метода в `Program.cs`. Основную часть не меняйте.

    1. `CountWords(string text)` - словарь «слово - сколько раз встретилось». Слова разделены пробелами, регистр не важен (`The` и `the` - одно слово, ключи строчные через `ToLowerInvariant()`).
    2. `GetOrDefault(Dictionary<string, int> counts, string key, int fallback)` - значение по ключу или `fallback`, если ключа нет. Исключения быть не должно.
    3. `Dedupe(List<int> items)` - **новый** список, где каждое число встречается один раз (первое вхождение), порядок сохраняется. Исходный список менять нельзя.
    4. `Rotate(int[] items, int k)` - **новый** массив, в котором элементы сдвинуты вправо на `k` позиций. Значение `k` может быть отрицательным (сдвиг влево) или больше длины массива; пустой массив даёт пустой массив. Исходный массив менять нельзя.

    **Пример.** Для ввода

    ```
    words the cat and The
    count the 0
    count bird -1
    dedupe 3 1 3 2 1
    rotate 2 1 2 3 4 5
    ```

    программа печатает

    ```
    and=1
    cat=1
    the=2
    2
    -1
    3 1 2
    исходный список: 5
    4 5 1 2 3
    1 2 3 4 5
    ```

    Часть тестов скрыта: в них сдвиги за границами, регистр и повторные команды.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "В заготовке методы возвращают пустые значения. Команда words вызывает CountWords, count - GetOrDefault, dedupe - Dedupe, rotate - Rotate."
    - "CountWords: разбейте text через Split(' ', StringSplitOptions.RemoveEmptyEntries), приведите слово к ToLowerInvariant() и увеличивайте счётчик через TryGetValue. GetOrDefault: if (counts.TryGetValue(key, out int value)) return value; return fallback;"
    - "Dedupe: заведите HashSet<int> seen и новый список result; добавляйте число в result только если seen.Add(число) вернул true."
    - "Rotate: новый массив result той же длины, int shift = ((k % n) + n) % n, элемент i кладите в result[(i + shift) % n]. Для n == 0 верните пустой массив до вычисления остатка."
  tests:
    - id: "words-and-count"
      title: "Частоты слов и значение по умолчанию"
      stdin: "words the cat and The Dog and THE end\ncount the 0\ncount bird -1\n"
      expected: |
        and=2
        cat=1
        dog=1
        end=1
        the=3
        3
        -1
      hint: "Слова приводятся к нижнему регистру, поэтому the, The и THE - один ключ (3). Для отсутствующего ключа bird возвращается fallback -1."
    - id: "dedupe-and-rotate"
      title: "Дубликаты и сдвиг вправо"
      stdin: "dedupe 3 1 3 2 1\nrotate 2 1 2 3 4 5\n"
      expected: |
        3 1 2
        исходный список: 5
        4 5 1 2 3
        1 2 3 4 5
      hint: "Dedupe оставляет первые вхождения 3, 1, 2 и не меняет исходный список (в нём по-прежнему 5 элементов). Сдвиг на 2 вправо даёт 4 5 1 2 3, исходный массив остаётся 1 2 3 4 5."
    - id: "rotate-edges"
      title: "Сдвиг: отрицательный, большой, нулевой, пустой (скрытый)"
      stdin: "rotate -1 1 2 3 4 5\nrotate 7 1 2 3\nrotate 0 9 8\nrotate 4 8\n"
      expected: |
        2 3 4 5 1
        1 2 3 4 5
        3 1 2
        1 2 3
        9 8
        9 8
        8
        8
      hidden: true
      hint: "Сдвиг -1 уводит первый элемент в конец. Сдвиг 7 для трёх элементов равен 7 % 3 = 1. Для отрицательного k остаток от деления может быть отрицательным: используйте ((k % n) + n) % n."
    - id: "words-case-and-reset"
      title: "Регистр кириллицы и повторный words (скрытый)"
      stdin: "words Кот кот КОТ пёс\ncount кот 0\nwords a b\ncount кот 7\n"
      expected: |
        кот=3
        пёс=1
        3
        a=1
        b=1
        7
      hidden: true
      hint: "ToLowerInvariant приводит и кириллицу: Кот, кот и КОТ - один ключ. Каждая команда words создаёт новый словарь, поэтому после второй команды ключа кот в нём нет и возвращается fallback 7."
    - id: "dedupe-edges"
      title: "Дубликаты: одинаковые, отрицательные, без повторов (скрытый)"
      stdin: "dedupe 5 5 5 5\ndedupe 1 2 3\ndedupe -1 0 -1 0\n"
      expected: |
        5
        исходный список: 4
        1 2 3
        исходный список: 3
        -1 0
        исходный список: 4
      hidden: true
      hint: "Из четырёх одинаковых чисел остаётся одно. Исходный список должен сохранить все элементы: возвращайте новый список, а не удаляйте из items."
