id: "csharp-for-programmers"
version: "1.0.0"
title: "C# для программистов"
description: "Быстрый путь для тех, кто уже пишет на другом языке (Python, Java, JavaScript, Go): три плотных урока о том, что в C# устроено иначе и где чаще всего ошибаются. Переполнение int, деление и остаток, double и decimal, культура и строки; ссылки, массивы, списки и словари; разбор ввода, исключения и классы. Каждый урок завершается упражнением с запуском проверок и квизом на типичные ловушки; успешное прохождение засчитывает соответствующие уроки курса «C# с нуля». Это не замена курсу для начинающих: основы программирования здесь считаются известными."
languageId: "csharp"
level: 1
track: "csharp"
lessons:
  - "01-syntax-and-control-flow"
  - "02-methods-and-collections"
  - "03-errors-input-and-classes"
