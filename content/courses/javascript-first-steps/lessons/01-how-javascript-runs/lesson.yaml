id: "javascript.first-steps.how-javascript-runs"
title: "Как выполняется JavaScript и как читать stdin"
goal: "Понять, что делает движок V8 с кодом, и написать программу, которая читает числа из stdin и печатает результат."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "javascript.from-zero.reading-input"
objectives:
  - "Объяснить роли разбора, байткода (Ignition) и JIT-компиляции (TurboFan) в V8."
  - "Отличить язык ECMAScript от возможностей среды запуска (console, process, require)."
  - "Прочитать stdin целиком и превратить текст в числа."
  - "Назвать, как представляются числа в JavaScript, и предсказать результат Number(), parseInt и toFixed."
  - "Различать stdout и stderr при выводе."
masteryCriteria:
  - "Вы можете описать путь от файла main.js до выполнения и сказать, что относится к языку, а что к среде."
  - "Вы предсказываете результат Number(\"\"), Number(\"abc\"), \"12\" + 1 и 0.1 + 0.2."
  - "Вы пишете программу, читающую числа из произвольно размеченного ввода, без лишних нулей из пустых токенов."
related:
  - "python.fundamentals.how-python-runs"
next:
  - "javascript.first-steps.values-and-equality"
tags:
  - "javascript"
  - "v8"
  - "stdin"
  - "stdout"
  - "number"
facts:
  - kind: "internals"
    text: "V8 не компилирует JavaScript сразу в машинный код: исходный текст разбирается, из него строится байткод для интерпретатора Ignition, а часто выполняемые функции затем компилируются оптимизирующим компилятором TurboFan. Оптимизированный код опирается на предположения о типах и при их нарушении отбрасывается."
    sources:
      - "https://v8.dev/blog/launching-ignition-and-turbofan"
  - kind: "internals"
    text: "Стандарт ECMAScript описывает язык, а объекты окружения предоставляет хост: в обзоре стандарта сказано, что язык работает внутри среды-хоста, которая даёт ему объекты и средства ввода-вывода. Поэтому console, process и require не являются частью языка."
    sources:
      - "https://tc39.es/ecma262/#sec-overview"
  - kind: "misconception"
    text: "«Все числа в JavaScript целые или десятичные по ситуации» - неверно. Тип number всегда 64-битное число с плавающей точкой IEEE 754, поэтому 0.1 + 0.2 не равно 0.3, а целые точны лишь до 2^53 - 1."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что V8 делает с кодом, который выполняется очень часто?"
      options:
        - "Всегда выполняет его только как текст построчно."
        - "Компилирует в оптимизированный машинный код, опираясь на предположения о типах."
        - "Отправляет его в браузер на проверку."
        - "Переписывает исходный файл на диске."
      answer: 1
      explanation: "Горячий код компилируется оптимизирующим компилятором TurboFan в машинный код по предположениям о типах. Если предположение нарушается, происходит возврат к байткоду. Результат программы не меняется."
    - id: "q2"
      type: "single"
      prompt: "Что выведет console.log(\"12\" + 1)?"
      options:
        - "13"
        - "NaN"
        - "121"
        - "12 1"
      answer: 2
      explanation: "Если один из операндов оператора + строка, то выполняется склейка строк: число 1 превращается в \"1\", получается \"121\"."
    - id: "q3"
      type: "multiple"
      prompt: "Что из перечисленного НЕ определено стандартом ECMAScript и предоставляется средой запуска?"
      options:
        - "console.log"
        - "Math.max"
        - "require(\"node:fs\")"
        - "JSON.parse"
      answer:
        - 0
        - 2
      explanation: "console.log и require - объекты и функции хоста (браузера или Node.js). Math и JSON определены в самом стандарте языка."
    - id: "q4"
      type: "short"
      prompt: "Какой метод числа возвращает СТРОКУ с заданным количеством знаков после точки?"
      answer:
        - "toFixed"
        - "toFixed()"
        - "Number.prototype.toFixed"
      explanation: "toFixed(2) вернёт строку, например \"2.50\"; складывать её с числом нельзя без явного преобразования."
exercise:
  id: "javascript.first-steps.how-javascript-runs.exercise"
  title: "Статистика по числам из stdin"
  prompt: |

    Программа получает на вход число `n` (1 <= n <= 1000), а затем `n` целых чисел, каждое из которых по модулю не больше 2 000 000 000.
    Числа могут быть разбросаны по строкам как угодно и разделены любым количеством пробелов и переводов строк.

    Выведите ровно четыре строки:

    ```
    sum=<сумма>
    min=<наименьшее>
    max=<наибольшее>
    avg=<среднее арифметическое с двумя знаками после точки>
    ```

    **Пример.** Ввод `4` и затем `1 2 3 4` даёт

    ```
    sum=10
    min=1
    max=4
    avg=2.50
    ```

    Среднее печатайте с точкой как десятичным разделителем, независимо от региональных настроек системы.
    Сумма может не поместиться в 32 бита, учитывайте это.
  entryFile: "main.js"
  evaluation: "io"
  hints:
    - "Прочитайте весь ввод одной строкой: require(\"node:fs\").readFileSync(0, \"utf8\"). Затем trim() и split(/\\s+/)."
    - "Первый токен - n, остальные - числа. Преобразуйте их в числа через .map(Number) до любых вычислений, иначе \"3\" + \"4\" склеится в \"34\"."
    - "Для minimum и maximum используйте цикл или reduce. Среднее печатайте через (sum / nums.length).toFixed(2)."
    - "Скелет: const t = readFileSync(0, \"utf8\").trim().split(/\\s+/); const n = Number(t[0]); const nums = t.slice(1, 1 + n).map(Number); затем sum, min, max, а затем четыре console.log."
  tests:
    - id: "basic"
      title: "Числа в одной строке"
      stdin: "4\n1 2 3 4\n"
      expected: "sum=10\nmin=1\nmax=4\navg=2.50\n"
      hint: "Проверьте формат: четыре строки вида sum=..., min=..., max=..., avg=... без пробелов вокруг знака равенства."
    - id: "lines"
      title: "Числа на разных строках"
      stdin: "3\n10\n20\n30\n"
      expected: "sum=60\nmin=10\nmax=30\navg=20.00\n"
      hint: "Числа лежат на разных строках: разбирайте весь текст через split(/\\s+/), а не только первую строку."
    - id: "single"
      title: "Одно число"
      stdin: "1\n7\n"
      expected: "sum=7\nmin=7\nmax=7\navg=7.00\n"
      hint: "При n = 1 сумма, минимум и максимум равны одному числу; среднее печатается как 7.00."
    - id: "negatives"
      title: "Отрицательные числа (скрытый)"
      stdin: "5\n-3 -1 -4 -1 -5\n"
      expected: "sum=-14\nmin=-5\nmax=-1\navg=-2.80\n"
      hidden: true
      hint: "Начальное значение для минимума не должно быть 0: при отрицательных числах оно сломает min и max. Берите первый элемент массива."
    - id: "whitespace"
      title: "Лишние пробелы и пустые строки (скрытый)"
      stdin: "3\n  5   2\n\n 2\n"
      expected: "sum=9\nmin=2\nmax=5\navg=3.00\n"
      hidden: true
      hint: "Ведущие пробелы и пустые строки дают пустые токены, а Number(\"\") равно 0. Используйте trim() перед split(/\\s+/)."
    - id: "rounding"
      title: "Округление среднего (скрытый)"
      stdin: "3\n1 2 2\n"
      expected: "sum=5\nmin=1\nmax=2\navg=1.67\n"
      hidden: true
      hint: "Среднее 5/3 надо округлить до 1.67 через toFixed(2), а не обрезать до 1.66."
    - id: "big-sum"
      title: "Сумма больше 32-битного диапазона (скрытый)"
      stdin: "2\n2000000000 2000000000\n"
      expected: "sum=4000000000\nmin=2000000000\nmax=2000000000\navg=2000000000.00\n"
      hidden: true
      hint: "Сумма 4000000000 в JavaScript считается точно, так как число - это 64-битный double. Не обрабатывайте её как 32-битное через | 0."
