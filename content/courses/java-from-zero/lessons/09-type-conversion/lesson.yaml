id: "java.from-zero.type-conversion"
title: "Преобразование типов"
goal: "Превращать текст в числа методами parseInt и parseDouble и менять тип числа приведением (int) и (double)."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "java.from-zero.reading-input"
objectives:
  - "Преобразовать строку в int методом Integer.parseInt и в double методом Double.parseDouble."
  - "Выполнить приведение (int) и (double) и предсказать результат."
  - "Получить дробный результат деления двух int, приведя один из операндов к double."
  - "Узнавать по сообщению NumberFormatException, какая строка не превратилась в число."
masteryCriteria:
  - "Программа читает числа как слова и превращает их в int и double сама."
  - "Вы предсказываете (int) 3.99, (int) -3.99 и (double) 7 / 2 и объясняете результат."
  - "Вы различаете (double) a / b и (double) (a / b)."
concepts:
  introduces:
    - "java.parse-int"
    - "java.parse-double"
    - "java.cast"
    - "java.number-format-exception"
  uses:
    - "java.string"
    - "java.int"
    - "java.double"
    - "java.integer-division"
    - "java.arithmetic"
    - "java.scanner"
    - "java.concatenation"
    - "java.println"
    - "java.compile-error"
next:
  - "java.from-zero.formatted-output"
tags:
  - "java"
  - "type-conversion"
  - "cast"
  - "parseInt"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```java
        String text = "42";
        System.out.println(Integer.parseInt(text) + 1);
        ```
      options:
        - "43"
        - "421"
        - "42 + 1"
        - "Ошибка компиляции"
      answer: 0
      explanation: "parseInt превращает текст \"42\" в число 42, и к нему прибавляется 1. Склейка дала бы 421, но она получается только если складывать строку, а не число."
    - id: "q2"
      type: "single"
      prompt: |
        Чему равно значение выражения?

        ```java
        (int) 3.99
        ```
      options:
        - "3"
        - "4"
        - "3.99"
        - "Ошибка компиляции"
      answer: 0
      explanation: "Приведение (int) отбрасывает дробную часть, а не округляет. Для отрицательных чисел также к нулю: (int) -3.99 равно -3."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```java
        int a = 7;
        int b = 2;
        System.out.println((double) (a / b));
        ```
      options:
        - "3.0"
        - "3.5"
        - "3"
        - "Ошибка компиляции"
      answer: 0
      explanation: "Сначала в скобках выполняется целочисленное деление: 7 / 2 равно 3. Только потом результат превращается в double: 3.0. Чтобы получить 3.5, приводят операнд: (double) a / b."
    - id: "q4"
      type: "single"
      prompt: "Какая ошибка возникает при выполнении Integer.parseInt(\"3.5\")?"
      options:
        - "NumberFormatException: For input string: \"3.5\""
        - "Ошибка компиляции: incompatible types"
        - "Результат 3"
        - "Результат 4"
      answer: 0
      explanation: "parseInt принимает только запись целого числа. Строка с точкой для него не число, и метод бросает NumberFormatException с текстом строки в сообщении. Компилятор не может знать, что окажется в строке."
    - id: "q5"
      type: "single"
      prompt: |
        Что делает компилятор с этой строкой?

        ```java
        double d = 5;
        int n = d;
        ```
      options:
        - "Сообщает: possible lossy conversion from double to int"
        - "Молча записывает 5 в n"
        - "Записывает в n число 5.0"
        - "Сообщает, что d не объявлена"
      answer: 0
      explanation: "int меньше double: дробная часть могла бы потеряться, поэтому Java не делает такое преобразование сама. Нужно явное приведение: int n = (int) d;"
exercise:
  id: "java.from-zero.type-conversion.exercise"
  title: "Количество и цена"
  prompt: |
    На вход подаются два слова: количество товара (целое число) и цена за штуку (число с точкой). В заготовке они уже прочитаны как строки `countText` и `priceText`.

    Преобразуйте их в числа и напечатайте четыре строки:

    ```
    Вдвое больше: <количество * 2>
    Половина: <количество / 2 с дробной частью>
    Целая половина: <количество / 2 целочисленно>
    Стоимость: <количество * цена>
    ```

    **Пример.** Ввод:

    ```
    7 2.5
    ```

    Вывод:

    ```
    Вдвое больше: 14
    Половина: 3.5
    Целая половина: 3
    Стоимость: 17.5
    ```

    В тестах цены выбраны так, чтобы результат умножения печатался без длинных «хвостов» (2.5, 0.5, 1.25, 0.75).
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Количество - Integer.parseInt(countText), цена - Double.parseDouble(priceText). Результат кладите в переменные типов int и double."
    - "«Половина» с дробной частью получается, если хотя бы один операнд деления - double: (double) count / 2."
    - "«Целая половина» - обычное деление двух int: count / 2."
    - "В склейке с текстом арифметическое выражение можно писать как есть, если оно использует * или /: \"Вдвое больше: \" + count * 2. Скобки нужны только для + и -."
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "7 2.5\n"
      expected: |
        Вдвое больше: 14
        Половина: 3.5
        Целая половина: 3
        Стоимость: 17.5
      hint: "count = 7: вдвое - 14, половина с дробью - 3.5, целая половина - 3, стоимость 7 * 2.5 = 17.5."
    - id: "even"
      title: "Чётное количество"
      stdin: "10 0.5\n"
      expected: |
        Вдвое больше: 20
        Половина: 5.0
        Целая половина: 5
        Стоимость: 5.0
      hint: "Дробная половина десяти печатается как 5.0, потому что это double; стоимость 10 * 0.5 тоже double - 5.0."
    - id: "zero"
      title: "Нулевое количество (скрытый)"
      stdin: "0 1.25\n"
      expected: |
        Вдвое больше: 0
        Половина: 0.0
        Целая половина: 0
        Стоимость: 0.0
      hidden: true
      hint: "Ноль тоже число: половина с дробью 0.0, целая половина 0, стоимость 0.0."
    - id: "odd-separate-lines"
      title: "Слова на разных строках (скрытый)"
      stdin: "9\n0.75\n"
      expected: |
        Вдвое больше: 18
        Половина: 4.5
        Целая половина: 4
        Стоимость: 6.75
      hidden: true
      hint: "9 / 2 по-разному: 4.5 с дробью и 4 целочисленно; стоимость 9 * 0.75 = 6.75."
