id: "java.from-zero.if-else"
title: "Условие: if, else if и else"
goal: "Писать программы, которые выбирают одну из нескольких веток действий в зависимости от значения условия."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "java.from-zero.comparison-and-logic"
objectives:
  - "Записывать команду if, else и else if с условием типа boolean и блоком в фигурных скобках."
  - "Располагать условия в цепочке от узких к широким и предсказывать, какая ветка выполнится."
  - "Объявлять переменные внутри блока и понимать, где они видны."
  - "Находить ошибки: присваивание в условии, лишнюю точку с запятой, ветку без фигурных скобок."
masteryCriteria:
  - "Программа печатает цену билета для каждой возрастной группы, в том числе на границах 5/6, 17/18 и 64/65."
  - "Для возраста меньше нуля программа печатает сообщение об ошибке, а не цену."
  - "Вы объясняете, почему условия цепочки else if идут от узких к широким."
concepts:
  introduces:
    - "java.if"
    - "java.else"
    - "java.block"
  uses:
    - "java.comparison"
    - "java.logical-operators"
    - "java.boolean-expression"
    - "java.int"
    - "java.string"
    - "java.scanner"
    - "java.println"
    - "java.concatenation"
    - "java.compile-error"
    - "java.assignment"
    - "java.variable"
next:
  - "java.from-zero.switch"
tags:
  - "java"
  - "if"
  - "else"
  - "condition"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что напечатает программа?

        ```java
        int n = 10;
        if (n > 5) {
            System.out.println("A");
        } else if (n > 8) {
            System.out.println("B");
        } else {
            System.out.println("C");
        }
        ```
      options:
        - "A"
        - "B"
        - "AB"
        - "C"
      answer: 0
      explanation: "Условия проверяются сверху вниз. Первое (n > 5) истинно, выполняется его ветка, остальные пропускаются, хотя n > 8 тоже верно."
    - id: "q2"
      type: "single"
      prompt: |-
        Что напечатает программа?

        ```java
        int x = 2;
        if (x > 5);
        {
            System.out.println("Много");
        }
        System.out.println("Конец");
        ```
      options:
        - "Конец"
        - "Много, затем Конец"
        - "Ничего"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Точка с запятой после условия образует пустую ветку. Блок в фигурных скобках уже не относится к if, поэтому «Много» печатается всегда."
    - id: "q3"
      type: "single"
      prompt: "Компилятор сообщает: incompatible types: int cannot be converted to boolean. Какая запись это вызвала?"
      options:
        - "if (x == 5)"
        - "if (x = 5)"
        - "if (x >= 5)"
        - "if (x != 5)"
      answer: 1
      explanation: "Один знак = - это присваивание, его значение имеет тип int. Условию нужен boolean, поэтому сравнение записывают как x == 5."
    - id: "q4"
      type: "single"
      prompt: |-
        Что напечатает программа?

        ```java
        int t = 15;
        if (t < 0)
            System.out.println("Холодно");
            System.out.println("Возьмите шапку");
        ```
      options:
        - "Ничего"
        - "Холодно"
        - "Возьмите шапку"
        - "Холодно, затем Возьмите шапку"
      answer: 2
      explanation: "Без фигурных скобок к if относится только первая команда. Вторая выполняется всегда, несмотря на отступ."
exercise:
  id: "java.from-zero.if-else.exercise"
  title: "Цена билета в кино"
  prompt: |
    На вход подаётся возраст зрителя - целое число `age`. Напечатайте одну строку:

    * `Цена: 0 руб.`, если возраст от 0 до 5 лет включительно;
    * `Цена: 150 руб.`, если от 6 до 17 лет и если 65 лет и больше;
    * `Цена: 300 руб.`, если от 18 до 64 лет;
    * `Некорректный возраст`, если возраст отрицательный.

    **Пример.** Ввод:

    ```
    25
    ```

    Вывод:

    ```
    Цена: 300 руб.
    ```
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Сначала отсеките некорректный случай: возраст меньше нуля. Остальные ветки удобнее проверять после него в одной цепочке else if."
    - "Цепочка идёт от узких условий к широким: age < 0, затем age <= 5, затем age <= 17, затем age <= 64, и в else остаётся 65 и больше."
    - "Три разные цены нужны на четырёх промежутках; тексты веток для 6-17 и для 65+ совпадают, поэтому их можно объединить через || либо разнести по двум веткам."
  tests:
    - id: "adult"
      title: "Взрослый"
      stdin: |
        25
      expected: |
        Цена: 300 руб.
      hint: "25 лет попадает в диапазон 18-64: цена 300 руб."
    - id: "child"
      title: "Школьник"
      stdin: |
        10
      expected: |
        Цена: 150 руб.
      hint: "От 6 до 17 лет билет стоит 150 руб."
    - id: "free-boundary"
      title: "Граница бесплатного билета (скрытый)"
      stdin: |
        5
      expected: |
        Цена: 0 руб.
      hidden: true
      hint: "Пять лет ещё входит в бесплатную группу (0-5), а шесть - уже нет; проверьте нестрогое сравнение age <= 5."
    - id: "adult-boundary"
      title: "Граница взрослого (скрытый)"
      stdin: |
        18
      expected: |
        Цена: 300 руб.
      hidden: true
      hint: "С 18 лет цена 300 руб.: условие age <= 17 завершает детскую группу."
    - id: "senior"
      title: "Пенсионер (скрытый)"
      stdin: |
        65
      expected: |
        Цена: 150 руб.
      hidden: true
      hint: "С 65 лет цена снова 150 руб.; 64 года - ещё 300 руб."
    - id: "negative"
      title: "Отрицательный возраст (скрытый)"
      stdin: |
        -3
      expected: |
        Некорректный возраст
      hidden: true
      hint: "Для возраста меньше нуля нужно напечатать «Некорректный возраст»; проверка должна стоять первой, иначе -3 попадёт в бесплатную группу."
    - id: "zero"
      title: "Нулевой возраст (скрытый)"
      stdin: |
        0
      expected: |
        Цена: 0 руб.
      hidden: true
      hint: "Возраст 0 допустим и относится к бесплатной группе."
