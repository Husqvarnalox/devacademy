id: "java.from-zero.first-class"
title: "Первый класс: поля, конструктор, методы"
goal: "Написать класс с полями, конструктором и методами и создавать его объекты через new."
difficulty: "easy"
estimatedMinutes: 50
prerequisites:
  - "java.from-zero.exceptions"
objectives:
  - "Описывать класс с полями, конструктором и методами и создавать объекты оператором new."
  - "Использовать this для различения поля и параметра с одинаковым именем."
  - "Вызывать методы объекта через точку и объяснять, почему статический main не может вызвать их без объекта."
  - "Объяснять, что переменная объектного типа хранит ссылку, а не сам объект."
masteryCriteria:
  - "Метод кошелька не списывает деньги, если сумма не положительная или превышает баланс."
  - "Метод описания возвращает строку из имени владельца и текущего баланса."
  - "Вы объясняете, почему в конструкторе запись name = name не заполняет поле."
concepts:
  introduces:
