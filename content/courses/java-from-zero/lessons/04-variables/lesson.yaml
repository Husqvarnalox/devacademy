id: "java.from-zero.variables"
title: "Переменные"
goal: "Объявлять переменные типов int и String, менять их значения и использовать в выводе."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "java.from-zero.output"
objectives:
  - "Объявить переменную с типом, именем и начальным значением."
  - "Изменить значение переменной присваиванием и объяснить, что `=` не означает равенство."
  - "Использовать переменные в выводе вместо повторяющихся значений."
  - "Выбирать понятные имена в стиле camelCase и читать сообщения о необъявленных и дважды объявленных переменных."
masteryCriteria:
  - "Программа печатает значения, хранящиеся в переменных, а не записанные в тексте дважды."
  - "Вы предсказываете значения после последовательности присваиваний, в том числе после копирования одной переменной в другую."
  - "Вы отличаете текст \"name\" в кавычках от переменной name."
concepts:
  introduces:
    - "java.variable"
    - "java.assignment"
    - "java.int"
    - "java.string"
  uses:
    - "java.println"
    - "java.print"
    - "java.concatenation"
    - "java.string-literal"
    - "java.comment"
    - "java.compile-error"
next:
  - "java.from-zero.basic-types"
tags:
  - "java"
  - "variables"
  - "assignment"
  - "int"
  - "string"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```java
        public class Main {
            public static void main(String[] args) {
                int a = 5;
                int b = a;
                a = 9;
                System.out.println(b);
            }
        }
        ```
      options:
        - "5"
        - "9"
        - "14"
        - "Ошибка компиляции"
      answer: 0
      explanation: "int b = a копирует значение a в момент присваивания (5). Последующее a = 9 меняет только a: переменные не связаны между собой."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```java
        public class Main {
            public static void main(String[] args) {
                String name = "Анна";
                System.out.println("name");
            }
        }
        ```
      options:
        - "name"
        - "Анна"
        - "\"name\""
        - "Ошибка компиляции"
      answer: 0
      explanation: "Текст в кавычках печатается как есть. Чтобы напечатать значение переменной, имя пишут без кавычек: System.out.println(name)."
    - id: "q3"
      type: "single"
      prompt: "Какая запись правильно объявляет целочисленную переменную count со значением 3?"
      options:
        - "int count = 3;"
        - "count int = 3;"
        - "int count == 3;"
        - "Int count = 3"
      answer: 0
      explanation: "Порядок такой: тип, имя, знак =, значение, точка с запятой. Знак == означает сравнение, а Int с заглавной буквы и запись без ; не подходят."
    - id: "q4"
      type: "single"
      prompt: |
        Компилятор сообщает: variable price is already defined in method main(String[]). Что в программе не так?

        ```java
        int price = 100;
        int price = 200;
        ```
      options:
        - "Переменная price объявлена дважды; второй раз нужно писать price = 200; без типа."
        - "Нельзя хранить число 200."
        - "Не хватает кавычек вокруг 200."
        - "Имя price запрещено."
      answer: 0
      explanation: "Объявление с типом создаёт новую переменную, и имя в одном методе занимать дважды нельзя. Чтобы изменить значение существующей переменной, пишут присваивание без типа: price = 200;"
exercise:
  id: "java.from-zero.variables.exercise"
  title: "Корзина покупателя"
  prompt: |
    Допишите программу так, чтобы она напечатала четыре строки:

    ```
    Покупатель: Анна
    Товаров в корзине: 3
    Добавили товары.
    Товаров в корзине: 7
    ```

    Переменные `name` и `items` уже объявлены. Число товаров в тексте не пишите: возьмите его из переменной `items`. Сначала напечатайте её значение, затем запишите в `items` число 7 и напечатайте снова.
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Склейте текст и переменную: \"Товаров в корзине: \" + items. Переменная пишется без кавычек."
    - "Присваивание нового значения: items = 7; Слово int во второй раз писать не нужно."
    - "Порядок команд: напечатать первое количество, items = 7;, напечатать \"Добавили товары.\", напечатать количество ещё раз."
  tests:
    - id: "basic"
      title: "Количество до и после изменения"
      stdin: ""
      expected: |
        Покупатель: Анна
        Товаров в корзине: 3
        Добавили товары.
        Товаров в корзине: 7
      hint: "Четыре строки по порядку: покупатель, количество 3, «Добавили товары.», количество 7."
    - id: "exact"
      title: "Точный текст (скрытый)"
      stdin: ""
      expected: |
        Покупатель: Анна
        Товаров в корзине: 3
        Добавили товары.
        Товаров в корзине: 7
      hidden: true
      hint: "Проверяется точное совпадение: двоеточия и пробелы, точка после «Добавили товары» и новое значение 7 во второй строке про количество."
