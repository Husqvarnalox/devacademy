id: "java.from-zero.arithmetic"
title: "Арифметика"
goal: "Выполнять вычисления с + - * / %, предсказывать результат целочисленного деления и порядок действий."
difficulty: "intro"
estimatedMinutes: 35
prerequisites:
  - "java.from-zero.basic-types"
objectives:
  - "Применять операторы + - * / % к int и double и объяснять приоритет действий."
  - "Объяснять, почему 7 / 2 равно 3, и получать остаток от деления оператором %."
  - "Использовать скобки и составное присваивание (+=, -=, *=, /=, ++, --)."
  - "Различать сложение чисел и склейку текста в выражениях со строкой."
masteryCriteria:
  - "Программа верно вычисляет часы и минуты из общего числа минут, не записывая их в тексте вручную."
  - "Вы предсказываете результат выражений вроде 17 / 5, 17 % 5, 2 + 3 * 4 и \"a\" + 1 + 2."
  - "Вы объясняете, почему 0.1 + 0.2 не равно 0.3."
concepts:
  introduces:
    - "java.arithmetic"
    - "java.integer-division"
    - "java.remainder"
    - "java.compound-assignment"
  uses:
    - "java.variable"
    - "java.assignment"
    - "java.int"
    - "java.double"
    - "java.println"
    - "java.concatenation"
    - "java.compile-error"
next:
  - "java.from-zero.strings"
tags:
  - "java"
  - "arithmetic"
  - "integer-division"
  - "remainder"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```java
        public class Main {
            public static void main(String[] args) {
                System.out.println(17 / 5 + " " + 17 % 5);
            }
        }
        ```
      options:
        - "3 2"
        - "3.4 2"
        - "3 3"
        - "4 2"
      answer: 0
      explanation: "Оба числа целые, поэтому / отбрасывает дробную часть: 17 / 5 = 3. Оператор % возвращает остаток: 17 - 3 * 5 = 2. Умножение, деление и остаток считаются раньше склейки текста."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает команда?

        ```java
        System.out.println("Итого: " + 2 + 3);
        ```
      options:
        - "Итого: 23"
        - "Итого: 5"
        - "Итого: 2 3"
        - "Ошибка компиляции"
      answer: 0
      explanation: "Выражение вычисляется слева направо: сначала текст склеивается с 2, затем результат - с 3. Чтобы сложить числа, их нужно взять в скобки: \"Итого: \" + (2 + 3)."
    - id: "q3"
      type: "single"
      prompt: |
        Программа печатает 0.0, хотя ожидалось 0.5. В чём причина?

        ```java
        double half = 1 / 2;
        System.out.println(half);
        ```
      options:
        - "1 / 2 считается как деление целых чисел и даёт 0; в double кладётся уже 0."
        - "Тип double не умеет хранить 0.5."
        - "Нужно писать 1 : 2."
        - "println округляет числа вниз."
      answer: 0
      explanation: "Результат деления определяется типами операндов, а не переменной слева. Достаточно, чтобы один из операндов был double: 1 / 2.0 даёт 0.5."
    - id: "q4"
      type: "single"
      prompt: "Что произойдёт при запуске программы с командой System.out.println(10 / 0); ?"
      options:
        - "Программа соберётся и завершится ошибкой времени выполнения ArithmeticException: / by zero."
        - "Компилятор не соберёт программу."
        - "Напечатается 0."
        - "Напечатается Infinity."
      answer: 0
      explanation: "Целочисленное деление на ноль компилятор не запрещает, но при выполнении оно приводит к исключению ArithmeticException. Для double (10.0 / 0) результат - Infinity."
    - id: "q5"
      type: "single"
      prompt: |
        Чему равно s в конце?

        ```java
        int s = 5;
        s += 3;
        s *= 2;
        ```
      options:
        - "16"
        - "11"
        - "13"
        - "10"
      answer: 0
      explanation: "s += 3 то же, что s = s + 3, то есть 8. Затем s *= 2 даёт 16."
exercise:
  id: "java.from-zero.arithmetic.exercise"
  title: "Минуты в часы и минуты"
  prompt: |
    В программе записано общее число минут: `totalMinutes = 135`. Вычислите, сколько в нём целых часов и сколько минут остаётся, и напечатайте:

    ```
    Всего минут: 135
    Часов: 2
    Остаток минут: 15
    ```

    Часы и остаток не пишите числами: получите их вычислением из `totalMinutes`. В часе 60 минут. Объявите переменные `hours` и `minutes` типа `int`.
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Целые часы - это деление нацело на 60, остаток минут - остаток от деления на 60."
    - "Для int оператор / отбрасывает дробную часть, а % возвращает остаток."
    - "int hours = totalMinutes / 60; int minutes = totalMinutes % 60;"
  tests:
    - id: "basic"
      title: "135 минут"
      stdin: ""
      expected: |
        Всего минут: 135
        Часов: 2
        Остаток минут: 15
      hint: "135 минут - это 2 часа и 15 минут: часы получаются делением нацело на 60, остаток - операцией %."
    - id: "exact"
      title: "Формат вывода (скрытый)"
      stdin: ""
      expected: |
        Всего минут: 135
        Часов: 2
        Остаток минут: 15
      hidden: true
      hint: "Проверяется точный текст трёх строк: «Всего минут: », «Часов: » и «Остаток минут: » и значения после них."
