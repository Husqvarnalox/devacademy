id: "java.from-zero.first-program"
title: "Первая программа"
goal: "Запустить программу на Java и изменить строку, которую она печатает."
difficulty: "intro"
estimatedMinutes: 25
prerequisites: []
objectives:
  - "Объяснить, что такое программа, исходный код и компилятор."
  - "Назвать, что делает каждая часть минимальной программы на Java, и какие слова пока нужно принять как обёртку."
  - "Вывести текст на экран командой System.out.println и записать строку в кавычках."
masteryCriteria:
  - "Ваша программа печатает ровно заданную строку, включая регистр и знаки препинания."
  - "Вы отличаете текст внутри кавычек (его печатают как есть) от имён команд (их вызывают)."
  - "Вы пишете свои команды внутри метода main и заканчиваете каждую точкой с запятой."
concepts:
  introduces:
    - "java.program"
    - "java.compiler"
    - "java.main-wrapper"
    - "java.println"
    - "java.string-literal"
next:
  - "java.from-zero.compiler-errors"
tags:
  - "java"
  - "program"
  - "println"
  - "compiler"
facts:
  - kind: "misconception"
    text: "«Чтобы программа заработала, нужно понимать каждое слово в её первых строках» - нет. Для первых программ достаточно знать, где в обёртке писать свои команды; смысл слов public, static и void раскрывается позже, когда для него появится материал."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что делает компилятор?"
      options:
        - "Переводит текст программы в форму, которую можно выполнить, и сообщает об ошибках в тексте."
        - "Исправляет ошибки в тексте программы."
        - "Печатает текст программы на экран."
        - "Выполняет программу строка за строкой, ничего не создавая."
      answer: 0
      explanation: "Компилятор читает исходный код и создаёт из него то, что можно выполнить. Ошибки он только сообщает: исправляет их человек."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```java
        public class Main {
            public static void main(String[] args) {
                System.out.println("раз");
                System.out.println("два");
            }
        }
        ```
      options:
        - "раздва"
        - "раз два (в одной строке)"
        - "раз и на следующей строке два"
        - "два и на следующей строке раз"
      answer: 2
      explanation: "Команды внутри main выполняются сверху вниз, а println после текста переводит строку. Поэтому «раз» и «два» оказываются на разных строках в этом порядке."
    - id: "q3"
      type: "single"
      prompt: "В команде System.out.println(\"Привет\") пропущена точка с запятой в конце. Что сообщит компилятор?"
      options:
        - "error: ';' expected"
        - "Программа напечатает Привет без точки с запятой."
        - "error: package system does not exist"
        - "Ничего: компилятор сам поставит точку с запятой."
      answer: 0
      explanation: "В Java каждая команда заканчивается точкой с запятой. Компилятор сам её не добавляет и останавливает сборку с сообщением ';' expected."
    - id: "q4"
      type: "single"
      prompt: "Как должен называться файл, в котором лежит класс Main из этого курса?"
      options:
        - "Main.java"
        - "main.txt"
        - "Program.java"
        - "Main.class"
      answer: 0
      explanation: "Публичный класс Main обязан лежать в файле Main.java: имя файла совпадает с именем класса. Файл Main.class создаёт компилятор, писать его вручную не нужно."
exercise:
  id: "java.from-zero.first-program.exercise"
  title: "Измените выводимую строку"
  prompt: |
    В редакторе уже есть рабочая программа: она печатает приветствие. Измените её так, чтобы она печатала ровно одну строку:

    ```
    Я учусь программировать на Java!
    ```

    Менять нужно только текст в кавычках. Регистр букв, пробелы и восклицательный знак важны.
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Найдите в программе строку с System.out.println: нужный текст находится между кавычками."
    - "Замените всё, что стоит между кавычками, на нужную фразу. Сами кавычки, скобки и точку с запятой в конце оставьте."
    - "Должно получиться System.out.println(\"Я учусь программировать на Java!\");"
  tests:
    - id: "basic"
      title: "Печатается нужная фраза"
      stdin: ""
      expected: |
        Я учусь программировать на Java!
      hint: "Программа должна напечатать одну строку: Я учусь программировать на Java!"
    - id: "exact"
      title: "Точный текст и одна строка (скрытый)"
      stdin: ""
      expected: |
        Я учусь программировать на Java!
      hidden: true
      hint: "Проверяется точное совпадение: заглавная Я, пробелы между словами, заглавная J в слове Java, восклицательный знак в конце и никаких лишних строк."
