id: "java.from-zero.mini-project"
title: "Мини-проект: ведомость оценок"
goal: "Написать программу, которая читает ведомость из строк имя;балл, считает и пропускает неверные строки и печатает отчёт."
difficulty: "easy"
estimatedMinutes: 60
prerequisites:
  - "java.from-zero.first-class"
objectives:
  - "Разбирать текстовую запись методами split, trim и Integer.parseInt и проверять каждое правило."
  - "Считать и пропускать неверные строки, не прерывая обработку остальных."
  - "Собирать статистику по списку объектов: среднее, лучший, число подходящих."
  - "Отдельно обрабатывать пустой набор данных и граничные значения."
masteryCriteria:
  - "Строки без второго поля, с пустым именем, с нечисловым баллом и с баллом вне диапазона 0..100 учитываются как пропущенные."
  - "Среднее выводится с двумя знаками и точкой, а при отсутствии записей выводится «нет данных»."
  - "При равных баллах лучшим считается студент, записанный раньше."
