quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что напечатает программа?

        ```java
        String[] lines = {"5", "x", "7"};
        int sum = 0;
        int bad = 0;
        for (String s : lines) {
            try {
                sum += Integer.parseInt(s);
            } catch (NumberFormatException e) {
                bad++;
            }
        }
        System.out.println(sum + " " + bad);
        ```
      options:
        - "12 1"
        - "5 2"
        - "12 0"
        - "Программа завершится с ошибкой"
      answer: 0
      explanation: "Строка \"x\" вызывает исключение, которое перехватывается: bad увеличивается на 1, sum не меняется. Складываются 5 и 7, получается 12."
    - id: "q2"
      type: "single"
      prompt: "Сумма баллов `sum = 7` (int), студентов `count = 2` (int). Какое выражение даёт 3.5?"
      options:
        - "(double) sum / count"
        - "sum / count"
        - "sum / (double) 2 * 0"
        - "(sum / count) * 1.0"
      answer: 0
      explanation: "Если сначала выполнить деление двух int, получится 3, и дробная часть потеряна. Преобразование одного из операндов в double до деления сохраняет 3.5."
    - id: "q3"
      type: "single"
      prompt: "Строка `\"Анна\"` разрезана по `;`. Почему нельзя сразу читать `parts[1]`?"
      options:
        - "В массиве один элемент, и обращение к индексу 1 выбросит ArrayIndexOutOfBoundsException"
        - "split вернёт null"
        - "parts[1] даст пустую строку"
        - "Это ошибка компиляции"
      answer: 0
      explanation: "Разделителя в строке нет, поэтому split вернул массив из одного элемента. Количество полей нужно проверить до обращения к ним."
    - id: "q4"
      type: "single"
      prompt: "Что произойдёт при `Integer.parseInt(\" 85\")`?"
      options:
        - "NumberFormatException: пробел не допускается"
        - "Вернётся 85"
        - "Вернётся 0"
        - "Вернётся -1"
      answer: 0
      explanation: "parseInt принимает только цифры (и знак). Пробелы нужно убрать вызовом trim() до преобразования."
exercise:
  id: "java.from-zero.mini-project.exercise"
  title: "Ведомость оценок"
  prompt: |
    Напишите программу, которая читает **ведомость** и печатает отчёт.

    **Ввод.** Строки до конца ввода. Корректная запись - строка вида `имя;балл`:

    * ровно два поля, разделённых символом `;`;
    * имя непустое после удаления пробелов по краям (внутри имени пробелы допускаются);
    * балл - целое число от 0 до 100 включительно; пробелы вокруг него допустимы.

    Строки, состоящие только из пробелов (и пустые), игнорируются. Любая другая строка, не удовлетворяющая правилам, - плохая: её нужно посчитать и пропустить.

    **Вывод.** Пять строк:

    ```
    Студентов: <число корректных записей>
    Средний балл: <среднее с двумя знаками после точки>
    Лучший: <имя> (<балл>)
    Отличников (90 и выше): <число записей с баллом не ниже 90>
    Пропущено строк: <число плохих строк>
    ```

    Если корректных записей нет, вторая и третья строки имеют вид `Средний балл: нет данных` и `Лучший: нет данных`, а число отличников равно 0. Если лучший балл у нескольких студентов, выводится тот, чья запись встретилась раньше. Для вывода среднего используйте `Locale.ROOT`.

    **Пример.** Ввод:

    ```
    Анна Петрова; 95
    Олег;70

    Игорь;abc
    Мария;88
    плохая строка
    Пётр;101
    ```

    Вывод:

    ```
    Студентов: 3
    Средний балл: 84.33
    Лучший: Анна Петрова (95)
    Отличников (90 и выше): 1
    Пропущено строк: 3
    ```
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Разбейте задачу на шаги: цикл while (in.hasNextLine()) читает строки; отдельный метод разбирает одну строку; main считает и выводит."
    - "Метод разбора: разрежьте строку по \";\" и сначала проверьте parts.length == 2, потом имя через trim().isEmpty(), потом Integer.parseInt(parts[1].trim()) в try/catch, потом диапазон 0..100. При нарушении любого правила бросайте IllegalArgumentException."
    - "В main оберните вызов разбора в try/catch (IllegalArgumentException e) и в catch увеличивайте счётчик плохих строк. Пустые строки (line.trim().isEmpty()) пропускайте через continue до разбора."
    - "Для среднего преобразуйте сумму в double до деления: (double) sum / count, и печатайте через System.out.printf(Locale.ROOT, \"Средний балл: %.2f%n\", average). Перед средним и лучшим проверьте, что список не пуст. Для лучшего сравнивайте строго: score > best.score."
  tests:
    - id: "example"
      title: "Пример из условия"
      stdin: |
        Анна Петрова; 95
        Олег;70

        Игорь;abc
        Мария;88
        плохая строка
        Пётр;101
      expected: |
        Студентов: 3
        Средний балл: 84.33
        Лучший: Анна Петрова (95)
        Отличников (90 и выше): 1
        Пропущено строк: 3
      hint: "Три корректные записи, три плохие строки (нечисловой балл, нет разделителя, балл 101); пустая строка не считается."
    - id: "clean"
      title: "Все строки корректны"
      stdin: |
        Ира;100
        Саша;90
        Дима;80
      expected: |
        Студентов: 3
        Средний балл: 90.00
        Лучший: Ира (100)
        Отличников (90 и выше): 2
        Пропущено строк: 0
      hint: "Нет плохих строк; среднее 90.00; два отличника (100 и 90)."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: |
        Студентов: 0
        Средний балл: нет данных
        Лучший: нет данных
        Отличников (90 и выше): 0
        Пропущено строк: 0
      hidden: true
      hint: "Без записей среднее и лучший печатаются как «нет данных», число отличников 0, пропущенных 0."
    - id: "all-bad"
      title: "Все строки плохие (скрытый)"
      stdin: |
        а;б
        ;5
        в;1;2
        г
        д;-1
      expected: |
        Студентов: 0
        Средний балл: нет данных
        Лучший: нет данных
        Отличников (90 и выше): 0
        Пропущено строк: 5
      hidden: true
      hint: "Все пять строк плохие: нечисловой балл, пустое имя, три поля, одно поле, отрицательный балл; студентов 0, пропущено 5."
    - id: "ties-bounds"
      title: "Равные баллы и границы (скрытый)"
      stdin: |
        Первый;90
        Второй;90
        Третий;0
        Четвёртый;100
        Пятый;100
        Шестой;89
      expected: |
        Студентов: 6
        Средний балл: 78.17
        Лучший: Четвёртый (100)
        Отличников (90 и выше): 4
        Пропущено строк: 0
      hidden: true
      hint: "Границы 0 и 100 допустимы. Лучший балл 100 у двоих: выводится тот, кто встретился раньше. Отличников четверо (90, 90, 100, 100); 89 в них не входит."
    - id: "spaces"
      title: "Пробелы и дробное число (скрытый)"
      stdin: |
        Ира;50
           
          Анна Мария Ли  ;   77   
        Борис;4.5
        	
        В;  91
      expected: |
        Студентов: 3
        Средний балл: 72.67
        Лучший: В (91)
        Отличников (90 и выше): 1
        Пропущено строк: 1
      hidden: true
      hint: "Имя с пробелами внутри сохраняется, пробелы по краям убираются; строки из одних пробелов и табуляции игнорируются; 4.5 не целое число, это плохая строка."
    - id: "rounding"
      title: "Округление среднего (скрытый)"
      stdin: |
        А;1
        Б;2
        В;2
      expected: |
        Студентов: 3
        Средний балл: 1.67
        Лучший: Б (2)
        Отличников (90 и выше): 0
        Пропущено строк: 0
      hidden: true
      hint: "Среднее 5 / 3 = 1.666..., выводится с двумя знаками: 1.67."
