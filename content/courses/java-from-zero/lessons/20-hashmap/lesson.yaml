id: "java.from-zero.hashmap"
title: "HashMap: пары «ключ - значение»"
goal: "Хранить и искать значения по ключу в HashMap и считать повторения приёмом getOrDefault + put."
difficulty: "easy"
estimatedMinutes: 45
prerequisites:
  - "java.from-zero.arraylist"
objectives:
  - "Создавать HashMap с типами ключа и значения и записывать пары методом put."
  - "Читать значения методами get и getOrDefault и проверять наличие ключа через containsKey."
  - "Накапливать значения по ключу: map.put(k, map.getOrDefault(k, 0) + 1)."
  - "Обходить значения и ключи, не рассчитывая на порядок пар."
masteryCriteria:
  - "Метод поставки складывает количества для повторяющегося товара, а для отсутствующего товара запрос даёт 0."
  - "Вы объясняете, почему get для отсутствующего ключа не годится для присваивания в int."
  - "Вы не строите вывод программы на порядке обхода HashMap."
concepts:
  introduces:
    - "java.hashmap"
    - "java.key-value"
  uses:
    - "java.arraylist"
    - "java.type-argument"
    - "java.method"
    - "java.parameter"
    - "java.return"
    - "java.static"
    - "java.for"
    - "java.while"
    - "java.if"
    - "java.int"
    - "java.string"
    - "java.import"
    - "java.new"
    - "java.scanner"
    - "java.println"
    - "java.compile-error"
    - "java.for-each"
next:
