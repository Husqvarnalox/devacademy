tags:
  - "java"
  - "hashmap"
  - "map"
  - "dictionary"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что напечатает программа?

        ```java
        HashMap<String, Integer> m = new HashMap<>();
        m.put("a", 1);
        m.put("b", 2);
        m.put("a", 3);
        System.out.println(m.get("a") + " " + m.size());
        ```
      options:
        - "3 2"
        - "1 3"
        - "3 3"
        - "1 2"
      answer: 0
      explanation: "Повторный put с ключом \"a\" заменяет значение (3) и не создаёт новую пару, поэтому в словаре две пары."
    - id: "q2"
      type: "single"
      prompt: |-
        Что напечатает программа?

        ```java
        HashMap<String, Integer> m = new HashMap<>();
        m.put("x", 5);
        System.out.println(m.getOrDefault("y", 0) + m.getOrDefault("x", 0));
        ```
      options:
        - "5"
        - "0"
        - "50"
        - "Ошибка во время работы"
      answer: 0
      explanation: "Ключа \"y\" нет, поэтому getOrDefault даёт 0; для \"x\" возвращается 5. Оба значения числа и складываются: 0 + 5 = 5."
    - id: "q3"
      type: "single"
      prompt: |-
        Что произойдёт?

        ```java
        HashMap<String, Integer> m = new HashMap<>();
        int n = m.get("ключ");
        ```
      options:
        - "NullPointerException"
        - "В n окажется 0"
        - "Ошибка компиляции"
        - "В n окажется -1"
      answer: 0
      explanation: "get возвращает null для отсутствующего ключа, а int не может хранить null. Безопасно: getOrDefault(\"ключ\", 0)."
    - id: "q4"
      type: "single"
      prompt: "Какой тип подходит для подсчёта числа повторений каждого слова?"
      options:
        - "HashMap<String, Integer>"
        - "HashMap<Integer, String>"
        - "ArrayList<String>"
        - "HashMap<String, int>"
      answer: 0
      explanation: "Ключ - слово (String), значение - счётчик (Integer). int в угловых скобках писать нельзя."
    - id: "q5"
      type: "single"
      prompt: "Программа печатает пары словаря циклом по keySet() и ожидает порядок добавления. Почему так делать нельзя?"
      options:
        - "Порядок обхода HashMap не определён"
        - "keySet() не возвращает ключи"
        - "Цикл for-each не работает со словарём"
        - "Ключи нужно сначала удалить"
      answer: 0
      explanation: "HashMap не гарантирует порядок обхода, он зависит от хеш-кодов и размера таблицы. Нужный порядок задают отдельным списком ключей или другим видом словаря."
exercise:
  id: "java.from-zero.hashmap.exercise"
  title: "Склад: поставки и запросы"
  prompt: |
    На склад приходят поставки товаров, затем выполняются запросы остатков. `main` уже написан и читает данные в такой последовательности:

    1. целое число `n` - количество поставок;
    2. `n` поставок: название товара (одно слово) и количество (целое число). Один товар может быть в нескольких поставках, количества складываются;
    3. целое число `q` - количество запросов;
    4. `q` названий товаров.

    Для каждого запроса `main` печатает `<товар>: <остаток>`, а в конце - две итоговые строки:

    ```
    Всего единиц: <сумма остатков по всем товарам>
    Видов товара: <сколько разных товаров>
    ```

    Методы, которые нужно написать:

    * `addStock(HashMap<String, Integer> stock, String item, int qty)` добавляет `qty` к остатку товара `item` (если товара не было, остаток становится равным `qty`);
    * `quantity(HashMap<String, Integer> stock, String item)` возвращает остаток товара или 0, если такого товара нет;
    * `totalUnits(HashMap<String, Integer> stock)` возвращает сумму остатков по всем товарам.

    **Пример.** Ввод:

    ```
    3
    яблоки 10
    груши 4
    яблоки 5
    2
    яблоки
    сливы
    ```

    Вывод:

    ```
    яблоки: 15
    сливы: 0
    Всего единиц: 19
    Видов товара: 2
    ```
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Все три метода получают словарь. Остаток товара хранится как значение, название товара - ключ."
    - "addStock: прибавьте qty к прежнему остатку: stock.put(item, stock.getOrDefault(item, 0) + qty). quantity: верните stock.getOrDefault(item, 0)."
    - "totalUnits: заведите накопитель sum и пройдите по stock.values() циклом for-each, прибавляя каждое значение."
  tests:
    - id: "example"
      title: "Пример из условия"
      stdin: |
        3
        яблоки 10
        груши 4
        яблоки 5
        2
        яблоки
        сливы
      expected: |
        яблоки: 15
        сливы: 0
        Всего единиц: 19
        Видов товара: 2
      hint: "Яблоки суммируются из двух поставок (15), слив нет (0); всего 19 единиц, два вида товара."
    - id: "repeat"
      title: "Повторные запросы"
      stdin: |
        2
        чай 3
        кофе 2
        3
        чай
        чай
        кофе
      expected: |
        чай: 3
        чай: 3
        кофе: 2
        Всего единиц: 5
        Видов товара: 2
      hint: "Один и тот же товар можно запросить несколько раз; запрос не меняет остаток."
    - id: "no-supply"
      title: "Нет поставок (скрытый)"
      stdin: |
        0
        2
        молоко
        хлеб
      expected: |
        молоко: 0
        хлеб: 0
        Всего единиц: 0
        Видов товара: 0
      hidden: true
      hint: "Без поставок все запросы дают 0, всего единиц 0 и видов товара 0."
    - id: "many-same"
      title: "Один товар в нескольких поставках (скрытый)"
      stdin: |
        4
        соль 1
        соль 2
        соль 3
        соль 4
        1
        соль
      expected: |
        соль: 10
        Всего единиц: 10
        Видов товара: 1
      hidden: true
      hint: "Четыре поставки одного товара дают остаток 10 и один вид товара: put не должен затирать прежнее значение."
    - id: "zero-qty"
      title: "Поставка с нулём (скрытый)"
      stdin: |
        2
        мёд 0
        мёд 7
        2
        мёд
        вафли
      expected: |
        мёд: 7
        вафли: 0
        Всего единиц: 7
        Видов товара: 1
      hidden: true
      hint: "Нулевая поставка допустима: остаток мёда 7, вид товара один."
    - id: "no-queries"
      title: "Нет запросов (скрытый)"
      stdin: |
        2
        а 5
        б 6
        0
      expected: |
        Всего единиц: 11
        Видов товара: 2
      hidden: true
      hint: "Без запросов печатаются только две итоговые строки: 11 единиц и 2 вида."
