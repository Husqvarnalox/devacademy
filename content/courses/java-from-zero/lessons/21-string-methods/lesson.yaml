id: "java.from-zero.string-methods"
title: "Методы строк: equals, trim, split, substring"
goal: "Очищать, сравнивать и разбирать строки методами equals, trim, split, substring, indexOf, contains и replace."
difficulty: "easy"
estimatedMinutes: 45
prerequisites:
  - "java.from-zero.hashmap"
objectives:
  - "Сравнивать строки методом equals и объяснять, почему == для текста не подходит."
  - "Помнить, что методы строк возвращают новую строку, и сохранять результат."
  - "Разрезать строку по разделителю методом split и обращаться к частям массива."
  - "Вырезать часть строки методами indexOf и substring, учитывая, что конец не включается."
masteryCriteria:
  - "Метод поля записи возвращает часть строки без пробелов по краям."
  - "Метод домена возвращает пустую строку, если в адресе нет символа @."
  - "Сравнение имён не зависит от регистра и крайних пробелов."
