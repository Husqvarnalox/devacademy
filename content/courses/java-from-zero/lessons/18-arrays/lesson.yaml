id: "java.from-zero.arrays"
title: "Массивы"
goal: "Хранить несколько значений в массиве, обходить его циклами и писать методы, принимающие массив."
difficulty: "easy"
estimatedMinutes: 45
prerequisites:
  - "java.from-zero.methods"
objectives:
  - "Создавать массив списком значений и через new, обращаться к элементам по индексу с нуля."
  - "Использовать length и обходить массив циклом for по индексу и циклом for-each."
  - "Писать методы, принимающие массив: максимум, среднее, подсчёт по условию."
  - "Предсказывать ArrayIndexOutOfBoundsException и понимать, что присваивание массива не копирует его."
masteryCriteria:
  - "Методы упражнения дают верный результат для массива из одного элемента и для массива, состоящего из отрицательных чисел."
  - "Вы начинаете поиск максимума с первого элемента, а не с нуля."
  - "Вы объясняете, чем a.length отличается от s.length() и почему a[a.length] даёт ошибку."
concepts:
  introduces:
    - "java.array"
    - "java.array-length"
    - "java.for-each"
  uses:
    - "java.method"
    - "java.parameter"
    - "java.return"
    - "java.static"
    - "java.for"
    - "java.while"
    - "java.if"
    - "java.int"
    - "java.double"
    - "java.cast"
    - "java.printf"
    - "java.locale"
    - "java.scanner"
    - "java.compile-error"
    - "java.index"
    - "java.string-length"
    - "java.compound-assignment"
next:
  - "java.from-zero.arraylist"
tags:
  - "java"
  - "array"
  - "index"
  - "for-each"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что напечатает программа?

        ```java
        int[] a = {4, 8, 15};
        System.out.println(a[1] + a.length);
        ```
      options:
        - "11"
        - "83"
        - "8"
        - "Ошибка компиляции"
      answer: 0
      explanation: "a[1] равно 8, a.length равно 3. Оба значения числа, поэтому они складываются: 8 + 3 = 11. Склейки нет, потому что текста в выражении нет."
    - id: "q2"
      type: "single"
      prompt: |-
        Какую ошибку вызовет код?

        ```java
        int[] a = {10, 20, 30};
        System.out.println(a[3]);
        ```
      options:
        - "ArrayIndexOutOfBoundsException: Index 3 out of bounds for length 3"
        - "Ошибка компиляции: cannot find symbol"
        - "Напечатает 0"
        - "Напечатает 30"
      answer: 0
      explanation: "У массива из трёх элементов допустимы индексы 0, 1, 2. Индекс 3 выходит за границу, и во время работы программа падает с исключением."
    - id: "q3"
      type: "single"
      prompt: |-
        Что напечатает программа?

        ```java
        int[] a = {1, 2, 3};
        int[] b = a;
        b[0] = 99;
        System.out.println(a[0]);
        ```
      options:
        - "99"
        - "1"
        - "0"
        - "Ошибка компиляции"
      answer: 0
      explanation: "b - не копия, а вторая ссылка на тот же массив. Изменение через b видно через a."
    - id: "q4"
      type: "single"
      prompt: "Компилятор сообщает: cannot find symbol, symbol: method length(), location: variable a of type int[]. Что нужно исправить?"
      options:
        - "Заменить a.length() на a.length"
        - "Добавить import java.util.Arrays"
        - "Заменить int[] на int"
        - "Добавить static"
      answer: 0
      explanation: "У массива length - поле, скобки не нужны. Скобки нужны только у строки: word.length()."
    - id: "q5"
      type: "single"
      prompt: "Для массива {-5, -1, -9} программа ищет максимум так: int max = 0; for (int x : a) { if (x > max) max = x; }. Что она напечатает?"
      options:
        - "0"
        - "-1"
        - "-5"
        - "-9"
      answer: 0
      explanation: "Начальное значение 0 больше всех элементов, поэтому условие x > max ни разу не выполняется. Правильный максимум -1 получится, если начать с max = a[0]."
exercise:
  id: "java.from-zero.arrays.exercise"
  title: "Температуры за неделю"
  prompt: |
    Метеостанция записывает дневные температуры. На вход подаётся число дней `n` (`n` не меньше 1), затем `n` целых температур и затем целый порог `limit`. Методы, которые считают значения, нужно написать; `main` уже написан: он читает данные в массив и печатает три строки:

    ```
    Максимум: <наибольшая температура>
    Среднее: <среднее арифметическое с двумя знаками после запятой>
    Выше <limit>: <сколько дней теплее порога>
    ```

    Методы:

    * `maxValue(int[] a)` возвращает наибольший элемент;
    * `average(int[] a)` возвращает среднее арифметическое как `double` (сумма делится на число элементов без потери дробной части);
    * `countAbove(int[] a, int limit)` возвращает, сколько элементов строго больше `limit`.

    **Пример.** Ввод:

    ```
    5
    18 21 19 25 22
    20
    ```

    Вывод:

    ```
    Максимум: 25
    Среднее: 21.00
    Выше 20: 3
    ```
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Во всех трёх методах нужно пройти по массиву: подойдёт for-each или цикл по индексу."
    - "maxValue: начните с максимума a[0] (а не с нуля: температуры бывают отрицательными) и заменяйте его большим элементом. average: накопите сумму и вычислите (double) sum / a.length."
    - "countAbove: заведите счётчик, увеличивайте его для каждого элемента строго больше limit. Приведение к double нужно до деления: (double) sum / a.length."
  tests:
    - id: "week"
      title: "Неделя"
      stdin: |
        5
        18 21 19 25 22
        20
      expected: |
        Максимум: 25
        Среднее: 21.00
        Выше 20: 3
      hint: "Максимум 25, среднее (18+21+19+25+22)/5 = 21.00, выше 20 градусов три дня."
    - id: "fraction"
      title: "Дробное среднее"
      stdin: |
        3
        10 11 11
        10
      expected: |
        Максимум: 11
        Среднее: 10.67
        Выше 10: 2
      hint: "Среднее 32/3 = 10.67: деление должно быть дробным, а не целым; строго выше 10 - два дня."
    - id: "single"
      title: "Один день (скрытый)"
      stdin: |
        1
        -4
        0
      expected: |
        Максимум: -4
        Среднее: -4.00
        Выше 0: 0
      hidden: true
      hint: "Массив из одного элемента: максимум и среднее равны этому элементу, строго выше порога 0 нет ни одного дня."
    - id: "negative"
      title: "Все температуры отрицательные (скрытый)"
      stdin: |
        4
        -7 -2 -15 -9
        -10
      expected: |
        Максимум: -2
        Среднее: -8.25
        Выше -10: 3
      hidden: true
      hint: "Максимум -2: поиск должен начинаться с первого элемента, а не с нуля. Строго выше -10 три дня."
    - id: "equal-limit"
      title: "Температуры равны порогу (скрытый)"
      stdin: |
        3
        5 5 5
        5
      expected: |
        Максимум: 5
        Среднее: 5.00
        Выше 5: 0
      hidden: true
      hint: "Сравнение строгое: температура, равная порогу, не считается теплее порога."
    - id: "rounding"
      title: "Округление среднего (скрытый)"
      stdin: |
        3
        1 1 2
        1
      expected: |
        Максимум: 2
        Среднее: 1.33
        Выше 1: 1
      hidden: true
      hint: "Среднее 4/3 печатается как 1.33 (два знака после запятой); выше 1 один день."
