id: "java.from-zero.formatted-output"
title: "Форматированный вывод"
goal: "Печатать числа с заданным числом знаков после запятой через printf и Locale.ROOT и отличать форматирование от округления."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "java.from-zero.type-conversion"
objectives:
  - "Составить строку формата со спецификаторами %s, %d, %.2f, %n и %%."
  - "Напечатать дробное число с двумя знаками после запятой через printf."
  - "Объяснить, зачем в printf передают Locale.ROOT, и правильно его подключить."
  - "Отличать форматирование вывода от округления значения (Math.round)."
masteryCriteria:
  - "Чек выводится с двумя знаками после запятой, и результат не зависит от региональных настроек компьютера."
  - "Вы подбираете спецификатор по типу значения и узнаёте по сообщению, что тип не подошёл."
  - "Вы объясняете, почему printf не меняет значение, а только его запись."
concepts:
  introduces:
    - "java.printf"
    - "java.format-specifier"
    - "java.locale"
    - "java.math-round"
  uses:
    - "java.string"
    - "java.int"
    - "java.double"
    - "java.import"
    - "java.scanner"
    - "java.parse-double"
    - "java.cast"
    - "java.escape-sequence"
    - "java.println"
    - "java.arithmetic"
next:
  - "java.from-zero.comparison-and-logic"
tags:
  - "java"
  - "printf"
  - "format"
  - "locale"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```java
        System.out.printf(Locale.ROOT, "%.2f%n", 3.14159);
        ```
      options:
        - "3.14"
        - "3.1"
        - "3.14159"
        - "3,14"
      answer: 0
      explanation: "Спецификатор %.2f выводит число с двумя знаками после запятой; последняя оставленная цифра округляется. Locale.ROOT задаёт точку как разделитель, а %n завершает строку."
    - id: "q2"
      type: "single"
      prompt: |
        Что произойдёт при выполнении?

        ```java
        System.out.printf("%d%n", 2.5);
        ```
      options:
        - "IllegalFormatConversionException: d != java.lang.Double"
        - "Напечатается 2"
        - "Напечатается 2.5"
        - "Ошибка компиляции"
      answer: 0
      explanation: "Спецификатор %d предназначен для целых, а 2.5 - дробное. Компилятор строку формата не проверяет, поэтому ошибка возникает только при выполнении."
    - id: "q3"
      type: "single"
      prompt: "Почему в printf для дробных чисел передают Locale.ROOT?"
      options:
        - "Без него разделителем может оказаться запятая, если так настроен компьютер, и вывод изменится."
        - "Без него printf не умеет печатать double."
        - "Без него не работает %n."
        - "Это нужно только для чисел больше миллиона."
      answer: 0
      explanation: "По умолчанию printf использует региональные настройки компьютера. На компьютере с русскими настройками %.2f выведет 2,50 вместо 2.50. Locale.ROOT делает вывод одинаковым везде."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```java
        System.out.printf(Locale.ROOT, "Скидка %d%%%n", 15);
        ```
      options:
        - "Скидка 15%"
        - "Скидка 15%%"
        - "Скидка 15"
        - "Ошибка при выполнении"
      answer: 0
      explanation: "Знак процента в формате начинает спецификатор, поэтому сам символ записывают как %%. Затем %n завершает строку."
    - id: "q5"
      type: "single"
      prompt: |
        Чему равна переменная r?

        ```java
        double x = 3.14159;
        double r = Math.round(x * 100) / 100.0;
        ```
      options:
        - "3.14"
        - "3"
        - "314"
        - "3.1"
      answer: 0
      explanation: "x * 100 равно 314.159; Math.round даёт ближайшее целое 314; деление на 100.0 возвращает дробное 3.14. В отличие от printf, значение действительно изменилось."
exercise:
  id: "java.from-zero.formatted-output.exercise"
  title: "Чек со скидкой"
  prompt: |
    На вход подаются: название товара (слово), цена за штуку (число с точкой или целое) и количество (целое число). В заготовке они уже прочитаны в переменные `title`, `price` и `count`.

    Посчитайте сумму и сумму со скидкой 10 % и напечатайте пять строк с помощью `printf`. Дробные числа выводите с двумя знаками после запятой:

    ```
    Товар: <название>
    Цена: <цена> руб.
    Количество: <количество>
    Сумма: <цена * количество> руб.
    Со скидкой 10%: <сумма * 0.9> руб.
    ```

    **Пример.** Ввод:

    ```
    Тетрадь 59.9 3
    ```

    Вывод:

    ```
    Товар: Тетрадь
    Цена: 59.90 руб.
    Количество: 3
    Сумма: 179.70 руб.
    Со скидкой 10%: 161.73 руб.
    ```

    Используйте `Locale.ROOT`, чтобы разделителем всегда была точка.
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Сумма - price * count, сумма со скидкой - total * 0.9. Для обеих лучше завести переменные типа double."
    - "Используйте System.out.printf(Locale.ROOT, \"...\", значения). Для названия подходит %s, для количества %d, для денег %.2f. Строку завершайте %n."
    - "Чтобы напечатать знак процента, в формате пишут %%: \"Со скидкой 10%%: ...\"."
    - "Первым аргументом printf идёт Locale.ROOT, затем строка формата, затем значения в том порядке, в каком идут спецификаторы."
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "Тетрадь 59.9 3\n"
      expected: |
        Товар: Тетрадь
        Цена: 59.90 руб.
        Количество: 3
        Сумма: 179.70 руб.
        Со скидкой 10%: 161.73 руб.
      hint: "59.9 * 3 = 179.7, а выводится 179.70; скидка 179.7 * 0.9 = 161.73. Каждое число с плавающей точкой - через %.2f."
    - id: "integer-price"
      title: "Целая цена"
      stdin: "Ручка 15 10\n"
      expected: |
        Товар: Ручка
        Цена: 15.00 руб.
        Количество: 10
        Сумма: 150.00 руб.
        Со скидкой 10%: 135.00 руб.
      hint: "Цена 15 читается как double и выводится как 15.00: %.2f показывает два знака даже у целого значения."
    - id: "half"
      title: "Цена с половиной (скрытый)"
      stdin: "Папка 120.5 2\n"
      expected: |
        Товар: Папка
        Цена: 120.50 руб.
        Количество: 2
        Сумма: 241.00 руб.
        Со скидкой 10%: 216.90 руб.
      hidden: true
      hint: "Нули в конце обязательны: 120.50, 241.00, 216.90. Проверьте, что везде стоит %.2f."
    - id: "rounding"
      title: "Скидка с округлением (скрытый)"
      stdin: "Клей 0.99 7\n"
      expected: |
        Товар: Клей
        Цена: 0.99 руб.
        Количество: 7
        Сумма: 6.93 руб.
        Со скидкой 10%: 6.24 руб.
      hidden: true
      hint: "6.93 * 0.9 = 6.237; %.2f округляет до 6.24. Значение не нужно округлять вручную."
