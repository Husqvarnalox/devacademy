id: "java.from-zero.while-loop"
title: "Цикл while: повторение, пока условие верно"
goal: "Повторять действия циклом while со счётчиком, накопителем и чтением чисел до конца ввода."
difficulty: "easy"
estimatedMinutes: 45
prerequisites:
  - "java.from-zero.switch"
objectives:
  - "Записывать цикл while с начальным значением счётчика, условием и изменением в теле."
  - "Накапливать сумму, количество и максимум в переменных, объявленных до цикла."
  - "Читать все числа из ввода циклом while (in.hasNextInt()) при любой длине ввода."
  - "Находить бесконечный цикл и ошибку на единицу в границе условия."
masteryCriteria:
  - "Программа верно обрабатывает ввод из нескольких цен, из одной цены и пустой ввод."
  - "Вы объясняете, почему счётчик и накопитель объявляют до цикла."
  - "Вы определяете число итераций цикла при заданных границах (< и <=)."
concepts:
  introduces:
    - "java.while"
    - "java.loop-condition"
  uses:
    - "java.int"
    - "java.if"
    - "java.comparison"
    - "java.scanner"
    - "java.compound-assignment"
    - "java.boolean-expression"
    - "java.block"
    - "java.println"
    - "java.concatenation"
    - "java.arithmetic"
    - "java.compile-error"
    - "java.variable"
next:
  - "java.from-zero.for-loop"
tags:
  - "java"
  - "while"
  - "loop"
  - "hasNextInt"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Сколько раз выполнится тело цикла?

        ```java
        int i = 1;
        while (i < 5) {
            System.out.println(i);
            i++;
        }
        ```
      options:
        - "4"
        - "5"
        - "6"
        - "Бесконечно"
      answer: 0
      explanation: "Тело выполняется при i = 1, 2, 3, 4. При i = 5 условие i < 5 ложно, и цикл заканчивается. С условием i <= 5 было бы пять итераций."
    - id: "q2"
      type: "single"
      prompt: |-
        Что напечатает программа?

        ```java
        int n = 10;
        while (n < 5) {
            n++;
        }
        System.out.println(n);
        ```
      options:
        - "10"
        - "5"
        - "6"
        - "Ничего не напечатает"
      answer: 0
      explanation: "Условие n < 5 ложно сразу, тело не выполняется ни разу, и n остаётся равным 10. Условие цикла while проверяется до тела."
    - id: "q3"
      type: "single"
      prompt: |-
        Что напечатает программа?

        ```java
        int sum = 0;
        int i = 1;
        while (i <= 4) {
            sum += i;
            i++;
        }
        System.out.println(sum);
        ```
      options:
        - "10"
        - "4"
        - "6"
        - "24"
      answer: 0
      explanation: "Накопитель складывает 1, 2, 3 и 4: получается 10. Произведение 24 вычислялось бы операцией *=, а не +=."
    - id: "q4"
      type: "single"
      prompt: "Программа читает числа циклом while (in.hasNextInt()) { int a = in.nextInt(); int b = in.nextInt(); ... }. Во вводе три числа. Что произойдёт?"
      options:
        - "NoSuchElementException при втором чтении в последней итерации"
        - "Программа напечатает результат для трёх чисел"
        - "Ошибка компиляции"
        - "Цикл завершится без ошибок"
      answer: 0
      explanation: "После первой итерации остаётся одно число. Проверка hasNextInt() верна, но тело читает два числа, и второе чтение падает. Одна проверка должна соответствовать одному чтению."
    - id: "q5"
      type: "single"
      prompt: |-
        Почему этот цикл бесконечный?

        ```java
        int i = 0;
        while (i < 3);
        {
            i++;
        }
        ```
      options:
        - "Точка с запятой после условия делает тело пустым"
        - "i++ нельзя использовать в цикле"
        - "Условие i < 3 записано неверно"
        - "После while обязательно нужно else"
      answer: 0
      explanation: "Символ ; после скобок - пустая команда, которая и есть тело цикла. Блок с i++ стоит уже вне цикла, и условие навсегда остаётся истинным."
exercise:
  id: "java.from-zero.while-loop.exercise"
  title: "Кассовый чек"
  prompt: |
    На вход подаётся последовательность цен товаров - целых положительных чисел, разделённых пробелами и переводами строк. Сколько цен подано, заранее не известно (возможно, ни одной). Напечатайте три строки:

    ```
    Товаров: <количество цен>
    Сумма: <сумма цен>
    Самый дорогой: <наибольшая цена>
    ```

    Если цен нет, во всех трёх строках печатается 0.

    **Пример.** Ввод:

    ```
    120 80
    300
    ```

    Вывод:

    ```
    Товаров: 3
    Сумма: 500
    Самый дорогой: 300
    ```
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Читать нужно, пока во вводе есть числа: while (in.hasNextInt()). Количество, сумма и максимум - три переменные, объявленные до цикла."
    - "Заведите int count = 0, sum = 0, max = 0 до цикла. В теле прочитайте число, увеличьте count, прибавьте число к sum."
    - "Максимум обновляйте условием: если прочитанная цена больше max, запишите её в max. Цены положительные, поэтому начальный максимум 0 подходит."
  tests:
    - id: "three"
      title: "Три цены"
      stdin: |
        120 80
        300
      expected: |
        Товаров: 3
        Сумма: 500
        Самый дорогой: 300
      hint: "Цены читаются в любом разбиении по строкам: три числа, сумма 500, максимум 300."
    - id: "many"
      title: "Цены в столбик"
      stdin: |
        50
        40
        30
        20
        10
      expected: |
        Товаров: 5
        Сумма: 150
        Самый дорогой: 50
      hint: "Пять цен по одной в строке: сумма 150, максимум 50 (первая цена)."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: |
        Товаров: 0
        Сумма: 0
        Самый дорогой: 0
      hidden: true
      hint: "Если цен нет, цикл не выполняется, и во всех трёх строках печатается 0."
    - id: "one"
      title: "Одна цена (скрытый)"
      stdin: |
        999
      expected: |
        Товаров: 1
        Сумма: 999
        Самый дорогой: 999
      hidden: true
      hint: "Одна цена: количество 1, сумма и максимум равны этой цене."
    - id: "max-last"
      title: "Максимум в конце (скрытый)"
      stdin: |
        5 7 100
      expected: |
        Товаров: 3
        Сумма: 112
        Самый дорогой: 100
      hidden: true
      hint: "Наибольшая цена стоит последней: максимум нужно обновлять на каждой итерации, а не только на первой."
    - id: "big"
      title: "Большая сумма (скрытый)"
      stdin: |
        1000000 1000000 1000000
      expected: |
        Товаров: 3
        Сумма: 3000000
        Самый дорогой: 1000000
      hidden: true
      hint: "Сумма 3000000 помещается в int; проверяется накопление без потери значений."
