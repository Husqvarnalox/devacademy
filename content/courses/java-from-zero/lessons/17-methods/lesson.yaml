id: "java.from-zero.methods"
title: "Методы: static, параметры и return"
goal: "Писать собственные static-методы с параметрами и результатом и вызывать их из main."
difficulty: "easy"
estimatedMinutes: 45
prerequisites:
  - "java.from-zero.loop-control"
objectives:
  - "Записывать заголовок static-метода: тип результата, имя, параметры."
  - "Возвращать значение командой return и использовать вызов метода в выражениях и условиях."
  - "Писать void-методы, которые выполняют действие и ничего не возвращают."
  - "Объяснять область видимости переменных и то, что параметры - копии аргументов."
masteryCriteria:
  - "Три метода упражнения дают верный результат на границах: скидка 0% и 100%, сумма ровно 3000 и на единицу меньше."
  - "Вы объясняете, почему изменение параметра внутри метода не меняет переменную в main."
  - "Вы читаете сообщения missing return statement и non-static method ... cannot be referenced from a static context."
