id: "java.from-zero.for-loop"
title: "Цикл for: счётчик в заголовке"
goal: "Записывать циклы for с шагом вверх и вниз, выбирая границы так, чтобы число итераций было точным."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "java.from-zero.while-loop"
objectives:
  - "Записывать цикл for (начало; условие; шаг) и объяснять порядок его выполнения."
  - "Считать вверх, вниз и с шагом больше единицы."
  - "Использовать шаблон for (int i = 0; i < n; i++) для повторения n раз и для обхода символов строки."
  - "Находить ошибки на единицу, лишнюю точку с запятой и обращение к счётчику после цикла."
masteryCriteria:
  - "Программа печатает ровно m строк для любого m, в том числе для m = 1 и m = 0."
  - "Вы определяете число итераций цикла по его заголовку без запуска."
  - "Вы объясняете, почему счётчик for недоступен после цикла."
concepts:
  introduces:
    - "java.for"
    - "java.loop-variable"
  uses:
    - "java.while"
    - "java.loop-condition"
    - "java.int"
    - "java.compound-assignment"
    - "java.comparison"
    - "java.if"
    - "java.block"
    - "java.scanner"
    - "java.char-at"
    - "java.string-length"
    - "java.concatenation"
    - "java.println"
    - "java.compile-error"
next:
  - "java.from-zero.loop-control"
tags:
  - "java"
  - "for"
  - "loop"
  - "counter"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Сколько раз выполнится тело цикла?

        ```java
        for (int i = 0; i < 5; i++) {
            System.out.println(i);
        }
        ```
      options:
        - "5"
        - "4"
        - "6"
        - "0"
      answer: 0
      explanation: "Счётчик принимает значения 0, 1, 2, 3, 4: пять итераций. При i = 5 условие i < 5 ложно."
    - id: "q2"
      type: "single"
      prompt: |-
        Что напечатает программа?

        ```java
        for (int i = 10; i > 0; i -= 3) {
            System.out.print(i + " ");
        }
        ```
      options:
        - "10 7 4 1 "
        - "10 7 4 "
        - "9 6 3 "
        - "10 7 4 1 -2 "
      answer: 0
      explanation: "После 1 счётчик станет -2, условие i > 0 ложно, и цикл заканчивается. Значения: 10, 7, 4, 1."
    - id: "q3"
      type: "single"
      prompt: |-
        Что произойдёт при компиляции?

        ```java
        for (int i = 0; i < 3; i++) {
            System.out.println(i);
        }
        System.out.println(i);
        ```
      options:
        - "Ошибка: cannot find symbol для переменной i"
        - "Напечатает 0 1 2 и затем 3"
        - "Напечатает 0 1 2 и затем 2"
        - "Предупреждение, но программа запустится"
      answer: 0
      explanation: "Переменная i объявлена в заголовке и видна только внутри цикла. После закрывающей скобки её нет, поэтому компилятор не находит символ i."
    - id: "q4"
      type: "single"
      prompt: "Для строки word = \"кот\" цикл for (int i = 0; i <= word.length(); i++) вызывает word.charAt(i). Что произойдёт?"
      options:
        - "StringIndexOutOfBoundsException при i = 3"
        - "Программа напечатает все три буквы без ошибок"
        - "Ошибка компиляции"
        - "Бесконечный цикл"
      answer: 0
      explanation: "Индексы букв слова из трёх букв: 0, 1, 2. Условие i <= 3 допускает i = 3, и charAt(3) выходит за границы. Правильно: i < word.length()."
    - id: "q5"
      type: "single"
      prompt: |-
        Какой цикл while равнозначен этому for?

        ```java
        for (int i = 1; i <= 3; i++) {
            System.out.println(i);
        }
        ```
      options:
        - "int i = 1; while (i <= 3) { System.out.println(i); i++; }"
        - "int i = 1; while (i < 3) { System.out.println(i); i++; }"
        - "int i = 0; while (i <= 3) { System.out.println(i); i++; }"
        - "int i = 1; while (i <= 3) { System.out.println(i); }"
      answer: 0
      explanation: "Начало выполняется до цикла, условие проверяется перед каждой итерацией, шаг стоит в конце тела. Остальные варианты меняют границы или не меняют счётчик."
exercise:
  id: "java.from-zero.for-loop.exercise"
  title: "Накопления по месяцам"
  prompt: |
    Каждый месяц на счёт откладывают одну и ту же сумму. На вход подаются два целых числа: сумма ежемесячного взноса `s` и число месяцев `m` (`m` не меньше нуля).

    Для каждого месяца `k` от 1 до `m` напечатайте строку `Месяц k: <накопленная сумма>`. После всех месяцев напечатайте строку `Итого: <накопленная сумма>`. Если `m` равно нулю, напечатайте только `Итого: 0`.

    **Пример.** Ввод:

    ```
    1500 3
    ```

    Вывод:

    ```
    Месяц 1: 1500
    Месяц 2: 3000
    Месяц 3: 4500
    Итого: 4500
    ```
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Число месяцев известно заранее, поэтому подойдёт цикл for со счётчиком месяцев от 1 до m включительно."
    - "Накопленную сумму держите в переменной total, объявленной до цикла (начальное значение 0). На каждой итерации прибавляйте s."
    - "Строку «Итого: ...» печатайте после цикла: она нужна всегда, в том числе при m = 0."
  tests:
    - id: "three"
      title: "Три месяца"
      stdin: |
        1500 3
      expected: |
        Месяц 1: 1500
        Месяц 2: 3000
        Месяц 3: 4500
        Итого: 4500
      hint: "Три строки по месяцам с накоплением 1500, 3000, 4500 и итоговая строка."
    - id: "one"
      title: "Один месяц"
      stdin: |
        200 1
      expected: |
        Месяц 1: 200
        Итого: 200
      hint: "Один месяц: одна строка «Месяц 1: 200» и итог 200."
    - id: "zero"
      title: "Ноль месяцев (скрытый)"
      stdin: |
        1000 0
      expected: |
        Итого: 0
      hidden: true
      hint: "При m = 0 цикл не выполняется, но «Итого: 0» всё равно печатается."
    - id: "twelve"
      title: "Год (скрытый)"
      stdin: |
        5000 12
      expected: |
        Месяц 1: 5000
        Месяц 2: 10000
        Месяц 3: 15000
        Месяц 4: 20000
        Месяц 5: 25000
        Месяц 6: 30000
        Месяц 7: 35000
        Месяц 8: 40000
        Месяц 9: 45000
        Месяц 10: 50000
        Месяц 11: 55000
        Месяц 12: 60000
        Итого: 60000
      hidden: true
      hint: "Двенадцать строк: последний месяц должен быть включён в цикл (k <= m), итог 60000."
    - id: "zero-deposit"
      title: "Нулевой взнос (скрытый)"
      stdin: |
        0 4
      expected: |
        Месяц 1: 0
        Месяц 2: 0
        Месяц 3: 0
        Месяц 4: 0
        Итого: 0
      hidden: true
      hint: "При нулевом взносе строки по месяцам печатаются с нулевым накоплением: цикл не зависит от суммы."
