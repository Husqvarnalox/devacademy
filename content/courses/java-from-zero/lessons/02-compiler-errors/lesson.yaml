id: "java.from-zero.compiler-errors"
title: "Как читать сообщения об ошибках"
goal: "Найти и исправить синтаксические ошибки и опечатки в именах по сообщению компилятора."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "java.from-zero.first-program"
objectives:
  - "Разобрать сообщение компилятора: файл, строка, описание, строка кода и значок ^."
  - "Отличать синтаксическую ошибку («чего-то не хватает») от ошибки неизвестного имени (cannot find symbol)."
  - "Исправлять ошибки по одной, начиная с первого сообщения, и собирать программу заново."
masteryCriteria:
  - "Программа после исправлений собирается и печатает три заданные строки без изменений текста."
  - "Вы объясняете, почему после исправления первой ошибки может появиться новая."
concepts:
  introduces:
    - "java.compile-error"
    - "java.error-location"
  uses:
    - "java.program"
    - "java.compiler"
    - "java.main-wrapper"
    - "java.println"
    - "java.string-literal"
next:
  - "java.from-zero.output"
tags:
  - "java"
  - "compiler"
  - "errors"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Сообщение компилятора начинается так: Main.java:7: error: ';' expected. Где искать проблему?"
      options:
        - "В файле Main.java, около строки 7: чаще всего в её конце или в предыдущей строке."
        - "В файле с именем error."
        - "В седьмой по счёту команде любого файла проекта."
        - "Нигде: это предупреждение, программа всё равно соберётся."
      answer: 0
      explanation: "Сообщение называет файл и номер строки. Про ';' компилятор замечает пропуск в конце команды, поэтому смотреть нужно на указанную строку и на ту, что перед ней."
    - id: "q2"
      type: "single"
      prompt: "Компилятор вывел 3 error. Как правильно действовать?"
      options:
        - "Исправить первую ошибку, собрать заново и читать новый список."
        - "Исправить сразу все три в произвольном порядке, не пересобирая."
        - "Исправлять с последней, потому что она самая важная."
        - "Удалить строки, в которых есть ошибки."
      answer: 0
      explanation: "Первая ошибка часто является причиной следующих. После её исправления лишние сообщения исчезают, а скрытые ошибки других видов могут появиться."
    - id: "q3"
      type: "single"
      prompt: "Программа содержит System.out.printn(\"Привет\"). Что означает сообщение cannot find symbol и строка symbol: method printn(String)?"
      options:
        - "У System.out нет метода с именем printn: в имени опечатка."
        - "В программе не хватает точки с запятой."
        - "Текст в кавычках слишком длинный."
        - "Файл называется не Main.java."
      answer: 0
      explanation: "cannot find symbol - «не нахожу такое имя». Строка symbol называет имя, которого нет (printn), а location - где его искали. Правильное имя - println."
    - id: "q4"
      type: "multiple"
      prompt: "Что из этого можно узнать из сообщения об ошибке?"
      options:
        - "Номер строки, около которой компилятор заметил проблему."
        - "Короткое описание проблемы (например, unclosed string literal)."
        - "Место в строке, на которое указывает значок ^."
        - "Готовое исправление, которое нужно просто скопировать."
      answer:
        - 0
        - 1
        - 2
      explanation: "Сообщение называет строку, описывает проблему и показывает позицию значком ^. Исправление подсказывает не всегда: решает человек, и иногда причина в предыдущей строке."
exercise:
  id: "java.from-zero.compiler-errors.exercise"
  title: "Исправьте три ошибки"
  prompt: |
    Программа должна напечатать три строки, но не собирается: в ней три ошибки разных видов. Исправьте их, **не меняя текст**, который нужно напечатать:

    ```
    Заказ принят
    Сумма: 450 руб.
    Спасибо за покупку!
    ```

    Исправляйте по одной ошибке: запустите программу, прочитайте первое сообщение, исправьте, запустите снова. Новое сообщение может появиться уже после исправления предыдущего.
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Сначала запустите программу и прочитайте первое сообщение: оно называет строку и вид ошибки."
    - "В первой команде не хватает точки с запятой в конце. Потом проверьте кавычки в последней команде: у строки должна быть закрывающая кавычка."
    - "Когда синтаксис исправлен, компилятор сообщит cannot find symbol для метода printn. Подумайте, как на самом деле называется команда печати строки."
    - "Верны три строки: println(\"Заказ принят\"); println(\"Сумма: 450 руб.\"); println(\"Спасибо за покупку!\");"
  tests:
    - id: "basic"
      title: "Программа собирается и печатает три строки"
      stdin: ""
      expected: |
        Заказ принят
        Сумма: 450 руб.
        Спасибо за покупку!
      hint: "Исправьте точку с запятой, имя команды printn и закрывающую кавычку, чтобы программа собралась и напечатала три строки."
    - id: "exact"
      title: "Текст не изменён (скрытый)"
      stdin: ""
      expected: |
        Заказ принят
        Сумма: 450 руб.
        Спасибо за покупку!
      hidden: true
      hint: "Проверяется точное совпадение текста: слова, пробелы, точка после «руб» и восклицательный знак в конце. Менять нужно только синтаксис, а не сами фразы."
