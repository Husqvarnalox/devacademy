id: "java.from-zero.loop-control"
title: "break, continue и вложенные циклы"
goal: "Прерывать цикл командой break, пропускать итерации командой continue и записывать циклы внутри циклов."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "java.from-zero.for-loop"
objectives:
  - "Прерывать цикл по сторожевому значению командой break."
  - "Пропускать ошибочные данные командой continue и считать пропущенные."
  - "Записывать вложенные циклы и определять число выполнений внутреннего тела."
  - "Объяснять, из какого цикла выходит break во вложенных циклах."
masteryCriteria:
  - "Программа останавливает чтение на нуле и игнорирует всё, что стоит после него."
  - "Программа пропускает отрицательные значения и не считает их в сумме."
  - "Вы объясняете, почему в while счётчик нужно менять до continue."
concepts:
  introduces:
    - "java.break"
    - "java.continue"
    - "java.nested-loops"
  uses:
    - "java.while"
    - "java.for"
    - "java.if"
    - "java.comparison"
    - "java.int"
    - "java.compound-assignment"
    - "java.scanner"
    - "java.print"
    - "java.println"
    - "java.concatenation"
    - "java.compile-error"
    - "java.block"
next:
  - "java.from-zero.methods"
tags:
  - "java"
  - "break"
  - "continue"
  - "nested-loops"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что напечатает программа?

        ```java
        for (int i = 1; i <= 5; i++) {
            if (i == 3) {
                continue;
            }
            System.out.print(i + " ");
        }
        ```
      options:
        - "1 2 4 5 "
        - "1 2 "
        - "1 2 3 4 5 "
        - "3 "
      answer: 0
      explanation: "При i == 3 continue пропускает печать и переходит к следующей итерации; остальные числа печатаются."
    - id: "q2"
      type: "single"
      prompt: |-
        Что напечатает программа?

        ```java
        for (int i = 1; i <= 5; i++) {
            if (i == 3) {
                break;
            }
            System.out.print(i + " ");
        }
        ```
      options:
        - "1 2 "
        - "1 2 4 5 "
        - "1 2 3 "
        - "3 "
      answer: 0
      explanation: "На i == 3 break завершает цикл целиком, поэтому 3, 4 и 5 не печатаются."
    - id: "q3"
      type: "single"
      prompt: |-
        Сколько звёздочек напечатает программа?

        ```java
        for (int i = 0; i < 2; i++) {
            for (int j = 0; j < 3; j++) {
                System.out.print("*");
            }
        }
        ```
      options:
        - "6"
        - "5"
        - "3"
        - "2"
      answer: 0
      explanation: "Внутренний цикл выполняется 3 раза на каждую из 2 итераций внешнего: 2 · 3 = 6."
    - id: "q4"
      type: "single"
      prompt: |-
        Что напечатает программа?

        ```java
        for (int i = 0; i < 3; i++) {
            for (int j = 0; j < 3; j++) {
                if (j == 1) {
                    break;
                }
                System.out.print(i);
            }
        }
        ```
      options:
        - "012"
        - "000"
        - "001122"
        - "0"
      answer: 0
      explanation: "break завершает только внутренний цикл. Для каждого i внутренний цикл успевает напечатать i при j = 0 и выходит на j = 1. Внешний продолжает, получается 0, 1, 2."
    - id: "q5"
      type: "single"
      prompt: "Компилятор сообщает: unreachable statement. Какой код это вызвал?"
      options:
        - "Команда println, записанная сразу после break в том же блоке"
        - "break внутри if внутри цикла"
        - "continue в начале тела for"
        - "Цикл while (true) без break"
      answer: 0
      explanation: "После break управление покидает цикл, и следующая в блоке команда недостижима. Остальные варианты компилируются: break в if и continue в for допустимы, а while (true) без break - просто бесконечный цикл."
exercise:
  id: "java.from-zero.loop-control.exercise"
  title: "Касса с ошибками ввода"
  prompt: |
    Кассир вводит цены товаров - целые числа, разделённые пробелами или переводами строк. Правила:

    * положительное число - цена товара, он пробивается;
    * отрицательное число - ошибка ввода, оно пропускается;
    * число `0` означает конец чека: всё, что идёт после него, игнорируется.

    Если нуля нет, чек заканчивается вместе с вводом. Напечатайте две строки:

    ```
    Принято: <сколько цен пробито>
    Сумма: <сумма пробитых цен>
    ```

    **Пример.** Ввод:

    ```
    120 -5 80
    0
    999
    ```

    Вывод:

    ```
    Принято: 2
    Сумма: 200
    ```
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Читайте числа циклом while (in.hasNextInt()). Каждое число нужно проверить на два особых случая до обычной обработки."
    - "Если число равно 0, выйдите из цикла командой break. Если число отрицательное, пропустите его командой continue; число уже прочитано, поэтому цикл не зависнет."
    - "Для остальных чисел увеличьте счётчик принятых цен и прибавьте число к сумме."
  tests:
    - id: "example"
      title: "Пример из условия"
      stdin: |
        120 -5 80
        0
        999
      expected: |
        Принято: 2
        Сумма: 200
      hint: "Цена -5 пропущена, после нуля числа игнорируются: принято 2, сумма 200."
    - id: "no-zero"
      title: "Без нуля"
      stdin: |
        10 20
        30
      expected: |
        Принято: 3
        Сумма: 60
      hint: "Если нуля нет, чек заканчивается вместе с вводом: принято 3, сумма 60."
    - id: "zero-first"
      title: "Ноль в начале (скрытый)"
      stdin: |
        0 50 60
      expected: |
        Принято: 0
        Сумма: 0
      hidden: true
      hint: "Ноль сразу прекращает чтение: принято 0, сумма 0."
    - id: "only-negative"
      title: "Только ошибки (скрытый)"
      stdin: |
        -1 -2 -3
      expected: |
        Принято: 0
        Сумма: 0
      hidden: true
      hint: "Отрицательные числа не считаются принятыми и не влияют на сумму."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: |
        Принято: 0
        Сумма: 0
      hidden: true
      hint: "Пустой ввод: цикл не выполняется, принято 0 и сумма 0."
    - id: "mixed"
      title: "Много пропусков (скрытый)"
      stdin: |
        5 -1 -1 7
        -3 9 0 4
      expected: |
        Принято: 3
        Сумма: 21
      hidden: true
      hint: "Пропуски не должны останавливать чтение: принято 3 цены (5, 7, 9), сумма 21; число 4 после нуля не считается."
