id: "java.from-zero.arraylist"
title: "ArrayList: список переменной длины"
goal: "Хранить растущий набор значений в ArrayList и обрабатывать его методами add, get, size, contains и remove."
difficulty: "easy"
estimatedMinutes: 45
prerequisites:
  - "java.from-zero.arrays"
objectives:
  - "Создавать ArrayList с типом элементов в угловых скобках и добавлять элементы."
  - "Использовать get, set, size, contains, remove и isEmpty, помня, что индексы идут с нуля."
  - "Писать метод, который принимает список и возвращает новый список из подходящих элементов."
  - "Читать список целиком из ввода циклом while (in.hasNextInt()) и избегать изменения списка во время for-each."
masteryCriteria:
  - "Методы упражнения верно обрабатывают случаи, когда подходят все оценки, ни одна оценка и ровно одна."
  - "Вы объясняете, почему в ArrayList<int> нужно писать Integer."
  - "Вы различаете remove(индекс) и удаление по значению."
