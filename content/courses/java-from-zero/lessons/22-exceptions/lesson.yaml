id: "java.from-zero.exceptions"
title: "Исключения: try, catch и throw"
goal: "Перехватывать исключения конструкцией try/catch, выбрасывать IllegalArgumentException и пропускать неверные данные, не прерывая программу."
difficulty: "easy"
estimatedMinutes: 45
prerequisites:
  - "java.from-zero.string-methods"
objectives:
  - "Объяснять, что такое исключение и чем оно отличается от ошибки компиляции."
  - "Перехватывать NumberFormatException конструкцией try/catch и продолжать работу."
  - "Выбрасывать IllegalArgumentException оператором throw new и читать сообщение через getMessage."
  - "Считать и пропускать неверные значения при обработке ввода."
masteryCriteria:
  - "Метод isNumber возвращает false для текста, дробных чисел, пустой строки и слишком больших чисел."
  - "Метод checkedAge выбрасывает исключение с указанным сообщением для возраста вне диапазона 0..150."
  - "Вы различаете исключение, которое нужно перехватить, и условие, которое проще проверить через if."
