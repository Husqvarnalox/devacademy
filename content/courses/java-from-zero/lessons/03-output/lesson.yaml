id: "java.from-zero.output"
title: "Вывод: print, println и соединение текста"
goal: "Напечатать несколько строк, управлять переводом строки и соединять текст с числами."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "java.from-zero.compiler-errors"
objectives:
  - "Различать print и println и получать нужное число строк на экране."
  - "Записывать в строке перевод строки, кавычки и обратную косую черту через \\n, \\\" и \\\\."
  - "Соединять текст и число оператором + и ставить пробелы там, где они нужны."
  - "Оставлять в программе комментарии."
masteryCriteria:
  - "Программа печатает заданные строки в точности, включая пробелы, знаки и кавычки."
  - "Вы предсказываете, в одной или в нескольких строках окажется результат нескольких команд вывода."
  - "Вы объясняете, почему в Java между склеиваемыми частями не появляются пробелы сами."
concepts:
  introduces:
    - "java.print"
    - "java.escape-sequence"
    - "java.concatenation"
    - "java.comment"
  uses:
    - "java.println"
    - "java.string-literal"
    - "java.main-wrapper"
    - "java.compile-error"
next:
  - "java.from-zero.variables"
tags:
  - "java"
  - "output"
  - "print"
  - "escape"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```java
        public class Main {
            public static void main(String[] args) {
                System.out.print("A");
                System.out.print("B");
                System.out.println("C");
                System.out.println("D");
            }
        }
        ```
      options:
        - "ABC и на следующей строке D"
        - "A, B, C, D - каждая буква на своей строке"
        - "ABCD в одной строке"
        - "AB и на следующей строке CD"
      answer: 0
      explanation: "print не переводит строку, поэтому A, B и C окажутся в одной строке. Перевод строки добавляет println после C, и D начинается с новой строки."
    - id: "q2"
      type: "single"
      prompt: "Что напечатает System.out.println(\"Итого:\" + 100);"
      options:
        - "Итого:100"
        - "Итого: 100"
        - "Итого:\" + 100"
        - "Ошибка компиляции"
      answer: 0
      explanation: "Оператор + склеивает текст и число, но пробел сам не добавляет. Если нужен пробел, его пишут внутри текста: \"Итого: \" + 100."
    - id: "q3"
      type: "single"
      prompt: "Как напечатать строку: Он сказал \"да\" ?"
      options:
        - "System.out.println(\"Он сказал \\\"да\\\"\");"
        - "System.out.println(\"Он сказал \"да\"\");"
        - "System.out.println('Он сказал \"да\"');"
        - "System.out.println(Он сказал \"да\");"
      answer: 0
      explanation: "Кавычка внутри текста записывается как \\\", иначе компилятор решит, что текст закончился. Без экранирования получится ошибка компиляции ')' or ',' expected."
    - id: "q4"
      type: "single"
      prompt: "Что делает \\n внутри строкового литерала?"
      options:
        - "Переводит строку: дальнейший текст печатается с новой строки."
        - "Печатает на экране символы \\ и n."
        - "Удаляет предыдущий символ."
        - "Завершает программу."
      answer: 0
      explanation: "Последовательность \\n - один символ «перевод строки». Поэтому System.out.println(\"a\\nb\") печатает две строки: a и b."
exercise:
  id: "java.from-zero.output.exercise"
  title: "Чек из нескольких строк"
  prompt: |
    Допишите программу так, чтобы она напечатала такой чек (всего четыре строки):

    ```
    === Чек ===
    Хлеб: 45 руб.
    Молоко: 89 руб.
    "Спасибо за покупку!"
    ```

    Две первые строки уже напечатаны. Продолжите по образцу: строку про молоко соберите через `+`, а в последней строке кавычки напечатайте с помощью `\"`.
  entryFile: "Main.java"
  evaluation: "io"
  hints:
    - "Образец уже в программе: System.out.println(\"Хлеб: \" + 45 + \" руб.\"); Для молока замените название и число."
    - "Кавычки внутри текста записываются как \\\". Текст в литерале начинается и заканчивается обычными кавычками."
    - "Последняя строка: System.out.println(\"\\\"Спасибо за покупку!\\\"\");"
  tests:
    - id: "basic"
      title: "Чек из четырёх строк"
      stdin: ""
      expected: |
        === Чек ===
        Хлеб: 45 руб.
        Молоко: 89 руб.
        "Спасибо за покупку!"
      hint: "Должно быть четыре строки: заголовок, хлеб, молоко и благодарность в кавычках."
    - id: "exact"
      title: "Пробелы, точки и кавычки (скрытый)"
      stdin: ""
      expected: |
        === Чек ===
        Хлеб: 45 руб.
        Молоко: 89 руб.
        "Спасибо за покупку!"
      hidden: true
      hint: "Проверяется точное совпадение: пробел после двоеточия, точка после «руб», кавычки вокруг благодарности и никаких лишних строк."
