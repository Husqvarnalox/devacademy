id: "cpp.from-zero.vector"
title: "Вектор: список значений"
goal: "Хранить набор однотипных значений в std::vector, добавлять элементы и обходить их."
difficulty: "easy"
estimatedMinutes: 50
prerequisites:
  - "cpp.from-zero.references"
objectives:
  - "Создать std::vector нужного типа, добавлять элементы через push_back и узнавать размер через size()."
  - "Обойти вектор циклом range-for и по индексу."
  - "Объяснить, чем v[i] отличается от v.at(i) при выходе за границы."
masteryCriteria:
  - "Вы указываете тип элементов в угловых скобках и читаете запись std::vector<int> как «вектор целых»."
  - "Вы обходите вектор через range-for, если индекс не нужен, и передаёте вектор в функцию как const std::vector<int>&."
  - "Вы проверяете v.empty() перед чтением первого и последнего элементов."
concepts:
  introduces:
    - "cpp.vector"
    - "cpp.push-back"
    - "cpp.range-for"
    - "cpp.vector-index"
  uses:
    - "cpp.int"
    - "cpp.double"
    - "cpp.string"
    - "cpp.string-index"
    - "cpp.at"
    - "cpp.for"
    - "cpp.while"
    - "cpp.read-until-eof"
    - "cpp.if"
    - "cpp.function"
    - "cpp.parameter"
    - "cpp.return"
    - "cpp.reference"
    - "cpp.const-reference"
    - "cpp.static-cast"
    - "cpp.fixed"
    - "cpp.setprecision"
    - "cpp.long-long"
    - "cpp.undefined-behavior"
    - "cpp.sign-compare"
next:
  - "cpp.from-zero.map"
tags:
  - "cpp"
  - "vector"
  - "collections"
facts:
  - kind: "misconception"
    text: "«v[i] за границами вектора выбросит исключение» - нет. Оператор [] границы не проверяет: чтение может вернуть мусор, запись испортить память, а программа может упасть. Исключение std::out_of_range бросает только v.at(i)."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        std::vector<int> v;
        v.push_back(5);
        v.push_back(7);
        v.push_back(9);
        std::cout << v.size() << " " << v[1] << "\n";
        ```
      options:
        - "3 7"
        - "3 5"
        - "2 7"
        - "3 9"
      answer: 0
      explanation: "Три раза вызван push_back, размер 3. Нумерация идёт с нуля: v[0] = 5, v[1] = 7, v[2] = 9."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        std::vector<int> v = {1, 2, 3, 4};
        int sum = 0;
        for (int x : v) {
            sum += x;
        }
        std::cout << sum << "\n";
        ```
      options:
        - "10"
        - "6"
        - "4"
        - "0"
      answer: 0
      explanation: "Цикл range-for по очереди кладёт каждый элемент в x. Складываются все четыре числа: 1 + 2 + 3 + 4 = 10."
    - id: "q3"
      type: "single"
      prompt: |
        Что делает `v.at(10)` для вектора из трёх элементов?
      options:
        - "Проверяет границу и бросает исключение std::out_of_range; программа завершается с сообщением."
        - "Возвращает 0."
        - "Возвращает случайное число из памяти."
        - "Добавляет недостающие элементы."
      answer: 0
      explanation: "Метод at проверяет индекс. Выход за границы - исключение, и необработанное исключение останавливает программу с понятным сообщением (урок 22 научит их ловить)."
    - id: "q4"
      type: "single"
      prompt: |
        Что делает `v[10]` для вектора из трёх элементов?
      options:
        - "Это неопределённое поведение: может прочитать мусор, упасть или «сработать»."
        - "Гарантированно бросает исключение."
        - "Гарантированно возвращает 0."
        - "Не компилируется."
      answer: 0
      explanation: "Оператор [] границы не проверяет. Стандарт не обещает ничего: в проверке автора чтение дало случайное число, а в других запусках программа падает. Поэтому индекс сначала проверяют или используют at()."
    - id: "q5"
      type: "single"
      prompt: |
        Что произойдёт?

        ```cpp
        std::vector<int> v;
        std::cout << v[v.size() - 1] << "\n";
        ```
      options:
        - "Неопределённое поведение: size() - 1 для пустого вектора - огромное число."
        - "Напечатается 0."
        - "Напечатается -1."
        - "Исключение std::out_of_range."
      answer: 0
      explanation: "size() возвращает беззнаковое число, и 0 - 1 даёт самое большое значение типа. Индекс уходит далеко за границы. Перед чтением последнего элемента проверяйте empty()."
exercise:
  id: "cpp.from-zero.vector.exercise"
  title: "Числа выше среднего"
  prompt: |
    На вход приходят целые числа в любом количестве, в одной строке или в нескольких. Прочитайте их до конца ввода в `std::vector<int>` и напечатайте:

    ```
    Количество: <сколько чисел>
    Максимум: <наибольшее>
    Среднее: <среднее арифметическое с двумя знаками>
    Больше среднего: <числа строго больше среднего в порядке ввода через пробел>
    ```

    Например, для `3 9 4 1 7`:

    ```
    Количество: 5
    Максимум: 9
    Среднее: 4.80
    Больше среднего: 9 7
    ```

    Если чисел нет, напечатайте одну строку `Пусто`. Если ни одно число не больше среднего (например, все равны), после двоеточия напечатайте слово `нет`: `Больше среднего: нет`.

    Все числа по модулю не больше миллиона, и их не больше тысячи; сумма помещается в `long long`.
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Читайте в цикле: int x = 0; while (std::cin >> x) { numbers.push_back(x); } Проверку на пустой ввод делайте сразу после цикла: numbers.empty()."
    - "Сумму копите в long long, максимум начинайте с numbers[0] (вектор уже не пуст). Среднее: static_cast<double>(sum) / numbers.size()."
    - "Числа выше среднего находит второй обход: for (int x : numbers) { if (x > average) { ... } }. После двоеточия пробел нужен перед каждым числом, поэтому печатайте std::cout << \" \" << x;"
    - "Заведите счётчик найденных чисел. Если после обхода он равен нулю, допечатайте std::cout << \" нет\";"
  tests:
    - id: "basic"
      title: "Пять чисел"
      stdin: |
        3 9 4 1 7
      expected: |
        Количество: 5
        Максимум: 9
        Среднее: 4.80
        Больше среднего: 9 7
      hint: "Сумма 24, среднее 4.8; больше среднего только 9 и 7 в порядке ввода."
    - id: "lines"
      title: "Числа на разных строках"
      stdin: |
        10
        20
        30
      expected: |
        Количество: 3
        Максимум: 30
        Среднее: 20.00
        Больше среднего: 30
      hint: "Среднее 20: само число 20 не строго больше среднего, поэтому в списке только 30."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: |
        Пусто
      hidden: true
      hint: "Без чисел печатается одна строка «Пусто»; иначе деление на ноль и чтение numbers[0] недопустимы."
    - id: "equal"
      title: "Все числа равны (скрытый)"
      stdin: |
        5 5 5
      expected: |
        Количество: 3
        Максимум: 5
        Среднее: 5.00
        Больше среднего: нет
      hidden: true
      hint: "Если ни одно число не больше среднего, после двоеточия печатается «нет»."
    - id: "negative"
      title: "Отрицательные числа (скрытый)"
      stdin: |
        -4 -10 -1 -7
      expected: |
        Количество: 4
        Максимум: -1
        Среднее: -5.50
        Больше среднего: -4 -1
      hidden: true
      hint: "Максимум нужно начинать с первого элемента, а не с нуля. Среднее -5.5: больше него -4 и -1."
    - id: "big"
      title: "Большие числа (скрытый)"
      stdin: |
        1000000 1000000 -1000000
      expected: |
        Количество: 3
        Максимум: 1000000
        Среднее: 333333.33
        Больше среднего: 1000000 1000000
      hidden: true
      hint: "Среднее считается как дробное число: static_cast<double>(sum) / count."
