id: "cpp.from-zero.loop-control"
title: "break, continue и вложенные циклы"
goal: "Прерывать цикл досрочно, пропускать обороты и вкладывать один цикл в другой."
difficulty: "easy"
estimatedMinutes: 45
prerequisites:
  - "cpp.from-zero.for-loop"
objectives:
  - "Выйти из цикла командой break и перейти к следующему обороту командой continue."
  - "Написать вложенный цикл и объяснить, сколько раз выполнится его тело."
  - "Объяснить, что break завершает только самый внутренний цикл."
masteryCriteria:
  - "Вы используете continue в цикле while только после того, как счётчик уже изменён, иначе цикл зависнет."
  - "Вы считаете число оборотов вложенных циклов как произведение чисел оборотов."
  - "Вы отличаете break в switch от break в цикле, если они стоят рядом."
concepts:
  introduces:
    - "cpp.break"
    - "cpp.continue"
    - "cpp.nested-loops"
  uses:
    - "cpp.while"
    - "cpp.for"
    - "cpp.loop-variable"
    - "cpp.loop-condition"
    - "cpp.read-until-eof"
    - "cpp.if"
    - "cpp.else"
    - "cpp.block"
    - "cpp.switch"
    - "cpp.case-break"
    - "cpp.int"
    - "cpp.long-long"
    - "cpp.compound-assignment"
    - "cpp.comparison"
    - "cpp.logical-operators"
    - "cpp.cin"
    - "cpp.output-chain"
    - "cpp.string"
    - "cpp.escape-sequence"
next:
  - "cpp.from-zero.functions"
tags:
  - "cpp"
  - "loop"
  - "break"
  - "continue"
facts:
  - kind: "misconception"
    text: "«break выходит из всех вложенных циклов сразу» - нет. break завершает только ближайший цикл или switch, внутри которого стоит. Чтобы выйти из внешнего цикла, используют флаг, проверку в условии или (позже) выход из функции."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        for (int i = 1; i <= 5; i++) {
            if (i == 3) {
                break;
            }
            std::cout << i << " ";
        }
        std::cout << "\n";
        ```
      options:
        - "1 2"
        - "1 2 3"
        - "1 2 4 5"
        - "3"
      answer: 0
      explanation: "На i == 3 выполняется break и цикл прекращается, не печатая тройку и всё, что дальше."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        for (int i = 1; i <= 5; i++) {
            if (i == 3) {
                continue;
            }
            std::cout << i << " ";
        }
        std::cout << "\n";
        ```
      options:
        - "1 2 4 5"
        - "1 2"
        - "1 2 3 4 5"
        - "3"
      answer: 0
      explanation: "continue пропускает остаток тела на i == 3 и переходит к следующему обороту: цикл продолжается, только тройка не печатается."
    - id: "q3"
      type: "single"
      prompt: |
        Сколько раз напечатается звёздочка?

        ```cpp
        for (int i = 0; i < 3; i++) {
            for (int j = 0; j < 4; j++) {
                std::cout << "*";
            }
        }
        ```
      options:
        - "12"
        - "7"
        - "4"
        - "3"
      answer: 0
      explanation: "На каждый из 3 оборотов внешнего цикла внутренний делает 4 оборота: 3 * 4 = 12."
    - id: "q4"
      type: "single"
      prompt: |
        Что произойдёт с программой?

        ```cpp
        int k = 0;
        while (k < 5) {
            if (k == 2) {
                continue;
            }
            k++;
        }
        ```
      options:
        - "Программа зависнет: на k == 2 счётчик больше не увеличивается."
        - "Программа завершится, k станет 5."
        - "Программа завершится, k станет 4."
        - "Программа не соберётся."
      answer: 0
      explanation: "continue переходит к проверке условия, не доходя до k++. Значение k остаётся 2, и условие k < 5 истинно вечно. В цикле for такой проблемы нет: шаг выполняется и после continue."
    - id: "q5"
      type: "single"
      prompt: |
        Сколько строк напечатает программа?

        ```cpp
        for (int i = 0; i < 3; i++) {
            for (int j = 0; j < 3; j++) {
                if (j == 1) {
                    break;
                }
                std::cout << i << j << "\n";
            }
        }
        ```
      options:
        - "3"
        - "9"
        - "1"
        - "6"
      answer: 0
      explanation: "break завершает только внутренний цикл. Для каждого i печатается пара при j == 0, затем на j == 1 внутренний цикл прерывается, и внешний переходит к следующему i. Всего три строки: 00, 10, 20."
exercise:
  id: "cpp.from-zero.loop-control.exercise"
  title: "Касса: стоп-значение и пропуск"
  prompt: |
    Кассир вводит цены товаров по одной. Число `0` означает «чек закончен»: после него ничего читать не нужно. Отрицательное число - ошибка ввода: цена не может быть отрицательной, такое значение нужно пропустить и посчитать. Остальные числа - цены.

    Читайте числа, пока они есть или пока не встретится `0`, и напечатайте:

    ```
    Сумма: <сумма цен>
    Ошибок: <сколько отрицательных значений встретилось до нуля>
    ```

    Например, для `120 -5 40 -1 0 999`:

    ```
    Сумма: 160
    Ошибок: 2
    ```

    Число `999` после нуля не учитывается. Заготовка читает числа в цикле `while`, допишите `break` и `continue`.
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Внутри цикла три случая: значение 0 (завершить цикл), отрицательное (посчитать ошибку и перейти к следующему), обычное (прибавить к сумме)."
    - "Для нуля: if (price == 0) { break; } - цикл закончится, и данные после нуля не будут прочитаны."
    - "Для отрицательного: if (price < 0) { errors++; continue; } - остаток тела цикла пропускается, значение не попадает в сумму."
    - "После этих двух проверок остаётся только sum += price;"
  tests:
    - id: "basic"
      title: "Ошибки и стоп-значение"
      stdin: |
        120 -5 40 -1 0 999
      expected: |
        Сумма: 160
        Ошибок: 2
      hint: "Сумма 120 + 40 = 160; два отрицательных значения посчитаны; 999 после нуля не читается."
    - id: "no-zero"
      title: "Нуля нет, ввод просто кончился"
      stdin: |
        10
        20
        30
      expected: |
        Сумма: 60
        Ошибок: 0
      hint: "Если нуля нет, цикл завершается из-за конца ввода."
    - id: "zero-first"
      title: "Ноль первым (скрытый)"
      stdin: |
        0
        5 6
      expected: |
        Сумма: 0
        Ошибок: 0
      hidden: true
      hint: "Если первым идёт ноль, цикл прекращается сразу: сумма 0, ошибок 0."
    - id: "only-errors"
      title: "Только ошибки (скрытый)"
      stdin: |
        -1 -2 -3 0
      expected: |
        Сумма: 0
        Ошибок: 3
      hidden: true
      hint: "Отрицательные значения не попадают в сумму, но каждое считается ошибкой."
    - id: "after-zero"
      title: "Отрицательные после нуля не считаются (скрытый)"
      stdin: |
        7 0 -4 -4
      expected: |
        Сумма: 7
        Ошибок: 0
      hidden: true
      hint: "После нуля цикл уже закончился: отрицательные числа за ним нельзя считать ошибками."
