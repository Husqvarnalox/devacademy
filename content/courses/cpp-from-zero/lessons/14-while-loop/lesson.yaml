id: "cpp.from-zero.while-loop"
title: "Цикл while"
goal: "Повторять блок команд, пока условие истинно, и читать данные до конца ввода."
difficulty: "easy"
estimatedMinutes: 45
prerequisites:
  - "cpp.from-zero.switch"
objectives:
  - "Написать цикл while со счётчиком и с накоплением суммы."
  - "Объяснить, из каких трёх частей состоит корректный цикл: начальное значение, условие, изменение."
  - "Прочитать числа до конца ввода конструкцией while (std::cin >> x)."
masteryCriteria:
  - "Вы проверяете, что внутри цикла что-то меняет значение, от которого зависит условие."
  - "Вы начинаете накопление суммы с нуля, а наибольшее значение - с первого прочитанного, а не с нуля."
  - "Вы читаете данные неизвестной длины через while (std::cin >> x), а не через проверку eof()."
concepts:
  introduces:
    - "cpp.while"
    - "cpp.loop-condition"
    - "cpp.read-until-eof"
  uses:
    - "cpp.if"
    - "cpp.else"
    - "cpp.block"
    - "cpp.comparison"
    - "cpp.logical-operators"
    - "cpp.int"
    - "cpp.long-long"
    - "cpp.compound-assignment"
    - "cpp.integer-division"
    - "cpp.remainder"
    - "cpp.cin"
    - "cpp.input-whitespace"
    - "cpp.input-failure"
    - "cpp.output-chain"
    - "cpp.undefined-behavior"
    - "cpp.short-circuit"
next:
  - "cpp.from-zero.for-loop"
tags:
  - "cpp"
  - "loop"
  - "while"
  - "input"
facts:
  - kind: "misconception"
    text: "«while (!std::cin.eof()) - правильный способ читать до конца ввода» - нет. Признак конца ввода появляется только после неудачной попытки чтения, поэтому такой цикл делает на один оборот больше и обрабатывает мусор. Правильно: while (std::cin >> x)."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        int i = 1;
        int sum = 0;
        while (i <= 4) {
            sum += i;
            i++;
        }
        std::cout << sum << "\n";
        ```
      options:
        - "10"
        - "6"
        - "4"
        - "15"
      answer: 0
      explanation: "Цикл складывает 1, 2, 3 и 4: 1 + 2 + 3 + 4 = 10. Когда i становится 5, условие i <= 4 ложно, и цикл заканчивается."
    - id: "q2"
      type: "single"
      prompt: |
        Сколько раз выполнится тело цикла?

        ```cpp
        int n = 10;
        while (n < 5) {
            n++;
        }
        ```
      options:
        - "Ни разу."
        - "Один раз."
        - "Пять раз."
        - "Бесконечно."
      answer: 0
      explanation: "Условие проверяется до каждого оборота. 10 < 5 ложно с самого начала, поэтому тело не выполняется даже один раз."
    - id: "q3"
      type: "single"
      prompt: |
        Что не так с этим циклом?

        ```cpp
        int i = 0;
        while (i < 3) {
            std::cout << i << "\n";
        }
        ```
      options:
        - "Переменная i не меняется, условие всегда истинно, цикл бесконечен."
        - "Цикл напечатает 0, 1, 2."
        - "Цикл не выполнится ни разу."
        - "Не хватает точки с запятой после условия."
      answer: 0
      explanation: "В теле цикла нет i++ или другого изменения i, поэтому условие i < 3 остаётся истинным навсегда. Компилятор такого не замечает: ошибка проявится только при запуске."
    - id: "q4"
      type: "single"
      prompt: |
        Ввод: `4 8 15`. Что напечатает программа?

        ```cpp
        int x = 0;
        int count = 0;
        while (std::cin >> x) {
            count++;
        }
        std::cout << count << "\n";
        ```
      options:
        - "3"
        - "4"
        - "27"
        - "0"
      answer: 0
      explanation: "Выражение std::cin >> x истинно, пока число успешно прочитано. Три числа - три оборота. После того как ввод кончился, чтение не удаётся, условие становится ложным и цикл завершается."
    - id: "q5"
      type: "single"
      prompt: |
        Что делает эта запись цикла?

        ```cpp
        int n = 12345;
        int digits = 0;
        while (n > 0) {
            n /= 10;
            digits++;
        }
        std::cout << digits << "\n";
        ```
      options:
        - "Считает цифры числа и печатает 5."
        - "Печатает сумму цифр, 15."
        - "Печатает 0: n сразу становится нулём."
        - "Бесконечно делит число на 10."
      answer: 0
      explanation: "Целочисленное деление на 10 отбрасывает последнюю цифру: 12345, 1234, 123, 12, 1, 0. Пять оборотов - пять цифр; когда n становится 0, условие n > 0 ложно."
exercise:
  id: "cpp.from-zero.while-loop.exercise"
  title: "Чек: цены до конца ввода"
  prompt: |
    На вход приходят цены товаров - целые числа, их количество заранее неизвестно. Они могут стоять в одной строке или в нескольких, разделённые пробелами и переводами строк. Читайте цены до конца ввода и напечатайте:

    ```
    Товаров: <сколько цен>
    Сумма: <сумма цен>
    Самый дорогой: <наибольшая цена>
    ```

    Например, для ввода `120 45 300 60`:

    ```
    Товаров: 4
    Сумма: 525
    Самый дорогой: 300
    ```

    Если цен нет вообще (пустой ввод), напечатайте одну строку `Чек пуст`.

    Переменные и вывод в заготовке уже написаны, допишите цикл чтения.
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Читайте в цикле: while (std::cin >> price) { ... }. Цикл закончится сам, когда числа кончатся."
    - "В теле цикла увеличивайте счётчик (count++) и добавляйте цену к сумме (sum += price)."
    - "Наибольшую цену нельзя начинать с нуля, если цены могут быть любыми. Обновляйте её так: if (count == 1 || price > best) { best = price; } (после count++ первая цена даёт count == 1)."
    - "Если вы увеличиваете count до проверки, сравнивайте с 1; если после - с 0. Главное - чтобы первое число стало значением best."
  tests:
    - id: "basic"
      title: "Четыре цены"
      stdin: |
        120 45 300 60
      expected: |
        Товаров: 4
        Сумма: 525
        Самый дорогой: 300
      hint: "Четыре цены: сумма 525, наибольшая 300."
    - id: "lines"
      title: "Цены на разных строках"
      stdin: |
        10
        20

        5
      expected: |
        Товаров: 3
        Сумма: 35
        Самый дорогой: 20
      hint: "std::cin >> пропускает переводы строк и пустые строки, цикл должен прочитать все три числа."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: |
        Чек пуст
      hidden: true
      hint: "Если не прочитано ни одной цены, печатается только строка «Чек пуст»."
    - id: "single"
      title: "Одна цена (скрытый)"
      stdin: |
        77
      expected: |
        Товаров: 1
        Сумма: 77
        Самый дорогой: 77
      hidden: true
      hint: "Единственная цена является и суммой, и наибольшей."
    - id: "negative"
      title: "Отрицательные значения (скрытый)"
      stdin: |
        -5 -2 -9
      expected: |
        Товаров: 3
        Сумма: -16
        Самый дорогой: -2
      hidden: true
      hint: "Наибольшее начинают с первого прочитанного числа, а не с нуля: иначе для отрицательных цен получится 0."
    - id: "big"
      title: "Большая сумма (скрытый)"
      stdin: |
        2000000000 2000000000 2000000000
      expected: |
        Товаров: 3
        Сумма: 6000000000
        Самый дорогой: 2000000000
      hidden: true
      hint: "Сумма трёх чисел не помещается в int: для суммы нужен long long."
