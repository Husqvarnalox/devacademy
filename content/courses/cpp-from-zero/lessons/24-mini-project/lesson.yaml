id: "cpp.from-zero.mini-project"
title: "Мини-проект: ведомость оценок"
goal: "Собрать из изученных частей законченную программу, которая читает несовершенные данные: считает и пропускает плохие строки."
difficulty: "easy"
estimatedMinutes: 90
prerequisites:
  - "cpp.from-zero.first-struct"
objectives:
  - "Разбить задачу на этапы: прочитать строку, проверить, принять или пропустить, подвести итоги."
  - "Проверить строку вида «имя;балл» на каждое условие корректности и посчитать отброшенные строки."
  - "Напечатать итоги в точном формате, включая среднее с двумя знаками после точки."
masteryCriteria:
  - "Программа не падает ни на одной из плохих строк и считает каждую из них ровно один раз."
  - "Вы разделяете проверку формата и бизнес-правила (диапазон, повторы) и находите причину ошибки по тесту."
  - "Вы проверяете крайние случаи: пустой ввод, все строки плохие, одинаковые баллы, границы диапазона."
concepts:
  introduces: []
  uses:
    - "cpp.getline"
    - "cpp.find"
    - "cpp.substr"
    - "cpp.npos"
    - "cpp.stoi"
    - "cpp.to-string"
    - "cpp.try-catch"
    - "cpp.throw"
    - "cpp.map"
    - "cpp.range-for"
    - "cpp.auto"
    - "cpp.struct"
    - "cpp.function"
    - "cpp.fixed"
    - "cpp.setprecision"
    - "cpp.static-cast"
    - "cpp.while"
    - "cpp.if"
    - "cpp.continue"
next:
  - "cpp.first-steps.how-cpp-runs"
tags:
  - "cpp"
  - "project"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Строка `Анна;` разбирается так:

        ```cpp
        std::size_t pos = line.find(';');
        std::string scoreText = line.substr(pos + 1);
        int score = std::stoi(scoreText);
        ```

        Что произойдёт?
      options:
        - "scoreText пуст, stoi бросает std::invalid_argument."
        - "score станет 0."
        - "substr бросает std::out_of_range, потому что после ; ничего нет."
        - "find вернёт npos."
      answer: 0
      explanation: "Позиция ; равна длине строки минус один, поэтому pos + 1 равно длине строки, и substr возвращает пустую строку (это допустимо). stoi на пустой строке бросает std::invalid_argument."
    - id: "q2"
      type: "single"
      prompt: |
        Какие из этих строк принимает проверка `std::to_string(std::stoi(text)) == text`?
      options:
        - "85 и -5, но не 085, +5, 5x и пустую строку."
        - "Все строки, начинающиеся с цифры."
        - "85, 085, +5."
        - "Только строки из одной цифры."
      answer: 0
      explanation: "Проверка требует, чтобы число после обратного преобразования выглядело в точности как исходная строка. Лишние нули, плюс, пробелы и мусор в конце её нарушают. Пустая строка вызывает исключение ещё в stoi."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        std::map<std::string, int> m;
        m["Борис"] = 5;
        m["Анна"] = 7;
        for (const auto& [name, v] : m) {
            std::cout << name << " ";
        }
        ```
      options:
        - "Анна Борис"
        - "Борис Анна"
        - "В порядке чтения нельзя предсказать."
        - "Не компилируется."
      answer: 0
      explanation: "std::map хранит ключи упорядоченными, поэтому обход идёт по алфавиту, независимо от порядка добавления."
    - id: "q4"
      type: "single"
      prompt: |
        Чем плохо это условие в цикле чтения?

        ```cpp
        if (scores.count(name) == 0) {
            skipped++;
            continue;
        }
        ```
        Задача: пропускать строку, если такое имя уже есть.
      options:
        - "Условие перевёрнуто: нужно count(name) == 1 (или > 0)."
        - "count нельзя вызывать у map."
        - "continue нельзя использовать в while."
        - "Всё верно."
      answer: 0
      explanation: "count возвращает 1, если ключ есть. Пропускать нужно именно тогда, поэтому условие должно быть count(name) == 1. В условии выше пропускаются все новые имена, а повторы принимаются."
exercise:
  id: "cpp.from-zero.mini-project.exercise"
  title: "Ведомость оценок"
  prompt: |
    Напишите программу целиком. Ввод - строки вида `имя;балл`, количество неизвестно.

    **Строка принимается**, если выполнены все условия:

    * в ней есть символ `;`, и перед первым `;` стоит непустое имя (имя может содержать пробелы);
    * всё, что после первого `;`, - целое число, записанное обычным образом (без плюса, пробелов и ведущих нулей) и помещающееся в `int`;
    * число лежит в диапазоне от 0 до 100;
    * имя ещё не встречалось среди **принятых** строк.

    Остальные непустые строки пропускаются и считаются. **Пустые строки** не считаются ни принятыми, ни пропущенными.

    **Вывод:**

    ```
    Ведомость
    Анна - 92
    Иван Петров - 85
    Принято: 2
    Пропущено: 1
    Лучший: Анна (92)
    Среднее: 88.50
    Сдали: 2 из 2
    ```

    * После заголовка `Ведомость` идут принятые записи по алфавиту имён (порядок `std::map`).
    * `Принято` и `Пропущено` печатаются всегда.
    * Строки `Лучший`, `Среднее` и `Сдали` печатаются только если принята хотя бы одна запись. При равных баллах лучшим считается первый по алфавиту. Среднее - с двумя знаками после точки. `Сдали` - число записей с баллом не меньше 60.
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Разбейте задачу: цикл чтения строк; проверка формата (есть ли ';', непустое ли имя); проверка повтора; проверка числа; итоги после цикла."
    - "Число проверяйте так же, как в уроке 22: stoi, затем сравнение std::to_string(value) с текстом и проверка диапазона. Любая ошибка (в том числе исключение от stoi) - это пропущенная строка; try/catch поставьте вокруг разбора."
    - "Принятые записи храните в std::map<std::string, int>. Повтор определяйте через scores.count(name)."
    - "Для среднего используйте std::fixed << std::setprecision(2) и static_cast<double>. Лучшего ищите при обходе map строгим сравнением score > bestScore."
  tests:
    - id: "basic"
      title: "Обычная ведомость"
      stdin: |
        Иван Петров;85
        Анна;92
        Олег;60
      expected: |
        Ведомость
        Анна - 92
        Иван Петров - 85
        Олег - 60
        Принято: 3
        Пропущено: 0
        Лучший: Анна (92)
        Среднее: 79.00
        Сдали: 3 из 3
      hint: "Имена с пробелом допустимы, строки выводятся по алфавиту, средний балл (85+92+60)/3 = 79.00."
    - id: "bad"
      title: "Некорректные строки"
      stdin: |
        Анна;92
        без точки с запятой
        ;50
        Борис;abc
        Вера;101
        Глеб;-5
        Даша;7x
        
        Анна;70
        Егор; 80
        Жанна;100
        Тим;99999999999
        Зоя;
        Мила;Лаптева;90
      expected: |
        Ведомость
        Анна - 92
        Жанна - 100
        Принято: 2
        Пропущено: 11
        Лучший: Жанна (100)
        Среднее: 96.00
        Сдали: 2 из 2
      hint: "Принимаются только строки с непустым именем, повторов нет, балл - целое число 0-100 в обычной записи; пустая строка не считается пропущенной."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: |
        Ведомость
        Принято: 0
        Пропущено: 0
      hidden: true
      hint: "Без строк печатаются заголовок, «Принято: 0» и «Пропущено: 0»."
    - id: "allbad"
      title: "Все строки плохие (скрытый)"
      stdin: |
        abc
        ;1
        x;y
      expected: |
        Ведомость
        Принято: 0
        Пропущено: 3
      hidden: true
      hint: "Если принятых нет, печатаются только заголовок, «Принято» и «Пропущено»: строки Лучший, Среднее и Сдали выводятся только при непустой ведомости."
    - id: "avg"
      title: "Среднее с округлением (скрытый)"
      stdin: |
        Борис;70
        Анна;70
        Вера;71
      expected: |
        Ведомость
        Анна - 70
        Борис - 70
        Вера - 71
        Принято: 3
        Пропущено: 0
        Лучший: Вера (71)
        Среднее: 70.33
        Сдали: 3 из 3
      hidden: true
      hint: "Среднее 70.33 (две цифры после точки), лучший - Вера."
    - id: "tie"
      title: "Равные баллы, нет перевода строки в конце (скрытый)"
      stdin: |-
        Борис;80
        Анна;80
      expected: |
        Ведомость
        Анна - 80
        Борис - 80
        Принято: 2
        Пропущено: 0
        Лучший: Анна (80)
        Среднее: 80.00
        Сдали: 2 из 2
      hidden: true
      hint: "При равных баллах лучшим становится первый по алфавиту; последняя строка без перевода строки тоже читается."
    - id: "bounds"
      title: "Границы 0 и 100 (скрытый)"
      stdin: |
        Ноль;0
        Сто;100
      expected: |
        Ведомость
        Ноль - 0
        Сто - 100
        Принято: 2
        Пропущено: 0
        Лучший: Сто (100)
        Среднее: 50.00
        Сдали: 1 из 2
      hidden: true
      hint: "Баллы 0 и 100 допустимы; сдали (балл не меньше 60) один из двух."
