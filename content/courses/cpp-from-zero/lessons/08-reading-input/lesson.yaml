id: "cpp.from-zero.reading-input"
title: "Ввод данных: std::cin"
goal: "Прочитать из ввода слово, целое и дробное число и использовать их в вычислениях."
difficulty: "intro"
estimatedMinutes: 35
prerequisites:
  - "cpp.from-zero.strings"
objectives:
  - "Прочитать значения командой std::cin >> в переменные типов int, double и std::string."
  - "Объяснить, что ввод разделяется пробелами и переводами строк, а std::cin >> читает ровно одно слово."
  - "Описать, что происходит с переменной, если введён неподходящий текст."
masteryCriteria:
  - "Вы объявляете переменную с начальным значением до чтения и читаете в неё через std::cin >>."
  - "Вы читаете несколько значений одной цепочкой std::cin >> a >> b >> c."
  - "Вы понимаете, что слово «Анна Иванова» целиком одним std::cin >> не читается."
concepts:
  introduces:
    - "cpp.cin"
    - "cpp.input-whitespace"
    - "cpp.input-failure"
  uses:
    - "cpp.variable"
    - "cpp.initialization"
    - "cpp.int"
    - "cpp.double"
    - "cpp.string"
    - "cpp.cout"
    - "cpp.output-chain"
    - "cpp.arithmetic"
    - "cpp.undefined-behavior"
next:
  - "cpp.from-zero.type-conversion"
tags:
  - "cpp"
  - "input"
  - "cin"
facts:
  - kind: "misconception"
    text: "«std::cin >> name прочитает всю строку» - нет. Оператор >> читает ровно одно слово и останавливается на первом пробеле или переводе строки. Для чтения целой строки существует std::getline (урок 21)."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Ввод: `Anna 30`. Что напечатает программа?

        ```cpp
        std::string name = "";
        int age = 0;
        std::cin >> name >> age;
        std::cout << age + 1 << " " << name << "\n";
        ```
      options:
        - "31 Anna"
        - "Anna 31"
        - "30 Anna"
        - "Программа не соберётся: нельзя читать в две переменные сразу."
      answer: 0
      explanation: "Цепочка std::cin >> name >> age читает слово Anna в name и число 30 в age. Затем выводится age + 1, то есть 31, и имя."
    - id: "q2"
      type: "single"
      prompt: |
        Ввод: `Анна Иванова`. Что окажется в переменной после `std::string name = ""; std::cin >> name;`?
      options:
        - "Анна"
        - "Анна Иванова"
        - "Иванова"
        - "Пустая строка"
      answer: 0
      explanation: "Оператор >> читает одно слово: до первого пробела или перевода строки. Остаток ввода (Иванова) остаётся непрочитанным."
    - id: "q3"
      type: "single"
      prompt: |
        Ввод: `abc`. Что делает `int n = 7; std::cin >> n;`?
      options:
        - "Чтение не удаётся: n становится 0, а дальнейшие чтения из std::cin ничего не меняют."
        - "n остаётся 7, и программа продолжает читать дальше как обычно."
        - "n становится кодом буквы a."
        - "Программа не компилируется."
      answer: 0
      explanation: "Текст abc не похож на число. Чтение завершается неудачей, n получает 0, а поток переходит в состояние ошибки: следующие чтения будут молча пропускаться. Проверять успех чтения мы научимся позже."
    - id: "q4"
      type: "single"
      prompt: "Почему перед чтением пишут `int count = 0;`, а не просто `int count;`?"
      options:
        - "Если чтение не удастся, переменная всё равно будет иметь известное значение, а не мусор."
        - "Без значения std::cin не может записать число."
        - "Это требование синтаксиса: иначе программа не соберётся."
        - "Так программа быстрее читает."
      answer: 0
      explanation: "Переменная без начального значения содержит мусор, а чтение мусора - неопределённое поведение. Начальное значение гарантирует, что при неудачном чтении программа хотя бы ведёт себя предсказуемо."
exercise:
  id: "cpp.from-zero.reading-input.exercise"
  title: "Счёт покупателя"
  prompt: |
    На вход приходят три значения: имя покупателя (одно слово), цена товара (целое число) и количество (целое число). Они могут быть разделены пробелами или переводами строк, например:

    ```
    Anna 45 3
    ```

    Прочитайте их в переменные `name`, `price`, `quantity`, посчитайте `total` как цену на количество и напечатайте:

    ```
    Покупатель: Anna
    Сумма: 135
    ```
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Чтение выполняется командой std::cin >> имя_переменной;. Значения читаются в том порядке, в котором они пришли."
    - "Можно читать всё одной цепочкой: std::cin >> name >> price >> quantity;"
    - "total считается так же, как любое выражение: int total = price * quantity; Эта строка должна стоять после чтения."
    - "Полностью: std::cin >> name >> price >> quantity; int total = price * quantity; Остальное в заготовке уже напечатано."
  tests:
    - id: "basic"
      title: "Всё в одной строке"
      stdin: |
        Anna 45 3
      expected: |
        Покупатель: Anna
        Сумма: 135
      hint: "Для ввода Anna 45 3 должно получиться: Покупатель: Anna и Сумма: 135 (45 * 3)."
    - id: "lines"
      title: "Значения на отдельных строках"
      stdin: |
        Bob
        120
        2
      expected: |
        Покупатель: Bob
        Сумма: 240
      hint: "std::cin >> пропускает пробелы и переводы строк, поэтому значения на разных строках читаются так же."
    - id: "zero"
      title: "Нулевое количество (скрытый)"
      stdin: |
        Zoe 7 0
      expected: |
        Покупатель: Zoe
        Сумма: 0
      hidden: true
      hint: "Сумма считается из прочитанных значений: цену нужно умножать на количество, а не подставлять число вручную."
    - id: "large"
      title: "Другие числа (скрытый)"
      stdin: |
        Max 1000 12
      expected: |
        Покупатель: Max
        Сумма: 12000
      hidden: true
      hint: "Проверяются разные входные данные: ничего нельзя записывать в код как готовое число."
