id: "cpp.from-zero.if-else"
title: "Условие if и else"
goal: "Выбирать, какой код выполнить, по значению логического условия."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "cpp.from-zero.comparison-and-logic"
objectives:
  - "Написать if, if/else и цепочку if / else if / else с условием типа bool."
  - "Объяснить, зачем нужны фигурные скобки блока и что произойдёт без них."
  - "Находить типичные ловушки: = вместо ==, точка с запятой после условия, неинициализированная переменная в одной из веток."
masteryCriteria:
  - "Вы выстраиваете цепочку else if от самого узкого условия к самому широкому и знаете, что выполнится ровно одна ветка."
  - "Вы всегда пишете фигурные скобки, даже если в ветке одна команда."
  - "Вы даёте переменной начальное значение до if, чтобы она не осталась с мусором ни в одной ветке."
concepts:
  introduces:
    - "cpp.if"
    - "cpp.else"
    - "cpp.block"
  uses:
    - "cpp.bool"
    - "cpp.int"
    - "cpp.double"
    - "cpp.string"
    - "cpp.comparison"
    - "cpp.logical-operators"
    - "cpp.operator-precedence"
    - "cpp.cin"
    - "cpp.output-chain"
    - "cpp.variable"
    - "cpp.initialization"
    - "cpp.undefined-behavior"
    - "cpp.warning"
    - "cpp.integer-division"
next:
  - "cpp.from-zero.switch"
tags:
  - "cpp"
  - "if"
  - "branching"
facts:
  - kind: "misconception"
    text: "«Если несколько условий в цепочке else if истинны, выполнятся все» - нет. Условия проверяются сверху вниз, выполняется только первая ветка с истинным условием, остальные пропускаются без проверки."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        int score = 85;
        if (score >= 90) {
            std::cout << "A\n";
        } else if (score >= 70) {
            std::cout << "B\n";
        } else if (score >= 50) {
            std::cout << "C\n";
        } else {
            std::cout << "D\n";
        }
        ```
      options:
        - "B"
        - "B и C"
        - "C"
        - "D"
      answer: 0
      explanation: "Условия проверяются сверху вниз. 85 >= 90 ложно, 85 >= 70 истинно: выполняется ветка B, и остальные ветки пропускаются, хотя 85 >= 50 тоже истинно."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        int n = 4;
        if (n > 10);
        {
            std::cout << "большое\n";
        }
        ```
      options:
        - "большое"
        - "Ничего."
        - "Программа не соберётся."
        - "Предупреждение компилятора и ничего на экране."
      answer: 0
      explanation: "Точка с запятой сразу после условия - это пустая команда, она и есть тело if. Блок в фигурных скобках после неё выполняется всегда. Компилятор предупреждает -Wempty-body, но программа собирается и печатает «большое»."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа и что скажет компилятор?

        ```cpp
        int x = 3;
        if (x = 0) {
            std::cout << "ноль\n";
        } else {
            std::cout << "не ноль\n";
        }
        std::cout << x << "\n";
        ```
      options:
        - "Предупреждение -Wparentheses; на экране «не ноль» и 0."
        - "Предупреждение; на экране «ноль» и 0."
        - "Ошибка компиляции: в условии нельзя присваивать."
        - "Предупреждений нет; на экране «не ноль» и 3."
      answer: 0
      explanation: "x = 0 присваивает и возвращает 0, то есть «ложь». Выполняется ветка else, а x теперь равен 0. Компилятор предупреждает об использовании присваивания как условия."
    - id: "q4"
      type: "single"
      prompt: |
        Чему будет равна label, если temperature равна 25?

        ```cpp
        std::string label;
        if (temperature < 10) {
            label = "холодно";
        } else if (temperature < 20) {
            label = "прохладно";
        } else {
            label = "тепло";
        }
        ```
      options:
        - "тепло"
        - "прохладно"
        - "холодно"
        - "Пустой строке."
      answer: 0
      explanation: "25 не меньше 10 и не меньше 20, поэтому условия двух первых веток ложны и выполняется else."
    - id: "q5"
      type: "single"
      prompt: "Зачем ставить фигурные скобки у if, даже если в ветке одна команда?"
      options:
        - "Чтобы случайно добавленная вторая команда не оказалась вне ветки при обманчивых отступах."
        - "Без скобок if вообще не работает."
        - "Скобки ускоряют программу."
        - "Скобки нужны только для else."
      answer: 0
      explanation: "Без скобок к if относится ровно одна команда, а отступы на выполнение не влияют. Компилятор предупреждает -Wmisleading-indentation, но надёжнее всегда писать блок."
exercise:
  id: "cpp.from-zero.if-else.exercise"
  title: "Скидка по сумме покупки"
  prompt: |
    Магазин даёт скидку в зависимости от суммы покупки (целое число рублей):

    * меньше 1000 - скидки нет (0%);
    * от 1000 до 4999 включительно - 5%;
    * от 5000 и больше - 10%.

    Программа читает сумму, определяет процент скидки в переменную `percent` и печатает его, а затем сумму к оплате. Сумма к оплате считается целочисленно: `total - total * percent / 100`. Например, для `2000`:

    ```
    Скидка: 5%
    К оплате: 1900
    ```

    Чтение и вывод в заготовке написаны, допишите выбор процента.
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Нужны три случая, значит, цепочка if / else if / else. Переменная percent уже объявлена с нулём."
    - "Проверяйте от большего порога к меньшему: сначала total >= 5000, затем total >= 1000, иначе скидки нет. Тогда второе условие не нужно ограничивать сверху."
    - "Внутри ветки присваивайте: percent = 10; percent = 5;. Для случая «скидки нет» ветку else можно не писать, потому что percent уже 0."
    - "if (total >= 5000) { percent = 10; } else if (total >= 1000) { percent = 5; }"
  tests:
    - id: "none"
      title: "Маленькая покупка"
      stdin: |
        500
      expected: |
        Скидка: 0%
        К оплате: 500
      hint: "При сумме меньше 1000 скидки нет, к оплате вся сумма."
    - id: "middle"
      title: "Средняя покупка"
      stdin: |
        2000
      expected: |
        Скидка: 5%
        К оплате: 1900
      hint: "2000 попадает в диапазон от 1000 до 4999: скидка 5%, 2000 - 2000 * 5 / 100 = 1900."
    - id: "big"
      title: "Крупная покупка (скрытый)"
      stdin: |
        10000
      expected: |
        Скидка: 10%
        К оплате: 9000
      hidden: true
      hint: "От 5000 и выше действует скидка 10%."
    - id: "border-1000"
      title: "Границы 999 и 1000 (скрытый)"
      stdin: |
        1000
      expected: |
        Скидка: 5%
        К оплате: 950
      hidden: true
      hint: "Ровно 1000 уже даёт скидку 5% (условие >=, а не >)."
    - id: "border-5000"
      title: "Границы 4999 и 5000 (скрытый)"
      stdin: |
        5000
      expected: |
        Скидка: 10%
        К оплате: 4500
      hidden: true
      hint: "Ровно 5000 уже даёт скидку 10%: порог входит в диапазон."
    - id: "below-1000"
      title: "Ровно 999 (скрытый)"
      stdin: |
        999
      expected: |
        Скидка: 0%
        К оплате: 999
      hidden: true
      hint: "999 меньше порога 1000, скидки нет."
