id: "cpp.from-zero.arithmetic"
title: "Арифметика: деление целых, остаток и переполнение"
goal: "Выполнить вычисления с int и double и объяснить, чем деление целых отличается от деления дробных."
difficulty: "intro"
estimatedMinutes: 35
prerequisites:
  - "cpp.from-zero.basic-types"
objectives:
  - "Использовать операции + - * / % и скобки, учитывая приоритет."
  - "Предсказывать результат деления целых чисел и остаток."
  - "Записывать изменение переменной через +=, -=, *=, ++ и --."
  - "Объяснить, чем опасно переполнение int, и выбрать long long для больших сумм."
masteryCriteria:
  - "Вы знаете, что 17 / 5 равно 3, а 17 % 5 равно 2."
  - "Вы получаете дробный результат, если хотя бы один операнд - double."
  - "Вы используете long long, когда сумма или произведение могут превысить два миллиарда."
concepts:
  introduces:
    - "cpp.arithmetic"
    - "cpp.integer-division"
    - "cpp.remainder"
    - "cpp.compound-assignment"
    - "cpp.integer-overflow"
    - "cpp.long-long"
  uses:
    - "cpp.variable"
    - "cpp.assignment"
    - "cpp.int"
    - "cpp.double"
    - "cpp.initialization"
    - "cpp.undefined-behavior"
    - "cpp.output-chain"
    - "cpp.warning"
next:
  - "cpp.from-zero.strings"
tags:
  - "cpp"
  - "arithmetic"
  - "integer-division"
  - "overflow"
facts:
  - kind: "misconception"
    text: "«Переполнение int просто заворачивается в отрицательное число» - в C++ это так только для беззнаковых типов. Для знаковых типов, включая int, переполнение - неопределённое поведение, и оптимизатор вправе предполагать, что его не бывает."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        std::cout << 17 / 5 << " " << 17 % 5 << "\n";
        ```
      options:
        - "3 2"
        - "3.4 2"
        - "3 3"
        - "2 3"
      answer: 0
      explanation: "Оба операнда целые, поэтому / даёт целую часть частного (3), а % - остаток (2): 17 = 5 * 3 + 2."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        double d = 7 / 2;
        std::cout << d << "\n";
        ```
      options:
        - "3"
        - "3.5"
        - "4"
        - "Ошибка компиляции"
      answer: 0
      explanation: "Деление 7 / 2 выполняется до присваивания, и оба числа целые, поэтому результат 3. Только потом значение превращается в double. Чтобы получить 3.5, напишите 7.0 / 2."
    - id: "q3"
      type: "single"
      prompt: |
        Чему равна переменная x?

        ```cpp
        int x = 10;
        x += 5;
        x *= 2;
        ```
      options:
        - "30"
        - "20"
        - "25"
        - "15"
      answer: 0
      explanation: "x += 5 делает 15, затем x *= 2 удваивает: 30."
    - id: "q4"
      type: "single"
      prompt: "Что произойдёт, если в int сложить 2147483647 и 1?"
      options:
        - "Неопределённое поведение: стандарт не обещает никакого результата."
        - "Всегда получится 2147483648."
        - "Программа гарантированно выбросит исключение."
        - "Результат гарантированно -2147483648."
      answer: 0
      explanation: "Переполнение знакового int - неопределённое поведение. На практике часто получается отрицательное число, но рассчитывать на это нельзя."
    - id: "q5"
      type: "single"
      prompt: "Покупатель берёт 3 000 000 штук товара по цене 1 000 руб. Какой тип выбрать для суммы?"
      options:
        - "long long"
        - "int"
        - "bool"
        - "char"
      answer: 0
      explanation: "Сумма 3 000 000 000 больше двух миллиардов, и int её не вместит. long long хранит числа примерно до 9 · 10^18."
exercise:
  id: "cpp.from-zero.arithmetic.exercise"
  title: "Яблоки в ящиках"
  prompt: |
    В заготовке заданы число яблок `apples = 47`, вместимость ящика `perBox = 6` и цена яблока `price = 35`. Допишите вычисления:

    * `boxes` - сколько ящиков заполнится полностью (деление целых);
    * `left` - сколько яблок останется вне ящиков (остаток от деления);
    * `total` - стоимость всех яблок; затем уменьшите `total` на скидку `145` оператором `-=`.

    Программа должна напечатать:

    ```
    Полных ящиков: 7
    Остаток яблок: 5
    Стоимость: 1500
    ```
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Для целой части частного используется /, для остатка - %. Оба знака работают с int."
    - "boxes = apples / perBox; left = apples % perBox; total = apples * price;"
    - "Скидка: total -= 145; Эта строка должна стоять после вычисления total и до вывода."
    - "47 / 6 = 7, 47 % 6 = 5, 47 * 35 = 1645, 1645 - 145 = 1500."
  tests:
    - id: "basic"
      title: "Ящики, остаток и стоимость"
      stdin: ""
      expected: |
        Полных ящиков: 7
        Остаток яблок: 5
        Стоимость: 1500
      hint: "Полных ящиков 47 / 6 = 7, остаток 47 % 6 = 5, стоимость 47 * 35 - 145 = 1500."
    - id: "exact"
      title: "Точный вывод (скрытый)"
      stdin: ""
      expected: |
        Полных ящиков: 7
        Остаток яблок: 5
        Стоимость: 1500
      hidden: true
      hint: "Проверяется точный вывод: ящики - целая часть деления, остаток - операция %, стоимость считается с вычетом скидки 145 после умножения."
