id: "cpp.from-zero.functions"
title: "Функции"
goal: "Выделять повторяющийся кусок кода в функцию с параметрами и результатом."
difficulty: "easy"
estimatedMinutes: 50
prerequisites:
  - "cpp.from-zero.loop-control"
objectives:
  - "Написать функцию с параметрами и значением результата и вызвать её из main."
  - "Объяснить разницу между функцией, возвращающей значение, и функцией void."
  - "Объяснить область видимости локальных переменных и порядок объявления функций."
masteryCriteria:
  - "Вы пишете тип результата, имя, параметры с типами и return в каждой ветке, если функция возвращает значение."
  - "Вы располагаете функции выше main или объявляете их заранее."
  - "Вы понимаете, что параметр - копия значения, и что изменение копии не меняет переменную вызывающего."
concepts:
  introduces:
    - "cpp.function"
    - "cpp.parameter"
    - "cpp.return"
    - "cpp.void"
    - "cpp.scope"
    - "cpp.declaration-order"
  uses:
    - "cpp.main"
    - "cpp.int"
    - "cpp.double"
    - "cpp.bool"
    - "cpp.string"
    - "cpp.if"
    - "cpp.else"
    - "cpp.for"
    - "cpp.comparison"
    - "cpp.logical-operators"
    - "cpp.remainder"
    - "cpp.cin"
    - "cpp.output-chain"
    - "cpp.compile-error"
    - "cpp.warning"
    - "cpp.undefined-behavior"
    - "cpp.block"
next:
  - "cpp.from-zero.references"
tags:
  - "cpp"
  - "functions"
  - "scope"
facts:
  - kind: "misconception"
    text: "«Функция, которая дошла до конца без return, вернёт ноль» - нет. Для функций, кроме main, это неопределённое поведение: результат непредсказуем и может зависеть от уровня оптимизации. Компилятор предупреждает -Wreturn-type, и это предупреждение нельзя оставлять."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        int twice(int n) {
            return n * 2;
        }

        int main() {
            std::cout << twice(twice(3)) << "\n";
        }
        ```
      options:
        - "12"
        - "6"
        - "9"
        - "Ошибка компиляции."
      answer: 0
      explanation: "Сначала вычисляется внутренний вызов twice(3), результат 6; он становится аргументом внешнего вызова: twice(6) = 12."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        void bump(int n) {
            n = n + 1;
        }

        int main() {
            int x = 5;
            bump(x);
            std::cout << x << "\n";
        }
        ```
      options:
        - "5"
        - "6"
        - "0"
        - "Ошибка компиляции."
      answer: 0
      explanation: "Параметр n - копия значения x. Изменение копии внутри функции не влияет на x в main, поэтому x остаётся 5. Как менять переменную вызывающего, разберёт следующий урок."
    - id: "q3"
      type: "single"
      prompt: |
        Что произойдёт при сборке?

        ```cpp
        int main() {
            std::cout << square(4) << "\n";
        }

        int square(int n) {
            return n * n;
        }
        ```
      options:
        - "Ошибка: use of undeclared identifier 'square' - функция определена ниже вызова."
        - "Напечатается 16."
        - "Предупреждение, но программа соберётся."
        - "Напечатается 0."
      answer: 0
      explanation: "Компилятор читает файл сверху вниз. На момент вызова он ещё не видел square и не знает её. Определение нужно поставить выше main или добавить объявление int square(int n); заранее."
    - id: "q4"
      type: "single"
      prompt: |
        Что не так с функцией?

        ```cpp
        int sign(int n) {
            if (n > 0) {
                return 1;
            } else if (n < 0) {
                return -1;
            }
        }
        ```
      options:
        - "При n == 0 функция доходит до конца без return: результат непредсказуем (неопределённое поведение)."
        - "Функция вернёт 0 при n == 0."
        - "Нельзя писать два return."
        - "Нельзя использовать else if внутри функции."
      answer: 0
      explanation: "В ветке n == 0 нет return. Компилятор предупреждает -Wreturn-type, а в запущенной программе результат непредсказуем. Нужно добавить return 0; в конце."
    - id: "q5"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        void show(int n) {
            int result = n * 10;
        }

        int main() {
            show(4);
            std::cout << result << "\n";
        }
        ```
      options:
        - "Ошибка компиляции: result существует только внутри show."
        - "40"
        - "0"
        - "4"
      answer: 0
      explanation: "Переменная result локальная: она создаётся при вызове show и исчезает при выходе. В main её не видно. Передать значение наружу можно через return."
exercise:
  id: "cpp.from-zero.functions.exercise"
  title: "Три функции для main"
  prompt: |
    В заготовке написан готовый `main`: он читает пять целых чисел `year`, `a`, `b`, `c`, `n` и вызывает три функции, тела которых нужно дописать. Менять `main`, имена функций и типы параметров нельзя.

    * `bool isLeapYear(int year)` возвращает `true`, если год високосный: он делится на 4, но не делится на 100, либо делится на 400.
    * `int maxOfThree(int a, int b, int c)` возвращает наибольшее из трёх чисел.
    * `void printStars(int n)` печатает `n` звёздочек подряд и переводит строку (считайте, что `n` не меньше 1).

    Например, для ввода `2024 3 9 5 4`:

    ```
    Високосный
    Наибольшее: 9
    ****
    ```

    Тесты запускают программу с разными числами, поэтому функции не должны зависеть от конкретных значений.
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Функция, которая возвращает значение, заканчивается командой return с этим значением. Для isLeapYear результат - выражение типа bool."
    - "Високосный год: year % 4 == 0 && (year % 100 != 0 || year % 400 == 0). Скобки вокруг || нужны."
    - "Для maxOfThree заведите переменную best = a, затем сравните с b и c: if (b > best) { best = b; }. В конце return best;"
    - "printStars ничего не возвращает: внутри цикл for от 0 до n, в каждом обороте std::cout << \"*\";, после цикла std::cout << \"\\n\";"
  tests:
    - id: "basic"
      title: "2024 год"
      stdin: |
        2024 3 9 5 4
      expected: |
        Високосный
        Наибольшее: 9
        ****
      hint: "2024 делится на 4 и не делится на 100: високосный; наибольшее из 3, 9, 5 - девять; четыре звёздочки."
    - id: "century"
      title: "1900 год"
      stdin: |
        1900 -1 -5 -3 1
      expected: |
        Обычный
        Наибольшее: -1
        *
      hint: "1900 делится на 100, но не на 400: обычный год. Наибольшее из отрицательных чисел: -1."
    - id: "y2000"
      title: "2000 год (скрытый)"
      stdin: |
        2000 7 7 7 3
      expected: |
        Високосный
        Наибольшее: 7
        ***
      hidden: true
      hint: "2000 делится на 400: високосный. Если все числа равны, наибольшее равно им."
    - id: "y2023"
      title: "2023 год (скрытый)"
      stdin: |
        2023 10 20 30 2
      expected: |
        Обычный
        Наибольшее: 30
        **
      hidden: true
      hint: "2023 не делится на 4: обычный. Наибольшее может стоять на последнем месте (c)."
    - id: "max-first"
      title: "Наибольшее первым (скрытый)"
      stdin: |
        2100 50 20 30 5
      expected: |
        Обычный
        Наибольшее: 50
        *****
      hidden: true
      hint: "2100 делится на 100, но не на 400: обычный. Наибольшее может быть первым числом a."
    - id: "max-middle"
      title: "Наибольшее вторым (скрытый)"
      stdin: |
        2016 1 99 50 1
      expected: |
        Високосный
        Наибольшее: 99
        *
      hidden: true
      hint: "Проверьте все три числа: наибольшее может стоять в середине (b)."
