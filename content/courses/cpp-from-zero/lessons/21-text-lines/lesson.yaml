id: "cpp.from-zero.text-lines"
title: "Строки ввода: getline, find и substr"
goal: "Читать ввод строка за строкой и разбирать строку вида «имя;балл» на части."
difficulty: "easy"
estimatedMinutes: 55
prerequisites:
  - "cpp.from-zero.map"
objectives:
  - "Прочитать строку целиком, вместе с пробелами, через std::getline и обработать ввод до конца."
  - "Объяснить, почему getline после >> получает пустую строку, и как это обойти."
  - "Найти разделитель через find, проверить результат на std::string::npos и вырезать части через substr."
masteryCriteria:
  - "Вы читаете строки циклом while (std::getline(std::cin, line)) и пропускаете пустые строки."
  - "Вы делите строку по разделителю: часть до него через substr(0, pos), часть после - через substr(pos + 1)."
  - "Вы сравниваете строки через == и < и знаете, что регистр различается."
concepts:
  introduces:
    - "cpp.getline"
    - "cpp.string-compare"
    - "cpp.find"
    - "cpp.substr"
    - "cpp.npos"
  uses:
    - "cpp.string"
    - "cpp.string-size"
    - "cpp.string-index"
    - "cpp.string-concat"
    - "cpp.cin"
    - "cpp.input-whitespace"
    - "cpp.stoi"
    - "cpp.comparison"
    - "cpp.while"
    - "cpp.if"
    - "cpp.read-until-eof"
next:
  - "cpp.from-zero.exceptions"
tags:
  - "cpp"
  - "strings"
  - "input"
facts:
  - kind: "misconception"
    text: "«std::getline прочитает следующую строку после числа» - не всегда. После std::cin >> x в потоке остаётся символ перевода строки, и первый getline получает пустой остаток текущей строки. Перед getline этот остаток нужно прочитать и отбросить."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Ввод состоит из двух строк: `Анна Лаптева` и `Борис`. Что напечатает программа?

        ```cpp
        std::string a = "";
        std::string b = "";
        std::cin >> a;
        std::getline(std::cin, b);
        std::cout << "[" << a << "][" << b << "]\n";
        ```
      options:
        - "[Анна][ Лаптева]"
        - "[Анна Лаптева][Борис]"
        - "[Анна][Борис]"
        - "[Анна Лаптева][]"
      answer: 0
      explanation: ">> читает одно слово «Анна» и останавливается на пробеле. getline забирает остаток строки вместе с начальным пробелом: « Лаптева»."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        std::string line = "Ivanov;85";
        std::size_t pos = line.find(';');
        std::cout << pos << " " << line.substr(0, pos) << " " << line.substr(pos + 1) << "\n";
        ```
      options:
        - "6 Ivanov 85"
        - "7 Ivanov 85"
        - "6 Ivanov ;85"
        - "9 Ivanov 85"
      answer: 0
      explanation: "Позиции считаются с нуля: «Ivanov» занимает позиции 0-5, точка с запятой стоит на позиции 6. substr(0, 6) - шесть символов до разделителя, substr(7) - всё после него."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        std::string s = "abc";
        if (s.find(';') == std::string::npos) {
            std::cout << "нет разделителя\n";
        } else {
            std::cout << "есть\n";
        }
        ```
      options:
        - "нет разделителя"
        - "есть"
        - "Программа не компилируется."
        - "Программа падает."
      answer: 0
      explanation: "Если символ не найден, find возвращает специальное значение std::string::npos. Сравнение с ним - правильный способ проверить, нашёлся ли разделитель."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        std::string a = "Anna";
        std::string b = "anna";
        std::cout << (a == b) << (a < b) << "\n";
        ```
      options:
        - "01"
        - "10"
        - "11"
        - "00"
      answer: 0
      explanation: "Строки сравниваются по кодам символов, регистр различается: «Anna» не равна «anna». Код заглавной A меньше кода строчной a, поэтому a < b истинно."
exercise:
  id: "cpp.from-zero.text-lines.exercise"
  title: "Ведомость из строк"
  prompt: |
    На вход приходят строки вида `имя;балл`, например `Иван Петров;85`. Имя может содержать пробелы, балл - целое число. Строки корректны, но между ними могут встречаться пустые строки: их нужно пропускать. Количество строк неизвестно.

    Для каждой непустой строки напечатайте `имя - балл`, а в конце - лучшего студента: `Лучший: имя (балл)`. Если у нескольких студентов одинаковый наибольший балл, выберите того, кто встретился раньше. Если данных нет, напечатайте одну строку `Данных нет`.

    Пример для ввода
    ```
    Иван Петров;85
    Анна;92
    ```
    вывод:
    ```
    Иван Петров - 85
    Анна - 92
    Лучший: Анна (92)
    ```
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Читайте строки циклом: while (std::getline(std::cin, line)) { ... } Пустую строку пропустите через if (line.empty()) { continue; }"
    - "Найдите разделитель: std::size_t pos = line.find(';'); Имя - line.substr(0, pos), балл - std::stoi(line.substr(pos + 1))."
    - "Лучшего обновляйте только при строгом превосходстве: score > bestScore. Но первую запись нужно принять всегда - используйте счётчик count: если count == 0, она лучшая."
    - "После обработки count увеличивается; если в конце count равен 0, напечатайте «Данных нет»."
  tests:
    - id: "basic"
      title: "Две строки"
      stdin: |
        Иван Петров;85
        Анна;92
      expected: |
        Иван Петров - 85
        Анна - 92
        Лучший: Анна (92)
      hint: "Имя может содержать пробел, поэтому читайте строку целиком, а делите по символу ;."
    - id: "blank"
      title: "Пустые строки между записями"
      stdin: |

        Анна;70

        Олег;60
      expected: |
        Анна - 70
        Олег - 60
        Лучший: Анна (70)
      hint: "Пустые строки пропускаются и не считаются записями."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: |
        Данных нет
      hidden: true
      hint: "Без записей печатается одна строка «Данных нет»."
    - id: "tie"
      title: "Одинаковые баллы (скрытый)"
      stdin: |
        Олег;90
        Анна;90
        Мария;80
      expected: |
        Олег - 90
        Анна - 90
        Мария - 80
        Лучший: Олег (90)
      hidden: true
      hint: "При равных баллах лучшим остаётся тот, кто встретился раньше: сравнивайте строго (>)."
    - id: "single"
      title: "Единственная запись (скрытый)"
      stdin: |
        Мария Сергеевна Орлова;100
      expected: |
        Мария Сергеевна Орлова - 100
        Лучший: Мария Сергеевна Орлова (100)
      hidden: true
      hint: "Первая запись всегда становится лучшей, даже если её балл не больше нуля."
