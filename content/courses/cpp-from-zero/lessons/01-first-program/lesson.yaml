id: "cpp.from-zero.first-program"
title: "Первая программа"
goal: "Запустить программу на C++ и изменить строку, которую она печатает."
difficulty: "intro"
estimatedMinutes: 25
prerequisites: []
objectives:
  - "Объяснить, что такое программа, исходный код и компилятор."
  - "Назвать, что делает каждая из трёх обязательных частей минимальной программы на C++ и за что отвечает ваша часть."
  - "Вывести текст на экран командой std::cout << и записать строку в кавычках."
masteryCriteria:
  - "Ваша программа печатает ровно заданную строку, включая регистр и знаки препинания."
  - "Вы отличаете текст внутри кавычек (его печатают как есть) от имён (их вызывают)."
  - "Вы пишете свои команды внутри фигурных скобок main и заканчиваете каждую точкой с запятой."
concepts:
  introduces:
    - "cpp.program"
    - "cpp.compiler"
    - "cpp.include"
    - "cpp.main"
    - "cpp.cout"
    - "cpp.string-literal"
    - "cpp.std-prefix"
next:
  - "cpp.from-zero.compiler-errors"
tags:
  - "cpp"
  - "program"
  - "cout"
  - "compiler"
facts:
  - kind: "misconception"
    text: "«Чтобы программа заработала, нужно понимать каждую строку её начала» - нет. Для первых программ достаточно знать, где в каркасе писать свои команды; смысл #include, int и std:: раскрывается по мере того, как для него появляется материал."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что делает компилятор?"
      options:
        - "Переводит текст программы в машинные команды процессора и сообщает об ошибках в тексте."
        - "Исправляет ошибки в тексте программы."
        - "Печатает текст программы на экран."
        - "Выполняет программу строка за строкой, ничего не создавая."
      answer: 0
      explanation: "Компилятор читает исходный код и создаёт из него файл, который выполняет процессор. Ошибки он только сообщает: исправляет их человек."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        #include <iostream>

        int main() {
            std::cout << "раз\n";
            std::cout << "два\n";
        }
        ```
      options:
        - "раздва"
        - "раз два (в одной строке)"
        - "раз и на следующей строке два"
        - "два и на следующей строке раз"
      answer: 2
      explanation: "Команды внутри main выполняются сверху вниз, а \\n после текста переводит строку. Поэтому «раз» и «два» оказываются на разных строках в этом порядке."
    - id: "q3"
      type: "single"
      prompt: "В команде std::cout << \"Привет\\n\" в конце пропущена точка с запятой. Что произойдёт?"
      options:
        - "Компилятор остановит сборку с сообщением вида error: expected ';' after expression."
        - "Программа напечатает Привет без точки с запятой."
        - "Компилятор сам поставит точку с запятой."
        - "Программа соберётся, но выдаст предупреждение."
      answer: 0
      explanation: "В C++ каждая команда заканчивается точкой с запятой. Компилятор сам её не добавляет и останавливает сборку: программа не запускается."
    - id: "q4"
      type: "single"
      prompt: "Что означает строка #include <iostream> в начале программы?"
      options:
        - "Подключить готовую часть, которая умеет вводить и выводить текст (std::cout)."
        - "Напечатать слово iostream."
        - "Запустить программу в потоковом режиме."
        - "Указать, что в программе есть ошибки."
      answer: 0
      explanation: "Строка с #include подключает готовый кусок библиотеки. Без неё компилятор не знает имени std::cout и сообщает об ошибке."
exercise:
  id: "cpp.from-zero.first-program.exercise"
  title: "Измените выводимую строку"
  prompt: |
    В редакторе уже есть рабочая программа: она печатает приветствие. Измените её так, чтобы она печатала ровно одну строку:

    ```
    Я учусь программировать на C++!
    ```

    Менять нужно только текст в кавычках. Регистр букв, пробелы и восклицательный знак важны. Сочетание `\n` в конце текста - это перевод строки; оставьте его.
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Найдите в программе строку со std::cout: нужный текст находится между кавычками."
    - "Замените всё, что стоит между кавычками, кроме \\n в конце, на нужную фразу. Сами кавычки, << и точку с запятой оставьте."
    - "Должно получиться std::cout << \"Я учусь программировать на C++!\\n\";"
  tests:
    - id: "basic"
      title: "Печатается нужная фраза"
      stdin: ""
      expected: |
        Я учусь программировать на C++!
      hint: "Программа должна напечатать одну строку: Я учусь программировать на C++!"
    - id: "exact"
      title: "Точный текст и одна строка (скрытый)"
      stdin: ""
      expected: |
        Я учусь программировать на C++!
      hidden: true
      hint: "Проверяется точное совпадение: заглавная Я, пробелы между словами, символы C++ с двумя плюсами, восклицательный знак в конце и никаких лишних строк."
