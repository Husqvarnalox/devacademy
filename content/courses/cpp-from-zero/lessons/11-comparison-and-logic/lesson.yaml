id: "cpp.from-zero.comparison-and-logic"
title: "Сравнения и логические операции"
goal: "Сравнивать значения и объединять результаты сравнений операциями «и», «или», «не»."
difficulty: "intro"
estimatedMinutes: 35
prerequisites:
  - "cpp.from-zero.formatted-output"
objectives:
  - "Записать сравнения ==, !=, <, >, <=, >= и получить значение типа bool."
  - "Объединить условия операторами &&, || и !, учитывая приоритет и вычисление «до первого ответа»."
  - "Объяснить, почему дробные числа нельзя сравнивать через == и почему size() не сравнивают с отрицательным int."
masteryCriteria:
  - "Вы пишете диапазон как два сравнения: x >= a && x < b, а не a <= x < b."
  - "Вы ставите скобки, когда смешиваете && и ||."
  - "Вы отличаете == (сравнение) от = (присваивание)."
concepts:
  introduces:
    - "cpp.comparison"
    - "cpp.logical-operators"
    - "cpp.operator-precedence"
    - "cpp.short-circuit"
    - "cpp.float-comparison"
    - "cpp.sign-compare"
  uses:
    - "cpp.bool"
    - "cpp.int"
    - "cpp.double"
    - "cpp.string"
    - "cpp.string-size"
    - "cpp.arithmetic"
    - "cpp.integer-division"
    - "cpp.type-conversion"
    - "cpp.static-cast"
    - "cpp.cin"
    - "cpp.output-chain"
    - "cpp.warning"
    - "cpp.compile-error"
next:
  - "cpp.from-zero.if-else"
tags:
  - "cpp"
  - "comparison"
  - "logic"
  - "bool"
facts:
  - kind: "misconception"
    text: "«Запись 1 < x < 10 проверяет, что x между 1 и 10» - нет. Сначала вычисляется 1 < x и получается bool (0 или 1), и уже его сравнивают с 10. Поэтому такая запись почти всегда даёт истину. Правильно: 1 < x && x < 10."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        int age = 18;
        std::cout << std::boolalpha << (age >= 18 && age < 65) << "\n";
        ```
      options:
        - "true"
        - "false"
        - "1"
        - "Программа не соберётся."
      answer: 0
      explanation: "18 >= 18 истинно и 18 < 65 истинно, значит && даёт true. Манипулятор std::boolalpha заставляет bool печататься словом."
    - id: "q2"
      type: "single"
      prompt: "Как правильно записать условие «x находится между 1 и 10, включая 1 и исключая 10»?"
      options:
        - "x >= 1 && x < 10"
        - "1 <= x < 10"
        - "x >= 1 || x < 10"
        - "x >= 1 & < 10"
      answer: 0
      explanation: "Каждое сравнение пишется отдельно, и между ними ставится &&. Запись 1 <= x < 10 сравнивает bool с числом 10 и не проверяет диапазон. А с || условие выполнялось бы для любого числа."
    - id: "q3"
      type: "single"
      prompt: |
        Чему равно выражение?

        ```cpp
        true || false && false
        ```
      options:
        - "true: && вычисляется раньше ||, получается true || false."
        - "false: сначала выполняется ||, потом &&."
        - "Ошибка компиляции."
        - "Нельзя определить."
      answer: 0
      explanation: "Приоритет у && выше, чем у ||. Сначала false && false даёт false, затем true || false даёт true. Компилятор при этом предупреждает и просит поставить скобки: пишите их сами, чтобы выражение читалось однозначно."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа и почему она не упадёт?

        ```cpp
        int d = 0;
        std::cout << std::boolalpha << (d != 0 && 10 / d > 1) << "\n";
        ```
      options:
        - "false: левая часть && ложна, правая часть даже не вычисляется."
        - "Деление на ноль остановит программу."
        - "true: 10 / 0 бесконечно, а бесконечность больше единицы."
        - "Ошибка компиляции."
      answer: 0
      explanation: "Операторы && и || вычисляют правую часть только если левая не определила результат. Если d != 0 ложно, то весь && уже ложен, и деление 10 / d не выполняется."
    - id: "q5"
      type: "single"
      prompt: |
        Какой результат у сравнения и почему?

        ```cpp
        int i = -1;
        std::string s = "abc";
        std::cout << (i < s.size()) << "\n";
        ```
      options:
        - "0: -1 превращается в огромное беззнаковое число, и компилятор предупреждает -Wsign-compare."
        - "1: -1 меньше 3."
        - "Программа не соберётся."
        - "Это неопределённое поведение."
      answer: 0
      explanation: "size() возвращает беззнаковое число. При сравнении -1 превращается в беззнаковое (очень большое) и перестаёт быть меньше 3. Результат определён, но неожиданен; компилятор предупреждает. Исправление: static_cast<int>(s.size())."
exercise:
  id: "cpp.from-zero.comparison-and-logic.exercise"
  title: "Условия как значения"
  prompt: |
    На вход приходят два целых числа: возраст `age` и час `hour` (от 0 до 23). Вычислите три логических значения и напечатайте их словами `true` и `false`:

    * `adult` - возраст не меньше 18;
    * `working` - час не меньше 9 и меньше 18 (девять включительно, восемнадцать нет);
    * `both` - одновременно взрослый и рабочее время.

    Например, для ввода `20 10`:

    ```
    Взрослый: true
    Рабочее время: true
    Оба условия: true
    ```

    Вывод в заготовке уже написан, допишите три выражения.
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Сравнение само по себе - значение типа bool: bool adult = age >= 18;"
    - "Диапазон записывают двумя сравнениями с &&: hour >= 9 && hour < 18. Запись 9 <= hour < 18 не работает."
    - "Третье значение составляется из двух готовых: bool both = adult && working;"
    - "Границы: 18 лет - взрослый (>=), 9 часов - рабочее время (>=), а 18 часов - уже нет (<)."
  tests:
    - id: "basic"
      title: "Взрослый днём"
      stdin: |
        20 10
      expected: |
        Взрослый: true
        Рабочее время: true
        Оба условия: true
      hint: "20 >= 18, а час 10 попадает в диапазон от 9 до 18: все три значения истинны."
    - id: "child"
      title: "Ребёнок днём"
      stdin: |
        15 10
      expected: |
        Взрослый: false
        Рабочее время: true
        Оба условия: false
      hint: "Возраст 15 меньше 18, поэтому adult ложно, а both тоже ложно, хотя рабочее время истинно."
    - id: "border-18"
      title: "Граница 18 часов (скрытый)"
      stdin: |
        30 18
      expected: |
        Взрослый: true
        Рабочее время: false
        Оба условия: false
      hidden: true
      hint: "Час 18 уже не входит в рабочее время: верхняя граница строгая (hour < 18)."
    - id: "border-low"
      title: "Нижние границы (скрытый)"
      stdin: |
        18 9
      expected: |
        Взрослый: true
        Рабочее время: true
        Оба условия: true
      hidden: true
      hint: "Нижние границы включаются: 18 лет - уже взрослый (>=), 9 часов - уже рабочее время (>=)."
    - id: "night"
      title: "Ночью ребёнок (скрытый)"
      stdin: |
        17 23
      expected: |
        Взрослый: false
        Рабочее время: false
        Оба условия: false
      hidden: true
      hint: "Если оба условия ложны, то и both ложно."
