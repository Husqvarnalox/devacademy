id: "cpp.from-zero.formatted-output"
title: "Форматированный вывод: знаки после точки и ширина"
goal: "Печатать дробные числа с нужным числом знаков после точки и выравнивать значения по ширине."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "cpp.from-zero.type-conversion"
objectives:
  - "Включить вывод с фиксированным числом знаков после точки: std::fixed << std::setprecision(n)."
  - "Выровнять значение по ширине (std::setw) и по краю (std::left, std::right)."
  - "Объяснить, какие настройки вывода действуют постоянно, а какие - только на следующее значение."
masteryCriteria:
  - "Вы пишете std::fixed вместе с std::setprecision, когда нужны знаки после точки."
  - "Вы помните, что std::setw действует на одно следующее значение."
  - "Вы не выравниваете русский текст через std::setw, потому что ширина считается в байтах."
concepts:
  introduces:
    - "cpp.fixed"
    - "cpp.setprecision"
    - "cpp.setw"
    - "cpp.alignment"
    - "cpp.iomanip"
  uses:
    - "cpp.double"
    - "cpp.int"
    - "cpp.string"
    - "cpp.cin"
    - "cpp.cout"
    - "cpp.output-chain"
    - "cpp.arithmetic"
    - "cpp.include"
    - "cpp.string-size"
next:
  - "cpp.from-zero.comparison-and-logic"
tags:
  - "cpp"
  - "output"
  - "iomanip"
facts:
  - kind: "misconception"
    text: "«std::setprecision(2) даёт два знака после точки» - только вместе с std::fixed. Сама по себе setprecision задаёт число значащих цифр, поэтому число 1234.5 с setprecision(2) печатается как 1.2e+03."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        std::cout << std::fixed << std::setprecision(2) << 3.14159 << " " << 2.0 << "\n";
        ```
      options:
        - "3.14 2.00"
        - "3.14 2"
        - "3.1 2"
        - "3.14159 2.0"
      answer: 0
      explanation: "std::fixed вместе с std::setprecision(2) задаёт ровно два знака после точки для всех следующих дробных чисел. Поэтому 3.14159 превращается в 3.14, а 2.0 печатается как 2.00."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает команда (в квадратных скобках границы поля)?

        ```cpp
        std::cout << "[" << std::setw(6) << 42 << "]" << "\n";
        ```
      options:
        - "[    42]"
        - "[42    ]"
        - "[42]"
        - "[  42  ]"
      answer: 0
      explanation: "std::setw(6) задаёт поле шириной шесть символов. По умолчанию числа прижимаются к правому краю поля, поэтому слева добавляются четыре пробела."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        std::cout << std::setw(5) << 1 << 2 << "\n";
        ```
      options:
        - "    12"
        - "    1    2"
        - "12"
        - "1    2"
      answer: 0
      explanation: "std::setw действует только на следующее значение (1): оно занимает поле в пять символов. Значение 2 выводится без поля: получается четыре пробела, 1 и 2."
    - id: "q4"
      type: "single"
      prompt: "Для чего нужна строка `#include <iomanip>`?"
      options:
        - "Для манипуляторов std::setprecision, std::setw и других настроек вывода."
        - "Для вывода на экран: без неё std::cout не работает."
        - "Для работы со строками std::string."
        - "Для чтения чисел из ввода."
      answer: 0
      explanation: "std::cout живёт в <iostream>, строки - в <string>, а манипуляторы вроде setw и setprecision - в <iomanip> (input/output manipulators)."
    - id: "q5"
      type: "single"
      prompt: "Почему не стоит выравнивать русский текст через `std::setw`?"
      options:
        - "setw считает байты, а русская буква занимает два байта: столбцы получаются кривыми."
        - "setw работает только с числами."
        - "setw не умеет выравнивать по левому краю."
        - "Русский текст нельзя выводить через std::cout."
      answer: 0
      explanation: "Ширина поля считается в байтах. Слово из четырёх русских букв занимает 8 байтов и будет считаться вдвое длиннее, чем слово из четырёх латинских, поэтому колонки сдвинутся."
exercise:
  id: "cpp.from-zero.formatted-output.exercise"
  title: "Красивый чек"
  prompt: |
    На вход приходят цена товара (дробное число) и количество (целое). Напечатайте чек: цену с двумя знаками после точки, количество и итог также с двумя знаками, выровненный по правому краю в поле шириной 10:

    ```
    Цена: 49.90
    Количество: 3
    Итого:     149.70
    ```

    (для ввода `49.9 3`).

    В заготовке вычисления уже есть. Добавьте нужные манипуляторы: `std::fixed`, `std::setprecision(2)` и для итога `std::setw(10)`.
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Манипуляторы вставляются в цепочку вывода как обычные части: std::cout << std::fixed << std::setprecision(2);"
    - "std::fixed и std::setprecision(2) действуют на все дальнейшие дробные числа: достаточно написать их один раз до первого вывода."
    - "std::setw(10) нужен только для итога: std::cout << \"Итого: \" << std::setw(10) << total << \"\\n\";"
    - "Ширина 10 включает само число: для 149.70 слева добавятся четыре пробела, плюс один пробел после двоеточия."
  tests:
    - id: "basic"
      title: "Две позиции после точки"
      stdin: |
        49.9 3
      expected: |
        Цена: 49.90
        Количество: 3
        Итого:     149.70
      hint: "Цена 49.90, итог 149.70 в поле шириной 10: слева от числа пять пробелов вместе с пробелом после двоеточия."
    - id: "round"
      title: "Целые значения"
      stdin: |
        10 4
      expected: |
        Цена: 10.00
        Количество: 4
        Итого:      40.00
      hint: "Целые значения тоже печатаются с двумя знаками: 10.00 и 40.00."
    - id: "small"
      title: "Малый итог (скрытый)"
      stdin: |
        0.5 1
      expected: |
        Цена: 0.50
        Количество: 1
        Итого:       0.50
      hidden: true
      hint: "Итог 0.50 должен стоять в поле шириной 10, прижатый к правому краю."
    - id: "wide"
      title: "Большой итог (скрытый)"
      stdin: |
        1234.5 100
      expected: |
        Цена: 1234.50
        Количество: 100
        Итого:  123450.00
      hidden: true
      hint: "Если число почти заполняет поле, пробелов слева остаётся меньше: проверьте setw(10) и два знака после точки."
