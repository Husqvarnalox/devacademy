id: "cpp.from-zero.compiler-errors"
title: "Как читать сообщения об ошибках"
goal: "Прочитать сообщение компилятора, найти по нему строку с ошибкой и исправить программу."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "cpp.from-zero.first-program"
objectives:
  - "Разобрать сообщение компилятора на части: файл, строка, столбец, вид (error или warning), текст."
  - "Объяснить, почему после исправления первой ошибки могут исчезнуть следующие."
  - "Отличить ошибку, которая останавливает сборку, от предупреждения, которое её не останавливает."
masteryCriteria:
  - "Вы исправляете ошибки по одной, начиная с первого сообщения."
  - "Вы ищете пропущенную точку с запятой в конце строки, которую назвал компилятор, или в предыдущей."
  - "Вы не оставляете предупреждения без внимания."
concepts:
  introduces:
    - "cpp.compile-error"
    - "cpp.error-location"
    - "cpp.warning"
  uses:
    - "cpp.program"
    - "cpp.compiler"
    - "cpp.include"
    - "cpp.main"
    - "cpp.cout"
    - "cpp.string-literal"
    - "cpp.std-prefix"
next:
  - "cpp.from-zero.output"
tags:
  - "cpp"
  - "compile-error"
  - "warning"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Компилятор пишет: main.cpp:6:20: error: expected ';' after expression. Что это означает?
      options:
        - "В файле main.cpp, строка 6, столбец 20: не хватает точки с запятой."
        - "В файле main.cpp шестая ошибка, двадцатая попытка сборки."
        - "Программа напечатала 6 строк и 20 символов."
        - "Нужно удалить 20 символов в строке 6."
      answer: 0
      explanation: "Три числа через двоеточие после слова error - это файл, строка и столбец места, где компилятор понял, что команда не закончена."
    - id: "q2"
      type: "single"
      prompt: "Какая из этих строк остановит сборку?"
      options:
        - "main.cpp:5:9: warning: unused variable 'x' [-Wunused-variable]"
        - "main.cpp:5:9: error: use of undeclared identifier 'cout'"
        - "main.cpp:3:12: note: to match this '{'"
        - "1 warning generated."
      answer: 1
      explanation: "Остановить сборку может только error. Warning - предупреждение: программа соберётся, но место, на которое оно указывает, стоит проверить. Note - дополнительная справка к сообщению."
    - id: "q3"
      type: "single"
      prompt: |
        Компилятор показал три ошибки. Что делать?
      options:
        - "Исправить первую по порядку, пересобрать и прочитать сообщения заново."
        - "Исправить последнюю: она самая свежая."
        - "Удалить все строки, где есть ошибки."
        - "Запустить программу несколько раз, вдруг получится."
      answer: 0
      explanation: "Одна ошибка часто порождает следующие, потому что компилятор после неё продолжает разбирать текст в неверном состоянии. Исправление первой нередко убирает остальные."
    - id: "q4"
      type: "single"
      prompt: |
        В программе написано cout << "Привет\n"; (без std::). Что скажет компилятор?
      options:
        - "use of undeclared identifier 'cout'; did you mean 'std::cout'?"
        - "Ничего: программа напечатает Привет."
        - "expected ';' after expression"
        - "warning: unused variable 'cout'"
      answer: 0
      explanation: "Имя cout лежит в std, и без префикса компилятор его не знает. Он сам предлагает вариант с std::."
exercise:
  id: "cpp.from-zero.compiler-errors.exercise"
  title: "Исправьте три ошибки"
  prompt: |
    Программа должна напечатать три строки, но не собирается: в ней три ошибки разных видов. Исправьте их, **не меняя текст**, который нужно напечатать:

    ```
    Заказ принят
    Сумма: 450 руб.
    Спасибо за покупку!
    ```

    Исправляйте по одной ошибке: запустите программу, прочитайте первое сообщение, исправьте, запустите снова. Новое сообщение может появиться уже после исправления предыдущего.
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Сначала запустите программу и прочитайте первое сообщение: оно называет строку, столбец и вид ошибки."
    - "В первой команде не хватает точки с запятой в конце. Во второй команде у cout нет префикса; в третьей у строки нет закрывающей кавычки."
    - "Когда запись исправлена, компилятор может предложить поправку сам: did you mean 'std::cout'."
    - "Верны три строки: std::cout << \"Заказ принят\\n\"; std::cout << \"Сумма: 450 руб.\\n\"; std::cout << \"Спасибо за покупку!\\n\";"
  tests:
    - id: "basic"
      title: "Программа собирается и печатает три строки"
      stdin: ""
      expected: |
        Заказ принят
        Сумма: 450 руб.
        Спасибо за покупку!
      hint: "Исправьте точку с запятой, префикс std:: и закрывающую кавычку, чтобы программа собралась и напечатала три строки."
    - id: "exact"
      title: "Текст не изменён (скрытый)"
      stdin: ""
      expected: |
        Заказ принят
        Сумма: 450 руб.
        Спасибо за покупку!
      hidden: true
      hint: "Проверяется точное совпадение текста: слова, пробелы, точка после «руб» и восклицательный знак в конце. Менять нужно только синтаксис, а не сами фразы."
