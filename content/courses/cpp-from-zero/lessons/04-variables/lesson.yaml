id: "cpp.from-zero.variables"
title: "Переменные: int и std::string"
goal: "Объявить переменные для целого числа и строки, задать им значения и напечатать их."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "cpp.from-zero.output"
objectives:
  - "Объяснить, что переменная - именованное место в памяти для значения определённого типа."
  - "Объявить переменные типов int и std::string сразу со значением и изменить значение присваиванием."
  - "Объяснить, чем опасна переменная, которой не задали значение."
masteryCriteria:
  - "Вы объявляете переменную с начальным значением: int count = 3;"
  - "Вы отличаете объявление (с типом) от присваивания (без типа)."
  - "Вы не читаете переменную, которой ещё не задали значение."
concepts:
  introduces:
    - "cpp.variable"
    - "cpp.assignment"
    - "cpp.int"
    - "cpp.string"
    - "cpp.initialization"
    - "cpp.undefined-behavior"
  uses:
    - "cpp.include"
    - "cpp.main"
    - "cpp.cout"
    - "cpp.string-literal"
    - "cpp.output-chain"
    - "cpp.newline"
    - "cpp.compile-error"
    - "cpp.warning"
next:
  - "cpp.from-zero.basic-types"
tags:
  - "cpp"
  - "variables"
  - "int"
  - "string"
  - "undefined-behavior"
facts:
  - kind: "misconception"
    text: "«Неинициализированная переменная в C++ равна нулю» - нет. Локальная переменная без начального значения содержит то, что осталось в памяти; чтение такого значения - неопределённое поведение."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        int a = 5;
        int b = a;
        a = 10;
        std::cout << a << " " << b << "\n";
        ```
      options:
        - "10 5"
        - "10 10"
        - "5 5"
        - "5 10"
      answer: 0
      explanation: "int b = a; копирует значение 5 в b. Присваивание a = 10 меняет только a, а b остаётся 5."
    - id: "q2"
      type: "single"
      prompt: "Какая запись правильная?"
      options:
        - "int count = 3;"
        - "int count = \"три\";"
        - "std::string name = 7;"
        - "count = 3;"
      answer: 0
      explanation: "Число хранится в int, текст в std::string. int нельзя присвоить текст, а std::string нельзя присвоить число. Последняя запись без типа не объявляет переменную: имя count компилятору ещё не известно."
    - id: "q3"
      type: "single"
      prompt: |
        Что делает программа?

        ```cpp
        int count;
        std::cout << count << "\n";
        ```
      options:
        - "Результат не определён: напечатается произвольное число, а компилятор предупредит, что переменная не инициализирована."
        - "Всегда печатает 0."
        - "Не соберётся: нельзя объявить int без значения."
        - "Печатает пустую строку."
      answer: 0
      explanation: "Объявление без значения допустимо, но значение внутри не задано. Чтение такой переменной - неопределённое поведение: результат может быть любым."
    - id: "q4"
      type: "single"
      prompt: "Компилятор пишет: error: redefinition of 'price'. Что произошло?"
      options:
        - "Переменная price объявлена с типом дважды в одном блоке."
        - "В переменную price записали слишком большое число."
        - "Имя price написано с ошибкой."
        - "Нет #include для price."
      answer: 0
      explanation: "Объявлять переменную с типом можно один раз. Чтобы изменить значение, пишут присваивание без типа: price = 50;"
exercise:
  id: "cpp.from-zero.variables.exercise"
  title: "Карточка товара"
  prompt: |
    В заготовке выводятся три переменные, но самих переменных ещё нет. Объявите их и задайте значения:

    * `product` - строка `Хлеб` (тип `std::string`);
    * `count` - число `3` (тип `int`);
    * `price` - число `60` (тип `int`).

    Затем покупатель передумал: запишите в `count` новое значение `5` обычным присваиванием (без типа). Программа должна напечатать:

    ```
    Товар: Хлеб
    Количество: 5
    Цена за штуку: 60 руб.
    ```
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Три объявления с типом: std::string product = ...; int count = ...; int price = ...;"
    - "Текст записывается в кавычках: \"Хлеб\". Числа - без кавычек."
    - "Новое значение count задаётся строкой без типа: count = 5; Её нужно поставить после объявления count и до вывода."
    - "std::string product = \"Хлеб\"; int count = 3; int price = 60; count = 5;"
  tests:
    - id: "basic"
      title: "Карточка товара"
      stdin: ""
      expected: |
        Товар: Хлеб
        Количество: 5
        Цена за штуку: 60 руб.
      hint: "Количество должно быть 5, а не 3: после объявления с значением 3 нужно присвоить 5."
    - id: "exact"
      title: "Точный текст (скрытый)"
      stdin: ""
      expected: |
        Товар: Хлеб
        Количество: 5
        Цена за штуку: 60 руб.
      hidden: true
      hint: "Проверяется точное совпадение: товар Хлеб, количество 5 (после присваивания), цена 60. Надписи в программе уже написаны, менять их не нужно."
