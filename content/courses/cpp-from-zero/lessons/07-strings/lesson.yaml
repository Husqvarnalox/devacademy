id: "cpp.from-zero.strings"
title: "Строки: длина, символы и склейка"
goal: "Узнать длину строки, взять символ по номеру и склеить две строки."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "cpp.from-zero.arithmetic"
objectives:
  - "Получить длину строки через size() и первый и последний символ по индексу."
  - "Объяснить, что индексы считаются с нуля и что индекс за границами строки - неопределённое поведение."
  - "Склеить строки оператором + и дописать строку через +=."
masteryCriteria:
  - "Вы пишете word[word.size() - 1] для последнего символа и проверяете, что строка не пуста."
  - "Вы используете .at(i), когда нужна проверка границ."
  - "Вы помните, что size() считает байты, и не применяете индексы к русскому тексту."
concepts:
  introduces:
    - "cpp.string-size"
    - "cpp.string-index"
    - "cpp.at"
    - "cpp.string-concat"
  uses:
    - "cpp.string"
    - "cpp.char"
    - "cpp.variable"
    - "cpp.assignment"
    - "cpp.initialization"
    - "cpp.arithmetic"
    - "cpp.output-chain"
    - "cpp.undefined-behavior"
    - "cpp.compile-error"
next:
  - "cpp.from-zero.reading-input"
tags:
  - "cpp"
  - "string"
  - "index"
  - "undefined-behavior"
facts:
  - kind: "misconception"
    text: "«size() у std::string считает буквы» - нет. Он считает байты. В кодировке UTF-8 русская буква занимает два байта, поэтому у слова из шести русских букв size() равен 12."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        std::string word = "kiwi";
        std::cout << word.size() << " " << word[0] << " " << word[3] << "\n";
        ```
      options:
        - "4 k i"
        - "4 k w"
        - "3 k i"
        - "4 i k"
      answer: 0
      explanation: "В слове kiwi четыре символа. Индексы считаются с нуля: word[0] - 'k', word[3] - последний символ 'i'."
    - id: "q2"
      type: "single"
      prompt: "Как получить последний символ непустой строки s?"
      options:
        - "s[s.size() - 1]"
        - "s[s.size()]"
        - "s[-1]"
        - "s[1]"
      answer: 0
      explanation: "Индексы идут от 0 до size() - 1. Индекс s.size() уже выходит за границу, а отрицательных индексов в C++ нет."
    - id: "q3"
      type: "single"
      prompt: "Какая из записей собирается?"
      options:
        - "std::string a = \"Привет\"; std::string b = a + \", мир\";"
        - "std::string b = \"Привет\" + \", мир\";"
        - "std::string b = \"Привет\" - \", мир\";"
        - "std::string b = 'Привет' + ', мир';"
      answer: 0
      explanation: "Склеивать через + можно std::string с текстом или текст со std::string. Два текста в кавычках складывать нельзя: компилятор сообщит invalid operands to binary expression."
    - id: "q4"
      type: "single"
      prompt: |
        Строка s содержит "abc". Чем отличаются s[10] и s.at(10)?
      options:
        - "s[10] - неопределённое поведение, а s.at(10) проверяет границы и аварийно завершает программу с сообщением out_of_range."
        - "Ничем: обе возвращают пустой символ."
        - "s[10] не компилируется, а s.at(10) работает."
        - "s.at(10) возвращает последний символ."
      answer: 0
      explanation: "Оператор [] границы не проверяет: результат непредсказуем. Метод at() проверяет и бросает исключение std::out_of_range; если его не перехватить, программа завершится аварийно, и это лучше тихой порчи данных."
    - id: "q5"
      type: "single"
      prompt: |
        Чему равно s.size(), если объявлено std::string s = "привет";?
      options:
        - "12: русские буквы в UTF-8 занимают по два байта."
        - "6: в слове шесть букв."
        - "7: учитывается завершающий нуль."
        - "Зависит от размера окна."
      answer: 0
      explanation: "size() считает байты. Русская буква в UTF-8 занимает два байта, поэтому шесть букв дают 12. Индексы и размер подходят для латиницы и цифр."
exercise:
  id: "cpp.from-zero.strings.exercise"
  title: "Разбор слова"
  prompt: |
    В заготовке задано слово `word` и напечатана первая строка. Допишите четыре вывода так, чтобы программа напечатала:

    ```
    Слово: orange
    Длина: 6
    Первая буква: o
    Последняя буква: e
    С восклицанием: orange!
    ```

    Длину, буквы и склейку нужно получить из переменной `word`, а не писать числа и буквы вручную.
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Длина - метод word.size(). Первая буква - word[0]. Склейка - word + \"!\"."
    - "Последний индекс на единицу меньше длины: word[word.size() - 1]."
    - "Каждая команда выглядит как std::cout << \"Метка: \" << выражение << \"\\n\";"
    - "std::cout << \"Длина: \" << word.size() << \"\\n\"; и так далее для остальных строк."
  tests:
    - id: "basic"
      title: "Пять строк разбора"
      stdin: ""
      expected: |
        Слово: orange
        Длина: 6
        Первая буква: o
        Последняя буква: e
        С восклицанием: orange!
      hint: "Должно быть пять строк: слово, длина 6, первая буква o, последняя e, слово с восклицательным знаком."
    - id: "exact"
      title: "Точный вывод (скрытый)"
      stdin: ""
      expected: |
        Слово: orange
        Длина: 6
        Первая буква: o
        Последняя буква: e
        С восклицанием: orange!
      hidden: true
      hint: "Проверяется точный вывод. Последняя буква - word[word.size() - 1], а не word[word.size()]; склейка добавляет восклицательный знак без пробела."
