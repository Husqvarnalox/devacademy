id: "cpp.from-zero.output"
title: "Вывод: цепочки, переводы строк и комментарии"
goal: "Напечатать несколько частей в одной строке и спецсимволы, а также оставить в программе заметки."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "cpp.from-zero.compiler-errors"
objectives:
  - "Склеить несколько значений в одну строку вывода цепочкой <<."
  - "Использовать \\n для перехода на новую строку, а \\\" и \\\\ - для кавычки и обратной косой черты."
  - "Оставить в программе комментарий и объяснить, что он не влияет на результат."
masteryCriteria:
  - "Ваша программа печатает текст с кавычками и обратной косой чертой ровно так, как в условии."
  - "Вы знаете, что без \\n следующий вывод продолжается в той же строке."
  - "Вы отличаете комментарий от кода: комментарий компилятор не выполняет."
concepts:
  introduces:
    - "cpp.output-chain"
    - "cpp.newline"
    - "cpp.escape-sequence"
    - "cpp.comment"
  uses:
    - "cpp.program"
    - "cpp.include"
    - "cpp.main"
    - "cpp.cout"
    - "cpp.string-literal"
    - "cpp.std-prefix"
    - "cpp.compile-error"
next:
  - "cpp.from-zero.variables"
tags:
  - "cpp"
  - "cout"
  - "escape-sequence"
  - "comment"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        std::cout << "Цена: " << 45 << " руб.\n";
        ```
      options:
        - "Цена: 45 руб."
        - "Цена: << 45 << руб."
        - "Цена:45руб."
        - "Ошибка компиляции: нельзя печатать числа."
      answer: 0
      explanation: "Цепочка << отправляет в вывод по очереди текст, число и ещё текст. Пробелы берутся из самих строк в кавычках."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        std::cout << "А";
        std::cout << "Б\n";
        std::cout << "В\n";
        ```
      options:
        - "АБ и на следующей строке В"
        - "А, Б и В на трёх отдельных строках"
        - "А и на следующей строке БВ"
        - "АБВ в одной строке"
      answer: 0
      explanation: "Перевод строки делает только \\n. После первой команды его нет, поэтому Б продолжает строку с А."
    - id: "q3"
      type: "single"
      prompt: "Как напечатать текст: Он сказал \"да\"?"
      options:
        - "std::cout << \"Он сказал \\\"да\\\"\\n\";"
        - "std::cout << \"Он сказал \"да\"\\n\";"
        - "std::cout << 'Он сказал \"да\"\\n';"
        - "std::cout << \"Он сказал /\"да/\"\\n\";"
      answer: 0
      explanation: "Кавычка внутри текста записывается как \\\". Без обратной косой черты компилятор решит, что строка закончилась, и сообщит об ошибке."
    - id: "q4"
      type: "single"
      prompt: |
        Что сделает эта строка?

        ```cpp
        // std::cout << "Привет\n";
        ```
      options:
        - "Ничего: это комментарий, компилятор её пропускает."
        - "Напечатает Привет."
        - "Вызовет ошибку компиляции."
        - "Напечатает // Привет."
      answer: 0
      explanation: "Всё от // до конца строки - комментарий. Это заметка для человека; в машинный код она не попадает."
exercise:
  id: "cpp.from-zero.output.exercise"
  title: "Чек с кавычками и путём к файлу"
  prompt: |
    В заготовке уже напечатаны первые три строки. Допишите две строки так, чтобы программа напечатала ровно:

    ```
    === Чек ===
    Хлеб: 45 руб.
    Молоко: 80 руб.
    Кассир сказал: "Спасибо за покупку!"
    Файл: C:\checks\today.txt
    ```

    Кавычки и обратные косые черты нужно записать так, чтобы они попали на экран.
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Нужны две новые команды std::cout. Каждая заканчивается \\n и точкой с запятой."
    - "Кавычка внутри текста записывается как \\\", а одна обратная косая черта - как два символа \\\\."
    - "Первая строка: std::cout << \"Кассир сказал: \\\"Спасибо за покупку!\\\"\\n\";"
    - "Вторая строка: std::cout << \"Файл: C:\\\\checks\\\\today.txt\\n\";"
  tests:
    - id: "basic"
      title: "Чек напечатан полностью"
      stdin: ""
      expected: |
        === Чек ===
        Хлеб: 45 руб.
        Молоко: 80 руб.
        Кассир сказал: "Спасибо за покупку!"
        Файл: C:\checks\today.txt
      hint: "Должно быть пять строк. В четвёртой кавычки вокруг фразы, в пятой - обратные косые черты в пути."
    - id: "exact"
      title: "Точный текст (скрытый)"
      stdin: ""
      expected: |
        === Чек ===
        Хлеб: 45 руб.
        Молоко: 80 руб.
        Кассир сказал: "Спасибо за покупку!"
        Файл: C:\checks\today.txt
      hidden: true
      hint: "Проверяется точное совпадение: двойные кавычки вокруг фразы и по одной обратной косой черте между частями пути. Каждая запись \\\\ даёт на экране один символ \\."
