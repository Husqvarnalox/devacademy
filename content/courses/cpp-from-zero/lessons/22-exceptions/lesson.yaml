id: "cpp.from-zero.exceptions"
title: "Исключения: try, catch и throw"
goal: "Перехватывать ошибки, которые сообщает стандартная библиотека, и сообщать об ошибках из собственных функций."
difficulty: "easy"
estimatedMinutes: 55
prerequisites:
  - "cpp.from-zero.text-lines"
objectives:
  - "Обернуть опасный вызов (std::stoi) в try/catch и обработать ошибку вместо аварийного завершения."
  - "Бросить исключение из своей функции через throw std::invalid_argument и перехватить его в вызывающем коде."
  - "Знать, что stoi читает число из начала строки и не считает мусор после него ошибкой."
masteryCriteria:
  - "Вы пишете try { ... } catch (const std::invalid_argument&) { ... } и понимаете, что код после throw в блоке try не выполняется."
  - "Вы проверяете, что строка целиком является числом, а не только начинается с него."
  - "Вы отличаете исключение (его можно перехватить) от неопределённого поведения (деление на ноль, выход за границы через [])."
concepts:
  introduces:
    - "cpp.exception"
    - "cpp.try-catch"
    - "cpp.throw"
  uses:
    - "cpp.stoi"
    - "cpp.to-string"
    - "cpp.function"
    - "cpp.parameter"
    - "cpp.return"
    - "cpp.const-reference"
    - "cpp.string"
    - "cpp.at"
    - "cpp.vector"
    - "cpp.getline"
    - "cpp.while"
    - "cpp.if"
    - "cpp.undefined-behavior"
next:
  - "cpp.from-zero.first-struct"
tags:
  - "cpp"
  - "exceptions"
  - "errors"
facts:
  - kind: "misconception"
    text: "«std::stoi бросает исключение на любой строке, не являющейся числом» - нет. stoi читает число с начала строки и останавливается на первом лишнем символе: stoi(\"12abc\") даёт 12 без ошибки. Исключение бросается, только если в начале строки вообще нет числа (invalid_argument) или число не помещается в int (out_of_range)."
    sources: []
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        try {
            std::cout << "A\n";
            int n = std::stoi("abc");
            std::cout << "B " << n << "\n";
        } catch (const std::invalid_argument&) {
            std::cout << "C\n";
        }
        std::cout << "D\n";
        ```
      options:
        - "A, C, D (каждая буква на своей строке)"
        - "A, B 0, D"
        - "A, B 0, C, D"
        - "C, D"
      answer: 0
      explanation: "A печатается до ошибки. stoi бросает исключение, остаток блока try (в том числе вывод B) пропускается, управление переходит в catch и печатает C. После catch программа продолжается и печатает D."
    - id: "q2"
      type: "single"
      prompt: |
        Чему равно `n` в этом коде?

        ```cpp
        int n = std::stoi("42 apples");
        ```
      options:
        - "42, без ошибки"
        - "Бросается std::invalid_argument."
        - "0"
        - "Не компилируется."
      answer: 0
      explanation: "stoi читает число с начала строки и останавливается на пробеле. Остаток строки игнорируется без ошибки. Поэтому для проверки «вся строка - число» нужна отдельная проверка."
    - id: "q3"
      type: "single"
      prompt: |
        Что произойдёт, если выбросить исключение, а подходящего catch нигде нет?

        ```cpp
        int main() {
            throw std::invalid_argument("плохо");
        }
        ```
      options:
        - "Программа аварийно завершится с сообщением об необработанном исключении."
        - "Программа молча завершится с кодом 0."
        - "Исключение будет проигнорировано, и программа продолжит работу."
        - "Код не скомпилируется."
      answer: 0
      explanation: "Необработанное исключение завершает программу аварийно: libc++abi печатает «terminating due to uncaught exception» и тип исключения."
    - id: "q4"
      type: "single"
      prompt: "Какая из этих ошибок превращается в исключение, которое можно перехватить?"
      options:
        - "std::vector<int> v = {1, 2}; v.at(5);"
        - "std::vector<int> v = {1, 2}; v[5];"
        - "int zero = 0; 10 / zero;"
        - "int x; std::cout << x;"
      answer: 0
      explanation: "Только at() проверяет границы и бросает std::out_of_range. Индексация [], деление на ноль и чтение неинициализированной переменной - неопределённое поведение: проверки нет, и перехватить нечего."
    - id: "q5"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```cpp
        int parse(const std::string& s) {
            if (s.empty()) {
                throw std::invalid_argument("пусто");
            }
            return std::stoi(s);
        }

        int main() {
            try {
                std::cout << parse("5") << "\n";
                std::cout << parse("") << "\n";
                std::cout << parse("7") << "\n";
            } catch (const std::invalid_argument& e) {
                std::cout << "ошибка: " << e.what() << "\n";
            }
        }
        ```
      options:
        - "5, затем «ошибка: пусто»"
        - "5, «ошибка: пусто», 7"
        - "«ошибка: пусто»"
        - "5, 0, 7"
      answer: 0
      explanation: "Первый вызов успешен и печатает 5. Второй бросает исключение: оно выходит из parse, перехватывается в main, и третья строка блока try не выполняется. e.what() возвращает текст, переданный в конструктор исключения."
exercise:
  id: "cpp.from-zero.exceptions.exercise"
  title: "Количества товаров"
  prompt: |
    Магазин принимает количества товаров, по одному в строке. Готовый `main` читает строки до конца ввода, пропускает пустые, передаёт каждую вашей функции `parseQuantity` и считает принятые и отклонённые строки.

    Напишите функцию `int parseQuantity(const std::string& text)`:

    * строка должна быть целым числом, записанным обычным образом: без плюса, пробелов, ведущих нулей и посторонних символов (`12abc`, `+5`, ` 7`, `007` недопустимы);
    * число должно быть положительным;
    * при нарушении функция бросает `std::invalid_argument` (текст сообщения произвольный); число, которое не помещается в `int`, тоже считается ошибкой;
    * иначе функция возвращает число.

    Готовый `main` перехватывает исключения, печатает `Ошибка в строке: <строка>` и в конце выводит итоги: `Принято`, `Ошибок` и `Сумма`.
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "Начните с int value = std::stoi(text);. Для строки abc и для слишком большого числа stoi сам бросает исключение - main его перехватит."
    - "stoi не замечает мусор после числа (12abc даёт 12). Проверьте: если std::to_string(value) != text, бросьте std::invalid_argument."
    - "Ноль и отрицательные числа stoi принимает, поэтому добавьте проверку value <= 0 и бросьте исключение."
    - "Бросается так: throw std::invalid_argument(\"описание\");"
  tests:
    - id: "basic"
      title: "Одна строка не число"
      stdin: |
        5
        10
        abc
        3
      expected: |
        Ошибка в строке: abc
        Принято: 3
        Ошибок: 1
        Сумма: 18
      hint: "Строка abc отклоняется, остальные суммируются: 5 + 10 + 3."
    - id: "trailing"
      title: "Мусор после числа"
      stdin: |
        12abc
        7
      expected: |
        Ошибка в строке: 12abc
        Принято: 1
        Ошибок: 1
        Сумма: 7
      hint: "stoi вернёт 12 для 12abc, но строка целиком числом не является."
    - id: "range"
      title: "Ноль, минус и слишком большое число (скрытый)"
      stdin: |
        0
        -5
        99999999999
        2
      expected: |
        Ошибка в строке: 0
        Ошибка в строке: -5
        Ошибка в строке: 99999999999
        Принято: 1
        Ошибок: 3
        Сумма: 2
      hidden: true
      hint: "Число должно быть положительным и помещаться в int."
    - id: "format"
      title: "Необычная запись (скрытый)"
      stdin: |
        007
        +5
         7
        8
      expected: |
        Ошибка в строке: 007
        Ошибка в строке: +5
        Ошибка в строке:  7
        Принято: 1
        Ошибок: 3
        Сумма: 8
      hidden: true
      hint: "Ведущие нули, плюс и пробел перед числом недопустимы: строка должна совпадать с записью числа через std::to_string."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: |
        Принято: 0
        Ошибок: 0
        Сумма: 0
      hidden: true
      hint: "Без строк печатаются нулевые итоги."
