id: "php.from-zero.reading-input"
title: "Чтение ввода: fgets и trim"
goal: "Прочитать строки со стандартного ввода и использовать их в программе."
difficulty: "easy"
estimatedMinutes: 30
prerequisites:
  - "php.from-zero.strings"
objectives:
  - "Объяснить, что такое стандартный ввод и откуда программа получает данные."
  - "Прочитать строку командой fgets(STDIN) и убрать лишние символы функцией trim."
  - "Объяснить, что fgets возвращает строку вместе с переводом строки и false, когда ввод закончился."
masteryCriteria:
  - "Ваша программа читает две строки и печатает их в заданном формате."
  - "Вы предсказываете, что напечатает программа, если не вызвать trim."
  - "Вы не печатаете в программе приглашений вроде «Введите имя»."
concepts:
  introduces:
    - "php.stdin"
    - "php.fgets"
    - "php.trim"
  uses:
    - "php.variable"
    - "php.interpolation"
    - "php.concatenation"
    - "php.string"
    - "php.var-dump"
    - "php.bool"
next:
  - "php.from-zero.type-conversion"
tags:
  - "php"
  - "stdin"
  - "fgets"
  - "trim"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Во входных данных есть строка `Анна`, после неё перевод строки. Что вернёт `fgets(STDIN)`?"
      options:
        - "\"Анна\" без перевода строки"
        - "\"Анна\" вместе с переводом строки в конце"
        - "false"
        - "Число 4"
      answer: 1
      explanation: "fgets читает строку целиком, включая завершающий перевод строки. Поэтому результат почти всегда нужно очистить функцией trim."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа, если на вход подана строка `Анна` с переводом строки в конце?

        ```php
        <?php
        echo "Привет, " . fgets(STDIN) . "!\n";
        ```
      options:
        - "Привет, Анна!"
        - "Привет, Анна, а на следующей строке !"
        - "Привет, !"
        - "Ошибку"
      answer: 1
      explanation: "Строка из fgets содержит перевод строки. Он попадает в вывод перед восклицательным знаком и разрывает текст на две строки. Решение: trim(fgets(STDIN))."
    - id: "q3"
      type: "single"
      prompt: "Что вернёт `trim(\"  Анна \\n\")`?"
      options:
        - "\"  Анна \\n\" без изменений"
        - "\"Анна\""
        - "\"Анна \""
        - "\"  Анна\""
      answer: 1
      explanation: "trim убирает пробелы, табуляции и переводы строк с обоих концов строки. Середина строки не меняется."
    - id: "q4"
      type: "single"
      prompt: |
        Входные данные состоят из одной строки `Анна` (с переводом строки). Что напечатает программа?

        ```php
        <?php
        var_dump(fgets(STDIN));
        var_dump(fgets(STDIN));
        ```
      options:
        - "string(9) \"Анна\" (с \\n), затем bool(false)"
        - "string(8) \"Анна\", затем string(0) \"\""
        - "Два раза string(9) \"Анна\" (с \\n)"
        - "Ошибку на второй строке"
      answer: 0
      explanation: "Первое чтение даёт строку: 4 буквы по 2 байта и перевод строки - 9 байт. Когда ввод закончился, fgets возвращает false."
    - id: "q5"
      type: "single"
      prompt: "Почему программа не должна печатать приглашение вида «Введите имя:»?"
      options:
        - "Это запрещено правилами PHP."
        - "Проверка сравнивает весь вывод программы с ожидаемым, и лишний текст сделает ответ неверным."
        - "Приглашение удалит введённые данные."
        - "Приглашения работают только в браузере."
      answer: 1
      explanation: "В упражнениях проверяется весь вывод. Программа должна напечатать только результат в заданном формате."
exercise:
  id: "php.from-zero.reading-input.exercise"
  title: "Приветствие по имени и городу"
  prompt: |
    Программа получает на вход две строки: имя и город. Напечатайте одну строку:

    ```
    Здравствуйте, <имя>! Ваш город: <город>.
    ```

    **Пример.** Ввод:

    ```
    Анна
    Казань
    ```

    Вывод:

    ```
    Здравствуйте, Анна! Ваш город: Казань.
    ```

    Лишние пробелы по краям строк и перевод строки в стиле Windows (`\r\n`) не должны попасть в вывод. Приглашений вроде «Введите имя» печатать не нужно.
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Строку со стандартного ввода читает fgets(STDIN). Нужно прочитать две строки: сначала имя, затем город - два вызова."
    - "fgets возвращает строку вместе с переводом строки. Уберите его и пробелы по краям функцией trim: $name = trim(fgets(STDIN));"
    - "Аналогично для города. Затем соберите строку с подстановкой: echo \"Здравствуйте, {$name}! Ваш город: {$city}.\\n\";"
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "Анна\nКазань\n"
      expected: "Здравствуйте, Анна! Ваш город: Казань.\n"
      hint: "Для имени Анна и города Казань должна получиться ровно одна строка из условия."
    - id: "spaces"
      title: "Пробелы по краям и окончания Windows (скрытый)"
      stdin: "  Иван  \r\nСамара \r\n"
      expected: "Здравствуйте, Иван! Ваш город: Самара.\n"
      hidden: true
      hint: "Пробелы и символ возврата каретки в конце строк нужно убрать функцией trim: иначе они окажутся посреди предложения."
    - id: "no-final-newline"
      title: "Последняя строка без перевода строки (скрытый)"
      stdin: "Ёлена\nЮрьевец-Подольский"
      expected: "Здравствуйте, Ёлена! Ваш город: Юрьевец-Подольский.\n"
      hidden: true
      hint: "Последняя строка ввода может не заканчиваться переводом строки: fgets всё равно вернёт её. Дефис и буква Ё должны печататься без изменений."
