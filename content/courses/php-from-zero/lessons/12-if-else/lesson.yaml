id: "php.from-zero.if-else"
title: "Условия: if, elseif, else"
goal: "Выбирать, какой блок кода выполнить, по результату сравнения."
difficulty: "easy"
estimatedMinutes: 30
prerequisites:
  - "php.from-zero.comparison-and-logic"
objectives:
  - "Записывать конструкцию if / elseif / else с условием в круглых скобках и блоками в фигурных."
  - "Объяснить, что из цепочки выполняется только первый блок с истинным условием, и расставлять условия в нужном порядке."
  - "Проверять граничные значения и выбирать между > и >=."
masteryCriteria:
  - "Ваша программа печатает цену билета для каждой возрастной группы, включая границы 7, 18 и 65 лет."
  - "Вы предсказываете, какая ветка выполнится при заданных значениях."
  - "Вы отличаете = от === в условии."
concepts:
  introduces:
    - "php.if"
  uses:
    - "php.bool"
    - "php.comparison"
    - "php.strict-equality"
    - "php.logical-operators"
    - "php.variable"
    - "php.assignment"
    - "php.interpolation"
    - "php.stdin"
    - "php.fgets"
    - "php.trim"
    - "php.cast"
next:
  - "php.from-zero.while-loop"
tags:
  - "php"
  - "if"
  - "conditions"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $n = 10;
        if ($n > 5) {
            echo "A";
        } elseif ($n > 8) {
            echo "B";
        } else {
            echo "C";
        }
        ```
      options:
        - "A"
        - "AB"
        - "B"
        - "C"
      answer: 0
      explanation: "Условие $n > 5 истинно, и выполняется первая ветка. Ветки elseif и else пропускаются, хотя условие во второй тоже истинно."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $age = 18;
        if ($age < 18) {
            echo "ребёнок";
        } else {
            echo "взрослый";
        }
        ```
      options:
        - "ребёнок"
        - "взрослый"
        - "ничего"
        - "ошибку"
      answer: 1
      explanation: "18 < 18 ложно, поэтому выполняется else. Ровно восемнадцать лет считаются взрослым возрастом: граница попадает в ветку else."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $x = 3;
        if ($x = 5) {
            echo "пять";
        } else {
            echo "не пять";
        }
        ```
      options:
        - "пять"
        - "не пять"
        - "Parse error"
        - "ничего"
      answer: 0
      explanation: "Здесь присваивание, а не сравнение: в $x кладётся 5, и значение выражения (5) приводится к истине. Для сравнения нужно ===."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $t = 5;
        if ($t > 10)
            echo "A\n";
            echo "B\n";
        ```
      options:
        - "ничего"
        - "A"
        - "B"
        - "A и B"
      answer: 2
      explanation: "Без фигурных скобок к if относится только первая команда. echo \"B\\n\" стоит вне условия и выполняется всегда, как бы ни была сдвинута строка."
    - id: "q5"
      type: "single"
      prompt: |
        Что сообщит PHP?

        ```php
        <?php
        $x = 5;
        if $x > 3 {
            echo "big\n";
        }
        ```
      options:
        - "Parse error: syntax error, unexpected variable \"$x\", expecting \"(\""
        - "Warning: Undefined variable $x"
        - "Выведет big"
        - "Fatal error: Uncaught TypeError"
      answer: 0
      explanation: "Условие if должно стоять в круглых скобках. Без них PHP сообщает о синтаксической ошибке до запуска программы."
exercise:
  id: "php.from-zero.if-else.exercise"
  title: "Цена билета по возрасту"
  prompt: |
    На вход подаётся одно целое число - возраст посетителя. Определите цену билета:

    * младше 7 лет - 0 руб.;
    * от 7 до 17 лет включительно - 150 руб.;
    * от 18 до 64 лет включительно - 300 руб.;
    * от 65 лет - 200 руб.

    Заготовка читает возраст и печатает строку `Билет: <цена> руб.`. Допишите условия, которые задают `$price`.

    **Пример.** Ввод:

    ```
    25
    ```

    Вывод:

    ```
    Билет: 300 руб.
    ```
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Заготовка уже читает возраст в $age и печатает $price. Осталось присвоить $price нужное значение в зависимости от $age."
    - "Проверяйте группы сверху вниз: if ($age < 7) { $price = 0; } elseif ($age < 18) { ... }. Ветка elseif сработает только если предыдущие условия ложны, поэтому нижнюю границу писать не нужно."
    - "Три условия задают четыре группы: младше 7, младше 18, младше 65 и все остальные (else)."
    - "Ровно 7, 18 и 65 лет входят в старшую группу: возраст 7 - это не младше 7, возраст 65 - это уже не младше 65."
  tests:
    - id: "adult"
      title: "Взрослый"
      stdin: "25\n"
      expected: "Билет: 300 руб.\n"
      hint: "Возраст 25 попадает в группу от 18 до 64 лет: цена 300 руб."
    - id: "child"
      title: "Школьник"
      stdin: "10\n"
      expected: "Билет: 150 руб.\n"
      hint: "Возраст 10 попадает в группу от 7 до 17 лет: цена 150 руб."
    - id: "baby"
      title: "Малыш (скрытый)"
      stdin: "3\n"
      expected: "Билет: 0 руб.\n"
      hidden: true
      hint: "Младше 7 лет билет бесплатный: цена 0 руб."
    - id: "senior"
      title: "Пенсионер (скрытый)"
      stdin: "80\n"
      expected: "Билет: 200 руб.\n"
      hidden: true
      hint: "От 65 лет цена снова ниже обычной: 200 руб."
    - id: "boundary-7"
      title: "Граница 6 и 7 (скрытый)"
      stdin: "7\n"
      expected: "Билет: 150 руб.\n"
      hidden: true
      hint: "Ровно 7 лет - уже детская группа (150 руб.), а 6 лет - ещё бесплатная."
    - id: "boundary-18"
      title: "Граница 17 и 18 (скрытый)"
      stdin: "18\n"
      expected: "Билет: 300 руб.\n"
      hidden: true
      hint: "Ровно 18 лет - уже взрослая группа (300 руб.): детская заканчивается на 17."
    - id: "boundary-64"
      title: "Граница 64 и 65 (скрытый)"
      stdin: "65\n"
      expected: "Билет: 200 руб.\n"
      hidden: true
      hint: "Ровно 65 лет - уже старшая группа (200 руб.): взрослая заканчивается на 64."
