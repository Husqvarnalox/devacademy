id: "php.from-zero.while-loop"
title: "Цикл while"
goal: "Повторять блок кода, пока условие истинно, и накапливать результат в переменной."
difficulty: "easy"
estimatedMinutes: 30
prerequisites:
  - "php.from-zero.if-else"
objectives:
  - "Записать цикл while с начальным значением, условием и изменением счётчика."
  - "Накапливать сумму или количество в переменной, созданной до цикла."
  - "Находить причину бесконечного цикла и ошибки на единицу."
masteryCriteria:
  - "Ваша программа считает, за сколько месяцев накопится нужная сумма, и корректно работает, когда цель достигнута сразу."
  - "Вы предсказываете число итераций и значение счётчика после цикла."
  - "Вы объясняете, почему цикл без изменения счётчика не заканчивается."
concepts:
  introduces:
    - "php.while"
  uses:
    - "php.if"
    - "php.comparison"
    - "php.variable"
    - "php.assignment"
    - "php.compound-assignment"
    - "php.arithmetic"
    - "php.rounding"
    - "php.interpolation"
    - "php.stdin"
    - "php.fgets"
    - "php.trim"
    - "php.cast"
next:
  - "php.from-zero.for-loop"
tags:
  - "php"
  - "while"
  - "loops"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $i = 1;
        while ($i <= 3) {
            echo $i;
            $i++;
        }
        ```
      options:
        - "123"
        - "12"
        - "1234"
        - "3"
      answer: 0
      explanation: "Тело выполняется при i равном 1, 2 и 3. Когда i становится 4, условие 4 <= 3 ложно, и цикл заканчивается."
    - id: "q2"
      type: "single"
      prompt: |
        Сколько раз выполнится тело цикла?

        ```php
        <?php
        $i = 5;
        while ($i < 5) {
            echo "x";
            $i++;
        }
        ```
      options:
        - "5 раз"
        - "1 раз"
        - "0 раз"
        - "Бесконечно"
      answer: 2
      explanation: "Условие проверяется до первого прохода. 5 < 5 ложно, поэтому тело не выполняется ни разу."
    - id: "q3"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```php
        <?php
        $n = 3;
        while ($n > 0) {
            echo $n;
        }
        ```
      options:
        - "Напечатается 321"
        - "Напечатается 3 и программа завершится"
        - "Программа будет бесконечно печатать 3"
        - "Parse error"
      answer: 2
      explanation: "Значение $n внутри цикла не меняется, условие всегда истинно, и тело выполняется бесконечно. Нужно добавить $n--."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $sum = 0;
        $i = 1;
        while ($i < 4) {
            $sum += $i;
            $i++;
        }
        echo $sum;
        ```
      options:
        - "10"
        - "6"
        - "3"
        - "4"
      answer: 1
      explanation: "Цикл проходит значения 1, 2 и 3 (при i равном 4 условие ложно): сумма 1 + 2 + 3 равна 6."
    - id: "q5"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $x = 1;
        while ($x < 50) {
            $x = $x * 2;
        }
        echo $x;
        ```
      options:
        - "50"
        - "32"
        - "64"
        - "49"
      answer: 2
      explanation: "x последовательно становится 2, 4, 8, 16, 32, 64. При 32 условие 32 < 50 ещё истинно и значение удваивается ещё раз; при 64 цикл заканчивается."
exercise:
  id: "php.from-zero.while-loop.exercise"
  title: "Сколько месяцев копить"
  prompt: |
    Вы откладываете деньги на покупку. На вход подаются три целых числа, каждое на своей строке:

    1. цена цели, руб.;
    2. сколько вы откладываете в конце каждого месяца, руб. (больше нуля);
    3. сколько уже накоплено, руб.

    Определите, через сколько месяцев накопленная сумма станет не меньше цены. Если цель достигнута сразу, месяцев ноль. Напечатайте две строки: `Месяцев: <число>` и `Накоплено: <сумма> руб.` (сумма на момент достижения цели).

    Заготовка читает числа и печатает результат. Допишите цикл.

    **Пример.** Ввод:

    ```
    1000
    300
    100
    ```

    Вывод:

    ```
    Месяцев: 3
    Накоплено: 1000 руб.
    ```
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Нужен цикл, который повторяется, пока накопленная сумма меньше цели: while ($saved < $goal) { ... }."
    - "На каждой итерации откладывается месячная сумма и считается месяц: $saved += $monthly; $months++;"
    - "Если сразу $saved >= $goal, условие цикла ложно, тело не выполнится, и в ответе будет 0 месяцев - как требуется."
    - "Сумма может превысить цель (например, 1000 при цене 900): это нормально, печатайте накопленное как есть."
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "1000\n300\n100\n"
      expected: "Месяцев: 3\nНакоплено: 1000 руб.\n"
      hint: "Накопление: 100, 400, 700, 1000 - три месяца, итоговая сумма 1000 руб."
    - id: "overshoot"
      title: "Сумма превышает цель"
      stdin: "900\n400\n0\n"
      expected: "Месяцев: 3\nНакоплено: 1200 руб.\n"
      hint: "После двух месяцев 800 < 900, нужен третий; накоплено 1200 руб. (цель перекрыта)."
    - id: "already"
      title: "Цель достигнута сразу (скрытый)"
      stdin: "500\n100\n700\n"
      expected: "Месяцев: 0\nНакоплено: 700 руб.\n"
      hidden: true
      hint: "Накоплено уже больше цели: цикл не выполняется, месяцев 0, сумма остаётся 700."
    - id: "exact"
      title: "Ровно на границе (скрытый)"
      stdin: "600\n200\n400\n"
      expected: "Месяцев: 1\nНакоплено: 600 руб.\n"
      hidden: true
      hint: "Когда накопленное ровно равно цене, цикл заканчивается: условие должно быть строгим <, а не <=."
    - id: "long"
      title: "Долгое накопление (скрытый)"
      stdin: "100000\n1\n0\n"
      expected: "Месяцев: 100000\nНакоплено: 100000 руб.\n"
      hidden: true
      hint: "Месяцев много (100000): цикл должен прибавлять по $monthly и считать каждую итерацию."
