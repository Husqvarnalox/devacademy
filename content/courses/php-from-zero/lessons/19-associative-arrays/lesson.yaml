id: "php.from-zero.associative-arrays"
title: "Ассоциативные массивы"
goal: "Хранить данные парами «ключ => значение», безопасно читать их и считать повторения."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "php.from-zero.array-functions"
objectives:
  - "Создавать ассоциативный массив, читать, добавлять и менять значения по ключу и обходить его через foreach с ключом."
  - "Проверять наличие ключа через isset, array_key_exists и оператор ??."
  - "Считать повторения приёмом $counts[$k] = ($counts[$k] ?? 0) + 1 и сортировать пары через ksort, asort, arsort."
  - "Записывать вложенные массивы и обращаться к их элементам."
masteryCriteria:
  - "Ваша программа считает слова, сортирует их по алфавиту и называет самое частое."
  - "Вы объясняете разницу между isset и array_key_exists."
  - "Вы не читаете несуществующий ключ без проверки или запасного значения."
concepts:
  introduces:
    - "php.assoc-array"
    - "php.isset"
    - "php.null-coalescing"
    - "php.nested-array"
  uses:
    - "php.array"
    - "php.index"
    - "php.count"
    - "php.foreach"
    - "php.sort"
    - "php.array-functions"
    - "php.break-continue"
    - "php.for"
    - "php.function"
    - "php.strict-types"
    - "php.null"
    - "php.printf"
    - "php.stdin"
    - "php.fgets"
    - "php.trim"
    - "php.cast"
next:
  - "php.from-zero.string-functions"
tags:
  - "php"
  - "arrays"
  - "associative"
  - "isset"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $p = ["a" => 1, "b" => 2];
        $p["c"] = 3;
        $p["a"] = 10;
        echo count($p);
        ```
      options:
        - "2"
        - "3"
        - "4"
        - "13"
      answer: 1
      explanation: "Ключ \"c\" новый, поэтому пар становится три. Запись по существующему ключу \"a\" заменяет значение и не меняет число пар."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $p = ["a" => 1];
        echo $p["z"] ?? 0;
        ```
      options:
        - "0"
        - "Warning: Undefined array key \"z\""
        - "Пустую строку"
        - "null"
      answer: 0
      explanation: "Оператор ?? возвращает запасное значение, если ключа нет, и не выдаёт предупреждения."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $a = ["x" => null];
        var_dump(isset($a["x"]));
        var_dump(array_key_exists("x", $a));
        ```
      options:
        - "bool(true) и bool(true)"
        - "bool(false) и bool(true)"
        - "bool(true) и bool(false)"
        - "bool(false) и bool(false)"
      answer: 1
      explanation: "isset считает ключ с null отсутствующим. array_key_exists проверяет только существование ключа."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $s = ["б" => 2, "а" => 1];
        ksort($s);
        foreach ($s as $k => $v) {
            echo $k, $v, " ";
        }
        ```
      options:
        - "б2 а1 "
        - "а1 б2 "
        - "1а 2б "
        - "а б "
      answer: 1
      explanation: "ksort упорядочивает пары по ключам: «а» идёт раньше «б». Пары сохраняются: значение остаётся при своём ключе."
    - id: "q5"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```php
        <?php
        $p = ["a" => 1];
        echo $p["b"];
        ```
      options:
        - "Fatal error и остановка"
        - "Warning: Undefined array key \"b\" и пустой вывод"
        - "Напечатается 0"
        - "Напечатается b"
      answer: 1
      explanation: "Чтение отсутствующего ключа даёт предупреждение и значение null; echo печатает null как пустую строку, программа продолжает работу."
exercise:
  id: "php.from-zero.associative-arrays.exercise"
  title: "Что чаще покупают: подсчёт слов"
  prompt: |
    Кафе записало названия заказанных напитков, по одному на строке. На вход подаётся число `n` (от 1 до 100) и затем `n` слов в нижнем регистре. Напечатайте:

    1. по строке `<слово>: <сколько раз>` для каждого разного слова, в алфавитном порядке;
    2. строку `Видов: <число разных слов>`;
    3. строку `Чаще всего: <слово> (<сколько раз>)`. Если таких слов несколько, берётся первое по алфавиту.

    Заготовка читает слова. Допишите подсчёт и вывод.

    **Пример.** Ввод:

    ```
    6
    чай
    кофе
    чай
    сок
    кофе
    чай
    ```

    Вывод:

    ```
    кофе: 2
    сок: 1
    чай: 3
    Видов: 3
    Чаще всего: чай (3)
    ```
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Для подсчёта заведите пустой массив $counts = []; (в заготовке он уже есть). Для каждого слова: $counts[$word] = ($counts[$word] ?? 0) + 1;"
    - "ksort($counts) упорядочивает пары по ключам, то есть по алфавиту. Затем foreach ($counts as $word => $count) печатает строки."
    - "Число видов - count($counts): в массиве по одной паре на каждое разное слово."
    - "Для «чаще всего» отсортируйте arsort($counts) (по убыванию значений; при равных значениях порядок пар сохраняется, то есть остаётся алфавитным), затем первую пару выведите внутри foreach и сразу остановитесь через break."
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "6\nчай\nкофе\nчай\nсок\nкофе\nчай\n"
      expected: "кофе: 2\nсок: 1\nчай: 3\nВидов: 3\nЧаще всего: чай (3)\n"
      hint: "Чай 3, кофе 2, сок 1; строки в алфавитном порядке, чаще всего - чай."
    - id: "single"
      title: "Одно слово"
      stdin: "1\nлимонад\n"
      expected: "лимонад: 1\nВидов: 1\nЧаще всего: лимонад (1)\n"
      hint: "Одно слово: один вид, он же самый частый."
    - id: "tie"
      title: "Ничья по алфавиту (скрытый)"
      stdin: "4\nсок\nчай\nсок\nчай\n"
      expected: "сок: 2\nчай: 2\nВидов: 2\nЧаще всего: сок (2)\n"
      hidden: true
      hint: "При равных счётчиках «Чаще всего» - первое слово по алфавиту (сок раньше чая)."
    - id: "all-same"
      title: "Все слова одинаковые (скрытый)"
      stdin: "3\nкофе\nкофе\nкофе\n"
      expected: "кофе: 3\nВидов: 1\nЧаще всего: кофе (3)\n"
      hidden: true
      hint: "Одно слово повторяется три раза: один вид со счётчиком 3."
    - id: "spaces"
      title: "Пробелы по краям (скрытый)"
      stdin: "4\n  чай\nчай  \nсок\n сок\n"
      expected: "сок: 2\nчай: 2\nВидов: 2\nЧаще всего: сок (2)\n"
      hidden: true
      hint: "Слова с пробелами по краям должны считаться одним словом: примените trim (в заготовке он уже есть)."
