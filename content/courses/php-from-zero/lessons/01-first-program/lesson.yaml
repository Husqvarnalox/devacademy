id: "php.from-zero.first-program"
title: "Первая программа"
goal: "Запустить программу на PHP и изменить текст, который она выводит."
difficulty: "intro"
estimatedMinutes: 20
prerequisites: []
objectives:
  - "Объяснить, что такое программа, исходный код, PHP и программа php."
  - "Вывести текст на экран командой echo и записать строку в кавычках."
  - "Написать несколько команд подряд и предсказать порядок вывода."
masteryCriteria:
  - "Ваша программа печатает ровно заданную строку, включая регистр и знаки препинания."
  - "Вы отличаете текст в кавычках (его печатают как есть) от имени команды (её выполняют)."
  - "Вы объясняете, зачем в начале файла строка <?php."
concepts:
  introduces:
    - "php.program"
    - "php.open-tag"
    - "php.echo"
    - "php.string-literal"
next:
  - "php.from-zero.reading-errors"
tags:
  - "php"
  - "echo"
  - "first-program"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что такое программа php в этом курсе?"
      options:
        - "Программа, которая читает текст на PHP и выполняет его на вашем компьютере."
        - "Редактор, в котором пишут код."
        - "Другое название языка PHP."
        - "Сайт, на котором хранятся программы."
      answer: 0
      explanation: "PHP - язык, на котором вы пишете команды. Программа php - исполнитель: она открывает файл, читает команды по порядку и выполняет их. Приложение запускает её за вас командой php main.php."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        echo "раз\n";
        echo "два\n";
        ```
      options:
        - "раздва"
        - "раз два (в одной строке)"
        - "раз, а на следующей строке два"
        - "два, а на следующей строке раз"
      answer: 2
      explanation: "Команды выполняются сверху вниз, а знаки \\n в конце текста переводят строку. Поэтому «раз» и «два» оказываются на разных строках в том порядке, в каком написаны команды."
    - id: "q3"
      type: "single"
      prompt: |
        Что появится на экране?

        ```php
        <?php
        echo "Привет\n";
        ```
      options:
        - "\"Привет\" вместе с кавычками"
        - "Привет без кавычек"
        - "Ничего: нужна ещё одна команда"
        - "echo"
      answer: 1
      explanation: "Кавычки только показывают, где начинается и где заканчивается текст. На экран попадает содержимое между ними."
    - id: "q4"
      type: "single"
      prompt: "Зачем в начале файла стоит строка <?php?"
      options:
        - "Она сообщает PHP, что дальше идёт код; без неё файл был бы выведен как обычный текст."
        - "Она задаёт, сколько раз выполнить программу."
        - "Она печатает слово PHP на экране."
        - "Она нужна только для красоты."
      answer: 0
      explanation: "PHP рассматривает файл как текст, пока не встретит <?php. Только после этой строки он начинает выполнять команды. Эта строка ничего не печатает."
    - id: "q5"
      type: "single"
      prompt: |
        В чём ошибка в этой программе?

        ```php
        <?php
        echo "Привет\n"
        ```
      options:
        - "Нет точки с запятой в конце команды."
        - "Нельзя писать по-русски."
        - "Слово echo нужно писать с заглавной буквы."
        - "Ошибки нет."
      answer: 0
      explanation: "Каждая команда заканчивается точкой с запятой. Без неё PHP не понимает, где команда кончилась, и сообщает Parse error. Регистр у echo не важен, а русский текст в кавычках допустим."
exercise:
  id: "php.from-zero.first-program.exercise"
  title: "Измените выводимую строку"
  prompt: |
    В редакторе уже есть рабочая программа: она печатает приветствие. Измените её так, чтобы она печатала ровно одну строку:

    ```
    Я учусь программировать на PHP!
    ```

    Менять нужно только текст в кавычках. Знаки `\n` в конце текста оставьте: они переводят строку. Регистр букв, пробелы и восклицательный знак важны.
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Найдите в программе команду echo: нужный текст находится между кавычками."
    - "Замените всё, что стоит между кавычками, кроме \\n в конце, на нужную фразу. Сами кавычки и точку с запятой оставьте."
    - "Должно получиться echo \"Я учусь программировать на PHP!\\n\";"
  tests:
    - id: "basic"
      title: "Печатается нужная фраза"
      stdin: ""
      expected: |
        Я учусь программировать на PHP!
      hint: "Программа должна напечатать одну строку: Я учусь программировать на PHP!"
    - id: "exact"
      title: "Точный текст и одна строка (скрытый)"
      stdin: ""
      expected: |
        Я учусь программировать на PHP!
      hidden: true
      hint: "Проверяется точное совпадение: заглавная Я, пробелы между словами, PHP заглавными буквами, восклицательный знак в конце и никаких лишних строк."
