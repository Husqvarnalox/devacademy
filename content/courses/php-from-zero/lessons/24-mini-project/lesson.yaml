id: "php.from-zero.mini-project"
title: "Мини-проект: учёт покупок"
goal: "Собрать из изученного готовую программу: прочитать строки покупок, посчитать итоги по категориям и учесть неверные строки."
difficulty: "easy"
estimatedMinutes: 60
prerequisites:
  - "php.from-zero.classes-intro"
objectives:
  - "Разбить задачу на этапы: прочитать, разобрать строку, накопить итоги, вывести отчёт."
  - "Вынести разбор строки в функцию, которая возвращает объект или бросает исключение."
  - "Накапливать счётчики и суммы по категориям в ассоциативных массивах и выводить их по алфавиту."
  - "Считать неверные строки, не прерывая программу, и не учитывать пустые."
masteryCriteria:
  - "Отчёт точно совпадает с форматом из условия."
  - "Пустой ввод, неверные строки, окончания \\r\\n и последняя строка без перевода обработаны без ошибок."
  - "Самая дорогая позиция при равенстве сумм - первая из встреченных."
concepts:
  introduces: []
  uses:
    - "php.read-lines"
    - "php.fgets"
    - "php.trim"
    - "php.string-functions"
    - "php.assoc-array"
    - "php.null-coalescing"
    - "php.sort"
    - "php.foreach"
    - "php.while"
    - "php.break-continue"
    - "php.if"
    - "php.logical-operators"
    - "php.function"
    - "php.exception"
    - "php.try-catch"
    - "php.class"
    - "php.constructor-promotion"
    - "php.method"
    - "php.new"
    - "php.strict-types"
next:
  - "php.first-steps.how-php-runs"
tags:
  - "php"
  - "project"
  - "input"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Сколько частей вернёт `explode(";", "Еда;Чай;250")`?
      options:
        - "2"
        - "3"
        - "4"
        - "1"
      answer: 1
      explanation: "Два разделителя дают три части. Для верной записи нужно четыре, поэтому такая строка неверная."
    - id: "q2"
      type: "single"
      prompt: |
        Что произойдёт при выполнении `$sums["Еда"] += 100;`, если ключа «Еда» в массиве ещё нет?
      options:
        - "Fatal error"
        - "Warning: Undefined array key, а затем ключ получит значение 100"
        - "Ничего не произойдёт"
        - "Ключ получит значение 0"
      answer: 1
      explanation: "PHP считает отсутствующий ключ равным null, выдаёт предупреждение и сохраняет 100. Запись ($sums[$k] ?? 0) + 100 обходит предупреждение."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает фрагмент?

        ```php
        <?php
        $sums = ["Еда" => 1, "Дом" => 2, "Авто" => 3];
        ksort($sums);
        echo implode(",", array_keys($sums));
        ```
      options:
        - "Еда,Дом,Авто"
        - "Авто,Дом,Еда"
        - "Дом,Еда,Авто"
        - "Авто,Еда,Дом"
      answer: 1
      explanation: "ksort сортирует по ключам: А, Д, Е. Получается Авто, Дом, Еда."
    - id: "q4"
      type: "single"
      prompt: |
        Две позиции имеют равные суммы 1200. Максимум ищется условием `$total > $bestTotal`. Какая позиция останется самой дорогой?
      options:
        - "Последняя встреченная"
        - "Первая встреченная"
        - "Обе"
        - "Ни одна"
      answer: 1
      explanation: "Строгое сравнение > не заменяет найденное значение равным, поэтому остаётся первая."
    - id: "q5"
      type: "single"
      prompt: |
        Где должен стоять `try`/`catch`, чтобы неверная строка не прерывала чтение остальных?
      options:
        - "Вокруг всего цикла while"
        - "Внутри цикла вокруг вызова parsePurchase"
        - "Только перед циклом"
        - "Он не нужен: PHP пропустит строку сам"
      answer: 1
      explanation: "Исключение прерывает всё, что находится внутри try. Чтобы продолжить цикл, try ставят внутрь его тела."
exercise:
  id: "php.from-zero.mini-project.exercise"
  title: "Учёт покупок"
  prompt: |
    На вход подаются строки вида `категория;название;цена;количество`. Цена и количество - целые положительные числа. Пробелы вокруг полей допустимы.

    Строка неверная, если в ней не четыре поля, пусто название или категория, цена или количество не целые числа или не больше нуля. Неверные строки пропустите и посчитайте. Пустые строки игнорируйте и нигде не учитывайте.

    Выведите:

    1. по строке на каждую категорию в алфавитном порядке (`ksort`): `Категория: N поз., S руб.`, где N - число верных записей, а S - сумма цен на количество;
    2. `Всего: S руб.`;
    3. `Самая дорогая позиция: Название (S руб.)` - позиция с наибольшей суммой (цена на количество); при равенстве - первая встреченная. Если верных записей нет, эту строку не печатайте;
    4. `Пропущено строк: N`.

    **Пример.** Ввод:

    ```
    Еда;Хлеб;50;2
    Еда;Молоко;90;3
    Дом;Лампа;1200;1
    Еда;Сыр;;1
    Еда;Чай;250
    Транспорт;Билет;60;2

    Еда;Яблоки;abc;2
    ```

    Вывод:

    ```
    Дом: 1 поз., 1200 руб.
    Еда: 2 поз., 370 руб.
    Транспорт: 1 поз., 120 руб.
    Всего: 1690 руб.
    Самая дорогая позиция: Лампа (1200 руб.)
    Пропущено строк: 3
    ```
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Разделите работу на этапы. Сначала разбор: $parts = explode(\";\", $line); и проверка count($parts) === 4. Вынесите это в функцию, которая бросает InvalidArgumentException."
    - "Цену и количество проверяйте через filter_var(trim($поле), FILTER_VALIDATE_INT) и сравнение === false; затем отсекайте значения <= 0."
    - "Накапливайте: $counts[$category] = ($counts[$category] ?? 0) + 1; $sums[$category] = ($sums[$category] ?? 0) + $total;. Перед выводом вызовите ksort($sums);."
    - "Самую дорогую позицию ищите условием $bestName === \"\" || $total > $bestTotal. Строку о ней печатайте, только если $bestName !== \"\". Пустые строки пропускайте до разбора и не считайте."
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "Еда;Хлеб;50;2\nЕда;Молоко;90;3\nДом;Лампа;1200;1\nЕда;Сыр;;1\nЕда;Чай;250\nТранспорт;Билет;60;2\n\nЕда;Яблоки;abc;2\n"
      expected: "Дом: 1 поз., 1200 руб.\nЕда: 2 поз., 370 руб.\nТранспорт: 1 поз., 120 руб.\nВсего: 1690 руб.\nСамая дорогая позиция: Лампа (1200 руб.)\nПропущено строк: 3\n"
      hint: "Категории идут по алфавиту; три строки (пустая цена, три поля, текст вместо цены) пропущены, пустая строка не считается."
    - id: "all-valid"
      title: "Все строки верные"
      stdin: "Дом;Лампа;300;2\nДом;Стул;150;1\n"
      expected: "Дом: 2 поз., 750 руб.\nВсего: 750 руб.\nСамая дорогая позиция: Лампа (600 руб.)\nПропущено строк: 0\n"
      hint: "Самая дорогая позиция определяется суммой цена на количество: лампа 300 на 2 дороже стула."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: "Всего: 0 руб.\nПропущено строк: 0\n"
      hidden: true
      hint: "Без верных записей печатаются только строки «Всего: 0 руб.» и «Пропущено строк: 0», без строки о самой дорогой позиции."
    - id: "bad-values"
      title: "Нуль, минус, лишние поля, пробелы, Windows-окончания и равные суммы (скрытый)"
      stdin: "Еда;Хлеб;0;2\nЕда;Чай;10;-1\nа;б;в;г;д\n ;Х;1;1\nДом ; Стул ; 300 ; 2 \r\nДом;Стол;600;1\nДом;Лампа;100;1"
      expected: "Дом: 3 поз., 1300 руб.\nВсего: 1300 руб.\nСамая дорогая позиция: Стул (600 руб.)\nПропущено строк: 4\n"
      hidden: true
      hint: "Ноль, отрицательные значения, пять полей и пустая категория - неверные строки; пробелы и \\r убирает trim; при равных суммах побеждает первая, последняя строка может прийти без перевода строки."
    - id: "only-bad"
      title: "Только неверные строки (скрытый)"
      stdin: "abc\n1;2\nЕда;Чай;x;1\n\n"
      expected: "Всего: 0 руб.\nПропущено строк: 3\n"
      hidden: true
      hint: "Если все строки неверные, категорий нет и строки о самой дорогой позиции тоже нет; пропущено - число неверных строк, пустая не считается."
