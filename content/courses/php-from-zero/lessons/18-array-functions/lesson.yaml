id: "php.from-zero.array-functions"
title: "Готовые функции для массивов"
goal: "Считать сумму, искать значение, сортировать и собирать массив в строку готовыми функциями, различая функции, которые возвращают результат и которые меняют массив."
difficulty: "easy"
estimatedMinutes: 35
prerequisites:
  - "php.from-zero.arrays"
objectives:
  - "Использовать array_sum, min, max, in_array, implode и array_slice."
  - "Объяснить, чем sort и rsort отличаются от функций, возвращающих новое значение."
  - "Вызывать in_array со строгим сравнением и объяснить зачем."
masteryCriteria:
  - "Ваша программа выводит отсортированные оценки, сумму, среднее, лучшие три и результат поиска."
  - "Вы не присваиваете результат sort переменной и объясняете почему."
  - "Вы проверяете, что массив не пуст, прежде чем вызывать max и делить на count."
concepts:
  introduces:
    - "php.array-functions"
    - "php.sort"
  uses:
    - "php.array"
    - "php.index"
    - "php.append"
    - "php.count"
    - "php.foreach"
    - "php.function"
    - "php.strict-types"
    - "php.for"
    - "php.if"
    - "php.strict-equality"
    - "php.printf"
    - "php.interpolation"
    - "php.stdin"
    - "php.fgets"
    - "php.trim"
    - "php.cast"
next:
  - "php.from-zero.associative-arrays"
tags:
  - "php"
  - "arrays"
  - "sort"
  - "implode"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        echo implode("-", [3, 1, 2]);
        ```
      options:
        - "3-1-2"
        - "1-2-3"
        - "312"
        - "6"
      answer: 0
      explanation: "implode склеивает элементы в том порядке, в котором они лежат в массиве, и ставит разделитель между ними."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $a = [3, 1, 2];
        sort($a);
        rsort($a);
        echo $a[0];
        ```
      options:
        - "1"
        - "2"
        - "3"
        - "Ничего: sort вернул true"
      answer: 2
      explanation: "sort и rsort меняют сам массив. После rsort массив имеет вид [3, 2, 1], и $a[0] равно 3."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $a = [3, 1, 2];
        $b = sort($a);
        var_dump($b);
        ```
      options:
        - "bool(true)"
        - "array(3) {...} с числами 1, 2, 3"
        - "int(3)"
        - "NULL"
      answer: 0
      explanation: "sort ничего не возвращает по смыслу: он меняет массив на месте и возвращает true. Упорядоченный список лежит в $a."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $a = [10, 20, 30, 40];
        echo implode(",", array_slice($a, 1, 2));
        ```
      options:
        - "10,20"
        - "20,30"
        - "20,30,40"
        - "30,40"
      answer: 1
      explanation: "array_slice($a, 1, 2) берёт два элемента, начиная с индекса 1: это 20 и 30."
    - id: "q5"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        var_dump(in_array("2", [1, 2, 3], true));
        ```
      options:
        - "bool(true)"
        - "bool(false)"
        - "int(1)"
        - "TypeError"
      answer: 1
      explanation: "Со строгим сравнением строка \"2\" и число 2 различаются по типу, поэтому значение не найдено."
exercise:
  id: "php.from-zero.array-functions.exercise"
  title: "Оценки группы: сводка"
  prompt: |
    На вход подаётся число `n` (от 1 до 30) и затем `n` оценок от 1 до 5, по одной на строке. Заготовка читает их в массив `$grades`. Напечатайте пять строк:

    ```
    Оценки по возрастанию: <оценки через запятую и пробел>
    Сумма: <сумма оценок>
    Среднее: <среднее с двумя знаками после точки>
    Лучшие три: <три наибольшие оценки по убыванию через запятую и пробел>
    Есть двойка: <да или нет>
    ```

    Если оценок меньше трёх, в строке «Лучшие три» выводятся все имеющиеся. Используйте готовые функции для массивов.

    **Пример.** Ввод:

    ```
    5
    5
    3
    4
    5
    2
    ```

    Вывод:

    ```
    Оценки по возрастанию: 2, 3, 4, 5, 5
    Сумма: 19
    Среднее: 3.80
    Лучшие три: 5, 5, 4
    Есть двойка: да
    ```
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Отсортируйте массив sort($grades); и выведите implode(\", \", $grades). Помните: sort меняет сам массив, результат присваивать не нужно."
    - "Сумма - array_sum($grades). Среднее - array_sum($grades) / count($grades), печатайте через printf(\"Среднее: %.2F\\n\", ...)."
    - "Для лучших трёх отсортируйте массив по убыванию (rsort), затем возьмите первые три: array_slice($grades, 0, 3)."
    - "Поиск двойки: in_array(2, $grades, true) вернёт bool; в зависимости от него напечатайте «да» или «нет» через if / else."
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "5\n5\n3\n4\n5\n2\n"
      expected: "Оценки по возрастанию: 2, 3, 4, 5, 5\nСумма: 19\nСреднее: 3.80\nЛучшие три: 5, 5, 4\nЕсть двойка: да\n"
      hint: "Сумма 19, среднее 3.80, лучшие три 5, 5, 4, двойка есть."
    - id: "no-two"
      title: "Две оценки, двойки нет"
      stdin: "2\n4\n5\n"
      expected: "Оценки по возрастанию: 4, 5\nСумма: 9\nСреднее: 4.50\nЛучшие три: 5, 4\nЕсть двойка: нет\n"
      hint: "Оценок всего две: «Лучшие три» содержит обе, по убыванию (5, 4)."
    - id: "single"
      title: "Одна оценка (скрытый)"
      stdin: "1\n2\n"
      expected: "Оценки по возрастанию: 2\nСумма: 2\nСреднее: 2.00\nЛучшие три: 2\nЕсть двойка: да\n"
      hidden: true
      hint: "Одна оценка 2: в каждой строке единственное значение, среднее 2.00, двойка есть."
    - id: "rounding"
      title: "Округление среднего (скрытый)"
      stdin: "3\n3\n4\n4\n"
      expected: "Оценки по возрастанию: 3, 4, 4\nСумма: 11\nСреднее: 3.67\nЛучшие три: 4, 4, 3\nЕсть двойка: нет\n"
      hidden: true
      hint: "Среднее 11/3 печатается как 3.67 (формат %.2F)."
    - id: "many"
      title: "Шесть оценок (скрытый)"
      stdin: "6\n5\n5\n5\n4\n3\n3\n"
      expected: "Оценки по возрастанию: 3, 3, 4, 5, 5, 5\nСумма: 25\nСреднее: 4.17\nЛучшие три: 5, 5, 5\nЕсть двойка: нет\n"
      hidden: true
      hint: "Из шести оценок «Лучшие три» - три пятёрки; сумма 25, среднее 4.17."
