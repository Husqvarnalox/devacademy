id: "php.from-zero.strings"
title: "Строки: склейка, длина, регистр и UTF-8"
goal: "Склеивать строки, узнавать их длину в буквах и менять регистр, в том числе для русского текста."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "php.from-zero.arithmetic"
objectives:
  - "Склеивать строки оператором . и достраивать строку через .=."
  - "Объяснить, что strlen считает байты, и использовать mb_strlen для букв."
  - "Менять регистр русского текста функциями mb_strtoupper и mb_strtolower."
masteryCriteria:
  - "Вы печатаете строку, собранную из частей, и длину слова с кириллицей в буквах."
  - "Вы предсказываете, что вернёт strlen(\"Привет\") и почему."
  - "Вы отличаете склейку . от сложения + и знаете, что + со строками - ошибка."
concepts:
  introduces:
    - "php.concatenation"
    - "php.strlen"
    - "php.mb-string"
  uses:
    - "php.variable"
    - "php.assignment"
    - "php.string"
    - "php.interpolation"
    - "php.arithmetic"
    - "php.echo"
next:
  - "php.from-zero.reading-input"
tags:
  - "php"
  - "strings"
  - "utf-8"
  - "mbstring"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        echo "Привет" . ", " . "мир", "\n";
        ```
      options:
        - "Привет, мир"
        - "Привет . , . мир"
        - "Привет мир"
        - "Ошибку"
      answer: 0
      explanation: "Точка склеивает три строки в одну: Привет, затем «, », затем мир. Последняя запятая отделяет от них отдельное значение \"\\n\"."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        echo strlen("Привет"), "\n";
        ```
      options:
        - "6"
        - "12"
        - "3"
        - "Привет"
      answer: 1
      explanation: "strlen считает байты. В кодировке UTF-8 каждая русская буква занимает 2 байта, поэтому у шести букв 12 байт. Для числа букв нужна функция mb_strlen."
    - id: "q3"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```php
        <?php
        echo "Привет, " + "Анна";
        ```
      options:
        - "Напечатается Привет, Анна"
        - "Напечатается 0"
        - "Fatal error: Uncaught TypeError: Unsupported operand types: string + string"
        - "Parse error"
      answer: 2
      explanation: "Оператор + складывает числа и не склеивает текст. Для склейки в PHP используется точка."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        echo strtoupper("привет"), "\n";
        ```
      options:
        - "ПРИВЕТ"
        - "привет"
        - "Привет"
        - "Ошибку"
      answer: 1
      explanation: "strtoupper меняет регистр только латинских букв и не трогает кириллицу. Для русского текста подходит mb_strtoupper, которая вернёт ПРИВЕТ."
    - id: "q5"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $s = "a";
        $s .= "b";
        $s .= "c";
        echo $s, "\n";
        ```
      options:
        - "a"
        - "c"
        - "abc"
        - "cba"
      answer: 2
      explanation: "$s .= \"b\" означает $s = $s . \"b\": к строке дописывается ещё один кусок. После трёх шагов получается abc."
exercise:
  id: "php.from-zero.strings.exercise"
  title: "Имя, длина и заглавные буквы"
  prompt: |
    В заготовке заданы `$first` и `$last`. Допишите программу так, чтобы она напечатала три строки:

    ```
    Полное имя: Анна Смирнова
    Букв в фамилии: 8
    Заглавными: АННА СМИРНОВА
    ```

    Полное имя соберите склейкой из `$first`, пробела и `$last` в переменной `$full`. Длину фамилии считайте в **буквах**, а регистр меняйте функцией, которая понимает русские буквы.
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Склейка в PHP - оператор точка: $first . \" \" . $last. Результат сохраните в $full."
    - "Каждую строку печатайте через echo с точкой: echo \"Полное имя: \" . $full . \"\\n\"; В конце не забудьте \\n."
    - "Длина в буквах для русских слов - mb_strlen($last). Функция strlen даст байты и число 16."
    - "Заглавные буквы: mb_strtoupper($full). Обычная strtoupper русские буквы не меняет."
  tests:
    - id: "basic"
      title: "Три строки"
      stdin: ""
      expected: |
        Полное имя: Анна Смирнова
        Букв в фамилии: 8
        Заглавными: АННА СМИРНОВА
      hint: "Должно быть три строки: «Полное имя: Анна Смирнова», «Букв в фамилии: 8» и «Заглавными: АННА СМИРНОВА»."
    - id: "exact"
      title: "Буквы, а не байты (скрытый)"
      stdin: ""
      expected: |
        Полное имя: Анна Смирнова
        Букв в фамилии: 8
        Заглавными: АННА СМИРНОВА
      hidden: true
      hint: "Длина фамилии должна быть 8, а не 16: используйте mb_strlen. Заглавные русские буквы даёт mb_strtoupper, а не strtoupper."
