id: "php.from-zero.arithmetic"
title: "Арифметика"
goal: "Выполнять вычисления с целыми и дробными числами и получать целую часть и остаток деления."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "php.from-zero.values-and-types"
objectives:
  - "Использовать операции + - * / % ** и скобки и предсказывать порядок их выполнения."
  - "Различать результат / (может быть дробным) и intdiv (целая часть) и находить остаток через %."
  - "Округлять число функциями round, floor и ceil."
  - "Сокращать запись x = x + 5 до x += 5."
masteryCriteria:
  - "Вы переводите минуты в часы и минуты через intdiv и %."
  - "Вы предсказываете результат выражения с несколькими операциями без запуска."
  - "Вы объясняете, почему 0.1 + 0.2 нельзя сравнивать с 0.3 без осторожности."
concepts:
  introduces:
    - "php.arithmetic"
    - "php.intdiv"
    - "php.rounding"
    - "php.compound-assignment"
  uses:
    - "php.variable"
    - "php.assignment"
    - "php.interpolation"
    - "php.int"
    - "php.float"
    - "php.echo"
    - "php.var-dump"
next:
  - "php.from-zero.strings"
tags:
  - "php"
  - "arithmetic"
  - "intdiv"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        echo 7 / 2, "\n";
        ```
      options:
        - "3"
        - "3.5"
        - "4"
        - "Ошибку"
      answer: 1
      explanation: "Оператор / в PHP возвращает точный результат деления: 3.5. Если нужна целая часть, используют intdiv(7, 2), она равна 3."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        echo 17 % 5, "\n";
        ```
      options:
        - "3"
        - "2"
        - "3.4"
        - "85"
      answer: 1
      explanation: "Оператор % возвращает остаток от деления. 17 = 5 * 3 + 2, поэтому остаток 2."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        echo 2 + 3 * 4, "\n";
        ```
      options:
        - "20"
        - "14"
        - "24"
        - "9"
      answer: 1
      explanation: "Умножение выполняется раньше сложения: сначала 3 * 4 = 12, затем 2 + 12. Чтобы сложить первым, нужны скобки: (2 + 3) * 4 даёт 20."
    - id: "q4"
      type: "single"
      prompt: "Какое выражение даёт целую часть от деления 17 на 5, то есть 3?"
      options:
        - "17 / 5"
        - "17 % 5"
        - "intdiv(17, 5)"
        - "17 ** 5"
      answer: 2
      explanation: "intdiv возвращает целую часть частного. 17 / 5 даёт 3.4, 17 % 5 - остаток 2, 17 ** 5 - возведение в степень."
    - id: "q5"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $x = 10;
        $x += 5;
        $x *= 2;
        echo $x, "\n";
        ```
      options:
        - "20"
        - "25"
        - "30"
        - "15"
      answer: 2
      explanation: "$x += 5 даёт 15, затем $x *= 2 даёт 30. Составное присваивание вычисляет выражение и записывает результат обратно в ту же переменную."
exercise:
  id: "php.from-zero.arithmetic.exercise"
  title: "Минуты в часы и минуты"
  prompt: |
    В переменной `$total` записано 135 минут. Допишите программу так, чтобы она напечатала:

    ```
    Всего минут: 135
    Часов: 2
    Минут: 15
    ```

    Часы - это целая часть от деления на 60 (используйте `intdiv`), минуты - остаток от этого деления (оператор `%`). Значения часов и минут должны **вычисляться из `$total`**, а не быть записаны числами `2` и `15`.
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Нужны две новые переменные: $hours и $minutes. Строки echo в заготовке уже написаны."
    - "Часы: целая часть деления на 60 - функция intdiv с двумя числами. Минуты: остаток от деления на 60 - оператор %."
    - "$hours = intdiv($total, 60); $minutes = $total % 60;"
  tests:
    - id: "basic"
      title: "135 минут"
      stdin: ""
      expected: |
        Всего минут: 135
        Часов: 2
        Минут: 15
      hint: "Должно быть три строки: «Всего минут: 135», «Часов: 2» и «Минут: 15»."
    - id: "exact"
      title: "Целое число без дробной части (скрытый)"
      stdin: ""
      expected: |
        Всего минут: 135
        Часов: 2
        Минут: 15
      hidden: true
      hint: "Часы должны быть целым числом 2, а не 2.25: используйте intdiv, а не /. Минуты - остаток, а не часть от деления."
