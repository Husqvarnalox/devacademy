id: "php.from-zero.variables"
title: "Переменные"
goal: "Сохранить значение в переменной, изменить его и подставить в текст."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "php.from-zero.output"
objectives:
  - "Создать переменную командой $имя = значение; и изменить её значение."
  - "Подставить переменную в строку в двойных кавычках записью {$имя}."
  - "Назвать правила имён переменных и объяснить, почему $price и $Price - разные переменные."
masteryCriteria:
  - "Вы создаёте переменные с текстом и числом и печатаете их в строке."
  - "Вы предсказываете значения двух переменных после копирования и последующего изменения одной из них."
  - "Вы замечаете Warning: Undefined variable и находите опечатку в имени."
concepts:
  introduces:
    - "php.variable"
    - "php.assignment"
    - "php.interpolation"
  uses:
    - "php.echo"
    - "php.string-literal"
    - "php.escape-sequence"
    - "php.error-message"
next:
  - "php.from-zero.values-and-types"
tags:
  - "php"
  - "variables"
  - "interpolation"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $a = 5;
        $b = $a;
        $a = 7;
        echo "{$a} {$b}\n";
        ```
      options:
        - "7 7"
        - "5 5"
        - "7 5"
        - "5 7"
      answer: 2
      explanation: "Строка $b = $a; копирует текущее значение 5 в $b. Дальше $a получает 7, а $b остаётся 5: переменные хранят независимые значения."
    - id: "q2"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```php
        <?php
        $Name = "Анна";
        echo "Привет, {$name}!\n";
        ```
      options:
        - "Напечатается Привет, Анна!"
        - "PHP выдаст Warning: Undefined variable $name, а в тексте на месте имени ничего не будет."
        - "Parse error: имя не может начинаться с заглавной буквы."
        - "PHP сам исправит регистр."
      answer: 1
      explanation: "Имена переменных различают регистр: $Name и $name - разные переменные. Переменная $name нигде не задана, поэтому PHP выдаёт предупреждение и подставляет пустое место."
    - id: "q3"
      type: "single"
      prompt: "Какое из этих имён записано верно?"
      options:
        - "$2price"
        - "$my price"
        - "$price_2"
        - "price"
      answer: 2
      explanation: "Имя начинается со знака $, затем буква или подчёркивание, дальше могут идти буквы, цифры и подчёркивания. Цифра первой стоять не может, пробелов в имени нет, а без $ это уже не переменная."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $name = "Анна";
        echo 'Привет, {$name}', "\n";
        ```
      options:
        - "Привет, Анна"
        - "Привет, {$name}"
        - "Привет, "
        - "Ошибку"
      answer: 1
      explanation: "В одинарных кавычках подстановка не работает: текст печатается как есть. Для подстановки нужны двойные кавычки."
    - id: "q5"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```php
        <?php
        $word = "кот";
        echo "$wordы\n";
        ```
      options:
        - "Напечатается котом"
        - "Напечатается коты"
        - "Warning: Undefined variable $wordы"
        - "Parse error"
      answer: 2
      explanation: "Русские буквы допустимы в именах переменных, поэтому PHP читает wordы как одно имя. Фигурные скобки отделяют имя от остального текста: \"{$word}ы\" напечатает «коты»."
exercise:
  id: "php.from-zero.variables.exercise"
  title: "Цена и скидка"
  prompt: |
    В заготовке задана переменная `$product`. Допишите программу так, чтобы она напечатала ровно три строки:

    ```
    Товар: Чай
    Цена: 120 руб.
    Цена после скидки: 100 руб.
    ```

    Создайте переменную `$price` со значением `120` (число пишется без кавычек), напечатайте её в строке `Цена: 120 руб.`, затем **запишите в ту же переменную** новое значение `100` и напечатайте вторую строку. Подставляйте значения через `{$имя}`, а не пишите числа внутрь текста.
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Создание переменной: $price = 120; Она должна появиться раньше, чем вы её напечатаете."
    - "Подстановка в строку с двойными кавычками: echo \"Цена: {$price} руб.\\n\";"
    - "Новое значение записывают той же командой присваивания: $price = 100; После неё echo с текстом «Цена после скидки: » снова подставляет $price."
    - "Порядок команд: $price = 120; echo с ценой; $price = 100; echo с ценой после скидки."
  tests:
    - id: "basic"
      title: "Три строки"
      stdin: ""
      expected: |
        Товар: Чай
        Цена: 120 руб.
        Цена после скидки: 100 руб.
      hint: "Должно быть три строки: товар, цена 120 и цена после скидки 100. Проверьте текст: «Цена: 120 руб.» и «Цена после скидки: 100 руб.»."
    - id: "exact"
      title: "Значение берётся из переменной (скрытый)"
      stdin: ""
      expected: |
        Товар: Чай
        Цена: 120 руб.
        Цена после скидки: 100 руб.
      hidden: true
      hint: "Точное совпадение с примером. Ни Warning, ни лишних пробелов быть не должно: имя переменной в фигурных скобках должно совпадать с именем, которое вы создали, включая регистр."
