id: "php.from-zero.type-conversion"
title: "Преобразование типов и проверка чисел"
goal: "Превратить введённый текст в число и проверить, что текст действительно похож на число."
difficulty: "easy"
estimatedMinutes: 30
prerequisites:
  - "php.from-zero.reading-input"
objectives:
  - "Преобразовать строку в int и float операторами (int) и (float)."
  - "Объяснить, что (int) отбрасывает дробную часть и молча превращает мусор в 0."
  - "Проверить текст функцией is_numeric и объяснить, что она считает числом."
  - "Объяснить, как PHP складывает числовые строки и почему так нельзя полагаться на неявные преобразования."
masteryCriteria:
  - "Ваша программа читает два числа из ввода и печатает их сумму и целую часть."
  - "Вы предсказываете результат (int) для строк 42, 3.99, abc и 12px."
  - "Вы отличаете сложение + от склейки . для числовых строк."
concepts:
  introduces:
    - "php.cast"
    - "php.is-numeric"
    - "php.type-juggling"
  uses:
    - "php.stdin"
    - "php.fgets"
    - "php.trim"
    - "php.int"
    - "php.float"
    - "php.string"
    - "php.var-dump"
    - "php.arithmetic"
    - "php.interpolation"
    - "php.concatenation"
next:
  - "php.from-zero.formatted-output"
tags:
  - "php"
  - "casting"
  - "is-numeric"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        var_dump((int) "3.99");
        ```
      options:
        - "int(4)"
        - "int(3)"
        - "float(3.99)"
        - "string(4) \"3.99\""
      answer: 1
      explanation: "(int) отбрасывает дробную часть, а не округляет. Для округления нужна функция round."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        echo "5" + "3", "\n";
        ```
      options:
        - "53"
        - "8"
        - "Ошибку"
        - "\"5\" + \"3\""
      answer: 1
      explanation: "Оператор + превращает числовые строки в числа и складывает их. Склейка записывается точкой: \"5\" . \"3\" даёт 53."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        var_dump((int) "abc");
        ```
      options:
        - "int(0) и никаких сообщений"
        - "Fatal error"
        - "NULL"
        - "int(3)"
      answer: 0
      explanation: "(int) не проверяет текст, а молча превращает «не число» в 0. Поэтому, если ввод может быть некорректным, сначала проверяют is_numeric."
    - id: "q4"
      type: "single"
      prompt: "Для какой строки is_numeric вернёт false?"
      options:
        - "\"42\""
        - "\"3.5\""
        - "\"3,5\""
        - "\"-7\""
      answer: 2
      explanation: "Десятичный разделитель в PHP - точка. Запятая делает строку нечисловой. is_numeric(\"3,5\") - false, а (float) \"3,5\" даст 3 и молча отбросит остаток."
    - id: "q5"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```php
        <?php
        echo "12px" + 1, "\n";
        ```
      options:
        - "13 без сообщений"
        - "Warning: A non-numeric value encountered, затем 13"
        - "Parse error"
        - "12px1"
      answer: 1
      explanation: "Строка 12px начинается с числа: PHP берёт ведущие цифры (12), предупреждает Warning и продолжает. Полностью нечисловая строка (abc) даёт TypeError."
exercise:
  id: "php.from-zero.type-conversion.exercise"
  title: "Сумма и целая часть двух чисел"
  prompt: |
    На вход подаются два числа, каждое на своей строке. Числа могут быть дробными (с точкой) и отрицательными. Напечатайте две строки:

    ```
    Сумма: <сумма>
    Целая часть: <целая часть суммы>
    ```

    Целая часть - это сумма с отброшенной дробной частью: для `9.75` это `9`, для `-3.5` это `-3`.

    **Пример.** Ввод:

    ```
    12.5
    7
    ```

    Вывод:

    ```
    Сумма: 19.5
    Целая часть: 19
    ```

    Сумму печатайте так, как её показывает `echo`: без лишних нулей (`5`, а не `5.00`). Форматирование с двумя знаками - в одном из следующих уроков.
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Прочитайте две строки: trim(fgets(STDIN)) дважды. Они пока строки, а складывать нужно числа."
    - "Превратите каждую строку в число оператором (float): $a = (float) trim(fgets(STDIN)); Можно и сложить без преобразования, но явное преобразование понятнее."
    - "Сумма: $sum = $a + $b; затем echo \"Сумма: {$sum}\\n\";"
    - "Целая часть - (int) $sum, он отбрасывает дробную часть: echo \"Целая часть: \" . (int) $sum . \"\\n\";"
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "12.5\n7\n"
      expected: "Сумма: 19.5\nЦелая часть: 19\n"
      hint: "12.5 + 7 = 19.5, целая часть 19."
    - id: "integers"
      title: "Целые числа"
      stdin: "2\n3\n"
      expected: "Сумма: 5\nЦелая часть: 5\n"
      hint: "Сумма целых чисел печатается без дробной части: 5, а не 5.0."
    - id: "negative"
      title: "Отрицательные числа (скрытый)"
      stdin: "-1.5\n-2\n"
      expected: "Сумма: -3.5\nЦелая часть: -3\n"
      hidden: true
      hint: "Для -3.5 целая часть по правилу (int) равна -3: дробная часть отбрасывается, а не округляется вниз."
    - id: "spaces-windows"
      title: "Пробелы и окончания Windows (скрытый)"
      stdin: "  7.25 \r\n 2.5\r\n"
      expected: "Сумма: 9.75\nЦелая часть: 9\n"
      hidden: true
      hint: "Пробелы и символ возврата каретки по краям строк нужно убрать (trim) до преобразования."
    - id: "fractions"
      title: "Дроби без накопления погрешности в выводе (скрытый)"
      stdin: "0.1\n0.2\n"
      expected: "Сумма: 0.3\nЦелая часть: 0\n"
      hidden: true
      hint: "echo показывает 14 значащих цифр, поэтому сумма 0.1 и 0.2 печатается как 0.3. Целая часть этой суммы равна 0."
