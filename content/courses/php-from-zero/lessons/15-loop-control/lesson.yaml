id: "php.from-zero.loop-control"
title: "break, continue и вложенные циклы"
goal: "Прерывать цикл и пропускать итерации командами break и continue, а также вкладывать один цикл в другой."
difficulty: "easy"
estimatedMinutes: 35
prerequisites:
  - "php.from-zero.for-loop"
objectives:
  - "Использовать break для досрочного завершения цикла и continue для пропуска итерации."
  - "Объяснить, чем различаются действия continue в циклах for и while."
  - "Записывать вложенные циклы и определять, сколько раз выполнится тело внутреннего."
masteryCriteria:
  - "Ваша программа пропускает отрицательные значения, останавливается на нуле и корректно считает принятые."
  - "Вы предсказываете число итераций вложенных циклов."
  - "Вы объясняете, почему continue до $i++ в while приводит к зависанию."
concepts:
  introduces:
    - "php.break-continue"
    - "php.nested-loops"
  uses:
    - "php.for"
    - "php.while"
    - "php.if"
    - "php.comparison"
    - "php.arithmetic"
    - "php.compound-assignment"
    - "php.printf"
    - "php.variable"
    - "php.interpolation"
    - "php.stdin"
    - "php.fgets"
    - "php.trim"
    - "php.cast"
next:
  - "php.from-zero.functions"
tags:
  - "php"
  - "break"
  - "continue"
  - "nested-loops"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        for ($i = 1; $i <= 5; $i++) {
            if ($i === 3) {
                continue;
            }
            echo $i;
        }
        ```
      options:
        - "12"
        - "1245"
        - "12345"
        - "45"
      answer: 1
      explanation: "На i равном 3 команда continue пропускает echo, но цикл продолжается: печатаются 1, 2, 4 и 5."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        for ($i = 1; $i <= 5; $i++) {
            if ($i === 3) {
                break;
            }
            echo $i;
        }
        ```
      options:
        - "12"
        - "1245"
        - "123"
        - "12345"
      answer: 0
      explanation: "На i равном 3 break завершает цикл целиком. До этого напечатаны 1 и 2."
    - id: "q3"
      type: "single"
      prompt: |
        Сколько звёздочек напечатает программа?

        ```php
        <?php
        for ($i = 1; $i <= 2; $i++) {
            for ($j = 1; $j <= 3; $j++) {
                echo "*";
            }
        }
        ```
      options:
        - "5"
        - "6"
        - "3"
        - "2"
      answer: 1
      explanation: "Внешний цикл выполняется 2 раза, внутренний каждый раз 3 раза: 2 * 3 = 6."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        for ($i = 1; $i <= 3; $i++) {
            for ($j = 1; $j <= 3; $j++) {
                if ($j === 2) {
                    break;
                }
                echo "{$i}{$j} ";
            }
        }
        ```
      options:
        - "11 21 31 "
        - "11 "
        - "11 12 21 22 31 32 "
        - "11 12 13 "
      answer: 0
      explanation: "break завершает только внутренний цикл. Для каждого i внутренний цикл успевает напечатать только j равное 1."
    - id: "q5"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```php
        <?php
        $i = 0;
        while ($i < 5) {
            if ($i === 2) {
                continue;
            }
            echo $i;
            $i++;
        }
        ```
      options:
        - "Напечатается 01234"
        - "Напечатается 0134"
        - "Напечатается 01 и программа зависнет"
        - "Fatal error"
      answer: 2
      explanation: "На i равном 2 выполняется continue, а $i++ пропускается. Значение не меняется, и цикл навсегда остаётся на этой итерации."
exercise:
  id: "php.from-zero.loop-control.exercise"
  title: "Лента кассы: пропуски и стоп-строка"
  prompt: |
    Касса читает ленту цен. Первая строка ввода - число `n`, количество строк ленты. Далее идут `n` целых чисел, по одному на строке. Правила:

    * положительное число - цена товара, её нужно учесть;
    * отрицательное число - ошибка сканера, такую строку нужно **пропустить**;
    * ноль - конец чека, чтение **останавливается** (остальные строки игнорируются).

    Напечатайте две строки: `Принято: <сколько цен учтено>` и `Сумма: <сумма учтённых цен> руб.`.

    Заготовка читает числа в цикле. Допишите `continue` и `break` и накопление.

    **Пример.** Ввод:

    ```
    5
    100
    -5
    250
    0
    999
    ```

    Вывод:

    ```
    Принято: 2
    Сумма: 350 руб.
    ```
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Внутри цикла после чтения цены проверьте её: отрицательная цена - if ($price < 0) { continue; }."
    - "Ноль останавливает чтение: if ($price === 0) { break; }. Проверка на ноль должна стоять до учёта цены."
    - "Все остальные цены учитываются: $count++; $sum += $price;"
    - "Цикл for в заготовке читает ровно n строк, а break прерывает его раньше. Отрицательное число пропускается, но строка прочитана."
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "5\n100\n-5\n250\n0\n999\n"
      expected: "Принято: 2\nСумма: 350 руб.\n"
      hint: "Принимаются 100 и 250; -5 пропускается; на 0 чтение заканчивается, 999 не учитывается."
    - id: "no-stop"
      title: "Без стоп-строки"
      stdin: "3\n10\n20\n30\n"
      expected: "Принято: 3\nСумма: 60 руб.\n"
      hint: "Если нулей и ошибок нет, учитываются все n цен."
    - id: "only-negative"
      title: "Только ошибки (скрытый)"
      stdin: "3\n-1\n-2\n-3\n"
      expected: "Принято: 0\nСумма: 0 руб.\n"
      hidden: true
      hint: "Все строки отрицательные: ни одной цены не учтено, сумма 0."
    - id: "immediate-stop"
      title: "Ноль первой строкой (скрытый)"
      stdin: "4\n0\n50\n60\n70\n"
      expected: "Принято: 0\nСумма: 0 руб.\n"
      hidden: true
      hint: "Ноль в начале завершает чтение сразу: после него ничего не учитывается."
    - id: "skip-then-stop"
      title: "Пропуски до стоп-строки (скрытый)"
      stdin: "6\n-7\n15\n-3\n5\n0\n40\n"
      expected: "Принято: 2\nСумма: 20 руб.\n"
      hidden: true
      hint: "Учитываются только 15 и 5; отрицательные пропущены, 40 после нуля не читается."
