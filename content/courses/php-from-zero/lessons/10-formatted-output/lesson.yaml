id: "php.from-zero.formatted-output"
title: "Форматированный вывод: printf и number_format"
goal: "Напечатать числа и текст в заданном формате: с фиксированным числом знаков после точки и выравниванием."
difficulty: "easy"
estimatedMinutes: 30
prerequisites:
  - "php.from-zero.type-conversion"
objectives:
  - "Использовать printf с форматами %d, %s и %.2F."
  - "Задать ширину и выравнивание поля и объяснить, чем ширина отличается от точности."
  - "Отформатировать число с разделителем тысяч функцией number_format."
  - "Объяснить, почему echo показывает 0.3 для 0.1 + 0.2, а printf позволяет задать количество знаков."
masteryCriteria:
  - "Ваша программа печатает чек с числами, выровненными по правому краю."
  - "Вы предсказываете результат printf для форматов %5d, %-5d, %05d и %8.2F."
  - "Вы не используете форматы с локалью (%f) там, где нужен предсказуемый вывод."
concepts:
  introduces:
    - "php.printf"
    - "php.number-format"
  uses:
    - "php.stdin"
    - "php.fgets"
    - "php.trim"
    - "php.cast"
    - "php.float"
    - "php.int"
    - "php.string"
    - "php.arithmetic"
    - "php.rounding"
    - "php.escape-sequence"
next:
  - "php.from-zero.comparison-and-logic"
tags:
  - "php"
  - "printf"
  - "number-format"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа? Квадратные скобки показывают границы строки.

        ```php
        <?php
        printf("[%5d]\n", 42);
        ```
      options:
        - "[42]"
        - "[   42]"
        - "[42   ]"
        - "[00042]"
      answer: 1
      explanation: "Число после % задаёт ширину поля. По умолчанию число прижимается к правому краю и слева добавляются пробелы. Выравнивание влево - %-5d, нули слева - %05d."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        printf("%.2F\n", 3.14159);
        ```
      options:
        - "3.14159"
        - "3.1"
        - "3.14"
        - "3.15"
      answer: 2
      explanation: "%.2F выводит ровно два знака после точки и округляет значение: 3.14159 превращается в 3.14. Исходное значение переменной при этом не меняется."
    - id: "q3"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        printf("%d%%\n", 15);
        ```
      options:
        - "15%"
        - "15%%"
        - "15"
        - "Ошибку: неизвестный формат"
      answer: 0
      explanation: "Знак % в формате начинает спецификатор, поэтому сам символ процента записывают как %%. Сочетание %% печатает один знак %."
    - id: "q4"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```php
        <?php
        printf("%s: %d руб.\n", "хлеб");
        ```
      options:
        - "Напечатается «хлеб: 0 руб.»"
        - "Напечатается «хлеб:  руб.»"
        - "Fatal error: ArgumentCountError: 3 arguments are required, 2 given"
        - "Parse error"
      answer: 2
      explanation: "Формат содержит два спецификатора, значит, кроме самого формата нужны ещё два значения. Передано одно, поэтому PHP бросает ArgumentCountError."
    - id: "q5"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        echo number_format(1234567.891, 2, '.', ' '), "\n";
        ```
      options:
        - "1234567.89"
        - "1 234 567.89"
        - "1,234,567.89"
        - "1 234 567,891"
      answer: 1
      explanation: "Аргументы number_format: число, количество знаков, десятичный разделитель, разделитель тысяч. Здесь это 2, точка и пробел."
exercise:
  id: "php.from-zero.formatted-output.exercise"
  title: "Чек с выровненными числами"
  prompt: |
    На вход подаются цена товара (дробное число с точкой) и количество (целое), каждое на своей строке. Напечатайте чек из трёх строк. После двоеточия числа выровнены по правому краю в поле шириной 8 символов; цена и итог печатаются с двумя знаками после точки.

    ```
    Цена:       <цена>
    Количество: <количество>
    Итого:      <цена * количество>
    ```

    Подписи `Цена:`, `Количество:`, `Итого:` дополняйте пробелами до одинаковой длины прямо в тексте формата: ширина `%8` относится только к числу, а выравнивание кириллицы через `printf` ненадёжно (подробнее - в теории урока).

    **Пример.** Ввод:

    ```
    12.5
    4
    ```

    Вывод:

    ```
    Цена:          12.50
    Количество:        4
    Итого:         50.00
    ```

    Между двоеточием и числом ровно столько пробелов, сколько нужно, чтобы длина всей строки с числом была одинакова: подпись, пробелы-разделитель и поле в 8 символов.
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Прочитайте цену и количество так же, как в прошлом уроке, и превратите их в число: (float) и (int)."
    - "Итог - $price * $count. Каждую строку чека выводите одним вызовом printf."
    - "Формат строки с ценой: printf(\"Цена:       %8.2F\\n\", $price); Подпись и пробелы - обычный текст, %8.2F - число шириной 8 с двумя знаками."
    - "Для количества нужен %8d (целое число), для итога - %8.2F. Длины подписей уже выровнены пробелами: после «Цена:» семь пробелов, после «Количество:» один, после «Итого:» шесть."
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "12.5\n4\n"
      expected: "Цена:          12.50\nКоличество:        4\nИтого:         50.00\n"
      hint: "Столбцы чека выровнены по правому краю в поле шириной 8, цена и итог - с двумя знаками после точки."
    - id: "price2"
      title: "Другие числа"
      stdin: "99.99\n3\n"
      expected: "Цена:          99.99\nКоличество:        3\nИтого:        299.97\n"
      hint: "Итог 99.99 * 3 печатается как 299.97 с двумя знаками; количество - целое, без дробной части."
    - id: "zeros"
      title: "Копейки добавляются нулями (скрытый)"
      stdin: "7\n1\n"
      expected: "Цена:           7.00\nКоличество:        1\nИтого:          7.00\n"
      hidden: true
      hint: "Целая цена 7 должна печататься как 7.00: два знака после точки нужны всегда."
    - id: "wide"
      title: "Число занимает всё поле (скрытый)"
      stdin: "1250.5\n10\n"
      expected: "Цена:        1250.50\nКоличество:       10\nИтого:      12505.00\n"
      hidden: true
      hint: "Число 12505.00 занимает ровно 8 символов, лишних пробелов перед ним быть не должно."
    - id: "float"
      title: "Накопленная погрешность (скрытый)"
      stdin: "0.1\n3\n"
      expected: "Цена:           0.10\nКоличество:        3\nИтого:          0.30\n"
      hidden: true
      hint: "0.1 * 3 хранится как 0.30000000000000004, а на экране должно быть 0.30: нужно форматирование до двух знаков."
    - id: "zero"
      title: "Нули (скрытый)"
      stdin: "0\n0\n"
      expected: "Цена:           0.00\nКоличество:        0\nИтого:          0.00\n"
      hidden: true
      hint: "Нулевые значения печатаются как 0.00 и 0 в тех же колонках."
