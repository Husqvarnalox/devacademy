id: "php.from-zero.reading-errors"
title: "Как читать сообщения об ошибках"
goal: "Найти по сообщению PHP строку с ошибкой, понять её причину и исправить программу."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "php.from-zero.first-program"
objectives:
  - "Назвать три вида сообщений PHP - Parse error, Fatal error, Warning - и сказать, что происходит с программой в каждом случае."
  - "Найти в сообщении номер строки и причину."
  - "Исправить программу с несколькими ошибками, читая сообщения по одному."
masteryCriteria:
  - "Вы исправляете пропущенную точку с запятой, опечатку в команде и незакрытые кавычки."
  - "Вы знаете, что при ошибке разбора не выполняется ни одной команды, а при Fatal error остаётся вывод, напечатанный раньше."
  - "Вы замечаете, что PHP указывает на строку, где обнаружил проблему, и она может быть следующей после ошибочной."
concepts:
  introduces:
    - "php.error-message"
  uses:
    - "php.echo"
    - "php.string-literal"
    - "php.open-tag"
next:
  - "php.from-zero.output"
tags:
  - "php"
  - "errors"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        В программе из пяти команд `echo` на пятой строке пропущена точка с запятой после `echo "..."` на третьей. Что окажется на экране?
      options:
        - "Результат первых двух команд."
        - "Результат первых четырёх команд."
        - "Ничего из команд: PHP сообщит Parse error и не выполнит программу."
        - "Результат всех команд, а ошибка появится в конце."
      answer: 2
      explanation: "Перед выполнением PHP разбирает весь файл. Если в нём есть синтаксическая ошибка (Parse error), ни одна команда не выполняется. Поэтому на экране нет вывода, а есть только сообщение об ошибке."
    - id: "q2"
      type: "single"
      prompt: |
        PHP сообщает `Parse error: syntax error, unexpected token "echo", expecting "," or ";" ... on line 6`. Где вероятнее всего пропущена точка с запятой?
      options:
        - "В конце строки 5 (перед указанной)."
        - "В начале строки 6."
        - "В самой последней строке файла."
        - "Перед строкой <?php."
      answer: 0
      explanation: "PHP понимает, что команда не закончилась, только когда видит следующее слово. Поэтому он указывает на строку 6, где встретилось неожиданное echo, а пропуск находится в конце строки 5."
    - id: "q3"
      type: "single"
      prompt: |
        Что появится в стандартном выводе, когда программа выполнится? (Сообщения об ошибках приходят отдельно.)

        ```php
        <?php
        echo "Старт\n";
        prnt("Привет\n");
        echo "Финиш\n";
        ```
      options:
        - "Ничего."
        - "Старт"
        - "Старт, Привет, Финиш"
        - "Финиш"
      answer: 1
      explanation: "Эта программа синтаксически верна, поэтому первая команда выполняется. Дойдя до prnt, PHP сообщает Fatal error: Call to undefined function prnt() и останавливается. Третья команда уже не выполняется, а то, что было напечатано раньше, остаётся."
    - id: "q4"
      type: "single"
      prompt: "Что означает сообщение `Call to undefined function prnt()`?"
      options:
        - "Функция prnt вызвана, но возвращает ошибку."
        - "PHP не знает функции с таким именем: вероятно, опечатка."
        - "Функцию prnt нужно вызывать с большой буквы."
        - "Функцию prnt можно вызвать только один раз."
      answer: 1
      explanation: "Undefined function - «неопределённая функция». Такой команды нет ни в языке, ни в программе. Чаще всего это опечатка в названии: print, echo."
    - id: "q5"
      type: "single"
      prompt: "Какая часть сообщения PHP показывает, где искать ошибку?"
      options:
        - "Слово Parse в начале."
        - "Слова on line и число после них."
        - "Слово syntax."
        - "Ничего: PHP не сообщает место ошибки."
      answer: 1
      explanation: "Фраза on line N даёт номер строки в файле. С него начинают поиск, а затем смотрят на предыдущую строку."
exercise:
  id: "php.from-zero.reading-errors.exercise"
  title: "Исправьте программу с ошибками"
  prompt: |
    В программе несколько ошибок, из-за которых она не запускается. PHP сообщает о них по одной: исправьте первую, запустите, прочитайте следующее сообщение.

    После исправления программа должна напечатать ровно четыре строки:

    ```
    Касса открыта
    Товар: хлеб
    Итого: 45 руб.
    Спасибо за покупку!
    ```

    Менять нужно только то, что мешает запуску. Тексты в кавычках менять не нужно.
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Нажмите «Запустить» и прочитайте сообщение: в нём есть слова on line и номер строки. Исправляйте только одну ошибку за раз."
    - "Первая ошибка: PHP жалуется на строку 3, а пропуск находится в конце строки 2 - там не хватает точки с запятой."
    - "Вторая ошибка в слове ech: у команды вывода другое название. Третья - у последнего текста нет закрывающей кавычки перед точкой с запятой."
    - "Верные строки: echo \"Товар: хлеб\\n\"; и echo \"Спасибо за покупку!\\n\"; - с закрывающей кавычкой перед точкой с запятой."
  tests:
    - id: "basic"
      title: "Печатаются четыре строки"
      stdin: ""
      expected: |
        Касса открыта
        Товар: хлеб
        Итого: 45 руб.
        Спасибо за покупку!
      hint: "Программа должна напечатать четыре строки из условия, каждая с новой строки."
    - id: "exact"
      title: "Тексты не изменены (скрытый)"
      stdin: ""
      expected: |
        Касса открыта
        Товар: хлеб
        Итого: 45 руб.
        Спасибо за покупку!
      hidden: true
      hint: "Проверяется точное совпадение: тексты в кавычках должны остаться такими же, как в условии, включая точку после «руб» и восклицательный знак."
