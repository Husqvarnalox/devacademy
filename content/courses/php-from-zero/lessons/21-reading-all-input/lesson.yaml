id: "php.from-zero.reading-all-input"
title: "Чтение всего ввода"
goal: "Читать строки до конца ввода, не зная их числа, и аккуратно пропускать пустые и неправильные строки."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "php.from-zero.string-functions"
objectives:
  - "Читать ввод циклом while (($line = fgets(STDIN)) !== false)."
  - "Проверять, что строка - целое число, через filter_var и FILTER_VALIDATE_INT."
  - "Пропускать пустые строки и считать неправильные, не ломая программу."
masteryCriteria:
  - "Ваша программа считает принятые и пропущенные строки и сумму принятых чисел."
  - "Вы сравниваете результат fgets и filter_var с false строго."
  - "Вы отличаете конец ввода от пустой строки."
concepts:
  introduces:
    - "php.read-lines"
  uses:
    - "php.stdin"
    - "php.fgets"
    - "php.trim"
    - "php.while"
    - "php.break-continue"
    - "php.if"
    - "php.strict-equality"
    - "php.is-numeric"
    - "php.bool"
    - "php.int"
    - "php.cast"
    - "php.foreach"
    - "php.array"
    - "php.compound-assignment"
    - "php.strict-types"
next:
  - "php.from-zero.exceptions"
tags:
  - "php"
  - "input"
  - "stdin"
  - "validation"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа при пустом вводе?

        ```php
        <?php
        $n = 0;
        while (($line = fgets(STDIN)) !== false) {
            $n++;
        }
        echo $n;
        ```
      options:
        - "0"
        - "1"
        - "Ошибку"
        - "Ничего"
      answer: 0
      explanation: "fgets сразу вернёт false, и тело цикла не выполнится ни разу, поэтому $n остаётся 0."
    - id: "q2"
      type: "single"
      prompt: |
        Что вернёт `filter_var("0", FILTER_VALIDATE_INT)`?
      options:
        - "false"
        - "int(0)"
        - "null"
        - "Пустую строку"
      answer: 1
      explanation: "Строка «0» - допустимое целое число. Вернётся int(0), поэтому результат сравнивают с false строго."
    - id: "q3"
      type: "single"
      prompt: |
        Что вернёт `filter_var("5.0", FILTER_VALIDATE_INT)`?
      options:
        - "int(5)"
        - "float(5)"
        - "false"
        - "int(0)"
      answer: 2
      explanation: "Запись с дробной частью не считается целым числом, даже если дробная часть нулевая."
    - id: "q4"
      type: "single"
      prompt: |
        Ввод состоит из трёх строк: `4`, пустая строка и `x`. Программа из примера урока считает принятые и пропущенные строки. Что она напечатает в первых двух строках?
      options:
        - "Принято: 1, Пропущено: 1"
        - "Принято: 1, Пропущено: 2"
        - "Принято: 2, Пропущено: 1"
        - "Принято: 3, Пропущено: 0"
      answer: 0
      explanation: "Число 4 принято, пустая строка пропущена молча и нигде не учтена, а x не прошло проверку и попало в пропущенные."
    - id: "q5"
      type: "single"
      prompt: |
        Чем плохо условие `while ($line = fgets(STDIN))`?
      options:
        - "Цикл не запустится никогда"
        - "Последняя строка «0» без перевода строки считается ложной, и цикл остановится раньше конца ввода"
        - "fgets не принимает STDIN"
        - "Будет бесконечный цикл"
      answer: 1
      explanation: "Строка «0» в булевом контексте ложна. Строгое сравнение с false отличает конец ввода от такой строки."
exercise:
  id: "php.from-zero.reading-all-input.exercise"
  title: "Сумма чисел из ввода"
  prompt: |
    На вход подаётся неизвестное число строк. Каждая строка - либо целое число, либо что-то другое, либо пустая.

    * Пустые строки (после удаления пробелов по краям) игнорируйте и нигде не учитывайте.
    * Строки, которые не являются целым числом (`abc`, `2.5`, `12px`), считайте пропущенными.
    * Остальные строки считайте принятыми и складывайте.

    Выведите три строки: `Принято: N`, `Пропущено: M`, `Сумма: S`. Если ввод пуст, все три значения равны нулю.

    **Пример.** Ввод:

    ```
    10
    abc

    -3
    2.5
    7
    ```

    Вывод:

    ```
    Принято: 3
    Пропущено: 2
    Сумма: 14
    ```
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Цикл чтения: while (($line = fgets(STDIN)) !== false) { ... }. Не забудьте скобки вокруг присваивания."
    - "Внутри цикла сначала $line = trim($line); пустую строку пропустите через continue."
    - "Проверка числа: $number = filter_var($line, FILTER_VALIDATE_INT); если $number === false, увеличьте $skipped и сделайте continue."
    - "Для принятой строки: $accepted++; $sum += $number;. Число 0 тоже принимается - сравнивайте строго с false."
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "10\nabc\n\n-3\n2.5\n7\n"
      expected: "Принято: 3\nПропущено: 2\nСумма: 14\n"
      hint: "Принятые 10, -3 и 7 дают 14; abc и 2.5 пропущены, пустая строка не учитывается."
    - id: "all-good"
      title: "Все строки верные"
      stdin: "1\n2\n3\n"
      expected: "Принято: 3\nПропущено: 0\nСумма: 6\n"
      hint: "Когда плохих строк нет, пропущено ноль, а сумма - сумма всех чисел."
    - id: "zero"
      title: "Ноль - обычное число (скрытый)"
      stdin: "0\n5\n0\n"
      expected: "Принято: 3\nПропущено: 0\nСумма: 5\n"
      hidden: true
      hint: "Число 0 - допустимое значение: его нужно принять, а не отбросить. Сравнивайте результат filter_var строго с false."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: "Принято: 0\nПропущено: 0\nСумма: 0\n"
      hidden: true
      hint: "Если во вводе нет ни одной строки, программа должна напечатать три нуля, а не упасть."
    - id: "no-last-newline"
      title: "Нет перевода строки в конце (скрытый)"
      stdin: "4\n-1\nx\n9"
      expected: "Принято: 3\nПропущено: 1\nСумма: 12\n"
      hidden: true
      hint: "Последняя строка может прийти без перевода строки - её тоже нужно обработать."
