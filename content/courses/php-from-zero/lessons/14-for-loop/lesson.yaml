id: "php.from-zero.for-loop"
title: "Цикл for"
goal: "Повторять действие заданное число раз, управляя счётчиком в заголовке цикла."
difficulty: "easy"
estimatedMinutes: 30
prerequisites:
  - "php.from-zero.while-loop"
objectives:
  - "Записать цикл for из трёх частей: начало, условие, шаг."
  - "Считать вверх и вниз, менять шаг счётчика и использовать счётчик в вычислениях."
  - "Определять число итераций по границам и различать < и <=."
masteryCriteria:
  - "Ваша программа печатает строки таблицы для всех количеств от 1 до введённого числа, и при нуле печатает только итог."
  - "Вы предсказываете, сколько раз выполнится тело цикла и чему равен счётчик после него."
  - "Вы заменяете цикл while эквивалентным for и наоборот."
concepts:
  introduces:
    - "php.for"
  uses:
    - "php.while"
    - "php.comparison"
    - "php.arithmetic"
    - "php.compound-assignment"
    - "php.variable"
    - "php.interpolation"
    - "php.stdin"
    - "php.fgets"
    - "php.trim"
    - "php.cast"
next:
  - "php.from-zero.loop-control"
tags:
  - "php"
  - "for"
  - "loops"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        for ($i = 0; $i < 3; $i++) {
            echo $i;
        }
        ```
      options:
        - "012"
        - "123"
        - "0123"
        - "01"
      answer: 0
      explanation: "Счёт начинается с 0 и идёт, пока i < 3: значения 0, 1, 2. При i равном 3 условие ложно."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        for ($i = 10; $i > 0; $i -= 3) {
            echo $i, " ";
        }
        ```
      options:
        - "10 7 4 1 "
        - "10 7 4 "
        - "10 7 4 1 -2 "
        - "10 3 "
      answer: 0
      explanation: "Значения 10, 7, 4, 1. Следующее значение -2 не проходит условие $i > 0, и цикл заканчивается."
    - id: "q3"
      type: "single"
      prompt: |
        Сколько раз выполнится тело цикла?

        ```php
        <?php
        for ($i = 1; $i <= 5; $i++) {
            echo "*";
        }
        ```
      options:
        - "4 раза"
        - "5 раз"
        - "6 раз"
        - "Бесконечно"
      answer: 1
      explanation: "Значения счётчика 1, 2, 3, 4, 5 - пять проходов. Знак <= включает границу."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        for ($i = 0; $i < 3; $i++) {
        }
        echo $i;
        ```
      options:
        - "2"
        - "3"
        - "Warning: Undefined variable $i"
        - "ничего"
      answer: 1
      explanation: "В PHP счётчик не пропадает после цикла. Цикл остановился, когда i стало 3 и условие 3 < 3 оказалось ложным."
    - id: "q5"
      type: "single"
      prompt: |
        Что сообщит PHP?

        ```php
        <?php
        for ($i = 0, $i < 3, $i++) {
            echo $i;
        }
        ```
      options:
        - "Parse error: syntax error, unexpected token \")\", expecting \";\""
        - "Напечатает 012"
        - "Warning: Undefined variable $i"
        - "Fatal error: Uncaught Error"
      answer: 0
      explanation: "Части заголовка for разделяются точками с запятой. Запятая допустима только внутри одной части."
exercise:
  id: "php.from-zero.for-loop.exercise"
  title: "Таблица цен по количеству"
  prompt: |
    На вход подаются два целых числа, каждое на своей строке: цена одной штуки в рублях и максимальное количество `n` (от 0 до 50). Напечатайте таблицу стоимости для каждого количества от 1 до `n`, а затем строку с итогом:

    ```
    <количество> шт. - <стоимость> руб.
    ...
    Итого позиций: <n>
    ```

    Если `n` равно 0, таблицы нет, выводится только итоговая строка.

    **Пример.** Ввод:

    ```
    45
    3
    ```

    Вывод:

    ```
    1 шт. - 45 руб.
    2 шт. - 90 руб.
    3 шт. - 135 руб.
    Итого позиций: 3
    ```
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Нужен цикл for: счётчик количества идёт от 1 до $maxCount. В заголовке: for ($count = 1; $count <= $maxCount; $count++)."
    - "Внутри цикла вычислите стоимость как $price * $count и напечатайте строку с подстановками: echo \"{$count} шт. - {$total} руб.\\n\";"
    - "Строка «Итого позиций» печатается один раз после цикла, а не внутри него."
    - "При $maxCount равном 0 условие $count <= $maxCount ложно сразу, цикл не выполняется, и печатается только итог."
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "45\n3\n"
      expected: "1 шт. - 45 руб.\n2 шт. - 90 руб.\n3 шт. - 135 руб.\nИтого позиций: 3\n"
      hint: "Три строки таблицы (45, 90, 135) и итоговая строка «Итого позиций: 3»."
    - id: "single"
      title: "Одна позиция"
      stdin: "120\n1\n"
      expected: "1 шт. - 120 руб.\nИтого позиций: 1\n"
      hint: "При n = 1 в таблице одна строка и итог «Итого позиций: 1»."
    - id: "zero"
      title: "Нет позиций (скрытый)"
      stdin: "99\n0\n"
      expected: "Итого позиций: 0\n"
      hidden: true
      hint: "При n = 0 таблица пуста: цикл не выполняется, печатается только итоговая строка."
    - id: "large"
      title: "Десять позиций (скрытый)"
      stdin: "7\n10\n"
      expected: "1 шт. - 7 руб.\n2 шт. - 14 руб.\n3 шт. - 21 руб.\n4 шт. - 28 руб.\n5 шт. - 35 руб.\n6 шт. - 42 руб.\n7 шт. - 49 руб.\n8 шт. - 56 руб.\n9 шт. - 63 руб.\n10 шт. - 70 руб.\nИтого позиций: 10\n"
      hidden: true
      hint: "Последняя строка таблицы должна быть для количества n включительно (условие <=)."
