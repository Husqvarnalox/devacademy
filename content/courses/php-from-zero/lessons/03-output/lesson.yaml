id: "php.from-zero.output"
title: "Вывод: несколько значений, \\n, \\t и кавычки"
goal: "Напечатать строки с переводом строки, табуляцией, кавычками и обратной косой чертой."
difficulty: "intro"
estimatedMinutes: 25
prerequisites:
  - "php.from-zero.reading-errors"
objectives:
  - "Передать echo несколько значений через запятую."
  - "Использовать знаки \\n, \\t, \\\", \\\\ и \\$ в строках с двойными кавычками."
  - "Различать двойные и одинарные кавычки: в одинарных знаки \\n и \\t не работают."
  - "Оставить в программе комментарий, который PHP пропускает."
masteryCriteria:
  - "Ваша программа печатает кавычки, табуляцию, обратную косую черту и знак доллара в тексте."
  - "Вы предсказываете, какая из двух строк с \\n напечатает перевод строки: в двойных кавычках или в одинарных."
concepts:
  introduces:
    - "php.escape-sequence"
    - "php.single-quoted-string"
    - "php.comment"
  uses:
    - "php.echo"
    - "php.string-literal"
    - "php.error-message"
next:
  - "php.from-zero.variables"
tags:
  - "php"
  - "echo"
  - "escape-sequence"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        echo 'Цена\tитого', "\n";
        ```
      options:
        - "Цена, табуляция, итого"
        - "Цена\\tитого"
        - "Цена итого (через пробел)"
        - "Ошибку: в одинарных кавычках нельзя писать \\t"
      answer: 1
      explanation: "В одинарных кавычках знаки \\t и \\n не превращаются в специальные символы, они печатаются как есть: обратная косая черта и буква. Табуляция получилась бы в двойных кавычках. Перевод строки напечатала вторая часть команды."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        echo "a", "b", "\n";
        ```
      options:
        - "a b"
        - "ab"
        - "a, b"
        - "ab\\n"
      answer: 1
      explanation: "Значения через запятую печатаются подряд, без пробелов между ними. Пробелы нужно ставить в тексте самим. Знак \\n в двойных кавычках - перевод строки."
    - id: "q3"
      type: "single"
      prompt: |
        Как напечатать `Он сказал: "Готово"` в двойных кавычках?

        ```php
        <?php
        echo "Он сказал: ???\n";
        ```
      options:
        - "\"Готово\""
        - "\\\"Готово\\\""
        - "(\"Готово\")"
        - "''Готово''"
      answer: 1
      explanation: "Внутри строки в двойных кавычках кавычку, которая должна напечататься, защищают обратной косой чертой: \\\". Без неё PHP решит, что строка закончилась."
    - id: "q4"
      type: "single"
      prompt: |
        Что не так в этой команде?

        ```php
        <?php
        echo 'It's open';
        ```
      options:
        - "Апостроф в слове It's закрывает строку раньше времени."
        - "Одинарные кавычки запрещены в PHP."
        - "Нет знака \\n."
        - "Ничего: команда верна."
      answer: 0
      explanation: "Строка в одинарных кавычках заканчивается на первом непомеченном апострофе. Исправить можно так: 'It\\'s open' или \"It's open\"."
    - id: "q5"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        echo "А\n";
        // echo "Б\n";
        echo "В\n";
        ```
      options:
        - "А, Б, В - каждая на своей строке"
        - "А и В - каждая на своей строке"
        - "Только А"
        - "Ошибку разбора"
      answer: 1
      explanation: "Строка, которая начинается с //, - комментарий: PHP её пропускает. Поэтому «Б» не печатается."
exercise:
  id: "php.from-zero.output.exercise"
  title: "Чек с кавычками, табуляцией и косой чертой"
  prompt: |
    В заготовке напечатана первая строка чека, а остальные записаны комментариями-подсказками. Допишите команды `echo` так, чтобы программа напечатала ровно пять строк:

    ```
    Чек
    Товар: "Хлеб"
    Цена:	45 руб.
    Файл: C:\kassa\check.txt
    Имя переменной: $price
    ```

    Между словом `Цена:` и числом стоит один **знак табуляции**, а не пробелы. Кавычки вокруг слова «Хлеб», обратные косые черты в пути и знак доллара должны напечататься как есть.
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Каждая строка - отдельная команда echo с \\n в конце. Кавычку внутри текста в двойных кавычках защищают обратной косой чертой: \\\"."
    - "Табуляция - знак \\t. Чтобы напечатать одну обратную косую черту, нужно написать две подряд: \\\\. Чтобы напечатать знак доллара перед словом, пишут \\$."
    - "Вторая строка: echo \"Товар: \\\"Хлеб\\\"\\n\"; Третья: echo \"Цена:\\t45 руб.\\n\";"
    - "Четвёртая: echo \"Файл: C:\\\\kassa\\\\check.txt\\n\"; Пятая: echo \"Имя переменной: \\$price\\n\";"
  tests:
    - id: "basic"
      title: "Все пять строк чека"
      stdin: ""
      expected: "Чек\nТовар: \"Хлеб\"\nЦена:\t45 руб.\nФайл: C:\\kassa\\check.txt\nИмя переменной: $price\n"
      hint: "Должно быть ровно пять строк. Проверьте кавычки вокруг «Хлеб», знак табуляции после «Цена:», по одной обратной косой черте в пути и знак доллара перед price."
    - id: "exact"
      title: "Точные символы (скрытый)"
      stdin: ""
      expected: "Чек\nТовар: \"Хлеб\"\nЦена:\t45 руб.\nФайл: C:\\kassa\\check.txt\nИмя переменной: $price\n"
      hidden: true
      hint: "Проверяется точное совпадение: после «Цена:» ровно один знак табуляции (\\t), а не пробелы; в пути одна обратная косая черта между частями; никаких лишних пробелов в конце."
