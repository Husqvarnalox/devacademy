id: "php.from-zero.arrays"
title: "Массивы: список значений"
goal: "Хранить несколько значений в одном массиве, читать их по индексу, добавлять и обходить циклом foreach."
difficulty: "easy"
estimatedMinutes: 40
prerequisites:
  - "php.from-zero.functions"
objectives:
  - "Создать массив, прочитать и изменить элемент по индексу, добавить элемент в конец и узнать длину через count."
  - "Обойти массив циклом foreach, с индексом и без."
  - "Передать массив в функцию и вернуть массив из функции."
  - "Прочитать предупреждение Undefined array key и объяснить его причину."
masteryCriteria:
  - "Ваши функции работают для любого размера массива и для отрицательных значений."
  - "Вы указываете индекс последнего элемента как count($a) - 1."
  - "Вы объясняете, что функция получает копию массива."
concepts:
  introduces:
    - "php.array"
    - "php.index"
    - "php.append"
    - "php.count"
    - "php.foreach"
  uses:
    - "php.function"
    - "php.parameter"
    - "php.return"
    - "php.type-declaration"
    - "php.strict-types"
    - "php.for"
    - "php.if"
    - "php.comparison"
    - "php.arithmetic"
    - "php.compound-assignment"
    - "php.interpolation"
    - "php.stdin"
    - "php.fgets"
    - "php.trim"
    - "php.cast"
next:
  - "php.from-zero.array-functions"
tags:
  - "php"
  - "arrays"
  - "foreach"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $a = [5, 8, 12];
        echo $a[1] + $a[2];
        ```
      options:
        - "20"
        - "17"
        - "13"
        - "Warning: Undefined array key 3"
      answer: 0
      explanation: "Индексы начинаются с нуля: $a[1] равно 8, $a[2] равно 12, сумма 20."
    - id: "q2"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $a = [1, 2];
        $a[] = 3;
        $a[] = 4;
        echo count($a);
        ```
      options:
        - "2"
        - "4"
        - "3"
        - "34"
      answer: 1
      explanation: "Запись $a[] = ... добавляет элемент в конец. После двух добавлений в массиве четыре элемента."
    - id: "q3"
      type: "single"
      prompt: |
        Что произойдёт при запуске?

        ```php
        <?php
        $a = ["a", "b", "c"];
        echo $a[3];
        ```
      options:
        - "Напечатается c"
        - "Warning: Undefined array key 3, и ничего не напечатается"
        - "Fatal error и остановка программы"
        - "Напечатается a"
      answer: 1
      explanation: "Индексы здесь 0, 1 и 2. Чтение несуществующего индекса даёт предупреждение и значение null, которое echo печатает как пустую строку."
    - id: "q4"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $sum = 0;
        foreach ([2, 4, 6] as $x) {
            $sum += $x;
        }
        echo $sum;
        ```
      options:
        - "6"
        - "12"
        - "246"
        - "0"
      answer: 1
      explanation: "foreach поочерёдно кладёт в $x значения 2, 4 и 6; сумма равна 12."
    - id: "q5"
      type: "single"
      prompt: |
        Что напечатает программа?

        ```php
        <?php
        $a = [1, 2, 3];
        $b = $a;
        $b[] = 4;
        echo count($a);
        ```
      options:
        - "3"
        - "4"
        - "7"
        - "Warning"
      answer: 0
      explanation: "Присваивание массива создаёт независимую копию. Добавление в $b не меняет $a, в котором по-прежнему три элемента."
exercise:
  id: "php.from-zero.arrays.exercise"
  title: "Температуры: максимум и дни выше порога"
  prompt: |
    Метеостанция записала температуру за `n` дней. В заготовке две функции, которые нужно дописать:

    * **`maxValue(array $values): int`** - наибольшее значение в массиве (массив не пуст);
    * **`countAbove(array $values, int $limit): int`** - сколько значений **строго больше** `$limit`.

    Готовые функции `max` и `array_filter` пока не используйте: обойдите массив циклом `foreach`.

    На вход подаются: число `n` (от 1 до 100), порог температуры и затем `n` целых температур, по одной на строке (они могут быть отрицательными). Остальной код уже читает ввод и печатает три строки.

    **Пример.** Ввод:

    ```
    4
    20
    18
    21
    25
    19
    ```

    Вывод:

    ```
    Дней: 4
    Максимум: 25
    Дней выше 20: 2
    ```
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Обход: foreach ($values as $value) { ... }. Внутри сравнивайте $value с лучшим значением, найденным ранее."
    - "Для максимума начните с первого элемента: $best = $values[0]; при нуле в качестве старта отрицательные температуры дадут неверный ответ."
    - "В countAbove заведите счётчик $count = 0 и увеличивайте его при $value > $limit. Знак строгий: значения, равные порогу, не считаются."
    - "Обе функции должны возвращать результат через return, а не печатать его."
  tests:
    - id: "basic"
      title: "Пример из условия"
      stdin: "4\n20\n18\n21\n25\n19\n"
      expected: "Дней: 4\nМаксимум: 25\nДней выше 20: 2\n"
      hint: "Максимум 25; выше 20 только 21 и 25, то есть два дня."
    - id: "single"
      title: "Один день"
      stdin: "1\n10\n7\n"
      expected: "Дней: 1\nМаксимум: 7\nДней выше 10: 0\n"
      hint: "Один элемент: он же и максимум, а выше порога 10 нет ни одного дня."
    - id: "negatives"
      title: "Только отрицательные (скрытый)"
      stdin: "3\n-10\n-8\n-5\n-12\n"
      expected: "Дней: 3\nМаксимум: -5\nДней выше -10: 2\n"
      hidden: true
      hint: "Максимум отрицательный (-5): начальное значение для поиска максимума должно быть первым элементом, а не 0."
    - id: "equal-limit"
      title: "Значения равны порогу (скрытый)"
      stdin: "4\n20\n20\n20\n21\n20\n"
      expected: "Дней: 4\nМаксимум: 21\nДней выше 20: 1\n"
      hidden: true
      hint: "Значения, равные порогу 20, в счёт не входят: сравнение строгое (>), выше только 21."
    - id: "first-max"
      title: "Максимум в начале (скрытый)"
      stdin: "5\n0\n30\n10\n20\n5\n-3\n"
      expected: "Дней: 5\nМаксимум: 30\nДней выше 0: 4\n"
      hidden: true
      hint: "Максимум стоит первым элементом (30); выше нуля четыре значения из пяти."
