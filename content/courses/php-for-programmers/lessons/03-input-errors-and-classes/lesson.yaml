id: "php.programmers.input-errors-and-classes"
title: "Ввод, исключения и классы: строгий разбор и защита данных"
goal: "Читать ввод до конца, разбирать числа строго, различать Exception и Error, бросать исключения подходящего типа и писать классы, которые защищают свои данные."
difficulty: "medium"
estimatedMinutes: 50
prerequisites:
  - "php.programmers.functions-and-collections"
next:
  - "php.first-steps.how-php-runs"
objectives:
  - "Читать STDIN до конца циклом с проверкой !== false и объяснять, почему while ($line = fgets(...)) теряет строку 0."
  - "Различать ошибки данных и ошибки программиста, а также Exception и Error, и ловить несколько типов через |."
  - "Предсказывать порядок try, catch и finally, включая return внутри try."
  - "Писать класс с продвижением свойств конструктора, типизированными и readonly-свойствами и методами."
  - "Объяснять, что объекты передаются по идентификатору, чем отличаются clone, == и ===."
masteryCriteria:
  - "parseItem и Item принимают корректные строки, включая количество 0, и бросают InvalidArgumentException с нужным сообщением для остальных."
  - "Квиз пройден с результатом не ниже 70%."
tags:
  - "php"
  - "programmers"
  - "exceptions"
  - "classes"
  - "input"
assessmentFor:
  - "php.from-zero.reading-all-input"
  - "php.from-zero.exceptions"
  - "php.from-zero.classes-intro"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        $stream = fopen('php://memory', 'w+');
        fwrite($stream, "3\n7\n0");
        rewind($stream);
        while ($line = fgets($stream)) {
            echo '[', trim($line), ']';
        }
        ```
      options:
        - "[3][7]"
        - "[3][7][0]"
        - "[3][7][0][]"
        - "[3]"
      answer: 0
      explanation: "fgets возвращает последнюю строку без перевода строки, то есть \"0\". Строка \"0\" ложна, поэтому условие while прекращает цикл. Правильная проверка - сравнение результата с false через !==."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        function f(): string
        {
            try {
                return "a";
            } finally {
                echo "b";
            }
        }
        echo f();
        ```
      options:
        - "ba"
        - "ab"
        - "a"
        - "b"
      answer: 0
      explanation: "Значение return вычисляется, затем выполняется блок finally и печатает b, и только после этого функция возвращает a, которое печатает echo. Получается ba."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        declare(strict_types=1);
        function f(int $x): int
        {
            return $x;
        }
        try {
            f("1");
            echo "A";
        } catch (Exception $e) {
            echo "B";
        } catch (Error $e) {
            echo "C";
        } finally {
            echo "D";
        }
        ```
      options:
        - "CD"
        - "AD"
        - "BD"
        - "D и неперехваченная ошибка"
      answer: 0
      explanation: "В строгом режиме передача строки в параметр int бросает TypeError. Он наследует Error, а не Exception, поэтому блок catch (Exception) его пропускает и срабатывает catch (Error). Блок finally выполняется в любом случае."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        class Box
        {
            public function __construct(public int $n)
            {
            }
        }
        $a = new Box(1);
        $b = $a;
        $b->n = 2;
        $c = clone $a;
        $c->n = 3;
        echo $a->n, $b->n, $c->n;
        ```
      options:
        - "223"
        - "123"
        - "233"
        - "111"
      answer: 0
      explanation: "$b = $a копирует идентификатор объекта, поэтому $a и $b - один и тот же объект с n = 2. Объект $c получен через clone и независим, его n равен 3."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        class Box
        {
            public function __construct(public int $n)
            {
            }
        }
        $a = new Box(2);
        $b = new Box(2);
        echo json_encode([$a == $b, $a === $b]);
        ```
      options:
        - "[true,false]"
        - "[true,true]"
        - "[false,false]"
        - "[false,true]"
      answer: 0
      explanation: "Оператор == сравнивает классы и значения свойств, они совпадают. Оператор === проверяет, что это один и тот же объект, а здесь два разных."
exercise:
  id: "php.programmers.input-errors-and-classes.exercise"
  title: "Разбор строк заказа: класс, исключения и итоги"
  prompt: |-
    Основная часть программы готова: она читает строки заказа до конца ввода, вызывает `parseItem`, печатает позицию или сообщение об ошибке и считает итоги. Допишите в `main.php` класс `Item` и функцию `parseItem`, основную часть не меняйте.

    Формат строки: `название;количество;цена`. Пустые строки пропускаются основной частью.

    1. `Item` - класс с публичными свойствами `name` (`string`), `quantity` (`int`), `price` (`int`), конструктором с продвижением свойств и методом `total(): int` (количество на цену).
    2. `parseItem(string $line): Item` разбирает строку. Поля обрезаются через `trim`. При ошибке бросается `InvalidArgumentException`; проверки идут в таком порядке:
       - полей не три - `ожидалось 3 поля, получено N`;
       - пустое название - `пустое название`;
       - количество не целое или меньше нуля - `неверное количество: <текст>`; количество `0` допустимо;
       - цена не целое или не больше нуля - `неверная цена: <текст>`.

    **Пример.** Для ввода

    ```
    хлеб;3;45
    молоко;x;80
    сыр;2
    чай;0;150
    ```

    программа печатает

    ```
    хлеб: 3 x 45 = 135
    Строка 2: неверное количество: x
    Строка 3: ожидалось 3 поля, получено 2
    чай: 0 x 150 = 0
    Итого: 135, позиций: 2, ошибок: 2
    ```

    Часть тестов скрыта: в них нулевое количество, лишние пробелы, дробные и отрицательные числа, пустые строки и строки Windows (`\r\n`).
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "В заготовке parseItem всегда бросает исключение, а Item пуст. Сначала напишите класс: конструктор public function __construct(public string $name, public int $quantity, public int $price) и метод total()."
    - "parseItem: $fields = explode(\";\", $line); если count($fields) !== 3, бросьте InvalidArgumentException. Затем обрежьте поля: array_map('trim', $fields)."
    - "Количество и цену проверяйте через filter_var($text, FILTER_VALIDATE_INT) и сравнение с false строго. Количество 0 допустимо, поэтому условие $quantity === false || $quantity < 0, а не !$quantity."
    - "Сообщения должны совпасть с условием дословно, включая текст после двоеточия: \"неверное количество: {$quantityText}\". Проверяйте поля в порядке: число полей, название, количество, цена."
  tests:
    - id: "valid"
      title: "Корректные строки"
      stdin: "яблоки;3;50\nмолоко;2;80\n"
      expected: "яблоки: 3 x 50 = 150\nмолоко: 2 x 80 = 160\nИтого: 310, позиций: 2, ошибок: 0\n"
      hint: "Каждая позиция печатает «название: количество x цена = сумма»; итог 150 + 160 = 310."
    - id: "errors"
      title: "Разные ошибки в строках"
      stdin: "хлеб;x;30\nмыло;2\n;1;5\nчай;1;0\nсыр;1;100\n"
      expected: "Строка 1: неверное количество: x\nСтрока 2: ожидалось 3 поля, получено 2\nСтрока 3: пустое название\nСтрока 4: неверная цена: 0\nсыр: 1 x 100 = 100\nИтого: 100, позиций: 1, ошибок: 4\n"
      hint: "Проверки идут по порядку: количество x - «неверное количество: x», два поля - «ожидалось 3 поля, получено 2», пустое название, цена 0 - «неверная цена: 0»."
    - id: "zero-quantity"
      title: "Нулевое количество и пробелы (скрытый)"
      stdin: "  джем ; 0 ; 120 \nбольшой;1000000;1000000\n"
      expected: "джем: 0 x 120 = 0\nбольшой: 1000000 x 1000000 = 1000000000000\nИтого: 1000000000000, позиций: 2, ошибок: 0\n"
      hidden: true
      hint: "Количество 0 корректно (filter_var вернул 0, а не false); пробелы вокруг полей обрезаются. Сумма второй позиции 1000000000000."
    - id: "bad-numbers"
      title: "Дробные, отрицательные и записи с нулями (скрытый)"
      stdin: "a;-1;5\nb;2.5;5\nc;1;-5\nd;1;5.5\ne;007;5\nf;1e2;5\ng;+3;5\n"
      expected: "Строка 1: неверное количество: -1\nСтрока 2: неверное количество: 2.5\nСтрока 3: неверная цена: -5\nСтрока 4: неверная цена: 5.5\nСтрока 5: неверное количество: 007\nСтрока 6: неверное количество: 1e2\ng: 3 x 5 = 15\nИтого: 15, позиций: 1, ошибок: 6\n"
      hidden: true
      hint: "Допустимы только целые в десятичной записи: отрицательное и дробное количество, ведущие нули и экспонента дают ошибку, а «+3» - корректное количество 3."
    - id: "blank-and-count"
      title: "Пустые строки и число полей (скрытый)"
      stdin: "\n\na;1;1;1\n;;\n  ;2;3\nx;1;1\n"
      expected: "Строка 3: ожидалось 3 поля, получено 4\nСтрока 4: пустое название\nСтрока 5: пустое название\nx: 1 x 1 = 1\nИтого: 1, позиций: 1, ошибок: 3\n"
      hidden: true
      hint: "Номера строк считаются вместе с пустыми. «a;1;1;1» - четыре поля; «;;» - три пустых поля, поэтому ошибка «пустое название»; «  ;2;3» - тоже пустое название."
    - id: "windows-eof"
      title: "Строки Windows и последняя строка без перевода (скрытый)"
      stdin: "a;1;2\r\nb;2;3\r\n\r\nc;0;9"
      expected: "a: 1 x 2 = 2\nb: 2 x 3 = 6\nc: 0 x 9 = 0\nИтого: 8, позиций: 3, ошибок: 0\n"
      hidden: true
      hint: "Конец строки \\r\\n убирается через trim, а последняя строка может не заканчиваться переводом строки: она всё равно обрабатывается."
