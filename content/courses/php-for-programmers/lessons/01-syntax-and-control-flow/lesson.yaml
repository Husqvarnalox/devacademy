id: "php.programmers.syntax-and-control-flow"
title: "Типы, равенство и управление потоком: ловушки PHP"
goal: "Писать условия, числовые вычисления и разбор ввода так, чтобы приведение типов, знак остатка, байты в строках и ложное значение 0 не искажали результат."
difficulty: "medium"
estimatedMinutes: 45
prerequisites: []
next:
  - "php.programmers.functions-and-collections"
objectives:
  - "Выбирать === вместо == и объяснять, почему \"10\" == \"1e1\" истинно, а 0 == \"a\" в PHP 8 ложно."
  - "Предсказывать результат арифметики со строками, /, %, intdiv и переполнения int."
  - "Различать байты и символы: strlen и mb_strlen, strtoupper и mb_strtoupper."
  - "Отличать ложные значения от null и выбирать между ??, ?: и isset."
  - "Проверять ввод через filter_var и сравнением с false, не путая 0 с ошибкой."
masteryCriteria:
  - "floorMod, charCount, parseInt и digitSum дают верные результаты для отрицательных чисел, кириллицы и значения 0."
  - "Квиз пройден с результатом не ниже 70%."
tags:
  - "php"
  - "programmers"
  - "juggling"
  - "control-flow"
