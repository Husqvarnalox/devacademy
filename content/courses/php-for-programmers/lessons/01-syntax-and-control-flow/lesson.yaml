  - "php.from-zero.loop-control"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        declare(strict_types=1);
        echo json_encode(["10" == "1e1", 0 == "a", "1" === "01", null == false]);
        ```
      options:
        - "[false,false,false,true]"
        - "[true,true,false,true]"
        - "[true,false,false,true]"
        - "[true,false,true,false]"
      answer: 2
      explanation: "Две числовые строки сравниваются как числа: \"10\" и \"1e1\" равны. В PHP 8 число и нечисловая строка сравниваются как строки, поэтому 0 == \"a\" ложно. Строгое сравнение \"1\" === \"01\" ложно (разные строки), а null == false истинно."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        declare(strict_types=1);
        $word = "Привет";
        echo strlen($word), mb_strlen($word);
        ```
      options:
        - "66"
        - "126"
        - "1212"
        - "612"
      answer: 1
      explanation: "strlen считает байты: в UTF-8 каждая кириллическая буква занимает два байта, поэтому 12. mb_strlen считает символы: 6. Результаты печатаются подряд без разделителя."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        declare(strict_types=1);
        echo -7 % 3, " ", intdiv(-7, 2), " ", 7 / 2;
        ```
      options:
        - "-1 -3 3.5"
        - "2 -4 3"
        - "-1 -4 3"
        - "2 -3 3.5"
      answer: 0
      explanation: "Остаток % берёт знак делимого, поэтому -7 % 3 равно -1. intdiv округляет к нулю: -3, а не -4. Оператор / даёт float 3.5."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        $ok = true and false;
        var_dump($ok);
        ```
      options:
        - "bool(true)"
        - "bool(false)"
        - "NULL"
        - "Parse error"
      answer: 0
      explanation: "Приоритет and ниже, чем у =, поэтому код читается как ($ok = true) and false. Переменной присваивается true. Для условий используйте &&."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```php
        <?php
        declare(strict_types=1);
        $n = filter_var("0", FILTER_VALIDATE_INT);
        echo $n ? "число" : "ошибка";
        ```
      options:
        - "ошибка"
        - "число"
        - "TypeError"
        - "ничего не будет напечатано"
      answer: 0
      explanation: "filter_var вернул корректное целое 0, но 0 ложно, поэтому условие $n ? ... выбрало «ошибка». Проверять надо $n === false."
exercise:
  id: "php.programmers.syntax-and-control-flow.exercise"
  title: "Остаток, символы, разбор числа и сумма цифр"
  prompt: |-
    Основная часть программы готова: она читает команды (по одной на строку) и печатает результат вызова ваших функций. Допишите четыре функции в `main.php`, основную часть не меняйте.

    1. `floorMod(int $a, int $b): int` - остаток от деления `a` на `b` (`b` больше нуля), всегда в диапазоне от `0` до `b - 1`: `floorMod(-7, 3)` равно `2`.
    2. `charCount(string $text): int` - число символов в строке, кириллица и эмодзи считаются по одному символу.
    3. `parseInt(string $text): ?int` - целое число, если строка записывает целое десятичное число (знак допустим, ведущие нули нет), иначе `null`. Значение `0` корректно.
    4. `digitSum(int $n): int` - сумма десятичных цифр числа без учёта знака.

    **Пример.** Для ввода

    ```
    mod -7 3
    chars Привет
    int 42
    digits 4096
    ```

    программа печатает

    ```
    2
    6
    42
    19
    ```

    Для `parseInt` команда `int` печатает число или слово `null`. Часть тестов скрыта: в них отрицательные числа, значение `0`, ведущие нули и эмодзи.
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "В заготовке функции возвращают заглушки. Команда mod вызывает floorMod, chars - charCount, int - parseInt, digits - digitSum; проверяйте их по очереди."
    - "floorMod: у % знак делимого, поэтому ((a % b) + b) % b даёт неотрицательный остаток. charCount: нужна mb_strlen, а не strlen."
    - "parseInt: $n = filter_var($text, FILTER_VALIDATE_INT); затем сравните с false строго ($n === false). Проверка !$n принимает 0 за ошибку."
    - "digitSum: возьмите abs($n), затем в цикле while ($n > 0) прибавляйте $n % 10 и делите $n = intdiv($n, 10)."
  tests:
    - id: "mod-chars"
      title: "Остаток и число символов"
      stdin: "mod 7 3\nmod -7 3\nmod 10 5\nchars hello\nchars Привет\n"
      expected: "1\n2\n0\n5\n6\n"
      hint: "mod 7 3 даёт 1, mod -7 3 даёт 2 (не -1), mod 10 5 даёт 0; в слове «Привет» 6 символов."
    - id: "int-digits"
      title: "Разбор числа и сумма цифр"
      stdin: "int 42\nint -17\nint abc\nint 4.5\ndigits 4096\ndigits 7\n"
      expected: "42\n-17\nnull\nnull\n19\n7\n"
      hint: "42 и -17 - целые; abc и 4.5 дают null; 4+0+9+6 = 19."
    - id: "mod-edge"
      title: "Остаток для отрицательных и нуля (скрытый)"
      stdin: "mod -1 5\nmod -10 5\nmod 0 7\nmod -8 3\n"
      expected: "4\n0\n0\n1\n"
      hidden: true
      hint: "-1 mod 5 равно 4, -10 mod 5 равно 0, 0 mod 7 равно 0, -8 mod 3 равно 1: остаток всегда в диапазоне от 0 до b - 1."
    - id: "chars-edge"
      title: "Символы: смесь алфавитов, пробелы, эмодзи (скрытый)"
      stdin: "chars Ёжик Привет\nchars 😀\nchars a b  c\nchars\n"
      expected: "11\n1\n6\n0\n"
      hidden: true
      hint: "Нужна mb_strlen: «Ёжик Привет» - 11 символов, эмодзи - 1, «a b  c» - 6, пустая строка - 0."
    - id: "int-edge"
      title: "parseInt: ноль, ведущие нули, знак, слишком большое (скрытый)"
      stdin: "int 0\nint -0\nint 007\nint +5\nint 1e3\nint 9223372036854775808\nint \n"
      expected: "0\n0\nnull\n5\nnull\nnull\nnull\n"
      hidden: true
      hint: "0 корректное число, поэтому сравнивайте с false строго. 007, 1e3, число больше int и пустая строка дают null; +5 даёт 5."
    - id: "digits-edge"
      title: "Сумма цифр: ноль и отрицательные (скрытый)"
      stdin: "digits 0\ndigits -123\ndigits 1000000\ndigits 999\n"
      expected: "0\n6\n1\n27\n"
      hidden: true
      hint: "Знак числа не учитывается: -123 даёт 6; для 0 результат 0; 1000000 даёт 1; 999 даёт 27."
