id: "java-first-steps"
version: "1.0.0"
title: "Java: первые шаги"
description: "Курс рассчитан на тех, кто уже программирует на другом языке: переменные, условия, циклы и функции здесь не объясняются с нуля. Если вы никогда не программировали, начните с «Go с нуля», «Основы Python» или «JavaScript с нуля». Вводный курс из двух уроков: как Java компилируется в байткод и выполняется на JVM, затем примитивы и объекты, разница между == и equals и автоупаковка. Остальные темы трека Java запланированы."
languageId: "java"
level: 1
track: "java"
