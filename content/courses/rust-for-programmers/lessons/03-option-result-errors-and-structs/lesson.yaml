id: "rust.programmers.option-result-errors-and-structs"
title: "Option, Result, ошибки и структуры"
goal: "Выражать отсутствие значения и ошибки через Option и Result, обрабатывать их через match и ?, понимать, когда допустим unwrap, и описывать данные структурами с методами."
difficulty: "medium"
estimatedMinutes: 45
prerequisites: []
next:
  - "rust.first-steps.how-rust-runs"
objectives:
  - "Возвращать Option и Result из функций и обрабатывать их через match, if let, unwrap_or и map_err."
  - "Использовать оператор ? в функциях, возвращающих Result, и знать, где он запрещён."
  - "Различать восстановимую ошибку (Result) и панику (unwrap, индекс, деление на ноль)."
  - "Описывать данные через struct и impl, выбирая &self, &mut self или ассоциированную функцию."
  - "Выводить Debug и Clone через derive и понимать, что структура по умолчанию перемещается."
masteryCriteria:
  - "parse_score, parse_student, best и методы Student работают на обычных и граничных данных: пустой ввод, равные баллы, пробелы, лишние точки с запятой, значения вне диапазона."
  - "Квиз пройден с результатом не ниже 70%."
tags:
  - "rust"
  - "programmers"
  - "option"
  - "result"
  - "errors"
  - "structs"
assessmentFor:
  - "rust.from-zero.option-and-result"
  - "rust.from-zero.errors"
  - "rust.from-zero.first-struct"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        fn main() {
            let words = vec!["a", "b"];
            println!("{:?} {:?}", words.get(1), words.get(5));
        }
        ```
      options:
        - "Some(\"b\") None"
        - "\"b\" и паника: индекс за границей"
        - "Some(\"b\") и паника"
        - "Ошибка компиляции: get возвращает ссылку"
      answer: 0
      explanation: "Метод get не паникует: он возвращает Option со ссылкой на элемент или None, если индекса нет. Элемент вектора типа &str печатается в отладочном виде в кавычках. Паника возникла бы для words[5]."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        fn half(text: &str) -> Result<i32, String> {
            let n: i32 = text.parse().map_err(|_| String::from("bad"))?;
            Ok(n / 2)
        }

        fn main() {
            println!("{:?} {:?}", half("9"), half("x9"));
        }
        ```
      options:
        - "Ok(4) Err(\"bad\")"
        - "Ok(4) и паника"
        - "Ok(4.5) Err(\"bad\")"
        - "Ошибка компиляции: ? нельзя применять к parse"
      answer: 0
      explanation: "Для \"9\" разбор успешен, оператор ? берёт число, и 9 / 2 при целом делении равно 4. Для \"x9\" parse возвращает ошибку, map_err заменяет её на String, а ? делает ранний возврат Err(\"bad\"). Паники нет, а результат деления целых - целое число."
    - id: "q3"
      type: "single"
      prompt: |-
        Почему этот код не компилируется?

        ```rust
        fn main() {
            let n: i32 = "17".parse()?;
            println!("{}", n + 1);
        }
        ```
      options:
        - "Нельзя разбирать строки в i32"
        - "Оператор ? допустим только в функции, возвращающей Result или Option, а main возвращает ()"
        - "Нужно сначала вызвать unwrap"
        - "Метод parse не существует у &str"
      answer: 1
      explanation: "Оператор ? при ошибке делает return Err(...) из текущей функции. У main тип результата () не умеет принимать ошибку, поэтому компилятор отказывает (E0277). Исправление: вынести разбор в функцию с Result, обработать результат через match или заменить ? на unwrap_or."
    - id: "q4"
      type: "single"
      prompt: |-
        Что произойдёт при запуске?

        ```rust
        fn main() {
            let text = String::from("50%");
            let n: i32 = text.parse().unwrap();
            println!("{n}");
        }
        ```
      options:
        - "Выведется 50"
        - "Выведется 0"
        - "Программа остановится с паникой: called Result::unwrap() on an Err value"
        - "Ошибка компиляции: нужен match"
      answer: 2
      explanation: "Строка 50% не является целым числом: parse возвращает Err(ParseIntError), а unwrap на Err останавливает программу паникой. Компилятор такой код пропускает: unwrap - это разрешённый способ сказать «ошибки быть не должно». Для пользовательского ввода его заменяют на match или unwrap_or."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        struct Counter {
            value: i32,
        }

        impl Counter {
            fn bump(&mut self) -> i32 {
                self.value += 1;
                self.value
            }
        }

        fn main() {
            let mut c = Counter { value: 10 };
            let a = c.bump();
            let b = c.bump();
            println!("{a} {b} {}", c.value);
        }
        ```
      options:
        - "11 12 12"
        - "11 11 12"
        - "10 11 12"
        - "Ошибка компиляции: нельзя вызывать bump дважды"
      answer: 0
      explanation: "Метод с &mut self изменяет поле и возвращает новое значение; вызывающая переменная объявлена с mut, поэтому второй вызов допустим (заимствование заканчивается после каждого вызова). Получаются 11, 12, а в конце поле равно 12."
exercise:
  id: "rust.programmers.option-result-errors-and-structs.exercise"
  title: "Ведомость: разбор строк, ошибки и лучший студент"
  prompt: |-
    Готовая функция `main` читает строки вида `имя;балл`, превращает каждую в `Student`, считает зачтённых и плохие строки и выбирает лучшего. Структура `Student` уже объявлена в заготовке. Допишите пять функций в `main.rs`. Функцию `main` не меняйте.

    1. `Student::new(name: &str, score: i32) -> Student` - создаёт студента.
    2. `Student::passed(&self) -> bool` - `true`, если балл не меньше 60.
    3. `parse_score(text: &str) -> Result<i32, String>` - убирает пробелы по краям и разбирает целое число от 0 до 100. Не число: `Err("не число: <текст>")` (текст уже без пробелов). Число вне диапазона: `Err("вне диапазона: <число>")`.
    4. `parse_student(line: &str) -> Result<Student, String>` - делит строку по **первой** точке с запятой. Нет `;`: `Err("нет разделителя")`. Пустое имя (после удаления пробелов): `Err("пустое имя")`. Балл разбирает `parse_score`, его ошибку передайте дальше оператором `?`.
    5. `best(students: &Vec<Student>) -> Option<&Student>` - студент с наибольшим баллом (при равенстве - первый из них) или `None` для пустого вектора.

    `main` печатает `пропущено: <причина>` для каждой плохой строки, затем `принято: N, зачтено: M, ошибок: K` и лучшего студента или `лучшего нет`. Пустые строки пропускаются без подсчёта.

    **Пример.** Для ввода

    ```
    Анна;85
    Борис;59
    Вера;abc
    ```

    программа печатает

    ```
    пропущено: не число: abc
    принято: 2, зачтено: 1, ошибок: 1
    лучший: Анна (85)
    ```

    Часть тестов скрыта: в них пустой ввод, равные баллы, пробелы и лишние точки с запятой.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Student::new: запишите Student { name: String::from(name), score }. Поле name имеет тип String, а параметр - &str, поэтому нужна String::from или to_string. passed: сравните self.score >= 60."
    - "parse_score: let n: i32 = trimmed.parse().map_err(|_| format!(\"не число: {trimmed}\"))?; Затем проверьте диапазон и верните Err или Ok(n). Оператор ? возвращает ошибку из функции сразу."
    - "parse_student: line.split_once(';') возвращает Option<(&str, &str)>. Превратите его в Result через .ok_or(String::from(\"нет разделителя\"))? и распакуйте пару в две переменные. Пустое имя проверьте после trim()."
    - "best: заведите let mut result: Option<&Student> = None; в цикле for s in students заменяйте result на Some(s), если результат пуст или у s строго больший балл. Строго больший - чтобы при равенстве остался первый."
  tests:
    - id: "basic"
      title: "Три строки, одна плохая"
      stdin: |
        Анна;85
        Борис;59
        Вера;abc
      expected: |
        пропущено: не число: abc
        принято: 2, зачтено: 1, ошибок: 1
        лучший: Анна (85)
      hint: "Вера;abc - не число, пропускается с причиной. Принято 2 студента, зачтён один (Анна, 85 не меньше 60; 59 меньше). Лучшая - Анна."
    - id: "errors"
      title: "Разные причины пропуска"
      stdin: |
        Анна;abc
        Борис
        ;50
        Вера;101
        Глеб;-1
        Дима; 70 
      expected: |
        пропущено: не число: abc
        пропущено: нет разделителя
        пропущено: пустое имя
        пропущено: вне диапазона: 101
        пропущено: вне диапазона: -1
        принято: 1, зачтено: 1, ошибок: 5
        лучший: Дима (70)
      hint: "Причины по порядку: не число: abc; нет разделителя; пустое имя; вне диапазона: 101; вне диапазона: -1. Строка \" 70 \" разбирается после trim, принят один студент Дима."
    - id: "empty"
      title: "Пустой ввод (скрытый)"
      stdin: ""
      expected: |
        принято: 0, зачтено: 0, ошибок: 0
        лучшего нет
      hidden: true
      hint: "Без строк студентов нет: принято 0, зачтено 0, ошибок 0 и «лучшего нет» - best обязана вернуть None для пустого вектора."
    - id: "ties"
      title: "Равные баллы и граница 60 (скрытый)"
      stdin: |
        Аня;60

        Боря;60
        Вика;59
        Гена;0
        Даша;100
        Ева;100
      expected: |
        принято: 6, зачтено: 4, ошибок: 0
        лучший: Даша (100)
      hidden: true
      hint: "Балл 60 зачтён, 59 нет, 0 и 100 допустимы. Пустая строка пропускается молча. Лучший - Даша: у неё и у Евы по 100, при равенстве побеждает первая."
    - id: "delimiters"
      title: "Лишние точки с запятой и пробелы (скрытый)"
      stdin: |
        x;1;2
          Ирина Петрова  ; 77
        ;;
        z;x
      expected: |
        пропущено: не число: 1;2
        пропущено: пустое имя
        пропущено: не число: x
        принято: 1, зачтено: 1, ошибок: 3
        лучший: Ирина Петрова (77)
      hidden: true
      hint: "Деление идёт по первой точке с запятой: в «x;1;2» балл «1;2» - не число. Имя «Ирина Петрова» теряет внешние пробелы. «;;» - пустое имя, в «z;x» балл «x» - не число."
