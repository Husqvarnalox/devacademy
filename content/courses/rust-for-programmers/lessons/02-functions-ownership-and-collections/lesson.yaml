id: "rust.programmers.functions-ownership-and-collections"
title: "Функции, владение, векторы и словари"
goal: "Передавать в функции значения, ссылки и изменяемые ссылки, понимая перемещение, и безопасно работать с Vec, HashMap и строками, не выходя за границы и не полагаясь на порядок обхода."
difficulty: "medium"
estimatedMinutes: 50
prerequisites: []
next:
  - "rust.programmers.option-result-errors-and-structs"
objectives:
  - "Объяснять, что String и Vec перемещаются при передаче в функцию, а числа копируются."
  - "Выбирать между T, &T и &mut T в параметре и писать & и &mut в вызове."
  - "Объяснять правило «много читателей или один писатель» и читать ошибки E0382, E0499 и E0502."
  - "Обходить Vec через for x in &v и &mut v, пользоваться get вместо индексации и помнить про usize."
  - "Считать слова через HashMap::entry, сортировать ключи перед выводом и различать len() и chars().count()."
masteryCriteria:
  - "last_index_of, remove_negatives, count_words и middle работают на обычных и граничных данных: пустой вектор, повторы, русские слова, чётная и нечётная длина."
  - "Квиз пройден с результатом не ниже 70%."
tags:
  - "rust"
  - "programmers"
  - "ownership"
  - "collections"
  - "strings"
assessmentFor:
  - "rust.from-zero.functions"
  - "rust.from-zero.ownership-basics"
  - "rust.from-zero.vectors"
  - "rust.from-zero.hash-maps"
  - "rust.from-zero.string-methods"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что произойдёт при сборке этой программы?

        ```rust
        fn main() {
            let a = String::from("rust");
            let b = a;
            println!("{a} {b}");
        }
        ```
      options:
        - "Выведется «rust rust»"
        - "Ошибка компиляции: значение из a перемещено в b, и a больше использовать нельзя"
        - "Паника во время работы"
        - "Выведется пустая строка и «rust»"
      answer: 1
      explanation: "Присваивание String перемещает владение: у строки остаётся один владелец, b. Использовать a после этого нельзя, и компилятор сообщает об этом (E0382, borrow of moved value). Для числа такая запись была бы копированием. Чтобы получить две независимые строки, нужно a.clone()."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        fn main() {
            let mut v = vec![1, 2, 3];
            let first = v[0];
            v.push(4);
            println!("{first} {}", v.len());
        }
        ```
      options:
        - "1 4"
        - "Ошибка компиляции: нельзя изменять вектор, пока взят его элемент"
        - "4 4"
        - "Паника: вектор перемещён"
      answer: 0
      explanation: "Выражение v[0] даёт число i32, а оно копируется: переменная first не держит ссылку на вектор. Поэтому push разрешён. Ошибка E0502 появилась бы при let first = &v[0]; там first - ссылка на элемент, и её нельзя использовать после изменения вектора."
    - id: "q3"
      type: "single"
      prompt: |-
        Программа собрана с `-O`. Что она выведет?

        ```rust
        fn last_index(values: &Vec<i32>) -> usize {
            values.len() - 1
        }

        fn main() {
            let empty: Vec<i32> = Vec::new();
            println!("{}", last_index(&empty));
        }
        ```
      options:
        - "0"
        - "-1"
        - "18446744073709551615"
        - "Паника: attempt to subtract with overflow"
      answer: 2
      explanation: "Длина имеет тип usize, он не бывает отрицательным. В сборке с оптимизацией проверки переполнения отключены, поэтому 0 - 1 заворачивается в наибольшее usize (на 64-битной платформе это 18446744073709551615). Паника была бы в отладочной сборке. Безопасно: values.len().checked_sub(1) или проверка is_empty() заранее."
    - id: "q4"
      type: "single"
      prompt: |-
        Что можно гарантировать о выводе программы?

        ```rust
        use std::collections::HashMap;

        fn main() {
            let mut m = HashMap::new();
            m.insert("b", 2);
            m.insert("a", 1);
            m.insert("c", 3);
            for (k, v) in &m {
                println!("{k}={v}");
            }
        }
        ```
      options:
        - "Строки выводятся в порядке вставки: b, a, c"
        - "Строки выводятся по алфавиту: a, b, c"
        - "Порядок строк не определён и может отличаться между запусками"
        - "Программа не скомпилируется: в цикле нужно перемещать словарь"
      answer: 2
      explanation: "HashMap не хранит порядок вставки и не упорядочен по ключу; порядок зависит от случайного начального значения хеша и может меняться от запуска к запуску. Для стабильного вывода ключи собирают в вектор и сортируют или берут BTreeMap. Запись for ... in &m компилируется: ссылка на словарь даёт пары по ссылкам."
    - id: "q5"
      type: "single"
      prompt: |-
        Что произойдёт при запуске?

        ```rust
        fn main() {
            let s = String::from("яблоко");
            println!("{}", &s[0..1]);
        }
        ```
      options:
        - "Выведется «я»"
        - "Ошибка компиляции: срезы строк запрещены"
        - "Паника во время работы: граница среза попадает внутрь символа"
        - "Выведется пустая строка"
      answer: 2
      explanation: "Срез строки задаётся в байтах, а буква «я» в UTF-8 занимает два байта. Граница 1 попадает внутрь символа, и программа паникует (byte index 1 is not a char boundary). Компилятор такую проверку сделать не может: это решается во время работы. Для букв используйте chars()."
exercise:
  id: "rust.programmers.functions-ownership-and-collections.exercise"
  title: "Последний индекс, очистка вектора, частоты слов и середина слова"
  prompt: |-
    Готовая функция `main` читает команды (по одной на строку) и вызывает ваши функции. Допишите четыре функции над `main` в `main.rs`. Функцию `main` не меняйте.

    1. `last_index_of(values: &Vec<i32>, target: i32) -> i32` - индекс **последнего** вхождения `target` или `-1`, если числа нет.
    2. `remove_negatives(values: &mut Vec<i32>)` - оставляет в векторе только неотрицательные числа в прежнем порядке. Функция меняет вектор вызывающего.
    3. `count_words(words: &Vec<String>) -> HashMap<String, i32>` - сколько раз встречается каждое слово.
    4. `middle(text: &str) -> String` - средняя буква для нечётной длины, две средние для чётной, пустая строка для пустой. Считаются **буквы**, а не байты.

    Команды: `last <число> <n> <n чисел>`, `clean <n> <n чисел>` (печатает оставшиеся числа через пробел или `empty`), `words <n> <n слов>` (печатает `слово=число` по алфавиту), `mid <слово>` (`-` означает пустую строку, результат в квадратных скобках).

    **Пример.** Для ввода

    ```
    last 3 5 1 3 2 3 4
    clean 5 4 -1 0 -7 9
    words 3 b a b
    mid hello
    ```

    программа печатает

    ```
    3
    4 0 9
    a=1
    b=2
    [l]
    ```

    Часть тестов скрыта: в них пустой вектор, повторы, русские слова и пустая строка.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "last_index_of: пройдите по вектору с номерами (values.iter().enumerate()) и запоминайте номер при каждом совпадении; начальное значение результата -1. Номер имеет тип usize, приведите его: i as i32."
    - "remove_negatives: у Vec есть метод retain(|x| условие), где x - ссылка на элемент (сравнивайте *x >= 0). Вектор приходит как &mut Vec<i32>, поэтому вызывать метод можно сразу."
    - "count_words: создайте HashMap, обойдите слова циклом for word in words и пишите *counts.entry(word.clone()).or_insert(0) += 1. Ключ должен быть String, а word - &String: нужна копия."
    - "middle: соберите буквы в вектор: let letters: Vec<char> = text.chars().collect(). Для нечётной длины возьмите letters[n / 2], для чётной - letters[n / 2 - 1] и letters[n / 2]. Не берите срезы строки по байтам: на кириллице они ломаются."
  tests:
    - id: "last-and-clean"
      title: "Последнее вхождение и очистка вектора"
      stdin: |
        last 3 5 1 3 2 3 4
        last 9 3 1 2 3
        clean 5 4 -1 0 -7 9
        clean 2 -5 -6
      expected: |
        3
        -1
        4 0 9
        empty
      hint: "Число 3 стоит на индексах 1 и 3, нужен последний - 3. Числа 9 нет, поэтому -1. Ноль неотрицателен и остаётся; когда остаться нечему, печатается empty."
    - id: "words-and-mid"
      title: "Частоты слов и середина слова"
      stdin: |
        words 5 pear apple pear fig apple
        mid hello
        mid abcd
        mid -
      expected: |
        apple=2
        fig=1
        pear=2
        [l]
        [bc]
        []
      hint: "Слова печатаются по алфавиту с количеством. У hello середина l, у abcd - bc, у пустой строки - пустая строка в скобках."
    - id: "empty-and-repeats"
      title: "Пустой вектор, повторы и нули (скрытый)"
      stdin: |
        last 5 0
        last 7 4 7 7 7 7
        last 1 1 1
        clean 0
        clean 3 0 0 0
      expected: |
        -1
        3
        0
        empty
        0 0 0
      hidden: true
      hint: "В пустом векторе числа нет: -1. При повторах нужен индекс последнего, 3. Пустой вектор после clean печатает empty, а нули сохраняются."
    - id: "words-edge"
      title: "Нет слов, одно слово, разные длины (скрытый)"
      stdin: |
        words 0
        words 3 a a a
        mid a
        mid ab
        mid abcdefg
        mid ab12
      expected: |
        a=3
        [a]
        [ab]
        [d]
        [b1]
      hidden: true
      hint: "При нуле слов вывода нет. Для a a a выводится a=3. Середина a - a, ab - ab, abcdefg - d, ab12 - b1."
    - id: "cyrillic"
      title: "Русские слова (скрытый)"
      stdin: |
        words 4 мир мир май мир
        mid привет
        mid мир
        mid яблоко
      expected: |
        май=1
        мир=3
        [ив]
        [и]
        [ло]
      hidden: true
      hint: "Считайте буквы, а не байты: у привет две средние буквы - ив, у мир - и, у яблоко - ло. Слова упорядочены по алфавиту: май раньше мир."
