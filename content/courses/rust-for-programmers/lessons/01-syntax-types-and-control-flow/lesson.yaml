id: "rust.programmers.syntax-types-and-control-flow"
title: "Синтаксис, типы и управление потоком"
goal: "Писать на Rust базовые программы и не попадаться на его отличия: неизменяемость, строгие числовые типы, приведение as, переполнение, match как выражение и строки в UTF-8."
difficulty: "medium"
estimatedMinutes: 45
prerequisites: []
next:
  - "rust.programmers.functions-ownership-and-collections"
objectives:
  - "Объявлять переменные через let и let mut и отличать затенение от изменения."
  - "Выбирать числовой тип, приводить значения через as, From и TryFrom и знать, как as обрезает число."
  - "Объяснять, что в сборке с -O переполнение целого заворачивается без паники, и выбирать checked, wrapping или saturating."
  - "Писать if и match как выражения и добавлять ветку для всех остальных значений."
  - "Различать len() и chars().count() и не индексировать строку по номеру."
masteryCriteria:
  - "grade_letter, digit_sum, fahrenheit, low_byte и clamp_add работают на обычных и граничных данных: границы диапазонов, нули, отрицательные числа, значения у границ i32."
  - "Квиз пройден с результатом не ниже 70%."
tags:
  - "rust"
  - "programmers"
  - "types"
  - "control-flow"
  - "strings"
assessmentFor:
  - "rust.from-zero.first-program"
  - "rust.from-zero.compiler-errors"
  - "rust.from-zero.output"
  - "rust.from-zero.variables"
  - "rust.from-zero.basic-types"
  - "rust.from-zero.arithmetic"
  - "rust.from-zero.strings"
  - "rust.from-zero.reading-input"
  - "rust.from-zero.type-conversion"
  - "rust.from-zero.formatted-output"
  - "rust.from-zero.comparison-and-logic"
  - "rust.from-zero.if-else"
  - "rust.from-zero.match"
  - "rust.from-zero.while-loop"
  - "rust.from-zero.for-loop"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        fn main() {
            let x = 5;
            let x = x + 1;
            {
                let x = x * 2;
                println!("{x}");
            }
            println!("{x}");
        }
        ```
      options:
        - "12 и 6"
        - "12 и 12"
        - "6 и 6"
        - "Ошибка компиляции: x нельзя объявлять дважды"
      answer: 0
      explanation: "Каждый let создаёт новую переменную (затенение), а не изменяет прежнюю. Внутри блока x равен (5 + 1) * 2 = 12; после блока это затенение заканчивается, и снова виден x = 6. Ошибки нет: повторный let с тем же именем разрешён, присваивание без mut запрещено."
    - id: "q2"
      type: "single"
      prompt: |-
        Программа собрана командой `rustc -O` (так приложение запускает ваш код). Что она выведет?

        ```rust
        fn main() {
            let a: u8 = "250".parse().unwrap();
            let b = a + 10;
            println!("{b}");
        }
        ```
      options:
        - "260"
        - "4"
        - "Паника: attempt to add with overflow"
        - "Ошибка компиляции"
      answer: 1
      explanation: "u8 хранит числа от 0 до 255. В сборке с оптимизацией проверки переполнения выключены, и 250 + 10 = 260 заворачивается по модулю 256: получается 4. Паника была бы в отладочной сборке. Ошибки компиляции нет, потому что значение 250 берётся из строки во время работы, а не известно заранее. Если переполнение недопустимо, используйте checked_add или более широкий тип."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        fn main() {
            println!("{} {} {}", 300_i32 as u8, -1.5_f64 as u32, 7 / -2);
        }
        ```
      options:
        - "44 0 -3"
        - "300 -1 -3"
        - "44 0 -4"
        - "255 0 -3"
      answer: 0
      explanation: "Приведение i32 к u8 оставляет младший байт: 300 - 256 = 44. Приведение f64 к целому отбрасывает дробную часть и прижимает значение к границам типа: отрицательное число в u32 даёт 0. Целое деление идёт к нулю: 7 / -2 равно -3, а не -4."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        fn main() {
            let word = String::from("Привет");
            println!("{} {}", word.len(), word.chars().count());
        }
        ```
      options:
        - "6 6"
        - "12 6"
        - "6 12"
        - "12 12"
      answer: 1
      explanation: "len() считает байты в UTF-8. Каждая русская буква занимает два байта, поэтому «Привет» - 12 байт. chars().count() считает символы: их 6. Обратиться к букве по номеру через word[0] язык не позволяет."
    - id: "q5"
      type: "single"
      prompt: |-
        Почему этот код не компилируется?

        ```rust
        fn main() {
            let v = vec![10, 20, 30];
            let i: i32 = 1;
            println!("{}", v[i]);
        }
        ```
      options:
        - "Индексы векторов начинаются с единицы."
        - "Индекс вектора должен иметь тип usize; i32 не преобразуется в него неявно."
        - "Вектор нельзя индексировать внутри println!."
        - "Переменная i должна быть объявлена с mut."
      answer: 1
      explanation: "Индексы и длины в Rust имеют тип usize, а неявных преобразований между числовыми типами нет. Исправление: объявить i как usize или написать v[i as usize]. Нумерация с нуля, а println! принимает любые выражения."
exercise:
  id: "rust.programmers.syntax-types-and-control-flow.exercise"
  title: "Оценки, сумма цифр, температура, младший байт и безопасное сложение"
  prompt: |-
    Готовая функция `main` читает команды (по одной на строку) и вызывает ваши функции. Допишите пять функций над `main` в `main.rs`. Функцию `main` не меняйте.

    1. `grade_letter(score: i32) -> char` - буква по баллу: `A` для 90-100, `B` для 80-89, `C` для 70-79, `D` для 60-69, `F` для 0-59, `?` для всего остального. Используйте `match`.
    2. `digit_sum(n: u32) -> u32` - сумма десятичных цифр числа (для `0` результат `0`).
    3. `fahrenheit(celsius: f64) -> f64` - перевод градусов Цельсия в Фаренгейта: `C * 9 / 5 + 32`.
    4. `low_byte(n: i32) -> u8` - младший байт числа (то, что остаётся при приведении `as u8`).
    5. `clamp_add(a: i32, b: i32) -> i32` - сумма `a + b`; если она не помещается в `i32`, функция возвращает ближайшую границу типа (`i32::MAX` или `i32::MIN`), а не заворачивает число.

    Команды: `grade <число>`, `digits <число>`, `temp <число>` (результат с одним знаком после точки), `byte <число>`, `add <число> <число>`.

    **Пример.** Для ввода

    ```
    grade 85
    digits 4096
    temp 36.6
    byte 300
    add 2000000000 2000000000
    ```

    программа печатает

    ```
    B
    19
    97.9
    44
    2147483647
    ```

    Часть тестов скрыта: в них границы диапазонов, нули, отрицательные числа и значения у границ `i32`.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "grade_letter: ветки match по диапазонам идут сверху вниз; напишите 90..=100 => 'A' и так далее, а последней поставьте _ => '?': без неё match не скомпилируется."
    - "digit_sum: цикл while rest > 0; в теле прибавляйте rest % 10 к сумме и делите rest на 10. Для n = 0 цикл не выполнится, и сумма останется 0."
    - "fahrenheit: пишите дробные литералы (9.0, 5.0, 32.0): число f64 нельзя умножать на целый литерал 9. low_byte: достаточно n as u8."
    - "clamp_add: у i32 есть метод saturating_add(other), который прижимает результат к границам типа. Обычное a + b в сборке с -O молча завернуло бы число."
  tests:
    - id: "basic"
      title: "Все пять команд"
      stdin: |
        grade 85
        digits 4096
        temp 36.6
        byte 300
        add 2000000000 2000000000
      expected: |
        B
        19
        97.9
        44
        2147483647
      hint: "85 - это B, сумма цифр 4+0+9+6 = 19, 36.6 * 9 / 5 + 32 = 97.88 печатается как 97.9, 300 as u8 = 44, сумма 4 000 000 000 прижимается к 2147483647."
    - id: "grades"
      title: "Границы диапазонов оценок"
      stdin: |
        grade 100
        grade 90
        grade 89
        grade 70
        grade 69
        grade 60
        grade 59
        grade 0
      expected: |
        A
        A
        B
        C
        D
        D
        F
        F
      hint: "Каждая граница относится к верхнему диапазону: 90 - A, 89 - B, 70 - C, 69 - D, 60 - D, 59 - F, 0 - F."
    - id: "out-of-range"
      title: "Оценка вне диапазона (скрытый)"
      stdin: |
        grade 101
        grade -1
        grade 1000000
      expected: |
        ?
        ?
        ?
      hidden: true
      hint: "Баллы меньше 0 и больше 100 дают ?. Ветка _ должна ловить все остальные значения."
    - id: "digits"
      title: "Нули и большие числа (скрытый)"
      stdin: |
        digits 0
        digits 7
        digits 100
        digits 4294967295
      expected: |
        0
        7
        1
        57
      hidden: true
      hint: "У 0 сумма цифр 0, у 100 - 1, у наибольшего u32 4294967295 - 4+2+9+4+9+6+7+2+9+5 = 57. Считайте в u32 без приведений."
    - id: "bytes"
      title: "Младший байт и температуры (скрытый)"
      stdin: |
        byte 255
        byte 256
        byte -1
        byte 65537
        temp 0
        temp -40
        temp 100
        temp -273.15
      expected: |
        255
        0
        255
        1
        32.0
        -40.0
        212.0
        -459.7
      hidden: true
      hint: "as u8 оставляет младший байт: 256 даёт 0, -1 даёт 255, 65537 даёт 1. Температуры: 0 C = 32.0, -40 C = -40.0, 100 C = 212.0, -273.15 C = -459.7."
    - id: "saturate"
      title: "Сложение у границ i32 (скрытый)"
      stdin: |
        add 1 2
        add 2147483647 1
        add -2147483648 -1
        add -5 5
        add 2147483647 -2147483648
      expected: |
        3
        2147483647
        -2147483648
        0
        -1
      hidden: true
      hint: "1 + 2 = 3 без изменений; 2147483647 + 1 прижимается к 2147483647, -2147483648 + (-1) - к -2147483648; противоположные числа складываются как обычно."
