id: "go.pro.data-races"
title: "Гонки данных: Mutex, RWMutex, atomic и race detector"
goal: "Найти и устранить гонки данных и check-then-act в реестре метрик, который используют несколько горутин."
difficulty: "hard"
estimatedMinutes: 60
prerequisites:
  - "go.pro.allocations"
objectives:
  - "Отличить гонку данных (data race) от логической гонки и объяснить, что ловит `go test -race`, а что нет."
  - "Выбрать между sync.Mutex, sync.RWMutex и пакетом sync/atomic для конкретного участка."
  - "Исправить check-then-act через повторную проверку под эксклюзивной блокировкой."
  - "Не отдавать наружу внутреннее изменяемое состояние (копия под блокировкой)."
masteryCriteria:
  - "Счётчик не теряет обновления при записи из десятков горутин."
  - "Каждое имя метрики получает ровно один счётчик при одновременном первом обращении."
  - "Snapshot возвращает независимую копию и безопасен при параллельных записях."
related:
  - "go.fundamentals.goroutines-and-channels"
  - "go.fundamentals.concurrency-patterns-and-context"
next:
  - "go.pro.memory-model"
tags:
  - "go"
  - "concurrency"
  - "race-detector"
  - "sync"
facts:
  - kind: "internals"
    text: "Детектор гонок включается флагом -race (go test -race, go run -race, go build -race), требует cgo и замедляет программу и увеличивает потребление памяти в несколько раз, поэтому его запускают в тестах и CI, а не в продакшене."
    sources:
      - "https://go.dev/doc/articles/race_detector"
  - kind: "internals"
    text: "Типы atomic.Int64, atomic.Bool, atomic.Pointer[T] и другие в пакете sync/atomic появились в Go 1.19 и дают атомарные операции без риска забыть обращаться к полю только через функции пакета; в модели памяти Go атомарные операции синхронизируют горутины."
    sources:
      - "https://pkg.go.dev/sync/atomic"
      - "https://go.dev/ref/mem"
  - kind: "misconception"
    text: "«Если go test -race ничего не нашёл, гонок нет». Детектор видит только те обращения, которые произошли во время запуска; непокрытую ветку или редкий порядок событий он не проверит. Логическая гонка (check-then-act под отдельными блокировками) не является гонкой данных и детектором не отмечается."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Четыре горутины по 1000 раз выполняют `count++` над общей переменной int без синхронизации. Что гарантирует спецификация Go?"
      options:
        - "count станет ровно 4000, потому что ++ атомарна для int."
        - "Результат не определён: это гонка данных, значение может быть меньше 4000, а поведение программы не гарантировано."
        - "Результат будет от 1000 до 4000, но программа безопасна."
        - "Компилятор не позволит собрать такую программу."
      answer: 1
      explanation: "count++ - чтение, сложение и запись. Конкурентные обращения без синхронизации, из которых хотя бы одно запись, образуют гонку данных, и модель памяти Go не обещает ничего определённого. Практически теряются обновления, но дело не только в них."
    - id: "q2"
      type: "single"
      prompt: "Реестр: `RLock; c, ok := m[k]; RUnlock; if !ok { Lock; m[k] = &Counter{}; Unlock }`. В чём ошибка?"
      options:
        - "RWMutex нельзя использовать для карт."
        - "Между RUnlock и Lock другая горутина может создать элемент; нужна повторная проверка под Lock, иначе один элемент затрёт другой."
        - "Lock нужно брать перед RLock."
        - "Ошибки нет: карты в Go потокобезопасны на запись."
      answer: 1
      explanation: "Проверка и действие разнесены по двум критическим секциям. Это check-then-act: после RUnlock условие уже могло устареть. Исправление - double-checked locking: взять Lock и проверить условие снова."
    - id: "q3"
      type: "multiple"
      prompt: "Когда `atomic.Int64` подходит лучше, чем `sync.Mutex`?"
      options:
        - "Нужно независимо увеличивать и читать одно число."
        - "Нужно изменить два связанных поля так, чтобы наблюдатель не видел промежуточного состояния."
        - "Нужен атомарный обмен значения на ноль с возвратом старого (Swap)."
        - "Нужно добавить элемент в карту."
      answer:
        - 0
        - 2
      explanation: "Атомарные операции работают с одной ячейкой. Инвариант из нескольких полей и составные структуры (карта) требуют мьютекса или передачи владения через канал."
    - id: "q4"
      type: "single"
      prompt: "Метод возвращает внутреннюю карту `return r.counters`, а вызывающий код читает её, пока другие горутины вызывают Inc. Что это даёт?"
      options:
        - "Ничего плохого: чтение карты всегда безопасно."
        - "Гонку данных: карта изменяется и читается без синхронизации; рантайм может аварийно завершить программу."
        - "Только замедление."
        - "Копию карты, потому что карты передаются по значению."
      answer: 1
      explanation: "Карта в Go - ссылка на структуру. Вернув её, вы вынесли защищённое состояние за пределы мьютекса. Рантайм проверяет одновременное чтение и запись карты и завершает программу сообщением `concurrent map iteration and map write`. Верно: копировать под RLock."
    - id: "q5"
      type: "short"
      prompt: "Какой флаг команды go test включает детектор гонок?"
      answer:
        - "-race"
        - "go test -race"
      explanation: "go test -race компилирует тесты с инструментацией обращений к памяти. Нужен cgo; в среде проверки DevAcademy детектор недоступен, запускайте его локально."
exercise:
  id: "go.pro.data-races.exercise"
  title: "Реестр метрик без гонок"
  prompt: |
    Пакет `metrics` собирает счётчики из обработчиков запросов, которые работают в десятках горутин. После выката на
    продакшен значения занижены, иногда один и тот же счётчик «обнуляется», а при выгрузке снимка программа изредка падает с
    `concurrent map iteration and map write`.

    В `metrics.go` исправьте:

    * `Counter.Add`, `Counter.Value`, `Counter.Reset`: ни одно обновление не должно теряться, `Reset` возвращает прежнее
      значение и обнуляет счётчик одним атомарным действием. Хватит `sync/atomic`.
    * `Registry.counter`: при одновременном первом обращении к одному имени все горутины получают **один и тот же**
      `*Counter`.
    * `Registry.Snapshot`: безопасен при параллельных `Inc` и возвращает независимую копию.

    **Как устроены проверки.** Тесты запускают десятки горутин, стартующие одновременно, и сверяют итоговые значения
    (инварианты), а не «ловят» гонку. В заготовке между чтением и записью стоит `runtime.Gosched()`: это делает потерю
    обновления воспроизводимой на каждом запуске. Детектор гонок в среде проверки не запускается (он требует cgo), поэтому
    **проверяйте решение локально: `go test -race -count=5 ./...`**. Тесты не докажут отсутствие гонок в непокрытых путях,
    не оценят размер критической секции и не найдут взаимную блокировку, если она не проявилась в сценарии.

    Запуск тестов: `go test -json -count=1 ./...`.
  evaluation: "command"
  languageId: "go"
  entryFile: "metrics.go"
  starter: "exercise/starter"
  solution: "exercise/solution"
  tests_dir: "exercise/tests"
  command:
    run: ["go", "test", "-json", "-count=1", "./..."]
    report: "go-test-json"
    testsTarget: "."
    timeoutSeconds: 45
  hints:
    - "Три разных дефекта: общая переменная без синхронизации (Counter), check-then-act (Registry.counter) и обход карты без блокировки (Snapshot). Начните с теста, который упал первым, и найдите, какие обращения к общей памяти не защищены."
    - "Counter: замените поле n int64 на n atomic.Int64 и используйте n.Add, n.Load и n.Swap(0) - Swap возвращает старое значение и обнуляет за один шаг."
    - "Registry.counter: после RUnlock условие могло устареть. Возьмите r.mu.Lock() и проверьте наличие имени ещё раз; создавайте счётчик, только если его всё ещё нет."
    - "Snapshot: возьмите r.mu.RLock() с defer RUnlock перед обходом карты. Значения читайте через c.Value(): они атомарны, а копия карты своя."
  tests:
    - id: "counter-add"
      title: "Counter: параллельные Add не теряются"
      match: "TestCounterConcurrentAdd"
      hint: "В сообщении указано, сколько обновлений потеряно. Операция v := c.n; c.n = v + 1 не атомарна, нужна атомарная операция."
    - id: "registry-inc"
      title: "Registry: параллельные Inc по нескольким именам"
      match: "TestRegistryConcurrentInc"
      hint: "Если значения занижены, одновременно созданные счётчики затирают друг друга: проверьте создание счётчика под эксклюзивной блокировкой."
    - id: "counter-basic"
      title: "Counter: последовательное поведение (скрытый)"
      match: "TestCounterBasic"
      hidden: true
      hint: "Нулевое значение готово к работе, Add принимает и отрицательные числа, Reset возвращает прежнее значение."
    - id: "counter-reset"
      title: "Counter: Reset не теряет обновления (скрытый)"
      match: "TestCounterResetLosesNothing"
      hidden: true
      hint: "Reset обязан быть единым атомарным обменом значения на ноль; пара «прочитать, затем записать 0» теряет Add между ними."
    - id: "registry-same-counter"
      title: "Registry: одно имя - один счётчик (скрытый)"
      match: "TestRegistrySameCounterForSameName"
      hidden: true
      hint: "После получения Lock проверьте карту повторно: другая горутина могла уже создать счётчик."
    - id: "registry-get"
      title: "Registry: Get не создаёт счётчик (скрытый)"
      match: "TestRegistryGetDoesNotCreate"
      hidden: true
      hint: "Get для несуществующего имени возвращает 0 и не меняет реестр."
    - id: "snapshot-copy"
      title: "Snapshot: независимая копия (скрытый)"
      match: "TestSnapshotIsACopy"
      hidden: true
      hint: "Изменения снимка не должны попадать в реестр и наоборот."
    - id: "snapshot-load"
      title: "Snapshot при параллельных обновлениях (скрытый)"
      match: "TestSnapshotWhileUpdating"
      hidden: true
      hint: "Обход карты без RLock при параллельной записи приводит к аварийному завершению рантайма. Копируйте под блокировкой."
