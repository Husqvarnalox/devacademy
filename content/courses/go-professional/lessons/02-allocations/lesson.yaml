id: "go.pro.allocations"
title: "Аллокации на горячем пути: Builder, предвыделение, бенчмарки"
goal: "Сократить число аллокаций в функции экспорта, сохранив результат, и проверить это через testing.AllocsPerRun."
difficulty: "hard"
estimatedMinutes: 60
prerequisites:
  - "go.pro.slice-internals"
objectives:
  - "Объяснить, откуда берутся аллокации в конкатенации строк, fmt.Sprintf и append без предвыделения."
  - "Заменить построение строки в цикле на strings.Builder с Grow и числа - на strconv.Append*."
  - "Предвыделить срез по известной или оценённой длине."
  - "Измерить аллокации через testing.AllocsPerRun и бенчмарк с -benchmem, понимая пределы измерения."
masteryCriteria:
  - "Ваша FormatCSV делает константное число аллокаций независимо от числа строк."
  - "ActiveNames выделяет только результирующий срез."
  - "Поведение (кавычки в CSV, нули в копейках, пустой ввод) не изменилось."
related:
  - "go.pro.slice-internals"
  - "go.pro.escape-analysis-and-gc"
next:
  - "go.pro.data-races"
tags:
  - "go"
  - "performance"
  - "allocations"
  - "benchmarks"
facts:
  - kind: "internals"
    text: "testing.AllocsPerRun вызывает функцию один раз для прогрева, затем замеряет среднее число аллокаций за runs запусков (целое, округлённое вниз) и на время замера устанавливает GOMAXPROCS(1)."
    sources:
      - "https://pkg.go.dev/testing#AllocsPerRun"
  - kind: "internals"
    text: "Метод (*testing.B).Loop, добавленный в Go 1.24, заменяет цикл for range b.N: таймер сбрасывается при первом вызове, а аргументы и результаты вызова внутри цикла компилятор не оптимизирует прочь."
    sources:
      - "https://pkg.go.dev/testing#B.Loop"
      - "https://go.dev/blog/testing-b-loop"
  - kind: "internals"
    text: "strings.Builder накапливает байты в собственном срезе; метод Grow резервирует ёмкость заранее, а String возвращает строку без копирования накопленных байтов."
    sources:
      - "https://pkg.go.dev/strings#Builder"
  - kind: "misconception"
    text: "«Меньше аллокаций - всегда быстрее». Аллокация - лишь одна из статей затрат: замена читаемого кода на ручную сборку байтов оправдана только там, где профиль показывает горячий путь."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Цикл из N итераций делает `out += line`. Сколько примерно аллокаций строк он вызывает и почему общий объём копирования растёт квадратично?"
      options:
        - "Одну: компилятор склеивает все += в один вызов."
        - "Около N: каждая конкатенация создаёт новую строку и копирует все накопленные байты."
        - "Около log2(N): строка удваивается как срез."
        - "Ноль: короткие строки лежат на стеке."
      answer: 1
      explanation: "Строки в Go неизменяемы, поэтому out += line выделяет новую строку длиной len(out)+len(line) и копирует обе части. Копируемый объём на i-й итерации пропорционален i, сумма по циклу - O(N^2). Удвоение ёмкости характерно для append к срезу, а не для конкатенации."
    - id: "q2"
      type: "single"
      prompt: "Что делает `var b strings.Builder; b.Grow(n)` перед циклом записей, если итоговая длина не превысит n?"
      options:
        - "Ничего полезного: Builder сам знает итоговый размер."
        - "Резервирует буфер на n байт один раз, поэтому записи в цикле не перевыделяют память."
        - "Запрещает дальнейшие записи сверх n и паникует."
        - "Переносит буфер на стек."
      answer: 1
      explanation: "Grow гарантирует свободное место под n байт. Если оценка верна, весь цикл обходится одной аллокацией буфера. Если превысить n, Builder просто вырастет ещё раз - паники нет."
    - id: "q3"
      type: "multiple"
      prompt: "Какие утверждения о измерении аллокаций верны?"
      options:
        - "testing.AllocsPerRun детерминирован настолько, что подходит для утверждения вида `allocs <= N` в обычном тесте."
        - "Результат бенчмарка в ns/op надёжно сравнивать между запусками на разных машинах в CI."
        - "-benchmem добавляет к выводу бенчмарка B/op и allocs/op."
        - "Бенчмарк, который выбрасывает результат вызова без использования, может быть оптимизирован компилятором, и поэтому результат стоит сохранять в переменную пакетного уровня или использовать b.Loop."
      answer:
        - 0
        - 2
        - 3
      explanation: "Число аллокаций при одном и том же коде и входе устойчиво, а время зависит от нагрузки на машину, частоты процессора и соседей. Поэтому проверки в тестах строят на AllocsPerRun, а ns/op оставляют для локального сравнения до/после."
    - id: "q4"
      type: "single"
      prompt: "Функция собирает отфильтрованные имена: `var out []string; for ... { out = append(out, x) }`. Количество подходящих элементов можно получить дешёвым первым проходом. Что лучше всего сократит аллокации?"
      options:
        - "Заменить срез на map."
        - "Посчитать n первым проходом и создать `make([]string, 0, n)`."
        - "Вызывать runtime.GC() перед циклом."
        - "Использовать `out = append(out[:0:0], ...)`."
      answer: 1
      explanation: "Известная заранее ёмкость убирает серию перевыделений при росте. Цена - второй проход по входу; для коротких фильтров он дешевле аллокаций, для дорогих предикатов нужно взвесить. map и принудительный GC аллокаций не сокращают."
    - id: "q5"
      type: "short"
      prompt: "Какая функция пакета strconv дописывает десятичное представление int64 в существующий []byte без создания промежуточной строки? (имя функции)"
      answer:
        - "AppendInt"
        - "strconv.AppendInt"
      explanation: "strconv.AppendInt(dst, i, base) возвращает dst с добавленными цифрами. Если ёмкости dst хватает, аллокации нет; в отличие от strconv.Itoa и fmt.Sprint, создающих новую строку."
exercise:
  id: "go.pro.allocations.exercise"
  title: "Экспорт в CSV без аллокации на каждую строку"
  prompt: |
    Пакет `report` формирует выгрузку клиентов. Функция `FormatCSV` верна, но на выгрузке в сотни тысяч строк она
    создаёт по три аллокации на строку (`fmt.Sprintf`, конкатенация, `ReplaceAll`), и профиль показывает, что сборщик мусора
    занимает заметную долю времени. `ActiveNames` растит срез через `append` с нулевой ёмкости.

    Перепишите обе функции в `report.go`, **не меняя поведение**:

    * `FormatCSV`: число аллокаций за вызов не должно зависеть от числа строк (тест допускает не более 4 для 100 записей).
      Подойдут `strings.Builder` с `Grow`, `strconv.AppendInt` во временный буфер на стеке, ручная запись символов с
      удвоением кавычек.
    * `ActiveNames`: не больше одной аллокации (сам результат); при отсутствии подходящих записей по-прежнему возвращается
      не `nil`, а пустой срез.

    Формат: `id,name,dollars.cents\n`; копейки всегда двумя цифрами; имя с запятой, кавычкой или переводом строки берётся в
    кавычки, внутренние кавычки удваиваются.

    **Что проверяют тесты:** корректность на наборе случаев и сравнение с эталонной реализацией, а также
    `testing.AllocsPerRun`. **Чего они не проверяют:** читаемость, разумность оценки для `Grow`, время выполнения. Бенчмарки
    автоматически не запускаются, потому что их время недетерминировано: измерьте результат локально командой
    `go test -bench . -benchmem`.

    Запуск тестов: `go test -json -count=1 ./...`.
  evaluation: "command"
  languageId: "go"
  entryFile: "report.go"
  starter: "exercise/starter"
  solution: "exercise/solution"
  tests_dir: "exercise/tests"
  command:
    run: ["go", "test", "-json", "-count=1", "./..."]
    report: "go-test-json"
    testsTarget: "."
    timeoutSeconds: 45
  hints:
    - "Запустите go test в заготовке и посмотрите число аллокаций в сообщении падения. Основные источники: Sprintf, +=, ReplaceAll и рост среза в ActiveNames."
    - "В FormatCSV объявите var b strings.Builder, вызовите b.Grow(оценка) и пишите в цикле через WriteString, WriteByte и Write. Оценку получите суммой len(r.Name)+запас на числа."
    - "Числа записывайте так: var tmp [24]byte; b.Write(strconv.AppendInt(tmp[:0], v, 10)). Копейки - два байта '0'+c/10 и '0'+c%10. Для кавычек пройдите по строке и перед каждой '\"' запишите ещё одну."
    - "В ActiveNames сначала посчитайте подходящие записи, затем make([]string, 0, n) и append. Для n == 0 make вернёт непустой (не nil) срез длины 0."
  tests:
    - id: "csv-correct"
      title: "FormatCSV: форматирование строк"
      match: "TestFormatCSV/*"
      hint: "Копейки всегда двумя цифрами (7.05, 0.05), пустой ввод даёт пустую строку, после каждой записи стоит перевод строки."
    - id: "csv-allocs"
      title: "FormatCSV: число аллокаций не растёт с числом строк"
      match: "TestFormatCSVAllocs"
      hint: "Сообщение теста называет текущее число аллокаций. Уберите fmt.Sprintf, конкатенацию и ReplaceAll из тела цикла."
    - id: "csv-quoting"
      title: "FormatCSV: кавычки в имени (скрытый)"
      match: "TestFormatCSVQuoting/*"
      hidden: true
      hint: "Имя с запятой, кавычкой или переводом строки берётся в кавычки, внутренние кавычки удваиваются; кириллица без изменений."
    - id: "csv-reference"
      title: "FormatCSV: совпадение с эталоном (скрытый)"
      match: "TestFormatCSVMatchesReference"
      hidden: true
      hint: "Оптимизация не должна менять результат: сравнивается весь вывод на 50 записях, включая особые имена."
    - id: "names-correct"
      title: "ActiveNames: корректность (скрытый)"
      match: "TestActiveNames"
      hidden: true
      hint: "Порядок входа сохраняется, а результат при отсутствии совпадений - пустой срез, не nil."
    - id: "names-allocs"
      title: "ActiveNames: одна аллокация (скрытый)"
      match: "TestActiveNamesAllocs"
      hidden: true
      hint: "Срез нужно создать один раз с нужной ёмкостью: посчитайте подходящие записи заранее."
