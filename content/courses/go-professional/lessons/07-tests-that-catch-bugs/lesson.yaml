id: "go.pro.tests-that-catch-bugs"
title: "Тесты, которые ловят ошибки: мутанты и граничные значения"
goal: "Составить таблицу тест-кейсов по спецификации так, чтобы она принимала корректную реализацию и отклоняла каждую из заведомо ошибочных."
difficulty: "hard"
estimatedMinutes: 60
prerequisites:
  - "go.pro.resource-cleanup"
objectives:
  - "Объяснить мутационное тестирование: мутант, убитый и выживший мутант, чем это отличается от покрытия строк."
  - "Применять анализ классов эквивалентности и граничных значений при выборе входов."
  - "Писать табличные данные тестов как данные (срез структур), отделённые от логики проверки."
  - "Сверять ожидаемые значения со спецификацией, а не с поведением кода."
masteryCriteria:
  - "Таблица Cases согласуется со спецификацией на каждом входе."
  - "Каждый из шести скрытых мутантов проваливает хотя бы один ваш случай."
  - "Названия и входы случаев уникальны и объясняют идею проверки."
related:
  - "go.fundamentals.errors-and-table-tests"
  - "go.fundamentals.packages-modules-testing"
next:
  - "go.pro.escape-analysis-and-gc"
tags:
  - "go"
  - "testing"
  - "mutation-testing"
  - "boundary-values"
facts:
  - kind: "misconception"
    text: "«100% покрытия строк означает, что тесты хорошие». Покрытие показывает, какие строки выполнялись, но не проверяет, что результат сверяется: тест без утверждений даёт стопроцентное покрытие. Мутационное тестирование проверяет именно способность тестов обнаруживать изменения поведения."
  - kind: "internals"
    text: "Табличный тест в Go описывает случаи срезом структур и прогоняет их в цикле с t.Run; подтесты можно запускать по имени флагом -run, а падение одного не отменяет остальные."
    sources:
      - "https://go.dev/wiki/TableDrivenTests"
      - "https://pkg.go.dev/testing#T.Run"
  - kind: "real-world"
    text: "Типичные источники дефектов лежат на границах: пустой ввод, нуль, максимум и максимум плюс один, порядок элементов, повторы, регистр, пробельные символы. Поэтому в набор входят значения по обе стороны каждой границы спецификации."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Мутационное тестирование заменяет в коде `<` на `<=`, запускает тесты и они все проходят. Что это означает?"
      options:
        - "Код корректен."
        - "Мутант выжил: ни один тест не различает эти две версии, значит граничный случай не проверяется."
        - "Тесты слишком строгие."
        - "Нужно удалить условие."
      answer: 1
      explanation: "Если изменение поведения не обнаружено, то в тестах нет входа, на котором `<` и `<=` дают разные результаты (обычно это граничное значение). Выжившие мутанты показывают пробелы набора."
    - id: "q2"
      type: "single"
      prompt: "Спецификация: «длина имени от 1 до 20 символов». Какой набор длин лучше всего проверяет границы?"
      options:
        - "5, 10, 15"
        - "0, 1, 20, 21"
        - "1, 2, 3"
        - "20, 40, 60"
      answer: 1
      explanation: "Границы проверяют по обе стороны: последнее недопустимое и первое допустимое значение на каждой границе. Ошибка off-by-one (< вместо <=) проявляется только на этих значениях."
    - id: "q3"
      type: "multiple"
      prompt: "Какие свойства делают таблицу тестов надёжной?"
      options:
        - "Ожидаемое значение вычислено по спецификации, а не скопировано из вывода тестируемой функции."
        - "Каждый случай имеет понятное имя, из которого видна проверяемая идея."
        - "Случаи отрицательных исходов (ошибки, отказ) включены наравне с успешными."
        - "Чем больше случаев с похожими входами, тем лучше, независимо от различий."
      answer:
        - 0
        - 1
        - 2
      explanation: "Копирование ожиданий из вывода программы фиксирует и её ошибки. Имена объясняют намерение при падении. Отрицательные исходы часто содержат больше дефектов. Множество почти одинаковых случаев не добавляет проверок: важно разнообразие классов эквивалентности."
    - id: "q4"
      type: "single"
      prompt: "Функция принимает строки вида `12m`, но реализация случайно принимает и `12` (без единицы). Какой случай обнаружит это?"
      options:
        - "Вход `12m`, ожидание 720."
        - "Вход `12`, ожидание ошибки."
        - "Вход `0m`, ожидание 0."
        - "Вход `m`, ожидание ошибки."
      answer: 1
      explanation: "Нужен вход, нарушающий именно эту часть спецификации. Другие случаи верны, но проходят и в ошибочной реализации: она ведёт себя на них одинаково."
    - id: "q5"
      type: "single"
      prompt: "Тест проверяет `f(\"5s\") == 5`, а реализация возвращает значение через `time.ParseDuration(...)`. Автор тестов запускает реализацию и вставляет её результаты как ожидаемые для двадцати новых входов. В чём риск?"
      options:
        - "Риска нет: тесты зелёные."
        - "Тест становится зеркалом реализации: ошибки реализации попадают в ожидания и больше не обнаруживаются."
        - "ParseDuration нельзя использовать в тестах."
        - "Тесты станут медленными."
      answer: 1
      explanation: "Такой подход называют характеризационными тестами: они полезны, чтобы зафиксировать текущее поведение при рефакторинге, но не доказывают корректность. Для новых тестов ожидания берут из спецификации."
exercise:
  id: "go.pro.tests-that-catch-bugs.exercise"
  title: "Таблица тестов для ParseSeconds"
  prompt: |
    Команда соседей написала разбор компактных длительностей `ParseSeconds("1h30m") == 5400`, а вам поручили таблицу
    тестов для него. Реализации в репозитории нет, есть только спецификация в комментарии пакета (откройте
    `cases.go`). В заготовке три тривиальных случая: все они проходят и на корректной реализации, и почти на любой
    ошибочной.

    Дополните `Cases` так, чтобы:

    1. каждый случай соответствовал спецификации (ожидаемые секунды посчитаны вручную; для отказов `WantErr: true`);
    2. таблица **отличала** корректную реализацию от шести скрытых ошибочных (мутантов): для каждого мутанта хотя бы один
       случай должен ожидать то, чего мутант не делает;
    3. имена и входы случаев не повторялись, всего не более 40 случаев.

    Мутант - реализация, отличающаяся от верной одним намеренным дефектом. Скрытые тесты перечисляют их как `m1`...`m6`.
    Подсказка по методу: для каждого правила спецификации придумайте вход, который нарушает **только** его, и вход
    на границе допустимого.

    **Что проверяют тесты:** согласованность каждого случая с эталонной реализацией и «убийство» каждого из шести
    мутантов. **Чего они не проверяют:** полноту таблицы за пределами этих шести дефектов (реальный набор мутантов шире),
    качество имён и читаемость. Эталонный разбор и мутанты лежат в файле скрытого теста; это учебная задача, а не защита от
    копирования: цель - выработать привычку искать входы, различающие реализации.

    Запуск тестов: `go test -json -count=1 ./...`.
  evaluation: "command"
  languageId: "go"
  entryFile: "cases.go"
  starter: "exercise/starter"
  solution: "exercise/solution"
  tests_dir: "exercise/tests"
  command:
    run: ["go", "test", "-json", "-count=1", "./..."]
    report: "go-test-json"
    testsTarget: "."
    timeoutSeconds: 45
  hints:
    - "Пройдите по спецификации пункт за пунктом и для каждого пункта придумайте вход, который нарушает только его, и вход, который лежит ровно на границе допустимого. Для отказов ожидание WantErr: true."
    - "Нужны случаи на порядок единиц, повтор единицы, значения выше 59, число без единицы, нули в начале и граница в 6 цифр (6 цифр допустимы, 7 - нет)."
    - "Проверьте, что ожидаемые значения считаете по спецификации: 1h2m3s - это 3600 + 120 + 3 секунд. Если случай не согласуется с эталоном, тест сообщит, что говорит спецификация."
    - "Пример для порядка: вход \"30s1h\" должен давать ошибку, потому что часы идут раньше секунд. Пример для границы: \"999999s\" допустим, \"1000000s\" нет."
  tests:
    - id: "well-formed"
      title: "Таблица оформлена корректно"
      match: "TestCasesAreWellFormed"
      hint: "Не более 40 случаев; имена не пустые и не повторяются; входы не повторяются."
    - id: "agrees-with-spec"
      title: "Каждый случай согласуется со спецификацией"
      match: "TestCasesAgreeWithReference"
      hint: "Падение называет случай и показывает, что эталон принимает или отвергает на этом входе и какое значение даёт."
    - id: "mutant-1"
      title: "Мутант m1 обнаружен"
      match: "TestMutantsAreDetected/m1"
      hint: "Мутант нарушает правило, связанное с порядком компонентов; нужен вход, в котором компоненты расположены иначе, чем требует спецификация."
    - id: "mutant-2"
      title: "Мутант m2 обнаружен (скрытый)"
      match: "TestMutantsAreDetected/m2"
      hidden: true
      hint: "Мутант нарушает правило о количестве использований одной единицы в записи."
    - id: "mutant-3"
      title: "Мутант m3 обнаружен (скрытый)"
      match: "TestMutantsAreDetected/m3"
      hidden: true
      hint: "Мутант неверно обрабатывает допустимые значения компонента, выходящие за привычный диапазон «часов на циферблате»."
    - id: "mutant-4"
      title: "Мутант m4 обнаружен (скрытый)"
      match: "TestMutantsAreDetected/m4"
      hidden: true
      hint: "Мутант принимает вход, у которого не хватает части компонента; подумайте, чего может не хватать у числа."
    - id: "mutant-5"
      title: "Мутант m5 обнаружен (скрытый)"
      match: "TestMutantsAreDetected/m5"
      hidden: true
      hint: "Мутант отвергает форму записи числа, которую спецификация прямо разрешает."
    - id: "mutant-6"
      title: "Мутант m6 обнаружен (скрытый)"
      match: "TestMutantsAreDetected/m6"
      hidden: true
      hint: "Мутант сдвигает границу допустимой длины числа; проверяйте значения по обе стороны границы, а не только одно из них."
