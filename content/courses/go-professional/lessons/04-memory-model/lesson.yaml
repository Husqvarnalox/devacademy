id: "go.pro.memory-model"
title: "Модель памяти: happens-before, безопасная публикация, sync.Once"
goal: "Реализовать лениво загружаемую конфигурацию, которая инициализируется ровно один раз и безопасно публикуется всем горутинам."
difficulty: "expert"
estimatedMinutes: 65
prerequisites:
  - "go.pro.data-races"
objectives:
  - "Объяснить отношение happens-before и назвать операции Go, которые его создают (go, канал, close, Mutex, Once, atomic)."
  - "Показать, почему обычный bool-флаг не синхронизирует чтение связанных с ним данных."
  - "Применить sync.Once, sync.OnceValues и закрытие канала как безопасную публикацию значения."
  - "Объяснить, что происходит с ошибкой инициализации и с повторным входом внутрь Once.Do."
masteryCriteria:
  - "Загрузчик конфигурации вызывается ровно один раз при одновременных обращениях."
  - "Все горутины видят полностью построенный объект, а не частично инициализированный."
  - "Канал готовности закрывается один раз, в том числе при ошибке загрузки."
related:
  - "go.pro.data-races"
  - "go.fundamentals.goroutines-and-channels"
next:
  - "go.pro.context-cancellation"
tags:
  - "go"
  - "memory-model"
  - "sync.Once"
  - "concurrency"
facts:
  - kind: "internals"
    text: "Модель памяти Go определяет, при каких условиях чтение переменной в одной горутине гарантированно видит запись из другой: нужна цепочка отношений happens-before, которую создают инициализация пакетов, оператор go, операции с каналами, sync.Mutex, sync.Once и пакет sync/atomic."
    sources:
      - "https://go.dev/ref/mem"
  - kind: "internals"
    text: "Для sync.Once модель памяти гарантирует: возврат из f, вызванной через once.Do(f), происходит раньше возврата любого once.Do(f). Закрытие канала происходит раньше получения, вернувшего нулевое значение из-за закрытия."
    sources:
      - "https://go.dev/ref/mem#once"
      - "https://go.dev/ref/mem#chan"
  - kind: "internals"
    text: "Функции sync.OnceFunc, sync.OnceValue и sync.OnceValues добавлены в Go 1.21; они запоминают результат функции (и панику) и возвращают его при каждом вызове."
    sources:
      - "https://pkg.go.dev/sync#OnceValues"
  - kind: "misconception"
    text: "«На x86 флаги и так работают». Корректность определяется моделью памяти языка, а не конкретным процессором: компилятор вправе переупорядочивать и кешировать обращения к обычным переменным, поэтому цикл ожидания на неатомарном флаге может не завершиться даже на x86."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Горутина A: `data = 42; ready = true`. Горутина B: `for !ready {}; println(data)`; обе переменные обычные. Что гарантирует модель памяти Go?"
      options:
        - "B напечатает 42: запись data выполнена раньше записи ready."
        - "Ничего: это гонка данных, B может зависнуть в цикле или увидеть 0."
        - "B напечатает 42 или 0, но программа не зависнет."
        - "Компилятор выдаст ошибку."
      answer: 1
      explanation: "Между записью и чтением нет отношения happens-before, поэтому это гонка данных: компилятор может вынести чтение ready из цикла, а процессор или компилятор могут переупорядочить записи. Исправление: канал (close(ready)), atomic.Bool или Mutex."
    - id: "q2"
      type: "multiple"
      prompt: "Какие операции создают отношение happens-before между горутинами?"
      options:
        - "close(ch) в A и получение из ch, вернувшее значение из-за закрытия, в B."
        - "once.Do(f): возврат f раньше возврата любого once.Do."
        - "time.Sleep(10 * time.Millisecond) в B после запуска A."
        - "Unlock мьютекса в A и последующий Lock того же мьютекса в B."
      answer:
        - 0
        - 1
        - 3
      explanation: "Синхронизацию создают каналы, Once, мьютексы, atomic и WaitGroup. time.Sleep лишь откладывает выполнение и ничего не упорядочивает: на нём нельзя строить корректность."
    - id: "q3"
      type: "single"
      prompt: "Загрузчик, переданный в once.Do, вернул ошибку. Что произойдёт при следующем вызове once.Do с другой функцией?"
      options:
        - "Выполнится новая функция: Once запоминает только успех."
        - "Ничего не выполнится: Do вызывает функцию только один раз, независимо от результата; ошибку нужно сохранить самим."
        - "Паника."
        - "Do повторит предыдущую функцию."
      answer: 1
      explanation: "Once считает «выполнением» сам вызов функции, а не её успех. Чтобы разрешить повторную попытку, нужен мьютекс и флаг успеха, либо отдельная политика повторов. Результат и ошибку при использовании Once сохраняют в полях рядом."
    - id: "q4"
      type: "single"
      prompt: "Внутри функции f, переданной в once.Do, вызывается тот же once.Do(g). Что произойдёт?"
      options:
        - "g выполнится, затем f продолжит."
        - "g проигнорируется."
        - "Взаимная блокировка: внутренний Do ждёт завершения внешнего."
        - "Паника с понятным сообщением."
      answer: 2
      explanation: "Do держит внутреннюю блокировку, пока выполняется f. Повторный вход из той же горутины ждёт самого себя - deadlock. Загрузчик не должен вызывать метод, обращающийся к тому же Once."
    - id: "q5"
      type: "single"
      prompt: "Зачем в решении `close(s.ready)` вызывается внутри once.Do, после записи s.cfg и s.err, а не отдельным кодом после Do?"
      options:
        - "Чтобы канал закрылся быстрее."
        - "Чтобы закрытие происходило ровно один раз и строго после записей: получатель из закрытого канала увидит cfg и err."
        - "Потому что close нельзя вызывать вне Do."
        - "Это не нужно, можно закрывать в каждом вызове Config."
      answer: 1
      explanation: "Повторное закрытие канала вызывает панику, поэтому close помещают в код, выполняемый один раз. Закрытие после записей даёт happens-before к получению из канала, и читатель, дождавшийся Ready, видит полный результат."
exercise:
  id: "go.pro.memory-model.exercise"
  title: "Ленивая конфигурация: один вызов загрузчика и сигнал готовности"
  prompt: |
    Сервис `config.Service` лениво загружает конфигурацию из медленного источника (диск, сеть). Требования:

    * загрузчик вызывается **ровно один раз**, сколько бы горутин ни вызвали `Config()` одновременно; результат (значение
      или ошибка) запоминается и возвращается всем;
    * каждый вызывающий видит полностью построенный `*Config` (имя и все лимиты), а не пустой объект;
    * `Ready()` возвращает канал, который закрывается, когда загрузка завершилась (успешно или с ошибкой); он закрывается
      один раз, а получатель из него потом может сразу читать результат через `Config()`.

    В заготовке синхронизация построена на обычном флаге `loaded bool`: два вызова одновременно проходят проверку, а читатель,
    увидевший `true`, не имеет гарантии, что увидит запись `cfg`. Канал готовности никто не закрывает.

    **Что проверяют тесты:** число вызовов загрузчика (медленный загрузчик расширяет окно для второго вызова), полноту
    полученного объекта, запоминание ошибки, закрытие `Ready` после успеха и после ошибки, отсутствие паники при повторных
    вызовах. **Чего не проверяют:** отсутствие гонок данных на уровне памяти (для этого запускайте локально
    `go test -race -count=5 ./...`, в среде проверки детектор недоступен), отсутствие повторного входа в загрузчик и
    возможность повторной попытки после ошибки - это проектное решение, которое объяснено в теории.

    Запуск тестов: `go test -json -count=1 ./...`.
  evaluation: "command"
  languageId: "go"
  entryFile: "config.go"
  starter: "exercise/starter"
  solution: "exercise/solution"
  tests_dir: "exercise/tests"
  command:
    run: ["go", "test", "-json", "-count=1", "./..."]
    report: "go-test-json"
    testsTarget: "."
    timeoutSeconds: 45
  hints:
    - "Флаг loaded не создаёт happens-before и не делает проверку и загрузку атомарными. Нужен примитив, который выполняет функцию один раз и упорядочивает результат для всех вызывающих."
    - "Добавьте в Service поле once sync.Once и выполняйте загрузку внутри s.once.Do(func() { ... }). Значения s.cfg и s.err запишите внутри этой функции."
    - "Канал готовности закройте внутри той же функции Do, после записи cfg и err: close(s.ready). Тогда закрытие происходит один раз и после записей."
    - "Config вернёт s.cfg, s.err после Do. Проверка s.load == nil остаётся до Do. Поле loaded больше не нужно."
  tests:
    - id: "load-once"
      title: "Загрузчик вызывается ровно один раз при 40 одновременных вызовах"
      match: "TestConfigLoadsOnce"
      hint: "Если вызовов больше одного, проверка флага и загрузка не атомарны. Результат должен быть один и тот же указатель у всех."
    - id: "ready-signal"
      title: "Ready закрывается после загрузки, ожидающие видят результат"
      match: "TestReadySignal"
      hint: "Канал нужно закрыть после записи cfg и err и ровно один раз; до загрузки он открыт."
    - id: "error-remembered"
      title: "Ошибка загрузки запоминается (скрытый)"
      match: "TestConfigErrorIsRemembered"
      hidden: true
      hint: "Загрузчик при ошибке не вызывается снова: ошибку храните рядом с результатом внутри той же однократной функции."
    - id: "no-loader"
      title: "Сервис без загрузчика (скрытый)"
      match: "TestNoLoader"
      hidden: true
      hint: "Проверка отсутствия загрузчика должна вернуть ErrNotConfigured, а не вызвать nil-функцию."
    - id: "ready-after-error"
      title: "Ready закрывается и после ошибки (скрытый)"
      match: "TestReadyClosedAfterFailureToo"
      hidden: true
      hint: "Закрытие канала не должно зависеть от успеха загрузки, и повторные вызовы Config не должны закрывать его снова."
