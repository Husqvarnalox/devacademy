id: "go.pro.context-cancellation"
title: "Отмена, дедлайны и утечки горутин"
goal: "Переписать конкурентный загрузчик так, чтобы он быстро останавливался при отмене или ошибке и не оставлял работающих горутин."
difficulty: "hard"
estimatedMinutes: 70
prerequisites:
  - "go.pro.memory-model"
objectives:
  - "Перечислить типичные причины утечки горутин: блокировка на отправке, на получении, ожидание без ctx.Done()."
  - "Построить пул воркеров, который останавливается при отмене родительского контекста и при первой ошибке."
  - "Оборачивать ошибки через %w так, чтобы errors.Is(err, context.Canceled) и errors.Is(err, context.DeadlineExceeded) работали."
  - "Проверять отсутствие утечек тестом с runtime.NumGoroutine и повторным опросом."
masteryCriteria:
  - "FetchAll возвращается быстро после отмены родительского контекста и истечения дедлайна."
  - "После первой ошибки не запускается ни одной новой загрузки, а уже запущенные получают отмену."
  - "После возврата FetchAll все его горутины завершены."
related:
  - "go.fundamentals.concurrency-patterns-and-context"
  - "go.pro.data-races"
next:
  - "go.pro.resource-cleanup"
tags:
  - "go"
  - "context"
  - "goroutine-leaks"
  - "worker-pool"
facts:
  - kind: "internals"
    text: "context.Canceled и context.DeadlineExceeded - значения ошибок, которые возвращает ctx.Err() после отмены; сравнивать их нужно через errors.Is, потому что в реальном коде ошибку чаще всего оборачивают."
    sources:
      - "https://pkg.go.dev/context"
  - kind: "internals"
    text: "Функции context.WithCancelCause и context.Cause (Go 1.20) позволяют сохранить и затем получить причину отмены, отличную от стандартного context.Canceled."
    sources:
      - "https://pkg.go.dev/context#WithCancelCause"
      - "https://pkg.go.dev/context#Cause"
  - kind: "real-world"
    text: "Утечка горутин почти никогда не падает сразу: растут потребление памяти и число горутин. Профиль горутин (pprof, /debug/pprof/goroutine) показывает, на какой строке они заблокированы."
    sources:
      - "https://pkg.go.dev/net/http/pprof"
  - kind: "misconception"
    text: "«Отмена контекста останавливает горутины». Контекст лишь сообщает об отмене через ctx.Done(); горутина остановится, только если сама следит за этим каналом (напрямую или передав контекст вызову, который его уважает)."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Горутина делает `results <- v` в небуферизованный канал, а получатель вышел из функции раньше. Что произойдёт с горутиной?"
      options:
        - "Она завершится с ошибкой."
        - "Она заблокируется навсегда: утечка, память и стек не освобождаются."
        - "Сборщик мусора её остановит."
        - "Значение будет отброшено, горутина продолжит."
      answer: 1
      explanation: "Сборщик мусора не завершает горутины. Блокировка на отправке без получателя продолжается вечно. Решения: буферизованный канал нужного размера, либо select с ctx.Done(), либо гарантированное чтение до закрытия."
    - id: "q2"
      type: "single"
      prompt: "`err := fmt.Errorf(\"fetch %s: %w\", url, ctx.Err())`. Что вернёт errors.Is(err, context.DeadlineExceeded), если контекст отменён по дедлайну?"
      options:
        - "false: текст ошибки изменён."
        - "true: %w сохраняет исходную ошибку в цепочке."
        - "Зависит от длины url."
        - "Паника."
      answer: 1
      explanation: "Verb %w оборачивает ошибку, а errors.Is разворачивает цепочку. Если использовать %v вместо %w, связь с исходной ошибкой теряется, и вызывающий код не сможет отличить таймаут от прочих сбоев."
    - id: "q3"
      type: "multiple"
      prompt: "Что нужно для того, чтобы воркеры пула остановились при отмене?"
      options:
        - "Передавать ctx вызовам, выполняющим долгую работу."
        - "Использовать select с ctx.Done() при отправке в канал и при ожидании задания."
        - "Вызвать runtime.Goexit() в основной горутине."
        - "Дождаться воркеров (sync.WaitGroup) перед возвратом, чтобы к моменту возврата они были завершены."
      answer:
        - 0
        - 1
        - 3
      explanation: "Горутины не останавливаются «снаружи»: они должны сами наблюдать отмену. WaitGroup гарантирует, что после возврата функции утечки нет. Goexit завершает только вызвавшую его горутину."
    - id: "q4"
      type: "single"
      prompt: "Код: `ctx, cancel := context.WithTimeout(parent, time.Second); result, err := work(ctx)` без вызова cancel. Что неверно?"
      options:
        - "Ничего: по истечении секунды всё освободится само."
        - "Ресурсы контекста (таймер и регистрация у родителя) живут до дедлайна; при быстром завершении work нужно вызывать cancel через defer, `go vet` сообщает о забытом cancel."
        - "WithTimeout нельзя использовать с родительским контекстом."
        - "work получит nil-контекст."
      answer: 1
      explanation: "cancel освобождает таймер и ссылку на родителя сразу после завершения работы. Забытый cancel - небольшая, но накапливающаяся утечка. Проверка lostcancel в go vet находит такие места."
    - id: "q5"
      type: "single"
      prompt: "Тест проверяет утечки так: `before := runtime.NumGoroutine(); run(); if runtime.NumGoroutine() != before { fail }`. Какой недостаток?"
      options:
        - "NumGoroutine не работает в тестах."
        - "Завершающиеся горутины исчезают не мгновенно, поэтому одноразовая проверка нестабильна; нужен опрос с таймаутом и сравнение с допустимым максимумом."
        - "Нужно использовать time.Sleep(time.Hour)."
        - "Недостатков нет."
      answer: 1
      explanation: "После возврата функции рантайм может ещё доли миллисекунды завершать горутины. Опрос в течение нескольких секунд делает проверку надёжной на медленных машинах и по-прежнему быстрой на нормальных."
exercise:
  id: "go.pro.context-cancellation.exercise"
  title: "FetchAll: быстрая остановка и отсутствие утечек"
  prompt: |
    Пакет `fetch` скачивает набор URL ограниченным числом воркеров. В продакшене замечено: после отмены запроса клиентом
    загрузки продолжаются, после первой ошибки остальные горутины остаются заблокированными (число горутин растёт), а в
    тексте ошибки нет адреса, на котором всё упало.

    Перепишите `FetchAll` в `fetch.go` по контракту из комментария:

    * не более `workers` одновременных вызовов `fetch`, результаты в порядке `urls`;
    * при первой ошибке остальные загрузки получают отмену контекста, новые не запускаются, а возвращается ошибка
      вида `fetch <url>: <исходная ошибка>` (оборачивание через `%w`);
    * при отмене родительского контекста или истечении дедлайна функция быстро возвращается с ошибкой, для которой
      `errors.Is(err, context.Canceled)` или `errors.Is(err, context.DeadlineExceeded)` истинно; при уже отменённом
      контексте `fetch` не вызывается;
    * после возврата не остаётся работающих горутин `FetchAll`.

    **Что проверяют тесты:** порядок и предел параллелизма, поведение при ошибке, отмене, дедлайне и уже отменённом
    контексте, отсутствие утечек (`runtime.NumGoroutine` до и после; проверка повторяется до 3 секунд, чтобы не зависеть от
    скорости машины). **Чего не проверяют:** `fetch`, который игнорирует контекст, FetchAll остановить не может (контракт
    требует, чтобы `Fetcher` уважал `ctx`); не проверяются читаемость, имена и отсутствие гонок данных (для этого
    локально `go test -race`).

    Запуск тестов: `go test -json -count=1 ./...`.
  evaluation: "command"
  languageId: "go"
  entryFile: "fetch.go"
  starter: "exercise/starter"
  solution: "exercise/solution"
  tests_dir: "exercise/tests"
  command:
    run: ["go", "test", "-json", "-count=1", "./..."]
    report: "go-test-json"
    testsTarget: "."
    timeoutSeconds: 45
  hints:
    - "Заготовка запускает по горутине на каждый URL и читает результаты из небуферизованного канала. После раннего return оставшиеся горутины навсегда зависают на отправке. Ограничьте число горутин и обеспечьте, чтобы все они завершались до возврата."
    - "Создайте ctx, cancel := context.WithCancel(parent) с defer cancel(). Запустите workers горутин, читающих индексы из канала jobs, и дождитесь их через sync.WaitGroup перед return."
    - "Отправку задания делайте через select { case jobs <- i: case <-ctx.Done(): break }. Воркер перед fetch проверяет ctx.Err() и пропускает задание, если контекст уже отменён. Первую ошибку сохраните под мьютексом и вызовите cancel()."
    - "Ошибку загрузки оборачивайте fmt.Errorf(\"fetch %s: %w\", url, err). После wg.Wait() сначала проверьте parent.Err() (вернуть fmt.Errorf(\"fetch all: %w\", err)), затем сохранённую первую ошибку."
  tests:
    - id: "order-limit"
      title: "Порядок результатов и предел параллелизма"
      match: "TestFetchAllOrderAndLimit"
      hint: "Результат i соответствует urls[i]; одновременно выполняется не больше workers вызовов fetch."
    - id: "first-error"
      title: "Первая ошибка отменяет остальные, горутины не текут"
      match: "TestFetchAllFirstErrorCancelsOthers"
      hint: "Ошибка называет URL, оборачивает исходную (errors.Is), а блокированные загрузки получают отмену от самой FetchAll, а не от вызывающего."
    - id: "empty"
      title: "Пустой список (скрытый)"
      match: "TestFetchAllEmpty"
      hidden: true
      hint: "Пустой ввод - пустой результат и nil, без блокировок на пустом пуле."
    - id: "no-new-after-error"
      title: "После ошибки новые загрузки не запускаются (скрытый)"
      match: "TestFetchAllNoNewFetchesAfterError"
      hidden: true
      hint: "Воркер проверяет ctx.Err() перед каждым заданием, а отправитель заданий прекращает отправку при отмене."
    - id: "parent-cancel"
      title: "Отмена родительского контекста (скрытый)"
      match: "TestFetchAllParentCancel"
      hidden: true
      hint: "Все воркеры ждут ctx.Done(): отмена должна дойти до fetch и до отправителя заданий; ошибка оборачивает context.Canceled."
    - id: "deadline"
      title: "Истёк дедлайн (скрытый)"
      match: "TestFetchAllDeadline"
      hidden: true
      hint: "Верните ошибку, оборачивающую context.DeadlineExceeded, и дождитесь завершения воркеров."
    - id: "already-cancelled"
      title: "Контекст уже отменён (скрытый)"
      match: "TestFetchAllAlreadyCancelled"
      hidden: true
      hint: "Не вызывайте fetch, если контекст отменён до начала работы, и верните ошибку отмены."
