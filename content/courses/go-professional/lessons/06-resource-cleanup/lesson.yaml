id: "go.pro.resource-cleanup"
title: "Освобождение ресурсов на всех путях: defer, errors.Join"
goal: "Открыть несколько ресурсов вместе и закрыть их в обратном порядке на каждом пути выполнения, не потеряв ни одной ошибки."
difficulty: "hard"
estimatedMinutes: 55
prerequisites:
  - "go.pro.context-cancellation"
objectives:
  - "Описать, когда выполняется defer, в каком порядке и что происходит при panic."
  - "Откатывать частично завершённое открытие: закрывать уже открытые ресурсы при ошибке на k-м."
  - "Не терять ошибки Close: агрегировать их через errors.Join и именованный результат."
  - "Сделать Close идемпотентным и защититься от двойного закрытия."
masteryCriteria:
  - "Закрытие идёт в порядке, обратном открытию, на путях успеха, ошибки и panic."
  - "Каждый Close вызывается, даже если предыдущий вернул ошибку."
  - "errors.Is находит каждую из объединённых ошибок."
related:
  - "go.fundamentals.functions-and-errors"
  - "go.fundamentals.errors-and-table-tests"
next:
  - "go.pro.tests-that-catch-bugs"
tags:
  - "go"
  - "defer"
  - "errors"
  - "resources"
facts:
  - kind: "internals"
    text: "Отложенные вызовы выполняются в порядке LIFO при выходе из функции, в том числе при panic и при runtime.Goexit; аргументы отложенного вызова вычисляются в момент выполнения оператора defer, а не при выходе."
    sources:
      - "https://go.dev/ref/spec#Defer_statements"
      - "https://go.dev/blog/defer-panic-and-recover"
  - kind: "internals"
    text: "Функция errors.Join (Go 1.20) возвращает ошибку, которая оборачивает все переданные не-nil ошибки и печатает их по одной на строку; если все аргументы nil, она возвращает nil. errors.Is и errors.As проходят по каждой из объединённых ошибок."
    sources:
      - "https://pkg.go.dev/errors#Join"
  - kind: "real-world"
    text: "Ошибка Close у файла, открытого на запись, может быть единственным сигналом о потерянных данных (отложенная запись на диск, квота, сетевая файловая система); игнорировать её через `defer f.Close()` допустимо только для чтения."
    sources:
      - "https://pkg.go.dev/os#File.Close"
  - kind: "misconception"
    text: "«defer в цикле освобождает ресурс в конце итерации». Нет: отложенные вызовы выполняются при выходе из функции, поэтому цикл по тысяче файлов с defer держит тысячу дескрипторов открытыми до конца функции."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "for i := 0; i < 3; i++ { defer fmt.Print(i, \" \") } Что выведет функция при выходе?"
      options:
        - "0 1 2"
        - "2 1 0"
        - "3 3 3"
        - "Ничего: defer в цикле запрещён."
      answer: 1
      explanation: "Аргумент i вычисляется при выполнении defer (0, 1, 2), а вызовы идут в обратном порядке: LIFO. Поэтому вывод «2 1 0». Тот же порядок подходит для освобождения ресурсов: последний открытый закрывается первым."
    - id: "q2"
      type: "single"
      prompt: "func read(names []string) error { for _, n := range names { f, err := os.Open(n); if err != nil { return err }; defer f.Close(); use(f) }; return nil }. Что плохо?"
      options:
        - "Ничего."
        - "Все файлы закрываются только при выходе из read: при длинном списке закончатся файловые дескрипторы; вынесите тело цикла в отдельную функцию."
        - "defer f.Close() вызывается до use(f)."
        - "os.Open нельзя вызывать в цикле."
      answer: 1
      explanation: "defer привязан к функции, а не к блоку. Классическое решение - функция, обрабатывающая один файл, внутри которой defer срабатывает при её завершении."
    - id: "q3"
      type: "single"
      prompt: "err := errors.Join(errA, nil, errB). Что вернёт errors.Is(err, errB)?"
      options:
        - "false: Join хранит только первую ошибку."
        - "true: Join оборачивает все не-nil аргументы."
        - "Паника из-за nil."
        - "Зависит от порядка аргументов."
      answer: 1
      explanation: "errors.Join отбрасывает nil и сохраняет остальные ошибки; errors.Is и errors.As ищут совпадение среди каждой из них."
    - id: "q4"
      type: "multiple"
      prompt: "Как сделать так, чтобы ошибка Close не потерялась, если основная работа уже вернула свою ошибку?"
      options:
        - "Объявить именованный результат `(err error)` и в defer выполнить `err = errors.Join(err, c.Close())`."
        - "Написать `defer c.Close()` и ничего более."
        - "Вернуть первую ошибку, а остальные записать в лог, если потеря информации допустима и это явно решено."
        - "Вызвать panic при ошибке Close."
      answer:
        - 0
        - 2
      explanation: "Именованный результат позволяет изменить возвращаемое значение в defer. Лог допустим как осознанный выбор, когда вызывающему код не нужны детали. `defer c.Close()` отбрасывает ошибку, а panic ломает вызывающего без необходимости."
    - id: "q5"
      type: "single"
      prompt: "Функция открывает a, b, c по очереди. Открытие c вернуло ошибку. Что обязана сделать функция?"
      options:
        - "Ничего: a и b закроет сборщик мусора."
        - "Закрыть b, затем a и вернуть ошибку открытия c вместе с ошибками закрытия, если они были."
        - "Закрыть a, затем b."
        - "Повторить открытие c в цикле."
      answer: 1
      explanation: "Сборщик мусора не закрывает файлы и соединения вовремя (финализаторы не гарантируют срок). Откат выполняется в обратном порядке открытия, потому что более поздние ресурсы могут зависеть от более ранних."
exercise:
  id: "go.pro.resource-cleanup.exercise"
  title: "Group и Process: закрытие всех ресурсов на каждом пути"
  prompt: |
    Пакет `cleanup` открывает несколько ресурсов (соединения, файлы, блокировки) через интерфейс `Opener` и выполняет
    над ними работу. В продакшене замечены утечки: если третий ресурс не открылся, первые два остаются открытыми; при
    панике или ошибке в работе ничего не закрывается; ошибка `Close` теряется; порядок закрытия не обратный.

    Исправьте в `cleanup.go`:

    * `OpenAll`: при ошибке открытия `k`-го ресурса закройте предыдущие в обратном порядке и верните ошибку, которая
      оборачивает ошибку открытия (`open "имя": %w`) и ошибки закрытия;
    * `Group.Close`: обратный порядок, **каждый** `Close` вызывается даже после ошибки, ошибки объединяются
      (`close "имя": %w`) через `errors.Join`; повторный вызов ничего не делает и возвращает `nil`;
    * `Process`: ресурсы закрываются при успехе, при ошибке `work` и при панике в `work` (паника продолжается после
      очистки); возвращаемая ошибка объединяет ошибку `work` и ошибки закрытия.

    **Что проверяют тесты:** журнал событий фейкового `Opener` (порядок открытий и закрытий), счётчики вызовов `Close`,
    `errors.Is` для каждой из объединённых ошибок, поведение при панике. **Чего не проверяют:** реальные файлы и сетевые
    ресурсы, повторный вход, `Close` самих фейков, который паникует, и читаемость решения.

    Запуск тестов: `go test -json -count=1 ./...`.
  evaluation: "command"
  languageId: "go"
  entryFile: "cleanup.go"
  starter: "exercise/starter"
  solution: "exercise/solution"
  tests_dir: "exercise/tests"
  command:
    run: ["go", "test", "-json", "-count=1", "./..."]
    report: "go-test-json"
    testsTarget: "."
    timeoutSeconds: 45
  hints:
    - "Рассмотрите четыре пути: успех, ошибка открытия, ошибка в work, паника в work. На каждом пути все открытые ресурсы закрываются в порядке, обратном открытию."
    - "Close группы: цикл от len-1 до 0, каждую ошибку добавляйте в срез errs как fmt.Errorf(\"close %q: %w\", name, err), в конце верните errors.Join(errs...). Чтобы Close был идемпотентным, после цикла обнулите срезы."
    - "OpenAll при ошибке: return nil, errors.Join(fmt.Errorf(\"open %q: %w\", name, err), g.Close()). Join отбрасывает nil, поэтому без ошибок закрытия остаётся только ошибка открытия."
    - "Process: объявите именованный результат (err error), после успешного OpenAll напишите defer func() { err = errors.Join(err, g.Close()) }() и верните work(g.Resources()). defer сработает и при панике."
  tests:
    - id: "happy"
      title: "Успешный путь: обратный порядок закрытия"
      match: "TestProcessHappyPath"
      hint: "Журнал: open a, open b, open c, work, close c, close b, close a."
    - id: "open-failure"
      title: "Ошибка открытия: откат предыдущих"
      match: "TestOpenFailureClosesPrevious"
      hint: "Если не открылся c, закрываются b, затем a; work не запускается; ошибка оборачивает исходную и называет ресурс."
    - id: "work-error"
      title: "Ошибка в work: ресурсы закрыты (скрытый)"
      match: "TestWorkErrorStillCloses"
      hidden: true
      hint: "Очистка не должна зависеть от результата work; ошибка work возвращается через errors.Is."
    - id: "panic"
      title: "Паника в work: ресурсы закрыты, паника продолжается (скрытый)"
      match: "TestWorkPanicStillCloses"
      hidden: true
      hint: "Очистка в defer срабатывает при панике; не вызывайте recover, паника должна дойти до вызывающего."
    - id: "joined"
      title: "Ошибки закрытия объединяются, все Close вызваны (скрытый)"
      match: "TestCloseErrorsAreJoined"
      hidden: true
      hint: "Не прекращайте закрытие после первой ошибки; соберите ошибки и верните errors.Join, чтобы errors.Is находил каждую."
    - id: "close-error-alone"
      title: "Ошибка Close после успешной работы (скрытый)"
      match: "TestCloseErrorAloneIsReturned"
      hidden: true
      hint: "Даже если work вернул nil, ошибка закрытия должна дойти до вызывающего: меняйте именованный результат в defer."
    - id: "open-and-close-failure"
      title: "Ошибка открытия вместе с ошибкой закрытия (скрытый)"
      match: "TestOpenFailureAndCloseFailureBothReported"
      hidden: true
      hint: "OpenAll при откате не должен терять ошибку закрытия; объедините её с ошибкой открытия."
    - id: "idempotent"
      title: "Close идемпотентен (скрытый)"
      match: "TestGroupCloseIsIdempotent"
      hidden: true
      hint: "После первого Close забудьте ресурсы: каждый закрывается ровно один раз, повторный вызов возвращает nil."
    - id: "no-names"
      title: "Пустой список имён (скрытый)"
      match: "TestProcessNoNames"
      hidden: true
      hint: "Пустой список допустим: work вызывается с пустым срезом, ошибки нет."
