id: "go.pro.escape-analysis-and-gc"
title: "Куча и стек: escape analysis и давление на сборщик мусора"
goal: "Читать вывод `go build -gcflags=-m`, находить причины выделений на куче и переписать горячий путь так, чтобы он не делал аллокаций."
difficulty: "expert"
estimatedMinutes: 75
prerequisites:
  - "go.pro.tests-that-catch-bugs"
objectives:
  - "Объяснить, чем стек отличается от кучи и какие решения принимает escape analysis."
  - "Прочитать строки вывода -gcflags=-m: moved to heap, escapes to heap, does not escape, leaking param."
  - "Назвать типичные причины выхода значения на кучу: возврат указателя, упаковка в интерфейс, замыкание, слишком большой размер."
  - "Оценить стоимость GC и компромиссы GOGC и GOMEMLIMIT."
masteryCriteria:
  - "Add для корректной строки не выделяет память в установившемся режиме (AllocsPerRun == 0)."
  - "Поведение Add и Count совпадает с эталонной моделью на случайном потоке строк."
  - "Вы можете по выводу -m указать строку, из-за которой выделяется память."
related:
  - "go.pro.allocations"
  - "go.pro.slice-internals"
next: []
tags:
  - "go"
  - "escape-analysis"
  - "garbage-collector"
  - "performance"
facts:
  - kind: "internals"
    text: "Компилятор Go решает, где разместить переменную, анализом выхода (escape analysis): если значение не может пережить вызов функции, оно остаётся в стеке горутины, иначе выделяется на куче и подлежит сборке мусора. Решение принимается при компиляции и видно в выводе флага -gcflags=-m."
    sources:
      - "https://go.dev/doc/faq#stack_or_heap"
      - "https://pkg.go.dev/cmd/compile"
  - kind: "internals"
    text: "Сборщик мусора Go - конкурентный, трёхцветный, без перемещения объектов и без разделения на поколения. Параметр GOGC (по умолчанию 100) задаёт, насколько куча может вырасти относительно живых данных после предыдущей сборки до следующего цикла; GOMEMLIMIT (Go 1.19) задаёт мягкий предел памяти рантайма."
    sources:
      - "https://go.dev/doc/gc-guide"
      - "https://go.dev/doc/gc-guide#Memory_limit"
  - kind: "misconception"
    text: "«Всё, что создаётся через new или &T{}, лежит на куче, а всё остальное на стеке». Место размещения определяет не синтаксис, а анализ выхода: &T{} может остаться в стеке, а локальная переменная - уйти на кучу из-за возвращаемого указателя или замыкания."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Код: `func newPoint() *point { p := point{1, 2}; return &p }`. Компилятор печатает `./main.go:8:2: moved to heap: p`. Что это значит?"
      options:
        - "Это предупреждение об ошибке: так писать нельзя."
        - "Адрес p возвращается из функции и переживёт её кадр стека, поэтому p размещается на куче."
        - "p копируется на кучу при каждом чтении."
        - "Переменная p удалена оптимизатором."
      answer: 1
      explanation: "Кадр стека исчезает после возврата, а указатель на p продолжает использоваться, поэтому компилятор размещает p на куче. Ошибки тут нет: Go безопасно разрешает возвращать адрес локальной переменной; цена - аллокация."
    - id: "q2"
      type: "single"
      prompt: "Для `func sumLocal() int { p := &point{3, 4}; return p.x + p.y }` вывод -m содержит `&point{...} does not escape`. Сколько куч-аллокаций делает функция?"
      options:
        - "Одну: оператор & всегда выделяет на куче."
        - "Ноль: объект размещается в стеке, потому что указатель не покидает функцию."
        - "Две."
        - "Зависит от размера GOGC."
      answer: 1
      explanation: "does not escape означает, что значение не переживёт вызов, поэтому место ему в кадре стека. Это опровергает распространённое мнение, что &T{} всегда уходит на кучу."
    - id: "q3"
      type: "single"
      prompt: "Вывод -m для вызова `fmt.Println(n)` с `n int`: `... argument does not escape` и `n escapes to heap`. Почему сам n «уходит на кучу»?"
      options:
        - "Println хранит n в глобальной переменной."
        - "Значение упаковывается в интерфейс any; содержимое интерфейса компилятор не может доказать неуходящим из-за динамического вызова, поэтому для упакованного значения может понадобиться объект на куче."
        - "Потому что n типа int всегда на куче."
        - "Ошибка компилятора."
      answer: 1
      explanation: "Передача значения как any создаёт интерфейс с указателем на данные. Когда получатель принимает значение через интерфейс, анализ часто не может доказать, что оно не сохранится, и значение выносится на кучу (для малых целых и констант рантайм использует ухищрения, поэтому не каждая упаковка стоит аллокации). Поэтому fmt в горячем цикле - частая причина аллокаций."
    - id: "q4"
      type: "multiple"
      prompt: "Что из перечисленного обычно уводит значение на кучу?"
      options:
        - "Возврат указателя на локальную переменную из функции, которая не инлайнится в вызывающий код."
        - "Захват переменной замыканием, которое возвращается из функции или передаётся в горутину."
        - "Локальная структура из трёх int, передаваемая по значению."
        - "Срез make([]byte, 1<<20), размер которого превышает предел стековых аллокаций компилятора."
      answer:
        - 0
        - 1
        - 3
      explanation: "Пережившие вызов указатели и замыкания, а также слишком большие значения размещаются на куче. Небольшая структура по значению остаётся в стеке и копируется дёшево."
    - id: "q5"
      type: "single"
      prompt: "Сервис в контейнере с лимитом 1 ГиБ держит около 400 МиБ живых данных. Как разумно настроить GC?"
      options:
        - "GOGC=off без других настроек: сборщик не тратит процессорное время."
        - "Оставить GOGC по умолчанию и задать GOMEMLIMIT ниже лимита контейнера (например, 900MiB): при приближении к пределу GC станет работать чаще, а не позволит рантайму выйти за предел."
        - "GOGC=1000: чем больше, тем лучше."
        - "Ничего не менять: GC знает размер контейнера."
      answer: 1
      explanation: "GOGC=off без предела приведёт к росту кучи до OOM, а GOGC=1000 при живых 400 МиБ допускает рост до ~4,4 ГиБ. GOMEMLIMIT - мягкий предел: рантайм ускоряет сборки, приближаясь к нему. Запас ниже лимита контейнера нужен под память, не учитываемую рантаймом. Если живые данные близки к лимиту, GC работает почти постоянно; предел следует поднимать, а не надеяться на настройку."
exercise:
  id: "go.pro.escape-analysis-and-gc.exercise"
  title: "Агрегатор access-лога без аллокаций на горячем пути"
  prompt: |
    Пакет `accesslog` ведёт статистику по строкам вида `GET /index.html 200 5123`. Метод `Add` вызывается на каждый запрос,
    а профиль показывает, что на нём и вспомогательных функциях уходит заметное время сборщика мусора. Для корректной
    строки в установившемся режиме он должен **вообще не выделять память**: `testing.AllocsPerRun` обязан дать `0`.

    Посмотрите причины сами: `go build -gcflags=-m` в каталоге упражнения покажет строки вроде `&Entry{...} escapes to heap`,
    `e.Method escapes to heap`, `leaking param`. Затем перепишите код, **не меняя наблюдаемого поведения**:

    * `Add`, `Count`, `Stats`, `NewAggregator`, `Entry`, `Stats`, `ErrBadLine` и формат ошибок для вызывающего кода остаются;
    * разбор строки не должен создавать срезов и объектов на куче (подсказка: `strings.Cut`, возврат структуры по значению);
    * ключ счётчика `(метод, статус)` не должен строиться форматированием строки;
    * путь ошибки (некорректная строка) может выделять память: форматирование ошибок не нужно ужимать.

    **Что проверяют тесты:** `AllocsPerRun == 0` для `Add` на четырёх разных корректных строках и для `Count`, совпадение
    с эталонной моделью на 2000 псевдослучайных строках (корректных и нет), счётчики классов статусов, отклонение
    некорректных строк. **Чего не проверяют:** скорость (бенчмарки не запускаются: время недетерминировано), размер кучи и
    поведение GC, читаемость. Нулевое число аллокаций проверяется в установившемся режиме после прогрева карты; первая
    строка с новым ключом может выделить память под запись в карте.

    Запуск тестов: `go test -json -count=1 ./...`.
  evaluation: "command"
  languageId: "go"
  entryFile: "accesslog.go"
  starter: "exercise/starter"
  solution: "exercise/solution"
  tests_dir: "exercise/tests"
  command:
    run: ["go", "test", "-json", "-count=1", "./..."]
    report: "go-test-json"
    testsTarget: "."
    timeoutSeconds: 45
  hints:
    - "Запустите go build -gcflags=-m и найдите строки escapes to heap в parseEntry, record и Count. В горячем пути три источника: strings.Split (срез), &Entry{...} (указатель из функции) и fmt.Sprintf для ключа карты."
    - "Разбор: method, rest, ok1 := strings.Cut(line, \" \") три раза подряд (метод, путь, остаток из статуса и размера). Подстроки делят память со строкой line, новых строк нет. parseEntry пусть возвращает Entry по значению."
    - "Ключ карты: объявите type key struct { method string; status int } и map[key]int. Запись a.byKey[key{e.Method, e.Status}]++ не выделяет память для уже существующего ключа. Count используйте с тем же ключом."
    - "Ошибки: fmt.Errorf остаётся только на пути ошибки. Лишние пробелы в конце или пустые поля по-прежнему должны давать ErrBadLine: остаток после третьего Cut должен целиком быть числом."
  tests:
    - id: "add-zero-allocs"
      title: "Add: ноль аллокаций на корректных строках"
      match: "TestAddAllocatesNothing"
      hint: "Сообщение называет число аллокаций на четыре строки. Ищите их в -m: срез от Split, указатель на Entry, Sprintf и упаковка аргументов в any."
    - id: "count-zero-allocs"
      title: "Count: ноль аллокаций"
      match: "TestCountAllocatesNothing"
      hint: "Count не должен форматировать ключ строкой; используйте структурный ключ, как и в Add."
    - id: "counts"
      title: "Add: счётчики и классы статусов (скрытый)"
      match: "TestAddCounts"
      hidden: true
      hint: "Total, Bytes, Max, Class[2] и Count(метод, статус) должны совпадать с ожидаемыми после рефакторинга."
    - id: "bad-lines"
      title: "Add: некорректные строки отклоняются (скрытый)"
      match: "TestAddRejectsBadLines"
      hidden: true
      hint: "Пустая строка, 3 или 5 полей, двойной пробел, статус вне 100..599, отрицательный или нечисловой размер, пробел в конце: все дают ErrBadLine и только увеличивают Rejected."
    - id: "reference"
      title: "Поведение совпадает с эталонной моделью (скрытый)"
      match: "TestAddMatchesReference"
      hidden: true
      hint: "Эталон прогоняет 2000 случайных строк, часть из них некорректна. Ошибки разбора через Cut проявляются на лишних полях и пробелах."
