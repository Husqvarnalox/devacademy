id: "java.programmers.syntax-types-and-control-flow"
title: "Типы, числа и управление потоком: ловушки Java"
goal: "Писать числовые вычисления, преобразования символов, ввод и switch так, чтобы переполнение int, целочисленное деление и вывод зависящих от локали дробных чисел не искажали результат."
difficulty: "medium"
estimatedMinutes: 45
prerequisites: []
next:
  - "java.programmers.methods-collections-and-strings"
objectives:
  - "Предсказывать результат арифметики с int и long: переполнение, целочисленное деление, знак остатка."
  - "Различать расширяющее и сужающее преобразования, понимать неявное приведение в составном присваивании и арифметику с char."
  - "Читать ввод через Scanner без ловушки nextLine после nextInt и печатать дроби независимо от локали."
  - "Выбирать между стрелочной и классической формой switch и объяснять проваливание."
masteryCriteria:
  - "totalCents, percent, caesar и dayType дают верные результаты на больших суммах, отрицательном сдвиге и неизвестных значениях."
  - "Квиз пройден с результатом не ниже 70%."
tags:
