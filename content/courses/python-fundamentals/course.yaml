id: python-fundamentals
version: 2.0.0
title: Основы Python
description: >-
  Первый курс по Python для тех, кто никогда не программировал. Пятнадцать уроков: первая программа, переменные и ввод,
  числа и строки, чтение сообщений об ошибках, условия, циклы, функции, списки, словари, файлы и модули.
  Завершает курс мини-проект. В каждом уроке есть запускаемые примеры, тест и упражнение с автоматической проверкой.
