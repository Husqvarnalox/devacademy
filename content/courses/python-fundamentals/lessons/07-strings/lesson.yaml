id: python.fundamentals.strings
title: Строки - текст как неизменяемая последовательность
goal: Работать со строками как с неизменяемыми последовательностями символов Unicode - индексировать, делать срезы, форматировать и эффективно собирать текст.
difficulty: medium
estimatedMinutes: 45
prerequisites: [python.fundamentals.loops, python.fundamentals.functions]
objectives:
  - Объяснить, что str неизменяема и почему методы возвращают новые строки.
  - Использовать индексы, отрицательные индексы и срезы со start, stop и step.
  - Применять основные методы строк - split, join, strip, replace, find, upper, lower, startswith.
  - Форматировать значения через f-строки со спецификаторами ширины, выравнивания и точности.
  - Различать символы Unicode (code points) и байты в кодировке UTF-8 и знать, почему len не всегда равен числу видимых «букв».
  - Выбирать join вместо многократной конкатенации в цикле и объяснять разницу в стоимости.
masteryCriteria:
  - Вы предсказываете результат среза с отрицательными индексами и шагом.
  - Вы знаете, что s.upper() не меняет s, и пишете s = s.upper() там, где нужно.
  - Вы объясняете, почему len("привет") равно 6, а длина UTF-8 байтов равна 12.
  - Вы пишете функции для обработки текста, проходящие автоматические тесты на граничных случаях (пустая строка, лишние пробелы).
related: [python.fundamentals.loops, python.fundamentals.variables-and-input]
next: [python.fundamentals.lists]
tags: [python, str, slicing, f-string, unicode, utf-8, join]
facts:
  - kind: internals
    text: >-
      Начиная с Python 3.3 строка хранит последовательность кодовых точек Unicode, а внутренне выбирает компактное представление (1, 2 или 4 байта на символ) в зависимости от самого «широкого»
      символа строки (PEP 393). Поэтому индексирование строки по кодовым точкам выполняется за O(1).
    sources:
      - https://peps.python.org/pep-0393/
  - kind: performance
    text: >-
      Конкатенация неизменяемых последовательностей всегда создаёт новый объект, поэтому построение длинной строки повторным сложением в цикле в общем случае приводит к квадратичной стоимости.
      Документация рекомендует собирать части в список и использовать str.join().
    sources:
      - https://docs.python.org/3/library/stdtypes.html#common-sequence-operations
  - kind: misconception
    text: >-
      «len(s) - это число символов, которые видит человек». len считает кодовые точки Unicode. Буква «é» может быть записана как одна кодовая точка или как «e» с отдельным комбинирующим знаком ударения
      (две точки), и len для этих двух записей даёт 1 и 2, хотя на экране они выглядят одинаково.
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: |
        Что выведет код?
        s = "hello"
        print(s[1:3] + s[-1])
      options:
        - "elo"
        - "ello"
        - "hel"
        - "ell"
      answer: 0
      explanation: Срез s[1:3] берёт индексы 1 и 2 (правая граница не включается) - это "el"; s[-1] - последний символ "o".
    - id: q2
      type: single
      prompt: |
        Что выведет код?
        s = "abc"
        s.upper()
        print(s)
      options:
        - "ABC"
        - "abc"
        - "None"
        - "Ошибка выполнения"
      answer: 1
      explanation: Строки неизменяемы. upper() возвращает новую строку, а результат здесь выброшен, поэтому s не изменилась. Нужно s = s.upper().
    - id: q3
      type: numeric
      prompt: Сколько байтов занимает строка "привет" в кодировке UTF-8 (len("привет".encode("utf-8")))?
      answer: 12
      tolerance: 0
      explanation: Каждая кириллическая буква кодируется в UTF-8 двумя байтами, букв шесть - итого 12. При этом len("привет") равно 6 кодовым точкам.
    - id: q4
      type: single
      prompt: Почему для сборки длинной строки из тысяч частей рекомендуют "".join(parts), а не s += part в цикле?
      options:
        - "join короче записывается, на скорость это не влияет."
        - "Каждое += создаёт новую строку и копирует накопленный текст, поэтому суммарная работа растёт квадратично; join копирует каждую часть один раз."
        - "Оператор += для строк запрещён."
        - "join сортирует части, поэтому результат получается быстрее."
      answer: 1
      explanation: Строка неизменяема, поэтому каждое сложение создаёт новый объект с копированием уже накопленного. join заранее вычисляет итоговую длину и копирует каждый фрагмент один раз.
    - id: q5
      type: short
      prompt: Какой метод превращает строку "a b  c" в список ['a', 'b', 'c'], когда разделитель - любые подряд идущие пробелы? Напишите имя метода.
      answer: [split, split(), str.split]
      explanation: split() без аргументов разделяет по любым последовательностям пробельных символов и не создаёт пустых элементов, в отличие от split(" ").
exercise:
  id: python.fundamentals.strings.exercise
  title: Инструменты для текста
  prompt: |
    В файле `text_tools.py` реализуйте четыре функции. Тесты импортируют модуль и вызывают их напрямую; ввод и вывод не нужны.

    1. `is_palindrome(text)` - вернуть `True`, если текст читается одинаково в обе стороны **без учёта регистра и всех символов, кроме букв и цифр** (пробелы, знаки препинания игнорируются). Пустая строка - палиндром.
    2. `initials(full_name)` - инициалы: первые буквы каждого слова в верхнем регистре, после каждой буквы точка. `"Иван Петрович Сидоров"` -> `"И.П.С."`. Лишние пробелы игнорируются, для пустой строки результат пустая строка.
    3. `format_row(name, qty, price)` - строка таблицы фиксированной ширины: имя по левому краю в поле 10, затем `|`, количество по правому краю в поле 4, затем `|`, цена по правому краю в поле 8 с двумя знаками после запятой.
       `format_row("Хлеб", 2, 45.5)` -> `"Хлеб      |   2|   45.50"`. Если имя длиннее 10 символов, оно не обрезается.
    4. `reverse_words(text)` - вернуть слова в обратном порядке, разделённые одним пробелом. Лишние пробелы и переносы строк между словами игнорируются: `"  a   b  "` -> `"b a"`.

    **Ограничения.** Используйте методы строк и f-строки; цикл со склейкой `+=` для `initials` не требуется.
  entryFile: text_tools.py
  evaluation: harness
  harness: exercise/harness
  harnessEntry: check.py
  hints:
    - Для всех четырёх функций хорошо подходят split() и join(). Проверьте, что делает split() без аргументов с лишними пробелами.
    - "Для is_palindrome сначала постройте очищенный вариант текста - символ ch можно проверить методом ch.isalnum() - и сравните его с собственной обратной копией (срез с шагом -1)."
    - "Для format_row спецификатор формата f-строки: {name:<10} - выравнивание влево в ширине 10, {qty:>4} - вправо, {price:>8.2f} - вправо, ширина 8, два знака после запятой."
    - "Скелет initials: return \"\".join(word[0].upper() + \".\" for word in full_name.split()). Скелет reverse_words: return \" \".join(reversed(text.split()))."
  tests:
    - id: palindrome-basic
      title: is_palindrome - простые слова
      hint: Регистр не должен влиять на результат - приведите текст к нижнему регистру.
    - id: initials-basic
      title: initials - обычные имена
      hint: Каждое слово даёт ровно одну заглавную букву и точку.
    - id: format-row-basic
      title: format_row - обычная строка
      hint: Проверьте выравнивание и ширину полей; цена всегда с двумя знаками после запятой.
    - id: reverse-words-basic
      title: reverse_words - обычные фразы
      hint: Слова должны идти в обратном порядке и разделяться одним пробелом.
    - id: palindrome-punctuation
      title: is_palindrome - пробелы, знаки и цифры (скрытый)
      hidden: true
      hint: Пробелы и знаки препинания нужно удалить до сравнения (isalnum), цифры остаются; пустая строка - палиндром.
    - id: initials-edge
      title: initials - лишние пробелы и пустой ввод (скрытый)
      hidden: true
      hint: split() без аргументов игнорирует лишние пробелы; для пустой строки нет слов, значит результат пустая строка. Буква должна быть заглавной.
    - id: format-row-edge
      title: format_row - длинное имя и большие числа (скрытый)
      hidden: true
      hint: Спецификатор ширины задаёт минимум (длинное имя не обрезается). Цена округляется до двух знаков.
    - id: reverse-words-spaces
      title: reverse_words - разные пробельные символы (скрытый)
      hidden: true
      hint: split(" ") оставляет пустые элементы между подряд идущими пробелами; split() без аргументов их убирает и учитывает табуляции и переносы строк.
