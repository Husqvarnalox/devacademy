id: python.fundamentals.conditions
title: 'Условия: if, elif, else'
goal: Писать программы, которые выбирают действие по результату сравнения, и объединять условия через and, or, not.
difficulty: easy
estimatedMinutes: 40
prerequisites: [python.fundamentals.reading-errors]
objectives:
  - Получать значения True и False сравнением и понимать, что такое bool.
  - Использовать операторы сравнения ==, !=, <, <=, >, >=.
  - Записывать ветвление через if, elif и else с правильными отступами.
  - Объединять условия с помощью and, or и not.
masteryCriteria:
  - Вы предсказываете, какая ветка выполнится при заданных значениях.
  - Вы отличаете = от == и находите эту ошибку по сообщению SyntaxError.
  - Вы пишете программу с несколькими ветками и проверкой граничных значений.
concepts:
  introduces: [python.bool, python.comparison, python.if, python.logical-operators]
  uses: [python.print, python.variable, python.input, python.int, python.type-conversion, python.f-string, python.traceback]
related: []
next: [python.fundamentals.while-loops]
tags: [python, if, elif, else, bool, comparison]
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: |
        Что выведет программа?
        x = 7
        if x > 10:
            print("A")
        elif x > 5:
            print("B")
        else:
            print("C")
      options:
        - "A"
        - "B"
        - "C"
        - "B и C"
      answer: 1
      explanation: >-
        Условия проверяются сверху вниз до первого верного. x > 10 неверно, x > 5 верно - выполняется только эта ветка, остальные пропускаются.
    - id: q2
      type: single
      prompt: |
        Что выведет программа?
        print(5 == 5.0, "a" == "A")
      options:
        - "True True"
        - "True False"
        - "False False"
        - "False True"
      answer: 1
      explanation: >-
        Целое 5 и дробное 5.0 по значению равны. Строки сравниваются по символам, а большая "A" и маленькая "a" - разные символы.
    - id: q3
      type: single
      prompt: |
        Что выведет программа?
        x = 10
        if x > 5:
            print("A")
        if x > 8:
            print("B")
      options:
        - "A"
        - "B"
        - "A и B (в двух строках)"
        - "Ничего"
      answer: 2
      explanation: >-
        Это два отдельных if, и каждый проверяется независимо. Если бы второй был elif, он выполнился бы только при неверном первом.
    - id: q4
      type: single
      prompt: |
        Чему равно выражение при age = 20?
        age >= 18 and age < 65
      options:
        - "True"
        - "False"
        - "20"
        - "Ошибка"
      answer: 0
      explanation: >-
        and даёт True, только если верны обе части: 20 >= 18 верно и 20 < 65 верно.
    - id: q5
      type: single
      prompt: |
        Что произойдёт при запуске?
        n = 5
        if n = 5:
            print("пять")
      options:
        - "Выведется пять"
        - "Ничего не выведется"
        - "SyntaxError: в условии нужно == для сравнения"
        - "NameError"
      answer: 2
      explanation: >-
        Один знак = означает присваивание, а не сравнение. В условии нужно писать ==. Python замечает это до запуска и сообщает SyntaxError.
exercise:
  id: python.fundamentals.conditions.exercise-v2
  title: Билет в кино
  prompt: |
    Программа читает две строки ввода:

    1. возраст зрителя - целое число;
    2. день недели - слово в нижнем регистре, например `пятница` или `суббота`.

    Определите, что вывести:

    * возраст меньше 0 или больше 120 - `Некорректный возраст`;
    * возраст до 5 лет включительно - `Бесплатно`;
    * от 6 до 17 лет - базовая цена 200 руб.;
    * от 18 до 64 лет - базовая цена 350 руб.;
    * от 65 лет - базовая цена 150 руб.

    По субботам и воскресеньям (`суббота`, `воскресенье`) к базовой цене добавляется 50 руб. Если билет платный, выведите `Цена: <число> руб.`.

    **Примеры.**

    | Ввод | Вывод |
    |---|---|
    | `30`, `вторник` | `Цена: 350 руб.` |
    | `10`, `суббота` | `Цена: 250 руб.` |
    | `4`, `воскресенье` | `Бесплатно` |
    | `-3`, `среда` | `Некорректный возраст` |

    **Требования.** Бесплатный билет остаётся бесплатным и в выходные.
  entryFile: main.py
  evaluation: io
  hints:
    - Сначала проверьте некорректный возраст, затем бесплатный, затем остальные возрастные группы. Порядок проверок важен.
    - Для возрастных групп удобна цепочка if / elif / else. Выходная надбавка зависит от дня, поэтому прибавьте её отдельным условием после выбора цены.
    - 'День недели сравнивайте со словами через ==: day == "суббота". Для двух дней используйте or.'
    - 'Скелет: if age < 0 or age > 120: ...; elif age <= 5: ...; else: price = 200/350/150 по группам, затем if day == "суббота" or day == "воскресенье": price = price + 50; print(f"Цена: {price} руб.").'
  tests:
    - id: adult-weekday
      title: Взрослый в будний день
      stdin: "30\nвторник\n"
      expected: "Цена: 350 руб.\n"
      compare: exact
      hint: Для возраста от 18 до 64 базовая цена 350, надбавки в будний день нет.
    - id: child-weekend
      title: Школьник в выходной
      stdin: "10\nсуббота\n"
      expected: "Цена: 250 руб.\n"
      compare: exact
      hint: К базовой цене 200 прибавляется 50 за выходной.
    - id: free
      title: Бесплатный билет в выходной (скрытый)
      stdin: "4\nвоскресенье\n"
      expected: "Бесплатно\n"
      compare: exact
      hidden: true
      hint: Бесплатный билет не получает надбавку за выходной.
    - id: invalid
      title: Некорректный возраст (скрытый)
      stdin: "-3\nсреда\n"
      expected: "Некорректный возраст\n"
      compare: exact
      hidden: true
      hint: Отрицательный возраст и возраст больше 120 проверяются раньше остальных веток.
    - id: borders
      title: Границы групп (скрытый)
      stdin: "5\nпонедельник\n"
      expected: "Бесплатно\n"
      compare: exact
      hidden: true
      hint: Возраст 5 входит в бесплатную группу, 6 - уже платная; проверьте знаки <= и <.
    - id: senior-border
      title: Пенсионер на границе (скрытый)
      stdin: "65\nвоскресенье\n"
      expected: "Цена: 200 руб.\n"
      compare: exact
      hidden: true
      hint: С 65 лет базовая цена 150, плюс 50 в выходной. Возраст 64 ещё относится к взрослым.
    - id: age-120
      title: Предельный возраст (скрытый)
      stdin: "120\nчетверг\n"
      expected: "Цена: 150 руб.\n"
      compare: exact
      hidden: true
      hint: Возраст 120 допустим, а 121 уже некорректен.
