id: python.fundamentals.while-loops
title: Цикл while
goal: Повторять действия, пока условие верно, использовать счётчик и накопитель, прерывать цикл через break и пропускать шаг через continue.
difficulty: easy
estimatedMinutes: 40
prerequisites: [python.fundamentals.conditions]
objectives:
  - Записывать цикл while и объяснять, когда он завершится.
  - Использовать счётчик и накопитель суммы.
  - Читать ввод до стоп-слова с помощью while True и break.
  - Пропускать шаг цикла через continue.
  - Находить причину бесконечного цикла.
masteryCriteria:
  - Вы вручную выписываете значения переменных на каждом шаге короткого цикла.
  - Вы пишете цикл, который читает данные до стоп-слова и считает сумму.
  - Вы исправляете бесконечный цикл, добавляя изменение переменной условия.
concepts:
  introduces: [python.while, python.break-continue]
  uses: [python.print, python.variable, python.assignment, python.input, python.int, python.type-conversion, python.f-string, python.bool, python.comparison, python.if, python.logical-operators]
related: []
next: [python.fundamentals.loops]
tags: [python, while, loop, break, continue]
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: |
        Что выведет программа?
        n = 1
        while n < 4:
            print(n)
            n = n + 1
      options:
        - "1 2 3 (каждое в своей строке)"
        - "1 2 3 4"
        - "2 3 4"
        - "Бесконечно 1"
      answer: 0
      explanation: >-
        Пока n < 4, печатается n и увеличивается. Когда n становится 4, условие ложно и цикл завершается, не печатая 4.
    - id: q2
      type: single
      prompt: |
        Что произойдёт?
        n = 1
        while n < 4:
            print(n)
      options:
        - "Выведется 1, 2, 3"
        - "Программа будет бесконечно печатать 1"
        - "Ошибка"
        - "Ничего не выведется"
      answer: 1
      explanation: >-
        Внутри цикла n не меняется, условие n < 4 всегда истинно, и цикл не заканчивается. Нужна строка n = n + 1.
    - id: q3
      type: single
      prompt: |
        Что выведет программа?
        n = 0
        while n < 5:
            n = n + 1
            if n == 2:
                continue
            if n == 4:
                break
            print(n)
      options:
        - "1 3"
        - "1 2 3"
        - "1 3 4"
        - "1 2 3 4 5"
      answer: 0
      explanation: >-
        При n = 1 печатается 1. При n = 2 continue пропускает print. При n = 3 печатается 3. При n = 4 break завершает цикл.
    - id: q4
      type: single
      prompt: |
        Сколько раз выполнится тело цикла?
        n = 10
        while n < 5:
            print(n)
            n = n + 1
      options:
        - "0 раз"
        - "1 раз"
        - "5 раз"
        - "Бесконечно"
      answer: 0
      explanation: >-
        Условие проверяется перед каждым шагом, включая первый. 10 < 5 ложно сразу, поэтому тело не выполнится ни разу.
exercise:
  id: python.fundamentals.while-loops.exercise
  title: Касса до слова «итог»
  prompt: |
    Кассир вводит цены товаров по одной в строке. Ввод заканчивается строкой `итог`. Программа считает покупки.

    * Строка с положительным целым числом - цена товара: она входит в сумму и в количество.
    * Строка с числом `0` или отрицательным - ошибка ввода: такую строку нужно пропустить.
    * Строка `итог` завершает чтение. После неё ввода нет.

    Выведите две строки:

    ```
    Позиций: <количество>
    Сумма: <сумма>
    ```

    **Пример.** Ввод:

    ```
    120
    -5
    80
    итог
    ```

    Вывод:

    ```
    Позиций: 2
    Сумма: 200
    ```

    **Требования.** Строка `итог` всегда есть во вводе. Других нечисловых строк нет.
  entryFile: main.py
  evaluation: io
  hints:
    - Количество строк заранее неизвестно, поэтому нужен цикл, который работает, пока не встретится слово «итог».
    - 'Скелет цикла: while True: line = input(); if line == "итог": break. До цикла заведите две переменные: счётчик и сумму.'
    - 'Число из строки получают int(line). Для пропуска неподходящих значений используйте continue после проверки price <= 0.'
    - 'Внутри цикла после проверок: count = count + 1; total = total + price. После цикла выведите обе строки.'
  tests:
    - id: basic
      title: Пример из условия
      stdin: "120\n-5\n80\nитог\n"
      expected: "Позиций: 2\nСумма: 200\n"
      compare: exact
      hint: Отрицательное значение не входит ни в сумму, ни в количество.
    - id: immediate-stop
      title: Сразу слово итог (скрытый)
      stdin: "итог\n"
      expected: "Позиций: 0\nСумма: 0\n"
      compare: exact
      hidden: true
      hint: Если покупок нет, оба значения равны нулю; цикл должен завершиться на первой же строке.
    - id: zero-skipped
      title: Ноль пропускается (скрытый)
      stdin: "0\n50\n0\n25\nитог\n"
      expected: "Позиций: 2\nСумма: 75\n"
      compare: exact
      hidden: true
      hint: Цена ноль считается ошибкой ввода так же, как отрицательная.
    - id: many
      title: Много товаров (скрытый)
      stdin: "10\n20\n30\n40\n50\n60\nитог\n"
      expected: "Позиций: 6\nСумма: 210\n"
      compare: exact
      hidden: true
      hint: Накапливайте сумму на каждом шаге, а не заменяйте её.
