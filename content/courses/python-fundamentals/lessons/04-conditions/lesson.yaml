id: python.fundamentals.conditions
title: Условия и булева логика
goal: Управлять ходом программы с помощью if/elif/else, понимая истинность значений и поведение and и or.
difficulty: easy
estimatedMinutes: 35
prerequisites: [python.fundamentals.numbers-and-operators]
objectives:
  - Строить условия из сравнений, в том числе цепочки вида a < b < c.
  - Назвать значения, которые считаются ложными (truthiness), и использовать это осознанно.
  - Объяснить, что and и or возвращают один из операндов, а не обязательно True или False, и когда они «закорачивают» вычисление.
  - Писать ветвления if/elif/else и упорядочивать условия от частных к общим.
  - Прочитать простой оператор match и понимать, чем он отличается от цепочки if.
masteryCriteria:
  - Вы предсказываете значение выражений вроде "" or "x", 0 and 1, 1 < x < 10.
  - Вы пишете ветвление без лишних проверок и без пропущенных граничных случаев.
  - Вы решаете задачу с несколькими классами исходных данных, включая некорректные.
related: [python.fundamentals.numbers-and-operators]
next: [python.fundamentals.loops]
tags: [python, bool, if, elif, truthiness, match]
facts:
  - kind: historical
    text: >-
      Оператор match со структурным сопоставлением с образцом появился в Python 3.10 (PEP 634; мотивация изложена в PEP 635, учебник - в PEP 636).
      В более старых версиях его нет, и цепочка if/elif остаётся единственным вариантом.
    sources:
      - https://peps.python.org/pep-0634/
  - kind: internals
    text: >-
      Операторы and и or вычисляются «лениво»: правый операнд не вычисляется, если результат уже определён левым. Возвращается тот операнд, на котором вычисление остановилось.
    sources:
      - https://docs.python.org/3/reference/expressions.html#boolean-operations
  - kind: misconception
    text: >-
      «x == True и просто x - одно и то же». Условие if items: проверяет непустоту, а items == True для непустого списка ложно, потому что список не равен True.
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: Чему равно выражение "" or "по умолчанию"?
      options:
        - "True"
        - "\"\""
        - "\"по умолчанию\""
        - "False"
      answer: 2
      explanation: >-
        or возвращает первый истинный операнд или последний, если истинных нет. Пустая строка ложна, поэтому результатом становится вторая строка.
    - id: q2
      type: multiple
      prompt: Какие из значений в условии if value дают ложь?
      options:
        - "0"
        - "\"0\""
        - "[]"
        - "None"
      answer: [0, 2, 3]
      explanation: >-
        Ложны ноль, пустые коллекции и строки, None. Строка "0" непустая, поэтому она истинна, хотя и выглядит как ноль.
    - id: q3
      type: single
      prompt: x = 5. Что вычисляет выражение 1 < x < 10?
      options:
        - "Сначала (1 < x), затем результат True сравнивается с 10"
        - "Одновременно 1 < x и x < 10"
        - "Ошибка синтаксиса"
        - "Всегда False"
      answer: 1
      explanation: >-
        Цепочка сравнений равносильна (1 < x) and (x < 10), причём x вычисляется один раз. Это не сравнение результата True с числом 10.
    - id: q4
      type: single
      prompt: |
        Почему в такой проверке есть ошибка?
        if age >= 18: print("взрослый")
        elif age >= 65: print("пенсионер")
      options:
        - "elif не может следовать за if."
        - "Условие age >= 65 недостижимо: при age >= 65 уже сработала первая ветка."
        - "Нужно использовать else вместо elif."
        - "Ошибки нет, обе ветки сработают."
      answer: 1
      explanation: >-
        Ветки проверяются сверху вниз, выполняется только первая подошедшая. Частное условие (age >= 65) нужно поставить раньше общего (age >= 18).
exercise:
  id: python.fundamentals.conditions.exercise
  title: Классификация треугольника
  prompt: |
    В единственной строке входа через пробел записаны три целых числа - длины сторон `a b c`.

    Выведите одно слово:

    * `invalid` - треугольника с такими сторонами не существует;
    * `equilateral` - равносторонний;
    * `isosceles` - равнобедренный (ровно две равные стороны);
    * `scalene` - разносторонний.

    **Когда треугольник не существует.** Если хотя бы одна сторона не положительна, либо сумма двух сторон **не больше** третьей
    (вырожденный треугольник, например `1 2 3`, тоже считается некорректным).

    **Примеры.**

    | Ввод | Вывод |
    |---|---|
    | `3 3 3` | `equilateral` |
    | `3 4 5` | `scalene` |
    | `1 2 3` | `invalid` |

    **Ограничения.** Числа целые, по модулю не больше 10^9. Сначала проверяйте существование, потом тип.
  entryFile: main.py
  evaluation: io
  hints:
    - Сначала решите, существует ли треугольник. Только для существующих имеет смысл определять тип.
    - Условие существования - три неравенства вида a + b > c, плюс положительность каждой стороны. Типичная ошибка - проверить только одно из них.
    - Для типа сравнивайте стороны попарно. Равносторонний - частный случай равнобедренного, поэтому проверяйте его раньше.
    - "Скелет: if нет_треугольника: invalid; elif a == b == c: equilateral; elif a == b or b == c or a == c: isosceles; else: scalene."
  tests:
    - id: equilateral
      title: Равносторонний
      stdin: "3 3 3\n"
      expected: "equilateral\n"
      hint: Все три стороны равны.
    - id: isosceles
      title: Равнобедренный
      stdin: "3 3 5\n"
      expected: "isosceles\n"
      hint: Равнобедренный - две равные стороны. Проверьте, что вы сравниваете все пары, а не только a и b.
    - id: scalene
      title: Разносторонний
      stdin: "3 4 5\n"
      expected: "scalene\n"
      hint: Если ни одна пара сторон не равна, остаётся scalene.
    - id: hidden-degenerate
      title: Вырожденный треугольник (скрытый)
      stdin: "1 2 3\n"
      expected: "invalid\n"
      hidden: true
      hint: Сумма двух сторон должна быть строго больше третьей. При равенстве фигура вырождается в отрезок.
    - id: hidden-zero
      title: Нулевая сторона (скрытый)
      stdin: "0 4 4\n"
      expected: "invalid\n"
      hidden: true
      hint: Сторона нулевой длины невозможна. Проверьте положительность каждой стороны явно, не полагаясь только на неравенства.
    - id: hidden-too-long
      title: Одна сторона слишком длинная (скрытый)
      stdin: "10 1 1\n"
      expected: "invalid\n"
      hidden: true
      hint: Нужно проверять неравенство для каждой стороны, а не только для c. Здесь нарушено a < b + c.
    - id: hidden-isosceles-last
      title: Равны вторая и третья стороны (скрытый)
      stdin: "1 7 7\n"
      expected: "isosceles\n"
      hidden: true
      hint: Равными могут оказаться любые две стороны, не только первые две.
    - id: hidden-negative
      title: Отрицательная сторона (скрытый)
      stdin: "-1 2 2\n"
      expected: "invalid\n"
      hidden: true
      hint: Отрицательная длина невозможна.
