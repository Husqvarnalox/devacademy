id: python.fundamentals.dicts-and-sets
title: Словари и множества - хеш-таблицы
goal: Понимать, как устроены dict и set, почему ключи должны быть хешируемыми, и использовать их для быстрого поиска, подсчёта и устранения повторов.
difficulty: medium
estimatedMinutes: 50
prerequisites: [python.fundamentals.lists]
objectives:
  - Объяснить принцип хеш-таблицы и почему поиск по ключу в среднем O(1).
  - Назвать требования к ключам словаря и элементам множества (хешируемость) и привести примеры нехешируемых типов.
  - Использовать основные операции dict - get, setdefault, in, items, удаление - и знать про сохранение порядка вставки.
  - Применять операции множеств - объединение, пересечение, разность, симметрическая разность.
  - Решать задачи подсчёта частот и получать детерминированный вывод через явную сортировку.
masteryCriteria:
  - Вы выбираете dict или set вместо list там, где нужны быстрые проверки вхождения или поиск по ключу.
  - Вы предсказываете, какие значения можно использовать как ключи, и объясняете причину ошибки TypeError - unhashable.
  - Вы пишете программу подсчёта частот, чей вывод не зависит от внутреннего порядка множеств.
related: [python.fundamentals.lists]
next: [python.fundamentals.errors-and-files]
tags: [python, dict, set, hash, hashable, frequency]
facts:
  - kind: historical
    text: >-
      Сохранение порядка вставки в dict стало гарантией языка в Python 3.7. В CPython 3.6 так уже работала реализация, но только как деталь реализации, а в 3.7 порядок объявили официальной частью спецификации.
    sources:
      - https://docs.python.org/3/whatsnew/3.7.html
  - kind: internals
    text: >-
      Значения хеша строк и bytes по умолчанию «солятся» случайным значением при запуске интерпретатора. Поэтому порядок перебора множества строк может отличаться между запусками программы,
      и на него нельзя полагаться (в отличие от порядка вставки в dict).
    sources:
      - https://docs.python.org/3/reference/datamodel.html#object.__hash__
  - kind: misconception
    text: >-
      «Множество хранит элементы в отсортированном или добавленном порядке». Порядок перебора set не определён; если нужен стабильный вывод, результат сортируют явно: sorted(s).
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: multiple
      prompt: Какие из этих значений можно использовать как ключ словаря?
      options:
        - "(1, 2)"
        - "[1, 2]"
        - "\"abc\""
        - "{1, 2}"
      answer: [0, 2]
      explanation: >-
        Ключ должен быть хешируемым: его хеш не меняется за время жизни, а равные объекты имеют равные хеши. Кортеж из хешируемых элементов и строка подходят; список и множество изменяемы и не хешируются.
    - id: q2
      type: single
      prompt: |
        Что выведет код?
        d = {}
        d[1] = "a"
        d[1.0] = "b"
        d[True] = "c"
        print(len(d), d[1])
      options:
        - "3 a"
        - "1 c"
        - "3 c"
        - "1 a"
      answer: 1
      explanation: >-
        Числа 1, 1.0 и True равны между собой и имеют одинаковый хеш, поэтому это один ключ. Он сохраняется в первом виде (1), а значение перезаписывается последним присваиванием - "c".
    - id: q3
      type: single
      prompt: Почему проверка x in some_set для больших коллекций обычно быстрее, чем x in some_list?
      options:
        - "Множество хранит элементы отсортированными и использует бинарный поиск."
        - "Хеш элемента сразу указывает, в какой ячейке таблицы он может находиться, поэтому не нужно просматривать все элементы."
        - "Список в Python всегда медленный."
        - "Множество хранит только числа."
      answer: 1
      explanation: >-
        В хеш-таблице позиция определяется хешем ключа, поэтому поиск в среднем делает константное число шагов. В списке приходится сравнивать элементы подряд.
    - id: q4
      type: numeric
      prompt: "Сколько элементов в результате ({1, 2, 3, 4} & {3, 4, 5}) | {9}?"
      answer: 3
      tolerance: 0
      explanation: Пересечение даёт {3, 4}, объединение с {9} - {3, 4, 9}, то есть три элемента.
    - id: q5
      type: single
      prompt: Что нужно сделать, чтобы вывести слова из множества в одном и том же порядке при каждом запуске программы?
      options:
        - "Ничего: множество всегда печатается одинаково."
        - "Отсортировать явно, например for w in sorted(words)."
        - "Преобразовать множество в строку."
        - "Использовать set.sort()."
      answer: 1
      explanation: Порядок перебора множества не определён, а у set нет метода sort. Явная сортировка гарантирует повторяемый результат.
exercise:
  id: python.fundamentals.dicts-and-sets.exercise
  title: Частотный словарь слов
  prompt: |
    Программа читает весь текст из стандартного ввода (он может состоять из нескольких строк и быть пустым) и выводит частоты слов.

    **Что считать словом.**

    1. Текст делится на токены по любым пробельным символам.
    2. Каждый токен приводится к нижнему регистру.
    3. С обоих концов токена удаляются знаки `. , ! ? ; : " ' ( )`. Символы внутри токена (дефис, апостроф) остаются: `don't` и `don't-stop` - разные слова.
    4. Если после удаления токен оказался пустым, он пропускается.

    **Вывод.** Для каждого различного слова - строка `слово количество`. Строки упорядочены по убыванию количества, а при равном количестве - по алфавиту (по возрастанию слова). Для пустого результата не выводите ничего.

    **Пример.** Ввод:

    ```
    The cat and the hat
    ```

    Вывод:

    ```
    the 2
    and 1
    cat 1
    hat 1
    ```

    **Подсказка по чтению.** Весь ввод читается так: `import sys` и `sys.stdin.read()`. Объём текста - до 10^5 слов.
  entryFile: main.py
  evaluation: io
  hints:
    - Для подсчёта нужен словарь «слово -> количество». Для каждого слова вызовите counts.get(word, 0) и прибавьте единицу.
    - Нормализуйте слово до подсчёта - иначе The и the окажутся разными ключами. Метод strip принимает строку символов, которые нужно убрать по краям.
    - Порядок вывода задайте явно. sorted(counts.items(), key=...) принимает функцию, возвращающую кортеж; чтобы упорядочить числа по убыванию, поставьте перед ними минус.
    - "Скелет: word = raw.lower().strip(знаки); if word: counts[word] = counts.get(word, 0) + 1; затем for word, n in sorted(counts.items(), key=lambda pair: (-pair[1], pair[0])): print(word, n)."
  tests:
    - id: basic
      title: Простое предложение
      stdin: "the cat and the hat\n"
      expected: "the 2\nand 1\ncat 1\nhat 1\n"
      hint: При равной частоте слова упорядочиваются по алфавиту, а не по порядку появления.
    - id: punctuation-case
      title: Регистр и знаки препинания
      stdin: "Hello, hello! World.\n"
      expected: "hello 2\nworld 1\n"
      hint: Слова Hello, и hello! должны попасть в один ключ - приведите регистр и уберите знаки по краям.
    - id: multiline
      title: Несколько строк
      stdin: "a b\nb a\nc\n"
      expected: "a 2\nb 2\nc 1\n"
      hint: Читайте весь ввод целиком (sys.stdin.read()), а не одну строку input().
    - id: hidden-empty
      title: Пустой ввод (скрытый)
      stdin: ""
      expected: ""
      hidden: true
      hint: Для пустого ввода слов нет, и программа ничего не печатает (не печатайте пустую строку или 0).
    - id: hidden-only-punctuation
      title: Только знаки препинания (скрытый)
      stdin: "... !!! ? \"()\"\n"
      expected: ""
      hidden: true
      hint: После удаления знаков токен становится пустым - такие токены нужно пропустить, а не считать за слово.
    - id: hidden-cyrillic-ties
      title: Кириллица и равные частоты (скрытый)
      stdin: "Мама мыла раму. Мама!\n"
      expected: "мама 2\nмыла 1\nраму 1\n"
      hidden: true
      hint: Сортировка по алфавиту работает и для кириллицы; ключ - пара (минус частота, слово).
    - id: hidden-inner-symbols
      title: Апостроф и дефис внутри слова (скрытый)
      stdin: "Don't stop, don't-stop 'quoted'\n"
      expected: "don't 1\ndon't-stop 1\nquoted 1\nstop 1\n"
      hidden: true
      hint: strip убирает символы только с краёв слова, внутренние апострофы и дефисы остаются; не используйте replace.
    - id: hidden-whitespace
      title: Лишние пробелы и пустые строки (скрытый)
      stdin: "x y z x y x\n\n  y\n"
      expected: "x 3\ny 3\nz 1\n"
      hidden: true
      hint: split() без аргументов игнорирует любые подряд идущие пробельные символы и пустые строки.
