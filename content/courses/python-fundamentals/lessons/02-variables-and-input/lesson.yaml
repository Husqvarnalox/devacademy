id: python.fundamentals.variables-and-input
title: Имена, объекты и ввод данных
goal: Понять, что переменная в Python - это имя, привязанное к объекту, и читать данные пользователя через input.
difficulty: intro
estimatedMinutes: 30
prerequisites: [python.fundamentals.how-python-runs]
objectives:
  - Описать присваивание как привязку имени к объекту, а не копирование значения в «коробку».
  - Объяснить, почему две переменные могут указывать на один и тот же изменяемый объект.
  - Отличать сравнение значений (==) от сравнения идентичности (is).
  - Прочитать строку через input() и преобразовать её в число.
  - Назвать выбранные имена переменных так, чтобы они соответствовали правилам и соглашениям Python.
masteryCriteria:
  - Вы предсказываете результат кода, где два имени ссылаются на один список, и объясняете причину.
  - Вы знаете, что input() всегда возвращает str, и преобразуете её явно.
  - Вы пишете программу, которая читает несколько строк ввода и выводит результат по заданному формату.
related: [python.fundamentals.how-python-runs]
next: [python.fundamentals.numbers-and-operators]
tags: [python, variables, names, objects, input, identity]
facts:
  - kind: internals
    text: >-
      Функция id() возвращает целое число, уникальное для объекта на протяжении его жизни. В CPython это адрес объекта в памяти,
      но в языке такая гарантия не зафиксирована: полагаться на конкретное значение id нельзя.
    sources:
      - https://docs.python.org/3/library/functions.html#id
  - kind: misconception
    text: >-
      «Переменная - это коробка, в которую кладут значение». В Python значения живут в объектах, а имя лишь ссылается на объект.
      Присваивание b = a не копирует объект, а привязывает ещё одно имя к тому же объекту.
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: |
        Что выведет код?
        a = [1, 2]
        b = a
        b.append(3)
        print(a)
      options:
        - "[1, 2]"
        - "[1, 2, 3]"
        - "[3]"
        - "Ошибка выполнения"
      answer: 1
      explanation: >-
        b = a не копирует список, а привязывает имя b к тому же объекту. append меняет сам объект, поэтому изменение видно и через a.
    - id: q2
      type: single
      prompt: |
        Что выведет код?
        x = 10
        y = x
        y = y + 1
        print(x, y)
      options:
        - "11 11"
        - "10 11"
        - "10 10"
        - "11 10"
      answer: 1
      explanation: >-
        Целые числа неизменяемы. y + 1 создаёт новый объект 11, и имя y перепривязывается к нему; имя x по-прежнему указывает на 10.
    - id: q3
      type: single
      prompt: "Пользователь ввёл 5 на запрос n = input(). Чему равно n + n?"
      options:
        - "10"
        - "55"
        - "Ошибка TypeError"
        - "5 + 5"
      answer: 1
      explanation: >-
        input() возвращает строку "5", а для строк оператор + означает склеивание. Чтобы получить число 10, нужно int(n) + int(n).
    - id: q4
      type: multiple
      prompt: Для каких пар a и b выражение a == b истинно, а a is b - нет (при условии, что создано два разных объекта)?
      options:
        - "a = [1, 2]; b = [1, 2]"
        - "a = [1, 2]; b = a"
        - "a = {'k': 1}; b = {'k': 1}"
        - "a = None; b = None"
      answer: [0, 2]
      explanation: >-
        Два отдельно созданных списка (или словаря) равны по содержимому, но это разные объекты. В паре b = a оба имени ссылаются на один объект,
        поэтому is тоже истинно. None существует в единственном экземпляре.
exercise:
  id: python.fundamentals.variables-and-input.exercise
  title: Приветствие и возраст
  prompt: |
    Программа читает две строки ввода:

    1. имя (может состоять из нескольких слов);
    2. год рождения - целое число.

    Выведите две строки:

    ```
    Привет, <имя>!
    Возраст на конец 2026 года: <число>
    ```

    Возраст на конец 2026 года - это `2026 - год рождения`.

    **Пример.** Ввод:

    ```
    Анна
    1990
    ```

    Вывод:

    ```
    Привет, Анна!
    Возраст на конец 2026 года: 36
    ```

    **Ограничения.** Год рождения - целое число от 1900 до 2026. Имя выводится ровно так, как введено.
  entryFile: main.py
  evaluation: io
  hints:
    - Сначала прочитайте две строки двумя вызовами input(), каждый раз сохраняя результат в переменную.
    - input() возвращает строку. Вычитать из числа строку нельзя - вам понадобится преобразование типа для года.
    - Для вывода можно использовать print с несколькими аргументами или f-строку. Проверьте, что перед числом ровно один пробел.
    - "Скелет: name = input(); year = int(input()); затем print(\"Привет, \" + name + \"!\") и вывод строки с 2026 - year."
  tests:
    - id: basic
      title: Простой случай
      stdin: "Анна\n1990\n"
      expected: "Привет, Анна!\nВозраст на конец 2026 года: 36\n"
      hint: Проверьте текст приветствия и вычитание 2026 - год.
    - id: two-words
      title: Имя из двух слов
      stdin: "Мария Ивановна\n2000\n"
      expected: "Привет, Мария Ивановна!\nВозраст на конец 2026 года: 26\n"
      hint: input() читает всю строку целиком; не используйте split() для имени.
    - id: latin
      title: Латиница
      stdin: "Alan\n1912\n"
      expected: "Привет, Alan!\nВозраст на конец 2026 года: 114\n"
      hint: Возраст может быть трёхзначным - преобразуйте строку в int, а не берите символы по индексу.
    - id: hidden-zero
      title: Родились в 2026 (скрытый)
      stdin: "Лев\n2026\n"
      expected: "Привет, Лев!\nВозраст на конец 2026 года: 0\n"
      hidden: true
      hint: Результат 0 нужно напечатать как 0, а не пропустить из-за проверки «если ноль».
    - id: hidden-year-spaces
      title: Пробелы вокруг года (скрытый)
      stdin: "Ян\n 1999 \n"
      expected: "Привет, Ян!\nВозраст на конец 2026 года: 27\n"
      hidden: true
      hint: int() допускает пробелы вокруг числа, а вот имя нужно оставить ровно как введено.
