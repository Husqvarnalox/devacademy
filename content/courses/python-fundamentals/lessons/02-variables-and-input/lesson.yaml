id: python.fundamentals.variables-and-input
title: Переменные и ввод данных
goal: Написать программу, которая читает две строки с клавиатуры, сохраняет их в переменных и выводит.
difficulty: intro
estimatedMinutes: 30
prerequisites: [python.fundamentals.how-python-runs]
objectives:
  - Создавать переменную присваиванием и использовать её значение в print.
  - Менять значение переменной и предсказывать, что в ней хранится после каждой строки.
  - Читать строку, введённую человеком, функцией input.
  - Выбирать понятные имена переменных и соблюдать правила записи имён.
masteryCriteria:
  - Вы предсказываете вывод короткой программы из нескольких присваиваний и print.
  - Вы пишете программу, которая читает несколько строк через input и выводит их в заданном формате.
  - Вы отличаете переменную от текста в кавычках и находите опечатку в имени по NameError.
concepts:
  introduces: [python.variable, python.assignment, python.input]
  uses: [python.print, python.string-literal]
related: []
next: [python.fundamentals.numbers-and-operators]
tags: [python, variables, assignment, input]
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: |
        Что выведет программа?
        city = "Казань"
        print(city)
        print("city")
      options:
        - "Казань и Казань"
        - "city и city"
        - "Казань и city"
        - "city и Казань"
      answer: 2
      explanation: >-
        Без кавычек city - имя переменной, и print выводит её значение. В кавычках city - просто текст из четырёх букв.
    - id: q2
      type: single
      prompt: |
        Что выведет программа?
        a = "кот"
        b = a
        a = "пёс"
        print(a, b)
      options:
        - "пёс пёс"
        - "кот кот"
        - "пёс кот"
        - "кот пёс"
      answer: 2
      explanation: >-
        Строка b = a копирует значение "кот" в момент выполнения. Последующее a = "пёс" меняет только a, поэтому b осталась "кот".
    - id: q3
      type: single
      prompt: |
        Человек ввёл Анна. Что выведет программа?
        name = input()
        print(name, name)
      options:
        - "name name"
        - "Анна"
        - "Анна Анна"
        - "Ошибка: input нельзя использовать дважды"
      answer: 2
      explanation: >-
        input один раз прочитал строку и положил её в name. Дальше name можно использовать сколько угодно раз - в print оно выведено дважды.
    - id: q4
      type: single
      prompt: |
        В программе есть строки name = "Анна" и print(nme). Что произойдёт?
      options:
        - "Выведется nme"
        - "Выведется Анна"
        - "NameError: имя nme не определено"
        - "SyntaxError"
      answer: 2
      explanation: >-
        Имени nme в программе нет, потому что переменная называется name. Python различает имена буква в букву и сообщает NameError.
exercise:
  id: python.fundamentals.variables-and-input.exercise-v2
  title: Анкета
  prompt: |
    Программа читает две строки ввода: имя и город. Выведите три строки:

    ```
    Анкета
    Имя: <имя>
    Город: <город>
    ```

    **Пример.** Ввод:

    ```
    Анна
    Казань
    ```

    Вывод:

    ```
    Анкета
    Имя: Анна
    Город: Казань
    ```

    **Требования.** Читайте данные через `input()` без текста внутри скобок: проверка сравнивает весь вывод, и текст-приглашение
    попал бы в него. Каждое значение сначала сохраните в переменную. Имя и город могут состоять из нескольких слов.
  entryFile: main.py
  evaluation: io
  hints:
    - input() читает одну строку и возвращает её. Результат нужно сохранить в переменную, иначе он потеряется.
    - Две переменные - два вызова input() подряд, в том порядке, в каком данные приходят во вводе.
    - 'print("Имя:", name) выведет слово «Имя:», пробел и значение переменной. Кавычки у name не нужны.'
    - 'Скелет: print("Анкета"); name = input(); city = input(); print("Имя:", name); print("Город:", city).'
  tests:
    - id: basic
      title: Имя и город
      stdin: "Анна\nКазань\n"
      expected: "Анкета\nИмя: Анна\nГород: Казань\n"
      compare: exact
      hint: Проверяется формат трёх строк. После двоеточия должен стоять ровно один пробел, а значения подставляются из ввода.
    - id: several-words
      title: Значения из нескольких слов (скрытый)
      stdin: "Анна Мария\nНижний Новгород\n"
      expected: "Анкета\nИмя: Анна Мария\nГород: Нижний Новгород\n"
      compare: exact
      hidden: true
      hint: input() читает строку целиком, вместе с пробелами. Не делите её на слова.
    - id: other-data
      title: Другие данные (скрытый)
      stdin: "Ян\nOslo\n"
      expected: "Анкета\nИмя: Ян\nГород: Oslo\n"
      compare: exact
      hidden: true
      hint: Значения должны браться из ввода, а не быть записаны в программе заранее.
