id: python.fundamentals.text-and-f-strings
title: Текст, f-строки и длина строки
goal: Собирать из слов и чисел строки вывода с помощью f-строк, форматировать дробные числа с двумя знаками и узнавать длину текста.
difficulty: intro
estimatedMinutes: 30
prerequisites: [python.fundamentals.numbers-and-operators]
objectives:
  - Склеивать строки оператором + и понимать, почему строку нельзя сложить с числом.
  - Подставлять значения в текст с помощью f-строк.
  - Выводить дробные числа с заданным числом знаков (:.2f).
  - Узнавать длину строки функцией len.
masteryCriteria:
  - Вы предсказываете результат f-строк с переменными и выражениями в фигурных скобках.
  - Вы выводите цену в формате с двумя знаками после запятой.
  - Вы исправляете TypeError при склейке текста и числа двумя способами.
concepts:
  introduces: [python.f-string, python.len]
  uses: [python.print, python.variable, python.input, python.int, python.float, python.arithmetic, python.type-conversion, python.string-literal]
related: []
next: [python.fundamentals.reading-errors]
tags: [python, strings, f-string, len, formatting]
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: |
        Что выведет программа?
        a = 2
        b = 3
        print(f"{a} + {b} = {a + b}")
      options:
        - "5"
        - "2 + 3 = 5"
        - "a + b = a + b"
        - "2 + 3 = a + b"
      answer: 1
      explanation: >-
        Всё внутри фигурных скобок вычисляется и подставляется в текст: сначала a, потом b, потом выражение a + b. Текст вне скобок остаётся как есть.
    - id: q2
      type: single
      prompt: |
        Что выведет программа?
        price = 5
        print(f"{price:.2f}")
      options:
        - "5"
        - "5.0"
        - "5.00"
        - "5.2"
      answer: 2
      explanation: >-
        Запись :.2f означает «дробное число с двумя знаками после точки». Целое число 5 тоже допустимо и будет напечатано как 5.00.
    - id: q3
      type: single
      prompt: |
        Что выведет программа?
        print(len("кот и пёс"))
      options:
        - "3"
        - "7"
        - "9"
        - "6"
      answer: 2
      explanation: >-
        len считает все символы, включая пробелы: к, о, т, пробел, и, пробел, п, ё, с - всего девять.
    - id: q4
      type: single
      prompt: |
        Что произойдёт при запуске?
        count = 3
        print("Товаров: " + count)
      options:
        - "Выведется Товаров: 3"
        - "Выведется Товаров: count"
        - "TypeError: строку нельзя сложить с числом"
        - "Выведется Товаров:3"
      answer: 2
      explanation: >-
        Оператор + умеет склеивать строки или складывать числа, но не смешивать. Исправления: f"Товаров: {count}" или "Товаров: " + str(count).
exercise:
  id: python.fundamentals.text-and-f-strings.exercise
  title: Строка чека
  prompt: |
    Программа читает три строки ввода:

    1. название товара (текст);
    2. цену одной штуки - дробное число;
    3. количество штук - целое число.

    Выведите три строки:

    ```
    Товар: <название>
    Сумма: <цена * количество> руб.
    Длина названия: <число символов в названии>
    ```

    Сумму выводите с двумя знаками после запятой.

    **Пример.** Ввод:

    ```
    Хлеб
    45.5
    3
    ```

    Вывод:

    ```
    Товар: Хлеб
    Сумма: 136.50 руб.
    Длина названия: 4
    ```

    **Требования.** Используйте f-строки. Цена не отрицательна, количество не меньше нуля.
  entryFile: main.py
  evaluation: io
  hints:
    - Цена читается через float(input()), количество через int(input()). Название остаётся текстом.
    - В f-строке выражение пишут в фигурных скобках, например {price * count}.
    - 'Формат двух знаков добавляется после двоеточия внутри скобок: {total:.2f}. Длину текста даёт len(name).'
    - 'Скелет: total = price * count; print(f"Сумма: {total:.2f} руб."); print(f"Длина названия: {len(name)}").'
  tests:
    - id: basic
      title: Пример из условия
      stdin: "Хлеб\n45.5\n3\n"
      expected: "Товар: Хлеб\nСумма: 136.50 руб.\nДлина названия: 4\n"
      compare: exact
      hint: Проверьте подписи, пробелы и то, что сумма выводится ровно с двумя знаками после точки.
    - id: whole-price
      title: Целая цена (скрытый)
      stdin: "Молоко 3,2%\n80\n2\n"
      expected: "Товар: Молоко 3,2%\nСумма: 160.00 руб.\nДлина названия: 11\n"
      compare: exact
      hidden: true
      hint: Цена 80 читается как float и всё равно печатается как 160.00. Пробелы и знаки в названии тоже считаются символами.
    - id: rounding
      title: Округление до копеек (скрытый)
      stdin: "Яблоки\n33.333\n3\n"
      expected: "Товар: Яблоки\nСумма: 100.00 руб.\nДлина названия: 6\n"
      compare: exact
      hidden: true
      hint: Форматирование .2f округляет результат, поэтому 99.999 выводится как 100.00.
    - id: zero
      title: Количество ноль (скрытый)
      stdin: "Чай\n120.5\n0\n"
      expected: "Товар: Чай\nСумма: 0.00 руб.\nДлина названия: 3\n"
      compare: exact
      hidden: true
      hint: Ноль штук - допустимый ввод, сумма 0.00.
