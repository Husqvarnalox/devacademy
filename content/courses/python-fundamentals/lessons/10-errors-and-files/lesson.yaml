id: python.fundamentals.errors-and-files
title: Исключения и работа с файлами
goal: Читать трассировку ошибки, обрабатывать исключения через try/except/else/finally, создавать собственные исключения и безопасно читать и писать файлы.
difficulty: medium
estimatedMinutes: 55
prerequisites: [python.fundamentals.functions, python.fundamentals.strings]
objectives:
  - Прочитать traceback снизу вверх и найти место и причину ошибки.
  - Использовать try/except/else/finally и объяснить, когда выполняется каждая ветка.
  - Перехватывать конкретные исключения, а не все подряд, и вызывать исключения через raise.
  - Определить собственный класс исключения, унаследованный от подходящего встроенного.
  - Открывать файлы через with с явной кодировкой encoding="utf-8" и пользоваться pathlib.Path.
masteryCriteria:
  - Вы предсказываете порядок вывода программы с try/except/else/finally, в том числе при return внутри блоков.
  - Вы не используете «голый» except и объясняете, какую проблему он скрывает.
  - Вы читаете и записываете текстовый файл так, что он закрывается при любой ошибке, а кодировка указана явно.
  - Вы пишете функции, которые бросают собственное исключение с полезными атрибутами, а harness-тесты проходят.
related: [python.fundamentals.functions, python.fundamentals.strings]
next: []
tags: [python, exceptions, traceback, try, with, files, pathlib, utf-8]
facts:
  - kind: internals
    text: >-
      Блок finally выполняется всегда - и при нормальном завершении try, и при исключении, и даже если в try или except выполнен return, break или continue. Именно поэтому в finally размещают освобождение ресурсов.
    sources:
      - https://docs.python.org/3/tutorial/errors.html#defining-clean-up-actions
  - kind: internals
    text: >-
      Если при открытии текстового файла не указать encoding, используется кодировка, зависящая от платформы и настроек локали. Один и тот же файл тогда может читаться по-разному на разных компьютерах,
      поэтому для переносимости кодировку указывают явно: encoding="utf-8".
    sources:
      - https://docs.python.org/3/library/functions.html#open
  - kind: misconception
    text: >-
      «Лучше перехватить все исключения, чтобы программа не падала». Голый except и except Exception без обработки скрывают реальные ошибки, включая опечатки в имени переменной (NameError). Падение с понятной трассировкой полезнее молчаливой неверной работы.
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: |
        Что выведет код?
        def f():
            try:
                return "try"
            finally:
                print("finally")
        print(f())
      options:
        - "try, затем finally"
        - "finally, затем try"
        - "Только try"
        - "Только finally"
      answer: 1
      explanation: >-
        Перед тем как функция вернёт значение, выполняется блок finally и печатает "finally". После этого print(f()) выводит "try".
    - id: q2
      type: single
      prompt: В каком порядке читать traceback, чтобы быстрее найти причину ошибки?
      options:
        - "Сверху вниз: сначала самая первая строка."
        - "Начать с последней строки (тип и сообщение исключения), затем подняться к ближайшему фрейму из вашего кода."
        - "Читать только строку с номером 1."
        - "Traceback не нужно читать, достаточно перезапустить программу."
      answer: 1
      explanation: >-
        Последняя строка сообщает тип и причину исключения, а выше перечислены вызовы, которые к нему привели: самый нижний фрейм - место, где ошибка произошла.
    - id: q3
      type: multiple
      prompt: "Что плохого в конструкции try: ... except: pass?"
      options:
        - "Она скрывает любые ошибки, включая опечатки и ошибки программиста."
        - "Она перехватывает даже прерывание с клавиатуры (KeyboardInterrupt)."
        - "Она всегда замедляет программу в десять раз."
        - "Дальнейший код продолжает работать как будто ничего не случилось, и сбой проявится позже в другом месте."
      answer: [0, 1, 3]
      explanation: >-
        Голый except ловит всё, включая KeyboardInterrupt и ошибки в самом коде, и молча продолжает работу с неверным состоянием. Замедление здесь ни при чём.
    - id: q4
      type: single
      prompt: Зачем при чтении текстового файла указывать open(path, encoding="utf-8")?
      options:
        - "Без этого файл не откроется."
        - "Без указания кодировка берётся из настроек системы, и один и тот же файл может быть прочитан по-разному или вызвать ошибку декодирования."
        - "Чтобы файл читался быстрее."
        - "Чтобы файл закрылся автоматически."
      answer: 1
      explanation: >-
        По умолчанию кодировка зависит от платформы и локали. Явный utf-8 делает поведение одинаковым везде. Закрытие файла обеспечивает with, а не кодировка.
    - id: q5
      type: short
      prompt: Какое ключевое слово гарантирует закрытие файла даже при исключении внутри блока? Напишите его.
      answer: [with]
      explanation: Менеджер контекста with вызывает закрытие файла при выходе из блока в любом случае - и при нормальном завершении, и при исключении.
exercise:
  id: python.fundamentals.errors-and-files.exercise
  title: Безопасное чтение и запись
  prompt: |
    В файле `file_tools.py` определите исключение и три функции. Тесты создают временные файлы в рабочей папке программы и вызывают ваши функции напрямую.

    1. `class BadLineError(ValueError)` - исключение с атрибутами `line_number` (номер строки файла, нумерация с 1, **считая пустые строки**) и `text` (строка без пробелов по краям). Конструктор: `BadLineError(line_number, text)`.
    2. `parse_int(text, default=None)` - вернуть `int(text)`; если строку (или значение `None`) нельзя преобразовать, вернуть `default`. Перехватывайте только те исключения, которые `int()` бросает на плохих данных.
    3. `read_numbers(path)` - прочитать файл в кодировке UTF-8, где в каждой строке записано целое число, и вернуть список чисел. Пустые строки и строки из одних пробелов пропускаются. Если строка не число, бросить `BadLineError(номер_строки, текст)`.
       Если файла нет, исключение `FileNotFoundError` **не перехватывается** - оно должно дойти до вызывающего кода.
    4. `write_report(path, numbers)` - записать в файл (UTF-8, с перезаписью старого содержимого) две строки: `Всего: <количество>` и `Сумма: <сумма>`, каждая с переводом строки в конце.

    **Примеры.**

    ```python
    parse_int("42")          # 42
    parse_int("abc", 0)      # 0
    write_report("r.txt", [1, 2, 3])   # файл: "Всего: 3\nСумма: 6\n"
    ```

    **Ограничения.** Программа может писать файлы только в своей рабочей папке, пути в тестах относительные. Открывайте файлы через `with` и указывайте `encoding="utf-8"`.
  entryFile: file_tools.py
  evaluation: harness
  harness: exercise/harness
  harnessEntry: check.py
  hints:
    - Разберите функции по очереди. Для parse_int нужен try/except вокруг int(). Какие два исключения возможны, если на вход пришла строка "abc" или значение None?
    - "В read_numbers удобно использовать enumerate(file, start=1), чтобы получать номер физической строки вместе с её текстом. Исключение BadLineError бросается через raise внутри except ValueError."
    - "Не перехватывайте FileNotFoundError и не используйте голый except. Открывайте файлы через with open(path, encoding=\"utf-8\") - для записи добавьте режим \"w\"."
    - "Скелет read_numbers: numbers = []; with open(path, encoding=\"utf-8\") as source: for line_number, line in enumerate(source, start=1): text = line.strip(); если text пустой - continue; try: numbers.append(int(text)); except ValueError: raise BadLineError(line_number, text); в конце return numbers."
  tests:
    - id: parse-int-basic
      title: parse_int - обычные значения
      hint: Корректная строка превращается в число, некорректная даёт значение default (по умолчанию None).
    - id: read-numbers-basic
      title: read_numbers - обычный файл
      hint: Каждая строка файла - одно целое число; результат - список int.
    - id: read-numbers-bad-line
      title: read_numbers - нечисловая строка
      hint: Нужно бросить BadLineError с атрибутами line_number и text, унаследованный от ValueError.
    - id: write-report-basic
      title: write_report - содержимое файла
      hint: 'Две строки в точном формате "Всего: N" и "Сумма: S", каждая заканчивается переводом строки.'
    - id: parse-int-edge
      title: parse_int - пробелы, дроби, None (скрытый)
      hidden: true
      hint: int(None) бросает TypeError, а int("3.5") - ValueError; перехватите оба. Пробелы по краям int() допускает сам.
    - id: read-numbers-blank-and-signs
      title: read_numbers - пустые строки и знаки (скрытый)
      hidden: true
      hint: Пустые строки пропускаются, но в нумерации учитываются; int() понимает знаки + и -.
    - id: read-numbers-missing-file
      title: read_numbers - файла нет (скрытый)
      hidden: true
      hint: Не оборачивайте open в try/except - FileNotFoundError должен дойти до вызывающего кода.
    - id: write-report-overwrite
      title: write_report - перезапись и пустой список (скрытый)
      hidden: true
      hint: Режим "w" полностью заменяет старое содержимое; для пустого списка сумма равна 0 (sum([]) даёт 0).
