id: python.fundamentals.reading-errors
title: Как читать сообщения об ошибках
goal: По тексту сообщения Python определить тип ошибки, строку и причину, и исправить программу с несколькими ошибками.
difficulty: intro
estimatedMinutes: 30
prerequisites: [python.fundamentals.text-and-f-strings]
objectives:
  - Находить в сообщении об ошибке тип, описание и номер строки.
  - Отличать ошибку записи (SyntaxError, IndentationError) от ошибки времени выполнения (NameError, TypeError, ValueError).
  - Исправлять программу последовательно, по одной ошибке за раз.
  - Проверять догадку выводом промежуточных значений.
masteryCriteria:
  - Вы по сообщению называете строку и причину ошибки, не запуская программу повторно.
  - Вы исправляете программу, в которой несколько ошибок разных типов.
  - Вы объясняете, почему ошибка записи останавливает программу до первой строки.
concepts:
  introduces: [python.traceback]
  uses: [python.print, python.variable, python.input, python.int, python.type-conversion, python.f-string, python.len]
related: []
next: [python.fundamentals.conditions]
tags: [python, errors, traceback, debugging]
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: |
        Python показал сообщение:

        Traceback (most recent call last):
          File "main.py", line 6, in <module>
            print(totl)
                  ^^^^
        NameError: name 'totl' is not defined. Did you mean: 'total'?

        Что нужно сделать?
      options:
        - "Исправить имя totl на total в строке 6"
        - "Добавить в программу import"
        - "Заменить print на Print"
        - "Увеличить отступ в строке 6"
      answer: 0
      explanation: >-
        NameError означает, что такого имени нет. Подсказка Did you mean указывает на опечатку. Номер строки (6) и показанный код говорят, где искать.
    - id: q2
      type: single
      prompt: |
        С какого места сообщения об ошибке обычно удобнее начинать чтение?
      options:
        - "С самой первой строки, до конца, не пропуская слов"
        - "С последней строки: в ней тип ошибки и её описание, затем номер строки выше"
        - "С любого места, все строки равнозначны"
        - "С имени файла"
      answer: 1
      explanation: >-
        В последней строке сообщения написано главное: что случилось. Затем по номеру строки и показанному коду находят место.
    - id: q3
      type: single
      prompt: |
        В программе пять строк. Первые четыре - правильные print, а в пятой пропущена закрывающая скобка. Что увидит человек при запуске?
      options:
        - "Четыре напечатанные строки и затем сообщение об ошибке"
        - "Только сообщение SyntaxError: ни одна строка не выполнится"
        - "Пустой экран без сообщений"
        - "Python сам закроет скобку и выполнит всё"
      answer: 1
      explanation: >-
        Файл проверяется на правильность записи целиком до выполнения. Ошибка записи в любой строке останавливает программу ещё до первой.
    - id: q4
      type: single
      prompt: |
        Сообщение: ValueError: invalid literal for int() with base 10: '3.5'. Что оно значит?
      options:
        - "int получил строку '3.5', которая не является записью целого числа"
        - "int не умеет работать с числами вообще"
        - "В программе пропущена скобка"
        - "Нужно вызвать float вместо print"
      answer: 0
      explanation: >-
        ValueError - значение неподходящее. Строка '3.5' содержит точку, поэтому для int она недопустима. Можно сначала превратить её в float.
    - id: q5
      type: single
      prompt: |
        Что означает IndentationError: unexpected indent?
      options:
        - "У строки есть лишние пробелы в начале, которых там быть не должно"
        - "Строка слишком длинная"
        - "Программа использует несуществующую функцию"
        - "Не хватает кавычки"
      answer: 0
      explanation: >-
        Отступ - пробелы в начале строки - в Python часть записи. Пока в программе нет блоков, строки должны начинаться с первого символа.
exercise:
  id: python.fundamentals.reading-errors.exercise
  title: Исправьте заказ в кофейне
  prompt: |
    В заготовке программа заказа в кофейне. Она читает три строки: название напитка, число чашек и цену одной чашки (целые числа),
    и должна вывести три строки:

    ```
    Напиток: <название>
    Чашек: <число>
    Итого: <чашки * цена> руб.
    ```

    **Пример.** Ввод `Латте`, `2`, `350`. Вывод:

    ```
    Напиток: Латте
    Чашек: 2
    Итого: 700 руб.
    ```

    В заготовке несколько ошибок разных типов. Запускайте программу, читайте сообщение и исправляйте по одной ошибке за раз.
    Менять формат вывода и логику не нужно.
  entryFile: main.py
  evaluation: io
  hints:
    - Начните с первого сообщения. Какая это ошибка и в какой строке? Ошибки записи Python находит до выполнения, поэтому их исправляют первыми.
    - В заготовке есть лишний отступ, незакрытая скобка, опечатка в имени переменной и склейка текста с числом.
    - 'Для склейки текста с числом используйте f-строку: print(f"Чашек: {cups}").'
    - 'Лишние пробелы в начале строки удалите, добавьте закрывающую скобку, замените pirce на price.'
  tests:
    - id: basic
      title: Пример из условия
      stdin: "Латте\n2\n350\n"
      expected: "Напиток: Латте\nЧашек: 2\nИтого: 700 руб.\n"
      compare: exact
      hint: Проверяется формат трёх строк. Если программа падает с ошибкой, прочитайте последнюю строку сообщения.
    - id: one-cup
      title: Одна чашка (скрытый)
      stdin: "Эспрессо\n1\n150\n"
      expected: "Напиток: Эспрессо\nЧашек: 1\nИтого: 150 руб.\n"
      compare: exact
      hidden: true
      hint: Значения берутся из ввода; число чашек и цена - целые.
    - id: several-words
      title: Название из нескольких слов (скрытый)
      stdin: "Капучино с сиропом\n3\n280\n"
      expected: "Напиток: Капучино с сиропом\nЧашек: 3\nИтого: 840 руб.\n"
      compare: exact
      hidden: true
      hint: Название читается целой строкой и выводится без изменений.
