id: python.fundamentals.mini-project
title: Мини-проект - дневник тренировок
goal: Собрать из изученного законченную программу, которая читает записи, отбрасывает ошибочные и выводит итоги.
difficulty: easy
estimatedMinutes: 60
prerequisites: [python.fundamentals.modules]
objectives:
  - Разбить задачу на функцию разбора строки, накопление итогов и вывод.
  - Обработать неверные записи, не прекращая работу программы.
  - Накапливать данные в словаре и выводить их в предсказуемом порядке.
masteryCriteria:
  - Вы самостоятельно строите программу из нескольких частей по описанию формата.
  - 'Вы проверяете её на граничных входах: пустой ввод, только ошибочные строки.'
concepts:
  introduces: []
  uses: [python.print, python.input, python.variable, python.assignment, python.int, python.type-conversion, python.f-string, python.if, python.comparison, python.logical-operators, python.while, python.break-continue, python.for-range, python.def, python.parameter, python.return, python.string-methods, python.list, python.dict, python.try-except]
related: []
next: []
tags: [python, project, dict, input, try-except]
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: |
        Что вернёт "бег 30 мин".split() ?
      options:
        - '["бег", "30", "мин"]'
        - '["бег 30 мин"]'
        - '("бег", "30")'
        - "ошибку"
      answer: 0
      explanation: >-
        split без аргументов разделяет строку по пробелам и возвращает список слов. Три слова - три элемента, что важно при проверке формата строки.
    - id: q2
      type: single
      prompt: |
        totals = {}
        totals["бег"] = totals.get("бег", 0) + 30
        totals["бег"] = totals.get("бег", 0) + 15
        print(totals["бег"])
      options:
        - "45"
        - "15"
        - "30"
        - "KeyError"
      answer: 0
      explanation: >-
        get возвращает 0 для отсутствующего ключа, поэтому первое сложение даёт 30, а второе добавляет 15.
    - id: q3
      type: single
      prompt: |
        Зачем в программе разбора строки функция возвращает None для неверной строки, а не вызывает ошибку?
      options:
        - "Так вызывающий код может пропустить такую строку и продолжить работу"
        - "Потому что функции не могут вызывать ошибки"
        - "Чтобы строка исчезла из файла"
        - "Это обязательное правило Python"
      answer: 0
      explanation: >-
        Для ожидаемо неверных данных удобно вернуть особое значение и обработать его в вызывающем коде. Можно было бы и raise с try/except - оба подхода допустимы.
exercise:
  id: python.fundamentals.mini-project.exercise
  title: Дневник тренировок
  prompt: |
    Напишите в `main.py` программу, которая ведёт дневник тренировок.

    **Ввод.** Строки вида `название минуты`, например `бег 30`. Название - одно слово. Ввод заканчивается строкой `конец`.

    **Правильная запись** - ровно два слова, второе - целое число больше нуля. Всё остальное - ошибочная запись: такую строку нужно пропустить и вывести `Пропущена строка N: <текст строки>`, где N - номер строки ввода (с 1, считаются и ошибочные, строка `конец` не считается).

    **Вывод.**

    1. Ошибочные строки - сразу при чтении, в порядке появления.
    2. После `конец`: если правильных записей нет, выведите одну строку `Занятий нет`.
    3. Иначе:
       * `Занятий: <количество правильных записей>`
       * `Всего минут: <сумма>`
       * по строке `<название>: <минуты>` для каждого вида занятия, в алфавитном порядке названий;
       * `Больше всего времени: <название>` - вид с наибольшей суммой; при равенстве - первый по алфавиту.

    **Пример.**

    ```
    бег 30
    йога 45
    плавание много
    бег 15
    конец
    ```

    выводит

    ```
    Пропущена строка 3: плавание много
    Занятий: 3
    Всего минут: 90
    бег: 45
    йога: 45
    Больше всего времени: бег
    ```

    **Ограничения.** Лишние пробелы по краям строки игнорируются. Названия различаются с учётом регистра.
  entryFile: main.py
  evaluation: io
  hints:
    - Разделите программу на части - разбор одной строки (функция), цикл чтения до слова «конец», вывод итогов. Сначала добейтесь работы на примере без ошибочных строк.
    - 'Разбор: parts = line.split(); если len(parts) != 2 - строка ошибочная; int(parts[1]) оберните в try/except ValueError; проверьте, что число больше нуля.'
    - 'Накопление: totals[name] = totals.get(name, 0) + minutes. Номер строки считайте отдельным счётчиком, увеличивая его на каждой строке, кроме «конец».'
    - 'Вывод: for name in sorted(totals): ... Лучший вид ищите в том же цикле, обновляя его только при строго большей сумме - тогда при равенстве останется первый по алфавиту.'
  tests:
    - id: example
      title: Пример из условия
      stdin: "бег 30\nйога 45\nплавание много\nбег 15\nконец\n"
      expected: "Пропущена строка 3: плавание много\nЗанятий: 3\nВсего минут: 90\nбег: 45\nйога: 45\nБольше всего времени: бег\n"
      compare: trim
      hint: Ошибочная строка выводится сразу, итоги - после слова «конец», названия в алфавитном порядке.
    - id: empty
      title: Пустой дневник (скрытый)
      hidden: true
      stdin: "конец\n"
      expected: "Занятий нет\n"
      compare: trim
      hint: Если правильных записей нет, выводится только строка «Занятий нет».
    - id: only-bad
      title: Только ошибочные строки (скрытый)
      hidden: true
      stdin: "бег\nбег 0\nбег -5\nбег 3.5\nбег 10 20\n  \nконец\n"
      expected: "Пропущена строка 1: бег\nПропущена строка 2: бег 0\nПропущена строка 3: бег -5\nПропущена строка 4: бег 3.5\nПропущена строка 5: бег 10 20\nПропущена строка 6: \nЗанятий нет\n"
      compare: trim
      hint: Минуты должны быть целым числом больше нуля; пустая строка тоже ошибочная и считается в номерах.
    - id: tie-and-case
      title: Равенство и регистр (скрытый)
      hidden: true
      stdin: "Бег 20\nбег 20\nйога 20\nконец\n"
      expected: "Занятий: 3\nВсего минут: 60\nБег: 20\nбег: 20\nйога: 20\nБольше всего времени: Бег\n"
      compare: trim
      hint: Заглавные буквы в сортировке идут раньше строчных, поэтому «Бег» стоит первым и побеждает при равенстве.
    - id: spaces
      title: Лишние пробелы (скрытый)
      hidden: true
      stdin: "  бег   30  \nбег 5\n  йога 100\nконец\n"
      expected: "Занятий: 3\nВсего минут: 135\nбег: 35\nйога: 100\nБольше всего времени: йога\n"
      compare: trim
      hint: split без аргументов игнорирует лишние пробелы; strip() уберёт пробелы по краям строки.
