id: python.fundamentals.how-python-runs
title: Что такое программа и как Python её запускает
goal: Понять путь от текстового файла до результата на экране и написать первую программу с print.
difficulty: intro
estimatedMinutes: 25
prerequisites: []
objectives:
  - Объяснить, чем исходный текст отличается от исполняемого процесса.
  - Назвать этапы работы CPython - компиляция в байткод и выполнение виртуальной машиной.
  - Отличить стандартный вывод (stdout) от потока ошибок (stderr).
  - Управлять выводом print с помощью параметров sep и end.
  - Запустить файл с программой и прочитать сообщение об ошибке синтаксиса.
masteryCriteria:
  - Вы можете своими словами описать, что происходит между нажатием «Запустить» и появлением текста в консоли.
  - Вы предсказываете точный вывод вызова print с несколькими аргументами и параметрами sep и end.
  - Вы пишете программу из нескольких print, которая выводит заданный текст посимвольно точно.
related: []
next: [python.fundamentals.variables-and-input]
tags: [python, cpython, print, stdout]
facts:
  - kind: internals
    text: >-
      CPython не исполняет текст напрямую: сначала он компилирует исходный код в байткод, а затем виртуальная машина
      выполняет этот байткод. Для импортируемых модулей байткод кэшируется в каталоге __pycache__ в файлах .pyc,
      чтобы не компилировать модуль заново, пока исходник не изменился.
    sources:
      - https://docs.python.org/3/tutorial/modules.html#compiled-python-files
  - kind: historical
    text: >-
      CPython называется эталонной реализацией языка (reference implementation). Существуют и другие реализации
      (например, PyPy), которые могут исполнять программу иначе, но обязаны следовать описанию языка.
    sources:
      - https://docs.python.org/3/reference/introduction.html#alternate-implementations
  - kind: misconception
    text: >-
      «Python интерпретируемый, значит компиляции нет» - неверно. Компиляция в байткод происходит всегда; интерпретатором
      называют именно ту часть, которая затем исполняет байткод инструкция за инструкцией.
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: Что CPython делает с вашим файлом .py перед тем, как выполнить программу?
      options:
        - Сразу выполняет каждую строку текста, не преобразуя её.
        - Компилирует исходный код в байткод, который затем выполняет виртуальная машина.
        - Переводит код в машинные инструкции процессора и запускает их напрямую.
        - Отправляет код на сервер python.org для проверки.
      answer: 1
      explanation: >-
        Исходный текст сначала компилируется в байткод - набор простых инструкций для виртуальной машины CPython.
        Машинный код процессора CPython при обычном запуске не генерирует.
    - id: q2
      type: single
      prompt: Какой вывод даст print("a", "b", sep="-", end="!")?
      options:
        - "a b"
        - "a-b!"
        - "a-b!, а затем перевод строки"
        - "ab!"
      answer: 1
      explanation: >-
        sep вставляется между аргументами, а end дописывается в конце вместо обычного символа перевода строки.
        Поэтому получается a-b!, и перевода строки после него нет.
    - id: q3
      type: multiple
      prompt: Какие утверждения о print верны?
      options:
        - По умолчанию print пишет в стандартный вывод (stdout).
        - print добавляет в конце символ перевода строки, если не указан end.
        - print сам превращает аргументы в строки, поэтому print(42) работает.
        - print возвращает напечатанный текст как строку.
      answer: [0, 1, 2]
      explanation: >-
        print пишет в stdout, дописывает перевод строки и вызывает str() для аргументов. Возвращаемое значение print - None;
        текст уходит наружу, а не возвращается в программу.
    - id: q4
      type: short
      prompt: Как называется параметр print, задающий строку между аргументами?
      answer: [sep]
      explanation: sep (от separator) по умолчанию равен одному пробелу.
exercise:
  id: python.fundamentals.how-python-runs.exercise
  title: Три строки вывода
  prompt: |
    Напишите программу, которая выводит ровно три строки (без ввода данных):

    ```
    Hello, DevAcademy!
    Source -> bytecode -> VM
    6 * 7 = 42
    ```

    **Формат вывода.** Каждая строка заканчивается переводом строки. Лишних пробелов и пустых строк быть не должно.

    **Ограничение.** В третьей строке число `42` должно получаться из выражения `6 * 7` внутри программы
    (передайте его в `print` вторым аргументом), а не быть записано текстом.

    Программа не читает ввод и завершается сама.
  entryFile: main.py
  evaluation: io
  hints:
    - Один вызов print выводит одну строку. Вам нужно три вызова подряд.
    - Проверьте регистр, пробелы и знаки препинания - сравнение строгое. Стрелка состоит из двух символов - и >.
    - "Для третьей строки print умеет принимать несколько аргументов и сам ставит между ними пробел: print(\"6 * 7 =\", ...)."
    - "Скелет: print(\"Hello, DevAcademy!\"), затем print(\"Source -> bytecode -> VM\"), затем print(\"6 * 7 =\", <выражение>)."
  tests:
    - id: exact-output
      title: Точный вывод, включая переводы строк
      stdin: ""
      expected: "Hello, DevAcademy!\nSource -> bytecode -> VM\n6 * 7 = 42\n"
      compare: exact
      hint: Лишний пробел, пустая строка или отсутствие перевода строки в конце ломают точное сравнение.
    - id: tokens-only
      title: Слова и числа на месте
      stdin: ""
      expected: "Hello, DevAcademy!\nSource -> bytecode -> VM\n6 * 7 = 42\n"
      compare: tokens
      hint: Проверяются слова и числа независимо от пробелов. Если этот тест не проходит, в тексте опечатка или не хватает строки.
    - id: trim-lines
      title: Вывод построчно без хвостовых пробелов
      stdin: ""
      expected: "Hello, DevAcademy!\nSource -> bytecode -> VM\n6 * 7 = 42"
      compare: trim
      hint: Строки должны идти именно в таком порядке. Хвостовые пробелы и пустые строки в конце допустимы, а между строками - нет.
    - id: hidden-exact
      title: Строгая проверка (скрытый)
      stdin: "ignored input\n"
      expected: "Hello, DevAcademy!\nSource -> bytecode -> VM\n6 * 7 = 42\n"
      compare: exact
      hidden: true
      hint: Программа не должна зависеть от ввода - она выводит один и тот же текст.
    - id: hidden-trim
      title: Результат умножения (скрытый)
      stdin: ""
      expected: "Hello, DevAcademy!\nSource -> bytecode -> VM\n6 * 7 = 42\n"
      compare: trim
      hidden: true
      hint: Третья строка должна заканчиваться на «= 42» с ровно одним пробелом перед числом.
