id: python.fundamentals.how-python-runs
title: Первая программа и команда print
goal: Написать и запустить программу из нескольких вызовов print, которая выводит заданный текст символ в символ.
difficulty: intro
estimatedMinutes: 25
prerequisites: []
objectives:
  - Объяснить, что такое программа и что значит её запустить.
  - Выводить текст на экран командой print.
  - Записывать текст в кавычках (строковый литерал) и отличать его от имени.
  - Управлять разделителем и концом строки через sep и end.
  - Прочитать сообщение об ошибке в неверно записанной строке.
masteryCriteria:
  - Вы предсказываете точный вывод нескольких вызовов print, включая sep и end.
  - Вы пишете программу из нескольких print, вывод которой совпадает с образцом посимвольно.
  - Вы находите пропущенную кавычку или скобку по сообщению SyntaxError.
concepts:
  introduces: [python.program, python.print, python.string-literal]
related: []
next: [python.fundamentals.variables-and-input]
tags: [python, print, string, first-program]
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: |
        Что выведет программа?
        print("Хлеб", "молоко")
      options:
        - "Хлебмолоко"
        - "Хлеб молоко"
        - "\"Хлеб\" \"молоко\""
        - "Хлеб, молоко"
      answer: 1
      explanation: >-
        Если в print несколько значений, между ними по умолчанию ставится один пробел. Кавычки в вывод не попадают:
        они только показывают Python, где начинается и заканчивается текст.
    - id: q2
      type: single
      prompt: |
        Что выведет программа?
        print("Раз", end="!")
        print("Два")
      options:
        - "Раз!Два"
        - "Раз!\nДва"
        - "Раз Два!"
        - "Раз\nДва!"
      answer: 0
      explanation: >-
        Параметр end задаёт, чем заканчивается вывод. Вместо перевода строки первый print добавил "!", поэтому
        второй print продолжил ту же строку.
    - id: q3
      type: single
      prompt: |
        В программе три строки: print("a"), print("b"), print("c) - в третьей пропущена закрывающая кавычка. Что произойдёт при запуске?
      options:
        - "Выведутся a и b, затем сообщение об ошибке"
        - "Ничего не выведется, Python сразу сообщит о SyntaxError"
        - "Выведутся a, b и c"
        - "Python сам допишет кавычку"
      answer: 1
      explanation: >-
        Python сначала читает весь файл целиком. Если запись неверна, он останавливается до выполнения первой строки,
        поэтому ни a, ни b не появятся.
    - id: q4
      type: single
      prompt: |
        Чем отличаются print("Привет") и print(Привет)?
      options:
        - "Ничем, кавычки необязательны"
        - "Во втором случае Python ищет имя Привет и сообщает NameError"
        - "Во втором случае выведется Привет, но без кавычек"
        - "В первом случае выведутся кавычки"
      answer: 1
      explanation: >-
        Без кавычек слово воспринимается как имя чего-то, что уже должно существовать. Такого имени нет, поэтому NameError.
        Кавычки превращают слово в обычный текст.
exercise:
  id: python.fundamentals.how-python-runs.exercise
  title: Чек из магазина
  prompt: |
    Напишите программу, которая выводит ровно четыре строки (ввод не нужен):

    ```
    Магазин "Яблоко"
    Хлеб 45
    Молоко 80
    Спасибо за покупку!
    ```

    В заготовке уже есть программа, но она печатает чек другого магазина. Замените тексты так, чтобы вывод совпал с образцом.

    **Требования.** Каждая строка заканчивается переводом строки. Лишних пробелов и пустых строк быть не должно.
    Во второй и третьей строках название и цену выведите одним вызовом `print` с двумя значениями: `print("Хлеб", 45)`.
  entryFile: main.py
  evaluation: io
  hints:
    - Один вызов print выводит одну строку. Здесь нужно четыре вызова подряд.
    - 'Сравнение строгое: проверьте регистр, пробелы и кавычки. Кавычки в первой строке - часть вывода.'
    - 'Текст с кавычками внутри удобно заключить в апострофы: print(''Магазин "Яблоко"'').'
    - 'Скелет: print(''Магазин "Яблоко"''), print("Хлеб", 45), print("Молоко", 80), print("Спасибо за покупку!").'
  tests:
    - id: receipt
      title: Чек целиком
      stdin: ""
      expected: "Магазин \"Яблоко\"\nХлеб 45\nМолоко 80\nСпасибо за покупку!\n"
      compare: exact
      hint: Сравнивается каждый символ, включая перевод строки в конце. Проверьте кавычки в первой строке и по одному пробелу между названием и ценой.
    - id: ignores-input
      title: Ввод не используется (скрытый)
      stdin: "посторонний текст\n"
      expected: "Магазин \"Яблоко\"\nХлеб 45\nМолоко 80\nСпасибо за покупку!\n"
      compare: exact
      hidden: true
      hint: Программа выводит один и тот же текст независимо от ввода и не должна ждать его.
    - id: no-extra-lines
      title: Без лишних строк (скрытый)
      stdin: ""
      expected: "Магазин \"Яблоко\"\nХлеб 45\nМолоко 80\nСпасибо за покупку!"
      compare: trim
      hidden: true
      hint: Между строками не должно быть пустых строк, а регистр букв и знак «!» в последней строке должны совпадать.
