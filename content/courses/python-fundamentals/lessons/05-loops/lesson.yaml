id: python.fundamentals.loops
title: Циклы while и for
goal: Повторять действия с помощью while и for, понимать протокол итерации и безопасно останавливать циклы.
difficulty: easy
estimatedMinutes: 40
prerequisites: [python.fundamentals.conditions]
objectives:
  - Выбирать между while (повторять, пока условие истинно) и for (обойти элементы итерируемого объекта).
  - Описать, что делает range и почему он не хранит все числа в памяти.
  - Использовать break, continue и else у цикла и объяснять, когда выполняется else.
  - Находить причину бесконечного цикла и добавлять корректное условие завершения.
  - Накапливать результат в цикле (сумма, счётчик, максимум) и правильно инициализировать накопитель.
masteryCriteria:
  - Вы предсказываете вывод цикла с break/continue/else, не запуская его.
  - Вы записываете цикл так, чтобы он гарантированно завершался, и можете объяснить почему.
  - Вы решаете задачу на накопление значения с граничными входами (пустая строка, единица).
related: [python.fundamentals.conditions]
next: [python.fundamentals.functions]
tags: [python, while, for, range, break, continue, iteration]
facts:
  - kind: internals
    text: >-
      Объект range хранит только start, stop и step, поэтому занимает одинаково мало памяти независимо от длины диапазона, а len(range(10**12)) вычисляется мгновенно.
    sources:
      - https://docs.python.org/3/library/stdtypes.html#ranges
  - kind: internals
    text: >-
      Ветка else у циклов for и while выполняется, если цикл завершился естественно (итератор исчерпан или условие стало ложным), и пропускается, если цикл прерван оператором break.
    sources:
      - https://docs.python.org/3/tutorial/controlflow.html#break-and-continue-statements-and-else-clauses-on-loops
  - kind: real-world
    text: >-
      Гипотеза Коллатца (последовательность 3n + 1 всегда доходит до 1) проверена компьютерами для очень больших чисел, но не доказана. Поэтому цикл из упражнения опирается на гипотезу, а не на теорему,
      и «завершится ли он для любого n» - открытый вопрос математики.
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: Сколько раз выполнится тело цикла for i in range(2, 10, 3)?
      options:
        - "2 раза (i = 2, 5)"
        - "3 раза (i = 2, 5, 8)"
        - "4 раза (i = 2, 5, 8, 10)"
        - "8 раз"
      answer: 1
      explanation: range(start, stop, step) не включает stop. Значения 2, 5, 8; следующее, 11, уже не меньше 10.
    - id: q2
      type: single
      prompt: |
        Что выведет код?
        for n in [3, 5, 8]:
            if n % 2 == 0:
                print("чётное", n)
                break
        else:
            print("чётных нет")
      options:
        - "чётное 8"
        - "чётное 8, затем чётных нет"
        - "чётных нет"
        - "Ничего"
      answer: 0
      explanation: Цикл дошёл до 8 и вышел через break, поэтому ветка else не выполняется.
    - id: q3
      type: single
      prompt: |
        Почему этот цикл бесконечный?
        i = 0
        while i < 5:
            print(i)
      options:
        - "Условие i < 5 всегда ложно."
        - "Значение i нигде не меняется, поэтому условие остаётся истинным."
        - "Функция print не завершается."
        - "Цикл while не может содержать print."
      answer: 1
      explanation: Условие цикла зависит от i, но в теле i не меняется. Нужно, например, i += 1 - то есть шаг, приближающий условие к ложности.
    - id: q4
      type: numeric
      prompt: "Чему равно значение total после выполнения кода: total = 0; for i in range(1, 5): total += i?"
      answer: 10
      tolerance: 0
      explanation: Значения i равны 1, 2, 3, 4, сумма 10. Число 5 в range(1, 5) не входит.
exercise:
  id: python.fundamentals.loops.exercise
  title: Последовательность Коллатца
  prompt: |
    Возьмём натуральное число `n`. Пока `n` не равно 1, повторяем шаг:

    * если `n` чётное, заменяем его на `n // 2`;
    * если нечётное, заменяем на `3 * n + 1`.

    Прочитайте `n` и выведите через пробел два числа: количество выполненных шагов и наибольшее значение, которое принимало `n` за всё время (включая начальное).

    **Пример.** Для `n = 6` последовательность 6, 3, 10, 5, 16, 8, 4, 2, 1 - это 8 шагов, наибольшее значение 16. Вывод: `8 16`.

    **Формат.** Вход: одно целое `n` (1 <= n <= 10^6). Вывод: одна строка `шаги максимум`.

    **Ограничения.** Для `n = 1` шагов нет: вывод `0 1`. Последовательность для всех допустимых n завершается (проверено заранее).
  entryFile: main.py
  evaluation: io
  hints:
    - Число шагов заранее неизвестно, поэтому нужен цикл while, а не for с фиксированным числом повторов.
    - Условие цикла - n != 1. Внутри тела цикла нужно изменить n, увеличить счётчик шагов и обновить максимум после каждого изменения.
    - Не забудьте учесть начальное значение в максимуме и не считать лишний шаг, когда n уже стало 1.
    - "Скелет: steps = 0; highest = n; while n != 1: если n % 2 == 0, то n //= 2, иначе n = 3 * n + 1; steps += 1; highest = max(highest, n)."
  tests:
    - id: one
      title: Начальное значение уже 1
      stdin: "1\n"
      expected: "0 1\n"
      hint: Цикл не должен выполниться ни разу, максимум - само начальное значение.
    - id: six
      title: Пример из условия
      stdin: "6\n"
      expected: "8 16\n"
      hint: Проверьте правило для нечётных (3n + 1) и то, что максимум обновляется после каждого шага.
    - id: seven
      title: Рост выше начального значения
      stdin: "7\n"
      expected: "16 52\n"
      hint: Для n = 7 значения сначала растут до 52. Если вы вывели 7 в качестве максимума, вы забыли обновлять его внутри цикла.
    - id: hidden-27
      title: Длинная последовательность (скрытый)
      stdin: "27\n"
      expected: "111 9232\n"
      hidden: true
      hint: Последовательность длинная, проверьте, что счётчик увеличивается на каждом шаге, включая последний (переход к 1).
    - id: hidden-two
      title: Минимальный нетривиальный случай (скрытый)
      stdin: "2\n"
      expected: "1 2\n"
      hidden: true
      hint: Для 2 ровно один шаг, максимум равен начальному значению.
    - id: hidden-large
      title: Большое значение (скрытый)
      stdin: "837799\n"
      expected: "524 2974984576\n"
      hidden: true
      hint: Значения в процессе вычислений выходят за 32 бита - в Python это не проблема, но тип должен оставаться int (не используйте / вместо //).
challenge:
  id: python.fundamentals.loops.challenge
  title: Самая длинная серия
  prompt: |
    Дана строка (одна строка ввода, возможно пустая). **Серия** - это подряд идущие одинаковые символы.

    Выведите длину самой длинной серии. Для пустой строки выведите `0`.

    **Примеры.**

    | Ввод | Вывод |
    |---|---|
    | `aabbbcc` | `3` |
    | `abc` | `1` |
    | (пусто) | `0` |

    **Ограничения.** Строка до 10^5 символов, любые символы Unicode. Достаточно одного прохода по строке; вложенных циклов быть не должно.
  entryFile: main.py
  evaluation: io
  starter: challenge/starter
  solution: challenge/solution
  hints:
    - Идите по символам по одному и сравнивайте каждый с предыдущим.
    - Вам нужны две переменные - длина текущей серии и лучший результат. Когда серия прерывается, текущая длина снова становится 1.
    - Не забудьте сравнивать длину с лучшим результатом на каждом шаге, а не только при смене символа, иначе упустите серию в конце строки.
    - "Скелет: best = 0; current = 0; previous = None; for ch in text: если ch == previous, то current += 1, иначе current = 1; previous = ch; обновить best."
  tests:
    - id: basic
      title: Серии в середине
      stdin: "aabbbcc\n"
      expected: "3\n"
      hint: Максимум здесь в середине строки.
    - id: all-different
      title: Все символы различны
      stdin: "abc\n"
      expected: "1\n"
      hint: Минимальная серия - один символ.
    - id: whole
      title: Вся строка из одного символа
      stdin: "zzzzzz\n"
      expected: "6\n"
      hint: Не забудьте обновить лучший результат после последнего символа.
    - id: hidden-empty
      title: Пустая строка (скрытый)
      stdin: "\n"
      expected: "0\n"
      hidden: true
      hint: Для пустой строки цикл не выполняется, ответ 0 - не 1.
    - id: hidden-last
      title: Лучшая серия в конце (скрытый)
      stdin: "aaabaaaa\n"
      expected: "4\n"
      hidden: true
      hint: Лучшая серия заканчивается вместе со строкой - результат надо обновлять и внутри цикла.
    - id: hidden-unicode
      title: Не только латиница (скрытый)
      stdin: "ааббб--\n"
      expected: "3\n"
      hidden: true
      hint: Символы сравниваются как есть; кириллица, дефисы и пробелы ничем не особенные.
