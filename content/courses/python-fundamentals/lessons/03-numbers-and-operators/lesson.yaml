id: python.fundamentals.numbers-and-operators
title: Числа и арифметика
goal: Читать числа из ввода, считать с ними и выводить результат; различать целые и дробные числа и деление / и //.
difficulty: intro
estimatedMinutes: 35
prerequisites: [python.fundamentals.variables-and-input]
objectives:
  - Различать целые (int) и дробные (float) числа.
  - Применять операторы +, -, *, /, //, % и ** и учитывать порядок действий.
  - Объяснить разницу между / и // и использовать % для остатка.
  - Превращать введённый текст в число функциями int и float.
masteryCriteria:
  - Вы предсказываете результат выражений с /, //, % и скобками.
  - Вы пишете программу, которая читает целые числа через int(input()) и выводит результат вычислений.
  - Вы объясняете, почему "2" + "3" не равно 5, и исправляете такую ошибку.
concepts:
  introduces: [python.int, python.float, python.arithmetic, python.type-conversion]
  uses: [python.print, python.variable, python.assignment, python.input]
related: []
next: [python.fundamentals.text-and-f-strings]
tags: [python, int, float, arithmetic, conversion]
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: single
      prompt: |
        Что выведет программа?
        print(17 // 5, 17 % 5)
      options:
        - "3.4 2"
        - "3 2"
        - "2 3"
        - "3 3"
      answer: 1
      explanation: >-
        17 // 5 - целая часть частного: 3. 17 % 5 - остаток: 17 - 3 * 5 = 2. Проверка: 3 * 5 + 2 равно 17.
    - id: q2
      type: single
      prompt: |
        Что выведет программа?
        print(8 / 2)
      options:
        - "4"
        - "4.0"
        - "4,0"
        - "Ошибка"
      answer: 1
      explanation: >-
        Оператор / всегда даёт дробное число (float), даже если деление выполнилось без остатка. Если нужно целое, используйте //.
    - id: q3
      type: single
      prompt: |
        Человек вводит 5. Что выведет программа?
        n = input()
        print(n + n)
      options:
        - "10"
        - "55"
        - "Ошибка: нельзя сложить два значения"
        - "5 5"
      answer: 1
      explanation: >-
        input возвращает строку. Для строк + означает «приписать одну к другой», поэтому "5" + "5" даёт "55". Чтобы сложить числа, нужно int(n) + int(n).
    - id: q4
      type: single
      prompt: |
        Что произойдёт при запуске?
        x = int("4.5")
      options:
        - "x станет 4"
        - "x станет 5"
        - "ValueError: строку 4.5 нельзя преобразовать в целое"
        - "x станет 4.5"
      answer: 2
      explanation: >-
        int принимает строку только с целым числом. Для "4.5" нужно сначала float("4.5") и затем, если нужно, int(...) от результата.
    - id: q5
      type: single
      prompt: |
        Чему равно 2 + 3 * 4?
      options:
        - "20"
        - "14"
        - "24"
        - "11"
      answer: 1
      explanation: >-
        Умножение выполняется раньше сложения, как в математике: 3 * 4 = 12, затем 2 + 12 = 14. Чтобы изменить порядок, используйте скобки: (2 + 3) * 4 даёт 20.
exercise:
  id: python.fundamentals.numbers-and-operators.exercise-v2
  title: Яйца по коробкам
  prompt: |
    На складе яйца раскладывают по коробкам. Программа читает три целых числа, каждое в отдельной строке:

    1. `eggs` - сколько яиц всего;
    2. `size` - сколько яиц помещается в коробку;
    3. `price` - цена одной коробки в рублях.

    Выведите четыре строки:

    ```
    Полных коробок: <eggs // size>
    Осталось яиц: <eggs % size>
    Стоимость: <полные коробки * price>
    Коробок (дробно): <eggs / size>
    ```

    **Пример.** Ввод `23`, `10`, `120`. Вывод:

    ```
    Полных коробок: 2
    Осталось яиц: 3
    Стоимость: 240
    Коробок (дробно): 2.3
    ```

    **Требования.** `size` не равно нулю. Число в последней строке выводите как есть, без округления.
  entryFile: main.py
  evaluation: io
  hints:
    - Каждую строку ввода нужно прочитать через input() и превратить в число функцией int.
    - Целая часть деления - оператор //, остаток - %, обычное деление - /. Стоимость считается от полных коробок.
    - 'print("Полных коробок:", boxes) выводит подпись и значение через пробел.'
    - 'Скелет: eggs = int(input()); size = int(input()); price = int(input()); boxes = eggs // size; затем четыре print.'
  tests:
    - id: basic
      title: Пример из условия
      stdin: "23\n10\n120\n"
      expected: "Полных коробок: 2\nОсталось яиц: 3\nСтоимость: 240\nКоробок (дробно): 2.3\n"
      compare: exact
      hint: Проверьте, что // даёт целое, % - остаток, а стоимость считается от числа полных коробок.
    - id: exact-division
      title: Делится без остатка (скрытый)
      stdin: "30\n10\n100\n"
      expected: "Полных коробок: 3\nОсталось яиц: 0\nСтоимость: 300\nКоробок (дробно): 3.0\n"
      compare: exact
      hidden: true
      hint: Деление / всегда даёт дробное число, поэтому вывод 3.0, а не 3.
    - id: fewer-than-box
      title: Меньше одной коробки (скрытый)
      stdin: "7\n12\n90\n"
      expected: "Полных коробок: 0\nОсталось яиц: 7\nСтоимость: 0\nКоробок (дробно): 0.5833333333333334\n"
      compare: exact
      hidden: true
      hint: Если яиц меньше размера коробки, полных коробок ноль, а остаток равен всем яйцам.
    - id: zero-eggs
      title: Нет яиц (скрытый)
      stdin: "0\n6\n50\n"
      expected: "Полных коробок: 0\nОсталось яиц: 0\nСтоимость: 0\nКоробок (дробно): 0.0\n"
      compare: exact
      hidden: true
      hint: Ноль яиц - допустимый ввод; проверьте, что программа не падает и выводит нули.
