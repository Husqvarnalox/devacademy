id: python.fundamentals.numbers-and-operators
title: Числа и арифметические операторы
goal: Понимать, как устроены int и float, как работают //, % и round, и не удивляться 0.1 + 0.2.
difficulty: easy
estimatedMinutes: 35
prerequisites: [python.fundamentals.variables-and-input]
objectives:
  - Объяснить, почему int в Python не переполняется, а float имеет конечную точность.
  - Объяснить результат 0.1 + 0.2 через двоичное представление дробей (IEEE 754 double).
  - Предсказывать результат // и % для отрицательных операндов по правилу «деление с округлением вниз».
  - Знать, что round() округляет «к чётному», и отличать round от int.
  - Выполнять явные преобразования между str, int и float и понимать, какие из них теряют информацию.
masteryCriteria:
  - Вы верно вычисляете в уме -7 // 2, -7 % 2, round(2.5) и int(-3.9).
  - Вы знаете, чем сравнить float «безопасно» (math.isclose) и почему == ненадёжен.
  - Вы решаете задачу на деление с остатком, не ошибаясь на отрицательных числах.
related: [python.fundamentals.variables-and-input]
next: [python.fundamentals.conditions]
tags: [python, int, float, ieee754, division, round]
facts:
  - kind: internals
    text: >-
      Тип float в CPython хранит число в формате IEEE 754 binary64 (double) - у 64-битного числа 53 значащих бита. Поэтому десятичные дроби вроде 0.1
      не представляются точно, а хранятся как ближайшее двоичное значение.
    sources:
      - https://docs.python.org/3/tutorial/floatingpoint.html
  - kind: internals
    text: >-
      round() при равноудалённых значениях округляет к ближайшему чётному: round(0.5) равно 0, round(1.5) равно 2, round(2.5) равно 2.
    sources:
      - https://docs.python.org/3/library/functions.html#round
  - kind: misconception
    text: >-
      «Оператор // - это деление с отбрасыванием дробной части». Для отрицательных чисел это не так: // округляет вниз, к минус бесконечности,
      поэтому -7 // 2 равно -4, а не -3.
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: numeric
      prompt: Чему равно -7 // 2?
      answer: -4
      tolerance: 0
      explanation: >-
        // возвращает результат деления, округлённый вниз (к минус бесконечности): -3.5 округляется до -4. Остаток при этом -7 % 2 равен 1,
        потому что всегда выполняется (a // b) * b + a % b == a.
    - id: q2
      type: single
      prompt: Почему выражение 0.1 + 0.2 == 0.3 в Python ложно?
      options:
        - В Python есть ошибка в сложении дробных чисел.
        - Числа 0.1 и 0.2 хранятся как двоичные приближения, и их сумма отличается от приближения 0.3.
        - Оператор == для float сравнивает только целую часть.
        - Сложение float выполняется с округлением до целого.
      answer: 1
      explanation: >-
        Двоичная система не может точно записать 0.1, как десятичная не может точно записать 1/3. Сумма двух приближений оказывается
        соседним, но другим числом, чем приближение для 0.3. Это свойство IEEE 754, а не ошибка Python.
    - id: q3
      type: single
      prompt: Какой набор значений даст (round(0.5), round(1.5), round(2.5))?
      options:
        - "(1, 2, 3)"
        - "(0, 2, 2)"
        - "(0, 1, 2)"
        - "(1, 2, 2)"
      answer: 1
      explanation: Значения посередине округляются к ближайшему чётному числу, поэтому получается 0, 2, 2.
    - id: q4
      type: multiple
      prompt: Какие утверждения верны?
      options:
        - int может хранить число 2 ** 1000 точно.
        - int(-3.9) равно -4.
        - 7 / 2 возвращает float, даже если результат целый, как в 6 / 3.
        - Результат x % y для положительного y всегда неотрицателен.
      answer: [0, 2, 3]
      explanation: >-
        int в Python имеет произвольную точность. int(-3.9) отбрасывает дробную часть и даёт -3. Операция / всегда возвращает float. Остаток при положительном
        делителе лежит в диапазоне от 0 до y - 1.
exercise:
  id: python.fundamentals.numbers-and-operators.exercise
  title: Деление с остатком
  prompt: |
    Во входе одна строка с двумя целыми числами `a` и `b` через пробел (`b != 0`, оба по модулю не больше 10^6).

    Выведите четыре строки:

    1. `a // b`;
    2. `a % b`;
    3. частное `a / b`, округлённое до двух знаков после запятой функцией `round`;
    4. частное `a / b`, округлённое до целого функцией `round`.

    **Пример.** Ввод `7 2`:

    ```
    3
    1
    3.5
    4
    ```

    Вывод печатайте как обычные значения Python: не форматируйте числа вручную. Сравниваются слова, а не пробелы.

    **Ограничения.** Числа могут быть отрицательными; используйте именно операторы `//` и `%`.
  entryFile: main.py
  evaluation: io
  hints:
    - Прочитайте строку, разрежьте её по пробелам методом split и преобразуйте обе части в int.
    - "Для третьей и четвёртой строк нужны именно round(a / b, 2) и round(a / b) - не int и не //."
    - "Не вычисляйте остаток вручную через вычитание: оператор % уже работает правильно для отрицательных чисел."
    - "Скелет: a, b = map(int, input().split()), затем четыре print: a // b, a % b, round(a / b, 2), round(a / b)."
  tests:
    - id: basic
      title: Положительные числа
      stdin: "7 2\n"
      expected: "3\n1\n3.5\n4\n"
      compare: tokens
      hint: Проверьте, что третья строка округлена до двух знаков, а четвёртая - до целого.
    - id: third
      title: Периодическая дробь
      stdin: "1 3\n"
      expected: "0\n1\n0.33\n0\n"
      compare: tokens
      hint: "Для 1 / 3 округление до двух знаков даёт 0.33, а до целого - 0."
    - id: exact
      title: Деление нацело
      stdin: "6 3\n"
      expected: "2\n0\n2.0\n2\n"
      compare: tokens
      hint: "Результат / всегда float: round(2.0, 2) выводится как 2.0, а round(2.0) - как 2."
    - id: hidden-negative
      title: Отрицательное делимое (скрытый)
      stdin: "-7 2\n"
      expected: "-4\n1\n-3.5\n-4\n"
      compare: tokens
      hidden: true
      hint: "// округляет вниз: -7 // 2 равно -4, а остаток тогда равен 1. Если вы получили -3, вы использовали int(a / b) вместо //."
    - id: hidden-banker
      title: Округление к чётному (скрытый)
      stdin: "5 2\n"
      expected: "2\n1\n2.5\n2\n"
      compare: tokens
      hidden: true
      hint: round(2.5) равно 2, а не 3. Не заменяйте round на int(x + 0.5).
    - id: hidden-negative-divisor
      title: Отрицательный делитель (скрытый)
      stdin: "7 -2\n"
      expected: "-4\n-1\n-3.5\n-4\n"
      compare: tokens
      hidden: true
      hint: При отрицательном делителе остаток тоже отрицателен - знак остатка совпадает со знаком делителя.
