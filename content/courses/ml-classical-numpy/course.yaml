id: ml-classical-numpy
version: 1.0.0
title: "Классическое ML с нуля на NumPy"
description: >-
  Четыре урока, в которых классические алгоритмы машинного обучения реализуются с нуля на NumPy (этап A «с нуля»): векторизованная линейная регрессия
  (lstsq, нормальные уравнения и пакетный градиентный спуск), логистическая регрессия с устойчивой функцией потерь, k-means с инициализацией k-means++
  и метод главных компонент через SVD. В каждом уроке раздел «Как это делается в библиотеке» описывает этап B (scikit-learn) только текстом:
  библиотека в окружении не установлена, поэтому этот этап запланирован, а исполняемого кода с ней нет. Сравниваются корректность, численная устойчивость и сложность.
  Уроки детерминированы: данные генерируются через np.random.default_rng с фиксированным seed, допуски заданы явно, GPU не нужен. Нужен NumPy 2.x.
languageId: python
level: 3
track: ml-classical
requires: [ml-foundations, python-numpy]
lessons:
  - 01-linear-regression-vectorized
  - 02-logistic-regression
  - 03-kmeans
  - 04-pca-svd
