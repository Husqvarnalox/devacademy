id: python.stdlib.itertools-functools-operator
title: "itertools, functools, operator: строительные блоки"
goal: Собирать конвейеры из комбинаторных итераторов, кэшировать чистые функции, диспетчеризовать по типу и сортировать с помощью itemgetter, attrgetter и cmp_to_key.
difficulty: medium
estimatedMinutes: 80
requires: { python: ">=3.12" }
prerequisites: [python.stdlib.collections, python.advanced.iterators-and-generators, python.advanced.functions-as-objects]
related: [python.advanced.decorators, python.stdlib.heapq-and-bisect]
next: [python.stdlib.pathlib-os-shutil-tempfile]
objectives:
  - Использовать permutations, combinations, product, pairwise и batched, оценивая размер результата заранее.
  - Свёртывать последовательности через functools.reduce и понимать, когда лучше sum, min, max или явный цикл.
  - Различать functools.cache и lru_cache, называть требования к аргументам и риски кэша (память, устаревшие данные, self).
  - Диспетчеризовать функцию по типу первого аргумента через singledispatch.
  - Сортировать и группировать записи через itemgetter, attrgetter, а нестандартный порядок задавать через cmp_to_key.
masteryCriteria:
  - Вы вычисляете число перестановок и сочетаний через math.perm и math.comb до того, как запускать перебор.
  - Вы объясняете, почему функция с cache не работает со списками в аргументах и почему кэш метода продлевает жизнь self.
  - Вы пишете сравнение через cmp_to_key для задачи «самое большое число из склейки» и проверяете его на крайних случаях.
tags: [python, itertools, functools, operator, combinatorics, caching, singledispatch]
facts:
  - kind: historical
    text: >-
      itertools.pairwise появилась в Python 3.10, functools.cache - в 3.9, itertools.batched - в 3.12 (параметр strict добавлен в 3.13). Код с batched не запустится на Python 3.11 и старше,
      поэтому курс требует Python 3.12 или новее. Перед использованием нового API проверяйте раздел «Changed/Added in version» в документации.
    sources:
      - https://docs.python.org/3/library/itertools.html#itertools.batched
      - https://docs.python.org/3/library/itertools.html#itertools.pairwise
      - https://docs.python.org/3/library/functools.html#functools.cache
  - kind: performance
    text: >-
      Число перестановок n элементов по r равно n!/(n-r)!, число сочетаний - n!/(r!(n-r)!). Уже permutations(range(10)) даёт 3 628 800 элементов. Итераторы itertools ленивы,
      но перебор всё равно линейно зависит от размера результата; оценивайте его через math.perm и math.comb.
    sources:
      - https://docs.python.org/3/library/math.html#math.perm
      - https://docs.python.org/3/library/math.html#math.comb
  - kind: internals
    text: >-
      functools.cache - то же самое, что lru_cache(maxsize=None): неограниченный словарь, где ключом служат позиционные и именованные аргументы, поэтому все аргументы должны быть хешируемыми.
      Кэш хранит ссылки на аргументы и результаты, пока не вызван cache_clear(); кэширование метода хранит ссылку на self.
    sources:
      - https://docs.python.org/3/library/functools.html#functools.lru_cache
  - kind: misconception
    text: >-
      «cmp_to_key нужен для сортировки по нескольким полям». Для нескольких полей достаточно ключа-кортежа или itemgetter(*fields). cmp_to_key оправдан, когда порядок нельзя выразить ключом
      (например, сравнение склеек a+b и b+a), и заметно медленнее обычного ключа.
    sources:
      - https://docs.python.org/3/library/functools.html#functools.cmp_to_key
quiz:
  passThreshold: 0.7
  questions:
    - id: q1
      type: numeric
      prompt: Сколько элементов выдаст list(itertools.combinations(range(6), 3))?
      answer: 20
      tolerance: 0
      explanation: >-
        C(6, 3) = 6! / (3! * 3!) = 20. Для оценки заранее используйте math.comb(6, 3).
    - id: q2
      type: single
      prompt: |
        from functools import cache
        @cache
        def f(items): return len(items)
        f([1, 2])
        Что произойдёт?
      options:
        - "Вернётся 2"
        - "TypeError: unhashable type: 'list'"
        - "Вернётся None"
        - "Кэш проигнорирует список и посчитает заново"
      answer: 1
      explanation: >-
        Кэш строит ключ из аргументов, а список нехешируем. Передавайте tuple или frozenset либо не кэшируйте функцию.
    - id: q3
      type: single
      prompt: Что вернёт list(itertools.pairwise("abcd"))?
      options:
        - "[('a','b'), ('c','d')]"
        - "[('a','b'), ('b','c'), ('c','d')]"
        - "[('a','b'), ('a','c'), ('a','d')]"
        - "[('a','b','c'), ('b','c','d')]"
      answer: 1
      explanation: >-
        pairwise выдаёт перекрывающиеся соседние пары (скользящее окно размера 2); для 4 элементов их 3. Непересекающиеся блоки даёт batched.
    - id: q4
      type: multiple
      prompt: Какие из утверждений о functools.singledispatch верны?
      options:
        - "Реализация выбирается по типу первого аргумента"
        - "Реализации регистрируются через @имя.register"
        - "Выбор идёт по типам всех аргументов"
        - "Для неизвестного типа вызывается функция, декорированная singledispatch (реализация по умолчанию)"
      answer: [0, 1, 3]
      explanation: >-
        singledispatch - диспетчеризация по одному (первому) аргументу; для нескольких аргументов он не подходит. Базовая функция служит реализацией по умолчанию.
    - id: q5
      type: single
      prompt: Когда оправдан functools.cmp_to_key?
      options:
        - "Всегда: он быстрее обычного key"
        - "Когда порядок задаётся попарным сравнением, которое не сводится к ключу, например сравнение a+b и b+a"
        - "Для сортировки по нескольким полям"
        - "Чтобы отсортировать неизменяемые типы"
      answer: 1
      explanation: >-
        key= вычисляет значение один раз на элемент и быстрее. cmp_to_key оборачивает функцию-компаратор для случаев, когда ключ придумать трудно.
exercise:
  id: python.stdlib.itertools-functools-operator.exercise
  title: Набор инструментов для конвейера данных
  prompt: |
    В файле `toolkit_task.py` реализуйте восемь функций. Ничего не читайте и не печатайте. Нужен Python 3.12 или новее (`itertools.batched`).

    1. `diffs(numbers)` - список разностей соседних элементов `b - a` (`itertools.pairwise`). Меньше двух элементов - `[]`.
    2. `batches(iterable, n)` - список кортежей по `n` элементов (`itertools.batched`); последний может быть короче. `n < 1` - `ValueError`.
    3. `combos(items, r)` - список всех сочетаний из `items` по `r` (`itertools.combinations`).
    4. `largest_number(nums)` - строка, составленная склейкой неотрицательных целых так, чтобы число было максимальным: `[3, 30, 34, 5, 9]` даёт `"9534330"`. Используйте `functools.cmp_to_key`: `a` стоит перед `b`, если `a+b > b+a` как строки. Если результат состоит из одних нулей - `"0"`. Пустой вход - `""`.
    5. `sort_by_fields(records, *fields)` - отсортированная копия списка словарей по указанным ключам по порядку (`operator.itemgetter`); сортировка устойчива.
    6. `to_text(x)` - функция на `functools.singledispatch`: `int` даёт `"int:5"`, `float` - `"float:2.5"`, `list` - `"[" + ", ".join(to_text(i) для i) + "]"`, всё остальное - `repr(x)`.
    7. `compose(*funcs)` - композиция справа налево через `functools.reduce`: `compose(f, g)(x) == f(g(x))`; без аргументов возвращает тождественную функцию.
    8. `fib(n)` - n-е число Фибоначчи (`fib(0) == 0`, `fib(1) == 1`), рекурсивно и с кэшем `functools.cache` или `lru_cache`: `fib(300)` должна выполняться мгновенно, а у функции должен быть метод `cache_info`.

    **Примеры.**

    ```python
    diffs([1, 4, 9, 16])                 # [3, 5, 7]
    batches("abcde", 2)                  # [('a', 'b'), ('c', 'd'), ('e',)]
    largest_number([3, 30, 34, 5, 9])    # '9534330'
    to_text([1, 2.5, "x"])               # "[int:1, float:2.5, 'x']"
    ```
  entryFile: toolkit_task.py
  evaluation: harness
  harness: exercise/harness
  harnessEntry: check.py
  requires: { python: ">=3.12" }
  hints:
    - "Каждая функция - короткая обёртка над одним инструментом: pairwise, batched, combinations, cmp_to_key, itemgetter, singledispatch, reduce, cache. Определите, какой инструмент нужен для каждой, прежде чем писать код."
    - "largest_number: компаратор cmp(a, b) возвращает отрицательное число, если a должно идти раньше b: -1 при a+b > b+a, 1 при a+b < b+a, иначе 0. Отсортируйте строки sorted(map(str, nums), key=cmp_to_key(cmp)) и склейте; результат из одних нулей замените на '0'."
    - "singledispatch: @singledispatch def to_text(x): return repr(x); затем @to_text.register(int), @to_text.register(float), @to_text.register(list). compose: reduce(lambda f, g: lambda x: f(g(x)), funcs, lambda x: x). sort_by_fields: sorted(records, key=itemgetter(*fields))."
    - "fib: @cache def fib(n): return n if n < 2 else fib(n - 1) + fib(n - 2). Для batches: [tuple_ for tuple_ in batched(iterable, n)] - batched сам поднимает ValueError при n < 1. В compose с reduce функции применяются справа налево именно потому, что внешняя лямбда вызывает f(g(x))."
  tests:
    - id: seq-basic
      title: diffs и batches
      hint: pairwise даёт перекрывающиеся пары, batched - непересекающиеся блоки; обе функции возвращают списки.
    - id: combos-basic
      title: combos
      hint: Порядок сочетаний - лексикографический по позициям во входных данных.
    - id: largest-basic
      title: largest_number
      hint: Сравнивайте склейки a+b и b+a как строки. Не сортируйте числа по значению.
    - id: sort-basic
      title: sort_by_fields
      hint: itemgetter(*fields) возвращает кортеж значений; передайте его как key.
    - id: dispatch-basic
      title: to_text - диспетчеризация (скрытый)
      hidden: true
      hint: Регистрируйте реализации для int, float, list; для вложенных списков вызывайте to_text рекурсивно; остальное - repr.
    - id: compose-reduce
      title: compose (скрытый)
      hidden: true
      hint: compose(f, g)(x) = f(g(x)); пустая композиция - тождественная функция.
    - id: fib-cache
      title: fib с кэшем (скрытый)
      hidden: true
      hint: Без кэша fib(300) не завершится. Нужен декоратор cache или lru_cache, чтобы был атрибут cache_info.
    - id: edge-cases
      title: Крайние случаи (скрытый)
      hidden: true
      hint: batches(..., 0) - ValueError; largest_number([0, 0]) == '0'; sort_by_fields по двум полям сохраняет устойчивость и не меняет исходный список.
