id: "go-skill-check"
version: "1.0.0"
title: "Проверка знаний Go"
description: "Короткие проверки по компетенциям Go: синтаксис, функции, коллекции, ввод, структуры, интерфейсы, ошибки, тестирование, конкурентность, context и устройство срезов. В каждой проверке небольшая теория-напоминание, квиз и маленькое упражнение с запуском тестов. Успешное прохождение засчитывает уроки, которые покрывает компетенция, так что известное можно пропустить. Неудача ничего не отнимает и не блокирует: проверку можно пройти повторно после изучения материала."
languageId: "go"
level: 1
track: "go"
lessons:
  - "01-basics"
  - "02-functions"
  - "03-collections"
  - "04-input"
  - "05-structs"
  - "06-interfaces"
  - "07-errors"
  - "08-testing"
  - "09-concurrency"
  - "10-context"
  - "11-internals"
