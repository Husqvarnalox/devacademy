id: "php.fundamentals.arrays-and-functions"
title: "Массивы как упорядоченные хеш-таблицы, функции высшего порядка и деструктуризация"
goal: "Строить конвейеры из array_map, array_filter, array_reduce и usort, понимая, как они обращаются с ключами, и использовать spread и деструктуризацию."
difficulty: "medium"
estimatedMinutes: 75
prerequisites:
  - "php.fundamentals.types-and-juggling"
related:
  - "javascript.fundamentals.arrays-and-iteration"
  - "java.fundamentals.streams-lambdas-optional"
  - "csharp.fundamentals.linq"
  - "python.fundamentals.functions"
next:
  - "php.fundamentals.classes-readonly-enums"
objectives:
  - "Объяснить нормализацию ключей массива и порядок обхода, проверять «списочность» через array_is_list."
  - "Предсказывать, сохраняют ли array_map, array_filter, array_merge и оператор + ключи, и при необходимости использовать array_values."
  - "Сортировать по нескольким полям устойчиво через usort и оператор <=>; отличать сортировку чисел и строк (SORT_STRING)."
  - "Применять spread в параметрах, вызовах и литералах, а также деструктуризацию по позиции, по ключу и во вложенных массивах."
  - "Называть версии, в которых появились array_is_list (8.1), строковые ключи в spread (8.1), array_find (8.4) и array_first (8.5)."
masteryCriteria:
  - "Вы без запуска пишете результат array_filter со смесью ключей и объясняете, почему json_encode выдаст объект, а не список."
  - "Вы объясняете, почему имя «10» ведёт себя в массиве как целое число, и исправляете сортировку флагом SORT_STRING."
  - "Вы строите отчёт: группировка, агрегаты, многоключевая сортировка с корректным порядком при равенстве."
  - "Вы разворачиваете массив в аргументы с именованными ключами и раскладываете вложенный массив одной строкой."
tags:
  - "php"
  - "arrays"
  - "array_map"
  - "usort"
  - "spread"
  - "destructuring"
facts:
  - kind: "historical"
    text: "С PHP 8.0 сортировка стала устойчивой: если функция сортировки считает два элемента равными, они сохраняют исходный порядок. До PHP 8.0 порядок равных элементов был неопределён."
    sources:
      - "https://www.php.net/manual/en/array.sorting.php"
  - kind: "historical"
    text: "array_is_list() добавлена в PHP 8.1. Тогда же spread-оператор для массивов получил поддержку строковых ключей (в PHP 7.4 разворачивались только массивы с целыми ключами)."
    sources:
      - "https://www.php.net/manual/en/function.array-is-list.php"
      - "https://www.php.net/releases/8.1/en.php"
  - kind: "historical"
    text: "Функции array_find(), array_find_key(), array_any() и array_all() доступны с PHP 8.4, функции array_first() и array_last() - с PHP 8.5, а оператор конвейера |> тоже появился в PHP 8.5. Для кода, который должен работать на PHP 8.3 и ниже, используйте array_key_first() и циклы."
    sources:
      - "https://www.php.net/releases/8.4/en.php"
      - "https://www.php.net/releases/8.5/en.php"
      - "https://www.php.net/manual/en/function.array-first.php"
  - kind: "internals"
    text: "array_filter() сохраняет ключи исходного массива, из-за чего в результате могут появиться пропуски; для перенумерации применяют array_values()."
    sources:
      - "https://www.php.net/manual/en/function.array-filter.php"
  - kind: "misconception"
    text: "«Сравнение массивов через <=> сравнивает как строки» - нет: элементы сравниваются по обычным правилам PHP, поэтому строки \"10\" и \"9\" внутри массива-ключа сравниваются как числа. Для побайтового порядка используйте strcmp."
  - kind: "real-world"
    text: "Возврат bool из колбэка usort() в PHP 8 вызывает предупреждение Deprecated: колбэк должен вернуть целое число меньше, равное или больше нуля. Оператор <=> делает именно это."
    sources:
      - "https://www.php.net/manual/en/function.usort.php"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что выведет echo json_encode(array_filter([1, 2, 3, 4], fn($x) => $x % 2 === 0));"
      options:
        - "[2,4]"
        - "{\"1\":2,\"3\":4}"
        - "{\"0\":2,\"1\":4}"
        - "[1,3]"
      answer: 1
      explanation: "array_filter сохраняет ключи (1 и 3), поэтому массив не является списком и кодируется как JSON-объект. Нужен array_values."
    - id: "q2"
      type: "single"
      prompt: "Какой тип имеет $k в foreach ([\"10\" => \"x\"] as $k => $v)?"
      options:
        - "string"
        - "int"
        - "float"
        - "Зависит от strict_types"
      answer: 1
      explanation: "Строковый ключ, похожий на десятичное целое без ведущих нулей, нормализуется в int."
    - id: "q3"
      type: "multiple"
      prompt: "Какие утверждения верны для PHP 8?"
      options:
        - "usort устойчива: равные элементы сохраняют порядок."
        - "array_map с одним массивом сохраняет его ключи."
        - "array_merge сохраняет целые ключи входных массивов."
        - "[...$a, ...$b] допускает строковые ключи (с PHP 8.1)."
      answer:
        - 0
        - 1
        - 3
      explanation: "array_merge перенумерует целые ключи; чтобы сохранить их, используйте + или array_replace."
    - id: "q4"
      type: "short"
      prompt: "Каким оператором удобно писать колбэк для usort (результат -1, 0 или 1)?"
      answer:
        - "<=>"
      explanation: "Оператор <=> («космический корабль») возвращает -1, 0 или 1 и годится для многоключевой сортировки: [$a->x, $a->y] <=> [$b->x, $b->y]."
    - id: "q5"
      type: "numeric"
      prompt: "Что выведет код: $a = [1, 2, 3]; unset($a[1]); $a[] = 9; echo array_key_last($a);"
      answer: 3
      tolerance: 0
      explanation: "После unset максимальный целый ключ остаётся 2, поэтому новый элемент получает ключ 3."
exercise:
  id: "php.fundamentals.arrays-and-functions.exercise"
  title: "Отчёт по отделам: группировка и многоключевая сортировка"
  prompt: |
    На входе число `n` и `n` записей `имя отдел зарплата` (слова из латиницы или цифр, зарплата - положительное целое). Токены могут быть разделены любыми пробелами и переводами строк.

    Выведите по одной строке на отдел:

    ```
    <отдел>: n=<сотрудников> total=<сумма> avg=<среднее с одним знаком> top=<имя>
    ```

    Отделы упорядочены по убыванию суммы зарплат, при равенстве сумм - по имени отдела **как строки побайтно** (`strcmp`). `top` - сотрудник с наибольшей зарплатой отдела, при равных зарплатах - первый по алфавиту (побайтно). Последняя строка: `all: n=<всего> total=<общая сумма>`.

    **Пример.**

    ```
    5
    ann dev 100
    bob dev 150
    cleo ops 300
    dan ops 50
    eve hr 120
    ```

    ```
    ops: n=2 total=350 avg=175.0 top=cleo
    dev: n=2 total=250 avg=125.0 top=bob
    hr: n=1 total=120 avg=120.0 top=eve
    all: n=5 total=720
    ```

    **Что дано.** Чтение ввода и печать готовы. Реализуйте `buildReport(array $rows): array`, возвращающую отсортированный список отделов. Помните, что названия отделов вроде `"10"` становятся целыми ключами массива.
  entryFile: "main.php"
  evaluation: "io"
  hints:
    - "Сначала сгруппируйте: foreach ($rows as [$name, $dept, $salary]) { $groups[$dept][] = [$name, $salary]; }. Деструктуризация избавляет от индексов."
    - "Для каждой группы: array_sum(array_column($members, 1)) даёт сумму, max(array_column($members, 1)) - наибольшую зарплату. Имена лучших найдите через array_filter и array_column, затем sort(..., SORT_STRING) и берите первый."
    - "Сортировка: usort($report, fn($a, $b) => $b['total'] <=> $a['total'] ?: strcmp($a['dept'], $b['dept'])). Оператор ?: вернёт strcmp, когда суммы равны (первый результат 0)."
    - "Ключ отдела может быть int (для \"10\"). Приводите его обратно: (string) $dept. Именно поэтому нельзя сравнивать отделы через <=>: \"10\" и \"9\" сравнились бы как числа."
  tests:
    - id: "example"
      title: "Пример из условия"
      stdin: "5\nann dev 100\nbob dev 150\ncleo ops 300\ndan ops 50\neve hr 120\n"
      expected: "ops: n=2 total=350 avg=175.0 top=cleo\ndev: n=2 total=250 avg=125.0 top=bob\nhr: n=1 total=120 avg=120.0 top=eve\nall: n=5 total=720\n"
      hint: "Отделы идут по убыванию суммы: ops (350), dev (250), hr (120). Среднее печатайте с одним знаком: %.1F."
    - id: "single"
      title: "Один сотрудник"
      stdin: "1\nzoe qa 77\n"
      expected: "qa: n=1 total=77 avg=77.0 top=zoe\nall: n=1 total=77\n"
      hint: "Для единственного сотрудника avg равно его зарплате с одним знаком после точки: 77.0."
    - id: "tie-total"
      title: "Равные суммы: порядок по имени отдела"
      stdin: "4\na beta 10\nb alpha 10\nc gamma 5\nd gamma 5\n"
      expected: "alpha: n=1 total=10 avg=10.0 top=b\nbeta: n=1 total=10 avg=10.0 top=a\ngamma: n=2 total=10 avg=5.0 top=c\nall: n=4 total=30\n"
      hint: "При равной сумме отдел с меньшим именем идёт раньше. Сравните суммы через $b['total'] <=> $a['total'], а при 0 (оператор ?:) сравните имена через strcmp."
    - id: "top-tie"
      title: "Лучший при равных зарплатах (скрытый)"
      stdin: "4\nmax dev 200\namy dev 200\nbob dev 100\nzed dev 50\n"
      expected: "dev: n=4 total=550 avg=137.5 top=amy\nall: n=4 total=550\n"
      hidden: true
      hint: "Если зарплата максимальна у нескольких сотрудников, top - первый по алфавиту: amy."
    - id: "numeric-dept"
      title: "Отделы с числовыми названиями (скрытый)"
      stdin: "5\na 10 5\nb 9 5\nc 100 5\nd 10 5\ne 9 1\n"
      expected: "10: n=2 total=10 avg=5.0 top=a\n9: n=2 total=6 avg=3.0 top=b\n100: n=1 total=5 avg=5.0 top=c\nall: n=5 total=21\n"
      hidden: true
      hint: "Название отдела \"10\" становится целым ключом массива. В strict_types приводите его обратно: (string) $dept, иначе strcmp/сравнение и вывод упадут."
    - id: "numeric-tie"
      title: "Равные суммы и числовые названия (скрытый)"
      stdin: "3\na 9 5\nb 10 5\nc 2 7\n"
      expected: "2: n=1 total=7 avg=7.0 top=c\n10: n=1 total=5 avg=5.0 top=b\n9: n=1 total=5 avg=5.0 top=a\nall: n=3 total=17\n"
      hidden: true
      hint: "Названия \"10\" и \"9\" при равных суммах сравнивайте как строки через strcmp: \"10\" < \"9\". Оператор <=> между числовыми строками сравнил бы их как числа."
    - id: "rounding"
      title: "Округление среднего (скрытый)"
      stdin: "3\na x 1\nb x 2\nc x 2\n"
      expected: "x: n=3 total=5 avg=1.7 top=b\nall: n=3 total=5\n"
      hidden: true
      hint: "Среднее 5/3 печатается как 1.7 через %.1F."
    - id: "whitespace"
      title: "Произвольные пробелы между токенами (скрытый)"
      stdin: "3\n\n  p   dev  10\nq dev\n 20\n\nr ops 40  \n"
      expected: "ops: n=1 total=40 avg=40.0 top=r\ndev: n=2 total=30 avg=15.0 top=q\nall: n=3 total=70\n"
      hidden: true
      hint: "Читайте весь ввод целиком и режьте через preg_split('/\\s+/'), строки могут быть разбиты как угодно."
    - id: "big"
      title: "Большие суммы (скрытый)"
      stdin: "3\na z 2000000000\nb z 2000000000\nc y 1\n"
      expected: "z: n=2 total=4000000000 avg=2000000000.0 top=a\ny: n=1 total=1 avg=1.0 top=c\nall: n=3 total=4000000001\n"
      hidden: true
      hint: "Целые в PHP 64-битные: сумма 4000000000 точна."
challenge:
  id: "php.fundamentals.arrays-and-functions.challenge"
  title: "Сводная таблица продаж"
  prompt: |
    На входе число `n` и `n` записей `регион продукт количество` (регион и продукт - слова из латиницы или цифр, количество - целое от 0). Токены могут быть разбросаны по строкам произвольно.

    Постройте **сводную таблицу**: строки - регионы, столбцы - продукты, в ячейке сумма количеств по всем записям с этой парой (если записей нет, то `0`). Регионы и продукты упорядочьте **побайтно как строки** (`SORT_STRING`; заглавные буквы раньше строчных, `"10"` раньше `"9"`). Добавьте в конец столбец `total` и строку `total`.

    Формат: первая строка - заголовок `region | <продукты...> | total`. Столбцы разделяются строкой ` | `. Ширина столбца равна длине самой длинной ячейки (включая заголовок); первый столбец (названия регионов) выравнивается влево, остальные - вправо. Пробелов в конце строк нет.

    **Пример.**

    ```
    4
    north apples 10
    north pears 5
    south apples 3
    north apples 2
    ```

    ```
    region | apples | pears | total
    north  |     12 |     5 |    17
    south  |      3 |     0 |     3
    total  |     15 |     5 |    20
    ```

    **Что дано.** Чтение ввода, функция `render` (выравнивание и печать) и сигнатура `pivot(array $records): array` готовы. `pivot` должна вернуть список строк таблицы (каждая строка - список строк-ячеек), включая заголовок и итоговую строку. Подсказка: имена вроде `"10"` превращаются в целые ключи, поэтому исходные названия придётся хранить отдельно.
  entryFile: "main.php"
  evaluation: "io"
  starter: "challenge/starter"
  solution: "challenge/solution"
  hints:
    - "Суммы храните во вложенном массиве $cells[$region][$product] += $qty (через ?? 0 для начального значения). Названия регионов и продуктов собирайте в отдельные массивы."
    - "Не используйте array_keys для названий: ключ \"10\" вернётся как int. Сохраняйте (string) $region и (string) $product отдельно и сортируйте sort($list, SORT_STRING)."
    - "Таблицу собирайте построчно: $row = [$region]; для каждого продукта добавьте (string) ($cells[$region][$product] ?? 0), затем сумму строки. Итоги по столбцам копите в массиве array_fill_keys($products, 0)."
    - "Итоговая строка: ['total', ...array_map('strval', array_values($columnTotals)), (string) $grand]. Заголовок: ['region', ...$products, 'total']. Spread избавляет от array_merge."
  tests:
    - id: "example"
      title: "Пример из условия"
      stdin: "4\nnorth apples 10\nnorth pears 5\nsouth apples 3\nnorth apples 2\n"
      expected: "region | apples | pears | total\nnorth  |     12 |     5 |    17\nsouth  |      3 |     0 |     3\ntotal  |     15 |     5 |    20\n"
      hint: "Повторные пары (регион, продукт) суммируются: north/apples = 12. Отсутствующая ячейка выводится как 0."
    - id: "single"
      title: "Одна запись"
      stdin: "1\nwest tea 4\n"
      expected: "region | tea | total\nwest   |   4 |     4\ntotal  |   4 |     4\n"
      hint: "Одна запись даёт таблицу из заголовка, одной строки и строки total."
    - id: "widths"
      title: "Выравнивание столбцов"
      stdin: "3\nr1 pencil 1000\nlongregion pen 7\nr1 pen 25\n"
      expected: "region     | pen | pencil | total\nlongregion |   7 |      0 |     7\nr1         |  25 |   1000 |  1025\ntotal      |  32 |   1000 |  1032\n"
      hint: "Ширина столбца - длина самой длинной ячейки, включая заголовок. Регион выравнивается влево (str_pad), числа вправо (STR_PAD_LEFT)."
    - id: "numeric-names"
      title: "Числовые названия сортируются как строки (скрытый)"
      stdin: "4\n9 10 1\n10 9 2\n9 9 3\n10 10 4\n"
      expected: "region | 10 | 9 | total\n10     |  4 | 2 |     6\n9      |  1 | 3 |     4\ntotal  |  5 | 5 |    10\n"
      hidden: true
      hint: "Имена \"10\" и \"9\" становятся целыми ключами массива. Нужны sort(..., SORT_STRING) и обратное (string)-приведение: порядок 10, 9."
    - id: "byte-order"
      title: "Побайтовый порядок: заглавные раньше строчных (скрытый)"
      stdin: "4\nb x 1\nB x 2\na y 3\nA y 4\n"
      expected: "region | x | y | total\nA      | 0 | 4 |     4\nB      | 2 | 0 |     2\na      | 0 | 3 |     3\nb      | 1 | 0 |     1\ntotal  | 3 | 7 |    10\n"
      hidden: true
      hint: "Сортировка побайтовая: A < B < a < b. Не применяйте регистронезависимое сравнение."
    - id: "zero-cells"
      title: "Нулевые количества и пустые ячейки (скрытый)"
      stdin: "3\nn a 0\ns b 0\nn b 0\n"
      expected: "region | a | b | total\nn      | 0 | 0 |     0\ns      | 0 | 0 |     0\ntotal  | 0 | 0 |     0\n"
      hidden: true
      hint: "Запись с количеством 0 всё равно создаёт регион и продукт. Пустая ячейка и ячейка с нулём печатаются одинаково: 0."
    - id: "big"
      title: "Большие числа и разбросанные токены (скрытый)"
      stdin: "2\n\nx  y 2000000000\n x\ny   2000000000\n"
      expected: "region |          y |      total\nx      | 4000000000 | 4000000000\ntotal  | 4000000000 | 4000000000\n"
      hidden: true
      hint: "Читайте ввод целиком и режьте по \\s+. Сумма 4000000000 помещается в 64-битный int."
