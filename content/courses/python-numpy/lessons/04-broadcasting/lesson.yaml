id: "python.numpy.broadcasting"
title: "Broadcasting: правила и ловушки"
goal: "Предсказывать форму результата при операциях над массивами разных форм, управлять осями через None и keepdims и замечать тихие ошибки broadcasting."
difficulty: "medium"
estimatedMinutes: 75
prerequisites:
  - "python.numpy.views-and-copies"
related:
  - "python.numpy.reductions-and-axis"
  - "python.numpy.ndarray-vs-list"
next:
  - "python.numpy.reductions-and-axis"
objectives:
  - "Применить правило выравнивания форм справа налево и определить форму результата или причину ValueError."
  - "Использовать np.newaxis (None) и keepdims=True, чтобы растягивать нужную ось."
  - "Объяснить, почему деление матрицы на вектор сумм без keepdims на квадратной матрице даёт тихую ошибку."
  - "Заменять вложенные циклы вычислением через broadcasting (внешняя сумма, матрица расстояний)."
masteryCriteria:
  - "broadcast_shape совпадает с np.broadcast_shapes на совместимых формах и бросает ValueError на несовместимых."
  - "center_columns и row_normalize верны на квадратной несимметричной матрице (скрытый тест ловит неверную ось)."
  - "Задача про расстояния: pairwise_sq_dists работает без циклов и численно устойчива на больших координатах."
tags:
  - "numpy"
  - "broadcasting"
  - "axis"
  - "shapes"
  - "vectorization"
requires:
  packages:
    - "numpy>=2"
accelerator: "none"
facts:
  - kind: "internals"
    text: "Правила broadcasting в документации NumPy: формы сравниваются начиная с последней оси, оси должны быть равны либо одна из них равна 1. При этом данные не копируются: растянутая ось обрабатывается с нулевым шагом."
    sources:
      - "https://numpy.org/doc/stable/user/basics.broadcasting.html"
  - kind: "misconception"
    text: "«Если NumPy не выдал ошибку, формы были согласованы так, как я задумал». Совместимость форм лишь формальна: матрица (3, 3) и вектор (3,) всегда совместимы, но вектор растягивается по строкам. Проверяйте результат на данных, где неверная ось даёт ошибку формы."
    sources:
      - "https://numpy.org/doc/stable/user/basics.broadcasting.html"
  - kind: "performance"
    text: "Broadcasting экономит копирование входных данных, но промежуточный результат создаётся целиком: разность формы (n, m, d) требует памяти порядка n*m*d элементов."
    sources:
      - "https://numpy.org/doc/stable/user/basics.broadcasting.html"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Какая форма у результата np.zeros((3, 1)) + np.zeros((1, 4))?"
      options:
        - "(3, 4)"
        - "(4, 3)"
        - "(3, 1)"
        - "ValueError"
      answer: 0
      explanation: "Оси длины 1 растягиваются до длины другой формы: 3 и 4."
    - id: "q2"
      type: "multiple"
      prompt: "Какие пары форм несовместимы для broadcasting?"
      options:
        - "(3,) и (4,)"
        - "(2, 3) и (3, 2)"
        - "(5, 1) и (1, 6)"
        - "(4, 3) и (4,)"
      answer:
        - 0
        - 1
        - 3
      explanation: "При выравнивании справа в первой, второй и четвёртой парах последние оси (3 и 4, 3 и 2, 3 и 4) не равны и не равны 1. Пара (5, 1) и (1, 6) даёт (5, 6)."
    - id: "q3"
      type: "single"
      prompt: "a имеет форму (3, 3), s = a.sum(axis=1) имеет форму (3,). Что делает a / s?"
      options:
        - "Делит каждый столбец j на s[j], а не строки на их суммы"
        - "Делит каждую строку i на s[i]"
        - "Бросает ValueError"
        - "Делит все элементы на сумму всех s"
      answer: 0
      explanation: "Форма (3,) выравнивается по последней оси, то есть s[j] применяется к столбцу j. Чтобы делить строки, нужны keepdims=True или s[:, None]."
    - id: "q4"
      type: "numeric"
      prompt: "Сколько элементов в результате x[:, None] + y[None, :] для x длины 5 и y длины 7? Ответ - число."
      answer: 35
      tolerance: 0
      explanation: "Форма результата (5, 7), то есть 35 элементов."
    - id: "q5"
      type: "single"
      prompt: "Что означает keepdims=True в a.sum(axis=1, keepdims=True) для a формы (4, 6)?"
      options:
        - "Результат имеет форму (4, 1)"
        - "Результат имеет форму (4,)"
        - "Результат имеет форму (1, 6)"
        - "Сумма считается по всем осям"
      answer: 0
      explanation: "Свёрнутая ось сохраняется с длиной 1, поэтому результат корректно участвует в broadcasting с a."
exercise:
  id: "python.numpy.broadcasting.exercise"
  title: "Формы, центрирование столбцов и нормировка строк"
  prompt: |
    В файле `broadcast_task.py` реализуйте четыре функции. NumPy 2.x доступен; ничего не печатайте.

    1. `broadcast_shape(s1, s2)` - форма результата broadcasting для кортежей `s1` и `s2`. Реализуйте правила **вручную** (без `np.broadcast_shapes`); при несовместимости бросьте `ValueError`. Результат - кортеж из `int`.
    2. `center_columns(a)` - вычесть из каждого столбца 2D-массива его среднее; результат `float64` той же формы.
    3. `row_normalize(a)` - поделить каждую строку 2D-массива на сумму её элементов; строки с нулевой суммой остаются нулевыми (без `nan` и `inf`). Результат `float64` той же формы.
    4. `outer_sum(x, y)` - для 1D-массивов длин `n` и `m` вернуть массив формы `(n, m)` с `x[i] + y[j]`.

    Скрытые тесты используют **квадратные несимметричные** матрицы, на которых неверная ось не вызывает ошибку.

    **Пример.**

    ```python
    broadcast_shape((3, 1), (1, 4))   # (3, 4)
    broadcast_shape((3,), (4,))        # ValueError
    outer_sum(np.array([1, 2]), np.array([10, 20, 30]))   # форма (2, 3)
    ```
  entryFile: "broadcast_task.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "broadcast_shape: выровняйте обе формы справа, дописав слева единицы до одинаковой длины, затем пройдите по парам размеров."
    - "На каждой оси: если размеры равны или второй равен 1 - берите первый; если первый равен 1 - второй; иначе бросьте ValueError."
    - "center_columns: среднее по столбцам - a.mean(axis=0), форма (m,). row_normalize: суммы по строкам нужно получить как a.sum(axis=1, keepdims=True), форма (n, 1)."
    - "Для нулевых сумм используйте np.divide(a, sums, out=np.zeros_like(a), where=sums != 0). outer_sum: x[:, None] + y[None, :]."
  tests:
    - id: "shape-good-basic"
      title: "broadcast_shape: совместимые формы"
      hint: "Формы выравниваются справа; недостающие оси слева считаются равными 1."
    - id: "center-columns"
      title: "center_columns на прямоугольной матрице"
      hint: "Среднее по столбцам - axis=0; результат float64."
    - id: "row-normalize-rect"
      title: "row_normalize на прямоугольной матрице"
      hint: "Суммы строк нужны формы (n, 1): keepdims=True."
    - id: "outer-sum"
      title: "outer_sum: форма и значения"
      hint: "x[:, None] имеет форму (n, 1), y[None, :] - (1, m)."
    - id: "shape-errors"
      title: "Несовместимые формы (скрытый)"
      hidden: true
      hint: "Если размеры на оси не равны и ни один не равен 1, бросайте ValueError."
    - id: "shape-hard"
      title: "Скаляры, симметрия и четыре оси (скрытый)"
      hidden: true
      hint: "Пустая форма () совместима с любой; результат не должен зависеть от порядка аргументов и состоит из int."
    - id: "square-matrix-trap"
      title: "Квадратная матрица: неверная ось даёт тихую ошибку (скрытый)"
      hidden: true
      hint: "Для центрирования столбцов нужен axis=0; для нормировки строк - keepdims=True (или [:, None]), иначе делятся столбцы."
    - id: "row-normalize-zero-and-ints"
      title: "Нулевые строки и целый вход (скрытый)"
      hidden: true
      hint: "Приведите вход к float64 и не делите на нулевую сумму: используйте where= в np.divide."
    - id: "outer-sum-shapes"
      title: "Порядок осей в outer_sum (скрытый)"
      hidden: true
      hint: "x идёт вдоль строк (ось 0), y - вдоль столбцов (ось 1)."
challenge:
  id: "python.numpy.broadcasting.challenge"
  title: "Матрица расстояний без циклов"
  prompt: |
    В файле `distance_task.py` реализуйте две функции без циклов Python по элементам.

    1. `pairwise_sq_dists(A, B)` - для `A` формы `(n, d)` и `B` формы `(m, d)` вернуть `float64`-матрицу `D` формы `(n, m)`, где `D[i, j] = ||A[i] - B[j]||^2`. Значения неотрицательны; входы не менять. Формула через скалярные произведения теряет точность при больших координатах - тесты это проверяют.
    2. `nearest_index(A, B)` - для каждой строки `A` индекс ближайшей строки `B` (при равенстве - наименьший индекс), массив целых формы `(n,)`.
  entryFile: "distance_task.py"
  starter: "challenge/starter"
  solution: "challenge/solution"
  evaluation: "harness"
  harness: "challenge/harness"
  harnessEntry: "check.py"
  hints:
    - "Сделайте A формы (n, 1, d), а B формы (1, m, d): разность будет иметь форму (n, m, d)."
    - "A[:, None, :] - B[None, :, :] даёт разности; возведите их в квадрат и просуммируйте по последней оси (axis=-1)."
    - "nearest_index - это np.argmin(D, axis=1): argmin возвращает первый минимум, поэтому при равенстве берётся наименьший индекс."
  tests:
    - id: "small"
      title: "Маленький пример"
      hint: "Ожидаемая форма (n, m), значения - квадраты евклидовых расстояний."
    - id: "nearest-basic"
      title: "nearest_index на простом примере"
      hint: "argmin по оси 1 матрицы расстояний."
    - id: "random-against-loops"
      title: "Сравнение с циклами на seed-данных (скрытый)"
      hidden: true
      hint: "Проверьте оси: разности формы (n, m, d), сумма по последней оси."
    - id: "no-mutation-and-dtypes"
      title: "Вход не меняется, int-вход даёт float64 (скрытый)"
      hidden: true
      hint: "Приведите входы к float64 новым массивом и не пишите в A и B."
    - id: "one-dim-and-ties"
      title: "d = 1 и равные расстояния (скрытый)"
      hidden: true
      hint: "Не схлопывайте ось признаков; argmin возвращает первый минимум."
    - id: "no-cancellation"
      title: "Большие координаты (скрытый)"
      hidden: true
      hint: "Считайте разности до возведения в квадрат: формула |a|^2 - 2ab + |b|^2 теряет точность при больших значениях."
