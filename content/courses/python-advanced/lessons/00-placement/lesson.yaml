id: python.advanced.placement
title: "Проверка знаний: хватит ли вам «Основ» Python"
goal: Оценить, уверенно ли вы владеете темами первых пяти уроков курса «Python: основы», и при успехе засчитать их.
difficulty: medium
estimatedMinutes: 15
objectives:
  - Проверить понимание того, как Python запускает программу и что такое имя и объект.
  - Проверить понимание типов чисел, операторов, условий и циклов на концептуальных вопросах без запуска кода.
masteryCriteria:
  - Вы отвечаете верно не менее чем на 8 из 9 вопросов; тогда пять первых уроков «Основ» засчитываются.
next: [python.advanced.functions-as-objects]
tags: [python, placement, assessment]
assessmentFor:
  - python.fundamentals.how-python-runs
  - python.fundamentals.variables-and-input
  - python.fundamentals.numbers-and-operators
  - python.fundamentals.conditions
  - python.fundamentals.loops
quiz:
  passThreshold: 0.8
  questions:
    - id: q1
      type: single
      prompt: Что в основном происходит, когда вы запускаете `python script.py`?
      options:
        - "Исходный текст построчно переводится в машинный код процессора и выполняется напрямую"
        - "Исходный текст компилируется в байт-код, который выполняет виртуальная машина интерпретатора"
        - "Файл отправляется на сервер python.org и выполняется там"
        - "Интерпретатор сначала проверяет все типы, а потом запускает программу"
      answer: 1
      explanation: >-
        CPython компилирует исходник в байт-код и исполняет его в своей виртуальной машине. Машинный код процессора при этом напрямую не создаётся,
        а проверки типов до запуска стандартный интерпретатор не делает: типы проверяются во время выполнения.
    - id: q2
      type: single
      prompt: |
        Что выведет код?
        a = [1, 2]
        b = a
        b.append(3)
        print(a)
      options:
        - "[1, 2]"
        - "[1, 2, 3]"
        - "[3]"
        - "Ошибка: список нельзя присвоить другой переменной"
      answer: 1
      explanation: >-
        Присваивание b = a не копирует список, а привязывает второе имя к тому же объекту. Изменение через b видно и через a.
    - id: q3
      type: single
      prompt: |
        Пользователь вводит 2, затем 3. Что выведет код?
        x = input()
        y = input()
        print(x + y)
      options:
        - "5"
        - "23"
        - "Ошибка: нельзя сложить два ввода"
        - "2 3"
      answer: 1
      explanation: >-
        input() всегда возвращает строку. Оператор + для строк выполняет конкатенацию, поэтому получается "23". Чтобы сложить числа, нужно сначала привести значения через int().
    - id: q4
      type: numeric
      prompt: Чему равно значение выражения 17 // 5 + 17 % 5?
      answer: 5
      tolerance: 0
      explanation: >-
        17 // 5 равно 3 (целая часть деления), 17 % 5 равно 2 (остаток). Сумма равна 5.
    - id: q5
      type: single
      prompt: Почему в Python выражение 0.1 + 0.2 == 0.3 даёт False?
      options:
        - "Потому что оператор == не работает с дробными числами"
        - "Потому что числа типа float хранятся в двоичном виде, и 0.1 и 0.2 не представимы в нём точно"
        - "Потому что 0.1 + 0.2 целиком вычисляется как целое число"
        - "Потому что Python округляет результат вниз"
      answer: 1
      explanation: >-
        float - двоичная дробь конечной длины. Многие десятичные дроби, в том числе 0.1 и 0.2, в ней записываются приближённо, и сумма отличается от 0.3 в последнем разряде.
        Для сравнения используют math.isclose или тип decimal.Decimal.
    - id: q6
      type: multiple
      prompt: Какие из этих значений считаются ложными в условии `if значение:`?
      options:
        - "0"
        - "пустая строка"
        - "пустой список"
        - "строка \"0\""
      answer: [0, 1, 2]
      explanation: >-
        Ложными считаются нулевые числа, пустые коллекции и строки, а также None и False. Непустая строка "0" - истинна, потому что проверяется длина, а не содержимое.
    - id: q7
      type: single
      prompt: Что выведет `print(2 and 0 or 3)`?
      options:
        - "2"
        - "0"
        - "3"
        - "True"
      answer: 2
      explanation: >-
        Оператор and возвращает первый ложный операнд или последний, если все истинны: 2 and 0 даёт 0. Затем 0 or 3 возвращает первый истинный операнд, то есть 3.
        Операторы and и or возвращают один из операндов, а не обязательно True или False.
    - id: q8
      type: single
      prompt: |
        Что выведет код?
        for i in range(3):
            if i == 5:
                break
        else:
            print("конец")
      options:
        - "Ничего не выведет"
        - "конец"
        - "Ошибка: у for нет ветки else"
        - "конец три раза"
      answer: 1
      explanation: >-
        Ветка else у цикла выполняется, если цикл завершился без break. Здесь i никогда не равно 5, поэтому break не срабатывает, и "конец" печатается один раз после цикла.
    - id: q9
      type: numeric
      prompt: Сколько раз выполнится тело цикла `for i in range(2, 10, 3)`?
      answer: 3
      tolerance: 0
      explanation: >-
        range(2, 10, 3) даёт 2, 5, 8: следующее значение 11 уже не меньше 10. Итого три итерации.
facts:
  - kind: internals
    text: >-
      Стандартный интерпретатор CPython сначала компилирует исходный код в байт-код, а затем исполняет его в виртуальной машине. Просмотреть байт-код функции можно модулем dis.
    sources:
      - https://docs.python.org/3/library/dis.html
