id: "php-first-steps"
version: "1.0.0"
title: "PHP: первые шаги"
description: "Курс следует за «PHP с нуля» и рассчитан на тех, кто уже умеет писать простые программы на PHP или программирует на другом языке: переменные, условия, циклы и функции здесь не объясняются. Если вы никогда не программировали, начните с курса «PHP с нуля». Вводный курс из двух уроков: как Zend Engine выполняет PHP-файл и как читать весь STDIN целиком, затем массивы как упорядоченные хеш-таблицы и строгая типизация. Остальные темы трека PHP запланированы."
languageId: "php"
level: 1
track: "php"
requires:
  - "php-from-zero"
lessons:
  - "01-how-php-runs"
  - "02-arrays-and-strict-types"
