id: "php-first-steps"
version: "1.0.0"
title: "PHP: первые шаги"
description: "Курс рассчитан на тех, кто уже программирует на другом языке: переменные, условия, циклы и функции здесь не объясняются с нуля. Если вы никогда не программировали, начните с «Go с нуля», «Основы Python» или «JavaScript с нуля». Вводный курс из двух уроков: как Zend Engine выполняет PHP-файл и как читать STDIN, затем массивы как упорядоченные хеш-таблицы и строгая типизация. Остальные темы трека PHP запланированы."
languageId: "php"
level: 1
track: "php"
lessons:
