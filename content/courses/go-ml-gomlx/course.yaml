id: go-ml-gomlx
version: 1.0.0
title: "Машинное обучение на Go (GoMLX)"
description: >-
  Шесть уроков по библиотеке GoMLX (версия v0.28.8) для тех, кто прошёл «Go: язык и идиомы» и «Основы машинного обучения»: тензоры и бэкенд, графы вычислений (формы, расширение, редукции),
  автоматическое дифференцирование, линейная регрессия с градиентным спуском, логистическая регрессия с устойчивой кросс-энтропией и маленькая нейронная сеть 16-64-1 с обсуждением переобучения и L2-регуляризации.
  Все примеры детерминированы и работают на чистом Go-бэкенде: без cgo, XLA и GPU. Этот бэкенд заметно медленнее XLA, поэтому курс учит принципам, а не производительности.
  Библиотека не достигла версии 1.0, её API может меняться, поэтому версии закреплены. Модули GoMLX (около 82 МБ архивов) скачиваются один раз, только по явному согласию: в уроке или в настройках («make go-env» для разработчиков курса).
  Слои, оптимизаторы и цикл обучения пакетов ml/layers и ml/train, импорт моделей, XLA и GPU в курс не входят.
languageId: go
level: 3
track: ml-go
requires: [go-fundamentals, ml-foundations]
lessons:
  - 01-tensors-and-backend
  - 02-computation-graphs
  - 03-automatic-differentiation
  - 04-linear-regression-gradient-descent
  - 05-logistic-regression
  - 06-tiny-mlp
framework:
  id: gomlx
  version: "v0.28.8"
  docs:
    - https://pkg.go.dev/github.com/gomlx/gomlx
    - https://github.com/gomlx/gomlx
    - https://gomlx.github.io/
    - https://pkg.go.dev/github.com/gomlx/gomlx/core/graph
    - https://github.com/gomlx/compute
  compatibility: "Go >= 1.26.5; github.com/gomlx/gomlx v0.28.8 и github.com/gomlx/compute v0.1.6, только бэкенд go (чистый Go, CGO_ENABLED=0). Курс проверен на этих версиях; сеть при запуске упражнений не используется."
  deprecated:
    - feature: "Весь публичный API GoMLX до версии 1.0"
      status: changed
      note: "Версия v0.x по правилам модулей Go не гарантирует совместимость: названия и сигнатуры функций могут меняться между минорными версиями. Пример: бэкенды вынесены в отдельный модуль github.com/gomlx/compute (в этом курсе v0.1.6)."
  migrationNotes: |
    **Что важно при обновлении GoMLX.**

    * Версии закреплены в `go.mod` и `go.sum` каждого упражнения и в наборе пакетов `tools/content-packages/go/gomlx`. Новая версия библиотеки означает новое издание курса: примеры не обновляются «молча».
    * Перед обновлением прочитайте `docs/CHANGELOG.md` репозитория GoMLX и пересоберите все упражнения: после смены версии сначала проверяйте компиляцию, затем числа в тестах (форматы вывода и порядок операций могут меняться).
    * Выбор бэкенда (`go` или `xla`) не меняет код графов, но меняет зависимости и скорость; XLA требует CGO.
    * Числа в упражнениях сравниваются с допуском, потому что `float32` на разных процессорах может отличаться в последних знаках.
