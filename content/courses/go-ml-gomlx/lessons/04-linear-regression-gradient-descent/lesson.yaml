id: "go.ml.gomlx.linear-regression-gradient-descent"
title: "Линейная регрессия и градиентный спуск"
goal: "Обучить линейную модель градиентным спуском в GoMLX: записать шаг обучения одним графом и сравнить результат с замкнутым решением."
difficulty: "medium"
estimatedMinutes: 60
prerequisites:
  - "go.ml.gomlx.automatic-differentiation"
  - "ml.foundations.linear-regression"
objectives:
  - "Записать среднеквадратичную ошибку и один шаг градиентного спуска как функцию графа."
  - "Организовать цикл обучения на Go, подставляя новые параметры в следующий вызов."
  - "Объяснить влияние скорости обучения: слишком малая, подходящая, слишком большая."
  - "Проверять результат по замкнутому решению и по ручному расчёту первого шага."
masteryCriteria:
  - "Вы реализуете шаг спуска и получаете на данных y = 2x + 1 значения w и b, близкие к 2 и 1."
  - "Вы объясняете, почему при слишком большом шаге потеря растёт."
  - "Вы отличаете потерю до обновления от потери после."
  - "Вы сопоставляете результат спуска с нормальными уравнениями."
related:
  - "ml.foundations.linear-regression"
  - "ml.numpy.linear-regression"
next:
  - "go.ml.gomlx.logistic-regression"
tags:
  - "go"
  - "gomlx"
  - "regression"
  - "gradient-descent"
facts:
  - kind: "misconception"
    text: "«Чем больше скорость обучения, тем быстрее сходимость» - нет: при слишком большом шаге градиентный спуск расходится. В примере урока шаг 0.3 приводит к росту потери до порядка 10^29, а шаг 0.05 сходится."
    sources:
      - "https://en.wikipedia.org/wiki/Gradient_descent"
  - kind: "real-world"
    text: "Для линейной регрессии по методу наименьших квадратов существует замкнутое решение (нормальные уравнения), поэтому оно служит проверкой градиентного спуска; для нейронных сетей замкнутого решения нет, и обучение идёт итеративно."
    sources:
      - "https://en.wikipedia.org/wiki/Linear_least_squares"
  - kind: "performance"
    text: "Для выпуклой квадратичной функции градиентный спуск с постоянным шагом сходится, если шаг достаточно мал по сравнению с наибольшей кривизной; чем хуже масштабированы признаки, тем меньше допустимый шаг."
    sources:
      - "https://en.wikipedia.org/wiki/Gradient_descent"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "numeric"
      prompt: "Данные y = 2x + 1 при x = 0, 1, 2, 3, 4; w = b = 0; шаг 0.05; потеря - MSE. Чему равно w после первого шага?"
      answer: 1.4
      tolerance: 0.001
      explanation: "dw = 2 * mean((pred - y) * x) = 2 * (-14) = -28, поэтому w = 0 + 0.05 * 28 = 1.4."
    - id: "q2"
      type: "single"
      prompt: "Что обычно происходит с потерей при слишком большой скорости обучения?"
      options:
        - "Убывает быстрее"
        - "Растёт или колеблется"
        - "Всегда равна нулю"
        - "Не меняется"
      answer: 1
      explanation: "Шаг перепрыгивает минимум, ошибка растёт, параметры расходятся."
    - id: "q3"
      type: "single"
      prompt: "Какое обновление параметра верно?"
      options:
        - "w + lr * grad"
        - "w - lr * grad"
        - "w * lr * grad"
        - "w - grad / lr"
      answer: 1
      explanation: "Двигаемся против градиента."
    - id: "q4"
      type: "multiple"
      prompt: "Какие утверждения верны?"
      options:
        - "Функция шага возвращает потерю, вычисленную до обновления параметров."
        - "Замкнутое решение удобно как эталон для проверки."
        - "Градиент берут по данным x и y."
        - "Градиент берут по параметрам w и b."
      answer:
        - 0
        - 1
        - 3
      explanation: "Параметры модели - это w и b; данные не меняются."
    - id: "q5"
      type: "short"
      prompt: "Как называется один проход по всем обучающим данным с обновлением параметров? (одно слово)"
      answer:
        - "эпоха"
        - "epoch"
      explanation: "В упражнении одна эпоха - один шаг полного пакета."
exercise:
  id: "go.ml.gomlx.linear-regression-gradient-descent.exercise"
  title: "Один шаг градиентного спуска"
  prompt: |
    Программа обучает модель `y ≈ w * x + b` градиентным спуском на среднеквадратичной ошибке.

    Ввод: первая строка - скорость обучения `lr` и число эпох `epochs`, затем пары `x y` (по одной в строке или как угодно разделённые пробелами). Начальные `w = 0` и `b = 0`.

    В заготовке уже есть: чтение ввода, цикл по эпохам, эталонное решение по нормальным уравнениям и печать. Не хватает самого шага в функции `step(w, b, xs, ys, lr)`, которая должна вернуть **три узла**: новое `w`, новое `b` и потерю, вычисленную **до** обновления. Заготовка возвращает `w`, `b` без изменений.

    Реализуйте обновление через `graph.Gradient(loss, w, b)`: `w - lr * dw`, `b - lr * db`.

    Программа печатает:

    ```
    initial loss = <потеря первой эпохи, 3 знака>
    closed form: w = <...> b = <...>
    gradient descent: w = <...> b = <...> last loss = <потеря последней эпохи, 4 знака>
    ```

    **Пример.** Ввод

    ```
    0.05 300
    0 1
    1 3
    2 5
    3 7
    4 9
    ```

    даёт

    ```
    initial loss = 33.000
    closed form: w = 2.000 b = 1.000
    gradient descent: w = 2.000 b = 1.000 last loss = 0.0000
    ```

    Файлы `go.mod` и `go.sum` менять не нужно.
  evaluation: "io"
  languageId: "go"
  entryFile: "main.go"
  starter: "exercise/starter"
  solution: "exercise/solution"
  requires:
    go: ">=1.26.5"
    goModules:
      - "github.com/gomlx/gomlx"
      - "github.com/gomlx/compute"
  hints:
    - "Потеря loss и предсказания pred уже построены в step. Осталось получить производные потери по параметрам: graph.Gradient(loss, w, b) возвращает срез из двух узлов."
    - "Обновление параметра: новое значение = старое - lr * производная. lr здесь не число Go, а узел-скаляр, поэтому используйте graph.Mul(lr, grads[0])."
    - "Новые параметры собираются как graph.Sub(w, graph.Mul(lr, grads[0])) и graph.Sub(b, graph.Mul(lr, grads[1]))."
    - "Верните []*graph.Node{newW, newB, loss}: порядок важен, цикл в main читает out[0] как w, out[1] как b, out[2] как потерю."
  tests:
    - id: "line"
      title: "Прямая y = 2x + 1"
      stdin: "0.05 300\n0 1\n1 3\n2 5\n3 7\n4 9\n"
      expected: "initial loss = 33.000\nclosed form: w = 2.000 b = 1.000\ngradient descent: w = 2.000 b = 1.000 last loss = 0.0000\n"
      compare: "numeric"
      tolerance: 0.002
      hint: "Один шаг: pred = x*w + b, MSE, Gradient по w и b, затем w - lr*grad."
    - id: "slope"
      title: "Убывающая прямая"
      stdin: "0.05 400\n0 3\n1 2\n2 1\n3 0\n"
      expected: "initial loss = 3.500\nclosed form: w = -1.000 b = 3.000\ngradient descent: w = -1.000 b = 3.000 last loss = 0.0000\n"
      compare: "numeric"
      tolerance: 0.002
      hint: "Начальные w и b равны нулю; начальная потеря выводится до первого обновления."
    - id: "noisy"
      title: "Шумные данные"
      stdin: "0.05 500\n0 1.2\n1 2.8\n2 5.3\n3 6.9\n4 9.1\n"
      expected: "initial loss = 33.558\nclosed form: w = 1.990 b = 1.080\ngradient descent: w = 1.990 b = 1.080 last loss = 0.0342\n"
      compare: "numeric"
      tolerance: 0.002
      hint: "Градиентный спуск должен приходить к тому же решению, что и формула нормальных уравнений."
    - id: "few"
      title: "Мало эпох (скрытый)"
      stdin: "0.05 3\n0 1\n1 3\n2 5\n"
      expected: "initial loss = 11.667\nclosed form: w = 2.000 b = 1.000\ngradient descent: w = 1.018 b = 0.698 last loss = 3.9380\n"
      compare: "numeric"
      tolerance: 0.002
      hidden: true
      hint: "Печатайте w и b после всех epochs шагов, а не после первого."
    - id: "rate"
      title: "Другая скорость обучения (скрытый)"
      stdin: "0.1 200\n-2 -3\n-1 -1\n0 1\n1 3\n"
      expected: "initial loss = 5.000\nclosed form: w = 2.000 b = 1.000\ngradient descent: w = 2.000 b = 1.000 last loss = 0.0000\n"
      compare: "numeric"
      tolerance: 0.002
      hidden: true
      hint: "lr передаётся в граф как тензор и умножается на градиент."
    - id: "zero"
      title: "Одна эпоха (скрытый)"
      stdin: "0.01 1\n1 1\n2 2\n"
      expected: "initial loss = 2.500\nclosed form: w = 1.000 b = 0.000\ngradient descent: w = 0.050 b = 0.030 last loss = 2.5000\n"
      compare: "numeric"
      tolerance: 0.002
      hidden: true
      hint: "За одну эпоху w и b сдвигаются ровно на один шаг: они не должны сразу совпасть с эталоном."
