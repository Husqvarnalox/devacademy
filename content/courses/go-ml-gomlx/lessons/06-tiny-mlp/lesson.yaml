id: "go.ml.gomlx.tiny-mlp"
title: "Маленькая нейронная сеть и переобучение"
goal: "Собрать и обучить сеть 16-64-1 с tanh, увидеть переобучение в числах и испытать L2-регуляризацию."
difficulty: "hard"
estimatedMinutes: 90
prerequisites:
  - "go.ml.gomlx.logistic-regression"
objectives:
  - "Записать прямой проход двухслойной сети через MatMul и Tanh и посчитать число параметров."
  - "Объяснить, почему без нелинейности слои схлопываются в один."
  - "Определять переобучение по разрыву между обучающей и тестовой потерей."
  - "Добавить L2-штраф к потере и оценить его влияние на веса и тестовую потерю."
  - "Назвать ограничения вывода, сделанного по одному эксперименту."
masteryCriteria:
  - "Вы обучаете сеть и получаете на тесте точность выше, чем у линейной модели на круговых данных."
  - "Вы считаете число параметров сети 16-64-1 и указываете формы всех четырёх тензоров."
  - "Вы показываете переобучение числами: train loss падает, test loss не падает."
  - "Вы не подбираете гиперпараметры по тестовой выборке и честно оцениваете выводы одного зерна."
related:
  - "go.ml.gomlx.logistic-regression"
  - "ml.foundations.what-is-ml"
next: []
tags:
  - "go"
  - "gomlx"
  - "neural-network"
  - "overfitting"
  - "regularization"
facts:
  - kind: "historical"
    text: "По теореме универсальной аппроксимации (первые доказательства для сигмоидных активаций - Цыбенко, 1989) сеть с одним скрытым слоем достаточной ширины приближает широкий класс непрерывных функций. Теорема не утверждает, что градиентный спуск найдёт такое приближение и сколько для этого нужно данных."
    sources:
      - "https://en.wikipedia.org/wiki/Universal_approximation_theorem"
  - kind: "real-world"
    text: "L2-регуляризация в линейных моделях известна как гребневая регрессия (регуляризация Тихонова); в нейронных сетях её называют также затуханием весов."
    sources:
      - "https://en.wikipedia.org/wiki/Tikhonov_regularization"
  - kind: "misconception"
    text: "«Чем меньше потеря на обучении, тем лучше модель» - нет: при переобучении потеря на обучении убывает, а на новых данных растёт или не улучшается."
    sources:
      - "https://en.wikipedia.org/wiki/Overfitting"
  - kind: "performance"
    text: "Бэкенд go подходит для учебных сетей. Для больших моделей и GPU проект предлагает бэкенд XLA, который использует CGO."
    sources:
      - "https://github.com/gomlx/compute"
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "numeric"
      prompt: "Сколько параметров (веса и смещения) у сети 16 -> 64 -> 1?"
      answer: 1153
      tolerance: 0
      explanation: "16*64 + 64 + 64*1 + 1 = 1024 + 64 + 64 + 1 = 1153."
    - id: "q2"
      type: "single"
      prompt: "Почему в скрытом слое нужна нелинейность вроде tanh?"
      options:
        - "Чтобы ускорить умножение матриц"
        - "Без неё последовательность линейных слоёв эквивалентна одному линейному слою"
        - "Чтобы получить вероятности"
        - "Чтобы уменьшить число параметров"
      answer: 1
      explanation: "(x W1) W2 = x (W1 W2)."
    - id: "q3"
      type: "single"
      prompt: "Что указывает на переобучение?"
      options:
        - "Потеря падает и на обучении, и на тесте"
        - "Потеря на обучении падает, а на тесте не улучшается или растёт"
        - "Потеря равна нулю на тесте"
        - "Потеря не меняется"
      answer: 1
      explanation: "Разрыв между train и test - признак запоминания."
    - id: "q4"
      type: "multiple"
      prompt: "Какие утверждения о L2-регуляризации верны?"
      options:
        - "Она добавляет штраф lambda/2 * сумма квадратов весов."
        - "Смещения обычно не штрафуют."
        - "Чем больше lambda, тем всегда лучше на тесте."
        - "Подбор lambda по тестовой выборке завышает оценку качества."
      answer:
        - 0
        - 1
        - 3
      explanation: "Слишком большая lambda ведёт к недообучению."
    - id: "q5"
      type: "short"
      prompt: "Как называется функция GoMLX для умножения матриц? Напишите имя (можно с пакетом)."
      answer:
        - "MatMul"
        - "graph.MatMul"
      explanation: "graph.MatMul(a, b) перемножает матрицы [n, k] и [k, m]."
exercise:
  id: "go.ml.gomlx.tiny-mlp.exercise"
  title: "Сеть 16-64-1 с tanh"
  prompt: |
    Программа обучает полносвязную сеть `16 -> 64 -> 1` на синтетических данных: метка зависит только от первых двух признаков (точка лежит вне круга радиуса 1.2 - класс 1), остальные 14 признаков - слабый шум, 10% меток перевёрнуто. Обучающая выборка - 100 точек, тестовая - 400 (зерно фиксировано).

    Ввод: число эпох `epochs`. Скорость обучения `0.3`.

    В заготовке есть данные, инициализация, потеря, шаг и печать. В прямом проходе `forward` у скрытого слоя **нет нелинейности**, поэтому две матрицы схлопываются в линейную модель, которая не отделяет круг. Допишите `tanh`: `h = tanh(x W1 + b1)`; выход остаётся линейным `h W2 + b2`.

    Программа печатает:

    ```
    parameters = <число параметров>
    train: loss = <...> accuracy = <...>
    test: loss = <...> accuracy = <...>
    ```

    **Пример.** Ввод `300` даёт

    ```
    parameters = 1153
    train: loss = 0.315 accuracy = 0.900
    test: loss = 0.658 accuracy = 0.692
    ```

    Сравните строки `train` и `test` при `1000` эпох: обучающая потеря продолжает падать, а тестовая нет. Это переобучение; в задаче со звёздочкой вы попробуете L2-регуляризацию.

    Файлы `go.mod` и `go.sum` менять не нужно.
  evaluation: "io"
  languageId: "go"
  entryFile: "main.go"
  starter: "exercise/starter"
  solution: "exercise/solution"
  requires:
    go: ">=1.26.5"
    goModules:
      - "github.com/gomlx/gomlx"
      - "github.com/gomlx/compute"
  hints:
    - "Без нелинейности (x W1 + b1) W2 = x (W1 W2) + const: два слоя эквивалентны одному линейному, поэтому модель не отделяет круг."
    - "Нелинейность применяется к результату первого слоя, до умножения на W2: h = graph.Tanh(graph.Add(graph.MatMul(x, w1), b1))."
    - "Выходной слой остаётся линейным: graph.Add(graph.MatMul(h, w2), b2). Это логиты; потеря и точность уже ждут именно их."
    - "Достаточно изменить одну строку в forward: оберните сумму скрытого слоя в graph.Tanh."
  tests:
    - id: "short"
      title: "Короткое обучение"
      stdin: "150\n"
      expected: "parameters = 1153\ntrain: loss = 0.533 accuracy = 0.760\ntest: loss = 0.718 accuracy = 0.587\n"
      compare: "numeric"
      tolerance: 0.015
      hint: "Скрытый слой: tanh(x W1 + b1); выход - линейный слой h W2 + b2."
    - id: "medium"
      title: "Среднее обучение"
      stdin: "300\n"
      expected: "parameters = 1153\ntrain: loss = 0.315 accuracy = 0.900\ntest: loss = 0.658 accuracy = 0.692\n"
      compare: "numeric"
      tolerance: 0.015
      hint: "Без tanh сеть вырождается в линейную модель и не отделяет круг."
    - id: "long"
      title: "Долгое обучение"
      stdin: "1000\n"
      expected: "parameters = 1153\ntrain: loss = 0.064 accuracy = 1.000\ntest: loss = 0.694 accuracy = 0.752\n"
      compare: "numeric"
      tolerance: 0.015
      hint: "Сравните потерю на обучении и на тесте: разрыв растёт."
    - id: "e200"
      title: "200 эпох (скрытый)"
      stdin: "200\n"
      expected: "parameters = 1153\ntrain: loss = 0.445 accuracy = 0.810\ntest: loss = 0.687 accuracy = 0.627\n"
      compare: "numeric"
      tolerance: 0.015
      hidden: true
      hint: "После 200 эпох сеть с tanh уже заметно лучше линейной модели."
    - id: "e500"
      title: "500 эпох (скрытый)"
      stdin: "500\n"
      expected: "parameters = 1153\ntrain: loss = 0.172 accuracy = 0.960\ntest: loss = 0.602 accuracy = 0.755\n"
      compare: "numeric"
      tolerance: 0.015
      hidden: true
      hint: "Обновляйте все четыре параметра: W1, b1, W2, b2."
    - id: "e700"
      title: "700 эпох (скрытый)"
      stdin: "700\n"
      expected: "parameters = 1153\ntrain: loss = 0.112 accuracy = 0.980\ntest: loss = 0.633 accuracy = 0.762\n"
      compare: "numeric"
      tolerance: 0.015
      hidden: true
      hint: "Форму параметров менять нельзя: 16 -> 64 -> 1."
challenge:
  id: "go.ml.gomlx.tiny-mlp.challenge"
  title: "L2-регуляризация"
  prompt: |
    Задача со звёздочкой. Та же сеть `16 -> 64 -> 1` и те же данные, но обучение идёт ровно `1000` эпох, а на вход подаётся коэффициент регуляризации `lambda`.

    Добавьте к **обучаемой** потере L2-штраф `(lambda / 2) * (sum(W1^2) + sum(W2^2))` до взятия градиента. Смещения `b1` и `b2` не штрафуются. При `lambda = 0` поведение прежнее.

    Печатаемые `train loss` и `test loss` - это обычная кросс-энтропия без штрафа (так модели с разными `lambda` сопоставимы). Дополнительно программа печатает норму весов `sqrt(sum(W1^2) + sum(W2^2))`.

    Программа печатает:

    ```
    lambda = <lambda>
    train: loss = <...> accuracy = <...>
    test: loss = <...> accuracy = <...>
    weight norm = <...>
    ```

    **Пример.** Ввод `0.004` даёт

    ```
    lambda = 0.004
    train: loss = 0.152 accuracy = 0.980
    test: loss = 0.549 accuracy = 0.770
    weight norm = 8.068
    ```

    Сравните `lambda = 0`, `0.004`, `0.01`, `0.02` и `0.1`. Норма весов убывает с ростом `lambda`; тестовая потеря сначала улучшается, затем при слишком большой `lambda` модель недообучается. Помните, что вывод относится к одной выборке и одному зерну.

    Файлы `go.mod` и `go.sum` менять не нужно.
  evaluation: "io"
  languageId: "go"
  entryFile: "main.go"
  starter: "challenge/starter"
  solution: "challenge/solution"
  requires:
    go: ">=1.26.5"
    goModules:
      - "github.com/gomlx/gomlx"
      - "github.com/gomlx/compute"
  hints:
    - "Штраф должен попасть в loss до graph.Gradient: градиент штрафа по весу W равен lambda * W, поэтому каждый шаг сжимает веса."
    - "Сумма квадратов: graph.ReduceAllSum(graph.Square(w1)). Сложите её для w1 и w2 и умножите на lambda/2 через graph.MulScalar."
    - "Печатаемая потеря в evaluate не меняется: штраф добавляется только внутри trainStep. Смещения b1 и b2 в штраф не входят."
    - "Скелет: if lambda > 0 { penalty := graph.Add(sumSq(w1), sumSq(w2)); loss = graph.Add(loss, graph.MulScalar(penalty, float32(lambda/2))) }."
  tests:
    - id: "zero"
      title: "Без регуляризации"
      stdin: "0\n"
      expected: "lambda = 0\ntrain: loss = 0.064 accuracy = 1.000\ntest: loss = 0.694 accuracy = 0.752\nweight norm = 13.322\n"
      compare: "numeric"
      tolerance: 0.015
      hint: "При lambda = 0 штраф не добавляется."
    - id: "small"
      title: "Малый коэффициент"
      stdin: "0.004\n"
      expected: "lambda = 0.004\ntrain: loss = 0.152 accuracy = 0.980\ntest: loss = 0.549 accuracy = 0.770\nweight norm = 8.068\n"
      compare: "numeric"
      tolerance: 0.015
      hint: "Штраф lambda/2 * (sum(W1^2) + sum(W2^2)); смещения b не штрафуют."
    - id: "medium"
      title: "Средний коэффициент"
      stdin: "0.01\n"
      expected: "lambda = 0.01\ntrain: loss = 0.253 accuracy = 0.940\ntest: loss = 0.539 accuracy = 0.738\nweight norm = 5.677\n"
      compare: "numeric"
      tolerance: 0.015
      hint: "Слишком большая lambda ведёт к недообучению: потеря растёт."
    - id: "tiny"
      title: "Очень малый коэффициент (скрытый)"
      stdin: "0.001\n"
      expected: "lambda = 0.001\ntrain: loss = 0.087 accuracy = 0.990\ntest: loss = 0.635 accuracy = 0.757\nweight norm = 11.357\n"
      compare: "numeric"
      tolerance: 0.015
      hidden: true
      hint: "Норма весов должна убывать при росте lambda."
    - id: "large"
      title: "Большой коэффициент (скрытый)"
      stdin: "0.02\n"
      expected: "lambda = 0.02\ntrain: loss = 0.419 accuracy = 0.840\ntest: loss = 0.637 accuracy = 0.665\nweight norm = 3.616\n"
      compare: "numeric"
      tolerance: 0.015
      hidden: true
      hint: "Штраф входит в обучаемую потерю, но не в печатаемые train/test loss."
    - id: "huge"
      title: "Очень большой коэффициент (скрытый)"
      stdin: "0.1\n"
      expected: "lambda = 0.1\ntrain: loss = 0.664 accuracy = 0.620\ntest: loss = 0.715 accuracy = 0.515\nweight norm = 0.000\n"
      compare: "numeric"
      tolerance: 0.015
      hidden: true
      hint: "Печатайте норму как корень из суммы квадратов W1 и W2."
