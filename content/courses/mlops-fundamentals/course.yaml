id: mlops-fundamentals
version: 1.0.0
title: "MLOps: основы"
description: >-
  Восемь уроков о жизненном цикле модели, в которых вы по шагу собираете мини-платформу MLOps на стандартной библиотеке Python:
  воспроизводимость (seed, отпечаток конфигурации, разбиение по хешу), журнал экспериментов на файлах, версии данных по хешам
  содержимого, конвейер обучения из шагов с кешем, безопасная сериализация модели и реестр со стадиями и порогом продвижения,
  обслуживание с проверкой входа, пачками и кодами ответа, дрейф данных (PSI и статистика Колмогорова-Смирнова), мониторинг
  качества с отложенными метками, правила тревог и решение о переобучении. Упражнения работают без сети и внешних сервисов и
  проверяются детерминированно; MLflow, DVC, FastAPI, Docker, Kubernetes и Prometheus разобраны в теории с соответствием коду
  курса, но не устанавливаются. Каждый пример теории проверен запуском (Python 3.14).
languageId: python
level: 4
track: mlops
requires: [ml-foundations, python-stdlib]
lessons:
  - 01-reproducibility
  - 02-experiment-tracking
  - 03-data-versioning
  - 04-pipelines-and-caching
  - 05-model-registry
  - 06-model-serving
  - 07-data-drift
  - 08-quality-monitoring-and-alerts
