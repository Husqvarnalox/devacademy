id: "mlops.fundamentals.experiment-tracking"
title: "Трекинг экспериментов: запуски, параметры, метрики по шагам"
goal: "Собрать на файловой системе журнал экспериментов: записывать параметры, теги, метрики по шагам и статус запуска, восстанавливать запуск из файлов, находить лучший запуск и сравнивать два запуска."
difficulty: "medium"
estimatedMinutes: 75
prerequisites: ["mlops.fundamentals.reproducibility"]
related: ["python.stdlib.pathlib-os-shutil-tempfile", "python.stdlib.json-csv-struct"]
next: ["mlops.fundamentals.data-versioning"]
seeAlso:
  - "MLflow Tracking: runs, experiments, artifacts, autologging"
  - "Сравнение запусков в интерфейсе: параллельные координаты, графики метрик по шагам"
  - "Хранение артефактов запуска (веса, графики) отдельно от лёгких метрик"
objectives:
  - "Объяснить, почему таблицы результатов недостаточно, и перечислить, из чего состоит запуск: параметры, метрики по шагам, теги, статус, артефакты."
  - "Записать запуск в каталог на диске (params.json, meta.json, metrics.jsonl) в канонической JSON-форме."
  - "Восстановить запуск из файлов: кривые метрик по шагам и итоговые значения, в том числе при неупорядоченных и повторных шагах."
  - "Выбрать лучший запуск по метрике с учётом статуса и правила разрешения ничьих, сравнить два запуска по параметрам и метрикам."
masteryCriteria:
  - "Ваш start_run создаёт файлы в нужном формате и не перезаписывает существующий запуск."
  - "Ваш log_metric отвергает NaN, бесконечности, bool и некорректные шаги, не оставляя следов в файле."
  - "Ваш load_run сортирует точки по шагу устойчиво и берёт итоговым значением последнюю точку кривой."
  - "Ваш best_run игнорирует незавершённые и упавшие запуски и при равенстве выбирает первый по алфавиту."
  - "Ваш compare_runs показывает только отличающиеся параметры и все метрики из объединения ключей."
tags: ["mlops", "experiment-tracking", "mlflow", "metrics", "jsonl", "run"]
facts:
  - kind: "real-world"
    text: "В MLflow Tracking запуск (run) хранит параметры, метрики с номером шага, теги и артефакты, а запуски группируются в эксперименты. Основные вызовы Python API: mlflow.start_run, mlflow.log_param и log_params, mlflow.log_metric(key, value, step), mlflow.set_tag, mlflow.end_run, mlflow.search_runs. Точный набор возможностей зависит от версии, сверяйтесь с документацией."
    sources: ["https://mlflow.org/docs/latest/tracking/"]
  - kind: "internals"
    text: "Формат JSON Lines (JSONL) хранит по одному JSON-значению на строку, разделяя записи символом перевода строки. Поэтому в конец файла можно дописывать записи, не перечитывая и не переписывая его целиком, а повреждённая последняя строка не портит предыдущие. Этим удобно пользоваться для журналов метрик."
    sources: ["https://jsonlines.org/"]
  - kind: "misconception"
    text: "«Итог запуска - это лучшая метрика за всё обучение». В большинстве трекеров итоговым считается последнее записанное значение, а лучшее за всё время - отдельная агрегация. Если сравнивать запуски по максимуму кривой, можно выбрать модель, которая к концу обучения переобучилась, а в продакшен попадёт именно последний чекпойнт."
  - kind: "performance"
    text: "Метрики по шагам пишутся часто (каждый шаг или несколько раз за эпоху), поэтому форма хранения должна быть дешёвой для записи. Дозапись строки в конец файла стоит почти ничего, а переписывание единого JSON-файла с метриками при каждом шаге растёт вместе с длиной обучения."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Команда ведёт результаты в таблице: строка на модель, столбцы lr, epochs и accuracy. Что в первую очередь теряется по сравнению с журналом запусков?"
      options:
        - "Возможность сортировать модели по accuracy"
        - "Связь результата с точным набором входов запуска (данные, код, конфигурация) и кривая метрики по шагам"
        - "Возможность открыть результаты в редакторе"
        - "Возможность записать число с десятичной точкой"
      answer: 1
      explanation: "Таблица хранит итоговое число, но не то, как оно получено: какие данные и версия кода, как менялась метрика по шагам, завершился ли запуск. Сортировка и запись чисел в таблице работают нормально."
    - id: "q2"
      type: "multiple"
      prompt: "Какие вопросы можно решить, имея только файл metrics.jsonl одного запуска? Выберите все верные варианты."
      options:
        - "На каком шаге val_loss была минимальной"
        - "С каким значением lr запущено обучение"
        - "Каково итоговое значение метрики (последняя точка кривой)"
        - "Завершился ли запуск успешно или упал"
      answer: [0, 2]
      explanation: "По кривой метрики видно лучший шаг и последнее значение. Параметры лежат в params.json, статус - в meta.json: у каждого файла своя роль, поэтому их записывают отдельно."
    - id: "q3"
      type: "single"
      prompt: "В metrics.jsonl для ключа loss есть строки (step=3, value=0.60), а затем (step=3, value=0.58). Что вернёт load_run в metrics[\"loss\"], если больше шагов нет?"
      options:
        - "0.60, потому что запись первой строки нельзя заменить"
        - "0.58, потому что при равных шагах побеждает более поздняя строка"
        - "0.59, среднее двух значений"
        - "Ошибку, потому что шаги повторяются"
      answer: 1
      explanation: "Сортировка по шагу устойчива, поэтому при равных шагах сохраняется порядок строк файла, а итоговым берётся последняя точка. Усреднение или ошибка в условии не предусмотрены: повторный вызов считается уточнением значения."
    - id: "q4"
      type: "single"
      prompt: "Зачем best_run учитывает только запуски со статусом FINISHED?"
      options:
        - "Чтобы не читать лишние файлы с диска"
        - "Упавший или незавершённый запуск мог записать метрику на промежуточном шаге, и она не отражает готовую модель"
        - "Потому что у запуска FAILED нет файла params.json"
        - "Потому что best_run не умеет читать статус RUNNING"
      answer: 1
      explanation: "У упавшего запуска метрики могут быть случайно хорошими на раннем шаге, а модель так и не получена. Файлы у такого запуска есть, и читаются они так же, но выбирать его в «лучшие» нельзя."
    - id: "q5"
      type: "numeric"
      prompt: "Для запуска сделали три корректных вызова log_metric и два вызова с value=float(\"nan\"), которые завершились ValueError. Сколько строк в metrics.jsonl?"
      answer: 3
      tolerance: 0
      explanation: "Проверка значения идёт до записи, поэтому отклонённые вызовы ничего не пишут в файл. В файле остаются три строки от корректных вызовов; NaN не оказывается в журнале и не ломает разбор другими программами."
exercise:
  id: "mlops.fundamentals.experiment-tracking.exercise"
  title: "Журнал экспериментов на файловой системе"
  prompt: |
    В файле `tracking.py` реализуйте журнал запусков. Тесты импортируют модуль и вызывают функции напрямую; ничего не печатайте и не читайте ввод. Функция `canonical_json` уже готова (она такая же, как в предыдущем уроке) и используется для всех записываемых файлов. Файлы пишутся в кодировке UTF-8.

    Запуск - это каталог `root/run_id` с тремя файлами: `params.json` (параметры), `meta.json` (идентификатор, статус, теги) и `metrics.jsonl` (метрики, по одной JSON-строке на запись). Тесты создают временные каталоги в текущей директории.

    1. `start_run(root, run_id, params, tags=None)` создаёт каталог `Path(root) / run_id` (родительские каталоги тоже), записывает `params.json` = `canonical_json(params)` и `meta.json` = `canonical_json({"run_id": run_id, "status": "RUNNING", "tags": tags or {}})`. Возвращает `Path` каталога. Если каталог уже существует, выбросьте `FileExistsError` и не меняйте существующие файлы.
    2. `log_metric(root, run_id, key, value, step)` дописывает в `metrics.jsonl` строку `canonical_json({"key": key, "step": step, "value": value}) + "\n"`. Если каталога запуска нет - `FileNotFoundError`. `step` должен быть целым числом `>= 0` (не `bool`), `value` - конечным `int` или `float` (не `bool`, не `NaN`, не бесконечность); иначе `ValueError`, и в файл ничего не пишется.
    3. `end_run(root, run_id, status)` переписывает `meta.json` с новым статусом, теги сохраняются. Допустимы только `"FINISHED"` и `"FAILED"`, иначе `ValueError`.
    4. `load_run(root, run_id)` возвращает словарь с ключами `run_id`, `status`, `tags`, `params`, `metrics`, `history`. `history[key]` - список пар `[step, value]`, отсортированный по `step`; при равных шагах сохраняется порядок строк файла. `metrics[key]` - значение последней пары из `history[key]`. Если `metrics.jsonl` нет, `metrics` и `history` - пустые словари.
    5. `best_run(root, metric, mode="max")` просматривает каталоги запусков в алфавитном порядке (запуск - каталог с `meta.json`), учитывает только запуски со статусом `FINISHED`, у которых есть метрика `metric`, и возвращает `run_id` с наибольшим (`mode="max"`) или наименьшим (`mode="min"`) значением из `metrics`. При равенстве побеждает первый по алфавиту. Если подходящих запусков нет - `None`. Другое значение `mode` - `ValueError`.
    6. `compare_runs(root, run_a, run_b)` возвращает `{"params": ..., "metrics": ...}`. В `params` попадают только ключи, значения которых различаются, в виде `[значение_a, значение_b]`; отсутствующее значение - `None`. В `metrics` - все ключи из объединения метрик двух запусков в том же виде. Ключи обоих словарей идут в алфавитном порядке.

    **Пример.**

    ```python
    start_run("runs", "a", {"lr": 0.1})        # runs/a/params.json: {"lr":0.1}
    log_metric("runs", "a", "acc", 0.8, 0)     # строка в runs/a/metrics.jsonl: {"key":"acc","step":0,"value":0.8}
    end_run("runs", "a", "FINISHED")
    load_run("runs", "a")["metrics"]           # {'acc': 0.8}
    best_run("runs", "acc")                    # 'a'
    ```
  entryFile: "tracking.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Все функции работают с тремя файлами запуска. Начните с start_run и log_metric: они только пишут, остальные функции только читают то, что записано."
    - "start_run: run_dir = Path(root) / run_id; run_dir.mkdir(parents=True) сам выбрасывает FileExistsError. log_metric: проверки (каталог, step, value) выполняйте до открытия файла в режиме \"a\", чтобы отклонённый вызов ничего не записал."
    - "Проверка значения: isinstance(value, bool) или не isinstance(value, (int, float)) или not math.isfinite(value). load_run: сгруппируйте строки через history.setdefault(key, []).append([step, value]), затем points.sort(key=lambda p: p[0]) - сортировка устойчива."
    - "best_run: for run_dir in sorted(p for p in root.iterdir() if (p / \"meta.json\").is_file()); читайте запуск через load_run, пропускайте не FINISHED и без метрики; обновляйте лучший только при строгом улучшении (value > best для max, value < best для min). compare_runs: sorted(set(a[\"params\"]) | set(b[\"params\"])) и .get(key) для отсутствующих значений."
  tests:
    - id: "start-run-files"
      title: "start_run пишет params.json и meta.json"
      hint: "Файлы в канонической JSON-форме, статус RUNNING, теги по умолчанию - пустой объект."
    - id: "log-metric-lines"
      title: "log_metric дописывает строки в metrics.jsonl"
      hint: "По одной строке canonical_json на вызов, в порядке вызовов, с переводом строки в конце."
    - id: "load-run-history"
      title: "load_run восстанавливает запуск из файлов"
      hint: "history группируется по ключу и сортируется по шагу, metrics - значение последней точки."
    - id: "best-run-basic"
      title: "best_run выбирает запуск с лучшей итоговой метрикой"
      hint: "Сравниваются итоговые значения метрики; без подходящих запусков результат None."
    - id: "run-errors"
      title: "Ошибки: дубликат запуска, неверные значения и статусы (скрытый)"
      hidden: true
      hint: "FileExistsError, FileNotFoundError и ValueError в нужных местах; отклонённый вызов не оставляет следов."
    - id: "status-equal-steps-unicode"
      title: "Статус, равные шаги и кириллица (скрытый)"
      hidden: true
      hint: "end_run сохраняет теги, при равных шагах побеждает более поздняя строка, кириллица читается без искажений."
    - id: "best-run-rules"
      title: "best_run: статусы, ничьи, режим min (скрытый)"
      hidden: true
      hint: "FAILED и RUNNING игнорируются, при равенстве первый по алфавиту, mode=\"min\" и неверный mode."
    - id: "compare-runs"
      title: "compare_runs: отличия параметров и объединение метрик (скрытый)"
      hidden: true
      hint: "В params только отличающиеся ключи, отсутствующее значение - None, ключи по алфавиту."
