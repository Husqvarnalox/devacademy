id: "mlops.fundamentals.data-versioning"
title: "Версионирование данных: хеши содержимого, манифест, кеш объектов"
goal: "Научиться давать набору данных стабильную версию по хешам содержимого: строить манифест каталога, считать версию, находить различия между версиями (включая переименования) и хранить файлы в кеше, адресуемом по содержимому."
difficulty: "medium"
estimatedMinutes: 75
prerequisites: ["mlops.fundamentals.experiment-tracking"]
related: ["python.stdlib.pathlib-os-shutil-tempfile", "devops.fundamentals.build-pipelines-as-dags"]
next: ["mlops.fundamentals.pipelines-and-caching"]
seeAlso:
  - "DVC: файлы .dvc, кеш, удалённое хранилище, команды checkout, push и pull"
  - "Git LFS и другие способы хранить большие файлы рядом с репозиторием"
  - "Версионирование таблиц: форматы озёр данных с историей снимков"
objectives:
  - "Объяснить, почему имена вида data_final_v2.csv не дают версионирования, и что такое адресация по содержимому."
  - "Посчитать SHA-256 файла блоками, не читая файл целиком в память."
  - "Построить манифест каталога (путь - хеш) и вычислить версию набора данных, не зависящую от порядка файлов."
  - "Найти добавленные, удалённые, изменённые и переименованные файлы между двумя манифестами по детерминированным правилам."
  - "Сохранить файл в кеш по хешу так, чтобы одинаковое содержимое хранилось один раз, а повторное сохранение ничего не переписывало."
masteryCriteria:
  - "Ваш file_digest совпадает с эталоном для любого chunk_size."
  - "Ваш build_manifest хранит относительные пути с «/», включает файлы из вложенных каталогов, кириллицу и пустые файлы, а ключи идут по алфавиту."
  - "Ваш dataset_version не зависит от порядка ключей и меняется при изменении содержимого или пути."
  - "Ваш diff_manifests отличает переименование от удаления с добавлением и разрешает совпадения хешей по алфавиту."
  - "Ваш store_object хранит одинаковое содержимое один раз и не перезаписывает существующий объект."
tags: ["mlops", "data-versioning", "dvc", "hashing", "manifest", "content-addressable"]
facts:
  - kind: "real-world"
    text: "DVC (Data Version Control) хранит в репозитории Git маленькие текстовые файлы-указатели (.dvc) с хешем данных, а сами большие файлы кладёт в кеш и при необходимости в удалённое хранилище. Команды dvc add, dvc push, dvc pull и dvc checkout переносят данные между рабочим каталогом, кешем и хранилищем. Алгоритм хеширования и раскладка кеша зависят от версии, подробности см. в документации."
    sources: ["https://dvc.org/doc"]
  - kind: "internals"
    text: "Адресация по содержимому используется и в Git: объекты (blob, tree, commit) хранятся под именем, которое вычисляется как хеш их содержимого, а каталог - это объект, перечисляющий имена и хеши вложенных объектов. Манифест из этого урока устроен так же, но плоский и без вложенности."
    sources: ["https://git-scm.com/book/en/v2/Git-Internals-Git-Objects"]
  - kind: "performance"
    text: "Хеш-функции в hashlib принимают данные частями: метод update можно вызывать много раз, результат тот же, что при хешировании склеенных данных. Поэтому файл любого размера хешируют блоками по несколько десятков килобайт, а память расходуется только на один блок."
    sources: ["https://docs.python.org/3/library/hashlib.html"]
  - kind: "misconception"
    text: "«Дата изменения файла и его размер достаточно показывают, что данные не менялись». Время и размер легко совпадают у разных файлов и меняются у одинаковых (копирование, checkout, перенос между машинами). Идентификатор версии должен вычисляться из содержимого."
  - kind: "security"
    text: "Адресация по содержимому надёжна, пока хеш-функция устойчива к намеренным коллизиям. Для старых функций (MD5, SHA-1) известны способы подобрать два разных файла с одним хешем, поэтому в новых системах предпочитают семейство SHA-2, например SHA-256. Если данные приходят из ненадёжного источника, сверяйте их с заранее известным хешем."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Почему имена файлов вроде data_final_v2_fixed.csv плохо работают как версии?"
      options:
        - "Имена файлов не могут содержать цифры и подчёркивания"
        - "Имя не связано с содержимым: два файла с разными данными могут называться одинаково, а одинаковые данные - по-разному, и проверить это нельзя"
        - "Такие имена не поддерживаются Git"
        - "Файлы с длинными именами нельзя хешировать"
      answer: 1
      explanation: "Имя - договорённость людей, а не свойство данных. Хеш содержимого меняется при любой правке и совпадает у одинаковых данных, поэтому его можно проверить. Ограничений на цифры или длину имени здесь нет."
    - id: "q2"
      type: "multiple"
      prompt: "Что изменит dataset_version из урока? Выберите все верные варианты."
      options:
        - "Переименование файла без изменения содержимого"
        - "Изменение одного байта в одном файле"
        - "Команда touch: время изменения файла обновилось, а содержимое прежнее"
        - "Другой порядок ключей в словаре манифеста"
        - "Добавление в каталог пустого файла"
      answer: [0, 1, 4]
      explanation: "Путь входит в манифест, поэтому переименование меняет версию; любая правка байта меняет хеш файла; новый файл добавляет строку в манифест, даже пустой. Время изменения не участвует, а ключи сортируются перед хешированием."
    - id: "q3"
      type: "single"
      prompt: "Зачем file_digest читает файл блоками по chunk_size байт, а не вызывает read() целиком?"
      options:
        - "Блоки дают другой, более надёжный хеш"
        - "Целиком файл читать нельзя: read() без аргументов запрещён для бинарных файлов"
        - "Память расходуется на один блок, а не на весь файл, при том же результате"
        - "Так хеш считается быстрее в тысячу раз"
      answer: 2
      explanation: "Метод update можно вызывать частями, и итоговый хеш совпадает с хешем всего содержимого. Файл на десятки гигабайт при чтении целиком не поместится в память. Скорость от размера блока почти не зависит."
    - id: "q4"
      type: "single"
      prompt: "Файл raw/a.csv переименовали в clean/a.csv, не меняя содержимого. Как это покажет diff_manifests?"
      options:
        - "raw/a.csv попадёт в removed, clean/a.csv - в added"
        - "Пара [\"raw/a.csv\", \"clean/a.csv\"] попадёт в renamed и не попадёт в added и removed"
        - "Оба пути попадут в modified"
        - "Различий не будет, так как хеш совпал"
      answer: 1
      explanation: "Удалённый и добавленный пути с одним хешем образуют переименование. Раздельное удаление и добавление было бы верным, если бы хеш изменился. Вариант «различий не будет» неверен: путь входит в манифест, и версия набора поменяется."
    - id: "q5"
      type: "numeric"
      prompt: "В каталоге шесть файлов: два с одинаковым содержимым A, три с одинаковым содержимым B и один с содержимым C. Сколько объектов окажется в кеше после store_object для каждого файла?"
      answer: 3
      tolerance: 0
      explanation: "Объект в кеше определяется только хешем содержимого: A, B и C дают три объекта, а повторные вызовы для копий ничего нового не создают. В манифесте при этом остаются все шесть путей."
exercise:
  id: "mlops.fundamentals.data-versioning.exercise"
  title: "Манифест, версия и кеш объектов"
  prompt: |
    В файле `dataver.py` реализуйте пять функций версионирования данных. Тесты импортируют модуль и вызывают функции напрямую; ничего не печатайте и не читайте ввод. Файлы тестов создаются во временных каталогах в текущей директории. Используйте только стандартную библиотеку (`hashlib`, `pathlib`, `shutil`).

    1. `file_digest(path, chunk_size=65536)` возвращает SHA-256 содержимого файла в шестнадцатеричном виде. Файл читается в бинарном режиме блоками по `chunk_size` байт, а не целиком, - результат от размера блока не зависит.
    2. `build_manifest(root)` возвращает словарь `{относительный путь: хеш}` для всех обычных файлов в `root` и во вложенных каталогах. Путь записывается через `Path.relative_to(root).as_posix()` (например, `"sub/a.csv"`), пустые каталоги не входят, ключи идут в алфавитном порядке. Пустой каталог даёт `{}`.
    3. `dataset_version(manifest)` возвращает первые 12 символов `hexdigest()` от SHA-256 строки `"".join(f"{digest}  {path}\n" for path, digest in sorted(manifest.items()))` в UTF-8 (между хешем и путём два пробела, как в `sha256sum`). Для пустого манифеста это SHA-256 пустой строки, обрезанный до 12 символов.
    4. `diff_manifests(old, new)` возвращает словарь `{"added": [...], "removed": [...], "modified": [...], "renamed": [[старый_путь, новый_путь], ...]}`. `modified` - путь есть в обоих манифестах, хеш разный. Удалённый и добавленный путь с одним хешем образуют переименование и в `added` и `removed` не попадают. Если удалённых и добавленных путей с одним хешем несколько, i-й удалённый (по алфавиту) связывается с i-м добавленным (по алфавиту), лишние остаются в `removed` или `added`. Все списки отсортированы, `renamed` - по старому пути.
    5. `store_object(cache_dir, path)` копирует файл в кеш `Path(cache_dir) / digest[:2] / digest[2:]`, где `digest` - хеш файла, создавая каталоги. Если объект уже существует, он не перезаписывается. Возвращает `digest`.

    **Пример.**

    ```python
    file_digest("a.txt")                      # 'ba7816bf...' для содержимого b"abc"
    build_manifest("data")                    # {'labels.txt': '82c1...', 'raw/train.csv': '8fe2...'}
    dataset_version({"a": "h1"})              # 12 символов, зависит от хеша и пути
    diff_manifests({"a": "h1", "b": "h2"}, {"c": "h1", "b": "h3"})
    # {'added': [], 'removed': [], 'modified': ['b'], 'renamed': [['a', 'c']]}
    store_object("cache", "a.txt")            # кладёт файл в cache/ba/7816bf... и возвращает хеш
    ```
  entryFile: "dataver.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Начните с file_digest: остальные функции опираются на него. Создайте hashlib.sha256(), откройте файл через open(path, \"rb\") и подавайте блоки в update, пока read не вернёт пустые байты."
    - "build_manifest: root.rglob(\"*\") обходит всё дерево, фильтр path.is_file() оставляет только файлы; в конце верните dict(sorted(entries.items())). dataset_version: склейте строки f\"{digest}  {path}\\n\" по sorted(manifest.items()) и возьмите [:12]."
    - "diff_manifests: added = sorted(set(new) - set(old)), removed - наоборот, modified - общие пути с разным хешем. Для переименований сгруппируйте removed и added по хешу (словарь хеш -> список путей) и свяжите пары через zip."
    - "После zip соберите множества старых и новых путей из пар и исключите их из added и removed. store_object: target = Path(cache_dir) / digest[:2] / digest[2:]; if not target.exists(): target.parent.mkdir(parents=True, exist_ok=True); shutil.copyfile(path, target)."
  tests:
    - id: "file-digest"
      title: "file_digest: SHA-256 содержимого при любом chunk_size"
      hint: "Хеш всех байтов файла, включая пустой; размер блока не влияет на результат."
    - id: "manifest-basic"
      title: "build_manifest: вложенные каталоги и порядок ключей"
      hint: "Относительные пути с «/», только файлы, ключи по алфавиту, пустой каталог даёт {}."
    - id: "dataset-version"
      title: "dataset_version: формат, эталон и чувствительность"
      hint: "12 шестнадцатеричных символов; не зависит от порядка ключей, меняется при смене хеша или пути."
    - id: "diff-basic"
      title: "diff_manifests: added, removed, modified"
      hint: "Разность множеств путей и общие пути с разными хешами; списки отсортированы."
    - id: "diff-renames"
      title: "Переименования и совпадающие хеши (скрытый)"
      hidden: true
      hint: "Пара removed + added с одним хешем - переименование; несколько кандидатов связываются по алфавиту, переименование с правкой - это removed и added."
    - id: "manifest-unicode-duplicates"
      title: "Кириллица, дубликаты и пустые файлы в манифесте (скрытый)"
      hidden: true
      hint: "Одинаковые файлы в разных местах остаются в манифесте оба; пустые файлы входят, пустые каталоги нет."
    - id: "store-object-layout"
      title: "store_object: раскладка и одинаковое содержимое (скрытый)"
      hidden: true
      hint: "Путь cache/d[:2]/d[2:], содержимое совпадает с исходным, дубликаты хранятся один раз, исходный файл остаётся."
    - id: "store-object-idempotent"
      title: "store_object не перезаписывает существующий объект (скрытый)"
      hidden: true
      hint: "Повторный вызов возвращает тот же хеш и не меняет время изменения файла в кеше."
