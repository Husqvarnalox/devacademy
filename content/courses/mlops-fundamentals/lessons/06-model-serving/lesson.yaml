id: "mlops.fundamentals.model-serving"
title: "Обслуживание модели: схема входа, пачки и коды ответа"
goal: "Написать логику онлайн-сервиса предсказаний без веб-сервера: проверять входные строки по схеме, считать предсказание без переполнения, обрабатывать запрос пачками и отвечать правильными кодами 200, 400 и 413."
difficulty: "medium"
estimatedMinutes: 75
prerequisites: ["mlops.fundamentals.model-registry"]
related: ["fastapi.fundamentals.errors-and-status-codes", "fastapi.fundamentals.pydantic-models", "devops.fundamentals.containers-and-layers", "devops.fundamentals.deployment-strategies"]
next: ["mlops.fundamentals.data-drift"]
seeAlso:
  - "Серверы обслуживания моделей (BentoML, TorchServe, KServe): динамическое формирование пачек и многомодельные сервисы"
  - "Хранилища признаков (feature stores) как способ дать обучению и сервису один код признаков"
  - "Формат ответа с калибровкой вероятностей и объяснениями предсказаний"
objectives:
  - "Различать онлайн- и пакетный вывод и называть, какие требования к каждому предъявляются."
  - "Описать контракт сервиса (версия модели, схема признаков) и объяснить, почему вход проверяется на границе."
  - "Реализовать проверку строки по схеме с детерминированным списком ошибок, включая bool, NaN и лишние поля."
  - "Посчитать вероятность логистической модели без OverflowError и сравнить её с порогом."
  - "Обработать запрос пачками и вернуть пару «статус, тело» с кодами 200, 400 и 413."
masteryCriteria:
  - "Ваша validate_row возвращает ошибки в порядке «признаки схемы по алфавиту, затем лишние ключи» и отвергает bool, NaN и бесконечности."
  - "Ваша predict_one не падает при |z| порядка 1000 и считает label по нерундированной вероятности (при p == threshold класс 1)."
  - "Ваша predict_batch даёт верное число пачек на границах (64 строки по 32 - 2 пачки, 65 - 3, пустой список - 0), сохраняет сквозные индексы и не теряет корректные строки из-за плохих."
  - "Ваша handle_request различает неверный JSON, неверную форму (400), превышение лимита (413) и допустимый пустой список."
tags: ["mlops", "serving", "inference", "validation", "batching", "http-status"]
facts:
  - kind: "internals"
    text: "Функция json.loads в Python по умолчанию принимает нестандартные литералы NaN, Infinity и -Infinity и возвращает соответствующие значения float. Поэтому JSON-тело от клиента может принести NaN, а обычная проверка диапазона его пропустит: любое сравнение с NaN ложно. Отсечь такое значение можно через math.isfinite или параметр parse_constant."
    sources: ["https://docs.python.org/3/library/json.html#json.load"]
  - kind: "internals"
    text: "Функция math.exp выбрасывает OverflowError, когда результат не помещается в float: для аргументов выше примерно 709.78. Поэтому сигмоиду 1 / (1 + exp(-z)) нельзя считать «в лоб» при сильно отрицательном z; обычный приём - выбрать формулу в зависимости от знака z."
    sources: ["https://docs.python.org/3/library/math.html#math.exp"]
  - kind: "real-world"
    text: "Перекос обучения и обслуживания (training-serving skew) - частая причина того, что модель в продакшене работает хуже, чем на тесте. Руководство Google по практике машинного обучения выделяет его как отдельную проблему и советует измерять расхождение между обучением и обслуживанием, а не искать его по косвенным признакам."
    sources: ["https://developers.google.com/machine-learning/guides/rules-of-ml"]
  - kind: "real-world"
    text: "Код 413 в современной редакции стандарта HTTP называется «Content Too Large» (в более старых документах - «Payload Too Large» или «Request Entity Too Large»). Он означает, что сервер отказывается обрабатывать запрос из-за слишком большого тела; ограничивать размер запроса к сервису с моделью имеет смысл, чтобы один клиент не занимал память и вычислительные ресурсы."
    sources: ["https://www.rfc-editor.org/rfc/rfc9110#name-413-content-too-large"]
  - kind: "misconception"
    text: "«Если модель хорошо обучена, проверять вход не нужно». Модель - это функция, которая вернёт число для любого входа в допустимых типах. Возраст 4000 или доход в других единицах не вызовут ошибку, а дадут уверенно выглядящий ответ. Единственное место, где такие данные можно остановить, - проверка на границе сервиса."
  - kind: "performance"
    text: "Пачки обычно ускоряют вычисление на процессоре и особенно на видеокарте: одна большая матричная операция выполняется эффективнее множества маленьких. Но размер пачки - компромисс: пока пачка заполняется, растёт задержка первых запросов, а память и время худшей строки растут вместе с размером. Оптимальное значение подбирают измерением на реальной модели и нагрузке."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Почему входные данные сервиса предсказаний проверяют на границе, а не надеются, что модель «сама заметит» ошибку?"
      options:
        - "Модель вернёт число для любого входа, поэтому ошибка в данных не станет ошибкой программы, а даст уверенно выглядящее предсказание"
        - "Модель всегда выбрасывает исключение при нарушении схемы, но оно замедляет сервис"
        - "Проверка нужна только для защиты от взлома и не влияет на качество ответов"
        - "Сигмоида умеет определять, что признак вне диапазона обучающих данных"
      answer: 0
      explanation: "Линейная модель и сигмоида определены для любых чисел: возраст 4000 даст вероятность близко к 1 без единой ошибки. Исключения она не выбросит, а сигмоида ничего не знает об обучающем диапазоне. Защита от взлома - лишь часть пользы, главное - не выдать бессмысленное предсказание."
    - id: "q2"
      type: "multiple"
      prompt: "Что может привести к перекосу обучения и обслуживания (training-serving skew)? Выберите все верные варианты."
      options:
        - "В обучении доход считался в рублях, а сервис получает его в тысячах рублей"
        - "Подготовку признаков для сервиса переписали заново отдельно от кода обучения"
        - "В сервисе категории кодируются в другом порядке, чем при обучении"
        - "В ответ сервиса добавили поле с версией модели"
      answer: [0, 1, 2]
      explanation: "Перекос возникает, когда на входе модели оказываются не те значения, на которых она училась: другие единицы, отдельная реализация или другой порядок кодирования. Добавление версии модели в ответ данные не меняет, наоборот, оно помогает искать причину расхождений."
    - id: "q3"
      type: "numeric"
      prompt: "Запрос содержит 130 объектов, max_batch_size = 32. Сколько пачек обработает predict_batch?"
      answer: 5
      tolerance: 0
      explanation: "Четыре полные пачки покрывают 128 объектов, ещё 2 объекта идут в пятую, неполную пачку. Число пачек - деление с округлением вверх: ceil(130 / 32) = 5. Если округлить вниз, получится 4, и два последних объекта останутся необработанными."
    - id: "q4"
      type: "single"
      prompt: "Клиент отправил корректный JSON с 150 объектами в instances, а max_instances = 100. Какой статус вернёт handle_request?"
      options:
        - "200: обработаем первые 100 объектов и молча отбросим остальные"
        - "400: клиент нарушил формат запроса"
        - "413: запрос разобран и корректен по форме, но слишком велик"
        - "500: сервис не справился"
      answer: 2
      explanation: "Форма запроса правильная, нарушен лимит размера - для этого предназначен 413. Код 400 говорит о том, что запрос нельзя разобрать или он нарушает формат. Молчаливая обрезка до 200 скрыла бы потерю данных, а 500 означает ошибку сервера, которой здесь нет."
    - id: "q5"
      type: "single"
      prompt: "Почему validate_row проверяет isinstance(value, bool) до проверки на int и float?"
      options:
        - "Потому что bool работает медленнее, чем int"
        - "Потому что bool в Python - подкласс int, и True прошло бы проверку на число как значение 1"
        - "Потому что json.loads никогда не возвращает bool"
        - "Потому что bool нельзя сравнивать с границами min и max"
      answer: 1
      explanation: "isinstance(True, int) возвращает True, поэтому без отдельной проверки логический признак молча стал бы числом 1 и дошёл до модели. Скорость тут ни при чём, а json.loads для true и false как раз возвращает bool; сравнивать их с границами Python умеет, и именно это скрывает ошибку."
exercise:
  id: "mlops.fundamentals.model-serving.exercise"
  title: "Логика сервиса предсказаний"
  prompt: |
    В файле `serving.py` реализуйте четыре функции. Тесты импортируют модуль и вызывают их напрямую; ничего не печатайте и не читайте ввод. Веб-сервер не нужен: `handle_request` получает сырое тело запроса и возвращает пару `(статус, ответ)`.

    **Данные.** Модель - словарь `{"name": str, "version": int, "features": [str], "weights": [float], "bias": float, "threshold": float}`. Схема - словарь `{признак: {"min": число или None, "max": число или None}}`; `None` означает «границы нет», границы включаются в допустимый диапазон.

    1. `validate_row(row, schema)` возвращает список строк-ошибок; пустой список - строка корректна. Если `row` не словарь, результат `["row: expected object"]`. Иначе для каждого признака из `sorted(schema)` добавляется не более одной ошибки: нет ключа - `"<признак>: missing"`; значение не `int`/`float` или это `bool` - `"<признак>: expected number"`; `NaN` или бесконечность - `"<признак>: expected finite number"`; ниже `min` или выше `max` - `"<признак>: out of range"`. После этого для каждого ключа строки, которого нет в схеме, в алфавитном порядке - `"<ключ>: unknown field"`.
    2. `predict_one(model, row)` (строка уже проверена) считает `z = bias + сумма(weight * row[feature])` и вероятность `p = 1 / (1 + exp(-z))` так, чтобы при любом большом `|z|` не было `OverflowError`. Возвращает `{"score": round(p, 6), "label": 1 if p >= threshold else 0}`; класс определяется по нерундированному `p`.
    3. `predict_batch(model, schema, rows, max_batch_size)`: при `max_batch_size < 1` - `ValueError`. Строки обрабатываются пачками по `max_batch_size`. Результат: `{"model": "<name>:<version>", "batches": число пачек (для пустого списка 0), "results": [...]}`, где каждый элемент - `{"index": i, "ok": True, "score": ..., "label": ...}` или `{"index": i, "ok": False, "errors": [...]}`. Индекс сквозной по всему списку. Плохая строка не мешает остальным.
    4. `handle_request(model, schema, body, max_instances=100, max_batch_size=32)`: `body` - строка (тело HTTP-запроса). Неверный JSON - `(400, {"error": "invalid json"})`. Если это не объект с ключом `"instances"`, значением которого является список, - `(400, {"error": "expected {\"instances\": [...]}"})`. Если элементов больше `max_instances` - `(413, {"error": "too many instances", "limit": max_instances})`. Иначе `(200, predict_batch(...))`; пустой список - допустимый запрос.

    **Пример.**

    ```python
    model = {"name": "churn", "version": 3, "features": ["age", "income_k"],
             "weights": [0.04, 0.02], "bias": -3.0, "threshold": 0.5}
    schema = {"age": {"min": 18, "max": 100}, "income_k": {"min": 0, "max": None}}

    validate_row({"age": 10, "income_k": 5, "x": 1}, schema)    # ['age: out of range', 'x: unknown field']
    predict_one(model, {"age": 40, "income_k": 50})             # {'score': 0.401312, 'label': 0}
    predict_batch(model, schema, [{"age": 60, "income_k": 80}, {"age": 30}], 1)
    # {'model': 'churn:3', 'batches': 2, 'results': [
    #   {'index': 0, 'ok': True, 'score': 0.731059, 'label': 1},
    #   {'index': 1, 'ok': False, 'errors': ['income_k: missing']}]}
    handle_request(model, schema, '[1]')                        # (400, {'error': 'expected {"instances": [...]}'})
    handle_request(model, schema, '{"instances": [1, 2, 3]}', max_instances=2)
    # (413, {'error': 'too many instances', 'limit': 2})
    ```
  entryFile: "serving.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Начните с validate_row: это один цикл по признакам схемы и один цикл по лишним ключам. Остальные функции опираются на неё и на predict_one."
    - "В validate_row порядок проверок для одного признака такой: нет ключа, не число (в том числе bool), не конечное число, вне диапазона. После первой найденной ошибки переходите к следующему признаку. Лишние ключи: sorted(k for k in row if k not in schema)."
    - "Для predict_one выберите формулу по знаку z: при z >= 0 берите 1 / (1 + math.exp(-z)), иначе e / (1 + e), где e = math.exp(z). Число пачек в predict_batch - деление с округлением вверх: -(-len(rows) // max_batch_size). Для handle_request json.JSONDecodeError является подклассом ValueError."
    - "Скелет handle_request: try: payload = json.loads(body) / except ValueError: return 400, ...; затем if not isinstance(payload, dict) or not isinstance(payload.get(\"instances\"), list): return 400, ...; затем проверка len(...) > max_instances и return 200, predict_batch(...)."
  tests:
    - id: "validate-basic"
      title: "Проверка строки: missing, тип, диапазон, лишние поля"
      hint: "Ошибки идут в алфавитном порядке признаков, затем лишние ключи; не-словарь даёт одну ошибку."
    - id: "predict-one"
      title: "Предсказание совпадает с эталоном"
      hint: "z = bias + сумма weight * значение, затем сигмоида; score округляется до 6 знаков."
    - id: "batch-basic"
      title: "Пачки: число пачек, индексы, плохая строка не ломает остальные"
      hint: "Для каждой строки ровно один элемент results с её сквозным индексом."
    - id: "request-statuses"
      title: "Коды 200, 400 и 413"
      hint: "Неверный JSON и неверная форма - 400, слишком много объектов - 413."
    - id: "validate-edges"
      title: "bool, NaN, бесконечность, границы и None (скрытый)"
      hidden: true
      hint: "bool не число; NaN и inf - отдельная ошибка; границы включительно; None означает отсутствие границы."
    - id: "predict-extremes"
      title: "Большой |z| и равенство порогу (скрытый)"
      hidden: true
      hint: "Сигмоида не должна падать при |z| порядка 1000; при p == threshold класс 1; сравнение до округления."
    - id: "batch-boundaries"
      title: "Границы размера пачки и пустой список (скрытый)"
      hidden: true
      hint: "64 строки по 32 - 2 пачки, 65 - 3, пустой список - 0, max_batch_size < 1 - ValueError."
    - id: "request-edges"
      title: "Пустой instances, лимиты и NaN в теле (скрытый)"
      hidden: true
      hint: "Ровно max_instances ещё допустимо; пустой список - 200; значения по умолчанию 100 и 32; NaN в JSON попадает в ошибки строки."
