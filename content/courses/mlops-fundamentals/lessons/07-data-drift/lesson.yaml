id: "mlops.fundamentals.data-drift"
title: "Дрейф данных: PSI, статистика Колмогорова-Смирнова и отчёт по признакам"
goal: "Научиться сравнивать текущие данные сервиса с эталонной выборкой: считать PSI по квантильным бинам и статистику Колмогорова-Смирнова и собирать из них отчёт по признакам со статусами ok, warn, alert и missing."
difficulty: "medium"
estimatedMinutes: 75
prerequisites: ["mlops.fundamentals.model-serving"]
related: ["devops.fundamentals.observability-and-slos"]
next: ["mlops.fundamentals.quality-monitoring-and-alerts"]
seeAlso:
  - "Библиотеки мониторинга данных и моделей: Evidently, whylogs, NannyML"
  - "Дрейф категориальных признаков и многомерный дрейф"
  - "Оценка качества модели без меток по косвенным признакам"
objectives:
  - "Различать дрейф данных P(x), дрейф меток P(y) и дрейф концепции P(y | x) и объяснять, почему дрейф входов служит ранним сигналом."
  - "Строить границы бинов по квантилям эталона и считать доли значений по бинам."
  - "Вычислять PSI с нижним порогом доли eps и объяснять смысл порогов 0.1 и 0.25 как отраслевого соглашения."
  - "Вычислять статистику Колмогорова-Смирнова как наибольший зазор между эмпирическими функциями распределения."
  - "Собирать отчёт по признакам с отдельным статусом для пропавших данных."
masteryCriteria:
  - "Ваша quantile_edges даёт границы s[i * n // bins], а bin_fractions относит число, равное границе, в правый бин."
  - "Ваша psi совпадает с эталоном с точностью 1e-9, равна нулю для одинаковых выборок и не падает на пустых бинах и повторяющихся границах."
  - "Ваша ks_statistic симметрична, учитывает повторы и разные размеры выборок и проверяет пустые входы."
  - "Ваша drift_report возвращает признаки в алфавитном порядке, помечает отсутствующие и пустые как missing и применяет пороги psi_warn и psi_alert."
tags: ["mlops", "data-drift", "psi", "kolmogorov-smirnov", "monitoring", "quantiles"]
facts:
  - kind: "internals"
    text: "Функция bisect.bisect_right возвращает позицию вставки справа от всех элементов, равных искомому. Поэтому число, совпадающее с границей бина, попадает в правый бин, а при повторяющихся границах - в последний из бинов с такой границей. На этом поведении держится и подсчёт долей по бинам в уроке, и подсчёт эмпирической функции распределения как bisect_right(sorted, x) / n."
    sources: ["https://docs.python.org/3/library/bisect.html#bisect.bisect_right"]
  - kind: "internals"
    text: "Функция scipy.stats.ks_2samp возвращает две величины: статистику (наибольший зазор между эмпирическими функциями распределения двух выборок) и p-value. Статистика лежит от 0 до 1, а p-value при росте выборок падает даже для небольших различий."
    sources: ["https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.ks_2samp.html"]
  - kind: "real-world"
    text: "Пороги PSI 0.1 и 0.25 в мониторинге моделей используются как отраслевое соглашение, которое, по распространённой версии, пришло из практики кредитного скоринга. Они не выводятся из статистической теории: подходящие значения зависят от числа бинов, размера выборки и цены ошибки, поэтому на практике их калибруют на собственных данных."
  - kind: "real-world"
    text: "Для мониторинга данных и моделей существуют открытые библиотеки, например Evidently, whylogs и NannyML. Они предоставляют готовые метрики дрейфа, отчёты и профили данных; набор метрик и пороги по умолчанию различаются между инструментами и версиями, поэтому перед использованием стоит сверяться с документацией."
    sources: ["https://docs.evidentlyai.com/", "https://whylogs.readthedocs.io/", "https://nannyml.readthedocs.io/"]
  - kind: "misconception"
    text: "«Высокий PSI означает, что модель испортилась». PSI измеряет изменение распределения входных данных, а не качество предсказаний. Модель может справляться с новым распределением, а дрейф концепции (изменение связи входов и ответа) при низком PSI вообще не виден. Сигнал дрейфа - повод проверить качество, а не доказательство падения."
  - kind: "performance"
    text: "Вычисление PSI и KS на выборках в миллионы значений дорого из-за сортировки. На практике дрейф считают по окнам ограниченного размера или по предварительно рассчитанным гистограммам эталона, а для эталонной выборки границы бинов вычисляют один раз и сохраняют."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Банк обновил рекламу, и в приложение пришли более молодые клиенты с меньшим доходом. При этом у клиентов с данным доходом и возрастом вероятность дефолта осталась прежней. Что произошло?"
      options:
        - "Дрейф данных (covariate drift): изменилось P(x), а P(y | x) осталось прежним"
        - "Дрейф концепции: изменилось P(y | x)"
        - "Дрейф меток без изменения входов: изменилось только P(y)"
        - "Дрейфа нет: модель просто стала хуже"
      answer: 0
      explanation: "Изменилось распределение входов P(x), а правило, по которому вход определяет ответ, осталось тем же - это дрейф данных. Дрейф концепции означал бы, что для тех же клиентов вероятность дефолта изменилась. Доля дефолтов в целом может измениться как следствие, но причина в изменении входов."
    - id: "q2"
      type: "multiple"
      prompt: "Какие утверждения о PSI из урока верны? Выберите все верные варианты."
      options:
        - "Пороги 0.1 и 0.25 - отраслевое соглашение, а не статистический закон"
        - "На малых выборках PSI может быть заметно больше нуля даже без дрейфа"
        - "PSI больше 0.25 доказывает, что качество модели упало"
        - "Границы бинов строятся по эталону, поэтому psi(A, B) и psi(B, A) в общем случае различаются"
      answer: [0, 1, 3]
      explanation: "Пороги условны, шум на малых окнах даёт ненулевой PSI (в примере 0.19 при n = 100), а границы берутся из первого аргумента, поэтому функция несимметрична. Утверждение про качество неверно: PSI измеряет изменение входов, а качество зависит ещё и от того, насколько модель устойчива к этому изменению."
    - id: "q3"
      type: "numeric"
      prompt: "В эталоне доли по двум бинам [0.5, 0.5], в текущей выборке [0.8, 0.2]. Чему равен PSI = сумма (a - e) * ln(a / e)? Ответ округлите до сотых."
      answer: 0.42
      tolerance: 0.01
      explanation: "Первый бин: 0.3 * ln(1.6) = 0.1410. Второй бин: (-0.3) * ln(0.4) = 0.2749, это тоже положительное число, потому что и разность, и логарифм отрицательны. Сумма 0.4159, то есть 0.42. Если забыть вторую часть или поставить знак минус, получится 0.14 или отрицательное значение, а PSI не бывает меньше нуля."
    - id: "q4"
      type: "single"
      prompt: "Почему для мониторинга дрейфа на выборках в миллионы значений опасно ориентироваться только на p-value критерия Колмогорова-Смирнова?"
      options:
        - "p-value нельзя вычислить для больших выборок"
        - "На больших выборках p-value становится ничтожным даже для практически неважного сдвига: он отвечает на вопрос «есть ли различие», а не «насколько оно велико»"
        - "p-value зависит от порядка выборок, поэтому его нельзя сравнивать между днями"
        - "KS нечувствителен к сдвигу среднего"
      answer: 1
      explanation: "Размер выборки напрямую входит в расчёт p-value: чем больше данных, тем меньше различие считается «случайным». Поэтому следят за размером эффекта (значения KS и PSI) и порогом, выбранным под задачу. Вычислить p-value можно, порядок выборок на него не влияет, а KS как раз чувствителен к сдвигу."
    - id: "q5"
      type: "single"
      prompt: "Почему дрейф входных признаков называют ранним сигналом?"
      options:
        - "Потому что метки (правильные ответы) часто приходят с задержкой, а входные данные известны сразу, в момент запроса"
        - "Потому что дрейф входов всегда предшествует падению качества"
        - "Потому что для расчёта PSI не нужна эталонная выборка"
        - "Потому что дрейф входов можно измерить только в обучающей выборке"
      answer: 0
      explanation: "Качество нельзя посчитать, пока нет меток, а входы доступны немедленно. Это делает дрейф входов быстрым индикатором, но не гарантией: падение качества не обязано следовать за дрейфом, а эталонная выборка для PSI как раз нужна."
exercise:
  id: "mlops.fundamentals.data-drift.exercise"
  title: "Сравнение текущих данных с эталоном"
  prompt: |
    В файле `drift.py` реализуйте пять функций. Тесты импортируют модуль и вызывают функции напрямую; ничего не печатайте и не читайте ввод. Модули `bisect` и `math` уже импортированы.

    1. `quantile_edges(reference, bins)`: при `bins < 2` или пустой `reference` - `ValueError`. Иначе `s = sorted(reference)`, `n = len(s)`, результат `[s[(i * n) // bins] for i in range(1, bins)]`. Переданный список менять нельзя.
    2. `bin_fractions(values, edges)`: бинов `len(edges) + 1`; номер бина числа `x` - `bisect.bisect_right(edges, x)`. Возвращает список долей `количество / len(values)`; для пустого `values` - список нулей нужной длины.
    3. `psi(reference, current, bins=10, eps=1e-4)`: границы строятся по `reference`; доли `e_i` (эталон) и `a_i` (текущая выборка) ограничиваются снизу значением `eps`; результат `сумма((a_i - e_i) * ln(a_i / e_i))`. Пустая `current` - `ValueError`.
    4. `ks_statistic(a, b)`: `max |F_a(x) - F_b(x)|` по всем `x` из `sorted(set(a) | set(b))`, где `F(x) = bisect_right(отсортированная выборка, x) / длина`. Если хотя бы одна выборка пуста - `ValueError`.
    5. `drift_report(reference, current, bins=10, psi_warn=0.1, psi_alert=0.25)`: `reference` и `current` - словари «признак -> список чисел». Для каждого признака из `sorted(reference)`: если его нет в `current` или список пуст - `{"feature": f, "psi": None, "ks": None, "status": "missing"}`; иначе `{"feature": f, "psi": round(psi, 4), "ks": round(ks, 4), "status": ...}`, где статус `"ok"` при `psi < psi_warn`, `"warn"` при `psi < psi_alert`, иначе `"alert"` (по неокруглённому PSI). Признаки, которых нет в `reference`, игнорируются. Возвращает список.

    **Пример.**

    ```python
    quantile_edges([5, 1, 4, 2, 3, 0], 3)               # [2, 4]
    bin_fractions([1, 2, 3, 4, 5, 6], [2, 4])           # [1/6, 2/6, 3/6]: значение 2 уходит в правый бин
    ks_statistic([1, 2, 3, 4], [3, 4, 5, 6])            # 0.5
    ref = {"age": [1, 2, 3, 4, 5, 6, 7, 8], "inc": [1, 2, 3, 4, 5, 6, 7, 8]}
    cur = {"age": [1, 2, 3, 4, 5, 6, 7, 8], "inc": [7, 8, 9, 9, 9, 9, 10, 11]}
    drift_report(ref, cur, bins=4)
    # [{'feature': 'age', 'psi': 0.0, 'ks': 0.0, 'status': 'ok'},
    #  {'feature': 'inc', 'psi': 6.9054, 'ks': 0.75, 'status': 'alert'}]
    ```
  entryFile: "drift.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Функции строятся друг на друге: границы, затем доли по бинам, затем PSI. KS и отчёт опираются на готовые части. Начните с quantile_edges и bin_fractions."
    - "bin_fractions: заведите counts = [0] * (len(edges) + 1) и для каждого x увеличивайте counts[bisect.bisect_right(edges, x)]. В psi используйте max(доля, eps) для каждой доли до логарифма."
    - "ks_statistic: отсортируйте обе выборки один раз; для каждого x из sorted(set(a) | set(b)) разность долей bisect.bisect_right(sa, x) / len(sa) и bisect.bisect_right(sb, x) / len(sb) по модулю, затем максимум."
    - "drift_report: for feature in sorted(reference): cur = current.get(feature); if not cur: добавить строку со статусом missing и continue; иначе p = psi(reference[feature], cur, bins), k = ks_statistic(...), статус вычисляйте по p, а не по округлённому значению."
  tests:
    - id: "edges-and-fractions"
      title: "Границы по квантилям и доли по бинам"
      hint: "Границы - s[i * n // bins] после сортировки; значение, равное границе, попадает в правый бин."
    - id: "psi-basic"
      title: "PSI: ноль для одинаковых выборок, совпадение с эталоном"
      hint: "Доли эталона и текущей выборки по бинам эталона, сумма (a - e) * ln(a / e); пустые бины заменяются на eps."
    - id: "ks-basic"
      title: "KS: максимальный зазор между функциями распределения"
      hint: "Перебор x из объединения значений; F(x) - доля значений не больше x."
    - id: "report-basic"
      title: "Отчёт по признакам: порядок, округление, статусы"
      hint: "Признаки по алфавиту; psi и ks округляются до 4 знаков; статус по шкале ok, warn, alert."
    - id: "edges-validation"
      title: "Проверка bins и пустой выборки, повторы в эталоне (скрытый)"
      hidden: true
      hint: "bins < 2 и пустой эталон - ValueError; повторяющиеся значения дают повторяющиеся границы; входной список не меняется."
    - id: "psi-edges"
      title: "Пустые бины, значения за пределами эталона, пустая выборка (скрытый)"
      hidden: true
      hint: "Долю бина с нулём заменяйте на eps; текущие значения правее эталона попадают в последний бин; пустая текущая выборка - ValueError."
    - id: "ks-edges"
      title: "Повторы, разные размеры, симметрия, пустые входы (скрытый)"
      hidden: true
      hint: "Значение с повторами учитывайте целиком (bisect_right); статистика симметрична; пустая выборка - ValueError."
    - id: "report-missing-and-thresholds"
      title: "Пропавшие признаки и границы порогов (скрытый)"
      hidden: true
      hint: "Нет признака или пустой список - missing; статус по неокруглённому psi; лишние признаки current игнорируются."
