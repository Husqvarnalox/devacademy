id: "mlops.fundamentals.quality-monitoring-and-alerts"
title: "Мониторинг качества, правила тревог и решение о переобучении"
goal: "Собрать финальный блок мини-платформы: считать точность по окнам времени при запоздавших метках, вычислять правило тревоги с условием «N окон подряд» и принимать решение о переобучении по дрейфу и качеству."
difficulty: "hard"
estimatedMinutes: 90
prerequisites: ["mlops.fundamentals.data-drift"]
related: ["devops.fundamentals.observability-and-slos", "devops.fundamentals.deployment-strategies", "mlops.fundamentals.pipelines-and-caching", "mlops.fundamentals.model-registry"]
next: []
seeAlso:
  - "Гистерезис в правилах тревог: разные пороги включения и выключения"
  - "Оценка качества без меток по косвенным признакам (например, подходы вроде оценки производительности по распределению входов)"
  - "Онлайн A/B-тесты моделей и статистическая проверка результата"
objectives:
  - "Описать слои мониторинга модели (здоровье сервиса, данные и дрейф, прокси-метрики, качество по меткам) и объяснить роль запоздавших меток."
  - "Посчитать точность по окнам времени среди размеченных событий, не полагаясь на порядок событий."
  - "Реализовать правило тревоги в стиле Prometheus for: серия плохих значений, пропуски данных, переходы firing и resolved."
  - "Объяснить, зачем нужны for_windows и гистерезис, и что такое усталость от тревог."
  - "Принять решение о переобучении по отчёту о дрейфе и точности с понятным списком причин и описать, что происходит дальше (конвейер, реестр, канареечная выкладка)."
masteryCriteria:
  - "Ваша windowed_accuracy группирует по ts // window, пропускает события без метки, не возвращает пустые окна и сортирует результат по окну."
  - "Ваша evaluate_rule включает тревогу на for_windows-м плохом значении подряд, не прерывает серию на None, не дублирует firing и выключает тревогу на первом хорошем значении."
  - "Ваша retraining_decision берёт последнюю строку с n >= min_samples, не считает равную минимуму точность причиной и отличает insufficient-data от настоящей причины."
  - "Вы можете пройти весь сценарий: события, точность по окнам, правило, решение."
tags: ["mlops", "monitoring", "alerting", "delayed-labels", "retraining", "prometheus"]
facts:
  - kind: "real-world"
    text: "В правилах тревог Prometheus необязательный параметр for указывает, как долго условие должно выполняться подряд, прежде чем тревога перейдёт из состояния ожидания (pending) в активное (firing). Это стандартный способ не поднимать тревогу из-за одного всплеска. Подробности формата правил и поведения при отсутствии данных сверяйте с документацией вашей версии."
    sources: ["https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/"]
  - kind: "real-world"
    text: "Книга Google по SRE рекомендует строить оповещения вокруг симптомов, заметных пользователю, и следить, чтобы каждое срабатывание требовало действия человека. Тревоги, на которые нечего ответить, приучают дежурных игнорировать сообщения - тот самый эффект усталости от тревог, ради которого в правилах используют условие «N подряд»."
    sources: ["https://sre.google/sre-book/monitoring-distributed-systems/"]
  - kind: "internals"
    text: "Функция round в Python для чисел с плавающей точкой работает с их двоичным представлением, поэтому результат может отличаться от ожидаемого десятичного: документация приводит пример round(2.675, 2) = 2.67. Для метрик, которые затем сравниваются с порогом, полезно заранее решить, сравнивается ли округлённое или точное значение."
    sources: ["https://docs.python.org/3/library/functions.html#round"]
  - kind: "misconception"
    text: "«Точность по размеченным событиям - это точность модели». Метки приходят не по всем событиям и не одновременно: быстрые обратные связи обычно относятся к лёгким случаям, а спорные случаи размечаются позже или не размечаются вовсе. Поэтому свежие окна дают смещённую оценку, и рядом с точностью стоит показывать число размеченных событий."
  - kind: "misconception"
    text: "«Чем чувствительнее тревога, тем лучше». Чрезмерно чувствительные правила срабатывают на шум, и их начинают игнорировать, так что настоящая проблема теряется в потоке сообщений. Условие «N подряд», гистерезис и разделение тревог на срочные и несрочные снижают этот риск ценой небольшой задержки."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Зачем в правило тревоги добавляют условие for_windows (в Prometheus - for)?"
      options:
        - "Чтобы ускорить вычисление правила"
        - "Чтобы тревога не срабатывала от одного шумного окна и не вызывала усталость от тревог"
        - "Чтобы тревога включалась как можно раньше"
        - "Чтобы значения None считались плохими"
      answer: 1
      explanation: "Метрика колеблется от окна к окну, и один провал ещё не признак проблемы. Требование «несколько окон подряд» отсекает шум ценой небольшой задержки: тревога приходит не раньше for_windows-го плохого окна. Раньше она не включается, а ускорения вычислений условие не даёт."
    - id: "q2"
      type: "multiple"
      prompt: "Какие сигналы можно вычислить без меток в момент запроса? Выберите все верные варианты."
      options:
        - "Распределение предсказаний модели (например, средний score)"
        - "PSI входного признака относительно эталона"
        - "Задержка и доля ошибок сервиса"
        - "Точность модели в текущем окне"
      answer: [0, 1, 2]
      explanation: "Распределение предсказаний, дрейф входов и показатели сервиса доступны сразу. Точность требует знать правильные ответы, а они приходят с задержкой, поэтому точность по свежему окну неполна или недоступна."
    - id: "q3"
      type: "numeric"
      prompt: "Ряд точности [0.9, 0.7, None, 0.6, 0.9], порог 0.8, режим below, for_windows = 2. На каком индексе включится тревога (firing)? Индексы с нуля."
      answer: 3
      tolerance: 0
      explanation: "Индекс 1 (0.7) - первое плохое значение. None на индексе 2 означает отсутствие данных: счётчик и состояние не меняются, серия не прерывается. Индекс 3 (0.6) - второе плохое значение, и тревога включается. Если считать None хорошим значением, ответ был бы другим: серия сбросилась бы, и тревоги не было вовсе."
    - id: "q4"
      type: "single"
      prompt: "drift_rows не содержат статуса alert, accuracy_rows состоит из одной строки с n = 12, min_samples = 30. Что вернёт retraining_decision?"
      options:
        - "retrain = True, причина quality:… по этой строке"
        - "retrain = False, reasons = [\"quality:insufficient-data\"]"
        - "retrain = False, reasons = []"
        - "ValueError: данных недостаточно"
      answer: 1
      explanation: "Строка с n = 12 не подходит по min_samples, подходящих строк нет вовсе, поэтому добавляется причина insufficient-data. Она сообщает человеку, что оценка невозможна, но сама переобучения не запускает: нехватка данных не доказывает плохое качество. Пустой список причин означал бы, что качество проверено и в порядке, а исключение здесь не предусмотрено."
    - id: "q5"
      type: "single"
      prompt: "Мониторинг выдал retrain = True, и конвейер обучил новую модель. Что должно происходить дальше?"
      options:
        - "Новая модель сразу заменяет Production, потому что старая признана плохой"
        - "Кандидат проходит проверки реестра и постепенную (например, канареечную) выкладку, а затем попадает под тот же мониторинг"
        - "Мониторинг отключается до следующего квартала"
        - "Модель выкладывается только в теневом режиме и никогда не заменяет старую"
      answer: 1
      explanation: "Решение о переобучении запускает конвейер, но не отменяет проверок: новая модель тоже может оказаться хуже, поэтому её сравнивают в реестре и выкладывают постепенно. Мгновенная замена рискованна, мониторинг после выкладки нужен ещё больше, а теневой режим - лишь один из этапов, а не конечная точка."
exercise:
  id: "mlops.fundamentals.quality-monitoring-and-alerts.exercise"
  title: "Точность по окнам, правило тревоги и решение о переобучении"
  prompt: |
    В файле `monitor.py` реализуйте три функции. Тесты импортируют модуль и вызывают функции напрямую; ничего не печатайте и не читайте ввод.

    1. `windowed_accuracy(events, window)`: `events` - список словарей `{"ts": int, "pred": 0 или 1, "label": 0, 1 или None}`, порядок произвольный; `label = None` - метка ещё не известна, такое событие пропускается. При `window < 1` - `ValueError`. Индекс окна - `ts // window`. Возвращает список `{"window": индекс, "n": число размеченных событий, "accuracy": round(верные / n, 4)}` по возрастанию индекса, только для окон, где `n >= 1`.
    2. `evaluate_rule(values, threshold, for_windows, direction="below")` - аналог условия `for` в Prometheus. Условие «плохо»: `value < threshold` при `direction="below"` или `value > threshold` при `"above"` (строгие сравнения). Другое значение `direction` или `for_windows < 1` - `ValueError`. Ряд обходится по индексу `i`; `None` - нет данных, значение пропускается без изменения счётчика и состояния. Считается число подряд идущих плохих значений; когда оно достигает `for_windows` и тревога не включена, добавляется `[i, "firing"]`; на хорошем значении счётчик сбрасывается, и если тревога была включена, добавляется `[i, "resolved"]` и тревога выключается. Возвращает список событий.
    3. `retraining_decision(drift_rows, accuracy_rows, min_accuracy, min_samples=30)` возвращает `{"retrain": bool, "reasons": [...]}`. `drift_rows` - вывод `drift_report` из прошлого урока, `accuracy_rows` - вывод `windowed_accuracy`. Причины по порядку: для каждой строки дрейфа со статусом `"alert"` (в исходном порядке) - `"drift:<признак>"`; затем берётся последняя строка точности с `n >= min_samples`, и если её `accuracy < min_accuracy`, добавляется `f"quality:{acc:.4f}<{min_accuracy:.4f}"`; если подходящих строк нет вовсе, добавляется `"quality:insufficient-data"`. `retrain = True`, если есть причина `drift:...` или `quality:...`, кроме `quality:insufficient-data`.

    **Пример.**

    ```python
    events = [{"ts": 3, "pred": 0, "label": 0}, {"ts": 9, "pred": 1, "label": 0},
              {"ts": 12, "pred": 1, "label": 1}, {"ts": 15, "pred": 0, "label": None}]
    windowed_accuracy(events, 10)
    # [{'window': 0, 'n': 2, 'accuracy': 0.5}, {'window': 1, 'n': 1, 'accuracy': 1.0}]

    evaluate_rule([0.9, 0.7, None, 0.6, 0.9, 0.5, 0.9], 0.8, 2)
    # [[3, 'firing'], [4, 'resolved']]

    retraining_decision([{"feature": "age", "psi": 0.3, "ks": 0.2, "status": "alert"}],
                        [{"window": 4, "n": 50, "accuracy": 0.8}], 0.85)
    # {'retrain': True, 'reasons': ['drift:age', 'quality:0.8000<0.8500']}
    ```
  entryFile: "monitor.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Три функции независимы. Начните с windowed_accuracy: словарь «индекс окна -> (число событий, число верных)», затем сортировка по ключу."
    - "windowed_accuracy: пропустите событие при label is None; индекс окна ts // window; результат собирайте по sorted(stats.items()). В evaluate_rule заведите два состояния: streak (число подряд плохих значений) и firing (включена ли тревога); для None используйте continue."
    - "evaluate_rule: bad = value < threshold if direction == \"below\" else value > threshold. Если bad: streak += 1, и при streak >= for_windows and not firing добавьте [i, \"firing\"]. Иначе: streak = 0, и при firing добавьте [i, \"resolved\"]. Проверьте direction и for_windows до цикла."
    - "retraining_decision: reasons = [f\"drift:{row['feature']}\" for row in drift_rows if row['status'] == 'alert']; eligible = [r for r in accuracy_rows if r['n'] >= min_samples]; если eligible пуст - добавьте insufficient-data, иначе проверьте eligible[-1]['accuracy'] < min_accuracy. retrain вычисляйте по списку reasons."
  tests:
    - id: "windowed-basic"
      title: "Точность по окнам: границы, пропуск неразмеченных, порядок"
      hint: "Индекс окна ts // window; события с label None не учитываются; в результате только окна с n >= 1 по возрастанию."
    - id: "rule-basic"
      title: "Правило: firing на for_windows-м плохом значении, resolved на хорошем"
      hint: "Счётчик подряд плохих значений; при достижении for_windows тревога включается один раз; хорошее значение выключает."
    - id: "rule-above-and-validation"
      title: "Режим above, значение равно порогу, неверные параметры"
      hint: "Сравнения строгие; direction кроме below и above и for_windows < 1 дают ValueError."
    - id: "retrain-basic"
      title: "Решение: причины drift и quality в нужном порядке"
      hint: "Сначала drift: для alert в исходном порядке, затем причина по качеству последней подходящей строки."
    - id: "windowed-edges"
      title: "Пустые метки, window = 1, пропуски окон, несортированные события (скрытый)"
      hidden: true
      hint: "Все метки None - пустой результат; индексы окон не сжимаются; ts, кратные window, начинают новое окно; вход не меняется."
    - id: "rule-edges"
      title: "Пропуски в серии, дребезг, for_windows = 1 (скрытый)"
      hidden: true
      hint: "None не прерывает серию и не выключает тревогу; повторные плохие значения не дублируют firing; хорошее значение сбрасывает счётчик."
    - id: "retrain-edges"
      title: "Равенство минимуму, последняя подходящая строка, нехватка данных (скрытый)"
      hidden: true
      hint: "Точность, равная минимуму, не причина; n >= min_samples достаточно; insufficient-data сам по себе не запускает переобучение."
    - id: "end-to-end"
      title: "Сценарий целиком: события, окна, правило, решение (скрытый)"
      hidden: true
      hint: "Результат одной функции подаётся в следующую: окна дают ряд для правила и строки для решения; окна без меток остаются None."
