id: "mlops.fundamentals.pipelines-and-caching"
title: "Конвейеры и кеширование: шаги, граф зависимостей, ключ кеша"
goal: "Собрать обучение из шагов с явными зависимостями, выполнять их в топологическом порядке и пропускать шаги, результат которых уже есть в кеше, с ключом из версии шага, параметров и ключей зависимостей."
difficulty: "medium"
estimatedMinutes: 80
prerequisites: ["mlops.fundamentals.data-versioning"]
related: ["devops.fundamentals.build-pipelines-as-dags", "ml.foundations.what-is-ml"]
next: ["mlops.fundamentals.model-registry"]
seeAlso:
  - "DVC: dvc.yaml, стадии, зависимости, выходы и команда dvc repro"
  - "Оркестраторы (Airflow, Prefect, Kubeflow Pipelines): расписание, повторные попытки, распределённое выполнение"
  - "Инкрементальные сборки: как make, Bazel и подобные системы решают, что пересобирать"
objectives:
  - "Объяснить, чем конвейер из шагов отличается от ноутбука, выполняемого сверху вниз, и что такое контракт шага."
  - "Упорядочить шаги по зависимостям (алгоритм Кана) с детерминированным выбором среди готовых, обнаружить цикл, неизвестную зависимость и повторяющееся имя."
  - "Построить ключ кеша шага из его имени, версии, параметров и ключей зависимостей и объяснить, почему изменение расходится вниз по графу."
  - "Выполнить конвейер с общим кешем: пропускать шаги с известным ключом, а при изменении параметров или версии пересчитывать только затронутую часть графа."
masteryCriteria:
  - "Ваш topo_order ставит зависимости раньше зависимых шагов, при выборе берёт первый по алфавиту и сообщает об ошибках графа через ValueError."
  - "Ваш step_key совпадает с эталоном и меняется при изменении имени, версии, параметров или ключа зависимости."
  - "Ваш run_pipeline не вызывает fn при попадании в кеш и передаёт функции шага только результаты её зависимостей."
  - "Ваш run_pipeline пересчитывает при смене параметров или версии только изменённый шаг и всё, что от него зависит; независимые ветки остаются в кеше."
tags: ["mlops", "pipeline", "caching", "dag", "dvc", "topological-sort"]
facts:
  - kind: "real-world"
    text: "В DVC конвейер описывается файлом dvc.yaml: каждая стадия (stage) задаёт команду, зависимости (deps), параметры (params) и выходы (outs). Команда dvc repro перезапускает только те стадии, у которых изменились зависимости, параметры или код команды, а остальные пропускает. Подробности зависят от версии, см. документацию."
    sources: ["https://dvc.org/doc"]
  - kind: "internals"
    text: "Топологическую сортировку ориентированного ациклического графа можно выполнить алгоритмом Кана: повторно брать вершину без непройденных входящих рёбер и «удалять» её из графа. Если вершины закончились раньше, чем остался пустой граф, в нём есть цикл. Результат неоднозначен, когда готовых вершин несколько, поэтому для воспроизводимости нужно детерминированное правило выбора."
    sources: ["https://en.wikipedia.org/wiki/Topological_sorting"]
  - kind: "misconception"
    text: "«Ноутбук, выполненный сверху вниз, - это уже конвейер». У ноутбука есть скрытое состояние: ячейки можно запускать в любом порядке и повторно, переменные живут между ними. Результат зависит от истории запусков, а не только от кода и входов, поэтому его нельзя надёжно кешировать и воспроизводить."
  - kind: "real-world"
    text: "Классический make решает похожую задачу для сборки программ: цель пересобирается, если какая-то её зависимость новее по времени изменения. Системы для данных и обучения (например, DVC) обычно сравнивают хеши содержимого, потому что время изменения меняется при копировании и переносе между машинами."
    sources: ["https://www.gnu.org/software/make/manual/make.html"]
  - kind: "performance"
    text: "Кеширование шагов экономит самое дорогое: пересчёт обучения при смене только последнего шага. Цена - риск устаревшего результата, если ключ кеша не учитывает какой-то вход (код, параметр, версию данных). Чем полнее ключ, тем безопаснее кеш, но тем чаще пересчёт; чем он грубее, тем выше риск устаревшего результата."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Чем конвейер из шагов принципиально лучше ноутбука, который запускают сверху вниз?"
      options:
        - "Конвейеры всегда работают быстрее"
        - "Зависимости и входы каждого шага заданы явно, нет скрытого состояния между ячейками, поэтому шаги можно кешировать и повторять"
        - "В ноутбуках нельзя использовать функции"
        - "Ноутбук нельзя запускать несколько раз"
      answer: 1
      explanation: "Результат шага определяется только его входами и параметрами, и по ним можно построить ключ кеша. Скорость сама по себе не гарантирована, а ноутбук можно запускать сколько угодно раз: проблема в том, что результат зависит от порядка запуска ячеек."
    - id: "q2"
      type: "multiple"
      prompt: "Цепочка load -> split -> train -> evaluate. Что изменит ключ кеша шага train? Выберите все верные варианты."
      options:
        - "Изменение params шага load"
        - "Изменение params шага evaluate"
        - "Изменение version шага split"
        - "Другой порядок шагов во входном списке"
      answer: [0, 2]
      explanation: "Ключ train включает ключ split, а тот включает ключ load, поэтому изменения выше по цепочке доходят до train. Шаг evaluate находится ниже train и на его ключ не влияет. Порядок шагов во входном списке в ключ не входит."
    - id: "q3"
      type: "single"
      prompt: "Вы исправили код функции шага train, но не меняли ни параметры, ни version. Что сделает run_pipeline с кешем, в котором уже есть результат старого train?"
      options:
        - "Заметит изменение кода и пересчитает шаг"
        - "Возьмёт старый результат из кеша, потому что ключ не изменился"
        - "Выбросит ошибку о несовпадении кода"
        - "Очистит весь кеш"
      answer: 1
      explanation: "Ключ строится из имени, версии, параметров и ключей зависимостей; тело функции в него не входит. Поэтому при изменении кода нужно поднять version (или включать хеш кода в ключ). Иначе кеш вернёт устаревший результат."
    - id: "q4"
      type: "single"
      prompt: "Шаги z и b не имеют зависимостей, шаг m зависит от z. В каком порядке topo_order из урока вернёт имена?"
      options:
        - "[\"m\", \"z\", \"b\"]"
        - "[\"b\", \"z\", \"m\"]"
        - "[\"z\", \"m\", \"b\"]"
        - "[\"b\", \"m\", \"z\"]"
      answer: 1
      explanation: "Сначала готовы b и z, из них берётся первый по алфавиту - b. Затем z, и только после него становится готов m. Порядок «z, m, b» тоже корректен для зависимостей, но правило «первый по алфавиту из готовых» его не даёт."
    - id: "q5"
      type: "numeric"
      prompt: "Линейный конвейер a -> b -> c -> d -> e, все результаты уже в кеше. В шаге b изменили params. Сколько шагов выполнит run_pipeline при следующем запуске?"
      answer: 4
      tolerance: 0
      explanation: "Шаг a не изменился и берётся из кеша. Ключ b изменился из-за params, а ключи c, d и e зависят от ключа предыдущего шага, поэтому меняются все. Выполняются b, c, d и e: четыре шага."
exercise:
  id: "mlops.fundamentals.pipelines-and-caching.exercise"
  title: "Конвейер с кешем по ключам шагов"
  prompt: |
    В файле `pipeline.py` реализуйте мини-конвейер. Тесты импортируют модуль и вызывают функции напрямую; ничего не печатайте и не читайте ввод. Функции `canonical_json` и `sha(text)` (SHA-256 строки в UTF-8, шестнадцатеричный вид) уже готовы.

    **Шаг** - словарь `{"name": str, "deps": [имена], "params": dict, "version": str, "fn": callable}`. Функция `fn(inputs, params)` получает `inputs` - словарь `{имя_зависимости: её_результат}` ровно для зависимостей этого шага - и возвращает результат, сериализуемый в JSON.

    1. `topo_order(steps)` возвращает список имён в топологическом порядке (алгоритм Кана): на каждом шаге из готовых (все зависимости уже выданы) берётся первый по алфавиту. Выбросьте `ValueError`, если зависимость не соответствует ни одному шагу (в сообщении должно быть её имя), если в графе есть цикл (включая шаг, зависящий от самого себя) или если имена шагов повторяются.
    2. `step_key(step, dep_keys)` возвращает первые 16 символов `sha(canonical_json(payload))`, где `payload = {"name": ..., "version": ..., "params": ..., "deps": {dep: dep_keys[dep] for dep in step["deps"]}}`. Так изменение ключа зависимости меняет ключи всех шагов ниже по графу.
    3. `run_pipeline(steps, cache)` выполняет шаги в порядке `topo_order(steps)`. `cache` - словарь `ключ -> результат`, общий для разных запусков; функция его изменяет. Для каждого шага вычисляется ключ из ключей уже обработанных зависимостей. Если ключ есть в `cache`, берётся готовый результат и `fn` не вызывается; иначе вызывается `fn(inputs, params)` и результат кладётся в `cache`. Ошибки графа должны обнаруживаться до вызова первой `fn`. Возвращается словарь `{"outputs": {имя: результат}, "keys": {имя: ключ}, "executed": [имена, выполненные сейчас, в порядке выполнения], "cached": [имена, взятые из кеша, в порядке обработки]}`.

    **Пример.**

    ```python
    steps = [
        {"name": "load", "deps": [], "params": {}, "version": "1", "fn": lambda i, p: [1, 2, 3]},
        {"name": "total", "deps": ["load"], "params": {}, "version": "1", "fn": lambda i, p: sum(i["load"])},
    ]
    cache = {}
    run_pipeline(steps, cache)["executed"]   # ['load', 'total']
    run_pipeline(steps, cache)["cached"]     # ['load', 'total'] - fn не вызываются
    ```
  entryFile: "pipeline.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Начните с step_key: это три строки по описанию. Затем topo_order, и только потом run_pipeline, которая использует обе функции."
    - "topo_order: заведите для каждого шага счётчик непройденных зависимостей и список зависимых шагов. ready = sorted(шаги со счётчиком 0); в цикле берите ready.pop(0), уменьшайте счётчики зависимых и после добавлений снова сортируйте ready."
    - "Ошибки: неизвестная зависимость и повторяющееся имя проверяются до алгоритма. Цикл (в том числе шаг, зависящий от самого себя) обнаруживается так: len(order) оказывается меньше числа шагов."
    - "run_pipeline: by_name = {s[\"name\"]: s for s in steps}; for name in topo_order(steps): key = step_key(step, keys); if key in cache: ... else: inputs = {dep: outputs[dep] for dep in step[\"deps\"]}; out = step[\"fn\"](inputs, step[\"params\"]); cache[key] = out. В keys и outputs записывайте результат каждого шага, чтобы следующие шаги видели его."
  tests:
    - id: "topo-basic"
      title: "topo_order: порядок по зависимостям и алфавиту"
      hint: "Зависимости идут раньше зависимых шагов; из готовых берётся первый по алфавиту; порядок во входном списке не важен."
    - id: "step-key"
      title: "step_key: формат и чувствительность"
      hint: "16 шестнадцатеричных символов от canonical_json(payload); ключ меняется при изменении имени, версии, параметров или ключа зависимости."
    - id: "run-first"
      title: "Первый запуск выполняет все шаги"
      hint: "Результаты, ключи и порядок верны, каждая fn вызвана один раз и получила только свои зависимости."
    - id: "run-second-cached"
      title: "Второй запуск берёт всё из кеша"
      hint: "При попадании в кеш fn не вызывается, результаты совпадают с первым запуском."
    - id: "topo-errors"
      title: "Ошибки графа: неизвестная зависимость, цикл, дубликат (скрытый)"
      hidden: true
      hint: "ValueError до запуска любой fn; в сообщении о неизвестной зависимости есть её имя; самозависимость - тоже цикл."
    - id: "invalidate-params"
      title: "Смена параметров пересчитывает шаг и его потомков (скрытый)"
      hidden: true
      hint: "Выше по графу и в независимых ветках результаты берутся из кеша; возврат к прежним параметрам тоже попадает в кеш."
    - id: "invalidate-version"
      title: "Смена version пересчитывает шаг и его потомков (скрытый)"
      hidden: true
      hint: "Новая version меняет ключ шага и ключи всех шагов ниже; старая версия остаётся в кеше."
    - id: "diamond-and-shared-cache"
      title: "Ромбовидный граф и общий кеш (скрытый)"
      hidden: true
      hint: "После каждого шага снова выбирается первый по алфавиту из готовых; кеш можно делить между разными графами."
