id: "kotlin.check.basics"
title: "Проверка: основы - значения, ввод, условия, циклы"
goal: "Читать числа из ввода, применять условия и циклы и не ошибаться в целочисленной арифметике."
difficulty: "easy"
estimatedMinutes: 15
prerequisites: []
objectives:
  - "Показать на практике умение: читать числа по строкам, накапливать сумму и счётчики в цикле и предсказывать результат простых выражений."
masteryCriteria:
  - "Решение упражнения проходит все тесты, включая скрытые."
  - "Квиз пройден с результатом не ниже 75%."
tags:
  - "kotlin"
  - "check"
  - "basics"
  - "values"
  - "loops"
assessmentFor:
  - "kotlin.from-zero.first-program"
  - "kotlin.from-zero.compiler-errors"
  - "kotlin.from-zero.output"
  - "kotlin.from-zero.variables"
  - "kotlin.from-zero.basic-types"
  - "kotlin.from-zero.arithmetic"
  - "kotlin.from-zero.strings"
  - "kotlin.from-zero.reading-input"
  - "kotlin.from-zero.type-conversion"
  - "kotlin.from-zero.formatted-output"
  - "kotlin.from-zero.comparison-and-logic"
  - "kotlin.from-zero.if-else"
  - "kotlin.from-zero.when"
  - "kotlin.from-zero.while-loop"
  - "kotlin.from-zero.for-loop"
  - "kotlin.from-zero.loop-control"
quiz:
  passThreshold: 0.75
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```kotlin
        fun main() {
            var s = 0
            for (i in 1..10) {
                if (i % 3 == 0) {
                    continue
                }
                if (i > 7) {
                    break
                }
                s += i
            }
            println(s)
        }
        ```
      options:
        - "19"
        - "22"
        - "27"
        - "12"
      answer: 0
      explanation: "Цикл складывает i = 1, 2, 4, 5, 7 (кратные 3 пропускаются через continue). При i = 8 срабатывает break, поэтому сумма остаётся 1 + 2 + 4 + 5 + 7 = 19."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```kotlin
        fun main() {
            println("${7 / 2 * 2.0} ${7 / 2.0 * 2}")
        }
        ```
      options:
        - "7.0 7.0"
        - "6.0 7.0"
        - "6.0 6.0"
        - "7.0 6.0"
      answer: 1
      explanation: "Вычисления идут слева направо. В первом выражении 7 / 2 - деление целых и равно 3, затем 3 * 2.0 = 6.0. Во втором 7 / 2.0 - дробное деление, 3.5, а 3.5 * 2 = 7.0."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```kotlin
        fun main() {
            var x = 5
            x += 3
            x *= 2
            val c = 'a' + 2
            println("$x ${x % 5} ${x / 5} $c ${c.code}")
        }
        ```
      options:
        - "16 1 3 c 99"
        - "16 1 3 99 c"
        - "13 3 2 c 99"
        - "16 1 3.2 c 99"
      answer: 0
      explanation: "Сначала x становится 8, затем 16; 16 % 5 равно 1, а 16 / 5 - целое деление, 3. Char + Int даёт Char: 'a' + 2 - это c, а код символа (свойство code) равен 99."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```kotlin
        fun main() {
            val a = 1_000_000 * 3000
            val b = 1_000_000L * 3000
            println("$a $b")
        }
        ```
      options:
        - "3000000000 3000000000"
        - "-1294967296 3000000000"
        - "-1294967296 -1294967296"
        - "Ошибка компиляции"
      answer: 1
      explanation: "В первом выражении оба множителя - Int, поэтому произведение 3 000 000 000 вычисляется как Int и переполняется до -1294967296. Во втором литерал 1_000_000L имеет тип Long, и всё произведение считается как Long."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```kotlin
        fun main() {
            val i = 0
            if (i != 0 && 10 / i > 1) {
                println("A")
            } else {
                println("B")
            }
        }
        ```
      options:
        - "A"
        - "B"
        - "ArithmeticException"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Оператор && вычисляет правую часть, только если левая истинна. Левая часть i != 0 ложна, деление 10 / i не выполняется, и выбирается ветка else."
exercise:
  id: "kotlin.check.basics.exercise"
  title: "Статистика чисел"
  prompt: |-
    Первая строка ввода - количество чисел `n`, затем идут `n` строк, в каждой по одному целому числу. Программа печатает пять строк:

    ```
    Чисел: <количество>
    Сумма: <сумма>
    Чётных: <сколько чётных>
    Среднее: <сумма / количество, целое деление>
    Максимум: <наибольшее>
    ```

    Если `n` равно `0`, во всех строках печатается `0`. Среднее - результат целочисленного деления (дробная часть отбрасывается).

    **Пример.** Ввод:

    ```
    5
    4
    7
    10
    3
    9
    ```

    Вывод:

    ```
    Чисел: 5
    Сумма: 33
    Чётных: 2
    Среднее: 6
    Максимум: 10
    ```
  entryFile: "Main.kt"
  evaluation: "io"
  hints:
    - "Прочитайте n через readln().toInt(), затем повторите чтение n раз циклом for и обновляйте счётчики внутри него."
    - "Чётность проверяйте как x % 2 == 0: это верно и для отрицательных чисел. Максимум начинайте с первого числа (условие i == 1), а не с нуля."
    - "Среднее считайте только если n > 0, иначе деление на ноль. Сумма и количество - целые числа, деление целое."
  tests:
    - id: "basic"
      title: "Обычные числа"
      stdin: |
        5
        4
        7
        10
        3
        9
      expected: |
        Чисел: 5
        Сумма: 33
        Чётных: 2
        Среднее: 6
        Максимум: 10
      hint: "Пять строк: 5 чисел, сумма 33, чётных 2 (4 и 10), среднее 33 / 5 = 6 с отбрасыванием дроби, максимум 10."
    - id: "three"
      title: "Три числа"
      stdin: |
        3
        10
        20
        30
      expected: |
        Чисел: 3
        Сумма: 60
        Чётных: 3
        Среднее: 20
        Максимум: 30
      hint: "Три числа, сумма 60, все чётные, среднее 20, максимум 30."
    - id: "negative"
      title: "Отрицательные числа (скрытый)"
      stdin: |
        4
        -4
        -3
        -8
        -7
      expected: |
        Чисел: 4
        Сумма: -22
        Чётных: 2
        Среднее: -5
        Максимум: -3
      hidden: true
      hint: "Чётность отрицательных чисел проверяйте через % 2 == 0; максимум из отрицательных равен -3, а не 0; среднее -22 / 4 даёт -5 (дробная часть отбрасывается к нулю)."
    - id: "empty"
      title: "Нет чисел (скрытый)"
      stdin: |
        0
      expected: |
        Чисел: 0
        Сумма: 0
        Чётных: 0
        Среднее: 0
        Максимум: 0
      hidden: true
      hint: "Когда чисел нет, все пять значений равны 0, а деление на ноль нужно обойти."
    - id: "single"
      title: "Одно число (скрытый)"
      stdin: |
        1
        7
      expected: |
        Чисел: 1
        Сумма: 7
        Чётных: 0
        Среднее: 7
        Максимум: 7
      hidden: true
      hint: "Одно нечётное число: количество 1, сумма 7, чётных 0, среднее 7, максимум 7."
