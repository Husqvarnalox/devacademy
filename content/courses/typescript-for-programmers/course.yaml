id: "typescript-for-programmers"
version: "1.0.0"
title: "TypeScript для программистов"
description: "Быстрый путь для тех, кто уже пишет на другом языке (Python, Java, C#, Go, JavaScript): три плотных урока о том, что в TypeScript проверяется до запуска, а что нет. Стирание типов, числа и приведение, структурные типы, ссылки и сортировка, необязательные значения, исключения, JSON и ввод. Каждый урок завершается упражнением с запуском проверок и квизом на типичные ловушки; успешное прохождение засчитывает соответствующие уроки курса «TypeScript с нуля». Это не замена курсу для начинающих: основы программирования здесь считаются известными."
languageId: "typescript"
level: 1
track: "typescript"
lessons:
  - "01-syntax-and-control-flow"
  - "02-collections-and-functions"
  - "03-errors-and-input"
