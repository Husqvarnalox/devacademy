id: "csharp.check.value-types"
title: "Проверка: значимые и ссылочные типы, nullable"
goal: "Различать копирование значения и копирование ссылки и работать с nullable-значениями."
difficulty: "medium"
estimatedMinutes: 15
prerequisites: []
objectives:
  - "Показать на практике умение: различать struct и class при присваивании и передаче в метод, использовать int?."
masteryCriteria:
  - "Решение упражнения проходит все тесты, включая скрытые."
  - "Квиз пройден с результатом не ниже 75%."
tags:
  - "csharp"
  - "check"
  - "value-types"
assessmentFor:
  - "csharp.first-steps.value-types-and-nullable"
  - "csharp.fundamentals.type-system-and-memory"
quiz:
  passThreshold: 0.75
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```csharp
        P a = new P { X = 1 };
        P b = a;
        b.X = 9;
        Console.WriteLine(a.X);

        struct P
        {
            public int X;
        }
        ```
      options:
        - "1"
        - "9"
        - "0"
        - "Ошибка компиляции"
      answer: 0
      explanation: "P - структура, значимый тип: присваивание b = a копирует значение целиком. Изменение b не затрагивает a, поэтому a.X остаётся равным 1."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```csharp
        P a = new P { X = 1 };
        P b = a;
        b.X = 9;
        Console.WriteLine(a.X);

        class P
        {
            public int X;
        }
        ```
      options:
        - "1"
        - "9"
        - "0"
        - "Ошибка компиляции"
      answer: 1
      explanation: "P - класс, ссылочный тип: присваивание копирует ссылку, и обе переменные указывают на один объект. Поэтому изменение через b видно через a, и выводится 9."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```csharp
        int? x = null;
        int? y = x + 1;
        Console.WriteLine(y.HasValue);
        ```
      options:
        - "True"
        - "False"
        - "Бросится InvalidOperationException"
        - "Ошибка компиляции"
      answer: 1
      explanation: "Арифметика с null среди nullable-значений даёт null (операция «поднята»): null + 1 равно null. Поэтому HasValue равно False, а исключения нет. Исключение появилось бы только при чтении y.Value."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```csharp
        object o = 5;
        object p = 5;
        Console.WriteLine($"{o == p} {o.Equals(p)}");
        ```
      options:
        - "True True"
        - "False False"
        - "False True"
        - "True False"
      answer: 2
      explanation: "Каждая упаковка int создаёт отдельный объект в куче. Оператор == для двух переменных типа object сравнивает ссылки и даёт False, а Equals сравнивает содержимое и даёт True."
    - id: "q5"
      type: "single"
      prompt: |-
        Что произойдёт при сборке?

        ```csharp
        var list = new List<P> { new P { X = 1 } };
        list[0].X = 5;

        struct P
        {
            public int X;
        }
        ```
      options:
        - "Значение X в списке станет 5"
        - "Ошибка компиляции: нельзя изменить копию структуры, возвращённую индексатором"
        - "Бросится исключение во время выполнения"
        - "Значение X в списке останется 1, ошибки нет"
      answer: 1
      explanation: "Индексатор списка возвращает копию структуры, и присвоение её полю не имело бы эффекта, поэтому компилятор запрещает его (ошибка CS1612). Для класса такая запись допустима. Структуру нужно целиком записать обратно: list[0] = new P { X = 5 }."
exercise:
  id: "csharp.check.value-types.exercise"
  title: "Nullable, структура и класс"
  prompt: |
    Основная часть программы написана: она читает команды (по одной на строку) и печатает результат вызова ваших методов. Типы `Counter` (структура) и `Box` (класс) уже описаны в файле. Допишите в `Program.cs` четыре метода внизу. Основную часть и описания типов не меняйте.

    1. `ParseOrNull(string text)` - значение `int?`: число, если строка является целым числом, иначе `null` (в том числе если число не помещается в `int`).
    2. `SumNonNull(int?[] values)` - сумма значений, не равных `null`; для пустого массива и массива из одних `null` - `0`.
    3. `Incremented(Counter counter)` - счётчик со значением на единицу больше. Оригинал, который есть у вызывающего, не должен измениться: `Counter` - структура.
    4. `Bump(Box box)` - увеличивает `box.Value` на единицу в переданном объекте: `Box` - класс, изменение должно быть видно вызывающему.

    В командах `sum` символ `_` означает отсутствующее значение (`null`).

    **Пример.** Для ввода

    ```
    parse 42
    parse x
    sum 1 _ 3
    counter 5
    box 10
    ```

    программа печатает

    ```
    42
    null
    4
    5 6
    11
    ```

    Часть тестов скрыта: в них переполнение `int`, знаки и пустые суммы.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "ParseOrNull: if (int.TryParse(text, out int value)) return value; return null; - для int? результат null допустим."
    - "SumNonNull: в цикле foreach (int? v in values) проверяйте v.HasValue и прибавляйте v.Value."
    - "Incremented: параметр структуры - копия, поэтому можно увеличить её поле и вернуть: counter.Value++; return counter;. Оригинал у вызывающего не изменится."
    - "Bump: параметр класса - копия ссылки на тот же объект, поэтому box.Value++ виден вызывающему."
  tests:
    - id: "parse"
      title: "ParseOrNull - числа и не числа"
      stdin: "parse 42\nparse x\nparse -7\nparse 2147483648\n"
      expected: |
        42
        null
        -7
        null
      hint: "x не число, а 2147483648 не помещается в int: в обоих случаях результат null."
    - id: "sum-counter-box"
      title: "Сумма, структура и класс"
      stdin: "sum 1 2 3\nsum 1 _ 3\ncounter 5\nbox 10\n"
      expected: |
        6
        4
        5 6
        11
      hint: "null в сумме пропускается: 1 + 3 = 4. Оригинал структуры остаётся 5, копия получает 6, а объект класса меняется на месте: 10 становится 11."
    - id: "sum-edge"
      title: "Сумма: пустая, из null, с большим числом (скрытый)"
      stdin: "sum _ _\nsum\nsum 2147483647 _ -1\ncounter -1\ncounter 0\n"
      expected: |
        0
        0
        2147483646
        -1 0
        0 1
      hidden: true
      hint: "Массив без значений и массив из одних null дают 0. 2147483647 + (-1) помещается в int. Оригинал структуры не меняется."
    - id: "parse-edge"
      title: "Знаки, нули, неверные форматы, класс с нулём (скрытый)"
      stdin: "parse +5\nparse 0\nparse 007\nparse 1_000\nparse 3.5\nbox 0\nbox -5\n"
      expected: |
        5
        0
        7
        null
        null
        1
        -4
      hidden: true
      hint: "int.TryParse принимает знак + и ведущие нули; символ подчёркивания и дробная часть делают строку неверной. Метод Bump увеличивает значение объекта на единицу: 0 -> 1, -5 -> -4."
