id: "csharp.check.basics"
title: "Проверка: основы - значения, условия, циклы, методы"
goal: "Читать и писать небольшие методы с условиями и циклами, не путая целочисленное деление и остаток."
difficulty: "easy"
estimatedMinutes: 15
prerequisites: []
objectives:
  - "Показать на практике умение: писать методы с условиями и циклами и предсказывать результат простых выражений."
masteryCriteria:
  - "Решение упражнения проходит все тесты, включая скрытые."
  - "Квиз пройден с результатом не ниже 75%."
tags:
  - "csharp"
  - "check"
  - "basics"
assessmentFor:
  - "csharp.from-zero.first-program"
  - "csharp.from-zero.compiler-errors"
  - "csharp.from-zero.output"
  - "csharp.from-zero.variables-and-types"
  - "csharp.from-zero.arithmetic"
  - "csharp.from-zero.double-and-decimal"
  - "csharp.from-zero.strings"
  - "csharp.from-zero.comparison-and-logic"
  - "csharp.from-zero.if-else"
  - "csharp.from-zero.switch"
  - "csharp.from-zero.while-loop"
  - "csharp.from-zero.for-loop"
  - "csharp.from-zero.loop-control"
  - "csharp.from-zero.methods"
  - "csharp.from-zero.return-values"
quiz:
  passThreshold: 0.75
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```csharp
        int s = 0;
        for (int i = 1; i <= 5; i++)
        {
            if (i % 2 == 0) continue;
            s += i;
        }
        Console.WriteLine(s);
        ```
      options:
        - "6"
        - "9"
        - "15"
        - "5"
      answer: 1
      explanation: "Цикл пропускает чётные i, поэтому складываются 1, 3 и 5, итого 9. Оператор continue завершает только текущий шаг, а не весь цикл."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```csharp
        int a = 10 / 4 * 4;
        double b = 10 / 4;
        Console.WriteLine(a + " " + b);
        ```
      options:
        - "10 2.5"
        - "8 2"
        - "10 2"
        - "8 2.5"
      answer: 1
      explanation: "Деление двух int целочисленное: 10 / 4 равно 2, поэтому a равно 2 * 4 = 8. В выражении double b = 10 / 4 деление тоже целочисленное, и только результат 2 превращается в double."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```csharp
        static int F(int a, int b = 3)
        {
            return a * b;
        }

        Console.WriteLine(F(2) + F(2, 5));
        ```
      options:
        - "16"
        - "10"
        - "13"
        - "Ошибка компиляции"
      answer: 0
      explanation: "F(2) использует значение по умолчанию b = 3 и возвращает 6, F(2, 5) возвращает 10. Сумма 6 + 10 равна 16."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```csharp
        int n = 10, c = 0;
        while (n > 1)
        {
            n /= 2;
            c++;
        }
        Console.WriteLine($"{c} {n}");
        ```
      options:
        - "3 1"
        - "4 0"
        - "3 2"
        - "5 1"
      answer: 0
      explanation: "Значения n по шагам: 10, 5, 2, 1. Три итерации, после третьей n равно 1 и условие n > 1 ложно. Поэтому выводится 3 1."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```csharp
        string s = "abc";
        string t = s.ToUpper();
        Console.WriteLine(s + t);
        ```
      options:
        - "ABCABC"
        - "abcabc"
        - "abcABC"
        - "ABCabc"
      answer: 2
      explanation: "Строки неизменяемы: ToUpper возвращает новую строку, а s остаётся прежней. Поэтому склейка даёт abcABC."
exercise:
  id: "csharp.check.basics.exercise"
  title: "Небольшие методы с условиями и циклами"
  prompt: |
    Основная часть программы написана: она читает команды (по одной на строку) и печатает результат вызова ваших методов. Напишите четыре метода в `Program.cs`. Основную часть не меняйте.

    1. `FizzBuzz(int n)` - строка: `"FizzBuzz"`, если `n` делится на 3 и на 5; `"Fizz"`, если только на 3; `"Buzz"`, если только на 5; иначе число `n`, записанное строкой.
    2. `DigitSum(int n)` - сумма десятичных цифр неотрицательного числа `n`; для `0` результат `0`.
    3. `IsLeapYear(int year)` - `true` для високосного года: делится на 4, но не на 100, кроме годов, которые делятся на 400.
    4. `NextPrime(int n)` - наименьшее простое число, строго большее `n` (`n` целое, может быть отрицательным).

    **Пример.** Для ввода

    ```
    fizz 15
    digits 4096
    leap 2024
    prime 10
    ```

    программа печатает

    ```
    FizzBuzz
    19
    да
    11
    ```

    Часть тестов скрыта: в них граничные значения.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "Начните с FizzBuzz: проверка деления на 15 должна идти раньше проверок на 3 и на 5."
    - "DigitSum: цикл while (n > 0), в котором n % 10 добавляется к сумме, а n делится на 10 нацело."
    - "IsLeapYear: (year % 4 == 0 && year % 100 != 0) || year % 400 == 0."
    - "NextPrime: напишите вспомогательный метод IsPrime (числа меньше 2 не простые, делители проверяйте до корня) и увеличивайте кандидата в цикле while, пока он не станет простым."
  tests:
    - id: "fizz-basic"
      title: "FizzBuzz - обычные числа"
      stdin: "fizz 15\nfizz 9\nfizz 10\nfizz 7\n"
      expected: |
        FizzBuzz
        Fizz
        Buzz
        7
      hint: "Для 15 нужен FizzBuzz, для 9 - Fizz, для 10 - Buzz, для 7 - просто 7."
    - id: "others-basic"
      title: "Сумма цифр, високосный год, простое число"
      stdin: "digits 4096\ndigits 0\nleap 2024\nleap 2023\nprime 10\nprime 13\n"
      expected: |
        19
        0
        да
        нет
        11
        17
      hint: "4 + 0 + 9 + 6 = 19; 2024 високосный, 2023 нет; после 10 идёт 11, после 13 - 17."
    - id: "fizz-edge"
      title: "FizzBuzz - 0, отрицательные и большие (скрытый)"
      stdin: "fizz 0\nfizz 30\nfizz 1\nfizz -3\nfizz -5\nfizz -2\n"
      expected: |
        FizzBuzz
        FizzBuzz
        1
        Fizz
        Buzz
        -2
      hidden: true
      hint: "0 делится и на 3, и на 5. Для отрицательных кратных условие n % 3 == 0 тоже истинно: -3 даёт Fizz, -5 даёт Buzz, а -2 печатается как есть."
    - id: "others-edge"
      title: "Годы-исключения, 0 и простые числа (скрытый)"
      stdin: "leap 1900\nleap 2000\nleap 2100\nleap 2400\nprime -5\nprime 0\nprime 1\nprime 2\nprime 89\ndigits 999999999\n"
      expected: |
        нет
        да
        нет
        да
        2
        2
        2
        3
        97
        81
      hidden: true
      hint: "1900 и 2100 не високосные (делятся на 100), 2000 и 2400 високосные (делятся на 400). Для n меньше 2 ответ 2, после 2 идёт 3, после 89 - 97. Сумма цифр 999999999 равна 81."
