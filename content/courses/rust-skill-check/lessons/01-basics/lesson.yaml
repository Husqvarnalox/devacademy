id: "rust.check.basics"
title: "Проверка: основы"
goal: "Читать ввод, считать в подходящих типах, ветвиться и выводить результат с нужным форматом."
difficulty: "medium"
estimatedMinutes: 15
prerequisites: []
objectives:
  - "Показать на практике умение: читать числа из ввода, накапливать сумму в i64, выбирать максимум, считать значения по условию и печатать среднее через {:.2}."
masteryCriteria:
  - "Решение упражнения проходит все тесты, включая скрытые."
  - "Квиз пройден с результатом не ниже 75%."
tags:
  - "rust"
  - "check"
  - "basics"
assessmentFor:
  - "rust.from-zero.first-program"
  - "rust.from-zero.compiler-errors"
  - "rust.from-zero.output"
  - "rust.from-zero.variables"
  - "rust.from-zero.basic-types"
  - "rust.from-zero.arithmetic"
  - "rust.from-zero.strings"
  - "rust.from-zero.reading-input"
  - "rust.from-zero.type-conversion"
  - "rust.from-zero.formatted-output"
  - "rust.from-zero.comparison-and-logic"
  - "rust.from-zero.if-else"
  - "rust.from-zero.match"
  - "rust.from-zero.while-loop"
  - "rust.from-zero.for-loop"
quiz:
  passThreshold: 0.75
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        fn main() {
            for i in (1..=3).rev() {
                print!("{i} ");
            }
            println!();
        }
        ```
      options:
        - "3 2 "
        - "3 2 1 "
        - "1 2 3 "
        - "2 1 0 "
      answer: 1
      explanation: "Диапазон 1..=3 включает оба конца, а rev() обходит его в обратном порядке: 3, 2, 1. Каждое число печатается с пробелом, затем println!() завершает строку."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        fn main() {
            println!("{} {}", -7 / 2, -7 % 3);
        }
        ```
      options:
        - "-3 -1"
        - "-4 2"
        - "-3 2"
        - "-4 -1"
      answer: 0
      explanation: "Целое деление отбрасывает дробную часть к нулю: -7 / 2 = -3. Остаток имеет знак делимого: -7 - (-2 * 3) = -1. Округления вниз, как в Python, здесь нет."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        fn main() {
            let a: i64 = 3_000_000_000;
            let b = a as i32;
            println!("{b}");
        }
        ```
      options:
        - "2147483647"
        - "Ошибка компиляции: приведение i64 к i32 запрещено"
        - "3000000000"
        - "-1294967296"
      answer: 3
      explanation: "Приведение as между целыми не проверяет значение: оно оставляет младшие 32 бита. 3000000000 в виде i32 даёт 3000000000 - 4294967296 = -1294967296. Компилятор приведение разрешает; безопасная версия - i32::try_from(a)."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        fn main() {
            let n = 12;
            let word = match n {
                x if x % 3 == 0 => "three",
                10..=20 => "teens",
                _ => "other",
            };
            println!("{word}");
        }
        ```
      options:
        - "other"
        - "Ошибка компиляции: ветки пересекаются"
        - "three"
        - "teens"
      answer: 2
      explanation: "Ветки match проверяются сверху вниз, выбирается первая подошедшая. Для 12 первая ветка с охраной x % 3 == 0 истинна, поэтому вторая, хотя тоже подходит, не рассматривается. Пересекающиеся ветки допустимы."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        fn main() {
            println!("{:>6.1}|{:<4}|{:03}", 3.14159, 7, 5);
        }
        ```
      options:
        - "   3.1|7|5"
        - "   3.1|7   |005"
        - "3.1   |   7|500"
        - "  3.14|7   |005"
      answer: 1
      explanation: "{:>6.1} выравнивает по правому краю в поле шириной 6 и оставляет один знак после точки: «   3.1». {:<4} выравнивает по левому краю в поле 4: «7   ». {:03} дополняет нулями до ширины 3: «005»."
exercise:
  id: "rust.check.basics.exercise"
  title: "Статистика шагов за дни"
  prompt: |-
    Программа читает целые числа до конца ввода: число шагов, которое человек сделал за каждый день (значения неотрицательные и могут быть большими). Напишите программу в `main.rs`, которая печатает пять строк:

    ```
    days=<число прочитанных значений>
    total=<сумма всех значений>
    best=<наибольшее значение>
    avg=<среднее с двумя знаками после запятой>
    goal=<сколько дней с результатом не менее 10000 шагов>
    ```

    Для пустого ввода все числа равны нулю, а среднее - `0.00`. Сумма может не поместиться в `i32`.

    **Пример.** Для ввода

    ```
    8000 12000 10000
    9999
    ```

    программа печатает

    ```
    days=4
    total=39999
    best=12000
    avg=9999.75
    goal=2
    ```

    Часть тестов скрыта: в них пустой ввод, большие значения и граница в 10000 шагов.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Прочитайте весь ввод: let text = std::io::read_to_string(std::io::stdin()).unwrap(); и обойдите числа циклом for token in text.split_whitespace()."
    - "Сумму храните в i64 и каждое слово разбирайте как i64: token.parse().unwrap() с типом let steps: i64. Для 3000000000 тип i32 слишком мал."
    - "Максимум начните с 0 (значения неотрицательны) и обновляйте условием if steps > best. День с целью: steps >= 10000."
    - "Среднее: если дней нет, 0.0, иначе total as f64 / days as f64; печатайте через {:.2}."
  tests:
    - id: "basic"
      title: "Четыре дня"
      stdin: |
        8000 12000 10000
        9999
      expected: |
        days=4
        total=39999
        best=12000
        avg=9999.75
        goal=2
      hint: "4 значения, сумма 39999, наибольшее 12000, среднее 39999 / 4 = 9999.75, дней с целью два (12000 и 10000)."
    - id: "empty"
      title: "Пустой ввод"
      stdin: ""
      expected: |
        days=0
        total=0
        best=0
        avg=0.00
        goal=0
      hint: "Для пустого ввода все счётчики нулевые, а среднее печатается как 0.00, а не NaN."
    - id: "big"
      title: "Значения больше i32 (скрытый)"
      stdin: |
        3000000000 3000000000
        3000000001
      expected: |
        days=3
        total=9000000001
        best=3000000001
        avg=3000000000.33
        goal=3
      hidden: true
      hint: "Сумма 9000000001 не помещается в i32, поэтому нужен i64. Среднее 3000000000.33, дней с целью три."
    - id: "boundary"
      title: "Граница 10000 и ноль (скрытый)"
      stdin: |
        9999 10000 10001 0
      expected: |
        days=4
        total=30000
        best=10001
        avg=7500.00
        goal=2
      hidden: true
      hint: "10000 уже достигает цели (>=), 9999 нет. Ноль - допустимое значение дня: days=4, best=10001."
