id: "rust.check.errors-input"
title: "Проверка: ввод и ошибки"
goal: "Строго разбирать вводимые строки, обрабатывать Result и считать некорректные строки."
difficulty: "medium"
estimatedMinutes: 15
prerequisites: []
objectives:
  - "Показать на практике умение: разбирать число через parse с проверкой диапазона, отвергать NaN и бесконечность и считать плохие строки вместо паники."
masteryCriteria:
  - "Решение упражнения проходит все тесты, включая скрытые."
  - "Квиз пройден с результатом не ниже 75%."
tags:
  - "rust"
  - "check"
  - "errors-input"
assessmentFor:
  - "rust.from-zero.reading-input"
  - "rust.from-zero.type-conversion"
  - "rust.from-zero.option-and-result"
  - "rust.from-zero.errors"
quiz:
  passThreshold: 0.75
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        fn main() {
            println!("{} {} {}",
                "42".parse::<i32>().is_ok(),
                " 42".parse::<i32>().is_ok(),
                " 42 ".trim().parse::<i32>().is_ok());
        }
        ```
      options:
        - "false false true"
        - "true false true"
        - "true true true"
        - "true false false"
      answer: 1
      explanation: "parse не пропускает пробелы: строка \" 42\" не число, хотя 42 внутри неё есть. После trim() пробелы убраны, и разбор успешен."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        fn main() {
            let r: Result<i32, _> = "x".parse::<i32>();
            println!("{}", r.unwrap_or(-1));
        }
        ```
      options:
        - "-1"
        - "0"
        - "Паника"
        - "Ошибка компиляции"
      answer: 0
      explanation: "Строка \"x\" не число, поэтому parse возвращает Err. Метод unwrap_or подставляет запасное значение для Err и паники не вызывает."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        fn main() {
            let text = "10\nabc\n20\n";
            let mut sum = 0;
            let mut bad = 0;
            for line in text.lines() {
                match line.parse::<i32>() {
                    Ok(n) => sum += n,
                    Err(_) => bad += 1,
                }
            }
            println!("{sum} {bad}");
        }
        ```
      options:
        - "10 2"
        - "30 0"
        - "Паника на строке abc"
        - "30 1"
      answer: 3
      explanation: "Строки 10 и 20 разобраны и прибавлены к сумме; abc даёт Err и увеличивает счётчик плохих строк. Пока ошибка обрабатывается через match, программа не останавливается."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        fn main() {
            println!("{:?} {:?}", "1e3".parse::<f64>(), "1e3".parse::<i32>().is_err());
        }
        ```
      options:
        - "Err(...) true"
        - "Ok(1.0) true"
        - "Ok(1000.0) true"
        - "Ok(1000.0) false"
      answer: 2
      explanation: "Запись 1e3 - допустимое число с плавающей точкой, равное 1000. Для целого типа символ e недопустим, поэтому разбор в i32 даёт Err, и is_err() истинно."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```rust
        fn main() {
            let n: u8 = "300".parse().unwrap_or(0);
            println!("{n}");
        }
        ```
      options:
        - "Паника при разборе"
        - "0"
        - "44"
        - "255"
      answer: 1
      explanation: "Тип u8 хранит числа от 0 до 255, поэтому \"300\" не помещается. Разбор не заворачивает значение, а возвращает Err, и unwrap_or подставляет 0."
exercise:
  id: "rust.check.errors-input.exercise"
  title: "Строки заказа с проверкой ввода"
  prompt: |-
    Готовая функция `main` читает строки вида `товар количество цена`, считает сумму каждой строки и итог. Допишите две функции разбора над `main` в `main.rs`. Функцию `main` не меняйте.

    1. `parse_positive_int(text: &str) -> Option<i32>` - разбирает **всю** строку как целое число больше нуля. Если строка не число, число разобрано не целиком (`12abc`, `2.5`), не помещается в `i32` или не больше нуля, возвращает `None`.
    2. `parse_positive_f64(text: &str) -> Option<f64>` - то же для числа с плавающей точкой: вся строка должна быть числом, значение больше нуля и конечное (`nan`, `inf` и `1e999` не подходят).

    `main` пропускает и считает строки, в которых не три слова либо любое из чисел не прошло разбор.

    **Пример.** Для ввода

    ```
    tea 2 3.50
    cake 4 0.25
    milk 1 12abc
    bread x 2.0
    jam 1 nan
    ```

    программа печатает

    ```
    tea: 7.00
    cake: 1.00
    total=8.00 bad=3
    ```

    Часть тестов скрыта: в них нулевые и отрицательные числа, слишком большие значения, `nan` и лишние слова.
  entryFile: "main.rs"
  evaluation: "io"
  hints:
    - "Оба разбора начните с parse: text.parse::<i32>() возвращает Result. Превратите его в Option методом .ok() или напишите match с веткой Err(_) => None."
    - "parse разбирает строку целиком: \"12abc\" и \"2.5\" для i32 вернут Err, а число вне диапазона i32 - тоже Err. Дополнительно проверьте, что значение больше нуля."
    - "Для f64 разбор успешен и для \"nan\", \"inf\" и \"1e999\" (последнее даёт бесконечность). Проверяйте value.is_finite() && value > 0.0."
    - "Возвращайте Some(value) только когда все проверки пройдены, иначе None."
  tests:
    - id: "basic"
      title: "Обычные строки, хвост после числа и не число"
      stdin: |
        tea 2 3.50
        cake 4 0.25
        milk 1 12abc
        bread x 2.0
        jam 1 nan
      expected: |
        tea: 7.00
        cake: 1.00
        total=8.00 bad=3
      hint: "12abc разобрана не целиком, x и nan не годятся: три строки считаются плохими. Итог 7.00 + 1.00 = 8.00."
    - id: "non-positive"
      title: "Ноль, отрицательное и неверное число слов"
      stdin: |
        pen 10 0.5
        ink 0 4.0
        cap 3 -1.5
        bag 2
        box 1 2 3
      expected: |
        pen: 5.00
        total=5.00 bad=4
      hint: "Количество 0 и цена -1.5 не больше нуля; в строках bag 2 и box 1 2 3 не три слова. Остаётся только pen: 10 * 0.5 = 5.00."
    - id: "range"
      title: "Слишком большие числа, nan и экспонента (скрытый)"
      stdin: |
        a 99999999999 1
        b 1 1e999
        c 3 nan
        d 5 1e2
        e 1 inf
      expected: |
        d: 500.00
        total=500.00 bad=4
      hidden: true
      hint: "99999999999 не помещается в i32, 1e999 и inf - бесконечность, nan не число в смысле сравнения. Запись 1e2 допустима и равна 100: d даёт 500.00."
    - id: "signs"
      title: "Знак плюс и дробное количество (скрытый)"
      stdin: |
        x +3 2
        y 1.5 3
        z 2 0
      expected: |
        x: 6.00
        total=6.00 bad=2
      hidden: true
      hint: "Запись +3 допустима для parse::<i32>() и равна 3: x даёт 6.00. Количество 1.5 разобрано не целиком, цена 0 не больше нуля."
