id: "csharp.first-steps.how-csharp-runs"
title: "Как выполняется C#: IL, CLR и JIT"
goal: "Понять путь от Program.cs до машинного кода (IL, CLR, JIT) и закрепить на практике чтение всего ввода из Console.In и поведение int при переполнении."
difficulty: "intro"
estimatedMinutes: 30
prerequisites:
  - "csharp.from-zero.classes-basics"
objectives:
  - "Описать два этапа: компиляция в IL и JIT-компиляция средой CLR; назвать ReadyToRun и Native AOT."
  - "Объяснить многоуровневую компиляцию и управляемую память."
  - "Читать stdin и писать в stdout через Console, форматировать числа с InvariantCulture."
  - "Предсказывать поведение int при переполнении, checked и целочисленного деления."
masteryCriteria:
  - "Вы объясняете, чем .dll с IL отличается от нативного исполняемого файла."
  - "Вы выбираете long для сумм и приводите к double до деления."
  - "Вы пишете программу, читающую ввод без пустых токенов и печатающую среднее через F2 с InvariantCulture."
related:
  - "python.fundamentals.how-python-runs"
next:
  - "csharp.first-steps.value-types-and-nullable"
tags:
  - "csharp"
  - "il"
  - "clr"
  - "jit"
  - "stdin"
facts:
  - kind: "internals"
    text: "Компилятор C# переводит исходный код в промежуточный язык IL, который хранится в сборке вместе с метаданными. Среда выполнения CLR компилирует IL в машинный код с помощью JIT-компилятора при выполнении."
    sources:
      - "https://learn.microsoft.com/en-us/dotnet/standard/managed-execution-process"
  - kind: "internals"
    text: "Многоуровневая компиляция (tiered compilation) сначала быстро компилирует метод с минимальной оптимизацией, а часто вызываемые методы затем перекомпилирует с полной оптимизацией. Это ускоряет запуск без потери пиковой производительности."
    sources:
      - "https://learn.microsoft.com/en-us/dotnet/core/runtime-config/compilation"
  - kind: "internals"
    text: "Арифметика над целыми в C# по умолчанию выполняется в непроверяемом контексте: при переполнении старшие биты отбрасываются. Ключевое слово checked включает проверку и приводит к OverflowException."
    sources:
      - "https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/statements/checked-and-unchecked"
  - kind: "misconception"
    text: "«C# - интерпретируемый язык» неверно: код проходит компиляцию в IL и JIT-компиляцию в машинный код. Исключение - сборки Native AOT и ReadyToRun, где машинный код создаётся заранее."
quiz:
  passThreshold: 0.7
  questions:
    - id: "q1"
      type: "single"
      prompt: "Что находится внутри собранного файла Program.dll?"
      options:
        - "Машинный код для конкретного процессора."
        - "IL-код и метаданные о типах."
        - "Исходный текст на C#."
        - "Байткод JVM."
      answer: 1
      explanation: "Сборка содержит IL-код и метаданные. Машинный код для процессора создаёт JIT-компилятор CLR при выполнении (или заранее при ReadyToRun/Native AOT)."
    - id: "q2"
      type: "single"
      prompt: "Чему равно int.MaxValue после x++ в непроверяемом контексте?"
      options:
        - "Остаётся int.MaxValue."
        - "Происходит OverflowException."
        - "Становится int.MinValue."
        - "Становится 0."
      answer: 2
      explanation: "Переполнение целого в C# по умолчанию не бросает исключение: значение \"заворачивается\" до int.MinValue."
    - id: "q3"
      type: "multiple"
      prompt: "Что нужно сделать, чтобы среднее целых чисел вышло дробным и без зависимости от культуры?"
      options:
        - "Разделить два int оператором /."
        - "Привести один из операндов к double."
        - "Использовать CultureInfo.InvariantCulture при форматировании."
        - "Вызвать checked."
      answer:
        - 1
        - 2
      explanation: "Целочисленное деление отбрасывает дробную часть, поэтому один операнд приводят к double; форматируют через ToString(\"F2\", CultureInfo.InvariantCulture)."
    - id: "q4"
      type: "short"
      prompt: "Какой метод класса Console читает весь стандартный ввод до конца? (имя Console.In.… без скобок)"
      answer:
        - "ReadToEnd"
        - "Console.In.ReadToEnd"
        - "ReadToEnd()"
      explanation: "Console.In.ReadToEnd() возвращает всё содержимое stdin одной строкой; на пустом вводе она пуста."
exercise:
  id: "csharp.first-steps.how-csharp-runs.exercise"
  title: "Статистика по числам из stdin"
  prompt: |

    Программа получает на вход число `n` (1 <= n <= 1000), а затем `n` целых чисел, каждое из которых по модулю не больше 2 000 000 000.
    Числа могут быть разбросаны по строкам как угодно и разделены любым количеством пробелов и переводов строк.

    Выведите ровно четыре строки:

    ```
    sum=<сумма>
    min=<наименьшее>
    max=<наибольшее>
    avg=<среднее арифметическое с двумя знаками после точки>
    ```

    **Пример.** Ввод `4` и затем `1 2 3 4` даёт

    ```
    sum=10
    min=1
    max=4
    avg=2.50
    ```

    Среднее печатайте с точкой как десятичным разделителем, независимо от региональных настроек системы.
    Сумма может не поместиться в 32 бита, учитывайте это.
  entryFile: "Program.cs"
  evaluation: "io"
  hints:
    - "Прочитайте весь ввод: Console.In.ReadToEnd(). Разбейте на токены: Split((char[]?)null, StringSplitOptions.RemoveEmptyEntries) делит по любым пробелам и убирает пустые элементы."
    - "Первый токен - n. Следующие n токенов преобразуйте в long: tokens.Skip(1).Take(n).Select(long.Parse).ToArray() (с InvariantCulture)."
    - "Сумма не должна переполняться, поэтому используйте long. Для среднего приведите сумму к double до деления."
    - "Печатайте среднее через avg.ToString(\"F2\", CultureInfo.InvariantCulture), чтобы разделитель всегда был точкой."
  tests:
    - id: "basic"
      title: "Числа в одной строке"
      stdin: "4\n1 2 3 4\n"
      expected: "sum=10\nmin=1\nmax=4\navg=2.50\n"
      hint: "Проверьте формат: четыре строки sum=..., min=..., max=..., avg=...."
    - id: "lines"
      title: "Числа на разных строках"
      stdin: "3\n10\n20\n30\n"
      expected: "sum=60\nmin=10\nmax=30\navg=20.00\n"
      hint: "Числа на разных строках: читайте весь ввод через ReadToEnd и делите по любым пробельным символам."
    - id: "single"
      title: "Одно число"
      stdin: "1\n7\n"
      expected: "sum=7\nmin=7\nmax=7\navg=7.00\n"
      hint: "При n = 1 все три величины равны одному числу, а среднее - 7.00."
    - id: "negatives"
      title: "Отрицательные числа (скрытый)"
      stdin: "5\n-3 -1 -4 -1 -5\n"
      expected: "sum=-14\nmin=-5\nmax=-1\navg=-2.80\n"
      hidden: true
      hint: "Для min и max используйте Min()/Max() по массиву, а не начальное значение 0."
    - id: "whitespace"
      title: "Лишние пробелы и пустые строки (скрытый)"
      stdin: "3\n  5   2\n\n 2\n"
      expected: "sum=9\nmin=2\nmax=5\navg=3.00\n"
      hidden: true
      hint: "Пустые токены вызывают FormatException. Используйте RemoveEmptyEntries."
    - id: "rounding"
      title: "Округление среднего (скрытый)"
      stdin: "3\n1 2 2\n"
      expected: "sum=5\nmin=1\nmax=2\navg=1.67\n"
      hidden: true
      hint: "Среднее 5/3 надо привести к double и напечатать как 1.67 через F2."
    - id: "big-sum"
      title: "Сумма больше 32-битного диапазона (скрытый)"
      stdin: "2\n2000000000 2000000000\n"
      expected: "sum=4000000000\nmin=2000000000\nmax=2000000000\navg=2000000000.00\n"
      hidden: true
      hint: "4000000000 не помещается в int. Храните числа и сумму в long."
