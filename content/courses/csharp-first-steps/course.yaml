id: "csharp-first-steps"
version: "1.0.0"
title: "C#: первые шаги"
description: "Курс рассчитан на тех, кто уже программирует на другом языке: переменные, условия, циклы и функции здесь не объясняются с нуля. Если вы никогда не программировали, начните с «C# с нуля». Вводный курс из двух уроков: как C# компилируется в IL и выполняется средой CLR, затем значимые и ссылочные типы, struct против class и nullable. Остальные темы трека C# запланированы."
languageId: "csharp"
level: 1
track: "csharp"
requires:
  - "csharp-from-zero"
lessons:
  - "01-how-csharp-runs"
  - "02-value-types-and-nullable"
