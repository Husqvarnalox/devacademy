id: python-skill-check
version: 1.0.0
title: Проверка знаний Python
description: >-
  Короткие проверки по компетенциям Python: основы, функции и строки, списки и словари, исключения и файлы, декораторы,
  итераторы и генераторы, классы, аннотации типов. Каждая проверка - небольшое упражнение с запуском тестов и квиз на чтение
  кода. Успешное прохождение засчитывает покрываемые уроки курсов «Основы Python» и «Python: продвинутый уровень»; неудачная
  попытка ничего не меняет и показывает, с какого урока стоит начать повторение. Проверку можно пересдавать сколько угодно раз.
languageId: python
level: 1
track: python
lessons:
  - 01-basics
  - 02-functions
  - 03-collections
  - 04-errors
  - 05-decorators
  - 06-iterators
  - 07-classes
  - 08-typing
