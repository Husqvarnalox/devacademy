id: "python.check.basics"
title: "Проверка: переменные, условия и циклы"
goal: "Читать и писать базовый Python: арифметику, условия, циклы while и for и форматированный вывод."
difficulty: "easy"
estimatedMinutes: 20
prerequisites: []
objectives:
  - "Показать на практике умение: читать и писать базовый Python: арифметику, условия, циклы while и for и форматированный вывод."
masteryCriteria:
  - "Решение упражнения проходит все тесты, включая скрытые."
  - "Квиз пройден с результатом не ниже 75%."
tags:
  - "python"
  - "check"
  - "basics"
assessmentFor:
  - "python.fundamentals.how-python-runs"
  - "python.fundamentals.variables-and-input"
  - "python.fundamentals.numbers-and-operators"
  - "python.fundamentals.text-and-f-strings"
  - "python.fundamentals.reading-errors"
  - "python.fundamentals.conditions"
  - "python.fundamentals.while-loops"
  - "python.fundamentals.loops"
quiz:
  passThreshold: 0.75
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        x = 7
        x //= 2
        x += 10 % 4
        print(x)
        ```
      options:
        - "3"
        - "5"
        - "6"
        - "7"
      answer: 1
      explanation: "Сначала x //= 2 даёт 3 (целочисленное деление), затем 10 % 4 равно 2, и x становится 5."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        total = 0
        for i in range(1, 10, 3):
            total += i
        print(total, i)
        ```
      options:
        - "12 7"
        - "12 10"
        - "22 9"
        - "12 4"
      answer: 0
      explanation: "range(1, 10, 3) даёт 1, 4, 7 (10 не достигается), сумма 12. Переменная цикла после завершения хранит последнее значение, 7."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        n = 0
        while True:
            n += 1
            if n % 2 == 0:
                continue
            if n > 6:
                break
            print(n, end=" ")
        ```
      options:
        - "1 3 5"
        - "1 3 5 7"
        - "2 4 6"
        - "Бесконечный цикл"
      answer: 0
      explanation: "Чётные n пропускаются через continue. Для n = 7 условие n > 6 истинно, цикл прерывается до печати. Печатаются 1, 3 и 5."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        x = "5"
        print(x * 2, int(x) * 2)
        ```
      options:
        - "10 10"
        - "55 10"
        - "55 55"
        - "Ошибка TypeError"
      answer: 1
      explanation: "Умножение строки на число повторяет её: \"5\" * 2 равно \"55\". После int(x) умножение арифметическое: 10."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        print(f"{3 / 2:.1f} {7 // 2} {7 % 2}")
        ```
      options:
        - "1.5 3 1"
        - "1 3 1"
        - "1.5 3.5 1"
        - "1.5 4 1"
      answer: 0
      explanation: "3 / 2 равно 1.5 и форматируется с одним знаком; 7 // 2 равно 3; остаток 7 % 2 равен 1."
exercise:
  id: "python.check.basics.exercise"
  title: "Три функции на циклы и условия"
  prompt: |
    В файле `basics_check.py` реализуйте три функции. Тесты вызывают их напрямую; ничего не читайте и не печатайте.

    1. `collatz_steps(n)` - сколько шагов нужно, чтобы из положительного целого `n` получить 1: если число чётное, делим на 2, иначе умножаем на 3 и прибавляем 1. Для `n = 1` ответ 0; `collatz_steps(6)` равно 8.
    2. `digit_sum(n)` - сумма десятичных цифр неотрицательного целого `n`, без преобразования в строку. `digit_sum(1234)` равно 10.
    3. `is_leap(year)` - `True`, если год високосный: делится на 4, кроме годов, кратных 100, но не кратных 400.
  entryFile: "basics_check.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Заглушка pass возвращает None; каждая функция должна вернуть значение."
    - "collatz_steps: цикл while n != 1 со счётчиком. digit_sum: цикл while n > 0, прибавляйте n % 10, затем n //= 10."
    - "is_leap: одно логическое выражение с and и or: делится на 4 и (не делится на 100 или делится на 400)."
  tests:
    - id: "collatz"
      title: "collatz_steps - обычные значения"
      hint: "Считайте шаги в цикле while, пока число не станет 1; для n = 6 путь 6, 3, 10, 5, 16, 8, 4, 2, 1."
    - id: "digit"
      title: "digit_sum - суммы цифр"
      hint: "Берите последнюю цифру через % 10 и отбрасывайте её через // 10."
    - id: "leap"
      title: "is_leap - границы (скрытый)"
      hidden: true
      hint: "Годы, кратные 100, не високосные, кроме кратных 400; результат должен быть bool."
