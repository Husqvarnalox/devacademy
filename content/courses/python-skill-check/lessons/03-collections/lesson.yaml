id: "python.check.collections"
title: "Проверка: списки, словари и множества"
goal: "Выбирать подходящую коллекцию и обрабатывать списки, словари и множества без изменения исходных данных."
difficulty: "easy"
estimatedMinutes: 20
prerequisites: []
objectives:
  - "Показать на практике умение: выбирать подходящую коллекцию и обрабатывать списки, словари и множества без изменения исходных данных."
masteryCriteria:
  - "Решение упражнения проходит все тесты, включая скрытые."
  - "Квиз пройден с результатом не ниже 75%."
tags:
  - "python"
  - "check"
  - "collections"
assessmentFor:
  - "python.fundamentals.lists"
  - "python.fundamentals.dicts-and-sets"
quiz:
  passThreshold: 0.75
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        a = [3, 1, 2]
        b = sorted(a)
        a.sort(reverse=True)
        print(a, b)
        ```
      options:
        - "[3, 2, 1] [1, 2, 3]"
        - "[1, 2, 3] [1, 2, 3]"
        - "[3, 2, 1] [3, 2, 1]"
        - "None [1, 2, 3]"
      answer: 0
      explanation: "sorted возвращает новый список и не меняет a; a.sort(reverse=True) сортирует a на месте по убыванию."
    - id: "q2"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        d = {"a": 1, "b": 2}
        for k in list(d):
            d[k + k] = d[k]
        print(len(d), sorted(d))
        ```
      options:
        - "2 ['a', 'b']"
        - "4 ['a', 'aa', 'b', 'bb']"
        - "RuntimeError"
        - "3 ['a', 'aa', 'b']"
      answer: 1
      explanation: "Обход идёт по копии списка ключей, поэтому добавлять ключи в словарь безопасно. К двум исходным добавляются 'aa' и 'bb'."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        print({1, 2, 3} - {2} | {5})
        ```
      options:
        - "{1, 3, 5}"
        - "{1, 5}"
        - "{1, 2, 3, 5}"
        - "{3, 5}"
      answer: 0
      explanation: "Оператор - выполняется раньше |. Сначала {1, 2, 3} - {2} даёт {1, 3}, затем объединение с {5}."
    - id: "q4"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        x = [1, 2, 3, 4, 5]
        print(x[1:-1], x[::2], x[-1])
        ```
      options:
        - "[2, 3, 4] [1, 3, 5] 5"
        - "[2, 3, 4, 5] [1, 3, 5] 5"
        - "[1, 2, 3, 4] [1, 3, 5] 1"
        - "[2, 3, 4] [2, 4] 5"
      answer: 0
      explanation: "x[1:-1] отбрасывает первый и последний элементы, x[::2] берёт каждый второй с начала, x[-1] - последний."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```python
        d = {"a": 1}
        print(d.get("b"), d.get("b", 0) + 1, "a" in d)
        ```
      options:
        - "None 1 True"
        - "KeyError"
        - "0 1 True"
        - "None None False"
      answer: 0
      explanation: "get возвращает None, если нет ключа и не задан запасной вариант; с запасным 0 получается 1. Оператор in проверяет наличие ключа."
exercise:
  id: "python.check.collections.exercise"
  title: "Три функции для списков и словарей"
  prompt: |
    В файле `collections_check.py` реализуйте три функции. Тесты вызывают их напрямую; входные данные изменять нельзя.

    1. `word_freq(text)` - вернуть словарь «слово -> сколько раз встретилось». Слова разделены пробельными символами, регистр не учитывается, знаки `.,!?;:` по краям слов отбрасываются, пустые слова не считаются. Порядок ключей - порядок первого появления.
    2. `invert(mapping)` - вернуть словарь «значение -> отсортированный список ключей с этим значением».
    3. `common(a, b)` - вернуть отсортированный список элементов, которые есть в обоих списках, без повторов.
  entryFile: "collections_check.py"
  evaluation: "harness"
  harness: "exercise/harness"
  harnessEntry: "check.py"
  hints:
    - "Заглушка pass возвращает None; каждая функция должна вернуть значение и не менять входные данные."
    - "word_freq: цикл по text.split(), strip с набором знаков, lower, счётчик через get. invert: setdefault(value, []).append(key), затем сортировка списков."
    - "common: sorted(set(a) & set(b)). Не вызывайте a.sort(): это изменит исходный список."
  tests:
    - id: "freq-basic"
      title: "word_freq - подсчёт слов"
      hint: "Приведите слово к нижнему регистру, уберите знаки по краям методом strip и увеличьте счётчик словаря."
    - id: "invert-basic"
      title: "invert - группировка ключей"
      hint: "Для каждого значения собирайте список ключей и отсортируйте его."
    - id: "common-basic"
      title: "common - пересечение"
      hint: "Пересечение множеств даёт общие элементы без повторов; sorted делает порядок предсказуемым."
    - id: "freq-edges"
      title: "word_freq - пустой ввод, пунктуация, кириллица (скрытый)"
      hidden: true
      hint: "Слова, состоящие только из знаков, не считаются; регистр не учитывается и для кириллицы."
    - id: "invert-edges"
      title: "invert - порядок ключей и неизменность (скрытый)"
      hidden: true
      hint: "Ключи в списках сортируются; исходный словарь не меняется."
    - id: "common-edges"
      title: "common - пустые списки и строки (скрытый)"
      hidden: true
      hint: "Пустые данные дают []; исходные списки не изменяются."
