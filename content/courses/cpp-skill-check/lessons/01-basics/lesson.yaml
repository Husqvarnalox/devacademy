  - "check"
  - "basics"
assessmentFor:
  - "cpp.from-zero.first-program"
  - "cpp.from-zero.compiler-errors"
  - "cpp.from-zero.output"
  - "cpp.from-zero.variables"
  - "cpp.from-zero.basic-types"
