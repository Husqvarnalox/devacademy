id: "cpp.check.basics"
title: "Проверка: основы - значения, ввод, условия, циклы"
goal: "Писать программы с числами, вводом, условиями и циклами и предсказывать их результат."
difficulty: "medium"
estimatedMinutes: 15
prerequisites: []
objectives:
  - "Показать на практике умение: читать числа до конца ввода, накапливать сумму в long long, искать максимум и считать среднее с двумя знаками."
masteryCriteria:
  - "Решение упражнения проходит все тесты, включая скрытые."
  - "Квиз пройден с результатом не ниже 75%."
tags:
