id: "cpp.check.stl"
title: "Проверка: контейнеры STL и алгоритмы"
goal: "Работать с vector, map и стандартными алгоритмами и не допускать недействительных итераторов и висячих string_view."
difficulty: "medium"
estimatedMinutes: 15
prerequisites: []
objectives:
  - "Показать на практике умение: удалять элементы идиомой erase-remove, сортировать с лямбдой, считать с map и accumulate."
masteryCriteria:
  - "Решение упражнения проходит все тесты, включая скрытые."
  - "Квиз пройден с результатом не ниже 75%."
tags:
  - "cpp"
  - "check"
  - "stl"
assessmentFor:
  - "cpp.fundamentals.stl-containers-algorithms"
quiz:
  passThreshold: 0.75
  questions:
    - id: "q1"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```cpp
        int main() {
            std::vector<int> v{1, 2, 3, 2};
            auto it = std::remove(v.begin(), v.end(), 2);
            std::cout << v.size() << " " << (it - v.begin());
        }
        ```
      options:
        - "2 2"
        - "4 2"
        - "4 4"
        - "2 4"
      answer: 1
      explanation: "std::remove не меняет размер контейнера: он сдвигает нужные элементы в начало (1, 3) и возвращает итератор на новый логический конец, то есть begin + 2. Размер остаётся равным 4 до вызова v.erase(it, v.end())."
    - id: "q2"
      type: "single"
      prompt: |-
        Какой из вариантов корректно удаляет все чётные числа из std::vector<int> v?

        ```cpp
        // Вариант A
        for (auto it = v.begin(); it != v.end(); ++it) {
            if (*it % 2 == 0) {
                v.erase(it);
            }
        }

        // Вариант B
        for (auto it = v.begin(); it != v.end();) {
            if (*it % 2 == 0) {
                it = v.erase(it);
            } else {
                ++it;
            }
        }

        // Вариант C
        for (int x : v) {
            if (x % 2 == 0) {
                v.erase(std::find(v.begin(), v.end(), x));
            }
        }
        ```
      options:
        - "Только A"
        - "Только C"
        - "A и B"
        - "Только B"
      answer: 3
      explanation: "В варианте A после erase(it) итератор it недействителен, и ++it - неопределённое поведение. В C элементы удаляются внутри range-based for по тому же вектору: итераторы цикла инвалидируются. Вариант B использует возвращаемое значение erase - итератор на следующий элемент - и корректен."
    - id: "q3"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```cpp
        int main() {
            std::map<std::string, int> m;
            m["a"] = 5;
            int x = m["b"];
            std::cout << m.size() << " " << x << " " << m.count("c") << " " << m.size();
        }
        ```
      options:
        - "2 0 0 2"
        - "1 0 0 1"
        - "2 0 0 3"
        - "Бросится std::out_of_range"
      answer: 0
      explanation: "Оператор [] у std::map добавляет отсутствующий ключ со значением по умолчанию: после m[\"b\"] в карте два элемента, а x равен 0. Метод count записей не создаёт и возвращает 0, размер остаётся 2."
    - id: "q4"
      type: "single"
      prompt: |-
        На какой строке создаётся висячий std::string_view (строка, на которую он указывает, уничтожена к моменту дальнейшего использования)?

        ```cpp
        std::string s = "hello";
        std::string_view a = s;                              // строка 1
        std::string_view b = "literal";                      // строка 2
        std::string_view c = std::string("temp");            // строка 3
        std::string_view d = std::string_view(s).substr(1);  // строка 4
        // ... далее используются все четыре переменные
        ```
      options:
        - "Строка 1"
        - "Строка 2"
        - "Строка 3"
        - "Строка 4"
      answer: 2
      explanation: "В строке 3 string_view создаётся из временной std::string, которая уничтожается в конце выражения. Литерал (строка 2) живёт всё время работы программы, а строки 1 и 4 указывают на s, которая остаётся живой."
    - id: "q5"
      type: "single"
      prompt: |-
        Что выведет программа?

        ```cpp
        int main() {
            std::vector<int> v{3, 1, 2};
            std::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });
            auto n = std::count_if(v.begin(), v.end(), [](int x) { return x >= 2; });
            long long s = std::accumulate(v.begin(), v.end(), 10LL);
            std::cout << v[0] << n << s;
        }
        ```
      options:
        - "3316"
        - "3216"
        - "1216"
        - "3210"
      answer: 1
      explanation: "Компаратор a > b сортирует по убыванию: 3 2 1, поэтому v[0] равно 3. Элементов не меньше 2 ровно два (3 и 2). Сумма вычисляется от начального значения 10LL: 10 + 6 = 16. Печатается 3, 2 и 16 подряд: 3216."
exercise:
  id: "cpp.check.stl.exercise"
  title: "Очистка, сортировка, подсчёт"
  prompt: |
    В заготовке есть готовый `main`: он читает команды и вызывает ваши функции. Допишите тела пяти функций. Основную часть (после комментария «Дальше основная часть») менять не нужно.

    1. `void removeNegatives(std::vector<int>& v)` - удаляет из вектора все отрицательные числа, остальные сохраняют порядок.
    2. `void sortWords(std::vector<std::string>& words)` - сортирует слова по длине, а слова одинаковой длины - по алфавиту. Используйте `std::sort` с лямбдой.
    3. `std::map<std::string, int> countWords(const std::vector<std::string>& words)` - сколько раз встретилось каждое слово.
    4. `long long total(const std::vector<int>& v)` - сумма элементов. Она может не помещаться в `int`.
    5. `int countAbove(const std::vector<int>& v, int limit)` - сколько элементов строго больше `limit`.

    Команды: `clean` и `sort` печатают размер, двоеточие и элементы; `count` печатает пары `слово=число` по алфавиту; `stats limit числа...` печатает сумму и число элементов больше `limit`.

    **Пример.** Для ввода

    ```
    clean 3 -1 4 -1 5
    sort pear fig apple kiwi
    count b a b
    stats 10 5 20 15 30
    ```

    программа печатает

    ```
    3: 3 4 5
    4: fig kiwi pear apple
    a=1 b=2
    total=70 above=3
    ```

    Часть тестов скрыта: в них нет подходящих элементов, повторы слов и сумма за пределами `int`.
  entryFile: "main.cpp"
  evaluation: "io"
  hints:
    - "removeNegatives: v.erase(std::remove_if(v.begin(), v.end(), [](int x) { return x < 0; }), v.end()); (в C++20 есть и короткая форма std::erase_if(v, ...))."
    - "sortWords: лямбда-компаратор принимает две const std::string&; если длины различаются, верните a.size() < b.size(), иначе a < b."
    - "countWords: заведите std::map<std::string, int> counts; и в цикле выполните ++counts[w]; - отсутствующий ключ создаётся со значением 0."
    - "total: return std::accumulate(v.begin(), v.end(), 0LL); - начальное значение 0LL задаёт тип long long. countAbove: std::count_if с лямбдой [limit](int x) { return x > limit; }."
  tests:
    - id: "basic"
      title: "Четыре команды"
      stdin: "clean 3 -1 4 -1 5\nsort pear fig apple kiwi\ncount b a b\nstats 10 5 20 15 30\n"
      expected: |
        3: 3 4 5
        4: fig kiwi pear apple
        a=1 b=2
        total=70 above=3
      hint: "Отрицательные числа удаляются, остальные сохраняют порядок; сортировка идёт сначала по длине (fig - 3, kiwi и pear - 4, apple - 5), затем по алфавиту."
    - id: "sort-count"
      title: "Слова одной длины и повторы"
      stdin: "sort dog cat ant bee\ncount x y x x y z\n"
      expected: |
        4: ant bee cat dog
        x=3 y=2 z=1
      hint: "Слова длины 3 упорядочиваются по алфавиту; в карте ключи идут по алфавиту, значения - количество вхождений."
    - id: "nothing-to-remove"
      title: "Нечего удалять или всё удаляется (скрытый)"
      stdin: "clean 1 2 3\nclean -5 -6\nclean 0 -1 0\nstats 5 1 2 3\n"
      expected: |
        3: 1 2 3
        0:
        2: 0 0
        total=6 above=0
      hidden: true
      hint: "Ноль не отрицательное число и остаётся. Если удаляются все элементы, размер равен 0. Строго больше 5 нет ни одного числа."
    - id: "big-sum"
      title: "Сумма за пределами int (скрытый)"
      stdin: "stats 0 2000000000 2000000000 2000000000\nstats -5 -3 -7 -5\nsort bb a aa b ab\n"
      expected: |
        total=6000000000 above=3
        total=-15 above=1
        5: a b aa ab bb
      hidden: true
      hint: "Сумма трёх чисел по 2000000000 равна 6000000000 и не помещается в int: начальное значение accumulate должно быть типа long long. Условие «строго больше»: -5 не больше -5."
