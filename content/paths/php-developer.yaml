id: php-developer
title: PHP-разработчик
description: "Путь к уверенному владению современным PHP 8. Сначала «PHP: первые шаги» (запуск, синтаксис, массивы, строгая типизация), затем «PHP: язык и экосистема»: жизненный цикл и значения, типы, массивы и функции высшего порядка, классы и перечисления, интерфейсы и трейты, исключения и match, пространства имён и генераторы, строки и ввод-вывод. Фреймворки (Laravel, Symfony), Composer и базы данных пока не входят."
goal: backend
targets: [php-fundamentals]
stages:
  - title: Первые шаги
    courses: [php-first-steps]
  - title: Язык PHP 8
    courses: [php-fundamentals]
