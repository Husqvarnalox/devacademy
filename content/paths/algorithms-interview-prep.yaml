id: algorithms-interview-prep
title: Алгоритмы для собеседований
description: "Путь по курсу «Основы алгоритмов»: оценка сложности, двоичный поиск, сортировка и подсчёт инверсий, два указателя, префиксные суммы с хешированием и поиск в ширину на сетке. Упражнения можно решать на Python, JavaScript, Go, Java, C++ или Rust. Это базовый набор приёмов, а не полный курс по структурам данных."
goal: general
targets: [algorithms-foundations]
