id: cpp-developer
title: C++-разработчик
description: "Путь к уверенному владению современным C++. Сначала «C++: первые шаги» (запуск, значения и ссылки, RAII), затем «C++: язык и стандартная библиотека»: модель компиляции и время жизни, указатели и перемещение, умные указатели, классы и виртуальные вызовы, шаблоны и концепты, контейнеры и алгоритмы STL, обработка ошибок, неопределённое поведение и санитайзеры. CMake, корутины и многопоточность в деталях пока не входят."
goal: general
targets: [cpp-fundamentals]
stages:
  - title: Первые шаги
    courses: [cpp-first-steps]
  - title: Язык и стандартная библиотека
    courses: [cpp-fundamentals]
