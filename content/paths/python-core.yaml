id: python-core
title: "Python: ядро языка"
description: >-
  Путь для тех, кто уже знает основы Python и хочет понимать язык глубже. Сначала курс «Основы Python», затем «Python: продвинутый уровень» - функции как объекты, декораторы, генераторы, контекстные менеджеры, классы, dataclasses, протоколы и аннотации типов.
goal: general
targets: [python-advanced]
