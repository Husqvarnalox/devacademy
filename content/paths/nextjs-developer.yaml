id: nextjs-developer
title: Next.js-разработчик (начальный уровень)
description: "Путь к основам Next.js 16 (App Router). «JavaScript: основы языка» и «React: основы», затем «TypeScript: первые шаги» и «Next.js: основы App Router»: файловая маршрутизация и макеты, серверные и клиентские компоненты, обработчики маршрутов, серверные действия и формы, кэширование и повторная проверка данных, proxy. Сервер разработки, сборка, развёртывание, базы данных и аутентификация через библиотеки в упражнениях не участвуют. Для проверок упражнений нужны npm-пакеты курсов (Настройки - Среды выполнения)."
goal: fullstack
targets: [nextjs-fundamentals]
stages:
  - title: Первые шаги
    courses: [javascript-first-steps]
  - title: Основы языка
    courses: [javascript-fundamentals]
  - title: React
    courses: [react-fundamentals]
  - title: TypeScript
    courses: [typescript-first-steps]
  - title: Next.js
    courses: [nextjs-fundamentals]
