id: rust-developer
title: Rust-разработчик
description: "Путь к надёжному коду на Rust. Сначала «Rust: первые шаги» (запуск, владение и заимствование), затем «Rust: владение, типы и надёжный код»: перемещения и Drop, заимствования и времена жизни, структуры, перечисления и сопоставление с образцом, обработка ошибок, трейты и обобщения, коллекции и итераторы, умные указатели и потоки. Асинхронность, unsafe и макросы пока не входят."
goal: backend
targets: [rust-fundamentals]
stages:
  - title: Первые шаги
    courses: [rust-first-steps]
  - title: Владение, типы и надёжный код
    courses: [rust-fundamentals]
