id: python-ml-engineer
title: Python для инженера машинного обучения
description: "Путь к классическому ML на Python. Сначала «Основы Python» и «Продвинутый Python», затем «NumPy: массивы и векторизация», «Основы машинного обучения» на чистом Python и «Классическое ML с нуля на NumPy»: векторизованная линейная регрессия, логистическая регрессия, k-means и PCA. Этап с библиотекой scikit-learn пока запланирован. Остальные темы трека (деревья, ансамбли, нейросети) тоже запланированы."
goal: ml
targets: [ml-classical-numpy]
stages:
  - title: Python core
    courses: [python-fundamentals, python-advanced]
  - title: NumPy
    courses: [python-numpy]
  - title: Основы машинного обучения
    courses: [ml-foundations]
  - title: Классическое ML на NumPy
    courses: [ml-classical-numpy]
