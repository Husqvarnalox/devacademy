id: node-backend-frameworks
title: "Node.js: серверные фреймворки Express, Fastify и NestJS"
subjects:
  - id: express
    title: Express
    kind: framework
    version: "5.1"
    docs: [https://expressjs.com/]
  - id: fastify
    title: Fastify
    kind: framework
    version: "5"
    docs: [https://fastify.dev/docs/latest/]
  - id: nestjs
    title: NestJS
    kind: framework
    version: "11"
    docs: [https://docs.nestjs.com/]
criteria:
  - id: philosophy
    title: Подход и назначение
    description: Насколько фреймворк минимален и что он навязывает.
  - id: validation
    title: Валидация и схемы
    description: Как описываются и проверяются входные данные.
  - id: structure
    title: Структура приложения
    description: Как организуются маршруты, зависимости и модули.
  - id: typescript
    title: TypeScript
    description: Роль типов в фреймворке.
  - id: async
    title: Асинхронные обработчики
    description: Как обрабатываются промисы и ошибки.
cells:
  philosophy:
    express: |
      Минималистичный веб-фреймворк: маршрутизация и цепочка middleware. Всё остальное подключается отдельными пакетами.
    fastify: |
      Лёгкий фреймворк с системой плагинов, хуков и встроенным логированием на основе Pino; в документации делается упор на низкие накладные расходы.
    nestjs: |
      Полноценный каркас для серверных приложений: модули, контроллеры, провайдеры и внедрение зависимостей. HTTP-часть делегируется адаптеру, по умолчанию это Express, можно выбрать Fastify.
  validation:
    express: |
      Встроенной схемы валидации нет: проверки пишут вручную или подключают сторонние библиотеки.
    fastify: |
      Валидация и сериализация описываются схемами JSON Schema прямо в определении маршрута.
    nestjs: |
      Валидация подключается через механизм pipes; обычно используют пакеты `class-validator` и `class-transformer` вместе с DTO-классами.
  structure:
    express: |
      Структуру приложения выбирает автор: фреймворк не предписывает, как раскладывать код по каталогам.
    fastify: |
      Приложение собирается из плагинов с инкапсуляцией контекста: каждый плагин получает свою область видимости декораторов и хуков.
    nestjs: |
      Структура задана архитектурой модулей, контроллеров и провайдеров; зависимости внедряются через контейнер.
  typescript:
    express: |
      Работает с TypeScript через типы из сообщества и пакет `@types/express`; фреймворк написан на JavaScript.
    fastify: |
      Содержит собственные определения типов и поддерживает TypeScript.
    nestjs: |
      Написан на TypeScript и рассчитан на него; активно использует декораторы и метаданные типов.
  async:
    express: |
      В Express 5 отклонённый промис, возвращённый обработчиком, передаётся в обработку ошибок автоматически; в версии 4 это нужно было делать вручную.
    fastify: |
      Обработчики могут быть `async`-функциями; возвращаемое значение отправляется как ответ, а отклонённый промис обрабатывается фреймворком.
    nestjs: |
      Методы контроллеров могут быть `async` или возвращать промис; ошибки обрабатываются через фильтры исключений.
verdictGuidance: |
  Сравнение не называет универсального победителя: выбор зависит от задачи, размера команды и привычек.

  * **Express** разумно рассматривать для небольших сервисов и обучения, когда нужен минимальный каркас и большое количество готовых примеров.
  * **Fastify** разумно рассматривать, когда хочется схем JSON Schema для валидации и сериализации и системы плагинов с чёткой инкапсуляцией.
  * **NestJS** разумно рассматривать для крупных приложений и команд, которым нужна общая архитектура, внедрение зависимостей и TypeScript по умолчанию.

  Сравнивая производительность, используйте собственные замеры на вашей нагрузке: результаты зависят от задачи и окружения.
sources:
  - https://expressjs.com/en/guide/migrating-5.html
  - https://fastify.dev/docs/latest/Reference/Validation-and-Serialization/
  - https://fastify.dev/docs/latest/Reference/Plugins/
  - https://docs.nestjs.com/techniques/validation
  - https://docs.nestjs.com/faq/http-adapter
