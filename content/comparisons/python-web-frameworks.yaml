id: python-web-frameworks
title: "Python: веб-фреймворки Django, FastAPI и Flask"
subjects:
  - id: django
    title: Django
    kind: framework
    version: "5.2 LTS"
    docs: [https://docs.djangoproject.com/en/5.2/]
  - id: fastapi
    title: FastAPI
    kind: framework
    version: "0.115"
    docs: [https://fastapi.tiangolo.com/]
  - id: flask
    title: Flask
    kind: framework
    version: "3.1"
    docs: [https://flask.palletsprojects.com/]
criteria:
  - id: scope
    title: Что входит в состав
    description: Какую часть типового веб-приложения фреймворк закрывает сам.
  - id: interface
    title: Модель запуска и асинхронность
    description: Стандарт интерфейса сервера и поддержка async.
  - id: validation
    title: Валидация данных и документация API
    description: Как описываются входные данные и откуда берётся описание API.
  - id: database
    title: Работа с базой данных
    description: Есть ли встроенный ORM и миграции.
  - id: start
    title: Порог входа и структура проекта
    description: Сколько решений приходится принимать самому в начале.
cells:
  scope:
    django: |
      «Батарейки в комплекте»: ORM, миграции, система аутентификации, формы, шаблоны, сессии и административный интерфейс входят в сам фреймворк.
    fastapi: |
      Сфокусирован на API. Построен на Starlette (веб-часть) и Pydantic (данные). Шаблоны, ORM и аутентификацию как цельную систему не включает: их подключают отдельными библиотеками.
    flask: |
      Микрофреймворк: ядро на Werkzeug (маршрутизация, запросы) и Jinja (шаблоны). Всё остальное добавляется расширениями.
  interface:
    django: |
      Работает и по WSGI, и по ASGI. Поддерживает асинхронные представления; часть внутренних операций (например, в ORM) при этом выполняется в потоках. Подробности в разделе про async документации.
    fastapi: |
      ASGI-приложение, запускается на ASGI-сервере (например, Uvicorn). Обработчики можно писать как `def` и как `async def`.
    flask: |
      Классически WSGI. Асинхронные представления поддерживаются, для этого требуется дополнительная установка (`flask[async]`); приложение при этом остаётся WSGI.
  validation:
    django: |
      Валидация входных данных выполняется через формы и модели. Для REST API чаще всего подключают сторонний пакет (например, Django REST framework), он не входит в Django.
    fastapi: |
      Входные данные описываются аннотациями типов и моделями Pydantic и проверяются автоматически. По ним же генерируется схема OpenAPI и интерактивная документация (Swagger UI, ReDoc).
    flask: |
      Встроенной схемы валидации нет: проверки пишут вручную или подключают расширения и библиотеки. Описание OpenAPI тоже достигается сторонними средствами.
  database:
    django: |
      Встроенный ORM и система миграций, тесно связанные с административным интерфейсом.
    fastapi: |
      ORM не входит в состав. Обычно используют SQLAlchemy или другие библиотеки; выбор остаётся за вами.
    flask: |
      ORM не входит в состав. Часто используют SQLAlchemy, в том числе через расширение Flask-SQLAlchemy.
  start:
    django: |
      Есть готовая структура проекта и приложений и устоявшиеся соглашения; больше концепций на старте, но меньше решений о составе стека.
    fastapi: |
      Небольшой «Hello World» умещается в несколько строк; структура проекта и выбор библиотек для БД и аутентификации остаются за автором.
    flask: |
      Минимальный пример умещается в несколько строк, структуру проекта и набор расширений выбирает автор.
verdictGuidance: |
  Сравнение не называет универсального победителя: выбор зависит от задачи и команды.

  * **Django** разумно рассматривать, когда нужен полноценный сайт с базой данных, пользователями и административной панелью, и вы хотите готовые решения «из коробки».
  * **FastAPI** разумно рассматривать, когда главная задача — API с проверкой данных по аннотациям типов и автоматической документацией, а также когда удобно писать асинхронные обработчики.
  * **Flask** разумно рассматривать для небольших сервисов и обучения, когда нужен простой и прозрачный каркас и вы готовы сами выбирать остальные компоненты.

  Перед выбором проверьте текущие версии и требования в документации: возможности и рекомендации меняются от релиза к релизу.
sources:
  - https://docs.djangoproject.com/en/5.2/
  - https://docs.djangoproject.com/en/5.2/topics/async/
  - https://fastapi.tiangolo.com/features/
  - https://flask.palletsprojects.com/en/stable/async-await/
  - https://flask.palletsprojects.com/en/stable/foreword/
